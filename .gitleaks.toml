# gitleaks 配置：默认规则全部保留，只放行已核实的误报。
[extend]
useDefault = true

# 用语确认页（docs/glossary/confirm-page）的条目数据里有 "key":"R2-P-actual-hours" 这类键，
# 是页面存储的文档 id（组别前缀 + 词条 id），不是凭据，会被 generic-api-key 误报。
# 放行范围：只限 generic-api-key、只限确认页的两个 HTML 文件、只限 "key":"<组别>-<词条 id>" 形状的匹配（三者同时满足）。
[[allowlists]]
description = "用语确认页条目键（R2-P-…、A-…、B-…、C-… 等），非凭据"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/(modernization/)?glossary/confirm-page/(index|template)\.html$''']  # #755 moved it; history keeps the old path
regexTarget = "match"
regexes = ['''key":"(R2-)?[ABCNP]-[a-z0-9_\-]+"''']

# 凭据名赋值右侧是 14～32 位字面量（引号可有可无，行尾可带 # 注释；(?m) 让 $ 认行尾）：默认规则不覆盖这类写法（定稿 6.1 第 6 条，O17）。
[[rules]]
id = "credential-assignment-literal"
description = "凭据名赋值右侧是 14～32 位字面量"
regex = '''(?im)(?:^|[^a-z0-9])(?:[a-z0-9]+[_.-]|[a-z0-9]*?)(?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|credential)s?["']?[ \t]*(?:=|:|=>)[ \t]*["']?([^"'\s$<>{}()#,;]{14,32})(?:["']|[ \t]*(?:#.*)?$)'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "secret", "token", "key", "credential"]

# 只对上面一条：命名预览数据里 "token" 是用语词元的键，值是词元，不是凭据。
[[allowlists]]
description = "命名预览的词元键，非凭据"
targetRules = ["credential-assignment-literal"]
condition = "AND"
paths = ['''^docs/(modernization/)?glossary/arch-naming/naming-preview\.json$''']  # #755 moved it; history keeps the old path
regexTarget = "match"
regexes = ['''^"token"''']
