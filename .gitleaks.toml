# gitleaks 配置：默认规则全部保留，只放行已核实的误报。
[extend]
useDefault = true

# 用语确认页（docs/modernization/glossary/confirm-page）的条目数据里有 "key":"R2-P-actual-hours" 这类键，
# 是页面存储的文档 id（组别前缀 + 词条 id），不是凭据，会被 generic-api-key 误报。
# 放行范围：只限 generic-api-key、只限确认页的两个 HTML 文件、只限 "key":"<组别>-<词条 id>" 形状的匹配（三者同时满足）。
[[allowlists]]
description = "用语确认页条目键（R2-P-…、A-…、B-…、C-… 等），非凭据"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/modernization/glossary/confirm-page/(index|template)\.html$''']
regexTarget = "match"
regexes = ['''key":"(R2-)?[ABCNP]-[a-z0-9_\-]+"''']
