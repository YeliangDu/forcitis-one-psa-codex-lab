# Test-only defaults (loaded because no profile is active in tests). Production keeps schema-update off (ADR-0007, architecture §3.4).
flowable.database-schema-update=true
# Shut down quickly after Testcontainers stops the database (otherwise the engine waits 30 s for a connection).
spring.datasource.hikari.connection-timeout=2000
# The event publication jobs run only in the tests that exercise them.
forcitis.platform.integration.event-publication.jobs-enabled=false
# The test database starts empty; production schemas are created by the DBA (INFRA_RUNBOOK section 2).
spring.flyway.create-schemas=true
forcitis.cost.timesheet.consumed-events.enabled=false
forcitis.platform.approval.process-archive.enabled=false
