# Operations commands of organization.workforce (WorkforceOperationsCommands): one command, then the process ends. No scheduled work, and the web
# part only because the controllers, the security chain and the session repository are beans of the web application: the server is
# created but listens on no port (server.port=-1).
# Run (the environment profile dev or prod comes from the environment, workforce-operations is added to it): java -jar forcitis-one.jar --spring.profiles.include=workforce-operations --operation=... --operator=<employee id> --witness=<employee id>
spring.main.web-application-type=servlet
server.port=-1
spring.main.banner-mode=off
flowable.async-executor-activate=false
forcitis.platform.scheduling.jobs-enabled=false
forcitis.platform.integration.event-publication.jobs-enabled=false
# A one-shot command writes nothing it was not asked to: the audit partitions are pre-created by the running application, not here.
forcitis.platform.audit.partitions.enabled=false
