spring.application.name=forcitis-one
# Flowable lives in the approval schema (ADR-0001 revision); business modules never join ACT_* tables.
# Production never changes the engine tables on its own (REIMAGINED_ARCHITECTURE §3.4): the engine installation / upgrade
# runbook starts the application once with FLOWABLE_SCHEMA_UPDATE=true. Tests set true.
flowable.database-schema-update=${FLOWABLE_SCHEMA_UPDATE:false}
flowable.database-schema=platform_approval
# Jobs (timers/reminders) run via the async executor in production; tests switch it off
flowable.async-executor-activate=${FLOWABLE_ASYNC_EXECUTOR:true}
spring.modulith.detection-strategy=com.forcitis.one.SubdomainModuleDetection
# One Flyway history, one folder per module (schema = <subdomain>_<bc>). The history table lives in one_migration; the schemas are created
# by the DBA (INFRA_RUNBOOK section 2) and the migrations still start with CREATE SCHEMA IF NOT EXISTS, which PostgreSQL authorises
# against CREATE on the database before it checks existence, so the migration role needs that privilege on the first run.
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=one_migration
spring.flyway.schemas=one_migration,organization_administration,organization_attendance,organization_workforce,platform_approval,platform_audit,platform_file,platform_identity,platform_integration,platform_numbering,platform_scheduling,cost_timesheet
spring.flyway.create-schemas=false
# Own configuration keys: forcitis.{subdomain}.{bc}.{kebab-case} of the module that reads them (G46)
forcitis.platform.numbering.capacity-check.cron=0 0 6 * * *
forcitis.platform.numbering.capacity-check.warning-ratio=0.9
# Per-module configuration files (Phase 1a): each module owns config/<schema>.properties; keys stay forcitis.{subdomain}.{bc}.* (G46)
spring.config.import=optional:classpath:config/platform_identity.properties,optional:classpath:config/organization_workforce.properties,optional:classpath:config/platform_approval.properties,optional:classpath:config/platform_integration.properties,optional:classpath:config/platform_audit.properties,optional:classpath:config/platform_numbering.properties,optional:classpath:config/cost_timesheet.properties,optional:classpath:config/platform_web.properties
# Business days are cut in this zone; instants are stored in UTC (REIMAGINED_ARCHITECTURE section 2).
forcitis.kernel.business-zone=Asia/Shanghai
# One JSON line per log event in ECS format; the logging context carries correlationId and userId.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=forcitis-one
# Scheduled jobs run on this instance (ShedLock keeps them single across instances); tests switch it off.
forcitis.platform.scheduling.jobs-enabled=${FORCITIS_JOBS_ENABLED}
# Nothing listens to the Moments events, and its auto-configuration would switch scheduling on whatever the key above says.
spring.autoconfigure.exclude=org.springframework.modulith.moments.autoconfigure.MomentsAutoConfiguration
# Time zones are never left to the machine. The JVM must run in UTC (checked at start by kernel UtcJvm); instants go out as ISO-8601 with an
# offset; every database session is set to UTC; business days are cut in forcitis.kernel.business-zone above.
spring.jackson.time-zone=UTC
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.datatype.datetime.write-durations-as-timestamps=false
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# PostgreSQL error detail carries the conflicting row values; the driver must not put it into exception messages, whatever the URL says.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
