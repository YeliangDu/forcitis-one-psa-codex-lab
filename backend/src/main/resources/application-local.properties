# Profile local (card #1478): the whole system on a developer's own machine, in containers started by tools/ops/local/ (README there).
# LocalProfileListener refuses to start this profile next to dev or prod, or with a database that is not on this machine. The local test login
# (LoginAsLocalTestUser) exists only here. Nothing in dev or prod can switch it on: it is a bean of this profile, not a setting.
# The database account, its password and the application's port come from the environment that tools/ops/local/local.sh sets up; no value is kept in this file.
spring.datasource.url=jdbc:postgresql://localhost:${LOCAL_DB_PORT:55432}/forcitis_local?logServerErrorDetail=false
spring.datasource.username=${LOCAL_DB_USER:forcitis_local}
spring.datasource.password=${LOCAL_DB_PASSWORD}
# Migrations run in their own step (SPRING_PROFILES_ACTIVE=migrate,local), like in the release pipeline; the schemas do not exist on a clean database.
spring.flyway.enabled=false
spring.flyway.create-schemas=true
# First start of the process engine on an empty database creates its tables; later starts leave them alone.
flowable.database-schema-update=true
# No scheduled job and no outbound integration on a laptop.
forcitis.platform.scheduling.jobs-enabled=false
forcitis.platform.identity.emergency.check.enabled=false
flowable.async-executor-activate=false
# The browser talks plain http to localhost.
forcitis.platform.identity.session.secure-cookie=false
# Nothing on a laptop reaches the WORM archive store or purges outbound records; the features that need them stay off.
forcitis.platform.integration.archive-store.enabled=false
forcitis.platform.integration.outbound-purge.enabled=false
forcitis.platform.audit.archive.enabled=false
forcitis.platform.approval.process-archive.enabled=false
forcitis.cost.timesheet.consumed-events.enabled=false
# One person tries every role in turn on one machine: a single approver is not a second pair of eyes here.
forcitis.platform.approval.process-administrator-required=false
# The clock starts at this moment (ISO-8601 instant, e.g. 2026-03-10T09:00:00Z) and runs on; empty: real time. POST /api/v1/platform/local-clocks:set sets it later.
forcitis.kernel.local-clock-start=${LOCAL_CLOCK_START:}

# Only this machine reaches the application: the test login and the clock endpoint have no credential.
server.address=127.0.0.1
