# Read-only verification command (ReadOnlyVerificationCommand, PAR-2, C-14): checks one read-only connection and ends the process while the
# environment is prepared, before any application context exists. Defence in depth should that ever change: no web server, no migration, no job.
# The command itself also puts spring.main.web-application-type=none first, above environment variables such as SPRING_MAIN_WEB_APPLICATION_TYPE.
# Run: java -jar forcitis-one.jar --spring.profiles.active=read-only-verification --connection=<integration-seeyon-background|integration-legacy|probe>
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.flyway.enabled=false
flowable.async-executor-activate=false
forcitis.platform.scheduling.jobs-enabled=false
forcitis.platform.integration.event-publication.jobs-enabled=false
