# Production: the running service never migrates; the release pipeline runs the migrations first with the profile "migrate" and the migration
# account (INFRA_RUNBOOK section 7). SPRING_FLYWAY_ENABLED=false in the environment says the same and is kept as a second line of defence.
spring.flyway.enabled=false

# Metrics scraping is bound to the internal management port (MANAGEMENT_SERVER_ADDRESS); the shared setting exposes health only
management.endpoints.web.exposure.include=health,prometheus
