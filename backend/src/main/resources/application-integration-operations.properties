# Read-only operations command of platform.integration (IntegrationOperationsCommands): one lookup, then the process ends. Nothing is
# written; no scheduled work, no external system is called, and the web part listens on no port.
# Run: java -jar forcitis-one.jar --spring.profiles.active=integration-operations --operation=find-accounts-by-external-subject
#      --provider-kind=<SEEYON_LOGIN_NAME|WECOM_USER_ID> --external-subject=<text>
spring.main.web-application-type=servlet
server.port=-1
spring.main.banner-mode=off
flowable.async-executor-activate=false
forcitis.organization.workforce.sync.enabled=false
forcitis.organization.workforce.short-name.enabled=false
forcitis.platform.scheduling.jobs-enabled=false
forcitis.platform.identity.emergency.check.enabled=false
forcitis.platform.integration.event-publication.jobs-enabled=false
