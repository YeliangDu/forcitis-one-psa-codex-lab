# Read-only operations command of platform.integration (IntegrationOperationsCommands): one lookup, then the process ends. The command
# writes nothing, no migration runs (the schema must already be in place) and no scheduled work starts, except the read-only recheck thread
# (ReadOnlyAccounts), which starts with the login check of an external connection and ends with the process; the web part listens on no port.
# Start-up still connects: to the application database, and read-only to every configured external connection for its login check.
# Run: java -jar forcitis-one.jar --spring.profiles.active=integration-operations --operation=find-accounts-by-external-subject
#      --provider-kind=<WECOM_USER_ID> --external-subject=<text>
spring.main.web-application-type=servlet
server.port=-1
spring.main.banner-mode=off
spring.flyway.enabled=false
flowable.async-executor-activate=false
forcitis.platform.scheduling.jobs-enabled=false
forcitis.platform.identity.emergency.check.enabled=false
forcitis.platform.integration.event-publication.jobs-enabled=false
# A one-shot command writes nothing it was not asked to: the audit partitions are pre-created by the running application, not here.
forcitis.platform.audit.partitions.enabled=false
