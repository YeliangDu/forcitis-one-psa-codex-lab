# platform.approval configuration (own keys: forcitis.platform.approval.*, G46). Secrets only from the environment, never in this file.

# (The Modulith event publication registry table lives in platform_integration; see platform_integration.properties.)

# Process administrator: receives a task nobody could be found for (RULE-250/254). Set the user id per environment.
forcitis.platform.approval.assignment.process-administrator-user-id=${APPROVAL_PROCESS_ADMINISTRATOR_USER_ID:}

# WeCom card link; {taskId} is replaced (no buttons in 1a).
forcitis.platform.approval.notification.task-url-template=${APPROVAL_TASK_URL_TEMPLATE:https://one.forcitis.com/approval/tasks/{taskId}}

# Old system's to-do view (read-only). Connection and secrets come from the environment:
#   FORCITIS_PLATFORM_APPROVAL_LEGACY_URL, FORCITIS_PLATFORM_APPROVAL_LEGACY_USERNAME,
#   FORCITIS_PLATFORM_APPROVAL_LEGACY_PASSWORD, FORCITIS_PLATFORM_APPROVAL_LEGACY_DETAIL_URL_TEMPLATE
# Without a url the merged inbox shows new tasks only (legacyAvailable=false).
forcitis.platform.approval.legacy.view-name=dbo.v_psa_one_legacy_todo

# Approval deadline (REIMAGINED_ARCHITECTURE 2.1): the job reminds late tasks and escalates them; the deadline and the escalation interval
# of every node come from the process type's decision table ({process key}_nodes), not from here. Never approves anything.
forcitis.platform.approval.deadline.enabled=${APPROVAL_DEADLINE_ENABLED:true}
forcitis.platform.approval.deadline.cron=0 */5 * * * *

# Engine history (ACT_HI_*, data scorecard T3): finished instances stay online for 3 years, then each batch is written to the archive store
# (forcitis.platform.integration.archive-store.*, INFRA_RUNBOOK section 5.3) and removed from the engine. The job runs unless enabled=false
# (tests); a missing value stops the start-up. The application never deletes archives: the bucket's WORM retention and lifecycle do.
forcitis.platform.approval.process-archive.online-period=P3Y
forcitis.platform.approval.process-archive.cron=0 40 3 * * *
forcitis.platform.approval.process-archive.probe-cron=0 10 3 * * *
