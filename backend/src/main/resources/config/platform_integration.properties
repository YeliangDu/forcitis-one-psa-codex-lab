# platform.integration configuration (imported by application.properties). Own keys: forcitis.platform.integration.* (G46).
# Credentials only from the environment, never in this file.

# ---- Seeyon organisation views (anti-corruption layer, REIMAGINED_ARCHITECTURE section 3.3) ----
# Off by default: no database access, no sync job. Production sets INTEGRATION_SEEYON_VIEWS_ENABLED=true and the connection variables.
forcitis.platform.integration.seeyon.views.enabled=${INTEGRATION_SEEYON_VIEWS_ENABLED:false}
forcitis.platform.integration.seeyon.views.jdbc-url=${A8_DB_URL:}
forcitis.platform.integration.seeyon.views.username=${A8_DB_USERNAME:}
forcitis.platform.integration.seeyon.views.password=${A8_DB_PASSWORD:}
# On startup: the visible columns must EQUAL backend/architecture/seeyon-view-columns.yaml, the ids below must exist in the data,
# and the account must not hold write permissions. A failure stops the application.
forcitis.platform.integration.seeyon.views.validate-on-startup=${INTEGRATION_SEEYON_VALIDATE_ON_STARTUP:true}
# Instance-specific ids (RULE-356): change them together with the Seeyon instance, never silently.
forcitis.platform.integration.seeyon.views.head-relationship-type-id=${A8_HEAD_RELATIONSHIP_TYPE_ID:-1726439953579618944}
forcitis.platform.integration.seeyon.views.regional-receivables-manager-relationship-type-id=${A8_REGIONAL_RECEIVABLES_MANAGER_RELATIONSHIP_TYPE_ID:-8187907605834545337}
forcitis.platform.integration.seeyon.views.delivery-unit-yes-enum-id=${A8_DELIVERY_UNIT_YES_ENUM_ID:-2682590999914657055}
forcitis.platform.integration.seeyon.views.fee-earner-yes-enum-id=${A8_FEE_EARNER_YES_ENUM_ID:-3267712510147735998}
forcitis.platform.integration.seeyon.views.root-path=${A8_ROOT_PATH:00000001}

# ---- Seeyon OA single sign-on ticket check (RULE-320/321): the portal address; empty = the check answers "unavailable" ----
forcitis.platform.integration.seeyon.sso.base-url=${SEEYON_OA_BASE_URL:}
forcitis.platform.integration.seeyon.sso.timeout=5s

# ---- old system, read-only: department short names only (view with id and short_name) ----
forcitis.platform.integration.legacy.enabled=${INTEGRATION_LEGACY_ENABLED:false}
forcitis.platform.integration.legacy.jdbc-url=${LEGACY_DB_RO_URL:}
forcitis.platform.integration.legacy.username=${LEGACY_DB_RO_USERNAME:}
forcitis.platform.integration.legacy.password=${LEGACY_DB_RO_PASSWORD:}
forcitis.platform.integration.legacy.validate-on-startup=${INTEGRATION_LEGACY_VALIDATE_ON_STARTUP:true}
forcitis.platform.integration.legacy.view-name=dbo.v_one_legacy_org_short_name

# ---- Modulith event publication registry (at-least-once delivery of module events, RULE-295/303/304) ----
# The table platform_integration.event_publication is created by Flyway (V20261014133000); the framework creates nothing.
spring.modulith.events.jdbc.schema=platform_integration
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Completed publications move to event_publication_archive (V20261014144100) and are kept for the retention period.
spring.modulith.events.completion-mode=archive
# Redelivery job (ADR-0025 review C-4, C-8): incomplete publications older than minimum-age are redelivered every republish-interval,
# at most maximum-attempts times; what is left raises an ALERT log line and a gauge. The cleanup job removes archived rows after retention.
forcitis.platform.integration.event-publication.jobs-enabled=${EVENT_PUBLICATION_JOBS_ENABLED:true}
forcitis.platform.integration.event-publication.republish-interval=PT1M
forcitis.platform.integration.event-publication.minimum-age=PT1M
forcitis.platform.integration.event-publication.maximum-attempts=8
forcitis.platform.integration.event-publication.stale-after=PT10M
forcitis.platform.integration.event-publication.archive-period=P30D
forcitis.platform.integration.event-publication.cleanup-cron=0 30 4 * * *

# ---- WeCom (REIMAGINED_ARCHITECTURE section 3.7): code exchange and text-notice cards ----
# Off by default: nothing is sent and no job runs. Cards are still queued in outbound_deliveries and show up in the overdue-delivery metric.
forcitis.platform.integration.wecom.enabled=${WECOM_ENABLED:false}
forcitis.platform.integration.wecom.base-url=${WECOM_BASE_URL:https://qyapi.weixin.qq.com}
forcitis.platform.integration.wecom.corp-id=${WECOM_CORP_ID:}
forcitis.platform.integration.wecom.secret=${WECOM_APP_SECRET:}
forcitis.platform.integration.wecom.agent-id=${WECOM_AGENT_ID:}
forcitis.platform.integration.wecom.connect-timeout=5s
forcitis.platform.integration.wecom.read-timeout=5s
# Outside production only the people on the allow list receive cards. Production sets WECOM_RESTRICT_RECIPIENTS=false.
forcitis.platform.integration.wecom.recipients.restricted=${WECOM_RESTRICT_RECIPIENTS:true}
forcitis.platform.integration.wecom.recipients.allowed=${WECOM_RECIPIENT_ALLOWLIST:}
forcitis.platform.integration.wecom.delivery.interval=PT5S
# errcodes meaning "this task_id was already used" (card already sent). The public WeCom error list names none: verify, then set.
forcitis.platform.integration.wecom.delivery.duplicate-task-error-codes=

# ---- retention of outbound deliveries (data scorecard K7; GUIDING_PRINCIPLES section 6) ----
# Sent or skipped deliveries stay 90 days, failed ones one year. The job runs unless enabled=false (tests); a missing period or cron stops the start-up.
forcitis.platform.integration.outbound-purge.delivered-keep-period=P90D
forcitis.platform.integration.outbound-purge.failed-keep-period=P1Y
forcitis.platform.integration.outbound-purge.cron=0 10 4 * * *

# ---- archive store (data scorecard T3, user decision 2026-10-15): OSS archive storage in a mainland China region, WORM compliance retention ----
# Created by the user, never in the repository: the bucket, the RAM sub-account and its keys come from the environment. A missing value stops the start-up.
# The region must be a mainland China region (the archives hold personal data); the local directory keeps only the newest copy of each kind.
forcitis.platform.integration.archive-store.bucket=${ARCHIVE_STORE_BUCKET:}
forcitis.platform.integration.archive-store.region=${ARCHIVE_STORE_REGION:}
forcitis.platform.integration.archive-store.prefix=${ARCHIVE_STORE_PREFIX:}
forcitis.platform.integration.archive-store.local-directory=${ARCHIVE_STORE_LOCAL_DIRECTORY:}
forcitis.platform.integration.archive-store.worm-lock-days=${ARCHIVE_STORE_WORM_LOCK_DAYS:}
forcitis.platform.integration.archive-store.access-key-id=${ARCHIVE_STORE_ACCESS_KEY_ID:}
forcitis.platform.integration.archive-store.access-key-secret=${ARCHIVE_STORE_ACCESS_KEY_SECRET:}
