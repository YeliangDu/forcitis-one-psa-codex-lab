# platform.web and platform.idempotency configuration (imported by application.properties). Own keys: forcitis.platform.web.* and forcitis.platform.idempotency.* (G46).

# ---- Idempotency-Key: a request that holds a key but never finished (the node died) can be taken over by a retry after this time ----
forcitis.platform.web.idempotency.in-progress-timeout=2m

# ---- expired answers (24 hours) are removed by a job; ShedLock keeps it to one node ----
forcitis.platform.idempotency.cleanup.cron=0 */15 * * * *
