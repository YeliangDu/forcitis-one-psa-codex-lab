# organization.workforce - configuration (keys: forcitis.organization.workforce.*). External connections live in platform.integration.

# ---- daily reconciliation of the snapshot against the source (D-1a-10) ----
forcitis.organization.workforce.reconciliation.enabled=${WORKFORCE_RECONCILIATION_ENABLED:false}
forcitis.organization.workforce.reconciliation.cron=0 0 4 * * *

# ---- short names ----
forcitis.organization.workforce.short-name.enabled=${WORKFORCE_SHORT_NAME_ENABLED:false}
forcitis.organization.workforce.short-name.cron=0 30 3 * * *
