# organization.workforce - configuration (keys: forcitis.organization.workforce.*). Credentials only from the environment.

# ---- A8 read-only views (anti-corruption layer, REIMAGINED_ARCHITECTURE section 3.3) ----
# Off by default: no A8 access, no sync job. Production sets WORKFORCE_A8_ENABLED=true and the connection variables.
forcitis.organization.workforce.a8.enabled=${WORKFORCE_A8_ENABLED:false}
forcitis.organization.workforce.a8.jdbc-url=${A8_DB_URL:}
forcitis.organization.workforce.a8.username=${A8_DB_USERNAME:}
forcitis.organization.workforce.a8.password=${A8_DB_PASSWORD:}
# On startup: the visible columns must EQUAL backend/architecture/a8-view-columns.yaml, the ids below must exist in the data,
# and the account must not hold write permissions. A failure stops the application.
forcitis.organization.workforce.a8.validate-on-startup=${WORKFORCE_A8_VALIDATE_ON_STARTUP:true}
# A8-instance specific ids (RULE-356): change them together with the A8 instance, never silently.
forcitis.organization.workforce.a8.head-relationship-type-id=${A8_HEAD_RELATIONSHIP_TYPE_ID:-1726439953579618944}
forcitis.organization.workforce.a8.regional-receivables-manager-relationship-type-id=${A8_REGIONAL_RECEIVABLES_MANAGER_RELATIONSHIP_TYPE_ID:-8187907605834545337}
forcitis.organization.workforce.a8.delivery-unit-yes-enum-id=${A8_DELIVERY_UNIT_YES_ENUM_ID:-2682590999914657055}
forcitis.organization.workforce.a8.fee-earner-yes-enum-id=${A8_FEE_EARNER_YES_ENUM_ID:-3267712510147735998}

# ---- sync ----
# Every 5 minutes (second minute hour day month weekday).
forcitis.organization.workforce.sync.cron=0 */5 * * * *
# Shrink guard (RULE-358/366): more than this drop in active org units or employed people holds the run.
forcitis.organization.workforce.sync.max-drop-percent=20

# ---- old system, read-only: department short names only (id, short_name) ----
forcitis.organization.workforce.legacy.enabled=${WORKFORCE_LEGACY_ENABLED:false}
forcitis.organization.workforce.legacy.jdbc-url=${LEGACY_DB_RO_URL:}
forcitis.organization.workforce.legacy.username=${LEGACY_DB_RO_USERNAME:}
forcitis.organization.workforce.legacy.password=${LEGACY_DB_RO_PASSWORD:}
forcitis.organization.workforce.legacy.validate-on-startup=${WORKFORCE_LEGACY_VALIDATE_ON_STARTUP:true}
# Daily at 03:30.
forcitis.organization.workforce.short-name.cron=0 30 3 * * *
