# organization.workforce - configuration (keys: forcitis.organization.workforce.*). External connections live in platform.integration.

# ---- sync ----
# The scheduled run is stopped (ADR-0068 item 2.5 C, card #933); personnel commands are the only writer of employees (the release of an old HELD run stays until #934). The keys below stay until the sync code goes (#934).
forcitis.organization.workforce.sync.cron=0 */5 * * * *
# Shrink guard (RULE-358/366): more than this drop in active org units or employed people holds the run.
forcitis.organization.workforce.sync.max-drop-percent=20
# No successful run for longer than this makes the snapshot stale: two runs missed, the lag the OneWorkforceSyncLagging alert fires on.
forcitis.organization.workforce.sync.stale-after=PT10M

# ---- daily reconciliation of the snapshot against the source (D-1a-10) ----
forcitis.organization.workforce.reconciliation.enabled=${WORKFORCE_RECONCILIATION_ENABLED:false}
forcitis.organization.workforce.reconciliation.cron=0 0 4 * * *

# ---- short names ----
forcitis.organization.workforce.short-name.enabled=${WORKFORCE_SHORT_NAME_ENABLED:false}
forcitis.organization.workforce.short-name.cron=0 30 3 * * *

# ---- retention of sync runs and diffs (data scorecard K7; GUIDING_PRINCIPLES section 6) ----
# The job runs unless enabled=false (tests); a missing period or cron stops the start-up instead of keeping the rows forever.
forcitis.organization.workforce.sync-purge.run-keep-period=P2Y
forcitis.organization.workforce.sync-purge.diff-keep-period=P1Y
forcitis.organization.workforce.sync-purge.cron=0 50 3 * * *
