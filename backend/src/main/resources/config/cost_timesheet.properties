# cost.timesheet configuration (imported by application.properties). Own keys: forcitis.cost.timesheet.* (G46).

# Handled-event records are kept 90 days (data scorecard T3): longer than the 30-day event archive, so a redelivery is always recognised.
# The job runs unless enabled=false (tests); a missing keep-period or cron stops the start-up instead of keeping the rows forever.
forcitis.cost.timesheet.consumed-events.keep-period=P90D
forcitis.cost.timesheet.consumed-events.cron=0 20 4 * * *
