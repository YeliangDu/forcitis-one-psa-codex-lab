# platform.audit configuration (imported by application.properties). Own keys: forcitis.platform.audit.* (G46).

# ---- export (ADR-0027 section 3): a filter matching more entries is refused, so one export stays a file a person can use ----
forcitis.platform.audit.export.max-rows=50000
# Audit entries stay online for 3 years, then each batch is written to the archive store (INFRA_RUNBOOK section 5.3). Online rows are not deleted yet:
# the table refuses DELETE (G34) and removing rows needs its own decision. The job runs unless enabled=false (tests); a missing value stops the start-up.
forcitis.platform.audit.archive.online-period=P3Y
forcitis.platform.audit.archive.cron=0 0 2 * * *
forcitis.platform.audit.archive.probe-cron=0 10 2 * * *

# Audit entries live in monthly partitions (UTC months) with no catch-all: AuditPartitionJob creates the current month and this many months ahead at
# start-up and once a day. Required and positive; a missing value stops the start-up.
forcitis.platform.audit.partitions.months-ahead=3
forcitis.platform.audit.partitions.cron=0 20 1 * * *
