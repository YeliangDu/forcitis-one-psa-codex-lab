# Operations commands of platform.identity (OperationsCommands): one command, then the process ends. No web server, no scheduled work.
# Run: java -jar forcitis-one.jar --spring.profiles.active=identity-operations --operation=... --operator=... --witness=...
spring.main.web-application-type=none
spring.main.banner-mode=off
flowable.async-executor-activate=false
forcitis.organization.workforce.sync.enabled=false
forcitis.organization.workforce.short-name.enabled=false
forcitis.platform.identity.emergency.check.enabled=false
forcitis.platform.integration.event-publication.jobs-enabled=false
