# Operations commands of platform.identity (OperationsCommands): one command, then the process ends. No scheduled work, and the web
# part only because the controllers, the security chain and the session repository are beans of the web application: it listens on a
# random loopback port for the few seconds the command runs and nothing else can reach it.
# Run: java -jar forcitis-one.jar --spring.profiles.active=identity-operations --operation=... --operator=... --witness=...
spring.main.web-application-type=servlet
server.port=0
server.address=127.0.0.1
spring.main.banner-mode=off
flowable.async-executor-activate=false
forcitis.organization.workforce.sync.enabled=false
forcitis.organization.workforce.short-name.enabled=false
forcitis.platform.scheduling.jobs-enabled=false
forcitis.platform.identity.emergency.check.enabled=false
forcitis.platform.integration.event-publication.jobs-enabled=false
