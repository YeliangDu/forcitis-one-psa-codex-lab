  - { database: a8_db, object: forcitis_one.v_org_relationship, column: SOURCE_MEMBER_ID, source: dbo.ORG_RELATIONSHIP.SOURCE_ID, category: ASSIGNMENT, sensitivity: INTERNAL, purpose: RUNTIME_SYNC }
