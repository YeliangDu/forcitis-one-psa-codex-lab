# 外部读取登记（ExternalReadRegister；ADR-0037 第 6 项第 1 条）：新系统从 A8 与老系统读取的全部对象与列，一列一行。
#
# 账号按 ADR-0037 可读整库，授权边界是账号的写拒绝与启动校验，不是本文件；本文件规定应用读哪些列、读来做什么。
# 合同、产值 / 收入确认、成本、费用、开票、回款、分包、付款等权责事实不在这里；生日（ORG_MEMBER.EXT_ATTR_21）、银行卡等不登记；
# 凭据列不得登记（CredentialColumnGuardTest 逐行检查）。
#
# 守护：
#   - ExternalReadRegisterTest：每行字段齐全、取值合法、名字像敏感信息的列须 SENSITIVE / RESTRICTED；a8_db 运行时用途的行与代码常量
#     SeeyonViewSql.VIEW_COLUMNS（视图，逐列相等）、SeeyonViewSql.BASE_TABLE_COLUMNS（基表，逐列相等）一致；DBA 视图脚本建的正是这些视图；
#   - SeeyonSourceScanTest：集成层以外不出现登记的 dbo 对象，集成层 SQL 引用的 dbo 对象与 forcitis_one 视图都在这里；
#   - QualifiedBaseTableGuardTest：集成层读 A8 基表一律写 dbo. / [dbo]. 限定名；
#   - 启动时：经视图读取的路径，视图列与登记相等（多一列、少一列、多一个对象都拒绝启动）；运行时用途的基表行做子集检查（基表多出的列不报）；
#     迁入（MIGRATION）、迁入核对（MIGRATION_TIE_OUT）用途的行不进启动检查。本文件不进运行时 classpath。
# 老系统两个视图的列与代码常量的一致性检查放 P3b（P3b 移适配器并改写 SQL，C-5）。
# 变更本文件需 CODEOWNERS 评审（与 module-dependencies.txt 同等对待）。
#
# 字段（每行一个流式映射，不跨行）：
#   database     databases 列出的库之一
#   object       读取的对象：forcitis_one.v_* 视图或 dbo.<表或视图>
#   column       对象上的列
#   source       来源 dbo.<表>.<列>（「经」表示经哪一列关联）
#   category     ORG_UNIT 组织单元 | POSITION 岗位 | EMPLOYEE 员工 | ASSIGNMENT 任职 | EXTERNAL_IDENTITY 外部身份 | TODO 待办
#   sensitivity  PUBLIC | INTERNAL | SENSITIVE | RESTRICTED，与对应自有列的分级（data-classification.txt）一致
#   purpose      RUNTIME_SYNC 运行时同步 | RUNTIME_TODO 运行时待办 | MIGRATION 迁入 | MIGRATION_TIE_OUT 迁入核对（取值见词表 read_purpose）
databases: [a8_db, ruoyi-vue-pro]
