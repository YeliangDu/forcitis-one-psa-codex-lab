# 外部读取登记（ExternalReadRegister；ADR-0037 第 6 项第 1 条）：新系统从 A8 与老系统读取的全部对象与列，一列一行。
#
# 账号按 ADR-0037 可读整库，授权边界是账号的写拒绝与启动校验，不是本文件；本文件规定应用读哪些列、读来做什么。
# 合同、产值 / 收入确认、成本、费用、开票、回款、分包、付款等权责事实不在这里；生日（ORG_MEMBER.EXT_ATTR_21）、银行卡等不登记；
# 凭据列不得登记（CredentialColumnGuardTest 逐行检查）。
#
# 守护见 platform/integration/guard 与 ExternalReadRegisterTest。启动时只查 a8_db 运行时用途的行：视图列与登记相等，基表行做子集检查；
# 本文件不进运行时 classpath，启动检查读的是与之逐列相等的代码常量 SeeyonViewSql。
# 老系统两个视图的列与集成层 SQL 常量逐列相等由 LegacyReadRegisterTest 守护（R-1b-0 C-5，P3b 移适配器后补）。
#
# 字段（每行一个流式映射，不跨行）：
#   database     databases 列出的库之一
#   object       读取的对象：forcitis_one.v_* 视图（只属于 a8_db）或 dbo.<表或视图>
#   column       对象上的列
#   source       来源 dbo.<表>.<列>（「经」表示经哪一列关联）
#   category     ORG_UNIT 组织单元 | POSITION 岗位 | EMPLOYEE 员工 | ASSIGNMENT 任职 | EXTERNAL_IDENTITY 外部身份 | TODO 待办
#   sensitivity  PUBLIC | INTERNAL | SENSITIVE | RESTRICTED，与对应自有列的分级（data-classification.txt）一致
#   purpose      RUNTIME_SYNC 运行时同步 | RUNTIME_TODO 运行时待办 | MIGRATION 迁入 | MIGRATION_TIE_OUT 迁入核对（取值见词表 read_purpose）
databases: [a8_db, ruoyi-vue-pro]
columns:
  - { database: a8_db, object: forcitis_one.v_org_unit, column: ID, source: dbo.ORG_UNIT.ID, category: ORG_UNIT, sensitivity: INTERNAL, purpose: RUNTIME_SYNC }
