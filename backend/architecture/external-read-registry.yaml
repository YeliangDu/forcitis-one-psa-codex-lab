  - { database: a8_db, object: forcitis_one.v_org_unit, column: IS_INTERNAL, source: dbo.ORG_UNIT.IS_INTERNAL, category: ORG_UNIT, sensitivity: INTERNAL, purpose: RUNTIME_SYNC }
