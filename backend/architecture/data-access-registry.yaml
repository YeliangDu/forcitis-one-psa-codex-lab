# Data access registry (ADR-0026 item 5, data scorecard K15). The single place that says, for every table: what it is, how it may change,
# how long it lives, where its content comes from and which module reads or writes it. DataArchitectureTest checks the registry
# against the migrations (the resulting database) and against the SQL in src/main/java, in both directions.
#
# role         AGGREGATE_ROOT | AGGREGATE_CHILD | BUSINESS_DOCUMENT | DIMENSION_VERSIONED | SNAPSHOT | CONFIG | CONFIG_VERSIONED |
#              LOG_APPEND_ONLY | QUEUE | ONE_TIME | LINEAGE | COUNTER | IDEMPOTENCY | FRAMEWORK | PLACEHOLDER
# mutability   MUTABLE (needs a version column) | CONDITIONAL_UPDATE (needs `condition`) | REPLACE_SET | APPEND_ONLY | INSERT_DELETE |
#              MIGRATION_ONLY | FRAMEWORK
# retention    (an optional failed_policy <n>d | <n>y is the second tier of a two-tier purge)
# retention    policy PERMANENT | BUSINESS_RECORD | CURRENT_STATE | FRAMEWORK | EXPIRY | <n>d | <n>y; a time-bound policy names the ShedLock job (`job`)
# lineage      source NEW | ORG_SOURCE | MIGRATION | FRAMEWORK; migrated_from lists the old-system objects, via says how they are traced (legacy_numbers | ONE_OFF_IMPORT)
# writers      modules whose code writes the table; readers: modules that only read it. A module outside the schema's own module needs `cross_module`.
# references   role columns that point at a table of the same schema although the name does not say which (K6)
# optional     the table exists only on one side of a pending integration; the entry is checked when the table is there and then removed or made required.
#              An optional entry carries a due date (due) and fails once it has passed.
# partition     a range-partitioned table (ADR-0048): key column, granularity, the job that pre-creates partitions and who removes an archived one
# gaps         known violations with an owner: {rule, column?, due, owner, ref, note}. Only D3 and D4 may leave out the column; a gap past its due date fails the test. A gap that is no longer violated fails the test, so it is removed in the
#              same change that fixes it. Gaps are handed over to the owner named; none may be added to hide a new violation.
tables:
  cost_timesheet.consumed_events:
    role: IDEMPOTENCY
    mutability: INSERT_DELETE
    retention: {policy: 90d, job: cost.timesheet.consumed.events.purge}
    lineage: {source: NEW}
    writers: [cost.timesheet]
  cost_timesheet.timesheets:
    role: BUSINESS_DOCUMENT
    aggregate: Timesheet
    mutability: MUTABLE
    business_date_column: work_date
    document_number_column: timesheet_number
    retention: {policy: BUSINESS_RECORD}
    lineage: {source: NEW, migrated_from: [old timesheet rows], via: legacy_numbers}
    writers: [cost.timesheet]


  # 卡 A 只建立数据库基线；当前没有 Java SQL 使用方，后续卡随仓储实现登记 writers。
  organization_administration.config_sets:
    role: CONFIG_VERSIONED
    aggregate: ConfigSet
    mutability: MUTABLE
    versions_table: organization_administration.config_set_versions
    business_key: [config_set_code]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_administration.config_set_versions:
    role: AGGREGATE_CHILD
    aggregate: ConfigSet
    mutability: CONDITIONAL_UPDATE
    condition: 仅允许 PENDING 转 CONFIRMED 或 WITHDRAWN 并推进本行 version；已确认版本只由后继确认触发器关闭，状态转换由使用方同事务写入（ADR-0075）
    business_key: [config_set_id, version_number]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_administration.employee_activity_type_items:
    role: AGGREGATE_CHILD
    aggregate: ConfigSet
    mutability: APPEND_ONLY
    business_key: [config_set_version_id, activity_type_code]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_administration.state_transitions:
    role: LOG_APPEND_ONLY
    mutability: APPEND_ONLY
    business_key: [aggregate_id, transition_sequence_number]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_workforce.state_transitions:
    role: LOG_APPEND_ONLY
    mutability: APPEND_ONLY
    business_key: [aggregate_id, transition_sequence_number]
    fk_exceptions:
      legal_entity_id: a log row must outlive any row it names; the legal entity is a dated attribution of the employee, read from employee_legal_entities, not a parent of the transition
      command_id: the id of whatever command caused the change (ADR-0058 decision 8), not only personnel commands; the log keeps it when the command row is purged
    retention: {policy: PERMANENT}  # 未决：这些行属于被清除的员工，purge_employee_history 批次要一并删除（W2 第 8 节，清理作业另批），到时改本条保留期
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_attendance.work_calendar_years:
    role: AGGREGATE_ROOT
    aggregate: WorkCalendarYear
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}
    writers: [organization.attendance]
  organization_attendance.work_calendar_days:
    role: AGGREGATE_CHILD
    aggregate: WorkCalendarYear
    mutability: REPLACE_SET
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}
    writers: [organization.attendance]
  # IMP-1021-PAR-02: the versioned calendar below replaces the two tables above once the confirmation flow writes to it; until then both exist.
  organization_attendance.work_calendars:
    role: CONFIG_VERSIONED
    aggregate: WorkCalendar
    mutability: APPEND_ONLY
    versions_table: organization_attendance.work_calendar_versions
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
  organization_attendance.work_calendar_versions:
    role: AGGREGATE_CHILD
    aggregate: WorkCalendar
    mutability: CONDITIONAL_UPDATE
    condition: "PENDING_CONFIRMATION to CONFIRMED or WITHDRAWN, and closing the previous version's effective_to_date when the next one is confirmed (tg_work_calendar_versions_change)"
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}
  organization_attendance.work_calendar_version_days:
    role: AGGREGATE_CHILD
    aggregate: WorkCalendar
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}

  # #1310 AGG-108: standard hours are versioned config; a correction is a new version, never an edit.
  organization_attendance.standard_hours_versions:
    role: DIMENSION_VERSIONED
    aggregate: StandardHours
    writers: [organization.attendance]
    mutability: APPEND_ONLY
    condition: "the closing of the previous version (effective_to_date null to a date, by the publish of the next version), its reopening and the voiding of a future latest version (status IN_EFFECT to VOIDED once) are the only updates, nothing is deleted (triggers tg_standard_hours_versions_insert, tg_standard_hours_versions_change, tg_standard_hours_versions_void_reopens)"
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
  organization_attendance.standard_hours_date_overrides:
    role: AGGREGATE_CHILD
    aggregate: StandardHours
    writers: [organization.attendance]
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}

  # Identity of positions, org_units and employees comes from platform_integration.source_references, unique on (source_system, source_object_kind, source_id).
  # positions.code, org_units.code and employees.employee_code are display only and not unique in the source (five employee codes sit on several rows, three of them on both
  # an employed and a separated record), so no local unique constraint exists; whether they are unique within some scope is open (card DATA-REPAIR-workforce, open item 4).
  organization_workforce.positions:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    writers: [organization.workforce]  # a created position's snapshot row, written by the org-structure command line (#907); the sync is gone since #934
  # 使用方未建，由同步原样入库 (no consumer built yet, stored as the sync gives them): regional_receivables_manager_id (exposed through
  # OrgDirectory.findRegionalReceivablesManager, no caller yet) and is_delivery_unit (read-only exposure in OrgUnitResponse).
  organization_workforce.org_units:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    references: {regional_receivables_manager_id: organization_workforce.employees}
    writers: [organization.workforce]
  # is_fee_earner: 使用方未建，由同步原样入库 (cost.costing and others are not built); exposed through EmployeeProfile, and it does not mean billable.
  organization_workforce.employees:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    writers: [organization.workforce]
  organization_workforce.assignments:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    readers: [organization.workforce]  # nothing writes it any more since ADR-0069 s9: the snapshot sync is the last reader path; the table goes with the reconciliation (#1222)
  # W2 PR-B (data design W2_EMPLOYEE_POSITION_VERSIONING_DESIGN section 3.2, signed in reviews/W2-PR-B.md): no writer yet, the personnel commands and the reads land with the next cards.
  # IMP-1372 (ADR-0086, data design employment-relationship.md appendix A): one row per employee and employer; append-only except the one-time confirmation of a migrated row.
  organization_workforce.employment_relationships:
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 只有 employer_source_kind 为 MIGRATION_ATTRIBUTION 且 employer_confirmed_at 为空的行可更新一次（只置确认时刻与更新时刻，用人单位不变），之后冻结（触发器 tg_employment_relationships_append_only，ADR-0086 决定 2 的回填确认）
    business_key: [employee_id, employer_legal_entity_id]
    retention: {policy: PERMANENT}  # 个人任职史随员工清除：离职满 10 年删除；清除次序：保全、版本、命令、任职根、雇佣关系（关系最后删，其余三表对它有 RESTRICT 外键）；清除函数须加入本表（清除作业另批）
    lineage: {source: NEW}
    references: {employee_id: organization_workforce.employees, employer_legal_entity_id: organization_workforce.legal_entities, predecessor_relationship_id: organization_workforce.employment_relationships}
    writers: [organization.workforce]
  organization_workforce.employment_relationship_versions:
    role: DIMENSION_VERSIONED
    aggregate: Employee
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}  # 个人任职史版本表：离职满 10 年删除该员工的行（RETENTION_PROPOSAL 第 16 行，W2 第 8 节清理通道另批）
    lineage: {source: NEW}
    references: {employment_relationship_id: organization_workforce.employment_relationships, corrected_from_version_id: organization_workforce.employment_relationship_versions, change_command_id: organization_workforce.personnel_commands, superseding_command_id: organization_workforce.personnel_commands}
    writers: [organization.workforce]
  organization_workforce.personnel_commands:
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 状态只按 PENDING 到 EFFECTIVE、WITHDRAWN、HELD，HELD 到 EFFECTIVE、WITHDRAWN、PENDING（放行原生效日在将来的待放行离职），待法人归属会签到 PENDING、EFFECTIVE、WITHDRAWN 前进（转入待法人归属会签只在建立时），时刻列由空变非空一次，内容列不变（触发器 tg_personnel_commands_append_only，ADR-0068 第 1 条）
    business_key: [personnel_command_id]
    fk_exceptions:
      target_assignment_id: carried by the composite foreign key fk_personnel_commands_target_assignment (target_assignment_id, employee_id, target_assignment_kind), which also pins it to the command's employee and kind
    retention: {policy: PERMANENT}  # 个人任职史随员工清除：离职满 10 年由 purge_employee_history 删除（W2 第 8 节，清理作业另批）
    lineage: {source: NEW}
    writers: [organization.workforce]
  # #1438 WC1（数据设计签字记录 docs/data/reviews/workforce-contract-separation-wc0.md）：三张表只有结构与读取，状态推进的写入随 WC2（合同命令）与 WC3（离职申请命令）加入，故暂无 writers。
  organization_workforce.employment_contracts:
    # PERMANENT 是登记的理由（ADR-0043 R-2）：劳动合同与离职申请属员工人事档案，随员工在离职满 10 年后由清除函数删除；用户决定 Q-6 (b)，2026-11-05，决定片段 2026-11-05-151224（docs/decisions/2026-11-05-151224-one-lead-Q3-a-Q6-b-Q7-b.md）。清除次序：本表与 separation_requests 先于雇佣关系行删除（RESTRICT 外键），清除函数须加入本表（清除作业另批，当前代码里还没有该函数）。
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 只按触发器 tg_employment_contracts_change 列出的合法状态边写入（草拟、审批、批准、签订、终止、作废），其余更新一律拒绝；删除只放行表属主（清除函数）
    business_key: [employment_relationship_id, term_start_date]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {employment_relationship_id: organization_workforce.employment_relationships, renews_contract_id: organization_workforce.employment_contracts, termination_basis_key: organization_workforce.separation_bases}
    fk_exceptions:
      contract_file_id: the id of a file of platform.file, stored without a key across modules
  organization_workforce.separation_requests:
    # PERMANENT 是登记的理由（ADR-0043 R-2）：劳动合同与离职申请属员工人事档案，随员工在离职满 10 年后由清除函数删除；用户决定 Q-6 (b)，2026-11-05，决定片段 2026-11-05-151224（docs/decisions/2026-11-05-151224-one-lead-Q3-a-Q6-b-Q7-b.md）。清除次序：先于 personnel_commands（复合外键）与雇佣关系行删除；清除函数须加入本表（清除作业另批，当前代码里还没有该函数）。
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 只按触发器 tg_separation_requests_change 列出的合法状态边写入（申请、批准、驳回、撤回、办理离职、完成），其余更新一律拒绝；删除只放行表属主（清除函数）
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {employment_relationship_id: organization_workforce.employment_relationships, personnel_command_id: organization_workforce.personnel_commands, separation_basis_key: organization_workforce.separation_bases}
    fk_exceptions:
      agreement_file_id: the id of a file of platform.file, stored without a key across modules
  organization_workforce.separation_bases:
    # 离职依据清单：行只经迁移进出（触发器 tg_separation_bases_guard），不含个人信息，保留。
    role: CONFIG
    mutability: MIGRATION_ONLY
    business_key: [separation_basis_key]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    readers: [organization.workforce]
  organization_workforce.attribution_countersigns:
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 决定各列由空变非空一次，升级级别只升不降且决定后不再变，其余列不变（触发器 tg_attribution_countersigns_append_only，ADR-0073 第 3 至 4 条）
    business_key: [attribution_countersign_id]
    fk_exceptions:
      employee_id: carried by the composite foreign key fk_attribution_countersigns_command (personnel_command_id, employee_id, drafted_by), which also pins it to the command's employee
      decision_audit_entry_id: the id of an audit entry of another module, stored without a key across modules
    retention: {policy: PERMANENT}  # 同人事命令：个人任职史随员工清除，离职满 10 年删除（W2 第 8 节，清理作业另批）
    lineage: {source: NEW}
    writers: [organization.workforce]
  # #711 (DD revision 2 on #711, 4.1): one PRIMARY root per employee, any number of CONCURRENT roots; versions and commands name the root by composite foreign keys.
  organization_workforce.employee_assignments:
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: APPEND_ONLY
    condition: 任何 UPDATE 都拒绝，DELETE 只放行表属主（触发器 tg_employee_assignments_append_only，#711 数据设计 4.1）
    business_key: [assignment_id]
    retention: {policy: PERMANENT}  # 随任职版本保留，清除通道随 W2 第 8 节另批（次序：保全 → 版本 → 命令 → 任职根）
    lineage: {source: ORG_SOURCE}  # 迁入时补写的主任职根来自组织源；人事命令新建的兼职根是 NEW，登记格式只容一种来源，取组织源
    writers: [organization.workforce]
  organization_workforce.attribution_countersign_bases:
    role: AGGREGATE_CHILD
    aggregate: OrgUnit
    mutability: APPEND_ONLY
    condition: 任何 UPDATE 都拒绝，DELETE 只放行表属主（触发器 tg_attribution_countersign_bases_append_only，ADR-0073 第 2 至 4 条）
    business_key: [org_structure_command_id, employee_id]
    retention: {policy: PERMANENT}  # 随组织记录保留，清除通道随 W2 第 8 节另批
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.employee_profile_change_requests:
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 状态只按 PENDING 到 CONFIRMED、REJECTED、VOIDED 前进，处理人、处理时刻、作废原因、拒绝原因由空变非空一次，其余内容列不变（触发器 tg_employee_profile_change_requests_append_only，#980）
    business_key: [employee_profile_change_request_id]
    retention: {policy: PERMANENT}  # 随员工任职史清除：离职满 10 年删除该员工的行（W2 第 8 节，清理作业另批）
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.separation_holds:
    role: AGGREGATE_CHILD
    aggregate: Employee
    mutability: CONDITIONAL_UPDATE
    condition: 状态只按 HELD 到 RELEASED、WITHDRAWN 前进，放行四列由空变非空一次，其余列不变（触发器 tg_separation_holds_append_only，ADR-0068 第 1.5、2.1 条）
    business_key: [separation_hold_id]
    fk_exceptions:
      employee_id: carried by the composite foreign key fk_separation_holds_command (personnel_command_id, employee_id), which also pins it to the command's employee
    retention: {policy: PERMANENT}  # 与 personnel_commands 相同：随员工清除，离职满 10 年由 purge_employee_history 删除（W2 第 8 节，清理作业另批）
    lineage: {source: NEW}
    writers: [organization.workforce]
  # 岗位命令同表，按 target_kind 归属岗位；注册表只能记一个聚合，取组织单元。写入方是组织结构命令用例（#907）。
  organization_workforce.org_structure_commands:
    role: AGGREGATE_CHILD
    aggregate: OrgUnit
    mutability: CONDITIONAL_UPDATE
    condition: 状态只按 PENDING 到 IN_PROGRESS、EFFECTIVE、WITHDRAWN，IN_PROGRESS 到 EFFECTIVE，待会签到 PENDING、EFFECTIVE、WITHDRAWN 前进，时刻列、撤回列与涉及人数由空变非空一次，已转人数只增不减，其余列不变（触发器 tg_org_structure_commands_append_only，ADR-0068 第 4 条）
    business_key: [org_structure_command_id]
    retention: {policy: PERMANENT}  # 随组织记录保留，清除通道随 W2 第 8 节另批
    lineage: {source: NEW}
    writers: [organization.workforce]
  # Columns of org_units left out of the versions on purpose: sort_order (only orders siblings for display, nothing reads it by date), short_name (not a source column:
  # a cross-source column refreshed daily from the old system, valid until DA-8 lands, ADR-0033 item 2.6), revoked_at (follows from the start of the REVOKED version).
  # 使用方未建，由同步原样入库: regional_receivables_manager_id and is_delivery_unit, as on org_units.
  organization_workforce.org_unit_versions:
    role: DIMENSION_VERSIONED
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: ORG_SOURCE}
    condition: 关闭列对与作废列对各只能由空变非空一次，已关闭的行也可被作废，其余列不变，不删除（触发器 tg_org_unit_versions_append_only，W2 设计第 2 节）
    references: {regional_receivables_manager_id: organization_workforce.employees, corrected_from_version_id: organization_workforce.org_unit_versions}
    writers: [organization.workforce]  # the org-structure command line (#907); the sync that wrote it is gone since #934
  # D17 rule 2: effective basis DECLARED. The root positions keeps its columns; the org-structure command line (#907) writes the versions of a position it creates or disables, root narrowing is W2 section 9.
  organization_workforce.position_versions:
    role: DIMENSION_VERSIONED
    mutability: APPEND_ONLY
    condition: 关闭列对与作废列对各只能由空变非空一次，已关闭的行也可被作废，其余列不变，不删除（触发器 tg_position_versions_append_only，W2 设计第 2、3.3 节）
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {corrected_from_version_id: organization_workforce.position_versions}
    writers: [organization.workforce]
  # D17 rule 2: effective basis DECLARED (ADR-0068 item 6). Trigger tg_assignment_versions_append_only (ADR-0068 15.1, W2 design 2): the closing pair
  # (effective_to_date, closed_at) and the superseding pair (superseded_at, superseding_command_id) go from null to non-null once, a superseded row may be
  # open or closed, nothing else changes, nothing is deleted.
  organization_workforce.assignment_versions:
    role: DIMENSION_VERSIONED
    mutability: APPEND_ONLY
    condition: 关闭列对与作废列对各只能由空变非空一次，已关闭的行也可被作废，其余列不变，不删除（触发器 tg_assignment_versions_append_only，ADR-0068 15.1，W2 设计第 2 节）
    retention: {policy: PERMANENT}
    lineage: {source: ORG_SOURCE}
    references: {assignment_id: organization_workforce.employee_assignments, employment_relationship_id: organization_workforce.employment_relationships, corrected_from_version_id: organization_workforce.assignment_versions, change_command_id: organization_workforce.personnel_commands, superseding_command_id: organization_workforce.personnel_commands}
