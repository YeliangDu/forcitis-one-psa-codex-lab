# Data access registry (ADR-0026 item 5, data scorecard K15). The single place that says, for every table: what it is, how it may change,
# how long it lives, where its content comes from and which module reads or writes it. DataArchitectureTest checks the registry
# against the migrations (the resulting database) and against the SQL in src/main/java, in both directions.
#
# role         AGGREGATE_ROOT | AGGREGATE_CHILD | BUSINESS_DOCUMENT | DIMENSION_VERSIONED | SNAPSHOT | CONFIG | CONFIG_VERSIONED |
#              LOG_APPEND_ONLY | QUEUE | ONE_TIME | LINEAGE | COUNTER | IDEMPOTENCY | FRAMEWORK | PLACEHOLDER
# mutability   MUTABLE (needs a version column) | CONDITIONAL_UPDATE (needs `condition`) | REPLACE_SET | APPEND_ONLY | INSERT_DELETE |
#              MIGRATION_ONLY | FRAMEWORK
# retention    (an optional failed_policy <n>d | <n>y is the second tier of a two-tier purge)
# retention    policy PERMANENT | BUSINESS_RECORD | CURRENT_STATE | FRAMEWORK | EXPIRY | <n>d | <n>y; a time-bound policy names the ShedLock job (`job`)
# lineage      source NEW | ORG_SOURCE | MIGRATION | FRAMEWORK; migrated_from lists the old-system objects, via says how they are traced (legacy_numbers | ONE_OFF_IMPORT)
# writers      modules whose code writes the table; readers: modules that only read it. A module outside the schema's own module needs `cross_module`.
# references   role columns that point at a table of the same schema although the name does not say which (K6)
# optional     the table exists only on one side of a pending integration; the entry is checked when the table is there and then removed or made required.
#              An optional entry carries a due date (due) and fails once it has passed.
# partition     a range-partitioned table (ADR-0048): key column, granularity, the job that pre-creates partitions and who removes an archived one
# gaps         known violations with an owner: {rule, column?, due, owner, ref, note}. Only D3 and D4 may leave out the column; a gap past its due date fails the test. A gap that is no longer violated fails the test, so it is removed in the
#              same change that fixes it. Gaps are handed over to the owner named; none may be added to hide a new violation.
tables:
  cost_timesheet.consumed_events:
    role: IDEMPOTENCY
    mutability: APPEND_ONLY
    retention: {policy: 90d, job: cost.timesheet.consumed.events.purge}
    lineage: {source: NEW}
    writers: [cost.timesheet]
  cost_timesheet.timesheets:
    role: BUSINESS_DOCUMENT
    aggregate: Timesheet
    mutability: MUTABLE
    business_date_column: work_date
    document_number_column: timesheet_number
    retention: {policy: BUSINESS_RECORD}
    lineage: {source: NEW, migrated_from: [old timesheet rows], via: legacy_numbers}
    writers: [cost.timesheet]


  # 卡 A 只建立数据库基线；当前没有 Java SQL 使用方，后续卡随仓储实现登记 writers。
  organization_administration.config_sets:
    role: CONFIG_VERSIONED
    aggregate: ConfigSet
    mutability: MUTABLE
    versions_table: organization_administration.config_set_versions
    business_key: [config_set_code]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_administration.config_set_versions:
    role: AGGREGATE_CHILD
    aggregate: ConfigSet
    mutability: CONDITIONAL_UPDATE
    condition: 仅允许 PENDING 转 CONFIRMED 或 WITHDRAWN 并推进本行 version；已确认版本只由后继确认触发器关闭，状态转换由使用方同事务写入（ADR-0075）
    business_key: [config_set_id, version_number]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_administration.employee_activity_type_items:
    role: AGGREGATE_CHILD
    aggregate: ConfigSet
    mutability: APPEND_ONLY
    business_key: [config_set_version_id, activity_type_code]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_administration.state_transitions:
    role: LOG_APPEND_ONLY
    mutability: APPEND_ONLY
    business_key: [aggregate_id, transition_sequence_number]
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: []
  organization_attendance.work_calendar_years:
    role: AGGREGATE_ROOT
    aggregate: WorkCalendarYear
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}
    writers: [organization.attendance]
  organization_attendance.work_calendar_days:
    role: AGGREGATE_CHILD
    aggregate: WorkCalendarYear
    mutability: REPLACE_SET
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}
    writers: [organization.attendance]
  # IMP-1021-PAR-02: the versioned calendar below replaces the two tables above once the confirmation flow writes to it; until then both exist.
  organization_attendance.work_calendars:
    role: CONFIG_VERSIONED
    aggregate: WorkCalendar
    mutability: APPEND_ONLY
    versions_table: organization_attendance.work_calendar_versions
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
  organization_attendance.work_calendar_versions:
    role: AGGREGATE_CHILD
    aggregate: WorkCalendar
    mutability: CONDITIONAL_UPDATE
    condition: "PENDING_CONFIRMATION to CONFIRMED or WITHDRAWN, and closing the previous version's effective_to_date when the next one is confirmed (tg_work_calendar_versions_change)"
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}
  organization_attendance.work_calendar_version_days:
    role: AGGREGATE_CHILD
    aggregate: WorkCalendar
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW, migrated_from: [old work calendar 2016-2026], via: ONE_OFF_IMPORT}

  # Identity of positions, org_units and employees comes from platform_integration.source_references, unique on (source_system, source_object_kind, source_id).
  # positions.code, org_units.code and employees.employee_code are display only and not unique in the source (five employee codes sit on several rows, three of them on both
  # an employed and a separated record), so no local unique constraint exists; whether they are unique within some scope is open (card DATA-REPAIR-workforce, open item 4).
  organization_workforce.positions:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    writers: [organization.workforce]
  # 使用方未建，由同步原样入库 (no consumer built yet, stored as the sync gives them): regional_receivables_manager_id (exposed through
  # OrgDirectory.findRegionalReceivablesManager, no caller yet) and is_delivery_unit (read-only exposure in OrgUnitResponse).
  organization_workforce.org_units:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    fk_exceptions:
      last_sync_run_id: sync runs are deleted after two years while the snapshot row lives on
    references: {regional_receivables_manager_id: organization_workforce.employees}
    writers: [organization.workforce]
  # is_fee_earner: 使用方未建，由同步原样入库 (cost.costing and others are not built); exposed through EmployeeProfile, and it does not mean billable.
  organization_workforce.employees:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    fk_exceptions:
      last_sync_run_id: sync runs are deleted after two years while the snapshot row lives on
    writers: [organization.workforce]
  organization_workforce.assignments:
    role: SNAPSHOT
    mutability: MUTABLE
    retention: {policy: CURRENT_STATE}
    lineage: {source: ORG_SOURCE}  # own ids through the confirmed source references of platform.integration (经来源对照, R-1b P3b)
    writers: [organization.workforce]
  # Columns of org_units left out of the versions on purpose: sort_order (only orders siblings for display, nothing reads it by date), short_name (not a source column:
  # a cross-source column refreshed daily from the old system, valid until DA-8 lands, ADR-0033 item 2.6), revoked_at (follows from the start of the REVOKED version),
  # last_sync_run_id (moves to the change set with split a).
  # 使用方未建，由同步原样入库: regional_receivables_manager_id and is_delivery_unit, as on org_units.
  organization_workforce.org_unit_versions:
    role: DIMENSION_VERSIONED
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: ORG_SOURCE}
    references: {regional_receivables_manager_id: organization_workforce.employees}
    writers: [organization.workforce]
  organization_workforce.assignment_versions:
    role: DIMENSION_VERSIONED
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: ORG_SOURCE}
    writers: [organization.workforce]
  organization_workforce.sync_runs:
    role: AGGREGATE_ROOT
    aggregate: SyncRun
    mutability: MUTABLE
    retention: {policy: 2y, job: organization.workforce.sync.purge}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.sync_diffs:
    role: AGGREGATE_CHILD
    aggregate: SyncRun
    mutability: APPEND_ONLY
    retention: {policy: 1y, job: organization.workforce.sync.purge}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.sync_run_held_separations:
    role: AGGREGATE_CHILD
    aggregate: SyncRun
    mutability: REPLACE_SET
    retention: {policy: 1y, job: organization.workforce.sync.purge}
    lineage: {source: NEW}
    writers: [organization.workforce]
  # legal_entities is the current-value projection of the open row of legal_entity_versions: code, name and status are written in the same transaction as the version
  # (history in the versions table); WorkforceRowConstraintsIntegrationTest checks that the root equals its open version.
  organization_workforce.legal_entities:
    role: AGGREGATE_ROOT
    aggregate: LegalEntity
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.legal_entity_versions:
    role: DIMENSION_VERSIONED
    aggregate: LegalEntity
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.legal_entity_attributions:
    role: AGGREGATE_ROOT
    aggregate: LegalEntityAttribution
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.org_unit_legal_entities:
    role: DIMENSION_VERSIONED
    aggregate: LegalEntityAttribution
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.employee_legal_entities:
    role: DIMENSION_VERSIONED
    aggregate: LegalEntityAttribution
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [organization.workforce]
  organization_workforce.legal_entity_attribution_corrections:
    role: LOG_APPEND_ONLY
    aggregate: LegalEntityAttribution
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [organization.workforce]

  platform_approval.approval_requests:
    role: AGGREGATE_ROOT
    aggregate: ApprovalRequest
    mutability: MUTABLE
    retention: {policy: BUSINESS_RECORD}
    lineage: {source: NEW}
    writers: [platform.approval]
  platform_approval.approval_task_records:
    role: AGGREGATE_CHILD
    aggregate: ApprovalRequest
    mutability: APPEND_ONLY
    retention: {policy: BUSINESS_RECORD}
    lineage: {source: NEW}
    writers: [platform.approval]
  platform_approval.start_rounds:
    role: AGGREGATE_CHILD
    aggregate: ApprovalRequest
    mutability: APPEND_ONLY
    retention: {policy: BUSINESS_RECORD}
    lineage: {source: NEW}
    writers: [platform.approval]
  platform_approval.approval_tasks:
    role: AGGREGATE_CHILD
    aggregate: ApprovalRequest
    mutability: CONDITIONAL_UPDATE
    condition: "written only in the save of its ApprovalRequest, after the request row's version check (H-1: tasks are inner entities sharing the request's version)"
    retention: {policy: BUSINESS_RECORD}
    lineage: {source: NEW}
    writers: [platform.approval]
  platform_approval.process_archive_skips:
    role: LOG_APPEND_ONLY
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.approval]
  platform_approval.act_*:
    role: FRAMEWORK
    mutability: FRAMEWORK
    retention: {policy: 3y, job: platform.approval.process.archive}
    lineage: {source: FRAMEWORK}
    readers: [platform.approval]

  platform_audit.audit_subject_kinds:
    # ADR-0069 decision 14: uk_audit_subject_kinds_code is the business key and the target of the audit_entries.subject_kind foreign key. Rows are inserted and retired by migrations only.
    role: CONFIG
    mutability: MIGRATION_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    readers: [platform.audit]
  platform_audit.audit_entries:
    # Online 3 years, archived 10 years in total. Whole months leave the table only as partitions: the maintenance role runs
    # platform_audit.drop_archived_audit_entry_partition after the month is archived and checked (O-8); the application never deletes a row.
    role: LOG_APPEND_ONLY
    mutability: APPEND_ONLY
    partition: {key: created_at, granularity: month_utc, precreate_job: platform.audit.entry.partitions, drop: audit maintenance role via platform_audit.drop_archived_audit_entry_partition}
    retention: {policy: 3y, job: platform.audit.entry.archive}
    lineage: {source: NEW}
    writers: [platform.audit]
  # 批次区间不重叠、无缺口不设数据库约束：区间由作业按 (created_at, id) 推进产生，由 AuditArchiveJob.reconcile 对账（只比在线月份）；
  # 分区摘除前由 drop_archived_audit_entry_partition 逐月核对批次条数之和。区间不重叠、无缺口由对账承担；已摘除月份的缺口，库内此后无法再核验。
  platform_audit.audit_archive_batches:
    role: LOG_APPEND_ONLY
    fk_exceptions:
      first_entry_id: the batch row marks how far the archive reached and must outlive the online rows if they are ever removed
      last_entry_id: same as first_entry_id
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.audit]

  platform_idempotency.idempotent_responses:
    role: IDEMPOTENCY
    mutability: CONDITIONAL_UPDATE
    condition: "response_number IS NULL"
    retention: {policy: EXPIRY, job: platform.idempotency.cleanup}
    lineage: {source: NEW}
    writers: [platform.idempotency]

  platform_identity.user_accounts:
    # Known gap (DATA-REPAIR-identity ID-06; owner one-1a-next-4, due 2026-12-31, ref ADR-0043 R-2 / U-12): last_login_address is personal information on a PERMANENT table.
    # Intended clearing: the account keeps only its latest address while employed and the address is cleared within 30 days of disabling or departure (RETENTION_PROPOSAL.md).
    # Written as a comment, not a `gaps:` entry: no D-rule flags it yet and a gap that covers no violation fails this test; becomes a gap when the R-2 guard lands with the ADR-0043 implementation PR.
    role: AGGREGATE_ROOT
    aggregate: UserAccount
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.roles:
    role: AGGREGATE_ROOT
    aggregate: Role
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.role_permissions:
    role: AGGREGATE_CHILD
    aggregate: Role
    mutability: REPLACE_SET
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.account_roles:
    role: AGGREGATE_CHILD
    aggregate: UserAccount
    mutability: REPLACE_SET
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.role_versions:
    # Retention (ADR-0034 0034-Q2): 3 years online, archived until 10 years. The purge job is built with the online deletion of audit entries (ADR-0034, impact list), then this becomes {policy: 3y, job: ...}.
    # Owner: one-1a-par. Due: within 30 months after the first production deployment. The purge runs in dependency order: account_role_grants first, then role_versions, then the rows they reference
    # (role_version_custom_org_units of F-1 goes with its role version).
    # D17 rule 2: dimension table, effective basis DECLARED. roles.code, kind and is_administrative are not versioned: they decide what a role is and have no change path (ADR-0034 item 1.1).
    role: DIMENSION_VERSIONED
    aggregate: Role
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {recorded_by: platform_identity.user_accounts, closed_by: platform_identity.user_accounts}
    writers: []
  platform_identity.account_role_grants:
    # Retention as role_versions above (0034-Q2; owner one-1a-par; due within 30 months after the first production deployment; purge job built with the audit online deletion; account_role_grants is purged before role_versions).
    # D17 rule 2: effective basis DECLARED; the current value is the row that is not closed.
    role: DIMENSION_VERSIONED
    aggregate: UserAccount
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {granted_by: platform_identity.user_accounts, revoked_by: platform_identity.user_accounts}
    writers: []
  platform_identity.navigation_items:
    # uk_navigation_items_parent_item_id_name (parent_item_id, name) is the business key and also serves as the index of the parent_item_id foreign key (DATA-REPAIR-identity ID-11).
    role: CONFIG
    mutability: MIGRATION_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    readers: [platform.identity]
  platform_identity.login_states:
    role: ONE_TIME
    mutability: INSERT_DELETE
    retention: {policy: EXPIRY, job: platform.identity.credential.purge}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.sso_ticket_uses:
    role: ONE_TIME
    mutability: INSERT_DELETE
    retention: {policy: EXPIRY, job: platform.identity.credential.purge}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.browser_identifiers:
    role: ONE_TIME
    mutability: CONDITIONAL_UPDATE
    condition: "a value is replaced by retiring its rows (retired_at set where retired_at IS NULL) and inserting new rows; identifier_hash is never rewritten"
    retention: {policy: EXPIRY, job: platform.identity.credential.purge}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.ticket_issuers:
    role: CONFIG
    mutability: MIGRATION_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    readers: [platform.identity]
  platform_identity.emergency_admins:
    # PERMANENT by user decision: ADR-0043 U-12 item (a) accepts permanent retention of the emergency account name (PI) with a registered reason; source intent 2026-10-15-225255. The reason text moves into a registry field once DG-0 adds it.
    role: AGGREGATE_ROOT
    aggregate: EmergencyAdmin
    mutability: CONDITIONAL_UPDATE
    condition: failure counter, lock-out and TOTP step change only through single conditional UPDATE statements (repository-write-exceptions.txt)
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.authorization_requests:
    role: AGGREGATE_ROOT
    aggregate: AuthorizationRequest
    mutability: MUTABLE
    fk_exceptions:
      role_id: a request outlives the role it asked to change; the role may be deleted while the request is decided or kept as history
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.sessions:
    role: FRAMEWORK
    mutability: FRAMEWORK
    retention: {policy: FRAMEWORK}
    lineage: {source: FRAMEWORK}
    writers: [platform.identity]
  platform_identity.sessions_attributes:
    role: FRAMEWORK
    mutability: FRAMEWORK
    retention: {policy: FRAMEWORK}
    lineage: {source: FRAMEWORK}

  platform_integration.event_publication:
    role: FRAMEWORK
    mutability: FRAMEWORK
    retention: {policy: FRAMEWORK}
    lineage: {source: FRAMEWORK}
    readers: [platform.integration]
  platform_integration.event_publication_archive:
    role: FRAMEWORK
    mutability: FRAMEWORK
    retention: {policy: 30d, job: platform.integration.event.cleanup}
    lineage: {source: FRAMEWORK}
  platform_integration.outbound_deliveries:
    role: QUEUE
    aggregate: OutboundDelivery
    mutability: MUTABLE
    retention: {policy: 90d, failed_policy: 1y, job: platform.integration.outbound.purge}  # policy: SENT、SKIPPED；failed_policy: FAILED、DEAD_LETTER（OutboundDeliveryPurgeJob）；PENDING 不删
    lineage: {source: NEW}
    writers: [platform.integration]
  platform_integration.source_references:
    role: AGGREGATE_ROOT
    aggregate: SourceReference
    mutability: MUTABLE
    retention: {policy: PERMANENT}  # 人员类 source_id 按 RETENTION_PROPOSAL 离职满 10 年删除，清理作业另卡；R-2 守护建成后转 gap
    lineage: {source: ORG_SOURCE, migrated_from: [老系统人员与部门对照], via: ONE_OFF_IMPORT}
    writers: [platform.integration]

  platform_numbering.document_types:
    # ADR-0066 decision 4: uk_document_types_code is the business key. Rows are inserted by migrations only; platform.approval and the business contexts check codes through platform.numbering.api.DocumentTypes, never by reading this table.
    role: CONFIG
    mutability: MIGRATION_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    readers: [platform.numbering]
  platform_numbering.numbering_rules:
    role: CONFIG_VERSIONED
    aggregate: NumberingRule
    mutability: MUTABLE
    versions_table: platform_numbering.numbering_rule_versions
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.numbering]
  # AP-09: the database only checks CONFIRMED has a business confirmer; a JOURNAL_VOUCHER version also needs the finance confirmation,
  # which depends on the document type and is enforced by the aggregate (NumberingRule.completeIfAllGiven), not by a CHECK.
  platform_numbering.numbering_rule_versions:
    role: AGGREGATE_CHILD
    aggregate: NumberingRule
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.numbering]
  platform_numbering.numbering_counters:
    role: COUNTER
    mutability: CONDITIONAL_UPDATE
    condition: allocated by one atomic upsert (repository-write-exceptions.txt, reserveNext)
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.numbering]
  platform_numbering.legacy_numbers:
    role: LINEAGE
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: MIGRATION, migrated_from: [old document numbers], via: legacy_numbers}
    writers: [platform.numbering]

  # platform.file (ADR-0060, 0061, 0070; data design signed by one-data, IMP-1021-COO-02 unit 3). Writers and readers are added with the use cases (units 5-7).
  # Retention: files and their links are kept permanently until the disposal of ADR-0061 is built (90 days before the first possible expiry);
  # the person columns follow RETENTION_PROPOSAL with a separate clean-up card, as source_references does.
  platform_file.stored_files:
    # Only file_status changes, along the transitions listed in the migration; everything else, the object key included, is refused by a trigger.
    role: AGGREGATE_ROOT
    aggregate: StoredFile
    mutability: CONDITIONAL_UPDATE
    condition: only file_status along the listed transitions (tg_stored_files_guard)
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.file]
    references: {previous_file_id: platform_file.stored_files, derived_from_file_id: platform_file.stored_files}
  platform_file.stored_file_names:
    # De-identified once to a fixed placeholder by the disposal job platform.file.deidentify-file-names (built with ADR-0061 disposal).
    role: AGGREGATE_CHILD
    aggregate: StoredFile
    mutability: CONDITIONAL_UPDATE
    condition: one de-identification to the fixed placeholder (tg_stored_file_names_guard)
