  # platform.file (ADR-0060, 0061, 0070; data design signed by one-data, IMP-1021-COO-02 unit 3). Writers and readers are added with the use cases (units 5-7).
  # Retention: files and their links are kept permanently until the disposal of ADR-0061 is built (90 days before the first possible expiry);
  # the person columns follow RETENTION_PROPOSAL with a separate clean-up card, as source_references does.
  platform_file.stored_files:
    # Only file_status changes, along the transitions listed in the migration; everything else, the object key included, is refused by a trigger.
    role: AGGREGATE_ROOT
    aggregate: StoredFile
    mutability: CONDITIONAL_UPDATE
    condition: only file_status along the listed transitions (tg_stored_files_guard)
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.file]
    references: {previous_file_id: platform_file.stored_files, derived_from_file_id: platform_file.stored_files}
