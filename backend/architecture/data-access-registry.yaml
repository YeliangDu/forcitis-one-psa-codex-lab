  platform_audit.audit_subject_kinds:
    # ADR-0069 decision 14: uk_audit_subject_kinds_code is the business key and the target of the audit_entries.subject_kind foreign key. Rows are inserted and retired by migrations only.
    role: CONFIG
    mutability: MIGRATION_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    readers: [platform.audit]
  platform_audit.audit_entries:
    # Online 3 years, archived 10 years in total. Whole months leave the table only as partitions: the maintenance role runs
    # platform_audit.drop_archived_audit_entry_partition after the month is archived and checked (O-8); the application never deletes a row.
    role: LOG_APPEND_ONLY
    mutability: APPEND_ONLY
    partition: {key: created_at, granularity: month_utc, precreate_job: platform.audit.entry.partitions, drop: audit maintenance role via platform_audit.drop_archived_audit_entry_partition}
    retention: {policy: 3y, job: platform.audit.entry.archive}
    lineage: {source: NEW}
    writers: [platform.audit]
  # 批次区间不重叠、无缺口不设数据库约束：区间由作业按 (created_at, id) 推进产生，由 AuditArchiveJob.reconcile 对账（只比在线月份）；
  # 分区摘除前由 drop_archived_audit_entry_partition 逐月核对批次条数之和。区间不重叠、无缺口由对账承担；已摘除月份的缺口，库内此后无法再核验。
  platform_audit.audit_archive_batches:
    role: LOG_APPEND_ONLY
    fk_exceptions:
      first_entry_id: the batch row marks how far the archive reached and must outlive the online rows if they are ever removed
      last_entry_id: same as first_entry_id
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.audit]

  platform_idempotency.idempotent_responses:
    role: IDEMPOTENCY
    mutability: CONDITIONAL_UPDATE
    condition: "response_number IS NULL"
    retention: {policy: EXPIRY, job: platform.idempotency.cleanup}
    lineage: {source: NEW}
    writers: [platform.idempotency]

  platform_identity.user_accounts:
    # Known gap (DATA-REPAIR-identity ID-06; owner one-1a-next-4, due 2026-12-31, ref ADR-0043 R-2 / U-12): last_login_address is personal information on a PERMANENT table.
    # Intended clearing: the account keeps only its latest address while employed and the address is cleared within 30 days of disabling or departure (RETENTION_PROPOSAL.md).
    # Written as a comment, not a `gaps:` entry: no D-rule flags it yet and a gap that covers no violation fails this test; becomes a gap when the R-2 guard lands with the ADR-0043 implementation PR.
    role: AGGREGATE_ROOT
    aggregate: UserAccount
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.roles:
    role: AGGREGATE_ROOT
    aggregate: Role
    mutability: MUTABLE
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.handled_personnel_commands:
    # Retention as account_role_grants (0034-Q2; data design sign-off #939): purged with it, before it (no foreign key: the purge job deletes these rows before the grant rows they name). Only surrogate keys and codes.
    role: IDEMPOTENCY
    aggregate: UserAccount
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {user_id: platform_identity.user_accounts}
    fk_exceptions:
      account_role_grant_id: a key into account_role_grants would make the database refuse TRUNCATE of the grant history with 0A000 before its append-only trigger answers (GrantHistoryAppendOnlyIT requires the trigger's 23001); the id is written in the same transaction as the grant row it names
    writers: [platform.identity]
  platform_identity.role_versions:
    # Retention (ADR-0034 0034-Q2): 3 years online, archived until 10 years. The purge job is built with the online deletion of audit entries (ADR-0034, impact list), then this becomes {policy: 3y, job: ...}.
    # Owner: one-1a-par. Due: within 30 months after the first production deployment. The purge runs in dependency order: account_role_grants first, then role_versions, then the rows they reference
    # (role_version_custom_org_units of F-1 goes with its role version).
    # D17 rule 2: dimension table, effective basis DECLARED. roles.code, kind and is_administrative are not versioned: they decide what a role is and have no change path (ADR-0034 item 1.1).
    role: DIMENSION_VERSIONED
    aggregate: Role
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {recorded_by: platform_identity.user_accounts, closed_by: platform_identity.user_accounts}
    writers: [platform.identity]
  platform_identity.role_version_custom_org_units:
    # F-1 (#728): the custom org units of a role version, written once with the new version (tg_role_version_custom_org_units_guard). Retention follows
    # role_versions (0034-Q2 (b): 3 years online, archived until 10 years) and is purged with its role version; org_unit_id is a cross-schema id without a foreign key.
    role: AGGREGATE_CHILD
    aggregate: Role
    mutability: APPEND_ONLY
    business_key: [role_version_id, org_unit_id]
    fk_exceptions:
      org_unit_id: an org unit of organization_workforce.org_units (another schema, F-1 card section on references); a disabled or revoked unit is caught by the scope review (RULE-387)
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    writers: [platform.identity]
  platform_identity.permission_adjustments:
    # F-1 (#729): review items that remind someone to look at an authorization again; they never grant and never revoke (ADR-0032 sections 4 and 5,
    # ADR-0044 sections 2 and 3, RULE-387). The wide table is deliberate: one aggregate, each item is upheld, adjusted or closed once, and the
    # CHECK constraints keep the stages apart. Retention follows authorization_requests (N1-10: 3 years online, archived until 10 years; purged by chain
    # through original_permission_adjustment_id).
    role: AGGREGATE_ROOT
    aggregate: PermissionAdjustment
    mutability: MUTABLE
    business_key: [permission_adjustment_id]
    references: {upheld_by: platform_identity.user_accounts, adjusted_by: platform_identity.user_accounts}
    fk_exceptions:
      org_unit_id: an org unit of organization_workforce.org_units (another schema); the item exists because that unit is disabled or revoked
      trigger_personnel_command_id: the transfer command, another schema (organization_workforce); no foreign key
      trigger_org_structure_command_id: the dissolve or merge command, another schema; no foreign key
      before_org_unit_id: the department before the change, another schema
      after_org_unit_id: the department after the change, another schema
      before_position_id: the position before the change, another schema
      after_position_id: the position after the change, another schema
      recipient_employee_id: the head of the new department when raised, another schema
      business_owner_employee_id: an employee of organization_workforce.employees, another schema
      adjusted_audit_entry_id: an audit entry of platform_audit, another schema
      closure_personnel_command_id: the separation command, another schema; no foreign key
    retention: {policy: PERMANENT}
    writers: [platform.identity]
    lineage: {source: NEW}
  platform_identity.account_role_grants:
    # Retention as role_versions above (0034-Q2; owner one-1a-par; due within 30 months after the first production deployment; purge job built with the audit online deletion; account_role_grants is purged before role_versions).
    # D17 rule 2: effective basis DECLARED; the current value is the row that is not closed.
    role: DIMENSION_VERSIONED
    aggregate: UserAccount
    mutability: APPEND_ONLY
    retention: {policy: PERMANENT}
    lineage: {source: NEW}
    references: {granted_by: platform_identity.user_accounts, revoked_by: platform_identity.user_accounts}
    fk_exceptions:
      revocation_separation_command_id: the id of a separation command of another module (organization.workforce personnel_commands), stored without a key across modules; it is not a row of handled_personnel_commands, which records only the reinstatement commands this module handled
    writers: [platform.identity]
