  standard_ref:
  - ADR-0073 第 3 条第 6 项
  - 用户 2026-10-30 答复（等会签期间拒绝生效日更晚的命令）
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，经 lead 转达「按建议改」，#898）
  note: 状态值 AWAITING_ATTRIBUTION_COUNTERSIGN（随用户确认的名称，原暂名 AWAITING_COUNTERSIGN 不再用）；「会签」在此指法人归属会签，不是 platform.approval 的会签
- id: cost_legal_entity
  zh: 成本法人
  en: CostLegalEntity
  snake: cost_legal_entity
  kind: value_object
  bc: organization.workforce
  scope: domain
  definition: 员工在某日成本归集所属的法人：员工单独指定的法人优先，没有才取其当日任职组织单元沿部门链向上第一个有法人归属的单元；由组织人事内部按日计算，不接受调用方传入
  standard_ref:
  - ADR-0073 第 3 条第 4 项
  - ADR-0026 第 5 项
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，经 lead 转达「按建议改」，#898）
  note: 会签判据即命令生效日前后的成本法人是否变化；成本法人（归属法人，ADR-0073）不是用人单位（劳动合同签约方，ADR-0079 不变量 4），改其一不连带改另一；ADR-0073 与卡片里「跨法人调动」指成本法人变化，ADR-0079 Q1 的「跨法人调动」指用人单位变更（原单位合同终止、新单位另签），两者不得混用，代码与事件名不得暗示合同动作
