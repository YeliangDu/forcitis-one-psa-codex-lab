# 法人归属会签（ADR-0073 第 3 条第 6 项；设计 docs/architecture/proposals/legal-entity-countersign.md，#878；one-design 2026-10-30，#898）。
# 同名异义：ADR-0073 原文称「会签」「财务会签」，与 platform.approval 的「会签」countersign（节点上每位审批人都通过才算通过，RULE-248/273）不同：
# 这里是一名（或前后两个法人各一名）法人财务负责人对一条命令的批准或拒签，不经审批流程（ADR-0073 备选方案：会签走审批流程会成环）。
# 本 bc 用不同的中英文名「法人归属会签」AttributionCountersign，不复用 countersign；两名不同，不能列 homonyms，在两处 note 互注。中英文名用户已确认（2026-10-30「按建议改」：待会签改为「待法人归属会签」，会签请求已失效改为「法人归属会签已失效」，其余四项按提议）。
terms:
- id: attribution_countersign
  zh: 法人归属会签
  en: AttributionCountersign
  snake: attribution_countersign
  kind: entity
  bc: organization.workforce
  scope: domain
  definition: 改变员工成本法人的人事命令须由变更前、变更后两个法人的法人财务负责人各自批准或拒签的请求，变更请求任一方拒签即撤回命令，撤回请求被拒签则命令仍待生效；每个请求一行（变更或撤回，每个法人一行），属员工聚合
  standard_ref:
  - ADR-0073 第 3 条第 6 项
  - 用户 2026-10-30 答复（两个法人的财务负责人都会签，任一方可拒签）
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，经 lead 转达「按建议改」，#898）
  note: 与 platform.approval 的 countersign「会签」同名异义（中英文名不同，不列 homonyms，在此互注）；表 attribution_countersigns（#893）
