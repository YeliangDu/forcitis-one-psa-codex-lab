- id: separation_observed_at
  zh: 离职观察时间
  en: SeparationObservedAt
  snake: separation_observed_at
  kind: value_object
  bc: platform.integration
  scope: acl
  acl_class: "过渡期"
  definition: 组织同步第一次把员工判为离职、并写入快照的那一轮同步的提交时刻；只表示新系统这样判定了，不是人事生效日
  standard_ref:
  - docs/modernization/rules/WORKFORCE_HISTORY_RULES.md
  confidence: medium
  aliases: []
  forbidden: [离职日期, separation_date]
  status: proposed
  note: 单说离职日期有歧义，须写明预计离职日期或离职观察时间
- id: attribution_subject
  zh: 法人归属对象
  en: AttributionSubject
  snake: attribution_subject
  kind: value_object
  bc: organization.workforce
  scope: domain
  definition: 法人归属所指的对象，是一个组织单元或一名员工，由对象类别与对象 ID 共同确定；同一对象在同一时点只归属一个法人
  standard_ref:
  - ADR-0033 第 7 项第 4 条（DA-5）
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 类型 AttributionSubjectId 为它的标识（kind + subjectId，events/workforce.yaml x-type）；落库按 DA-5 拆为 org_unit_id / employee_id 两列
- id: personnel_command
  zh: 人事命令
  en: PersonnelCommand
  snake: personnel_command
  kind: entity
  bc: organization.workforce
  scope: domain
  definition: 员工聚合内的人事异动第一手记录：入职、转正、调岗、离职、复职、更正、停薪留职开始与结束，只追加；生效日为人事业务生效日
  standard_ref:
  - ADR-0068 第 1 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: W2 PR-B，IMP-1022-PAR-01
- id: unpaid_leave
  zh: 停薪留职
  en: UnpaidLeave
  snake: unpaid_leave
  kind: value_object
  bc: organization.workforce
  scope: domain
  definition: 员工在职期间暂停发薪的状态，不是雇佣状态；员工版本以 is_on_unpaid_leave 记录，人事命令以开始、结束两种种类改变它
  standard_ref:
  - ADR-0068 第 3 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: W2 PR-B，IMP-1022-PAR-01
