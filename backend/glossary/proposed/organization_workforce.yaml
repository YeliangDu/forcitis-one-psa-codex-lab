terms:
- id: login_lookup
  zh: 登录查人
  en: LoginLookup
  snake: login_lookup
  kind: value_object
  bc: organization.workforce
  scope: acl
  acl_class: 过渡期
  definition: 按外部登录标识（企业微信 userid 或外部登录名）在组织快照中找员工；随 DA-3 外部身份移到 identity 后删除
  standard_ref:
  - ADR-0033 第 4 项
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: R-1b P2-H2，两个按登录标识查人的方法合一以守住 api 方法上限
