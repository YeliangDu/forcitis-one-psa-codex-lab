  en: SystemRoleDeclaration
  snake: system_role_declaration
  kind: value_object
  bc: platform.identity
  scope: domain
  definition: 六个系统角色（固定角色 ID、编码、是否管理员角色、名称、状态、数据范围类型、完整权限集合）在代码中的声明，每个角色带声明修订号；启动时对账写入角色版本，迁移不写角色数据（ADR-0034 第 1 项第 7 条）
