  zh: 声明修订号
  en: DeclarationRevisionNumber
  snake: declaration_revision_number
  kind: value_object
  bc: platform.identity
  scope: domain
  definition: 系统角色声明中每个角色的修订号，从 1 起只增不减；只有 SEED 版本记录它；库中修订号更小时追加新版本，更大时告警不写，相等而内容不同时启动失败（ADR-0034 第 1 项第 7 条）
  standard_ref:
