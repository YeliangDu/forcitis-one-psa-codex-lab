- id: role_version
  zh: 角色版本
  en: RoleVersion
  snake: role_version
  kind: entity
  bc: platform.identity
  scope: domain
  definition: 角色定义（名称、状态、数据范围类型、完整权限集合）的每次变化一行，只追加；当前版本是没有失效时刻的那一行，每个角色至多一个；删除角色是关闭最后一个版本（ADR-0034 第 1 项）
  standard_ref:
  - docs/adr/ADR-0034.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 登记会话 one-1a-par（IMP-1017-PAR-02，派工卡 ADR-0034-IMPL 第 11 节）；查重：terms.yaml 与 proposed 中同一 bc 无同名、同中文名
