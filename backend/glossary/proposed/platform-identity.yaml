- id: single_operator_mode
  zh: 单人运维模式
  en: SingleOperatorMode
  snake: single_operator_mode
  kind: value_object
  bc: platform.identity
  scope: domain
  definition: 仅 dev 环境、仅在进程启动时按配置读定的运行方式：运维命令可省略见证人，应急账号与超级管理员下限按 1 计，并可经运维命令起草无作者的编号模板版本；放宽项封闭为单人运维放宽项的取值，每次放宽都写标注审计（ADR-0030）
  standard_ref:
  - adr/src/ADR-0030.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 登记会话 one-1a-par（派工卡 SINGLE-OP）；配置键 forcitis.platform.identity.single-operator-mode；查重：terms.yaml 与 proposed 中同一 bc 无同名、同中文名
- id: single_operator_relaxation
  zh: 单人运维放宽项
  en: SingleOperatorRelaxation
  snake: single_operator_relaxation
  kind: value_object
  bc: platform.identity
  scope: domain
  definition: 单人运维模式下被放宽的规则，封闭为四个取值：见证人省略、应急账号下限一个、超级管理员下限一个（只改同步暂停原因文本）、模板版本无作者；写入标注审计的 detail；新增取值须另立 ADR（ADR-0030 第 2 项）
  standard_ref:
  - adr/src/ADR-0030.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 登记会话 one-1a-par（派工卡 SINGLE-OP）；四个取值的标识符与中文名由派工卡第 11 节列出，实现 PR 前由 one-glossary 确认
- id: super_admin
