terms:
- id: migration_batch
  zh: 迁入批次
  en: MigrationBatch
  snake: migration_batch
  kind: entity
  bc: platform.integration
  definition: 一次历史数据迁入运行；登记来源系统、对象类型、范围、状态、行数与来源 ID 摘要；批次挂在来源对照与原编号对照上，业务表不带批次列
  standard_ref:
  - 用户 2026-10-15 批次术语统一
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden:
  - 导入批次
  - import_batch
  - ImportBatch
  status: proposed
  note: 用户 2026-10-15 定批次术语唯一写法；platform.numbering 的 import_batch 已在 R-1b P3a（#139）改为 migration_batch_id，同一提交加入 forbidden 并删去 platform-integration.yaml 中的重复条目
- id: migration_orchestration
  zh: 迁入编排
  en: MigrationOrchestration
  snake: migration_orchestration
  kind: entity
  bc: platform.migration
  definition: 按依赖顺序调用集成层与各目标 BC 迁入用例、推进迁入批次的独立模块（暂定 platform.migration）；只依赖它们的 api，不被任何模块依赖（ADR-0036 第 1 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 模块名在实现 PR 定
- id: migration_reject
  zh: 迁入拒收
  en: MigrationReject
  snake: migration_reject
  kind: entity
  bc: platform.integration
  definition: 迁入时被拒绝的一条来源行，带批次、来源对象、来源 ID 与原因代码；处置经应用内带权限的操作录入，批次提交前须逐条处置（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_reason__unmappable_value
  zh: 取值无法映射
  en: UnmappableValue
  snake: unmappable_value
  kind: value
  bc: platform.integration
  definition: 迁入拒收原因代码：来源取值在映射表中没有对应的自有取值（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_reason__required_missing
  zh: 必填缺失
  en: RequiredMissing
  snake: required_missing
  kind: value
  bc: platform.integration
  definition: 迁入拒收原因代码：目标必填项在来源中为空（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_reason__number_conflict
  zh: 编号冲突
  en: NumberConflict
  snake: number_conflict
  kind: value
  bc: platform.integration
  definition: 迁入拒收原因代码：原编号与已有编号在（单据类型, 编号）上冲突（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_reason__original_missing
  zh: 原行缺失
  en: OriginalMissing
  snake: original_missing
  kind: value
  bc: platform.integration
  definition: 迁入拒收原因代码：冲销行的原行不在本批次也不在目标库中（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_reason__legal_entity_out_of_scope
  zh: 法人不在范围
  en: LegalEntityOutOfScope
  snake: legal_entity_out_of_scope
  kind: value
  bc: platform.integration
  definition: 迁入拒收原因代码：来源行的法人不在新系统的法人范围内（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_reason__trial_commit_failed
  zh: 试提交失败
  en: TrialCommitFailed
  snake: trial_commit_failed
  kind: value
  bc: platform.integration
  definition: 迁入拒收原因代码：试提交中领域校验或数据库约束不通过（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_disposition__rerun_after_fix
  zh: 修正后重跑
  en: RerunAfterFix
  snake: rerun_after_fix
  kind: value
  bc: platform.integration
  definition: 迁入拒收处置取值：修正映射或来源后由新的暂存重跑（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_reject_disposition__excluded
  zh: 确认不迁
  en: Excluded
  snake: excluded
  kind: value
  bc: platform.integration
  definition: 迁入拒收处置取值：确认该行不迁入；权责事实须财务负责人确认，其他由业务管理员确认（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_tie_out
  zh: 迁入核对
  en: MigrationTieOut
  snake: migration_tie_out
  kind: entity
  bc: platform.integration
  definition: 一个迁入批次按期间 × 法人 × 对象类型比对来源侧聚合与暂存的行数、金额合计、来源 ID 摘要与按来源单号的行数金额的结果；零差异或经财务签字后批次才能提交（ADR-0036 第 8 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 不用 Reconciliation：已批准术语「经营勾稽」Reconciliation 指跨口径对账
- id: period_status__historical
  zh: 历史期间
  en: Historical
  snake: historical
  kind: value
  bc: accounting.period
  definition: 期间状态的一个取值，终态：FORCITIS one 首个业务期间之前的 (期间, 法人)，永不接受业务过账，只接受迁入过账通道；不逐期关账、不发关账事件（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: low
  aliases: []
  forbidden: []
  status: proposed
  note: 会计类用语，待财务确认（ADR-0018；ADR-0036 U-3）
- id: migration_period_reservation
  zh: 迁入占用
  en: MigrationPeriodReservation
  snake: migration_period_reservation
  kind: entity
  bc: accounting.period
  definition: 迁入批次对 (期间, 法人) 的占用登记，由 accounting.period 自持；有未解除占用的期间不得关账，批次转为提交中时加锁确认期间状态（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_marker
  zh: 迁入标记
  en: MigrationMarker
  snake: migration_marker
  kind: value
  bc: operations.facts
  definition: 事实行上区分原生与迁入的标记；只在事实行，单据表不带；accounting.ledger 不为迁入标记的事实生成分录（ADR-0036 第 5、6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 列名在实现 PR 中按 NAMING_STANDARD 定
- id: migration_posting_channel
  zh: 迁入过账通道
  en: MigrationPostingChannel
  snake: migration_posting_channel
  kind: entity
  bc: operations.facts
  definition: operations.facts 中只供迁入用例使用的过账入口：期间可为历史期间或开放期间，不发布事件（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_staging
  zh: 迁入暂存
  en: MigrationStaging
  snake: migration_staging
  kind: entity
  bc: platform.integration
  definition: 来源行转换为目标形状后存放的集成层暂存表（Flyway 按对象类型建固定表，带批次列、来源键、摘要与核对所需来源取值）；试提交与核对都针对它，核对通过后才提交目标库（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 暂存只有一份，不另存来源快照
- id: trial_commit
  zh: 试提交
  en: TrialCommit
  snake: trial_commit
  kind: entity
  bc: platform.migration
  definition: 用与正式提交同一套代码把整批写入目标库后回滚事务，以跑全部领域校验与数据库约束（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__staging
  zh: 暂存中
  en: Staging
  snake: staging
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：正在抽取、转换与暂存，可试提交（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__awaiting_tie_out
  zh: 待核对
  en: AwaitingTieOut
  snake: awaiting_tie_out
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：暂存与试提交完成，等待核对通过或签字（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__committing
  zh: 提交中
  en: Committing
  snake: committing
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：核对已通过，正在分块提交目标库（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__effective
  zh: 已生效
  en: Effective
  snake: effective
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：提交后复核一致；可转为已冲销（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__reversed
  zh: 已冲销
  en: Reversed
  snake: reversed
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：提交阶段失败或生效后发现错误，事实行已整批冲销，终态；重跑为新批次（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__abandoned
  zh: 已放弃
  en: Abandoned
  snake: abandoned
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：提交前放弃，目标库未受影响，终态（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: source_reference_status
  zh: 对照状态
  en: SourceReferenceStatus
  snake: source_reference_status
  kind: value
  bc: platform.integration
  definition: 来源对照行的状态：当前 CURRENT / 已冲销 REVERSED；只有事实类对照可为已冲销，冲销与关闭旧对照同一事务（ADR-0036 第 3、9 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 与确认状态 confirmation_status 是两列；自然键只约束已确认且当前的行；取值「已冲销」REVERSED 与迁入批次状态的「已冲销」同词同义，不另登记
- id: source_reference_status__current
  zh: 当前
  en: Current
  snake: current
  kind: value
  bc: platform.integration
  definition: 对照状态取值：该对照仍指向有效的自有行（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: source_row_digest
  zh: 来源行摘要
  en: SourceRowDigest
  snake: source_row_digest
  kind: value
  bc: platform.integration
  definition: 来源行规范化后的 SHA-256，存于来源对照与暂存行，用于重跑时判断同一来源行是否变化（ADR-0036 第 3、7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
common_words:
# HTTP 约定中的批量命令后缀 :{动作}-batch 与计数端点 :count（NAMING_STANDARD §2.6 A-3、A-6）
- batch
- count
