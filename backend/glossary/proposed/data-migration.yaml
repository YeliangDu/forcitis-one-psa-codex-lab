terms:
- id: migration_batch
  zh: 迁入批次
  en: MigrationBatch
  snake: migration_batch
  kind: entity
  bc: platform.integration
  definition: 一次历史数据迁入运行；登记来源系统、对象类型、范围、状态、行数与来源 ID 摘要；批次挂在来源对照与原编号对照上，业务表不带批次列（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden:
  - 导入批次
  status: proposed
  note: 用户 2026-10-15 定批次术语唯一写法；platform.numbering 的 import_batch 在 R-1b 改为 migration_batch_id，同一提交把 import_batch / ImportBatch 加入本条 forbidden（现在加会使 G38 在改名前的代码上失败）
- id: migration_reject
  zh: 迁入拒收
  en: MigrationReject
  snake: migration_reject
  kind: entity
  bc: platform.integration
  definition: 迁入时被拒绝的一条来源行，带批次、来源对象、来源 ID 与原因代码；批次生效前须逐条处置（修正后重跑或确认不迁）（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_tie_out
  zh: 迁入核对
  en: MigrationTieOut
  snake: migration_tie_out
  kind: entity
  bc: platform.integration
  definition: 一个迁入批次按期间 × 法人 × 对象类型比对来源快照与目标的行数、金额合计、来源 ID 摘要与按来源单号的行数金额的结果；零差异或经财务签字后批次才生效（ADR-0036 第 8 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 不用 Reconciliation：已批准术语「经营勾稽」Reconciliation 指跨口径对账；tie-out 指核对合计是否一致
- id: period_status__historical
  zh: 历史期间
  en: Historical
  snake: historical
  kind: value
  bc: accounting.period
  definition: 期间状态的一个取值，终态：FORCITIS one 首个业务期间之前的 (期间, 法人)，永不接受业务过账，只接受迁入过账通道；不逐期关账、不发关账事件（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: low
  aliases: []
  forbidden: []
  status: proposed
  note: 会计类用语，待财务确认（ADR-0018；ADR-0036 U-3）；期间状态现为 OPEN / CLOSING / CLOSED（period_status）
common_words:
# HTTP 约定中的批量命令后缀 :{动作}-batch 与计数端点 :count（NAMING_STANDARD §2.6 A-3、A-6）
- batch
- count
