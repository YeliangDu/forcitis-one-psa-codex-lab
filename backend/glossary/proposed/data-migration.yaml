# 迁入的其余用语（拒收、核对、历史期间、迁入标记等）随 ADR-0036（另行 PR）登记。
# 通用词另增 `batch`、`count`（批量命令后缀与计数端点，NAMING_STANDARD §2.6 A-3、A-6）。
terms:
- id: migration_period_reservation
  zh: 迁入占用
  en: MigrationPeriodReservation
  snake: migration_period_reservation
  kind: entity
  bc: accounting.period
  scope: acl
  acl_class: "过渡期"
  definition: 迁入批次对 (期间, 法人) 的占用登记，由 accounting.period 自持；有未解除占用的期间不得关账，批次转为提交中时加锁确认期间状态（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_marker
  zh: 迁入标记
  en: MigrationMarker
  snake: migration_marker
  kind: value_object
  bc: operations.facts
  scope: domain
  definition: 事实行上区分原生与迁入的标记；只在事实行，单据表不带；accounting.ledger 不为迁入标记的事实生成分录（ADR-0036 第 5、6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 列名在实现 PR 中按 NAMING_STANDARD 定
- id: migration_posting_channel
  zh: 迁入过账通道
  en: MigrationPostingChannel
  snake: migration_posting_channel
  kind: entity
  bc: operations.facts
  scope: acl
  acl_class: "过渡期"
  definition: operations.facts 中只供迁入用例使用的过账入口：期间可为历史期间或开放期间，不发布事件（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: trial_commit
  zh: 试提交
  en: TrialCommit
  snake: trial_commit
  kind: command
  bc: platform.migration
  scope: acl
  acl_class: "过渡期"
  definition: 用与正式提交同一套代码把整批写入目标库后回滚事务，以跑全部领域校验与数据库约束（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__effective
  zh: 已生效
  en: Effective
  snake: effective
  kind: value_object
  bc: platform.integration
  scope: domain
  definition: 迁入批次状态取值：提交后复核一致；可转为已冲销（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
common_words:
# HTTP 约定中的批量命令后缀 :{动作}-batch 与计数端点 :count（NAMING_STANDARD §2.6 A-3、A-6）
- batch
- count
