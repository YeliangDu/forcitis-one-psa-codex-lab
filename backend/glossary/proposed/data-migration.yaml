terms:
- id: migration_batch
  zh: 迁入批次
  en: MigrationBatch
  snake: migration_batch
  kind: entity
  bc: platform.integration
  definition: 一次历史数据迁入运行；登记来源系统、对象类型、范围、状态、行数与来源 ID 摘要；批次挂在来源对照与原编号对照上，业务表不带批次列
  standard_ref:
  - 用户 2026-10-15 批次术语统一
  - ADR-0036 历史数据迁入（提议，另行 PR）
  confidence: medium
  aliases: []
  forbidden:
  - 导入批次
  status: proposed
  note: 用户 2026-10-15 定批次术语唯一写法；与 #139 分支 data-migration.yaml 同一条，合并时删去一处；platform.numbering 的 import_batch 在 R-1b 改为 migration_batch_id，同一提交把 import_batch / ImportBatch 加入本条 forbidden（现在加会使 G38 在改名前的代码上失败）
common_words:
# HTTP 约定中的批量命令后缀 :{动作}-batch 与计数端点 :count（NAMING_STANDARD §2.6 A-3、A-6）
