terms:
- id: migration_batch
  zh: 迁入批次
  en: MigrationBatch
  snake: migration_batch
  kind: entity
  bc: platform.integration
  definition: 一次历史数据迁入运行；登记来源系统、对象类型、范围、状态、行数与来源 ID 摘要；批次挂在来源对照与原编号对照上，业务表不带批次列（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden:
  - 导入批次
  status: proposed
  note: 用户 2026-10-15 定批次术语唯一写法；platform.numbering 的 import_batch 在 R-1b 改为 migration_batch_id，同一提交把 import_batch / ImportBatch 加入本条 forbidden（现在加会使 G38 在改名前的代码上失败）
- id: migration_reject
  zh: 迁入拒收
  en: MigrationReject
  snake: migration_reject
  kind: entity
  bc: platform.integration
  definition: 迁入时被拒绝的一条来源行，带批次、来源对象、来源 ID 与原因代码；批次生效前须逐条处置（修正后重跑或确认不迁）（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_tie_out
  zh: 迁入核对
  en: MigrationTieOut
  snake: migration_tie_out
  kind: entity
  bc: platform.integration
  definition: 一个迁入批次按期间 × 法人 × 对象类型比对来源快照与目标的行数、金额合计、来源 ID 摘要与按来源单号的行数金额的结果；零差异或经财务签字后批次才生效（ADR-0036 第 8 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 不用 Reconciliation：已批准术语「经营勾稽」Reconciliation 指跨口径对账；tie-out 指核对合计是否一致
- id: period_status__historical
  zh: 历史期间
  en: Historical
  snake: historical
  kind: value
  bc: accounting.period
  definition: 期间状态的一个取值，终态：FORCITIS one 首个业务期间之前的 (期间, 法人)，永不接受业务过账，只接受迁入过账通道；不逐期关账、不发关账事件（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: low
  aliases: []
  forbidden: []
  status: proposed
  note: 会计类用语，待财务确认（ADR-0018；ADR-0036 U-3）；期间状态现为 OPEN / CLOSING / CLOSED（period_status）
- id: migration_marker
  zh: 迁入标记
  en: MigrationMarker
  snake: migration_marker
  kind: value
  bc: operations.facts
  definition: 事实行上区分原生与迁入的标记（取值原生 / 迁入）；只在事实行，单据表不带；accounting.ledger 不为迁入标记的事实生成分录（ADR-0036 第 5、6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 列名在实现 PR 中按 NAMING_STANDARD 定
- id: migration_posting_channel
  zh: 迁入过账通道
  en: MigrationPostingChannel
  snake: migration_posting_channel
  kind: entity
  bc: operations.facts
  definition: operations.facts 中只供迁入用例使用的过账入口：期间可为历史期间或开放期间，不发布事件（ADR-0036 第 6 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: source_snapshot
  zh: 来源快照
  en: SourceSnapshot
  snake: source_snapshot
  kind: entity
  bc: platform.integration
  definition: 批次开始时一次读出的来源行，存目标库按批次的快照表，抽取完成后只读；批次只从快照读取（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 与组织同步的「组织快照」OrgSnapshot 不同
- id: migration_staging
  zh: 迁入暂存
  en: MigrationStaging
  snake: migration_staging
  kind: entity
  bc: platform.integration
  definition: 来源快照转换为目标形状后存放的集成层暂存表；校验与核对都针对它，核对通过后才提交目标库（ADR-0036 第 7 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__staging
  zh: 暂存中
  en: Staging
  snake: staging
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：快照已冻结，正在转换、暂存与校验（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__awaiting_tie_out
  zh: 待核对
  en: AwaitingTieOut
  snake: awaiting_tie_out
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：暂存完成，等待核对通过或签字（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__committing
  zh: 提交中
  en: Committing
  snake: committing
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：核对已通过，正在分块提交目标库（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__effective
  zh: 已生效
  en: Effective
  snake: effective
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：提交后复核一致，终态（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__reversed
  zh: 已冲销
  en: Reversed
  snake: reversed
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：提交阶段失败或生效后发现错误，事实行已整批冲销，终态；重跑为新批次（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: migration_batch_status__abandoned
  zh: 已放弃
  en: Abandoned
  snake: abandoned
  kind: value
  bc: platform.integration
  definition: 迁入批次状态取值：提交前放弃，目标库未受影响，终态（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: source_reference_status
  zh: 对照状态
  en: SourceReferenceStatus
  snake: source_reference_status
  kind: value
  bc: platform.integration
  definition: 来源对照行的状态：当前 CURRENT / 已冲销 REVERSED；只有事实类对照可为已冲销，冲销与关闭旧对照同一事务（ADR-0036 第 3、9 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 与确认状态 confirmation_status 是两列；自然键只约束已确认且当前的行
- id: source_reference_status__current
  zh: 当前
  en: Current
  snake: current
  kind: value
  bc: platform.integration
  definition: 对照状态取值：该对照仍指向有效的自有行（ADR-0036 第 3 条）
  standard_ref:
  - ADR-0036 历史数据迁入
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
common_words:
# HTTP 约定中的批量命令后缀 :{动作}-batch 与计数端点 :count（NAMING_STANDARD §2.6 A-3、A-6）
- batch
- count
