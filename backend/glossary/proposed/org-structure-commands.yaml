# 组织结构命令与组织一侧的法人归属会签（设计 docs/architecture/proposals/org-structure-commands.md，#897；one-design 2026-10-30，#911）。中文名用户已确认（2026-10-30「采纳」，经 lead 转达）。
terms:
- id: org_structure_command
  zh: 组织结构命令
  en: OrgStructureCommand
  snake: org_structure_command
  kind: aggregate
  bc: organization.workforce
  scope: domain
  definition: 组织单元新建、撤销、调整属性、合并、调整上级、指定负责人、指定区域应收负责人、指定法人，以及岗位新建、停用的第一手记录，只追加；组织单元与岗位命令同表，按目标种类归属组织单元或岗位
  standard_ref:
  - ADR-0068 第 4 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，「采纳」，经 lead 转达，#911）
  note: ADR-0068 待登记用语「组织命令」；表 org_structure_commands（#905）；#907 起代码里以聚合根承载命令自己的事件（序号 1，聚合类型 OrgStructureCommand），故种类由 entity 改 aggregate，待 one-design 核定
- id: set_attributes
  zh: 调整属性
  en: SetAttributes
  snake: set_attributes
  kind: command
  bc: organization.workforce
  scope: domain
  definition: 组织结构命令种类之一，只用于组织单元：一条命令表达一次完整调整，可改名称、简称、总部或区域、是否交付单元，至少改一项；取代原「改名」
  standard_ref:
  - ADR-0073 第 2 条第 1 项
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，「采纳」，经 lead 转达，#911）
  note: 种类值 SET_ATTRIBUTES；原暂名 RENAME 不再用
- id: assign_legal_entity
  zh: 指定法人
  en: AssignLegalEntity
  snake: assign_legal_entity
  kind: command
  bc: organization.workforce
  scope: domain
  definition: 组织结构命令种类之一，只用于组织单元：写部门到法人的对照（组织单元法人归属期间）；使员工成本法人变化时进待法人归属会签
  standard_ref:
  - ADR-0073 第 3 条第 2 项
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，「采纳」，经 lead 转达，#911）
  note: 种类值 ASSIGN_LEGAL_ENTITY；人事一侧的对应种类为「变更法人归属」change_legal_entity
- id: attribution_countersign_basis
  zh: 法人归属会签依据
  en: AttributionCountersignBasis
  snake: attribution_countersign_basis
  kind: value_object
  bc: organization.workforce
  scope: domain
  definition: 组织结构命令登记时计算的、成本法人将变化的员工清单，每人记变更前与变更后的成本法人；财务据此会签，合并逐人执行时与之比对决定是否免会签
  standard_ref:
  - ADR-0073 第 3 条第 4 项
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  confirmed: 2026-10-30（用户，「采纳」，经 lead 转达，#911）
  note: ADR-0073 原文「会签依据」，按用户 2026-10-30 对「会签」一律限定为「法人归属会签」的改名，表名建议 attribution_countersign_bases（#908；设计说明暂写 org_structure_countersign_bases）
