- id: need
  zh: 需经会签
  en: Need
  snake: need
  kind: value_object
  bc: organization.workforce
  scope: domain
  definition: 合并预览每行的 needsAttributionCountersign 字段里的动词词根（中文名取「需经会签」，不注册裸动词「需要」，它与普通文案冲突）；该行的合并会改变其成本法人而需要法人归属会签（#910 评议 6588705997 定的 JSON 字段名）
