- id: rejected_state
  zh: 已拒绝
  en: RejectedState
  snake: rejected_state
  kind: state
  bc: platform.integration
  scope: acl
  acl_class: "长期"
  definition: 来源对照的确认状态之一：登记的对照被另一个人拒绝，不占自然键约束，不用于出站
  standard_ref:
  - adr/ADR-0033.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: '展示用语；对应确认状态 REJECTED。与审批的「驳回」（Reject，platform.approval，审批人对任务给出不同意的结论）不是一回事：这里是另一个人不接受一条登记的来源对照，中文写「已拒绝」，英文命令写 Reject 时不得显示成「驳回」。确认状态的写法：编号规则版本为 PENDING_CONFIRMATION / CONFIRMED，来源对照为 PENDING / CONFIRMED / REJECTED，中文都是待确认 / 已确认 / 已拒绝（ADR-0033 第 2 项第 1 条）'
