- id: source_reference
  zh: 来源对照
  en: SourceReference
  snake: source_reference
  kind: entity
  bc: platform.integration
  scope: acl
  acl_class: "过渡期"
  definition: 外部系统或老系统中一个对象的标识与 FORCITIS one 自有 ID 的对应；只在集成层，领域只用自有 ID；同一来源系统、同一类别下来源 ID 与自有 ID 在任一时点各自唯一
  standard_ref:
  - adr/ADR-0033.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ADR-0033 登记；权限码 platform.integration:source-reference:update（授予组织数据管理员）、platform.integration:source-reference:approve（核算组织编码四眼确认，授予业务管理员），授予方式均为 INDIVIDUAL
- id: source_system
  zh: 来源系统
  en: SourceSystem
  snake: source_system
  kind: enum
  bc: platform.integration
  scope: acl
  acl_class: "过渡期"
  definition: 来源对照所属的外部系统，取值为组织源（ORG_SOURCE）、老系统（LEGACY_SYSTEM）、核算系统（ACCOUNTING_SYSTEM），只在集成层与迁入登记中出现
  standard_ref:
  - adr/ADR-0033.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 数据库列叫 source_system，Java 枚举叫 ExternalSource（platform.integration.api），因为 kernel.event.SourceSystem（ONE / MIGRATION）表示事件出自新系统还是历史迁入，是另一回事，不改名
