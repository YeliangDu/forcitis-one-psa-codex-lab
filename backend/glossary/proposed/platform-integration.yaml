- id: read_only_verification
  zh: 只读核实
  en: ReadOnlyVerification
  snake: read_only_verification
  kind: command
  bc: platform.integration
  definition: 运维命令：对一条只读外部连接的登录跑与启动校验同一套判定，逐项（ADR-0037 第 4 项 (a)–(g)）输出核实通过、确认违规或判定不了，判定不了时只带 SQL 错误号与 SQLState，按结果给退出码；不输出数据、消息原文与凭据，不监听端口、不迁移、不起作业，口令只从环境读
  standard_ref:
  - adr/ADR-0037.md
