# B2 登记：代码里的聚合根与领域事件各自要有词条（G40、G41）；
# 登记会话 one-glossary，2026-10-15，中文名待用户确认。
terms:
- id: timesheet_cancelled
  zh: 工时单审批已撤销
  en: TimesheetCancelled
  snake: timesheet_cancelled
  kind: domain_event
  bc: cost.timesheet
  scope: domain
  definition: 填报人撤销审批，工时单回到草稿；不记为驳回；以工作日期记业务日
  standard_ref:
  - events/timesheet.yaml (RULE-279)
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 类名 Cancelled 与「撤销审批」略不符，类名是否改为 ApprovalWithdrawn 之类待确认
- id: approval_task_overdue
  zh: 任务已超时
  en: ApprovalTaskOverdue
  snake: approval_task_overdue
  kind: domain_event
  bc: platform.approval
  scope: domain
  definition: 任务超过审批时限仍未处理；只提醒，不自动通过，计入时效统计
  standard_ref:
  - events/approval.yaml
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 类名 Overdue 是形容词而非过去式，是否改为 ApprovalTaskTimedOut 待确认
- id: task_resulted
  zh: 任务已出结果
  en: TaskResulted
  snake: task_resulted
  kind: domain_event
  bc: platform.approval
  scope: domain
  definition: 任务被办理（通过、驳回、退回），或系统自动通过；加签人的驳回只记意见，不结束本轮
  standard_ref:
  - events/approval.yaml (RULE-273, RULE-291, RULE-302)
  confidence: low
  aliases: []
  forbidden: []
  status: proposed
  note: 类名与已确认用语冲突：第三轮 R3-AP-60 已定为「任务已办理 / TaskHandled」，该词条已在词表；代码类名应改为 TaskHandled，改名后本条作废
- id: role_deleted
  zh: 角色已废除
  en: RoleDeleted
  snake: role_deleted
  kind: domain_event
  bc: platform.identity
  scope: domain
  definition: 一个角色被废除，不再可用
  standard_ref:
  - events/identity.yaml
  confidence: low
  aliases: []
  forbidden: []
  status: proposed
  note: 事件目录称「角色删除」；「删除」属技术泛词，业务说法（废除/撤销）待用户确认
- id: source_reference_registration_refused
  zh: 来源对照登记已被拒绝
  en: SourceReferenceRegistrationRefused
  snake: source_reference_registration_refused
  kind: domain_event
  bc: platform.integration
  scope: domain
  definition: 有人试图人工登记只能由同步或导入写入的来源对照，被拒绝，未存储任何对照
  standard_ref:
  - events/integration.yaml
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 聚合 SourceReferenceRefusal；类名 RegistrationRefused 与聚合名有重复
