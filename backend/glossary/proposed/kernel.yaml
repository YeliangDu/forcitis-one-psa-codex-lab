- id: tail_adjustment
  zh: 尾调
  en: TailAdjustment
  snake: tail_adjustment
  kind: value
  bc: presales.quoting
  definition: 报价整单的人工调整额：最终报价 = 行合计 + 尾调，审批单显示尾调金额及其占行合计的比例（RULE-142）；与舍入产生的舍入差是两个概念
  standard_ref:
  - RULE-142
  - CROSS_CUTTING_MATRIX.md §3.1
  confidence: medium
  aliases:
  - name: 尾差
    type: dialect
    deprecated: true
    source: 老系统报价（RULE-142 原称）；同一词也被用来指舍入差，一词两义，新系统不用
  forbidden:
  - 尾差
  status: proposed
  note: 用户 2026-10-15 XD-07「同意 (Recommended)」（intent 2026-10-15-214100-one-coordinator-横切决定单-XD-07）
- id: rounding_residual
  zh: 舍入差
  en: RoundingResidual
  snake: rounding_residual
  kind: value
  bc: kernel
  definition: 金额按统一口径舍入到分后，各份之和与总额之间的分厘差；由按权重拆分按既定规则分配，使各份之和恰等于总额
  standard_ref:
  - CROSS_CUTTING_MATRIX.md §3.3
  confidence: medium
  aliases:
  - name: 尾差
    type: dialect
    deprecated: true
    source: 老系统分摊（RULE-069「尾差标志位」等）；一词两义，新系统不用
  forbidden: []
  status: proposed
  note: 用户 2026-10-15 XD-07「同意 (Recommended)」；「尾差」的禁用登记在 tail_adjustment，一处即可
- id: prorate
  zh: 按权重拆分
  en: Prorate
  snake: prorate
  kind: command
  bc: kernel
  definition: 把一笔金额按一组非负权重拆成若干份，各份之和恰等于原额，舍入差按最大余数法分配，结果确定、可镜像；是 kernel 的金额原语，不是业务动作「间接成本分摊」（allocate_indirect_cost）
  standard_ref:
  - CROSS_CUTTING_MATRIX.md §3.3
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 用户 2026-10-15 XD-07「同意 (Recommended)」、XD-08「先按建议建 (Recommended)」
- id: reversal_document
  zh: 冲销单
  en: ReversalDocument
  snake: reversal_document
  kind: document
  bc: kernel
  definition: 只冲不重做的更正单据，用于退回或撤销，可全额也可部分；与原单同一单据类型、各为单一聚合，引用记在冲销单上，原单不写入
  standard_ref:
  - ADR-0031 第 2 项第 2 条
  - ADR-0016 第 2 条
  - ADR-0022 第 2 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）。建议已批准词条「冲销」（reversing_entry）的 bc 由 operations.facts 改为通用，本条不改 terms.yaml；冲销单是单据层，「冲销」是事实层的更正方式，二者关系一并确认
- id: correction_document
  zh: 修正单
  en: CorrectionDocument
  snake: correction_document
  kind: document
  bc: kernel
  definition: 完成一次冲销重做的更正单据，自带被更正单据引用，生效时冲尽被更正单据的剩余并按新内容重做；单一聚合，一个编号、一次审批、一个过账批；不得改变法人
  standard_ref:
  - ADR-0031 第 2 项第 2、4 条
  - SESSION_PLAYBOOK §12.3
  confidence: medium
  aliases:
  - name: 重做
    type: synonym
    deprecated: false
    source: ADR-0031 第 8 项第 1 条列为修正单的同义词；修正单完成的动作沿用已有叫法「冲销重做」
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）。「事实重述」（business_fact_restated）、「成本调整」（cost_adjustment）、「期间调整」（period_adjustment）都描述落当期、引用原事实的更正，在本模式下分别对应修正单或差错类冲销单的事实层效果；合并为别名还是保留，待用语确认，本条不改 terms.yaml
- id: document_nature
  zh: 单据性质
  en: DocumentNature
  snake: document_nature
  kind: enum
  bc: kernel
  definition: 单据在冲销与修正模式中的身份，取原单、冲销单、修正单三者之一；冲销行存正数量与正金额，符号由单据性质决定
  standard_ref:
  - ADR-0031 第 2 项第 2 条、第 7 项第 3、4 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）；对应共用构件 K2
- id: reversal_category
  zh: 冲销类别
  en: ReversalCategory
  snake: reversal_category
  kind: enum
  bc: kernel
  definition: 冲销的缘由，取差错或业务冲回之一；差错落开放期间并标注原期间，业务冲回如客户退回按其业务日期落账期间判定
  standard_ref:
  - ADR-0031 第 5 项第 1、2 条
  - FQ-29
  confidence: low
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4，会计用语由财务）；两个取值的分别落账待 FQ-29 答复（F-2）
- id: reversible_balance
  zh: 可冲销余额
  en: ReversibleBalance
  snake: reversible_balance
  kind: metric
  bc: kernel
  definition: 原单某行尚可被冲销的金额，等于原额减去已生效冲销合计；按已通过的冲销单与修正单计算（含待过账），不按已过账事实；冲销单不可再被冲销
  standard_ref:
  - ADR-0031 第 2 项第 5 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）；只出现在读模型与校验，不回写原单
- id: derived_reversal
  zh: 派生冲销
  en: DerivedReversal
  snake: derived_reversal
  kind: entity
  bc: kernel
  definition: 上游单据被冲销后，由下游引用方按冲销事件自动生成的冲销，如收入确认单被冲销后配对成本的冲回；继承上游，不另审批，期间取上游实际落账期间
  standard_ref:
  - ADR-0031 第 6 项
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）；比例与期间待 FQ-28、FQ-29 答复（F-1、F-2）
- id: original_period
  zh: 原期间
  en: OriginalPeriod
  snake: original_period
  kind: value
  bc: kernel
  definition: 被冲销或被更正的单据所属的会计期间；冲销或更正落在开放期间时标注，与实际落账期间分开记录
  standard_ref:
  - ADR-0016 第 2 条
  - proposals/EVENT_ANALYTICS_FIELDS.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）；过账事件字段 originalPeriod 的单据层对应，属共用构件 K3 的组成部分
- id: change_order_document
  zh: 变更单
  en: ChangeOrderDocument
  snake: change_order_document
  kind: document
  bc: contract.changeorder
  definition: 合同变更的单据形态；合同变更是新的业务事实，向前记录而不覆盖原合同，锁定后不就地修改，单据本身有错时用取代版本
  standard_ref:
  - ADR-0031 第 1 项第 3 条
  - OA_PROCESS_INVENTORY.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项、U-4）。已批准词条「变更」（change_order，en ChangeOrder）是概念，本条是其单据形态；二者是否合并，或把「变更单」并入 change_order 的中文别名，待用语确认，本条不改 terms.yaml
- id: reverse_action
  zh: 冲销动作
  en: ReverseAction
  snake: reverse_action
  kind: command
  bc: kernel
  definition: 权限码与接口中发起冲销的动作 reverse，对应路径 :reverse，授予范围与该单据的提交权限相同
  standard_ref:
  - ADR-0031 第 7 项第 6 条
  - ADR-0022 第 125 行
  - U8C_CAPABILITY_MAP.md §2.3
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项）。reverse 与 ADR-0022:125 提议在 standard_actions 增加的 post、reverse、close、reopen 合并评审，本条不改 standard_actions；是否属于敏感权限见 ADR-0031 U-1
- id: correct_action
  zh: 修正动作
  en: CorrectAction
  snake: correct_action
  kind: command
  bc: kernel
  definition: 权限码与接口中发起修正单的动作 correct，对应路径 :correct，授予范围与该单据的提交权限相同
  standard_ref:
  - ADR-0031 第 7 项第 6 条
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 待用语确认（ADR-0031 第 8 项）。correct 随 reverse 与 ADR-0022:125 的提议合并评审，本条不改 standard_actions；是否属于敏感权限见 ADR-0031 U-1
