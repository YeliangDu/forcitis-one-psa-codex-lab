# F-1 数据范围新增术语（proposed，待 one-glossary 评审，ADR-0018）。第 1 块（#728）：两张自定义部门子表与两个错误码。
# 已批准、直接用：custom_org_unit、include_descendants、access_scope、authorization_request；提议中的 role_version 见 platform-identity.yaml。
terms:
