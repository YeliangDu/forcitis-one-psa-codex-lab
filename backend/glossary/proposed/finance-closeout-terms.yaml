- id: labor_cost_allocation_variance
  zh: 人工成本分配差异
  en: LaborCostAllocationVariance
  snake: labor_cost_allocation_variance
  kind: metric
  bc: cost.costing
  scope: domain
  definition: 每月按员工把「按实际成本费率计价的合计 − 当月实际薪酬（含加班费）」记为差异，挂员工所在部门，计期间损益，不进项目；如 7.5 到 8 小时段按 1 倍计价超出日薪的部分（INV-89 改写后项目分配额加差异等于实际人工成本）；这个差异科目是设计（BONUS_OVERTIME_COSTING §2.4，one-architecture 2026-10-22 认可），不是用户原话
  standard_ref:
  - 'closeout/finance（one-arch-finance）'
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
  formula: 当月按实际成本费率计价的人工成本合计减当月实际薪酬（含加班费）
  grain: 按员工、月
  as_of: 月度人工成本分配运行时点的工时与已核算薪酬
