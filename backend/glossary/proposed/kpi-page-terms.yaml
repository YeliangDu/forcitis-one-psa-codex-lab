- id: available_hours
  zh: 可用工时
  en: AvailableHours
  snake: available_hours
  kind: metric
  bc: cost.timesheet
  scope: domain
  definition: 员工在期间内可供使用的工时，来自工作日历扣除休假后的小时数；利用率的分母（可计费工时 / 可用工时）
  standard_ref:
  - docs/data/metric-baseline/baseline-draft.md
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
  formula: 期间内全部在职员工按工作日历扣除休假后的可工作小时数合计
  grain: 按员工、部门、期间
  as_of: 按期间末时点的工作日历与考勤
- id: default_payment_term
