terms:
- id: counterparty
  zh: 往来单位
  en: Counterparty
  snake: counterparty
  kind: aggregate
  bc: masterdata.counterparty
  scope: domain
  definition: 与我方发生业务往来的法律主体（企业、事业单位或自然人）的主数据：唯一法定标识，合并保留历史；客户、供方、联合体成员、建设单位等是它带准入状态的角色，不是不同的主体。不含我方法人（法人主体，组织人事）和员工。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-01
  - 会计基础工作规范（往来结算）
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 与 presales.customer 的 customer（客户）定义同源，处置见确认单 B2-X02；英文 Counterparty 取 IFRS 9 通行写法
- id: construction_project
  zh: 建设工程
  en: ConstructionProject
  snake: construction_project
  kind: aggregate
  bc: masterdata.counterparty
  scope: domain
  definition: 建设单位的工程项目的外部引用登记（含竣工在用后成为受检对象的工程）：被售前、交付执行、合同、检查共同引用，位于最上游；内含我方参与记录和往来单位角色（建设单位、业主、物业，带起止）。不是我方交付的项目（项目 project）。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-33
  - 《建设工程质量管理条例》
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 本条不在草案 §8 清单内，因我方参与记录需要其聚合名而一并提议
- id: own_participation_record
  zh: 我方参与记录
  en: OwnParticipationRecord
  snake: own_participation_record
  kind: entity
  bc: masterdata.counterparty
  scope: domain
  definition: 建设工程内记录我方在该工程中承担的角色及对应的我方项目（项目 ID 由交付登记）；一个工程可有多条，只作回溯线索，不触发校验。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-33
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: tender_project
  zh: 招标项目
  en: TenderProject
  snake: tender_project
  kind: aggregate
  bc: masterdata.counterparty
  scope: domain
  definition: 依《招标投标法》公开或邀请招标的项目登记（招标标识、采购方式、标段），外部引用登记，被投标、合同和建设工程共同引用。草案称「招标项目登记」，登记是动作，名词取「招标项目」。与我方项目（project）不是一回事。
