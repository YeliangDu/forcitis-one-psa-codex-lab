# 全企业聚合草案 §8 交 one-glossary 的新用语（预判登记稿，proposed，待业务评审，ADR-0018）。
# 前提：bcs.yaml 先并入 bcs-additions.yaml 中的 masterdata.*、organization.leave、accounting.tax 等；需要用户裁定的 11 项不在此文件，见 decide-items.json。
# 聚合所在 bc 暂取现有 bc（presales.quoting、contract.baseline 等），B2-X01 定合并后的 BC 标识后整体迁移。
terms:
- id: tender_project
  zh: 招标项目
  en: TenderProject
  snake: tender_project
  kind: aggregate
  bc: masterdata.counterparty
  scope: domain
  definition: 依《招标投标法》公开或邀请招标的项目登记（招标标识、采购方式、标段），外部引用登记，被投标、合同和建设工程共同引用。草案称「招标项目登记」，登记是动作，名词取「招标项目」。与我方项目（project）不是一回事。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md REF-01
  - 《中华人民共和国招标投标法》
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 若架构定为不建聚合（REF，无聚合），kind 改 entity
- id: output_invoice
  zh: 销项发票
  en: OutputInvoice
  snake: output_invoice
  kind: aggregate
  bc: receivables.wip
  scope: domain
  definition: 我方向客户开具的增值税发票（蓝字、红字），含平台开具结果与红冲确认；与开票事件（invoice_issued，开票）的关系是：销项发票是对象，开票是它被开具这件事。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-46
  - 《增值税暂行条例》销项税额
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 英文取 output tax 的通行写法；若偏好 SalesInvoice 可改，中文名不变
- id: supplier_agreement
  zh: 供方协议
  en: SupplierAgreement
  snake: supplier_agreement
  kind: aggregate
  bc: procurement.subcontracting
  scope: domain
  definition: 我方与供方（分包方、采购供应商、出租方、保险人、居间人、劳务派遣单位）签订的协议，含基线、付款条件、质保金条款以及资质与同意证据；与客户侧收入协议（agreement，协议）相对。「供方」取 GB/T 19000 用语。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-55
  - GB/T 19000 供方
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 词表 agreement_type__lease_contract 等五个供方侧协议类型现登记在 contract.baseline，随本条迁入采购子域，见 PREJUDGE
- id: design_change_claim_status
  zh: 设计变更主张状态
  en: DesignChangeClaimStatus
  snake: design_change_claim_status
  kind: state
  bc: delivery.acceptance
  scope: domain
  definition: 设计变更是否向对方主张：待主张，或不主张（附理由）；是否已主张由合同侧的变更、索赔记录，本 BC 不引用它们。草案称「主张标记」，标记是实现用语，业务上是状态。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-30
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: project_terminated
  zh: 项目已终止
  en: ProjectTerminated
  snake: project_terminated
  kind: domain_event
  bc: delivery.execution
  scope: domain
  definition: 项目在完成前被终止（有成本发生）；成本核算侧订阅，用于终止清算。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-19
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: ''
- id: project_cancelled
  zh: 项目已取消
  en: ProjectCancelled
  snake: project_cancelled
  kind: domain_event
  bc: delivery.execution
  scope: domain
  definition: 项目在开工前被取消（无成本发生）；与终止的区别在是否已有成本。
  standard_ref:
  - ENTERPRISE_AGGREGATES_DRAFT.md AGG-19
  confidence: medium
