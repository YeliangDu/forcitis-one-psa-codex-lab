# 文件服务存放位置用语（one-glossary 2026-10-21，NAM-1021-GLO-04；技术设施词，proposed）。
terms:
- id: staging_area
  zh: 临时区
  en: StagingArea
  snake: staging_area
  kind: value_object
  bc: platform.file
  scope: domain
  definition: 对象存储里放已通过检测、尚未关联到业务单据的文件内容的前缀（键 <环境前缀>/staging/<来源>/<文件 ID>），时效按来源由生命周期规则决定；关联时复制到正式键
  standard_ref:
  - ADR-0060 决定 5；ADR-0070 决定 2
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: '口语「临时上传区」不入词表；与迁入暂存、检测暂存目录不同层，见 docs/glossary/arch-naming/nam-1021-glo-04.md'
- id: inspection_staging_directory
  zh: 检测暂存目录
  en: InspectionStagingDirectory
  snake: inspection_staging_directory
  kind: value_object
  bc: platform.file
  scope: domain
  definition: 后端实例本地磁盘上的专用目录，上传流先落盘于此、算哈希并交病毒检测，通过后才写入临时区；不对外签发链接，由年龄清扫作业清理
  standard_ref:
  - ADR-0070 决定 3
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: 'ADR-0070 暂名「本地检测暂存目录」，去掉「本地」（目录本就在实例本地，不是区别项）'
- id: quarantine_prefix
  zh: 隔离前缀
  en: QuarantinePrefix
  snake: quarantine_prefix
  kind: value_object
  bc: platform.file
  scope: domain
  definition: 对象存储里放检测未通过文件内容的键前缀（<环境前缀>/quarantine/<文件 ID>），不可外读，只授安全角色经审批读取，保存期满清除内容
  standard_ref:
  - ADR-0060 决定 3；ADR-0070 决定 6、7
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  note: '与文件状态「已隔离」配套：前缀是存放位置，状态是文件的判定结果'
