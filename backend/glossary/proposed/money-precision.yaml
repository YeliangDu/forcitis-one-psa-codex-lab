# FD-02、FD-07、FD-08（用户 2026-10-15，docs/business/finance-decisions.md）落到 kernel 金额类型时引入的术语（proposed，待用语确认）。登记会话：one-architecture，2026-10-29，#812。
terms:
- id: exact_money
  zh: 未舍入金额
  en: ExactMoney
  snake: exact_money
  kind: value_object
  bc: kernel
  scope: kernel
  definition: 计算过程中的金额，数额 + 币种，保留全部精度、不舍入；舍入一次后形成金额（Money）（FD-08）
  standard_ref:
  - FD-08
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  used_by:
  - accounting.ledger
  - cost.costing
  - receivables.wip
  note: 尚无模块使用；used_by 为 FD-02 会计口径金额的首批使用方
- id: round
  zh: 舍入
  en: Round
  snake: round
  kind: business_rule
  bc: kernel
  scope: kernel
  definition: 未舍入金额形成金额的唯一一步：按币种最小单位四舍五入（HALF_UP），计算过程中不做（FD-02、FD-08）
  standard_ref:
  - FD-02
  - FD-08
  confidence: medium
  aliases: []
  forbidden: []
  status: proposed
  used_by:
  - accounting.ledger
  - cost.costing
  - receivables.wip
  note: 尚无模块使用；used_by 为 FD-02 会计口径金额的首批使用方
- id: minor_unit
  zh: 最小货币单位
  en: MinorUnit
  snake: minor_unit
  kind: value_object
  bc: kernel
  scope: kernel
  definition: 币种的最小记账单位所对应的小数位数，人民币为 2（分）；金额的小数位不得超过它
  standard_ref:
