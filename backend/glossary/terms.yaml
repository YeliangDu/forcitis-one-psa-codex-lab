# 统一语言：通用词与标准动作（本文件）+ 正式术语（docs/glossary/terms.yaml，单一来源）+ 各模块提议术语（glossary/proposed/*.yaml）
# GlossaryTest 以本文件为准：
#   G37 类型 / record 组件 / 枚举常量 / 方法 / 表 / 列中的每个词，必须来自某条术语的 en / snake，或 common_words
#   G38 任何位置不得出现某条术语 forbidden 中的写法
#   G39 列名（或 <snake>_id）、表名（复数）对应某条术语时，COMMENT 必须以该术语 zh 开头
#   G41–G48（NamingSurfaceTest / ApplicationIntegrationTest）复用同一拆词与查表逻辑（test 中的 Glossary 工具类）：
#   URL 资源段、OpenAPI 模式名与属性、事件 JSON 键、权限码、编号单据类型、作业 / 锁 / 指标 / 配置键、流程标识、错误码
#   standard_actions 是权限码动作的唯一来源（G43）
# 未登记词的草稿条目见 target/glossary-draft.yaml（mvn verify 副产物），补 zh / definition 后粘贴到 terms 下。
# 字段：id, zh, en, snake, kind, bc, definition, standard_ref, confidence, aliases, forbidden, status(approved|proposed)

