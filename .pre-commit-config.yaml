# 与 CI 的 gitleaks job 同版本；安装：pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: main-checkout-gate
        name: 主检出的 main 上不提交（改到自己的工作区）
        entry: python3 -I scripts/hooks/main_checkout_gate.py --pre-commit
        language: system
        always_run: true
        pass_filenames: false
