# Install only after independent review; dispatch source/bundle pins come from old control.
name: Independent public candidate native observation
on:
  push:
    branches: ['lab/22-independent-public-candidate-proof-fdec099-46e202546fa005f8db866012899d06acc5b2a8ae0cc971447318ba9e020c2823']
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: lab22-independent-fdec099-native-observation
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_NO_LAZY_FETCH: '1'
  GIT_CONFIG_NOSYSTEM: '1'
jobs:
  collect:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check fixed workflow control before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = 'refs/heads/lab/22-independent-public-candidate-proof-fdec099-46e202546fa005f8db866012899d06acc5b2a8ae0cc971447318ba9e020c2823'
          # Fixed historical ref; external operator pins SOURCE/bundle before push/credit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify independently frozen attempt propagation
        run: |
          set -euo pipefail
          printf '%s  %s\n' 8604a1dd0e65205ee1ef6fba7034a409afd3438aa35c3dba35432d2c59bbaf10 tools/lab22/public-candidate-proof/attempt_contract_selftest.py | sha256sum -c -
          python3 -I -S -B tools/lab22/public-candidate-proof/attempt_contract_selftest.py
      - name: Obtain only independently selected exact source objects
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYCODE' > "$RUNNER_TEMP/lab22-object-pins"
          import json,re
          from pathlib import Path
          p=json.loads(Path('tools/lab22/public-candidate-proof/expected-inputs.json').read_bytes())
          for key in ('base','head'):
              value=p['subject'][key]
              assert isinstance(value,str) and re.fullmatch('[0-9a-f]{40}',value)
              print(value)
          PYCODE
          while IFS= read -r oid; do
            git -c gc.auto=0 -c fetch.writeCommitGraph=false fetch --no-tags --no-write-fetch-head origin "$oid"
          done < "$RUNNER_TEMP/lab22-object-pins"
      - name: Collect pinned native GET data (no candidate execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle=tools/lab22/public-candidate-proof/bundle.json
          actual=$(sha256sum "$bundle" | cut -d' ' -f1)
          BUNDLE_SHA256="$actual" # integrity only; external operator independently matches committed digest
          python3 -I -S -B tools/lab22/public-candidate-proof/proof_runtime.py collect \
            --source "$GITHUB_SHA" --bundle-sha256 "$BUNDLE_SHA256" --output "$RUNNER_TEMP/lab22-raw"
      - name: Upload raw observation data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab22-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab22-raw/
          if-no-files-found: error
          include-hidden-files: true
  aggregate:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check fixed workflow control before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = 'refs/heads/lab/22-independent-public-candidate-proof-fdec099-46e202546fa005f8db866012899d06acc5b2a8ae0cc971447318ba9e020c2823'
          # Fixed historical ref; external operator pins SOURCE/bundle before push/credit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lab22-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab22-raw
      - name: Obtain exact aggregation source objects
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYCODE' > "$RUNNER_TEMP/lab22-object-pins"
          import json,re
          from pathlib import Path
          p=json.loads(Path('tools/lab22/public-candidate-proof/expected-inputs.json').read_bytes())
          for key in ('base','head'):
              value=p['subject'][key]
              assert isinstance(value,str) and re.fullmatch('[0-9a-f]{40}',value)
              print(value)
          PYCODE
          while IFS= read -r oid; do
            git -c gc.auto=0 -c fetch.writeCommitGraph=false fetch --no-tags --no-write-fetch-head origin "$oid"
          done < "$RUNNER_TEMP/lab22-object-pins"
      - name: Aggregate data and final native GET reread
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle=tools/lab22/public-candidate-proof/bundle.json
          actual=$(sha256sum "$bundle" | cut -d' ' -f1)
          BUNDLE_SHA256="$actual" # integrity only; external operator independently matches committed digest
          python3 -I -S -B tools/lab22/public-candidate-proof/proof_runtime.py aggregate \
            --source "$GITHUB_SHA" --bundle-sha256 "$BUNDLE_SHA256" \
            --raw "$RUNNER_TEMP/lab22-raw" --output "$RUNNER_TEMP/lab22-observation"
      # Exactly one upload action in aggregation job: observation only, no authority.
      - name: Upload readonly native observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab22-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab22-observation/
          if-no-files-found: error
          include-hidden-files: true
