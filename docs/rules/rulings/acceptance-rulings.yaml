# 验收测试裁定记录（`docs/rules/roles/lead.md` 专属规则 2、`scripts/guards/acceptance_guard.py`）：实现代理认为验收测试有误时停下报告，由复审（不是实现会话本人）裁定；
# 改验收测试的提交在说明里写 `Acceptance-Ruling: RULING-<编号>`，scripts/guards/acceptance_rulings.py 核对该编号必须记在这里，
# 并且记录在 PR 的 base（main）上已有：同一个 PR 里自己补的记录不算（那是实现会话自己裁定自己）。
#
# 条目：
#   - id: RULING-12                  # 编号，唯一
#     date: 2026-10-17
#     ruled_by: one-coordinator      # 谁裁定：复审会话、调度或用户；不得是想改测试的实现会话本人
#     implementer: one-1a-next-5     # 想改测试的实现会话（测试挡住了它）
#     files: [backend/src/test/java/com/forcitis/one/acceptance/xxx/FooIT.java]   # 裁定允许改的文件或目录前缀，至少一项
#     reason: 一句话，测试哪里有误
#     ref: 裁定写在哪里（intent 文件、评审记录、ADR），可选
#
# 存量：本守护合入 main 之前的提交里的裁定尾注不查（调度 2026-10-17 决定，不补记录）；合入之后的 PR 一律要求记录。
