  definition: 通过为我方开户、开立保函或监管项目资金而提供金融服务的银行。
  criterion: 与我方签账户、授信或保函协议；行为发生在 VS-04.4 回收款项、VS-05.5 完成付款、VS-12.1 确认收到出资；往来单位角色取值为「金融机构」（STKH-04）。
  boundary: 判定为「合作伙伴下的新子类（独立业务角色）」，不是供应商的再细分。理由：①它不是采购对价关系，没有供方准入、不签供方协议（VS-05.1–VS-05.6 中的准入与结算不适用），与供应商的规则集不同构；②它同时出现在收、付、出资三侧（VS-04.4、VS-05.5、VS-12.1），角色含义超出「向我方供货」；③用户已定角色取值「金融机构」，与供应商、渠道伙伴并列（STKH-04）；④与出租方、审计机构不同，它不需要在供应商之下另开细分。与「客户·资本方」互斥按协议类型（账户、保函、授信协议 vs 技术尽调服务合同）；同一银行可同时具两角色。
