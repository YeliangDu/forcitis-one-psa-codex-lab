subclasses:
- category: 客户
  kind: 子类
  name: 开发商
  ids:
  - SH-C1
  definition: 为其开发建设并销售、出租或经营的项目，与我方已有、拟有或曾有设计咨询服务约定的开发企业。
  criterion: 与我方签订的是项目合同；其在项目上的身份是建设单位或开发主体；建成后用于销售或出租而非自用。
  boundary: 与「自用业主」互斥，判别只看建成后用途（销售/出租 vs 自用），不看单位性质；与「发包方」互斥，发包方是把专项分包给我方的设计院或 EPC 总包，本身不是建设单位。同一往来单位可同时具客户角色与其他类别角色（OBJ-02：1 往来单位 → 0..N 角色）；但同一客户角色内「客户类型」按 OBJ-02 只取一值（一个往来单位一个客户类型，变更留痕），兼属时以「本项目签约时其在项目上的身份」为准。
  carrier:
    obj: OBJ-02
    attr: 客户类型
    value: 开发商
  involvement:
    trigger:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-04 完成服务价款约定与支付
    receive:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-04 完成服务价款约定与支付
    participate: []
- category: 客户
  kind: 子类
  name: 自用业主
  ids:
  - SH-C2
  definition: 为自身使用或承担公共使用职责的建设项目，与我方已有、拟有或曾有服务约定的企业、政府或公共业主。
  criterion: 与我方签订项目合同；项目建成后由该单位自用或自营（非销售、非出租）；或是受最终自用单位委托实施代建的代建、平台公司。
  boundary: 与「开发商」互斥按建成后用途；代建、平台公司不另立子类而归此（BASE members 已含），最终使用单位则记为联系人层的决策链·使用者。与「既有建筑业主」互斥按建筑是否已建成在用：新建项目归此，在用建筑的检查、评估、改造归既有建筑业主。
  carrier:
    obj: OBJ-02
    attr: 客户类型
    value: 自用业主
  involvement:
    trigger:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-04 完成服务价款约定与支付
    receive:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-04 完成服务价款约定与支付
    participate: []
- category: 客户
  kind: 子类
  name: 既有建筑业主
  ids:
  - SH-C3
  definition: 为在用建筑的检查、评估或改造，与我方已有、拟有或曾有服务约定的产权人或获授权管理人。
  criterion: 委托事项指向已建成并投入使用的建筑（VS-03 获得风险结论为主）；其身份是产权人或管理人；物业代业主委托时归此。
  boundary: 与「自用业主」「开发商」互斥按建筑是否已建成在用。产权人与管理人不一致时以「与我方签约的相对方」定客户，另一方落项目内身份或联系人；物业服务企业未代业主委托时不属客户，只是阶段参与者（SH-X8）。
  carrier:
    obj: OBJ-02
    attr: 客户类型
    value: 既有建筑业主
  involvement:
    trigger:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-03 获得风险结论
    - VS-04 完成服务价款约定与支付
    receive:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-03 获得风险结论
    - VS-04 完成服务价款约定与支付
    participate:
    - VS-03.1 编制检查计划
    - VS-03.3 发布不符合项
    - VS-03.4 跟进整改
    - VS-03.5 登记报告认可
- category: 客户
  kind: 子类
  name: 发包方
  ids:
  - SH-C4
  definition: 在承包链中将幕墙、照明等专项服务委托给我方的设计院或工程总承包单位。
  criterion: 与我方签订的是分包合同（我方为分包人，OBJ-05 记「我方在承包链中的位置」）；其在项目上是承包链上游的设计院或总包，不是建设单位。
  boundary: 与「开发商」「自用业主」互斥：建设单位本身是另一往来单位的客户角色，设计院、总包作为发包方是独立往来单位。同一设计院不作发包方时只是阶段参与者（SH-X1 主体建筑设计院），按「是否与我方签约」区分。与「合作伙伴·交付伙伴」方向相反：我方向其交付（客户），而非受其交付。
  carrier:
    obj: OBJ-02
    attr: 客户类型
    value: 发包方
  involvement:
    trigger:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-04 完成服务价款约定与支付
    receive:
    - VS-01 完成服务方选定
    - VS-02 获得交付成果
    - VS-04 完成服务价款约定与支付
    participate: []
- category: 客户
  kind: 子类
  name: 资本方
  ids:
  - SH-C5
  definition: 为投资、融资或承保判断，与我方已有、拟有或曾有技术尽调或 IDI 检查服务约定的机构。
  criterion: 委托目的是为其投资、融资或承保决策取得技术结论（VS-01 委托 + VS-03 获得风险结论）；其不是项目建设单位。
  boundary: 与「合作伙伴·金融机构」互斥按协议类型：账户、授信、保函协议下是合作伙伴·金融机构，技术尽调服务合同下是客户·资本方；同一银行可同时具两个角色（跨类别多角色允许）。与「渠道伙伴」互斥按是否订约：只转介绍、不订服务合同的是渠道伙伴（保险公司、TIS、物业、设计院），订约委托检查的才是资本方。
  carrier:
    obj: OBJ-02
    attr: 客户类型
    value: 资本方
  involvement:
    trigger:
    - VS-01 完成服务方选定
    - VS-03 获得风险结论
    - VS-04 完成服务价款约定与支付
    receive:
    - VS-01 完成服务方选定
    - VS-03 获得风险结论
    - VS-04 完成服务价款约定与支付
    participate:
    - VS-03.1 编制检查计划
    - VS-03.3 发布不符合项
    - VS-03.5 登记报告认可
- category: 客户
  kind: 角色（可兼任）
  name: 发起人
  ids:
  - SH-C6a
  definition: 在客户内部提出服务需求并推动项目或委托立项的人员。
  criterion: 在商机与项目上以需求提出方身份出现（VS-01.1 采集线索、VS-01.2 赢得委托、VS-02.0 开始项目）；常为客户的项目或设计管理负责人。
  boundary: 5 个决策链角色是客户内部的人的角色，与 5 个客户子类正交：任一子类的客户内部都可能有这 5 个角色，客户子类判别该单位是什么客户，决策链角色判别该人做什么。角色之间不互斥：同一联系人可兼任发起人与使用者，小微客户中老板常兼任发起人、决策人、经济买方、付款方；兼属时以「本笔业务中该人的实际行为」为准，且不改变往来单位的客户类型。
  carrier:
    obj: OBJ-03
    attr: 决策链角色
    value: 发起人
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-01.1 采集线索
    - VS-01.2 赢得委托
    - VS-02.0 开始项目
    - VS-02.1 确认概念
    - VS-02.2 确认方案
    - VS-02.3 完成初步设计
    - VS-02.4 完成深化设计
    - VS-02.5 完成招标采购配合
    - VS-02.6 完成施工配合
    - VS-02.7 完成收尾
    - VS-03.5 登记报告认可
    - VS-04.3 开具发票
    - VS-04.5 确认最终价款
    - VS-04.6 完成合同履行
- category: 客户
  kind: 角色（可兼任）
  name: 决策人
  ids:
  - SH-C6b
  definition: 在客户内部对服务方选定及获授权事项作最终决定的人员。
  criterion: 在 VS-01.2 赢得委托、VS-04.1 签署合同上代表客户作出决定或签署；多为产品、工程负责人或集团决策层。
  boundary: 与「经济买方」的边界是「定不定这家服务方」vs「谈不谈价格与条款」；与「付款方」的边界是「决策与签署」vs「办理付款」。三者可由同一人兼任，以本笔业务中是否行使该项职权判别，不靠职级推断。
  carrier:
    obj: OBJ-03
    attr: 决策链角色
    value: 决策人
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-01.2 赢得委托
    - VS-02.1 确认概念
    - VS-02.2 确认方案
    - VS-02.7 完成收尾
    - VS-04.1 签署合同
    - VS-04.6 完成合同履行
- category: 客户
  kind: 角色（可兼任）
  name: 经济买方
  ids:
  - SH-C6c
  definition: 在客户内部承担本项服务招采、成本控制及价格协商职责的人员。
  criterion: 在 VS-01.2、VS-02.5、VS-04.1、VS-04.5 上参与价格、招标采购与最终价款的商定；多为招采、成本岗。
  boundary: 与「决策人」按是否拍板 vs 是否谈价；与「付款方」按是否定金额 vs 是否办付款。经济买方与付款方常分属两个部门，因此不能合并为一个「有钱的人」。
  carrier:
    obj: OBJ-03
    attr: 决策链角色
    value: 经济买方
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-01.2 赢得委托
    - VS-02.5 完成招标采购配合
    - VS-02.7 完成收尾
    - VS-04.1 签署合同
    - VS-04.5 确认最终价款
    - VS-04.6 完成合同履行
- category: 客户
  kind: 角色（可兼任）
  name: 付款方
  ids:
  - SH-C6d
  definition: 在客户内部办理我方服务款支付的财务或相关人员。
  criterion: 在 VS-04.3 开具发票、VS-04.4 回收款项上出现；多为客户财务岗。
  boundary: 与「经济买方」按「办付款 vs 定价格」；与「决策人」按「执行支付 vs 作出决定」。付款方可对部分款项提异议但不改变其角色，异议是行为事实而非另一角色。
  carrier:
    obj: OBJ-03
    attr: 决策链角色
    value: 付款方
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-04.3 开具发票
    - VS-04.4 回收款项
- category: 客户
  kind: 角色（可兼任）
  name: 使用者
  ids:
  - SH-C6e
  definition: 在客户内部使用我方成果开展设计管理、工程管理或相关工作的人员。
  criterion: 在 VS-02.0–VS-02.6 上接收并确认、使用我方成果；多为客户的设计管理、工程管理人员。
  boundary: 与「社会公众·最终用户」互斥：使用者是客户内部人员，与我方成果有工作往来；最终用户是不进系统的建筑使用者。与「发起人」可兼任但不必然相同，以是否在阶段上使用并确认成果判别。
  carrier:
    obj: OBJ-03
    attr: 决策链角色
    value: 使用者
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-02.0 开始项目
    - VS-02.1 确认概念
    - VS-02.2 确认方案
    - VS-02.3 完成初步设计
    - VS-02.4 完成深化设计
    - VS-02.6 完成施工配合
    - VS-04.2 确认收入
- category: 合作伙伴
  kind: 子类
  name: 交付伙伴
  ids:
  - SH-P1
  - SH-P1c
  definition: 受我方委托承担部分设计、顾问工作，或以海外持牌资格配合交付，或与我方组成联合体共同投标、联合履约的单位。
  criterion: 与我方签的是分包合同（专业分包、人力外包）或联合体协议；其工作进入我方对客户的交付成果；或与我方作为同一客户合同的共同相对方。
  boundary: 与「供应商」互斥按协议类型与责任方向：交付伙伴承担的是我方对客户的部分交付责任（分包合同、联合体协议，VS-05.1–VS-05.6），供应商只提供产品、材料、软件、数据或保险（采购合同）。同一单位可同时具两个角色（如既是分包方又供材料），兼属时以「该笔业务签的是哪类协议」为准，不对单位整体归类。联合体伙伴与分包方的边界：联合体伙伴与客户是同一合同的共同相对方（VS-01.2 赢得委托），分包方在我方与客户合同之下；海外持牌伙伴以持牌资格配合交付，属本子类的一种，不另立子类。
  carrier:
    obj: OBJ-02
    attr: 角色
    value: 供应商（细分：分包方、外包方）、联合体伙伴、海外持牌伙伴
  involvement:
    trigger:
    - VS-01 完成服务方选定
    receive: []
    participate:
    - VS-01.2 赢得委托
    - VS-02.2 确认方案
    - VS-02.3 完成初步设计
    - VS-02.4 完成深化设计
    - VS-05.1 完成供方准入
    - VS-05.2 签署供方协议
    - VS-05.3 确认供方履约
    - VS-05.4 确认应付款项
    - VS-05.5 完成付款
    - VS-05.6 完成供方结算
- category: 合作伙伴
  kind: 子类
  name: 供应商
  ids:
  - SH-P2
  definition: 向我方提供产品、材料、软件、数据或职业责任保险等采购资源的外部单位。
  criterion: 与我方签采购合同或订单（VS-05.1–VS-05.6）；对价是我方支付的采购款；其成果不进入我方对客户的交付责任链。
  boundary: 与「交付伙伴」互斥按协议类型与责任方向；与「监管机构」互斥按是否存在交易对价（我方付费 vs 法定申报缴款）。本子类下设再细分：分包方、外包方、采购供应商、劳务派遣单位、出租方、审计机构（OBJECTS.md OBJ-02），其中出租方、审计机构在本卡单列，但层级仍是「供应商的第二层细分」，不是与交付伙伴并列的子类。
  carrier:
    obj: OBJ-02
    attr: 角色
    value: 采购供应商
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-01.1 采集线索
    - VS-02.4 完成深化设计
    - VS-02.5 完成招标采购配合
    - VS-02.6 完成施工配合
    - VS-05.1 完成供方准入
    - VS-05.2 签署供方协议
    - VS-05.3 确认供方履约
    - VS-05.4 确认应付款项
    - VS-05.5 完成付款
    - VS-08.0 批准事前申请
- category: 合作伙伴
  kind: 供应商下的细分
  name: 审计机构
  ids:
  - SH-P4
  definition: 受我方委托审计财务报表或专项事项并出具审计意见的外部会计师事务所。
  criterion: 与我方签审计业务约定书；对价是我方支付的审计费；报告用于 VS-10.2 发布报表、VS-12.2 分配利润；往来单位角色取值为「供应商」（STKH-03）。
  boundary: 判定为「供应商下的再细分」，不是合作伙伴下的新子类。理由：①用户已定其往来单位角色是「供应商」（STKH-03），OBJ-02 的供应商取值中已含审计机构；②其与我方是采购型对价关系，不承担我方对客户的交付责任，不满足交付伙伴的判别标准；③其准入、协议、付款路径与供应商完全相同（VS-05.1–VS-05.6 不新增规则），另立并列子类只会复制规则；④与出租方同构。与监管机构互斥：事务所与我方订约有对价，监管机构无对价只行法定监督权。与人力资源互斥：本子类指外部事务所，内部审计岗归人力资源·职能人员。
  carrier:
    obj: OBJ-02
    attr: 角色
    value: 供应商
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-10.2 发布报表
    - VS-12.2 分配利润
- category: 合作伙伴
  kind: 供应商下的细分
  name: 出租方
  ids:
  - SH-P6
  definition: 按租赁约定向我方提供办公场所或设备使用权的外部单位或个人。
  criterion: 与我方签租赁合同（OBJ-05 协议类型含租赁合同）；对价是租金；行为落在 VS-05.2 签署供方协议、VS-05.5 完成付款；往来单位角色取值为「出租方」（STKH-05）。
  boundary: 判定为「供应商下的再细分」，不是合作伙伴下的新子类。理由：①对价是租金、路径走供方准入与付款（VS-05），与供应商同构；②不进入我方对客户的交付链，不满足交付伙伴的判别标准；③BASE 的子类名本身写作「供应商·出租方」，已是细分写法；④自然人房东与单位房东共用同一角色，不因主体类型另立类别。与「客户·既有建筑业主」可能同一单位（我方租其场所同时委托我方检查其楼宇），属跨类别多角色，按各自协议判别。
  carrier:
    obj: OBJ-02
    attr: 角色
    value: 供应商·出租方
  involvement:
    trigger: []
    receive: []
    participate:
    - VS-05.2 签署供方协议
    - VS-05.5 完成付款
- category: 合作伙伴
  kind: 子类
  name: 渠道伙伴
  ids:
  - SH-P3
  definition: 通过转介绍业务机会协助我方获得服务委托的外部单位。
  criterion: 与我方签居间协议，或存在可核实的转介绍事实（VS-01.1 采集线索、VS-01.2 赢得委托）；其本身不承担我方对客户的交付工作。
  boundary: 与「客户·资本方」互斥按是否订服务合同：只转介绍不订约的是渠道伙伴，委托尽调或 IDI 检查的是资本方。与「交付伙伴」互斥按是否承担交付工作。同一保险公司可同时是渠道伙伴与客户·资本方，跨类别多角色允许。
