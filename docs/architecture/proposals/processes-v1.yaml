      - {actor: 系统策略, command: 释放核销占用, aggregate: AGG-52, branch: 补偿（占用成功而建付款失败）, desc: 补偿顺序与占用相反；孤儿占用另有定时释放兜底}
      - {actor: 财务主管, platform_task: true, service: platform.approval, command: 审批付款, desc: 经办、审批、出纳、记账不相容，经 platform.identity 校验（INV-81）}
