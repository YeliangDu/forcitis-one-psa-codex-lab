      - {actor: 项目总监, command: 批准完工估算, aggregate: AGG-23, emits: [完工估算已批准]}
    notes: 完工估算不用于收入确认（聚合稿 §1.4 G-1，依赖禁止）；P-19 EAC 超预算预警。

  - id: PRC-31
    name: 提出并发出设计变更
    trigger: {type: human, desc: 设计、发包人或现场原因引起设计变更}
    stages: [VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-28
    human_orchestration: false
    steps:
      - {actor: 设计师和顾问, command: 提出设计变更, aggregate: AGG-30}
      - {actor: 技术专家, command: 认定变更归因与影响, aggregate: AGG-30, desc: 归因必填（INV-54）}
      - {actor: 技术专家, command: 内审设计变更, aggregate: AGG-30}
      - {actor: 项目经理, command: 发出设计变更, aggregate: AGG-30, emits: [设计变更已发出]}
      - {actor: 项目经理, command: 标记待主张, aggregate: AGG-30, desc: 发包人原因且增加工作量时标待主张或写不主张理由（P-24）}
      - {actor: 项目经理, command: 关闭设计变更, aggregate: AGG-30}
    notes: 合同侧的协议变更、索赔单向引用设计变更 ID；交付不读合同。

  - id: PRC-32
    name: 申请并答复延期
    trigger: {type: human, desc: 出现影响进度的客观原因，项目经理发出延期通知}
    stages: [VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-04
    human_orchestration: true
    human_note: 5 天内通知、10 天内提交说明，发包人 5 天未答复视为批准
    steps:
      - {actor: 项目经理, command: 通知延期, aggregate: AGG-31}
      - {actor: 项目经理, command: 提交延期详细说明, aggregate: AGG-31}
      - {actor: 项目经理, command: 登记延期批准, aggregate: AGG-31, emits: [延期已批准]}
      - {actor: 项目经理, command: 登记延期拒绝, aggregate: AGG-31, branch: 拒绝, emits: [延期已拒绝]}
      - {actor: 系统策略, command: 登记延期视为批准, aggregate: AGG-31, branch: 超时, emits: [延期视为批准]}
    notes: P-25 期限临近提醒；合同侧协议变更、索赔引用延期申请。

  - id: PRC-34
    name: 处置我方成果不符合项
    trigger: {type: human, desc: 评审、检查或客户反馈发现我方成果问题}
    stages: [VS-02.6, VS-02.7]
    owner_bc: B-28
    human_orchestration: false
    steps:
      - {actor: 设计师和顾问, command: 登记不符合项, aggregate: AGG-28}
      - {actor: 技术专家, command: 确认不符合项, aggregate: AGG-28, emits: [不符合项已确认]}
      - {actor: 技术专家, command: 认定返工, aggregate: AGG-29, branch: 返工, emits: [返工已认定], desc: 返工工时只能由返工认定产生（INV-53）}
      - {actor: 技术专家, command: 撤销返工认定, aggregate: AGG-29, branch: 撤销, emits: [返工认定已撤销]}
      - {actor: 项目经理, command: 让步接受不符合项, aggregate: AGG-28, branch: 让步, desc: 须客户书面确认（INV-49）}
      - {actor: 技术专家, command: 关闭不符合项, aggregate: AGG-28, emits: [不符合项已关闭]}
    notes: 客户反馈的成果问题归本流程，过程问题归项目风险与问题（Q-E）。

  - id: PRC-36
    name: 封存成果、结项并归档项目
    trigger: {type: human, desc: 项目经理收尾，结项前封存已发布交付物并发起结项检查}
    stages: [VS-02.7]
    owner_bc: B-29
    human_orchestration: true
    human_note: 结项审批；审批通过前任一拒绝项不满足即退回
    merged_from: [PRC-39, PRC-40]
    steps:
      - {actor: 项目经理, command: 封存交付物, aggregate: AGG-27, emits: [交付物已封存], desc: 证据封存见「采集、关联并封存证据」；结项编排读取两者已封存（INV-40 第三项）}
      - {actor: 项目经理, read: true, command: 发起结项检查, reads: [AGG-27, AGG-38, AGG-44, AGG-55, AGG-39, AGG-13, AGG-17], desc: 无状态返回检查结果；拒绝项 3 条（收入覆盖、供方协议已结算或有结论、资料已封存）与预警项 2 条；检查单经 platform.audit 留痕}
      - {actor: 项目经理, platform_task: true, service: platform.approval, command: 提交结项申请, desc: 编排方实现审批钩子，提交时与审批通过时各跑一次检查}
      - {actor: 系统策略, command: 结项, aggregate: AGG-19, emits: [项目已结项], desc: 审批通过后调用，按结项申请 ID 幂等（INV-40）}
      - {actor: 项目经理, command: 归档项目, aggregate: AGG-19, emits: [项目已归档], desc: 项目已结项后归档（合并原 PRC-40，⑥a 评审 M2）；封存条件已在结项检查时核过}
    notes: 合并原 PRC-39、PRC-40（⑥a 评审 H2 c）。D-9 用户已定 a：无聚合的流程模块 B-29（模块标识 delivery.closeout，intent 114200 F-5），位于 B-04、B-05、B-06、B-08、B-11、B-28 下游；收入覆盖结论载体随 Q20。

  - id: PRC-37
    name: 回访客户满意度
    trigger: {type: human, desc: 项目收尾，项目经理发出满意度调查}
    stages: [VS-02.7]
    owner_bc: B-28
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 发出满意度调查, aggregate: AGG-105}
      - {actor: 项目经理, command: 登记调查回收, aggregate: AGG-105}
      - {actor: 项目经理, command: 评分满意度调查, aggregate: AGG-105, emits: [满意度调查已评分]}
      - {actor: 系统策略, command: 登记风险与问题, aggregate: AGG-104, branch: 低分, emits: [风险与问题已登记], desc: P-45 低于阈值（待定）经 api 调交付执行登记命令，按调查 ID 幂等}
      - {actor: 项目经理, command: 登记满意度跟进, aggregate: AGG-105, emits: [满意度调查已跟进]}
    notes: B-28 → B-04 单向。

  - id: PRC-38
    name: 编制并发布项目复盘
    trigger: {type: human, desc: 项目进入收尾，项目经理编制复盘}
    stages: [VS-02.7]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 编制项目复盘, aggregate: AGG-103}
      - {actor: 技术专家, command: 评审项目复盘, aggregate: AGG-103}
      - {actor: 项目经理, command: 发布项目复盘, aggregate: AGG-103, emits: [项目复盘已发布]}
    notes: 报价只存复盘 ID，不回读（§7 第 19 条）。


  # ───────────── VS-03 获得风险结论 ─────────────

  - id: PRC-41
    name: 制定检查计划并使其生效
    trigger:
      type: event
      events: [{event: ContractSigned, aggregate: AGG-13}]
      desc: 协议回签生效后，检查负责人制定周期检查计划
    stages: [VS-03.1]
    owner_bc: B-26
    human_orchestration: false
    steps:
      - {actor: 检查负责人, read: true, reads: [AGG-13, AGG-33], desc: 读协议与受检部位}
      - {actor: 检查负责人, command: 登记检查计划, aggregate: AGG-34, desc: 只有到期日，到期提醒是派生 / 策略（R-04）}
      - {actor: 检查负责人, command: 生效检查计划, aggregate: AGG-34, desc: 已登记 → 生效；VS-03.1 进入条件（符合性审查 必-6）}
      - {actor: 系统策略, read: true, reads: [AGG-34], desc: P-28 到期提醒与逾期未委托提醒，读模型派生，不存状态；由人工转线索，上游不订阅下游事件（符合性审查 建-12）}
      - {actor: 检查负责人, command: 标记不再受托, aggregate: AGG-34, branch: 不再受托, desc: 生效 → 不再受托，VS-03 ends_in 状态（符合性审查 必-6）}
    notes: 到期提醒是读模型，不是状态（用户 U-3）；人工转线索后另起「登记并跟进线索」；按周期结算用协议付款条件项。

  - id: PRC-43
    name: 实施现场检查并锁定
    trigger: {type: human, desc: 检查负责人安排检查并派人现场检查}
    stages: [VS-03.1, VS-03.2, VS-03.5, VS-02.6]
    owner_bc: B-26
    human_orchestration: false
    steps:
      - {actor: 检查负责人, read: true, reads: [AGG-19, AGG-33, AGG-36, AGG-62, AGG-34], desc: 读项目、部位、模板、检查人员资质（P-29）}
      - {actor: 检查负责人, command: 安排检查, aggregate: AGG-35, desc: 新建检查，状态已计划（VS-03.1 进入条件；符合性审查 必-6）}
      - {actor: 检查负责人, command: 指派检查人员, aggregate: AGG-35, desc: 已计划 → 已安排；TIS 负责人兼项限制 P-44}
      - {actor: 检查人员, command: 提交检查记录, aggregate: AGG-35, desc: 每个检查项须有结果或未检原因（INV-55）}
      - {actor: 检查负责人, command: 审核检查记录, aggregate: AGG-35}
      - {actor: 检查负责人, command: 锁定检查, aggregate: AGG-35, emits: [检查已锁定], desc: 锁定后只能追加更正}
      - {actor: 检查负责人, command: 关联检查报告, aggregate: AGG-35, desc: 记检查报告（AGG-27 交付物）的 ID，B-26 → B-28 api，关联记在下游一侧（符合性审查 必-6）}
      - {actor: 检查人员, command: 采集证据, aggregate: AGG-38, desc: B-26 → B-28 api}
    notes: 品控类服务在施工期做的检查同此流程（M-11 施工期类型）。

  - id: PRC-44
    name: 发布客户资产类不符合项并建议外部检测
    trigger:
      type: event
      events: [{event: 检查已锁定, aggregate: AGG-35}]
      desc: 检查锁定后，检查负责人复核发现
    stages: [VS-03.2, VS-03.3]
    owner_bc: B-26
    human_orchestration: false
    steps:
      - {actor: 检查人员, command: 登记不符合项, aggregate: AGG-28, desc: 经质量与认可 api 发起，来源检查 ID 只作回溯线索}
      - {actor: 检查负责人, command: 复核不符合项, aggregate: AGG-28}
      - {actor: 检查负责人, command: 发布不符合项, aggregate: AGG-28, emits: [不符合项已发布], desc: 发布前至少引用一条证据（INV-50）}
      - {actor: 检查负责人, command: 建议外部检测, aggregate: AGG-37}
    notes: R-07：不拆聚合，跨 BC 经 api 的代价由本流程体现。

  - id: PRC-45
    name: 跟踪整改并复查闭合
    trigger: {type: human, desc: 业主整改后申报，检查负责人复查}
    stages: [VS-03.4]
    owner_bc: B-26
    human_orchestration: true
    human_note: 整改申报、复查通过或回整改，反复多轮，逾期提醒（P-23）
    steps:
      - {actor: 检查负责人, command: 开始整改, aggregate: AGG-28, desc: 已发布 → 整改中；VS-03.4 进入条件（符合性审查 必-6）}
      - {actor: 业主代表, command: 登记整改申报, aggregate: AGG-28, desc: 整改中 → 整改已申报}
      - {actor: 检查负责人, command: 复查检查, aggregate: AGG-35, desc: 复查是一次新的检查，经本 BC 检查命令}
      - {actor: 检查负责人, command: 闭合不符合项, aggregate: AGG-28, emits: [不符合项已闭合], desc: 须引用复查或整改证据（INV-50）}
      - {actor: 检查负责人, command: 退回整改, aggregate: AGG-28, branch: 复查未通过}
      - {actor: 检查负责人, command: 登记客户接受风险, aggregate: AGG-28, branch: 客户书面接受风险}
      - {actor: 检查负责人, command: 停止跟踪不符合项, aggregate: AGG-28, branch: 不再跟踪, desc: 原因必填}
    notes: 严重等级未闭合不得签发竣工最终风险评估报告（INV-51，在交付物签发处读）。

  - id: PRC-46
    name: 采信外部检测报告
    trigger: {type: human, desc: 业主委托外部检测并取得报告}
    stages: [VS-03.4]
    owner_bc: B-26
    human_orchestration: false
    steps:
      - {actor: 检查负责人, command: 登记业主委托外部检测, aggregate: AGG-37}
      - {actor: 检查负责人, command: 登记外部检测报告, aggregate: AGG-37}
      - {actor: 检查负责人, command: 采信外部检测报告, aggregate: AGG-37, emits: [外部检测报告已采信]}
      - {actor: 检查负责人, command: 不采信外部检测报告, aggregate: AGG-37, branch: 不采信, emits: [外部检测报告未采信], desc: 原因必填；非业主委托机构的报告为 P-30 写入前预警}
    notes: 外部检测报告只引用、不修改（INV-57）。


  # ───────────── VS-04 约定并支付服务价款 ─────────────

  - id: PRC-47
    name: 起草、评审并回签协议
    trigger:
      type: event
      events: [{event: OpportunityAccepted, aggregate: AGG-10}]
      desc: 商机赢单（含直接委托）后商务起草项目合同或任务订单
    stages: [VS-04.1]
    owner_bc: B-05
    human_orchestration: true
    human_note: 合同评审审批；客户回签；依法招标项目须比对中标承诺
    steps:
      - {actor: 商务, read: true, reads: [AGG-10, AGG-11, AGG-12, AGG-18, AGG-19, AGG-20], desc: 读商机、承诺快照、报价版本、独立性检查结论、项目与 WBS 节点}
      - {actor: 商务, command: 起草协议, aggregate: AGG-13, desc: 复制承诺快照}
      - {actor: 商务, command: 登记合同—项目关联与范围挂 WBS, aggregate: AGG-13, emits: [合同—项目关联已登记]}
      - {actor: 商务, command: 登记视为同意参数与发包人代表, aggregate: AGG-13, desc: ADR-0047 第 5 条第 1 点}
      - {actor: 法务, platform_task: true, service: platform.approval, command: 合同评审, gap: G-02}
      - {actor: 商务, command: 回签, aggregate: AGG-13, emits: [ContractSigned], desc: 回签即生效；基线化前比对承诺（INV-05、07）}
    notes: 直建例外须经审批（INV-06）；订阅方 B-07、B-08、B-26。报价版本已生效、独立性检查已有结论无事件消费者，签约时读取，可接受（⑥a 评审 L3）。

  - id: PRC-48
    name: 提出并生效协议变更或签证
    trigger: {type: human, desc: 范围、价款、工期变化，或现场发生签证事项}
    stages: [VS-04.6]
    owner_bc: B-05
    human_orchestration: true
    human_note: 提出 → 影响评估 → 审批 → 已生效 / 驳回
    steps:
      - {actor: 商务, read: true, reads: [AGG-30, AGG-31, AGG-13], desc: 读所主张的设计变更与延期申请}
      - {actor: 商务, command: 提出协议变更, aggregate: AGG-15}
      - {actor: 商务, command: 评估变更影响, aggregate: AGG-15}
      - {actor: 项目总监, platform_task: true, service: platform.approval, command: 协议变更审批, gap: G-02}
      - {actor: 商务, command: 生效协议变更, aggregate: AGG-15, emits: [ChangeOrderApproved]}
      - {actor: 商务, command: 确认现场签证, aggregate: AGG-15, branch: 签证, emits: [SiteVisaConfirmed]}
      - {actor: 系统策略, command: 应用变更, aggregate: AGG-13, on_event: [{aggregate: AGG-15, event: ChangeOrderApproved}, {aggregate: AGG-15, event: SiteVisaConfirmed}], emits: [新基线已生效], desc: 订阅协议变更生效与签证确认（同 BC）；按变更 ID 幂等}
    notes: 生效后只能经协议变更产生新基线（INV-07、16）；B-08 订阅新基线更新开票与收入额度。

  - id: PRC-49
    name: 提出并认定索赔
    trigger: {type: human, desc: 对方或我方出现可索赔事项，在时限内通知}
    stages: [VS-04.6, VS-04.5]
    owner_bc: B-05
    human_orchestration: true
    human_note: 已通知 → 已提交 → 已认定 / 已拒绝 / 撤回，索赔时限
    steps:
      - {actor: 商务, read: true, reads: [AGG-30, AGG-31], desc: 读所引用的设计变更与延期申请}
      - {actor: 商务, command: 提出索赔, aggregate: AGG-16, emits: [ClaimAsserted], desc: 超时限须注明理由（INV-17）}
      - {actor: 商务, command: 认定索赔, aggregate: AGG-16, emits: [ClaimSettled]}
      - {actor: 商务, command: 拒绝或撤回索赔, aggregate: AGG-16, branch: 拒绝或撤回}
    notes: P-08 索赔时限临近提醒。

  - id: PRC-50
    name: 占用框架限额并提交任务订单
    trigger: {type: human, desc: 商务按框架协议起草任务订单}
    stages: [VS-04.6]
    owner_bc: B-05
    human_orchestration: true
    human_note: 占用被拒则订单不得提交；驳回、作废、终止释放
    steps:
      - {actor: 商务, command: 占用框架限额, aggregate: AGG-14, emits: [限额已占用, 框架限额占用被拒]}
      - {actor: 商务, command: 提交任务订单, aggregate: AGG-13, desc: 引用占用 ID}
      - {actor: 系统策略, command: 释放框架限额, aggregate: AGG-14, branch: 驳回或作废, emits: [限额已释放], desc: 孤儿占用靠定时释放兜底}
    notes: P-04 回签后超额占用预警。

  - id: PRC-54
    name: 视为同意期满处理
    trigger:
      type: event
      events: [{event: 交付物已送达, aggregate: AGG-27}]
      desc: 按合同审查期参数与送达日算期满日，到期触发待办
    stages: [VS-04.2]
    owner_bc: B-08
    human_orchestration: true
    human_note: 期满待办、项目经理人工确认期满、期满前退回则取消
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-13, AGG-27], command: 计算期满日并生成待办, desc: P-21；核对期满前无退回、声明日不早于期满日}
      - {actor: 项目经理, command: 确认视为同意期满, aggregate: AGG-44, on_time: 送达日起合同审查期满, emits: [视为同意已成立], reads: [AGG-27], desc: 读 AGG-27 的无异议声明与送达日判定期满，D-8}
      - {actor: 系统策略, command: 确认收入, aggregate: AGG-44, emits: [RevenueRecognized]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-44, calls: PRC-92}
    notes: 视为同意不自动确认收入，须人工声明（ADR-0047 第 5 条）。「AcceptanceReturned」订阅方 B-08 的反应（期满前退回则取消待办）是读检不是命令，记入 G-19。

  - id: PRC-57
    name: 申请并开具销项发票
    trigger:
      type: event
      events: [{event: 付款条件项已可结算, aggregate: AGG-13}]
      desc: 付款条件项转为可结算后项目经理或商务提出开票；预收款等先于回签的开票由人工发起（INV-71 例外）
    stages: [VS-04.3]
    owner_bc: B-08
    human_orchestration: true
    human_note: 开票申请审批、驳回、撤回；税务平台开具结果
    steps:
      - {actor: 商务, read: true, reads: [AGG-13, AGG-38], desc: 读协议付款条件项与预收证据}
      - {actor: 商务, command: 提交开票申请, aggregate: AGG-45}
      - {actor: 财务主管, platform_task: true, service: platform.approval, command: 开票申请审批, gap: G-02}
      - {actor: 财务, command: 开票申请准入, aggregate: AGG-45, emits: [InvoiceEligibilityConfirmed], desc: 协议须已生效，预收例外附委托函或中标通知书（INV-71）}
      - {actor: 财务, command: 驳回开票申请, aggregate: AGG-45, branch: 驳回, emits: [开票申请已驳回]}
      - {actor: 财务, command: 开具销项发票并改写 WIP, aggregate: AGG-46, on_event: [{aggregate: AGG-45, event: InvoiceEligibilityConfirmed}], also: [AGG-44], c_exception: INV-73, emits: [InvoiceIssued], desc: 经税务平台开具；同事务改写开票额度}
      - {actor: 财务, command: 作废开票申请, aggregate: AGG-45, branch: 作废, emits: [开票申请已作废], desc: 只发生在开具前}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-46, calls: PRC-92}
    notes: 本稿唯一的 C 类（INV-73，ADR-0016 决定 5）；P-07 付款条件到期未开票提醒。

  - id: PRC-58
    name: 红冲销项发票
    trigger: {type: human, desc: 开票有误或业务取消，财务发起红冲}
    stages: [VS-04.3]
    owner_bc: B-08
    human_orchestration: false
    steps:
      - {actor: 财务, command: 发起红字信息确认, aggregate: AGG-46, desc: 已用途确认或入账的蓝字发票红冲前须对方确认}
      - {actor: 财务, command: 红冲发票, aggregate: AGG-46, emits: [发票已红冲]}
      - {actor: 系统策略, command: 回冲开票额度, aggregate: AGG-44, gap: G-08, desc: INV-73 只写开票接受与作废同事务，红冲是否同事务未写；本稿按两次事务写}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-46, calls: PRC-92}
    notes: 对方确认红字信息的 72 小时自动作废在税务平台一侧，聚合稿无对应命令，按非人工编排。蓝字不得作废，更正走红字（INV-72）；订阅方 B-09，其反应见 G-08。

  - id: PRC-60
    name: 认领收款并核销应收
    trigger: {type: human, desc: 出纳每日认领到账流水}
    stages: [VS-04.4]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 出纳, read: true, reads: [AGG-88, AGG-87], desc: 读流水行与资金账户}
      - {actor: 出纳, command: 收款认领, aggregate: AGG-50, emits: [CashReceived]}
      - {actor: 出纳, command: 在应收上核销占用, aggregate: AGG-49, emits: [应收已结清], desc: 核销合计不超过未结余额（INV-77）；结清时发事件}
      - {actor: 出纳, command: 记分配行与流水行, aggregate: AGG-50, emits: [收款已分配], desc: 分配合计等于到账金额（INV-78）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-50, calls: PRC-92}
    notes: 额度占用，不新增 C 类；收款作废时释放占用。

  - id: PRC-61
    name: 检测应收逾期并催收
    trigger: {type: time, desc: 每日定时检测账龄与到期}
    stages: [VS-04.4]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 检测应收逾期, aggregate: AGG-49, emits: [ArOverdueDetected]}
      - {actor: 财务, command: 登记争议与处置分类, aggregate: AGG-49, desc: 取值只确认「诉讼」，其余待用户定}
      - {actor: 财务主管, command: 核销坏账, aggregate: AGG-49, emits: [ArWrittenOff]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-49, calls: PRC-92}
    notes: P-36 账龄、逾期；「核销」与状态「已核销（坏账）」重名，已交 one-glossary。

  - id: PRC-63
    name: 商业汇票兑付与逾期
    trigger: {type: time, desc: 商票到期日}
    stages: [VS-04.4]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 出纳, command: 登记商票兑付, aggregate: AGG-50}
      - {actor: 系统策略, command: 标记商票已逾期, aggregate: AGG-50, branch: 逾期, emits: [商票已逾期]}
      - {actor: 系统策略, command: "释放占用、恢复应收", aggregate: AGG-49, branch: 逾期, on_event: [{aggregate: AGG-50, event: 商票已逾期}], desc: 订阅商票已逾期，同 BC 事件，不跨聚合事务}
    notes: 过账时点、是否算回款待财务口径（AGG-50 待定 a、b、c）。

  - id: PRC-64
    name: 导入银行流水
    trigger: {type: time, desc: 每日或银行文件到达}
    stages: [VS-04.4, VS-05.5]
    owner_bc: B-22
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 导入银行流水, aggregate: AGG-88, emits: [流水已导入], desc: 只追加，保留原始文件与校验和（INV-85）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-88, calls: PRC-92, desc: 利息与手续费}
    notes: 匹配记在收款、付款上，流水不引用下游。

  - id: PRC-66
    name: 判定履约完成，确认最终价款并结算协议
    trigger:
      type: event
      events: [{event: RevenueRecognized, aggregate: AGG-44}]
      desc: 每次确认收入后判定全部履约义务是否已履行
    stages: [VS-04.5]
    owner_bc: B-08
    human_orchestration: false
    merged_from: [PRC-67]
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-44], desc: 全部履约义务累计确认等于分摊价格即「已履行」（派生值，R-02）}
      - {actor: 系统策略, command: 完成协议, aggregate: AGG-13, emits: [协议已完成], gap: G-07, desc: 下游编排调用上游命令，携带 B-08 依据}
      - {actor: 商务, bc: B-05, on_event: [{aggregate: AGG-13, event: 协议已完成}], command: 编制结算书, aggregate: AGG-13, gap: G-16, desc: B-05 内结算流程订阅协议已完成（⑥a 评审 H4）}
      - {actor: 商务, bc: B-05, command: 确认最终价款, aggregate: AGG-13, desc: 双方确认；差额经收入冲减或补充确认（G-16）}
      - {actor: 商务, bc: B-05, command: 结算协议, aggregate: AGG-13, emits: [协议已结算], gap: G-16}
    notes: 合并原 PRC-67（⑥a 评审 H2 c、H4）。编排方取 B-08（B-08 → B-05 边已有），结算部分是 B-05 内的反应。协议「已结算」与价值流阶段「结算」同名异义，已交 one-glossary。协议已结算 → B-08 收入冲减无命令，记入 G-19、G-16。

  # ───────────── VS-05 获得外部资源 ─────────────

  - id: PRC-69
    name: 供应商准入与资质核验
    trigger: {type: human, desc: 项目经理或职能提出新供方，财务发起准入}
    stages: [VS-05.1]
    owner_bc: B-01
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 申请往来单位角色, aggregate: AGG-01}
      - {actor: 财务, command: 登记资质证书, aggregate: AGG-02}
      - {actor: 财务, command: 核准往来单位角色合格, aggregate: AGG-01, emits: [角色已合格]}
      - {actor: 财务, command: 暂停往来单位角色, aggregate: AGG-01, branch: 暂停, emits: [角色已暂停]}
      - {actor: 财务, command: 停用往来单位角色, aggregate: AGG-01, branch: 停用, emits: [角色已停用]}
    notes: 角色准入命令的参数为角色，只适用于供应商、分包等需准入的角色，客户角色不走准入（intent 120544 P-3）。未合格或已停用的供应商不得签分包、采购协议或付款（INV-04）；资质到期见「年检、核查与延续企业资质」。

  - id: PRC-70
    name: 起草并生效供方协议
    trigger: {type: human, desc: 项目经理提出采购或分包需求，或职能提出公司级采购}
    stages: [VS-05.2]
    owner_bc: B-11
    human_orchestration: true
    human_note: 请购、审批、同意证据
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-01, AGG-02, AGG-13, AGG-19], desc: 读供方准入与资质、主协议承包链位置（INV-11、12）、项目}
      - {actor: 项目经理, command: 预算占用, aggregate: AGG-80, emits: [BudgetReserved], desc: 拦截还是预警待定（INV-102）}
      - {actor: 项目经理, command: 起草供方协议, aggregate: AGG-55, desc: 请购是草拟前的单据}
      - {actor: 项目经理, platform_task: true, service: platform.approval, command: 提交审批}
      - {actor: 项目经理, command: 生效供方协议, aggregate: AGG-55, emits: [分包协议已生效, 采购协议已生效], desc: 按协议类型二选一}
      - {actor: 系统策略, command: 建立履约额度, aggregate: AGG-58, desc: 同 BC 联动}
    notes: P-06 主合同未回签即签分包只预警；分包须附发包方同意证据（INV-13）。

  - id: PRC-71
    name: 生效分包变更
    trigger: {type: human, desc: 分包范围或价款变化}
    stages: [VS-05.2]
    owner_bc: B-11
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 提出分包变更, aggregate: AGG-56}
      - {actor: 项目经理, command: 生效分包变更, aggregate: AGG-56, emits: [分包变更已生效]}
      - {actor: 系统策略, command: 供方额度更新, aggregate: AGG-58, on_event: [{aggregate: AGG-56, event: 分包变更已生效}]}
    notes: 生效后不可改，只能再变更（INV-16a、16b）。

  - id: PRC-72
    name: 确认供方履约
    trigger: {type: human, desc: 专人验收供方履约}
    stages: [VS-05.3]
    owner_bc: B-11
    human_orchestration: false
    steps:
