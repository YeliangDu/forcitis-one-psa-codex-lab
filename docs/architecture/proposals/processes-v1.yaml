    human_orchestration: false
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-81], desc: 同事务读锁校验目标期间开放；已关账则路由到开放期间并标原期间（INV-92）}
      - {actor: 系统策略, command: 过账, aggregate: AGG-77, emits: [BusinessFactAttributed], desc: 借贷平衡、法人一致、幂等（INV-93、94）}
      - {actor: 系统策略, command: 冲销并重过账, aggregate: AGG-77, branch: 更正, emits: [BusinessFactRestated], desc: 事实只追加，更正只能冲销（INV-95）}
    notes: 所有触账流程的最后一步都调用本流程；订阅方 B-07、B-17、B-20。

  - id: PRC-94
    name: 制单并过账受控手工凭证
    trigger: {type: human, desc: 财务因调整、差异或年度审计调整制单}
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: true
    human_note: 制单、复核、审批，复核人不同于制单人
    steps:
      - {actor: 财务, command: 制单手工凭证, aggregate: AGG-98}
      - {actor: 财务主管, command: 复核手工凭证, aggregate: AGG-98}
      - {actor: 财务主管, platform_task: true, service: platform.approval, command: 手工凭证审批}
      - {actor: 财务主管, command: 提交过账候选, aggregate: AGG-98, emits: [手工凭证已提交过账], calls: PRC-92, desc: 年度审计调整类带显式落账期间（仅第 13 期）}
    notes: 显式期间未开放即拒并告警，不改落其他期间（ADR-0046）。

  - id: PRC-95
    name: 期末结转
    trigger: {type: time, desc: 月末业务过账完成后}
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: false
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-84], desc: 读本期分录与余额}
      - {actor: 财务, command: 生成期末结转运行, aggregate: AGG-99, desc: 每（法人，期间，模板）只有一次有效运行（INV-109）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-99, emits: [期末结转已过账], calls: PRC-92}
    notes: 已过账的只能冲销重做；损益结转、未分配利润等期末凭证。

  - id: PRC-96
    name: 分配人工成本
    trigger:
      type: event
      events: [{event: BusinessFactAttributed, aggregate: AGG-77}]
      gate: 期间闸门——工时与薪酬事实均已过账（P-41）且目标期间开放，月末才触发（⑥a 评审 M7）
    stages: [VS-10.1]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-77, AGG-81], desc: 读已过账的工时与薪酬事实，只分配已锁定工时}
      - {actor: 财务, command: 试算人工成本分配, aggregate: AGG-41, desc: P-41 有工时无薪酬、有薪酬无工时预警}
      - {actor: 财务, command: 确认人工成本分配, aggregate: AGG-41}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-41, emits: [人工成本分配已过账], calls: PRC-92}
    notes: 分配合计等于实际人工成本，零容差（INV-89）；口径待 FD-09。试算后确认无超时或退回分支，按非人工编排（⑥a 评审 M1）。

  - id: PRC-97
    name: 批准并生效分摊规则版本
    trigger: {type: human, desc: 财务按期间首日发布规则}
    stages: [VS-10.1]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 财务, command: 批准分摊规则版本, aggregate: AGG-40, gap: G-02}
      - {actor: 财务, command: 生效分摊规则版本, aggregate: AGG-40, emits: [分摊规则已生效], desc: 只在期间首日生效（INV-91）}
    notes: 被引用版本不可改。

  - id: PRC-98
    name: 分摊间接成本
    trigger: {type: time, desc: 月末}
    stages: [VS-10.1]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 财务, command: 试算分摊运行, aggregate: AGG-42, desc: 基数为零时结转下期（P-42）}
      - {actor: 财务, command: 生效分摊运行, aggregate: AGG-42, emits: [分摊已生效], desc: 管理口径；每期间一次有效全量运行（INV-90）}
    notes: 冲销按原比例。试算后确认无超时或退回分支，按非人工编排（⑥a 评审 M1）。

  - id: PRC-99
    name: 计提折旧并处置公司资产
    trigger: {type: time, desc: 月末按期计提}
    stages: [VS-10.1]
    owner_bc: B-24
    human_orchestration: false
    steps:
      - {actor: 财务, read: true, reads: [AGG-55], desc: 读采购或租赁协议}
      - {actor: 财务, command: 登记公司资产, aggregate: AGG-91}
      - {actor: 系统策略, command: 计提折旧与摊销, aggregate: AGG-91}
      - {actor: 财务, command: 处置资产, aggregate: AGG-91, branch: 处置, emits: [资产已处置]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-91, calls: PRC-92, desc: 折旧与处置过账}
    notes: G1 期间为 ledger 内导入通道（ADR-0022 决定 7）。

  - id: PRC-100
    name: 发布总账配置版本
    trigger: {type: human, desc: 财务评审并发布科目表、映射表、授权表新版本}
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: false
    steps:
      - {actor: 财务主管, command: 发布科目表版本, aggregate: AGG-82, emits: [科目表版本已生效]}
      - {actor: 财务主管, command: 发布映射表版本, aggregate: AGG-85, emits: [映射表版本已生效]}
      - {actor: 财务主管, command: 发布授权表版本, aggregate: AGG-94, emits: [授权表版本已生效]}
    notes: 口径转换规则按代码类变更管理，不建聚合。

  - id: PRC-101
    name: 月结检查并关账
    trigger: {type: human, desc: 财务在会计期间结束时发起月结}
    stages: [VS-10.1]
    owner_bc: B-17
    human_orchestration: true
    human_note: 发起人与确认人须不同；前置检查未通过退回开放重入
    steps:
      - {actor: 财务, read: true, reads: [AGG-84, AGG-99, AGG-77, AGG-81], command: 月结检查, desc: 队列为空、死信为空、期末结转已过账、明细账与控制科目一致、试算平衡、三条对账等式等}
      - {actor: 财务, command: 发起关账, aggregate: AGG-81}
      - {actor: 财务主管, command: 确认关账, aggregate: AGG-81, emits: [AccountingPeriodClosed]}
      - {actor: 财务主管, command: 退回开放, aggregate: AGG-81, branch: 前置检查未通过}
    notes: 已关账期间是终态，回退是在开放期间重入第 1–3 步（冲销加新事实，标原期间）；「关账中」是否仍接受过账未定（§7 第 15 条）。

  - id: PRC-102
    name: 启用第 13 期并年末关账
    trigger: {type: time, desc: 会计年度末，12 月关账前}
    stages: [VS-10.1]
    owner_bc: B-17
    human_orchestration: false
    steps:
      - {actor: 财务主管, command: 登记第 13 期启用, aggregate: AGG-96, emits: [第 13 期启用登记已生效]}
      - {actor: 财务主管, command: 开放第 13 期, aggregate: AGG-81}
      - {actor: 财务, command: 发起年末关账, aggregate: AGG-81, desc: 12 月与第 13 期共用一组前置检查}
      - {actor: 财务主管, command: 确认年末关账, aggregate: AGG-81, emits: [AccountingPeriodClosed], desc: 两期同事务原子关账（INV-99）；第 13 期的事件不触发 L2}
    notes: 未启用的年度 12 月照常关账；12 月关账后启用状态锁定（INV-104）。

  - id: PRC-104
    name: 外部法定账对账与签字
    trigger:
      type: event
      events: [{event: 期间余额快照已生成, aggregate: AGG-100}]
    stages: [VS-10.2]
    owner_bc: B-20
    human_orchestration: false
    steps:
      - {actor: 财务, read: true, reads: [AGG-100, AGG-84], desc: 读快照与推送状态及外部法定账余额}
      - {actor: 财务, command: 登记对账差异, aggregate: AGG-101}
      - {actor: 财务主管, command: 签字接受差异, aggregate: AGG-101, emits: [对账已完成], desc: 差异清零或签字接受，否则收付口径账簿不得出表（INV-107）}
    notes: 权责口径不等对账。

  - id: PRC-105
    name: 评审并生效报表行定义版本
    trigger: {type: human, desc: 财务编制报表行到科目的映射}
    stages: [VS-10.2]
    owner_bc: B-21
    human_orchestration: false
    steps:
      - {actor: 财务, command: 编制报表行定义版本, aggregate: AGG-86}
      - {actor: 财务主管, command: 生效报表行定义版本, aggregate: AGG-86, desc: 只在期间首日生效（INV-91）}
    notes: 草拟 → 财务评审 → 生效。

  # ───────────── VS-11 沉淀复用知识 ─────────────

  - id: PRC-107
    name: 知识条目的起草、评审、发布与修订废止
    trigger: {type: human, desc: 技术专家主动起草；或项目复盘发布后由复盘编制人决定提炼}
    stages: [VS-11.1, VS-11.2, VS-11.3]
    owner_bc: B-30
    human_orchestration: true
    human_note: 有效期届满的修订或废止（定时）；评审意见可退回起草
    merged_from: [PRC-108, PRC-109, PRC-110]
    steps:
      - {actor: 技术专家, command: 起草知识条目, aggregate: AGG-107}
      - {actor: 项目经理, bc: B-04, on_event: [{aggregate: AGG-103, event: 项目复盘已发布}], command: 创建知识条目, aggregate: AGG-107, branch: 从复盘提炼, desc: 复盘编制人决定是否提炼，由复盘调知识条目的创建命令；来源复盘 ID 只记录不校验}
      - {actor: 技术专家, command: 提交知识条目评审, aggregate: AGG-107}
      - {actor: 技术专家, command: 评审知识条目, aggregate: AGG-107, desc: 审批人与审批记录在聚合内（审批人经 api 读人员）；退回起草无独立命令}
      - {actor: 技术专家, command: 发布知识条目, aggregate: AGG-107, emits: [知识条目已发布]}
      - {actor: 技术专家, command: 修订知识条目, aggregate: AGG-107, on_time: 有效期届满或适用范围变化, emits: [知识条目已修订], desc: 产生新版本并引用被取代版本，修订须重新评审}
      - {actor: 技术专家, command: 废止知识条目, aggregate: AGG-107, branch: 废止, on_time: 有效期届满, emits: [知识条目已废止], desc: 废止后不得被新引用}
    notes: 合并原 PRC-108、109、110（⑥a 评审 H2 c）。已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅。B-04 → B-30 边已有。「项目复盘已发布」订阅方同 BC：B-04 的提炼步骤（G-05）。


  # ───────────── VS-12 获得投资回报 ─────────────

  - id: PRC-112
    name: 决议并支付利润分配
    trigger: {type: human, desc: 年度报表出具后，股东或合伙人提出回报要求}
    stages: [VS-12.2]
    owner_bc: B-10
    human_orchestration: false
    steps:
      - {actor: 财务, read: true, reads: [AGG-81, AGG-100, AGG-54], desc: 读所属年度已关账与可分配利润}
      - {actor: 财务, command: 草拟利润分配, aggregate: AGG-109}
      - {actor: 股东, command: 决议利润分配, aggregate: AGG-109, emits: [利润分配已决议], desc: 决议额不超过可分配利润（INV-117）}
      - {actor: 财务, command: 提交应付利润, aggregate: AGG-52, emits: [应付已确认]}
      - {actor: 财务, command: 登记利润分配支付, aggregate: AGG-109, emits: [利润分配已支付], gap: G-10}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-109, calls: PRC-92}
    notes: 支付走「发起、审批并执行付款」；自然人股东个税见「并入股息红利个税扣缴申报」。

  - id: PRC-114
    name: 退回出资
    trigger: {type: human, desc: 股东或合伙人申请部分或全部退回}
    stages: [VS-12.3]
    owner_bc: B-10
    human_orchestration: false
    steps:
      - {actor: 财务, command: 登记出资退回, aggregate: AGG-54, emits: [出资已退回]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-54, calls: PRC-92}
    notes: 退回的资金收付走「发起、审批并执行付款」，应付类型承载见 G-11 末段。


  # ───────────── VS-13 获得报酬 ─────────────

  - id: PRC-115
    name: 导入考勤记录并补卡
    trigger: {type: time, desc: 每日同步考勤来源}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 导入考勤记录, aggregate: AGG-69, desc: 只追加，不可修改（INV-69）}
      - {actor: 员工, command: 补卡, aggregate: AGG-69, desc: 另记}
    notes: 来源系统待定（R2）。

  - id: PRC-116
    name: 申请并审批请假
    trigger: {type: human, desc: 员工提交请假}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: true
    human_note: 请假审批、驳回或撤销释放额度
    steps:
      - {actor: 员工, read: true, reads: [AGG-68, AGG-108], desc: 读工作日历与标准工时版本做按日拆分}
      - {actor: 员工, command: 占用余额, aggregate: AGG-71, desc: 提交时向假期余额账户占用（INV-68）}
      - {actor: 员工, command: 提交请假, aggregate: AGG-70}
      - {actor: 部门负责人, platform_task: true, service: platform.approval, command: 请假审批}
      - {actor: 部门负责人, command: 批准请假, aggregate: AGG-70, emits: [请假已批准]}
      - {actor: 系统策略, command: 批准转已用, aggregate: AGG-71}
      - {actor: 员工, command: 撤销请假, aggregate: AGG-70, branch: 撤销, emits: [请假已撤销], inner: [{command: 释放余额占用, aggregate: AGG-71}]}
      - {actor: 员工, command: 销假, aggregate: AGG-70, branch: 销假, emits: [请假已销假]}
    notes: 工时单最低时数扣减已批准与待批请假（INV-65）。

  - id: PRC-117
    name: 申请并批准加班
    trigger: {type: human, desc: 员工或部门提出加班}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: true
    human_note: 加班审批
    steps:
      - {actor: 员工, command: 加班申请, aggregate: AGG-72, desc: P-34 每月超 36 小时预警}
      - {actor: 部门负责人, platform_task: true, service: platform.approval, command: 加班审批}
      - {actor: 部门负责人, command: 批准加班, aggregate: AGG-72, emits: [加班已批准]}
    notes: 加班不认识工时单，工时条目引用加班 ID。

  - id: PRC-118
    name: 生成、确认并锁定月度考勤
    trigger: {type: time, desc: 月末}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: true
    human_note: 员工确认或更正，逾期锁定
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-69, AGG-70, AGG-72, AGG-68], desc: 汇总考勤、请假、加班}
      - {actor: 系统策略, command: 生成月度考勤, aggregate: AGG-97}
      - {actor: 员工, command: 员工确认, aggregate: AGG-97, emits: [月度考勤已确认]}
      - {actor: 系统策略, command: 标记加班已补偿, aggregate: AGG-72, on_event: [{aggregate: AGG-97, event: 月度考勤已确认}], emits: [加班已补偿], desc: 订阅月度考勤已确认（同 BC），按加班 ID 幂等}
      - {actor: 人力, command: 锁定, aggregate: AGG-97, on_time: 员工确认期限届满逾期, emits: [月度考勤已锁定]}
    notes: 锁定后不改，补卡、请假、加班变动计入下月并标原月份（INV-105）。

  - id: PRC-120
    name: 评估月度绩效
    trigger: {type: time, desc: 评估期间结束}
    stages: [VS-13.2]
    owner_bc: B-13
    human_orchestration: false
    steps:
      - {actor: 用人经理, command: 编制绩效评估, aggregate: AGG-106}
      - {actor: 用人经理, command: 提交绩效评估, aggregate: AGG-106}
      - {actor: 用人经理, command: 确认绩效评估, aggregate: AGG-106, emits: [绩效评估已确认], desc: 同一人同期同类型唯一（INV-114）}
    notes: 状态流转由用户定，细则为推断，待流程梳理确认。

  - id: PRC-121
    name: 制定激励方案
    trigger: {type: human, desc: 管理层与人力制定}
    stages: [VS-13.2]
    owner_bc: B-15
    human_orchestration: true
    human_note: 编制 → 审批 → 生效
    steps:
      - {actor: 人力, command: 编制激励方案版本, aggregate: AGG-75}
      - {actor: 管理层, platform_task: true, service: platform.approval, command: 激励方案审批, gap: G-02}
      - {actor: 人力, command: 生效激励方案版本, aggregate: AGG-75, emits: [激励方案已生效]}
    notes: 规则与额度。

  - id: PRC-122
    name: 核定奖金
    trigger:
      type: event
      events: [{event: 绩效评估已确认, aggregate: AGG-106}]
    stages: [VS-13.2]
    owner_bc: B-15
    human_orchestration: false
    steps:
      - {actor: 人力, read: true, reads: [AGG-75, AGG-106], desc: 读激励方案与核定依据的绩效评估}
      - {actor: 管理层, command: 核定奖金, aggregate: AGG-76, emits: [奖金已核定], desc: 草拟 → 已核定，发放经月度薪酬结算}
    notes: 订阅方 B-15（奖金核定依据）。草拟后核定是命令输入，无超时或退回分支，按非人工编排（⑥a 评审 M1）。

  - id: PRC-124
    name: 计算、审核并批准月度薪酬
    trigger:
      type: event
      events: [{event: 月度考勤已锁定, aggregate: AGG-97}]
    stages: [VS-13.3]
    owner_bc: B-15
    human_orchestration: true
    human_note: 计算、提交审核、审批，可退回重算
    steps:
      - {actor: 人力, read: true, reads: [AGG-97, AGG-74, AGG-76, AGG-93, AGG-62], desc: 读月度考勤、参保、奖金核定、薪酬档案与人员}
      - {actor: 人力, command: 计算, aggregate: AGG-73, desc: 6e 前为薪酬汇总导入（FD-30）}
      - {actor: 人力, command: 提交审核, aggregate: AGG-73}
      - {actor: 财务主管, platform_task: true, service: platform.approval, command: 薪酬审核}
      - {actor: 财务主管, command: 批准, aggregate: AGG-73, emits: [薪酬已批准], desc: 代扣只限法定项目（INV-70）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-73, calls: PRC-92, desc: 职工薪酬计提}
    notes: 取批准时提交一次过账候选，发放只置「已发放」，「已过账」由过账完成事件经事件策略 PRC-134 置位（G-18 已处理）。

  - id: PRC-125
    name: 申报个税扣缴与社保公积金
    trigger:
      type: event
      events: [{event: 薪酬已批准, aggregate: AGG-73}]
    stages: [VS-13.4, VS-06.1]
    owner_bc: B-15
    human_orchestration: false
    steps:
      - {actor: 人力, read: true, reads: [AGG-74, AGG-81], desc: 读当月参保增减员与所属期}
      - {actor: 人力, command: 生成申报, aggregate: AGG-95}
      - {actor: 人力, command: 提交申报, aggregate: AGG-95, emits: [个税与社保公积金申报已提交]}
      - {actor: 人力, command: 登记缴款, aggregate: AGG-95}
      - {actor: 人力, command: 更正申报, aggregate: AGG-95, branch: 更正}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-95, calls: PRC-92}
    notes: P-39 法定申报期限提醒。申报端回执、更正申报无超时或退回分支，按非人工编排（⑥a 评审 M1）。

  - id: PRC-128
    name: 办理离职
    trigger: {type: human, desc: 员工提出离职或公司决定终止}
    stages: [VS-13.6]
    owner_bc: B-13
    human_orchestration: false
    steps:
      - {actor: 员工, command: 申请离职, aggregate: AGG-62}
      - {actor: 人力负责人, command: 批准离职申请, aggregate: AGG-62, desc: B-13 内单级批准，不经 platform.approval（intent 114200 F-3，同 AGG-65）}
      - {actor: 人力, command: 办理离职, aggregate: AGG-62, emits: [Separated]}
      - {actor: 人力, command: 终止劳动合同, aggregate: AGG-67, emits: [劳动合同已终止]}
      - {actor: 人力, command: 终止任职, aggregate: AGG-63, emits: [任职已变更]}
    notes: 最后一期薪酬随月度结算发放。

# ═════════════ 事件策略（单步事件策略，不计流程数；⑥a 评审 H2 b）═════════════
event_policies:

  - id: PRC-15
    name: 未签约的售前投入转费用
    trigger:
      type: event
      events: [{event: 商机已丢单, aggregate: AGG-10}, {event: 商机已放弃, aggregate: AGG-10}]
    stages: [VS-01.2]
    owner_bc: B-07
    step: {actor: 系统策略, command: 售前投入转费用, aggregate: AGG-43, emits: [成本结转已过账], post: true, calls: PRC-92, desc: P-43}
    notes: 另有定时分支：立项后回签前先挂合同履约成本（A7）的投入，超过 N 个月未签约转费用，N 交财务（待财务，intent 120544 P-2；G-04 的定时命令约定未定）。

  - id: PRC-25
    name: 转入售前投入
    trigger:
      type: event
      events: [{event: ContractSigned, aggregate: AGG-13}, {event: 项目已建立, aggregate: AGG-19}]
      gate: 合同已签回（ContractSigned）且项目已建立，两者齐备才转入，后到者触发，按商机与合同幂等；赢单（OpportunityAccepted）不触发（intent 120544 P-2）
    stages: [VS-02.0, VS-04.1]
    owner_bc: B-07
    step: {actor: 系统策略, command: 转入售前投入, aggregate: AGG-43, emits: [成本结转已过账], post: true, calls: PRC-92, desc: 合同签回且项目已建立后按冲销加新事实转入（P-43）；一商机多合同按 WBS 挂接归属（Q12）转入各合同对应项目，不按合同额分摊（intent 120544 P-2）}
    notes: 触发语义为「合同签回且项目已建立」两者齐备，赢单不转入（intent 120544 P-2，C-53）。立项后回签前的投入按 A7 先挂合同履约成本；超 N 个月未签约转费用，N 交财务（待财务）。

  - id: PRC-35
    name: 项目或协议终止、结项后清算成本
    trigger:
      type: event
      events: [{event: 项目已终止, aggregate: AGG-19}, {event: 项目已取消, aggregate: AGG-19}, {event: 项目已结项, aggregate: AGG-19}, {event: 协议已终止, aggregate: AGG-13}]
    stages: [VS-02.7, VS-04.5]
    owner_bc: B-07
    step: {actor: 系统策略, command: 终止清算成本, aggregate: AGG-43, emits: [成本结转已过账], post: true, calls: PRC-92, desc: 终止清算与超期转费用}
    notes: 订阅关系 B-07 → B-04、B-05（事件）已有。

  - id: PRC-51
    name: 建立并更新开票与收入额度
    trigger:
      type: event
      events: [{event: ContractSigned, aggregate: AGG-13}, {event: 新基线已生效, aggregate: AGG-13}]
    stages: [VS-04.1, VS-04.3]
    owner_bc: B-08
    step: {actor: 系统策略, command: 更新开票与收入额度, aggregate: AGG-44, emits: [可开票额度已更新]}
    notes: 协议已终止、协议已结算的订阅反应聚合稿未写，见 G-08、G-19。

  - id: PRC-53
    name: 确认收入
    trigger:
      type: event
      events: [{event: 交付物已认可, aggregate: AGG-27}, {event: 无异议已声明, aggregate: AGG-27}]
    stages: [VS-04.2]
    owner_bc: B-08
    reads: [AGG-13, AGG-92, AGG-38]
    step: {actor: 系统策略, command: 确认收入, aggregate: AGG-44, emits: [RevenueRecognized], post: true, calls: PRC-92, desc: 规则层（ADR-0016 决定 4）在履约义务额度上占用；校验证据类型已开放、须附证据齐全、发包人代表或通知联系人匹配并派生认可日；书面无异议声明路径同样须证据类型已开放（INV-23）否则失败并告警；业务日期 = 认可日}
    notes: 补「无异议已声明」触发（⑥a 评审 H3、H4）。期间落已关账月时由期间闸门路由到开放期间并标原期间（INV-92）。里程碑认可 MilestoneAccepted 随 Q21，B-08 → B-04 边未登记，不加边，记入 G-19。

  - id: PRC-55
    name: 结转合同履约成本
    trigger:
      type: event
      events: [{event: BusinessFactAttributed, aggregate: AGG-77}]
    stages: [VS-04.2]
    owner_bc: B-07
    step: {actor: 系统策略, command: 结转合同履约成本, aggregate: AGG-43, emits: [成本结转已过账], post: true, calls: PRC-92, desc: 过账事实为收入确认类型时；转出金额配对已确认收入（INV-88，待定 Q20）}
    notes: N-16：与收入确认同期间但不同事务。

  - id: PRC-56
    name: 付款条件项转为可结算
    trigger:
      type: event
      events: [{event: 交付物已认可, aggregate: AGG-27}]
    stages: [VS-04.3]
    owner_bc: B-05
    step: {actor: 系统策略, command: 标记付款条件项可结算, aggregate: AGG-13, emits: [付款条件项已可结算], desc: 条件状态，可开票额度的金额在 AGG-44；发事件「付款条件项已可结算」订阅方 B-08（⑥a 评审 H4）}
    notes: STEP3 C-22 / R-02：可结算留在 B-05，由认可事件触发；B-05 → B-28 边已有（api、事件）。

  - id: PRC-59
    name: 由销项发票创建应收
    trigger:
      type: event
      events: [{event: InvoiceIssued, aggregate: AGG-46}]
    stages: [VS-04.4]
    owner_bc: B-09
    step: {actor: 系统策略, command: 创建应收, aggregate: AGG-49, desc: 销售应收只由蓝字发票产生（INV-76）}
    notes: §4.3 步 8 写事件「应收已创建」，AGG-49 事件列无此名，见 G-08。

  - id: PRC-93
    name: 生成会计分录
    trigger:
      type: event
      events: [{event: BusinessFactAttributed, aggregate: AGG-77}, {event: BusinessFactRestated, aggregate: AGG-77}]
    stages: [VS-10.1]
    owner_bc: B-20
    step: {actor: 系统策略, command: 生成分录, aggregate: AGG-84, emits: [分录已记账], desc: 两账分录同一事务（INV-96）；来源不在授权表则进待处理}
    notes: 原为人工编排流程，现拆为本事件策略与单聚合维护 PRC-135（待处理队列、推送与重投）（⑥a 评审 M1）。G1 期间银行、税费、固定资产、薪酬汇总走 ledger 内导入通道。

  - id: PRC-103
    name: 生成期间余额快照
    trigger:
      type: event
      events: [{event: AccountingPeriodClosed, aggregate: AGG-81}]
    stages: [VS-10.2]
    owner_bc: B-20
    step: {actor: 系统策略, command: 生成快照, aggregate: AGG-100, emits: [期间余额快照已生成], desc: 只追加；之后的更正进开放期间快照的调整栏（INV-106）}
    notes: 订阅方向 B-20 → B-19（事件）。

  - id: PRC-113
    name: 并入股息红利个税扣缴申报
    trigger:
      type: event
      events: [{event: 利润分配已支付, aggregate: AGG-109}]
    stages: [VS-12.2, VS-13.4]
    owner_bc: B-15
    step: {actor: 系统策略, command: 并入扣缴申报, aggregate: AGG-95}
    notes: 沿已有边 B-15 → B-10，不新增反向边。

  - id: PRC-126
    name: 提交应付薪酬
    trigger:
      type: event
      events: [{event: 薪酬已批准, aggregate: AGG-73}]
    stages: [VS-13.5]
    owner_bc: B-15
    step: {actor: 系统策略, command: 提交应付薪酬, aggregate: AGG-52, emits: [应付已确认], desc: 法人 × 月一笔实发合计，按来源单据 ID 幂等}
    notes: 之后走「发起、审批并执行付款」；P-40 每月至少一次支付工资。

  - id: PRC-127
    name: 薪酬发放完成
    trigger:
      type: event
      events: [{event: 应付已结清, aggregate: AGG-52}]
    stages: [VS-13.5]
    owner_bc: B-15
    step: {actor: 系统策略, command: 标记薪酬已发放, aggregate: AGG-73, emits: [薪酬已发放], desc: 退票时付款已失败，薪酬保持已批准，重入付款}
    notes: 订阅关系 B-15 → B-10（api、事件）；「已过账」见事件策略 PRC-134。

  - id: PRC-129
    name: 离职后吊销会话
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
    stages: [VS-13.6]
    owner_bc: platform.identity
    step: {actor: 系统策略, platform_task: true, service: platform.identity, command: 吊销会话, desc: 聚合稿 §1.4 G-2 强制事件反应，已建}
    notes: 平台已建模块，不是企业聚合。

  - id: PRC-131
    name: 付款成功后核销应付
    trigger:
      type: event
      events: [{event: 付款已成功, aggregate: AGG-53}]
    stages: [VS-05.5, VS-08.1, VS-08.3, VS-12.2, VS-12.3, VS-13.5]
    owner_bc: B-10
    step: {actor: 系统策略, command: 核销应付, aggregate: AGG-52, emits: [应付已核销, 应付已结清], desc: 订阅付款已成功，把占用转为核销（R-03）}
    notes: 由原 PRC-75 步骤 6 拆出（⑥a 评审 M6）。

  - id: PRC-132
    name: 应付核销后置付款已核销并提交过账候选
    trigger:
      type: event
      events: [{event: 应付已核销, aggregate: AGG-52}]
    stages: [VS-05.5, VS-08.1, VS-08.3, VS-12.2, VS-12.3, VS-13.5]
    owner_bc: B-10
    step: {actor: 系统策略, command: 置付款已核销, aggregate: AGG-53, post: true, calls: PRC-92, desc: 订阅应付已核销；之后提交过账候选}
    notes: 由原 PRC-75 步骤 7、8 拆出（⑥a 评审 M6）。

  - id: PRC-133
    name: 应付结清后报销置已付
    trigger:
      type: event
      events: [{event: 应付已结清, aggregate: AGG-52}]
    stages: [VS-08.3]
    owner_bc: B-12
    reads: [AGG-52]
    step: {actor: 系统策略, command: 标记费用报销已付, aggregate: AGG-59, desc: 按来源报销取其应付；触发事件已是应付已结清，部分付款不触发，故不会置已付（⑥a 评审 H5，G-09；⑥a 复核改触发）}
    notes: 触发由「付款已成功」改为「应付已结清」（⑥a 复核）：AGG-52「应付已结清」订阅方加 B-12，AGG-53「付款已成功」订阅方去掉 B-12；B-12 → B-10 边已有且含「事件」方式，不新增边。AGG-59 依赖列仍写「AGG-53 付款已成功（事件）」，宜改为「AGG-52 应付已结清（事件）」，待聚合稿同步。

  - id: PRC-134
    name: 薪酬事实已过账置位
    trigger:
      type: event
      events: [{event: BusinessFactAttributed, aggregate: AGG-77}]
    stages: [VS-13.3]
    owner_bc: B-15
    step: {actor: 系统策略, command: 标记已过账, aggregate: AGG-73, desc: 按来源单据 ID 取薪酬行；已发放与事实已过账两个条件任一后到者触发（符合性审查 断链 7）}
    notes: 由原 PRC-124 末步与 PRC-127 第二步拆出（G-18 已处理）。

  - id: PRC-91
    name: 认定工时有效性
    trigger:
      type: event
      events: [{event: TimesheetApproved, aggregate: AGG-39}]
      gate: 期间闸门——目标期间尚未封期（AGG-81 开放）；期间封期前由项目经理对已审批工时批量认定（⑥a 评审 M7）
    stages: [VS-10.1]
    owner_bc: B-06
    step: {actor: 项目经理, command: 认定工时有效性, aggregate: AGG-39, emits: [工时已认定], desc: 有效 / 无效 / 返工 / 可计费四类之和等于填报总数}
    notes: 认定结果是人工成本分配的输入（INV-89 只分配已锁定工时）。一个事件、一步命令，无超时或退回分支，由业务流程移入事件策略（⑥a 复核）。

  - id: PRC-130
    name: 离职后参保减员
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 人力收到离职事件后 15 日内办理转移手续（P-32）
    stages: [VS-13.6]
    owner_bc: B-15
    step: {actor: 人力, command: 参保减员, aggregate: AGG-74, emits: [参保已减员]}
    notes: Separated 订阅方已补 B-15（B-15 → B-13 边已有，AGG-74 引用加「事件」）。一个事件、一步命令，由业务流程移入事件策略（⑥a 复核）。

# ═════════════ 单聚合维护（单聚合生命周期或维护，归第 ④ 步状态机，不计流程数；⑥a 评审 H2 a）═════════════
single_aggregate:

  - id: PRC-06
    name: 做独立性检查
    aggregate: AGG-18
    owner_bc: B-03
    stages: [VS-01.2]
    desc: 我方为 IDI 风险管理机构时，商机进入跟进后由技术专家登记检查结论（读建设工程与我方参与记录、既有结论为前置读，不另列步骤）
    commands:
      - {actor: 技术专家, command: 登记独立性检查结论, emits: [独立性检查已有结论]}
    notes: 有冲突时须取得并登记书面同意（本聚合附件）。拦截点在递交投标、直接委托赢单（售前，D-4 b）与签约前读取（INV-33，见「参加投标，登记结果并处理保证金」「起草、评审并回签协议」）。由业务流程移入单聚合维护（intent 120544 P-5；回溯检查 RD-12）。

  - id: PRC-10
    name: 收付保证金与保函
    aggregate: AGG-51
    owner_bc: B-09
    stages: [VS-01.2, VS-04.1]
    desc: 投标、履约或质保需缴纳或收取保证金、开立保函
    commands:
      - {actor: 出纳, command: 登记保证金缴纳, emits: [保证金已缴]}
      - {actor: 出纳, command: 登记保函开立, branch: 保函}
      - {actor: 出纳, command: 扣减保证金, branch: 扣减, desc: 履约保证金可部分扣减（INV-20）}
      - {actor: 出纳, command: 退还保证金, emits: [保证金已退]}
      - {actor: 出纳, command: 没收保证金, branch: 没收, emits: [保证金已没收]}
      - {actor: 出纳, command: 登记保函到期或索赔, branch: 保函, emits: [保函已到期]}
      - {actor: 系统策略, command: 提交过账候选, calls: PRC-92}
    notes: 退还与没收互斥各只一次（INV-20）；P-10 保证金比例与退还时限为判定加提醒。由业务流程移入单聚合维护（intent 120544 P-5；回溯检查 RD-12）。

  - id: PRC-14
    name: 登记建设工程与招标项目
    aggregate: REF-01
    owner_bc: B-01
    stages: [VS-01.2, VS-02.6, VS-03.1]
    desc: 客户经理或项目经理登记受检对象或招标信息
    commands:
      - {actor: 市场和客户经理, command: 登记建设工程, aggregate: AGG-33, emits: [建设工程已登记]}
      - {actor: 市场和客户经理, command: 登记招标项目, gap: G-06}
      - {actor: 市场和客户经理, command: 更新外部状态, aggregate: AGG-33, desc: 只记录并带登记日期与来源（R-08）}
    notes: 外部引用对象只记录、不控制，不作阶段门。由业务流程移入单聚合维护（intent 120544 P-5；回溯检查 RD-12）。

  - id: PRC-01
    name: 举办市场活动
    aggregate: AGG-08
    owner_bc: B-03
    stages: [VS-01.1]
    desc: 市场部立项并开展活动
    commands:
      - {actor: 市场和客户经理, command: 计划市场活动}
      - {actor: 市场和客户经理, command: 开展市场活动}
      - {actor: 市场和客户经理, command: 结束市场活动, emits: [市场活动已结束]}
    notes: 活动产生的线索由「登记并跟进线索，转为商机」承接，活动对象只在线索上留来源引用。

  - id: PRC-02
    name: 计划并完成客户活动
    aggregate: AGG-102
    owner_bc: B-03
    stages: [VS-01.1]
    desc: 客户经理为拜访或跟进排计划
