      - {actor: 设计师和顾问, command: 确认发包人资料, aggregate: AGG-32, emits: [发包人资料已确认]}
      - {actor: 设计师和顾问, command: 退回发包人资料, aggregate: AGG-32, branch: 退回（资料有缺陷）, emits: [发包人资料已退回]}
    notes: 资料不合格是设计变更与延期的起因；P-26 逾期未提供提醒。

  - id: PRC-28
    name: 编制、评审并签发交付物，送达并登记客户认可
    trigger: {type: human, desc: 设计师按工作包编制成果}
    stages: [VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-03.5]
    owner_bc: B-28
    human_orchestration: true
    human_note: 内部评审不通过须整改后复审；客户审查期、退回修改、轮次与书面声明
    merged_from: [PRC-29]
    steps:
      - {actor: 设计师和顾问, read: true, reads: [AGG-19, AGG-20, AGG-66], desc: 读项目、阶段与签发人执业证书（INV-47）}
      - {actor: 设计师和顾问, command: 编制交付物, aggregate: AGG-27}
      - {actor: 技术专家, command: 登记内部评审结论, aggregate: AGG-27, desc: 未通过内部评审即交付为 P-22 写入前预警}
      - {actor: 注册执业人员, command: 签发交付物, aggregate: AGG-27, emits: [交付物已签发]}
      - {actor: 项目经理, command: 登记提交轮次送达, aggregate: AGG-27, emits: [交付物已送达], desc: 项目经理向客户送达交付物（合并原 PRC-29，⑥a 评审 H2 c、M2）}
      - {actor: 项目经理, command: 登记客户认可, aggregate: AGG-27, emits: [交付物已认可], desc: 有阻断性不符合项时拒绝（INV-48）}
      - {actor: 项目经理, command: 登记客户退回, aggregate: AGG-27, branch: 退回, emits: [AcceptanceReturned], desc: 轮次加 1}
      - {actor: 项目经理, command: 登记项目经理的无异议声明, aggregate: AGG-27, branch: 无异议声明, emits: [无异议已声明]}
    notes: 合并原 PRC-29。检查报告走同一流程（INV-51 同 BC 前置读不符合项）；已发布版本不可改，只出新版本（INV-46）。交付侧不判断视为同意，期满判定在 B-08（D-8）。订阅方 B-08、B-05。

  - id: PRC-30
    name: 提出并批准完工估算
    trigger: {type: human, desc: 项目总监在各阶段门处更新成本}
    stages: [VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-04
    human_orchestration: false
    steps:
