    events: [{event: AccountingPeriodClosed, aggregate: AGG-81}]
    reads: [AGG-79, AGG-80, AGG-100]
    stages: [VS-09.3, VS-10.2]
    desc: 关账后对比目标与实际，解释偏差；reporting 订阅全部领域事件（ADR-0023）。管理层复盘会议在系统外；需要调整计划时转入「编制、批准并基线化经营计划与预算」，reporting 只读，不调用命令。
    notes: 只读、无命令，由业务流程移出为读模型（⑥a 复核）。

  - id: PRC-106
    name: 出具三大报表
    owner_bc: B-21
    events: [{event: AccountingPeriodClosed, aggregate: AGG-81}]
    reads: [AGG-81, AGG-100, AGG-101, AGG-86]
    stages: [VS-10.2]
    desc: 期间关账后，财务出表：读关账状态、余额快照、对账结论与报表行定义，生成并发布报表（单据，非聚合）。收付口径须等对账、已启用第 13 期的年度须两期关账后发布，均为读取检查，无引擎调度的等待；报表、经营月报、对账差异记录是单据，不是对象状态（Q-B）。
    notes: 只读、无命令，由业务流程移出为读模型（⑥a 复核）。

