      - {actor: 出纳, command: 登记付款失败, aggregate: AGG-53, branch: 退票, emits: [付款已失败], inner: [{command: 释放核销占用, aggregate: AGG-52}], desc: 退票时释放占用，付款重入}
    notes: 应付已结清的订阅方 B-15（薪酬，PRC-127）。原步骤 6–8（核销应付、置付款已核销、提交过账候选）改为事件策略 PRC-131、PRC-132（⑥a 评审 M6）。

