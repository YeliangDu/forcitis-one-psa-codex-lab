# 全企业业务流程清单第 2 版（提议稿，METHOD 第 4 稿第 ⑥a 步；opus 首轮评审后修订；待用户确认；不进 SSOT）
# 说明、分组表、gaps 与待交 one-glossary 用语见同目录 STEP6A_PROCESSES.md；校验与计数由 processes_check.py 输出。
# 输入：value-streams.v2.yaml（13 条价值流、51 个阶段）；ENTERPRISE_AGGREGATES_DRAFT.md §2.2（聚合、事件、订阅方）、§2.3、§4.1、§4.3、§4.6；STEP3_STAGES.md §4（R-01–R-12）。
# 只列清单，不画 BPMN；人工编排流程（human_orchestration: true）留给 ⑥b 画图。
#
# 业务流程的口径（⑥a 评审 H2，【裁量】）：同时满足才算业务流程 ① 由业务事件或人的业务决定触发；② 跨两个以上聚合，或跨两个以上角色并有交接；
#   ③ 结果是某价值流阶段的进入或退出状态。其余分三处放：
#     processes         业务流程（含合并后的）
#     read_models       读模型：只读、无命令（⑥a 复核按同一判据移出）；可覆盖阶段，仅当某阶段只有读模型覆盖时在 stages_without_process 标 coverage: 读模型
#     event_policies    单步事件策略：一个事件、一步命令，不计流程数
#     single_aggregate  单聚合生命周期或维护：归第 ④ 步状态机，不计流程数
#     merged            被并入别的流程的编号（merged_into），保留以便追溯；合并后保留最小编号
#   编号在五处合计唯一且连续（PRC-01 至 PRC-135）。
#
# 字段约定
#   trigger.type：event（领域事件 + 发布聚合）、time（定时）、human（人工发起）、call（被其他流程的步骤调用）
#     trigger.gate  事件触发的期间闸门或其他放行条件（⑥a 评审 M7）
#   steps：有序；每步 actor（人工角色或系统策略）+ command + aggregate + emits（事件，须取自聚合稿 §2.2 该聚合该命令声明的事件）
#     read: true            只读步骤，不需命令；reads 列出读取的聚合（方向须与 §4.1 依赖边一致）
#     platform_task: true   平台已建模块上的人工任务（审批、身份），不是企业聚合；service 须是已登记的 platform.* 模块
#     命令名                 须出现在该聚合在聚合稿 §2.2「命令（→ 事件；前置 INV）」列中（含 inner、also 的聚合）；processes_check.py 逐步核对（形式检查，命令列由本清单汇入，待第 ④ 步独立复核）
#     branch                同一位置的分支（不是顺序下一步）；含「退回 / 驳回 / 撤回 / 退票 / 未通过 / 拒绝 / 超时」的分支算退回或超时分支
#     on_event              本步由某事件触发的反应（编舞），可多个；事件须是聚合稿事件，方向与 §4.1 边的「事件」方式须成立
#     bc                    本步实际执行的 BC（默认 owner_bc）；用于合并流程中下游 BC 的反应步骤，方向按 bc 检查
#     on_time               本步由定时或期限届满触发，算超时分支
#     post: true            步末在同一聚合上提交过账候选，调用 PRC-92（命令「提交过账候选」须在命令列中）
#     inner                 同一命令内部再改另一个聚合（两次事务各改一个聚合），方向按主聚合所在 BC 检查
#     also + c_exception    ADR 认可的多聚合同事务（C 类，按不变量编号精确匹配聚合稿 §1.2 的 C 类），只有开票 / 红冲（INV-73）
#     calls                 本步之后调用另一个流程
#     gap                   本步受某条 gaps 影响
#   human_orchestration：含需流程引擎调度的人工任务；为 true 时须有 platform.approval 任务、带超时的分支（on_time 或分支名含「超时」）或退回分支之一（⑥a 评审 M1）
#   merged_from：本流程合并了哪些原编号
#   owner_bc：编排所在 BC 或流程模块；步骤涉及的聚合须在 owner_bc 自身或其上游（§4.1，下游调上游）；reporting 只读
#   stages_without_process：没有业务流程覆盖的阶段，coverage 写 事件策略 / 单聚合维护 / 读模型 / 无需系统支持，并写理由

meta:
  version: 2
  status: proposal
  date: "2026-10-16"
  step: METHOD 第 4 稿第 ⑥a（全企业业务流程清单；opus 首轮评审后修订）
  sources:
    stages: proposals/value-streams.v2.yaml
    aggregates: proposals/ENTERPRISE_AGGREGATES_DRAFT.md
    stage_review: proposals/STEP3_STAGES.md
  check: python3 -I docs/architecture/proposals/processes_check.py

processes:

  # ───────────── VS-01 选定服务方 ─────────────

  - id: PRC-03
    name: 登记并跟进线索，转为商机
    trigger: {type: human, desc: 客户来询、转介绍或市场活动产生线索}
    stages: [VS-01.1, VS-01.2]
    owner_bc: B-03
    human_orchestration: false
    merged_from: [PRC-04]
    steps:
      - {actor: 市场和客户经理, read: true, reads: [AGG-01, AGG-08], desc: 关联往来单位（可无）与市场活动}
      - {actor: 市场和客户经理, command: 登记线索, aggregate: AGG-09}
      - {actor: 市场和客户经理, command: 认领线索, aggregate: AGG-09}
      - {actor: 市场和客户经理, command: 挂起线索, aggregate: AGG-09, branch: 挂起, desc: 线索自身状态转换（跟进中 ⇄ 挂起）}
      - {actor: 市场和客户经理, command: 恢复线索, aggregate: AGG-09, branch: 挂起, desc: 挂起可恢复为跟进中（INV-24）}
      - {actor: 市场和客户经理, command: 新建商机, aggregate: AGG-10, desc: 先建商机（回溯检查 RD-01）：来源线索须为「跟进中」（前置读 AGG-09，同 BC），须有正式往来单位与唯一负责人（INV-25、26）；被拒时线索留在「跟进中」，补资料后重试，或按 INV-24 关闭（无价值）}
      - {actor: 市场和客户经理, command: 确认线索, aggregate: AGG-09, emits: [线索已确认], desc: 商机建成后确认，命令携带商机 ID 并按商机 ID 幂等，确认失败留在「跟进中」重试；已确认的线索不可再关闭（INV-24），故不先确认}
      - {actor: 市场和客户经理, command: 关闭线索, aggregate: AGG-09, branch: 无价值, emits: [线索已关闭], desc: 须填原因（INV-24）；新建商机被拒且不再跟进时走此分支}
      - {actor: 市场和客户经理, command: 变更商机负责人, aggregate: AGG-10, branch: 维护, desc: 只有一个负责人（INV-26）}
      - {actor: 市场和客户经理, command: 维护商机参与团队, aggregate: AGG-10, branch: 维护}
    notes: 线索可跳过（客户直接邀标或委托时从新建商机开始）；线索挂起与恢复属线索自身状态转换。「线索已确认」订阅方仅分析，本流程内顺序衔接，不另作事件触发。顺序为新建商机在先、确认线索在后（回溯检查 RD-01，与信息图 OBJ-17 状态机一致：只有商机建成才进入「已确认」）。新建商机只发内部事件，无外部消费者（⑥a 评审 L3，可接受）。

  - id: PRC-07
    name: 编制并生效报价
    trigger: {type: human, desc: 商机跟进中，客户询价或邀标}
    stages: [VS-01.2]
    owner_bc: B-03
    human_orchestration: true
    human_note: 报价评审（草拟 → 审批中 → 已通过 / 驳回）
    steps:
      - {actor: 市场和客户经理, read: true, reads: [AGG-05, AGG-06, AGG-07], desc: 读费率、系数与协议价目的生效版本（INV-32）}
      - {actor: 市场和客户经理, command: 编制报价版本, aggregate: AGG-12}
      - {actor: 市场和客户经理, command: 提交报价评审, aggregate: AGG-12}
      - {actor: 项目总监, platform_task: true, service: platform.approval, command: 报价评审}
      - {actor: 系统策略, command: 通过报价评审, aggregate: AGG-12, desc: 审批通过结果回调（已通过 = 评审通过并冻结，INV-31）}
      - {actor: 系统策略, command: 驳回报价评审, aggregate: AGG-12, branch: 驳回, desc: 审批驳回结果回调，退回编制}
      - {actor: 市场和客户经理, command: 生效报价版本, aggregate: AGG-12, emits: [报价版本已生效, 报价版本已被取代], desc: 旧版同事务被取代（INV-30）；生效 = 成为当前版本，须已通过}
      - {actor: 市场和客户经理, command: 作废报价版本, aggregate: AGG-12, branch: 作废, desc: 草拟或驳回的版本作废}
    notes: 报价被取代、投标被撤回时在本段内重入。「报价版本已生效」无事件消费者：签约时经投标承诺快照读取（见「起草、评审并回签协议」），可接受（⑥a 评审 L3）。

  - id: PRC-08
    name: 参加投标，登记结果并处理保证金
    trigger: {type: human, desc: 收到邀标或招标公告}
    stages: [VS-01.2]
    owner_bc: B-03
    human_orchestration: true
    human_note: 截止时间、开标公示等外部等待，可撤回或撤销
    merged_from: [PRC-09, PRC-11]
    steps:
      - {actor: 市场和客户经理, read: true, reads: [REF-01, AGG-01], desc: 读招标项目登记与联合体成员}
      - {actor: 市场和客户经理, read: true, reads: [AGG-18], desc: 读独立性检查结论（INV-33，D-4 b）：我方为 IDI 风险管理机构且有冲突未获书面同意的，不得递交投标、不得凭委托赢单}
      - {actor: 市场和客户经理, command: 登记资格预审结果, aggregate: AGG-11}
      - {actor: 市场和客户经理, command: 递交投标, aggregate: AGG-11, emits: [投标已递交], desc: 携承诺快照}
      - {actor: 市场和客户经理, command: 撤回或撤销投标, aggregate: AGG-11, branch: 撤回, emits: [投标已撤销]}
      - {actor: 市场和客户经理, command: 登记中标, aggregate: AGG-11, emits: [投标已中标]}
      - {actor: 市场和客户经理, command: 登记未中标, aggregate: AGG-11, branch: 未中标, emits: [投标未中标]}
      - {actor: 市场和客户经理, command: 登记废标, aggregate: AGG-11, branch: 废标, emits: [投标已废标], desc: 评标阶段被宣布废标；重新招标的另建投标，不重新招标的客户经理人工登记商机丢单或放弃商机}
      - {actor: 市场和客户经理, command: 放弃投标, aggregate: AGG-11, branch: 放弃}
      - {actor: 系统策略, command: 商机赢单, aggregate: AGG-10, on_event: [{aggregate: AGG-11, event: 投标已中标}], emits: [OpportunityAccepted], desc: 事件策略（⑥a 评审 M5）：中标即赢单；须中标或委托证据（INV-27）}
      - {actor: 系统策略, command: 登记商机丢单, aggregate: AGG-10, on_event: [{aggregate: AGG-11, event: 投标未中标}], emits: [商机已丢单], desc: 事件策略（M5）：未中标即丢单；非投标商机的丢单由客户经理人工登记同一命令}
      - {actor: 市场和客户经理, command: 商机赢单, aggregate: AGG-10, branch: 委托赢单, emits: [OpportunityAccepted], desc: 人工：直接委托凭委托证据（本聚合附件）赢单（INV-27）；我方为 IDI 风险管理机构的，须已读独立性检查结论无冲突或已获书面同意（INV-33，D-4 b）}
      - {actor: 市场和客户经理, command: 放弃商机, aggregate: AGG-10, branch: 放弃, emits: [商机已放弃]}
      - {actor: 系统策略, bc: B-09, command: 退还保证金, aggregate: AGG-51, on_event: [{aggregate: AGG-11, event: 投标未中标}], emits: [保证金已退], post: true, calls: PRC-92, desc: B-09 订阅投标未中标退还保证金（P-10 签约后 5 日未退提醒）；B-09 → B-03 边已有}
      - {actor: 系统策略, bc: B-09, command: 退还保证金, aggregate: AGG-51, branch: 废标, on_event: [{aggregate: AGG-11, event: 投标已废标}], emits: [保证金已退], post: true, calls: PRC-92, desc: B-09 订阅投标已废标退还保证金（回溯检查 RD-07）}
      - {actor: 系统策略, bc: B-09, command: 退还保证金, aggregate: AGG-51, branch: 截止前撤回, on_event: [{aggregate: AGG-11, event: 投标已撤销}], emits: [保证金已退], post: true, calls: PRC-92, desc: 仅截止前撤回时退还；是否退还按条例第 35 条另行核对，不写死；截止后撤销不适用}
      - {actor: 系统策略, read: true, reads: [AGG-11], desc: P-13 投标截止临近提醒}
    notes: 合并原 PRC-09（商机赢单或丢单）、PRC-11（投标未中标后退还保证金）（⑥a 评审 H2 c）；步骤带 bc 的是下游 BC 订阅事件后的反应（编舞），不是 B-03 的命令。联合体协议作投标的次级对象，不放合同。OpportunityAccepted 的订阅方 B-04、B-05、B-07 见「建立项目并组建团队」「起草、评审并回签协议」及事件策略「转入售前投入」。

  - id: PRC-13
    name: 批准并生效费率、计费系数与协议价目版本
    trigger: {type: human, desc: 财务或经营管理发起新费率、系数或协议价目版本}
    stages: [VS-01.2, VS-02.0]
    owner_bc: B-02
    human_orchestration: false
    steps:
      - {actor: 财务, command: 批准费率版本, aggregate: AGG-05, gap: G-02}
      - {actor: 财务, command: 生效费率版本, aggregate: AGG-05, emits: [费率版本已生效, 费率版本已被取代]}
      - {actor: 财务, command: 生效计费系数版本, aggregate: AGG-06, emits: [计费系数版本已生效], desc: 粒度待定 Q18}
      - {actor: 市场和客户经理, command: 生效协议价目版本, aggregate: AGG-07, emits: [协议价目版本已生效]}
    notes: 批准环节须财务审定，但批准是聚合命令，无退回、超时分支，审批走平台与否待 G-02。报价与项目预算读取这些版本（INV-32、INV-44）。

  - id: PRC-16
    name: 申请并转正风险交付授权
    trigger: {type: human, desc: 签约前需先行投入，项目经理申请授权}
    stages: [VS-01.2, VS-02.0, VS-04.1]
    owner_bc: B-05
    human_orchestration: true
    human_note: 申请 → 批准 → 转正或叫停
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-10, AGG-19, AGG-38], desc: 读商机、项目与依据证据}
      - {actor: 项目经理, command: 申请风险交付授权, aggregate: AGG-17}
      - {actor: 管理层, platform_task: true, service: platform.approval, command: 授权审批, gap: G-02}
      - {actor: 管理层, command: 批准风险交付授权, aggregate: AGG-17, emits: [风险交付授权已批准]}
      - {actor: 商务, command: 转正风险交付授权, aggregate: AGG-17, branch: 转正, emits: [Regularized], desc: 并入协议；转正与叫停互斥（INV-19）}
      - {actor: 管理层, command: 叫停风险交付授权, aggregate: AGG-17, branch: 叫停, emits: [Halted]}
    notes: 口径与转正时点待流程梳理（C-56）。


  # ───────────── VS-02 获得交付成果 ─────────────

  - id: PRC-17
    name: 建立项目并组建团队
    trigger:
      type: event
      events: [{event: OpportunityAccepted, aggregate: AGG-10}]
      desc: 项目经理收到赢单后建立项目；先行投入路径（风险交付授权已批准）由人工发起，B-04 不订阅 B-05（G-13）
    stages: [VS-02.0, VS-03.1]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-10, AGG-33], desc: 读来源商机与建设工程}
      - {actor: 项目经理, command: 建立项目, aggregate: AGG-19, emits: [项目已建立], desc: 项目可先于合同}
      - {actor: 项目经理, command: 登记我方参与记录, aggregate: AGG-33, desc: 随 D-4 b 由交付登记}
      - {actor: 项目经理, command: 建立项目 WBS, aggregate: AGG-20, desc: 每项目一棵，阶段按协议范围裁剪}
      - {actor: 项目经理, command: 维护项目团队成员, aggregate: AGG-24, gap: G-14}
      - {actor: 项目经理, command: 开始执行, aggregate: AGG-19, emits: [项目已开始执行], desc: 已立项 → 执行中；VS-02.0 退出、VS-03.1 进入与 VS-02 贯穿活动都以「执行中」为条件（符合性审查 必-7）}
    notes: 项目已建立的订阅方 B-07（售前投入转入，P-43）；项目建立前置（赢单或先行投入授权）见 G-13。「项目已开始执行」订阅方仅分析，不作任何流程触发（符合性审查 必-7；事件订阅规则 intent 114200 F-4，见 G-05）。VS-03 各流程不建项目，进入条件「执行中」由本流程提供（符合性审查 必-6）。

  - id: PRC-18
    name: 编制并批准交付计划
    trigger:
      type: event
      events: [{event: 项目已建立, aggregate: AGG-19}]
      desc: 项目建立后项目经理编制交付计划
    stages: [VS-02.0]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 编制交付计划版本, aggregate: AGG-21}
      - {actor: 项目经理, command: 批准交付计划, aggregate: AGG-21, emits: [交付计划已批准], desc: 对客批准或内部锁定}
      - {actor: 系统策略, read: true, reads: [AGG-21], desc: P-17 发包人 5 天未审核提醒}
    notes: 发包人 5 天未审核只提醒（P-17），无状态转换命令，不是引擎调度的超时。里程碑认可事件随 Q21 待定（见 G-14）。

  - id: PRC-19
    name: 编制并锁定项目预算
    trigger:
      type: event
      events: [{event: 项目已建立, aggregate: AGG-19}]
      desc: 项目建立后项目经理编制成本基线
    stages: [VS-02.0]
    owner_bc: B-04
    human_orchestration: true
    human_note: 编制中 → 审批中 → 已锁定
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-05, AGG-12], desc: 读费率版本与赢单报价版本（P-18 毛利预警）}
      - {actor: 项目经理, command: 编制项目预算版本, aggregate: AGG-22}
      - {actor: 项目总监, platform_task: true, service: platform.approval, command: 项目预算审批, gap: G-02}
      - {actor: 项目经理, command: 锁定项目预算, aggregate: AGG-22, emits: [项目预算已锁定]}
    notes: 锁定时冻结费率版本（INV-44）。

  - id: PRC-20
    name: 提出并满足资源需求
    trigger: {type: human, desc: 项目经理按工作包提资源需求}
    stages: [VS-02.0, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 提出资源需求, aggregate: AGG-25, emits: [资源需求已提出]}
      - {actor: 部门负责人, command: 确认资源分配, aggregate: AGG-26, emits: [资源分配已确认], desc: P-27 超产能写入前预警}
    notes: 具名人员、时段与工作包；审批在聚合自身状态（已计划 → 已确认），未走 platform.approval（见 G-02 待核），故不算引擎调度的人工编排。

  - id: PRC-23
    name: 填报并审批工时
    trigger: {type: human, desc: 员工按日填报工时}
    stages: [VS-01.2, VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-06
    human_orchestration: true
    human_note: 提交 → 审批 → 通过 / 退回 / 驳回，可撤回
    steps:
      - {actor: 员工, read: true, reads: [AGG-62, AGG-20, AGG-10, AGG-68, AGG-108, AGG-70, AGG-72, AGG-29], desc: 读人员、工作包、日历与标准工时、请假、加班、返工认定}
      - {actor: 员工, command: 提交工时单, aggregate: AGG-39, emits: [TimesheetSubmitted]}
      - {actor: 项目经理, platform_task: true, service: platform.approval, command: 工时审批}
      - {actor: 项目经理, command: 通过工时单, aggregate: AGG-39, emits: [TimesheetApproved]}
      - {actor: 项目经理, command: 退回工时单, aggregate: AGG-39, branch: 退回, emits: [TimesheetReturned]}
      - {actor: 项目经理, command: 驳回工时单, aggregate: AGG-39, branch: 驳回, emits: [TimesheetRejected]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-39, emits: [工时已过账], calls: PRC-92}
    notes: 阶段映射已收窄（⑥a 评审 M4）：只留进入或退出条件触及商机、工作包的阶段，去掉 VS-02.7 与 VS-03.2。已建 cost.timesheet；INV-37 缺费率的工时失败并告警；售前阶段可记工时归集到商机或客户活动。

  - id: PRC-24
    name: 暂停、恢复、终止或取消项目
    trigger: {type: human, desc: 项目总监或项目经理按情形发起}
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7]
