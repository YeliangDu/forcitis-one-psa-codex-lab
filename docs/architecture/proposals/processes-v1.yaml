      - {actor: 项目总监, command: 终止项目, aggregate: AGG-19, branch: 终止, emits: [项目已终止]}
      - {actor: 项目总监, command: 取消项目, aggregate: AGG-19, branch: 取消, emits: [项目已取消], desc: 无任何投入时}
    notes: 终止与取消须原因，可能经审批，审批未建模（状态机待 Q09），故按非人工编排（⑥a 评审 M1）。状态机与承担法人待 Q09、Q11（G-14）。

  - id: PRC-26
    name: 接收并确认发包人提供资料
    trigger: {type: human, desc: 发包人提供首批或后续资料}
