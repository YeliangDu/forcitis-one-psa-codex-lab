# ═════════════ 读模型（只读、无命令，不计流程数；⑥a 复核按 H2 同一判据移出）═════════════
# 字段：id、name、owner_bc、stages（服务的阶段）、reads（读取的聚合）、events（订阅的事件，可无）、desc（定时等非事件触发的说明）
