    events: [{event: 阶段已完成, aggregate: AGG-20}]
    reads: [AGG-20, AGG-27]
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7]
    desc: STEP3 R-12 的读模型；reporting 订阅阶段已完成，合并交付物已认可 / 已声明，产生门预警并留痕，不进聚合；门只预警不拦截（S2）。其余价值流的门预警同此模式，按阶段登记时补。
    notes: 只读、无命令，由业务流程移出为读模型（⑥a 复核）。

  - id: PRC-62
    name: 质量保证金到期提示
    owner_bc: B-09
    reads: [AGG-49]
    stages: [VS-04.4]
    desc: 定时：缺陷责任期届满。P-11 到期未申请返还提醒；到期可收是读模型按到期日派生的提示，不是状态，不改状态（STEP3 C-10；符合性审查 建-11）；之后走「认领收款并核销应收」。
    notes: 只读、无命令，由业务流程移出为读模型（⑥a 复核）。

