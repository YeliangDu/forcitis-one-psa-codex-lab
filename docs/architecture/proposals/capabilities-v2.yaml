# 按对象命名的业务能力图（提议稿 v2，METHOD 第 4 稿第 ② 步；说明见同目录 STEP2_CAPABILITIES.md）
# 状态：提议，待用户确认；不替换现行 togaf/capabilities.yaml，定稿后按最终一次性 ADR 落地。
# 生成规则（STEP2_CAPABILITIES.md §1）：
#   - 信息图 ENTERPRISE_INFO_MAP_DRAFT.md 每个一级对象一个一级能力，每个次级对象一个二级能力；不手写三级。
#   - 依附于次级对象的对象（如报价估算分解 → 报价）展平为其所属一级对象下的二级能力，via 记直接父对象。
#   - 多父对象按信息图显式「主父对象」列上溯，记在 primary_parent；其余父对象记在 other_parents（STEP2 §6 P1【裁量】）。
#     信息图现无「主父对象」列，需加列（本稿不改信息图）；加列前按 STEP2 §6 P1 的表生成。
#   - 命名「对象 + 管理」/「<Object> Management」（BIZBOK v11 §2.2；G211 §2.1.1 名词—动词）；名称取信息图对象名。
#   - 定义一句话，只说做什么，不说怎么做、谁做、在哪、为什么；不出现「管理」二字。
#   - 能力只作视图、第 ③ 步能力—阶段对账与 §8.6 查漏，不检验信息图、不驱动 BC。
#   - 本文件禁止出现 bc、module、subdomain 及同义字段（METHOD 第 4 稿第 ② 步第 7 条）。
# 字段：id（CAP-<一级对象号> / CAP-<一级对象号>.<次级对象号>，三位数字，与现行两位编号不冲突）；name；en；object；
#       definition；via（展平时的直接父对象）；primary_parent（多父对象的主父对象）；other_parents（多父对象的其余父对象）；note。
# 英文名：terms.yaml 已登记的对象取其英文；未登记的为提议译名，随信息图交 one-glossary 查重，不在本稿登记。
