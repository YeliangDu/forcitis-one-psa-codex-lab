# concerns.proposal.yaml — 关注点登记（CON-ID）· 提议稿
#
# 目的：补上「从关注点到价值兑现」登记网络里唯一没有载体的那一格（02 关注点）。
#   没有 CON 登记，战略取舍没有落点，指标也无法证明"回答了谁的什么关注"。
#
# 闭包规则（本文件必须整体满足，validate_concerns.py 校验）：
#   C-1 每条关注点必须二选一：承接（accepted_as 非空）或弃权（rejected 非空），不得皆空、不得皆非空。
#   C-2 承接的关注点必须有 answered_by（≥1 个指标/事实测点），否则不可验证。
#   C-3 弃权的关注点必须有理由与决定者，并写复审条件；「延期」不得成为事实上的永久拒绝。
#   C-4 by 必须取 value-streams.v2.yaml 已登记的 SH-ID；accepted_as 必须取 value-streams.v2.yaml 的阶段号。
#   C-5 每条必须有 evidence（来源文件或 intent），不得凭印象登记。
#
# 关系：
#   SH（STAKEHOLDERS.md 36 个）──提出──▶ CON（本文件）──取舍──▶ 价值主张/阶段（value-streams.v2.yaml）
#   CON ──answered_by──▶ 指标（企业资料/VS-15 KPI 体系与 Schema；指标名沿用其记号）
#
# normative: false；未经裁定升格。指标名沿用 KPI 体系 V4.1 的记号（M*、N、E、L、O_ORG、O_CORP、CM_DEL、U、M、IMP_WIP、IMP_AR、EclAlert）。

version: 0.1
status: proposal
normative: false
updated: '2026-10-18'
sources:
  stakeholders: STAKEHOLDERS.md（36 个 SH；用户 intent 2026-10-15-213742）
  value_streams: value-streams.v2.yaml（13 条 VS / 53 段）
  strategy: 企业资料/VS-09_完成经营目标/战略与经营计划/FORCITIS 305战略规划备忘录.md（2026-08-29）
  kpi: 企业资料/VS-15_确立经营基准/指标口径与组织基准/FORCITIS_KPI体系.md（V4.1）

concerns:
  # ---------- 股东与管理层：战略假设（305 的三条假设 + 一条期权） ----------
  - id: CON-001
    by: SH-O1                      # 股东和合伙人
    kind: 风险
    concern: 国内回到旧式高杠杆、高周转增长模式的概率下降；传统新建地产设计业务量继续下行
    accepted_as: [VS-01, VS-09]    # 售前选择与经营目标：以"停止低价、长账期、无限责任业务"为前提
    answered_by: [N, CM_DEL]       # 净服务收入、项目贡献
    evidence: 305战略规划备忘录 §三(一)假设一
    valid_from: '2026-08'
    status: proposal

  - id: CON-002
    by: SH-C1                      # 房地产开发商
    kind: 诉求
    concern: 「好房子」从概念变成有硬标准的真实需求（GB 55038-2025 层高/电梯/隔声等），缺陷在交付前返工不可藏
    accepted_as: [VS-02.4, VS-02.6, VS-03]   # 成果、质量、风险结论
    answered_by: [CM_DEL, IMP_WIP]
    evidence: 305战略规划备忘录 §三(一)假设二（明确标注"付费方仍待验证，是假设不是事实"）
    valid_from: '2026-08'
    status: proposal

  - id: CON-003
    by: SH-C3                      # 既有建筑业主
    kind: 诉求
    concern: 既有建筑安全（外墙、隐患整治）的付费市场独立于城市更新政策，需独立验证
    accepted_as: [VS-03]
    answered_by: [N]
    evidence: 305战略规划备忘录 §三(一)假设三（原文："付费市场仍需独立验证"）
    valid_from: '2026-08'
    status: proposal

  - id: CON-004
    by: SH-C5                      # 资本方（投资方、金融机构、保险公司）
    kind: 诉求
    concern: 主办银行制与项目信用制下，需要独立技术判断：项目能否建成、成本是否可信、技术风险与未来 CAPEX
    accepted_as: [VS-03]           # 获得风险结论
    answered_by: [N]               # 新增咨询服务收入
    evidence: 305战略规划备忘录 §三(二)「新增战略期权：资本端技术服务」（原文：这是推论，不是已成立的市场）
    valid_from: '2026-08'
    status: proposal

