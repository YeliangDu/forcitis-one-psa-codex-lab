# vs07：人员组 VS-07 任用员工、VS-13.6 离职结清的流程（PRC-83、84、137 是用户已批准的样板，本轮只做新原则增补，不改业务设计）。
# 格式：closeout/CONVENTIONS.md 全量（含 §5：审批回调、why_human、notify、withdraw、pending）。
# 已定口径：U-12 业务生效日；Q-03 入职后开通企业微信；Q-08 只要职位目录；Q-09 三口径；F-3 B-13 内批准为聚合单级命令；
#   S-14 platform.identity 编排企业微信开通与停用；S-20 三口径预警在 B-15（PRC-145）；T-1–T-5（样板答复）；RULE-363 离职即吊销。
# 用户新原则（2026-10-16）：能由规则或不变量守卫的不设人工审批（拒绝 / 预警 / 自动分流，候选规则见 vs07.notes.md「规则候选」）；
#   保留的人工审批：B-13 聚合内批准（engine aggregate）approver 写类型级角色 SH-M1（部门负责人，resolve: type，见 notes「权责对照条目」；组织单元责任人即其人）；
#   B-13 内批准是聚合单级命令（F-3），不经审批平台，故无审批平台回调；加审只引用 guard: approval 的规则（AR-11、AR-12）。
# 〔缺〕= 聚合稿 / 平台没有的命令或事件，见 vs07.notes.md「新用语」。
# 扩展（已记入 notes「格式问题」）：decision 项可带 outcome（bpmn_gen 尚未读取，故每个流程内「到 end 的出口」都落在写了 outcome 的步骤上）；
#   步骤可带 branch 标签表示备选路径（v1 已有）；规则拒绝一律「退回本步改正」（goto 本步），不单设「已拒绝」结局。

processes:

  # ───────────── VS-07 任用员工 ─────────────

  - id: PRC-80
    name: 维护法人、组织与岗位
    trigger: {type: human, desc: 人力调整组织、岗位或登记法人主体}
    triggers:
      - {type: human, name: "人力登记法人主体"}
      - {type: human, name: "人力调整组织单元"}
      - {type: human, name: "人力指定法人归属"}
      - {type: human, name: "人力停用职位"}
      - {type: human, name: "人力更名、停用或启用法人主体"}
      - {type: human, name: "人力新建或修改职位"}
      - {type: human, name: "人力更正法人归属"}
      - {type: human, name: "人力结束法人归属"}
      - {type: human, name: "人力更正法人主体代码（未发号前）"}
    stages: [VS-15.2, VS-15.3]
    stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；VS-15.2 组织单元与岗位启用、VS-15.3 停用；法人主体筹建存续不作门；法人主体筹建存续不作门；原支撑理由：B-13 主数据维护：法人主体、组织单元、法人归属、职位目录条目的维护，结局不造任何阶段的退出条件（职位「启用」只是 VS-07.1 的进入条件，判据按退出条件归段），服务多条价值流（STAGE_ALIGN.md 归段判据第 6 项）"
    primary_object: OBJ-55
    secondary_objects: [OBJ-54, OBJ-58]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "法人、组织单元、职位目录、法人归属全量迁入（U-3、U-4），迁入不触发 P-31 待复核（ADR-0036 M7）；无在途实例"
    scope: "人力按法人与组织数据范围维护"
    outcomes: [已维护]
    scenarios: [PRC-80-S01, PRC-80-S02, PRC-80-S03, PRC-80-S04, PRC-80-S05, PRC-80-S06, PRC-80-S07, PRC-80-S08, PRC-80-S09, PRC-80-S10, PRC-80-S11, PRC-80-S12, PRC-80-S13, PRC-80-S14, PRC-80-S15]
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "维护法人、组织单元、职位目录与法人归属主数据", approval_right: "无（全部由不变量守卫，不设审批）", department_hint: "人力资源部", position_hint: "人事主数据维护岗（职能：维护组织与职位目录）"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "数据范围待复核时确认是否调整授权", approval_right: "无", department_hint: "区域或事业部", position_hint: "区域负责人（职能：对本区域组织数据范围负责）"}}       # 区域负责人：数据范围待复核时被通知（P-31）；区域负责人是否归 SH-M1 见 notes 格式问题 7
    steps:
      - actor: SH-E6
        where: in_system
        read: true
        command: 查看法人、组织与职位现状
        reads: [AGG-60, AGG-61, AGG-117, AGG-64]
        desc: 人力进入维护页查看现状后择一维护；各类维护互不依赖，本步是它们的共同入口（生成器把所有开始事件接到第 1 步，故写成入口选择）
        permission: 组织维护.查看
        page: 法人组织职位维护页
        decision:
          - {when: 登记法人主体, goto: 2}
          - {when: 调整组织单元, goto: 3}
          - {when: 指定法人归属, goto: 4}
          - {when: 更名法人主体, goto: 7}
          - {when: 停用法人主体, goto: 8}
          - {when: 启用法人主体, goto: 9}
          - {when: 新建岗位, goto: 10}
          - {when: 修改岗位, goto: 11}
          - {when: 更正法人归属, goto: 12}
          - {when: 结束法人归属, goto: 13}
          - {when: 更正法人主体代码, goto: 14}
          - {when: otherwise, goto: 5}      # 其余即停用职位
      - actor: SH-E6
        where: in_system
        branch: 登记法人
        command: 登记法人主体
        aggregate: AGG-60
        desc: 法人代码发号后不可改（INV-59）；五家法人由初始化录入，之后新增走本步（DATA_MODEL B-13）
        permission: 法人.登记
        page: 法人登记页
        audit: true
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 调整组织
        command: 调整组织单元
        aggregate: AGG-61
        emits: [组织单元已调整]
        desc: 按人事业务生效日生效（U-12）；B-13 自为记录系统，不再有 A8 同步来源（U-1、U-7）。撤销的组织单元下仍有在职任职则拒绝并提示先调岗（PRC-136），人力改正后重提
        permission: 组织单元.调整
        page: 组织单元维护页
        audit: true
        decision:
          - {when: 撤销的组织单元下仍有在职任职, goto: 3, rule: INV-60}
          - {when: otherwise, goto: 6}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 组织单元已调整}   # P-31；聚合稿 AGG-61 订阅方已写
      - actor: SH-E6
        where: in_system
        branch: 指定法人归属
        command: 指定法人归属        # 已建代码有对应命令；聚合稿 AGG-117 现已列入，去〔缺〕标记（QC-OBJECTS.md）
        aggregate: AGG-117
        emits: [〔缺〕法人归属已变更]
        desc: 部门默认法人或员工单独指定法人，按期间；同一对象期间不重叠（INV-新-P5，重叠则拒绝，人力改正后重提）。三口径之一，不一致由 B-15 预警（PRC-145），本步不拒绝
        permission: 法人归属.指定
        page: 法人归属维护页
        audit: true
        added_in: closeout
        decision:
          - {when: 法人归属期间与同一对象已有期间重叠, goto: 4, rule: INV-新-P5}
          - {when: otherwise, goto: end}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕法人归属已变更}   # 数据范围
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕法人归属已变更}               # PRC-145 订阅
      - actor: SH-E6
        where: in_system
        branch: 停用职位
        command: 停用岗位                    # Q-08 后为职位目录条目，改称待 one-glossary（notes 新用语）
        aggregate: AGG-64
        emits: [岗位已停用]
        desc: 职位仍被在职任职引用则拒绝，人力改正后重提（INV-63）
        permission: 职位目录.停用
        page: 职位目录维护页
        audit: true
        decision:
          - {when: 职位仍被在职任职引用, goto: 5, rule: INV-63}
          - {when: otherwise, goto: end}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-61, event: 组织单元已调整}]
        desc: P-31；对应词表「待调整权限」（ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 已维护
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 组织单元已调整}
      - actor: SH-E6
        where: in_system
        branch: 更名法人
        command: 更名法人主体        # 词表事件「法人主体已更名」；聚合稿只列登记法人主体（对象增删改查检查补缺，notes 结构问题 19）
        aggregate: AGG-60
        desc: 只改名称，追加名称版本；法人代码发号后不可改（INV-59）
        permission: 法人.更名
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 停用法人
        command: 停用法人主体        # 词表事件「法人主体已停用」
        aggregate: AGG-60
        desc: 法人主体不再作为法人使用；仍有有效法人归属或在职任职时是否拒绝，聚合稿与词表未定（notes 结构问题 19），暂只校验状态
        permission: 法人.停用
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 启用法人
        command: 启用法人主体        # 词表事件「法人主体已启用」
        aggregate: AGG-60
        desc: 恢复已停用的法人主体为有效
        permission: 法人.启用
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 新建职位
        command: 新建岗位        # Q-08 后为职位目录条目，命令名交 one-glossary
        aggregate: AGG-64
        desc: 新增职位目录条目（职位编码、名称、职位族、职级）；职位编码跨版本不变，同编码重复新建返回已有结果；初始目录仍由初始化录入
        permission: 职位目录.新建
        page: 职位目录维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 修改职位
        command: 修改岗位
        aggregate: AGG-64
        desc: 追加职位目录条目的新版本（名称、职位族、职级）；已停用的职位不可修改
        permission: 职位目录.修改
        page: 职位目录维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 更正法人归属
        command: 更正法人归属        # 聚合稿 AGG-117 已有命令，原无流程步骤引用
        aggregate: AGG-117
        desc: 只更正已关闭期间的结束日，只追加更正行不改写历史；更正后期间仍不得与同一对象其他期间重叠（INV-122），重叠则拒绝，人力改正后重提
        permission: 法人归属.更正
        page: 法人归属维护页
        audit: true
        decision:
          - {when: 更正后期间与同一对象其他期间重叠, goto: 12, rule: INV-122}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 结束法人归属
        command: 结束法人归属        # 已建代码 EndLegalEntityAttribution，规划原缺（one-architecture command-mapping 2026-10-21）
        aggregate: AGG-117
        desc: 为部门或员工当前的法人归属期间写入结束日，关闭当前期间；只关闭不改写历史，结束日不得早于期间开始日；操作人不得终止本人的归属；发「法人归属已结束」
        permission: 法人归属.终止
        page: 法人归属维护页
        audit: true
        emits: [法人归属已结束]
        decision:
          - {when: 该对象没有当前法人归属, goto: 13}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 更正法人主体代码
        command: 更正法人主体代码        # 已建代码 UpdateLegalEntity 的代码更正分支，规划原缺（one-architecture command-mapping 2026-10-21）
        aggregate: AGG-60
        desc: 法人代码登记有误且尚未用该代码发号时更正；已发号则拒绝（INV-59），只能另登法人主体
        permission: 法人主体.更正代码
        page: 法人主体维护页
        audit: true
        decision:
          - {when: 法人代码已用于发号, goto: 14, rule: INV-59}
          - {when: otherwise, goto: end}
    notes: "步 2–5、7–14 是人力择一执行的备选路径（步 1 是入口选择）；步 6 是步 3 的事件反应。职位目录的新建与修改命令聚合稿未列（notes 结构问题）。本流程无人工审批：全部由不变量守卫（INV-59、60、63、新-P5）。"

  - id: PRC-81
    name: 提出并批准招聘需求
    trigger: {type: human, desc: 用人经理提出}
    triggers:
      - {type: human, name: "用人经理提出招聘需求"}
    stages: [VS-07.1]
    primary_object: OBJ-60
    owner_bc: B-13
    human_orchestration: true
    human_note: 提交、批准或驳回，批准为本聚合命令
    type: business
    migration: "招聘需求全量迁入（来源 A8 用人申请表单，OA_PROCESS_INVENTORY 第 67 行，在途 5，待取证）；在途（已提交 / 已批准未关闭）按当前状态迁入，已关闭只迁结局与审计；迁入不发事件"
    scope: "用人经理看本部门；部门负责人看本部门；人力看全部"
    segregation:
      - {roles: [SH-E1, SH-M1], rule: "提出人与批准人不得为同一人；提出人本人就是归属组织单元的责任人时按 AR-11 由上级组织负责人批（处理方式待用户 V-18）"}
    outcomes: [已批准, 已关闭]
    scenarios: [PRC-81-S01, PRC-81-S02, PRC-81-S03, PRC-81-S04]
    roles:
      - {id: SH-E1, as: initiator, org_needs: {responsibility: "提出本部门招聘需求", approval_right: "无（提出人不得批准自己的需求）", department_hint: "用人部门", position_hint: "用人经理（职能：对本部门用人需求负责）"}}
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对本组织单元的用人取舍负责", approval_right: "批准招聘需求（类型级，单级）", department_hint: "需求所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人 = 招聘需求归属组织单元的责任人（cost_object_owner）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "需求批准后开展招聘", approval_right: "无", department_hint: "人力资源部", position_hint: "招聘专员（职能：组织招聘）"}}       # 人力：批准后开始招聘
    steps:
      - actor: SH-E1
        where: in_system
        read: true
        command: 查看职位目录与组织单元
        reads: [AGG-64, AGG-61]
        desc: 读职位目录与组织单元；Q-08 无编制，超编检查 P-33 已关闭，不再做
        permission: 招聘需求.提交
        page: 招聘需求编辑页
      - actor: SH-E1
        where: in_system
        command: 提交招聘需求
        aggregate: AGG-65
        desc: 职位、组织单元、人数、期望到岗日；职位须启用、组织单元须有效（规则候选 R-01，拒绝）；〔缺〕与候选人关联命令未见（PG-08）
        permission: 招聘需求.提交
        page: 招聘需求编辑页
        audit: true
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: 4, outcome: 已关闭}      # 批准前提出人撤回，走「关闭招聘需求」
        decision:
          - {when: 提出人在批准前撤回, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        command: 批准招聘需求
        aggregate: AGG-65
        emits: [招聘需求已批准]
        approval:
          engine: aggregate             # B-13 聚合内单级批准，不经 platform.approval（F-3；§4.3.4 第 4 条），故无审批平台回调
          doc_type: 招聘需求批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 4
          why_human: "增加人员成本是部门负责人对用人取舍的管理判断；Q-08 不管编制，没有可由规则判定的人数上限，职位有效等可校验的条件已由规则拒绝（R-01）"
        permission: 招聘需求.批准
        page: 招聘需求审批页
        audit: true
        pending: V-18
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信待办}]
        outcome: 已批准
        decision:
          - {when: 批准, goto: end}
          - {when: otherwise, goto: 4}
      - actor: SH-M1
        where: in_system
        branch: 驳回或关闭
        command: 关闭招聘需求
        aggregate: AGG-65
        emits: [招聘需求已关闭]
        desc: v1 以关闭代驳回，状态「已驳回」无独立命令；驳回由批准人执行，提出人撤回与已批准后因取消或录满的关闭由提出人或人力执行同一命令（录满无触发，PG-08）
        permission: 招聘需求.关闭
        page: 招聘需求审批页
        audit: true
        outcome: 已关闭
    notes: 批准不经 platform.approval（会成环）；需要多级审批时移出 B-13（聚合稿 §7 第 12 条），见 notes 待用户定 V-9、V-18。调入等非招聘入职跳过本流程。

  - id: PRC-82
    name: 登记候选人并作出录用决定
    trigger: {type: human, desc: 求职者应聘或用人经理推荐}
    triggers:
      - {type: human, name: "求职者应聘或用人经理推荐，人力登记候选人"}
    stages: [VS-07.2]
    primary_object: OBJ-56
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "候选人面试与录用记录全量迁入并加个人信息保护（用户 T-5，ADR-0043；A8 应聘登记表 / 面试评估表 / 录用审批表，OA_PROCESS_INVENTORY 第 55、74、57 行）：分级与访问限招聘相关角色；在途候选人按当前阶段迁入；迁入不发事件"
    scope: "人力看全部候选人；用人经理只看本人所提招聘需求下的候选人（访问限制按 ADR-0043）"
    outcomes: [人员待入职, 未录用, 候选人已放弃]
    scenarios: [PRC-82-S01, PRC-82-S02, PRC-82-S03, PRC-82-S04]
    roles:
      - {id: SH-H1, as: external, org_needs: {responsibility: "应聘、面试、答复录用通知", approval_right: "无", department_hint: "（外部）", position_hint: "候选人"}}
      - {id: SH-E6, as: performer, org_needs: {responsibility: "登记候选人与答复，发出录用通知", approval_right: "无", department_hint: "人力资源部", position_hint: "招聘专员（职能：候选人登记与录用事务）"}}      # 人力
      - {id: SH-E1, as: performer, org_needs: {responsibility: "面试评价并作出录用决定", approval_right: "作出录用决定（自行决定，不另设审批，V-8 待定）", department_hint: "用人部门", position_hint: "用人经理（职能：对所辖用人决定负责）"}}      # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记候选人
        aggregate: AGG-62
        emits: [人员已登记]
        desc: 候选人并入人员的候选阶段（OBJ-59）；含个人信息，ADR-0043
        permission: 候选人.登记
        page: 候选人登记页
        audit: true
      - actor: SH-E1
        where: in_system
        command: 记录面试
        aggregate: AGG-62
        desc: 面试在线下或会议系统进行，本系统登记轮次、评价与结论
        permission: 面试.记录
        page: 面试记录页
        audit: true
        decision:
          - {when: 面试通过并决定录用, goto: 3}
          - {when: otherwise, goto: 5}
      - actor: SH-E1
        where: in_system
        command: 作出录用决定
        aggregate: AGG-62
        desc: 录用结论、拟入职日、拟任职职位与职级；拟任职位须启用（规则候选 R-02，拒绝）。用人经理即归属对象责任人，自行决定，不另设审批（V-8 推荐；A8 有「录用审批表」，见 QC）。〔聚合稿将「录用决定已作出」挂在本命令；候选人答复在其后，见 notes 结构问题〕
        permission: 录用决定.作出
        page: 录用决定页
        audit: true
        pending: V-8
        notify: [{to: SH-E6, how: 企业微信待办}]
      - actor: SH-E6
        where: offline
        evidence: [候选人确认入职日的回执（邮件或签回的录用通知）, 确认日, 确认的入职日]
        command: 〔缺〕登记候选人答复
        aggregate: AGG-62
        emits: [录用决定已作出]
        desc: 录用通知书线下或邮件发出，候选人接受或放弃；接受则本步发「录用决定已作出」，触发 PRC-83（候选人确认入职日后办理入职）
        permission: 候选人.登记答复
        page: 录用决定页
        audit: true
        added_in: closeout
        pending: V-19
        timeout: {after: "P7D", escalate_to: SH-E1, interrupting: false}   # 录用通知发出后答复期限（V-19 待定），逾期提醒用人经理决定是否撤销录用
        outcome: 候选人已放弃
        decision:
          - {when: 候选人确认入职日期, goto: PRC-83}
          - {when: otherwise, goto: end}      # 候选人放弃或录用决定撤销（放弃命令缺：PG-09）
      - actor: SH-E1
        where: in_system
        branch: 未录用
        command: 标记未录用
        aggregate: AGG-62
        desc: 通知候选人线下（邮件或电话），本系统不记通知
        permission: 候选人.标记未录用
        page: 面试记录页
        audit: true
        outcome: 未录用
    notes: 候选人个人信息按 ADR-0043 分级，数据组表级处理；保留期待 one-data 按 D12 登记。本流程无人工审批（录用决定是用人经理对自己所辖的决定）；是否另设录用审批待用户 V-8。

  - id: PRC-85
    name: 评估并转正试用期员工
    trigger: {type: time, desc: 试用期届满前（P-46）}
    triggers:
      - {type: time, name: "试用期届满前 N 日生成评估待办（N 待用户定）"}
    stages: [VS-07.3, VS-13.2]
    primary_object: OBJ-56
    secondary_objects: [OBJ-109]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "试用期评估与转正申请全量迁入（OA_PROCESS_INVENTORY 第 59、61、63、75 行：A8 试用期评估流程第一、二个月、试用期员工转正申请、转正申请表；在途合计 6 + 8 + 3 + 7）；在途按当前状态迁入；迁入不触发转正事件与薪酬联动（ADR-0036 M7）"
    scope: "用人经理看所辖员工；人力看全部；评估内容限评估人、被评人与人力（ADR-0043）"
    outcomes: [已转正, 转入离职办理]
    scenarios: [PRC-85-S01, PRC-85-S02, PRC-85-S03, PRC-85-S04]
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制并确认试用期绩效评估", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理（职能：试用期评估人）"}}
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理转正", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员（职能：办理转正与用工状态变更）"}}      # 人力
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉转正结果", approval_right: "无", department_hint: "所属部门", position_hint: "被评员工"}}       # 被评员工收到转正结果通知
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制试用期绩效评估
        aggregate: AGG-106
        desc: 由到期定时提醒触发（定时命令约定缺：PG-10）；评估人是用人经理
        permission: 绩效评估.编制
        page: 试用期评估编辑页
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]
        pending: V-12
        timeout: {after: "P7D", escalate_to: SH-E6, interrupting: false}   # 提醒期限待用户定（V-12）
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        desc: INV-114：同期同类型只一份，确认后不可改；事件须带评估类型，供 B-15 区分月度 / 试用期
        permission: 绩效评估.确认
        page: 试用期评估编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}   # 奖金核定依据，聚合稿已登记订阅方
      - actor: SH-E6
        where: in_system
        command: 办理转正
        aggregate: AGG-62
        emits: [〔缺〕转正已办理]
        desc: 转正前读评估（P-46）；评估结论是转正输入，不是拒绝条件。转正日为业务生效日（U-12），可提前登记、到日生效；用工状态由「试用期」转「正式」。不予转正的依据与批准走 PRC-128（公司单方终止，由归属组织单元责任人批准），V-10
        permission: 转正.办理
        page: 转正办理页
        audit: true
        pending: V-12
        notify: [{to: SH-E3, how: 企业微信通知}, {to: SH-E1, how: 企业微信通知}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: false}   # 试用期届满仍未办理转正或终止的超期提醒（天数待用户 V-12）
        outcome: 已转正
        decision:
          - {when: 公司决定不予转正, goto: PRC-128}
          - {when: otherwise, goto: end}
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕转正已办理}   # B-15 订阅后在 PRC-123 生成待办复核转正后薪酬（S-42，PG-10）；聚合稿现只发内部事件
    notes: "转正后薪酬是否调整由 B-15 自己的调薪流程处理，本流程只发事件（PG-10）。无人工审批：转正是评估确认后的登记，不予转正转入 PRC-128（保留审批）。次要对象：OBJ-109 绩效评估（试用期类型，已确认后才转正）。"

  - id: PRC-83
    name: 办理员工入职与任职
    trigger:
      type: event
      events: [{event: 录用决定已作出, aggregate: AGG-62}]
      desc: 候选人确认入职日后，人力办理入职（同 BC）
    triggers:
      - {type: event, name: "录用决定已作出", event: 录用决定已作出, bc: B-13}
    stages: [VS-07.3]
    primary_object: OBJ-56
    secondary_objects: [OBJ-05, OBJ-57]   # F-1：本流程写入的次要对象（自 notes 迁来）
    notes: "次要对象：OBJ-05 协议（劳动合同类型，签订后生效）、OBJ-57 任职（版本化、无状态机，不作退出条件）。"
    owner_bc: B-13
    human_orchestration: false
    migration: "已在职员工的人员、任职版本、劳动合同全量迁入（U-3、U-4，S17）；在途（待入职）按当前状态迁入，已登记未到入职日的须重新排定「入职生效」定时；迁入不发入职已登记与 Employed，不触发 PRC-84、PRC-137（ADR-0036 M7）；A8 员工入职模板（OA_PROCESS_INVENTORY 第 56 行，在途 1）随迁入对账"
    scope: "人力按法人与组织数据范围；用人经理看所辖新员工的入职与任职"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "劳动合同的提交人（人力）与批准人（新员工归属组织单元负责人）不得为同一人"}
    outcomes: [入职已办理（人员试用期 / 正式，协议已签署生效）]
    scenarios: [PRC-83-S01, PRC-83-S02, PRC-83-S03, PRC-83-S04, PRC-83-S05, PRC-83-S06]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "登记入职、建立任职、提交并登记劳动合同", approval_right: "无（劳动合同批准由部门负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：入职与合同事务）"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对新员工所在组织单元的用人负责", approval_right: "批准劳动合同（类型级，单级）", department_hint: "新员工所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人 = 新员工归属组织单元的责任人（cost_object_owner），劳动合同单级批准
      - {id: SH-H1, as: external, org_needs: {responsibility: "确认入职日、签署劳动合同", approval_right: "无", department_hint: "（外部）", position_hint: "候选人（入职前）"}}       # 候选人：确认入职日、签合同
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉新员工入职与任职", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理"}}       # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记入职
        aggregate: AGG-62
        emits: [〔缺〕入职已登记]        # S3；PG-01
        desc: 填入职日（人事业务生效日，S2）；用工类型；工号由本系统发号
        permission: 入职.登记
        page: 入职登记页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕入职已登记}   # 触发 PRC-137（S4、S5）
        decision:
          - {when: 入职日不晚于今天, goto: 2}
          - {when: otherwise, goto: 2}      # 提前登记：第 2 步在入职日到时由系统执行
      - actor: system
        where: automatic
        on_time: 入职日到达（当天开始时）
        command: 〔缺〕入职生效
        aggregate: AGG-62
        emits: [Employed]
        desc: 人员状态由「待入职」转「在职」；补登时立即执行，生效日仍为登记的入职日（S2）
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: Employed}               # 触发 PRC-84
          - {mode: event, direction: out, bc: platform.identity, name: Employed}  # 放行登录（S4）
      - actor: SH-E6
        where: in_system
        command: 建立任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 组织单元、职位、职级、汇报线、主 / 兼；生效日默认等于入职日（S9）
        permission: 任职.建立
        page: 任职维护页
        audit: true
        decision:
          - {when: 与该人员已有主任职区间重叠, goto: 3, rule: INV-62}    # INV-62 拒绝，改正后重提
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 默认角色与数据范围（S10）
      - actor: SH-E6
        where: in_system
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位（法人口径之一，S13）、期限、试用期
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        legal_entity: 用人单位
        notify: [{to: SH-M1, how: 企业微信待办}]
        decision:
          - {when: 试用期超过法定上限, goto: 4, rule: INV-14}            # INV-14 拒绝
          - {when: otherwise, goto: 5}
      - actor: SH-M1
        where: in_system
        command: 批准劳动合同
        aggregate: AGG-67
        approval:
          doc_type: 劳动合同批准
          engine: aggregate                                # B-13 聚合内单级批准，不经 platform.approval（S11），故无审批平台回调
          approver: SH-M1                      # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 4                                     # 退回人力改合同（驳回命令〔缺〕，PG-09）
          why_human: "合同期限、岗位与薪酬约定是否与录用决定一致、用人单位是否正确是法律与管理判断；法定试用期上限已由 INV-14 拒绝，不属人工判断"
        permission: 劳动合同.批准
        page: 劳动合同审批页
        audit: true
        pending: V-18
        decision:
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 4}                     # 驳回：退回人力改合同
      - actor: SH-E6
        where: offline
        evidence: [已签署劳动合同扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 候选人（SH-H1）线下或电子签署，人力登记签署日
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
        decision:
          - {when: 用工满一个月仍未签订, goto: 6}          # P-05 提醒，不拒绝（S12）
          - {when: otherwise, goto: end}    # 三口径预警移至 B-15 事件策略（S-20）

  - id: PRC-84
    name: 增员参保并建立薪酬档案
    trigger:
      type: event
      events: [{event: Employed, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "入职生效", event: Employed, bc: B-13}
    stages: [VS-07.3]
    stages_note: "VS-07.3：触发状态 Employed（试用期 / 正式）是 VS-07.3 的退出条件，参保增员与建薪酬档案是入职任职的收尾；不归 VS-13.1——VS-13.1 进入条件同一状态只是字面重合，本流程不产生考勤确认的任何进出事实（#421 第 6a 项）"
    primary_object: OBJ-62
    owner_bc: B-15
    human_orchestration: false
    migration: "历史参保增员记录与薪酬档案随 AGG-74、AGG-93 全量迁入（U-3、U-4），薪酬档案按生效日版本回放；迁入不发事件，不触发本流程（ADR-0036 M7）"
    scope: "人力（薪酬与社保）按法人范围；薪酬属敏感个人信息，ADR-0043 最高访问级别"
    outcomes: [社保与公积金参保在缴，薪酬档案已建立]
    scenarios: [PRC-84-S01, PRC-84-S02, PRC-84-S03]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理参保增员并建立薪酬档案", approval_right: "无", department_hint: "人力资源部（薪酬与社保）", position_hint: "薪酬与社保专员（职能：参保经办与薪酬档案）"}}      # 人力（薪酬与社保）
    steps:
      - actor: SH-E6
        where: offline
        evidence: [社保增员回执, 公积金增员回执, 办理日]
        command: 参保增员
        aggregate: AGG-74
        emits: [参保已增员]
        desc: 入职 30 日内办理，逾期提醒（P-32）
        permission: 参保.增员
        page: 参保登记页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P30D", escalate_to: SH-M1, interrupting: false}   # P-32 逾期提醒，升级给职能高管〔推〕
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Employed}
        decision:
          - {when: 用工类型为退休返聘或实习, goto: 2}   # 不参保（用户已定 T-4）
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: in_system
        command: 建立薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪酬属性版本生效日 = 入职日（S2、S15）
        permission: 薪酬档案.建立
        page: 薪酬档案维护页
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与任职}
        decision:
          - {when: otherwise, goto: end}

  - id: PRC-137
    name: 入职开通企业微信账号并绑定外部身份
    trigger:
      type: event
      events: [{event: 〔缺〕入职已登记, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "入职已登记", event: 〔缺〕入职已登记, bc: B-13}
    stages: [VS-07.3]
    stages_note: "留 VS-07.3：纯事件触发（入职已登记 = Employed，即 VS-07.3 退出条件「人员试用期 / 正式」的产生事件）的多步反应，行为等同事件策略；因 type 为 business，脚本按结局归段而判不支持，已列 STAGE_ALIGN.md 请 one-architecture 裁定"
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    notes: "无业务对象，primary_object: none。理由：企业微信账号是平台身份事项，不是业务对象状态（VS-13.6 notes）。"
    owner_bc: platform.identity   # J-1 / S-14 one-architecture 同意
    human_orchestration: false
    migration: "不适用（迁入不发事件）；已在职员工的企业微信身份按迁入对账绑定（C-7）"
    scope: "信息部门与人力"
    outcomes: [已开通并绑定, 开通失败已告警]
    scenarios: [PRC-137-S01, PRC-137-S02, PRC-137-S03, PRC-137-S04]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "处理企业微信开通失败", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：企业微信与账号管理）"}}      # 信息（IT）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "入职日未绑定时知悉告警", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员"}}       # 人力，逾期告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "收到开通通知", approval_right: "无", department_hint: "所属部门", position_hint: "新员工"}}       # 新员工，收到开通通知
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕建立待开通登录身份
        desc: 以人员 ID 为键；拟定企业微信 userid = 工号（S6）；登录放行起点 = 入职日（S4）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 〔缺〕入职已登记}
      - actor: system                   # 用户已定 T-1：本系统在登记入职后自动开通（intent 2026-10-16-162821）
        where: external:企业微信
        evidence: [企业微信返回的成员 userid, 开通时间]
        bc: platform.identity
        command: 〔缺〕开通企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动开通成员；入职日前 3 个工作日开通（提前登记时排到该日，晚于该日登记的立即开通）（用户已定 T-1、T-2）
        notify: [{to: SH-E3, how: 企业微信通知}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕开通企业微信成员}
        decision:
          - {when: 企业微信返回失败或 userid 已被占用, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕绑定外部身份
        desc: 按 userid 精确绑定到人员（S6）；入职日前绑定的身份处于「待生效」，订阅 Employed 后放行登录
        audit: true
        metric_event: true
        outcome: 已开通并绑定
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Employed}
        decision:
          - {when: otherwise, goto: end}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        on_time: 开通失败，或入职日已到仍未绑定
        command: 〔缺〕告警开通未完成
        desc: 告警信息部门与人力，不静默（S8）；开通失败由信息部门 1 个工作日内处理（用户已定 T-2）；信息部门修正后重试
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}   # 1 个工作日（T-2）；逾期升级给职能高管〔推〕
        outcome: 开通失败已告警
        decision:
          - {when: 已修正并重试, goto: 2}
          - {when: otherwise, goto: end}

  # ───────────── VS-13.6 离职结清（入转调离成套）─────────────

  - id: PRC-128
    name: 办理员工离职
    trigger: {type: human, desc: 员工提出离职或公司决定终止}
    triggers:
      - {type: human, name: "员工提出离职"}
      - {type: human, name: "公司决定终止"}
    stages: [VS-13.6]
    primary_object: OBJ-56
    secondary_objects: [OBJ-05, OBJ-57]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "离职申请全量迁入（A8 员工离职申请，OA_PROCESS_INVENTORY 第 62 行，在途 22）；在途按当前状态迁入，已登记未到离职日的须重新排定「离职生效」定时；迁入不触发 Separated、账号吊销与参保减员（ADR-0036 M7）；历史离职人员账号状态按迁入对账（C-7）"
    scope: "员工看本人申请；用人经理与部门负责人看所辖员工；人力看全部（原因类别含健康时限人力，SPI 交 U-11）"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "公司单方终止：发起人（人力）与批准人（被终止员工所属组织单元责任人）不得为同一人"}
    outcomes: [离职已生效, 离职申请已撤回, 终止已驳回, 离职登记已撤销]
    scenarios: [PRC-128-S01, PRC-128-S02, PRC-128-S03, PRC-128-S04, PRC-128-S05, PRC-128-S06, PRC-128-S07, PRC-128-S08]
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出离职申请或撤回", approval_right: "无", department_hint: "所属部门", position_hint: "员工（任一类员工）"}}      # 申请人是任一类员工；stakeholders 无泛员工编号，暂取 SH-E3（格式问题）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对被终止员工所属组织单元负责", approval_right: "批准公司单方终止（类型级，单级）", department_hint: "被终止员工所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人：仅公司单方终止时批准（cost_object_owner）；员工提出的离职不审批
      - {id: SH-E6, as: performer, org_needs: {responsibility: "发起公司终止、登记终止依据、办理离职", approval_right: "无（公司终止的批准由部门负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：离职办理）"}}      # 人力：公司终止的发起、登记依据与离职办理
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉所辖员工离职", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理"}}       # 用人经理
      - {id: SH-E6, as: informed, org_needs: {responsibility: "收到离职提醒，资产归还见 B-31", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：账号与设备）"}}       # 信息（IT）：离职提醒，资产归还见 B-31
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请离职
        aggregate: AGG-62
        desc: 期望离职日（人事业务生效日，U-12）、原因类别、来源。员工本人提出，或线下提出由人力代录入（来源=员工，本系统登记提出日与来源）；公司单方终止由人力以来源=公司终止在同一命令发起，依据与原因类别必填（含试用期不予转正转入，PRC-85）。期望离职日早于法定通知期只预警，不拒绝（规则候选 R-03）
        permission: 离职.申请
        page: 离职申请页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}, {to: SH-M1, how: 企业微信通知}]
        withdraw: {to: 4, outcome: 离职申请已撤回}
        decision:
          - {when: 员工撤回申请, goto: 4}
          - {when: 来源为公司单方终止, goto: 2}
          - {when: otherwise, goto: 5}          # 员工提出的离职劳动者有权解除，不设批准（V-20）
      - actor: SH-M1
        where: in_system
        command: 〔缺〕批准公司终止
        aggregate: AGG-62
        approval:
          engine: aggregate             # B-13 聚合内单级批准（F-3），不经 platform.approval，故无审批平台回调
          doc_type: 公司终止批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 3
          why_human: "单方解除的事由是否成立、证据是否充分是法律与管理判断（劳动合同法第 39、40、41 条），事实真伪规则无法判定；发起人与批准人分离由 segregation 守卫"
        permission: 离职.批准终止
        page: 离职审批页
        audit: true
        added_in: closeout
        pending: V-18
        notify: [{to: SH-E6, how: 企业微信通知}]
        decision:
          - {when: 批准, goto: 5}          # 批准后状态「待离职」，即 VS-13.6 进入条件
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回公司终止
        aggregate: AGG-62
        desc: 批准人驳回公司单方终止，发起人（人力）知悉；聚合稿缺命令（PG-09）
        permission: 离职.驳回终止
        page: 离职审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E6, how: 企业微信通知}]
        outcome: 终止已驳回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E3
        where: in_system
        branch: 撤回
        command: 〔缺〕撤回离职申请
        aggregate: AGG-62
        desc: 员工（或人力代录入的来源=员工）在登记离职日前撤回申请；聚合稿缺命令（PG-09）
        permission: 离职.撤回申请
        page: 离职申请页
        audit: true
        added_in: closeout
        outcome: 离职申请已撤回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: offline
        evidence: [离职协议或解除 / 终止通知的扫描件, 签署或送达日, 离职日]
        command: 〔缺〕登记劳动合同终止依据
        aggregate: AGG-67
        desc: 协商一致、员工辞职或公司解除，均线下签署或送达；本系统登记依据文件与日期。离职证明另行线下出具，不作门（VS-13.6 备注）
        permission: 劳动合同.登记终止依据
        page: 离职办理页
        audit: true
        added_in: closeout
      - actor: SH-E6
        where: in_system
        command: 办理离职
        aggregate: AGG-62
        desc: 登记离职日（人事业务生效日，最后在职日，U-12）与原因类别；可提前登记、到日生效。离职日不晚于登记日（含补登、即时终止）则立即进入步 7。聚合稿原为「→ Separated」，现改为登记，Separated 由步 7 到日发出，不得在登记时提前发（PG-12）
        permission: 离职.办理
        page: 离职办理页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 离职日前员工撤回或公司撤销, goto: 10}
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 离职日结束时（时点待用户定）；离职日不晚于登记日则登记时立即执行
        command: 〔缺〕离职生效
        aggregate: AGG-62
        emits: [Separated]
        desc: 人员状态由「待离职」转「已离职」，生效日为登记的离职日。Separated 在先于步 8、9 发出：吊销会话与访问是安全关键（RULE-363），不得因任职或合同终止失败而推迟
        audit: true
        metric_event: true
        pending: V-1
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: Separated}   # platform.identity 吊销会话作业（原 PRC-129，已退役）、PRC-138 停用企业微信与解绑；§1.4 G-2
          - {mode: event, direction: out, bc: B-15, name: Separated}               # PRC-130 参保减员，PRC-178 读取未休补休余额计入加班工资，并作为最后一期薪酬结算的在职终点
          - {mode: event, direction: out, bc: B-31, name: Separated}               # 生成 IT 资产归还待办（b31 PRC-143；聚合稿回补 §1），B-13 不依赖 B-31
          - {mode: event, direction: out, bc: B-27, name: Separated}               # B-27 默认确认离职当月考勤（PRC-118 第 7 步事件入口）；B-27 → B-13 现只有 api 边（接缝问题）
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职区间止于离职日。因 Separated 已先发出，platform.identity 对已离职人员的「任职已变更」忽略（PG-12）
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 终止日 = 离职日，依据文件见步 5。失败告警人力并重试，不回滚 Separated
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 离职已生效
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 撤销离职登记
        command: 〔缺〕撤销离职登记
        aggregate: AGG-62
        emits: [〔缺〕离职登记已撤销]
        desc: 离职日前撤销，状态回「在职」；B-27、B-31 均只在 Separated 后处置，不订阅本事件（S-42，撤销发生在离职生效前，无待办可取消）；离职日后不可撤销（已吊销访问，需走再入职）
        permission: 离职.撤销登记
        page: 离职办理页
        audit: true
        added_in: closeout
        outcome: 离职登记已撤销
    notes: >
      账号侧见 platform.identity 吊销会话作业（原 PRC-129，已退役）、PRC-138（角色授予、企业微信停用、解绑）；参保减员见 PRC-130；最后一期薪酬随月度结算发放（B-15），未休补休余额由 B-15 订阅 Separated，经 PRC-178 读取余额并计入加班工资，随最后一期薪酬一并计发（PRC-124）。
      工作交接清单是单据不作门（VS-13.6 备注，Q-D 第 3 项不做）；IT 资产归还待办由 B-31 订阅 Separated 生成，B-13 不读 B-31。
      离职当月考勤确认由谁代确认见 notes 待用户定。员工提出的离职不再设批准（V-20）；公司单方终止保留一级批准。
      「发起公司终止」不再是独立命令，并入「申请离职」的来源取值，以便两个入口汇合在同一首步。

      次要对象：OBJ-05 协议（劳动合同类型，终止是后续步骤，失败不回滚已离职）、OBJ-57 任职（任职区间止于离职日）。
  - id: PRC-136
    name: 变更任职
    trigger: {type: human, desc: 人力按人事业务生效日登记调岗、职级调整或汇报线变更}
    triggers:
      - {type: human, name: "人力登记调岗、职级调整或汇报线变更"}
    stages: [VS-07.3]
    primary_object: OBJ-57
    secondary_objects: [OBJ-05, OBJ-62]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-13
    human_orchestration: true
    human_note: 调岗申请需批准（推荐，待用户定），批准为本聚合命令（F-3）
    type: business
    new: true
    basis: A8 与老系统的人事异动只作证据（OA_PROCESS_INVENTORY 第 65 行「人事异动表」）；U-12；INV-62；词表「待调整权限」（ADR-0032 第 4 项）；Q-09
    migration: "历史人事异动回放为任职版本（A8 人事异动，按人事业务生效日），在途按当前状态迁入（OA_PROCESS_INVENTORY 第 65 行在途 1）；迁入不触发本流程与数据范围复核（ADR-0036 M7）"
    scope: "人力按法人与组织数据范围；用人经理看所辖员工的异动"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "调岗申请的提交人（人力）与批准人（新组织单元责任人）不得为同一人"}
    outcomes: [调岗已生效, 已驳回]
    scenarios: [PRC-136-S01, PRC-136-S02, PRC-136-S03, PRC-136-S04, PRC-136-S05, PRC-136-S06, PRC-136-S07, PRC-136-S08, PRC-136-S09]
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "提交调岗申请，办理合同与薪酬、参保变更", approval_right: "无（调岗批准由新组织单元负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：任职变更事务）"}}      # 人力提交（发起人待用户定）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对接收方组织单元的人工成本负责", approval_right: "批准调岗申请（类型级，单级）", department_hint: "新组织单元", position_hint: "部门负责人（职能：新组织单元责任人）"}}       # 部门负责人 = 新组织单元（接收方，调岗生效后承担人工成本）的责任人，cost_object_owner；原部门负责人只被通知
      - {id: SH-E6, as: performer, org_needs: {responsibility: "信息、薪酬与社保经办", approval_right: "无", department_hint: "信息部门与人力资源部（薪酬与社保）", position_hint: "信息管理员、薪酬与社保专员（职能）"}}      # 信息（IT）、薪酬与社保经办：步 9–12
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉原、新用人经理所辖变动", approval_right: "无", department_hint: "原、新用人部门", position_hint: "用人经理"}}       # 原、新用人经理
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉本人调岗", approval_right: "无", department_hint: "所属部门", position_hint: "被调动员工"}}       # 被调动员工
    steps:
      - actor: SH-E6
        where: in_system
        command: 〔缺〕提交调岗申请
        aggregate: AGG-63
        desc: 员工、新组织单元、新职位与职级、汇报线、主 / 兼、业务生效日（U-12，可提前登记、补登落回真实日期）。读职位目录与组织单元，须未停用，否则拒绝并退回改正（INV-63、INV-60）；系统比对新组织单元默认法人与当前用人单位，标记是否跨法人
        permission: 调岗.提交
        page: 调岗申请页
        audit: true
        added_in: closeout
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: 3, outcome: 已驳回}      # 批准前撤回走「驳回调岗申请」命令（含提交人撤回）
        decision:
          - {when: 新职位已停用或新组织单元已撤销, goto: 1, rule: INV-63}    # INV-63 / INV-60 相关
          - {when: 提交人在批准前撤回, goto: 3}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        command: 〔缺〕批准调岗申请
        aggregate: AGG-63
        approval:
          engine: aggregate             # 同 F-3：B-13 内单级批准，故无审批平台回调；新旧部门会签若需要，移出 B-13（notes 待用户定）
          doc_type: 调岗批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 3
          why_human: "调岗改变成本归属、汇报线与授权范围，接收部门是否需要、是否合适是管理判断；职位有效（INV-63）、任职不重叠（INV-62）、跨法人合同（INV-14）等可校验条件已由规则拒绝；汇报线变更会影响后续审批链，故不设免批"
        permission: 调岗.批准
        page: 调岗审批页
        audit: true
        added_in: closeout
        pending: V-5, V-18
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: 批准且跨法人调动, goto: 4}
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回调岗申请
        aggregate: AGG-63
        desc: 批准人驳回；提交人撤回走同一命令
        permission: 调岗.驳回
        page: 调岗审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E6, how: 企业微信通知}]
        outcome: 已驳回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 跨法人调动
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位变更：与新法人另订劳动合同（或三方变更协议），用人单位为新法人，工龄连续计算；试用期不得重新约定（INV-14 同检）。合同要素须与已批准的调岗一致（规则候选 R-04，拒绝，取代原「批准劳动合同」一级审批）。劳动合同主体变更必须在调岗生效日前完成
        legal_entity: 新用人单位
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        decision:
          - {when: 试用期超过法定上限或合同要素与已批准调岗不一致, goto: 4, rule: INV-14}
          - {when: otherwise, goto: 5}
      - actor: SH-E6
        where: offline
        branch: 跨法人调动
        evidence: [三方变更协议或新劳动合同的扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 员工、原法人、新法人线下签署；签订发「劳动合同已签订」，B-15 的 PRC-145 据此比对三口径（不一致只预警）
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 劳动合同已签订}   # PRC-145 订阅
      - actor: system
        where: automatic
        command: 〔缺〕变更任职
        aggregate: AGG-63
        desc: 原子命令：旧任职区间止于业务生效日，新任职区间始于同日（PG-05）；主任职区间不得重叠（INV-62），兼任不受此限。写入未来版本，此时不对外发事件
        audit: true
        decision:
          - {when: 与该人员其他主任职区间冲突, goto: 1, rule: INV-62}   # 退回改正后重提
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 业务生效日到达（补登 / 当日登记则立即执行）
        command: 〔缺〕任职变更生效
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职已变更须在业务生效日发出（U-12），平台与薪酬才能按真实日期重算
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 订阅方聚合稿现为「仅分析」，需补（PG-02、06）
          - {mode: event, direction: out, bc: B-15, name: 任职已变更}                  # B-15 → B-13 边已有；订阅方聚合稿未登记（PG-07）
        decision:
          - {when: 跨法人调动, goto: 8}
          - {when: otherwise, goto: 9}
      - actor: system
        where: automatic
        branch: 跨法人调动
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 原劳动合同终止于业务生效日，原因为调动（与步 4–5 的新合同衔接，工龄连续）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕重算默认角色与数据范围
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 按新任职重算默认角色与数据范围（具体规则随 ADR-0029 重起草，此处只定触发点）；人工单独授予的角色与范围不自动收回，交步 10
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 沿用 PRC-80 步 6 命令；P-31 现只由组织单元已调整触发，任职已变更触发需新增策略，生成「待调整权限」条目（敏感角色持有人送组织数据管理员与安全审计员，含自定义部门或列出法人的授权送新部门负责人，ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 调岗已生效
        decision:
          - {when: 调岗引起薪酬变化或跨法人调动, goto: 11}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        bc: B-15
        branch: 调岗引起薪酬变化或跨法人
        command: 调整薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪资结构、标准变化；跨法人时个税扣缴义务人随用人单位变更（三口径之一，不一致由 PRC-145 预警）。薪酬属敏感个人信息，ADR-0043 最高访问级别
        permission: 薪酬档案.调整
        page: 薪酬档案维护页
        audit: true
        outcome: 调岗已生效
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
        decision:
          - {when: 跨法人调动, goto: 12}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: offline
        bc: B-15
        branch: 跨法人调动
        evidence: [社保增减员回执, 公积金缴存单位变更回执, 办理日]
        command: 〔缺〕变更参保缴纳主体
        aggregate: AGG-74
        emits: [参保已减员, 参保已增员]
        desc: 原法人减员、新法人增员（缴纳主体变更），人社与公积金网办办理后回填；与入职增员同属 P-32 范畴
        permission: 参保.变更缴纳主体
        page: 参保登记页
        audit: true
        added_in: closeout
        legal_entity: 新用人单位
        outcome: 调岗已生效
    notes: >
      晋升只改职级不换职位（JOB_CATALOG_DRAFT §1 P-1），同走本流程。跨法人调动是劳动合同主体变更，牵涉三口径同时改变（用人单位、数据范围法人、扣缴义务人），
      步 4–5、8、11–12 是该分支；PRC-145 只预警不拒绝。调岗对请假审批人与在途单据是否联动待 B-27 组确认。
      步 9–12 是对「任职已变更」的事件反应，与后续步骤并行，此处按顺序列出。
      原「批准劳动合同」一级审批取消，改由规则 R-04 拒绝（合同要素与已批准调岗不一致）与 INV-14；调岗批准一次即够。

      次要对象：OBJ-05 协议（跨法人另订并终止原劳动合同）、OBJ-62 社保与公积金参保（跨法人变更缴纳主体）。
  - id: PRC-138
    name: 离职停用企业微信账号并解绑
    type: business
    new: true
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 与 platform.identity 吊销会话作业（原 PRC-129，已退役）互补；离职生效即时，不等企业微信账号停用
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    stages_note: "留 VS-13.6：纯事件触发（离职已生效 = Separated，即 VS-13.6 退出条件「人员已离职」的产生事件）的多步反应，行为等同事件策略；因 type 为 business，脚本按结局归段而判不支持，已列 STAGE_ALIGN.md 请 one-architecture 裁定"
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: platform.identity   # S-14（one-architecture 同意 J-1）
    human_orchestration: false
    basis: intent 2026-10-16-134134 Q-03；规则卡 RULE-363；ADR-0027 第 1 项第 6 点、第 7 点；IDENTITY_LIFECYCLE.md 对 C1 设计的含义第 3 条（在职判断以人事离职为准，不以企业微信账号是否存在为准）；S-14
    migration: "不适用（迁入不发事件）；历史离职人员的企业微信状态在迁入对账中核对（C-7）"
    scope: "信息部门与安全审计员"
    outcomes: [已停用并解绑]
    scenarios: [PRC-138-S01, PRC-138-S02, PRC-138-S03, PRC-138-S04]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "手工停用企业微信成员并登记，放行离职处置", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：账号与企业微信管理）"}}      # 信息（IT）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉停用结果", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员"}}       # 人力
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 吊销会话
        desc: 即时，先于一切企业微信动作；调用 platform.identity 吊销会话平台作业（原 PRC-129 已退役移出流程目录，CON-1017-ARC-10 R-1）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用登录身份
        desc: 登录以人员在职为准，离职后即使企业微信账号未停用也拒绝登录（含放行起点之后的再登录）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕删除全部角色授予
        desc: ADR-0027 第 1 项第 6 点：逐条写审计。涉及超管（super_admin）或安全审计员持有人，或会使可用超管少于 2 名时，不自动收回，转步 4 待放行（第 7 点，防止全员锁死）；会话吊销与登录身份停用不受此限
        audit: true
        pending: V-17
        decision:
          - {when: 离职者持有超管或安全审计员角色, goto: 4, rule: "ADR-0027 第 7 点"}
          - {when: otherwise, goto: 5}
      - actor: platform
        where: in_system
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕确认放行离职处置
        desc: 另一名超管持有人在系统内人工确认后放行，写审计（ADR-0027 第 7 点，Q-3「暂停，转人工确认」）；放行后继续步 5。这是防全员锁死的安全联锁，不是业务审批：需有人先确认已有接任的可用超管，规则无法替人选定接任者；放行人不得是离职者本人。能否改为「规则拒绝自动收回并告警，待超管补足后自动继续」见 V-17 选项 c
        permission: 身份.放行离职处置
        page: 待放行离职处置页
        audit: true
        pending: V-17
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 5}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用应急账号
        desc: ADR-0027 第 1 项第 6 点：离职者名下的应急账号置为停用；无则跳过（不是错误）
        audit: true
      - actor: system
        where: external:企业微信
        evidence: [企业微信返回的成员停用结果, 停用时间]
        bc: platform.identity
        command: 〔缺〕停用企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动停用成员；与 PRC-137 开通对称（T-1）。以 api 同步调用，不经 B-13，方向 platform.identity → platform.integration 已有边，PG-04 不再适用于停用。失败（成员已不存在视为已停用，不算失败）告警信息部门与人力，不静默（老系统取证 15% 离职者离职后仍成功登录，IDENTITY_LIFECYCLE）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕停用企业微信成员}
        decision:
          - {when: 企业微信返回失败, goto: 8}
          - {when: otherwise, goto: 7}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕解绑外部身份
        desc: 解除企业微信 userid 与人员的绑定，保留绑定历史；userid 不再分配给他人（取工号时与再入职的关系见 notes 结构问题）
        audit: true
        metric_event: true
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: external:企业微信
        evidence: [企业微信管理端的停用记录, 停用时间, 经办人]
        bc: platform.identity
        command: 〔缺〕登记企业微信成员手工停用
        desc: 信息部门在企业微信管理后台手工停用，完成后在本系统登记并重试步 6（已停用视为成功）；这是系统外动作，本系统只登记结果。离职生效后规定时限内仍未停用则升级，不静默（时限待用户 V-13，推荐 1 个工作日，同 T-2）
        permission: 身份.登记企业微信手工处理
        page: 外部身份处理页
        audit: true
        pending: V-13
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}   # 1 个工作日；升级给职能高管〔推〕
        outcome: 已停用并解绑
        decision:
          - {when: 已处理并重试, goto: 6}
          - {when: otherwise, goto: end}
    notes: "参保减员由 PRC-130 另行处理；PRC-137 / 138 成对，开通与停用均由 platform.identity 编排。本流程无业务审批；步 4 是安全联锁，见 V-17。无业务对象，primary_object: none。理由：企业微信账号是平台身份事项，不是业务对象状态（VS-13.6 notes）。"

event_policies:

  - id: PRC-129
    name: 离职后吊销会话
    type: retired                     # 原 event_policy；CON-1017-ARC-10 R-1 退役，进平台作业登记
    status: retired
    note: "CON-1017-ARC-10 R-1：移出流程目录，进平台作业登记（platform.identity 吊销会话作业；PROCESS_ANCHORING_RESEARCH 审题后修订第 3 条：平台身份机制的技术动作，不是业务人员按规则反复办理的流程）；PRC-138 第 1 步改为调用平台作业，不再 calls PRC-129"
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: []
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: platform.identity
    migration: "不适用（迁入不发事件，ADR-0036 M7；历史离职人员的会话与授予按迁入对账）"
    outcomes: [会话已吊销]
    scenarios: [PRC-129-S01, PRC-129-S02]
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "吊销失败时处理告警", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员"}}       # 信息（IT）：吊销失败告警
    step:
      actor: platform
      where: automatic
      platform_task: true
      service: platform.identity
      command: 吊销会话
      desc: 聚合稿 §1.4 G-2 强制事件反应，RULE-363 已定，安全关键：收到 Separated 即吊销该人员的全部会话与每请求复核，不依赖企业微信账号状态。失败重试并告警信息部门，不静默（CLAUDE.md 第 6 条）；其余离职处置（角色授予、应急账号、登录身份）见 PRC-138
      audit: true
      notify: [{to: SH-E6, how: 企业微信待办}]
      outcome: 会话已吊销
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: Separated}
    notes: "平台已建模块，不是企业聚合；与 PRC-138 配合。无人工审批：吊销是强制反应。无业务对象，primary_object: none。理由：会话吊销是平台身份事项，不是业务对象状态（VS-13.6 notes）。"

  - id: PRC-130
    name: 办理参保减员
    type: event_policy
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 人力收到离职事件后 15 日内办理转移手续（P-32）
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    primary_object: OBJ-62
    owner_bc: B-15
    migration: "不适用（迁入不发事件；历史参保减员记录随 AGG-74 全量迁入）"
    outcomes: [社保与公积金参保已减员, 无需减员]
    scenarios: [PRC-130-S01, PRC-130-S02, PRC-130-S03, PRC-130-S04, PRC-130-S05]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理参保减员与公积金封存或转移", approval_right: "无", department_hint: "人力资源部（薪酬与社保）", position_hint: "薪酬与社保专员（职能：参保经办）"}}      # 人力（薪酬与社保）
    steps:
      - actor: system
        where: automatic
        command: 终止薪酬档案
        aggregate: AGG-93
        desc: S-32：B-15 订阅 Separated 后结束人员最后一个生效的薪酬档案版本，区间止于离职日（显式优于由人员状态推断）；离职当月的入离职折算仍读离职日之前有效的版本；人员无任何档案版本失败并告警薪酬岗，不静默，不阻断后续参保减员；已终止无操作
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
        decision:
          - {when: 人员无任何薪酬档案版本, goto: 2}
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: offline
        evidence: [社保减员回执, 公积金封存或转移回执, 办理日]
        command: 参保减员
        aggregate: AGG-74
        emits: [参保已减员]
        desc: 社保减员与公积金封存 / 转移在人社与公积金网办办理，没有面向本系统的接口，办理后回填；离职日起 15 日内（P-32）。退休返聘与实习不参保，无需减员（用户已定 T-4）
        permission: 参保.减员
        page: 参保登记页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # P-32 提醒，逾期升级给职能高管〔推〕
        decision:
          - {when: 用工类型为退休返聘或实习, goto: end, outcome: 无需减员}
          - {when: otherwise, goto: end, outcome: 社保与公积金参保已减员}
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取用工类型}
    notes: B-15 → B-13（api、事件）已有边。工资结清与离职当月社保费用口径属 B-15 薪酬结算，不在本策略。无人工审批。流程名沿用目录「离职后参保减员」，第 1 步终止薪酬档案是 S-32 并入的第二类离职反应（目录名待 one-architecture 视情改为含薪酬档案）。

  - id: PRC-177
    name: 向差旅服务商同步员工与组织
    type: merged                      # 原 event_policy；CON-1017-ARC-10 R-3 并入集成流程 PRC-197
    merged_into: PRC-197
    status: merged
    trigger:
      type: event
      events:
        - {event: Employed, aggregate: AGG-62}
        - {event: Separated, aggregate: AGG-62}
        - {event: 任职已变更, aggregate: AGG-63}
        - {event: 组织单元已调整, aggregate: AGG-61}
    triggers:
      - {type: event, name: "入职生效", event: Employed, bc: B-13}
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
      - {type: event, name: "任职已变更（调岗）", event: 任职已变更, bc: B-13}
      - {type: event, name: "组织单元已调整", event: 组织单元已调整, bc: B-13}
    stages: []
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: B-13
    basis: S-31 SQ-31（one-architecture）：platform.integration 在 L0，不能订阅 B-13（S-22 不采用平台订阅业务事件），故由 B-13 订阅本 BC 事件并经既有边 B-13 → platform.integration 推送
    migration: "迁入不触发（ADR-0036 M7）；上线时由集成册登记的一次性全量初始同步另办，不属本策略"
    outcomes: [已同步, 同步失败已告警]
    scenarios: [PRC-177-S01, PRC-177-S02, PRC-177-S03]   # S01 入职后推送新员工；S02 组织单元调整后推送组织树；S03 差旅服务商返回失败，告警不静默
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收同步失败告警并跟进重试", approval_right: "无", department_hint: "信息部门、人力资源部", position_hint: "信息管理员、人事专员"}}       # 信息（IT）与人力：同步失败告警
    steps:
      - actor: system
        where: external:差旅服务商
        evidence: [推送批次编号, 差旅服务商回执（受理结果与失败明细）]
        bc: platform.integration
        command: 推送员工与组织
        desc: 单向推送：入职、调岗、组织调整推送最新员工与组织单元，离职推送停用；只推送差旅预订必需的字段（姓名、工号、所属组织单元、状态），不含薪酬、证件等敏感个人信息（个人信息保护法最小必要）；按事件 ID 幂等，重复事件不重复推送；差旅服务商返回失败或回执缺失告警信息部门与人力，保留批次待重试，不静默（CLAUDE.md 第 6 条）
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 推送员工与组织}
        decision:
          - {when: 差旅服务商返回失败或回执缺失, goto: end, outcome: 同步失败已告警}
          - {when: otherwise, goto: end, outcome: 已同步}
    notes: 方向 B-13 → platform.integration 为既有边，不新增边；订阅的是本 BC 事件。外部系统名按 S-31 写「差旅服务商」，集成册登记（DATA_DESIGN_CHECKLIST §14.3）。差旅订单、账单、审批进 B-12（S-31 SQ-27、28），与本策略无关。无人工审批。

single_aggregate:

  - id: PRC-79
    name: 登记继续教育并延续注册执业证书
    type: single_aggregate
    aggregate: AGG-66
    owner_bc: B-13
    stages: [VS-06.2]
    primary_object: OBJ-64
    desc: 注册期内累计学时与到期临近（定时）
    migration: "注册执业证书与继续教育学时全量迁入（来源待取证，A8 模板清单无对应模板，若老系统亦无记录则为空集）；迁入不发「执业证书已到期」"
    scope: "注册执业人员看本人；人力看全部；INV-47 在交付物处只读证书有效性"
    triggers:
      - {type: human, name: "注册执业人员登记继续教育学时"}
      - {type: human, name: "人力延续注册执业证书"}
      - {type: time, name: "证书有效期届满"}
      - {type: human, name: "人力登记注册执业证书"}
      - {type: human, name: "人力注销注册执业证书"}
    outcomes: [学时已登记, 证书已延续, 执业证书已到期, 证书已登记, 证书已注销]
    scenarios: [PRC-79-S01, PRC-79-S02, PRC-79-S03, PRC-79-S04, PRC-79-S05, PRC-79-S06]
    states: [有效, 已到期, 已注销]
    transitions:
      - {command: 登记注册执业证书, from: null, to: 有效}
      - {command: 注销注册执业证书, from: 有效, to: 已注销}
      - {command: 登记继续教育学时, from: 有效, to: 有效}
      - {command: 延续注册执业证书, from: 有效, to: 有效}     # 回填新有效期
      - {command: 标记执业证书已到期, from: 有效, to: 已到期}
    roles:
      - {id: SH-E7, as: initiator, org_needs: {responsibility: "登记本人继续教育学时", approval_right: "无", department_hint: "所属部门", position_hint: "注册执业人员"}}      # 注册执业人员
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理并登记延续注册", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员（职能：执业证书管理）"}}      # 人力
      - {id: SH-R2, as: external, org_needs: {responsibility: "受理延续注册", approval_right: "无", department_hint: "（外部）", position_hint: "注册执业管理机构"}}       # 注册执业管理机构：延续注册的受理方
    commands:
      - actor: SH-E7
        where: in_system
        command: 登记继续教育学时
        emits: []
        desc: 按注册期累计，必修与选修分开；学时证明作附件
        permission: 执业证书.登记学时
        page: 继续教育学时登记页
        audit: true
        outcome: 学时已登记
      - actor: SH-E6
        where: offline
        evidence: [延续注册的回执或新证书扫描件, 新有效期止]
        command: 延续注册执业证书
        emits: []
        desc: 延续注册在注册执业管理机构办理，没有面向本系统的接口；办理后登记结果。注册期内累计学时达标是延续注册条件（聚合稿 AGG-66 内含，尚未列入 §1.2 INV 表）；延续已在系统外发生，学时未达标时预警不拒绝登记（notes 待用户定 V-14）
        permission: 执业证书.延续
        page: 执业证书维护页
        audit: true
        pending: V-14
        decision:
          - {when: otherwise, goto: end, outcome: 证书已延续}
      - actor: system
        where: automatic
        on_time: 证书有效期届满；届满前 N 日提醒（N 待用户定）
        command: 标记执业证书已到期
        branch: 到期
        emits: [执业证书已到期]
        desc: 定时命令约定缺（PG-10 同类）；事件仅分析
        audit: true
        notify: [{to: SH-E7, how: 企业微信通知}, {to: SH-E6, how: 企业微信待办}]
        outcome: 执业证书已到期
      - actor: SH-E6
        where: in_system
        command: 登记注册执业证书
        emits: []
        desc: 人力登记注册执业人员取得的证书（资格类别、证书编号、发证与注册机构、首个注册期）；迁入的存量证书不经本命令。新增命令，对象增删改查检查补缺（QC-OBJECTS.md），聚合稿未列
        permission: 执业证书.登记
        page: 执业证书维护页
        audit: true
        outcome: 证书已登记
      - actor: SH-E6
        where: offline
        evidence: [注销回执或注销证明扫描件, 注销日]
        command: 注销注册执业证书
        emits: []
        desc: 持有人离职、转出或证书被吊销时在注册执业管理机构办理注销，没有面向本系统的接口；办理后登记结果。新增命令，数据模型状态列已有「注销」，聚合稿无命令（QC-OBJECTS.md）
        permission: 执业证书.注销
        page: 执业证书维护页
        audit: true
        outcome: 证书已注销
    notes: 学时达标是延续注册条件；签发人须具备约定资格（INV-47 在交付物处读）。到期标记的定时由 platform.scheduling 承担。无人工审批：延续与注销都在系统外办理，本系统只登记结果。登记注册执业证书与注销注册执业证书是对象增删改查检查后补入的命令（vs07.notes.md 结构问题 19）。
