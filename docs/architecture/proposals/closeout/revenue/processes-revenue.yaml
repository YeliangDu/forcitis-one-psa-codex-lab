- id: PRC-10
  name: 收付保证金与保函
  aggregate: AGG-51
  owner_bc: B-09
  stages:
  - VS-01.2
  - VS-04.1
  primary_object: OBJ-13
  desc: 投标、履约或质保需缴纳或收取保证金、开立保函。方向分两类：我方缴纳（投标、履约保证金，资金流出，缴纳经 B-10 付款审批后登记；退回我方的登记见 PRC-153 和本流程退还）；我方收取（客户押金等，资金流入，退还出去须经 B-10 付款）
