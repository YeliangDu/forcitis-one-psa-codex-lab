      goto: 5
      rule: INV-47
      p: 0.97
    - when: 签发人执业证书无效或专业、等级不符，改派持证签发人
      goto: 4
      rule: INV-47
      p: 0.02
    - when: otherwise
      goto: end
      p: 0.01
      outcome: 未签发
    effort:
      typical_min: 15
      p90_min: 30
    wait:
      typical_h: 8
      p90_h: 24
    permission: 交付物.签发
    page: 交付物签发页
    audit: true
    outcome: 未签发
    notify:
    - to: SH-E2
      how: 企业微信消息（已签发，可送达）
    desc: 证书不符时拒绝签发（INV-47）；可改派持有效证书且专业、等级相符的签发人后回到本步重新签发，无人可派的以「未签发」结束
  - actor: SH-E2
    where: offline
    evidence:
    - 送达回执：签收单扫描件、快递妥投记录、邮件原始报文（含信头）或平台回执之一
    - 送达日与签收人
