    service: platform.approval
    branch: 让价
    command: 最终价款让价审批
    gap: 命令：平台任务「最终价款让价审批」
    desc: 最终价款低于协议价，即让价或审减，须经审批后才能结算；驳回则回到修订再谈
    approval:
      engine: platform.approval
      doc_type: 最终价款让价审批单
      approver: cost_object_owner
      owner_object: 协议所属项目
      why_human: 让价或审减是否接受属商业判断（客户关系、已发生成本、争议风险），系统只能算出差额并按阈值分流。
