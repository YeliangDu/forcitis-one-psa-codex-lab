  steps:
  - actor: SH-E2
    where: in_system
    command: 申请往来单位角色
    aggregate: AGG-01
    desc: 命令参数为角色，只适用供应商、分包、合伙人、渠道伙伴、联合体伙伴、海外持牌伙伴；客户角色无准入状态，档案核实即可用（P-3）
    decision:
    - when: 申请的角色为客户（客户角色不走准入）
      goto: end
      rule: INV-02
      outcome: 无需准入
      p: 0.15
    - when: 该供方类型无需资质
      goto: 3
      p: 0.1
    - when: otherwise
      goto: 2
      p: 0.75
    actor_v1: 项目经理
