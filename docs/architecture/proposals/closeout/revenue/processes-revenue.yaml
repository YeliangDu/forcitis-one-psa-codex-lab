  owner_bc: B-05
  human_orchestration: false
  migration: 历史已回签协议的归档记录（原件类型、份数、存放位置、归档日、扫描件引用）全部迁入（U-4）；投产时已回签未归档的协议，由迁入编排模块的一次性离线命令生成归档待办（迁入不发 ContractSigned，策略不会触发），原件实物按线下盘点登记
  scope: 按协议承担法人的数据范围：档案管理人经办，项目经理与商务可见本项目归档状态
  triggers:
