    - to: SH-E2
      how: 企业微信待办（待最终价款让价审批）
    withdraw:
      to: end
      outcome: 已撤回
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 96
  - actor: SH-E5
    where: in_system
    bc: B-05
    actor_v1: 商务
    command: 结算协议
    aggregate: AGG-13
    emits:
    - 协议已结算
    gap: G-16
    desc: 结算后差额由 B-08 订阅「协议已结算」处理：差额为负走 PRC-149 冲销收入确认，为正走补充确认（复用 PRC-53，结算书签认作客户确认证据，NOTES 待用户定）
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 协议已结算
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    permission: 协议结算.结算
    page: 协议结算页
    outcome: 协议已结算
    audit: true
    metric_event: true
    effort:
      typical_min: 10
      p90_min: 20
  notes: 合并原 PRC-67。收尾评审 H3：结算改为人工发起，不再依赖累计确认等于分摊价格（避免审减时死锁）；最终价款低于协议价走让价审批（AR-01、AR-02）；未能确认转索赔（PRC-49）、转争议处理或修订再谈。协议已结算后 B-08 的收入冲减由 PRC-149 承接。协议「已结算」与价值流阶段「结算」同名异义，已交 one-glossary。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 4 份
  human_note: 人工发起结算；最终价款低于协议价须审批；未能确认时转索赔或争议
  segregation:
  - roles:
    - SH-E5
    - SH-E2
    rule: 结算书编制人与最终价款让价审批人不得为同一人
  stages_note: '判据①：完成协议到 OBJ-05「已完成」造出 VS-04.6 退出，结算客户协议到「已结算」造出 VS-04.5 退出。不加 VS-02.7、VS-05.6：VS-02.7 段内协议「已结算 / 已终止」与 VS-05.6 退出明确限供方类型，本流程为客户协议。'
- id: PRC-69
  name: 申请并核验供方角色
