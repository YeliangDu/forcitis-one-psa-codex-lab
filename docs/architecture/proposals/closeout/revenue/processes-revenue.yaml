      p: 0.02
    - when: otherwise
      goto: 3
      p: 0.13
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起最终价款让价审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 协议结算.让价审批
    page: 审批待办页
    audit: true
    timeout:
