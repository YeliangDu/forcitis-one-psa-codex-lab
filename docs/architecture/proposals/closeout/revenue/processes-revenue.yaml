    emits:
    - 保证金已缴
    effort:
      typical_min: 10
      p90_min: 30
  - actor_v1: 出纳
    command: 登记保函开立
    branch: 保函
    effort:
      typical_min: 15
      p90_min: 45
  - actor_v1: 出纳
    command: 扣减保证金
    branch: 扣减
    desc: 履约保证金可部分扣减（INV-20）
    effort:
      typical_min: 10
      p90_min: 30
  - actor_v1: 出纳
    command: 退还保证金
    emits:
    - 保证金已退
    effort:
      typical_min: 10
      p90_min: 30
  - actor_v1: 出纳
    command: 没收保证金
    branch: 没收
    emits:
    - 保证金已没收
    effort:
      typical_min: 10
      p90_min: 30
  - actor_v1: 出纳
    command: 登记保函到期或索赔
    branch: 保函
    emits:
    - 保函已到期
    effort:
      typical_min: 15
      p90_min: 45
  - actor_v1: 系统策略
    command: 提交过账候选
    calls: PRC-92
  states:
  - 待缴
  - 已缴
  - 已退
  - 被没收
  - 已开立
  - 已到期
  - 被索赔
  transitions:
  - from: 待缴
    to: 已缴
    command: 登记保证金缴纳
    by:
    - SH-E6
    emits:
    - 保证金已缴
    period_gate: true
    desc: 我方缴纳的保证金（投标、履约）是资金流出：经 B-10 付款审批（审批人为商机负责人或部门负责人，M15），付款成功后登记缴纳
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 发起保证金缴纳付款
  - from: null
    to: 已开立
    command: 登记保函开立
    by:
    - SH-E6
  - from: 已缴
    to: 已缴
    command: 扣减保证金
    by:
    - SH-E6
    rule: INV-20
    period_gate: true
    approval:
      doc_type: 保证金扣减审批单
      why_human: 扣减以我方（或对方）违约事实成立为前提，违约事实与扣减金额需要责任人判断；系统只守「退还与没收互斥、履约保证金可部分扣减」（INV-20）。
      engine: platform.approval
      approver: cost_object_owner
      owner_object: 保证金所属协议或商机的责任人（项目经理、商机负责人或部门负责人）
      escalation_rules:
      - AR-01
      - AR-02
      on_reject: 转移不发生，保证金保持已缴
  - from: 已缴
    to: 已退
    command: 退还保证金
    by:
    - SH-E6
    emits:
    - 保证金已退
    rule: INV-20；AR-09（RULE-410）
    period_gate: true
    desc: 我方缴纳的保证金退回我方：收到招标人退款后登记（投标保证金见 PRC-153）。我方收取的保证金要退出去时，经 B-10 付款，只能付往原缴纳方账户（AR-09，RULE-410），不能由出纳只登记
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 发起保证金退还付款
  - from: 已缴
    to: 被没收
    command: 没收保证金
    by:
