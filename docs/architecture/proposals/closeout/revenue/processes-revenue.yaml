    effort:
      typical_min: 30
      p90_min: 90
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 关联项目与阶段
    - mode: api
      direction: out
      bc: B-01
      name: 调查对象联系人
    permission: 满意度调查.发出
    page: 满意度调查发出页
    timeout:
      after: 建议 P14D 未回收提醒（建议值，待用户定）
      escalate_to: SH-E2
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（满意度调查超期未回收，只预警）
  - actor: SH-E2
    where: offline
    evidence:
    - 客户填写的问卷原件或回访记录（扫描件、邮件原始报文）
    - 回收日与填写人
    actor_v1: 项目经理
    command: 登记调查回收
    aggregate: AGG-105
    effort:
