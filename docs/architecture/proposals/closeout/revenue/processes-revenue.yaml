    effort:
      typical_min: 15
      p90_min: 30
  frequency_ref: 待取证（E-B1）；经验估计：每月约 15 份
  support: 合同档案支持活动（B-05，C-4 归档并入合同模块档案功能，intent 144943）：回签后原件移交档案，不改变 VS-04.1 退出状态
- id: PRC-149
  name: 冲销收入确认
  added_in: closeout
  trigger:
    type: human
    desc: 客户撤回认可、证据事后失效、审批误批，或协议结算差额为负、协议终止后，财务或项目经理发起冲销；系统也订阅协议已结算、协议已终止自动判定
  stages:
  - VS-04.2
  - VS-04.5
  primary_object: OBJ-81
  primary_object_note: 冲销收入确认（反向事实）；OBJ-81 形态待定（Q20、Q-04）
  owner_bc: B-08
  human_orchestration: true
  human_note: 冲销已过账的收入事实，须审批（AR-06）；更正只能冲销，不改原确认事实（Q-04 C）
  migration: 历史冲销行随历史确认事实迁入（U-4）；投产时审批中的冲销不迁审批实例（ADR-0036 第 5 条），由迁入编排模块的一次性离线命令对在途项重新占用冲销额度并发起审批
  scope: 按承担法人与项目承担部门的数据范围：财务经办，项目经理仅见本项目
  segregation:
  - roles:
    - SH-E6
    - SH-E2
    rule: 冲销申请提交人与审批人不得为同一人
  triggers:
  - type: human
    name: 财务或项目经理发起冲销（客户撤回认可、证据事后失效、审批误批）
  - type: event
    name: 协议已结算（B-05 发出；最终价款低于累计确认时冲销，高于时转补充确认）
    publisher: B-05
  - type: event
    name: 协议已终止（B-05 发出；已确认但终止后不再成立的部分冲销）
    publisher: B-05
  outcomes:
  - 收入已冲销
  - 冲销已驳回
  - 无需冲销
  - 转补充确认
  - 冲销被拒
  - 暂挂待跨年处理
  roles:
  - id: SH-E6
    as: initiator
    org_needs:
      responsibility: 提交冲销申请；命中 AR-06 时作为财务负责人加审
      approval_right: 加审审批权（财务负责人）
      department_hint: 财务部
      position_hint: 财务负责人、应收会计
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 作为协议所属项目的责任人审批收入冲销；也可发起冲销
      approval_right: 一级审批（责任人）
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 审批超时的升级知会；AR-02、AR-07 特殊加审
      approval_right: 特殊加审时参与
      department_hint: 事业部或区域
      position_hint: 总经理
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-44
    - AGG-13
    desc: 读原收入确认事实、累计确认与分摊价格，以及协议结算或终止状态；事件触发时先算差额。事件触发时由系统生成冲销申请，不经第 2 步人工登记：冲销额＝累计确认 − 最终价款（协议已结算）或终止后不再成立的已确认部分（协议已终止，按协议终止依据确定）；原因取「结算审减」或「协议终止」，引用协议结算或终止记录
    decision:
    - when: 协议已结算且最终价款高于累计确认（差额为正）
      goto: PRC-53
      outcome: 转补充确认
      p: 0.1
    - when: 协议已结算且最终价款不低于累计确认，或协议终止后已确认部分仍成立
      goto: end
      outcome: 无需冲销
      p: 0.45
    - when: 协议已结算（差额为负）或协议已终止（已确认部分不再成立）
      goto: 3
      p: 0.35
    - when: otherwise
      goto: 2
      p: 0.1
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 协议已结算
    - mode: event
      direction: in
      bc: B-05
      name: 协议已终止
    - mode: api
      direction: out
      bc: B-05
      name: 读协议状态与最终价款
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 冲销收入确认
    aggregate: AGG-44
    gap: 新用语：命令「冲销收入确认」（聚合稿 AGG-44 无；Q-04 C 要求更正只靠冲销行）
    desc: 引用原确认事实，写冲销原因（客户撤回认可、证据事后失效、审批误批、范围缩减、协议终止、结算审减）；冲销额不得超过原确认事实未冲销余额
    decision:
    - when: 冲销额超过原确认事实的未冲销余额
      goto: end
      rule: 拟规则 REV-R2（冲销不超原确认）
      outcome: 冲销被拒
      p: 0.02
    - when: otherwise
      goto: 3
      p: 0.98
    permission: 收入冲销.提交
    page: 收入冲销申请页
    audit: true
    effort:
      typical_min: 30
      p90_min: 90
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 占用冲销额度
    aggregate: AGG-44
    gap: 新用语：命令「占用冲销额度」（占用反向额度，随 Q-04 C）
    desc: 在履约义务额度上占用反向额度，同一原确认事实的在途冲销合计不超过其未冲销余额；按原确认事实与冲销申请幂等
    decision:
    - when: 在途冲销与已冲销合计超过原确认事实
      goto: end
      rule: 拟规则 REV-R2（冲销不超原确认）
      outcome: 冲销被拒
      p: 0.01
    - when: otherwise
      goto: 4
      p: 0.99
    audit: true
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 收入冲销审批
    gap: 命令：平台任务「收入冲销审批」
    approval:
      engine: platform.approval
      doc_type: 收入冲销审批单
      approver: cost_object_owner
      owner_object: 协议所属项目
      why_human: 冲销原因是否成立、应冲销还是应走更正确认、冲销金额是否准确，需要责任人和财务按业务事实判断；系统只能守冲销不超原确认。
      escalation_rules:
      - AR-06
      - AR-02
      - AR-07
      on_reject: 7
    decision:
    - when: 审批通过
      goto: 5
      p: 0.9
    - when: 提交人撤回冲销申请
      goto: 7
      p: 0.02
    - when: otherwise
      goto: 7
      p: 0.08
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起收入冲销审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 收入冲销.审批
    page: 审批待办页
    audit: true
    timeout:
      after: P5D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（待收入冲销审批）
    withdraw:
      to: 7
      outcome: 已撤回
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 96
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 追加冲销行并占用转实
    aggregate: AGG-44
    emits:
    - 收入确认已冲销
    gap: 新用语：命令「追加冲销行并占用转实」，事件「收入确认已冲销」（仅分析）
    desc: 同一事务内二次校验额度 → 追加不可改的冲销行（负额，指向原确认事实，记冲销原因与审批实例）→ 占用转实；按审批实例幂等；确认事实与过账事实不同事务
    decision:
    - when: 二次校验失败（原确认事实已被其他冲销占满）
      goto: 7
      rule: 拟规则 REV-R2（冲销不超原确认）
      p: 0.01
    - when: otherwise
      goto: 6
      p: 0.99
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-44
    calls: PRC-92
    period_gate: true
    desc: 期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2）
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 收入已冲销
      p: 0.99
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  - actor: system
    where: automatic
    actor_v1: 系统策略
    branch: 驳回或撤回
    command: 释放收入额度占用
    aggregate: AGG-44
    gap: 新用语：「释放收入额度占用」随 Q-04
    desc: 驳回、撤回或二次校验失败后释放反向额度占用，不留冲销行；通知申请人
    decision:
    - when: otherwise
      goto: end
      outcome: 冲销已驳回
    notify:
    - to: SH-E6
      how: 企业微信消息（收入冲销申请未通过，已释放占用）
    audit: true
  notes: 收尾评审 H2：Q-04 选 C 后更正只能冲销，补本流程；结算差额为负（PRC-66）与协议终止（PRC-68）经事件触发，为正则转补充确认（复用 PRC-53，结算书签认作客户确认证据，待用户定）。冲销必须有审批（AR-06 abnormal 加一级财务负责人）。客户撤回认可、证据事后失效、审批误批由人工发起。冲销只冲收入确认行，开票与红冲走 PRC-57、58，互不触发。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 2 次
  scenarios:
  - PRC-149-S01
  - PRC-149-S02
  - PRC-149-S03
  - PRC-149-S04
  - PRC-149-S05
  - PRC-149-S06
  - PRC-149-S07
  - PRC-149-S08
  - PRC-149-S09
  - PRC-149-S10
  - PRC-149-S11
  - PRC-149-S12
  - PRC-149-S13
  - PRC-149-S14
  - PRC-149-S15
  - PRC-149-S16
  stages_note: 理由：冲销是收入确认的逆向（VS-04.2 退出「收入确认事实已过账」的反向，追加冲销行并提交过账），人工更正随时可发起（VS-04.2），结算审减或协议终止触发的属 VS-04.5；不经开票与回款阶段。近似项是通用状态词撞名，不改
- id: PRC-151
  name: 填报经营产值
  trigger:
    type: time
    desc: 每期末产值填报窗口开启
  stages:
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.5
  - VS-02.6
  primary_object: OBJ-33
  primary_object_note: 产值估计写入完工估算的只追加子表 progress_estimates，不改估算的批准状态
  owner_bc: B-04
  human_orchestration: false
  desc: 每期由项目经理按项目 × 协议填报当期累计产值估计（经营产值，内部管理口径）；写入完工估算聚合的只追加子表 progress_estimates，不过账、不占开票与收入额度、不进财务，也不触发或依赖收入确认（用户口径：每期估进度只是内部管理产值）。
  migration: 老系统已有的历史产值填报记录全部迁入（U-4）为只追加的估计行，记迁入来源；不迁入任何收入、过账或额度
  scope: 项目经理填报本人负责项目；部门负责人见承担部门全部项目并抽查；财务与管理层只读
  frequency_ref: 待取证（E-B1）；经验估计：每个在执行项目每期 1 次，抽查比例 20%
  triggers:
  - type: time
    name: 每期末产值填报窗口开启
  outcomes:
  - 产值已填报
  - 产值已抽查
  scenarios:
  - PRC-151-S01
  - PRC-151-S02
  - PRC-151-S03
  - PRC-151-S04
  - PRC-151-S05
  - PRC-151-S06
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 每期按项目填报当期累计产值估计
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: reviewer
    org_needs:
      responsibility: 抽查所辖项目的产值估计是否合理，发现偏差通知项目经理更正
      approval_right: 无审批权（抽查，不设审批）
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人
  steps:
  - actor: SH-E2
    where: in_system
    command: 填报产值估计
    aggregate: AGG-23
    gap: 聚合稿 AGG-23 缺「填报产值估计」命令（新用语候选，写入子表 progress_estimates，见 NOTES 命令缺口）
    desc: 按项目 × 协议填报期间与当期累计产值估计；只追加，更正以新行追加；估计不进收入确认、不占额度、不提交过账候选
    decision:
    - when: 被抽查（按抽查比例规则配置）
      goto: 2
      p: 0.2
    - when: otherwise
      goto: end
      outcome: 产值已填报
      p: 0.8
    permission: 经营产值.填报
    page: 经营产值填报页
    audit: true
    metric_event: true
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 48
      p90_h: 96
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    outcome: 产值已填报
    notify:
    - to: SH-M1
      how: 企业微信待办（项目经理超 3 日未填报当期产值）
  - actor: SH-M1
    where: in_system
    read: true
    reads:
    - AGG-23
    desc: 部门负责人抽查产值估计，对照完工估算与交付进度判断合理性；仅读取并留意见，不设审批；发现偏差通知项目经理更正后重填
    decision:
    - when: 发现明显偏差，通知项目经理更正
      goto: 1
      p: 0.1
    - when: otherwise
      goto: end
      outcome: 产值已抽查
      p: 0.9
    permission: 经营产值.抽查
    page: 经营产值抽查页
    audit: true
    effort:
      typical_min: 15
      p90_min: 45
    wait:
      typical_h: 24
      p90_h: 72
    outcome: 产值已抽查
    notify:
    - to: SH-E2
      how: 企业微信消息（抽查发现偏差，请更正产值估计）
  notes: 评审 M7：补承载「经营产值」的业务流程。AGG-23 现有命令只有提出、批准完工估算，填报产值估计为新命令（新用语）；数据落点见 Q04_STORAGE。产值与收入三口径对照见读模型 PRC-154。填报与抽查均不设审批（用户原则：能规则化的不要人来守，产值不进财务）。
  stages_note: 'VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6：SD-13 已列段内「产值已填报 / 产值已抽查」，ref 仍为「缺对象状态」，gap MS-23。流程只向完工估算追加产值估计行，不改 OBJ-33 批准状态；保留这些段与真实结局，不以「已批准」替代，信息图对象状态待回补。'
- id: PRC-152
  name: 登记付款条件项达成
  added_in: closeout
  trigger:
    type: human
    desc: 付款条件为非成果认可型节点（预付、施工图审查通过、竣工验收、结算审定、质保期满）达成时，商务附外部证据登记；时间型节点（按月、按季度）到期自动达成
  stages:
  - VS-04.3
  primary_object: OBJ-07
  primary_object_note: 结局使付款条件项「可结算」（VS-04.3 进入条件）
  owner_bc: B-05
  human_orchestration: true
  human_note: 登记须附与条件类型对应的外部证据（规则校验），无审批；时间型节点由定时触发
  migration: 迁入协议的付款条件项状态与已有的达成登记全部迁入（U-4），不重复发事件；投产时时间型节点的下一个到期日由迁入编排模块的一次性离线命令登记定时
  scope: 按承担法人与项目承担部门的数据范围：商务经办，项目经理与财务可见
  segregation:
  - roles:
    - SH-E5
    - SH-E6
    rule: 达成登记人与开票申请经办（PRC-57）不得为同一人
  triggers:
  - type: human
    name: 商务登记非成果认可型付款条件达成（附外部证据）
  - type: time
    name: 时间型付款节点到期日（按月、按季度）
  - type: time
    name: 缺陷责任期届满日（质保金到期返还）
  outcomes:
  - 条件已达成并可结算
  - 登记被拒
  - 条件已是可结算
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 登记非成果认可型付款条件达成并附外部证据
      approval_right: 无
      department_hint: 市场与商务部门
      position_hint: 商务经理（合同管理岗）
  - id: SH-E2
    as: informed
    org_needs:
      responsibility: 收到条件达成与可结算的通知，申请返还质保金、提出开票
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 出具外部证据：竣工验收证书、结算审定书、缺陷责任期终止证书
      approval_right: 客户方书面文件（线下证据，本系统只登记）
      department_hint: 客户方
      position_hint: 客户项目或设计管理负责人
  - id: SH-R1
    as: external
    org_needs:
      responsibility: 出具施工图审查合格书
      approval_right: 不适用（外部监管）
      department_hint: 审图机构
      position_hint: —
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-13
    desc: 读付款条件项（类型、条款、状态）。条件类型：预付（签约后）、施工图审查通过、工程竣工验收、按月或按季度、结算审定、缺陷责任期届满（质保金）；成果认可型由 PRC-56 处理，不在此
    decision:
    - when: 付款条件项已是可结算
      goto: end
      outcome: 条件已是可结算
      p: 0.03
    - when: 时间型节点到期日已届
      goto: 3
      p: 0.25
    - when: otherwise
      goto: 2
      p: 0.72
    cross_bc:
    - mode: api
      direction: out
      bc: B-05
      name: 读付款条件项
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 登记付款条件达成
    aggregate: AGG-13
    gap: 新用语：命令「登记付款条件达成」（聚合稿 AGG-13 无；H5，随 PRC-152 新增）
    evidence:
    - 与条件类型对应的外部证据：施工图审查合格书、工程竣工验收证书、结算审定书、缺陷责任期终止证书，或双方签认的条件达成确认单
    - 达成日与证据出具方
    desc: 证据类型须与条件类型相符（条件类型 → 证据类型对照，拟规则 PAY-R1）；缺失或不符拒绝；质保金到期返还须有缺陷责任期终止证书
    decision:
    - when: 证据缺失，或证据类型与条件类型不符
      goto: end
      rule: 拟规则 PAY-R1（条件类型 → 证据类型对照）
      outcome: 登记被拒
      p: 0.04
    - when: otherwise
      goto: 3
      p: 0.96
    permission: 付款条件.登记达成
    page: 付款条件达成登记页
    audit: true
    metric_event: true
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 72
      p90_h: 360
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 标记付款条件项可结算
    aggregate: AGG-13
    emits:
    - 付款条件项已可结算
    desc: 同 PRC-56 的命令；按付款条件项 ID 与达成登记幂等；订阅方 B-08（PRC-57 开票申请），可开票额度金额在 AGG-44；质保金付款条件项到期返还同此，项目经理随后按 PRC-57 开票或出收据
    outcome: 条件已达成并可结算
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 付款条件项已可结算
    notify:
    - to: SH-E2
      how: 企业微信待办（付款条件已达成，可提出开票申请；质保金到期请申请返还）
    audit: true
  notes: 收尾评审 H5：此前「付款条件项已可结算」只由交付物已认可触发，预付、审图通过、竣工验收、按期、结算审定、质保期满等节点无法开票；本流程补人工登记（附外部证据，规则校验）与时间型定时触发，质保金到期返还并入此处（M13）。无审批：条件是否达成由外部证据与类型对照规则守卫。
  scenarios:
  - PRC-152-S01
  - PRC-152-S02
  - PRC-152-S03
  - PRC-152-S04
  - PRC-152-S05
  - PRC-152-S06
  - PRC-152-S07
  - PRC-152-S08
  frequency_ref: 待取证（E-B1）；经验估计：每月约 10 次
  stages_note: 'SD-14 已写回：登记付款条件达成使 OBJ-07 到「可结算」，是 VS-04.3 段内状态，保留 VS-04.3；不再只靠进入条件归段。本流程不造应收，不加 VS-04.4；VS-04.1、VS-04.6、VS-05.2、VS-07.3 的协议状态在本命令中不变，不加这些段。'
- id: PRC-153
  name: 退还投标保证金
  added_in: closeout
  trigger:
    type: event
    events:
    - event: 投标保证金待退还
      aggregate: AGG-11
    desc: 投标未中标、废标、截止前撤回，或签约后，PRC-08 发信号事件通知收回投标保证金
  stages:
  - VS-01.2
  - VS-04.1
  primary_object: OBJ-13
  owner_bc: B-09
  human_orchestration: true
  human_note: 等待招标人退款到账，逾期催退，到账后登记退还并过账；招标人不退或没收的转没收登记
  migration: 历史投标保证金退还记录随 PRC-10 的台账全部迁入（U-4）；投产时已触发待退未到账的，由迁入编排模块的一次性离线命令补发「投标保证金待退还」信号（迁入不发事件）
  scope: 保证金台账按法人范围可见，经办限财务出纳；商务可见本人投标的退还进度
  segregation:
  - roles:
    - SH-E6
    rule: 登记退还与导入银行流水不得为同一人
  triggers:
  - type: event
    name: 投标未中标
    publisher: B-03
  - type: event
    name: 投标已废标
    publisher: B-03
  - type: event
    name: 投标已撤销
    publisher: B-03
  outcomes:
  - 保证金已退
  - 退还被拒
  - 转没收登记
  - 暂挂待跨年处理
  roles:
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 确认招标人退款到账并登记退还、过账
      approval_right: 无审批权（经办）
      department_hint: 财务部（资金岗）
      position_hint: 出纳
  - id: SH-E5
    as: performer
    org_needs:
      responsibility: 向招标人催退投标保证金
      approval_right: 无
      department_hint: 市场与商务部门
      position_hint: 商务经理
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 退款长期未到账的升级知会
      approval_right: 无
      department_hint: 事业部或区域
      position_hint: 部门负责人
  - id: SH-X4
    as: external
    org_needs:
      responsibility: 招标人或招标代理：退还投标保证金
      approval_right: 不适用（外部）
      department_hint: 招标人、招标代理
      position_hint: —
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-51
    - AGG-11
    desc: 订阅 PRC-08 发出的投标未中标、已废标、已撤销（S-42 接缝）；读投标保证金与投标结果；退还与没收互斥各只一次（INV-20），已退或已没收的不再退还
    decision:
    - when: 保证金未缴，或已退还、已没收
      goto: end
      rule: INV-20
      outcome: 退还被拒
      p: 0.02
    - when: otherwise
      goto: 2
      p: 0.98
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: 投标未中标
    - mode: event
      direction: in
      bc: B-03
      name: 投标已废标
    - mode: event
      direction: in
      bc: B-03
      name: 投标已撤销
    - mode: api
      direction: out
      bc: B-03
      name: 读投标与投标结果
  - actor: SH-E6
    where: external:银行
    actor_v1: 出纳
    read: true
    reads:
    - AGG-88
    evidence:
    - 招标人退款的银行到账回单（经资金账户模块导入的流水行）
    desc: 等待招标人退款到账；约定期限内未到账则提醒（P-10：签约后 5 日未退）并转催退
    decision:
    - when: 超过约定退还期限仍未到账
      goto: 3
      p: 0.2
    - when: otherwise
      goto: 4
      p: 0.8
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 读资金账户与流水行
    timeout:
      after: P5D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（P-10 投标保证金超期未退）
    wait:
      typical_h: 168
      p90_h: 720
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    branch: 催退
    gap: 无聚合命令：线下催退，本系统只登记证据
    evidence:
    - 催退函或沟通记录
    - 招标人答复（退还时间或不予退还的理由）
    desc: 商务向招标人催退；招标人明确不退或没收的，转没收登记（PRC-10）
    decision:
    - when: 招标人明确不予退还或没收
      goto: end
      outcome: 转没收登记
      p: 0.1
    - when: otherwise
      goto: 2
      p: 0.9
    effort:
      typical_min: 30
      p90_min: 90
    wait:
      typical_h: 72
      p90_h: 360
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 退还保证金
    aggregate: AGG-51
    emits:
    - 保证金已退
    rule: INV-20
    desc: 登记退还，引用银行回单；收款账户须为本公司登记账户；本流程的退还是招标人把我方缴纳的保证金退回我方，我方收取的保证金退出去走 PRC-10 并经 B-10 付款
    permission: 保证金.登记退还
    page: 保证金退还登记页
    audit: true
    effort:
      typical_min: 10
      p90_min: 30
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-51
    calls: PRC-92
    period_gate: true
    desc: 期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2）
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 保证金已退
      p: 0.99
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  notes: 由 PRC-08 第 15–20 步拆出（PRC-08 属 B-03，与本流程以信号事件「投标保证金待退还」衔接；PRC-08 的重新招标、商机丢失等后续留在 PRC-08）。信号事件的发布方 B-03 → 订阅方 B-09 须在 §4.1 核对（接缝问题）。保证金退还的审批：本流程是资金流入，不设审批。
  scenarios:
  - PRC-153-S01
  - PRC-153-S02
  - PRC-153-S03
  - PRC-153-S04
  - PRC-153-S05
  - PRC-153-S06
  - PRC-153-S07
  - PRC-153-S08
  frequency_ref: 待取证（E-B1）；经验估计：每月约 6 笔
  stages_note: 'SD-13 已写回：退还投标保证金使 OBJ-13「已退」，是 VS-01.2 段内状态；中标后退还的投标保证金也已明列于 VS-04.1 段内 OBJ-13 说明。按既有两条退还路径保留 VS-01.2、VS-04.1，不再等待阶段定义；业务流程结局归段不能只以事件触发的文字匹配判定。'
event_policies:
- id: PRC-51
  name: 建立并更新开票与收入额度
  trigger:
    type: event
    events:
    - event: 协议已生效
      aggregate: AGG-13
    - event: 新基线已生效
      aggregate: AGG-13
  stages:
  - VS-04.1
  - VS-04.2
  - VS-04.3
  - VS-04.6
  stages_note: '判据②：ContractSigned 对应 VS-04.1 退出并为 VS-04.2、VS-04.6 进入的协议状态；新基线已生效是 VS-04.6 协议变更段内状态，本策略随之更新额度，补标 VS-04.6。保留 VS-04.1、VS-04.2、VS-04.3：额度由签约建立，供收入确认（INV-22、PRC-53）与开票（PRC-57）占用；VS-04.3 为服务该段的技术记录，不声称额度是新增业务对象。'
  primary_object: none
  primary_object_note: 'CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。'
  owner_bc: B-08
  migration: 迁入协议的额度行由迁入事实重放建立：累计开票额与累计确认额取自迁入的发票与确认事实（U-4），不重复发事件；投产前已回签的协议，由迁入编排模块的一次性离线命令在迁入完成时建额度；额度改动只追加变动行（data-model 补丁 L7）
  triggers:
  - type: event
    name: 协议已生效
    publisher: B-05
  - type: event
    name: 新基线已生效
    publisher: B-05
  step:
    actor: system
    where: automatic
    command: 更新开票与收入额度
    aggregate: AGG-44
    emits:
    - 可开票额度已更新
    desc: 读付款条件项与履约义务建立或调整额度；按协议 ID 与基线版本幂等，重复事件不重复建额度；读不到协议或承担法人则失败并告警
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 协议已生效
    - mode: event
      direction: in
      bc: B-05
      name: 新基线已生效
    - mode: api
      direction: out
