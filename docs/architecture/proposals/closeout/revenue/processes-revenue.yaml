    gate_rule: 各阶段出口取自价值流 VS-02：共同出口＝阶段节点已完成，且该阶段下需客户认可的交付物均已认可，或已送达（审查中）并已声明无异议；视为同意是读模型从 B-08 的认定事件派生显示，交付物无该状态（ADR-0049）
    stage_exits:
    - stage: VS-02.0
      exit: 项目已立项或执行中；交付计划已批准（对客）或内部锁定；项目预算已锁定；启动阶段节点已完成
    - stage: VS-02.1 至 VS-02.5
      exit: 共同出口
    - stage: VS-02.6
      exit: 共同出口，另加我方成果类不符合项已关闭（未关闭只预警）
    - stage: VS-02.7
      exit: 项目复盘已发布；满意度调查已回收、已评分或已跟进（未回收只预警）；已发布交付物与证据已封存；项目已结项并归档
    warnings:
    - code: 阶段已完成但出口未满足
      rule: 阶段节点已完成而共同出口的交付物条件不满足
    - code: 催签超期
      rule: 交付物已送达后超过催签周期（合同未约定审查期时缺省 P15D）仍无认可、退回或无异议声明；不自动认可，不得登记视为同意
    - code: 审查期将满
      rule: 已送达且合同约定审查期的，距期满前提示项目经理登记无异议声明；期满判定在 B-08（P-21）
    - code: 阶段倒序或跳段
      rule: 仅提示，不拦截（S2 取证 89.5% 阶段有重叠）
    refresh: 订阅领域事件增量更新（reporting L1，ADR-0023），每日定时全量校正一次；预警留痕只追加，保留预警出现与消除的时间
    freshness: 事件到达后分钟级；以每日校正为准
