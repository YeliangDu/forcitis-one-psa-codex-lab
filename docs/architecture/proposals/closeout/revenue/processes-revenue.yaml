      rule: INV-02
      outcome: 角色已停用
      p: 1.0
    actor_v1: 财务
    permission: 往来单位角色.停用
    page: 往来单位角色核准页
    audit: true
    outcome: 角色已停用
    effort:
      typical_min: 10
      p90_min: 30
  notes: 角色准入命令的参数为角色，只适用于供应商、分包等需准入的角色，客户角色不走准入（intent 120544 P-3）。未合格或已停用的供应商不得签分包、采购协议或付款（INV-04）；资质到期见「年检、核查与延续企业资质」。暂停、停用仍由财务人工触发（D10 建议）。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 5 个新供方
  stages_note: '判据①：核准供方角色使 OBJ-02「合格」，登记供方资质使 OBJ-65「有效」，造出 VS-05.1 退出。不加 VS-01.2：该段 OBJ-65 明确为投标引用我方资质，本流程为供方资质；不加 VS-06.2：该段为企业既有资质的年检核查与延续，非供方初次准入。'
- id: PRC-78
  name: 年检、核查与延续企业资质
  trigger:
