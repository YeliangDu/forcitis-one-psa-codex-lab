      approval_right: 无
      department_hint: 承担项目的业务部门
      position_hint: 项目经理
  - id: SH-C5
    as: external
    org_needs:
      responsibility: 委托方（保险公司等），不登录本系统
      approval_right: 无（线下委托）
      department_hint: 外部，不在本系统组织内
      position_hint: —
  notes: 检查计划仅 IDI（AGG-34 / OBJ-48）；非 IDI 的周期检查不建计划，由检查负责人直接「安排检查」（PRC-43），到期只作提醒（U-3）。到期提醒是派生 / 策略（P-28），不存状态；人工转线索后另起「登记并跟进线索」，上游不订阅下游事件。按周期结算用协议付款条件项。
  steps:
  - actor: system
    where: automatic
    actor_v1: 检查负责人
    read: true
    reads:
    - AGG-13
    - AGG-33
    desc: 读协议与受检部位；协议范围不含 IDI 检查服务的，不建计划
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 协议已生效
    - mode: api
      direction: out
      bc: B-05
      name: 读协议
    - mode: api
      direction: out
      bc: B-01
      name: 读受检部位
    decision:
    - when: 协议范围含 IDI 检查服务
      goto: 2
      p: 0.8
    - when: otherwise
      goto: end
      outcome: 无需检查计划
      p: 0.2
    notify:
    - to: SH-E4
      how: 企业微信待办（协议已回签，请制定检查计划）
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 登记检查计划
    aggregate: AGG-34
    desc: 只有到期日，到期提醒是派生 / 策略（R-04）
    permission: 检查计划.登记
    page: 检查计划编辑页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
    wait:
      typical_h: 24
      p90_h: 72
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 生效检查计划
    aggregate: AGG-34
    desc: 已登记 → 生效；VS-03.1 进入条件（符合性审查 必-6）
    permission: 检查计划.生效
    page: 检查计划页
    audit: true
    effort:
      typical_min: 5
      p90_min: 10
    notify:
    - to: SH-E2
      how: 企业微信消息（检查计划已生效）
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-34
    desc: P-28 到期提醒与逾期未委托提醒，读模型派生，不存状态；由人工转线索，上游不订阅下游事件（符合性审查 建-12）。提醒提前量与逾期提醒周期为配置参数，P30D 为经验估计
    decision:
    - when: 协议到期或客户不再委托
      goto: 5
      p: 0.15
    - when: otherwise
      goto: end
      outcome: 计划已生效
      p: 0.85
    timeout:
      after: P30D
      escalate_to: SH-E4
      interrupting: false
    notify:
    - to: SH-E4
      how: 企业微信待办（检查计划即将到期或已逾期未委托，请转线索）
    - to: SH-E5
      how: 企业微信消息（计划到期，可跟进续做线索）
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 标记检查计划不再受托
    aggregate: AGG-34
    branch: 不再受托
    desc: 生效 → 不再受托，VS-03 ends_in 状态（符合性审查 必-6）；原因建议必填（待用户定）
    permission: 检查计划.标记不再受托
    page: 检查计划页
    audit: true
    effort:
      typical_min: 5
      p90_min: 10
    decision:
    - when: otherwise
      goto: end
      outcome: 不再受托
      p: 1.0
  stages_note: 'SD-14 已写回：生效检查计划使 OBJ-48 到「生效」，是 VS-03.1 段内状态；本流程虽由 ContractSigned 触发，仍是含制定与生效步骤的检查策划业务流程。不加 VS-02.0：触发协议已签署是启动段读取的共享状态，本流程不建立项目、交付计划或预算，也不完成启动阶段节点；按实际产出保留 VS-03.1。'
