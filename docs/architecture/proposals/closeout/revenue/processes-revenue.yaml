      approval_right: 客户方书面认可（线下证据，本系统只登记）
      department_hint: 客户方
      position_hint: 客户项目或设计管理负责人
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-13
    - AGG-27
    desc: P-21；读合同审查期参数与送达日，算期满日；同一交付物已有上一轮未结待办的（新一轮送达），先作废旧待办
    decision:
    - when: 同一交付物已有上一轮未结的期满待办（重新报送后新送达）
      goto: 2
      p: 0.05
    - when: otherwise
      goto: 3
      p: 0.95
    cross_bc:
    - mode: event
      direction: in
      bc: B-28
      name: 交付物已送达
    - mode: event
      direction: in
      bc: B-28
      name: 无异议已声明
    - mode: api
      direction: out
      bc: B-05
      name: 读视为同意参数
    - mode: api
      direction: out
      bc: B-28
      name: 读送达与退回
  - actor: platform
    where: automatic
    platform_task: true
    branch: 新送达
    desc: 作废上一轮的期满待办与催办（旧轮次的声明与期满不再有效），以新送达日重新计期
    decision:
    - when: otherwise
      goto: 3
    audit: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-27
    on_time: 合同审查期满（送达日起）
    desc: 事件网关二选一：到期定时与客户退回（AcceptanceReturned）谁先到谁生效；到期前收到退回则取消，不再认定（ADR-0047 第 5 条第 5 点）
    decision:
    - when: 期满前先收到客户退回
      goto: 4
      rule: ADR-0047 第 5 条第 5 点
      p: 0.05
    - when: otherwise
      goto: 5
      p: 0.95
    cross_bc:
    - mode: event
      direction: in
      bc: B-28
      name: AcceptanceReturned
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-27
    branch: 退回
    desc: 退回后取消期满待办；退回事件的订阅反应是读检不是命令（G-19）
    decision:
    - when: otherwise
      goto: end
      outcome: 待办已取消
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-27
    - AGG-44
    desc: 核对三个条件：期满、交付侧已有无异议声明、该轮未被退回（ADR-0049 决定 2）；声明日不得早于期满日
    decision:
    - when: 声明日早于期满日
      goto: end
      rule: ADR-0049 决定 1、5
      outcome: 视为同意未成立
      p: 0.02
    - when: 期满时已有无异议声明且该轮未被退回
      goto: 7
      p: 0.73
    - when: otherwise
      goto: 6
      p: 0.25
  - actor: platform
    where: automatic
    platform_task: true
    branch: 期满无声明
    desc: 期满仍无声明：催办项目经理登记无异议声明，并向阶段门提示预警；催办期内登记声明后回到第 5 步重新核对，催办期满仍无声明则本轮不成立（之后登记声明会因「无异议已声明」重新触发）
    decision:
    - when: 催办期内收到无异议已声明
      goto: 5
      p: 0.6
    - when: otherwise
      goto: end
      outcome: 视为同意未成立
      p: 0.4
    cross_bc:
    - mode: event
      direction: in
      bc: B-28
      name: 无异议已声明
    notify:
    - to: SH-E2
      how: 企业微信待办（合同审查期已满，请登记无异议声明）
    - to: SH-M1
      how: 企业微信消息（视为同意期满无声明，阶段门预警）
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    audit: true
    wait:
      typical_h: 24
      p90_h: 72
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 认定视为同意成立
    aggregate: AGG-44
    gap: 新用语：命令「认定视为同意成立」（聚合稿 AGG-44 现作「确认视为同意期满」，随 Q-04 订正，替代原名）
    emits:
    - 视为同意已成立
    desc: 系统自动认定，认定事实只追加（ADR-0049 决定 2），触发收入确认 PRC-53；交付物无「视为同意」状态；不由项目经理再认定一次
    decision:
    - when: 认定时发现该轮已被退回
      goto: end
      outcome: 视为同意未成立
      p: 0.01
    - when: otherwise
      goto: 8
      p: 0.99
    rule: ADR-0049 决定 1、2、5
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    bc: B-05
    actor_v1: 系统策略
    command: 标记付款条件项可结算
    aggregate: AGG-13
    emits:
    - 付款条件项已可结算
    desc: 视为同意等同认可，使对应付款条件项可结算（B-08 调 B-05 命令，下游调上游，边已有；NOTES 待用户定 3）；按付款条件项 ID 与提交轮次幂等；找不到条件项则失败并告警
    outcome: 视为同意已成立
    cross_bc:
    - mode: api
      direction: out
      bc: B-05
      name: 标记付款条件项可结算
    audit: true
  notes: 收尾评审 H1：认定改为系统自动（订阅「无异议已声明」加期满定时，三条件齐备即认定），项目经理只在 PRC-28 声明一次；期满定时与客户退回二选一；期满无声明催办；新送达作废旧待办。认定成立后由 PRC-53 占用收入额度并发起审批（S-11）。「AcceptanceReturned」订阅方 B-08 的取消反应是读检不是命令，记入 G-19。视为同意使付款条件项可结算（第 8 步）按
    NOTES 待用户定 3 的建议落地，仍待用户确认。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 10 次
  stages_note: 判据：阶段说明写明视为同意的期满判定在 VS-04.2（D-8），判定记在收入确认行上，不是对象状态。字面误判：「标记付款条件项可结算」在协议上是状态不变（已签署生效 / 履行中 / 已完成各自保持），不造 VS-04.1 退出、VS-04.6 退出，更不属 VS-05.2、VS-07.3
- id: PRC-57
  name: 申请并开具销项增值税发票
  trigger:
    type: event
    events:
    - event: 付款条件项已可结算
      aggregate: AGG-13
    desc: 付款条件项转为可结算后项目经理或商务提出开票；预收款等先于回签的开票由人工发起（INV-71 例外）
  stages:
  - VS-04.3
  primary_object: OBJ-83
  primary_object_note: 结局「已开具」是 VS-04.3 退出；开票申请 OBJ-82「已开票」是同一流程的前置单据
  secondary_objects:
  - OBJ-82
  owner_bc: B-08
  human_orchestration: true
  human_note: 开票申请由系统按规则自动准入（协议依据、可开票额度），命中金额阈值或关联方才转人工审批；驳回、撤回；税务平台开具结果
  migration: 历史开票申请与销项发票（含红字）全部迁入（U-4）；投产时审批中的申请不迁审批实例（ADR-0036 第 5 条），由迁入编排模块的一次性离线命令重新发起；已申请未开具的按当前状态迁入；历史预收例外（31 个合同）标例外
  scope: 按承担法人的数据范围：财务按法人经办，商务与项目经理仅见本项目
  segregation:
  - roles:
    - SH-E5
    - SH-E6
    rule: 开票申请提交人与开票经办不得为同一人
  - roles:
    - SH-E5
    - SH-E2
    rule: 开票申请提交人与审批人不得为同一人
  triggers:
  - type: event
    name: 付款条件项已可结算
    publisher: B-05
  - type: human
    name: 预收款、首付款等先于回签的开票由商务或项目经理发起（INV-71 例外）
  outcomes:
  - 已开具
  - 已驳回
  - 已作废
  - 已撤回
  - 暂挂待跨年处理
  scenarios:
  - PRC-57-S01
  - PRC-57-S02
  - PRC-57-S03
  - PRC-57-S04
  - PRC-57-S05
  - PRC-57-S06
  - PRC-57-S07
  - PRC-57-S08
  - PRC-57-S09
  - PRC-57-S10
  - PRC-57-S11
  - PRC-57-S12
  - PRC-57-S13
  - PRC-57-S14
  - PRC-57-S15
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 提交开票申请（预收、首付款先于回签的由其发起）
      approval_right: 无
      department_hint: 市场与商务部门
      position_hint: 商务经理
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 付款条件项可结算后提出开票
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 命中加审条件时作为项目责任人审批开票申请
      approval_right: 一级审批（责任人）
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 审批超时升级与特殊加审
      approval_right: 特殊加审时参与
      department_hint: 事业部或区域
      position_hint: 部门负责人、总经理
  - id: SH-E6
    as: approver
    org_needs:
      responsibility: 金额超第二阈值或关联方时加审
      approval_right: 加审审批权（财务负责人）
      department_hint: 财务部
      position_hint: 财务负责人
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 经税务平台开具销项发票、作废开票申请
      approval_right: 无审批权（经办）
      department_hint: 财务部
      position_hint: 开票会计
  - id: SH-R2
    as: external
    org_needs:
      responsibility: 税务平台开具并返回结果
      approval_right: 不适用
      department_hint: 税务机关
      position_hint: —
  steps:
  - actor: system
    where: automatic
    actor_v1: 商务
    read: true
    reads:
    - AGG-13
    - AGG-38
    desc: 读协议付款条件项与预收证据
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 付款条件项已可结算
    - mode: api
      direction: out
      bc: B-05
      name: 读付款条件项
    - mode: api
      direction: out
      bc: B-28
      name: 读预收证据
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 提交开票申请
    aggregate: AGG-45
    permission: 开票申请.提交
    page: 开票申请编辑页
    audit: true
    desc: 提交开票申请，附付款条件项与购买方；预收款、首付款先于回签的附委托函或中标通知书
    effort:
      typical_min: 15
      p90_min: 40
  - actor: system
    where: automatic
    actor_v1: 财务
    command: 准入开票申请
    aggregate: AGG-45
    emits:
    - InvoiceEligibilityConfirmed
    desc: 按规则自动准入：协议须已生效，预收或首付款类型附委托函或中标通知书可先于回签（P-1；INV-71；AR-04、AR-10 已规则化）；开票金额不超过付款条件项可开票额度（INV-21）；购买方为档案已核实的往来单位（P-3）；命中金额阈值或关联方交易才转人工审批（AR-01、AR-02、AR-07）
    rule: INV-71；RULE-407；RULE-411
    decision:
    - when: 协议未生效且无预收例外依据
      goto: 5
      rule: INV-71；RULE-407；RULE-411
      p: 0.04
    - when: 开票金额超过付款条件项可开票额度
      goto: 5
      rule: INV-21
      p: 0.01
    - when: 开票金额超过单据类型阈值，或购买方为关联方
      goto: 4
      rule: AR-01、AR-02、AR-07
      p: 0.2
    - when: otherwise
      goto: 6
      p: 0.75
    audit: true
  - actor: platform
    where: in_system
    actor_v1: 财务主管
    platform_task: true
    service: platform.approval
    command: 开票申请审批
    gap: G-02（已处理 F-2）
    approval:
      engine: platform.approval
      doc_type: 开票申请审批
      approver: cost_object_owner
      owner_object: 协议（合同负责人，待新题「合同负责人是谁」）
      why_human: 开票金额超阈值或购买方为关联方时，需要人判断开票内容与金额是否与交易实质相符、是否公允；协议依据与可开票额度已由准入规则守卫，不在审批中核对。
      escalation_rules:
      - AR-01
      - AR-02
      - AR-07
      - AR-11
      on_reject: 5
    withdraw:
      to: end
      outcome: 已撤回
    decision:
    - when: 审批通过
      goto: 6
      p: 0.9
    - when: 提交人撤回开票申请
      goto: end
      outcome: 已撤回
      p: 0.03
    - when: otherwise
      goto: 5
      p: 0.07
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起开票申请审批
    permission: 开票申请.审批
    page: 审批待办页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（待开票申请审批）
    effort:
      typical_min: 15
      p90_min: 45
    wait:
      typical_h: 16
      p90_h: 48
  - actor: system
    where: automatic
    actor_v1: 财务
    command: 驳回开票申请
    aggregate: AGG-45
    branch: 驳回
    emits:
    - 开票申请已驳回
    desc: 准入规则未过或审批驳回；提交人修正后另行重新申请
    decision:
    - when: otherwise
      goto: end
      outcome: 已驳回
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    notify:
    - to: SH-E5
      how: 企业微信消息（开票申请已驳回）
    audit: true
  - actor: SH-E6
    where: external:税务
    actor_v1: 财务
    command: 开具销项发票并改写 WIP
    aggregate: AGG-46
    also:
    - AGG-44
    c_exception: INV-73
    on_event:
    - aggregate: AGG-45
      event: InvoiceEligibilityConfirmed
    emits:
    - InvoiceIssued
    evidence:
    - 税务平台开具结果：发票号码、开票时间、电子发票文件
    - 平台应答报文摘要
    desc: 经税务平台开具；同事务改写开票额度；对外财报与增值税按开票，开票不触发收入确认（收入走 PRC-53），收入确认也不触发开票；期间已关账时只提示并落开放期间、标原期间（INV-92），不拒绝、不审批；可重试的平台故障自动重试并告警，不作废申请；业务拒绝退回申请人修改后重新提交（第 2 步），也不作废
    decision:
    - when: 税务平台暂时不可用或应答超时（可重试）
      goto: 6
      p: 0.02
    - when: 税务平台业务拒绝（购买方税号错误、开票信息不全等）
      goto: 2
      p: 0.01
    - when: 申请人或财务在开具前主动作废申请
      goto: 7
      p: 0.01
    - when: otherwise
      goto: 8
      p: 0.96
    period_gate: true
    legal_entity: 承担法人
    audit: true
    metric_event: true
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 经税务平台开具
    - mode: api
      direction: out
      bc: B-01
      name: 读购买方
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    permission: 销项发票.开具
    page: 销项发票开具页
    timeout:
      after: PT30M
      escalate_to: SH-E6
      interrupting: false
    notify:
    - to: SH-E5
      how: 企业微信消息（发票已开具）
    - to: SH-E6
      how: 企业微信消息（税务平台暂不可用，已排队重试并告警）
    effort:
      typical_min: 10
      p90_min: 30
    wait:
      typical_h: 0.1
      p90_h: 0.5
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 作废开票申请
    aggregate: AGG-45
    branch: 作废
    emits:
    - 开票申请已作废
    desc: 只发生在开具前（INV-71），由申请人或财务主动作废；平台故障与业务拒绝都不触发作废
    decision:
    - when: otherwise
      goto: end
    permission: 开票申请.作废
    page: 开票申请审核页
    outcome: 已作废
    audit: true
    effort:
      typical_min: 5
      p90_min: 10
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-46
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时由期间闸门路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 已开具
      p: 0.99
  notes: 本稿唯一的 C 类（INV-73，ADR-0016 决定 5）；P-07 付款条件到期未开票提醒。开票只改写开票额度与应收（PRC-59），不触发、也不依赖收入确认。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 30 份
- id: PRC-58
  name: 红冲销项发票
  trigger:
    type: human
    desc: 开票有误或业务取消，财务发起红冲
  stages:
  - VS-04.3
  primary_object: OBJ-83
  owner_bc: B-08
  human_orchestration: true
  migration: 历史红字发票及红字信息确认记录全部迁入（U-4）；投产时红字信息确认中的单据按税务平台当前状态迁入，等待期从原发起时间续算；审批中的红冲申请不迁审批实例，由迁入编排模块的一次性离线命令重新发起
  scope: 按承担法人的数据范围：仅财务经办
  triggers:
  - type: human
    name: 开票会计提交红冲申请（开票有误或业务取消）
  outcomes:
  - 已红冲
  - 红字确认已作废
  - 红冲被驳回
  - 已撤回
  - 暂挂待跨年处理
  scenarios:
  - PRC-58-S01
  - PRC-58-S02
  - PRC-58-S03
  - PRC-58-S04
  - PRC-58-S05
  - PRC-58-S06
  - PRC-58-S07
  - PRC-58-S08
  - PRC-58-S09
  - PRC-58-S10
  - PRC-58-S11
  - PRC-58-S12
  roles:
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 提交红冲申请，通过后发起红字信息确认并红冲发票
      approval_right: 无审批权（红冲须经下列责任人审批）
      department_hint: 财务部
      position_hint: 开票会计
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 作为协议所属项目的责任人审批红冲申请
      approval_right: 一级审批（责任人）
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E6
    as: approver
    org_needs:
      responsibility: 命中 AR-06 时加审：核对红冲是否影响已过账事实
      approval_right: 加审审批权（财务负责人）
      department_hint: 财务部
      position_hint: 财务负责人
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 审批超时升级；金额超第二阈值或关联方时特殊加审
      approval_right: 特殊加审时参与
      department_hint: 事业部或区域
      position_hint: 部门负责人、总经理
  - id: SH-C6d
    as: external
    org_needs:
      responsibility: 客户财务：付款、确认红字信息
      approval_right: 客户方财务确认（经税务平台或银行回单）
      department_hint: 客户方财务
      position_hint: 客户财务付款经办
  - id: SH-R2
    as: external
    org_needs:
      responsibility: 税务机关（经税务平台）
      approval_right: 不适用（外部监管）
      department_hint: 税务机关
      position_hint: —
  steps:
  - actor: platform
    where: in_system
    actor_v1: 财务
    platform_task: true
    service: platform.approval
    command: 红冲审批
    gap: 命令：平台任务「红冲审批」，红冲申请由开票会计经审批平台提交
    desc: 红冲是对已过账事实的冲销（AR-06）；审批通过后才发起红字信息确认
    approval:
      engine: platform.approval
      doc_type: 红冲申请审批单
      approver: cost_object_owner
      owner_object: 协议（合同负责人，待新题「合同负责人是谁」）
      why_human: 原发票是否确属错误、业务是否确已取消，需要项目责任人按业务事实判断；系统只能核对发票状态和是否已用途确认，不能判断红冲理由是否成立。
      escalation_rules:
      - AR-06
      - AR-07
      on_reject: end
    decision:
    - when: 审批通过
      goto: 2
      p: 0.93
    - when: 提交人撤回红冲申请
      goto: end
      outcome: 已撤回
      p: 0.02
    - when: otherwise
      goto: end
      outcome: 红冲被驳回
      p: 0.05
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起红冲申请审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 销项发票.红冲审批
    page: 审批待办页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信消息（红冲申请审批结果）
    - to: SH-E2
      how: 企业微信待办（待红冲申请审批）
    withdraw:
      to: end
      outcome: 已撤回
    effort:
      typical_min: 15
      p90_min: 40
    wait:
      typical_h: 16
      p90_h: 48
  - actor: SH-E6
    where: external:税务
    actor_v1: 财务
    command: 发起红字信息确认
    aggregate: AGG-46
    evidence:
    - 红字信息表确认单（税务平台状态、购买方确认时间）
    desc: 已用途确认或入账的蓝字发票红冲前须对方确认；未用途确认或入账的无需对方确认（待用户定 7）
    decision:
    - when: 蓝字发票尚未用途确认或入账
      goto: 3
      p: 0.45
    - when: 购买方在 72 小时内未确认，税务平台自动作废
      goto: end
      outcome: 红字确认已作废
      p: 0.07
    - when: 财务撤销红字信息确认
      goto: end
      outcome: 已撤回
      p: 0.02
    - when: otherwise
      goto: 3
      p: 0.46
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 发起红字信息确认
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    timeout:
      after: PT72H
      escalate_to: SH-E6
      interrupting: false
    permission: 销项发票.发起红字确认
    page: 红字信息确认页
    audit: true
    withdraw:
      to: end
      outcome: 已撤回
    gap: 撤回路径命令缺口：AGG-46 无「撤销红字信息确认」命令（税务平台一侧可撤销），见 NOTES 新用语·命令缺口
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 72
  - actor: SH-E6
    where: external:税务
    actor_v1: 财务
    command: 红冲发票
    aggregate: AGG-46
    emits:
    - 发票已红冲
    evidence:
    - 税务平台红字发票开具结果：红字发票号码、开具时间、电子发票文件
    desc: 蓝字不得作废，更正走红字（INV-72）；红冲只回冲开票额度，不触发也不冲减收入；期间已关账时只提示并落开放期间、标原期间（INV-92），不拒绝、不审批；红冲后 B-09 订阅「发票已红冲」冲减应收（PRC-150，H7）
    period_gate: true
    legal_entity: 承担法人
    audit: true
    metric_event: true
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 经税务平台红冲
    - mode: event
      direction: out
      bc: B-09
      name: 发票已红冲
    permission: 销项发票.红冲
    page: 销项发票红冲页
    effort:
      typical_min: 10
      p90_min: 30
    wait:
      typical_h: 0.1
      p90_h: 0.5
    notify:
    - to: SH-E6
      how: 企业微信消息（红冲已完成，发票已红冲事件由 PRC-150 冲减应收）
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 回冲开票额度
    aggregate: AGG-44
    gap: G-08
    rule: INV-73
    desc: INV-73 只写开票接受与作废同事务，红冲是否同事务未写；本稿按两次事务写
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-46
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 已红冲
      p: 0.99
  notes: 蓝字不得作废，更正走红字（INV-72）；对方确认红字信息的 72 小时自动作废在税务平台一侧，聚合稿无对应命令，按非人工编排。收尾评审 H6：红冲申请经审批平台审批（AR-06）后才发起红字确认；H7：订阅方 B-09 的反应见事件策略 PRC-150。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 3 份
  human_note: 红冲申请须经审批（命中 AR-06，异常加一级）；通过后发起红字信息确认、红冲
  segregation:
  - roles:
    - SH-E6
    - SH-E2
    rule: 红冲申请人（开票会计）与审批人不得为同一人；红冲经办与申请人不得为同一人
  stages_note: 判据①的逆向：红冲撤销 VS-04.3 退出状态（销项发票「已开具」→「已红冲」，OBJ-83），开票段因此重入；「已红冲」是同一对象在本段的状态，不属其他段
- id: PRC-60
  name: 认领收款并核销应收
  trigger:
    type: human
    desc: 出纳每日认领到账流水
  stages:
  - VS-04.4
  primary_object: OBJ-85
  primary_object_note: 结局「已核销」使往来款项「已结清」（VS-04.4 退出）；资金收付 OBJ-86「已分配」是同一流程的认领步骤
  secondary_objects:
  - OBJ-86
  owner_bc: B-09
  human_orchestration: true
  migration: 历史收款、分配行与核销记录全部迁入（U-4）；投产时待认领的流水按当前状态迁入，已部分核销的应收带已核销额迁入
  scope: 按承担法人与资金账户的数据范围：出纳按所管账户经办
  segregation:
  - roles:
    - SH-E6
    rule: 认领收款与登记银行流水不得为同一人（职务分离，具体岗位待用户定）
  - roles:
    - SH-E6
    - SH-E2
    rule: 第三方代付认领的经办与审批人不得为同一人
  triggers:
  - type: human
    name: 出纳每日认领到账流水
  outcomes:
  - 已核销
  - 待认领
  - 认领被拒
  - 已收票待兑付
  - 待退回
  - 暂挂待跨年处理
  scenarios:
  - PRC-60-S01
  - PRC-60-S02
  - PRC-60-S03
  - PRC-60-S04
  - PRC-60-S05
  - PRC-60-S06
  - PRC-60-S07
  - PRC-60-S08
  - PRC-60-S09
  - PRC-60-S10
  - PRC-60-S11
  - PRC-60-S12
  - PRC-60-S13
  roles:
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 每日认领到账流水、核销应收、记分配
      approval_right: 无审批权（经办；认领与流水登记职务分离）
      department_hint: 财务部
      position_hint: 出纳
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 作为应收所属项目的责任人审批第三方代付认领
      approval_right: 一级审批（责任人）；AR-15 命中后财务负责人、总经理加审
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 待认领超期与审批超时的升级；AR-15 特殊加审
      approval_right: 特殊加审时参与
      department_hint: 事业部或区域
      position_hint: 部门负责人、总经理
  - id: SH-C6d
    as: external
    org_needs:
      responsibility: 客户财务：付款、确认红字信息
      approval_right: 客户方财务确认（经税务平台或银行回单）
      department_hint: 客户方财务
      position_hint: 客户财务付款经办
  steps:
  - actor: system
    where: external:银行
    actor_v1: 出纳
    read: true
    reads:
    - AGG-88
    - AGG-87
    evidence:
    - 银行到账流水（经资金账户模块导入的银行回单行）
    desc: 读流水行与资金账户
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 读资金账户与流水行
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 收款认领
    aggregate: AGG-50
    emits:
    - CashReceived
    desc: 付款方须为合同相对方或其登记账户（AR-09，RULE-410）；收款方式含商业汇票（带到期日，收票时尚未到账，到期兑付见 PRC-63）
    decision:
    - when: 流水行无法对应任何应收
      goto: 7
      p: 0.06
    - when: 付款方不是合同相对方且无委托付款函
      goto: end
      rule: AR-09；RULE-410
      outcome: 认领被拒
      p: 0.01
    - when: 付款方不是合同相对方，附委托付款函（第三方代付）
      goto: 3
      rule: AR-15
      p: 0.02
    - when: 收款方式为商业汇票（收票，尚未到账）
      goto: end
      outcome: 已收票待兑付
      p: 0.03
    - when: otherwise
      goto: 4
      p: 0.88
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读付款方
    permission: 收款.认领
    page: 收款认领页
    audit: true
    metric_event: true
    effort:
      typical_min: 5
      p90_min: 15
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    branch: 第三方代付
    command: 第三方代付认领审批
    gap: 命令：平台任务「第三方代付认领审批」
    desc: 业主委托代付、财政直付等第三方付款，须附委托付款函并经审批（AR-15）；无函的在第 2 步已拒绝
    approval:
      engine: platform.approval
      doc_type: 第三方代付认领审批单
      approver: cost_object_owner
      owner_object: 应收所属项目
      why_human: 须判断代付关系的真实性与合规（委托付款函是否由合同相对方出具、代付方与合同相对方的关系）；系统只能核对函件是否存在。
      escalation_rules:
      - AR-15
      on_reject: end
    decision:
    - when: 审批通过
      goto: 4
      p: 0.9
    - when: otherwise
      goto: end
      outcome: 认领被拒
      p: 0.1
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起第三方代付认领审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 收款.第三方代付审批
    page: 审批待办页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（待第三方代付认领审批）
    effort:
      typical_min: 15
      p90_min: 45
    wait:
      typical_h: 16
      p90_h: 48
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 在应收上核销占用
    aggregate: AGG-49
    emits:
    - 应收已结清
    rule: INV-77
    desc: 核销合计不超过未结余额（INV-77）；结清时发事件；期间已关账时提示并落开放期间、标原期间（INV-92），不拒绝；到账大于全部应收未结余额的超收部分，在下一步记为预收或待退，不核销
    decision:
    - when: 到账金额大于该笔应收未结余额，还有其他应收可核销
      goto: 4
      p: 0.15
    - when: otherwise
      goto: 5
      p: 0.85
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    period_gate: true
    legal_entity: 承担法人
    permission: 应收.核销
    page: 应收核销页
    audit: true
    effort:
      typical_min: 5
      p90_min: 15
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 记分配行与流水行
    aggregate: AGG-50
    emits:
    - 收款已分配
    rule: INV-78
    desc: 分配合计等于到账金额（INV-78）；超收部分记为预收或待退，通知财务（分配行类型见 data-model 补丁）
    permission: 收款.分配
    page: 收款分配页
    audit: true
    effort:
      typical_min: 3
      p90_min: 10
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-50
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 已核销
      p: 0.99
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 处置待认领流水
    aggregate: AGG-50
    branch: 待认领
    gap: 新用语：命令「处置待认领流水」（待认领挂账超期的转其他应付或退回；聚合稿 AGG-50 无对应命令）
    desc: 联系付款方确认对应应收；确认无归属的转其他应付或退回付款方（退回经 B-10 付款）；挂账超期升级
    decision:
    - when: 联系到付款方并确认对应应收
      goto: 2
      p: 0.5
    - when: 确认为误付或无归属，需退回付款方
      goto: end
      outcome: 待退回
      p: 0.2
    - when: otherwise
      goto: end
      outcome: 待认领
      p: 0.3
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 发起退款付款
    permission: 收款.处置待认领
    page: 待认领流水处置页
    audit: true
    timeout:
      after: P30D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（待认领流水挂账超期）
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 72
      p90_h: 720
  notes: 额度占用，不新增 C 类；收款作废时释放占用。收款只核销应收，不触发、也不确认收入（收入走 PRC-53）。收尾评审 M5：补第三方代付（须委托付款函，AR-15 加审）、超收转预收或待退、待认领挂账超期跟进、收到商票登记的出口；商票到期兑付见 PRC-63。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 40 笔
  human_note: 第三方代付须有委托付款函并经加审（AR-15）；其余出纳认领核销
  stages_note: 判据：核销应收使往来款项（OBJ-85）到「已结清」、记收款分配（OBJ-86 已分配），是 VS-04.4 退出。字面误判：匹到的 VS-05.5、VS-08.1、VS-08.3、VS-13.5 是应付、员工借款、报销、薪酬类型，本流程是销售应收
- id: PRC-61
  name: 检测并催收逾期应收款项
  trigger:
    type: time
    desc: 每日定时检测账龄与到期
  stages:
  - VS-04.4
  primary_object: OBJ-85
  owner_bc: B-09
  human_orchestration: true
  migration: 历史逾期、争议处置与坏账核销记录全部迁入（U-4）；投产时处于争议中的应收带处置分类迁入，账龄从原到期日续算；审批中的坏账核销不迁审批实例，由迁入编排模块的一次性离线命令重新发起
  scope: 按承担法人的数据范围：财务按法人经办，项目经理仅见本项目应收
  triggers:
  - type: time
    name: 每日定时检测应收账龄与到期
  outcomes:
  - 无逾期
  - 已登记处置
  - 坏账已核销
  - 坏账核销被驳回
  - 暂挂待跨年处理
  scenarios:
  - PRC-61-S01
  - PRC-61-S02
  - PRC-61-S03
  - PRC-61-S04
  - PRC-61-S05
  - PRC-61-S06
  - PRC-61-S07
  - PRC-61-S08
  - PRC-61-S09
  - PRC-61-S10
  - PRC-61-S11
  roles:
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 登记争议与处置分类、核销坏账
      approval_right: 无审批权（经办；核销坏账须经责任人审批）
      department_hint: 财务部
      position_hint: 应收会计、财务主管
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 作为协议所属项目的责任人审批坏账核销（可回收性判断）
      approval_right: 一级审批（责任人）；金额超阈值时财务负责人、总经理加审
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E2
    as: informed
    org_needs:
      responsibility: 收到逾期提醒，协助催收
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 处置登记与坏账核销审批超时的升级知会
      approval_right: 无
      department_hint: 事业部或区域
      position_hint: 部门负责人
  - id: SH-C6d
    as: informed
    org_needs:
      responsibility: 客户财务：付款、确认红字信息
      approval_right: 客户方财务确认（经税务平台或银行回单）
      department_hint: 客户方财务
      position_hint: 客户财务付款经办
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 检测应收逾期
    aggregate: AGG-49
    emits:
    - ArOverdueDetected
    decision:
    - when: 无逾期应收
      goto: end
      outcome: 无逾期
      p: 0.7
    - when: otherwise
      goto: 2
      p: 0.3
    metric_event: true
    notify:
    - to: SH-E2
      how: 企业微信待办（应收逾期，请协助催收）
    - to: SH-E6
      how: 企业微信待办（应收逾期）
    desc: 每日检测账龄与到期，逾期则经平台通知责任项目经理与财务（催收动作本身由财务线下进行；通知用 notify，不单列步骤，M11）
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 登记争议与处置分类
    aggregate: AGG-49
    desc: 取值只确认「诉讼」，其余待用户定
    decision:
    - when: 确认款项无法收回
      goto: 3
      p: 0.05
    - when: otherwise
      goto: end
      outcome: 已登记处置
      p: 0.95
    permission: 应收.登记争议处置
    page: 应收争议处置页
    audit: true
    timeout:
      after: P30D
      escalate_to: SH-M1
      interrupting: false
    effort:
      typical_min: 30
      p90_min: 120
    wait:
      typical_h: 72
      p90_h: 720
  - actor: platform
    where: in_system
    actor_v1: 财务主管
    platform_task: true
    service: platform.approval
    command: 坏账核销审批
    gap: 命令：平台任务「坏账核销审批」；APPROVAL_RULES 建议补「坏账核销」条目（NOTES 待用户定）
    desc: 核销坏账前须审批；通过后才执行核销
    approval:
      engine: platform.approval
      doc_type: 坏账核销审批单
      approver: cost_object_owner
      owner_object: 协议（合同负责人，待新题「合同负责人是谁」）
      why_human: 款项是否确已无法收回（可回收性）需要人结合催收记录、对方经营与诉讼状态判断，系统只能算账龄；核销一经过账不可逆。
      escalation_rules:
      - AR-06
      - AR-07
      on_reject: end
    decision:
    - when: 审批通过
      goto: 4
      p: 0.9
    - when: 提交人撤回核销申请
      goto: end
      outcome: 已登记处置
      p: 0.02
    - when: otherwise
      goto: end
      outcome: 坏账核销被驳回
      p: 0.08
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起坏账核销审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 应收.坏账核销审批
    page: 审批待办页
    audit: true
    timeout:
      after: P5D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信消息（坏账核销审批结果）
    - to: SH-E2
      how: 企业微信待办（待坏账核销审批）
    withdraw:
      to: end
      outcome: 已登记处置
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 96
  - actor: SH-E6
    where: in_system
    actor_v1: 财务主管
    command: 核销坏账
    aggregate: AGG-49
    emits:
    - ArWrittenOff
    period_gate: true
    legal_entity: 承担法人
    permission: 应收.核销坏账
    page: 坏账核销页
    audit: true
    metric_event: true
    desc: 审批通过后执行核销；期间已关账时提示并落开放期间、标原期间（INV-92），不拒绝
    effort:
      typical_min: 20
      p90_min: 60
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 坏账已核销
      p: 0.99
  notes: P-36 账龄、逾期；「核销」与状态「已核销（坏账）」重名，已交 one-glossary。收尾评审 H6：核销坏账须经审批平台审批（可回收性判断，责任人单级，金额超阈值加审），职务分离；M11：催收改 notify。
  frequency_ref: 待取证（E-B1）；经验估计：每日检测，每月约 20 笔进入处置
  human_note: 核销坏账须审批（可回收性判断），其余为系统检测与财务登记
  segregation:
  - roles:
    - SH-E6
    - SH-E2
    rule: 登记争议处置的人、核销坏账经办与审批人三者不得为同一人（审批人为协议所属项目的责任人）
  stages_note: 判据：检测逾期、核销坏账使 OBJ-85 到「已核销（坏账）」，是 VS-04.4 退出的第二路。字面误判：匹到的 VS-05.4、VS-05.5、VS-08.1、VS-08.3、VS-13.5 是应付、员工借款、报销、薪酬类型
- id: PRC-63
  name: 商业汇票兑付与逾期
  trigger:
    type: time
    desc: 商票到期日
  stages:
  - VS-04.4
  primary_object: OBJ-85
  owner_bc: B-09
  human_orchestration: false
  migration: 历史商票的到期日、兑付与逾期状态全部迁入（U-4）；投产时未到期与已逾期未兑付的商票按当前状态迁入，占用与应收状态一并迁入
  scope: 按承担法人与资金账户的数据范围
  triggers:
  - type: time
    name: 商票到期日
  outcomes:
  - 已兑付
  - 商票已逾期
  - 商票已贴现或背书转让
  - 暂挂待跨年处理
  scenarios:
  - PRC-63-S01
  - PRC-63-S02
  - PRC-63-S03
  - PRC-63-S04
  - PRC-63-S05
  - PRC-63-S06
  roles:
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 登记商票兑付，到期未兑付标逾期
      approval_right: 无
      department_hint: 财务部
      position_hint: 出纳
  - id: SH-C6d
    as: external
    org_needs:
      responsibility: 客户财务：付款、确认红字信息
      approval_right: 客户方财务确认（经税务平台或银行回单）
      department_hint: 客户方财务
      position_hint: 客户财务付款经办
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 商票到期未登记的升级知会
      approval_right: 无
      department_hint: 事业部或区域
      position_hint: 财务负责人的上级（总经理）
  steps:
  - actor: SH-E6
    where: external:银行
    actor_v1: 出纳
    command: 登记商票兑付
    aggregate: AGG-50
    evidence:
    - 银行到账回单或承兑人兑付通知
    - 兑付日与金额
    desc: 过账时点取收票或兑付、是否算回款待财务口径（AGG-50 待定 a、b、c）；期间已关账时提示并落开放期间、标原期间（INV-92），不拒绝；地产客户常见的贴现、背书转让：到期前已处置的不再等兑付，转让或贴现后的会计处理见 NOTES 待用户定（命令缺口）；到期提醒升级给财务负责人上级，不再升级给本人（低 5）
    decision:
    - when: 到期日已过仍未收到兑付款
      goto: 2
      p: 0.05
    - when: 到期前已贴现或背书转让（商票不再由本公司持有）
      goto: end
      outcome: 商票已贴现或背书转让
      p: 0.03
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 已兑付
      p: 0.91
    period_gate: true
    legal_entity: 承担法人
    permission: 收款.登记商票兑付
    page: 商票兑付登记页
    audit: true
    timeout:
      after: 商票到期日
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（商票到期）
    effort:
      typical_min: 10
      p90_min: 30
    wait:
      typical_h: 2
      p90_h: 24
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 标记商票已逾期
    aggregate: AGG-50
    branch: 逾期
    emits:
    - 商票已逾期
    metric_event: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 释放占用、恢复应收
    aggregate: AGG-49
    branch: 逾期
    on_event:
    - aggregate: AGG-50
      event: 商票已逾期
    desc: 订阅商票已逾期，同 BC 事件，不跨聚合事务
    outcome: 商票已逾期
  notes: 过账时点、是否算回款待财务口径（AGG-50 待定 a、b、c）。收尾评审低 5：超时升级不再给本人；补贴现与背书转让出口。收到商票的登记见 PRC-60 第 2 步。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 3 张
  stages_note: 判据：商票逾期时释放占用、恢复应收，使应收回到「未结」，是 VS-04.4 进入条件（重入）。字面误判：VS-05.4 退出的「未结」限应付方向
- id: PRC-66
  name: 确认最终价款并结算协议
  trigger:
    type: human
    desc: 商务在最后一份成果认可或项目结项后发起结算；与累计确认是否等于分摊价格脱钩，累计确认只作前置提示
  stages:
  - VS-04.5
  - VS-04.6
  primary_object: OBJ-05
  owner_bc: B-08
  human_orchestration: true
  merged_from:
  - PRC-67
  migration: 历史结算书、最终价款与协议已结算状态全部迁入（U-4）；投产时已完成未结算的协议按当前状态迁入，结算书编制中的按草稿迁入，让价审批中的不迁审批实例，由迁入编排模块的一次性离线命令重新发起
  scope: 按承担法人与项目承担部门的数据范围：商务经办结算，财务只读
  triggers:
  - type: human
    name: 商务在最后一份成果认可或项目结项后发起结算
  outcomes:
  - 协议已结算
  - 转索赔
  - 转争议处理
  - 已撤回
  scenarios:
  - PRC-66-S01
  - PRC-66-S02
  - PRC-66-S03
  - PRC-66-S04
  - PRC-66-S05
  - PRC-66-S06
  - PRC-66-S07
  - PRC-66-S08
  - PRC-66-S09
  - PRC-66-S10
  - PRC-66-S11
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 发起结算、编制结算书、与对方确认最终价款、结算协议
      approval_right: 无
      department_hint: 市场与商务部门
      position_hint: 商务经理（合同管理岗）
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 作为协议所属项目的责任人审批最终价款低于协议价的让价或审减
      approval_right: 一级审批（责任人）；AR-01、AR-02 命中时财务负责人、总经理加审
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 结算确认超期与审批超时的升级知会
      approval_right: 无
      department_hint: 事业部或区域
      position_hint: 部门负责人
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 客户方项目或设计管理负责人：签认、答复
      approval_right: 客户方书面认可（线下证据，本系统只登记）
      department_hint: 客户方
      position_hint: 客户项目或设计管理负责人
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-44
    desc: 读履约义务累计确认与分摊价格作前置提示：累计确认未达分摊价格时提示商务（范围减少、审定价低于合同价都是常见情形），不作为门槛（H3）
    notify:
    - to: SH-E5
      how: 企业微信消息（累计确认未达分摊价格的提示，仅供参考）
  - actor: SH-E5
    where: in_system
    bc: B-08
    actor_v1: 商务
    command: 完成协议
    aggregate: AGG-13
    emits:
    - 协议已完成
    gap: G-07
    desc: 商务发起结算；B-08 页面下的编排调用上游命令，携带 B-08 依据（下游调上游，边已有）
    cross_bc:
    - mode: api
      direction: out
      bc: B-05
      name: 完成协议
    permission: 协议结算.发起
    page: 协议结算发起页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
  - actor: SH-E5
    where: in_system
    bc: B-05
    actor_v1: 商务
    on_event:
    - aggregate: AGG-13
      event: 协议已完成
    command: 编制结算书
    aggregate: AGG-13
    gap: G-16
    desc: B-05 内结算流程订阅协议已完成（⑥a 评审 H4）
    permission: 协议结算.编制
    page: 协议结算书编制页
    audit: true
    effort:
      typical_min: 120
      p90_min: 480
  - actor: SH-E5
    where: offline
    bc: B-05
    actor_v1: 商务
    command: 确认最终价款
    aggregate: AGG-13
    gap: G-16
    evidence:
    - 双方签认的结算书扫描件
    - 签认日与签认人（发包人代表或授权人）
    desc: 双方确认；最终价款低于协议价的先走让价审批；未能确认的不再死等：修订再谈、转索赔（PRC-49）或转争议处理
    decision:
    - when: 未能确认，修订结算书后再谈
      goto: 3
      p: 0.12
    - when: 未能确认，转索赔
      goto: PRC-49
      outcome: 转索赔
      p: 0.03
    - when: 未能确认，转争议处理（诉讼或仲裁另行办理）
      goto: end
      outcome: 转争议处理
      p: 0.02
    - when: 最终价款低于协议价
      goto: 5
      p: 0.23
    - when: otherwise
      goto: 6
      p: 0.6
    permission: 协议结算.确认最终价款
    page: 最终价款确认登记页
