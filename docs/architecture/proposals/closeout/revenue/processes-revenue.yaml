  primary_object: OBJ-41
  owner_bc: B-04
  human_orchestration: true
  human_note: 5 天内通知、10 天内提交说明，发包人 5 天未答复视为批准
  migration: 全部历史延期申请（通知、说明、答复、视为批准及证据原件）迁入（U-4）；投产时处于通知后待说明、说明后待答复的按当前状态迁入，期限从原通知日、说明送达日续算
  scope: 按项目的数据范围：项目经理经办，项目总监可见
