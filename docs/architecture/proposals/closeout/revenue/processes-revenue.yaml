      p90_min: 30
    calls: PRC-33
    permission: 延期申请.登记拒绝
    page: 延期答复登记页
    audit: true
    outcome: 已拒绝
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 登记延期视为批准
    aggregate: AGG-31
    branch: 超时
    emits:
    - 延期已视为批准
    desc: 合同约定的答复期满仍无书面答复，定时命令登记视为批准，按延期申请 ID 幂等；这是延期的合同约定，与交付物视为同意（归 B-08，ADR-0049）不同，不合并
    decision:
    - when: otherwise
      goto: end
    audit: true
    metric_event: true
    outcome: 视为批准
    notify:
    - to: SH-E2
      how: 企业微信消息（发包人答复期满，延期按合同视为批准）
  - command: 撤回延期通知
    aggregate: AGG-31
    actor: SH-E2
    where: in_system
    added_in: closeout
    permission: 延期申请.撤回
    page: 延期申请页
    audit: true
    effort:
      typical_min: 5
      p90_min: 15
    desc: S-37：延期通知发出后线下撤销的，登记撤销原因与依据，只追加撤销记录、不删原记录
    decision:
    - when: otherwise
      goto: end
      outcome: 已撤回
  notes: P-25 期限临近提醒；合同侧协议变更、索赔引用延期申请。AGG-31 没有 platform.approval 依赖，发包人答复是外部方答复，只登记证据。
  stages_note: 贯穿 VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6：判据：延期申请（OBJ-41）「已批准 / 已拒绝 / 视为批准」是 VS-02 贯穿活动「变更、延期与风险」的产出，结局用语与之一致，未匹到只因无对象名
- id: PRC-34
  name: 处置我方成果不符合项
  trigger:
    type: human
    desc: 评审、检查或客户反馈发现我方成果问题
  stages:
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.6
  - VS-02.7
  primary_object: OBJ-38
  owner_bc: B-28
  human_orchestration: false
  migration: 全部历史我方成果不符合项（含等级、部位、处置结论、让步接受的客户书面确认、返工认定）迁入（U-4）；投产时未关闭的按当前状态迁入，责任方与部位按迁入后的往来单位、建设工程映射
  scope: 按项目的数据范围：设计师、技术专家、项目经理可见并经办；返工认定供工时读取
  segregation:
  - roles:
    - SH-E3
    - SH-E4
    rule: 不符合项的登记人与关闭确认人不得为同一人
  frequency_ref: 待取证 E-B1（经验估计：评审与检查常有发现，每个项目数条至数十条）
  triggers:
  - type: human
    name: 评审、检查或客户反馈发现我方成果问题，设计师登记
  outcomes:
  - 不符合项已关闭
  scenarios:
  - PRC-34-S01
  - PRC-34-S02
  - PRC-34-S03
  - PRC-34-S04
  - PRC-34-S05
  - PRC-34-S06
  - PRC-34-S07
  - PRC-34-S08
  roles:
  - id: SH-E3
    as: initiator
    org_needs:
      responsibility: 按工作包编制成果、采集证据、记工时
      approval_right: 无
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  - id: SH-E4
    as: reviewer
    org_needs:
      responsibility: 确认不符合项等级、认定返工、复核整改并关闭
      approval_right: 不符合项确认与关闭（专业复核）
      department_hint: 技术委员会或总工办
      position_hint: 技术专家、专业负责人、审核人
  - id: SH-E2
    as: performer
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 客户方项目或设计管理，出具书面认可、批准与答复
      approval_right: 无（外部方）
      department_hint: 客户方设计或项目管理部门（外部）
      position_hint: 客户项目负责人、发包人代表（外部）
  steps:
  - actor: SH-E3
    where: in_system
    actor_v1: 设计师和顾问
    command: 登记不符合项
    aggregate: AGG-28
    desc: 记来源（交付物或检查）、等级、部位与整改责任方；类型为我方成果
    effort:
      typical_min: 15
      p90_min: 45
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 整改责任方与部位
    permission: 不符合项.登记
    page: 不符合项登记页
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 确认不符合项
    aggregate: AGG-28
    emits:
    - 不符合项已确认
    desc: 确认等级与是否阻断；阻断性不符合项未关闭，交付物不得登记认可（INV-48）
    decision:
    - when: 不符合项造成返工
      goto: 3
      p: 0.25
    - when: 客户书面确认让步接受
      goto: 5
      rule: INV-49
      p: 0.1
    - when: otherwise
      goto: 6
      p: 0.65
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 72
    permission: 不符合项.确认
    page: 不符合项确认页
    audit: true
    timeout:
      after: 按等级体系版本配置的处置期限（暂无默认，待用户定）
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-M1
      how: 企业微信消息（不符合项处置超期，P-23 提醒）
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 认定返工
    aggregate: AGG-29
    branch: 返工
    emits:
    - 返工已认定
    desc: 返工工时只能由返工认定产生（INV-53）；原因分类与设计变更归因共用一套语言
    decision:
    - when: 返工认定被撤销
      goto: 4
      p: 0.05
    - when: otherwise
      goto: 6
      p: 0.95
    effort:
      typical_min: 30
      p90_min: 90
    cross_bc:
    - mode: api
      direction: in
      bc: B-06
      name: 工时读取返工认定
    permission: 返工认定.认定
    page: 返工认定页
    audit: true
    metric_event: true
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 撤销返工认定
    aggregate: AGG-29
    branch: 撤销
    emits:
    - 返工认定已撤销
    desc: 须写原因；已按该认定记入的返工工时保留，分类由工时侧认定（PRC-91）调整
    decision:
    - when: otherwise
      goto: 6
    effort:
      typical_min: 15
      p90_min: 30
    permission: 返工认定.撤销
    page: 返工认定页
    audit: true
  - actor: SH-E2
    where: offline
    evidence:
    - 客户书面确认让步接受的材料（确认函、签认单或邮件原始报文之一）
    - 确认日与确认人（须为合同登记的发包人代表或授权人）
    actor_v1: 项目经理
    command: 让步接受不符合项
    aggregate: AGG-28
    branch: 让步
    desc: 须客户书面确认（INV-49），无书面确认的让步被拒
    decision:
    - when: otherwise
      goto: 6
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 48
      p90_h: 120
    calls: PRC-33
    permission: 不符合项.让步接受
    page: 不符合项让步登记页
    audit: true
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 关闭不符合项
    aggregate: AGG-28
    emits:
    - 不符合项已关闭
    desc: 整改（含返工）完成、复核通过或让步接受后关闭
    decision:
    - when: 整改（含返工）复核未通过
      goto: 2
      p: 0.1
    - when: otherwise
      goto: end
      p: 0.9
      outcome: 不符合项已关闭
    approval:
      engine: aggregate
      doc_type: 不符合项关闭
      approver: SH-E4
      multi_level: false
      on_reject: 2
      why_human: 整改（含返工）是否确已消除问题，是专业复核，系统只能核对状态；聚合内专业复核，不是费用审批
    effort:
      typical_min: 15
      p90_min: 45
    permission: 不符合项.关闭
    page: 不符合项关闭页
    audit: true
    metric_event: true
    outcome: 已关闭
  notes: 客户反馈的成果问题归本流程，过程问题归项目风险与问题（Q-E）。我方成果类不符合项未关闭只在阶段门预警（VS-02.6 出口）。
  stages_note: '判据①：关闭我方成果类不符合项使 OBJ-38 到「关闭」，是 VS-02.6 退出；VS-02.7 保留收尾回访发现的成果问题处置（VS-02 贯穿活动「变更、延期与风险」），不作门。不加 VS-03.2：该段 OBJ-38「已识别」明确限客户资产类，本流程为我方成果类。 R1-D-04：VS-02.2–VS-02.4 的 PRC-28 内审发现我方成果不符合项后，同样由本流程确认、处置整改并关联复审结果，作为各阶段段内办理；不新增阶段门。原文仅列 VS-02.6 / VS-02.7 的限制由本补充取代。'
- id: PRC-36
  name: 结项并归档项目
  trigger:
    type: human
    desc: 项目经理收尾，结项前封存已发布交付物并发起结项检查
  stages:
  - VS-02.7
  primary_object: OBJ-29
  primary_object_note: 结局「已归档」是项目 VS-02.7 退出；交付物、证据的「已封存」是同一编排的前置步骤
  secondary_objects:
  - OBJ-35
  - OBJ-53
  owner_bc: B-29
  human_orchestration: true
  human_note: 结项审批；审批通过前任一拒绝项不满足即退回
  merged_from:
  - PRC-39
  - PRC-40
  migration: 已结项、已归档项目只迁结局与历史结项检查单快照（U-3、U-4）；投产时处于收尾、已发起结项检查或结项审批中的项目按当前状态迁入，审批中的以新审批实例重新提交；封存范围与哈希随交付物、证据迁入
  scope: 按项目的数据范围：项目经理经办，项目总监审批，财务知会；检查单读多个 BC 的数据，查看限项目管理层与财务
  segregation:
  - roles:
    - SH-E2
    - SH-M1
    rule: 结项申请人与审批人不得为同一人
  frequency_ref: 待取证 E-B1（经验估计：与项目结项数同量级，月均数个至十余个）
  triggers:
  - type: human
    name: 项目经理收尾，封存已发布交付物与证据并发起结项
  outcomes:
  - 已归档
  - 检查未通过
  - 已撤回
  scenarios:
  - PRC-36-S01
  - PRC-36-S02
  - PRC-36-S03
  - PRC-36-S04
  - PRC-36-S05
  - PRC-36-S06
  - PRC-36-S07
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 结项申请由项目经理负责（A）；项目经理本人提交时由其汇报线上级代批（AR-11，intent 164324）
      approval_right: 上级代批结项申请（AR-11），一级
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-E6
    as: informed
    org_needs:
      responsibility: 知会结项以便核对收入与清算
      approval_right: 无
      department_hint: 财务部
      position_hint: 财务经理、会计
  steps:
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 封存交付物
    aggregate: AGG-27
    emits:
    - 交付物已封存
    desc: 已发布成果封存，范围与整包哈希入封存记录；B-29 经 api 调 B-28 的命令（INV-40 第三项要求已封存）
    effort:
      typical_min: 30
      p90_min: 90
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 封存交付物
    permission: 交付物.封存
    page: 交付物封存页
    audit: true
  - actor: SH-E2
    where: in_system
    command: 封存证据
    aggregate: AGG-38
    added_in: closeout
    emits:
    - 证据已封存
    desc: 项目下证据封存后不可修改或删除（INV-58）；B-29 经 api 调 B-28 的命令
    effort:
      typical_min: 20
      p90_min: 60
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 封存证据
    calls: PRC-33
    permission: 证据.封存
    page: 证据封存页
    audit: true
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 发起结项检查
    desc: 无状态，返回检查结果；检查单快照经 platform.audit 留痕
    effort:
      typical_min: 5
      p90_min: 15
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 结项检查.发起
    page: 结项检查页
    audit: true
  - actor: system
    where: automatic
    actor_v1: 项目经理
    read: true
    reads:
    - AGG-27
    - AGG-38
    - AGG-44
    - AGG-55
    - AGG-39
    - AGG-13
    - AGG-17
    desc: 拒绝项 3 条（一、已认可成果均被收入确认行引用为证据或已登记不确认收入的结论，结论载体随 Q20；二、供方协议均已结算或已终止或已登记结算结论；三、已发布交付物与证据均已封存）；预警项 2 条（工时单未全部审批或退回未处理；无生效协议且无风险交付授权，P-16），预警只留痕不拦截
    decision:
    - when: 三项拒绝检查均满足
      goto: 5
      rule: INV-40
      p: 0.75
    - when: otherwise
      goto: end
      rule: INV-40
      p: 0.25
      outcome: 检查未通过
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 读已认可与已封存交付物、证据
    - mode: api
      direction: out
      bc: B-08
      name: 读收入确认行与结论
    - mode: api
      direction: out
      bc: B-11
      name: 读供方协议状态
    - mode: api
      direction: out
      bc: B-06
      name: 读工时单审批状态
    - mode: api
      direction: out
      bc: B-05
      name: 读协议与风险交付授权
    - mode: api
      direction: out
      bc: platform.audit
      name: 结项检查单留痕
    audit: true
    outcome: 检查未通过
    notify:
    - to: SH-E2
      how: 企业微信消息（结项检查结果，含未满足的拒绝项与预警项）
  - actor: platform
    where: in_system
    actor_v1: 项目经理
    command: 提交结项申请
    platform_task: true
    service: platform.approval
    desc: 编排方实现审批钩子，提交时与审批通过时各跑一次检查，审批通过前任一拒绝项不满足即退回；审批结果以「审批已通过 / 审批已驳回」事件回到 B-29；申请人可在审批中撤回
    decision:
    - when: 审批通过
      goto: 6
      p: 0.8
    - when: 提交人已撤回结项申请
      goto: end
      p: 0.03
      outcome: 已撤回
    - when: otherwise
      goto: 3
      p: 0.17
    approval:
      engine: platform.approval
      doc_type: 结项申请
      approver: cost_object_owner
      multi_level: false
      on_reject: 3
      why_human: 三项拒绝检查已由 INV-40 守卫，审批不再重复核对；审批人只判断两项预警（工时单未全部审批、无生效协议）能否接受，以及项目是否确已实质完成
      escalation_rules:
      - AR-11
    withdraw:
      to: end
      outcome: 已撤回
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 72
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 结项审批
    permission: 结项申请.审批
    page: 审批待办页
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信待办（结项申请待审批）
    - to: SH-E6
      how: 企业微信消息（项目结项申请已提交，知会财务）
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 结项
    aggregate: AGG-19
    emits:
    - 项目已结项
    desc: 审批通过后调用，按结项申请 ID 幂等（INV-40）；事件由 AGG-19（B-04）发出，订阅方 B-07（终止清算与超期转费用），B-29 不发领域事件
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 结项
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    audit: true
    metric_event: true
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 归档项目
    aggregate: AGG-19
    emits:
    - 项目已归档
    desc: 项目已结项后归档（合并原 PRC-40，⑥a 评审 M2）；封存条件已在结项检查时核过；归档后改成果与证据预警（P-16）
    effort:
      typical_min: 5
      p90_min: 15
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 归档项目
    permission: 项目.归档
    page: 项目归档页
    audit: true
    outcome: 已归档
  notes: 合并原 PRC-39、PRC-40（⑥a 评审 H2 c）。D-9 用户已定 a：无聚合的流程模块 B-29（模块标识 delivery.closeout，intent 114200 F-5），位于 B-04、B-05、B-06、B-08、B-11、B-28 下游；收入覆盖结论载体随 Q20。封存证据步为收尾新增，使 INV-40 第三项（交付物与证据均已封存）可由本流程达成。
  stages_note: '判据①：封存已发布成果与证据、结项归档分别造出 VS-02.7 的 OBJ-35「已封存」、OBJ-53「已封存」、OBJ-29「已结项 → 已归档」。不加 VS-02.1、VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6：这些段的 exit_common 要交付物「已认可」或「已交付（签收）/ 审查中」且「已声明」，本流程只作最终封存，不产生客户认可或声明；「交付物已封存」的文本匹配不能替代上述业务条件。'
- id: PRC-37
  name: 开展客户满意度调查
  trigger:
    type: human
    desc: 项目收尾，项目经理发出满意度调查
  stages:
  - VS-02.7
  primary_object: OBJ-106
  owner_bc: B-28
  human_orchestration: false
  migration: 全部历史满意度调查（调查对象联系人、回收材料、评分、跟进说明）迁入（U-4），联系人按迁入后的往来单位联系人映射；投产时已发出未回收的按「已发出」迁入，已回收未评分的按「已回收」迁入
  scope: 按项目的数据范围：项目经理、项目总监可见；联系人为个人信息，限经办人与项目管理层
  frequency_ref: 待取证 E-B1（经验估计：每个结项项目 1 份，月均数个至十余个）
  triggers:
  - type: human
    name: 项目收尾，项目经理发出满意度调查
  outcomes:
  - 已跟进
  scenarios:
  - PRC-37-S01
  - PRC-37-S02
  - PRC-37-S03
  - PRC-37-S04
  - PRC-37-S05
  roles:
  - id: SH-E2
