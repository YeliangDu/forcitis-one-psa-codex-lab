# 收入线组 ⑥b 流程骨架片段（one-arch-revenue；格式按 closeout/CONVENTIONS.md；actor_v1 为 v1 原 actor 文字，合并时由 one-architecture 定去留）
processes:
- id: PRC-03
  name: 跟进线索并转商机
  trigger:
    type: human
    desc: 客户来询、转介绍或市场活动产生线索
  stages:
  - VS-01.1
  - VS-01.2
  primary_object: OBJ-17
  owner_bc: B-03
  human_orchestration: false
  merged_from:
  - PRC-04
  triggers:
  - type: human
    name: 客户来询、转介绍、招标公告或市场活动产生线索
  - type: human
    name: 客户直接邀标或委托，无需线索，直接新建商机
  outcomes:
  - 已转商机
  - 线索已关闭
  - 已挂起
  - 商机跟进中
  - 商机已维护
  scenarios:
  - PRC-03-S01
  - PRC-03-S02
  - PRC-03-S03
  - PRC-03-S04
  - PRC-03-S05
  - PRC-03-S06
  - PRC-03-S07
  - PRC-03-S08
  - PRC-03-S09
  - PRC-03-S10
  - PRC-03-S11
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 登记并跟进线索，新建商机、确认线索，维护商机负责人与参与团队
      approval_right: 无审批权
      department_hint: 市场与经营部门（各区域事业部市场条线）
      position_hint: 市场经理、客户经理
  - id: SH-E6
    as: informed
    org_needs:
      responsibility: 核实往来单位档案（线索转商机的前置，见 PRC-05）
      approval_right: 无审批权
      department_hint: 财务部（往来单位管理岗）
      position_hint: 财务专员
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  - id: SH-P3
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  migration: 历史线索（含已确认、已关闭）与由其转出的商机关联全部迁入（U-4），记迁入来源与原始时间；已确认的线索保留所转商机 ID；投产时处于跟进中或挂起的线索按当前状态迁入，认领人按人员对应关系迁入，对应不上的留空待区域负责人重新认领
  scope: 按数据范围（ADR-0026，法人 × 部门 × 项目角色）：线索与商机对认领人、商机负责人、参与团队及其管理链可见并经办；他人只读聚合指标
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-01
    - AGG-08
    desc: 关联往来单位（可无）与市场活动
    decision:
    - when: 客户直接邀标或委托，无需线索
      goto: 6
      p: 0.25
    - when: otherwise
      goto: 2
      p: 0.75
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读往来单位
    actor_v1: 市场和客户经理
    audit: false
  - actor: SH-E5
    where: in_system
    command: 登记线索
    aggregate: AGG-09
    actor_v1: 市场和客户经理
    permission: 线索.登记
    page: 线索登记页
    audit: false
    metric_event: true
    effort:
      typical_min: 10
      p90_min: 30
  - actor: SH-E5
    where: in_system
    command: 认领线索
    aggregate: AGG-09
    decision:
    - when: 需暂缓跟进
      goto: 4
      p: 0.15
    - when: otherwise
      goto: 6
      p: 0.85
    actor_v1: 市场和客户经理
    permission: 线索.认领
    page: 线索跟进页
    audit: false
    effort:
      typical_min: 5
      p90_min: 15
  - actor: SH-E5
    where: in_system
    command: 挂起线索
    aggregate: AGG-09
    branch: 挂起
    desc: 线索自身状态转换（跟进中 ⇄ 挂起）
    decision:
    - when: 线索重启跟进
      goto: 5
      p: 0.5
    - when: 线索无价值
      goto: 9
      p: 0.3
    - when: otherwise
      goto: end
      outcome: 已挂起
      p: 0.2
    actor_v1: 市场和客户经理
    permission: 线索.挂起
    page: 线索跟进页
    audit: true
    outcome: 已挂起
    effort:
      typical_min: 5
      p90_min: 15
  - actor: SH-E5
    where: in_system
    command: 恢复线索
    aggregate: AGG-09
    branch: 挂起
    desc: 挂起可恢复为跟进中（INV-24）
    decision:
    - when: otherwise
      goto: 6
      p: 1.0
    actor_v1: 市场和客户经理
    permission: 线索.恢复
    page: 线索跟进页
    audit: false
    effort:
      typical_min: 5
      p90_min: 15
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-01
    - AGG-62
    added_in: closeout
    desc: 新建商机前读往来单位档案状态（档案已核实才算正式往来单位，P-3）与拟任负责人
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读正式往来单位状态
    - mode: api
      direction: out
      bc: B-13
      name: 读商机负责人
    actor_v1: 市场和客户经理
    audit: false
    decision:
    - when: otherwise
      goto: 7
      p: 1.0
  - actor: SH-E5
    where: in_system
    command: 新建商机
    aggregate: AGG-10
    desc: 先建商机（回溯检查 RD-01）：来源线索须为「跟进中」（前置读 AGG-09，同 BC），须有正式往来单位（档案已核实，客户角色不走准入，P-3）与唯一负责人（INV-25、26）；被拒时线索留在「跟进中」，补资料或经财务核实档案后重试，或按 INV-24 关闭（无价值）；没有来源线索（直接邀标或委托）时无线索可确认，本步即结束并通知商机负责人开始跟进
    decision:
    - when: 新建商机被拒且不再跟进
      goto: 9
      rule: INV-26
      p: 0.03
    - when: 新建商机被拒，补资料后重试
      goto: 6
      rule: INV-26
      p: 0.07
    - when: 没有来源线索（直接邀标或委托）
      goto: end
      outcome: 商机跟进中
      p: 0.2
    - when: otherwise
      goto: 8
      p: 0.7
    actor_v1: 市场和客户经理
    permission: 商机.新建
    page: 商机新建页
    audit: true
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信待办（仅因往来单位档案未核实被拒时：请核实档案，见 PRC-05）
    - to: SH-E5
      how: 企业微信消息（仅没有来源线索时：商机已新建，请开始跟进；报价见 PRC-07）
    outcome: 商机跟进中
    effort:
      typical_min: 15
      p90_min: 45
  - actor: SH-E5
    where: in_system
    command: 确认线索
    aggregate: AGG-09
    emits:
    - 线索已确认
    desc: 商机建成后确认，命令携带商机 ID 并按商机 ID 幂等，确认失败留在「跟进中」重试；已确认的线索不可再关闭（INV-24），故不先确认
    decision:
    - when: 商机负责人或参与团队需调整
      goto: 10
      p: 0.1
    - when: otherwise
      goto: end
      outcome: 已转商机
      p: 0.9
    actor_v1: 市场和客户经理
    permission: 线索.确认
    page: 线索跟进页
    audit: true
    metric_event: true
    outcome: 已转商机
    effort:
      typical_min: 5
      p90_min: 10
  - actor: SH-E5
    where: in_system
    command: 关闭线索
    aggregate: AGG-09
    branch: 无价值
    emits:
    - 线索已关闭
    desc: 须填原因（INV-24）；已确认的线索不能再关闭；新建商机被拒且不再跟进时走此分支
    decision:
    - when: otherwise
      goto: end
      rule: INV-24
      outcome: 线索已关闭
      p: 1.0
    actor_v1: 市场和客户经理
    permission: 线索.关闭
    page: 线索跟进页
    audit: true
    metric_event: true
    outcome: 线索已关闭
    effort:
      typical_min: 5
      p90_min: 10
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-62
    branch: 维护
    added_in: closeout
    desc: 变更负责人前读新负责人
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读新负责人
    actor_v1: 市场和客户经理
    audit: false
    decision:
    - when: otherwise
      goto: 11
      p: 1.0
  - actor: SH-E5
    where: in_system
    command: 变更商机负责人
    aggregate: AGG-10
    branch: 维护
    desc: 只有一个负责人（INV-26）
    decision:
    - when: 参与团队需调整
      goto: 12
      p: 0.3
    - when: otherwise
      goto: end
      outcome: 商机已维护
      p: 0.7
    actor_v1: 市场和客户经理
    permission: 商机.变更负责人
    page: 商机维护页
    audit: true
    outcome: 商机已维护
    notify:
    - to: SH-E5
      how: 企业微信消息（新负责人收到商机交接）
    effort:
      typical_min: 10
      p90_min: 30
  - actor: SH-E5
    where: in_system
    command: 维护商机参与团队
    aggregate: AGG-10
    branch: 维护
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已维护
      p: 1.0
    actor_v1: 市场和客户经理
    permission: 商机.维护参与团队
    page: 商机维护页
    audit: false
    outcome: 商机已维护
    effort:
      typical_min: 10
      p90_min: 30
  notes: 线索可跳过（客户直接邀标或委托时从新建商机开始）；线索挂起与恢复属线索自身状态转换。「线索已确认」订阅方仅分析，本流程内顺序衔接，不另作事件触发。顺序为新建商机在先、确认线索在后（回溯检查 RD-01，与信息图 OBJ-17 状态机一致：只有商机建成才进入「已确认」）。新建商机只发内部事件，无外部消费者（⑥a 评审 L3，可接受）。「正式往来单位」= 档案已核实（P-3），客户角色不走准入。
  frequency_ref: 待取证（E-B1）；经验估计：线索每月约 30 条，转商机约 1/3
  stages_note: '判据①：线索转商机或关闭造出 VS-01.1 退出；SD-14 已将 OBJ-18「跟进中（内部阶段）」列入 VS-01.2 段内状态，结局「商机跟进中」据此归 VS-01.2，不再以进入条件归段。其余近似项不补标。'
- id: PRC-07
  name: 编制并生效报价
  trigger:
    type: human
    desc: 商机跟进中，客户询价或邀标
  stages:
  - VS-01.2
  primary_object: OBJ-21
  owner_bc: B-03
  human_orchestration: true
  human_note: 报价评审（草拟 → 审批中 → 已通过 / 驳回）
  triggers:
  - type: human
    name: 商机跟进中，客户询价或邀标
  - type: human
    name: 报价被取代或投标被撤回后重新报价
  outcomes:
  - 报价已生效
  - 报价已作废
  - 报价未编制
  - 已撤回
  - 报价已发出
  - 报价发出被拒（未用印）
  scenarios:
  - PRC-07-S01
  - PRC-07-S02
  - PRC-07-S03
  - PRC-07-S04
  - PRC-07-S05
  - PRC-07-S06
  - PRC-07-S07
  - PRC-07-S08
  - PRC-07-S09
  - PRC-07-S10
  - PRC-07-S11
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 编制并提交报价版本，评审通过后生效或作废
      approval_right: 无审批权
      department_hint: 市场与经营部门、各区域事业部
      position_hint: 客户经理、商务
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 评审报价（价格、毛利、范围与风险）
      approval_right: 按费用或业务归属对象的责任人审批本类单据（谁负责谁批）；基础审批人为商机负责人；命中加审规则时上送财务负责人、总经理；商机负责人本人提交时由汇报线上级代批（AR-11）
      department_hint: 各区域事业部、经营管理部
      position_hint: 事业部负责人、项目总监
  - id: SH-C6c
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  migration: 历史报价版本全部迁入（U-4），含已通过冻结的估算分解、驳回与作废的版本及所用费率、系数版本引用；每个（商机，标段）只迁一个当前生效版本；投产时草拟中的版本按草拟迁入，审批中的由编制人在新系统重新提交评审（在途单据口径随迁入框架 ADR-0036）
  scope: 按商机数据范围：商机负责人与参与团队可见并经办本商机报价；成本与毛利明细的可见范围随数据范围规则卡（ADR-0026，待 one-rules）
  segregation:
  - roles:
    - SH-E5
    - SH-M1
    rule: 报价编制人与评审人不得为同一人（建议，见 NOTES 待用户定）
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-05
    - AGG-06
    - AGG-07
    desc: 读费率、系数与协议价目的生效版本（INV-32）
    cross_bc:
    - mode: api
      direction: out
      bc: B-02
      name: 读费率、系数与协议价目的生效版本
    actor_v1: 市场和客户经理
    audit: false
    decision:
    - when: otherwise
      goto: 2
      p: 1.0
  - actor: SH-E5
    where: in_system
    command: 编制报价版本
    aggregate: AGG-12
    desc: 引用已生效的计费系数版本与标准成本费率版本（INV-32）；商机已处终态时新建报价先预警（P-12）
    decision:
    - when: 所引费率或系数版本并非生效版本
      goto: end
      rule: INV-32
      outcome: 报价未编制
      p: 0.03
    - when: otherwise
      goto: 3
      p: 0.97
    actor_v1: 市场和客户经理
    permission: 报价.编制
    page: 报价编制页
    audit: false
    outcome: 报价未编制
    effort:
      typical_min: 60
      p90_min: 240
  - actor: SH-E5
    where: in_system
    command: 提交报价评审
    aggregate: AGG-12
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起审批
    actor_v1: 市场和客户经理
    permission: 报价.提交评审
    page: 报价编制页
    audit: true
    metric_event: true
    effort:
      typical_min: 15
      p90_min: 40
    withdraw:
      to: end
      outcome: 已撤回
      gap: 聚合稿 AGG-12 缺「撤回报价评审」命令（见 NOTES 命令缺口）
    decision:
    - when: otherwise
      goto: 4
      p: 1.0
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 报价评审
    approval:
      doc_type: 报价评审单
      approver: cost_object_owner
      why_human: 需要人判断报价的价格策略、毛利水平、服务范围与风险承担是否可接受，系统只能算金额与毛利，无法替代商业判断
      escalation_rules:
      - AR-01
      - AR-02
      - AR-07
      - AR-11
      engine: platform.approval
      on_reject: 6
    decision:
    - when: 审批通过
      goto: 5
      p: 0.8
    - when: 申请人已撤回评审
      goto: end
      outcome: 已撤回
      p: 0.03
    - when: otherwise
      goto: 6
      p: 0.17
    actor_v1: 项目总监
    permission: 报价评审.审批
    page: 报价评审审批页
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信待办（待报价评审）
    effort:
      typical_min: 15
      p90_min: 45
    wait:
      typical_h: 16
      p90_h: 48
    desc: 归属对象为商机（承担部门），基础审批人为承担部门负责人；评审编制人提交的报价（价格、毛利、范围与风险承担）
    withdraw:
      to: end
      outcome: 已撤回
    outcome: 已撤回
  - actor: system
    where: automatic
    command: 通过报价评审
    aggregate: AGG-12
    desc: 审批通过结果回调（已通过 = 评审通过并冻结，INV-31）
    decision:
    - when: otherwise
      goto: 7
      p: 1.0
    actor_v1: 系统策略
    audit: true
    notify:
    - to: SH-E5
      how: 企业微信消息（报价评审通过，可生效）
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
  - actor: system
    where: automatic
    command: 驳回报价评审
    aggregate: AGG-12
    branch: 驳回
    desc: 审批驳回结果回调，退回编制
    decision:
    - when: 客户仍要报价
      goto: 2
      p: 0.6
    - when: otherwise
      goto: 10
      p: 0.4
    actor_v1: 系统策略
    audit: true
    notify:
    - to: SH-E5
      how: 企业微信消息（报价评审被驳回，附驳回意见）
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
  - actor: SH-E5
    where: in_system
    command: 生效报价版本
    aggregate: AGG-12
    emits:
    - 报价版本已生效
    - 报价版本已被取代
    desc: 旧版同事务被取代（INV-30）；生效 = 成为当前版本，须已通过
    decision:
    - when: 投标场景（发出经 PRC-08 递交投标）
      goto: end
      p: 0.4
      rule: INV-30
      outcome: 报价已生效
    - when: otherwise
      goto: 8
      p: 0.6
      rule: INV-30
    actor_v1: 市场和客户经理
    permission: 报价.生效
    page: 报价生效页
    audit: true
    metric_event: true
    outcome: 报价已生效
    effort:
      typical_min: 5
      p90_min: 15
  - actor: system
    where: automatic
    added_in: closeout
    service: REF-04
    read: true
    reads:
    - AGG-113
    desc: 核验实际用印（报价发出编排 REF-04，名称待 one-glossary 定）：非投标场景（询价、议标、直接委托）经 api 向 B-31 核验，须为同一报价版本、法人、拟发文件的实际用印登记；仅审批通过不够，核验不通过或读不到、调用失败一律拒绝并告警，不调用登记报价发出
    cross_bc:
    - mode: api
      direction: out
      bc: B-31
      name: 核验实际用印
    decision:
    - when: 未用印，或报价版本、法人、拟发文件不符，或读不到用印登记、调用失败
      goto: end
      outcome: 报价发出被拒（未用印）
      p: 0.03
    - when: otherwise
      goto: 9
      p: 0.97
    notify:
    - to: SH-E5
      how: 核验失败时告警（企业微信消息，附拒绝原因）
  - actor: SH-E5
    where: in_system
    added_in: closeout
    command: 登记报价发出
    aggregate: AGG-12
    emits: []
    desc: 由报价发出编排（REF-04，名称待 one-glossary 定）在实际用印核验通过后调用，入参为报价版本、发出方式、日期、客户联系人、用印登记 ID；只登记发出记录，不改报价状态、不校验用印真伪；报价聚合不依赖 B-31
    permission: 报价.登记发出
    page: 报价发出登记页
    audit: true
    decision:
    - when: otherwise
      goto: end
      outcome: 报价已发出
      p: 1.0
    outcome: 报价已发出
  - actor: SH-E5
    where: in_system
    command: 作废报价版本
    aggregate: AGG-12
    branch: 作废
    desc: 草拟或驳回的版本作废
    decision:
    - when: otherwise
      goto: end
      p: 1.0
      outcome: 报价已作废
    actor_v1: 市场和客户经理
    permission: 报价.作废
    page: 报价编制页
    audit: true
    outcome: 报价已作废
    effort:
      typical_min: 5
      p90_min: 10
  notes: 报价被取代、投标被撤回时在本段内重入。「报价版本已生效」无事件消费者：签约时经投标承诺快照读取（见「起草、评审并回签协议」），可接受（⑥a 评审 L3）。审批结果回调写在下一步 cross_bc（event in platform.approval，CONVENTIONS 第 5 节）。B31-16 的实际用印核验只在报价发出编排（REF-04，名称待 one-glossary 定）执行；非投标生效后登记报价发出，投标经 PRC-08 递交，报价与投标聚合均不依赖 B-31。
  frequency_ref: 待取证（E-B1）；经验估计：报价版本每月约 20 份，评审通过约 80%
  stages_note: 判据：通过报价评审使报价（OBJ-21）到「已通过」，即 VS-01.2 段内状态。字面误判：「报价已生效」被匹到 VS-04.1 退出的付款条件项「生效」，是不同对象。 R1-A-02：先登记客户请求类型、轮次及逐项需要，关联本轮响应版本并记录未响应项和理由；非招标询价由 PRC-07 在商机内办理，竞争性采购由 PRC-08 引用招标资料并逐项对应。
- id: PRC-08
  name: 参加投标，缴纳保证金并登记结果
  trigger:
    type: human
    desc: 商机已决定参投（PRC-183）后，收到邀标或招标公告，或直接委托待登记
  stages:
  - VS-01.2
  primary_object: OBJ-18
  primary_object_note: 结局赢单 / 丢单 / 放弃是 VS-01.2 退出；投标 OBJ-20、保证金 OBJ-13 为过程对象
  owner_bc: B-03
  human_orchestration: true
  human_note: 截止时间、开标公示等外部等待，可撤回或撤销；投标保证金缴纳走付款审批；保证金退还由 PRC-153 订阅本流程的投标未中标、已废标、已撤销事件接续
  merged_from:
  - PRC-09
  - PRC-11
  triggers:
  - type: human
    name: 收到邀标或招标公告
  - type: human
    name: 招标人通知评标结果后登记（中标、未中标、废标）
  outcomes:
  - 已递交待评标
  - 商机已赢单
  - 商机已丢单
  - 商机已放弃
  - 不得投标
  - 已撤回
  - 已转重新投标
  - 递交被拒（未用印）
  scenarios:
  - PRC-08-S01
  - PRC-08-S02
  - PRC-08-S03
  - PRC-08-S04
  - PRC-08-S05
  - PRC-08-S06
  - PRC-08-S07
  - PRC-08-S08
  - PRC-08-S09
  - PRC-08-S10
  - PRC-08-S11
  - PRC-08-S12
  - PRC-08-S13
  - PRC-08-S14
  - PRC-08-S15
  - PRC-08-S16
  - PRC-08-S17
  - PRC-08-S18
  - PRC-08-S19
  - PRC-08-S20
  - PRC-08-S21
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 登记资格预审、递交投标与评标结果，登记商机丢单或放弃
      approval_right: 无审批权
      department_hint: 市场与经营部门、各区域事业部
      position_hint: 客户经理、商务、投标专员
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 出纳按银行付款回单登记投标保证金缴纳，系统提交过账候选（退还见 PRC-153）
      approval_right: 无审批权（登记退还须按法人范围授权）
      department_hint: 财务部（资金岗）
      position_hint: 出纳
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 投标保证金付款审批（归属对象责任人，商机负责人的部门负责人）；参投判断已移至 PRC-183
      approval_right: 投标保证金付款：一级审批，超额按 AR-01、AR-02 加审
      department_hint: 市场与经营部门或区域事业部
      position_hint: 部门负责人
  - id: SH-X4
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  - id: SH-P1c
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  - id: SH-C6c
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  migration: 历史投标（含联合体协议、承诺快照、资格预审、中标通知书、撤回与废标记录）全部迁入（U-4），记迁入来源与原始时间；投产时已递交待评标的投标按当前状态迁入，截止时间随招标项目登记迁入；保证金缴纳与退还记录由保证金台账（PRC-10）迁入，未退还的保证金由 PRC-153 接续
  scope: 按商机数据范围：商机负责人与参与团队可见并经办投标；保证金缴纳登记限财务出纳按法人范围经办（ADR-0026）
  legal_entity: 保证金付款与缴纳登记按付款资金账户的法人口径执行
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - REF-01
    - AGG-01
    desc: 读招标项目登记与联合体成员
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读招标项目登记与联合体成员
    actor_v1: 市场和客户经理
    audit: false
    decision:
    - when: otherwise
      goto: 2
      p: 1.0
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-18
    desc: 读独立性检查结论（INV-33，D-4 b）：我方为 IDI 风险管理机构且有冲突未获书面同意的，不得递交投标、不得凭委托赢单
    decision:
    - when: 直接委托，无招标
      goto: 16
      p: 0.25
    - when: 我方为 IDI 风险管理机构且独立性检查有冲突、未获书面同意
      goto: end
      rule: INV-33
      outcome: 不得投标
      p: 0.01
    - when: otherwise
      goto: 3
      p: 0.74
    actor_v1: 市场和客户经理
    audit: false
    outcome: 不得投标
  - actor: SH-E5
    where: offline
    command: 登记资格预审结果
    aggregate: AGG-11
    evidence:
    - 资格预审结果通知（招标人书面通知或电子招投标平台回执）
    - 通知日期与招标项目标段
    decision:
    - when: 资格预审未通过
      goto: 13
      rule: INV-29
      p: 0.1
    - when: 招标文件要求缴纳投标保证金
      goto: 4
      p: 0.7
    - when: otherwise
      goto: 6
      p: 0.2
    actor_v1: 市场和客户经理
    permission: 投标.登记资格预审
    page: 资格预审登记页
    audit: false
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 48
      p90_h: 120
  - actor: SH-E5
    where: in_system
    bc: B-10
    added_in: closeout
    command: 发起付款
    aggregate: AGG-53
    desc: 招标文件要求缴纳投标保证金的，商机负责人发起保证金付款；付款走 B-10 付款审批，收款方须为招标人已登记账户（INV-80）、经办与审批与出纳分离（INV-81）。参投与否已在 PRC-183 决定（用户 VS01-10），本审批只管资金：金额、收款账户与招标文件依据
    decision:
    - when: otherwise
      goto: 5
      p: 1.0
    approval:
      engine: platform.approval
      doc_type: 投标保证金付款审批
      approver: cost_object_owner
      multi_level: false
      escalation_rules:
      - AR-01
      - AR-02
      on_reject: 13
      why_human: 保证金金额是否与招标文件要求一致、资金占用是否可承受需要人核对招标文件与资金安排，系统只能核对金额阈值与收款账户；参投判断不在此（PRC-183）。
    permission: 保证金付款.发起
    page: 保证金付款申请页
    audit: true
    effort:
      typical_min: 15
      p90_min: 40
    wait:
      typical_h: 24
      p90_h: 72
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起审批
  - actor: SH-E6
    where: in_system
    bc: B-09
    added_in: closeout
    command: 登记保证金缴纳
    aggregate: AGG-51
    emits:
    - 保证金已缴
    desc: 审批通过、付款成功后，出纳登记投标保证金缴纳（P-10 比例与时限判定）；付款成功由 B-10 发出事件，审批结果回调在 B-10 付款流程内处理
    evidence:
    - 保证金付款的银行回单
    decision:
    - when: otherwise
      goto: 6
      p: 1.0
    permission: 保证金.登记缴纳
    page: 保证金缴纳登记页
    audit: true
    effort:
      typical_min: 10
      p90_min: 30
    cross_bc:
    - mode: event
      direction: in
      bc: B-10
      name: 付款已成功
  - actor: platform
    where: automatic
    added_in: closeout
    desc: P-13 投标截止临近提醒（按招标项目登记中的截止时间），到点提醒商机负责人
    decision:
    - when: otherwise
      goto: 7
      p: 1.0
    notify:
    - to: SH-E5
      how: 企业微信待办（投标截止临近）
    actor_v1: 系统策略
    audit: false
    platform_task: true
    on_time: 投标截止时间前的提醒提前量（P-13，具体量以规则卡为准）
  - actor: system
    where: automatic
    added_in: closeout
    service: REF-04
    read: true
    reads:
    - AGG-113
    desc: 核验实际用印（报价发出编排 REF-04，名称待 one-glossary 定）：递交投标前经 api 向 B-31 核验，须为同一报价版本、法人、拟发文件的实际用印登记；仅审批通过不够，核验不通过或读不到、调用失败一律拒绝并告警，不调用递交投标
    cross_bc:
    - mode: api
      direction: out
      bc: B-31
      name: 核验实际用印
    decision:
    - when: 未用印，或报价版本、法人、拟发文件不符，或读不到用印登记、调用失败
      goto: end
      outcome: 递交被拒（未用印）
      p: 0.03
    - when: otherwise
      goto: 8
      p: 0.97
    notify:
    - to: SH-E5
      how: 核验失败时告警（企业微信消息，附拒绝原因）
  - actor: SH-E5
    where: offline
    command: 递交投标
    aggregate: AGG-11
    emits:
    - 投标已递交
    desc: 由报价发出编排（REF-04，名称待 one-glossary 定）在实际用印核验通过后调用，入参带用印登记 ID；携承诺快照，在电子招投标平台或按招标文件约定的方式递交，本系统登记递交结果与投标文件终稿；投标聚合不依赖 B-31
    evidence:
    - 递交回执（电子招投标平台回执、签收单或快递妥投记录之一）
    - 投标文件终稿与报价版本引用、承诺快照
    - 用印登记 ID
    decision:
    - when: 评标结果为中标
      goto: 9
      p: 0.2
    - when: 评标结果为未中标
      goto: 10
      p: 0.4
    - when: 评标阶段被宣布废标
      goto: 11
      p: 0.03
    - when: 决定撤回或撤销投标
      goto: 12
      p: 0.04
    - when: otherwise
      goto: end
      outcome: 已递交待评标
      p: 0.33
    actor_v1: 市场和客户经理
    permission: 投标.递交
    page: 投标递交登记页
    audit: true
    metric_event: true
    outcome: 已递交待评标
    notify:
    - to: SH-E5
      how: 企业微信待办（开标后登记评标结果）
    effort:
      typical_min: 30
      p90_min: 90
    wait:
      typical_h: 360
      p90_h: 720
    withdraw:
      to: 12
      outcome: 已撤回
  - actor: SH-E5
    where: offline
    command: 登记中标
    aggregate: AGG-11
    emits:
    - 投标已中标
    evidence:
    - 中标通知书（文件引用与日期，本聚合附件，登记时必填并校验已上传）
    decision:
    - when: otherwise
      goto: 14
      p: 1.0
    actor_v1: 市场和客户经理
    permission: 投标.登记结果
    page: 投标结果登记页
    audit: true
    metric_event: true
    effort:
      typical_min: 20
      p90_min: 60
  - actor: SH-E5
    where: offline
    command: 登记未中标
    aggregate: AGG-11
    branch: 未中标
    emits:
    - 投标未中标
    evidence:
    - 未中标通知或中标结果公示（扫描件或网页存档）
    decision:
    - when: otherwise
      goto: 15
      p: 1.0
    cross_bc:
    - mode: event
      direction: out
      bc: B-09
      name: 投标未中标
    actor_v1: 市场和客户经理
    permission: 投标.登记结果
    page: 投标结果登记页
    audit: true
    metric_event: true
    effort:
      typical_min: 15
      p90_min: 45
    desc: 投标未中标；保证金退还由 PRC-153 订阅「投标未中标」接续，不在本流程
  - actor: SH-E5
    where: offline
    command: 登记废标
    aggregate: AGG-11
    branch: 废标
    emits:
    - 投标已废标
    desc: 评标阶段被宣布废标；重新招标的另建投标，不重新招标的客户经理人工登记商机丢单或放弃商机；投标保证金退还由 PRC-153 订阅「投标已废标」接续，不在本流程
    evidence:
    - 废标通知（招标人书面通知或电子招投标平台通知）
    decision:
    - when: 重新招标，另建投标
      goto: PRC-08
      p: 0.3
      outcome: 已转重新投标
    - when: 不重新招标且商机丢失
      goto: 18
      p: 0.3
    - when: otherwise
      goto: 13
      p: 0.4
    cross_bc:
    - mode: event
      direction: out
      bc: B-09
      name: 投标已废标
    actor_v1: 市场和客户经理
    permission: 投标.登记结果
    page: 投标结果登记页
    audit: true
    effort:
      typical_min: 15
      p90_min: 45
  - actor: SH-E5
    where: offline
    command: 撤回或撤销投标
    aggregate: AGG-11
    branch: 撤回
    emits:
    - 投标已撤销
    evidence:
    - 书面撤回通知及招标人收讫记录
    - 撤回发生在投标截止前还是截止后
    decision:
    - when: 撤回发生在截止前，商机继续跟进
      goto: end
      outcome: 已撤回
      p: 0.45
    - when: 撤回发生在截止前，不再跟进该商机
      goto: 13
      p: 0.15
    - when: 撤回发生在截止后，商机继续跟进，投标已撤回
      goto: end
      outcome: 已撤回
      p: 0.1
    - when: otherwise
      goto: 13
      p: 0.3
    cross_bc:
    - mode: event
      direction: out
      bc: B-09
      name: 投标已撤销
    actor_v1: 市场和客户经理
    permission: 投标.撤回
    page: 投标撤回登记页
    audit: true
    effort:
      typical_min: 15
      p90_min: 45
    outcome: 已撤回
  - actor: SH-E5
    where: in_system
    command: 放弃投标
    aggregate: AGG-11
    branch: 放弃
    emits:
    - 投标已放弃
    decision:
    - when: otherwise
      goto: 17
      p: 1.0
    actor_v1: 市场和客户经理
    permission: 投标.放弃
    page: 投标结果登记页
    audit: true
    effort:
      typical_min: 5
      p90_min: 15
    cross_bc: []
  - actor: system
    where: automatic
    command: 登记商机赢单
    aggregate: AGG-10
    on_event:
    - aggregate: AGG-11
      event: 投标已中标
    emits:
    - OpportunityAccepted
    desc: 事件策略（⑥a 评审 M5）：中标即赢单；须中标或委托证据（INV-27）
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已赢单
      p: 1.0
    cross_bc:
    - mode: event
      direction: out
      bc: B-04
      name: OpportunityAccepted
    - mode: event
      direction: out
      bc: B-05
      name: OpportunityAccepted
    actor_v1: 系统策略
    audit: true
    metric_event: true
    outcome: 商机已赢单
    notify:
    - to: SH-E2
      how: 企业微信消息（商机已赢单，可建立项目，见 PRC-17）
  - actor: system
    where: automatic
    command: 登记商机丢单
    aggregate: AGG-10
    on_event:
    - aggregate: AGG-11
      event: 投标未中标
    emits:
    - 商机已丢单
    desc: 事件策略（M5）：未中标即丢单；非投标商机的丢单由客户经理人工登记同一命令
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已丢单
      p: 1.0
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 商机已丢单
    actor_v1: 系统策略
    audit: true
    metric_event: true
    outcome: 商机已丢单
  - actor: SH-E5
    where: in_system
    command: 登记商机赢单
    aggregate: AGG-10
    branch: 委托赢单
    emits:
    - OpportunityAccepted
    desc: 人工：直接委托凭委托证据（本聚合附件）赢单（INV-27）；我方为 IDI 风险管理机构的，须已读独立性检查结论无冲突或已获书面同意（INV-33，D-4 b）；有冲突未获书面同意时拒绝并告警
    evidence:
    - 委托书（文件引用、日期与登记人，本聚合附件，赢单时校验已上传）
    decision:
    - when: otherwise
      goto: end
      rule: INV-27
      outcome: 商机已赢单
      p: 1.0
    cross_bc:
    - mode: event
      direction: out
      bc: B-04
      name: OpportunityAccepted
    - mode: event
      direction: out
      bc: B-05
      name: OpportunityAccepted
    actor_v1: 市场和客户经理
    permission: 商机.赢单
    page: 商机赢单页
    audit: true
    metric_event: true
    outcome: 商机已赢单
    effort:
      typical_min: 20
      p90_min: 60
  - actor: SH-E5
    where: in_system
    command: 放弃商机
    aggregate: AGG-10
    branch: 放弃
    emits:
    - 商机已放弃
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已放弃
      p: 1.0
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 商机已放弃
    actor_v1: 市场和客户经理
    permission: 商机.放弃
    page: 商机放弃页
    audit: true
    metric_event: true
    outcome: 商机已放弃
    effort:
      typical_min: 5
      p90_min: 10
  - actor: SH-E5
    where: in_system
    command: 登记商机丢单
    aggregate: AGG-10
    branch: 废标后丢单
    added_in: closeout
    emits:
    - 商机已丢单
    desc: 废标后不重新招标的，客户经理人工登记同一命令（非自动：废标不等于丢单，由客户经理判断）
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已丢单
      p: 1.0
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 商机已丢单
    permission: 商机.登记丢单
    page: 商机丢单登记页
    audit: true
    metric_event: true
    outcome: 商机已丢单
    effort:
      typical_min: 10
      p90_min: 30
  notes: 合并原 PRC-09（商机赢单或丢单）、PRC-11（投标未中标后退还保证金）（⑥a 评审 H2 c）。联合体协议作投标的次级对象，不放合同。OpportunityAccepted 的订阅方 B-04、B-05；赢单不触发售前投入转入（P-2）。收尾改动：第 4、5 步（评审 M15）保证金缴纳走 B-10 付款审批并登记缴纳；原三个退还分支及过账提交已移出（原稿第 15–20 步，非本版步号），保证金退还改由
    PRC-153（B-09）订阅本流程发出的投标未中标、投标已废标、投标已撤销事件接续（信号事件衔接，不用调用活动；S-27）；废标、撤回出口在本流程直接收口。过账候选遇期间已关账按 INV-92 落开放期间、标原期间，不拒绝。
  frequency_ref: 待取证（E-B1）；经验估计：投标每月约 8 次，中标约 25%
  segregation:
  - roles:
    - SH-E5
    - SH-E6
    rule: 保证金付款申请人与出纳登记缴纳不得为同一人（INV-81 经办与出纳分离）
  stages_note: '判据①：登记结果使商机赢单、丢单或放弃，造出 VS-01.2 退出；登记投标保证金缴纳也符合 SD-13 在 VS-01.2 补的 OBJ-13「已缴」。不加 VS-04.1：该段 OBJ-13 说明限履约保证金、押金及中标后退还的投标保证金；本流程步骤是投标前缴纳，不是上述业务，签约后退还由 PRC-153 承担。 R1-A-02：先登记客户请求类型、轮次及逐项需要，关联本轮响应版本并记录未响应项和理由；非招标询价由 PRC-07 在商机内办理，竞争性采购由 PRC-08 引用招标资料并逐项对应。'
- id: PRC-183
  name: 作出商机参投决策
  trigger:
    type: human
    desc: 商机跟进到需决定是否投入投标或承接时（招标、议标、直接委托均适用）
  stages:
  - VS-01.2
  primary_object: OBJ-18
  owner_bc: B-03
  human_orchestration: true
  human_note: 商机负责人决定并留痕，不设审批；低于毛利底线、超产能、独立性冲突时按异常加一级（部门负责人）
  triggers:
  - type: human
    name: 商机负责人在跟进中的商机上作参投决策
  outcomes:
  - 商机已决定参投
  - 商机已放弃
  scenarios:
  - PRC-183-S01
  - PRC-183-S02
  - PRC-183-S03
  - PRC-183-S04
  - PRC-183-S05
  roles:
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 商机负责人按判断清单逐项评分、写明理由，决定参投或放弃
      approval_right: 无审批权
      department_hint: 市场与经营部门、各区域事业部
      position_hint: 客户经理、商机负责人
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 触发异常条件（低于毛利底线、超产能、独立性冲突）时审批参投决策（商机负责人的部门负责人）
      approval_right: 参投例外：一级审批
      department_hint: 市场与经营部门或区域事业部
      position_hint: 部门负责人
  migration: 历史商机无参投决策记录，不补造；投产时跟进中的商机按「跟进中」迁入，需投标或承接的由商机负责人在新系统补作参投决策；已赢单、丢单、放弃的商机不补
  scope: 按商机数据范围：商机负责人与参与团队可见并经办；部门负责人按管理链可见并审批例外
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-10
    - AGG-01
    - AGG-18
    - AGG-12
    desc: 读商机（委托方式、客户投资限额 / 限价）、往来单位资信、独立性检查结论与报价（预计毛利），供判断清单预填
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读往来单位资信
    audit: false
    decision:
    - when: otherwise
      goto: 2
      p: 1.0
  - actor: SH-E5
    where: in_system
    command: 登记参投判断
    aggregate: AGG-10
    desc: 按判断清单（风险、产能、赢率、利润、客户资信）逐项评分并写明理由，必填项缺失则拒绝登记；清单项、评分口径与异常阈值由规则卡守（one-rules，待给号）；商机须为「跟进中」
    decision:
    - when: 决定放弃
      goto: 5
      p: 0.2
    - when: 决定参投且触发异常条件（低于毛利底线、超产能、独立性冲突）
      goto: 3
      p: 0.1
    - when: otherwise
      goto: 4
      p: 0.7
    permission: 商机.登记参投判断
    page: 商机参投决策页
    audit: true
    effort:
      typical_min: 20
      p90_min: 60
  - actor: SH-E5
    where: in_system
    command: 作出参投决策
    aggregate: AGG-10
    branch: 例外
    emits:
    - 商机已决定参投
    desc: 触发异常条件的参投决策经部门负责人一级审批后生效；驳回回到第 2 步，商机负责人调整判断或决定放弃
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已决定参投
      p: 1.0
    approval:
      engine: platform.approval
      doc_type: 参投例外审批
      approver: cost_object_owner
      multi_level: false
      on_reject: 2
      why_human: 低于毛利底线、超产能或有独立性冲突时仍要参投，是战略取舍（客户关系、市场进入、产能调配），系统只能判断是否触发阈值，不能判断例外是否值得
    permission: 商机.作出参投决策
    page: 商机参投决策页
    audit: true
    metric_event: true
    outcome: 商机已决定参投
    effort:
      typical_min: 5
      p90_min: 15
    wait:
      typical_h: 24
      p90_h: 72
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起审批
  - actor: SH-E5
    where: in_system
    command: 作出参投决策
    aggregate: AGG-10
    emits:
    - 商机已决定参投
    desc: 未触发异常条件的，商机负责人决定即生效，不设审批；之后投标见 PRC-08、直接委托在 PRC-08 登记委托赢单
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已决定参投
      p: 1.0
    permission: 商机.作出参投决策
    page: 商机参投决策页
    audit: true
    metric_event: true
    outcome: 商机已决定参投
    effort:
      typical_min: 5
      p90_min: 10
  - actor: SH-E5
    where: in_system
    command: 放弃商机
    aggregate: AGG-10
    branch: 放弃
    emits:
    - 商机已放弃
    desc: 决定不参投即放弃商机，原因取参投判断的理由
    decision:
    - when: otherwise
      goto: end
      outcome: 商机已放弃
      p: 1.0
    permission: 商机.放弃
    page: 商机放弃页
    audit: true
    metric_event: true
    outcome: 商机已放弃
    effort:
      typical_min: 5
      p90_min: 10
  notes: 用户 VS01-10（one-coordinator 转达，2026-10-16）：每个商机独立作参投决策，适用招标、议标、直接委托；商机负责人决定并留痕、不设审批，触发条件按异常加一级。PRC-08 去掉参投判断，保证金付款审批只管资金。IDI 风险管理机构的独立性冲突未获书面同意仍由 PRC-08 第 2 步按 INV-33 拒绝递交，本流程的「独立性冲突」指其余需关注的冲突，作异常加审。判断清单与阈值的规则卡待 one-rules 给号。
  frequency_ref: 待取证（E-B1）；经验估计：与商机数同量级，每月约 65 次（近 24 个月 1,566 个商机，〔售证〕§3）
  stages_note: 判据：作出参投决策使商机（OBJ-18）到「已决定参投」，是 VS-01.2 段内状态；放弃商机到「放弃」，是 VS-01.2 退出
- id: PRC-13
  name: 批准并生效费率、计费系数与协议价目版本
  trigger:
    type: human
    desc: 财务或经营管理发起新费率、系数或协议价目版本
  stages:
  - VS-01.2
  - VS-02.0
  primary_object: OBJ-26
  primary_object_note: 三类版本中费率表是预算与报价的计价基础（VS-01.2 能力 CAP-026）；计费系数 OBJ-27、协议价目随同生效；所标段无该对象退出条件，归段待 SD-14
  owner_bc: B-02
  human_orchestration: true
  triggers:
  - type: human
    name: 财务或经营管理发起新费率、系数或协议价目版本
  outcomes:
  - 费率版本已生效
  - 计费系数版本已生效
  - 协议价目版本已生效
  - 生效被拒（区间重叠）
  - 已撤回
  scenarios:
  - PRC-13-S01
  - PRC-13-S02
  - PRC-13-S03
  - PRC-13-S04
  - PRC-13-S05
  - PRC-13-S06
  - PRC-13-S07
  - PRC-13-S08
  roles:
  - id: SH-E6
    as: initiator
    org_needs:
      responsibility: 编制费率版本与计费系数并提交批准，生效已批准的版本
      approval_right: 无审批权
      department_hint: 财务部（经营分析岗）、经营管理部
      position_hint: 财务经理、经营分析专员
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 批准标准成本费率与计费系数版本
      approval_right: 按费用或业务归属对象的责任人审批本类单据（谁负责谁批）；命中加审规则时上送财务负责人、总经理；基础审批人为经营管理职能负责人
      department_hint: 经营管理部、财务部
      position_hint: 经营管理负责人、财务负责人
  - id: SH-E5
    as: performer
    org_needs:
      responsibility: 生效协议价目版本（按往来单位议定的单价条目）
      approval_right: 无审批权
      department_hint: 市场与经营部门
      position_hint: 商务
  migration: 历史费率版本、计费系数版本与协议价目版本全部迁入（U-4、D17），每版本一行并带生效区间；迁入后各版本按原生效区间排列，保证同一时点只有一个生效版本；投产时草拟或审批中的版本由发起人在新系统重新提交；工时与预算所用的历史费率引用保持原版本
  scope: 版本的编制与生效限财务职能与经营管理角色；报价、预算、工时只读生效版本（INV-32、INV-44）；费率明细对员工薪酬有间接披露，按敏感级授权
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    rule: 费率版本的发起人（财务）与批准人（管理层）分离（D6）
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-63
    - AGG-01
    added_in: closeout
    desc: 编制前读职级（费率条目键：职级 × 薪档 × 城市类别）与协议价目对应的往来单位
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读职级
    - mode: api
      direction: out
      bc: B-01
      name: 读往来单位
    audit: false
    decision:
    - when: otherwise
      goto: 2
      p: 1.0
  - actor: SH-E6
    where: in_system
    added_in: closeout
    gap: 聚合稿缺「编制费率版本」「提交费率版本审批」命令（新用语候选，见 NOTES）；计费系数、协议价目同缺编制命令
    desc: 编制费率版本条目并提交批准；同时发布计费系数（业务线 × 客户分级，Q-07）的一并编制；审批被驳回后退回本步修改（驳回结果以事件「审批已驳回」到达）
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 费率版本.编制
    page: 费率版本编制页
    audit: true
    effort:
      typical_min: 60
      p90_min: 180
    withdraw:
      to: end
      outcome: 已撤回
      gap: 聚合稿 AGG-05 缺「撤回费率版本审批」命令（见 NOTES 命令缺口）
    decision:
    - when: otherwise
      goto: 3
      p: 1.0
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 费率版本批准
    approval:
      doc_type: 费率版本批准单
      approver: cost_object_owner
      why_human: 标准成本费率与计费系数决定全公司报价与预算口径，需人判断水平是否合理、与经营策略和市场价格是否匹配，系统无法代替
      escalation_rules: []
      engine: platform.approval
      on_reject: 2
    decision:
    - when: 审批通过
      goto: 4
      p: 0.85
    - when: 申请人已撤回批准申请
      goto: end
      outcome: 已撤回
      p: 0.02
    - when: otherwise
      goto: 2
      p: 0.13
    permission: 费率版本批准.审批
    page: 费率版本批准审批页
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信待办（待批准费率版本）
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 72
    desc: 归属对象为标准成本费率（经营管理职能），基础审批人为经营管理职能负责人；G-02 按 F-2 走审批平台
    outcome: 已撤回
  - actor: system
    where: automatic
    command: 批准费率版本
    aggregate: AGG-05
    desc: 审批通过结果回调；已批准的版本不可改（INV-36）
    decision:
    - when: otherwise
      goto: 5
      p: 1.0
    actor_v1: 财务
    audit: true
    notify:
    - to: SH-E6
      how: 企业微信消息（费率版本已批准，可生效）
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
  - actor: SH-E6
    where: in_system
    command: 生效费率版本
    aggregate: AGG-05
    emits:
    - 费率版本已生效
    - 费率版本已被取代
    desc: 生效区间不得与现有生效版本重叠（INV-35）；旧版同事务被取代；同时发布协议价目新版本为 otherwise 出口
    decision:
    - when: 生效区间与现有生效版本重叠，生效被拒（区间重叠）
      goto: end
      rule: INV-35
      outcome: 生效被拒（区间重叠）
      p: 0.03
    - when: 仅发布费率版本，费率版本已生效
      goto: end
      outcome: 费率版本已生效
      p: 0.62
    - when: 同时发布计费系数新版本
      goto: 6
      p: 0.25
    - when: otherwise
      goto: 7
      p: 0.1
    cross_bc:
    - mode: api
      direction: in
      bc: B-03
      name: 报价按生效版本读取
    - mode: api
      direction: in
      bc: B-04
      name: 项目预算按生效版本读取
    actor_v1: 财务
    permission: 费率版本.生效
    page: 费率版本生效页
    audit: true
    effort:
      typical_min: 10
      p90_min: 30
  - actor: SH-E6
    where: in_system
    command: 生效计费系数版本
    aggregate: AGG-06
    emits:
    - 计费系数版本已生效
    desc: 系数条目键为业务线 × 客户分级（Q-07）；已批准的系数版本不可改（INV-36a）；与费率版本一并批准（建议，见 NOTES 待用户定）
    decision:
    - when: 同时发布协议价目新版本
      goto: 7
      p: 0.2
    - when: otherwise
      goto: end
      outcome: 计费系数版本已生效
      p: 0.8
    cross_bc:
    - mode: api
      direction: in
      bc: B-03
      name: 报价按生效版本读取
    actor_v1: 财务
    permission: 计费系数版本.生效
    page: 计费系数版本生效页
    audit: true
    outcome: 计费系数版本已生效
    effort:
      typical_min: 10
      p90_min: 30
  - actor: SH-E5
    where: in_system
    command: 生效协议价目版本
    aggregate: AGG-07
    emits:
    - 协议价目版本已生效
    desc: 协议价目按往来单位的单价条目与生效期；被引用版本不可改（INV-36）
    decision:
    - when: otherwise
      goto: end
      outcome: 协议价目版本已生效
      p: 1.0
    cross_bc:
    - mode: api
      direction: in
      bc: B-03
      name: 报价按生效版本读取
    actor_v1: 市场和客户经理
    permission: 协议价目版本.生效
    page: 协议价目版本生效页
    audit: true
    outcome: 协议价目版本已生效
    effort:
      typical_min: 10
      p90_min: 30
  notes: 批准环节须财务审定；批准走 platform.approval（AGG-05 引用列有该审批，G-02 已按 F-2 处理）。报价与项目预算读取这些版本（INV-32、INV-44）。审批驳回退回编制（v1 取 end，本批改为退回，见 NOTES）；审批通过结果写在第 4 步 cross_bc，驳回结果写在第 2 步 cross_bc。
  human_note: 费率版本批准（草拟 → 审批中 → 已批准）
  frequency_ref: 待取证（E-B1）；经验估计：费率版本每年约 1–2 次，系数与协议价目版本每年约 5 次
  stages_note: 'SD-14 已写回：批准并生效标准成本费率表使 OBJ-26 到「生效（生效期不重叠）」，是 VS-01.2、VS-02.0 的段内状态；分别供报价估算和启动预算，保留两段。VS-04.1 的「生效」是付款条件项，不同对象，近似项不补标。'
- id: PRC-16
  name: 申请并转正风险交付授权
  trigger:
    type: human
    desc: 签约前需先行投入，项目经理申请授权
  stages:
  - VS-01.2
  - VS-02.0
  - VS-04.1
  stages_note: '判据：申请使风险交付授权（OBJ-12）到「申请」、批准到「批准」，是 VS-01.2 段内状态和 VS-02.0 进入条件；转正是 VS-04.1 退出（OBJ-12 已转正）。三段均有依据'
  primary_object: OBJ-12
  owner_bc: B-05
  human_orchestration: true
  human_note: 申请 → 批准 → 转正或叫停
  triggers:
  - type: human
    name: 签约前需先行投入，项目经理申请授权
  outcomes:
  - 已批准
  - 已转正
  - 已叫停
  - 授权未获批准
  - 已撤回
  scenarios:
  - PRC-16-S01
  - PRC-16-S02
  - PRC-16-S03
  - PRC-16-S04
  - PRC-16-S05
  - PRC-16-S06
  - PRC-16-S07
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 申请风险交付授权，授权批准后先行投入
      approval_right: 无审批权
      department_hint: 各承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 审批授权，授权期限届满时决定转正或叫停
      approval_right: 按费用或业务归属对象的责任人审批本类单据（谁负责谁批）；命中加审规则时上送财务负责人、总经理
      department_hint: 各区域事业部、经营管理部
      position_hint: 事业部负责人、项目总监
  - id: SH-E5
    as: performer
    org_needs:
      responsibility: 协议生效后转正风险交付授权，并入协议
      approval_right: 无审批权
      department_hint: 市场与经营部门
      position_hint: 商务
  migration: 历史风险交付授权（含额度、期限、责任人、依据证据引用与转正、叫停记录）全部迁入（U-4），记迁入来源与原始时间；投产时已批准未转正的授权按原状态迁入，期限届满的在投产后首个提醒周期内由管理层决定转正或叫停；审批中的申请由申请人在新系统重新提交
  scope: 按商机或项目的数据范围：申请人、责任人与管理层可见并经办；授权额度与期限对财务只读（P-09 度量）
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-10
    - AGG-19
    - AGG-38
    desc: 读商机、项目与依据证据
    cross_bc:
    - mode: api
      direction: out
      bc: B-03
      name: 读商机
    - mode: api
      direction: out
      bc: B-04
      name: 读项目
    - mode: api
      direction: out
      bc: B-28
      name: 读依据证据
    actor_v1: 项目经理
    audit: false
    decision:
    - when: otherwise
      goto: 2
      p: 1.0
  - actor: SH-E2
    where: in_system
    command: 申请风险交付授权
    aggregate: AGG-17
    desc: 同一对象同类型同时段唯一（INV-18），重复申请被拒；先行投入按申请授权时承担部门所属法人立项，协议生效后协议承担法人不同的另立项目（用户 LEB-05）
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起审批
    actor_v1: 项目经理
    permission: 风险交付授权.申请
    page: 风险交付授权申请页
    audit: true
    metric_event: true
    effort:
      typical_min: 20
      p90_min: 60
    withdraw:
      to: end
      outcome: 已撤回
      gap: 聚合稿 AGG-17 缺「撤回风险交付授权申请」命令（见 NOTES 命令缺口）
    decision:
    - when: otherwise
      goto: 3
      p: 1.0
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 授权审批
    approval:
      doc_type: 风险交付授权审批单
      approver: cost_object_owner
      why_human: 需要人判断签约可能性、客户信用与先行投入的风险是否可承担，系统只能算额度与期限，无法评估商业风险
      escalation_rules:
      - AR-01
      - AR-02
      - AR-07
      - AR-11
      engine: platform.approval
      on_reject: 4
    decision:
    - when: 审批通过
      goto: 5
      p: 0.85
    - when: 申请人已撤回授权申请
      goto: end
      outcome: 已撤回
      p: 0.02
    - when: otherwise
      goto: 4
      p: 0.13
    actor_v1: 管理层
    permission: 风险交付授权.审批
    page: 风险交付授权审批页
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信待办（待风险交付授权审批）
    effort:
      typical_min: 15
      p90_min: 45
    wait:
      typical_h: 24
      p90_h: 72
    desc: 归属对象为商机或项目，基础审批人为其责任人；审批授权额度与期限内的先行投入
    outcome: 已撤回
  - actor: system
    where: automatic
    added_in: closeout
    command: 驳回风险交付授权
    aggregate: AGG-17
    desc: 审批驳回结果回调；授权不生效，不产生先行投入依据
    audit: true
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    notify:
    - to: SH-E2
      how: 企业微信消息（授权审批被驳回，附驳回意见）
    outcome: 授权未获批准
    decision:
    - when: otherwise
      goto: end
      outcome: 授权未获批准
      p: 1.0
  - actor: system
    where: automatic
    command: 批准风险交付授权
    aggregate: AGG-17
    emits:
    - 风险交付授权已批准
    desc: 审批通过后由 B-05 订阅审批结果执行（S-22 同做法）；v1 此步由管理层执行，本批改为审批结果回调
    decision:
    - when: 协议已生效（订阅「协议已生效」，GL5 订阅裁定）
      goto: 6
      p: 0.6
    - when: 授权期限届满或不再签约
      goto: 7
      p: 0.25
    - when: otherwise
      goto: end
      outcome: 已批准
      p: 0.15
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    actor_v1: 管理层
    audit: true
    metric_event: true
    outcome: 已批准
    notify:
    - to: SH-E2
      how: 企业微信消息（授权已批准，可先行投入）
    - to: SH-M1
      how: 企业微信待办（授权期限届满，请决定转正或叫停）
  - actor: SH-E5
    where: in_system
    command: 转正风险交付授权
    aggregate: AGG-17
    branch: 转正
    emits:
    - Regularized
    desc: 协议已生效后转正并入协议（GL5-01：ContractSigned 只表示已签署，不触发转正）；转正与叫停互斥（INV-19）
    decision:
    - when: otherwise
      goto: end
      rule: INV-19
      outcome: 已转正
      p: 1.0
    actor_v1: 商务
    permission: 风险交付授权.转正
    page: 风险交付授权转正页
    audit: true
    metric_event: true
    outcome: 已转正
    effort:
      typical_min: 20
      p90_min: 60
  - actor: SH-M1
    where: in_system
    command: 叫停风险交付授权
    aggregate: AGG-17
    branch: 叫停
    emits:
    - Halted
    decision:
    - when: otherwise
      goto: end
      rule: INV-19
      outcome: 已叫停
      p: 1.0
    actor_v1: 管理层
    permission: 风险交付授权.叫停
    page: 风险交付授权叫停页
    audit: true
    metric_event: true
    outcome: 已叫停
    notify:
    - to: SH-E2
      how: 企业微信消息（授权已叫停，停止先行投入）
    effort:
      typical_min: 15
      p90_min: 45
  notes: 口径与转正时点待流程梳理（C-56）。项目可先于授权存在，靠 P-09 度量预警承担（G-13）。授权被驳回后聚合没有对应命令（见 NOTES 结构问题）。
  segregation:
  - roles:
    - SH-E2
    - SH-M1
    rule: 申请人与审批人不得为同一人（责任人即申请人时命中 AR-11，按上级代批或加审处理）
  frequency_ref: 待取证（E-B1）；经验估计：每月约 2 件，转正约 70%
- id: PRC-17
  name: 建立项目并组建团队
  trigger:
    type: event
    events:
    - event: OpportunityAccepted
      aggregate: AGG-10
    desc: 项目经理收到赢单后建立项目；先行投入路径（风险交付授权已批准）由人工发起，B-04 不订阅 B-05（G-13）
  stages:
  - VS-02.0
  - VS-03.1
  primary_object: OBJ-29
  owner_bc: B-04
  human_orchestration: false
  migration: 全部历史项目（含已结项、已归档、已终止、已取消）连同承担法人、团队名册、WBS 迁入（U-3、U-4），记迁入来源与原始时间；投产时在途项目按当前状态迁入（已立项、执行中、暂停、收尾中）；老项目若挂多个法人，迁入前按 Q-06 拆为一项目一承担法人（拆分口径待取证，见 NOTES 待用户定）
  scope: 按项目承担部门的数据范围：项目经理与项目成员可见并经办本项目，部门负责人、项目总监可见本部门项目
  frequency_ref: 待取证 E-B1（经验估计：与赢单和先行投入同频，月均数个至十余个新项目）
  triggers:
  - type: event
    name: OpportunityAccepted
    bc: B-03
  - type: human
    name: 先行投入路径（风险交付授权已批准）由项目经理人工发起建项
    starts_at: 2
  outcomes:
  - 执行中
  - 未建立
  scenarios:
  - PRC-17-S01
  - PRC-17-S02
  - PRC-17-S03
  - PRC-17-S04
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 建立项目、定承担法人与团队、开始执行
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E3
    as: informed
    org_needs:
      responsibility: 按工作包编制成果、采集证据、记工时
      approval_right: 无
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 知会项目已开始执行
      approval_right: 无
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  steps:
  - actor: system
    where: automatic
    actor_v1: 项目经理
    read: true
    reads:
    - AGG-10
    - AGG-33
    desc: 读来源商机与建设工程；赢单事件到达时给项目经理生成建项待办，同一事件只生成一条
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: OpportunityAccepted
    - mode: api
      direction: out
      bc: B-03
      name: 读来源商机
    - mode: api
      direction: out
      bc: B-01
      name: 读建设工程
    notify:
    - to: SH-E2
      how: 企业微信待办（商机已赢单，待建立项目）
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 建立项目
    aggregate: AGG-19
    emits:
    - 项目已建立
    desc: 项目可先于合同；立项时定承担法人，一项目一个，跨法人的工作另立项目（Q-06）
    decision:
    - when: 承担法人只有一个且承担部门、负责人已确定
      goto: 3
      rule: intent 134134 Q-06
      p: 0.95
    - when: otherwise
      goto: end
      p: 0.05
      outcome: 未建立
    effort:
      typical_min: 15
      p90_min: 40
    wait:
      typical_h: 24
      p90_h: 72
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 项目已建立
    - mode: api
      direction: out
      bc: B-13
      name: 承担部门、负责人与承担法人
    - mode: api
      direction: out
      bc: B-03
      name: 来源商机
    permission: 项目.建立
    page: 项目建立页
    audit: true
    legal_entity: 承担法人
    metric_event: true
    outcome: 未建立
  - actor: system
    where: automatic
    actor_v1: 项目经理
    command: 登记我方参与记录
    aggregate: AGG-33
    desc: 随 D-4 b 由交付登记；B-04 调 B-01 的命令
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 登记我方参与记录
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 建立项目 WBS
    aggregate: AGG-20
    desc: 每项目一棵，阶段按拟签协议范围裁剪（项目可先于合同，裁剪依据由项目经理录入）
    effort:
      typical_min: 45
      p90_min: 150
    cross_bc:
    - mode: api
      direction: out
      bc: B-02
      name: 阶段类型版本
    permission: 项目WBS.建立
    page: 项目WBS编制页
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 维护项目团队成员
    aggregate: AGG-24
    gap: G-14
    pending: Q13
    desc: 团队名册是否决定工时范围与审批人随 Q13，名册现不作工时授权依据
    effort:
      typical_min: 10
      p90_min: 30
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 团队成员人员
    permission: 项目团队.维护
    page: 项目团队页
    notify:
    - to: SH-E3
      how: 企业微信消息（已加入项目团队）
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 开始执行项目
    aggregate: AGG-19
    emits:
    - 项目已开始执行
    desc: 已立项 → 执行中；VS-02.0 退出、VS-03.1 进入与 VS-02 贯穿活动都以「执行中」为条件（符合性审查 必-7）
    effort:
      typical_min: 2
      p90_min: 5
    permission: 项目.开始执行
    page: 项目概览页
    audit: true
    outcome: 执行中
    notify:
    - to: SH-M1
      how: 企业微信消息（项目已开始执行）
  notes: 项目已建立的订阅方 B-07（售前投入转入，P-43）；项目建立前置（赢单或先行投入授权）见 G-13。「项目已开始执行」订阅方仅分析，不作任何流程触发（符合性审查 必-7；事件订阅规则 intent 114200 F-4，见 G-05）。VS-03 各流程不建项目，进入条件「执行中」由本流程提供（符合性审查 必-6）。
  stages_note: '判据①：建立项目并开始执行使 OBJ-29 到「已立项 / 执行中」，是 VS-02.0 退出；SD-14 已将 OBJ-29「执行中」列入 VS-03.1 段内状态（建立受检项目并开始执行），保留 VS-03.1，不再以进入条件归段。'
- id: PRC-18
  name: 编制并批准交付计划
  trigger:
    type: event
    events:
    - event: 项目已建立
      aggregate: AGG-19
    desc: 项目建立后项目经理编制交付计划
  stages:
  - VS-02.0
  primary_object: OBJ-31
  owner_bc: B-04
  human_orchestration: false
  migration: 全部历史交付计划版本（含被取代版本及修订原因）迁入（U-4）；投产时在途的编制中版本按当前状态迁入，已批准或已锁定版本作生效基线迁入
  scope: 按项目的数据范围：项目经理与项目成员可见，项目经理经办
  frequency_ref: 待取证 E-B1（经验估计：每个项目 1 至 3 版对客计划，另有内部基线；与新项目数同量级）
  triggers:
  - type: event
    name: 项目已建立
    bc: B-04
  outcomes:
  - 已批准（对客）
  - 内部锁定
  scenarios:
  - PRC-18-S01
  - PRC-18-S02
  - PRC-18-S03
  - PRC-18-S04
  - PRC-18-S05
  - PRC-18-S06
  - PRC-18-S07
  - PRC-18-S08
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 书面批准对客交付计划
      approval_right: 交付计划批准（客户方，外部）
      department_hint: 客户方设计或项目管理部门（外部）
      position_hint: 客户项目负责人、发包人代表（外部）
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 所辖项目与部门的经营管理、资源与成本责任
      approval_right: 无
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  steps:
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 编制交付计划版本
    aggregate: AGG-21
    desc: 里程碑按阶段编制；修订须写原因（INV-43）；同一项目对客与内部各只有一个生效基线。对客基线须注明依据的内部基线版本，缺即拒（INV-140）；内部基线须含全部合同里程碑，内部日期晚于对客只提示（INV-141）；进度考核按内部基线，延期、结算与索赔按对客基线（用户 LEB-07）
    decision:
    - when: 本版本是对客基线（需发包人批准）
      goto: 2
      rule: INV-43
      p: 0.8
    - when: otherwise
      goto: 3
      p: 0.2
    effort:
      typical_min: 120
      p90_min: 480
    permission: 交付计划.编制
    page: 交付计划编制页
  - actor: SH-E2
    where: offline
    evidence:
    - 发包人书面批准材料（签认单、会议纪要签字页、邮件原始报文之一）
    - 批准日与批准人（须为合同登记的发包人代表或授权人）
    actor_v1: 项目经理
    command: 批准交付计划
    aggregate: AGG-21
    emits:
    - 交付计划已批准
    desc: 把计划送发包人审核；发包人书面批准后登记批准事实。发包人 5 天未审核只提醒（P-17），无状态转换，不视为批准
    decision:
    - when: 发包人书面提出修改意见
      goto: 1
      p: 0.25
    - when: otherwise
      goto: end
      p: 0.75
      outcome: 已批准（对客）
    approval:
      engine: external
      doc_type: 交付计划发包人批准
      approver: SH-C6a
      multi_level: false
      on_reject: 1
      why_human: 发包人对交付计划的批准是客户方的书面意思表示，发生在系统外，本系统只登记批准文件作证据。
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 72
      p90_h: 240
    calls: PRC-33
    permission: 交付计划.登记批准
    page: 交付计划批准登记页
    audit: true
    timeout:
      after: P5D
      escalate_to: SH-E2
      interrupting: false
    outcome: 已批准（对客）
    notify:
    - to: SH-E2
      how: 企业微信待办（发包人超 5 天未审核交付计划，请催办）
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 批准交付计划
    aggregate: AGG-21
    branch: 内部锁定
    emits:
    - 交付计划已批准
    desc: 内部基线无需发包人批准，项目经理锁定即生效
    decision:
    - when: otherwise
      goto: end
    effort:
      typical_min: 5
      p90_min: 10
    permission: 交付计划.锁定
    page: 交付计划锁定页
    audit: true
    outcome: 内部锁定
  notes: 发包人 5 天未审核只提醒（P-17），不是引擎调度的状态转换。里程碑认可事件随 Q21 待定（见 G-14）。内部锁定与对客批准是同一命令的两种路径（G-02 已处理：对客批准登记发包人批准的事实，不走审批平台）。
- id: PRC-19
  name: 编制并锁定项目预算
  trigger:
    type: event
    events:
    - event: 项目已建立
      aggregate: AGG-19
    desc: 项目建立后项目经理编制成本基线
  stages:
  - VS-02.0
  primary_object: OBJ-32
  owner_bc: B-04
  human_orchestration: true
  human_note: 编制中 → 审批中 → 已锁定
  migration: 全部历史预算版本（含被取代版本及修订原因、锁定时冻结的费率版本引用）迁入（U-4）；投产时在途的编制中或审批中版本按当前状态迁入，审批中的以新审批实例重新提交，已锁定版本作生效基线迁入
  scope: 按项目的数据范围：项目经理、项目总监可见；预算含费率与毛利，限项目管理层与财务查看
  segregation:
  - roles:
    - SH-E2
    - SH-M1
    rule: 预算编制人与审批人不得为同一人
  frequency_ref: 待取证 E-B1（经验估计：每个新项目 1 版，加修订版，月均数个至十余个）
  triggers:
  - type: event
    name: 项目已建立
    bc: B-04
  - type: human
    name: 预算被驳回或提交后撤回，项目经理修改并重新提交
    starts_at: 2
  outcomes:
  - 已锁定
  - 已撤回
  scenarios:
  - PRC-19-S01
  - PRC-19-S02
  - PRC-19-S03
  - PRC-19-S04
  - PRC-19-S05
  - PRC-19-S06
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 按 WBS 编制并锁定项目预算
      approval_right: 无；不得审批自己编制的预算
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 项目预算由项目经理负责（A）；项目经理本人提交时由其汇报线上级代批（AR-11，intent 164324）
      approval_right: 上级代批项目预算（AR-11），一级
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-E6
    as: informed
    org_needs:
      responsibility: 财务核算、收入确认复核与清算知会
      approval_right: 无
      department_hint: 财务部
      position_hint: 财务经理、会计
  steps:
  - actor: system
    where: automatic
    actor_v1: 项目经理
    read: true
    reads:
    - AGG-05
    - AGG-12
    desc: 读费率版本与赢单报价版本（P-18 毛利预警的输入）
    cross_bc:
    - mode: api
      direction: out
      bc: B-02
      name: 读费率版本
    - mode: api
      direction: out
      bc: B-03
      name: 读赢单报价版本
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 编制项目预算版本
    aggregate: AGG-22
    desc: 按 WBS 编制计划工时与非人工类别；提交审批时预算毛利低于赢单报价毛利预警（P-18），只警不拦
    effort:
      typical_min: 180
      p90_min: 600
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 项目预算.编制
    page: 项目预算编制页
    notify:
    - to: SH-M1
      how: 企业微信消息（预算毛利低于报价毛利，提交审批时预警）
  - actor: platform
    where: in_system
    actor_v1: 项目总监
    command: 项目预算审批
    platform_task: true
    service: platform.approval
    gap: G-02
    desc: 审批结果以「审批已通过 / 审批已驳回」事件回到 B-04 的项目预算（B-04 订阅 platform.approval）；提交人可在审批中撤回
    decision:
    - when: 审批通过
      goto: 4
      p: 0.85
    - when: 提交人已撤回审批
      goto: end
      p: 0.03
      outcome: 已撤回
    - when: otherwise
      goto: 2
      p: 0.12
    approval:
      engine: platform.approval
      doc_type: 项目预算审批
      approver: cost_object_owner
      multi_level: false
      on_reject: 2
      why_human: 判断预算工时与非人工成本是否合理、预算毛利低于赢单报价毛利时是否接受；系统只能算毛利并预警（P-18），不能替责任人取舍
      escalation_rules:
      - AR-11
    withdraw:
      to: end
      outcome: 已撤回
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 24
      p90_h: 72
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 项目预算审批
    permission: 项目预算.审批
    page: 审批待办页
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信待办（项目预算待审批）
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 锁定项目预算
    aggregate: AGG-22
    emits:
    - 项目预算已锁定
    desc: 锁定时冻结费率版本（INV-44），此后修订须写原因并另出版本
    decision:
    - when: otherwise
      goto: end
      rule: INV-44
    effort:
      typical_min: 5
      p90_min: 15
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    permission: 项目预算.锁定
    page: 项目预算锁定页
    audit: true
    outcome: 已锁定
  notes: 锁定时冻结费率版本（INV-44）。审批结果回写的订阅方式见 NOTES 接缝问题（B-04 → platform.approval 现只登记 api 方式）。
- id: PRC-20
  name: 提出并满足资源需求
  trigger:
    type: human
    desc: 项目经理按工作包提资源需求
  stages:
  - VS-02.0
  - VS-02.1
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.5
  - VS-02.6
  primary_object: OBJ-44
  primary_object_note: 结局「资源需求已满足 / 已关闭」；资源分配 OBJ-45 是满足需求的手段；贯穿活动，非段退出条件
  owner_bc: B-04
  human_orchestration: false
  migration: 全部历史资源需求与资源分配迁入（U-4）；投产时未满足的需求与已计划未确认的分配按当前状态迁入，具名人员按迁入后的人员主键映射
  scope: 按项目的数据范围；资源分配另按被分配人所属部门的数据范围，部门负责人可见本部门全部分配
  frequency_ref: 待取证 E-B1（经验估计：每个项目每个工作包 1 至 2 次需求，月度随项目数）
  triggers:
  - type: human
    name: 项目经理按工作包提出资源需求
  outcomes:
  - 已满足
  - 已关闭
  scenarios:
  - PRC-20-S01
  - PRC-20-S02
  - PRC-20-S03
  - PRC-20-S04
  - PRC-20-S05
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 按专长、负荷与项目优先级确认本部门人员的资源分配
      approval_right: 资源分配确认：本部门人员，单级
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-E3
    as: informed
    org_needs:
      responsibility: 按工作包编制成果、采集证据、记工时
      approval_right: 无
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  steps:
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 提出资源需求
    aggregate: AGG-25
    emits:
    - 资源需求已提出
    desc: 角色、职级、专业、时段与工时，挂工作包
    effort:
      typical_min: 15
      p90_min: 45
    permission: 资源需求.提出
    page: 资源需求编辑页
    notify:
    - to: SH-M1
      how: 企业微信待办（有资源需求待分配）
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-62
    - AGG-68
    added_in: closeout
    desc: 读候选人员、工作日历与已确认的分配，供部门负责人核对产能
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 具名人员
    - mode: api
      direction: out
      bc: B-14
      name: 工作日历
  - actor: SH-M1
    where: in_system
    actor_v1: 部门负责人
    command: 确认资源分配
    aggregate: AGG-26
    emits:
    - 资源分配已确认
    desc: 部门负责人单级确认，不走 platform.approval（G-02）；超过可用产能时写入前预警（P-27），只警不拦
    decision:
    - when: 分配覆盖需求的全部时段与工时
      goto: 4
      p: 0.75
    - when: 需求不再需要（范围变更、改外协）
      goto: 5
      p: 0.05
    - when: otherwise
      goto: 1
      p: 0.2
    approval:
      engine: aggregate
      doc_type: 资源分配确认
      approver: SH-M1
      multi_level: false
      on_reject: 1
      why_human: 按人员专长、当前负荷和项目优先级判断派谁；系统只能算产能并预警（P-27），取舍由资源所在部门的负责人作出
      escalation_rules: []
      note: engine 为 aggregate 的专业复核/职能确认，approver 写类型级 SH 角色（CONVENTIONS 第 5 节）；基础审批人为资源所在部门负责人（SH-M1）
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 8
      p90_h: 24
    permission: 资源分配.确认
    page: 资源分配确认页
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信消息（分配超过可用产能，P-27 预警）
    - to: SH-E3
      how: 企业微信消息（已被分配到项目工作包）
  - command: 标记资源需求已满足
    aggregate: AGG-25
    actor: system
    where: automatic
    added_in: closeout
    outcome: 已满足
    desc: 资源分配已确认、累计达到需求工时时由系统标记（S-33；同 BC 事件「资源分配已确认」）
    decision:
    - when: otherwise
      goto: end
      outcome: 已满足
  - command: 关闭资源需求
    aggregate: AGG-25
    actor: SH-E2
    where: in_system
    added_in: closeout
    permission: 资源需求.关闭
    page: 资源需求页
    audit: true
    outcome: 已关闭
    effort:
      typical_min: 3
      p90_min: 10
    desc: 关闭原因必填：不再需要 / 范围变更 / 改外协（S-33）
    decision:
    - when: otherwise
      goto: end
      outcome: 已关闭
  notes: 具名人员、时段与工作包；审批在聚合自身状态（已计划 → 已确认），未走 platform.approval（G-02 已明确），故不算引擎调度的人工编排。部分满足时项目经理就缺口另提需求或调整后再分配（回第 1 步）。
  stages_note: 贯穿 VS-02.0、VS-02.1、VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6：判据：资源需求与分配（OBJ-44、45）是 VS-02 贯穿活动「资源与工时」的产出，不属某一段的退出条件；各段均可提出，含 VS-02.1（概念同样提出资源需求）。近似项是通用状态词撞名，不改
- id: PRC-23
  name: 填报并审批工时单
  trigger:
    type: human
    desc: 员工按日填报工时
  stages: []
  support: 'CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题（页首不补列清单）；工时为业务拓展与交付各段提供贯穿成本输入，不因输入给阶段补人员管理'
  primary_object: OBJ-66
  owner_bc: B-06
  human_orchestration: true
  human_note: 提交 → 审批 → 通过 / 退回 / 驳回，可撤回
  migration: 全部历史工时单（含已通过、已驳回及其审批履历）迁入（U-3、U-4），记迁入来源与原始时间；投产时审批中的工时单以新审批实例重新提交（轮次从 1 起），退回待修改的按「已退回」迁入，草稿按草稿迁入；已通过的工时按迁入历史处理，不重新审批
  scope: 员工本人可见并经办本人工时单；项目经理可见本项目工时；部门负责人可见本部门；售前工时归集到商机的，按商机承担部门的数据范围
  segregation:
  - roles:
    - SH-E3
    - SH-E2
    rule: 员工不得审批自己的工时单；项目经理本人填报的项目工时由上一级（部门负责人）审批
  frequency_ref: 待取证 E-B1（经验估计：每人每工作日 1 单；月末和周五集中提交，月度总量待取证）
  triggers:
  - type: human
    name: 员工按日填报并提交工时单
  outcomes:
  - 已通过
  - 已驳回
  - 已撤回
  - 未提交
  scenarios:
  - PRC-23-S01
  - PRC-23-S02
  - PRC-23-S03
  - PRC-23-S04
  - PRC-23-S05
  - PRC-23-S06
  - PRC-23-S07
  - PRC-23-S08
  - PRC-23-S09
  - PRC-23-S10
  - PRC-23-S11
  - PRC-23-S12
  roles:
  - id: SH-E3
    as: initiator
    org_needs:
      responsibility: 按日填报并提交本人工时
      approval_right: 无；不得审批本人工时单
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  - id: SH-E2
    as: approver
    org_needs:
      responsibility: 核实本项目工时是否属实并审批
      approval_right: 本项目工时审批；项目经理本人工时上一级审批
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 审批售前、管理间接工时及项目经理本人的项目工时
      approval_right: 售前与管理间接工时审批，项目经理本人工时审批
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  steps:
  - actor: system
    where: automatic
    actor_v1: 员工
    read: true
    reads:
    - AGG-62
    - AGG-20
    - AGG-10
    - AGG-68
    - AGG-108
    - AGG-70
    - AGG-72
    - AGG-29
    desc: 读人员、工作包、日历与标准工时、请假、加班、返工认定
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读人员
    - mode: api
      direction: out
      bc: B-04
      name: 读工作包与项目状态
    - mode: api
      direction: out
      bc: B-03
      name: 读商机
    - mode: api
      direction: out
      bc: B-14
      name: 读工作日历与标准工时
    - mode: api
      direction: out
      bc: B-27
      name: 读请假与加班
    - mode: api
      direction: out
      bc: B-28
      name: 读返工认定
  - actor: SH-E3
    where: in_system
    actor_v1: 员工
    command: 提交工时单
    aggregate: AGG-39
    emits:
    - TimesheetSubmitted
    desc: 一人一日一单（INV-64）；项目暂停、结项、终止、取消期间拒记（INV-39，Q-05）；每日工时不得低于当日最低时数，扣减已批准与待批请假（INV-65）；只能记到当天有权使用的工作包（INV-66）；提交日所属期间已关账只能冲销或修正（INV-67）；法人取自员工（见 NOTES 待用户定）。提交后审批平台按工时类型并行路由：项目工时到项目经理，售前工时到部门负责人，管理间接工时到一级汇报人
    decision:
    - when: 工时所属期间已关账（提示改走冲销或修正，不设审批）
      goto: end
      rule: INV-67
      p: 0.01
      outcome: 未提交
    - when: 所记项目已暂停、已结项、已终止或已取消
      goto: end
      rule: INV-39
      p: 0.01
      outcome: 未提交
    - when: 所记工作包当天无权使用
      goto: end
      rule: INV-66
      p: 0.01
      outcome: 未提交
    - when: 当日工时低于最低时数（已扣减请假）
      goto: end
      rule: INV-65
      p: 0.03
      outcome: 未提交
    - when: otherwise
      goto: 3
      p: 0.94
    effort:
      typical_min: 10
      p90_min: 25
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 项目暂停期间拒记工时
    - mode: api
      direction: out
      bc: platform.approval
      name: 工时审批
    - mode: api
      direction: out
      bc: platform.numbering
      name: 取号
    - mode: api
      direction: out
      bc: platform.identity
      name: 身份
    permission: 工时单.提交
    page: 工时填报页
    audit: true
    period_gate: true
    legal_entity: 员工所属法人
    outcome: 未提交
  - actor: platform
    where: in_system
    actor_v1: 项目经理
    command: 工时审批
    platform_task: true
    service: platform.approval
    desc: 已建；按工时类型并行会签：项目工时 → 项目经理（SH-E2），售前工时 → 部门负责人（SH-M1），管理间接工时 → 员工的一级汇报人（SH-M1）；无对应工时类型的分支跳过；同一审批人重复轮次自动通过；每分支期限 1 个工作日，次日 9:00 提醒，再 1 个工作日升级（审批平台已建配置）；审批人按归属对象的责任人解析（项目工时→项目经理，售前工时→商机承担部门负责人，管理间接工时→员工所在部门责任人，已建口径为一级汇报人，见
      NOTES 待用户定）
    decision:
    - when: 审批通过
      goto: 4
      p: 0.86
    - when: 审批人退回修改
      goto: 5
      p: 0.1
    - when: 员工撤回本轮或取消审批
      goto: 7
      p: 0.02
      outcome: 已撤回
    - when: otherwise
      goto: 6
      p: 0.02
      outcome: 已驳回
    approval:
      engine: platform.approval
      doc_type: 工时审批
      approver: cost_object_owner
      multi_level: false
      on_reject: 2
      why_human: 判断该员工是否确在所记项目、商机或管理事务上投入了所记工时；系统只能核对工作包授权、请假和标准工时，核对不了实际投入
      escalation_rules:
      - AR-11
      - AR-12
    withdraw:
      to: 7
      outcome: 已撤回
    effort:
      typical_min: 3
      p90_min: 10
    wait:
      typical_h: 6
      p90_h: 30
    cross_bc: []
    permission: 工时单.审批
    page: 审批待办页
    audit: true
    timeout:
      after: P1D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（工时单待审批，含超时提醒与升级）
  - actor: system
    where: automatic
    actor_v1: 项目经理
    command: 通过工时单
    aggregate: AGG-39
    emits:
    - TimesheetApproved
    desc: 审批平台「通过」结果到达后由 B-06 回写；同一结果事件只处理一次，轮次不符的结果忽略；订阅方为同 BC 的认定工时有效性（PRC-91）
    decision:
    - when: otherwise
      goto: 8
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    actor_v1: 项目经理
    command: 退回工时单
    aggregate: AGG-39
    branch: 退回
    emits:
    - TimesheetReturned
    desc: 退回后工时单可改，员工修改后重新提交，轮次加 1；回调事件仍是审批已驳回，结果类型为退回
    decision:
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    audit: true
    notify:
    - to: SH-E3
      how: 企业微信消息（工时单被退回，请修改后重提）
  - actor: system
    where: automatic
    actor_v1: 项目经理
    command: 驳回工时单
    aggregate: AGG-39
    branch: 驳回
    emits:
    - TimesheetRejected
    desc: 驳回为终局，不可再提交；驳回须写原因
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    audit: true
    outcome: 已驳回
    notify:
    - to: SH-E3
      how: 企业微信消息（工时单被驳回及原因）
  - actor: system
    where: automatic
    command: 撤回工时单
    aggregate: AGG-39
    branch: 撤回
    added_in: closeout
    gap: 命令缺（已建代码有撤回本轮与取消审批，聚合稿 AGG-39 命令列无）
    emits:
    - TimesheetApprovalWithdrawn
    desc: 员工在审批期间撤回本轮或取消整个审批，审批平台结束实例后工时单回到草稿，员工可修改后重提；回调事件仍是审批已驳回，结果类型为撤回或取消
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    audit: true
    outcome: 已撤回
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-39
    emits:
    - 工时已过账
    desc: 通过后按过账时锁定的费率版本提交过账候选；缺费率的工时不得计成本，失败并告警（INV-37）；系统自动触账遇目标期间已关账，路由到该法人当前开放期间并标原期间（INV-92，ADR-0045），不拒绝、不设审批
    decision:
    - when: 目标期间已关账（路由当前开放期间并标原期间，不拒绝）
      goto: end
      rule: INV-92
      p: 0.02
      outcome: 已通过
    - when: 缺锁定费率版本（失败并告警，工时单状态不变）
      goto: end
      rule: INV-37
      p: 0.01
      outcome: 已通过
    - when: otherwise
      goto: end
      p: 0.97
      outcome: 已通过
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    - mode: api
      direction: out
      bc: B-02
      name: 过账时读锁定费率版本
    calls: PRC-92
    audit: true
    period_gate: true
    legal_entity: 员工所属法人
    outcome: 已通过
    notify:
    - to: SH-E6
      how: 企业微信消息（工时过账失败，或已路由开放期间并标原期间，供财务核对）
  notes: 以已建 cost.timesheet 为准（状态草稿、已提交、已退回、已通过、已驳回；撤回与取消回到草稿；审批流程 cost_timesheet_approval）。阶段映射已收窄（⑥a 评审 M4）：只留进入或退出条件触及商机、工作包的阶段，去掉 VS-02.7 与 VS-03.2。INV-37 缺费率的工时失败并告警；售前阶段可记工时归集到商机或客户活动（AGG-102）。
- id: PRC-24
  name: 变更项目状态
  trigger:
    type: human
    desc: 项目总监或项目经理按情形发起
  stages:
  - VS-02.0
  - VS-02.1
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.5
  - VS-02.6
  - VS-02.7
  primary_object: OBJ-29
  owner_bc: B-04
  human_orchestration: false
  migration: 全部历史项目的暂停、恢复、终止、取消记录（含原因）迁入（U-4）；投产时处于暂停的项目按「暂停」迁入，暂停起始日取原始时间；已终止、已取消项目只迁结局、原因与时间
  scope: 项目总监与承担部门负责人经办；项目经理、项目成员可见项目状态
  frequency_ref: 待取证 E-B1（经验估计：暂停、终止、取消合计占在执行项目的少数，月均个位数）
  triggers:
  - type: human
    name: 项目总监因故暂停项目
  - type: human
    name: 执行中的项目不再继续履行，直接终止（待 Q09 确认可否不经暂停）
    starts_at: 3
  - type: human
    name: 执行中的项目无任何投入，直接取消（待 Q09 确认可否不经暂停）
    starts_at: 4
  outcomes:
  - 已暂停
  - 已恢复
  - 已终止
  - 已取消
  scenarios:
  - PRC-24-S01
  - PRC-24-S02
  - PRC-24-S03
  - PRC-24-S04
  - PRC-24-S05
  - PRC-24-S06
  - PRC-24-S07
  roles:
  - id: SH-M1
    as: initiator
    org_needs:
      responsibility: 决定暂停、恢复、终止或取消项目并写明原因
      approval_right: 项目状态处置（暂停、恢复、终止、取消）；是否加审随 Q09
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-E2
    as: informed
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E3
    as: informed
    org_needs:
      responsibility: 按工作包编制成果、采集证据、记工时
      approval_right: 无
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  steps:
  - actor: SH-M1
    where: in_system
    actor_v1: 项目总监
    command: 暂停项目
    aggregate: AGG-19
    pending: Q09
    emits:
    - 项目已暂停
    desc: 须写原因；暂停期间拒记工时（INV-39，Q-05）；暂停后按处置情形走恢复、终止或取消，其余保持暂停
    decision:
    - when: 暂停原因消除且继续履行
      goto: 2
      p: 0.5
    - when: 不再继续履行且已有投入
      goto: 3
      p: 0.15
    - when: 不再继续履行且无任何投入
      goto: 4
      p: 0.05
    - when: otherwise
      goto: end
      p: 0.3
      outcome: 已暂停
    effort:
      typical_min: 15
      p90_min: 45
    permission: 项目.暂停
    page: 项目状态处置页
    audit: true
    outcome: 已暂停
    notify:
    - to: SH-E2
      how: 企业微信消息（项目已暂停，暂停期间不能记工时）
    - to: SH-E3
      how: 企业微信消息（项目已暂停，暂停期间不能记工时）
  - actor: SH-M1
    where: in_system
    actor_v1: 项目总监
    command: 恢复项目
    aggregate: AGG-19
    emits:
    - 项目已恢复
    desc: 恢复后回到执行中，工时可继续填报
    decision:
    - when: otherwise
      goto: end
    effort:
      typical_min: 5
      p90_min: 15
    permission: 项目.恢复
    page: 项目状态处置页
    audit: true
    outcome: 已恢复
    notify:
    - to: SH-E3
      how: 企业微信消息（项目已恢复，可继续记工时）
  - actor: SH-M1
    where: in_system
    actor_v1: 项目总监
    command: 终止项目
    aggregate: AGG-19
    branch: 终止
    pending: Q09
    emits:
    - 项目已终止
    desc: 须写原因；已有投入，由 B-07 订阅后做终止清算（PRC-35）；是否经审批待用户定
    decision:
    - when: otherwise
      goto: end
    effort:
      typical_min: 15
      p90_min: 45
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 项目已终止
    permission: 项目.终止
    page: 项目状态处置页
    audit: true
    metric_event: true
    outcome: 已终止
    notify:
    - to: SH-E6
      how: 企业微信消息（项目已终止，需做终止清算）
  - actor: SH-M1
    where: in_system
    actor_v1: 项目总监
    command: 取消项目
    aggregate: AGG-19
    branch: 取消
    pending: Q09
    emits:
    - 项目已取消
    desc: 须写原因；无任何投入时才取消；投入多寡 B-04 不可读（B-07 在下游），由 B-07 订阅后核对（见 NOTES 接缝问题）
    decision:
    - when: otherwise
      goto: end
    effort:
      typical_min: 10
      p90_min: 30
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 项目已取消
    permission: 项目.取消
    page: 项目状态处置页
    audit: true
    metric_event: true
    outcome: 已取消
  notes: 终止与取消须原因，可能经审批，审批未建模（状态机待 Q09），故按非人工编排（⑥a 评审 M1）。状态机与承担法人待 Q09、Q11（Q11 已答：Q-06 一项目一承担法人）。「项目已暂停、已恢复」订阅方仅分析，不写 cross_bc。
  stages_note: 'VS-02.0、VS-02.1、VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6、VS-02.7：终止、取消使项目 OBJ-29 到「已终止 / 已取消」，是 VS-02 ends_in；SD-10 用户已定不设终止段，保留全段标记。恢复到「执行中」支持 VS-02.0。不加 VS-03.1：本流程是服务交付项目的暂停恢复终止取消编排，VS-03.1 段内「执行中」的说明为建立受检项目并开始执行（PRC-17），不据同一项目通用状态扩为检查策划流程。VS-04.5、VS-05.6、VS-13.6 的终止对象分别为协议、供方协议、员工，近似项不补标；入口仍随 Q09。'
- id: PRC-26
  name: 接收并确认发包人提供资料
  trigger:
    type: human
    desc: 发包人提供首批或后续资料
  stages:
  - VS-02.0
  - VS-02.1
  - VS-02.2
  - VS-02.3
  - VS-02.4
  primary_object: OBJ-42
  owner_bc: B-28
  human_orchestration: true
  human_note: 确认或退回缺陷资料，逾期提醒
  migration: 全部历史发包人提供资料记录（含提供日、确认或退回结论、退回原因）迁入（U-4），收件凭证原件作证据迁入；投产时待确认的按「已提供」迁入，已退回待补的按「已退回」迁入
  scope: 按项目的数据范围：项目经理、设计师可见并经办
  frequency_ref: 待取证 E-B1（经验估计：每个项目开工前后集中 1 至 3 批资料，之后零星补充）
  triggers:
  - type: human
    name: 项目经理按交付需要登记所需发包人资料及计划提供日
  - type: human
    name: 发包人主动提供首批或后续资料，项目经理收件
    starts_at: 2
  outcomes:
  - 已确认
  scenarios:
  - PRC-26-S01
  - PRC-26-S02
  - PRC-26-S03
  - PRC-26-S04
  - PRC-26-S05
  roles:
  - id: SH-C6a
    as: external
