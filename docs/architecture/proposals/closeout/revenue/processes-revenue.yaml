    name: 商务发现可索赔事项并提出索赔
  - type: call
    name: PRC-66 结算中双方未能确认最终价款，商务转索赔（H3）
  outcomes:
  - 已提交待答复
  - 索赔已认定
  - 索赔已拒绝
  - 索赔已撤回
  scenarios:
  - PRC-49-S01
  - PRC-49-S02
  - PRC-49-S03
  - PRC-49-S04
  - PRC-49-S05
  - PRC-49-S06
  - PRC-49-S07
  - PRC-49-S08
  roles:
