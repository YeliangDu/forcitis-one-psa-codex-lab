      p90_min: 45
    permission: 满意度调查.登记跟进
    page: 满意度调查跟进页
    audit: true
    outcome: 已跟进
  notes: B-28 → B-04 单向。回访中成果问题归不符合项（来源「客户」），过程问题归项目风险与问题（用户答复 Q-E 第 1 项选 b）。
- id: PRC-38
  name: 编制并发布项目复盘
  trigger:
    type: human
    desc: 项目进入收尾，项目经理编制复盘
  stages:
