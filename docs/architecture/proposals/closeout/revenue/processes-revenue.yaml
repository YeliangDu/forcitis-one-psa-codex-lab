- id: PRC-154
  name: 查看收入三口径对照
  owner_bc: reporting
  stages:
  - VS-04.2
  - VS-04.3
  reads:
  - AGG-23
  - AGG-44
  - AGG-46
  - AGG-13
  desc: 读模型：按协议 × 期间并排显示经营产值（内部管理）、权责收入（客户确认的收入确认行）、开票收入（销项发票），算两两差额与时滞；三口径各自独立，不互相触发。
  events:
  - event: RevenueRecognized
    aggregate: AGG-44
    bc: B-08
  - event: InvoiceIssued
    aggregate: AGG-46
    bc: B-09
  - event: 发票已红冲
    aggregate: AGG-46
    bc: B-09
  - event: 视为同意已成立
    aggregate: AGG-44
    bc: B-08
  query:
    grain: 协议 × 期间（月）
    dimensions:
    - 协议
    - 项目
    - 客户（往来单位）
    - 承担法人
    - 承担部门
    - 业务线
    - 期间
    measures:
    - 经营产值（读 AGG-23 子表 progress_estimates 当期最新一行，管理口径）
    - 权责收入（AGG-44 收入确认行，业务日期 = 认可日）
    - 开票收入（AGG-46 销项发票，蓝字减红冲）
    derived:
    - 权责收入 − 经营产值（确认滞后于进度的部分）
    - 开票收入 − 权责收入（超前开票或确认未开票）
    - 开票收入 − 经营产值
    - 时滞：同一协议经营产值累计达到某额的期间与权责收入、开票累计达到同额的期间之差（月）
    rule: 三口径仅并排展示，不互相折算、不进财务报表；经营产值缺填的期间显示「未填报」，不补零
  refresh: 订阅收入已确认、发票已开具、发票已红冲事件增量更新；经营产值按 api 读取，每日定时全量校正一次
  freshness: 事件到达后分钟级；以每日校正为准
  permission: 收入三口径对照.查看
  page: 收入三口径对照页
  scope: 按承担法人的数据范围：财务与管理层全见；部门负责人见承担部门项目；项目经理见本人项目
  migration: 读模型不迁数据，由迁入后的产值估计行、收入确认行与销项发票重算
  scenarios:
  - PRC-154-S01
  - PRC-154-S02
  - PRC-154-S03
  roles:
  - id: SH-E6
    as: informed
    org_needs:
      responsibility: 核对权责收入与开票收入差额
      approval_right: 无
      department_hint: 财务部
      position_hint: 收入会计、财务负责人
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 看经营产值与收入、开票的差额与时滞，判断确认与开票推进
      approval_right: 无
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-E2
    as: informed
    org_needs:
      responsibility: 查看本人项目三口径差额，推进客户确认与开票
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  notes: 评审 M7；STRUCTURAL_ITEMS S-08。只读、无命令。reporting 订阅 B-08、B-09 事件为 reporting 的既有订阅方式；AGG-23 产值估计无事件，按 api 读取（reporting 对 B-04 的读取边按 §4.1 核对，见 NOTES 接缝问题）。
