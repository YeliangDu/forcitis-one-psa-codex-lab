  primary_object: OBJ-107
  owner_bc: B-04
  human_orchestration: false
  migration: 全部历史项目复盘（含版本链与评审记录）迁入（U-4）；投产时编制中、评审中的按当前状态迁入，已发布的作不可改版本迁入
  scope: 按项目的数据范围：项目成员可见；发布后的复盘供知识提炼，范围按知识库授权（B-30）
  segregation:
