  - actor: system
    where: automatic
    command: 标记协议借阅逾期
    aggregate: AGG-13
    emits:
    - 协议借阅已逾期
    on_time: 预计归还日届满且未归还
    desc: 定时命令，执行方 platform.scheduling（G-04 同类）；事件由 PRC-146 催还；标逾期后继续等待归还
    decision:
    - when: otherwise
      goto: 3
    gap: 命令缺口：SCR 聚合稿 §2.2 的 AGG-13 命令列与事件列均未列「标记协议借阅逾期」「协议借阅已逾期」（回补 NOTES 称已列，待 one-architecture 核对）
  frequency_ref: 待取证（E-B1）；经验估计：每月约 4 笔
