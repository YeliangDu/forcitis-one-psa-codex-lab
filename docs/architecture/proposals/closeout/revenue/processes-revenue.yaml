      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  - id: SH-P1
    as: external
    org_needs:
      responsibility: 外部方，按本流程的交互提供信息、文件或答复
      approval_right: 无（外部方，不设系统权限）
      department_hint: 不适用（外部方）
      position_hint: 不适用（外部方）
  migration: 全部往来单位角色及其准入状态（申请、合格、暂停、停用与原因）与关联资质证书全部迁入（U-4），记迁入来源与原始时间；投产时处于申请中的角色按申请迁入、由财务继续核验；已合格的供应商保留合格日期，不重新准入；客户角色不迁准入状态（P-3）
  scope: 往来单位主数据全企业可读（付款、分包、采购前置读取）；角色准入的经办限财务职能角色，申请人只看到本人提出的申请
  segregation:
  - roles:
    - SH-E2
    - SH-E6
