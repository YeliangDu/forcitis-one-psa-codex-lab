  migration: 我方法人与供方的全部资质证书（类别、等级、有效期、核查与延续记录）全部迁入（U-4），记迁入来源与原始时间；投产时处于核查中或延续中的资质按当前状态迁入，已申请未获批复的延续保留申请受理证据；已过期的资质迁为到期状态
