  - id: SH-E4
    as: reviewer
    org_needs:
      responsibility: 审核检查项结果与证据是否支撑、未检原因是否充分
      approval_right: 同上（检查记录审核）
      department_hint: 承担检查业务的技术部门
      position_hint: 检查负责人（技术专家）
  - id: SH-E3
    as: performer
    org_needs:
      responsibility: 现场检查、采集证据（系统自动关联到检查）、逐项填写并提交检查记录
      approval_right: 无
      department_hint: 承担检查业务的部门
      position_hint: 检查人员（设计师和顾问，含驻场；资质经 B-13 读取）
  - id: SH-C5
    as: informed
    org_needs:
      responsibility: 委托方（保险公司等）接收检查报告与发现，不登录本系统
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: —
  - id: SH-C3
    as: external
    org_needs:
      responsibility: 业主方在现场签认检查记录，不登录本系统
      approval_right: 无（现场签认作证据）
      department_hint: 外部，不在本系统组织内
      position_hint: 业主代表
  - id: SH-X5
    as: external
    org_needs:
      responsibility: 我方为 TIS 专项分包时的上游保险技术检查机构
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: —
  notes: 品控类服务在施工期做的检查同此流程（M-11 施工期类型）。检查报告的编制、校审、签发、送达与客户认可走 PRC-28 同一流程（INV-51 同 BC 前置读不符合项）；检查服务的收入证据为 ADR-0047 第 5 类（检查完成经客户签认，或报告签发；可登记、不触发）。现场采集的照片、视频、量测数据与签认单均作证据，只追加、计内容哈希、记采集时间与地点，不得删改（intent 141725）；证据挂检查由证据关联（AGG-110，S-25
    加挂目标「检查」）记，合同引用为诉讼关联键。我方为 TIS 时负责人兼项受限（INV-56 / P-44）；我方是 TIS 专项分包或直接受托时不受此限（Q30，待用户确认）。检查记录审核保留人工：只留「证据是否支撑结论、未检原因是否充分」的专业判断，机械项已拆为规则（见 NOTES 规则化）。 评审 M8：现场客户签认如何到收入侧，二选一待用户定，建议①现场签认单作为一份交付物经 PRC-28
    第 6 步登记认可（见 NOTES 待用户定）。
  steps:
  - actor: system
    where: automatic
    actor_v1: 检查负责人
    read: true
    reads:
    - AGG-19
    - AGG-33
    - AGG-36
    - AGG-62
    - AGG-34
    desc: 读项目、部位、模板、检查人员资质（P-29，资质不符是写入前预警，不拒绝）
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 读项目
    - mode: api
      direction: out
      bc: B-01
      name: 读受检部位
    - mode: api
      direction: out
      bc: B-13
      name: 读检查人员资质
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 安排检查
    aggregate: AGG-35
    desc: 新建检查，状态已计划（VS-03.1 进入条件；符合性审查 必-6）；选定检查表模板版本、受检部位范围与我方法律角色
    permission: 检查.安排
    page: 检查安排页
    legal_entity: 承担法人
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 指派检查人员
    aggregate: AGG-35
    desc: 已计划 → 已安排；TIS 负责人兼项限制 P-44（INV-56 前置检查，竞态由 P-44 定时复核兜底）
    decision:
    - when: 我方为 TIS 且负责人兼项数超过上限
      goto: 3
      rule: INV-56
      p: 0.03
    - when: otherwise
      goto: 4
      p: 0.97
    permission: 检查.指派
    page: 检查指派页
    audit: true
    effort:
      typical_min: 5
      p90_min: 10
    notify:
    - to: SH-E3
      how: 企业微信待办（已指派现场检查）
  - actor: SH-E3
    where: offline
    actor_v1: 检查人员
    command: 采集证据
    aggregate: AGG-38
    desc: 现场检查：拍照、摄像、量测、填写现场记录并取得客户现场签认；现场可无网络，手机端离线暂存，联网后补传，系统记设备采集时间与服务端接收时间两个时间；上传即计内容哈希，只追加，不可修改或删除（作废只加作废标记）；B-26 → B-28 api。现场客户签认单到收入侧的路径待用户定（M8）：建议①把现场签认单作为一份交付物，经 PRC-28 第 6 步「登记客户认可」在 B-28 登记认可，B-08
      据「交付物已认可」按 ADR-0047 第 5 类确认；备选②第 5 类 (a) 现场签认不单独触发，以报告签发后送达为准
    evidence:
    - 现场照片与视频原件（采集时间、受检部位与坐标、采集人、设备、内容哈希）
    - 量测与检测原始数据（仪器编号、量测时间、量测人）
    - 现场检查记录表与客户现场签认单（ADR-0047 第 5 类证据之一；签认人与签认日）
    - 未能进入部位的原因记录（天气、通行条件、在场人员）
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 采集证据
    permission: 证据.采集
    page: 现场证据采集页
    audit: true
    effort:
      typical_min: 180
      p90_min: 420
    wait:
      typical_h: 24
      p90_h: 72
    pending: M8 检查现场签认到收入侧
  - actor: system
    where: automatic
    added_in: closeout
    command: 关联证据
    aggregate: AGG-110
    desc: 采集证据成功后系统自动把该证据挂到本次检查（挂接目标类型：检查，S-25），关联人取采集人，记合同引用，作诉讼证据的关联性键（intent 141725），不让检查人员重复录入；证据本身不动。B-26 → B-28 api；目标 ID 在 B-28 侧只存、不校验（检查在下游 B-26）
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 关联证据
    audit: true
  - actor: SH-E3
    where: in_system
    actor_v1: 检查人员
    command: 提交检查记录
    aggregate: AGG-35
    desc: 逐项登记检查结果并引用证据；每个检查项须有结果或未检原因（INV-55）；有判定结果的检查项须引用至少一条本检查已关联的证据（拟规则 VS03-01），未检项须选原因类型并写说明；状态到记录已提交
    decision:
    - when: 有检查项既无结果也无未检原因
      goto: 6
      rule: INV-55
      p: 0.06
    - when: 有判定结果的检查项未引用任何证据或未检项未选原因类型
      goto: 4
      rule: 拟规则-VS03-01
      p: 0.06
    - when: otherwise
      goto: 7
      p: 0.88
    permission: 检查记录.提交
    page: 检查记录填报页
    audit: true
    effort:
      typical_min: 45
      p90_min: 120
    timeout:
      after: P3D
      escalate_to: SH-E4
      interrupting: false
    notify:
    - to: SH-E4
      how: 企业微信待办（检查记录已提交，待审核）
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 审核检查记录
    aggregate: AGG-35
    desc: 专业复核（同 PRC-28 校审，不走 platform.approval）：判断检查项结果是否被所引证据支撑、未检原因是否充分；缺项与缺证据已由规则拒绝，提交人与审核人为同一人时拒绝审核
    decision:
    - when: 检查项结果不被证据支撑或未检原因不充分
      goto: 6
      p: 0.15
    - when: otherwise
      goto: 8
      p: 0.85
    approval:
      engine: aggregate
      doc_type: 检查记录审核
      approver: SH-E4
      why_human: 证据是否足以支撑检查结论、未检原因是否合理，需要懂检查标准的人按现场情况判断，系统只能核对「有没有」，不能核对「够不够」。
      on_reject: 6
    permission: 检查记录.审核
    page: 检查记录审核页
    audit: true
    effort:
      typical_min: 30
      p90_min: 90
    wait:
      typical_h: 8
      p90_h: 24
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 锁定检查
    aggregate: AGG-35
    emits:
    - 检查已锁定
    desc: 锁定后只能追加更正，不改原记录（INV-55，ADR-0016 只追加）
    permission: 检查.锁定
    page: 检查锁定页
    audit: true
    metric_event: true
    effort:
      typical_min: 5
      p90_min: 10
    notify:
    - to: SH-E3
      how: 企业微信待办（检查已锁定，可编制检查报告）
  - actor: system
    where: automatic
    added_in: closeout
    command: 封存证据
    aggregate: AGG-38
    desc: 检查锁定后封存本次检查引用的全部证据，封存后不可修改或删除（INV-58）；B-26 → B-28 api；封存时间记入证据
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 封存证据
    audit: true
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 关联检查报告
    aggregate: AGG-35
    desc: 检查报告（AGG-27 交付物）按 PRC-28 编制、校审、签发、送达、客户认可；本步在交付物建立后记其 ID，B-26 → B-28 api，关联记在下游一侧（符合性审查 必-6）
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 关联检查报告（交付物 ID）
    permission: 检查.关联报告
    page: 检查报告关联页
    audit: true
    effort:
      typical_min: 5
      p90_min: 10
    decision:
    - when: otherwise
      goto: end
      outcome: 已锁定
      p: 1.0
  stages_note: 改标：删 VS-03.5，本流程止于检查锁定（VS-03.2 出口）；报告认可由 PRC-28 承担（VS-03.5）。判据：指派检查人员使检查（OBJ-49）到「已安排」，是 VS-03.1 退出；审核、锁定是 VS-03.2 退出；VS-02.6 保留是因品控类施工期检查的 OBJ-49「已锁定」是该段段内状态。字面误判：「封存证据→已封存」是检查证据，VS-02.7
    退出的「已封存」是项目收尾时的证据与交付物封存，不加 VS-02.7
- id: PRC-44
  name: 发布客户资产类不符合项并建议外部检测
  trigger:
    type: event
    events:
    - event: 检查已锁定
      aggregate: AGG-35
    desc: 检查锁定后，检查负责人复核发现
  stages:
  - VS-03.2
  - VS-03.3
  primary_object: OBJ-38
  owner_bc: B-26
  human_orchestration: false
  frequency_ref: 待取证（E-B1）；经验估计：每月 5–15 条客户资产类不符合项
  migration: 在途不符合项按当前状态迁入（已识别、已复核、已发布）；已发布的保留等级体系版本、等级值、部位、整改责任方与证据引用（含证据关联）；已建议的外部检测一并迁入；历史全部迁入（U-4）
  scope: 按项目的数据范围；发现与证据对委托方的可见范围随报告送达，本系统不开放客户登录
  segregation:
  - roles:
    - SH-E3
    - SH-E4
    rule: 不符合项的登记人与复核人不得为同一人
  triggers:
  - type: event
    name: 检查已锁定
    bc: B-26
  - type: human
    name: 现场检查中识别到客户资产类问题，检查人员当场登记
  outcomes:
  - 已发布
  - 已发布并建议外部检测
  - 已关闭
  scenarios:
  - PRC-44-S01
  - PRC-44-S02
  - PRC-44-S03
  - PRC-44-S04
  - PRC-44-S05
  - PRC-44-S06
  - PRC-44-S07
  roles:
  - id: SH-E3
    as: performer
    org_needs:
      responsibility: 登记发现并关联证据
      approval_right: 无
      department_hint: 承担检查业务的部门
      position_hint: 检查人员（设计师和顾问）
  - id: SH-E4
    as: reviewer
    org_needs:
      responsibility: 复核发现是否成立、等级是否恰当，发布并送达，决定是否建议外部检测
      approval_right: 不符合项复核（专业复核，不涉资金，aggregate 内单级）；回避：不得复核本人登记的发现
      department_hint: 承担检查业务的技术部门
      position_hint: 检查负责人（技术专家，持技术委员会资格）
  - id: SH-C5
    as: informed
    org_needs:
      responsibility: 委托方（保险公司等）接收发现，不登录本系统
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: —
  - id: SH-C3
    as: informed
    org_needs:
      responsibility: 业主作为整改责任方接收发现，不登录本系统
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: 业主代表
  - id: SH-X6
    as: informed
    org_needs:
      responsibility: 持证检测机构，受业主委托做第三方检测
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: —
  notes: R-07：不拆聚合，跨 BC 经 api 的代价由本流程体现；来源检查 ID 只作回溯线索。IDI 的等级为正常、轻微、中等、严重、风险保留五级；等级体系按服务类型版本化（见 NOTES 结构问题）。重大险情须记录已报告（INV-52）。发布后的送达必须留送达回执，作诉讼证据。证据挂不符合项由证据关联（AGG-110，S-25 加挂目标「不符合项」）记。复核保留人工：只留「发现是否成立」的专业判断，等级默认取模板映射、证据齐全由规则守（见
    NOTES 规则化）。
  steps:
  - actor: SH-E3
    where: in_system
    actor_v1: 检查人员
    command: 登记不符合项
    aggregate: AGG-28
    desc: 经质量与认可 api 发起，来源检查 ID 只作回溯线索；记等级体系版本与等级值（默认取检查表模板的等级映射，改动须写理由，拟规则 VS03-02）、部位、整改责任方
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 登记不符合项
    permission: 不符合项.登记
    page: 不符合项登记页
    audit: true
    effort:
      typical_min: 20
      p90_min: 45
  - actor: SH-E3
    where: in_system
    added_in: closeout
    command: 关联证据
    aggregate: AGG-110
    desc: 把本次检查采集的证据挂到这条不符合项（挂接目标类型：不符合项，S-25），记合同引用，作诉讼证据关联键；发布前至少一条（INV-50）
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 关联证据
    permission: 证据.关联
    page: 证据关联页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 复核不符合项
    aggregate: AGG-28
    desc: 专业复核：判断发现是否成立、偏离模板映射的等级是否恰当；不成立的走关闭（待用户定）；登记人与复核人为同一人时拒绝复核
    decision:
    - when: 复核认定发现不成立
      goto: 7
      p: 0.1
    - when: otherwise
      goto: 4
      p: 0.9
    approval:
      engine: aggregate
      doc_type: 不符合项复核
      approver: SH-E4
      why_human: 发现是否成立、等级偏离模板映射是否有理，取决于现场情况与检查标准的理解，需要专业判断；证据齐全、等级默认值与回避已由规则处理。
      on_reject: 7
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 复核不符合项
    permission: 不符合项.复核
    page: 不符合项复核页
    audit: true
    effort:
      typical_min: 20
      p90_min: 45
    wait:
      typical_h: 8
      p90_h: 24
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 发布不符合项
    aggregate: AGG-28
    emits:
    - 不符合项已发布
    desc: 发布前至少引用一条证据（INV-50）；重大险情另须记录已报告（INV-52）
    decision:
    - when: 未引用任何证据
      goto: 2
      rule: INV-50
      p: 0.03
    - when: otherwise
      goto: 5
      p: 0.97
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 发布不符合项
    permission: 不符合项.发布
    page: 不符合项发布页
    legal_entity: 承担法人
    audit: true
    metric_event: true
    effort:
      typical_min: 10
      p90_min: 20
  - actor: SH-E4
    where: offline
    added_in: closeout
    gap: 聚合稿 AGG-28 无「登记不符合项送达」类命令，送达回执暂无登记落点（NOTES 命令缺口）；重大险情「已报告」同缺命令（INV-52）
    desc: 把已发布的发现与处置建议书面送达委托方（保险公司、业主等）并取得回执；重大险情当场电话或书面报告并留痕
    evidence:
    - 送达回执：签收单扫描件、快递妥投记录、邮件原始报文（含信头）或平台回执之一
    - 送达日与签收人；重大险情的报告时间、报告对象与方式
    decision:
    - when: 不符合项属客户资产且需第三方检测佐证
      goto: 6
      p: 0.2
    - when: otherwise
      goto: end
      outcome: 已发布
      p: 0.8
    permission: 不符合项.登记送达
    page: 不符合项送达登记页
    audit: true
    effort:
      typical_min: 30
      p90_min: 90
    wait:
      typical_h: 24
      p90_h: 72
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 建议外部检测
    aggregate: AGG-37
    desc: 建议业主委托持证检测机构做第三方检测；检测由业主委托，我方不代签
    permission: 外部检测.建议
    page: 外部检测建议页
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
    decision:
    - when: otherwise
      goto: end
      outcome: 已发布并建议外部检测
      p: 1.0
  - actor: SH-E4
    where: in_system
    added_in: closeout
    command: 关闭不符合项
    aggregate: AGG-28
    branch: 复核不成立
    desc: 复核认定发现不成立的，关闭并写明理由；暂无「作废」命令，用关闭承接（待用户定）
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 关闭不符合项
    permission: 不符合项.关闭
    page: 不符合项复核页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
    decision:
    - when: otherwise
      goto: end
      outcome: 已关闭
      p: 1.0
  stages_note: 判据：登记不符合项使客户资产类 OBJ-38 到「已识别」，是 VS-03.2 段内状态和 VS-03.3 进入条件；发布不符合项是 VS-03.3 退出。字面误判：「关闭不符合项→已关闭」匹到的 VS-02.6 退出限我方成果类，本流程是客户资产类，不加 VS-02.6
- id: PRC-45
  name: 跟踪整改并复查闭合
  trigger:
    type: human
    desc: 业主整改后申报，检查负责人复查
  stages:
  - VS-03.4
  primary_object: OBJ-38
  owner_bc: B-26
  human_orchestration: true
  human_note: 整改申报、复查通过或回整改，反复多轮，逾期提醒（P-23）
  frequency_ref: 待取证（E-B1）；经验估计：每月 5–15 条不符合项进入整改跟踪，平均 1.3 轮
  migration: 在途不符合项按当前状态迁入（整改中、整改已申报），整改期限、历次申报与复查记录、轮次保留；已闭合、客户接受风险、不再跟踪的只迁结局与证据（含证据关联）；历史全部迁入（U-4）
  scope: 按项目的数据范围；整改责任方不登录本系统，申报材料由检查负责人登记
  triggers:
  - type: human
    name: 不符合项已发布，检查负责人开始整改跟踪
  - type: human
    name: 业主提交整改申报材料
  outcomes:
  - 已闭合
  - 客户书面接受风险
  - 已停止跟踪
  scenarios:
  - PRC-45-S01
  - PRC-45-S02
  - PRC-45-S03
  - PRC-45-S04
  - PRC-45-S05
  - PRC-45-S06
  - PRC-45-S07
  - PRC-45-S08
  roles:
  - id: SH-E4
    as: performer
    org_needs:
      responsibility: 开始整改、登记申报、复查、闭合或退回、登记客户接受风险、停止跟踪
      approval_right: 整改复查结论（专业复核，不涉资金，aggregate 内单级）
      department_hint: 承担检查业务的技术部门
      position_hint: 检查负责人（技术专家，持技术委员会资格）
  - id: SH-E4
    as: approver
    org_needs:
      responsibility: 判断整改是否满足该等级不符合项的要求
      approval_right: 同上（整改复查结论）
      department_hint: 承担检查业务的技术部门
      position_hint: 检查负责人（技术专家）
  - id: SH-E3
    as: performer
    org_needs:
      responsibility: 复查时到场或凭资料核验整改结果，采集复查证据（系统自动关联到不符合项）
      approval_right: 无
      department_hint: 承担检查业务的部门
      position_hint: 检查人员（设计师和顾问）
  - id: SH-C3
    as: external
    org_needs:
      responsibility: 整改责任方（业主）：按期整改并书面申报；风险保留时书面确认，不登录本系统
      approval_right: 书面接受风险（线下，委托人代表或授权人）
      department_hint: 外部，不在本系统组织内
      position_hint: 业主代表
  - id: SH-C5
    as: informed
    org_needs:
      responsibility: 委托方（保险公司等）知悉整改与闭合结果，不登录本系统
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: —
  notes: 严重等级未闭合不得签发竣工最终风险评估报告（INV-51，在交付物签发处读）。整改复查结论保留人工专业复核（aggregate 内单级，由 AGG-28 的「闭合不符合项」「退回整改」承载），不涉资金，按 PRC-28 校审同类处理；是否需走 platform.approval 见 NOTES 接缝问题。风险保留须有委托人书面确认；闭合须引用复查或整改证据（INV-50）；复查证据同样只追加、哈希、时间戳（intent
    141725），并经证据关联（AGG-110，目标「不符合项」，记整改轮次）挂到不符合项。
  steps:
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 开始整改
    aggregate: AGG-28
    desc: 已发布 → 整改中；VS-03.4 进入条件（符合性审查 必-6）；通知整改责任方并记整改期限
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 开始整改
    permission: 不符合项.开始整改
    page: 整改跟踪页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
  - actor: SH-E4
    where: offline
    actor_v1: 业主代表
    command: 登记整改申报
    aggregate: AGG-28
    desc: 整改中 → 整改已申报；整改由业主（整改责任方）完成并书面申报，检查负责人收到后在本系统登记（业主无本系统账号）。整改期限按等级与合同约定，无默认值，P14D 为占位
    evidence:
    - 业主整改申报函或整改完成说明（扫描件、邮件原始报文）
    - 整改后现场照片、验收或检测材料（计内容哈希，只追加）
    - 申报日与申报人
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 登记整改申报
    permission: 不符合项.登记整改申报
    page: 整改申报登记页
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
    wait:
      typical_h: 240
      p90_h: 720
    timeout:
      after: P14D
      escalate_to: SH-E4
      interrupting: false
    notify:
    - to: SH-E4
      how: 企业微信待办（整改期限已到仍未申报）
  - actor: SH-E3
    where: offline
    added_in: closeout
    command: 采集证据
    aggregate: AGG-38
    desc: 复查：到场或凭资料核验整改结果，拍照、量测、填复查记录并取得客户签认；证据只追加、计哈希，B-26 → B-28 api
    evidence:
    - 复查现场照片与视频（采集时间、部位与坐标、采集人、内容哈希）
    - 复查量测数据与复查记录表
    - 客户复查签认单（签认人与签认日）
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 采集证据
    permission: 证据.采集
    page: 现场证据采集页
    audit: true
    effort:
      typical_min: 120
      p90_min: 300
    wait:
      typical_h: 48
      p90_h: 120
  - actor: system
    where: automatic
    added_in: closeout
    command: 关联证据
    aggregate: AGG-110
    desc: 采集复查证据成功后系统自动把该证据挂到这条不符合项（挂接目标类型：不符合项，S-25），记提交轮次引用（整改轮次）与合同引用，不让检查人员重复录入
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 关联证据
    audit: true
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 复查检查
    aggregate: AGG-35
    desc: 复查是一次新的检查，经本 BC 检查命令；专业复核整改是否满足要求。未通过时系统自动生成「退回整改」待办，带出原因、新整改期限与轮次加 1（拟规则 VS03-03），不由人另行决定去向
    decision:
    - when: 客户书面接受风险
      goto: 8
      p: 0.05
    - when: 确认不再跟踪
      goto: 9
      p: 0.03
    - when: 复查未通过
      goto: 7
      p: 0.25
    - when: otherwise
      goto: 6
      p: 0.67
    approval:
      engine: aggregate
      doc_type: 整改复查结论
      approver: SH-E4
      why_human: 整改是否真正满足该等级不符合项的要求（含部分整改能否接受），需要结合现场证据与检查标准做专业判断；证据齐全、轮次、期限与未通过后的流转已由规则处理。
      on_reject: 7
    permission: 检查.复查
    page: 整改复查页
    audit: true
    effort:
      typical_min: 30
      p90_min: 60
    wait:
      typical_h: 4
      p90_h: 16
    timeout:
      after: P10D
      escalate_to: SH-E4
      interrupting: false
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 闭合不符合项
    aggregate: AGG-28
    emits:
    - 不符合项已闭合
    desc: 须引用复查或整改证据（INV-50）；复查证据采集时间不早于整改申报日（拟规则 VS03-04）
    decision:
    - when: 未引用复查或整改证据，或复查证据早于整改申报日
      goto: 3
      rule: INV-50
      p: 0.03
    - when: otherwise
      goto: end
      outcome: 已闭合
      p: 0.97
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 闭合不符合项
    permission: 不符合项.闭合
    page: 整改复查页
    audit: true
    metric_event: true
    effort:
      typical_min: 5
      p90_min: 10
    notify:
    - to: SH-E2
      how: 企业微信消息（不符合项已闭合；报告签发前检查 INV-51）
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 退回整改
    aggregate: AGG-28
    branch: 复查未通过
    desc: 整改中；记未通过原因与新整改期限，轮次加 1
    decision:
    - when: otherwise
      goto: 2
      p: 1.0
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 退回整改
    permission: 不符合项.退回整改
    page: 整改复查页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
  - actor: SH-E4
    where: offline
    actor_v1: 检查负责人
    command: 登记客户接受风险
    aggregate: AGG-28
    branch: 客户书面接受风险
    desc: 风险保留须有委托人书面确认；书面确认扫描件作证据登记
    evidence:
    - 委托人或业主书面接受风险函（扫描件、邮件原始报文）
    - 确认日与确认人（须为合同登记的委托人代表或授权人）
    decision:
    - when: otherwise
      goto: end
      outcome: 客户书面接受风险
      p: 1.0
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 登记客户接受风险
    permission: 不符合项.登记客户接受风险
    page: 客户接受风险登记页
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 停止跟踪不符合项
    aggregate: AGG-28
    branch: 不再跟踪
    desc: 原因必填
    decision:
    - when: otherwise
      goto: end
      outcome: 已停止跟踪
      p: 1.0
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 停止跟踪不符合项
    permission: 不符合项.停止跟踪
    page: 整改跟踪页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
- id: PRC-46
  name: 采信外部检测报告
  trigger:
    type: human
    desc: 业主委托外部检测并取得报告
  stages:
  - VS-03.4
  primary_object: OBJ-52
  owner_bc: B-26
  human_orchestration: false
  frequency_ref: 待取证（E-B1）；经验估计：每月 1–4 份外部检测报告
  migration: 在途外部检测按当前状态迁入（已建议、已委托、已登记报告）；已采信或未采信的迁结局、原因与报告证据引用；报告原件与哈希迁入后只引用、不修改；历史全部迁入（U-4）
  scope: 按项目的数据范围；外部检测机构不登录本系统
  triggers:
  - type: human
    name: 业主委托外部检测并取得报告，检查负责人登记
  outcomes:
  - 已采信
  - 未采信
  scenarios:
  - PRC-46-S01
  - PRC-46-S02
  - PRC-46-S03
  - PRC-46-S04
  roles:
  - id: SH-E4
    as: performer
    org_needs:
      responsibility: 登记业主委托与报告，核对出具机构，决定采信与否
      approval_right: 采信决定（技术判断，本人决定，无第二人审批，不涉资金）
      department_hint: 承担检查业务的技术部门
      position_hint: 检查负责人（技术专家，持技术委员会资格）
  - id: SH-C3
    as: external
    org_needs:
      responsibility: 业主委托检测机构并转交报告，不登录本系统
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: 业主代表
  - id: SH-X6
    as: external
    org_needs:
      responsibility: 持证检测机构出具报告
      approval_right: 无
      department_hint: 外部，不在本系统组织内
      position_hint: —
  notes: 外部检测报告只引用、不修改（INV-57）。检测由业主委托，我方只登记与采信。采信是检查负责人本人的技术判断，不是审批，无第二人节点。机构一致由 P-30 预警，内容完整性与技术可采信性是判断。
  steps:
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 登记业主委托外部检测
    aggregate: AGG-37
    desc: 登记业主委托的检测机构、委托日与约定出具期限
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读检测机构
    permission: 外部检测.登记委托
    page: 外部检测登记页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
  - actor: SH-E4
    where: offline
    added_in: closeout
    command: 采集证据
    aggregate: AGG-38
    desc: 收到业主转交的外部检测报告原件，作外部报告类证据采集；证据本身只引用、不修改；B-26 → B-28 api。等待报告期间受约定出具期限约束，未约定时 P30D（待用户定）
    evidence:
    - 外部检测报告原件（电子文件或纸质扫描，计内容哈希）
    - 收到日、转交人与出具机构资质证明
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 采集证据
    permission: 证据.采集
    page: 证据上传页
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
    wait:
      typical_h: 360
      p90_h: 720
    timeout:
      after: P30D
      escalate_to: SH-E4
      interrupting: false
    notify:
    - to: SH-E4
      how: 企业微信待办（外部检测报告超期未取得）
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 登记外部检测报告
    aggregate: AGG-37
    desc: 引用外部检测报告证据（INV-57 只引用）；核对出具机构与业主委托机构一致、报告内容完整；非业主委托机构的报告为 P-30 写入前预警
    decision:
    - when: 报告出具机构为业主委托机构且内容完整
      goto: 4
      rule: P-30
      p: 0.85
    - when: otherwise
      goto: 5
      p: 0.15
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读检测机构
    - mode: api
      direction: out
      bc: B-28
      name: 引用报告证据
    permission: 外部检测.登记报告
    page: 外部检测登记页
    audit: true
    effort:
      typical_min: 20
      p90_min: 45
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 采信外部检测报告
    aggregate: AGG-37
    emits:
    - 外部检测报告已采信
    desc: 采信后检测结论可作为复查与闭合的依据（PRC-45）
    permission: 外部检测.采信
    page: 外部检测采信页
    audit: true
    metric_event: true
    effort:
      typical_min: 10
      p90_min: 20
    decision:
    - when: otherwise
      goto: end
      outcome: 已采信
      p: 1.0
  - actor: SH-E4
    where: in_system
    actor_v1: 检查负责人
    command: 不采信外部检测报告
    aggregate: AGG-37
    branch: 不采信
    emits:
    - 外部检测报告未采信
    desc: 原因必填；非业主委托机构的报告为 P-30 写入前预警
    permission: 外部检测.不采信
    page: 外部检测采信页
    audit: true
    effort:
      typical_min: 10
      p90_min: 20
    decision:
    - when: otherwise
      goto: end
      outcome: 未采信
      p: 1.0
  stages_note: 判据：采信、不采信外部检测报告使 OBJ-52 到「已采信 / 未采信」，是 VS-03.4 段内状态，结局用语与之一致
- id: PRC-47
  name: 起草并回签协议
  trigger:
