      position_hint: 项目总监、部门负责人
  - id: SH-C6b
    as: external
    org_needs:
      responsibility: 客户决策人：回签、认定索赔与变更
      approval_right: 客户方书面决定（线下证据，本系统只登记）
      department_hint: 客户方
      position_hint: 客户决策人（产品、工程负责人）
  steps:
  - actor: system
    where: automatic
    actor_v1: 商务
    read: true
    reads:
    - AGG-30
    - AGG-31
    desc: 读所引用的设计变更与延期申请
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 读所引用的设计变更
    - mode: api
      direction: out
      bc: B-04
      name: 读所引用的延期申请
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 提出索赔
    aggregate: AGG-16
    emits:
    - ClaimAsserted
    desc: 在合同约定时限内发出索赔通知（意向），超时限须注明理由（INV-17）；对方主张的索赔由商务据对方通知登记
    decision:
    - when: 索赔方决定不再主张
      goto: 6
      p: 0.05
    - when: otherwise
      goto: 3
      p: 0.95
    timeout:
      after: 合同约定索赔通知时限（INV-17）；未约定时 P28D 自知道或应当知道索赔事件之日起
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E5
      how: 企业微信待办（P-08 索赔时限临近）
    permission: 索赔.提出
    page: 索赔提出页
    audit: true
    metric_event: true
    effort:
      typical_min: 30
      p90_min: 90
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 提交索赔详细报告
    aggregate: AGG-16
    desc: 提交载明依据、计算与证据的详细报告，超时限须注明理由（INV-17）；对方答复后由商务据书面答复登记结果
    decision:
    - when: 对方认定索赔
      goto: 4
      p: 0.35
    - when: 被索赔方拒绝
      goto: 5
      p: 0.2
    - when: 索赔方撤回
      goto: 6
      p: 0.05
    - when: otherwise
      goto: end
      outcome: 已提交待答复
      p: 0.4
    timeout:
      after: 协议上登记的约定详细报告时限，自发出索赔通知之日起（INV-17，不设缺省天数）
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E5
      how: 企业微信待办（P-08 索赔时限临近）
    permission: 索赔.提交
    page: 索赔提出页
    audit: true
    metric_event: true
    withdraw:
      to: 6
      outcome: 索赔已撤回
    effort:
      typical_min: 60
      p90_min: 180
    wait:
      typical_h: 336
      p90_h: 1344
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 认定索赔
    aggregate: AGG-16
    emits:
    - ClaimSettled
    evidence:
    - 对方书面认定函或签认单扫描件
    - 认定日与认定金额、工期
    decision:
    - when: otherwise
      goto: end
    permission: 索赔.认定
    page: 索赔认定登记页
    outcome: 索赔已认定
    audit: true
    metric_event: true
    effort:
      typical_min: 20
      p90_min: 45
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 拒绝索赔
    aggregate: AGG-16
    branch: 拒绝
    evidence:
    - 被索赔方书面拒绝函
    - 拒绝日与理由
    decision:
    - when: otherwise
      goto: end
    permission: 索赔.拒绝
    page: 索赔拒绝撤回登记页
    outcome: 索赔已拒绝
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 撤回索赔
    aggregate: AGG-16
    branch: 撤回
    desc: 已通知或已提交后由索赔方撤回
    evidence:
    - 索赔方撤回函
    - 撤回日与理由
    decision:
    - when: otherwise
      goto: end
    permission: 索赔.撤回
    page: 索赔拒绝撤回登记页
    outcome: 索赔已撤回
    audit: true
    effort:
      typical_min: 15
      p90_min: 30
  notes: P-08 索赔时限临近提醒。是否补「索赔提交审批」见 NOTES 待用户定（原 D9，仍待定）。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 2 份
- id: PRC-50
