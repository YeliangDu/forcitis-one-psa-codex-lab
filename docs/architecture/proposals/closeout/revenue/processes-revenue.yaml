    emits:
    - 资质已到期
    desc: 到期日届满且未延续，定时标记（执行方 platform.scheduling，G-04 未处理）
    decision:
    - when: otherwise
      goto: end
      outcome: 资质已到期
      p: 1.0
    actor_v1: 系统策略
    audit: true
    outcome: 资质已到期
    notify:
    - to: SH-E6
      how: 企业微信消息（资质已到期未延续）
  notes: 持证方含我方法人，位置见聚合稿 §7 第 3 条。供方资质的核验与登记在「供应商准入与资质核验」，到期或撤销后供应商角色的暂停、停用由财务人工触发（两事件订阅方仅分析）。
  frequency_ref: 待取证（E-B1）；经验估计：我方与供方资质合计每年约 10 次核查或延续
  stages_note: '判据①：核查、延续既有资质（持证方含我方法人）使 OBJ-65 到「有效 / 降级 / 撤销 / 到期」，造出 VS-06.2 退出。不加 VS-01.2：该段 OBJ-65 是投标引用我方资质，本流程办理既有资质年检核查，不含投标引用步骤；不加 VS-05.1：该段为供方初次准入，本流程核查既有证书（原第 5 节口径）。'
- id: PRC-86
  name: 发放、归还与催还员工借款
  trigger:
    type: human
    desc: 员工事前申请借支，审批后财务发放；归还与到期催还是各自独立的实例
  stages:
  - VS-08.1
  primary_object: OBJ-85
  owner_bc: B-09
  human_orchestration: true
  migration: 历史借款、发放、归还与冲抵记录全部迁入（U-4）；投产时未结借款按未结余额与借款人迁入；审批中的借款申请不迁审批实例，由迁入编排模块的一次性离线命令重新发起；迁入后的一次性对账命令按报销 ID 去重补做冲抵（见 PRC-147）
  scope: 按员工所属法人的数据范围：财务经办，员工仅见本人借款（个人信息）
  segregation:
  - roles:
    - SH-E6
    rule: 借款发放经办人与付款执行人不得为同一人（付款在 B-10，具体岗位待用户定）
  - roles:
    - SH-E6
    - SH-M1
    rule: 借款制单、审批、出纳付款三者不得为同一人
  triggers:
  - type: human
    name: 员工事前申请借支（发放实例）
  - type: human
    name: 出纳认领员工归还流水（归还实例）
  - type: human
    name: 财务手工冲抵例外（待用户定 6，可删）
  - type: time
    name: 借款到期日（催还实例）
  outcomes:
  - 借款已发放
  - 借款已结清
  - 借款被拒
  - 已撤回
  - 暂挂待跨年处理
  - 已催还
  scenarios:
  - PRC-86-S01
  - PRC-86-S02
  - PRC-86-S03
  - PRC-86-S04
  - PRC-86-S05
  - PRC-86-S06
  - PRC-86-S07
  - PRC-86-S08
  - PRC-86-S09
  - PRC-86-S10
  - PRC-86-S11
  - PRC-86-S12
  roles:
  - id: SH-E3
    as: initiator
    org_needs:
      responsibility: 员工（任一岗位）事前申请借支
      approval_right: 无
      department_hint: 借款人所在部门
      position_hint: 借款员工
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 作为借款人所在部门的责任人审批借款用途与必要性；到期未还的升级知会
      approval_right: 一级审批（责任人）
      department_hint: 借款人所在部门
      position_hint: 部门负责人
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 登记员工借款发放、认领归还、手工冲抵
      approval_right: 无审批权（经办；发放与付款执行职务分离）
      department_hint: 财务部
      position_hint: 应收会计、出纳
  steps:
  - actor: system
    where: automatic
    actor_v1: 财务
    read: true
    reads:
    - AGG-62
    - AGG-49
    desc: 读借款人与其未结借款；借款规则：有未结借款不得再借、单笔不超限额（拟规则卡）。发放、归还、手工冲抵、到期催还是四种触发，在此分流
    decision:
    - when: 本次触发为出纳认领员工归还流水
      goto: 6
      p: 0.3
    - when: 本次触发为财务手工冲抵
      goto: 9
      p: 0.02
    - when: 本次触发为借款到期检测
      goto: 10
      p: 0.1
    - when: 借款人有未结借款，或申请额超过单笔限额
      goto: end
      rule: 拟规则卡（借款限额与未结余额）
      outcome: 借款被拒
      p: 0.03
    - when: otherwise
      goto: 2
      p: 0.55
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读借款人
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    branch: 发放
    command: 员工借款审批
    gap: 命令：平台任务「员工借款审批」
    desc: 事前审批借款用途与必要性；通过后才登记发放
    approval:
      engine: platform.approval
      doc_type: 员工借款审批单
      approver: cost_object_owner
      owner_object: 借款人所在部门
      why_human: 借款用途是否正当、是否确有必要事前借支，需要借款人所在部门的责任人判断；有无未结借款与限额由规则守卫，不在审批中核对。
      escalation_rules:
      - AR-01
      - AR-02
      - AR-11
      on_reject: end
    decision:
    - when: 审批通过
      goto: 3
      p: 0.92
    - when: 借款人撤回申请
      goto: end
      outcome: 已撤回
      p: 0.02
    - when: otherwise
      goto: end
      outcome: 借款被拒
      p: 0.06
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起员工借款审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 员工借款.审批
    page: 审批待办页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-M1
      how: 企业微信待办（待员工借款审批）
    withdraw:
      to: end
      outcome: 已撤回
    effort:
      typical_min: 10
      p90_min: 30
    wait:
      typical_h: 16
      p90_h: 48
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    branch: 发放
    command: 创建应收
    aggregate: AGG-49
    desc: 员工借款走 OBJ-85「其他应收：员工借款」，INV-76 只限销售应收；审批通过后创建应收并经 B-10「发起付款」（AGG-53，付款用途为员工借款）发起借款付款（M12）
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 发起付款
      filter: 付款用途 = 员工借款
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    legal_entity: 员工所属法人
    permission: 员工借款.发放
    page: 员工借款发放页
    audit: true
    effort:
      typical_min: 10
      p90_min: 25
  - actor: system
    where: external:银行
    actor_v1: 系统
    branch: 发放
    evidence:
    - 借款付款银行回单（由 B-10 付款登记，回传借款付款已成功）
    desc: 订阅 B-10「付款已成功」，只处理付款用途为员工借款的（S-42 接缝；原写「借款付款已成功」）
    cross_bc:
    - mode: event
      direction: in
      bc: B-10
      name: 付款已成功
      filter: 付款用途 = 员工借款，按应收 ID 关联
    gap: 命令缺口：B-09 订阅 B-10「借款付款已成功」后无记录命令（聚合稿 AGG-49 仅在依赖列写事件，命令列无对应），见 NOTES 新用语·命令缺口
    wait:
      typical_h: 4
      p90_h: 24
  - actor: system
    where: automatic
    actor_v1: 系统策略
    branch: 发放
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    added_in: closeout
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 借款已发放
      p: 0.99
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    branch: 归还
    command: 收款认领
    aggregate: AGG-50
    emits:
    - CashReceived
    desc: 员工归还借款，流水行经 B-22 来自银行，同「认领收款并核销应收」
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 读资金账户与流水行
    permission: 收款.认领
    page: 收款认领页
    audit: true
    effort:
      typical_min: 5
      p90_min: 15
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    branch: 归还
    command: 在应收上核销占用
    aggregate: AGG-49
    emits:
    - 应收已结清
    rule: INV-77
    desc: 核销到未结余额为零即已结清；期间已关账时提示并落开放期间、标原期间（INV-92），不拒绝
    period_gate: true
    legal_entity: 员工所属法人
    permission: 应收.核销
    page: 应收核销页
    audit: true
    effort:
      typical_min: 5
      p90_min: 10
  - actor: system
    where: automatic
    actor_v1: 系统策略
    branch: 归还
    command: 提交过账候选
    aggregate: AGG-50
    calls: PRC-92
    period_gate: true
    added_in: closeout
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 借款已结清
      p: 0.99
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    branch: 手工冲抵
    command: 冲抵员工借款
    aggregate: AGG-49
    emits:
    - 应收已结清
    desc: 费用报销冲抵借款的自动路径已移入 PRC-147（S-24）；本步只留自动冲抵未覆盖时的财务手工冲抵例外，依据报销 ID，冲抵限同一法人（M4），是否保留见待用户定 6；期间已关账时提示并落开放期间、标原期间（INV-92），不拒绝
    decision:
    - when: otherwise
      goto: 8
    period_gate: true
    legal_entity: 员工所属法人
    permission: 应收.冲抵员工借款
    page: 员工借款冲抵页
    audit: true
    effort:
      typical_min: 10
      p90_min: 25
  - actor: platform
    where: automatic
    platform_task: true
    branch: 到期催还
    desc: 借款到期仍有未结余额：提醒借款人与财务催还；逾期超过期限的登记争议与处置（PRC-61 同口径），不从工资代扣（Q24，工资支付暂行规定第 15、16 条；审题 VS04-22）
    decision:
    - when: otherwise
      goto: end
      outcome: 已催还
    notify:
    - to: SH-E6
      how: 企业微信待办（员工借款到期未还，请催还）
    - to: SH-M1
      how: 企业微信消息（借款人到期未还借款）
    audit: true
  notes: 借款与报销各自结算（Q24）。收尾评审 H6：借款须经审批平台审批（用途与必要性），有未结借款不得再借与单笔限额做成规则，职务分离写全；M12：发放与归还是两个实例（第 1 步按触发分流），第 3 步向 B-10 发起借款付款，补到期催还。原自动冲抵步移入事件策略 PRC-147。
  frequency_ref: 待取证（E-B1）；经验估计：每月约 5 笔
  human_note: 借款须审批（用途与必要性）；发放与归还是两个实例，到期未还催还
  stages_note: 判据：归还核销使往来款项（OBJ-85，其他应收「员工借款」）到「已结清」，是 VS-08.1 退出。字面误判：匹到的 VS-04.4、VS-05.4、VS-05.5、VS-08.3、VS-13.5 是销售应收、应付、报销、薪酬类型
- id: PRC-140
  name: 借阅协议原件
  trigger:
    type: human
    desc: 员工因投标、诉讼、审计或结算需要借阅已归档的合同原件或复印件
  stages: []
  primary_object: OBJ-05
  primary_object_note: 借阅的是已归档协议原件，借阅流转记在协议档案上（AGG-13 子表），协议状态不变
  owner_bc: B-05
  human_orchestration: true
  migration: 历史借阅登记（借阅人、借出与归还日、经办人）全部迁入（U-4）；投产时未归还的借出按当前状态迁入，预计归还日沿用原值；已逾期的由迁入编排模块的一次性离线命令补发一次「协议借阅已逾期」触发催还（迁入不发事件）
  scope: 按协议承担法人的数据范围：档案管理人经办，借阅人仅见本人借阅
  segregation:
  - roles:
    - SH-E2
    - SH-E6
    rule: 借阅人与登记借出的档案管理人不得为同一人
  triggers:
  - type: human
    name: 员工提交合同借阅申请
  outcomes:
  - 借阅申请被驳回
  - 借出被拒
  - 已归还
  - 已撤回
  scenarios:
  - PRC-140-S01
  - PRC-140-S02
  - PRC-140-S03
  - PRC-140-S04
  - PRC-140-S05
  - PRC-140-S06
  - PRC-140-S07
  - PRC-140-S08
  roles:
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 因投标、诉讼、审计或结算申请借阅合同
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E5
    as: initiator
    org_needs:
      responsibility: 因投标、诉讼或结算申请借阅合同
      approval_right: 无
      department_hint: 市场与商务部门
      position_hint: 商务经理
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 作为借阅人所在部门的责任人审批借阅
      approval_right: 一级审批（责任人）
      department_hint: 借阅人所在部门
      position_hint: 部门负责人
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 登记借出与归还，管理原件
      approval_right: 无审批权（经办；与借阅人职务分离）
      department_hint: 行政或档案部门
      position_hint: 档案管理员
  notes: 新增流程（C-4「借阅迁入通用审批」，intent 144943）；按 S-22 删「申请借阅协议」，借阅申请（目的、形式、预计归还日）作 platform.approval 载荷，审批通过后 B-05 订阅结果执行「登记协议借出」；归还逾期的催还见事件策略 PRC-146。
  steps:
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    desc: 借阅人选已归档协议，在审批载荷中写借阅目的、借阅形式（原件 / 复印件）与预计归还日；审批人为借阅人所在部门负责人（待用户定）
    approval:
      engine: platform.approval
      doc_type: 合同借阅审批
      approver: cost_object_owner
      owner_object: 借阅人所在部门
      why_human: 借阅目的（投标、诉讼、审计、结算）是否正当、是否确需借出原件而非复印件，需要借阅人所在部门的责任人判断；协议是否已归档、原件是否已外借由规则守卫。
      escalation_rules:
      - AR-11
      on_reject: end
    decision:
    - when: 审批通过
      goto: 2
      p: 0.92
    - when: 借阅人撤回申请
      goto: end
      outcome: 已撤回
      p: 0.02
    - when: otherwise
      goto: end
      outcome: 借阅申请被驳回
      p: 0.06
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起合同借阅审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 合同借阅.申请
    page: 合同借阅申请页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-M1
      how: 企业微信待办（待合同借阅审批）
    withdraw:
      to: end
      outcome: 已撤回
    effort:
      typical_min: 15
      p90_min: 40
    wait:
      typical_h: 8
      p90_h: 48
  - actor: SH-E6
    where: offline
    command: 登记协议借出
    aggregate: AGG-13
    gap: 新用语：聚合稿 AGG-13 已列（S-22），词表待登记
    evidence:
    - 借阅人签收的借出单（借出日、原件或复印件、份数）
    - 合同借阅审批实例编号
    desc: B-05 订阅平台审批结果后由档案管理人登记借出；须引用已通过的审批实例（INV-125）；复印件不受未归还限制
    decision:
    - when: 协议未归档，或同一份原件已有未归还的借出
      goto: end
      rule: INV-125
      outcome: 借出被拒
      p: 0.03
    - when: otherwise
      goto: 3
      p: 0.97
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    permission: 协议借阅.登记借出
    page: 协议借出登记页
    audit: true
    metric_event: true
    notify:
    - to: SH-E2
