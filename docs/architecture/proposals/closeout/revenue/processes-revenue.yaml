    gap: 新用语：命令「登记发包人书面同意」（AGG-15 命令列只有提出、评估、生效、确认现场签证；H4）
    approval:
      engine: external
      doc_type: 发包人书面同意
      approver: SH-C6a
      why_human: 变更以发包人书面指令、补充协议或变更确认单为准，是否同意是发包人的决定，本系统只登记证据。
    evidence:
    - 发包人书面同意：补充协议、变更确认单或书面指令扫描件
    - 同意日与同意人（发包人代表或授权人）
    desc: 内部审批通过后向发包人提出变更，取得书面同意后才能生效；发包人拒绝或逾期未答复则变更不生效，基线与额度不变
    decision:
    - when: 发包人拒绝，或逾期未答复
      goto: end
      outcome: 变更未获发包人同意
      p: 0.1
    - when: otherwise
      goto: 6
      p: 0.9
    permission: 协议变更.登记发包人同意
    page: 发包人同意登记页
    audit: true
    timeout:
      after: 合同约定答复期；未约定时 P30D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E5
      how: 企业微信待办（变更待发包人书面同意）
    effort:
      typical_min: 20
      p90_min: 45
    wait:
      typical_h: 168
      p90_h: 720
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 生效协议变更
    aggregate: AGG-15
    emits:
    - ChangeOrderApproved
    desc: 引用已登记的发包人书面同意；无同意不得生效
    decision:
    - when: otherwise
      goto: 8
    permission: 协议变更.生效
    page: 协议变更生效页
    audit: true
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    effort:
      typical_min: 5
      p90_min: 10
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 确认现场签证
    aggregate: AGG-15
    branch: 签证
    emits:
    - SiteVisaConfirmed
    evidence:
    - 发包人代表签认的签证单扫描件
    - 签认日与签认人
    decision:
    - when: 发包人代表拒签，或逾期未签认
      goto: end
      outcome: 签证被拒签
      p: 0.08
    - when: otherwise
      goto: 8
      p: 0.92
    permission: 协议变更.确认签证
    page: 现场签证登记页
    audit: true
    timeout:
      after: 合同约定签认期；未约定时 P14D
      escalate_to: SH-M1
      interrupting: false
    effort:
      typical_min: 20
      p90_min: 45
    wait:
      typical_h: 48
      p90_h: 168
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 应用变更
    aggregate: AGG-13
    on_event:
    - aggregate: AGG-15
      event: ChangeOrderApproved
    - aggregate: AGG-15
      event: SiteVisaConfirmed
    emits:
    - 新基线已生效
    desc: 订阅协议变更生效与签证确认（同 BC）；按变更 ID 幂等
    outcome: 新基线已生效
    rule: INV-07
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 新基线已生效
    metric_event: true
    audit: true
  notes: 生效后只能经协议变更产生新基线（INV-07、16）；B-08 订阅新基线更新开票与收入额度（PRC-51）。收尾评审 H4：内部审批通过只是「可以向发包人提出」，变更须取得发包人书面同意（第 5 步）才生效；现场签证发包人拒签有出口。
  segregation:
  - roles:
    - SH-E5
    - SH-M1
    rule: 变更提出人与审批人不得为同一人
  frequency_ref: 待取证（E-B1）；经验估计：每月约 8 份
- id: PRC-49
  name: 提出并认定索赔
  trigger:
    type: human
    desc: 对方或我方出现可索赔事项，在时限内通知
  stages:
  - VS-04.6
  - VS-04.5
  stages_note: 'SD-02：新段 VS-04.6「完成合同履行」，索赔在本段重入，不再挂 VS-04.1。判据：认定 / 拒绝 / 撤回使索赔（OBJ-10）到「已认定 / 已拒绝 / 撤回」，是 VS-04.6 段内状态；保留 VS-04.5：结算中双方未能确认最终价款时转索赔（PRC-66，H3），并入最终价款确认。VS-04.2–.4 与索赔无关'
  primary_object: OBJ-10
  owner_bc: B-05
  human_orchestration: true
  human_note: 已通知 → 已提交 → 已认定 / 已拒绝 / 已撤回，通知与详细报告两道时限
  migration: 已提出的索赔及其认定结果、时限与证据全部迁入（U-4）；投产时已提交未答复的索赔按当前状态迁入，时限从原通知日续算（时限提醒由迁入编排的一次性离线命令重建待办）
  scope: 按承担法人与项目承担部门的数据范围
  triggers:
