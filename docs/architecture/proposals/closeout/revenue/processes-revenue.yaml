    command: 登记客户退回
    aggregate: AGG-27
    branch: 退回
    emits:
    - AcceptanceReturned
    desc: 退回意见作证据登记；轮次加 1，修改后重新报送、审查期从新送达日重算（ADR-0047 第 5 条第 5 点）
    decision:
    - when: otherwise
      goto: 2
    effort:
      typical_min: 15
      p90_min: 30
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: AcceptanceReturned
    calls: PRC-33
    permission: 交付物.登记退回
    page: 客户退回登记页
    audit: true
  - actor: SH-E2
    where: in_system
    evidence:
    - 往来函件检索记录（范围、条件、时间、结果）
    - 期限计算快照与声明人
    actor_v1: 项目经理
    command: 登记项目经理的无异议声明
    aggregate: AGG-27
    branch: 无异议声明
    emits:
    - 无异议已声明
    desc: 期满后项目经理检索往来函件，声明期满前未收到书面异议，检索记录作证据；交付侧不判期满，期满判定与视为同意认定在 B-08（ADR-0049 决定 1、5）；财务复核在收入确认审批中（ADR-0047 U-2 (a)）
    decision:
    - when: otherwise
      goto: end
      p: 1.0
      outcome: 已声明无异议
    effort:
      typical_min: 30
      p90_min: 90
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 无异议已声明
    calls: PRC-33
    permission: 交付物.声明无异议
    page: 无异议声明页
    audit: true
    outcome: 已声明无异议
    notify:
    - to: SH-E6
      how: 企业微信消息（待财务在收入确认审批中复核）
  notes: 合并原 PRC-29。检查报告走同一流程（INV-51 同 BC 前置读不符合项）；已发布版本不可改，只出新版本（INV-46）。交付侧不判断视为同意，期满判定在 B-08（D-8）。订阅方 B-08、B-05。
  stages_note: 字面误判：结局「已认可」「已声明无异议」即 exit_common 的 OBJ-35「已认可」/「已声明」（VS-02.1–.6 经 pattern 引用）；VS-03.5 退出为 OBJ-35「已签发 → 已认可」，报告类交付物走同一流程
- id: PRC-30
  name: 提出并批准完工估算
  trigger:
    type: human
    desc: 项目总监在各阶段门处更新成本
  stages:
  - VS-02.0
  - VS-02.1
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.5
  - VS-02.6
  - VS-02.7
  primary_object: OBJ-33
  owner_bc: B-04
  human_orchestration: false
  migration: 全部历史完工估算版本（ETC、EAC、提出人与批准人、批准日）迁入（U-4）；投产时待批准的估算按「已提出」迁入；估算只作项目管理，不迁入任何收入或过账
  scope: 项目总监、项目经理、承担部门负责人与财务可见；EAC 含成本，限管理层与财务
  segregation:
  - roles:
    - SH-M1
    - SH-M1
    rule: 完工估算的提出人与批准人不得为同一人（项目总监提出的由部门负责人批准）
  frequency_ref: 待取证 E-B1（经验估计：每个在执行项目每个阶段门 1 次）
  triggers:
  - type: human
    name: 项目总监在阶段门处更新完工估算
  outcomes:
  - 已批准
  scenarios:
  - PRC-30-S01
  - PRC-30-S02
  - PRC-30-S03
  - PRC-30-S04
  roles:
  - id: SH-M1
    as: initiator
    org_needs:
      responsibility: 批准完工估算（项目总监，类型级；与提出人须不同人）
      approval_right: 完工估算批准：一级
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 批准完工估算（项目总监，类型级；与提出人须不同人）
      approval_right: 完工估算批准：一级
      department_hint: 承接项目的业务部门或事业部
      position_hint: 部门负责人、项目总监
  - id: SH-E2
    as: informed
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  steps:
  - actor: SH-M1
    where: in_system
    actor_v1: 项目总监
    command: 提出完工估算
    aggregate: AGG-23
    desc: 录入 ETC 与 EAC（实际成本从成本看板读，不经聚合读取）；EAC 超过已锁定预算预警（P-19），只警不拦；估算不用于收入确认（G-1，依赖禁止）
    effort:
      typical_min: 60
      p90_min: 180
    permission: 完工估算.提出
    page: 完工估算编制页
    notify:
    - to: SH-M1
      how: 企业微信消息（EAC 超过预算，P-19 预警）
  - actor: SH-M1
    where: in_system
    actor_v1: 项目总监
    command: 批准完工估算
    aggregate: AGG-23
    emits:
    - 完工估算已批准
    desc: 聚合内批准，不走审批平台（AGG-23 不引用 platform.approval）；批准人与提出人须不同人
    decision:
    - when: 批准
      goto: end
      p: 0.85
      outcome: 已批准
    - when: otherwise
      goto: 1
      p: 0.15
    approval:
      engine: aggregate
      doc_type: 完工估算批准
      approver: SH-M1
      multi_level: false
      on_reject: 1
      why_human: 判断完工估算（ETC、EAC）是否合理可信；估算不进入收入确认，系统只能在超预算时预警（P-19），合理性须责任人判断
      escalation_rules: []
      note: engine 为 aggregate 的聚合内批准，approver 写类型级 SH 角色，不写 escalation_rules；原 AR-11（责任人即申请人）改由 segregation（提出人与批准人不得同一人）和聚合内校验承担
    effort:
      typical_min: 30
      p90_min: 90
    wait:
      typical_h: 24
      p90_h: 72
    permission: 完工估算.批准
    page: 完工估算批准页
    audit: true
    outcome: 已批准
  notes: 完工估算不用于收入确认（聚合稿 §1.4 G-1，依赖禁止）；P-19 EAC 超预算预警。每期估进度的「管理产值」（用户答复：只作内部管理产值）暂放 AGG-23 内只追加子表 progress_estimates（Q04_STORAGE.md），其填报与复核命令聚合稿没有，本流程不含，见 NOTES 结构问题。
  stages_note: 'SD-13 已写回：提出、批准完工估算使 OBJ-33 到「提出 / 已批准 / 已驳回」，该段内状态已列于 VS-02.0、VS-02.1、VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6、VS-02.7；按步骤实际到达的「已提出 / 已批准」补标 VS-02.0、VS-02.1、VS-02.7，段内不作门。其他对象「已批准」近似项不补标。'
- id: PRC-31
  name: 提出并发出设计变更
  trigger:
    type: human
    desc: 设计、发包人或现场原因引起设计变更
  stages:
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.5
  - VS-02.6
  primary_object: OBJ-40
  owner_bc: B-28
  human_orchestration: false
  migration: 全部历史设计变更（含归因、影响、发出通知与待主张标记、不主张理由）迁入（U-4）；投产时处于提出、内审、已发出未关闭的按当前状态迁入，已发出变更的发出证据原件作证据迁入
  scope: 按项目的数据范围：设计师、技术专家、项目经理可见并经办；合同侧只读引用（P-24）
  segregation:
  - roles:
    - SH-E3
    - SH-E4
    rule: 变更提出人与内审人不得为同一人
  frequency_ref: 待取证 E-B1（经验估计：设计项目中常见，每个项目数次，月均数十次）
  triggers:
  - type: human
    name: 设计、发包人或现场原因引起设计变更，设计师发起
  outcomes:
  - 已关闭
  - 已撤销
  scenarios:
  - PRC-31-S01
  - PRC-31-S02
  - PRC-31-S03
  - PRC-31-S04
  - PRC-31-S05
  - PRC-31-S06
  roles:
  - id: SH-E3
    as: initiator
    org_needs:
      responsibility: 按工作包编制成果、采集证据、记工时
      approval_right: 无
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  - id: SH-E4
    as: reviewer
    org_needs:
      responsibility: 认定变更归因与影响并内审
      approval_right: 设计变更内审（专业复核）
      department_hint: 技术委员会或总工办
      position_hint: 技术专家、专业负责人、审核人
  - id: SH-E2
    as: performer
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 客户方项目或设计管理，出具书面认可、批准与答复
      approval_right: 无（外部方）
      department_hint: 客户方设计或项目管理部门（外部）
      position_hint: 客户项目负责人、发包人代表（外部）
  steps:
  - actor: SH-E3
    where: in_system
    actor_v1: 设计师和顾问
    command: 提出设计变更
    aggregate: AGG-30
    desc: 写变更内容与涉及的交付物、部位
    effort:
      typical_min: 30
      p90_min: 120
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 关联项目
    permission: 设计变更.提出
    page: 设计变更编辑页
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 认定变更归因与影响
    aggregate: AGG-30
    desc: 归因必填（INV-54），归因分类与返工认定共用一套原因语言
    decision:
    - when: 归因与影响已填写
      goto: 3
      rule: INV-54
      p: 0.9
    - when: otherwise
      goto: 2
      p: 0.1
    effort:
      typical_min: 15
      p90_min: 45
    permission: 设计变更.认定归因
    page: 设计变更归因页
    audit: true
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 内审设计变更
    aggregate: AGG-30
    desc: 内部技术审核，聚合内裁定，不走审批平台
    decision:
    - when: 内审通过
      goto: 4
      p: 0.85
    - when: otherwise
      goto: 1
      p: 0.15
    approval:
      engine: aggregate
      doc_type: 设计变更内审
      approver: SH-E4
      multi_level: false
      on_reject: 1
      why_human: 变更方案对其他专业和已出成果的影响，以及归因是否站得住，是专业判断，系统无法代替；聚合内专业复核，不是费用审批
    effort:
      typical_min: 30
      p90_min: 120
    wait:
      typical_h: 24
      p90_h: 72
    permission: 设计变更.内审
    page: 设计变更内审页
    audit: true
  - actor: SH-E2
    where: offline
    evidence:
    - 设计变更通知单（盖章扫描件或邮件原始报文）
    - 发包人签收回执与发出日
    actor_v1: 项目经理
    command: 发出设计变更
    aggregate: AGG-30
    emits:
    - 设计变更已发出
    desc: 项目经理按合同通知条款向发包人发出，回执作证据；合同侧的协议变更、索赔单向引用设计变更 ID
    decision:
    - when: 发包人原因且增加工作量
      goto: 5
      p: 0.3
    - when: otherwise
      goto: 6
      p: 0.7
    effort:
      typical_min: 30
      p90_min: 90
    wait:
      typical_h: 48
      p90_h: 120
    cross_bc:
    - mode: api
      direction: in
      bc: B-05
      name: 协议变更引用设计变更
    calls: PRC-33
    permission: 设计变更.发出
    page: 设计变更发出登记页
    audit: true
    metric_event: true
    withdraw:
      to: 7
      outcome: 已撤销
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 标记待主张
    aggregate: AGG-30
    desc: 发包人原因且增加工作量时标待主张，或写明不主张的理由（P-24）；未被协议变更或索赔引用也未写理由的由 reporting 检查（交付不读合同）
    decision:
    - when: otherwise
      goto: 6
    effort:
      typical_min: 15
      p90_min: 30
    permission: 设计变更.标记待主张
    page: 设计变更主张标记页
    audit: true
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 关闭设计变更
    aggregate: AGG-30
    desc: 变更执行完毕，相关交付物已按变更修订
    effort:
      typical_min: 5
      p90_min: 15
    permission: 设计变更.关闭
    page: 设计变更关闭页
    audit: true
    outcome: 已关闭
    decision:
    - when: otherwise
      goto: end
      outcome: 已关闭
  - command: 撤销设计变更
    aggregate: AGG-30
    actor: SH-E2
    where: in_system
    added_in: closeout
    permission: 设计变更.撤销
    page: 设计变更页
    audit: true
    effort:
      typical_min: 5
      p90_min: 15
    desc: S-37：设计变更发出后线下撤销的，登记撤销原因与依据，只追加撤销记录、不删原记录
    decision:
    - when: otherwise
      goto: end
      outcome: 已撤销
  notes: 合同侧的协议变更、索赔单向引用设计变更 ID；交付不读合同。「不主张」没有独立命令，同「标记待主张」按参数记（见 NOTES 新用语）。
  stages_note: 贯穿 VS-02.2、VS-02.3、VS-02.4、VS-02.5、VS-02.6：判据：设计变更（OBJ-40）「关闭」是 VS-02 贯穿活动「变更、延期与风险」的产出；字面误判：结局「已关闭」无对象名，未匹到 OBJ-40
- id: PRC-32
