      responsibility: 客户方项目或设计管理，出具书面认可、批准与答复
      approval_right: 无（外部方）
      department_hint: 客户方设计或项目管理部门（外部）
      position_hint: 客户项目负责人、发包人代表（外部）
  - id: SH-E2
    as: initiator
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E3
    as: reviewer
    org_needs:
      responsibility: 核对发包人资料的完整性与可用性，确认或退回
      approval_right: 发包人资料确认（专业核对）
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  steps:
  - actor: SH-E2
    where: in_system
    command: 登记资料需求
    aggregate: AGG-32
    branch: 登记需求
    added_in: closeout
    gap: 命令缺（P-26 要求逾期未提供提醒，需先登记所需资料与计划提供日）
    desc: 按交付需要登记所需资料清单与计划提供日，作为逾期提醒的依据
    effort:
      typical_min: 10
      p90_min: 30
    permission: 发包人资料.登记需求
    page: 发包人资料需求页
    timeout:
      after: 计划提供日
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（发包人资料计划提供日已过，请催提）
  - actor: SH-E2
    where: offline
    evidence:
    - 收件凭证：发包人资料清单签收单、邮件原始报文或网盘交接记录之一
    - 提供日与提供人（发包人代表或授权人）
    actor_v1: 项目经理
    command: 登记资料已提供
    aggregate: AGG-32
    desc: 发包人线下或经邮件、网盘提供资料，项目经理登记提供日并留收件凭证
    effort:
      typical_min: 10
      p90_min: 30
    wait:
      typical_h: 72
      p90_h: 240
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 关联项目
    calls: PRC-33
    permission: 发包人资料.登记提供
    page: 发包人资料登记页
    audit: true
  - actor: SH-E3
    where: in_system
    actor_v1: 设计师和顾问
    command: 确认发包人资料
    aggregate: AGG-32
    emits:
    - 发包人资料已确认
    desc: 设计师核对资料完整性与可用性；合格确认，有缺陷退回；聚合内裁定，不走审批平台
    decision:
    - when: 资料合格
      goto: end
      p: 0.8
    - when: otherwise
      goto: 4
      p: 0.2
    approval:
      engine: aggregate
      doc_type: 发包人资料确认
      approver: SH-E3
      multi_level: false
      on_reject: 4
      why_human: 判断发包人提供的资料是否完整、可用于设计，属专业核对，系统只能记录结论
    effort:
      typical_min: 30
      p90_min: 120
    permission: 发包人资料.确认
    page: 发包人资料确认页
    audit: true
    outcome: 已确认
  - actor: SH-E3
    where: in_system
    actor_v1: 设计师和顾问
    command: 退回发包人资料
    aggregate: AGG-32
    branch: 退回（资料有缺陷）
    emits:
    - 发包人资料已退回
    desc: 写明缺陷与补充要求，通知发包人补充；缺陷资料影响进度的，项目经理另行发起延期申请
    decision:
    - when: 缺陷资料影响进度且需发包人答复延期
      goto: PRC-32
      p: 0.3
    - when: otherwise
      goto: 2
      p: 0.7
    effort:
      typical_min: 15
      p90_min: 40
    permission: 发包人资料.退回
    page: 发包人资料确认页
    audit: true
    notify:
    - to: SH-E2
      how: 企业微信消息（发包人资料被退回，请通知发包人补充）
  notes: 资料不合格是设计变更与延期的起因；P-26 逾期未提供提醒。
  stages_note: 'SD-14 已写回：确认与退回发包人资料使 OBJ-42 到「已确认 / 有缺陷（退回）」，是 VS-02.0、VS-02.1、VS-02.2、VS-02.3、VS-02.4 的段内状态，保留这些段；「已提供」是收件状态，不再只靠阶段进入条件归段。其他对象的确认状态近似项不补标。'
- id: PRC-28
  name: 编制、评审并签发交付物，送达并登记客户认可
  trigger:
    type: human
    desc: 设计师按工作包编制成果
  stages:
  - VS-02.1
  - VS-02.2
  - VS-02.3
  - VS-02.4
  - VS-02.5
  - VS-02.6
  - VS-03.5
  primary_object: OBJ-35
  owner_bc: B-28
  human_orchestration: true
  human_note: 校审不通过须整改后复审；客户审查期、退回修改、轮次与无异议声明
  merged_from:
  - PRC-29
  migration: 历史交付物、提交轮次、送达、认可、退回与声明记录全部迁入（U-4），记迁入来源与原始时间；投产时在途的交付物按当前状态迁入（编制中、校审中、已签发待送达、已送达待答复），已送达待答复的从原送达日续算审查期
  scope: 按项目的数据范围：项目成员可见并经办本项目交付物；签发限持证注册执业人员
  frequency_ref: 待取证 E-B1（经验估计：每个项目每阶段数份至数十份交付物，另有检查报告）
  triggers:
  - type: human
    name: 工作包待出成果，设计师开始编制
  outcomes:
  - 已认可
  - 已声明无异议
  - 未签发
  - 认可登记被拒
  scenarios:
  - PRC-28-S01
  - PRC-28-S02
  - PRC-28-S03
  - PRC-28-S04
  - PRC-28-S05
  - PRC-28-S06
  - PRC-28-S07
  - PRC-28-S08
  - PRC-28-S09
  - PRC-28-S10
  - PRC-28-S11
  roles:
  - id: SH-E3
    as: initiator
    org_needs:
      responsibility: 按工作包编制成果、采集证据、记工时
      approval_right: 无
      department_hint: 承接项目的业务部门（专业所、设计室）
      position_hint: 设计师、咨询顾问
  - id: SH-E4
    as: reviewer
    org_needs:
      responsibility: 逐级校对、审核、审定交付物
      approval_right: 交付物内部校审（专业复核）
      department_hint: 技术委员会或总工办
      position_hint: 技术专家、专业负责人、审核人
  - id: SH-E7
    as: approver
    org_needs:
      responsibility: 在资格范围内签发交付物并负专业责任
      approval_right: 交付物签发（须持证且专业、等级相符）
      department_hint: 技术部门
      position_hint: 注册建筑师、注册工程师等注册执业人员
  - id: SH-E2
    as: performer
    org_needs:
      responsibility: 经营项目的计划、预算、交付推进与客户沟通
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-C6a
    as: external
    org_needs:
      responsibility: 书面认可、退回或答复交付物
      approval_right: 交付物认可（客户方，外部）
      department_hint: 客户方设计或项目管理部门（外部）
      position_hint: 客户项目负责人、发包人代表（外部）
  - id: SH-C6e
    as: external
    org_needs:
      responsibility: 客户方使用者，接收成果并反馈
      approval_right: 无（外部方）
      department_hint: 客户方设计或工程管理（外部）
      position_hint: 客户设计管理、工程管理人员（外部）
  - id: SH-E6
    as: informed
    org_needs:
      responsibility: 财务核算、收入确认复核与清算知会
      approval_right: 无
      department_hint: 财务部
      position_hint: 财务经理、会计
  - id: SH-M1
    as: approver
    org_needs:
      responsibility: 项目总监：审核本项目交付物校审结论
      approval_right: 交付物校审（类型级）
      department_hint: 业务部门
      position_hint: 项目总监
  steps:
  - actor: system
    where: automatic
    actor_v1: 设计师和顾问
    read: true
    reads:
    - AGG-19
    - AGG-20
    - AGG-66
    desc: 读项目、阶段与签发人执业证书（INV-47）
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 读项目与阶段
    - mode: api
      direction: out
      bc: B-13
      name: 读签发人执业证书
