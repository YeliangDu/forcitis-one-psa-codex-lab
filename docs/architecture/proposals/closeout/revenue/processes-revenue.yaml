    decision:
    - when: 存在阻断性不符合项，登记被拒
      goto: end
      rule: INV-48
      p: 0.03
      outcome: 认可登记被拒
    - when: otherwise
      goto: end
      rule: INV-48
      p: 0.97
      outcome: 已认可
    approval:
      doc_type: 交付物客户认可
      approver: SH-C6a
      engine: external
      multi_level: false
      on_reject: 7
      why_human: 客户认可是客户方的书面意思表示（签收单、审查同意意见、确认邮件或阶段签认），发生在系统外，本系统只登记认可材料与认可日作证据，签认人身份由系统按合同登记核对。
    effort:
      typical_min: 10
      p90_min: 30
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 交付物已认可
    - mode: event
      direction: out
      bc: B-05
      name: 交付物已认可
    calls: PRC-33
    permission: 交付物.登记认可
    page: 客户认可登记页
    audit: true
    metric_event: true
    outcome: 已认可
  - actor: SH-E2
