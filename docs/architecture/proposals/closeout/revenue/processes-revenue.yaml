    desc: 读报销人未结借款，按报销金额与未结借款取小者冲抵（可为零）；依据报销 ID；净额 = 核定金额 − 冲抵额（S-16、S-17）；冲抵限同一法人：借款按员工所属法人，报销按承担法人（Q-06），两者不同则冲抵额为零并告警，避免用 B 法人的应付冲 A 法人的借款（M4）
    decision:
    - when: 员工无未结借款，冲抵额为零
      goto: 3
      p: 0.65
    - when: 借款所属法人与报销承担法人不同，冲抵额为零并告警
      goto: 3
      rule: 拟规则 FIN-R1（冲抵限同一法人）
      p: 0.05
    - when: otherwise
      goto: 2
      p: 0.3
    period_gate: true
    rule: INV-77
    cross_bc:
    - mode: event
      direction: in
      bc: B-12
      name: 费用报销已核定
    - mode: api
      direction: out
      bc: B-13
      name: 读借款人
    audit: true
    notify:
    - to: SH-E6
      how: 企业微信消息（借款法人与报销承担法人不同，未冲抵，请核对）
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    desc: 期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: 净额为零
      goto: 4
      p: 0.05
    - when: otherwise
      goto: 3
      p: 0.94
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  - actor: system
    where: automatic
    command: 确认应付
    aggregate: AGG-52
    emits:
    - 应付已确认
    desc: 按净额确认应付，来源为该费用报销（S-17）；B-10 调用失败则重试并告警，冲抵不回滚，按报销 ID 幂等
    decision:
    - when: otherwise
      goto: end
      outcome: 应付已确认
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 确认应付
    audit: true
  - actor: system
    where: automatic
    branch: 净额为零
    command: 标记费用报销已付
    aggregate: AGG-59
    desc: 结清方式「借款冲抵」（S-19）；使报销不停在「已核定」；调用失败则重试并告警，按报销 ID 幂等
    cross_bc:
    - mode: api
      direction: out
      bc: B-12
      name: 标记费用报销已付
    audit: true
    decision:
    - when: otherwise
      goto: end
      outcome: 报销已置已付
  scenarios:
  - PRC-147-S01
  - PRC-147-S02
  - PRC-147-S03
  - PRC-147-S04
  - PRC-147-S05
  - PRC-147-S06
  - PRC-147-S07
  notes: S-24：原 PRC-87 第 8–10 步独立为本策略。过账跨 BC（B-16），画服务任务，不用调用活动。
  outcomes:
  - 应付已确认
  - 报销已置已付
  - 暂挂待跨年处理
  frequency_ref: 待取证（E-B1）；经验估计：每月约 30 次
- id: PRC-148
  name: 收入确认审批通过后占用转实并提交过账
  pending: Q-04
  trigger:
    type: event
    events:
    - event: 审批已通过
      aggregate: platform.approval
    - event: 审批已驳回
      aggregate: platform.approval
  stages:
  - VS-04.2
  primary_object: OBJ-81
  primary_object_note: 审批通过后收入确认到「已确认（锁定）」并提交过账；OBJ-81 形态待定（Q20、Q-04）
  owner_bc: B-08
  migration: 历史确认事实不经本策略；占用与审批实例不迁入（ADR-0036 第 5 条），投产时处于审批中的收入确认由迁入编排模块的一次性离线命令重新占用并发起审批（PRC-53），通过后在新系统按本策略转实，驳回释放
  triggers:
  - type: event
    name: 审批已通过（单据类型：收入确认审批）
    publisher: platform.approval
  - type: event
    name: 审批已驳回（单据类型：收入确认审批）
    publisher: platform.approval
  steps:
  - actor: system
    where: automatic
    branch: 审批通过
    command: 追加收入确认事实并占用转实
    reads:
    - AGG-92
    aggregate: AGG-44
    emits:
    - RevenueRecognized
    gap: 新用语：「追加收入确认事实」「占用转实」随 Q-04
    desc: 按审批结果分流：驳回转第 3 步释放占用；通过时同一事务内：同一事务内：二次校验额度（RULE-222）→ 追加不可改确认事实（金额、认可日与期间、证据引用、审批实例、规则版本）→ 占用转实；业务日期取认可日（视为同意路径取期满日，待用户定）；按审批实例幂等；二次校验失败则不转实并告警，占用保持待处置；确认事实与过账事实不同事务；二次校验失败转第 4 步由财务负责人人工处置
    decision:
    - when: 审批已驳回
      goto: 3
      p: 0.1
    - when: 二次校验失败（额度不足或证据已失效）
      goto: 4
      rule: RULE-222
      p: 0.01
    - when: otherwise
      goto: 2
      p: 0.89
    rule: INV-23
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    - mode: api
      direction: out
      bc: B-28
      name: 读证据
    - mode: api
      direction: out
      bc: B-13
      name: 读承担法人
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    branch: 审批通过
    command: 提交过账候选
    aggregate: AGG-44
    calls: PRC-92
    period_gate: true
    desc: 提交过账候选（B-08 → B-16 api；实现上由事件发布登记表异步投递，日对账兜底）；期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2，M3）
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: otherwise
      goto: end
      outcome: 收入确认事实已过账
      p: 0.99
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  - actor: system
    where: automatic
    branch: 审批驳回
    command: 释放收入额度占用
    aggregate: AGG-44
    gap: 新用语：「释放收入额度占用」随 Q-04
    desc: 驳回后释放占用，不留确认事实；按审批实例幂等；通知项目经理补证据或另案处理
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    notify:
    - to: SH-E2
      how: 企业微信消息（收入确认审批被驳回）
    audit: true
    decision:
    - when: otherwise
      goto: end
      outcome: 占用已释放
  - actor: SH-E6
    where: in_system
    branch: 转实失败处置
    command: 释放收入额度占用
    aggregate: AGG-44
    gap: 新用语：「释放收入额度占用」「重新发起收入确认审批」随 Q-04（M14）
    desc: 二次校验失败后占用保持待处置，由财务负责人人工处置：释放占用，或补证据后重新发起审批（回到 PRC-53）；占用不自动释放，以保留原审批实例的追溯
    decision:
    - when: 处置为释放占用
      goto: end
      outcome: 占用已释放
      p: 0.6
    - when: otherwise
      goto: PRC-53
      outcome: 已重新发起审批
      p: 0.4
    permission: 收入确认.处置占用
    page: 占用待处置页
    audit: true
    timeout:
      after: P5D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（收入确认转实失败，请处置占用）
    effort:
      typical_min: 20
      p90_min: 60
    wait:
      typical_h: 48
      p90_h: 120
  scenarios:
  - PRC-148-S01
  - PRC-148-S02
  - PRC-148-S03
  - PRC-148-S04
  - PRC-148-S05
  - PRC-148-S06
  - PRC-148-S07
  - PRC-148-S08
  notes: 随 Q-04：用户若不选 C，本策略撤销。审批结果回调写 cross_bc event in platform.approval（审批已通过 / 审批已驳回），触发列表保留单据类型便于阅读（低 8）。M14：二次校验失败后由财务负责人人工处置（第 4 步）。
  outcomes:
  - 收入确认事实已过账
  - 占用已释放
  - 已重新发起审批
  - 暂挂待跨年处理
  roles:
  - id: SH-E2
    as: informed
    org_needs:
      responsibility: 收到收入确认审批被驳回的通知，补证据或另案处理
      approval_right: 无
      department_hint: 承接项目的业务部门
      position_hint: 项目经理
  - id: SH-E6
    as: performer
    org_needs:
      responsibility: 二次校验失败后人工处置占用：释放，或补证据后重新发起审批
      approval_right: 无审批权（经办；财务负责人处置）
      department_hint: 财务部
      position_hint: 财务负责人
  - id: SH-M1
    as: informed
    org_needs:
      responsibility: 占用处置超期的升级知会（财务负责人的上级）
      approval_right: 无
      department_hint: 事业部或区域
      position_hint: 总经理
  frequency_ref: 待取证（E-B1）；经验估计：每月约 25 次
  stages_note: SD-08：本流程出口结局由「收入已确认」改为「收入确认事实已过账」（outcomes、decision.outcome、scenarios PRC-148-S01 同改）；过账经 B-16 过账管道（PRC-92）完成。VS-04.2 退出现为「缺对象状态」（MS-17），脚本不能匹配，故仍报不支持，待对象状态定后复跑。近似项（审批已通过）是不同对象撞名，不改
- id: PRC-150
  name: 冲减应收款项
  added_in: closeout
  trigger:
    type: event
    events:
    - event: 发票已红冲
      aggregate: AGG-46
  stages:
  - VS-04.4
  primary_object: OBJ-85
  owner_bc: B-09
  migration: 历史红冲对应的应收冲减随历史应收迁入（U-4），不重复发事件；投产时红冲已发生未冲减的，由迁入编排模块的一次性离线命令对已迁入的红字发票补做冲减（按红冲发票 ID 幂等）
  triggers:
  - type: event
    name: 发票已红冲
    publisher: B-08
  outcomes:
  - 应收已冲减
  - 已转预收或待退
  - 应收未找到
  - 暂挂待跨年处理
  steps:
  - actor: system
    where: automatic
    command: 冲减应收
    aggregate: AGG-49
    gap: 新用语：命令「冲减应收」（AGG-49 无；订阅「发票已红冲」后冲减对应蓝字发票产生的应收未结余额）
    desc: 按红冲发票引用的蓝字发票找到应收，冲减未结余额；按红冲发票 ID 幂等；找不到对应应收则失败并告警，不静默跳过
    decision:
    - when: 找不到蓝字发票对应的应收
      goto: end
      outcome: 应收未找到
      p: 0.01
    - when: 红冲额超过应收未结余额（已收款后再红冲）
      goto: 2
      p: 0.07
    - when: otherwise
      goto: 3
      p: 0.92
    cross_bc:
    - mode: event
      direction: in
      bc: B-08
      name: 发票已红冲
    audit: true
  - actor: system
    where: automatic
    branch: 已收款后再红冲
    command: 转预收或待退
    aggregate: AGG-49
    gap: 新用语：命令「转预收或待退」（已核销部分转预收，或待退给购买方，AGG-49 无）
    desc: 未结余额部分冲减，已核销部分转预收（重开发票时使用）或待退（退款经 B-10 付款），并通知财务处理
    decision:
    - when: otherwise
      goto: 3
    notify:
    - to: SH-E6
      how: 企业微信待办（发票红冲时应收已部分收款，请处理退款或重开发票）
    audit: true
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    desc: 期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝；原期间所在年度已年结的暂挂并告警（待 ADR-0045 U-2）
    rule: INV-92
    decision:
    - when: 原期间所在年度已年结
      goto: end
      rule: ADR-0045 U-2（待定）
      outcome: 暂挂待跨年处理
      p: 0.01
    - when: 红冲额超过未结余额，已转预收或待退
      goto: end
      outcome: 已转预收或待退
      p: 0.07
    - when: otherwise
      goto: end
      outcome: 应收已冲减
      p: 0.92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  roles:
  - id: SH-E6
    as: informed
    org_needs:
      responsibility: 收到已收款后红冲的待办，处理退款或重开发票
      approval_right: 无
      department_hint: 财务部
      position_hint: 应收会计
  notes: 收尾评审 H7：PRC-58 发出「发票已红冲」，B-09 此前无订阅反应，应收虚高并使账龄与催收（PRC-61）误报；本策略补冲减。已收款后再红冲：已核销部分转预收或待退，退款经 B-10 付款。
  scenarios:
  - PRC-150-S01
  - PRC-150-S02
  - PRC-150-S03
  - PRC-150-S04
  - PRC-150-S05
  - PRC-150-S06
  - PRC-150-S07
  frequency_ref: 待取证（E-B1）；经验估计：每月约 3 次
- id: PRC-179
  name: 项目开始执行后协议转入履行中
  owner_bc: B-05
  stages:
  - VS-04.6
  primary_object: OBJ-05
  triggers:
  - type: event
    name: 项目已开始执行
    publisher: B-04
  - type: event
    name: 合同—项目关联已登记
    publisher: B-05
  migration: 迁入不发事件：投产时由迁入编排按迁入项目的执行状态直接写协议状态（ADR-0036 第 5 条），本策略不补跑
  scenarios:
  - PRC-179-S01
  - PRC-179-S02
  - PRC-179-S03
  - PRC-179-S04
  steps:
  - command: 开始履行协议
    aggregate: AGG-13
    actor: system
    where: automatic
    added_in: closeout
    cross_bc:
    - mode: event
      direction: in
      bc: B-04
      name: 项目已开始执行
    - mode: api
      direction: out
      bc: B-04
      name: 读关联项目是否已开始执行
    decision:
    - when: 该项目未关联已生效的协议，或（关联登记触发时）关联项目尚未开始执行
      goto: end
      outcome: 无需处理
      p: 0.1
    - when: 关联协议已在履行中或之后状态
      goto: end
      outcome: 无需处理
      p: 0.3
    - when: otherwise
      goto: end
      outcome: 协议已转入履行中
      p: 0.6
    desc: S-33：经合同—项目关联（INV-09，生效期内）找到已生效的协议，转入履行中；一份协议关联多个项目时任一项目开始执行即转；按协议 ID 幂等，重复事件不重复转换；先立项后签约的情形：协议回签后登记合同—项目关联时（同 BC 事件）读关联项目状态，已在执行即转入履行中，否则等项目开始执行事件
  notes: S-42 接缝承接：AGG-19「项目已开始执行」订阅方 B-05；B-05 → B-04 边已加事件方式（cb39fc65）
  stages_note: '按 one-architecture 已有裁定保留 VS-04.6：项目开始执行后，协议由「已签署生效」转「履行中」，承接 VS-04.6 进入状态的履约反应。不加 VS-02.0：项目「执行中」是本策略读取的触发状态，本策略只改协议、不造启动段退出对象状态；跨价值流共享状态不据此把协议履约反应归为项目启动。不加 VS-04.1：协议已签署生效由 PRC-47 回签造出。'
