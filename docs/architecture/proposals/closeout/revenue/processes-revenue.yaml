    page: 项目复盘发布页
    audit: true
    metric_event: true
    outcome: 已发布
  notes: 报价只存复盘 ID，不回读（§7 第 19 条）；知识提炼由 B-04 经 api 调 B-30（PRC-107），不是事件订阅。
- id: PRC-41
  name: 制定并生效检查计划
  trigger:
    type: event
    events:
    - event: 协议已生效
      aggregate: AGG-13
    desc: 协议回签生效后，检查负责人制定周期检查计划
  stages:
  - VS-03.1
  primary_object: OBJ-48
  owner_bc: B-26
  human_orchestration: false
  frequency_ref: 待取证（E-B1）；经验估计：每月 3–8 份含 IDI 检查服务的协议回签
  migration: 在途检查计划按当前状态迁入（已登记、生效），到期日与来源协议引用保留；已标记不再受托的只迁结局与标记原因；历史计划全部迁入（U-4）。不接老系统，迁入对账以生产数据为证据
  scope: 按承担部门的数据范围：检查负责人可见并经办本部门受托协议的检查计划；委托方（保险公司等）不登录本系统
  triggers:
  - type: event
    name: 协议已生效
    bc: B-05
  outcomes:
  - 计划已生效
  - 不再受托
  - 无需检查计划
  scenarios:
  - PRC-41-S01
  - PRC-41-S02
  - PRC-41-S03
  - PRC-41-S04
  - PRC-41-S05
  roles:
  - id: SH-E4
    as: initiator
    org_needs:
      responsibility: 对受托 IDI 检查的计划负责：协议回签后制定并生效检查计划，到期前判断是否续做或停止受托
      approval_right: 无（登记、生效、标记不再受托均为本人经办，不是审批）
      department_hint: 承担检查业务的技术部门
      position_hint: 检查负责人（技术专家，持技术委员会资格）
  - id: SH-E5
    as: informed
    org_needs:
      responsibility: 收到计划到期知会后跟进续做线索（另起「登记并跟进线索」）
      approval_right: 无
      department_hint: 市场与客户经营部门
      position_hint: 市场和客户经理
  - id: SH-E2
    as: informed
    org_needs:
