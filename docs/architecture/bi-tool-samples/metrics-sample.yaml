# 小样用的指标目录（合成样例，不是正式口径）。OAT 符号 COLL 为样例自拟，OAT 正本中没有「回款」原语，正式目录以 glossary/oat/ 为准。
# 与选项无关的共同指标目录（合成样例）。M 编号取自 METRIC_BASELINE_DRAFT.md；X-xx 为样例内部辅助指标（提议，不在基线）。
# 每个指标带 OAT 声明字段；`sql` 段是供「目录 → SQL」编译器（选项 B/C）使用的机器可读定义。
parameters:
  daily_std_hours: {default: 7.5, override_by: legal_entity_code, overrides: {LE-2: 8.0}}   # M-42 / X-03
  aging_buckets: ["1:<=45", "2:45-90", "3:90-180", "4:180-365", "5:>365"]
dimensions:
  bu:           {expr: "b.bu_code"}
  period:       {expr: "f.period_key"}
  aging_bucket: {expr: "CASE WHEN p.month_end - f.invoice_date <= 45 THEN '1:<=45' WHEN p.month_end - f.invoice_date <= 90 THEN '2:45-90' WHEN p.month_end - f.invoice_date <= 180 THEN '3:90-180' WHEN p.month_end - f.invoice_date <= 365 THEN '4:180-365' ELSE '5:>365' END", only_tables: [fact_ar_snapshot]}
metrics:
  - id: M-08
    oat_symbol: REV
    term: 收入确认（不含税）
    unit: CNY
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: receivables.wip
    accounting_basis: accrual
    tax_policy: ex_tax
    policy_version: "2026.1"
    formula: "SUM(fact_revenue.amount_ex_tax)，按单据日期所在期间"
    sql: {kind: additive, table: fact_revenue, measure: "f.amount_ex_tax", agg: sum}
  - id: M-10
    oat_symbol: BILL
    term: 开票金额（含税）
    unit: CNY
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: receivables.wip
    accounting_basis: cash
    tax_policy: inc_tax
    policy_version: "2026.1"
    formula: "SUM(fact_invoice.amount_inc_tax)，按开票日所在期间"
    sql: {kind: additive, table: fact_invoice, measure: "f.amount_inc_tax", agg: sum}
  - id: M-11
    oat_symbol: COLL
    term: 回款（全部方式）
    unit: CNY
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: receivables.collection
    accounting_basis: cash
    tax_policy: inc_tax
    policy_version: "2026.1"
    formula: "SUM(fact_collection.amount)，回款方式含现金、商票、工抵、保理"
    sql: {kind: additive, table: fact_collection, measure: "f.amount", agg: sum}
  - id: M-12
    oat_symbol: CASH_COLL
    term: 现金回款
    unit: CNY
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: receivables.collection
    accounting_basis: cash
    tax_policy: inc_tax
    policy_version: "2026.1"
    formula: "SUM(fact_collection.amount) WHERE method = 现金"
    sql: {kind: additive, table: fact_collection, measure: "f.amount", agg: sum, where: "f.method = '现金'"}
  - id: M-13
    oat_symbol: AR
    term: 应收账款余额
    unit: CNY
    period_type: instant
    aggregation_rule: sum_over_dimensions_not_time
    fact_owner_bc: receivables.collection
    accounting_basis: accrual
    tax_policy: inc_tax
    policy_version: "2026.1"
    formula: "SUM(fact_ar_snapshot.balance)，期末快照；不跨期间求和"
    sql: {kind: additive, table: fact_ar_snapshot, measure: "f.balance", agg: sum}
  - id: M-14
    oat_symbol: AR_GT_N
    term: 账龄超 N 天应收
    unit: CNY
    period_type: instant
    aggregation_rule: sum_over_dimensions_not_time
    fact_owner_bc: receivables.collection
    accounting_basis: accrual
    tax_policy: inc_tax
    policy_version: "2026.1"
    formula: "SUM(balance) WHERE 期末日 - 开票日 > 90（N=90，参数）"
    sql: {kind: additive, table: fact_ar_snapshot, measure: "f.balance", agg: sum, where: "p.month_end - f.invoice_date > 90"}
  - id: M-15
    oat_symbol: AR_OVERDUE
    term: 逾期应收（过了到期日）
    unit: CNY
    period_type: instant
    aggregation_rule: sum_over_dimensions_not_time
    fact_owner_bc: receivables.collection
    accounting_basis: accrual
    tax_policy: inc_tax
    policy_version: "2026.1"
    formula: "SUM(balance) WHERE 期末日 > 约定到期日"
    sql: {kind: additive, table: fact_ar_snapshot, measure: "f.balance", agg: sum, where: "p.month_end > f.due_date"}
  - id: M-38
    oat_symbol: AVG_HEADCOUNT
    term: 平均在册人数
    unit: headcount
    period_type: duration
    aggregation_rule: semi_additive_avg_over_time_sum_over_org
    fact_owner_bc: organization.workforce
    accounting_basis: none
    tax_policy: none
    policy_version: "2026.1"
    formula: "(月初在册 + 月末在册) / 2；跨月取平均"
    sql: {kind: additive, table: fact_headcount, measure: "(f.opening_headcount + f.closing_headcount) / 2.0", agg: avg}
  - id: M-40
    oat_symbol: PLAN_TARGET
    term: 计划目标值
    unit: CNY
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: operations.planning
    accounting_basis: none
    tax_policy: follows_target_metric
    policy_version: "2026.1"
    formula: "SUM(fact_target.amount) 取该 目标类型 × 指标 × BU × 期间 的最新版本"
    params: {target_type: {enum: [budget, commitment, challenge]}, target_metric: {enum: [M-01, M-08, M-10, M-11, M-12]}}
    sql:
      kind: additive
      table: fact_target
      measure: "f.amount"
      agg: sum
      where: "f.target_type = '{target_type}' AND f.metric_code = '{target_metric}' AND f.version = (SELECT MAX(t.version) FROM reporting.fact_target t WHERE t.target_type = f.target_type AND t.metric_code = f.metric_code AND t.bu_key = f.bu_key AND t.period_key = f.period_key)"
  - id: M-41
    oat_symbol: ACH_RATE
    term: 目标达成率（按目标类型）
    unit: ratio
    period_type: duration
    aggregation_rule: ratio_of_sums
    fact_owner_bc: operations.planning
    accounting_basis: none
    tax_policy: follows_actual_metric
    policy_version: "2026.1"
    formula: "实际指标 ÷ M-40(目标类型)；分母为 0 时空值"
    params: {actual_metric: {enum: [M-08, M-10, M-11, M-12]}, target_type: {enum: [budget, commitment, challenge]}}
    sql:
      kind: ratio
      numerator: {metric: "$actual_metric"}
      denominator: {metric: M-40, params: {target_type: "$target_type", target_metric: "$actual_metric"}}
  - id: M-42
    oat_symbol: UR
    term: 利用率
    unit: ratio
    period_type: duration
    aggregation_rule: ratio_of_sums
    fact_owner_bc: cost.timesheet
    accounting_basis: none
    tax_policy: none
    policy_version: "2026.1"
    formula: "可计费工时 ÷ (平均在册人数 × 工作日数 × 日标准工时)；日标准工时默认 7.5，按法人覆盖"
    sql:
      kind: ratio
      numerator: {metric: X-02}
      denominator: {metric: X-03}
  - id: M-45
    oat_symbol: LCOM
    term: 人工成本产出倍数
    unit: ratio
    period_type: duration
    aggregation_rule: ratio_of_sums
    fact_owner_bc: organization.payroll
    accounting_basis: none
    tax_policy: follows_numerator_metric
    policy_version: "2026.1"
    formula: "分子(收入确认 / 开票 / 回款) ÷ 人工成本(X-01)"
    params: {numerator_metric: {enum: [M-08, M-10, M-11]}}
    sql:
      kind: ratio
      numerator: {metric: "$numerator_metric"}
      denominator: {metric: X-01}
  # ---- 样例内部辅助指标（提议；不在基线，OAT 字段同样齐全） ----
  - id: X-01
    oat_symbol: LABOR_COST
    term: 人工成本
    unit: CNY
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: organization.payroll
    accounting_basis: accrual
    tax_policy: none
    policy_version: "2026.1"
    formula: "SUM(fact_labor_cost.amount)"
    sql: {kind: additive, table: fact_labor_cost, measure: "f.amount", agg: sum}
  - id: X-02
    oat_symbol: HRS_BILLABLE
    term: 可计费工时
    unit: hour
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: cost.timesheet
    accounting_basis: none
    tax_policy: none
    policy_version: "2026.1"
    formula: "SUM(hours) WHERE category = billable"
    sql: {kind: additive, table: fact_timesheet, measure: "f.hours", agg: sum, where: "f.category = 'billable'"}
  - id: X-03
    oat_symbol: HRS_CAPACITY
    term: 标准产能工时
    unit: hour
    period_type: duration
    aggregation_rule: sum
    fact_owner_bc: cost.timesheet
    accounting_basis: none
    tax_policy: none
    policy_version: "2026.1"
    formula: "平均在册人数 × 工作日数 × 日标准工时（参数 daily_std_hours）"
    sql: {kind: additive, table: fact_headcount, measure: "(f.opening_headcount + f.closing_headcount) / 2.0 * p.working_days * {daily_std_hours}", agg: sum}
