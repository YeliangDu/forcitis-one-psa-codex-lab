  evidence: 一次更新同时更正代码、更名、声明状态（启用/停用）；对应规划命令 更名法人主体、启用法人主体、停用法人主体（AGG-60），代码更正规划无对应；定稿（one-architecture）：代码更正只在该代码未发号时允许（numberUsage.hasIssuedNumbers），与 INV-59 一致，规划缺「更正法人代码」命令
