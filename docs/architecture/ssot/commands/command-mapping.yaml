# 已建命令类 ↔ 规划命令 CMD 对照（手写登记；sonnet 提议，one-architecture 定稿 2026-10-21）
meta:
  status: proposal
  reviewed_by: one-architecture
entries:
- class: ApplyApprovalResult
  module: cost.timesheet
  built_aggregate: cost.timesheet/Timesheet
  commands:
  - CMD-d74fa4f4
  - CMD-aa440308
  - CMD-b5d15940
  - CMD-410b7add
  relation: spans
  evidence: 消费审批完成事件，按结果调用通过/驳回/退回/取消，更新工时单状态；对应规划命令 通过工时单、驳回工时单、退回工时单、撤回工时单（AGG-39），一个类跨四条
- class: CancelTimesheet
  module: cost.timesheet
  built_aggregate: cost.timesheet/Timesheet
  commands:
  - CMD-410b7add
  relation: part-of
  evidence: 结束整个审批，工时单回到草稿；规划命令 撤回工时单（AGG-39）的审批结果含「撤回或取消」，本类是其取消分支
- class: GetTimesheet
  module: cost.timesheet
  built_aggregate: cost.timesheet/Timesheet
  commands: []
  relation: none
  evidence: 查询，不是命令；读取工时单不加锁
- class: SubmitTimesheet
  module: cost.timesheet
  built_aggregate: cost.timesheet/Timesheet
  commands:
  - CMD-690cf279
  - CMD-ed4192c8
  relation: spans
  evidence: 按工作日新建或修订工时单草稿并提交（发布提交事件后启动审批）；对应规划命令 起草工时单 与 提交工时单（AGG-39），一个类跨两条
- class: WithdrawTimesheet
  module: cost.timesheet
  built_aggregate: cost.timesheet/Timesheet
  commands:
  - CMD-410b7add
  relation: same
  evidence: 结束当前审批轮次，工时单在审批结果事件到达后变更；对应规划命令 撤回工时单（AGG-39）的撤回分支
