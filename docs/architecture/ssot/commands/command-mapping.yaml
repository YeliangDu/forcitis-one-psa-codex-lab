- class: EndLegalEntityAttribution
  module: organization.workforce
  built_aggregate: organization.workforce/LegalEntityAttribution
  commands: []
  relation: none
  evidence: 终止某主体的当前归属（设结束日）；AGG-117 规划只有指定与更正两条，无终止命令（指定命令的「期间止（可空）」可能覆盖，待定稿时核）；定稿（one-architecture）：规划 AGG-117 只有指定、更正两条，「终止法人归属」是规划缺口，非对照错误，转 one-arch-people 补规划命令
