        department_hint: 客户方
        position_hint: 客户项目或设计管理负责人
      - responsibility: 出具外部证据：竣工验收证书、结算审定书、缺陷责任期终止证书
        approval_right: 客户方书面文件（线下证据，本系统只登记）
        department_hint: 客户方
        position_hint: 客户项目或设计管理负责人
