        approval_right: 客户方财务确认（经税务平台或银行回单）
        department_hint: 客户方财务
        position_hint: 客户财务付款经办
      groups:
      - revenue
    SH-C6e:
      positions:
      - 待岗位体系定
      org_needs:
      - responsibility: 客户方使用者，接收成果并反馈
        approval_right: 无（外部方）
        department_hint: 客户方设计或工程管理（外部）
        position_hint: 客户设计管理、工程管理人员（外部）
      groups:
      - revenue
    SH-E1:
      positions:
      - 待岗位体系定
      org_needs:
      - responsibility: 提出本部门招聘需求
        approval_right: 无（提出人不得批准自己的需求）
        department_hint: 用人部门
        position_hint: 用人经理（职能：对本部门用人需求负责）
      - responsibility: 面试评价并作出录用决定
        approval_right: 作出录用决定（自行决定，不另设审批，V-8 待定）
        department_hint: 用人部门
        position_hint: 用人经理（职能：对所辖用人决定负责）
      - responsibility: 知悉新员工入职与任职
        approval_right: 无
        department_hint: 用人部门
        position_hint: 用人经理
      - responsibility: 编制并确认试用期绩效评估
        approval_right: 无
        department_hint: 用人部门
        position_hint: 用人经理（职能：试用期评估人）
      - responsibility: 知悉下属补卡
        approval_right: 无（补卡不设审批，由次数与时限规则守卫）
        department_hint: 员工所在组织单元
        position_hint: 部门负责人、用人经理
      - responsibility: 作为申请人所在组织单元的责任人，判断异常请假能否离岗
        approval_right: 正常一级审批（cost_object_owner 解析结果）；超阈值时 AR-11、AR-12 加审
        department_hint: 员工所在组织单元
        position_hint: 部门负责人、用人经理
      - responsibility: 知悉下属加班登记，也可代员工登记；补休额度到期前收到提醒，与员工排定补休
        approval_right: 无（加班不设审批，由打卡核实）
        department_hint: 员工所在组织单元
        position_hint: 部门负责人、用人经理
      - responsibility: 接收逾期未确认名单，必要时提醒下属
        approval_right: 无
        department_hint: 员工所在组织单元
        position_hint: 部门负责人、用人经理
      - responsibility: 编制、提交并确认下属月度绩效评估，对评估结论负责
        approval_right: 无（评估是专业判断）
        department_hint: 员工所在组织单元
