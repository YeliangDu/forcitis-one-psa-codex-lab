glossary:
- id: operations_facts__responsible_party
  zh: 责任对象
  en: ResponsibleParty
  bc: operations.facts
  definition: 事实归属的责任承载（责任人/BU/法人）
- id: customer_party
  zh: 客户方主体
  en: CustomerParty
  bc: contract.agreement
  definition: 合同甲方的客户引用与签约瞬间冻结快照（customerId 稳定引用 + 名称/法定标识快照——历史基线不随客户主数据演变漂移；内部结算协议形态为空、改用关联法人对）；付款/开票/项目业主主体同构引用（缺省=客户方主体）
- id: project_owner_party
  zh: 项目业主主体
  en: ProjectOwnerParty
  bc: contract.agreement
  definition: 合同上的项目业主客户引用（客户 BC 多主体之一的合约侧登记；开票主体合约侧统一沿用客户 BC 码名 InvoicedParty、不另造 InvoiceTitleParty——评估 D-06 双码名裁决 2026-07-07）
- id: contracting_legal_entity
  zh: 签约法人
  en: ContractingLegalEntity
  bc: contract.agreement
  definition: 合同的我方法人主体（与交付法人可不同，均必填）
- id: contract_riskdelivery__responsible_party
  zh: 责任承担方
  en: AuthorizationResponsibleParty
  bc: contract.agreement
  definition: 授权三要素之三（BU / 法人 / 责任人）；合同 BC 合并后与变更中的「责任方」区别开，故英文名加授权前缀
- id: contract_changeorder__responsible_party
  zh: 责任方
  en: ResponsibleParty
  bc: contract.agreement
  definition: 变更/签证/索赔的归因必填维度（对齐 dim_scope）
- id: initiator
  zh: 发起人
  en: Initiator
  bc: platform.approval
  definition: 发起审批的用户。
- id: approver
  zh: 审批人
  en: Approver
  bc: platform.approval
  definition: 处理审批任务的用户。
- id: supervisor
  zh: 直属上级
  en: Supervisor
  bc: organization.workforce
  definition: 员工的人员级汇报对象（RULE-372）
- id: org_unit_head
  zh: 部门负责人
  en: OrgUnitHead
  bc: organization.workforce
  definition: 组织单元的负责人（RULE-356/257）
- id: regional_receivables_manager
  zh: 区域应收负责人
  en: RegionalReceivablesManager
  bc: organization.workforce
  definition: 组织单元的区域应收负责人（RULE-255/356）；职责角色，不是应收事实
- id: role_holder
  zh: 角色持有人
  en: RoleHolder
  bc: platform.identity
  definition: 持有某角色的启用账号（在职员工）
- id: actor
  zh: 操作人
  en: Actor
  bc: platform.audit
  definition: 执行动作的用户；系统作业为空
- id: on_behalf_of
  zh: 被代理人
  en: OnBehalfOf
  bc: platform.audit
  definition: 显式代理操作中被代理的用户（RULE-270）
- id: business_owner
  zh: 业务负责人
  en: BusinessOwner
  bc: platform.identity
  definition: 权限复核中，对某人的授权「维持不变」时须写明的、为这项授权的业务需要负责并确认的人，以员工 ID 标识（接口字段 businessOwnerEmployeeId），须在职、不得为当事人本人（ADR-0044 草案，待 Q4）；与组织单元的部门负责人不是同一概念
- id: assignee
  zh: 处理人
  en: Assignee
  bc: platform.approval
  definition: 认领后唯一可以办理任务的人（RULE-276，I-7）
- id: project_manager
  zh: 项目经理
  en: ProjectManager
  bc: platform.approval
  definition: 工时所属工作的项目经理；工时审批的第一道审批人（表单字段 projectManagerId，取自业务单据）；「项目负责人」是同一角色的方言，不用；与权责表对齐：revenue/raci.yaml 里暂停、恢复、终止、取消项目的批准人统一写项目.项目经理（VS02-05，intent 2026-10-16-163556）
- id: ui_proxy_handling
  zh: 代理办理
  en: ProxyHandling
  bc: platform.approval
  definition: 流程管理员替被代理人办理任务；审批记录同时显示操作人与被代理人
- id: candidate_approver
  zh: 候选审批人
  en: CandidateApprover
  bc: platform.approval
  definition: 任务尚未认领时，有资格认领并办理该任务的审批人
- id: task_participant
  zh: 任务参与人
  en: TaskParticipant
  bc: platform.approval
  definition: 审批任务的候选审批人或处理人
- id: director
  zh: 总监
  en: Director
  bc: platform.approval
  definition: BU-002 部门总监（RULE-256）
- id: regional_head
  zh: 区域负责人
  en: RegionalHead
  bc: platform.approval
  definition: 区域组织单元的负责人；区域是介于项目和公司之间的一层组织，与事业部同属组织单元的类型（F1-05、Q37a），将另作数据范围维度；不承担工时审批，售前工时的审批人是部门负责人（D5-06）
- id: witness
  zh: 见证人
  en: Witness
  bc: platform.identity
  definition: 运维命令执行时在场的另一个人，与操作人一起记入审计（双人在场）
- id: org_data_admin
  zh: 组织数据管理员
  en: OrgDataAdmin
  bc: platform.identity
  definition: 系统角色 org_data_admin：维护组织与法人归属、工作日历、编号模板、同步运行；无敏感权限、不能确认模板（ADR-0027 第 2 项）
- id: business_admin
  zh: 业务管理员
  en: BusinessAdmin
  bc: platform.identity
  definition: 系统角色 business_admin：确认各单据编号模板（凭证号模板的财务确认不在 1a 内设角色）（ADR-0027 第 2 项）
- id: security_auditor
  zh: 安全审计员
  en: SecurityAuditor
  bc: platform.identity
  definition: 系统角色 security_auditor：查看与导出审计记录，并在普通会话里放行管理员离职造成的同步暂停（ADR-0027 第 3 项、ADR-0028）
- id: administrator
  zh: 管理员
  en: Administrator
  bc: platform.identity
  definition: 持有 super_admin 或管理员角色的人；不得通过外部票据进入
- id: confirmer
  zh: 确认人
  en: Confirmer
  bc: platform.numbering
  definition: 确认某个编号模板版本的人：业务确认人持有 numbering-rule:approve，财务确认人持有凭证号模板的确认权限
- id: author
  zh: 作者
  en: Author
  bc: platform.numbering
  definition: 保存某个编号模板版本的人；作者不能确认自己保存的版本（四眼）
- id: customer_role
  zh: 客户
  en: CustomerRole
  bc: masterdata.counterparty
  definition: 往来单位承担的客户角色：具备独立签约与付款主体资格，带准入状态；主数据只有一份（往来单位），客户是它的一个角色，不是另一个主体
- id: legal_entity_finance_head
  zh: 法人财务负责人
  en: LegalEntityFinanceHead
  bc: organization.workforce
  definition: 某一法人范围内承担财务职责的负责人；每个法人分别明确其财务负责人。跨法人事项须另行写明由哪个法人的财务负责人承担；具体任职、代理人与权限配置沿用已定授权规则。
- id: system_actor
  zh: 系统操作主体
  en: SystemActor
  bc: kernel
  definition: 以 SYSTEM 身份发出事件的作业、监听器或运维入口；名字人为声明在 backend/architecture/system-actors.txt，事件信封 actorId 为该名字在固定命名空间下的 UUIDv5，同一名字恒定、不同于任何用户 ID，任何实例都可由目录反查名字（RULING-P2-C5）
- id: recipient
  zh: 收件人
  en: Recipient
  bc: platform.integration
  definition: 消息的接收人，用企业微信用户 ID 精确指定；不允许按部门、标签或全员投递
