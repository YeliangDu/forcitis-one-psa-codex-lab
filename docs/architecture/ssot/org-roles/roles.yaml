glossary_issues:
- names:
  - 发起人（SSOT ROLE-01）
  - 发起人（词表 initiator）
  kind: conflict
  note: 前者是客户采购决策链角色，后者是发起审批的用户；已拆为采购发起人与审批发起人。
- names:
  - 权责表 SH-* 编号
  - 干系人登记 SSOT SH-* 编号
  kind: conflict
  note: 编号体系不一致：权责表 SH-C5 为保险公司等委托方而 SSOT SH-C5 为发包方、SH-C7 才是保险公司；权责表 SH-E1 为用人经理而 SSOT SH-E1 为管理层；SH-E4 技术专家对 SSOT 市场和客户经理；SH-E5 市场商务对职能人员；SH-E6 财务人事行政对求职者；SH-E7 注册执业对不持股合伙人；SH-H1、SH-M1、SH-X* 在 SSOT 中不存在。本表按权责表原文内容归并，不按编号对应。
- names:
  - SH-M1
  kind: conflict
  note: 一个键混装项目总监、部门负责人、区域负责人、总经理、分管副总、管理层负责人，已拆成多个 ROLE，权责表应按职责拆键。
- names:
  - SH-E6
  kind: conflict
  note: 一个键混装财务、人力、行政、信息及财务负责人，职位提示粒度不一，已拆四个 ROLE，粒度待定。
- names:
  - SH-E3
  kind: conflict
  note: 一个键混装设计师与顾问、全体在职员工；同时 SSOT SH-E3 别名含技术专家、注册执业人员。
- names:
  - 总监（词表 director）
  - 项目总监（权责表）
  kind: conflict
  note: 部门总监（BU-002）与项目总监是否同一职位未知，未合并。
- names:
  - 部门负责人
  - 用人经理
  - 组织单元负责人
  - 事业部负责人
  kind: duplicate
  note: SSOT 称用人经理由部门负责人扮演；权责表并列「部门负责人、用人经理」，同义或包含关系待裁定。事业部负责人未见词条。
- names:
  - 区域负责人
  - 区域应收负责人
  kind: conflict
  note: 词表分别定义；区域负责人不承担工时审批，区域应收负责人为应收职责，不是应收事实。
- names:
  - 法人财务负责人
  - 财务负责人
  - 分管副总
  kind: dialect
  note: 权责表与规则多处泛称财务负责人，词表限定为法人范围，需确认。
- names:
  - approver 审批人
  - assignee 处理人
  - candidate_approver 候选审批人
  - task_participant 任务参与人
  kind: duplicate
  note: 同一人在任务不同阶段的叫法，拆分是否必要待定。
- names:
  - 责任对象
  - 责任承担方
  - 责任方
  - ResponsibleParty
  kind: duplicate
  note: 英文名 ResponsibleParty 在 operations.facts 与 contract.agreement 各用于不同中文名（责任对象、责任方），三个中文词语义相近；词表已区分授权前缀，但跨 bc 同英文名需确认。
- names:
