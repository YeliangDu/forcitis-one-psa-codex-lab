        type: object
        required:
        - envelope
        - personnelCommandId
        - employeeId
        - effectiveDate
        - separationHoldId
        - releasedBy
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          personnelCommandId:
            type: string
            format: uuid
            x-type: PersonnelCommandId
            description: 被放行的离职命令 ID（UUIDv7）
          employeeId:
            type: string
            format: uuid
            x-type: EmployeeId
            description: 员工 ID，与信封的 aggregateId 相同
          effectiveDate:
            type: string
            x-type: LocalDate
            description: 人事业务生效日（DECLARED）：离职命令原定的生效日，放行后按此日补写离职版本
          separationHoldId:
            type: string
            format: uuid
            x-type: SeparationHoldId
            description: 待放行离职记录 ID（separation_holds，UUIDv7，ADR-0068 第 2 条第 1 项）
          releasedBy:
            type: string
            format: uuid
            x-type: UserId
            nullable: true
            description: 界面放行时为放行人的用户账号 ID；经双人运维命令放行时为空，操作人与见证人只记审计（ADR-0068 第 2 条第 4 项）
