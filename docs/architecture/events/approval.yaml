                - JOURNAL_VOUCHER
                - BONUS_INPUT
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          nodeKey:
            type: object
            x-type: NodeKey
            properties:
              value:
                type: string
            description: 流程节点标识
          dueAt:
            type: string
