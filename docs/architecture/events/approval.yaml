components:
  messages:
    ApprovalCompleted:
      name: ApprovalCompleted
      title: 审批结束（已通过 / 已驳回 / 已退回 / 已撤销）
      description: 审批结束（已通过、已驳回、已退回、已撤销）。aggregateId 是审批请求 ID；过程里程碑，不过账。发起人撤回（RULE-269）以 RETURNED 结束本轮，与审批人退回同形，区别看信封 actorId 是否为发起人以及 reason。消费方 cost.timesheet 按 eventId 幂等，轮次与等待中的轮次不符则忽略；分析层
        L1 用于审批时效。 发起人撤回与审批人退回同形，用 returnSource 区分；platform.approval 的通知监听器据此给发起人发完成卡片（D-1a-135）。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
                - BONUS_INPUT
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          processKey:
            type: string
            x-type: ProcessKey
            pattern: ^[a-z]+_[a-z]+_[a-z]+(_[a-z]+)*$
            description: 流程定义 id（小写 {子域}_{bc}_{名}，即 BPMN id）
          instanceId:
            type: string
            x-type: ApprovalInstanceId
            format: uuid
            description: 流程实例 ID
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          outcome:
            type: string
            enum:
            - APPROVED
            - REJECTED
            - RETURNED
            - CANCELLED
            description: 类型化结果，不靠文案
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 驳回、退回、撤销原因；通过时为空（RULE-280）
          initiator:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 发起人，完成卡片发给他
          returnSource:
            type: string
            enum:
            - APPROVER
            - INITIATOR
            - SYSTEM
            description: 退回由谁发起：审批人退回，发起人撤回（D-1a-72），或系统因发起人可以自行改正的原因退回；只有退回结果有值
      x-event:
        eventType: platform.approval.ApprovalCompleted
        version: 1
        class: com.forcitis.one.platform.approval.events.ApprovalCompleted
        aggregate: ApprovalRequest
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - cost.timesheet
        - platform.approval
        - organization.payroll
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 审批结束当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalRequestStateMachineTest
    DocumentSubmittedForApproval:
      name: DocumentSubmittedForApproval
      title: 请求发起一轮审批
      description: 单据的所有者请审批模块发起一轮审批的发布语言：所有者的聚合记录它，platform.approval 订阅并发起这一轮，带齐发起所需的全部信息，审批模块不回头问所有者。类型归 platform.approval，由申请审批的模块的聚合发布，目前是 cost.timesheet 的 Timesheet；信封里的聚合与法人是所有者的。同一单据同一轮重复收到只发起一次，比当前轮更早的请求忽略；发起时违反业务规则的不重试，本轮以退回结束并写明原因。
      payload:
        type: object
        properties:
          processKey:
            type: string
            x-type: ProcessKey
            pattern: ^[a-z]+_[a-z]+_[a-z]+(_[a-z]+)*$
            description: 流程定义 id（小写 {子域}_{bc}_{名}，即 BPMN id）
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
                - BONUS_INPUT
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          initiator:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 提交单据的员工，由所有者记录，不取自客户端
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          routingFlags:
            type: array
            items:
              type: object
              x-type: RoutingFlag
              properties:
                name:
                  type: string
            description: 审批路由标记，业务模块算好，流程只读
          formFields:
            type: array
            items:
              type: object
              x-type: ApprovalField
              properties:
                name:
                  type: string
                values:
                  type: array
                  items:
                    type: string
            description: 流程里的审批人规则要读的业务字段
          contentHash:
            type: object
            properties:
              value:
                type: string
            x-type: ContentHash
            description: 提交内容的摘要：同一审批人同一节点内容未变则自动通过
          summary:
            type: object
            properties:
              value:
                type: string
            x-type: ApprovalSummary
            description: 业务摘要，审批卡片显示它
      x-event:
        eventType: platform.approval.DocumentSubmittedForApproval
        version: 1
        class: com.forcitis.one.platform.approval.events.DocumentSubmittedForApproval
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 申请审批的单据的业务日期（工时单取工作日期）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
    TaskAssigned:
      name: TaskAssigned
      title: 任务已分配（每位会签审批人一个任务）
      description: 任务已分配，每位会签审批人一个任务；过程事实，不过账。platform.approval 的通知监听器据此给每个候选人发企业微信文本卡片（去重键为对象类别 + 对象 ID + 用途 + 触发事件）。系统自动通过的任务（RULE-302）不发此事件，发 TaskHandled（AUTOMATIC）。分析层 L1 以此为审批等待时长的起点。
      payload:
        type: object
        properties:
          taskId:
            type: string
            x-type: ApprovalTaskId
            format: uuid
            description: 任务 ID（UUID）
          instanceId:
            type: string
            x-type: ApprovalInstanceId
            format: uuid
            description: 流程实例 ID（UUID）
          processKey:
            type: string
          processName:
            type: object
            x-type: ProcessName
            properties:
              value:
                type: string
            description: 流程显示名
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
                - BONUS_INPUT
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          nodeKey:
            type: object
            x-type: NodeKey
            properties:
              value:
                type: string
            description: 流程节点标识
          nodeName:
            type: object
            x-type: NodeName
            properties:
              value:
                type: string
            description: 节点显示名
          initiator:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 稳定 ID 的字符串形式
          candidates:
            type: array
            items:
              type: string
              x-type: UserId
              format: uuid
          summary:
            type: object
            properties:
              value:
                type: string
            x-type: ApprovalSummary
            description: 业务模块在发起时给的业务摘要，卡片显示它而不回查单据
          dueAt:
            type: string
            format: date-time
            nullable: true
            description: 截止时刻；节点没有时限则为空
      x-event:
        eventType: platform.approval.TaskAssigned
        version: 1
        class: com.forcitis.one.platform.approval.events.TaskAssigned
        aggregate: ApprovalRequest
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 任务创建当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
    TaskClaimed:
      name: TaskClaimed
      title: 任务已被候选人认领
      description: 任务已被候选人认领；过程事实，不过账。通知监听器据此把其他候选人的卡片改为已处理。
      payload:
        type: object
        properties:
          taskId:
            type: string
            x-type: ApprovalTaskId
            format: uuid
            description: 任务 ID（UUID）
          instanceId:
            type: string
            x-type: ApprovalInstanceId
            format: uuid
            description: 流程实例 ID（UUID）
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
                - BONUS_INPUT
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          claimedBy:
            type: string
            x-type: UserId
            format: uuid
            description: 稳定 ID 的字符串形式
      x-event:
        eventType: platform.approval.TaskClaimed
        version: 1
        class: com.forcitis.one.platform.approval.events.TaskClaimed
        aggregate: ApprovalRequest
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 认领当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
    TaskHandled:
      name: TaskHandled
      title: 任务已办理（通过 / 驳回 / 退回）
      description: 任务已办理（通过、驳回、退回）；过程事实，不过账。被跳过的节点不发此事件；系统自动通过（同一审批人同一节点内容未变，RULE-302）发本事件，effect 为 AUTOMATIC（D-1a-66）。加签人的驳回只发 effect=ADVISORY，只记录意见，不结束本轮（RULE-273、RULE-291）。通过时 reason 为空（RULE-280）。
      payload:
        type: object
        properties:
          taskId:
            type: string
            x-type: ApprovalTaskId
            format: uuid
            description: 任务 ID（UUID）
          instanceId:
            type: string
            x-type: ApprovalInstanceId
            format: uuid
            description: 流程实例 ID（UUID）
          processKey:
            type: string
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
                - BONUS_INPUT
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          nodeKey:
            type: object
            x-type: NodeKey
            properties:
              value:
                type: string
            description: 流程节点标识
          assignee:
            type: string
            x-type: UserId
            format: uuid
            description: 稳定 ID 的字符串形式
          outcome:
            type: string
            enum:
            - APPROVED
            - REJECTED
            - RETURNED
          effect:
            type: string
            enum:
            - BINDING
            - ADVISORY
            - AUTOMATIC
            description: ADVISORY 是加签人的驳回：只记录意见，不结束本轮（RULE-273、RULE-291）
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 原因；通过时为空
      x-event:
        eventType: platform.approval.TaskHandled
        version: 1
        class: com.forcitis.one.platform.approval.events.TaskHandled
        aggregate: ApprovalRequest
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 办理当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的审批办理时效与 1b 业务模块的任务级钩子将订阅；现在就发布，是因为办理时刻只在发生当时可记录，事后补不回
    TaskTransferred:
