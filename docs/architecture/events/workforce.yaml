            x-type: PositionId
            nullable: true
            description: 生效日起的岗位；只改部门时与前一天相同，任职未设岗位时为空
          employmentRelationshipId:
            type: string
            format: uuid
            x-type: EmploymentRelationshipId
            description: 事件所属的雇佣关系 ID（ADR-0086）
