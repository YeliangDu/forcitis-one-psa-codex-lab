    # 人事命令（ADR-0068 第 1 条第 9 项，契约见 docs/architecture/contracts/personnel-command-contract.md）：命令生效时才发布；录入、撤回有意不发事件，只写审计。
    # 停薪留职开始与结束的事件随 ADR-0068 第 3 条定名，法人归属变更的事件名交 one-glossary（ADR-0073 影响面），均未定，此处不登记。
    EmployeeHired:
      name: EmployeeHired
      title: 员工入职已生效
      description: 入职命令生效时发布，录入与撤回只写审计。信封以员工为聚合（aggregateId 为员工 ID），businessDate 为人事业务生效日，occurredAt 为命令生效落地时刻（ADR-0068 第 1 条第 9 项）；负载只含 ID 与日期，不含姓名等个人信息。信封 legalEntityId 为员工在生效日的法人（lead 2026-10-28 定，#737 Q6）。
      payload:
        type: object
        properties:
          personnelCommandId:
            type: string
            format: uuid
            x-type: PersonnelCommandId
            description: 触发本事件的人事命令 ID（UUIDv7）
          employeeId:
            type: string
            format: uuid
            x-type: EmployeeId
            description: 员工 ID，与信封的 aggregateId 相同
          effectiveDate:
            type: string
            x-type: LocalDate
            description: 人事业务生效日（DECLARED）：入职日，即在职的第一天
      x-event:
