# 事件目录分片（AsyncAPI 3 的 components.messages）：本模块的事件由 build_asyncapi.py 合成 asyncapi.yaml
components:
  messages:
    SyncRunSucceeded:
      name: SyncRunSucceeded
      title: 组织同步成功
      payload:
        type: object
        properties:
          syncRunId:
            type: string
            format: uuid
            x-type: SyncRunId
            description: 稳定 ID 的字符串形式
      x-event:
        eventType: organization.workforce.SyncRunSucceeded
        version: 1
        class: com.forcitis.one.organization.workforce.events.SyncRunSucceeded
        aggregate: SyncRun
        idempotencyKey: eventId
        publisher: organization.workforce
        consumers: []
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：不是带日期的业务里程碑（运维或配置变更）
        audit: 'not-audited: 每 5 分钟一次的同步会淹没审计记录；同步记录表本身就是它的记录，中止、失败、放行仍然审计'
        publisherTest: com.forcitis.one.organization.workforce.domain.SyncRunStateMachineTest
        noConsumer: 暂无消费方：运维看板与告警（告警通道待用户指定）将订阅；现在就发布，是因为中止与失败只在发生当时有告警价值，事后补不回
