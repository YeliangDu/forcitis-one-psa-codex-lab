      title: 员工调岗已生效
      description: 调岗命令生效时发布；负载另带触发字段与生效日前后的部门，供待调整权限按（人，人事命令 ID，触发字段）去重（ADR-0032 第 4 项、ADR-0055 决定 4）。信封以员工为聚合（aggregateId 为员工 ID），businessDate 为人事业务生效日，occurredAt 为命令生效落地时刻（ADR-0068 第 1 条第 9 项）；负载只含 ID 与日期，不含姓名等个人信息。信封 legalEntityId 为员工在生效日的法人（lead 2026-10-28 定，#737 Q6）。
      payload:
