          employeeId:
            type: string
            format: uuid
            x-type: EmployeeId
            description: 员工 ID，与信封的 aggregateId 相同
          effectiveDate:
            type: string
            x-type: LocalDate
            description: 人事业务生效日（DECLARED）：调岗生效日，即新任职的第一天
          triggerFieldKinds:
            type: array
            items:
              type: string
              enum:
              - ORG_UNIT
              - POSITION
              x-type: TriggerFieldKind
            description: 本次调岗改变的任职字段：ORG_UNIT 部门 / POSITION 岗位（ADR-0032 第 4 项第 3 条）；只改直属领导或收费员工时为空
          previousOrgUnitId:
            type: string
            format: uuid
            x-type: OrgUnitId
            description: 生效日前一天的部门
          newOrgUnitId:
            type: string
            format: uuid
            x-type: OrgUnitId
            description: 生效日起的部门；只改岗位时与前一天相同
          previousPositionId:
