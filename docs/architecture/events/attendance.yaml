# 事件目录分片（AsyncAPI 3 的 components.messages）：本模块的事件由 build_asyncapi.py 合成 asyncapi.yaml
components:
  messages:
    WorkCalendarYearMaintained:
      name: WorkCalendarYearMaintained
      title: 工作日历的某一年被维护
      payload:
        type: object
        properties:
          calendarYear:
            type: integer
            x-type: Year
            description: 日历年份
          changedDates:
            type: array
            items:
              type: string
              x-type: LocalDate
            description: 本次保存新增、删除或改变类型的日期，按日期升序；原样重存时为空
      x-event:
        eventType: organization.attendance.WorkCalendarYearMaintained
        version: 1
        class: com.forcitis.one.organization.attendance.events.WorkCalendarYearMaintained
        aggregate: WorkCalendarYear
        idempotencyKey: eventId
        publisher: organization.attendance
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：一次保存可涉及多个日期，取不出唯一的业务日期，被修改的日期在负载 changedDates
        audit: audited
        publisherTest: com.forcitis.one.organization.attendance.domain.WorkCalendarYearTest
        noConsumer: 暂无消费方：审批超时提醒将在日历变更后重算截止时间（approval 依赖 attendance）；现在就发布，是因为日历变更之后已算出的截止时间需要有据可查
    WorkCalendarLockedDaysChanged:
      name: WorkCalendarLockedDaysChanged
      title: 工作日历中已过去的日期被组织数据管理员确认修改
      payload:
        type: object
        properties:
          calendarYear:
            type: integer
            x-type: Year
            description: 日历年份
          changes:
            type: array
            items:
              type: object
              x-type: LockedDayChange
              description: 被修改的、早于操作当天的日期，及其修改前后的类别（NONE 表示按周一至周五上班、周末休息的常规）
      x-event:
        eventType: organization.attendance.WorkCalendarLockedDaysChanged
        version: 1
        class: com.forcitis.one.organization.attendance.events.WorkCalendarLockedDaysChanged
        aggregate: WorkCalendarYear
        idempotencyKey: eventId
        publisher: organization.attendance
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：载荷 changes 列出被改的日期及其改前改后的类别；已算出的审批时效不因此重算
        audit: audited
        publisherTest: com.forcitis.one.organization.attendance.domain.WorkCalendarYearTest
        noConsumer: 暂无消费方：这是对工作日历例外修改的审计留痕；现在就发布，是因为例外修改的操作人与日期事后无法还原
    StandardHoursVersionPublished:
      name: StandardHoursVersionPublished
      title: 标准工时的新版本被发布
      payload:
        type: object
        properties:
          standardHoursVersionId:
            type: string
            format: uuid
            x-type: StandardHoursVersionId
            description: 新发布的标准工时版本
          scopeKind:
            type: string
            enum: [DEFAULT, LEGAL_ENTITY]
            x-type: StandardHoursScopeKind
            description: 版本适用的范围：默认时间线或某个法人自有时间线
          legalEntityId:
            type: string
            format: uuid
            nullable: true
            x-type: LegalEntityId
            description: 法人自有版本的法人；默认范围为空
          effectiveFromDate:
            type: string
            x-type: LocalDate
            description: 新版本的生效日期
          workdayMinutes:
            type: integer
            x-type: StandardHoursMinutes
            description: 上班日的标准分钟数
          adjustedWorkdayMinutes:
            type: integer
            x-type: StandardHoursMinutes
            description: 调休日的标准分钟数
          versionNumber:
            type: integer
            x-type: StandardHoursVersionNumber
            description: 版本在其范围内的序号，从 1 起，作废的也占号
      x-event:
        eventType: organization.attendance.StandardHoursVersionPublished
        version: 1
        class: com.forcitis.one.organization.attendance.events.StandardHoursVersionPublished
        aggregate: StandardHours
        idempotencyKey: eventId
        publisher: organization.attendance
        consumers: []
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 新版本的生效日期
        audit: 'not-audited: 发布同事务直写审计 organization.attendance.standard-hours.published'
        publisherTest: com.forcitis.one.organization.attendance.domain.StandardHoursTest
        noConsumer: 暂无消费方：只供分析（版本发布的时间线）；发布本身已写审计，事件不替代审计
