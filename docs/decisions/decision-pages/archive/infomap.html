<title>全企业业务对象确认</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a decision ledger — left column holds progress, stage switcher and the already-settled list; right column is one stage of numbered questions with ruled option rows; stacks on phones. */
:root{
  --bg:#f2f4f3; --paper:#ffffff; --ink:#1b2422; --muted:#5a6866; --line:#d9e0de; --soft:#eaf0ee;
  --accent:#1d5c55; --accent-soft:#dcecea;
  --pick:#1d5c55; --pick-soft:#e1f0ec;
  --changed:#9c3d1c; --changed-soft:#f7e6de;
  --defer:#6b5a10; --defer-soft:#f4efd9;
  --f-head:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --paper:#18211f; --ink:#e3ebe9; --muted:#97a8a5; --line:#2a3633; --soft:#1f2a27;
  --accent:#7cc7bb; --accent-soft:#1d3632; --pick:#7cc7bb; --pick-soft:#1b332f;
  --changed:#f0a07f; --changed-soft:#3b231a; --defer:#dcc66a; --defer-soft:#332d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --paper:#18211f; --ink:#e3ebe9; --muted:#97a8a5; --line:#2a3633; --soft:#1f2a27;
  --accent:#7cc7bb; --accent-soft:#1d3632; --pick:#7cc7bb; --pick-soft:#1b332f;
  --changed:#f0a07f; --changed-soft:#3b231a; --defer:#dcc66a; --defer-soft:#332d14; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{overflow-x:clip;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap,aside,main,section,.q,.q>*{min-width:0;max-width:100%}
.q,.lede,.ctx,.opt,.meta,.note,details{overflow-wrap:anywhere;word-break:break-word}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:grid;gap:16px}
h1{font-family:var(--f-head);font-weight:700;font-size:23px;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;font-size:13px}
.lab{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.stats{display:grid;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.legend b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.conn{font-size:12px;color:var(--muted)}
.conn.off{color:var(--changed)}
select,input[type=text]{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:7px 10px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font-size:13px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:5px 12px}
.btn.solid{background:var(--accent);color:var(--paper)}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 10px}
main{display:grid;gap:18px;min-width:0}
details.info{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.info summary{cursor:pointer;font-weight:500}
details.info ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.tw{overflow-x:auto;margin-top:8px}
.tw table{border-collapse:collapse;font-size:12.5px;min-width:640px}
.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tw th{background:var(--soft);font-weight:500}
.ghead{display:grid;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ghead h2{font-family:var(--f-head);font-size:20px;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.ghead h2 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.ghead p{margin:0;color:var(--muted);font-size:13px;max-width:72ch}
.list{display:grid;gap:12px}
.q{content-visibility:auto;contain-intrinsic-size:auto 360px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.q[data-state="changed"]{box-shadow:inset 3px 0 0 var(--changed)}
.q[data-state="defer"]{box-shadow:inset 3px 0 0 var(--defer)}
.qh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qt{font-family:var(--f-head);font-size:17px;font-weight:700;text-wrap:balance}
.ctx{margin:0;font-size:13px;max-width:72ch}
.meta{font-size:12px;color:var(--muted)}
.now{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px}
.chk{font-size:12.5px;color:var(--defer)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 10px;width:100%}
.opt .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px;box-sizing:border-box}
.opt b{font-weight:500}
.opt .eff{grid-column:2;font-size:12.5px;color:var(--muted)}
.opt .tag{font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--pick);background:var(--pick-soft)}
.opt[aria-pressed="true"] .dot{border:4px solid var(--pick)}
.q[data-multi] .opt .dot{border-radius:3px}
.q[data-multi] .opt[aria-pressed="true"] .dot{border:2px solid var(--pick);background:var(--pick)}
.hint{font-size:12px;color:var(--muted)}
.q[data-state="changed"] .opt[aria-pressed="true"]{border-color:var(--changed);background:var(--changed-soft)}
.q[data-state="changed"] .opt[aria-pressed="true"] .dot{border-color:var(--changed)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input{flex:1 1 220px}
.st{font-size:12px;color:var(--muted)}
.st.changed{color:var(--changed)}
.st.defer{color:var(--defer)}
.chip[aria-pressed="true"]{background:var(--defer-soft);border-color:var(--defer);color:var(--defer)}
details.basis{font-size:12.5px;color:var(--muted)}
details.basis summary{cursor:pointer}
details.basis ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.foot{display:grid;gap:8px;justify-items:start;border-top:1px solid var(--line);padding-top:12px}
.confirm{display:grid;gap:8px;background:var(--soft);border-radius:8px;padding:10px 12px}
.confirm p{margin:0;font-size:13px}
.saved{font-size:12px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-block:8px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;display:grid;gap:0;text-align:left;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;max-width:220px}
.tab small{font-size:11.5px;color:var(--muted)}
.tab.ok small{color:var(--pick)}
.tab.stale small{color:var(--changed)}
.tab[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.flash{background:var(--pick-soft);color:var(--pick);border:1px solid var(--pick);border-radius:8px;padding:8px 12px;font-size:13.5px}
.flash.all{font-weight:500}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const on = (p, n) => Array.isArray(p.choice) ? p.choice.includes(n) : p.choice === n;
const labelOf = (it, c) => c === "defer" ? "暂不定" : Array.isArray(c) ? (c.length ? c.map(n => it.opts[n].label).join("；") : "（都不勾）") : it.opts[c].label;
// 没动过的题按推荐预选，但只是草稿：提交时列出「按推荐（没动过）」条数，用户确认后才算答复
function pick(it){
  const d = decisions.get(it.key);
  if (!d) return {choice: recOf(it), note: "", defaulted: true};
  return {choice: d.choice, note: d.note || "", defaulted: false};
}
const kind = (it, p) => p.choice === "defer" && recOf(it) !== "defer" ? "defer" : same(p.choice, recOf(it)) ? (p.choice === "defer" ? "defer" : "rec") : "changed";

function qHTML(it){
  const p = pick(it), k = kind(it, p);
  const opts = it.opts.map((o, n) => `<button type="button" class="opt" data-opt="${n}" aria-pressed="${on(p, n)}">
      <span class="dot" aria-hidden="true"></span><span><b>${esc(o.label)}</b>${o.rec ? `<span class="tag">推荐</span>` : ""}</span>
      ${o.effect ? `<span class="eff">${esc(o.effect)}</span>` : ""}</button>`).join("");
  const more = [...it.basis.map(t => "依据：" + t), ...it.practice.map(t => "实践：" + t)];
  const st = k === "defer" ? `<span class="st defer">暂不定</span>` : k === "changed" ? `<span class="st changed">已改选</span>`
    : p.defaulted ? `<span class="st">推荐预选，同意就不用动</span>` : `<span class="st">已确认推荐</span>`;
  return `<article class="q" data-key="${esc(it.key)}" data-state="${k}"${it.multi ? " data-multi" : ""}>
    <div class="qh"><span class="no">${esc(it.no)}</span><span class="qt">${esc(it.title)}</span></div>
    ${it.ctx ? `<p class="ctx">${esc(it.ctx)}</p>` : ""}
    ${it.now ? `<div class="now">现状：${esc(it.now)}</div>` : ""}
    ${it.multi ? `<div class="hint">可多选${it.none ? "；" + esc(it.none) : ""}${it.recDefer ? "；默认暂不定，勾选任一项即作答" : ""}</div>` : ""}
    <div class="opts" role="group" aria-label="${esc(it.no)} 的选项">${opts}</div>
    ${it.check ? `<div class="chk">需核实：${esc(it.check)}</div>` : ""}
    ${more.length ? `<details class="basis"><summary>依据与实践（${more.length}）</summary><ul>${more.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>` : ""}
    <div class="row">
      <input type="text" id="nt-${esc(it.key)}" data-note="1" placeholder="说明（改选时请写理由，可空）" value="${esc(p.note)}">
      <button type="button" class="chip" data-defer="1" aria-pressed="${k === "defer"}">暂不定</button>
      ${p.defaulted ? "" : `<button type="button" class="chip" data-reset="1">恢复推荐</button>`}
    </div>
    <div class="meta">${it.src ? "来源：" + esc(it.src) + " · " : ""}${st}</div>
  </article>`;
}

function render(){
  const g = GROUPS.find(x => x.id === cur) || GROUPS[0];
  const list = ITEMS.filter(i => i.grp === g.id);
  const at = GROUPS.indexOf(g), next = GROUPS[at + 1];
  const info = at === 0 ? (DATA.info || []).map(b => `<details class="info"><summary>${esc(b.title)}</summary>${b.lines ? `<ul>${b.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}${b.table ? tableHTML(b.table) : ""}${b.after ? `<ul>${b.after.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}</details>`).join("") : "";
  const okN = GROUPS.filter(x => isDone(x.id)).length;
  const tabs = `<nav class="tabs" aria-label="分组">${GROUPS.map((x, n) => { const st = tabState(x.id);
    return `<button type="button" class="tab ${st[0]}" data-tab="${esc(x.id)}" aria-current="${x.id === g.id}"><span>${n + 1}. ${esc(x.title)}</span><small>${st[1]}</small></button>`; }).join("")}</nav>`;
  const fl = okN === GROUPS.length ? `<div class="flash all" role="status">全部完成：${GROUPS.length} 组都已提交。改了哪一题，回到那一组重新提交即可。</div>`
    : flash ? `<div class="flash" role="status">${esc(flash)}</div>` : "";
  $("#main").innerHTML = `${tabs}${fl}${info}<section><div class="ghead"><h2>${esc(g.title)}<span>${list.length} 题</span></h2><p>${esc(g.desc)}</p></div></section>
    <div class="list">${list.map(qHTML).join("")}</div>
    <div class="foot" data-g="${esc(g.id)}">
      <button type="button" class="btn solid" data-submit="1">提交本组（第 ${at + 1} 组 / 共 ${GROUPS.length} 组）</button>
      <div class="confirm" hidden><p></p><div class="row"><button type="button" class="btn solid" data-yes="1">确认提交</button><button type="button" class="chip" data-no="1">再看看</button></div></div>
      <p class="saved" id="st-g">${esc(stateText(g.id))}</p>
      ${next ? `<button type="button" class="btn" data-tab="${esc(next.id)}">下一组：${esc(next.title)}</button>` : ""}
    </div>`;
  stats();
}
function tableHTML(t){
  return `<div class="tw"><table><thead><tr>${t[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${t.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function counts(gid){
  const c = {rec: 0, def: 0, changed: 0, defer: 0, notes: 0};
  for (const it of ITEMS.filter(i => i.grp === gid)){
    const p = pick(it), k = kind(it, p);
    if (k === "rec") p.defaulted ? c.def++ : c.rec++; else c[k]++;
    if (p.note) c.notes++;
  }
  return c;
}
function summary(gid){
  const c = counts(gid);
  return `按推荐 ${c.rec + c.def} 题（其中没动过、按预选 ${c.def} 题）、改选 ${c.changed} 题、暂不定 ${c.defer} 题、写了说明 ${c.notes} 题`;
}
function lastChange(gid){ let m = ""; for (const i of ITEMS) if (i.grp === gid){ const d = decisions.get(i.key); if (d && d.at > m) m = d.at; } return m; }
function stateText(gid){ const s = submits.get(gid); return !s ? "本组未提交：选择先存为草稿，提交并确认后才算数" : lastChange(gid) > s.at ? "本组提交后又改过，请重新提交" : `本组已提交（${new Date(s.at).toLocaleString()}）`; }
function isDone(gid){ return submits.has(gid) && lastChange(gid) <= submits.get(gid).at; }
function tabState(gid){ return !submits.has(gid) ? ["", "未提交"] : isDone(gid) ? ["ok", "已提交 ✓"] : ["stale", "改过，待重新提交"]; }
function refreshTabs(){
  document.querySelectorAll(".tab").forEach(b => { const st = tabState(b.dataset.tab); b.className = "tab " + st[0]; b.querySelector("small").textContent = st[1]; });
}
function stats(){
  let r = 0, c = 0, d = 0;
  for (const it of ITEMS){ const k = kind(it, pick(it)); if (k === "rec") r++; else if (k === "changed") c++; else d++; }
  $("#nRec").textContent = r; $("#nChg").textContent = c; $("#nDef").textContent = d;
  const pct = n => (100 * n / ITEMS.length).toFixed(2) + "%";
  $("#bar").innerHTML = `<i style="width:${pct(r)};background:var(--pick)"></i><i style="width:${pct(c)};background:var(--changed)"></i><i style="width:${pct(d)};background:var(--defer)"></i>`;
  const done = GROUPS.filter(g => submits.has(g.id) && lastChange(g.id) <= submits.get(g.id).at).length;
  $("#subAll").textContent = `已提交 ${done} / ${GROUPS.length} 组`;
  refreshTabs();
  const el = document.getElementById("st-g"); if (el) el.textContent = stateText(cur);
}

async function store(key, body){
  if (!db){ $("#conn").textContent = "存储不可用：本次选择不会保存"; $("#conn").classList.add("off"); return; }
  try { body ? await db.collection(ANSWERS).doc(key).set(body) : await db.collection(ANSWERS).doc(key).delete(); }
  catch(e){ $("#conn").textContent = "保存失败：" + (e && e.message || "请稍后再试"); $("#conn").classList.add("off"); }
}
function setChoice(it, choice, note){
  const body = {item: it.no, choice, note: note ?? pick(it).note, by: myId, at: new Date().toISOString()};
  decisions.set(it.key, body); render(); store(it.key, body);
}

document.addEventListener("click", e => {
  const t = e.target;
  const nx = t.closest("[data-tab]");
  if (nx){ cur = nx.dataset.tab; flash = ""; navigated = true; render(); window.scrollTo(0, 0); return; }
  const q = t.closest(".q"), it = q && ITEMS.find(i => i.key === q.dataset.key);
  if (it){
    const o = t.closest("[data-opt]");
    if (o){
      const n = Number(o.dataset.opt);
      if (it.multi){ const c = pick(it).choice, a = Array.isArray(c) ? c.slice() : []; const i = a.indexOf(n); i < 0 ? a.push(n) : a.splice(i, 1); setChoice(it, a.sort((x, y) => x - y)); }
      else setChoice(it, n);
      return;
    }
    if (t.closest("[data-defer]")){ const r = recOf(it); setChoice(it, pick(it).choice === "defer" ? (r === "defer" ? [] : r) : "defer"); return; }
    if (t.closest("[data-reset]")){ decisions.delete(it.key); render(); store(it.key, null); return; }
  }
  const foot = t.closest(".foot"); if (!foot) return;
  const box = foot.querySelector(".confirm");
  if (t.closest("[data-submit]")){ box.querySelector("p").textContent = summary(foot.dataset.g) + "。没动过的题按推荐预选提交；暂不定的题留待以后。"; box.hidden = false; return; }
  if (t.closest("[data-no]")){ box.hidden = true; return; }
  if (t.closest("[data-yes]")){
    box.hidden = true;
    const gid = foot.dataset.g, el = document.getElementById("st-g");
    if (!db){ el.textContent = "存储不可用，未能提交"; return; }
    const picks = {};
    for (const it of ITEMS.filter(i => i.grp === gid)){
      const p = pick(it);
      picks[it.key] = {no: it.no, choice: p.choice, label: labelOf(it, p.choice), recommended: same(p.choice, recOf(it)), defaulted: p.defaulted, note: p.note};
    }
    const body = {at: new Date().toISOString(), by: myId, summary: summary(gid), picks};
    db.collection(SUBMITS).doc(gid).set(body).then(() => {
      submits.set(gid, body);
      const at = GROUPS.findIndex(x => x.id === gid);
      const nx = [...GROUPS.slice(at + 1), ...GROUPS.slice(0, at)].find(x => !isDone(x.id));
      const title = GROUPS[at].title;
      if (nx){ cur = nx.id; flash = `「${title}」已提交，进入下一组「${nx.title}」。`; } else flash = "";
      render(); window.scrollTo(0, 0);
    })
      .catch(err => { el.textContent = "提交失败：" + (err && err.message || "请稍后再试"); });
  }
});
const pending = new Map();
document.addEventListener("input", e => {
  if (!e.target.dataset.note) return;
  const it = ITEMS.find(i => i.key === e.target.closest(".q").dataset.key), v = e.target.value;
  clearTimeout(pending.get(it.key));
  pending.set(it.key, setTimeout(() => {
    pending.delete(it.key);
    const body = {item: it.no, choice: pick(it).choice, note: v, by: myId, at: new Date().toISOString()};
    decisions.set(it.key, body); store(it.key, body); stats();
  }, 700));
});

$("#side").innerHTML = (DATA.side || []).map(b => `<details class="info"><summary>${esc(b.title)}</summary><ul>${b.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>`).join("");
render();
(async () => {
  try { const u = await window.claude?.use?.("user"); myId = u ? await u.id() : null; } catch(e){}
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){ $("#conn").textContent = "存储不可用：请登录 claude.ai 后打开本页，选择才会保存"; $("#conn").classList.add("off"); return; }
  $("#conn").textContent = "已连接。选择自动存为草稿，每组点「提交本组」才算数";
  db.collection(SUBMITS).get().then(snap => {
    for (const d of snap.docs) if (GROUPS.some(g => g.id === d.id)) submits.set(d.id, d.data());
    // 打开时停在第一个未提交的组，已提交的组不再挡在前面
    const first = GROUPS.find(x => !isDone(x.id));
    if (!navigated && first) cur = first.id;
    render();
  }).catch(() => {});
  let queued = false;
  db.collection(ANSWERS).onSnapshot(snap => {
    let changed = false;
    for (const ch of snap.docChanges()){
      const key = ch.doc.id;
      if (!ITEMS.some(i => i.key === key) || pending.has(key)) continue;
      if (ch.type === "removed"){ if (decisions.delete(key)) changed = true; }
      else { const b = ch.doc.data(); if (b){ decisions.set(key, {...b}); changed = true; } }
    }
    if (!changed) return;
    if (document.activeElement?.matches?.("input[data-note]")){ stats(); return; }
    if (!queued){ queued = true; setTimeout(() => { queued = false; render(); }, 60); }
  }, err => { $("#conn").textContent = "存储连接中断：" + (err && err.message || ""); $("#conn").classList.add("off"); });
})();
})();
</script>
