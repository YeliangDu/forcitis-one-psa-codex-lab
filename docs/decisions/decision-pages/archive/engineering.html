<title>工程层标准</title>
<style>
/* Layout: phone-width column of standard cards grouped by recommendation; recommended ones are pre-ticked; one radio group for the 等保 level. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#152033; --muted:#5a6678; --line:#d9dfe7;
  --pick:#1f5fbf; --pick-soft:#e6eefb; --rec:#1d7a4e; --rec-soft:#e3f3ea; --warn:#a24a1d; --step:#8a5a12;
  --f:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --card:#18202b; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3544;
  --pick:#8db4f2; --pick-soft:#1e2c42; --rec:#7fd0a6; --rec-soft:#18322a; --warn:#f0a07a; --step:#e2b56a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --card:#18202b; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3544;
  --pick:#8db4f2; --pick-soft:#1e2c42; --rec:#7fd0a6; --rec-soft:#18322a; --warn:#f0a07a; --step:#e2b56a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:12px}
h1{font-size:20px;margin:0;text-wrap:balance} h2{font-size:15px;margin:4px 0 0;color:var(--muted);font-weight:600}
p{margin:0} .lede,.small{color:var(--muted);font-size:13.5px}
.status{font-size:12.5px;color:var(--muted)} .status.off{color:var(--warn)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--pick);width:18px;height:18px}
.opt b{font-weight:600}
.opt .why{grid-column:2;font-size:13.5px}
.opt .step{grid-column:2;font-size:12.5px;color:var(--step)}
.opt.rec b::after{content:"推荐";margin-left:8px;font-size:11.5px;font-weight:600;color:var(--rec);background:var(--rec-soft);border-radius:999px;padding:1px 8px;vertical-align:1px}
.opt:has(input:checked){border-color:var(--pick);background:var(--pick-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--pick);outline-offset:2px}
button{font:inherit;font-weight:600;border:1px solid var(--rec);background:var(--rec-soft);color:var(--rec);border-radius:10px;padding:10px 14px;cursor:pointer;justify-self:start}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}
.done{font-size:13px;color:var(--rec)}
</style>

<main>
  <h1>工程层要遵循哪些标准？</h1>
  <p class="lede">仓库里已经在用一些标准，但多数没写版本号；另有几项还没引用。推荐的已勾上，勾完点「保存」，我直接读取，选中的锁定版本写进 FRAMEWORKS。</p>
  <div class="status" id="status" aria-live="polite">正在连接…</div>

  <h2>一、已在用，补写版本号（不改现有做法）</h2>
  <label class="opt rec"><input type="checkbox" value="openapi-3.1"><b>OpenAPI 3.1.x</b><span class="why">接口文档格式。代码现在输出的就是 3.1.0；3.2.1 已发布，但生成工具还停在 3.1，先锁 3.1。</span><span class="step">写进：CODING_STANDARD 接口契约</span></label>
  <label class="opt rec"><input type="checkbox" value="asyncapi-3.0"><b>AsyncAPI 3.0.0</b><span class="why">事件契约格式。事件目录现用 3.0.0；3.1.0 已发布，先锁现状，以后统一升级。</span><span class="step">写进：事件目录规则</span></label>
  <label class="opt rec"><input type="checkbox" value="rfc9457"><b>RFC 9457 错误响应</b><span class="why">接口出错时统一返回结构。代码已经这样做，文档补写标准号。</span><span class="step">写进：CODING_STANDARD</span></label>
  <label class="opt rec"><input type="checkbox" value="rfc9562"><b>RFC 9562 UUIDv7</b><span class="why">自有表主键的生成规则，代码已在用，文档补写标准号。</span><span class="step">写进：NAMING_STANDARD、§14</span></label>
  <label class="opt rec"><input type="checkbox" value="cyclonedx-1.7"><b>CycloneDX 1.7 物料清单</b><span class="why">列出系统用到的全部第三方组件，出漏洞时能马上查到影响范围。规则已有，缺版本号，CI 也没有生成步骤，要补上。</span><span class="step">写进：SUPPLY_CHAIN；CI 补生成步骤</span></label>
  <label class="opt rec"><input type="checkbox" value="otel"><b>OpenTelemetry（锁规范与语义约定版本）</b><span class="why">日志、调用链、指标的统一格式。ADR 已选定，补写版本号。</span><span class="step">写进：STACK_DECISION</span></label>

  <h2>二、建议加入</h2>
  <label class="opt rec"><input type="checkbox" value="asvs-5.0"><b>OWASP ASVS 5.0</b><span class="why">安全需求逐条清单，开发与验收都对照它，比 Top 10 细得多。</span><span class="step">用于：安全需求与验收；级别后续单独定</span></label>
  <label class="opt rec"><input type="checkbox" value="top10-2025"><b>OWASP Top 10:2025</b><span class="why">最常见的十类安全问题，作为每次安全复审的快速清单（新版加入了供应链和异常处理）。</span><span class="step">用于：安全复审</span></label>
  <label class="opt rec"><input type="checkbox" value="iso25010-2023"><b>ISO/IEC 25010:2023 质量模型</b><span class="why">性能、可靠、安全、易用等非功能要求用同一套叫法和分类，避免各写各的。</span><span class="step">用于：非功能需求、阶段出口评审</span></label>
  <label class="opt rec"><input type="checkbox" value="gbt22239-2019"><b>等保 2.0（GB/T 22239-2019）</b><span class="why">国内信息系统安全的合规基线，部署和安全控制要对照它。</span><span class="step">用于：部署与安全控制</span></label>
  <label class="opt rec"><input type="checkbox" value="pipl"><b>个人信息保护法 + GB/T 35273-2020</b><span class="why">系统存员工身份、手机号等个人信息，收集、存储、使用都要合规，也是 §14.1 数据最小化的依据。</span><span class="step">用于：数据设计与权限</span></label>
  <label class="opt rec"><input type="checkbox" value="slsa-1.2"><b>SLSA v1.2</b><span class="why">保证上线的程序就是仓库里审过的代码、中间没被替换。补强现有供应链规则。</span><span class="step">用于：构建与发布链路</span></label>
  <label class="opt rec"><input type="checkbox" value="dora"><b>DORA 交付指标</b><span class="why">用部署频率、交付时长、失败率、恢复时长、返工率 5 项衡量交付快不快、稳不稳。</span><span class="step">用于：交付效能度量</span></label>

  <h2>等保按几级准备？</h2>
  <label class="opt rec"><input type="radio" name="mlps" value="later"><b>暂不定，上生产前再定</b><span class="why">先按控制项设计，定级随部署方案一起定。</span></label>
  <label class="opt"><input type="radio" name="mlps" value="2"><b>二级</b><span class="why">一般企业内部业务系统常见级别。</span></label>
  <label class="opt"><input type="radio" name="mlps" value="3"><b>三级</b><span class="why">重要系统，要求明显更多（测评、审计、容灾等）。</span></label>

  <h2>三、可选</h2>
  <label class="opt"><input type="checkbox" value="12factor"><b>Twelve-Factor 十二要素</b><span class="why">部署与配置原则，大部分已被现有规则覆盖。</span></label>
  <label class="opt"><input type="checkbox" value="semver"><b>SemVer 语义化版本</b><span class="why">版本号规则，对外发布接口或组件时才需要。</span></label>
  <label class="opt"><input type="checkbox" value="conventional-commits"><b>Conventional Commits</b><span class="why">提交信息格式，现在的提交已大体这样写，可正式定下来。</span></label>

  <button type="button" id="save">保存选择</button>
  <label for="note" class="small">备注（可选）</label>
  <textarea id="note" placeholder="例如：某项想先了解再定……"></textarea>
  <div class="done" id="done"></div>
</main>

<script>
const DOC = "engineering-standards";
const REC = [...document.querySelectorAll('.opt.rec input[type=checkbox]')].map(b => b.value);
const $ = s => document.querySelector(s);
let db = null, me = null;
const boxes = [...document.querySelectorAll('input[type=checkbox]')];
const radios = [...document.querySelectorAll('input[name=mlps]')];
boxes.forEach(b => { b.checked = REC.includes(b.value); });
radios.forEach(r => { r.checked = r.value === "later"; });
function setStatus(t, off) { const s = $("#status"); s.textContent = t; s.classList.toggle("off", !!off); }
async function saveAll() {
  const selected = boxes.filter(b => b.checked).map(b => b.value);
  const mlps = (radios.find(r => r.checked) || {}).value || null;
  if (!db) { setStatus("存储不可用：请在 claude.ai 登录后打开，选择才会保存", true); return; }
  try {
    await db.collection("decisions").doc(DOC).set({selected, mlps, note: $("#note").value, by: me, at: new Date().toISOString()});
    setStatus("已保存"); $("#done").textContent = `已保存：选了 ${selected.length} 项。`;
  } catch (e) { setStatus("保存失败：" + (e && e.message || "请稍后再试"), true); }
}
$("#save").addEventListener("click", saveAll);
(async () => {
  try { const u = await window.claude?.use?.("user"); me = u ? await u.id() : null; } catch (e) {}
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { setStatus("存储不可用：请在 claude.ai 登录后打开，选择才会保存", true); return; }
  setStatus("已连接，勾选后点「保存选择」");
  try {   // 只读一次、不订阅
    const d = (await db.collection("decisions").doc(DOC).get()).data();
    if (d) {
      boxes.forEach(b => { b.checked = (d.selected || []).includes(b.value); });
      radios.forEach(r => { r.checked = r.value === d.mlps; });
      $("#note").value = d.note || ""; $("#done").textContent = "已保存过；可修改后再保存。";
    }
  } catch (e) {}
})();
</script>
