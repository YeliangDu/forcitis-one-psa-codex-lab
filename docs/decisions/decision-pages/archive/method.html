<title>流程设计方法</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a decision ledger — left column holds progress, stage switcher and the already-settled list; right column is one stage of numbered questions with ruled option rows; stacks on phones. */
:root{
  --bg:#f2f4f3; --paper:#ffffff; --ink:#1b2422; --muted:#5a6866; --line:#d9e0de; --soft:#eaf0ee;
  --accent:#1d5c55; --accent-soft:#dcecea;
  --pick:#1d5c55; --pick-soft:#e1f0ec;
  --changed:#9c3d1c; --changed-soft:#f7e6de;
  --defer:#6b5a10; --defer-soft:#f4efd9;
  --f-head:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --paper:#18211f; --ink:#e3ebe9; --muted:#97a8a5; --line:#2a3633; --soft:#1f2a27;
  --accent:#7cc7bb; --accent-soft:#1d3632; --pick:#7cc7bb; --pick-soft:#1b332f;
  --changed:#f0a07f; --changed-soft:#3b231a; --defer:#dcc66a; --defer-soft:#332d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --paper:#18211f; --ink:#e3ebe9; --muted:#97a8a5; --line:#2a3633; --soft:#1f2a27;
  --accent:#7cc7bb; --accent-soft:#1d3632; --pick:#7cc7bb; --pick-soft:#1b332f;
  --changed:#f0a07f; --changed-soft:#3b231a; --defer:#dcc66a; --defer-soft:#332d14; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{overflow-x:clip;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap,aside,main,section,.q,.q>*{min-width:0;max-width:100%}
.q,.lede,.ctx,.opt,.meta,.note,details{overflow-wrap:anywhere;word-break:break-word}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:grid;gap:16px}
h1{font-family:var(--f-head);font-weight:700;font-size:23px;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;font-size:13px}
.lab{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.stats{display:grid;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.legend b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.conn{font-size:12px;color:var(--muted)}
.conn.off{color:var(--changed)}
select,input[type=text]{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:7px 10px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font-size:13px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:5px 12px}
.btn.solid{background:var(--accent);color:var(--paper)}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 10px}
main{display:grid;gap:18px;min-width:0}
details.info{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.info summary{cursor:pointer;font-weight:500}
details.info ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.tw{overflow-x:auto;margin-top:8px}
.tw table{border-collapse:collapse;font-size:12.5px;min-width:640px}
.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tw th{background:var(--soft);font-weight:500}
.ghead{display:grid;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ghead h2{font-family:var(--f-head);font-size:20px;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.ghead h2 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.ghead p{margin:0;color:var(--muted);font-size:13px;max-width:72ch}
.list{display:grid;gap:12px}
.q{content-visibility:auto;contain-intrinsic-size:auto 360px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.q[data-state="changed"]{box-shadow:inset 3px 0 0 var(--changed)}
.q[data-state="defer"]{box-shadow:inset 3px 0 0 var(--defer)}
.qh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qt{font-family:var(--f-head);font-size:17px;font-weight:700;text-wrap:balance}
.ctx{margin:0;font-size:13px;max-width:72ch}
.meta{font-size:12px;color:var(--muted)}
.now{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px}
.chk{font-size:12.5px;color:var(--defer)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 10px;width:100%}
.opt .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px;box-sizing:border-box}
.opt b{font-weight:500}
.opt .eff{grid-column:2;font-size:12.5px;color:var(--muted)}
.opt .tag{font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--pick);background:var(--pick-soft)}
.opt[aria-pressed="true"] .dot{border:4px solid var(--pick)}
.q[data-multi] .opt .dot{border-radius:3px}
.q[data-multi] .opt[aria-pressed="true"] .dot{border:2px solid var(--pick);background:var(--pick)}
.hint{font-size:12px;color:var(--muted)}
.q[data-state="changed"] .opt[aria-pressed="true"]{border-color:var(--changed);background:var(--changed-soft)}
.q[data-state="changed"] .opt[aria-pressed="true"] .dot{border-color:var(--changed)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input{flex:1 1 220px}
.st{font-size:12px;color:var(--muted)}
.st.changed{color:var(--changed)}
.st.defer{color:var(--defer)}
.chip[aria-pressed="true"]{background:var(--defer-soft);border-color:var(--defer);color:var(--defer)}
details.basis{font-size:12.5px;color:var(--muted)}
details.basis summary{cursor:pointer}
details.basis ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.foot{display:grid;gap:8px;justify-items:start;border-top:1px solid var(--line);padding-top:12px}
.confirm{display:grid;gap:8px;background:var(--soft);border-radius:8px;padding:10px 12px}
.confirm p{margin:0;font-size:13px}
.saved{font-size:12px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-block:8px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;display:grid;gap:0;text-align:left;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;max-width:220px}
.tab small{font-size:11.5px;color:var(--muted)}
.tab.ok small{color:var(--pick)}
.tab.stale small{color:var(--changed)}
.tab[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.flash{background:var(--pick-soft);color:var(--pick);border:1px solid var(--pick);border-radius:8px;padding:8px 12px;font-size:13.5px}
.flash.all{font-weight:500}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.bpmnc{height:460px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0}.legend2{font-size:12.5px;color:var(--muted);margin:10px 0 0}
</style>

<div class="wrap">
<aside>
  <div>
    <h1>流程设计方法与 BPMN 样板</h1>

  </div>
  <div class="stats" aria-live="polite">

    <div class="saved" id="subAll"></div>
  </div>
  <div id="side"></div>
</aside>
<main id="main"></main>
</div>

const BPMN = {"rev": [{"title": "PRC-28 编制、评审并签发交付物，送达并登记客户认可", "xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" id=\"Definitions_PRC-28\" targetNamespace=\"https://forcitis.one/bpmn/closeout/revenue\" exporter=\"one-arch-revenue\" exporterVersion=\"1\">\n  <bpmn:signal id=\"Signal_Delivered\" name=\"交付物已送达\"/>\n  <bpmn:signal id=\"Signal_Accepted\" name=\"交付物已认可\"/>\n  <bpmn:signal id=\"Signal_Returned\" name=\"AcceptanceReturned\"/>\n  <bpmn:signal id=\"Signal_Declared\" name=\"无异议已声明\"/>\n  <bpmn:message id=\"Msg_M1\" name=\"交付物（提交轮次）\"/>\n  <bpmn:message id=\"Msg_M2\" name=\"书面认可\"/>\n  <bpmn:message id=\"Msg_M3\" name=\"书面退回意见\"/>\n  <bpmn:message id=\"Msg_M4\" name=\"催签认函\"/>\n  <bpmn:collaboration id=\"Collab_PRC-28\">\n    <bpmn:documentation>PRC-28 编制、评审并签发交付物，送达并登记客户认可（描述级，BPMN 2.0.2；画法按 closeout/BPMN_STYLE.md；骨架见 closeout/revenue/processes.revenue.yaml）</bpmn:documentation>\n    <bpmn:participant id=\"Pool_FORCITIS\" name=\"FORCITIS one\" processRef=\"PRC-28\"/>\n    <bpmn:participant id=\"Pool_Customer\" name=\"客户（发包人代表 SH-C6a、使用者 SH-C6e）\"/>\n    <bpmn:messageFlow id=\"M1\" name=\"交付物（提交轮次）\" sourceRef=\"T_Deliver\" targetRef=\"Pool_Customer\" messageRef=\"Msg_M1\"/>\n    <bpmn:messageFlow id=\"M2\" name=\"书面认可\" sourceRef=\"Pool_Customer\" targetRef=\"C_Accepted\" messageRef=\"Msg_M2\"/>\n    <bpmn:messageFlow id=\"M3\" name=\"书面退回意见\" sourceRef=\"Pool_Customer\" targetRef=\"C_Returned\" messageRef=\"Msg_M3\"/>\n    <bpmn:messageFlow id=\"M4\" name=\"催签认函\" sourceRef=\"T_Chase\" targetRef=\"Pool_Customer\" messageRef=\"Msg_M4\"/>\n  </bpmn:collaboration>\n  <bpmn:process id=\"PRC-28\" name=\"编制、评审并签发交付物，送达并登记客户认可\" isExecutable=\"false\">\n    <bpmn:laneSet id=\"LaneSet_PRC-28\">\n      <bpmn:lane id=\"Lane_System\" name=\"系统\">\n        <bpmn:flowNodeRef>T_ReadContext</bpmn:flowNodeRef>\n      </bpmn:lane>\n      <bpmn:lane id=\"Lane_E3\" name=\"设计师和顾问（SH-E3）\">\n        <bpmn:flowNodeRef>Start</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_Draft</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_RegDraft</bpmn:flowNodeRef>\n      </bpmn:lane>\n      <bpmn:lane id=\"Lane_E4\" name=\"技术专家（SH-E4）\">\n        <bpmn:flowNodeRef>T_Review</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>G_Review</bpmn:flowNodeRef>\n      </bpmn:lane>\n      <bpmn:lane id=\"Lane_E7\" name=\"注册执业人员（SH-E7）\">\n        <bpmn:flowNodeRef>T_Issue</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>G_Issue</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>End_NotIssued</bpmn:flowNodeRef>\n      </bpmn:lane>\n      <bpmn:lane id=\"Lane_E2\" name=\"项目经理（SH-E2）\">\n        <bpmn:flowNodeRef>T_Deliver</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_RegDelivery</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>S_Delivered</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>G_Wait</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>C_Accepted</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>C_Returned</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>C_Timer</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_RegAccept</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>S_Accepted</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>End_Accepted</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_RegReturn</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>S_Returned</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>G_Period</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_Search</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_Declare</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>S_Declared</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>End_Declared</bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>T_Chase</bpmn:flowNodeRef>\n      </bpmn:lane>\n    </bpmn:laneSet>\n    <bpmn:startEvent id=\"Start\" name=\"工作包待出成果\">\n      <bpmn:outgoing>F1</bpmn:outgoing>\n    </bpmn:startEvent>\n  <bpmn:dataOutputAssociation id=\"DOA_T_Issue_DS\"><bpmn:targetRef>DS_AGG27</bpmn:targetRef></bpmn:dataOutputAssociation>\n    </bpmn:userTask>\n    <bpmn:exclusiveGateway id=\"G_Issue\" name=\"签发成功？\">\n      <bpmn:incoming>F8</bpmn:incoming>\n      <bpmn:outgoing>F9</bpmn:outgoing>\n      <bpmn:outgoing>F10</bpmn:outgoing>\n    </bpmn:exclusiveGateway>\n    <bpmn:endEvent id=\"End_NotIssued\" name=\"未签发\">\n      <bpmn:incoming>F10</bpmn:incoming>\n    </bpmn:endEvent>\n    <bpmn:manualTask id=\"T_Deliver\" name=\"送达交付物\">\n      <bpmn:documentation>线下：按合同通知条款送达（签收单、快递、邮件、平台）</bpmn:documentation>\n      <bpmn:incoming>F9</bpmn:incoming>\n      <bpmn:outgoing>F11</bpmn:outgoing>\n    </bpmn:manualTask>\n    <bpmn:userTask id=\"T_RegDelivery\" name=\"登记送达回执\">\n      <bpmn:documentation>AGG-27 登记提交轮次送达；B-28。回执经 PRC-33 登记为证据（AGG-38），挂本轮提交（ADR-0047 第 5 条第 2 点）</bpmn:documentation>\n      <bpmn:incoming>F11</bpmn:incoming>\n      <bpmn:outgoing>F12</bpmn:outgoing>\n      <bpmn:dataOutputAssociation id=\"DOA_T_RegDelivery_D_Receipt\"><bpmn:targetRef>D_Receipt</bpmn:targetRef></bpmn:dataOutputAssociation>\n      <bpmn:dataOutputAssociation id=\"DOA_T_RegDelivery_DS\"><bpmn:targetRef>DS_AGG27</bpmn:targetRef></bpmn:dataOutputAssociation>\n    </bpmn:userTask>\n    <bpmn:intermediateThrowEvent id=\"S_Delivered\" name=\"交付物已送达\">\n      <bpmn:incoming>F12</bpmn:incoming>\n      <bpmn:outgoing>F13</bpmn:outgoing>\n      <bpmn:signalEventDefinition id=\"SED_S_Delivered\" signalRef=\"Signal_Delivered\"/>\n    </bpmn:intermediateThrowEvent>\n    <bpmn:eventBasedGateway id=\"G_Wait\" name=\"等待客户答复\">\n      <bpmn:incoming>F13</bpmn:incoming>\n      <bpmn:incoming>F29</bpmn:incoming>\n      <bpmn:outgoing>F14</bpmn:outgoing>\n      <bpmn:outgoing>F15</bpmn:outgoing>\n      <bpmn:outgoing>F16</bpmn:outgoing>\n    </bpmn:eventBasedGateway>\n    <bpmn:intermediateCatchEvent id=\"C_Accepted\" name=\"收到书面认可\">\n      <bpmn:incoming>F14</bpmn:incoming>\n      <bpmn:outgoing>F17</bpmn:outgoing>\n      <bpmn:messageEventDefinition id=\"MED_C_Accepted\" messageRef=\"Msg_M2\"/>\n    </bpmn:intermediateCatchEvent>\n    <bpmn:intermediateCatchEvent id=\"C_Returned\" name=\"收到书面退回\">\n      <bpmn:incoming>F15</bpmn:incoming>\n      <bpmn:outgoing>F20</bpmn:outgoing>\n      <bpmn:messageEventDefinition id=\"MED_C_Returned\" messageRef=\"Msg_M3\"/>\n    </bpmn:intermediateCatchEvent>\n    <bpmn:intermediateCatchEvent id=\"C_Timer\" name=\"审查期或催签周期届满\">\n      <bpmn:incoming>F16</bpmn:incoming>\n      <bpmn:outgoing>F23</bpmn:outgoing>\n      <bpmn:timerEventDefinition id=\"TED_C_Timer\"><bpmn:timeDuration xsi:type=\"bpmn:tFormalExpression\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">合同审查期（约定时）或催签周期（未约定时）</bpmn:timeDuration></bpmn:timerEventDefinition>\n    </bpmn:intermediateCatchEvent>\n    <bpmn:userTask id=\"T_RegAccept\" name=\"登记客户认可\">\n      <bpmn:documentation>AGG-27 登记客户认可；B-28。approval.engine = external：客户书面认可只登记证据；签认人须为合同登记的发包人代表或授权人（ADR-0047 第 2 条）；前置 INV-48</bpmn:documentation>\n      <bpmn:incoming>F17</bpmn:incoming>\n      <bpmn:outgoing>F18</bpmn:outgoing>\n      <bpmn:dataOutputAssociation id=\"DOA_T_RegAccept_D_Accept\"><bpmn:targetRef>D_Accept</bpmn:targetRef></bpmn:dataOutputAssociation>\n      <bpmn:dataOutputAssociation id=\"DOA_T_RegAccept_DS\"><bpmn:targetRef>DS_AGG27</bpmn:targetRef></bpmn:dataOutputAssociation>\n    </bpmn:userTask>\n    <bpmn:intermediateThrowEvent id=\"S_Accepted\" name=\"交付物已认可\">\n      <bpmn:incoming>F18</bpmn:incoming>\n      <bpmn:outgoing>F19</bpmn:outgoing>\n      <bpmn:signalEventDefinition id=\"SED_S_Accepted\" signalRef=\"Signal_Accepted\"/>\n    </bpmn:intermediateThrowEvent>\n    <bpmn:endEvent id=\"End_Accepted\" name=\"已认可\">\n      <bpmn:incoming>F19</bpmn:incoming>\n    </bpmn:endEvent>\n    <bpmn:userTask id=\"T_RegReturn\" name=\"登记客户退回\">\n      <bpmn:documentation>AGG-27 登记客户退回；B-28。退回意见作证据；轮次加 1，修改后重新报送，审查期从新送达日重算（ADR-0047 第 5 条第 5 点）</bpmn:documentation>\n      <bpmn:incoming>F20</bpmn:incoming>\n      <bpmn:outgoing>F21</bpmn:outgoing>\n      <bpmn:dataOutputAssociation id=\"DOA_T_RegReturn_D_Return\"><bpmn:targetRef>D_Return</bpmn:targetRef></bpmn:dataOutputAssociation>\n      <bpmn:dataOutputAssociation id=\"DOA_T_RegReturn_DS\"><bpmn:targetRef>DS_AGG27</bpmn:targetRef></bpmn:dataOutputAssociation>\n    </bpmn:userTask>\n    <bpmn:intermediateThrowEvent id=\"S_Returned\" name=\"AcceptanceReturned\">\n      <bpmn:incoming>F21</bpmn:incoming>\n      <bpmn:outgoing>F22</bpmn:outgoing>\n      <bpmn:signalEventDefinition id=\"SED_S_Returned\" signalRef=\"Signal_Returned\"/>\n    </bpmn:intermediateThrowEvent>\n    <bpmn:exclusiveGateway id=\"G_Period\" name=\"合同约定了审查期？\">\n      <bpmn:incoming>F23</bpmn:incoming>\n      <bpmn:outgoing>F24</bpmn:outgoing>\n      <bpmn:outgoing>F25</bpmn:outgoing>\n    </bpmn:exclusiveGateway>\n    <bpmn:manualTask id=\"T_Search\" name=\"检索往来函件\">\n      <bpmn:documentation>线下或在企业邮箱中检索期满前的往来函件</bpmn:documentation>\n      <bpmn:incoming>F24</bpmn:incoming>\n      <bpmn:outgoing>F26</bpmn:outgoing>\n    </bpmn:manualTask>\n    <bpmn:userTask id=\"T_Declare\" name=\"登记无异议声明\">\n      <bpmn:documentation>AGG-27 登记项目经理的无异议声明；B-28。交付侧不判期满；期满判定与视为同意认定在 B-08（ADR-0049 决定 1、5）；财务在收入确认审批中复核（ADR-0047 U-2 (a)）</bpmn:documentation>\n      <bpmn:incoming>F26</bpmn:incoming>\n      <bpmn:outgoing>F27</bpmn:outgoing>\n      <bpmn:dataOutputAssociation id=\"DOA_T_Declare_D_Search\"><bpmn:targetRef>D_Search</bpmn:targetRef></bpmn:dataOutputAssociation>\n      <bpmn:dataOutputAssociation id=\"DOA_T_Declare_DS\"><bpmn:targetRef>DS_AGG27</bpmn:targetRef></bpmn:dataOutputAssociation>\n    </bpmn:userTask>\n    <bpmn:intermediateThrowEvent id=\"S_Declared\" name=\"无异议已声明\">\n      <bpmn:incoming>F27</bpmn:incoming>\n      <bpmn:outgoing>F28</bpmn:outgoing>\n      <bpmn:signalEventDefinition id=\"SED_S_Declared\" signalRef=\"Signal_Declared\"/>\n    </bpmn:intermediateThrowEvent>\n    <bpmn:endEvent id=\"End_Declared\" name=\"已声明无异议\">\n      <bpmn:incoming>F28</bpmn:incoming>\n    </bpmn:endEvent>\n    <bpmn:manualTask id=\"T_Chase\" name=\"催客户签认\">\n      <bpmn:documentation>线下：发函或当面催签认；未约定审查期的不得视为同意（ADR-0047 第 5 条第 1 点）</bpmn:documentation>\n      <bpmn:incoming>F25</bpmn:incoming>\n      <bpmn:outgoing>F29</bpmn:outgoing>\n    </bpmn:manualTask>\n    <bpmn:sequenceFlow id=\"F1\" sourceRef=\"Start\" targetRef=\"T_ReadContext\"/>\n    <bpmn:sequenceFlow id=\"F2\" sourceRef=\"T_ReadContext\" targetRef=\"T_Draft\"/>\n    <bpmn:sequenceFlow id=\"F3\" sourceRef=\"T_Draft\" targetRef=\"T_RegDraft\"/>\n    <bpmn:sequenceFlow id=\"F4\" sourceRef=\"T_RegDraft\" targetRef=\"T_Review\"/>\n    <bpmn:sequenceFlow id=\"F5\" sourceRef=\"T_Review\" targetRef=\"G_Review\"/>\n    <bpmn:sequenceFlow id=\"F6\" name=\"通过\" sourceRef=\"G_Review\" targetRef=\"T_Issue\"/>\n    <bpmn:sequenceFlow id=\"F7\" name=\"不通过\" sourceRef=\"G_Review\" targetRef=\"T_Draft\"/>\n    <bpmn:sequenceFlow id=\"F8\" sourceRef=\"T_Issue\" targetRef=\"G_Issue\"/>\n    <bpmn:sequenceFlow id=\"F9\" name=\"已签发\" sourceRef=\"G_Issue\" targetRef=\"T_Deliver\"/>\n    <bpmn:sequenceFlow id=\"F10\" name=\"未签发\" sourceRef=\"G_Issue\" targetRef=\"End_NotIssued\"/>\n    <bpmn:sequenceFlow id=\"F11\" sourceRef=\"T_Deliver\" targetRef=\"T_RegDelivery\"/>\n    <bpmn:sequenceFlow id=\"F12\" sourceRef=\"T_RegDelivery\" targetRef=\"S_Delivered\"/>\n    <bpmn:sequenceFlow id=\"F13\" sourceRef=\"S_Delivered\" targetRef=\"G_Wait\"/>\n    <bpmn:sequenceFlow id=\"F14\" sourceRef=\"G_Wait\" targetRef=\"C_Accepted\"/>\n    <bpmn:sequenceFlow id=\"F15\" sourceRef=\"G_Wait\" targetRef=\"C_Returned\"/>\n    <bpmn:sequenceFlow id=\"F16\" sourceRef=\"G_Wait\" targetRef=\"C_Timer\"/>\n    <bpmn:sequenceFlow id=\"F17\" sourceRef=\"C_Accepted\" targetRef=\"T_RegAccept\"/>\n    <bpmn:sequenceFlow id=\"F18\" sourceRef=\"T_RegAccept\" targetRef=\"S_Accepted\"/>\n    <bpmn:sequenceFlow id=\"F19\" sourceRef=\"S_Accepted\" targetRef=\"End_Accepted\"/>\n    <bpmn:sequence ion>\n    <bpmn:textAnnotation id=\"A_Declared\"><bpmn:text>→ B-08 PRC-54：认定视为同意，成立后触发 PRC-53</bpmn:text></bpmn:textAnnotation>\n    <bpmn:association id=\"Assoc_A_Delivered\" sourceRef=\"S_Delivered\" targetRef=\"A_Delivered\"/>\n    <bpmn:association id=\"Assoc_A_Accepted\" sourceRef=\"S_Accepted\" targetRef=\"A_Accepted\"/>\n    <bpmn:association id=\"Assoc_A_Returned\" sourceRef=\"S_Returned\" targetRef=\"A_Returned\"/>\n    <bpmn:association id=\"Assoc_A_Declared\" sourceRef=\"S_Declared\" targetRef=\"A_Declared\"/>\n  </bpmn:process>\n  <bpmndi:BPMNDiagram id=\"Diagram_PRC-28\">\n    <bpmndi:BPMNPlane id=\"Plane_PRC-28\" bpmnElement=\"Collab_PRC-28\">\n      <bpmndi:BPMNShape id=\"Pool_FORCITIS_di\" bpmnElement=\"Pool_FORCITIS\" isHorizontal=\"true\"><dc:Bounds x=\"100\" y=\"100\" width=\"3170\" height=\"960\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Lane_System_di\" bpmnElement=\"Lane_System\" isHorizontal=\"true\"><dc:Bounds x=\"130\" y=\"100\" width=\"3140\" height=\"120\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Lane_E3_di\" bpmnElement=\"Lane_E3\" isHorizontal=\"true\"><dc:Bounds x=\"130\" y=\"220\" width=\"3140\" height=\"120\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Lane_E4_di\" bpmnElement=\"Lane_E4\" isHorizontal=\"true\"><dc:Bounds x=\"130\" y=\"340\" width=\"3140\" height=\"120\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Lane_E7_di\" bpmnElement=\"Lane_E7\" isHorizontal=\"true\"><dc:Bounds x=\"130\" y=\"460\" width=\"3140\" height=\"120\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Lane_E2_di\" bpmnElement=\"Lane_E2\" isHorizontal=\"true\"><dc:Bounds x=\"130\" y=\"580\" width=\"3140\" height=\"480\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Pool_Customer_di\" bpmnElement=\"Pool_Customer\" isHorizontal=\"true\"><dc:Bounds x=\"100\" y=\"1120\" width=\"3170\" height=\"100\"/></bpmndi:BPMNShape>\n      <bpmndi:BPMNShape id=\"Start_di\" bpmnElement=\"Start\"><dc:Bounds x=\"292\" y=\"262\" width=\"36 "2870\" y=\"898\"/><di:waypoint x=\"2832\" y=\"902\"/></bpmndi:BPMNEdge>\n    </bpmndi:BPMNPlane>\n  </bpmndi:BPMNDiagram>\n</bpmn:definitions>\n", "table": "<div class=\"tw\"><table><thead><tr><th>在哪</th><th>任务</th><th>对应的聚合、命令与说明</th></tr></thead><tbody><tr><td>本系统自动或调用</td><td>读取项目阶段与签发人证书 → B-04、B-13</td><td>跨 BC api 只读：AGG-19 项目、AGG-20 WBS 阶段（B-04）；AGG-66 执业证书（B-13）</td></tr><tr><td>线下</td><td>编制交付物文件</td><td>线下：在设计软件中编制（where: offline）</td></tr><tr><td>本系统操作</td><td>登记交付物与文件版本</td><td>AGG-27 编制交付物；B-28。文件原件上传，服务端计内容哈希；引用的知识条目版本只存 ID（B-30）</td></tr><tr><td>本系统操作</td><td>校审交付物</td><td>AGG-27 登记内部评审结论；B-28。approval.engine = aggregate：校对、审核、审定逐级登记（级数按项目类别配置，待用户定）</td></tr><tr><td>本系统操作</td><td>签发交付物</td><td>AGG-27 签发交付物；B-28。前置 INV-47：签发人执业证书有效，专业与等级符合</td></tr><tr><td>线下</td><td>送达交付物</td><td>线下：按合同通知条款送达（签收单、快递、邮件、平台）</td></tr><tr><td>本系统操作</td><td>登记送达回执</td><td>AGG-27 登记提交轮次送达；B-28。回执经 PRC-33 登记为证据（AGG-38），挂本轮提交（ADR-0047 第 5 条第 2 点）</td></tr><tr><td>本系统操作</td><td>登记客户认可</td><td>AGG-27 登记客户认可；B-28。approval.engine = external：客户书面认可只登记证据；签认人须为合同登记的发包人代表或授权人（ADR-0047 第 2 条）；前置 INV-48</td></tr><tr><td>本系统操作</td><td>登记客户退回</td><td>AGG-27 登记客户退回；B-28。退回意见作证据；轮次加 1，修改后重新报送，审查期从新送达日重算（ADR-0047 第 5 条第 5 点）</td></tr><tr><td>线下</td><td>检索往来函件</td><td>线下或在企业邮箱中检索期满前的往来函件</td></tr><tr><td>本系统操作</td><td>登记无异议声明</td><td>AGG-27 登记项目经理的无异议声明；B-28。交付侧不判期满；期满判定与视为同意认定在 B-08（ADR-0049 决定 1、5）；财务在收入确认审批中复核（ADR-0047 U-2 (a)）</td></tr><tr><td>线下</td><td>催客户签认</td><td>线下：发函或当面催签认；未约定审查期的不得视为同意（ADR-0047 第 5 条第 1 点）</td></tr></tbody></table></div>"}], "peo": [{"title": "PRC-83 办理入职与任职", "xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<definitions xmlns=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" id=\"Defs_PRC_83\" targetNamespace=\"https://forcitis.one/bpmn/PRC-83\" exporter=\"one-arch-people bpmngen\" exporterVersion=\"1\">\n  <signal id=\"Sig_registered\" name=\"入职已登记\"/>\n  <signal id=\"Sig_employed\" name=\"Employed\"/>\n  <signal id=\"Sig_assign\" name=\"任职已变更\"/>\n  <signal id=\"Sig_signed\" name=\"劳动合同已签订\"/>\n  <message id=\"Msg_confirm\" name=\"入职日确认\"/>\n  <collaboration id=\"Collab_PRC_83\">\n    <participant id=\"P_main\" name=\"FORCITIS one\" processRef=\"PRC-83\"/>\n    <participant id=\"P_cand\" name=\"候选人（SH-H1）\"/>\n    <messageFlow id=\"M1\" name=\"入职日确认\" sourceRef=\"P_cand\" targetRef=\"Start_1\"/>\n    <messageFlow id=\"M2\" name=\"劳动合同文本\" sourceRef=\"T_sign\" targetRef=\"P_cand\"/>\n    <messageFlow id=\"M3\" name=\"已签署的劳动合同\" sourceRef=\"P_cand\" targetRef=\"T_sign\"/>\n  </collaboration>\n  <process id=\"PRC-83\" name=\"办理入职与任职\" isExecutable=\"false\">\n    <documentation>owner B-13；样板 SAMPLE.md；VS-07.3</documentation>\n    <laneSet id=\"LaneSet_1\">\n      <lane id=\"L_hr\" name=\"人力（SH-E6）\">\n        <flowNodeRef>Start_1</flowNodeRef>\n        <flowNodeRef>T_register</flowNodeRef>\n        <flowNodeRef>T_assign</flowNodeRef>\n        <flowNodeRef>G_assign</flowNodeRef>\n        <flowNodeRef>T_contract</flowNodeRef>\n        <flowNodeRef>G_probation</flowNodeRef>\n        <flowNodeRef>T_sign</flowNodeRef>\n        <flowNodeRef>B_month</flowNodeRef>\n        <flowNodeRef>T_record</flowNodeRef>\n      </lane>\n      <lane id=\"L_head\" name=\"人力负责人（SH-E6）\">\n        <flowNodeRef>T_approve</flowNodeRef>\n        <flowNodeRef>G_approve</flowNodeRef>\n      </lane>\n      <lane id=\"L_sys\" name=\"系统\">\n        <flowNodeRef>E_registered</flowNodeRef>\n        <flowNodeRef>G_split</flowNodeRef>\n        <flowNodeRef>E_hiredate</flowNodeRef>\n        <flowNodeRef>T_effective</flowNodeRef>\n        <flowNodeRef>E_employed</flowNodeRef>\n        <flowNodeRef>E_assignchg</flowNodeRef>\n        <flowNodeRef>T_remind</flowNodeRef>\n        <flowNodeRef>End_remind</flowNodeRef>\n        <flowNodeRef>E_signed</flowNodeRef>\n        <flowNodeRef>G_join</flowNodeRef>\n        <flowNodeRef>End_ok</flowNodeRef>\n      </lane>\n    </laneSet>\n    <startEvent id=\"Start_1\" name=\"候选人已确认入职日\">\n      <documentation>前序：PRC-82 作出录用决定（AGG-62 录用决定已作出）</documentation>\n      <outgoing>F1</outgoing>\n      <messageEventDefinition id=\"ED_Start_1\" messageRef=\"Msg_confirm\"/>\n    </startEvent>\n    <userTask id=\"T_register\" name=\"登记入职\">\n      <documentation>AGG-62 登记入职；B-13。入职日为人事业务生效日，可提前登记、补登落回真实日期（U-12）</documentation>\n      <incoming>F1</incoming>\n      <outgoing>F2</outgoing>\n      <dataOutputAssociation id=\"DA_T_register_DS_62\"><targetRef>DS_62</targetRef></dataOutputAssociation>\n    </userTask>\n    <intermediateThrowEvent id=\"E_registered\" name=\"入职已登记\">\n      <documentation>〔缺〕新事件，登记时发出（SAMPLE S3）</documentation>\n      <incoming>F2</incoming>\n      <outgoing>F3</outgoing>\n      <signalEventDefinition id=\"ED_E_registered\" signalRef=\"Sig_registered\"/>\n    </intermediateThrowEvent>\n    <parallelGateway id=\"G_split\" name=\"\">\n      <incoming>F3</incoming>\n      <outgoing>F4</outgoing>\n      <outgoing>F8</outgoing>\n    </parallelGateway>\n    <intermediateCatchEvent id=\"E_hiredate\" name=\"入职日到达\">\n      <incoming>F4</incoming>\n      <outgoing>F5</outgoing>\n      <timerEventDefinition id=\"ED_E_hiredate\"><timeDate xsi:type=\"tFormalExpression\">入职日 00:00（业务生效日）</timeDate></timerEventDefinition>\n    </intermediateCatchEvent>\n    <serviceTask id=\"T_effective\" name=\"执行入职生效\">\n      <documentation>AGG-62 〔缺〕入职生效；B-13。补登时立即执行</documentation>\n      <incoming>F5</incoming>\n      <outgoing>F6</outgoing>\n      <dataOutputAssociation id=\"DA_T_effective_DS_62\"><targetRef>DS_62</targetRef></dataOutputAssociation>\n    </serviceTask>\n    <intermediateThrowEvent id=\"E_employed\" name=\"Employed\">\n      <incoming>F6</incoming>\n      <outgoing>F7</outgoing>\n      <signalEventDefinition id=\"ED_E_employed\" signalRef=\"Sig_employed\"/>\n    </intermediateThrowEvent>\n    <userTask id=\"T_assign\" name=\"建立任职\">\n      <documentation>AGG-63 建立任职；B-13。组织单元、职位（职位目录）、职级、汇报线、主 / 兼（Q-08、INV-62）</documentation>\n      <incoming>F8</incoming>\n      <incoming>F11</incoming>\n      <outgoing>F9</outgoing>\n      <dataOutputAssociation id=\"DA_T_assign_DS_63\"><targetRef>DS_63</targetRef></dataOutputAssociation>\n    </userTask>\n    <exclusiveGateway id=\"G_assign\" name=\"主任职区间不重叠？\">\n      <incoming>F9</incoming>\n      <outgoing>F10</outgoing>\n      <outgoing>F11</outgoing>\n    </exclusiveGateway>\n    <intermediateThrowEvent id=\"E_assignchg\" name=\"任职已变更\">\n      <incoming>F10</incoming>\n      <outgoing>F12</outgoing>\n      <signalEventDefinition id=\"ED_E_assignchg\" signalRef=\"Sig_assign\"/>\n    </intermediateThrowEvent>\n    <userTask id=\"T_contract\" name=\"提交劳动合同\">\n      <documentation>AGG-67 提交劳动合同；B-13。用人单位为法人三口径之一（Q-09）</documentation>\n      <incoming>F12</incoming>\n      <incoming>F15</incoming>\n      <incoming>F18</incoming>\n      <outgoing>F13</outgoing>\n      <dataOutputAssociation id=\"DA_T_contract_DS_67\"><targetRef>DS_67</targetRef></dataOutputAssociation>\n    </userTask>\n    <exclusiveGateway id=\"G_probation\" name=\"试用期在法定上限内？\">\n      <documentation>INV-14，劳动合同法第 19 条</documentation>\n      <incoming>F13</incoming>\n      <outgoing>F14</outgoing>\n      <outgoing>F15</outgoing>\n    </exclusiveGateway>\n    <userTask id=\"T_approve\" name=\"批准劳动合同\">\n      <documentation>AGG-67 批准劳动合同 / 〔缺〕驳回劳动合同；B-13。聚合内单级批准，不经审批平台（intent 114200 F-3）</documentation>\n      <incoming>F14</incoming>\n      <outgoing>F16</outgoing>\n      <dataOutputAssociation id=\"DA_T_approve_DS_67\"><targetRef>DS_67</targetRef></dataOutputAssociation>\n    </userTask>\n    <exclusiveGateway id=\"G_approve\" name=\"批准？\">\n      <incoming>F16</incoming>\n      <outgoing>F17</outgoing>\n      <outgoing>F18</outgoing>\n    </exclusiveGateway>\n    <manualTask id=\"T_sign\" name=\"签订劳动合同\">\n      <documentation>线下纸面签署（where: offline）；接电子签可改为外部系统</documentation>\n      <incoming>F17</incoming>\n      <outgoing>F19</outgoing>\n    </manualTask>\n    <boundaryEvent id=\"B_month\" name=\"用工满一个月未签\" attachedToRef=\"T_sign\" cancelActivity=\"false\">\n      <documentation>P-05，劳动合同法第 10、82 条</documentation>\n      <outgoing>F20</outgoing>\n      <timerEventDefinition id=\"ED_B_month\"><timeDate xsi:type=\"tFormalExpression\">入职日 + 1 个月</timeDate></timerEventDefinition>\n    </boundaryEvent>\n    <serviceTask id=\"T_remind\" name=\"提醒补签劳动合同\">\n      <documentation>P-05 提醒，不拒绝</documentation>\n      <incoming>F20</incoming>\n      <outgoing>F21</outgoing>\n    </serviceTask>\n    <endEvent id=\"End_remind\" name=\"已提醒\">\n      <incoming>F21</incoming>\n    </endEvent>\n    <userTask id=\"T_record\" name=\"登记劳动合同签订\">\n      <documentation>AGG-67 签订劳动合同；B-13。证据：已签署合同扫描件、签署日</documentation>\n      <incoming>F19</incoming>\n      <outgoing>F22</outgoing>\n      <dataOutputAssociation id=\"DA_T_record_DS_67\"><targetRef>DS_67</targetRef></dataOutputAssociation>\n      <dataOutputAssociation id=\"DA_T_record_DO_contract\"><targetRef>DO_contract</targetRef></dataOutputAssociation>\n    </userTask>\n    <intermediateThrowEvent id=\"E_signed\" name=\"劳动合同已签订\">\n      <incoming>F22</incoming>\n      <outgoing>F23</outgoing>\n      <signalEventDefinition id=\"ED_E_signed\" signalRef=\"Sig_signed\"/>\n    </intermediateThrowEvent>\n    <parallelGateway id=\"G_join\" name=\"\">\n      <incoming>F7</incoming>\n      <incoming>F23</incoming>\n      <outgoing>F24</outgoing>\n    </parallelGateway>\n    <endEvent id=\"End_ok\" name=\"已入职\">\n      <incoming>F24</incoming>\n    </endEvent>\n    <sequenceFlow id=\"F1\" sourceRef=\"Start_1\" targetRef=\"T_register\"/>\n    <sequenceFlow id=\"F2\" sourceRef=\"T_register\" targetRef=\"E_registered\"/>\n    <sequenceFlow id=\"F3\" sourceRef=\"E_registered\" targetRef=\"G_split\"/>\n    <sequenceFlow id=\"F4\" sourceRef=\"G_split\" targetR mndi:BPMNEdge>\n      <bpmndi:BPMNEdge id=\"DA_T_record_DS_74_di\" bpmnElement=\"DA_T_record_DS_74\"><di:waypoint x=\"720\" y=\"95\"/><di:waypoint x=\"720\" y=\"280\"/></bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge id=\"DA_T_profile_DS_93_di\" bpmnElement=\"DA_T_profile_DS_93\"><di:waypoint x=\"1040\" y=\"95\"/><di:waypoint x=\"1040\" y=\"280\"/></bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge id=\"DA_T_record_DO_receipt_di\" bpmnElement=\"DA_T_record_DO_receipt\"><di:waypoint x=\"720\" y=\"95\"/><di:waypoint x=\"720\" y=\"350\"/></bpmndi:BPMNEdge>\n      <bpmndi:BPMNEdge id=\"As_A_p_di\" bpmnElement=\"As_A_p\"><di:waypoint x=\"1200\" y=\"198\"/><di:waypoint x=\"1195\" y=\"420\"/></bpmndi:BPMNEdge>\n    </bpmndi:BPMNPlane>\n  </bpmndi:BPMNDiagram>\n</definitions>\n", "table": "<div class=\"tw\"><table><thead><tr><th>在哪</th><th>任务</th><th>对应的聚合、命令与说明</th></tr></thead><tbody><tr><td>线下</td><td>办理社保与公积金增员</td><td>在人社与公积金官方网办平台办理（where: offline）</td></tr><tr><td>本系统自动或调用</td><td>提醒办理参保</td><td>P-32 提醒</td></tr><tr><td>本系统操作</td><td>登记参保增员</td><td>AGG-74 参保增员；B-15。证据：社保与公积金增员回执、办理日</td></tr><tr><td>本系统操作</td><td>建立薪酬档案</td><td>AGG-93 建立薪酬档案；B-15。生效日 = 入职日（U-12）；敏感个人信息（ADR-0043）</td></tr></tbody></table></div>"}, {"title": "PRC-137 入职开通企业微信账号并绑定外部身份", "xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<definitions xmlns=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" id=\"Defs_PRC_137\" targetNamespace=\"https://forcitis.one/bpmn/PRC-137\" exporter=\"one-arch-people bpmngen\" exporterVersion=\"1\">\n  <signal id=\"Sig_registered\" name=\"入职已登记\"/>\n  <signal id=\"Sig_employed\" name=\"Employed\"/>\n  <message id=\"Msg_result\" name=\"开通结果\"/>\n  <collaboration id=\"Collab_PRC_137\">\n    <participant id=\"P_main\" name=\"FORCITIS one\" processRef=\"PRC-137\"/>\n    <participant id=\"P_wecom\" name=\"企业微信\"/>\n    <messageFlow id=\"M1\" name=\"创建成员（userid = 工号）\" sourceRef=\"T_open\" targetRef=\"P_wecom\"/>\n    <messageFlow id=\"M2\" name=\"开通结果\" sourceRef=\"P_wecom\" targetRef=\"E_result\"/>\n  </collaboration>\n  <process id=\"PRC-137\" name=\"入职开通企业微信账号并绑定外部身份\" isExecutable=\"false\">\n    <documentation>owner platform.identity（S-14）；Q-03；VS-07.3</documentation>\n    <laneSet id=\"LaneSet_1\">\n      <lane id=\"L_sys\" name=\"系统\">\n        <flowNodeRef>Start_1</flowNodeRef>\n        <flowNodeRef>T_pending</flowNodeRef>\n        <flowNodeRef>T_open</flowNodeRef>\n        <flowNodeRef>E_result</flowNodeRef>\n        <flowNodeRef>G_ok</flowNodeRef>\n        <flowNodeRef>T_bind</flowNodeRef>\n        <flowNodeRef>E_employed</flowNodeRef>\n        <flowNodeRef>T_allow</flowNodeRef>\n        <flowNodeRef>End_ok</flowNodeRef>\n      </lane>\n      <lane id=\"L_it\" name=\"信息（SH-E6）\">\n        <flowNodeRef>T_fix</flowNodeRef>\n        <flowNodeRef>B_due</flowNodeRef>\n      </lane>\n      <lane id=\"L_hr\" name=\"人力（SH-E6）\">\n        <flowNodeRef>T_alarm</flowNodeRef>\n        <flowNodeRef>End_alarm</flowNodeRef>\n      </lane>\n    </laneSet>\n    <startEvent id=\"Start_1\" name=\"入职已登记\">\n      <documentation>来自 PRC-83（B-13 AGG-62）</documentation>\n      <outgoing>F1</outgoing>\n      <signalEventDefinition id=\"ED_Start_1\" signalRef=\"Sig_registered\"/>\n    </startEvent>\n    <serviceTask id=\"T_pending\" name=\"建立待开通登录身份\">\n      <documentation>platform.identity 〔缺〕建立待开通登录身份。以人员 ID 为键，拟定 userid = 工号，登录放行起点 = 入职日</documentation>\n      <incoming>F1</incoming>\n      <outgoing>F2</outgoing>\n    </serviceTask>\n    <sendTask id=\"T_open\" name=\"开通企业微信成员\">\n      <documentation>platform.identity 〔缺〕开通企业微信成员，经 platform.integration 企业微信适配器（external:企业微信）。T-1 待用户：自动调接口（本图）或信息部门手工开通后确认</documentation>\n      <incoming>F2</incoming>\n      <incoming>F7</incoming>\n      <outgoing>F3</outgoing>\n    </sendTask>\n    <intermediateCatchEvent id=\"E_result\" name=\"收到开通结果\">\n      <incoming>F3</incoming>\n      <outgoing>F4</outgoing>\n      <messageEventDefinition id=\"ED_E_result\" messageRef=\"Msg_result\"/>\n    </intermediateCatchEvent>\n    <exclusiveGateway id=\"G_ok\" name=\"开通成功？\">\n      <incoming>F4</incoming>\n      <outgoing>F5</outgoing>\n      <outgoing>F6</outgoing>\n    </exclusiveGateway>\n    <serviceTask id=\"T_bind\" name=\"绑定外部身份\">\n      <documentation>platform.identity 〔缺〕绑定外部身份。按 userid 精确绑定，不模糊匹配</documentation>\n      <incoming>F5</incoming>\n      <outgoing>F8</outgoing>\n    </serviceTask>\n    <intermediateCatchEvent id=\"E_employed\" name=\"Employed\">\n      <documentation>来自 PRC-83，入职日到达</documentation>\n      <incoming>F8</incoming>\n      <outgoing>F9</outgoing>\n      <signalEventDefinition id=\"ED_E_employed\" signalRef=\"Sig_employed\"/>\n    </intermediateCatchEvent>\n    <serviceTask id=\"T_allow\" name=\"放行登录\">\n      <documentation>platform.identity；不设口令兜底（Q-03、SECURITY_INVARIANTS）</documentation>\n      <incoming>F9</incoming>\n      <outgoing>F10</outgoing>\n    </serviceTask>\n    <endEvent id=\"End_ok\" name=\"账号可用\">\n      <incoming>F10</incoming>\n    </endEvent>\n    <userTask id=\"T_fix\" name=\"处理开通失败\">\n      <documentation>信息部门修正（如 userid 被占用、接口报错）后重试</documentation>\n      <incoming>F6</incoming>\n      <outgoing>F7</outgoing>\n    </userTask>\n    <boundaryEvent id=\"B_due\" name=\"入职日已到仍未开通\" attachedToRef=\"T_fix\" cancelActivity=\"false\">\n      <outgoing>F11</outgoing>\n      <timerEventDefinition id=\"ED_B_due\"><timeDate xsi:type=\"tFormalExpression\">入职日</timeDate></timerEventDefinition>\n    </boundaryEvent>\n    <serviceTask id=\"T_alarm\" name=\"告警人力与信息部门\">\n      <documentation>不静默（CLAUDE.md 第 6 条）；时限待用户 T-2</documentation>\n      <incoming>F11</incoming>\n      <outgoing>F12</outgoing>\n    </serviceTask>\n    <endEvent id=\"End_alarm\" name=\"已告警\">\n      <incoming>F12</incoming>\n    </endEvent>\n    <sequenceFlow const bpmnCache = {};
function mountBpmn(){

  const g = host.dataset.g, files = BPMN[g] || [];

  if (!bpmnCache[g]){
    const box = document.createElement("div"); bpmnCache[g] = box; host.appendChild(box);
    for (const f of files){
      const h = document.createElement("p"); h.className = "legend2"; h.textContent = f.title;
      const c = document.createElement("div"); c.className = "bpmnc";
      const t = document.createElement("div"); t.innerHTML = f.table;
      box.append(h, c, t);
      if (!window.BpmnJS){ c.textContent = "流程图组件未加载（网络受限时可只看下表）"; continue; }
      const v = new window.BpmnJS({container: c});
      v.importXML(f.xml).then(() => { try { v.get("canvas").zoom("fit-viewport"); } catch(e){} }).catch(e => { c.textContent = "流程图加载失败：" + e.message; });
    }
  } else host.appendChild(bpmnCache[g]);
}

const ANSWERS = "answers", SUBMITS = "answers-submit";

const recOf = it => it.multi ? (it.recDefer ? "defer" : it.opts.flatMap((o, n) => o.rec ? [n] : [])) : it.opts.findIndex(o => o.rec);

function pick(it){

}
const kind = (it, p) => p.choice === "defer" && recOf(it) !== "defer" ? "defer" : same(p.choice, recOf(it)) ? (p.choice === "defer" ? "defer" : "rec") : "changed";

function qHTML(it){

  for (const it of ITEMS){ const k = kind(it, pick(it)); if (k === "rec") r++; else if (k === "changed") c++; else d++; }
  $("#nRec").textContent = r; $("#nChg").textContent = c; $("#nDef").textContent = d;
  const pct = n => (100 * n / ITEMS.length).toFixed(2) + "%";
  $("#bar").innerHTML = `<i style="width:${pct(r)};background:var(--pick)"></i><i style="width:${pct(c)};background:var(--changed)"></i><i style="width:${pct(d)};background:var(--defer)"></i>`;
  const done = GROUPS.filter(g => submits.has(g.id) && lastChange(g.id) <= submits.get(g.id).at).length;
  $("#subAll").textContent = `已提交 ${done} / ${GROUPS.length} 组`;
  refreshTabs();
  const el = document.getElementById("st-g"); if (el) el.textContent = stateText(cur);
}

async function store(key, body){
  if (!db){ $("#conn").textContent = "存储不可用：本次选择不会保存"; $("#conn").classList.add("off"); return; }
  try { body ? await db.collection(ANSWERS).doc(key).set(body) : await db.collection(ANSWERS).doc(key).delete(); }
  catch(e){ $("#conn").textContent = "保存失败：" + (e && e.message || "请稍后再试"); $("#conn").classList.add("off"); }
}
function setChoice(it, choice, note){
  const body = {item: it.no, choice, note: note ?? pick(it).note, by: myId, at: new Date().toISOString()};
  decisions.set(it.key, body); render(); store(it.key, body);
}

document.addEventListener("click", e => {
  const t = e.target;
  const nx = t.closest("[data-tab]");
  if (nx){ cur = nx.dataset.tab; flash = ""; navigated = true; render(); window.scrollTo(0, 0); return; }
  const q = t.closest(".q"), it = q && ITEMS.find(i => i.key === q.dataset.key);
  if (it){
    const o = t.closest("[data-opt]");
    if (o){
      const n = Number(o.dataset.opt);
      if (it.multi){ const c = pick(it).choice, a = Array.isArray(c) ? c.slice() : []; const i = a.indexOf(n); i < 0 ? a.push(n) : a.splice(i, 1); setChoice(it, a.sort((x, y) => x - y)); }
      else setChoice(it, n);
      return;
    }
    if (t.closest("[data-defer]")){ const r = recOf(it); setChoice(it, pick(it).choice === "defer" ? (r === "defer" ? [] : r) : "defer"); return; }
    if (t.closest("[data-reset]")){ decisions.delete(it.key); render(); store(it.key, null); return; }
  }
  const foot = t.closest(".foot"); if (!foot) return;
  const box = foot.querySelector(".confirm");
  if (t.closest("[data-submit]")){ box.querySelector("p").textContent = summary(foot.dataset.g) + "。未作答的题按「暂不定」提交，可以以后再改。"; box.hidden = false; return; }
  if (t.closest("[data-no]")){ box.hidden = true; return; }
  if (t.closest("[data-yes]")){
    box.hidden = true;
    const gid = foot.dataset.g, el = document.getElementById("st-g");
    if (!db){ el.textContent = "存储不可用，未能提交"; return; }
    const picks = {};
    for (const it of ITEMS.filter(i => i.grp === gid)){
      const p = pick(it);
      picks[it.key] = {no: it.no, choice: p.choice, label: labelOf(it, p.choice), recommended: same(p.choice, recOf(it)), defaulted: p.defaulted, note: p.note};
    }
    const body = {at: new Date().toISOString(), by: myId, summary: summary(gid), picks};
    db.collection(SUBMITS).doc(gid).set(body).then(() => {
      submits.set(gid, body);
      const at = GROUPS.findIndex(x => x.id === gid);
      const nx = [...GROUPS.slice(at + 1), ...GROUPS.slice(0, at)].find(x => !isDone(x.id));
      const title = GROUPS[at].title;
      if (nx){ cur = nx.id; flash = `「${title}」已提交，进入下一组「${nx.title}」。`; } else flash = "";
      render(); window.scrollTo(0, 0);
    })
      .catch(err => { el.textContent = "提交失败：" + (err && err.message || "请稍后再试"); });
  }
});
const pending = new Map();
document.addEventListener("input", e => {
  if (!e.target.dataset.note) return;
  const it = ITEMS.find(i => i.key === e.target.closest(".q").dataset.key), v = e.target.value;
  clearTimeout(pending.get(it.key));
  pending.set(it.key, setTimeout(() => {
    pending.delete(it.key);
    const body = {item: it.no, choice: pick(it).choice, note: v, by: myId, at: new Date().toISOString()};
    decisions.set(it.key, body); store(it.key, body); stats();
  }, 700));
});

$("#side").innerHTML = (DATA.side || []).map(b => `<details class="info"><summary>${esc(b.title)}</summary><ul>${b.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>`).join("");
render();
(async () => {
  try { const u = await window.claude?.use?.("user"); myId = u ? await u.id() : null; } catch(e){}
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){ $("#conn").textContent = "存储不可用：请登录 claude.ai 后打开本页，选择才会保存"; $("#conn").classList.add("off"); return; }
  $("#conn").textContent = "已连接。选择自动存为草稿，每组点「提交本组」才算数";
  db.collection(SUBMITS).get().then(snap => {
    for (const d of snap.docs) if (GROUPS.some(g => g.id === d.id)) submits.set(d.id, d.data());
    // 打开时停在第一个未提交的组，已提交的组不再挡在前面
    const first = GROUPS.find(x => !isDone(x.id));
    if (!navigated && first) cur = first.id;
    render();
  }).catch(() => {});
  let queued = false;
  db.collection(ANSWERS).onSnapshot(snap => {
    let changed = false;
    for (const ch of snap.docChanges()){
      const key = ch.doc.id;
      if (!ITEMS.some(i => i.key === key) || pending.has(key)) continue;
      if (ch.type === "removed"){ if (decisions.delete(key)) changed = true; }
      else { const b = ch.doc.data(); if (b){ decisions.set(key, {...b}); changed = true; } }
    }
    if (!changed) return;
    if (document.activeElement?.matches?.("input[data-note]")){ stats(); return; }
    if (!queued){ queued = true; setTimeout(() => { queued = false; render(); }, 60); }
  }, err => { $("#conn").textContent = "存储连接中断：" + (err && err.message || ""); $("#conn").classList.add("off"); });
})();
})();
</script>
