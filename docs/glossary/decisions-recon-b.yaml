  card: NAM-1017-GLO-07
  rework: 2
  date: '2026-10-17'
  promotion_counts:
    B: 105
  policy: B105 逐项复核；技术词只定英文、kind、bc、scope，中文与定义保持原提议（仅按本轮用户明确指令修正文义依赖）；业务、会计、合同、法律、经营事件一律保持 proposed 并交 C。
sources:
  D3:
    type: design
    file: docs/adr/ADR-0053.md
    clause: '3'
    decision: '3'
    task: NAM-1017-GLO-07
    sha256: 4bce486a25e957091d88120201e35e0cd81b15eed913ca867a4add2747cafb37
    evidence:
      clause: '3'
      text: 3. **组合**：命令、事件、状态取值等以结构化槽位（对象、动词及细则定义的其他槽位）为源，按受控词表与语言渲染成指称，不做字符串翻译；守护只校验渲染结果等于登记的指称。由名字反解槽位只作迁移工具。不能由槽位生成的名字作为例外逐条登记并说明理由。动词表、状态词表、槽位与模板属细则。
    content_sha256: 83ce58a905adde354a3984bb63303bf2d6df445fdf2eb0d4bf30cfb068a80751
  D4:
    type: design
    file: docs/adr/ADR-0053.md
    clause: '4'
    decision: '4'
    task: NAM-1017-GLO-07
    sha256: 4bce486a25e957091d88120201e35e0cd81b15eed913ca867a4add2747cafb37
    evidence:
      clause: '4'
      text: "4. **命名面归属**：`NAMING_STANDARD.md` 是全部命名面细则的唯一入口（CODING_STANDARD 同例），逐面写明格式、细则所在文件、守护与负责会话；某面细则另有专门文件时（如 `bcs.yaml`、`ddd/contexts.yaml`、ACL 归类）只指向它。命名面至少包括：\n   - 领域：概念、聚合、实体、值对象、命令、事件、状态、读模型；\n\
        \   - 流程与架构：流程、能力、价值流、阶段、业务对象、文档与卡编号；\n   - 结构：命名空间、bc 自身的标识与中文名、Java 包；\n   - 代码：领域以外的类，方法，枚举与常量；\n   - 数据：schema、表、列、约束、索引、触发器、函数、序列、迁移文件、报表视图与 BI 列、存库的枚举取值码、数据库角色与账号；\n   - 接口：HTTP 路径与查询参数、JSON\
        \ 字段、OpenAPI schema、事件载荷键、事件主题与队列名、错误码、导入导出文件名与列头；\n   - 授权：权限码、角色码；\n   - 运行：业务编号规则代码、配置键、作业、锁、指标、日志字段、审计动作名、BPMN 流程与用户任务键、决策键、缓存键、对象存储与附件路径；\n   - 界面：界面文字与消息键（PC、H5、服务端发给人的文字）、通知模板编号、前端路由、前端目录、文件、组件、设计令牌；\n\
        \   - 外部：外部系统与 ACL 名；\n   - 工程：测试名、分支、提交。\n\n   新增命名面只在 NAMING_STANDARD 加一行并挂守护；无守护的面标「待建」并写阶段，期间由复审检查。"
    content_sha256: 1977dfcdbeafbc961037a7c4bc70d62fea9d0208c316da746cf8cb53afdb28cd
  D8:
    type: design
    file: docs/adr/ADR-0053.md
    clause: '8'
    decision: '8'
    task: NAM-1017-GLO-07
    sha256: 4bce486a25e957091d88120201e35e0cd81b15eed913ca867a4add2747cafb37
    evidence:
      clause: '8'
      text: 8. **变更边界**：细则与词表的变更（新增词、指称、语言、命名面、动词、模板、格式、缩写）不需 ADR；本 ADR 任一决定的变更按 ADR 生命周期另开 ADR。
    content_sha256: b44cdfcb5c60d28ec259e8ef73dc7c36f6de32b97a44151415de214622e4896a
  U_R2:
    type: user
    origin: session_instruction
    file: docs/glossary/arch-naming/b-class-decisions.md
    date: '2026-10-17'
    batch: NAM-1017-GLO-07
    evidence:
      text: 2026-10-17，NAM-1017-GLO-07（返工第 2 轮），用户要求：“最重要的原则：设计方只能定‘技术/结构/枚举/ACL 技术概念’的英文名、kind、bc、scope；任何业务、会计、合同、法律、经营事件含义的用语都不得由设计方批准，一律保持 proposed 并进 C 类问题”。用户明确要求逐条处理复审，其中低7原文：“project_established
        的定义里有‘老系统’；org_change_set 的定义用了 sync_run 已禁用的‘同步运行’：改掉。”本转录只支持这两条定义去掉旧名依赖，不代表任何新业务用语获批。
    content_sha256: 90717caac3782f9d9f70694492b76c905a1760fec434cf8e3a8cccc1b76f6407
    sha256: 49bbee5e8b5dafe6f9ff9ef69334e1a25919d3ed6a0121b49cff26e283d953fb
    field_authorizations:
      org_change_set:
      - definition
      project_established:
      - definition
