# 用语确认第二轮（2026-10-14，psa-terms-review）：每项的建议。确认页与入表都以本文件为准。
# 对象：backend/glossary/proposed/*.yaml 的 58 条提议术语（P 组）、OA 盘点登记的 20 个 A8 叫法（A 组，见 oa_aliases.json）、新 BC 命名 2 项（N 组）。
# sug：approve = 按原提议转正式；change = 按本文件的 zh / en / definition 修改后转正式；merge = 不单立，并入已有正式用语 into，原写法归为禁用。
# dialect：确认后归为方言（列入 forbidden）的中文叫法；forbid_en：确认后列入禁用的英文写法（代码改完之后才写入，见 code）。
# code：需要 1a 会话改的代码（本会话不改 backend 代码）；为空表示无需改代码。
# 判断：主会话（Opus 5.5）依据 ADR-0018 用语优先级与 NAMING_STANDARD；未派子代理。

# 1a 会话改完代码后在此登记 P 组 id（如 audit_trail），build_terms.py 随即把该条的 forbid_en 写入禁用。
code_renamed: [declared-hours, web_scan, direct_leader, audit_trail]

P:
  # ---------- template-carryover.yaml（架构守护模板带来的 33 条，含评估遗留的 cost / error-code / capacity / scheduler-lock） ----------
  hours:
    sug: change
    zh: 小时数
    why: 正式用语「工时」已是 TimeEntry（工时条目）的中文名；值对象 Hours 只是小时数量，再叫「工时」会同名异义。英文不变。
    code: 无（目前没有 hours 列；以后 hours 列的注释以「小时数」开头）
  declared-hours:
    sug: change
    zh: 填报工时
    en: SubmittedHours
    why: 「填报」的正式英文已定为 Submit（SubmitTimesheet，第一轮 C66），同一动作不另用 Declared。
    forbid_en: [DeclaredHours]
    code: cost.timesheet.domain.Timesheet 的组件 declaredHours → submittedHours（及其调用、JSON 字段、列名 declared_hours 如有）
  work-date: {sug: approve}
  planned-hours:
    sug: change
    definition: 工作包预算的小时数。
    why: 原定义用了方言「任务包」（第一轮已定为工作包 WorkPackage），只改定义。
  actual-hours:
    sug: change
    definition: 已审批通过、计入工作包的小时数。
    why: 同上，定义中的「任务包」改为「工作包」。
  remaining-hours:
    sug: approve
    why: 计划工时减实际工时的机械差额；与 EVM 的完工尚需估算 ETC（estimate_to_complete，人工估计）不同，两者并存。
  budget:
    sug: merge
    into: project_budget
    why: 已有正式用语「项目预算 ProjectBudget」（WBS 预算）与「成本预算 CostBudget」；单独的「预算 Budget」会与二者重叠。
    forbid_en: []
    code: 权限码 delivery.execution:budget:update → delivery.execution:project-budget:update（Permission.DELIVERY_BUDGET_UPDATE）
  delivery: {sug: approve}
  document: {sug: approve}
  document-type: {sug: approve}
  document-number:
    sug: approve
    dialect: [业务编号]
    why: 同一概念只留一个正式名「单据编号」，「业务编号」归方言。
    code: platform_numbering schema 注释「业务编号（…）」改为「单据编号（…）」；文档中的「业务编号」随后替换
  numbering-rule: {sug: approve}
  numbering-pattern: {sug: approve}
  numbering-counter: {sug: approve}
  reset-policy:
    sug: approve
    why: ResetPolicy 已用于枚举、接口字段与列名；Policy 在经营口径 BC 另有含义，但按 BC 隔离可接受，不值得改名。
  period-key: {sug: approve}
  approval-instance:
    sug: approve
    dialect: [流程实例]
    why: 界面与文档统一称「审批实例」；Flowable 的 ProcessInstance 是第三方类型，不受影响。
  approval-process: {sug: approve}
  process-key: {sug: approve}
  business-key: {sug: approve}
  initiator: {sug: approve}
  approver: {sug: approve}
  task:
    sug: change
    en: ApprovalTask
    why: 单独的 Task 会与「工作包」（原「任务包」）、「任务订单 TaskOrder」同名异义；用 ApprovalTask 限定为审批任务。
    code: 无（代码中没有名为 Task 的类型；审计键已写作 approval-task）
  routing-flag: {sug: approve}
  money: {sug: approve}
  amount: {sug: approve}
  currency: {sug: approve}
  business-date: {sug: approve}
  progress-recognition:
    sug: merge
    into: revenue_recognition
    why: 第一轮已裁定「收入确认准备」「产值」是「收入确认单 RevenueRecognition」的方言；不再单立。
    forbid_en: [ProgressRecognition]
    code: 无（backend 未使用）
  cost: {sug: approve}
  error-code: {sug: approve}
  capacity:
    sug: change
    en: NumberingCapacity
    why: Capacity 在工时 BC 已是「产能」（闲置产能 IdleCapacity、产能变现）；编号模块的容量用 NumberingCapacity 限定。
    code: 无必改（capacity 一词仍登记；CheckCounterCapacity 等可保留）
  scheduler-lock:
    sug: approve
    dialect: [作业锁]
  # ---------- platform-contracts.yaml（Phase 1a 契约 25 条） ----------
  wecom:
    sug: approve
    why: 腾讯官方英文名 WeCom，按「缩写按单词处理」写作 Wecom。
  wecom_entry: {sug: approve}
  workbench:
    sug: approve
    dialect: [H5]
    why: 老系统把工作台网页叫 H5，归方言。
  mini_program: {sug: approve}
  web_scan:
    sug: change
    en: QrCodeLogin
    why: WebScan 易读成「网页扫描」；企业微信文档的说法是扫码登录（QR code login）。
    forbid_en: [WebScan]
    code: platform.integration.api.WecomEntry 枚举常量 WEB_SCAN → QR_CODE_LOGIN（及调用、测试）
  identity: {sug: approve}
  organization: {sug: approve}
  workforce: {sug: approve}
  employment_status: {sug: approve}
  employed: {sug: approve}
  separated: {sug: approve}
  fee_earner:
    sug: approve
    why: Fee earner 是专业服务业通行写法；定义已写明它不是可计费性判定。
  direct_leader:
    sug: change
    zh: 直属上级
    en: Supervisor
    dialect: [直属领导]
    why: DirectLeader 是中式英文；HR 系统通行 Supervisor（直属上级）。不用 LineManager，避免与禁用后缀 Manager 混淆。
    forbid_en: [DirectLeader]
    code: organization.workforce.api.OrgDirectory#findDirectLeader → findSupervisor（及实现、测试）
  org_unit_head: {sug: approve}
  regional_receivables_manager:
    sug: approve
    dialect: [区域 AR]
  ancestor: {sug: approve}
  employee_profile:
    sug: change
    zh: 员工概况
    why: Profile 不是「快照」；快照是 OrgSnapshot。英文不变。
  org_unit_profile:
    sug: change
    zh: 组织单元概况
    why: 同上。
  org_snapshot: {sug: approve}
  sync_run:
    sug: change
    zh: 同步记录
    why: 「同步运行」不是通顺的中文；英文 SyncRun 不变。
  role_holder: {sug: approve}
  audit_trail:
    sug: merge
    into: audit_log
    dialect: [审计轨迹]
    why: 与已批准的「审计日志 AuditLog」（只追加、不可篡改、可回放）是同一概念，两个名字会漂移。
    forbid_en: [AuditTrail]
    code: platform.audit.api.AuditTrail 接口改名 AuditLog（及实现、注入点、测试）
  actor: {sug: approve}
  on_behalf_of: {sug: approve}
  subject:
    sug: change
    en: AuditSubject
    why: Subject 在身份认证里指登录主体（JWT sub），用 AuditSubject 限定为审计对象。
    code: 无必改（subject 一词仍登记；AuditEntry.subjectKey 可保留）

# A 组：OA 盘点登记的 A8 叫法，键 = 「词条 id / 叫法」。含「产值」的 2 个已按用户裁定自动归为方言，不在表中；其余 20 个全部建议归为方言；note 写明需另行确认的口径。
A:
  ar_written_off/应收坏账申请: {sug: dialect, note: 用户 2026-10-14 答复：这张单是「计提」坏账准备，不是核销；坏账准备计提词条（预期信用损失）在 6b 起草后，本叫法改挂到该词条下}
  subcontract_cost/项目委外: {sug: dialect, note: 用户 2026-10-14 答复：「两种都有，按单据区分」——按成果验收计价的进「分包成本 SubcontractCost」，按工时 / 人月计价且人员受我方管理的进「外包成本 OutsourcingCost」}
  contract_liability/预收款单: {sug: dialect, note: 预收款单是收款单据，合同负债是余额；新系统中单据叫回款单（预收款类型），余额叫合同负债}
  final_account/项目结算: {sug: dialect}

# N 组：新 BC 命名（模块路径与蓝图编号由 psa-gl-scope 统一，这里只给中英文名）
N:
  attendance:
    old: 假勤（暂定 organization.attendance，6e）
    zh: 考勤与休假
    en: organization.attendance
    dialect: [假勤]
    why: Time and Attendance 是 SAP、Oracle 等 HR 系统的通行模块名，含休假（absence）；「假勤」是企业微信、钉钉的产品叫法，归方言。
  payables:
    old: 应付与付款（新建 BC，6c）
    zh: 应付与付款
    en: payables.payment
    why: 与 receivables.collection 对称；中文「应付」对应《企业会计准则第 30 号》报表项目应付账款。不用 disbursement：在专业服务业它指代垫费用（可向客户转收的支出），会同名异义。子域 payables 是否单设由 psa-gl-scope 定。
