        个月未签约自动转费用；A8 期初用期初调整分录补差；A9 维持一次切换；A10 现金口径变更年度附注披露；A11 保理按追索权分流、管理回款单列；A12 维持现金标注加间接法；A13 设第 13 期只收年度审计调整
