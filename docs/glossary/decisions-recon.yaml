      rulings:
      - F-1 证据挂法：在质量与认可 BC（delivery.acceptance）内加「证据关联」记录，记证据挂哪个交付物或阶段，证据本身只存内容、采集人只存 ID（不新增 BC、不新增边，多一个技术聚合）
