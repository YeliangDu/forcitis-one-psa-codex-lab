  S026:
    file: docs/decisions/2026-10-15-202939-one-architecture-售前业务对象问题页保存-线索单独.md
    question: ''
    date: '2026-10-15'
    batch: 2026-10-15-202939-one-architecture-售前业务对象问题页保存-线索单独
    submission: null
    sha256: dcd5feaa772924cc714ff2d3cf9d62d099276b2563eec5f5375bdf2d863a65c6
    evidence:
      text: 售前业务对象问题页保存：线索单独登记，确认后才建商机；线索来源有招标公告、老客户再委托、介绍、主动开发、市场活动、内部推荐；大部分项目要投标；投标是独立过程，报价只是其中一部分；一个商机经常多轮报价；丢单要记原因；框架协议偶尔用（约 40% 是战略客户，战略协议约定单价，具体项目仍签约并采用协议价格）；签约前先行投入常见；分包合同要在新系统管；需要按客户集团汇总；负责人是销售，商机阶段交付团队和方案团队提交方案、辅助投标，商务谈判由公司管理层参与
