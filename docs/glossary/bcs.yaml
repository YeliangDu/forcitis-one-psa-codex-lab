# bcs.yaml — 限界上下文（bc）与子域清单：词条的 bc、kernel 词条的 used_by 只能取这里的 id（one-glossary 维护，B1）
# 可选键 status: retired：bc 已退役，只为与 contexts.yaml 的 id 集一致而留（NamingSurfaceTest 单向检查：contexts.yaml 的每个 id 都在此登记），不得再登记词条。
# kind：subdomain 子域 / bc 限界上下文 / kernel 共享内核；system 外部系统与本系统的名字（B2，不是 bc，不能作词条的 bc；有 status 时按其登记，缺省 approved）；business_owner：每个 bc 的业务确认人（intent 2026-10-15-171959 第 7 条：人选另问用户，未定前由用户兼任）
# words（可选列表，不是 kind）：该 bc 描述中、不另立词条的业务用语（B2：原为词条的子域 / 模块名与概念），只供前端界面文字检查放行；纯中文、两字以上，不得是正式词条名或禁用写法；要登记成词条先走用语流程。
