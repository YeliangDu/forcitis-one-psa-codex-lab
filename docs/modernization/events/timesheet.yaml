components:
  messages:
    TimesheetSubmitted:
      name: TimesheetSubmitted
      title: 工时单提交审批（进入新一轮）
      description: 工时单提交审批，进入新一轮；过程里程碑，不过账。审批由本事件异步发起（H-1）：cost.timesheet 的监听器据此调用审批端口，一个事务只改一个聚合。事件带齐发起审批所需的全部信息。工时单事件的 businessDate 一律取工作日期（work_date）；提交日在 submittedOn。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          employee:
            type: object
            properties:
              value:
                type: integer
                format: int64
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          number:
            type: object
            properties:
              value:
                type: string
            x-type: DocumentNumber
            description: 单据编号，创建时取号
          projectManager:
            type: object
            properties:
              value:
                type: integer
                format: int64
            description: 项目经理，工时审批第一道审批人
          submittedOn:
            type: string
            format: date
            description: 提交日：员工提交审批的业务日期；与工作日期是两件事
          routingFlags:
            type: array
            items:
              type: string
              enum:
              - PROJECT_HOURS
              - PRE_SALES_HOURS
              - OVERHEAD_HOURS
            description: 审批路由标记，业务模块算好，流程只读
          contentHash:
            type: object
            properties:
              value:
                type: string
            x-type: ContentHash
            description: 提交内容的摘要：同一审批人同一节点内容未变则自动通过
          summary:
            type: object
            properties:
              value:
                type: string
            x-type: ApprovalSummary
            description: 业务摘要，审批卡片显示它
      x-event:
        eventType: cost.timesheet.TimesheetSubmitted
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetSubmitted
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        - cost.timesheet
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        relatedAggregates: 首次提交同事务取号时列出 NumberingRule（登记在 architecture/multi-aggregate-exceptions.txt）
    TimesheetApproved:
      name: TimesheetApproved
      title: 工时单审批通过，工时成立
      description: 工时单审批通过，工时成立；过程里程碑，形成成本事实的是 Phase 2 的过账事件，届时再定是否使用本事件。businessDate 为工作日期。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          employee:
            type: object
            properties:
              value:
                type: integer
                format: int64
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
      x-event:
        eventType: cost.timesheet.TimesheetApproved
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetApproved
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时累积快照与 Phase 2 成本过账将订阅；现在就发布，是因为工时成立的时刻只在发生当时可记录，事后补不回
    TimesheetRejected:
      name: TimesheetRejected
      title: 工时单被驳回，工时不成立
      description: 工时单被驳回，工时不成立；过程里程碑。现行 TIMESHEET 流程的三路都在子流程内，驳回即退回，所以这个事件目前只在流程以 REJECTED 结束时才会出现。businessDate 为工作日期。
