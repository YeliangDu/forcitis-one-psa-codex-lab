# 事件目录分片（AsyncAPI 3 的 components.messages）：本模块的事件由 build_asyncapi.py 合成 asyncapi.yaml
components:
  messages:
    TimesheetSubmitted:
      name: TimesheetSubmitted
      title: 工时单提交审批（进入新一轮）
      description: 工时单提交审批，进入新一轮；过程里程碑，不过账。工时单事件的 businessDate 一律取工作日期（work_date），提交、办理的日期不是 businessDate，需要的话由分析层从事件的 occurredAt 或审批事件里取。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          employee:
            type: object
            properties:
              value:
                type: integer
                format: int64
          workPackageId:
            type: object
            properties:
              value:
                type: integer
                format: int64
            description: 任务包
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          approvalInstanceId:
            type: object
            properties:
              value:
                type: string
            description: 本轮审批流程实例 ID
      x-event:
        eventType: cost.timesheet.TimesheetSubmitted
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetSubmitted
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时提交里程碑将订阅；现在就发布，是因为提交时刻只在发生当时可记录，事后补不回
    TimesheetApproved:
      name: TimesheetApproved
      title: 工时单审批通过，工时成立
      description: 工时单审批通过，工时成立；过程里程碑，形成成本事实的是 Phase 2 的过账事件，届时再定是否使用本事件。businessDate 为工作日期。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          employee:
            type: object
            properties:
              value:
                type: integer
                format: int64
          workPackageId:
            type: object
            properties:
              value:
                type: integer
                format: int64
            description: 任务包
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
      x-event:
        eventType: cost.timesheet.TimesheetApproved
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetApproved
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时累积快照与 Phase 2 成本过账将订阅；现在就发布，是因为工时成立的时刻只在发生当时可记录，事后补不回
    TimesheetRejected:
      name: TimesheetRejected
      title: 工时单被驳回，工时不成立
      description: 工时单被驳回，工时不成立；过程里程碑。现行 TIMESHEET 流程的三路都在子流程内，驳回即退回，所以这个事件目前只在流程以 REJECTED 结束时才会出现。businessDate 为工作日期。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          employee:
            type: object
            properties:
              value:
                type: integer
                format: int64
          workPackageId:
            type: object
            properties:
              value:
                type: integer
                format: int64
            description: 任务包
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 驳回原因
      x-event:
        eventType: cost.timesheet.TimesheetRejected
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetRejected
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时累积快照将订阅；现在就发布，是因为驳回时刻只在发生当时可记录，事后补不回
