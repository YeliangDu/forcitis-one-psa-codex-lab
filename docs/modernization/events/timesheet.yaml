components:
  messages:
    TimesheetSubmitted:
      name: TimesheetSubmitted
      title: 工时单提交审批（进入新一轮）
      description: 工时单提交审批，进入新一轮；过程里程碑，不过账。请审批模块发起这一轮审批的是另一个事件 DocumentSubmittedForApproval（H-1），本事件只陈述事实：一个事务只改一个聚合，两者由同一次提交记录。工时单事件的 businessDate 一律取工作日期（work_date）；提交日在 submittedOn。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          employee:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 稳定 ID 的字符串形式
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          number:
            type: object
            properties:
              value:
                type: string
            x-type: DocumentNumber
            description: 单据编号，创建时取号
          projectManager:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 项目经理，工时审批第一道审批人
          submittedOn:
            type: string
            format: date
            description: 提交日：员工提交审批的业务日期；与工作日期是两件事
      x-event:
        eventType: cost.timesheet.TimesheetSubmitted
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetSubmitted
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时提交时效统计将订阅；现在就发布，是因为提交的时刻只在发生当时可记录，事后补不回
        relatedAggregates: 首次提交同事务取号时列出 NumberingRule（登记在 architecture/multi-aggregate-exceptions.txt）
    TimesheetApproved:
      name: TimesheetApproved
      title: 工时单审批通过，工时成立
      description: 工时单审批通过，工时成立；过程里程碑，形成成本事实的是 Phase 2 的过账事件，届时再定是否使用本事件。businessDate 为工作日期。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          employee:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 稳定 ID 的字符串形式
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
      x-event:
        eventType: cost.timesheet.TimesheetApproved
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetApproved
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时累积快照与 Phase 2 成本过账将订阅；现在就发布，是因为工时成立的时刻只在发生当时可记录，事后补不回
    TimesheetRejected:
      name: TimesheetRejected
      title: 工时单被驳回，工时不成立
      description: 工时单被驳回，工时不成立；过程里程碑。现行 TIMESHEET 流程的三路都在子流程内，驳回即退回，所以这个事件目前只在流程以 REJECTED 结束时才会出现；驳回后填报人可改原单再提交。businessDate 为工作日期。
      payload:
        type: object
        properties:
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: string
                x-type: DocumentId
                format: uuid
          employee:
            type: string
            x-type: EmployeeId
            format: uuid
            description: 稳定 ID 的字符串形式
          submittedHours:
            type: object
            properties:
              value:
                type: number
            description: 填报工时，非负，两位小数
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 驳回原因
      x-event:
        eventType: cost.timesheet.TimesheetRejected
        version: 1
        class: com.forcitis.one.cost.timesheet.events.TimesheetRejected
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: cost.timesheet
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 工作日期（work_date）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的工时累积快照将订阅；现在就发布，是因为驳回时刻只在发生当时可记录，事后补不回
