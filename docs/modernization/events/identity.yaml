# 事件目录分片（AsyncAPI 3 的 components.messages）：本模块的事件由 build_asyncapi.py 合成 asyncapi.yaml
components:
  messages:
    RoleCreated:
      name: RoleCreated
      title: 角色新增
      payload:
        type: object
        properties:
          roleId:
            type: string
            format: uuid
            x-type: RoleId
            description: 稳定 ID 的字符串形式
          roleVersionId:
            type: string
            format: uuid
            x-type: RoleVersionId
            description: 角色版本 ID：新建时开启的版本 1（ADR-0034 第 1 项第 2 条）
      x-event:
        eventType: platform.identity.RoleCreated
        version: 1
        class: com.forcitis.one.platform.identity.events.RoleCreated
        aggregate: Role
        idempotencyKey: eventId
        publisher: platform.identity
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：不是带日期的业务里程碑（运维或配置变更）
        audit: audited
        publisherTest: com.forcitis.one.platform.identity.domain.IdentityStateMachineTest
        noConsumer: 暂无消费方：数据权限（ADR-0026）与会话缓存失效将订阅；现在就发布，是因为授权变化只在发生当时可被记录，补不回
