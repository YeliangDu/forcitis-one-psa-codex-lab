    ApprovalTaskOverdue:
      name: ApprovalTaskOverdue
      title: 任务超过审批时限仍未处理（只提醒，不自动通过）
      description: 任务超过审批时限仍未处理，只提醒，不自动通过；过程事实，不过账，计入时效统计。由定时作业触发，aggregateVersion 取所属任务聚合的序号。通知监听器据此给处理人发企业微信提醒。
      x-event:
        eventType: platform.approval.ApprovalTaskOverdue
        version: 1
        class: com.forcitis.one.platform.approval.events.ApprovalTaskOverdue
        aggregate: ApprovalTask
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 记录超时当日（Asia/Shanghai）；截止时刻在负载 dueAt
        audit: 'not-audited: 只是提醒，不改变任何人的处理权限；超时升级（ApprovalTaskEscalated）才改变处理人，并被审计'
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
      payload:
        type: object
        required:
        - envelope
        - taskId
        - instanceId
        - document
        - nodeKey
        - dueAt
        - holders
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
