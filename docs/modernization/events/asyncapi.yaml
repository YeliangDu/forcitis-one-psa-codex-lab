components:
  schemas:
    EventEnvelope:
      type: object
      description: 所有领域事件共用的信封，字段定义见 proposals/EVENT_ANALYTICS_FIELDS.md（以第 6 节为准）；负载只放业务字段，只含 ID 与值对象
      required:
      - eventId
      - eventType
      - schemaVersion
      - occurredAt
      - aggregateType
      - aggregateId
      - aggregateVersion
      - correlationId
      - actorType
      - actorId
      - source
      - relatedAggregates
      properties:
        eventId:
          type: string
          format: uuid
          description: UUIDv7，兼作消费方的幂等键
        eventType:
          type: string
          description: <子域>.<BC>.<事件名>
        schemaVersion:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
          description: 取自注入的 Clock；不用于期间归属
        aggregateType:
          type: string
        aggregateId:
          type: string
        aggregateVersion:
          type: integer
          format: int64
          description: 按聚合计数的事件序号，同一事务内连续编号
        correlationId:
          type: string
          format: uuid
          description: 同一业务操作的全部事件共用；来自 X-Correlation-Id
        causationId:
          type: string
          format: uuid
          nullable: true
          description: 直接上游事件的 eventId，根事件为空
        actorType:
          type: string
          enum:
          - USER
          - SYSTEM
        actorId:
          type: string
          description: 用户 ID，或作业 / 监听器名；不带姓名
        legalEntityId:
          type: string
          format: uuid
          nullable: true
          description: 属于某个法人的聚合必填；只有平台级事件为空
        businessDate:
          type: string
          format: date
          nullable: true
          description: 按 Asia/Shanghai 截日；取哪个日期见各事件的 x-event.businessDate
        source:
          type: object
          properties:
            system:
              type: string
              enum:
              - ONE
              - MIGRATION
            documentRef:
              type: string
              nullable: true
        accountingPeriod:
          type: string
          nullable: true
          description: 只由过账管道写入
        relatedAggregates:
          type: array
          items:
            type: object
            properties:
              aggregateType:
                type: string
              aggregateId:
                type: string
  messages:
    ApprovalCompleted:
      name: ApprovalCompleted
      title: 审批结束（已通过 / 已驳回 / 已退回 / 已撤销）
      description: 审批结束（已通过、已驳回、已退回、已撤销）。aggregateId 是 单据类型:单据标识，如 TIMESHEET:7；过程里程碑，不过账。发起人撤回（RULE-269）以 RETURNED 结束本轮，与审批人退回同形，区别看信封 actorId 是否为发起人以及 reason。消费方 cost.timesheet 按 eventId 幂等，轮次与等待中的轮次不符则忽略；分析层 L1 用于审批时效。 发起人撤回与审批人退回同形，用 returnSource 区分；platform.approval 的通知监听器据此给发起人发完成卡片（D-1a-135）。
      x-event:
        eventType: platform.approval.ApprovalCompleted
        version: 1
        class: com.forcitis.one.platform.approval.events.ApprovalCompleted
        aggregate: ApprovalRequest
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - cost.timesheet
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 审批结束当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalRequestStateMachineTest
      payload:
        type: object
        required:
        - envelope
        - document
        - processKey
        - instanceId
        - round
        - outcome
        - reason
        - initiator
        - returnSource
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          processKey:
            type: string
            enum:
            - COST_TIMESHEET_APPROVAL
          instanceId:
            type: object
            properties:
              value:
                type: string
            description: 流程实例 ID
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          outcome:
            type: string
            enum:
            - APPROVED
            - REJECTED
            - RETURNED
            - CANCELLED
            description: 类型化结果，不靠文案
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 驳回、退回、撤销原因；通过时为空（RULE-280）
          initiator:
            type: object
            properties:
              value:
                type: integer
                format: int64
            description: 发起人，完成卡片发给他
          returnSource:
            type: string
            enum:
            - APPROVER
            - INITIATOR
            - SYSTEM
            description: 退回由谁发起：审批人退回，发起人撤回（D-1a-72），或系统因发起人可以自行改正的原因退回；只有退回结果有值
    DocumentSubmittedForApproval:
      name: DocumentSubmittedForApproval
      title: 请求发起一轮审批
      description: 单据的所有者请审批模块发起一轮审批的发布语言：所有者的聚合记录它，platform.approval 订阅并发起这一轮，带齐发起所需的全部信息，审批模块不回头问所有者。类型归 platform.approval，由申请审批的模块的聚合发布，目前是 cost.timesheet 的 Timesheet；信封里的聚合与法人是所有者的。同一单据同一轮重复收到只发起一次，比当前轮更早的请求忽略；发起时违反业务规则的不重试，本轮以退回结束并写明原因。
      x-event:
        eventType: platform.approval.DocumentSubmittedForApproval
        version: 1
        class: com.forcitis.one.platform.approval.events.DocumentSubmittedForApproval
        aggregate: Timesheet
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 申请审批的单据的业务日期（工时单取工作日期）
        audit: audited
        publisherTest: com.forcitis.one.cost.timesheet.domain.TimesheetStateMachineTest
      payload:
        type: object
        required:
        - envelope
        - processKey
        - document
        - initiator
        - round
        - routingFlags
        - formFields
        - contentHash
        - summary
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          processKey:
            type: string
            enum:
            - COST_TIMESHEET_APPROVAL
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          initiator:
            type: object
            properties:
              value:
                type: integer
                format: int64
            description: 提交单据的用户，由所有者记录，不取自客户端
          round:
            type: object
