components:
  schemas:
    EventEnvelope:
      type: object
      description: 所有领域事件共用的信封，字段定义见 proposals/EVENT_ANALYTICS_FIELDS.md（以第 6 节为准）；负载只放业务字段，只含 ID 与值对象
      required:
      - eventId
      - eventType
      - schemaVersion
      - occurredAt
      - aggregateType
      - aggregateId
      - aggregateVersion
      - correlationId
      - actorType
      - actorId
      - source
      - relatedAggregates
      properties:
        eventId:
          type: string
          format: uuid
          description: UUIDv7，兼作消费方的幂等键
        eventType:
          type: string
          description: <子域>.<BC>.<事件名>
        schemaVersion:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
          description: 取自注入的 Clock；不用于期间归属
        aggregateType:
          type: string
        aggregateId:
          type: string
        aggregateVersion:
          type: integer
          format: int64
          description: 按聚合计数的事件序号，同一事务内连续编号
        correlationId:
          type: string
          format: uuid
          description: 同一业务操作的全部事件共用；来自 X-Correlation-Id
        causationId:
          type: string
          format: uuid
          nullable: true
          description: 直接上游事件的 eventId，根事件为空
        actorType:
          type: string
          enum:
          - USER
          - SYSTEM
        actorId:
          type: string
          description: 用户 ID，或作业 / 监听器名；不带姓名
        legalEntityId:
          type: string
          nullable: true
          description: 属于某个法人的聚合必填；只有平台级事件为空
        businessDate:
          type: string
          format: date
          nullable: true
          description: 按 Asia/Shanghai 截日；取哪个日期见各事件的 x-event.businessDate
        source:
          type: object
          properties:
            system:
              type: string
              enum:
              - ONE
              - MIGRATION
            documentRef:
              type: string
              nullable: true
        accountingPeriod:
          type: string
          nullable: true
          description: 只由过账管道写入
        relatedAggregates:
          type: array
          items:
            type: object
            properties:
              aggregateType:
                type: string
              aggregateId:
                type: string
  messages:
    ApprovalCompleted:
      name: ApprovalCompleted
      title: 审批结束（已通过 / 已驳回 / 已退回 / 已撤销）
      description: 审批结束（已通过、已驳回、已退回、已撤销）。aggregateId 是 单据类型:单据标识，如 TIMESHEET:7；过程里程碑，不过账。发起人撤回（RULE-269）以 RETURNED 结束本轮，与审批人退回同形，区别看信封 actorId 是否为发起人以及 reason。消费方 cost.timesheet 按 eventId 幂等，轮次与等待中的轮次不符则忽略；分析层 L1 用于审批时效。
      x-event:
        eventType: platform.approval.ApprovalCompleted
        version: 1
        class: com.forcitis.one.platform.approval.events.ApprovalCompleted
        aggregate: ApprovalRequest
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - cost.timesheet
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 审批结束当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalRequestStateMachineTest
      payload:
        type: object
        required:
        - envelope
        - document
        - processKey
        - instanceId
        - round
        - outcome
        - reason
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          processKey:
            type: string
            enum:
            - COST_TIMESHEET_APPROVAL
          instanceId:
            type: object
            properties:
              value:
                type: string
            description: 流程实例 ID
          round:
            type: object
            x-type: RoundNumber
            properties:
              value:
                type: integer
            description: 轮次，同一单据第几次发起，从 1 起
          outcome:
            type: string
            enum:
            - APPROVED
            - REJECTED
            - RETURNED
            - CANCELLED
            description: 类型化结果，不靠文案
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 驳回、退回、撤销原因；通过时为空（RULE-280）
    TaskAssigned:
      name: TaskAssigned
      title: 任务已分配（每位会签审批人一个任务）
      description: 任务已分配，每位会签审批人一个任务；过程事实，不过账。platform.approval 的通知监听器据此给每个候选人发企业微信文本卡片（去重键 approval-task:{taskId}）。系统自动通过的任务（RULE-302）不发此事件。分析层 L1 以此为审批等待时长的起点。
      x-event:
        eventType: platform.approval.TaskAssigned
        version: 1
        class: com.forcitis.one.platform.approval.events.TaskAssigned
        aggregate: ApprovalTask
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 任务创建当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
      payload:
        type: object
        required:
        - envelope
        - taskId
        - instanceId
        - processKey
        - processName
        - document
        - nodeKey
        - nodeName
        - initiator
        - candidates
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          taskId:
            type: object
            properties:
              value:
                type: string
          instanceId:
            type: object
            properties:
              value:
                type: string
          processKey:
            type: string
          processName:
            type: object
            x-type: ProcessName
            properties:
              value:
                type: string
            description: 流程显示名
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          nodeKey:
            type: object
            x-type: NodeKey
            properties:
              value:
                type: string
            description: 流程节点标识
          nodeName:
            type: object
            x-type: NodeName
            properties:
              value:
                type: string
            description: 节点显示名
          initiator:
            type: object
            properties:
              value:
                type: integer
                format: int64
          candidates:
            type: array
            items:
              type: object
              properties:
                value:
                  type: integer
                  format: int64
    TaskClaimed:
      name: TaskClaimed
      title: 任务已被候选人认领
      description: 任务已被候选人认领；过程事实，不过账。通知监听器据此把其他候选人的卡片改为已处理。
      x-event:
        eventType: platform.approval.TaskClaimed
        version: 1
        class: com.forcitis.one.platform.approval.events.TaskClaimed
        aggregate: ApprovalTask
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        - platform.approval
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 认领当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
      payload:
        type: object
        required:
        - envelope
        - taskId
        - instanceId
        - document
        - claimedBy
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          taskId:
            type: object
            properties:
              value:
                type: string
          instanceId:
            type: object
            properties:
              value:
                type: string
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          claimedBy:
            type: object
            properties:
              value:
                type: integer
                format: int64
    TaskResulted:
      name: TaskResulted
      title: 任务已办理（通过 / 驳回 / 退回）
      description: 任务已办理（通过、驳回、退回）；过程事实，不过账。系统自动通过与被跳过的节点不发此事件。effect=ADVISORY 是加签人的驳回，只记录意见，不结束本轮（RULE-273、RULE-291）。通过时 reason 为空（RULE-280）。
      x-event:
        eventType: platform.approval.TaskResulted
        version: 1
        class: com.forcitis.one.platform.approval.events.TaskResulted
        aggregate: ApprovalTask
        idempotencyKey: eventId
        publisher: platform.approval
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 办理当日（Asia/Shanghai）
        audit: audited
        publisherTest: com.forcitis.one.platform.approval.domain.ApprovalTaskStateMachineTest
        noConsumer: 暂无消费方：分析层 L1 的审批办理时效与 1b 业务模块的任务级钩子将订阅；现在就发布，是因为办理时刻只在发生当时可记录，事后补不回
      payload:
        type: object
        required:
        - envelope
        - taskId
        - instanceId
        - processKey
        - document
        - nodeKey
        - assignee
        - outcome
        - effect
        - reason
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          taskId:
            type: object
            properties:
              value:
                type: string
          instanceId:
            type: object
            properties:
              value:
                type: string
          processKey:
            type: string
          document:
            type: object
            required:
            - documentType
            - documentId
            properties:
              documentType:
                type: string
                enum:
                - QUOTE
                - TIMESHEET
                - JOURNAL_VOUCHER
              documentId:
                type: object
                properties:
                  value:
                    type: string
          nodeKey:
            type: object
            x-type: NodeKey
            properties:
              value:
                type: string
            description: 流程节点标识
          assignee:
            type: object
            properties:
              value:
                type: integer
                format: int64
          outcome:
            type: string
            enum:
            - APPROVED
            - REJECTED
            - RETURNED
          effect:
            type: string
            enum:
            - BINDING
            - ADVISORY
            description: ADVISORY 是加签人的驳回：只记录意见，不结束本轮（RULE-273、RULE-291）
          reason:
            type: object
            x-type: Reason
            properties:
              value:
                type: string
            description: 原因；通过时为空
    TaskTransferred:
      name: TaskTransferred
      title: 当前处理人把任务转交给他人（RULE-285）
      description: 当前处理人把任务转交给他人（RULE-285）；过程事实，不过账。通知监听器据此给新处理人发卡片。
      x-event:
        eventType: platform.approval.TaskTransferred
