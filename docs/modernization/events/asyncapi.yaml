components:
  schemas:
    EventEnvelope:
      type: object
      description: 所有领域事件共用的信封，字段定义见 proposals/EVENT_ANALYTICS_FIELDS.md（以第 6 节为准）；负载只放业务字段，只含 ID 与值对象
      required:
      - eventId
      - eventType
      - schemaVersion
      - occurredAt
      - aggregateType
      - aggregateId
      - aggregateVersion
      - correlationId
      - actorType
      - actorId
      - source
      - relatedAggregates
      properties:
        eventId:
          type: string
          format: uuid
          description: UUIDv7，兼作消费方的幂等键
        eventType:
          type: string
          description: <子域>.<BC>.<事件名>
        schemaVersion:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
          description: 取自注入的 Clock；不用于期间归属
        aggregateType:
          type: string
        aggregateId:
          type: string
        aggregateVersion:
          type: integer
          format: int64
          description: 按聚合计数的事件序号，同一事务内连续编号
        correlationId:
          type: string
          format: uuid
          description: 同一业务操作的全部事件共用；来自 X-Correlation-Id
        causationId:
          type: string
          format: uuid
          nullable: true
          description: 直接上游事件的 eventId，根事件为空
        actorType:
          type: string
          enum:
          - USER
          - SYSTEM
        actorId:
          type: string
          description: 用户 ID，或作业 / 监听器名；不带姓名
        legalEntityId:
          type: string
          nullable: true
          description: 属于某个法人的聚合必填；只有平台级事件为空
        businessDate:
          type: string
          format: date
          nullable: true
          description: 按 Asia/Shanghai 截日；取哪个日期见各事件的 x-event.businessDate
        source:
          type: object
          properties:
            system:
              type: string
              enum:
              - ONE
              - MIGRATION
            documentRef:
              type: string
              nullable: true
        accountingPeriod:
          type: string
          nullable: true
          description: 只由过账管道写入
        relatedAggregates:
          type: array
          items:
            type: object
            properties:
              aggregateType:
                type: string
              aggregateId:
                type: string
  messages:
    WorkCalendarYearMaintained:
      name: WorkCalendarYearMaintained
      title: 工作日历的某一年被维护
      x-event:
        eventType: organization.attendance.WorkCalendarYearMaintained
        version: 1
        class: com.forcitis.one.organization.attendance.events.WorkCalendarYearMaintained
        aggregate: WorkCalendarYear
        idempotencyKey: eventId
        publisher: organization.attendance
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：不是带日期的业务里程碑（运维或配置变更）
        audit: audited
        publisherTest: com.forcitis.one.organization.attendance.domain.WorkCalendarYearTest
        noConsumer: 暂无消费方：审批超时提醒将在日历变更后重算截止时间（approval 依赖 attendance）；现在就发布，是因为日历变更之后已算出的截止时间需要有据可查
      payload:
        type: object
        required:
        - envelope
        - calendarYear
        properties:
          envelope:
            $ref: '#/components/schemas/EventEnvelope'
          calendarYear:
            type: integer
            x-type: Year
            description: 日历年份
    RoleCreated:
      name: RoleCreated
      title: 角色新增
      x-event:
        eventType: platform.identity.RoleCreated
        version: 1
        class: com.forcitis.one.platform.identity.events.RoleCreated
        aggregate: Role
        idempotencyKey: eventId
        publisher: platform.identity
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：不是带日期的业务里程碑（运维或配置变更）
        audit: audited
        publisherTest: com.forcitis.one.platform.identity.domain.IdentityStateMachineTest
        noConsumer: 暂无消费方：数据权限（ADR-0026）与会话缓存失效将订阅；现在就发布，是因为授权变化只在发生当时可被记录，补不回
