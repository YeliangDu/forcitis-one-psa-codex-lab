# 事件目录分片（AsyncAPI 3 的 components.messages）：本模块的事件由 build_asyncapi.py 合成 asyncapi.yaml
components:
  messages:
    NumberingRuleConfirmed:
      name: NumberingRuleConfirmed
      title: 编号规则的模板版本确认齐全，开始发号
      payload:
        type: object
        properties:
          documentType:
            type: string
            enum:
            - QUOTE
            - TIMESHEET
            - JOURNAL_VOUCHER
            x-type: DocumentType
          ruleVersion:
            type: integer
            format: int64
            x-type: RuleVersion
            description: 模板版本号，每种单据从 1 递增
          effectiveFrom:
            type: string
            format: date
            description: 作者提交的生效日；业务日期从这一天起用该版本发号
      x-event:
        eventType: platform.numbering.NumberingRuleConfirmed
        version: 1
        class: com.forcitis.one.platform.numbering.events.NumberingRuleConfirmed
        aggregate: NumberingRule
        idempotencyKey: eventId
        publisher: platform.numbering
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 模板的生效日（effectiveFrom）；种子版本被确认时的事件，businessDate 是 2000-01-01（种子版本的生效日）
        audit: audited
        publisherTest: com.forcitis.one.platform.numbering.domain.NumberingRuleStateMachineTest
        noConsumer: 暂无消费方：编号规则变化只需留痕；现在就发布，是因为规则的确认时刻之后无法还原
    NumberingRuleReconfigured:
      name: NumberingRuleReconfigured
      title: 编号规则保存了新的模板版本，等待他人确认
      payload:
        type: object
        properties:
          documentType:
            type: string
            enum:
            - QUOTE
            - TIMESHEET
            - JOURNAL_VOUCHER
            x-type: DocumentType
          ruleVersion:
            type: integer
            format: int64
            x-type: RuleVersion
            description: 模板版本号，每种单据从 1 递增
          effectiveFrom:
            type: string
            format: date
            description: 作者提交的生效日；业务日期从这一天起用该版本发号
      x-event:
        eventType: platform.numbering.NumberingRuleReconfigured
        version: 1
        class: com.forcitis.one.platform.numbering.events.NumberingRuleReconfigured
        aggregate: NumberingRule
        idempotencyKey: eventId
        publisher: platform.numbering
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 模板的生效日（effectiveFrom）
        audit: audited
        publisherTest: com.forcitis.one.platform.numbering.domain.NumberingRuleStateMachineTest
        noConsumer: 暂无消费方：编号规则变化只需留痕；现在就发布，是因为规则的确认时刻之后无法还原
    NumberingRuleConfirmationGiven:
      name: NumberingRuleConfirmationGiven
      title: 编号规则的模板版本得到一次确认（业务或财务）
      payload:
        type: object
        properties:
          documentType:
            type: string
            enum:
            - QUOTE
            - TIMESHEET
            - JOURNAL_VOUCHER
            x-type: DocumentType
          ruleVersion:
            type: integer
            format: int64
            x-type: RuleVersion
            description: 模板版本号，每种单据从 1 递增
          kind:
            type: string
            enum:
            - BUSINESS
            - FINANCE
            x-type: ConfirmationKind
      x-event:
        eventType: platform.numbering.NumberingRuleConfirmationGiven
        version: 1
        class: com.forcitis.one.platform.numbering.events.NumberingRuleConfirmationGiven
        aggregate: NumberingRule
        idempotencyKey: eventId
        publisher: platform.numbering
        consumers:
        - platform.audit
        delivery: 至少一次：与业务写入同事务交给 Spring Modulith 事件发布登记表，提交后投递，未完成的按固定间隔重投；消费方按 eventId 幂等
        formsFact: false
        businessDate: 无：不是带日期的业务里程碑（运维或配置变更）
        audit: audited
        publisherTest: com.forcitis.one.platform.numbering.domain.NumberingRuleStateMachineTest
        noConsumer: 暂无消费方：编号规则变化只需留痕；现在就发布，是因为规则的确认时刻之后无法还原
