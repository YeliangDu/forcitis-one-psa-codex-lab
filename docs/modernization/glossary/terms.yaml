# terms.yaml — FORCITIS one 现代化统一语言（单一来源初版，机器可读）
# 生成：python3 glossary/build_terms.py ；人工修改请改生成器，避免与 03-通用语言.md 漂移
meta:
  version: 0.1.0-draft
  date: '2026-10-14'
  source:
  - psa/docs/domain/00_战略设计/03-通用语言.md（经 glossary/source_terms.json）
  - GLOSSARY.md §2 核心术语 38 条
  - STANDARDS_AUDIT.md（G-8 起改名建议）
  naming_priority:
  - 1 法规与会计准则：中文用《企业会计准则》原文用语（CAS 14 收入：合同、履约义务、交易价格、合同资产、合同负债、应收账款、合同履约成本、合同取得成本、时段履约 / 时点履约、履约进度、投入法 / 产出法）；英文用 IFRS 15 / IAS 与 IFRS XBRL taxonomy（ifrs-full）标准用语
  - 2 行业与工程标准：中文用国标（GB/T 50326、GB/T 50358、GB/T 50500 的工程变更、现场签证、索赔、质量保证金、竣工结算等）；英文用 PMI PMBOK / AACE（WBS、WorkPackage、EstimateAtCompletion、EstimateToComplete、EarnedValue、PlannedValue、ActualCost、Baseline）与
    FIDIC（Variation、Claim、RetentionMoney、InterimPaymentCertificate）
  - 3 专业服务 / PSA 行业通行写法（Timesheet、TimeEntry、Utilization、Billable、RateCard、Engagement、WIP），在准则与国标未覆盖时采用
  - 4 所有跟正式用语不符合的叫法都归为公司内部方言（dialect），新系统一律采用正式用语，方言不进入代码、界面文案、接口文档、列注释；判定不了的标为 undetermined，登记在 TERM_CONFIRMATION.md 由业务 Admin 确认（用户 2026-10-14 裁定）；禁用拼音、自造缩写
  field_notes:
    status: approved = 原词表已有且符合标准；proposed = 本次建议改名或新增，待评审（见 change_ref 指向的 G 编号）
    confidence: standard_ref 对应关系的把握程度；条文号不确定的只写到准则 / 标准名一级
    id: 稳定 slug；同一英文名在多个 BC 同名异义时以 <bc>__ 前缀隔离
    aliases: 'type: dialect（方言：业务口头或旧系统叫法，只用于检索和沟通，禁止进入代码、界面文案、接口文档、列注释）| undetermined（公司叫法，是正式用语还是方言待确认）| old-code（03 词表旧代码名）| legacy-code / legacy-table（老系统）| kpi-symbol | abbr | industry | standard-zh
      / standard-en；deprecated=true 表示新代码禁用'
    coverage: 38 个核心术语全部 + 财务关键 BC（operations.facts / operations.policy / contract.* / delivery.* / cost.* / receivables.* / accounting.*）的附录术语 + 准则 / EVM 缺位的新增术语
