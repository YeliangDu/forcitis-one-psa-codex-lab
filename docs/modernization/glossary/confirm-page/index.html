<title>FORCITIS one 用语确认</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lexicon desk — sticky ledger of progress and filters on the left, dictionary entries on the right; stacks on phones. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#1d2533; --muted:#5d6878; --line:#dde2ea; --soft:#eef1f6;
  --accent:#23498a; --accent-soft:#e3eaf6;
  --formal:#1f7a4d; --formal-soft:#e2f2e9;
  --dialect:#a3452a; --dialect-soft:#f8e7e1;
  --rename:#6a3fa0; --rename-soft:#efe7f8;
  --money:#9a6a00;
  --f-head:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1a2029; --ink:#e6eaf0; --muted:#9aa5b5; --line:#2c3441; --soft:#202733;
  --accent:#8fb0ec; --accent-soft:#22324d;
  --formal:#6fcf9b; --formal-soft:#173527; --dialect:#ef9a7f; --dialect-soft:#3d2219;
  --rename:#c3a2ef; --rename-soft:#2f2441; --money:#e0b44f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1a2029; --ink:#e6eaf0; --muted:#9aa5b5; --line:#2c3441; --soft:#202733;
  --accent:#8fb0ec; --accent-soft:#22324d;
  --formal:#6fcf9b; --formal-soft:#173527; --dialect:#ef9a7f; --dialect-soft:#3d2219;
  --rename:#c3a2ef; --rename-soft:#2f2441; --money:#e0b44f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:grid;gap:18px}
h1{font-family:var(--f-head);font-weight:700;font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:13px}
.rule{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0}
.stats{display:grid;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.legend b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.lab{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
input[type=search],input[type=text]{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:7px 10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.conn{font-size:12px;color:var(--muted)}
.conn.off{color:var(--dialect)}
main{display:grid;gap:26px;min-width:0}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ghead h2{font-family:var(--f-head);font-size:19px;margin:0}
.ghead p{margin:0;color:var(--muted);font-size:13px;flex:1 1 320px}
.bc{display:grid;gap:10px}
.bchead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}
.bchead code{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.bulk{font:inherit;font-size:12.5px;border:1px dashed var(--formal);color:var(--formal);background:transparent;border-radius:6px;padding:3px 10px;cursor:pointer}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:start}
.entry[data-state="formal"]{box-shadow:inset 3px 0 0 var(--formal)}
.entry[data-state="dialect"]{box-shadow:inset 3px 0 0 var(--dialect)}
.entry[data-state="rename"]{box-shadow:inset 3px 0 0 var(--rename)}
.no{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:6px}
.hw{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hw .zh{font-family:var(--f-head);font-size:19px;font-weight:700}
.hw .en{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.from{font-size:13px;color:var(--muted);margin-top:2px}
.from s{color:var(--dialect);text-decoration-thickness:1px}
.defn{font-size:13px;margin:6px 0 0;max-width:68ch}
.refs{font-size:12px;color:var(--muted);margin-top:4px}
.money{color:var(--money);font-size:12px;font-weight:500}
.act{display:grid;gap:6px;justify-items:end}
.choice{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.choice button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.choice button[data-v="formal"][aria-pressed="true"],.choice button[data-v="approve"][aria-pressed="true"]{background:var(--formal-soft);border-color:var(--formal);color:var(--formal)}
.choice button[data-v="dialect"][aria-pressed="true"],.choice button[data-v="keep"][aria-pressed="true"]{background:var(--dialect-soft);border-color:var(--dialect);color:var(--dialect)}
.choice button[data-v="rename"][aria-pressed="true"]{background:var(--rename-soft);border-color:var(--rename);color:var(--rename)}
.sug{font-size:11.5px;color:var(--muted)}
.extra{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.saved{font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:8px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static}}
@media (max-width:560px){.entry{grid-template-columns:minmax(0,1fr)}.act{justify-items:start}.choice{justify-content:flex-start}.extra{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<aside>
  <div>
    <h1>用语确认</h1>
    <p class="lede">FORCITIS one 统一语言 · 词表 terms.yaml 待确认项</p>
  </div>
  <p class="rule">与正式用语不符的叫法一律归为公司内部方言，新系统只用正式用语。逐项选择后自动保存。</p>
  <div class="stats" aria-live="polite">
    <div class="bar" id="bar"></div>
    <div class="legend">
      <div><b id="nDone">0</b>已确认</div>
      <div><b id="nTodo">0</b>待确认</div>
      <div><b id="nAll">0</b>合计</div>
    </div>
    <div class="conn" id="conn">正在连接存储…</div>
  </div>
  <div>
    <p class="lab">分组</p>
    <div class="seg" id="fGroup">
      <button data-g="all" aria-pressed="true">全部</button>
      <button data-g="A" aria-pressed="false">A 公司叫法</button>
      <button data-g="B" aria-pressed="false">B 改名建议</button>
      <button data-g="C" aria-pressed="false">C 自有概念</button>
    </div>
  </div>
  <div>
    <p class="lab">状态</p>
    <div class="seg" id="fState">
      <button data-s="all" aria-pressed="true">全部</button>
      <button data-s="todo" aria-pressed="false">待确认</button>
      <button data-s="done" aria-pressed="false">已确认</button>
      <button data-s="money" aria-pressed="false">涉及会计口径</button>
    </div>
  </div>
  <div>
    <label class="lab" for="q">搜索</label>
    <input id="q" type="search" placeholder="中文、英文或模块，例如 签证、WorkPackage、cost">
  </div>
</aside>

<main id="main"></main>

m）","sug":"formal"},{"key":"C-employee","no":"C113","grp":"C","say":"","zh":"员工","en":"Employee","bc":"organization.workforce","refs":[],"defn":"员工主数据与任职记录（EmployeeId 来源）","sug":"formal"},{"key":"C-org_unit","no":"C114","grp":"C","say":"","zh":"组织单元","en":"OrgUnit","bc":"organization.workforce","refs":[],"defn":"法人→BU→部门层级（组织单元必挂法人主体）","sug":"formal"},{"key":"C-job_grade","no":"C115","grp":"C","say":"","zh":"职级","en":"JobGrade","bc":"organization.workforce","refs":[],"defn":"员工职级 T1-T7 七级（组织主数据，计费费率与折扣权限的档位依据）","sug":"formal"},{"key":"C-position","no":"C116","grp":"C","say":"","zh":"岗位","en":"Position","bc":"organization.workforce","refs":[],"defn":"任职与费率适用的岗级体系","sug":"formal"},{"key":"C-workflow","no":"C117","grp":"C","say":"","zh":"流程","en":"Workflow","bc":"platform.approval","refs":[],"defn":"审批流转承载（能不能批由业务 BC 判定）","sug":"formal"},{"key":"C-workflow_instance","no":"C118","grp":"C","say":"","zh":"流程实例","en":"WorkflowInstance","bc":"platform.approval","refs":[],"defn":"审批流转承载（能不能批由业务 BC 判定）","sug":"formal"},{"key":"C-approval","no":"C119","grp":"C","say":"","zh":"审批","en":"Approval","bc":"platform.approval","refs":[],"defn":"审批流转承载（能不能批由业务 BC 判定）","sug":"formal"},{"key":"C-rule_engine","no":"C120","grp":"C","say":"","zh":"规则引擎","en":"RuleEngine","bc":"platform.approval","refs":[],"defn":"只承载执行；规则定义与版本主权归业务 BC（红线）","sug":"formal"},{"key":"C-rule_execution","no":"C121","grp":"C","say":"","zh":"规则执行","en":"RuleExecution","bc":"platform.approval","refs":[],"defn":"只承载执行；规则定义与版本主权归业务 BC（红线）","sug":"formal"},{"key":"C-audit_log","no":"C122","grp":"C","say":"","zh":"审计日志","en":"AuditLog","bc":"platform.audit","refs":[],"defn":"只追加、不可篡改、可回放的变更轨迹","sug":"formal"},{"key":"C-user","no":"C123","grp":"C","say":"","zh":"用户","en":"User","bc":"platform.identity","refs":[],"defn":"技术权限（RBAC；业务授权语义归业务 BC）","sug":"formal"},{"key":"C-role","no":"C124","grp":"C","say":"","zh":"角色","en":"Role","bc":"platform.identity","refs":[],"defn":"技术权限（RBAC；业务授权语义归业务 BC）","sug":"formal"},{"key":"C-permission","no":"C125","grp":"C","say":"","zh":"权限","en":"Permission","bc":"platform.identity","refs":[],"defn":"技术权限（RBAC；业务授权语义归业务 BC）","sug":"formal"},{"key":"C-dead_letter_queue","no":"C126","grp":"C","say":"","zh":"异常队列","en":"DeadLetterQueue","bc":"platform.integration","refs":[],"defn":"映射失败消息的显式滞留处（不得静默丢弃）","sug":"formal"},{"key":"C-delivery_guarantee","no":"C127","grp":"C","say":"","zh":"投递保证","en":"DeliveryGuarantee","bc":"platform.integration","refs":[],"defn":"至少一次投递 + 事件不可篡改 + 可重放","sug":"formal"},{"key":"C-cash_received","no":"C128","grp":"C","say":"","zh":"回款","en":"CashReceived","bc":"receivables.collection","refs":[],"defn":"客户付款到账的确认（CYCLE_B2C 终点）","sug":"formal"},{"key":"C-receipt_claiming","no":"C129","grp":"C","say":"","zh":"到账认领","en":"ReceiptClaiming","bc":"receivables.collection","refs":[],"defn":"到账与客户/应收的匹配与核销分配","sug":"formal"},{"key":"C-receipt_allocation","no":"C130","grp":"C","say":"","zh":"回款分配","en":"ReceiptAllocation","bc":"receivables.collection","refs":[],"defn":"到账与客户/应收的匹配与核销分配","sug":"formal"},{"key":"C-disputed_receivable","no":"C131","grp":"C","say":"","zh":"争议应收","en":"DisputedReceivable","bc":"receivables.collection","refs":[],"defn":"挂索赔案引用的争议标记（争议不停账龄）","sug":"formal"},{"key":"C-ar_overdue_detected","no":"C132","grp":"C","say":"","zh":"逾期应收","en":"ArOverdueDetected","bc":"receivables.collection","refs":[],"defn":"到期未收的账龄升级状态（ODAR F123）","sug":"formal"},{"key":"C-cash_conversion","no":"C133","grp":"C","say":"","zh":"现金转化","en":"CashConversion","bc":"receivables.collection","refs":[],"defn":"履约到现金的端到端转化（CCR F127）","sug":"formal"},{"key":"C-invoice_eligibility_confirmed","no":"C134","grp":"C","say":"","zh":"开票准入","en":"InvoiceEligibilityConfirmed","bc":"receivables.wip","refs":[],"defn":"按计价模式矩阵的硬性检查（通过才可开票）","sug":"formal"}];
const GROUPS = {
  A:{title:"A · 公司叫法：正式用语还是方言",desc:"公司在用、审计无法判定的叫法。选「方言」后禁止进入新系统，新系统改用右侧的正式用语。",
     opts:[["formal","正式"],["dialect","方言"],["rename","改为…"]]},
  B:{title:"B · 改为标准用语",desc:"原用语不符合准则或行业标准。同意后，原叫法归为方言。标「会计口径」的建议同时请财务确认。",
     opts:[["approve","同意改名"],["keep","保留原用语"],["rename","改为…"]]},
  C:{title:"C · 公司自有概念",desc:"准则、国标、PMBOK、FIDIC 都没有对应条目的经营管理概念，建议以词表定义为正式用语。可按模块整组确认。",
     opts:[["formal","正式"],["dialect","方言，另取名"],["rename","改为…"]]}
};
const SUG = {formal:"建议：正式",dialect:"建议：方言",approve:"建议：同意改名"};
const decisions = new Map();   // key -> {choice, renameTo, note, at}
let db = null, user = null, myId = null;
let fGroup = "all", fState = "all", q = "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function matches(it){
  if (fGroup !== "all" && it.grp !== fGroup) return false;
  const dec = decisions.get(it.key);
  if (fState === "todo" && dec) return false;
  if (fState === "done" && !dec) return false;
  if (fState === "money" && !it.fin) return false;
  if (q){
    const hay = (it.zh+" "+it.en+" "+it.bc+" "+it.say+" "+it.no).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function entryHTML(it){
  const dec = decisions.get(it.key);
  const st = dec ? (dec.choice==="approve"||dec.choice==="formal" ? "formal" : dec.choice==="rename" ? "rename" : "dialect") : "";
  const opts = GROUPS[it.grp].opts.map(([v,l]) =>
    `<button data-v="${v}" aria-pressed="${dec&&dec.choice===v}">${l}</button>`).join("");
  const from = it.grp==="A" ? `<div class="from">公司叫法 <s>${esc(it.say)}</s> → 正式用语</div>`
             : it.grp==="B" ? `<div class="from">原用语 <s>${esc(it.say)}</s> → 建议</div>` : "";
  const refs = it.refs && it.refs.length ? `<div class="refs">依据：${esc(it.refs.join("；"))}</div>` : "";
  const money = it.fin ? `<span class="money">会计口径 · 请财务确认</span>` : "";
  const g = it.g ? `<span class="no">${esc(it.g)}</span>` : "";
  const extra = dec && (dec.choice==="rename"||dec.choice==="dialect") ? `
    <div class="extra">
      <input type="text" id="rn-${esc(it.key)}" data-f="renameTo" placeholder="${dec.choice==="dialect"?"正式用语应叫什么（可留空，由我提建议）":"改为的正式用语"}" value="${esc(dec.renameTo)}">
      <input type="text" id="nt-${esc(it.key)}" data-f="note" placeholder="备注（可选）" value="${esc(dec.note)}">
    </div>` : "";
  return `<article class="entry" data-key="${esc(it.key)}" data-state="${st}">
    <div>
      ${from}
      <div class="hw"><span class="no">${esc(it.no)}</span><span class="zh">${esc(it.zh)}</span><span class="en">${esc(it.en)}</span>${g}${money}</div>
      ${it.defn?`<p class="defn">${esc(it.defn)}</p>`:""}
      ${refs}
    </div>
    <div class="act">
      <div class="choice" role="group" aria-label="${esc(it.no)} 的确认">${opts}</div>
      <div class="sug">${dec ? `<span class="saved">已保存</span>` : esc(SUG[it.sug]||"")}</div>
    </div>${extra}
  </article>`;
}

function render(){
  const vis = ITEMS.filter(matches);
  const parts = [];
  for (const g of ["A","B","C"]){
    const list = vis.filter(i => i.grp === g);
    if (!list.length) continue;
    const all = ITEMS.filter(i => i.grp === g), done = all.filter(i => decisions.has(i.key)).length;
    parts.push(`<section><div class="ghead"><h2>${GROUPS[g].title}</h2><span class="no">${done} / ${all.length}</span><p>${GROUPS[g].desc}</p></div>`);
    if (g === "C"){
      const byBc = new Map();
      list.forEach(i => { if(!byBc.has(i.bc)) byBc.set(i.bc,[]); byBc.get(i.bc).push(i); });
      for (const [bc, ls] of byBc){
        const open = ls.filter(i => !decisions.has(i.key)).length;
        parts.push(`<div class="bc"><div class="bchead"><code>${esc(bc)}</code>${open?`<button class="bulk" data-bulk="${esc(bc)}">本组未确认的 ${open} 项设为正式</button>`:""}</div>${ls.map(entryHTML).join("")}</div>`);
      }
    } else {
      parts.push(`<div class="bc">${list.map(entryHTML).join("")}</div>`);
    }
    parts.push(`</section>`);
  }
  $("#main").innerHTML = parts.join("") || `<div class="empty">没有符合筛选条件的条目。</div>`;
  stats();
}

function stats(){
  const all = ITEMS.length; let f=0,dl=0,r=0;
  for (const it of ITEMS){ const d = decisions.get(it.key); if(!d) continue;
    if (d.choice==="formal"||d.choice==="approve") f++; else if (d.choice==="rename") r++; else dl++; }
  const done = f+dl+r;
  $("#nDone").textContent = done; $("#nTodo").textContent = all-done; $("#nAll").textContent = all;
  const pct = n => (100*n/all).toFixed(2)+"%";
  $("#bar").innerHTML = `<i style="width:${pct(f)};background:var(--formal)"></i><i style="width:${pct(r)};background:var(--rename)"></i><i style="width:${pct(dl)};background:var(--dialect)"></i>`;
}

async function save(key, body){
  decisions.set(key, body); render();
  if (!db){ $("#conn").textContent = "存储不可用：本次选择不会保存"; $("#conn").classList.add("off"); return; }
  try { await db.collection("decisions").doc(key).set(body); }
  catch(e){ $("#conn").textContent = "保存失败：" + (e && e.message || "请稍后再试"); $("#conn").classList.add("off"); }
}
async function clear(key){
  decisions.delete(key); render();
  if (db) try { await db.collection("decisions").doc(key).delete(); } catch(e){}
}

document.addEventListener("click", e => {
  const gb = e.target.closest("#fGroup button"), sb = e.target.closest("#fState button");
  if (gb){ fGroup = gb.dataset.g; document.querySelectorAll("#fGroup button").forEach(b => b.setAttribute("aria-pressed", b===gb)); render(); return; }
  if (sb){ fState = sb.dataset.s; document.querySelectorAll("#fState button").forEach(b => b.setAttribute("aria-pressed", b===sb)); render(); return; }
  const bulk = e.target.closest("[data-bulk]");
  if (bulk){
    const bc = bulk.dataset.bulk;
    (async () => { for (const it of ITEMS.filter(i => i.grp==="C" && i.bc===bc && !decisions.has(i.key))){
      await save(it.key, {item:it.no, zh:it.zh, en:it.en, choice:"formal", renameTo:"", note:"整组确认", by:myId, at:new Date().toISOString()}); } })();
    return;
  }
  const btn = e.target.closest(".choice button");
  if (btn){
    const art = btn.closest(".entry"), key = art.dataset.key, it = ITEMS.find(i => i.key===key), v = btn.dataset.v;
    const cur = decisions.get(key);
    if (cur && cur.choice === v){ clear(key); return; }
    save(key, {item:it.no, zh:it.zh, en:it.en, choice:v, renameTo:cur?.renameTo||"", note:cur?.note||"", by:myId, at:new Date().toISOString()});
  }
});
const pending = new Map();
document.addEventListener("input", e => {
  if (e.target.id === "q"){ q = e.target.value.trim().toLowerCase(); render(); return; }
  const f = e.target.dataset.f; if (!f) return;
  const key = e.target.closest(".entry").dataset.key; const cur = decisions.get(key); if (!cur) return;
  cur[f] = e.target.value;
  clearTimeout(pending.get(key));
  pending.set(key, setTimeout(() => { const b = {...decisions.get(key), at:new Date().toISOString()};
    decisions.set(key, b); if (db) db.collection("decisions").doc(key).set(b).catch(()=>{}); }, 700));
});

render();
(async () => {
  try { user = await window.claude?.use?.("user"); myId = user ? await user.id() : null; } catch(e){}
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){ $("#conn").textContent = "存储不可用：请登录 claude.ai 后打开本页，选择才会保存"; $("#conn").classList.add("off"); return; }
  $("#conn").textContent = "已连接，选择会自动保存";
  db.collection("decisions").onSnapshot(snap => {
    let changed = false;
    for (const ch of snap.docChanges()){
      const key = ch.doc.id;
      if (ch.type === "removed"){ if (decisions.delete(key)) changed = true; }
      else { const b = ch.doc.data(); if (b && !(pending.has(key) && document.activeElement?.closest?.(`[data-key="${CSS.escape(key)}"]`))){ decisions.set(key, {...b}); changed = true; } }
    }
    if (changed && !document.activeElement?.matches?.("input[data-f]")) render(); else stats();
  }, err => { $("#conn").textContent = "存储连接中断：" + (err && err.message || ""); $("#conn").classList.add("off"); });
})();
</script>
