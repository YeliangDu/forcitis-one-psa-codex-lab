      confidence: medium
      aliases: []
      forbidden: []
    source: 用户 2026-10-15 财务口径决策页 FD-01 选定名称「历史期间」（intent 2026-10-15-221430-one-rules-财务口径决策页-FD-01-新系）；含义不变，沿用提议定义
