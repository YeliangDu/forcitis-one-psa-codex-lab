# term-fields.yaml — 正式词条的补充字段（B1，按词条 id）：build_terms.py 生成 terms.yaml 时并入，再按 term_rules.py 校验。
# 可写：scope（没有 ACL 归类的词条）、used_by（kernel 词条）、upstream_term、homonyms、formula / grain / as_of（指标口径）。
# 每条的依据写在 source；用语裁定以用户答复为准（在线决策页）。
terms:
  # kernel 词条的使用方：代码中引用该 kernel 类型的模块（2026-10-15 扫 backend/src/main，B1）
  hours:
    used_by: [cost.timesheet]
  error_code:
    used_by: [cost.timesheet, organization.attendance, organization.workforce, platform.approval, platform.audit, platform.identity, platform.integration, platform.numbering, platform.web]
  # 跨 bc 同名、已按 <bc>__ 前缀分立的词条（第二轮已定）互列
  migration:
    homonyms: [read_purpose__migration]
  read_purpose__migration:
    homonyms: [migration]
  operations_facts__responsible_party:
    homonyms: [contract_riskdelivery__responsible_party, contract_changeorder__responsible_party]
  contract_riskdelivery__responsible_party:
    homonyms: [operations_facts__responsible_party, contract_changeorder__responsible_party]
  contract_changeorder__responsible_party:
    homonyms: [operations_facts__responsible_party, contract_riskdelivery__responsible_party]
  operations_policy__basis_difference_list:
    homonyms: [accounting_ledger__basis_difference_list]
  accounting_ledger__basis_difference_list:
    homonyms: [operations_policy__basis_difference_list]
