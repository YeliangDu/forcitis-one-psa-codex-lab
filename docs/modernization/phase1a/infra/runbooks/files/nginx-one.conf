# /etc/nginx/conf.d/one.conf（E-8、E-9、E-10）
# 访问日志只记路径（$uri），不记查询串：/login/wecom?code=&state= 与 /login/sso?ticket= 的一次性凭证不得进日志（D-1a-39）
log_format one_json escape=json '{"@timestamp":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
                                '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                                '"upstream":"$upstream_response_time","correlationId":"$sent_http_x_correlation_id",'
                                '"userAgent":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name one.forcitis.com;
    access_log /var/log/nginx/one.access.json one_json;

    # ACME 校验放在发布目录之外：切换 current 不影响续期（certbot 的 webroot_path 须指向这里，C-4 E-9）
    location ^~ /.well-known/acme-challenge/ {
        root /data/forcitis-one/static-pinned;
    }
    location / {
        return 301 https://one.forcitis.com$uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name one.forcitis.com;

    ssl_certificate     /etc/nginx/tls/one.forcitis.com.pem;
    ssl_certificate_key /etc/nginx/tls/one.forcitis.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 只留 ECDHE + AEAD（证书为 ECDSA）；TLS 1.3 套件不受此项影响（B-4 §5）
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:one_tls:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/one.access.json one_json;
    error_log  /var/log/nginx/one.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 登录回跳页带一次性凭证，禁止经 Referer 外泄
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 20m;
    server_tokens off;

    root /data/forcitis-one/current/web;

    # 企业微信可信域名校验文件：固定目录，不随发布切换（C-4 E-10）；正则 location 先于下方静态资源规则匹配
    location ~ "^/WW_verify_[A-Za-z0-9]{1,64}\.txt$" {
        root /data/forcitis-one/static-pinned;
        try_files $uri =404;
        default_type text/plain;
    }

    location ^~ /actuator    { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui  { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而不是追加：应用只信任 127.0.0.1 这一跳，客户端自带的 X-Forwarded-For 一律丢弃
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # H5 路径须与 H5 构建的 publicPath 一致（CROSSCHECK 第 4 条，定稿前不启用）
    location /h5/ {
        try_files $uri /h5/index.html;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
