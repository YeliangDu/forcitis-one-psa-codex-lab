# 三个看板的请求定义（选项 B、C 的编译器共用；A、D 手写，不读本文件）。
D1:
  title: 经营月报
  dims: [bu, period]
  period: {from: 202501, to: 202609}
  foreach: {name: m, values: [M-08, M-10, M-11, M-12]}   # M-12 现金回款无目标，目标与达成率为空
  columns:
    actual:        {metric: "$m"}
    budget:        {metric: M-40, params: {target_type: budget,     target_metric: "$m"}}
    commitment:    {metric: M-40, params: {target_type: commitment, target_metric: "$m"}}
    challenge:     {metric: M-40, params: {target_type: challenge,  target_metric: "$m"}}
    ach_budget:     {metric: M-41, params: {actual_metric: "$m", target_type: budget}}
    ach_commitment: {metric: M-41, params: {actual_metric: "$m", target_type: commitment}}
    ach_challenge:  {metric: M-41, params: {actual_metric: "$m", target_type: challenge}}
D2:
  title: 应收
  dims: [bu, aging_bucket]
  rollup: [aging_bucket]          # 每个 BU 增加 aging_bucket='ALL' 合计行
  period: {from: 202609, to: 202609}
  columns:
    balance: {metric: M-13}
    over90:  {metric: M-14}
    overdue: {metric: M-15}
D3:
  title: 人效
  dims: [bu, period]
  period: {from: 202501, to: 202609}
  columns:
    avg_headcount: {metric: M-38}
    utilization:   {metric: M-42}
    nrpm_revenue:  {metric: M-45, params: {numerator_metric: M-08}}
    nrpm_invoice:  {metric: M-45, params: {numerator_metric: M-10}}
    nrpm_collection: {metric: M-45, params: {numerator_metric: M-11}}
