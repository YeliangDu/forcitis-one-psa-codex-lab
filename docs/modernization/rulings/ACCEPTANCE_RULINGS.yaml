# 验收测试裁定记录（SESSION_PLAYBOOK §6.1 第 8 条）：实现代理认为验收测试有误时停下报告，由复审（不是实现会话本人）裁定；
# 改验收测试的提交在说明里写 `Acceptance-Ruling: RULING-<编号>`，scripts/ci/acceptance_rulings.py 核对该编号必须记在这里，
# 并且记录在 PR 的 base（main）上已有：同一个 PR 里自己补的记录不算（那是实现会话自己裁定自己）。
#
# 条目：
#   - id: RULING-12                  # 编号，唯一
#     date: 2026-10-17
#     ruled_by: one-coordinator      # 谁裁定：复审会话、调度或用户；不得是想改测试的实现会话本人
#     implementer: one-1a-next-5     # 想改测试的实现会话（测试挡住了它）
#     files: [backend/src/test/java/com/forcitis/one/acceptance/xxx/FooIT.java]   # 裁定允许改的文件或目录前缀，至少一项
#     reason: 一句话，测试哪里有误
#     ref: 裁定写在哪里（intent 文件、评审记录、ADR），可选
#
# 存量：历史提交里已有的裁定编号（`python3 scripts/ci/acceptance_rulings.py --history origin/main`）还没有记录，由调度会同复审补写；
# 补完后把脚本里的 ENFORCE 改为 True，之后没有记录的裁定尾注直接失败。
rulings: []
