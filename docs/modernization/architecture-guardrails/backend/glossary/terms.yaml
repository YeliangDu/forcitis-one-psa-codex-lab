# 统一语言词表（模板样例，只覆盖本模板现有概念；完整版见 analysis/psa/glossary/terms.yaml）
# GlossaryTest 以本文件为准：
#   G37 类型 / record 组件 / 枚举常量 / 方法 / 表 / 列中的每个词，必须来自某条术语的 en / snake，或 common_words
#   G38 任何位置不得出现某条术语 forbidden 中的写法
#   G39 列名（或 <snake>_id）、表名（复数）对应某条术语时，COMMENT 必须以该术语 zh 开头
#   G41–G48（NamingSurfaceTest / ApplicationIntegrationTest）复用同一拆词与查表逻辑（test 中的 Glossary 工具类）：
#   URL 资源段、OpenAPI 模式名与属性、事件 JSON 键、权限码、编号单据类型、作业 / 锁 / 指标 / 配置键、流程标识、错误码
#   standard_actions 是权限码动作的唯一来源（G43）
# 未登记词的草稿条目见 target/glossary-draft.yaml（mvn verify 副产物），补 zh / definition 后粘贴到 terms 下。
# 字段：id, zh, en, snake, kind, bc, definition, standard_ref, confidence, aliases, forbidden, status(approved|proposed)

common_words:
  # 架构与技术后缀（命名规范 §3 规定的类型后缀、通用 CRUD 动词）
  - id
  - key
  - value
  - code
  - codes
  - type
  - status
  - request
  - response
  - controller
  - repository
  - queries
  - commands
  - command
  - result
  - find
  - by
  - save
  - start
  - next
  - put
  - get
  - of
  - is
  - has
  - in
  - at
  # 审计与通用列
  - created
  - updated
  - version
  - active
  - last
  - current
  # 值对象运算
  - plus
  - minus
  - times
  - zero
  - negative
  - exceeds
  - same
  # 状态 / 周期枚举值
  - draft
  - rejected
  - approved
  - cancelled
  - progress
  - done
  - locked
  - never
  - yearly
  - monthly
  - daily
  - finished
  # 用例动词与结果
  - submit
  - submitted
  - submission
  - approve
  - edit
  - manage
  - outcome
  - reserve
  # 架构词（模块名、注解）
  - platform
  - endpoint
  - public
  - object
  - pattern
  - reason
  - render
  # 仓储查询与运维作业（G46 作业 / 指标 / 配置键）
  - all
  - max
  - unknown
  - review
  - check
  - near
  - warning
  - ratio
  - cron
  - name
  - until

# 权限码与 HTTP 动作的标准动作集（G43：{subdomain}.{bc}:{resource}:{action} 的 action 只能取自这里）
standard_actions:
  - read
  - create
  - update
  - delete
  - submit
  - approve
  - reject
  - export
  - import
  - execute

