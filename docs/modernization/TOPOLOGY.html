<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

e", "description": "The fst:domain/expense module has 154 files and 11723 LOC. Its largest file, TravelApplication.java, is the aggregate root for travel applications. It creates DRAFT applications and checks that each document number follows the \"TR-\" pattern. It sorts the TravelApplicationLine entries and works out planStartTime and planEndTime from them. Other files include Invoice.java, MonthStatementApproval.java and ExpenseAllocationLine.java. Outgoing, it calls framework:common, fst:enums/registry and fst:expense/travel. Incoming, it is called by fst:application/expense, fst:controller/admin/expense, fst:infrastructure/bpm and fst:infrastructure/expense."}, {"id": "fst:expense", "name": "fst:expense", "kind": "module", "language": "java", "loc": 1, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/expense"}, {"id": "fst:expense/travel", "name": "fst:expense/travel", "kind": "module", "language": "java", "loc": 883, "file": "psa-backend/yudao-module-fst"}, {"id": "fst:infrastructure/expense", "name": "fst:infrastructure/expense", "kind": "module", "language": "java", "loc": 26421, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/infrastructure/expense/travel", "description": "fst:infrastructure/expense (216 files, 26421 LOC) appears to be the persistence and external-platform adapter layer for travel expenses. It includes repositories such as TravelApplicationRepositoryImpl and InvoiceRepositoryImpl, plus Fenbeitong clients and materializers such as FenbeitongOrgSynchronizationClient and FenbeitongOrderFactMaterializer. The excerpted TravelPlatformOrgSynchronizationRepositoryImpl records organization-sync runs on \"master\", and a fenceToken decides which writer may write. The module has 155 OUTGOING edges, including bpm:api/task, fst:domain/expense, fst:dal/mysql/project and system:api/dept. Its 2 INCOMING callers are fst:application/expense and fst:controller/app/expense."}, {"id": "h5:pages/work/travel", "name": "h5:pages/work/travel", "kind": "screen", "language": "tsx", "loc": 5039, "file": "psa-mini/src/pages/work/travel", "description": "The h5:pages/work/travel node is a mobile screen in psa-mini/src/pages/work/travel (LOC 5039, 29 files) for business travel applications. In form.tsx, users enter trips with cities, a business object, start and end times, and a purpose. The screen calls saveTravelApplicationDraft, submitTravelApplication and createTravelApplicationRevision. Approval screens include TravelApplicationApproval.tsx and TravelExternalApproval.tsx. It calls h5:api/fst, h5:api/process and h5:api/system, and h5:pages/index calls it. The excerpt covers only form.tsx, so the other files' behavior is unconfirmed."}]}, {"id": "dom:finance-cost-accounting-ar", "name": "Finance: cost, accounting \u0026 AR", "kind": "domain", "children": [{"id": "fst:application/accounting", "name": "fst:application/accounting", "kind": "module", "language": "java", "loc": 201, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/application/accounting/period"}, {"id": "fst:application/cost", "name": "fst:application/cost", "kind": "module", "language": "java", "loc": 20721, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/application/cost/projectcost", "description": "fst:application/cost is a 20721-LOC, 354-file module whose file names (OpeningHealthCheckUseCase.java, CostCollectionBatchOrchestratorImpl.java, CarryBatchService.java, LaborReclassRunUseCase.java, QueryProjectProfitUseCase.java, QueryWipReportUseCase.java) suggest it runs project-cost opening checks, cost collection, allocation, carry batches, labor reclassification and profit/WIP reporting. Among its 58 outgoing edges, it calls fst:service/cost, fst:domain/cost, fst:mq/producer and fst:dal/mysql/accounting. It reads ds:mdm_accounting_period, ds:psa_carry_batch skServiceImpl.java and BpmProcessInstanceServiceImpl.java) runs workflow tasks and process instances. For example, getTodoTaskPage builds a user's pending-task list, and mergeRowApprovalTasks groups row-approval tasks into one entry. Of its 34 outgoing edges, it calls bpm:framework/flowable, bpm:dal/mysql/task, bpm:mq/producer, fst:api/workflowhook, fst:api/manhour, system:api/user and system:api/dept. It reads ds:bpm_task_ext, ds:bpm_process_instance_ext, ds:bpm_process_definition_ext and ds:bpm_oa_customized. It is called by bpm:api/task, bpm:controller/admin/task, bpm:controller/app/task, bpm:framework/flowable and bpm:service/oa."}, {"id": "fst:api/project", "name": "fst:api/project", "kind": "module", "language": "java", "loc": 173, "file": "psa-backend/yudao-module-fst"}, {"id": "fst:application/delivery", "name": "fst:application/delivery", "kind": "module", "language": "java", "loc": 4343, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/application/delivery/project", "description": "fst:application/delivery is a module (LOC 4343, 94 files) of use cases for running delivery projects. It covers progress task operations through OperateProgressTaskUseCase, plus budget, deliverable and ETC approval flows such as StartBudgetRevisionUseCase, LockProjectBudgetUseCase, SubmitDeliverableUseCase and DecideEtcApprovalUseCase. It calls framework:common, framework:security, fst:application/platform, fst:domain/delivery, fst:domain/presales, fst:enums and fst:dal/mysql/contract. It reads ds:psa_pm_contract and ds:psa_pm_contract_term. It is called by fst:controller/admin/pmproject, fst:application/receivables, fst:mq/consumer, fst:service/workflowform and fst:trigger/task."}, {"id": "fst:controller/admin/calendar", "name": "fst:controller/admin/calendar", "kind": "module", "language": "java", "loc": 13, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/controller/admin/calendar/vo"}, {"id": "fst:controller/admin/pmproject", "name": "fst:controller/admin/pmproject", "kind": "module", "language": "java", "loc": 2573, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/controller/admin/pmproject", "description": "fst:controller/admin/pmproject (2573 LOC, 30 files) is the admin API for project delivery management. Its main part is WBS budget compilation in PmProjectBudgetController at /fst/pm-project/budget, which covers import, task-package edits and a lock step that submits the budget for PM_BUDGET approval. It also has controllers for project progress, deliverable submission and revenue confirmation. It makes 11 outgoing calls, to fst:application/delivery, fst:application/receivables, fst:domain/delivery, fst:domain/receivables, fst:service/user, fst:controller/admin/user, fst:enums, bpm:api/annotation, framework:security, framework:datapermission and framework:common. Its only incoming edge is pc:api/project-\u003edispatch."}, {"id": "fst:controller/admin/project", "name": "fst:controller/admin/project", "kind": "module", "language": "java", "loc": 1389, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/controller/admin/project"}, {"id": "fst:controller/admin/projectplan", "name": "fst:controller/admin/projectplan", "kind": "module", "language": "java", "loc": 303, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/controller/admin/projectplan"}, {"id": "fst:controller/admin/projecttask", "name": "fst:controller/admin/projecttask", "kind": "module", "language": "java", "loc": 572, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/controller/admin/projecttask"}, {"id": "fst:controller/app/project", "name": "fst:controller/app/project", "kind": "module", "language": "java", "loc": 35, "file": "psa-backend/yudao-module-fst/yudao-module-f g submits a PM_BUDGET approval, and rule violations throw BudgetRuleViolation. Its one OUTGOING edge calls fst:util. Its 6 INCOMING callers are fst:application/delivery, fst:controller/admin/pmproject, fst:infrastructure/delivery, fst:infrastructure/receivables, fst:service/workflowform and fst:trigger/task."}, {"id": "fst:infrastructure/delivery", "name": "fst:infrastructure/delivery", "kind": "module", "language": "java", "loc": 3239, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/infrastructure/delivery/project", "description": "fst:infrastructure/delivery is a 3239-LOC module of 14 files that holds the delivery-side repositories, queries and approval starters. Its largest file, ProjectBudgetRepositoryImpl.java, appears to load a project's WBS budget tree and apply role cost rates. Approval starters include BudgetApprovalStarterImpl.java and DeliverableApprovalStarterImpl.java. The packet records 55 OUTGOING edges but lists only some. Listed calls include bpm:api/task, fst:domain/delivery, fst:dal/mysql/project, fst:dal/mysql/quotation and system:api/user, and it reads ds:psa_bd_customer, ds:psa_budget_deliverable and ds:psa_budget_task_package. INCOMING is 0, so no callers are recorded."}, {"id": "fst:service/calendar", "name": "fst:service/calendar", "kind": "module", "language": "java", "loc": 93, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/service/calendar"}, {"id": "fst:service/project", "name": "fst:service/project", "kind": "module", "language": "java", "loc": 2160, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/service/project", "description": "fst:service/project (9 files, 2160 LOC) is the project service module. ProjectServiceImpl pages and lists projects and adds manager, department and customer names to them. It sets modificationRights for a project's manager, its delivery manager or any user with the BU\u9879\u76ee\u603b\u76d1 role. Judging by their names, ProjectPayServiceImpl and InvestForecastServiceImpl handle project pay and invest forecasts. Its 67 outgoing edges include calls to fst:dal/mysql/project, fst:dal/mysql/customer, fst:service/contract, fst:service/wip and framework:security. It is called by 7 nodes, including fst:controller/admin/project, fst:controller/app/project and fst:trigger/task."}, {"id": "fst:service/wip", "name": "fst:service/wip", "kind": "module", "language": "java", "loc": 2099, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/service/wip", "description": "fst:service/wip (8 files, 2099 LOC) appears to handle WIP carry-forward accounting. In WipServiceImpl.java, getWIPCarriedOverList loads CarryForwardDataDO and CarryForwardDataWorksDO rows for a year and month. It totals their amounts by cost type, such as \u5de5\u65f6, \u65e5\u5e38\u8d39\u7528, \u5dee\u65c5\u8d39\u7528 and \u59d4\u5916, combines them with CuValueDO output values and attaches voucher numbers from U8cVoucherDO. Its 68 OUTGOING edges include call-\u003efst:dal/mysql/wip, call-\u003efst:dal/mysql/u8c, call-\u003efst:dal/mysql/voucher and call-\u003efst:service/accounting. It has 6 INCOMING callers, including fst:controller/admin/accounting, fst:service/manhour and fst:service/sync."}, {"id": "fst:trigger/task", "name": "fst:trigger/task", "kind": "module", "language": "java", "loc": 922, "file": "psa-backend/yudao-module-fst/yudao-module-fst-biz/src/main/java/cn/iocoder/yudao/module/fst/trigger/task"}, {"id": "h5:api/project", "name": "h5:api/project", "kind": "module", "language": "tsx", "loc": 190, "file": "psa-mini/src/api/project"}, {"id": "h5:api/task", "name": "h5:api/task", "kind": "module", "language": "tsx", "loc": 32, "file": "psa-mini/src/api/task"}, {"id": "h5:pages/work/project", "name": "h5:pages/work/project", "kind": "screen", "language": "tsx", "loc": 4332, "file": "psa-mini/src/pages/work/project", "description": "The h5:pages/work/project node is a screen (4332 LOC, 8 files) in psa-mini/src/pages/work/project for recording work hours. Its files are addManhour.tsx, editManhour.tsx, assignManhour.tsx and teamAssignHours.tsx, which by their names appear to add, edit, assign and team-assign hours. addManhour.tsx saves unsubmitted drafts under MANHOUR_DRAFT_V1. The node calls h5:api/fst, h5:api/project and h5:api/task. The excerpt shows getWorksSpace, getWorksSpaceWbs2, addManHour and isWorkday imported from '@/api/project/manhour'. INCOMING (0) lists no callers."}, {"id": "pc:api/project", "name": "pc:api/project", "kind": "module", "language": "vue", "loc": 1103, "file": "psa-front-desk-pc/src/api/project"}, {"id": "pc:views/project/costTemplate", "name": "pc:views/project/costTemplate", "kind": "screen", "language": "vue", "loc": 511, "file": "psa-front-desk-pc/src/views/project/costTemplate"}, {"id": "pc:views/project/deliverable", "name": "pc:views/project/deliverable", "kind": "screen", "language": "vue", "loc": 1441, "file": "psa-front-desk-pc/src/views/project/deliverable"}, {"id": "pc:views/project/forecast", "name": "pc:views/project/forecast", "kind": "screen", "language": "vue", "loc": 909, "file": "psa-front-desk-pc/src/views/project/forecast"}, {"id": "pc:views/project/lists", "name": "pc:views/project/lists", "kind": "screen", "language": "vue", "loc": 2977, "file": "psa-front-desk-pc/src/views/project/lists", "description": "The pc:views/project/lists node is a PC screen (2977 LOC, 8 files including performance.vue, profit.vue, budget.vue, overview.vue and wip.vue) that appears to show project financial dashboards. The performance.vue excerpt displays gauges and tooltips for \u5b8c\u5de5\u767e\u5206\u6bd4, CPI, \u5b8c\u5de5\u9884\u7b97\uff08BAC\uff09, \u6323\u503c\uff08EV\uff09, \u5e94\u8ba1\u6536\u5165\uff08ACR\uff09 and \u5b9e\u9645\u6210\u672c\uff08AC\uff09. It makes 4 outgoing calls: pc:api/project, pc:api/system, pc:views/compone       for (const e of bucket) {
        if (!vis(e.source) || !vis(e.target)) continue;
        curve(byId.get(e.source), byId.get(e.target));
        if (++drawn > 1200) break;
      }
      ctx.stroke();
    }
  }

  // Focus edges (hover/selection) in accent, on top
  const focus = hovered || selected;
  if (focus && !flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const e of adjacency.get(focus) || []) {
      const a = byId.get(e.source), b = byId.get(e.target);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
  }

  // Active flow: numbered step path
  if (flowSet) {
    ctx.strokeStyle = "#cc785c"; ctx.lineWidth = 2;
    const seq = activeFlow._seq;
    ctx.beginPath();
    for (let i = 0; i + 1 < seq.length; i++) {
      const a = byId.get(seq[i]), b = byId.get(seq[i + 1]);
      if (a && b) curve(a, b);
    }
    ctx.stroke();
    seq.forEach((id, i) => {
      const n = byId.get(id); if (!n) return;
      const sx = n.x * k + tx, sy = n.y * k + ty - n.r * k - 10;
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
      ctx.fillStyle = "#cc785c"; ctx.fill();
      ctx.fillStyle = "#1e1e1e"; ctx.font = "700 11px system-ui, sans-serif";
      ctx.fillText(String(i + 1), sx, sy + 0.5);
    });
  }
}

// ── Zoom / pan / hit-testing ────────────────────────────────────────────
// Max zoom scales with the smallest leaf so deep estates stay reachable.
const leafRs = nodes.filter(n => !n.container).map(n => n.r);
const MAX_K = Math.max(600, Math.ceil(140 / Math.max(1e-6, Math.min(...leafRs))));
const zoomB = d3.zoom().scaleExtent([0.05, MAX_K]).clickDistance(4)
  .on("zoom", ev => { transform = ev.transform; requestDraw(); })
  .on("start", () => canvas.classList.add("dragging"))
  .on("end", () => canvas.classList.remove("dragging"));
const sel = d3.select(canvas).call(zoomB).on("dblclick.zoom", null);

function hit(mx, my) {
  const wx = (mx - transform.x) / transform.k, wy = (my - transform.y) / transform.k;
  let best = null;
  for (const n of nodes) {
    if (n.r * transform.k < MIN_R) continue;
    // Mirror the draw-time LOD rule so hidden nodes can't be clicked.
    if (!isRevealed(n, transform.k)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy <= n.r * n.r && (!best || n.r < best.r)) best = n;
  }
  return best;
}
let flyGen = 0;
function flyTo(n) {
  const gen = ++flyGen; // a newer flyTo (or Escape) cancels this one
  const vw = innerWidth, vh = innerHeight, cur = transform;
  const from = [(vw / 2 - cur.x) / cur.k, (vh / 2 - cur.y) / cur.k, Math.min(vw, vh) / cur.k];
  const targetW = Math.max(n.r * 2.6, Math.min(vw, vh) / MAX_K); // respect scaleExtent
  const interp = d3.interpolateZoom(from, [n.x, n.y, targetW]);
  const dur = Math.max(400, interp.duration * 0.55), t0 = performance.now();
  (function step() {
    if (gen !== flyGen) return;
    const t = Math.min(1, (performance.now() - t0) / dur);
    const [cx, cy, w] = interp(d3.easeCubicInOut(t));
    const k = Math.min(vw, vh) / w;
    sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - cx * k, vh / 2 - cy * k).scale(k));
    if (t < 1) requestAnimationFrame(step);
  })();
}
canvas.addEventListener("mousemove", e => {
  const h = hit(e.offsetX, e.offsetY);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = h ? "pointer" : "grab"; requestDraw(); }
});
canvas.addEventListener("click", e => {
  const h = hit(e.offsetX, e.offsetY);
  if (activeFlow && h) setFlow(""); // leave the walkthrough to inspect a node
  selected = h ? h.id : null;
  resultsEl.innerHTML = "";
  renderSidebar(); requestDraw();
});
canvas.addEventListener("dblclick", e => { const h = hit(e.offsetX, e.offsetY); if (h) flyTo(h); });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  // Escape inside the search box or flow select should only affect that
  // control, not reset the whole viewport.
  if (e.target === searchEl || (e.target && e.target.tagName === "SELECT")) return;
  flyGen++; selected = null; resultsEl.innerHTML = "";
  setFlow(""); flyTo(nodes[0]); renderSidebar();
});
addEventListener("resize", requestDraw);

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderSidebar() {
  if (activeFlow) return renderFlowSidebar();
  if (!selected) { sidebar.classList.remove("open"); return; }
  const n = byId.get(selected);
  const neighbors = [];
  for (const e of edges) {
    if (e.source === n.id) neighbors.push({ id: e.target, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "→" });
    else if (e.target === n.id) neighbors.push({ id: e.source, rel: EDGE_STYLE[e.kind]?.label || e.kind, dir: "←" });
  }
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.kind)}${n.language ? " · " + esc(n.language) : ""}${n.loc ? " · " + n.loc.toLocaleString() + " LOC" : ""}</div>${n.description ? `<p class="desc">${esc(n.description)}<span class="cap">written by Claude from a source excerpt and the node's connections</span></p>` : ""}
    <div>${entrySet.has(n.id) ? '<span class="badge entry">entry point</span>' : ""}
      ${deadSet.has(n.id) ? '<span class="badge">dead-end candidate</span>' : ""}
      <span class="badge">fan-in ${fanIn.get(n.id) || 0}</span>
      <span class="badge">fan-out ${fanOut.get(n.id) || 0}</span></div>
    ${n.file ? `<h3>Source</h3><div class="meta">${esc(n.file)}</div>` : ""}
    ${neighbors.length ? `<h3>Connections (${neighbors.length})</h3>` +
      neighbors.slice(0, 40).map(x => `<span class="link" data-id="${esc(x.id)}">${x.dir} ${esc(byId.get(x.id)?.name || x.id)} <span class="kind">${esc(x.rel)}</span></span>`).join("") +
      (neighbors.length > 40 ? `<div class="meta">…and ${neighbors.length - 40} more</div>` : "") : ""}`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => { selected = null; renderSidebar(); requestDraw(); };
  sidebar.querySelectorAll(".link").forEach(el => el.onclick = () => {
    const t = byId.get(el.dataset.id);
    if (t) { selected = t.id; flyTo(t); renderSidebar(); requestDraw(); }
  });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>
