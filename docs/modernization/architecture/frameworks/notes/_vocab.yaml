# 资料笔记信息栏的固定清单；「层」按登记网络 v5 的 15 个节点（ADR-0059）加 4 个横切专题，锚点的「层」标注取值于此；主题标签为「标签: 定义」，新增或改定义须经 one-architecture。
资料类型:
- 书籍
- 规范标准
- 准则法规
- 合同范本
- 行业规范
- 事务所指南
- 产品资料
主题标签:
  业务架构: BIZBOK 业务架构总体、信息图与业务对象
  价值流: 价值流与价值阶段
  能力: 业务能力图的定义、分解与评估
  流程: 业务流程、BPMN 建模与流程目录
  领域建模: DDD 战略与战术设计、限界上下文、聚合与事件
  数据建模: 概念、逻辑与物理数据模型、维度建模
  主数据: 主数据管理、记录系统、身份辨认与版本
  度量与BI: 指标口径、分析模型与报表
  集成: 系统间集成、消息与接口模式
  收入与合同: 合同在会计上的确认与计量：履约义务、交易价格、履约进度、合同资产与负债；不含合同的订立、变更审批与归档
  成本与核算: 成本归集、分摊、过账与期间核算
  项目管理: 项目计划、WBS、进度、预算与挣值
  人员与资源: 人员、任职、资源安排与工时
  税务: 税种、税票与申报
  合同管理: 合同的生命周期：起草、谈判、订立、变更审批、履约跟踪、终止与归档；不含会计确认口径
  企业架构方法: TOGAF、ArchiMate 等企业架构方法与建模语言
  合规与安全: 个人信息保护、数据安全、等级保护、审计留痕与访问控制
状态:
- 草稿
- 样板
- 已审定
