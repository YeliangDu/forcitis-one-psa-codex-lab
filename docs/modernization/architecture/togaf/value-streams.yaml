# 参考草稿（ADR-0041）：价值流只用于本阶段事件链的端到端验证（METHOD 第 4 步），不驱动 BC 推导；第 0、1 步确认页已作废。
# 架构施工图方法第 1 步：端到端价值流（草稿，待用户确认）
# 价值流 = 为某个干系人产出价值的端到端阶段序列，每个阶段由能力支撑（TOGAF Value Streams，G178）。
# 阶段的 entry / exit 写成可识别的业务事件（过去式），exit 即第 2 步事件风暴的关键事件候选（METHOD 接缝 2）。
# 校验：每个阶段至少一个能力；每个 L2 能力至少支撑一个阶段（见 scripts 校验与 SUMMARY）。
value_streams:
- id: VS-01
  name: 商机到签约
  stakeholder: 客户（拟签约的项目业主）
  trigger: 线索已获取
  outcome: 合同已签署且合同基线已生效
  evidence:
  - 'OA 模板 #78、#83–89、#3、#7'
  - MODERNIZATION_BRIEF Phase 1b、阶段 6a
  - r0/METRIC_BASELINE_DRAFT M-01–M-07
  stages:
  - id: VS-01.1
    name: 线索与商机建立
    entry: 线索已获取
    exit: 商机已建立
    capabilities:
    - CAP-01.01
    - CAP-01.02
  - id: VS-01.2
    name: 商机评估
    entry: 商机已建立
    exit: 商机评估结论已作出
    capabilities:
    - CAP-01.03
  - id: VS-01.3
    name: 报价与承诺
    entry: 商机评估结论为推进
    exit: 报价已承诺给客户
    capabilities:
    - CAP-01.04
    - CAP-12.02
    - CAP-12.03
  - id: VS-01.4
    name: 签约前先行投入授权
    entry: 签约前需先行交付的投入已提出
    exit: 风险交付已转正或已叫停
    capabilities:
    - CAP-02.05
    - CAP-12.02
  - id: VS-01.5
    name: 合同签订
    entry: 客户已接受报价
    exit: 合同已签署且基线版本已生效
    capabilities:
    - CAP-02.01
    - CAP-02.02
    - CAP-02.04
    - CAP-12.02
    - CAP-12.03
