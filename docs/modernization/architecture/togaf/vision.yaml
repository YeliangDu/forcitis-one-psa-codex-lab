open_questions:
  - id: OQ-01
    question: 业务增长类目标（新签合同额、收入、利润率、回款周期、人效等的目标水平）用户和文档中均未给出。哪些作为公司级目标写入 vision？
    why: 现有 GOAL 全部是「系统要达成的业务能力状态」，来自用户决定；M-xx 指标只有口径，没有目标值。写任何业务目标值都会是编造。
  - id: OQ-02
    question: 每个 KPI 的目标值与达成期限（例如 KPI-01 至 KPI-16 的数字、各阶段出口时点）由用户定。
    why: 材料中只有出口条件（为 0、一致、通过），没有统一的量化目标；法定账切换的会计年度也未定（ADR-0022 第 11 条称随 Phase 4 排期）。
  - id: OQ-03
    question: BI_SCOPE §6.1 Q12 要求的「经营管理需要回答、现在答不了的问题」清单（待业务 B4）尚无，GOAL-04 至 GOAL-06 的 KPI 是否完整，需要等该清单。
    why: BI_SCOPE §1.5 说明仓库中没有找到业务方的需求清单或访谈记录。
  - id: OQ-04
    question: 知识资产与 AI 赋能（老 contexts 中 km.knowledge）是否是目标？材料中除 AI_NATIVE_SPEC（Phase 1a 范围）外，没有用户对 AI 或知识管理的目标性表述。
    why: 未找到用户原话，因此未写进 goals 与 capabilities。
  - id: OQ-05
    question: 是否需要「老系统下线日期」类目标？BI_SCOPE §6.1 Q2 已取消 2026-12-31 的日期，日期待统一编排时重估。
    why: 目前只有阶段顺序，没有用户确认的日期。
  - id: OQ-06
    question: 是否需要面向员工与客户的体验类目标（例如审批时限、报销处理时长）？
    why: 材料里有审批时限规则（T+1 工作日）等用户决定，但它们是规则而不是目标陈述，也没有统一的度量口径。
