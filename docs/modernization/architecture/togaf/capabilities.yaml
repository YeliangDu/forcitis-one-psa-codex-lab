- id: CAP-10
  name: 财务核算与报告
  en: Financial Accounting and Reporting
  definition: 按权责与收付两种口径入账、结转、关账并出具财务报表。
  l2:
  - id: CAP-10.01
    name: 会计期间管理与关账
    en: Accounting Period Management and Close
    definition: 管理 (期间, 法人) 的开放、预关闭、关账与重开，执行关账前置检查。
    evidence:
    - ADR-0016 第 1 条；ADR-0022 第 10 条
    - RULE-091、108、124、129
    - glossary 期间状态、期末关账（方言「封期」）
  - id: CAP-10.02
    name: 业务事实入账
    en: Business Fact Posting
    definition: 接收业务提交的类型化过账候选，校验后分配序号并只追加入账，更正只走冲销。
    evidence:
    - ADR-0016 第 1–2 条
    - GUIDING_PRINCIPLES §9a
    - glossary 过账候选、冲销、经营事实
  - id: CAP-10.03
    name: 科目与口径转换规则管理
    en: Chart of Accounts and Conversion Rule Management
    definition: 维护两张科目表、收付与权责科目映射及口径转换规则，按版本在期间首日生效。
    evidence:
    - ADR-0022 第 2 条
    - rules/GL_FINANCE_DECISIONS D17-0 至 D17-12
    - rules/GL_RULES.md（凭证科目映射类）
    - ADR-0016 第 3 条（映射规则用 DMN）
  - id: CAP-10.04
    name: 凭证与总账核算
    en: Voucher and General Ledger Accounting
    definition: 生成并管理系统、导入、手工与期末凭证，维护总账、明细账与期间余额。
    evidence:
    - ADR-0022 第 3 条
    - U8C_GL_PRACTICE.md；U8C_CAPABILITY_MAP §3.1–3.2
    - rules/GL_RULES.md（账务基础规则类）
  - id: CAP-10.05
    name: 期末结转
    en: Period-end Closing Entries
    definition: 按模板结转损益与未分配利润等期末凭证。
    evidence:
    - rules/GL_RULES.md（期末自动转账类，如 GL-001–GL-014）
    - ADR-0022 第 10 条
  - id: CAP-10.06
    name: 财务报表编制
    en: Financial Statement Preparation
    definition: 按准则格式出资产负债表、利润表、现金流量表（直接法为主、间接法补充）。
    evidence:
    - INTENT 2026-10-14「通过新系统直接可以出权责口径的三大报表」
    - ADR-0022 第 4、5 条
    - rules/GL_RULES.md（报表取数类、现金流量标注类）
    - r0/METRIC_BASELINE_DRAFT M-35、M-36
  - id: CAP-10.07
    name: 银行与现金核算
    en: Bank and Cash Accounting
    definition: 管理银行账户、流水导入与匹配、余额调节与现金流量标注。
    evidence:
