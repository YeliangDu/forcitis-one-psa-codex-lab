    - 'OA 模板 #122（资产处置的会计处理在 U8C 固定资产）'
- id: CAP-11
  name: 经营计划与分析
  en: Business Planning and Analytics
  definition: 设定经营目标与预算，认定并归属经营事实，统一指标口径并提供经营分析。
  l2:
  - id: CAP-11.01
    name: 战略目标与经营计划编制
    en: Strategic Goal and Business Plan Formulation
