  - id: CAP-11.02
    name: 承诺目标与滚动预测
    en: Commitment Target and Rolling Forecast
    definition: 管理项目组、营销人员、交付中心、客户中心的承诺目标、销售承诺（CommitCall）、13 周滚动预测与现金流预测。
    evidence:
    - 'OA 模板 #90、#91、#93–95、#97（阶段 6f）'
    - BI_SCOPE §2、§1.5 E9
    - r0/METRIC_BASELINE_DRAFT M-40、M-41、M-23
  - id: CAP-11.03
    name: 预算编制与额度管控
    en: Budget Preparation and Quota Control
    definition: 编制经营预算并分解，管控额度的占用、释放、调整、冻结与超预算审批。
    evidence:
    - BI_SCOPE §2、§6.1 Q4
    - 'OA 模板 #99–102（预算目标，阶段 6f）'
    - r0/METRIC_BASELINE_DRAFT M-47
  - id: CAP-11.04
    name: 经营事实归属
    en: Business Fact Attribution
    definition: 把经营事实按多维归属到责任对象，主归属唯一、辅助归属比例守恒，支持只追加的重述。
    evidence:
    - BI_SCOPE §2（operations.facts：九维归属、重述）
    - glossary 事实归属、主归属、事实重述、责任对象
    - ADR-0016
  - id: CAP-11.05
    name: 经营口径与指标治理
    en: Metric and Policy Governance
    definition: 定义并版本化经营口径与指标，登记 OAT 原语，审批留痕。
    evidence:
    - ADR-0023 第 3 条
    - BI_SCOPE §2
    - r0/METRIC_BASELINE_DRAFT §1
    - glossary 经营口径、指标定义、经营会计分类法
  - id: CAP-11.06
    name: 经营勾稽与口径差异管理
    en: Business Reconciliation and Basis Difference Management
    definition: 勾稽跨域事实，维护经营口径与法定口径的差异清单并处置差异案。
    evidence:
    - ADR-0023 第 4 条
    - ADR-0022 第 2 条（对账等式）
    - glossary 经营勾稽、勾稽差异案、口径差异清单
  - id: CAP-11.07
    name: 经营分析与报表提供
    en: Business Analytics and Report Provision
    definition: 先授权后聚合，向页面、导出、BI 工具与 AI 提供指标与报表包。
    evidence:
    - ADR-0023 第 2、6 条
    - BI_SCOPE §3
    - r0/METRIC_BASELINE_DRAFT §2.1（八个报表包 P1–P8）
    - INTENT 2026-10-14 Q1「C 为主，D 待定为后期可选 (Recommended)」
  - id: CAP-11.08
    name: 经营复盘与偏差解释
    en: Business Review and Variance Explanation
    definition: 开展经营复盘，解释目标、预算与实际的偏差，跟进经营动作。
    evidence:
