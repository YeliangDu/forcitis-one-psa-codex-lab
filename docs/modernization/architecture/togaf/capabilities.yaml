# 范围核对用（ADR-0041）：一级 12 项用于查漏，不驱动 BC 推导；二级只作参考。原草稿（待第 0、1 步确认页）已作废，所删 current_bc、strategic_hint 见 git 历史。
# 架构施工图方法第 1 步：两级业务能力地图（草稿，待用户确认）
# 能力只说「做什么」，不含怎么做、谁做、在哪做（TOGAF Business Capabilities，G211）。
# 用语取 glossary/terms.yaml 的正式用语；方言（如产值确认单、委外、质保金、红冲）只在 evidence 括注中作为检索线索出现。
# 证据记法：RULE-n 为 BUSINESS_RULES.md 规则卡；OA 模板 #n 为 OA_PROCESS_INVENTORY §3 清单行号；M-xx 为 r0/METRIC_BASELINE_DRAFT。
capabilities:
- id: CAP-01
  name: 客户与商机经营
  en: Customer and Opportunity Management
  definition: 获取并认识客户，把线索转化为经评估、已报价的商机。
  l2:
  - id: CAP-01.01
    name: 客户主数据管理
    en: Customer Master Data Management
    definition: 维护客户、集团、联系人与竞争对手的主档及合并。
    evidence:
    - 'OA 模板 #10、#13、#16–18、#20–21、#24（客户、集团、联系人档案新增、变更、合并，阶段 6b）'
    - INTENT 2026-10-14「主数据全部进新系统」；ADR-0021 第 1 条
    - glossary 客户（Customer）
  - id: CAP-01.02
    name: 线索与商机跟进
    en: Lead and Opportunity Follow-up
    definition: 记录线索、客户拜访与商机阶段推进。
    evidence:
    - 'OA 模板 #83–89、#92、#98（视情况，阶段 6f）'
    - BI_SCOPE §1.5 E2（商机至少 6 处实现）
    - r0/METRIC_BASELINE_DRAFT M-01、M-04、M-07
  - id: CAP-01.03
    name: 商机评估
    en: Opportunity Assessment
    definition: 对商机作资格判断与风险结论，决定是否报价或投标。
    evidence:
    - glossary 评估模板（GoNoGoTemplate，operations.policy）
    - contexts.yaml presales.quoting 职责（仅作证据）
    - r0/METRIC_BASELINE_DRAFT M-02（赢单率分母，B6）
  - id: CAP-01.04
    name: 报价编制与承诺
    en: Quotation Preparation and Commitment
    definition: 依成本估算、费率与目标毛利编制报价，并作出对客户的报价承诺。
    evidence:
    - RULE-139–180（售前与报价，如 RULE-141 至 146 的金额推算、RULE-163 与 175 的低毛利理由）
    - 'OA 模板 #78 新增报价；MODERNIZATION_BRIEF Phase 1b'
    - INTENT 2026-10-14 规则评审第二批（售前报价 14 条）
- id: CAP-02
  name: 合同管理
  en: Contract Management
  definition: 把客户承诺固化为可执行、可计量的合同基线，并管理其后续变化。
  l2:
  - id: CAP-02.01
    name: 合同基线管理
    en: Contract Baseline Management
    definition: 记录合同的范围、计价模式、交易价格、付款条件与履约条件，以版本化基线作为交付、收入与开票的依据。
    evidence:
    - 'OA 模板 #3、#7（销售合同归档、新增）；阶段 6a'
    - OA_PROCESS_INVENTORY §6.1（合同与收入行级强耦合）
    - glossary 合同基线、计价模式、合同条款、交易价格、履约义务
    - ADR-0021 第 3 条
  - id: CAP-02.02
    name: 框架协议与任务订单管理
    en: Framework Agreement and Task Order Management
    definition: 管理框架协议、限额占用及其下的任务订单。
    evidence:
    - glossary 框架协议、任务订单、框架限额占用、框架挂靠信息
    - contexts.yaml contract.baseline 职责（仅作证据）
  - id: CAP-02.03
    name: 合同变更与签证索赔管理
    en: Contract Change, Site Visa and Claim Management
    definition: 管理工程变更、现场签证、增补与索赔，批准后形成合同基线的修订。
    evidence:
    - 'OA 模板 #4（销售合同变更）'
    - ADR-0016 背景（AEC 行业特征：签证、变更、质保金、分包成本）
    - glossary 变更、现场签证、索赔、变更批准
  - id: CAP-02.04
    name: 合同完备度检查
    en: Contract Completeness Check
    definition: 识别合同缺口，作出豁免或补签结论。
    evidence:
    - glossary 合同完备度、合同缺口项、缺口豁免
    - r0/METRIC_BASELINE_DRAFT M-07（待签合同金额）
  - id: CAP-02.05
    name: 无合同交付授权
    en: Uncontracted Delivery Authorization
    definition: 对未签约先行交付的投入授权、额度监控、转正或叫停。
    evidence:
    - glossary 风险交付授权、无合同风险敞口、授权额度
    - r0/METRIC_BASELINE_DRAFT M-46、§2.2（待签项目投入台账与问责）
    - INTENT 2026-10-14 财务确认单 A7（签约前投入先挂账、超 N 个月未签约自动转费用）
  - id: CAP-02.06
    name: 竣工结算
    en: Final Account Settlement
    definition: 对项目作竣工结算，最终确定交易价格与结算折让。
    evidence:
    - 'OA 模板 #5 项目结算申请（阶段 6a）'
    - glossary 竣工结算、结算折让（现挂在 receivables.wip）
- id: CAP-03
  name: 项目交付管理
  en: Project Delivery Management
  definition: 把合同转化为可计划、可执行、可验收的项目交付。
  l2:
  - id: CAP-03.01
    name: 项目立项
    en: Project Initiation
    definition: 依合同建立项目及其基线档案。
    evidence:
    - 'OA 模板 #6 项目立项申请、#2 项目档案变更（阶段 6a）'
    - glossary 项目（方言「项目档案」「项目立项」）
    - r0/METRIC_BASELINE_DRAFT M-03
  - id: CAP-03.02
    name: 交付计划与进度管理
    en: Delivery Planning and Progress Management
    definition: 编制 WBS、工作包与里程碑计划，跟踪进度偏差。
    evidence:
    - RULE-181–247 中交付结构与进度部分（RULE-203、207、214、223–226）
    - 'OA 模板 #105–107（项目阶段评审、启动会）'
    - glossary WBS、工作包、里程碑、进度偏差识别
  - id: CAP-03.03
    name: 项目预算与完工估算
    en: Project Budget and Estimate at Completion
    definition: 编制并变更项目成本预算，估算完工成本，并以预算毛利对比报价毛利决定审批层级。
    evidence:
    - RULE-181–183、201–202、209–212、218–221、227–232、237、239、241–247
    - 'OA 模板 #79、#80（项目预算编制、变更）'
    - glossary 项目预算（WBS 预算）、EAC、ETC
    - BI_SCOPE §2（项目预算仍属交付侧）
  - id: CAP-03.04
    name: 交付成果验收
    en: Deliverable Acceptance
    definition: 提交交付物，登记客户验收与客户价值确认，作为收入确认的触发依据。
    evidence:
    - RULE-208、225、236（验收登记）
    - ADR-0016 第 4 条（收到客户价值确认单是确认收入的唯一触发点）
    - glossary 验收单、交付确认单
  - id: CAP-03.05
    name: 质量与返工管理
    en: Quality and Rework Management
    definition: 记录质量问题，认定返工与责任归因，开展成果内审与满意度调查。
    evidence:
    - 'OA 模板 #103、#104、#108、#110'
    - RULE-215、230（返工路径）
    - glossary 质量问题、返工认定、质量损失
    - r0/METRIC_BASELINE_DRAFT M-48
  - id: CAP-03.06
    name: 项目结项
    en: Project Closure
    definition: 结束项目，关闭后不再归集成本。
    evidence:
    - 'OA 模板 #9 项目结项申请（阶段 6a）'
    - RULE-085（关闭、终止项目的合同资产与应收置零）、RULE-238（Closing 阶段）
- id: CAP-04
  name: 资源与工时管理
  en: Resource and Time Management
  definition: 安排人员，并把人的时间记录为可信、可计量的投入。
  l2:
  - id: CAP-04.01
    name: 资源计划与排期
    en: Resource Planning and Scheduling
    definition: 为任务分配人员与计划工时，掌握资源忙闲。
    evidence:
    - RULE-009–010、014–019（ETC、人天换算、资源忙碌度、颜色分档）
    - r0/METRIC_BASELINE_DRAFT M-42（日标准工时参数，B1）
  - id: CAP-04.02
    name: 工时填报
    en: Timesheet Submission
    definition: 员工按日把工时填报到当前可用的项目或工作包，并锁定提交时的费率与归属。
    evidence:
    - RULE-005、021–040、055（提交校验与编号）
    - MODERNIZATION_BRIEF Phase 2
    - 'OA 模板 #124、#125（已停用的 A8 工时填报，只迁历史）'
  - id: CAP-04.03
    name: 工时审核与有效性认定
    en: Timesheet Approval and Effectiveness Assessment
    definition: 审核工时，认定其有效性与可计费性，审核通过后产生成本与计费金额。
    evidence:
    - RULE-003、020、043–057（审核状态机与结果映射）
    - glossary 有效性认定、有效工时、无效工时、可计费工时
    - INTENT 2026-10-14（审批时限 T+1 工作日、候选组认领）
  - id: CAP-04.04
    name: 利用率与产能监控
    en: Utilization and Capacity Monitoring
    definition: 监控人员利用率、闲置产能与工时结构。
    evidence:
    - r0/METRIC_BASELINE_DRAFT M-42、M-43
    - BI_SCOPE §1.5 E3（利用率三套算法）
    - glossary 利用率、闲置产能、产能变现
- id: CAP-05
  name: 项目成本核算
  en: Project Costing
  definition: 按权责发生制把人工、费用与分包成本归集到项目，并结转为合同履约成本或营业成本。
  l2:
  - id: CAP-05.01
    name: 成本费率管理
    en: Cost Rate Management
    definition: 维护标准成本费率与计费费率的版本，并在提交时锁定。
    evidence:
    - RULE-002、007、139、147、157、245
    - glossary 标准费率、费率版本、计费费率卡（方言「BU岗位人天单价」）
  - id: CAP-05.02
    name: 项目成本归集与归因
    en: Project Cost Collection and Attribution
    definition: 把直接人工、直接费用与分包成本归集并归因到项目与合同条款，已关账期间的成本落入最早的后续开放期间。
    evidence:
    - RULE-074、099–107、111–114、121、134
    - ADR-0016 第 1–2 条
    - glossary 成本归集、成本归因、直接人工、直接费用
  - id: CAP-05.03
    name: 间接成本分摊
    en: Indirect Cost Allocation
    definition: 按规则把间接成本池分摊到项目与组织单元。
    evidence:
    - RULE-066、068–070、092、116、120
    - glossary 间接成本池、间接成本分摊（方言「OH 分摊」）
    - r0/METRIC_BASELINE_DRAFT M-31、待财务 F8
  - id: CAP-05.04
    name: 费用预提
    en: Expense Accrual
    definition: 对已发生未结算的费用与薪酬按期预提并冲回。
    evidence:
    - 'OA 模板 #34 BU预提费用明细表（阶段 6c）'
    - RULE-087（人月取整与薪酬预提）
    - ADR-0022 第 2 条（预提及冲回两账相同）
  - id: CAP-05.05
    name: 成本结转
    en: Cost Carry-forward
    definition: 按期间把项目成本结转为合同履约成本或营业成本，并支持红冲。
    evidence:
    - RULE-071–072、093–095、118、122、125–127、130、136
    - rules/GL_FINANCE_DECISIONS D17-1 至 D17-5
    - glossary 成本结转批次、合同履约成本（方言「成本 WIP」）
  - id: CAP-05.06
    name: 内部结算
    en: Intercompany Settlement
    definition: 在法人之间按内部结算条款结算项目成本与收入。
    evidence:
    - glossary 内部结算、内部结算条款、待内部结算、转移定价
    - GUIDING_PRINCIPLES §9a TOGAF 行（跨法人结算作为后续过渡架构）
- id: CAP-06
  name: 收入确认与开票
  en: Revenue Recognition and Billing
  definition: 依客户确认的价值确认收入、形成合同资产，并按合同条款开具发票。
  l2:
  - id: CAP-06.01
    name: 收入确认
    en: Revenue Recognition
    definition: 依产出法在客户价值确认时确认收入，受合同条款额度约束，更正只走冲销。
    evidence:
    - ADR-0016 第 4 条（ACC-R01 产出法）
    - RULE-184–185、190、205、213、222、240
    - 'OA 模板 #1、#123（方言「产值确认单」）'
    - r0/METRIC_BASELINE_DRAFT M-08、M-09
  - id: CAP-06.02
    name: 合同资产管理
    en: Contract Asset Management
    definition: 管理未开票在制与合同资产，保持滚动恒等式，识别账龄减值迹象。
    evidence:
    - GUIDING_PRINCIPLES §9a（滚动恒等式 F113）
    - RULE-082–085、197
    - glossary 合同资产、未开票在制（WIP）、合同负债
    - r0/METRIC_BASELINE_DRAFT M-17
  - id: CAP-06.03
    name: 开票申请与准入
    en: Invoice Request and Eligibility
    definition: 依已确认收入与条款额度受理开票申请，判断是否准予开票。
    evidence:
    - RULE-199（可开票额度）
    - 'OA 模板 #11、#15 项目开票申请、首付款开票申请（阶段 6b）'
    - ADR-0016 第 5 条（WIP 与开票是同一个一致性边界）
    - r0/METRIC_BASELINE_DRAFT M-10、M-18
  - id: CAP-06.04
    name: 发票开具与更正
    en: Invoice Issuance and Correction
    definition: 经税务平台开具销项发票，退票与红冲并保留冲销链。
    evidence:
    - OA_PROCESS_INVENTORY §0 第 3 点（A8 销项开票插件 LEXMISCIVOUT_*）
    - 'OA 模板 #11、#14 发票退票申请'
    - glossary 开票、冲销（方言「红冲」）
  - id: CAP-06.05
    name: 收入调整与减值
    en: Revenue Adjustment and Impairment
    definition: 处理收入冲减、产值坏账与合同资产减值。
    evidence:
    - 'OA 模板 #8 产值坏账申请（会计含义待财务确认）'
    - rules/GL_FINANCE_DECISIONS D17-8
    - r0/METRIC_BASELINE_DRAFT M-20、M-21
  - id: CAP-06.06
    name: 计时账单编制
    en: Time-and-Materials Billing
    definition: 对 T&M 合同按计费期间依已审核工时编制期间账单。
    evidence:
    - glossary T&M 工时计费、T&M 期间账单（receivables.wip）
    - contract.baseline 计价模式
- id: CAP-07
  name: 应收与回款
  en: Receivables and Collection
  definition: 管理开票后的应收，从到账认领到核销、催收与减值。
  l2:
  - id: CAP-07.01
    name: 应收登记与账龄管理
    en: Receivable Registration and Aging
    definition: 开票后登记应收，并按账龄分段监控。
    evidence:
    - glossary 应收账款、账龄桶
    - r0/METRIC_BASELINE_DRAFT M-13–M-16
    - BI_SCOPE §1.5 E1、E4（应收四套算法、逾期定义）
  - id: CAP-07.02
    name: 回款登记与核销
    en: Cash Receipt and Application
    definition: 登记回款（含预收、退款、保理），认领到账并核销应收。
    evidence:
    - 'OA 模板 #12、#22、#23（回款单、退款单、预收款单；阶段 6b）'
    - glossary 回款单、到账认领、回款分配、核销
    - r0/METRIC_BASELINE_DRAFT M-11、M-12
  - id: CAP-07.03
    name: 催收与回款计划
    en: Collection and Collection Planning
    definition: 跟进催收，维护回款计划与承诺。
    evidence:
    - r0/METRIC_BASELINE_DRAFT §2.2（催收跟进与催款函迁入 receivables.collection，6b）
    - glossary 催收、回款计划（「预计回款」待定）
  - id: CAP-07.04
    name: 应收减值与坏账核销
    en: Receivable Impairment and Write-off
    definition: 判断应收减值风险，计提、转回与核销分开表达。
    evidence:
    - 'OA 模板 #19 应收坏账申请流程'
    - r0/METRIC_BASELINE_DRAFT M-20、M-21
    - glossary 减值风险、坏账核销
  - id: CAP-07.05
    name: 质量保证金管理
    en: Retention Money Management
    definition: 管理质量保证金的扣留、到期与返还。
    evidence:
    - glossary 质量保证金、缺陷责任期、质量保证金到期返还（方言「质保金」）
    - ADR-0016 背景（质保金是独立应收类型；AEC 行业特征）
    - INTENT 2026-10-14 财务确认单 A6（质保金另设专项台账）
  - id: CAP-07.06
    name: 应收票据管理
    en: Notes Receivable Management
    definition: 管理商业承兑汇票的收取、到期与兑付。
    evidence:
    - r0/METRIC_BASELINE_DRAFT M-22
    - OA_PROCESS_INVENTORY §6.3 6b（应收票据档案）
- id: CAP-08
  name: 支出与应付管理
  en: Expenditure and Payables Management
  definition: 管理员工费用、采购与分包支出，直至应付与付款。
  l2:
  - id: CAP-08.01
    name: 费用事前申请与备案
    en: Expense Pre-approval and Filing
    definition: 对业务招待、信息服务费等事前申请与备案，决定可报销或可付金额。
    evidence:
    - 'OA 模板 #27、#81、#82（阶段 6c）'
  - id: CAP-08.02
    name: 费用报销与差旅
    en: Expense Claim and Travel
    definition: 受理日常、业务招待与差旅费用报销，对接差旅供应商的订单与对账。
    evidence:
    - 'OA 模板 #25–28（阶段 6c）'
    - MODERNIZATION_BRIEF Phase 3（差旅报销，分贝通）
    - glossary 报销单、差旅
  - id: CAP-08.03
    name: 员工借还款
    en: Employee Advance and Repayment
    definition: 处理员工借款与还款。
    evidence:
    - 'OA 模板 #38、#39（阶段 6c）'
    - INTENT 2026-10-14「都算，都进新系统 (Recommended)」
  - id: CAP-08.04
    name: 供应商主数据管理
    en: Supplier Master Data Management
    definition: 维护供应商主档与变更。
    evidence:
    - 'OA 模板 #32、#36（阶段 6c）'
    - INTENT 2026-10-14「主数据全部进新系统」
  - id: CAP-08.05
    name: 采购请购与采购合同
    en: Procurement Requisition and Contract
    definition: 管理非项目采购的请购、采购合同与变更（含资产采购）。
    evidence:
