    - ADR-0022 第 7 条（accounting.cashbank）
    - r0/METRIC_BASELINE_DRAFT §2.2（银行日记账）
  - id: CAP-10.08
    name: 固定资产与税费核算
    en: Fixed Asset and Tax Accounting
