  transitions_say: AGG-49：争议中、坏账已核销、已冲减、已转预收或待退、已逾期；AGG-52：已确认、已部分冲抵、已冲抵、预付款已登记、已冲销
  note: 应收 / 应付两个聚合各自引入的状态（已冲抵、已冲减、已逾期等）在 key_states 中没有；「已冲减」是否即「红冲减少」待定；「已逾期」可能是派生而非状态
