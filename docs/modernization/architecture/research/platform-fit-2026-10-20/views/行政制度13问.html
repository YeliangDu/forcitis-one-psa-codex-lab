<title>行政制度 13 问</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版式：单列题卡，每题背景一句、选项按钮带影响说明，底部固定「提交」条 */
:root{--bg:#f5f6f8;--panel:#fff;--ink:#17212b;--muted:#5c6875;--rule:#d8dee5;--accent:#1f5f8b;--accent-bg:#e3eef7;--warn:#9a6a00;--warn-bg:#fbf0d6;
  --f:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161d;--panel:#18212b;--ink:#e4e9ee;--muted:#98a5b2;--rule:#2b3743;--accent:#80b4dc;--accent-bg:#1b3043;--warn:#e2b752;--warn-bg:#352b14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--panel:#18212b;--ink:#e4e9ee;--muted:#98a5b2;--rule:#2b3743;--accent:#80b4dc;--accent-bg:#1b3043;--warn:#e2b752;--warn-bg:#352b14;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:grid;gap:14px;overflow-x:clip}
h1{font-size:20px;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted)}
.q{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.q h2{font-size:16px;margin:0;text-wrap:balance}
.tag{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-left:6px;font-weight:400;white-space:nowrap}
.bg{color:var(--muted);font-size:13.5px;margin:0;overflow-wrap:anywhere}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer;display:grid;gap:2px}
.opt b{font-size:14.5px}
.opt span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.opt:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);min-height:44px}
.ref{font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .st{color:var(--muted);font-size:13px;flex:1;min-width:180px}
.btn{border:0;background:var(--accent);color:var(--panel);border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.confirm{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px;display:grid;gap:8px}
</style>

<div class="wrap">
  <h1>行政制度 13 问</h1>
  <p class="lede">前 8 题只问手上有没有这份制度，有的话把文件直接发到我这个会话；后 5 题是简单选择。不用抄制度内容，设计方从文件里整理后再给你确认。点完最后点「提交」。</p>
  <div id="qs"></div>
  <div id="confirm" hidden></div>
  
</div>
<div class="bar"><div class="in"><span class="st" id="st">正在读取已保存的选择…</span><button class="btn" id="submit" type="button">我选好了，提交</button></div></div>

<script>
const Q=[{"id": "B31P-01", "t": "用印：用印管理制度、授权表", "tag": "材料", "bg": "谁能用哪枚章、什么用途要谁批。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-04", "t": "用印：哪些用途要加审", "tag": "材料", "bg": "加审的用途、条件和例外清单。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-27", "t": "报价用印：制度和空白登记表", "tag": "材料", "bg": "报价发出前必须已经盖章，这一条已定。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-07", "t": "IT 工单：服务类别和负责人", "tag": "材料", "bg": "IT 需求分哪几类、各由谁处理、空白需求单。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-11", "t": "IT 金额：金额审批规定", "tag": "材料", "bg": "IT 和采购的金额由谁批、批到多少。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-14", "t": "资产领用：各岗位配多少、超配怎么办", "tag": "材料", "bg": "岗位配置标准、超配规则、空白领用单。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-17", "t": "员工活动：活动类型和预算", "tag": "材料", "bg": "有哪些活动、每人每次多少钱、人数次数限制。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-21", "t": "周年贺卡：发给谁、什么时候发", "tag": "材料", "bg": "适用员工、从第几年开始、补发规定。", "o": [["yes", "有", "把文件发到本会话（手机直接发），由设计方整理。"], ["part", "有一部分", "把已有的发来，缺的由设计方起草给你看。"], ["no", "没有成文制度", "由设计方起草，你批准前这类业务不启用。"]], "ref": "", "f": ""}, {"id": "B31P-12", "t": "IT 单据本身会记金额吗？", "tag": "选择", "bg": "还是金额都记在采购单上？", "o": [["yes", "会", "再答下一题。"], ["no", "不会，金额都在采购单", "下一题不用答。"]], "ref": "", "f": ""}, {"id": "B31P-13", "t": "IT 金额两档审批线（上一题选「会」才答）", "tag": "选择", "bg": "人民币、含税总额。", "o": [["a", "1 万 / 5 万", ""], ["b", "2 万 / 10 万", ""], ["c", "自定（写在备注）", "例如：1.5 万 / 8 万，不含税"]], "ref": "", "f": ""}, {"id": "B31P-24", "t": "2 月 29 日入职的人，平年周年算哪天？", "tag": "选择", "bg": "", "o": [["a", "2 月 28 日", ""], ["b", "3 月 1 日", ""]], "ref": "", "f": ""}, {"id": "B31P-25", "t": "离职后又回来的人，周年怎么算？", "tag": "选择", "bg": "", "o": [["a", "从这次入职重新算", ""], ["b", "按第一次入职算", "离开的那段也算在内。"], ["c", "只算实际在职的时间", "扣掉离开的那段。"]], "ref": "", "f": ""}, {"id": "B31P-26", "t": "周年贺卡漏发了要不要补？", "tag": "选择", "bg": "", "o": [["no", "不补", ""], ["d7", "补，最多补 7 天内的", ""], ["d30", "补，最多补 30 天内的", ""], ["c", "补，天数自定（写在备注）", ""]], "ref": "", "f": ""}];
let ans={},dbref=null,submitted=null;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  document.getElementById("qs").innerHTML=Q.map(q=>{const a=ans[q.id]||{};return `<section class="q" id="${q.id}"><h2>${esc(q.t)}${q.tag?`<span class="tag">${esc(q.tag)}</span>`:""}</h2>${q.bg?`<p class="bg">${esc(q.bg)}</p>`:""}<div class="opts">${q.o.map(([k,l,i])=>`<button type="button" class="opt" data-q="${q.id}" data-k="${k}" aria-pressed="${a.choice===k}"><b>${esc(k.length===1?"("+k+") ":"")}${esc(l)}</b><span>${esc(i)}</span></button>`).join("")}</div><textarea id="n-${q.id}" data-q="${q.id}" placeholder="备注（可空）">${esc(a.note||"")}</textarea></section>`}).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const q=b.dataset.q,k=b.dataset.k;const cur=ans[q]||{};save(q,{...cur,choice:cur.choice===k?null:k})});
  document.querySelectorAll("textarea").forEach(t=>t.onchange=()=>{const q=t.dataset.q;save(q,{...(ans[q]||{}),note:t.value})});
  status();
}
function status(){const n=Q.filter(q=>ans[q.id]?.choice||ans[q.id]?.note).length;document.getElementById("st").textContent=(submitted?`已提交（${submitted}）；之后的改动需再次提交。`:"")+`已选 ${n} / ${Q.length} 题`}
async function save(q,v){ans[q]=v;render();if(!dbref)return;try{await dbref.collection("answers").doc(q).set({...v,updatedAt:new Date().toISOString()})}catch(e){document.getElementById("st").textContent="保存失败："+(e.message||e.code||"")}}
document.getElementById("submit").onclick=()=>{
  const chosen=Q.filter(q=>ans[q.id]?.choice||ans[q.id]?.note);
  const c=document.getElementById("confirm");c.hidden=false;
  c.innerHTML=`<div class="confirm"><b>确认提交</b><div>已答 ${chosen.length} 题，未答 ${Q.length-chosen.length} 题（视为未定）。</div><div>${chosen.map(q=>{const a=ans[q.id];const o=q.o.find(x=>x[0]===a.choice);return `${q.id}：${o?esc(o[1]):"（未选项）"}${a.note?"；备注："+esc(a.note):""}`}).join("<br>")}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ok" type="button">确认提交</button><button class="btn sec" id="cancel" type="button">再看看</button></div></div>`;
  c.scrollIntoView({behavior:"smooth"});
  document.getElementById("cancel").onclick=()=>{c.hidden=true};
  document.getElementById("ok").onclick=async()=>{
    if(!dbref){c.innerHTML=`<div class="confirm">这个视图连不上数据，提交没有保存。请登录后在 claude.ai 打开本页再提交。</div>`;return}
    const ts=new Date().toISOString();
    try{await dbref.collection("answers-submit").doc(ts.replace(/[:.]/g,"-")).set({at:ts,answers:Object.fromEntries(chosen.map(q=>[q.id,ans[q.id]]))});submitted=ts.slice(0,16).replace("T"," ");c.innerHTML=`<div class="confirm">已提交。调度会话会读取你的答复。</div>`;status()}catch(e){c.innerHTML=`<div class="confirm">提交失败：${esc(e.message||e.code||"")}。请稍后再点一次提交。</div>`}
  };
};
render();
(async()=>{dbref=await window.claude?.use?.("db");if(!dbref){document.getElementById("st").textContent="未连上数据：可以浏览，选择不会保存";return}
  dbref.collection("answers").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});ans=m;render()},()=>{});
})();
</script>
