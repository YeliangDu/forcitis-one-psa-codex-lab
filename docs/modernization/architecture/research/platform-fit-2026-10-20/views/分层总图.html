<title>FORCITIS one 分层总图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版式：自上而下的层带（渠道→业务模块→业务基座→平台服务→基础设施），底部两条贯穿与退役；每格一项，状态用色块标出 */
:root{
  --bg:#f4f6f8;--panel:#ffffff;--ink:#16202b;--muted:#5b6876;--rule:#d9e0e7;--accent:#1f5f8b;
  --built:#1f7a4d;--built-bg:#e3f3ea;--partial:#2a6fb0;--partial-bg:#e2eefa;
  --decided:#6b6f76;--decided-bg:#eceef1;--gap:#b4372b;--gap-bg:#fbe6e3;--research:#6b4fa0;--research-bg:#efe9f8;--pending:#9a6a00;--pending-bg:#fbf0d6;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c;--panel:#17202a;--ink:#e3e9ef;--muted:#97a4b2;--rule:#2a3642;--accent:#7fb3da;
  --built:#6fd09d;--built-bg:#173326;--partial:#86b9ea;--partial-bg:#172c40;
  --decided:#aab2bc;--decided-bg:#232c36;--gap:#f19084;--gap-bg:#3a1f1c;--research:#c3aef0;--research-bg:#2a2340;--pending:#e2b752;--pending-bg:#352b14;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c;--panel:#17202a;--ink:#e3e9ef;--muted:#97a4b2;--rule:#2a3642;--accent:#7fb3da;
  --built:#6fd09d;--built-bg:#173326;--partial:#86b9ea;--partial-bg:#172c40;
  --decided:#aab2bc;--decided-bg:#232c36;--gap:#f19084;--gap-bg:#3a1f1c;--research:#c3aef0;--research-bg:#2a2340;--pending:#e2b752;--pending-bg:#352b14;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
header{display:grid;gap:6px}
h1{font-size:21px;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:72ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .meta{color:var(--muted);font-size:12px;margin-left:auto}
.f{border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.f[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.f:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.layer{background:var(--panel);border:1px solid var(--rule);border-radius:10px;display:grid;grid-template-columns:150px 1fr;min-width:0}
.layer>.hd{padding:12px;border-right:1px solid var(--rule);display:grid;align-content:start;gap:4px}
.layer>.hd b{font-size:15px}
.layer>.hd span{color:var(--muted);font-size:12px}
.layer>.hd .sum{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.items{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;min-width:0}
.it{border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:6px;background:var(--panel);min-width:0}
.it summary{list-style:none;cursor:pointer;padding:7px 9px;display:grid;gap:2px}
.it summary::-webkit-details-marker{display:none}
.it .t{display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.it .nm{font-weight:600;min-width:0}
.pill{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--cb);color:var(--c);white-space:nowrap}
.it .mod{font:11.5px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.it .w{font:11px var(--f-mono);color:var(--muted)}
.it .body{padding:0 9px 9px;display:grid;gap:4px;font-size:12.5px}
.it .body .ref{color:var(--muted);font-size:12px}
.s-built{--c:var(--built);--cb:var(--built-bg)}.s-partial{--c:var(--partial);--cb:var(--partial-bg)}
.s-decided{--c:var(--decided);--cb:var(--decided-bg)}.s-gap{--c:var(--gap);--cb:var(--gap-bg)}.s-pending{--c:var(--pending);--cb:var(--pending-bg)}.s-research{--c:var(--research);--cb:var(--research-bg)}
.empty{padding:28px;border:1px dashed var(--rule);border-radius:10px;color:var(--muted);text-align:center}
.side{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.side .layer{grid-template-columns:1fr}
.side .layer>.hd{border-right:0;border-bottom:1px solid var(--rule)}
@media (max-width:760px){.layer{grid-template-columns:1fr}.layer>.hd{border-right:0;border-bottom:1px solid var(--rule)}.side{grid-template-columns:1fr}.bar .meta{margin-left:0;width:100%}
  .items{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px}
  .it{border-left-width:3px}
  .it summary{padding:6px 6px}
  .it .t{flex-direction:column;align-items:flex-start;gap:2px}
  .it .nm{font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
  .pill{font-size:10.5px;padding:0 4px}
  .it .mod,.it .w{font-size:10.5px}
  .it[open]{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.it{transition:border-color .15s}}
</style>

<div class="wrap">
  <header>
    <h1>FORCITIS one 分层总图</h1>
    <p class="lede">系统从下往上分五层：基础设施支撑平台服务，平台服务支撑业务基座，业务基座支撑业务模块，用户经渠道进入。每一格标出依据（ADR）、所属建造批（W0–W5）和当前状态，点开看说明。数据随项目进展更新。</p>
  </header>
  <div class="bar" id="filters" role="group" aria-label="按状态筛选"></div>
  <div id="main"><div class="empty">正在读取各层内容…</div></div>
</div>

<script>
const STATUS={built:"已建",partial:"部分建成",decided:"已定未建",pending:"待定",research:"候选（研究中）",gap:"缺口"};
const ORDER=["built","partial","decided","pending","research","gap"];
const LAYERS=[
  {k:"channel",name:"渠道",sub:"用户从哪进来"},
  {k:"business",name:"④ 业务模块",sub:"具体业务，按 ADR-0051 BC 清单"},
  {k:"base",name:"③ 业务基座",sub:"所有业务共用的主数据与主干"},
  {k:"platform",name:"② 平台服务",sub:"与业务无关、各模块都要用"},
  {k:"infra",name:"① 基础设施",sub:"跑起来所需的资源"}
];
const SIDE=[
  {k:"cross",name:"贯穿各层",sub:"安全合规、数据治理、可观测"},
  {k:"retire",name:"老系统退役",sub:"投产时一次切换后要收尾的"}
];
let items=[],meta={},filter=null;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function counts(list){const c={};for(const s of ORDER)c[s]=0;for(const i of list)if(c[i.status]!==undefined)c[i.status]++;return c}
function renderFilters(){
  const c=counts(items);const el=document.getElementById("filters");
  el.innerHTML=`<button class="f" id="f-all" aria-pressed="${filter===null}">全部 <span class="n">${items.length}</span></button>`+
    ORDER.map(s=>`<button class="f s-${s}" id="f-${s}" data-s="${s}" aria-pressed="${filter===s}"><span class="dot" style="background:var(--c)"></span>${STATUS[s]} <span class="n">${c[s]}</span></button>`).join("")+
    `<span class="meta">${meta.updated?("更新于 "+esc(meta.updated)):""}</span>`;
  el.querySelectorAll(".f").forEach(b=>b.onclick=()=>{filter=b.dataset.s||null;try{localStorage.setItem("flt",filter||"")}catch(e){}render()});
}
function card(i){
  return `<details class="it s-${esc(i.status)}"><summary><div class="t"><span class="nm">${esc(i.name)}</span><span class="pill">${esc(STATUS[i.status]||i.status)}</span></div>`+
   (i.module?`<span class="mod">${esc(i.module)}</span>`:"")+(i.wave?`<span class="w">${esc(i.wave)}</span>`:"")+
   `</summary><div class="body">${i.note?`<div>${esc(i.note)}</div>`:""}${i.refs?`<div class="ref">依据：${esc(i.refs)}</div>`:""}</div></details>`;
}
function layerBlock(L){
  const all=items.filter(i=>i.layer===L.k).sort((a,b)=>(a.order??0)-(b.order??0));
  const shown=filter?all.filter(i=>i.status===filter):all;
  const c=counts(all);
  const sum=ORDER.filter(s=>c[s]).map(s=>`<span class="pill s-${s}">${STATUS[s]} ${c[s]}</span>`).join("");
  return `<section class="layer" aria-label="${esc(L.name)}"><div class="hd"><b>${esc(L.name)}</b><span>${esc(L.sub)}</span><div class="sum">${sum}</div></div>`+
   `<div class="items">${shown.length?shown.map(card).join(""):`<span class="n">${all.length?"此状态下没有条目":"暂无条目"}</span>`}</div></section>`;
}
function render(){
  renderFilters();
  const m=document.getElementById("main");
  if(!items.length){m.innerHTML=`<div class="empty">还没有条目。各层内容由调度会话写入，写入后这里会自动出现。</div>`;return}
  m.innerHTML=`<div style="display:grid;gap:12px">${LAYERS.map(layerBlock).join("")}</div><div class="side" style="margin-top:18px">${SIDE.map(layerBlock).join("")}</div>`;
}
try{const f=localStorage.getItem("flt");if(f&&STATUS[f])filter=f}catch(e){}
render();
(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){document.getElementById("main").innerHTML=`<div class="empty">这个视图读不到数据。请登录后在 claude.ai 打开本页。</div>`;return}
  db.collection("items").onSnapshot(s=>{items=s.docs.map(d=>d.data()).filter(Boolean);render()},()=>{});
  db.doc("meta/page").onSnapshot(s=>{meta=s.data()||{};renderFilters()},()=>{});
})();
</script>
