<div class="wrap">
  <h1>平台服务 ADR 批准</h1>
  <p class="lede">6 份 ADR 草案经独立复审、改后复核和定点复核；另有 9 个需要你单独确认的点，共 15 项。点选只是草稿，最后点「我选好了，提交」才算数。「未选的都填第一项」只填草稿、不会提交，它填的是每题第一项，也就是草案原样（例如令牌一项会填「批准部分例外」）。批准后才占号、正式入库。</p>
  <div id="qs"></div>
  <div id="confirm" hidden></div>
  
</div>

<script>
const Q=[{"id": "A1", "t": "批准 ADR：签章服务", "tag": "ADR", "bg": "新建平台模块「签章服务」。用印申请调用它，它不反过来依赖用印申请。印章台账按「法人 × 印章类型」建，按现有用印记录约 35 条，变更留版本。对外有效的电子印章走省级指定单位制作备案的路径，服务商对接只放在对外对接层。系统不保管私钥；员工离职时关闭其签章授权，名下有证书的生成吊销待办（吊销由发证机构办）。图纸签章在系统外完成，系统只登记签章人、日期、文件指纹，核对执业资格是否有效，不验签。签章记录只追加，不能改。\n代价与限制：对方或当地规则要求实体章时仍用实体章，「整体电子化」是默认做法，不是全部；制作备案与服务商接入有外部周期和费用（未询价）；某类印章切换到电子用印后，实体章在稳定前不交回、不销毁；备案注销不可逆，到时由你决定。另有法务 6 问、安全评审 5 问待答（如 6 家法人的备案省份与跨省效力、私钥由谁控制）。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-签章服务.md"}, {"id": "A1a", "t": "用印分两段切换（起草推出，非你原话）", "tag": "单列确认", "bg": "你在 Q01 选了省级备案电子印章，原落点是「公司用印整体电子化」。草案改成分两段：通用审批先行上线时先用实体章，系统登记用印并引用印章台账；某一类印章办完省级备案、服务商接入、安全评审和验收后，这一类再切换为电子用印。切换前实体章与系统并存；对方要求实体章的场合一直保留实体章。", "o": [["agree", "同意分两段", "先行上线照常；电子用印按类陆续切换，每类各自走备案、接入、评审。"], ["disagree", "不同意：先行上线即全部电子用印", "先行上线要等全部印章完成备案和接入，A8 停用跟着推迟；签章服务与 ADR-0054 修订（A1c）须重拟。"]], "ref": "", "f": "ADR-草案-签章服务.md"}, {"id": "A1b", "t": "电子印章没就绪，也不挡通用审批先行上线（起草推出，非你原话）", "tag": "单列确认", "bg": "电子印章的备案和接入有外部周期，不受我们控制。草案定为：先行上线不等电子印章，A8 用印可以按原计划停用，改在新系统用实体章办理。", "o": [["agree", "同意", "先行上线和 A8 停用时间不受电子印章影响。"], ["disagree", "不同意：电子印章就绪才先行上线", "先行上线与 A8 停用随电子印章推迟，推迟多久取决于备案和接入；A1c 须重拟。"]], "ref": "", "f": "ADR-草案-签章服务.md"}, {"id": "A1c", "t": "修改已定的先行上线范围（ADR-0054）：用印部分写入签章服务", "tag": "修订已定 ADR", "bg": "已定的「通用审批先行上线」只说用印走通用审批。草案在这句后补上：用印包括签章服务的印章台账和电子用印，按两段办理（即 A1a、A1b）；某类印章切换后，电子用印和服务商对接在先行期就上生产运行。另外，必须保全的历史记录里加上「签章记录」。其余不变。原文与新文对照见签章服务草案第 9 节。A1a 或 A1b 选了「不同意」时，这一项须重拟，不要选批准。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-签章服务.md"}, {"id": "A1d", "t": "电子用印结果怎么拿回来：服务商回调，还是系统主动查询", "tag": "单列确认", "bg": "某类印章切换为电子用印时，签好的文件要从服务商拿回来。服务商回调要在互联网上开一个对外入口，而这会是系统第一个对外入口，切换批要先建好单独网址、网关白名单、防火墙和限流；主动查询不开入口，由系统定时去问服务商。草案目前把两种做法列为切换批实施时的比较项，由安全评审比较后定。", "o": [["c", "按草案：切换时由安全评审比较后定", "你不必现在选；最终做法会写进实施卡。"], ["a", "定为服务商回调", "结果回收及时；切换批要先建对外入口，安全面扩大。"], ["b", "定为主动查询，不开对外入口", "不新增对外入口；结果有延迟，而且要服务商支持查询接口（未核）。"]], "ref": "", "f": "ADR-草案-签章服务.md"}, {"id": "A2", "t": "批准 ADR：外部人员用一次性链接回签或上传", "tag": "ADR", "bg": "外部人员不建账号。每条链接只绑定一张单据、一个动作（回签或上传）、一位对方联系人。首批单据：客户价值确认单、审查同意意见与发包人签收单、成果确认函、验收单与各类签认单、委外交付确认与供方交付成果、发包人提供资料，逐类开放，默认关闭。合同签署、劳动合同、检测报告、出图签章、涉及收付款的单据不走这个通道。有效期默认 7 天，最长 14 天，提交即作废。只开 4 个对外接口，用单独的网址。通用审批先行上线时不开放，第二批建造（交付物验收那一批）时再建。法务答复前，对方在境外的一律不发。\n代价与限制：系统不代发，链接由签发人自己用邮件、微信发出；对方提交后不直接生效，须我方人员审核接收；对方首次上传前链接若被转发，拿到的人能下载我方文件并提交，只能靠人工核对回签件；新增一个免登录的对外入口，等保和运维范围随之扩大；要等文件服务（A3）批准后才能做。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-外部访问.md"}, {"id": "A2a", "t": "链接里带一次性口令，例外放宽「口令不进网址」的已定规则（ADR-0009）", "tag": "修订已定 ADR", "bg": "已定规则要求登录口令一类的东西不放进网址。草案把一次性口令放在网址 # 号后面（例如 …/回签#xxxx）：这部分浏览器不发给服务器，不进服务器日志，页面读到后立即从地址栏清掉；问号后、路径里、跳转地址里仍然不准带。按字面看，这仍然算口令进了网址，所以属于部分例外。草案本身写了「批准前须架构会话确认」，架构会话目前按你的决定暂停建模。点「全部同意」会填 (a)。", "o": [["a", "批准部分例外", "不等架构会话，按草案做。"], ["b", "先让架构会话只判这一条，再批", "只为这一问恢复架构会话，其余暂停不变；A2 等它判完再定。"], ["c", "不放例外：链接只带编号，口令另发", "签发人要分两次、走两个渠道发（如邮件发链接、微信发口令），对方要拼起来用，容易出错；不需要系统新建外发通道；A2 须按此重拟。"]], "ref": "", "f": "ADR-草案-外部访问.md"}, {"id": "A3", "t": "批准 ADR：文件服务（基础）", "tag": "ADR", "bg": "新建平台文件服务。上传都经后端中转，同时算文件指纹并做恶意文件检测；文件内容不能改，数据库与存储两侧都禁止覆盖；修订另出新版本，签后件是签前件派生出来的新文件。谁能下载跟着单据权限走，下载链接默认 5 分钟。新建一个业务文件存储桶，不与归档桶混用，由你建，建前须运维评审。必须在通用审批先行上线前建成。\n代价与限制：检测服务不可用时，上传一律不放行（见单列项 N1）；含敏感个人信息的文件（如身份证扫描件）在敏感信息处理规则定下之前不接收；不提供浏览器直传、文件夹共享、在线编辑。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-文件服务-基础.md"}, {"id": "A3a", "t": "文件检测服务没就绪，先行上线不开放上传（起草推出，非你原话）", "tag": "单列确认", "bg": "每个上传的文件都要先过恶意文件检测。检测服务不可用时不放行，也不开始迁入历史附件。检测用哪家、要不要对外调用，另外请你定。也就是说，检测服务没选定、没接好，通用审批先行上线就开不了附件上传。", "o": [["agree", "同意：检测是硬前提", "检测选型须排在先行上线之前；检测服务出故障时上传会暂停，靠告警处理。"], ["disagree", "不同意：先行期可先不检测，就绪后补扫", "先行上线不受检测拖累，但先行期附件可能带恶意文件，且违反「缺失即失败告警」的规则；文件服务草案须重拟。"]], "ref": "", "f": "ADR-草案-文件服务-基础.md"}, {"id": "A3b", "t": "修改已定的模块总表（ADR-0051）：平台模块不再写死「10 个」", "tag": "修订已采纳 ADR", "bg": "已定的模块总表写着「平台 10 个模块不变」。这批要新增文件服务、签章服务、一次性链接三个平台模块，所以改成「平台模块按已采纳的 ADR 和模块登记表登记」，表里加上文件服务。由文件服务草案一处改写，另外两份写「相容」。几份同日采纳时的合入先后，由调度会话定。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟；新增平台模块的三份草案都要跟着改。"]], "ref": "", "f": "ADR-草案-文件服务-基础.md"}, {"id": "A4", "t": "批准 ADR：文件保存期限表与到期处置", "tag": "ADR", "bg": "按类别设默认年限，合同约定更长的从长（要靠合同里录入约定年限，没录入的按默认）。合同、客户确认单与收入证据、签署与用印文件、交付文件暂定「不少于 10 年」，这是经验值，法务确认前一律不作删除依据。含个人信息的文件到期删除或去标识；起算事件长期不发生的（如合同一直没履行完毕），到兜底期限进复核清单，不自动删。到期处置须两人，删除后不可恢复，只留指纹和处置记录。合同借阅、IT 工单与资产、员工活动的附件还没定年限，先不处置，另进收件箱请你补。到期删除功能不在先行期建，在最早到期日前 90 天建成。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-文件保存期.md"}, {"id": "A5", "t": "批准 ADR：Office 与 PDF 在线预览接入", "tag": "ADR", "bg": "交付物审核时可在系统里直接看 Word、Excel、PPT、PDF。系统向云上预览服务申请一次性、只读、短时效的查看凭据。列了 3 个候选和 10 条选型条件，不预选，选型结论和对外调用另交你定。第二批建造（交付物验收那一批）的审核页面之前建成。CAD 和 BIM 不做。\n代价与限制：文件内容要交给预览服务商处理，须法务确认处理关系和缓存删除条款；按次计费（已核的一家约 10 元 / 千次）；预览服务出故障时只能下载，不影响业务。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-在线预览.md"}, {"id": "A6", "t": "批准 ADR：AI 底座（大模型接入与使用边界）", "tag": "ADR", "bg": "只定边界，不定场景和厂商。每次送给模型的内容都先过一道外发检查，按数据登记逐列判断：受限、敏感、敏感个人信息一律不外发；一般个人信息要等法务答复、影响评估完成、你逐列批准后才能外发；姓名、证件号等直接标识任何情况下不外发。只用境内地域，境外模型默认禁用。AI 只给建议，须人工确认，不得据此自动过账、审批或对外发送；AI 不可用时业务照常办理。密钥放云上密钥管理服务；审计不存提示词和输出原文。\n代价与限制：首个场景、法务两问、影响评估三项齐备之后，才起第二份 ADR 定场景与厂商，在此之前不写 AI 代码。首个场景迟迟定不下来的话，AI 可能赶不上首次投产。", "o": [["approve", "批准", ""], ["reject", "不批准", "退回重拟，原因写在备注。"]], "ref": "", "f": "ADR-草案-AI底座.md"}, {"id": "A6a", "t": "自由文本、附件正文、员工输入的提问一律当作含个人信息（起草推出，非你原话）", "tag": "单列确认", "bg": "这类内容里常混着人名。草案一律按个人信息处理，除非这一列登记时写明已排除个人信息；姓名等直接标识任何情况下都不外发。结果是知识问答、文档摘要这类常见场景，几乎都要先等法务两问答复和个人信息影响评估，还要先识别、替换文中人名（替换方法未定，留给第二份 ADR 和安全评审）。", "o": [["agree", "同意从严", "AI 首个场景上线前要多走法务、评估、人名替换三步，时间更长。"], ["disagree", "不同意：按各列登记的标记判断，不一律从严", "上线更快，但人名混在正文里时可能被外发；AI 底座草案须重拟。"]], "ref": "", "f": "ADR-草案-AI底座.md"}, {"id": "X1", "t": "还有几处技术写法草案要求先经架构会话确认，目前没确认", "tag": "单列确认", "bg": "AI 的检查与审计放在哪个模块、怎样避免模块间循环依赖；签章记录怎样套用文件保存期限；模块总表的改写措辞与合入先后。这几处都是技术写法，不改变上面各题的业务内容。架构会话目前按你的决定暂停建模。", "o": [["a", "先批，架构会话恢复后补确认", "补确认结论与草案不同的，再回来问你；在此之前相关代码不落地。"], ["b", "先只为这几处恢复架构会话，判完再批", "批准要等它判完；其余建模照旧暂停。"]], "ref": "", "f": ""}];
const BASE="https://github.com/FORCITIS/forcitis-one-psa/blob/claude/one-coordinator-two-lanes/docs/modernization/architecture/research/platform-fit-2026-10-20/adr-drafts/";
let ans={},dbref=null,submitted=null;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  document.getElementById("qs").innerHTML=Q.map(q=>{const a=ans[q.id]||{};return `<section class="q" id="${q.id}"><h2>${q.id.replace("Q","")}. ${esc(q.t)}${q.tag?`<span class="tag">${esc(q.tag)}</span>`:""}</h2><p class="bg">${esc(q.bg)}</p><div class="opts">${q.o.map(([k,l,i])=>`<button type="button" class="opt" data-q="${q.id}" data-k="${k}" aria-pressed="${a.choice===k}"><b>${esc(k.length===1?"("+k+") ":"")}${esc(l)}</b><span>${esc(i)}</span></button>`).join("")}</div><textarea id="n-${q.id}" data-q="${q.id}" placeholder="备注或改为…（可空）">${esc(a.note||"")}</textarea><div class="ref">${q.f?`<a href="${BASE+encodeURI(q.f)}" target="_blank" rel="noopener">看草案全文：${esc(q.f)}</a>`:esc(q.ref)}</div></section>`}).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const q=b.dataset.q,k=b.dataset.k;const cur=ans[q]||{};save(q,{...cur,choice:cur.choice===k?null:k})});
  document.querySelectorAll("textarea").forEach(t=>t.onchange=()=>{const q=t.dataset.q;save(q,{...(ans[q]||{}),note:t.value})});
  status();
}
function status(){const n=Q.filter(q=>ans[q.id]?.choice||ans[q.id]?.note).length;document.getElementById("st").textContent=(submitted?`已提交（${submitted}）；之后的改动需再次提交。`:"")+`已选 ${n} / ${Q.length} 题`}
async function save(q,v){ans[q]=v;render();if(!dbref)return;try{await dbref.collection("answers").doc(q).set({...v,updatedAt:new Date().toISOString()})}catch(e){document.getElementById("st").textContent="保存失败："+(e.message||e.code||"")}}
function warn(){const w=[];const c=id=>ans[id]?.choice;if((c("A1a")==="disagree"||c("A1b")==="disagree")&&c("A1c")==="approve")w.push("A1a 或 A1b 选了不同意，A1c 须重拟，不宜选批准。");if(c("A2a")==="c"&&c("A2")==="approve")w.push("A2a 选了 (c)，A2 须按此重拟，不宜选批准。");for(const q of Q){if(c(q.id)==="reject"&&!(ans[q.id]?.note||"").trim())w.push(q.id+" 选了不批准，请在备注写原因。")}return w.length?`<div style="color:var(--warn)">${w.map(esc).join("<br>")}</div>`:""}
document.getElementById("submit").onclick=()=>{
  const chosen=Q.filter(q=>ans[q.id]?.choice||ans[q.id]?.note);
  const c=document.getElementById("confirm");c.hidden=false;
  c.innerHTML=`<div class="confirm"><b>确认提交</b>${warn()}<div>已答 ${chosen.length} 题，未答 ${Q.length-chosen.length} 题（视为未定）。</div><div>${chosen.map(q=>{const a=ans[q.id];const o=q.o.find(x=>x[0]===a.choice);return `${q.id}：${o?esc(o[1]):"（未选项）"}${a.note?"；备注："+esc(a.note):""}`}).join("<br>")}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ok" type="button">确认提交</button><button class="btn sec" id="cancel" type="button">再看看</button></div></div>`;
  c.scrollIntoView({behavior:"smooth"});
  document.getElementById("cancel").onclick=()=>{c.hidden=true};
  document.getElementById("ok").onclick=async()=>{
    if(!dbref){c.innerHTML=`<div class="confirm">这个视图连不上数据，提交没有保存。请登录后在 claude.ai 打开本页再提交。</div>`;return}
    const ts=new Date().toISOString();
    try{await dbref.collection("answers-submit").doc(ts.replace(/[:.]/g,"-")).set({at:ts,answers:Object.fromEntries(chosen.map(q=>[q.id,ans[q.id]]))});submitted=ts.slice(0,16).replace("T"," ");c.innerHTML=`<div class="confirm">已提交。调度会话会读取你的答复。</div>`;status()}catch(e){c.innerHTML=`<div class="confirm">提交失败：${esc(e.message||e.code||"")}。请稍后再点一次提交。</div>`}
  };
};
document.getElementById("allok").onclick=()=>{for(const q of Q){const k=q.o[0][0];if(!ans[q.id]?.choice)save(q.id,{...(ans[q.id]||{}),choice:k})};setTimeout(()=>{document.getElementById("st").textContent="已给未选的题填入第一项，只是草稿，还没提交；请逐题核对后点「我选好了，提交」"},300)};
render();
(async()=>{dbref=await window.claude?.use?.("db");if(!dbref){document.getElementById("st").textContent="未连上数据：可以浏览，选择不会保存";return}
  dbref.collection("answers").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});ans=m;render()},()=>{});
})();
</script>
