<title>补充理论框架</title>
<style>
/* Layout: phone-width column of candidate cards; each card says which step of the method it strengthens. Recommended ones are pre-ticked. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#152033; --muted:#5a6678; --line:#d9dfe7;
  --pick:#1f5fbf; --pick-soft:#e6eefb; --rec:#1d7a4e; --rec-soft:#e3f3ea; --warn:#a24a1d; --step:#8a5a12;
  --f:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --card:#18202b; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3544;
  --pick:#8db4f2; --pick-soft:#1e2c42; --rec:#7fd0a6; --rec-soft:#18322a; --warn:#f0a07a; --step:#e2b56a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --card:#18202b; --ink:#e7ecf2; --muted:#9aa6b6; --line:#2a3544;
  --pick:#8db4f2; --pick-soft:#1e2c42; --rec:#7fd0a6; --rec-soft:#18322a; --warn:#f0a07a; --step:#e2b56a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:12px}
h1{font-size:20px;margin:0;text-wrap:balance} h2{font-size:15px;margin:4px 0 0;color:var(--muted);font-weight:600}
p{margin:0} .lede,.small{color:var(--muted);font-size:13.5px}
.status{font-size:12.5px;color:var(--muted)} .status.off{color:var(--warn)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--pick);width:18px;height:18px}
.opt b{font-weight:600}
.opt .why{grid-column:2;font-size:13.5px}
.opt .step{grid-column:2;font-size:12.5px;color:var(--step)}
.opt.rec b::after{content:"推荐";margin-left:8px;font-size:11.5px;font-weight:600;color:var(--rec);background:var(--rec-soft);border-radius:999px;padding:1px 8px;vertical-align:1px}
.opt:has(input:checked){border-color:var(--pick);background:var(--pick-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--pick);outline-offset:2px}
button{font:inherit;font-weight:600;border:1px solid var(--rec);background:var(--rec-soft);color:var(--rec);border-radius:10px;padding:10px 14px;cursor:pointer;justify-self:start}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}
.done{font-size:13px;color:var(--rec)}
</style>

<main>
  <h1>还需要哪些理论框架？</h1>
  <p class="lede">现有 7 个框架已覆盖从愿景到代码的主线。下面是能补强某一步的候选，推荐的已勾上；勾选后点「保存」，我直接读取，选中的会锁定版本写进知识框架。</p>
  <div class="status" id="status" aria-live="polite">正在连接…</div>

  <h2>建议补上（各补一处硬依据）</h2>
  <label class="opt rec"><input type="checkbox" value="iso42010" id="f1"><b>ISO/IEC/IEEE 42010 架构描述</b><span class="why">规定「视角—视图—一致性」：4 张图和各份 SSOT 是同一架构的不同视图，用它校验彼此不打架。</span><span class="step">补强：第 7 步治理、六条接缝的一致性校验</span></label>
  <label class="opt rec"><input type="checkbox" value="wardley" id="f2"><b>Wardley 地图（价值链与演化）</b><span class="why">按「越接近用户、越新颖越该自建」给能力定位，给核心 / 支撑 / 通用分类提供依据，不靠感觉。</span><span class="step">补强：第 2 步子域分类</span></label>
  <label class="opt rec"><input type="checkbox" value="rea" id="f3"><b>REA 会计本体（资源—事件—参与者）</b><span class="why">业财一体的数据本体：把业务事件直接建模为会计事实，连接领域事件与总账过账。</span><span class="step">补强：第 3、4、5 步（权责发生制主干，ADR-0016）</span></label>

  <h2>可选（以后需要再加）</h2>
  <label class="opt"><input type="checkbox" value="c4" id="f4"><b>C4 模型</b><span class="why">代码层面的图示约定（系统、容器、组件），让图④更标准。</span><span class="step">补强：第 7 步的代码视图</span></label>
  <label class="opt"><input type="checkbox" value="team-topologies" id="f5"><b>Team Topologies 团队拓扑</b><span class="why">团队（这里是各个会话）边界与 BC 边界对齐，减少跨边界协作。</span><span class="step">补强：会话分工与 BC 的对应</span></label>
  <label class="opt"><input type="checkbox" value="bmc" id="f6"><b>商业模式画布</b><span class="why">把愿景、价值主张、收入与成本结构写清楚，作为目标与 KPI 的来源。</span><span class="step">补强：第 0 步愿景</span></label>

  <h2>不建议现在加</h2>
  <p class="small">arc42 文档模板、COBIT / ITIL 治理框架、Data Mesh：与现有规则重叠，或要等系统更大以后才有收益。</p>

  <button type="button" id="save">保存选择</button>
  <label for="note" class="small">备注（可选）</label>
  <textarea id="note" placeholder="例如：还想了解……"></textarea>
  <div class="done" id="done"></div>
</main>

<script>
const REC = ["iso42010", "wardley", "rea"];
const $ = s => document.querySelector(s);
let db = null, me = null;
const boxes = [...document.querySelectorAll('input[type=checkbox]')];
boxes.forEach(b => { b.checked = REC.includes(b.value); });
function setStatus(t, off) { const s = $("#status"); s.textContent = t; s.classList.toggle("off", !!off); }
async function saveAll() {
  const selected = boxes.filter(b => b.checked).map(b => b.value);
  if (!db) { setStatus("存储不可用：请在 claude.ai 登录后打开，选择才会保存", true); return; }
  try {
    await db.collection("decisions").doc("frameworks").set({selected, note: $("#note").value, by: me, at: new Date().toISOString()});
    setStatus("已保存"); $("#done").textContent = `已保存：选了 ${selected.length} 项。`;
  } catch (e) { setStatus("保存失败：" + (e && e.message || "请稍后再试"), true); }
}
$("#save").addEventListener("click", saveAll);
(async () => {
  try { const u = await window.claude?.use?.("user"); me = u ? await u.id() : null; } catch (e) {}
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { setStatus("存储不可用：请在 claude.ai 登录后打开，选择才会保存", true); return; }
  setStatus("已连接，勾选后点「保存选择」");
  try {   // 只读一次、不订阅
    const d = (await db.collection("decisions").doc("frameworks").get()).data();
    if (d) { boxes.forEach(b => { b.checked = (d.selected || []).includes(b.value); }); $("#note").value = d.note || ""; $("#done").textContent = "已保存过；可修改后再保存。"; }
  } catch (e) {}
})();
</script>
