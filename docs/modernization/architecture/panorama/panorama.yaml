  vs:
    VS-01:
      name: 完成服务方选定
      category: business
      value: 客户得到可信的方案、报价与承诺，以合理代价选定能胜任的服务方。
      triggers:
      - SH-C1
      - SH-C2
      - SH-C3
      - SH-C4
      - SH-C5
      - SH-P3
      - SH-P1c
      receivers:
      - SH-C1
      - SH-C2
      - SH-C3
      - SH-C4
      - SH-C5
    VS-02:
      name: 获得交付成果
      category: business
      value: 客户按约获得可审查、可报审、可施工的专业成果，建成效果与安全达到要求。
      triggers:
      - SH-C1
      - SH-C2
      - SH-C3
      - SH-C4
      receivers:
      - SH-C1
      - SH-C2
      - SH-C3
      - SH-C4
      - SH-S1
      - SH-S2
    VS-03:
      name: 获得风险结论
      category: business
      value: 委托方得到独立、可追溯的风险信息与合规结论，并能跟踪问题整改到闭合。
      triggers:
      - SH-C5
      - SH-C3
      - SH-P3
      receivers:
      - SH-C5
      - SH-C3
      - SH-S1
      - SH-S2
    VS-04:
      name: 完成服务价款约定与支付
      category: business
      value: 客户的权利义务明确，取得合规发票，按约付款，价款可核对、最终确认。
      triggers:
      - SH-C1
      - SH-C2
      - SH-C3
      - SH-C4
      - SH-C5
      receivers:
      - SH-C1
      - SH-C2
      - SH-C3
      - SH-C4
      - SH-C5
    VS-05:
      name: 获得外部资源
      category: support
      value: 需求方及时获得合格、按约履约的外部能力与产品。
      triggers:
      - SH-E2
      - SH-M1
      receivers:
      - SH-E2
      - SH-M1
    VS-06:
      name: 完成企业合规事项
      category: support
      value: 监管机构按期收到准确的申报与税款，确认企业持续具备经营与承接资格。
      triggers:
      - SH-R2
      receivers:
      - SH-R2
    VS-07:
      name: 完成人员任用
      category: support
      value: 用人经理及时得到合格人员；候选人得到明确的录用结果并顺利入职。
      triggers:
      - SH-E1
      - SH-H1
      receivers:
      - SH-E1
      - SH-H1
    VS-08:
      name: 完成垫付费用报销
      category: support
      value: 员工在支出前取得所需额度或出差批准，获得借支支持，公务垫付费用及时足额得到补偿。
      triggers:
      - SH-E1
      - SH-E2
      - SH-E3
      - SH-E4
      - SH-E5
      - SH-E6
      - SH-E7
      receivers:
      - SH-E1
      - SH-E2
      - SH-E3
      - SH-E4
      - SH-E5
      - SH-E6
      - SH-E7
    VS-09:
      name: 完成经营目标
      category: management
      value: 管理层有明确可追踪的目标，偏差能被解释并转化为行动。
      triggers:
      - SH-M1
      receivers:
      - SH-M1
      - SH-O1
    VS-10:
      name: 获得期间报告
      category: support
      value: 管理层与股东得到按期、可勾稽、关账后不变的权责口径报表与经营报告。
      triggers:
      - SH-M1
      receivers:
      - SH-M1
      - SH-O1
    VS-11:
      name: 获得复用知识
      category: support
      value: 员工能找到经审定的做法与案例并在新项目中复用，交付质量与效率提升。
      triggers:
      - SH-E4
      - SH-E2
      receivers:
      - SH-E3
      - SH-E2
      - SH-E5
      - SH-E4
    VS-12:
      name: 获得投资回报
      category: management
      value: 股东和合伙人的出资被准确记录，并按经营结果取得回报。
      triggers:
      - SH-O1
      receivers:
      - SH-O1
    VS-13:
      name: 获得报酬
      category: support
      value: 员工按时足额获得报酬与法定保障，离职时依法结清。
      triggers:
      - SH-E1
      - SH-E2
      - SH-E3
