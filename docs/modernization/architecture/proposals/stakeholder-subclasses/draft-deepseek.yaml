summary_issues:
- 层级口径：本卡严格按 BIZBOK v11 §2.8（印刷页 269–275）的三层——类别 → 信息概念的类型（子类）→ 更细的角色（宜留运营模型）。因此客户决策链 5 角色、员工下 7 个具体干系人都用 roles 键，不升为子类；这也解释了为什么它们与子类是正交或兼任关系而非互斥划分。
- 有意偏离需记录：BIZBOK §2.8 示例把监管方（Regulator）列在合作伙伴类别、把审计员（Auditor）列在人力资源类别（内外两者）；本系统已定 6 类且监管机构单列、外部审计事务所归合作伙伴·供应商，两项偏离理由分别在 SH-R1、SH-P4 的 boundary 与 evidence 内写明。
- 「合作伙伴」类别下 6 个子类不同构：交付伙伴跨 OBJ-02 的三个取值（供应商·分包方/外包方、联合体伙伴、海外持牌伙伴），供应商是一个角色，审计机构与出租方是供应商的第二层细分，金融机构是独立业务角色。建议在信息图上用「角色 → 细分」两级表示，避免子类与角色取值长期错位。
- OBJ-02 的供应商取值（分包方、外包方、采购供应商、劳务派遣单位、出租方、审计机构）中前两项与「交付伙伴」子类判别标准重叠；这是本卡发现的最实质的结构冲突，需在 one-architecture 层裁定是上提角色还是下压子类。
- 两个新补子类的判定结论：审计机构=供应商下的再细分（角色仍为「供应商」，STKH-03）；出租方=供应商下的再细分（角色「出租方」，STKH-05）；金融机构=合作伙伴下的新子类（独立业务角色「金融机构」，STKH-04）。判定依据统一为「是否采购型对价 + 是否走供方准入与付款路径 + 是否进入对我方客户的交付链」。
- 监管机构两个子类落在不同对象层：工程审批 = OBJ-01 项目内身份「主管部门」（关系上的属性，随项目变化）；企业监管 = OBJ-02 业务角色「主管机关」（不设准入状态，STKH-08）。同一机关（如住建委）可因事项不同分别落入两者，不构成矛盾，但须在信息图注明两层。
- 属性缺口：BASE.yaml 只有「角色」「客户类型」「决策链角色」「用户角色」「股东类型」五个相关属性，缺「供应商细分」（OBJ-02 已枚举 6 个细分取值但无属性承载）、OBJ-03 决策链角色缺多值、OBJ-56 用户角色缺多值。建议补属性并定名，否则子类无法落到取值上。
- 编号缺口：员工层、股东三个取值都没有独立 SH 编号（员工只有 SH-E1–SH-E7，股东只有 SH-O1）；建议补员工层编号并拆 SH-O1，使子类、编号、属性取值可一一核对。
- 重复登记：SH-P5（金融机构，含资金监管主办银行）与 SH-X7（阶段参与者，项目内身份「资金监管银行」）是同一单位的两层，不应并列；SH-X5（TIS）与 SH-P3 渠道伙伴 members（保险公司和 TIS）同理。建议统一按 OBJECTS.md §2.2 的两层处理。
- involvement 疑点（只记录，未改事实）：SH-C6e 使用者参与 VS-04.2 确认收入、SH-C6d 付款方在 VS-04.4 回收款项中 receive 为空、SH-P3 渠道伙伴 trigger 含 VS-03、SH-R1 工程审批参与 VS-04.3 开具发票，四处疑为按价值流整体挂靠所致，建议在价值流阶段参与者清单中一并复核。
- 社会公众（SH-S1、SH-S2）不进系统（DECR-02），在对象层无承载，两子类 receive 完全相同；建议在价值流层以注记区分「单一建筑的使用者」与「城市尺度的公众」，并在信息图上标注这是决定而非遗漏。
