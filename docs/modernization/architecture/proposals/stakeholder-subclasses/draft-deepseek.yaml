categories:
- category: 客户
  type: 外部
  subclasses:
  - id:
    - SH-C1
    name: 开发商
    definition: 以开发销售或出租为目的建设住宅、商业等项目，并委托我方提供幕墙、照明等专项设计咨询的开发企业（含海外业主和开发商）。
    criterion: 与我方签订的是项目合同；其在项目上的身份是建设单位或开发主体；建成后用于销售或出租而非自用。
    boundary: 与「自用业主」互斥，判别只看建成后用途（销售/出租 vs 自用），不看单位性质；与「发包方」互斥，发包方是把专项分包给我方的设计院或 EPC 总包，本身不是建设单位。同一往来单位可同时具客户角色与其他类别角色（OBJ-02：1 往来单位 → 0..N 角色）；但同一客户角色内「客户类型」按 OBJ-02 只取一值（一个往来单位一个客户类型，变更留痕），兼属时以「本项目签约时其在项目上的身份」为准。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 开发商
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      participate: []
    evidence:
    - BIZBOK v11 §2.8（印刷页 269–275）：类别对应信息图与能力图的一级概念，具体干系人对应该信息概念的类型，说明由能力定义推导或细化
    - UAE#往来单位身份：Firm 及 Client、Vendor、Prospect 三种身份（SP 6；AD 67）
    - VP26#O01 交易对方与沟通人员（依据 E02、E03）：企业与个人主体可共用一个身份，按角色区别
    - FIDW#合同范围（附件 1；1.1.23、3.1.1–3.1.2、3.2.1，印刷页 d；3／9–10）：客户与咨询方以协议界定服务范围与接口
    issues: []
  - id:
    - SH-C2
    name: 自用业主
    definition: 为自用建设项目委托我方的企业、政府和公共业主，含代建单位与平台公司。
    criterion: 与我方签订项目合同；项目建成后由该单位自用或自营（非销售、非出租）；或是受最终自用单位委托实施代建的代建、平台公司。
    boundary: 与「开发商」互斥按建成后用途；代建、平台公司不另立子类而归此（BASE members 已含），最终使用单位则记为联系人层的决策链·使用者。与「既有建筑业主」互斥按建筑是否已建成在用：新建项目归此，在用建筑的检查、评估、改造归既有建筑业主。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 自用业主
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      participate: []
    evidence:
    - BIZBOK v11 §2.8（印刷页 269–275）：具体干系人取信息概念的类型，说明由能力定义推导或细化
    - FIDW#客户提供条件（附件 2；2.5.1、2.6.1–2.6.3、2.8.1–2.8.2，印刷页 e；9／15；32）：客户承担约定投入，第三方接口默认归客户
    issues:
    - 代建、平台公司与最终自用单位是两个主体，BASE 只登记签约方为客户；建议明确最终自用单位是否只落到 OBJ-03 联系人，不进 OBJ-02 客户角色。
  - id:
    - SH-C3
    name: 既有建筑业主
    definition: 为在用建筑委托我方做检查、评估或改造的产权人和管理人。
    criterion: 委托事项指向已建成并投入使用的建筑（VS-03 获得风险结论为主）；其身份是产权人或管理人；物业代业主委托时归此。
    boundary: 与「自用业主」「开发商」互斥按建筑是否已建成在用。产权人与管理人不一致时以「与我方签约的相对方」定客户，另一方落项目内身份或联系人；物业服务企业未代业主委托时不属客户，只是阶段参与者（SH-X8）。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 既有建筑业主
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      participate:
      - VS-03.1 编制检查计划
      - VS-03.3 发布不符合项
      - VS-03.4 跟进整改
      - VS-03.5 登记报告认可
    evidence:
    - BIZBOK v11 §2.8（印刷页 269–275）：类别—具体干系人—说明三列的分层口径
    - GFQ#咨询交付验收（工程咨询本第八条）：交付形式、数量、时间、方法与标准须约定，合格后出具成果完成证明；检查类服务以报告认可为交付落点
    issues:
    - 本子类是唯一在 VS-03 上有触发、参与的事实（SH-C1/C2/C4 只在 VS-01/02/04），建议在价值流阶段参与者清单中把它与「资本方」并列为检查类服务的客户侧参与者。
  - id:
    - SH-C4
    name: 发包方
    definition: 把幕墙、照明等专项分给我方的建筑设计院或 EPC 总包。
    criterion: 与我方签订的是分包合同（我方为分包人，OBJ-05 记「我方在承包链中的位置」）；其在项目上是承包链上游的设计院或总包，不是建设单位。
    boundary: 与「开发商」「自用业主」互斥：建设单位本身是另一往来单位的客户角色，设计院、总包作为发包方是独立往来单位。同一设计院不作发包方时只是阶段参与者（SH-X1 主体建筑设计院），按「是否与我方签约」区分。与「合作伙伴·交付伙伴」方向相反：我方向其交付（客户），而非受其交付。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 发包方
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      participate: []
    evidence:
    - BIZBOK v11 §2.8（印刷页 269–275）：同一类别下可按信息概念类型再分具体干系人
    - GFD#合同文件顺序（房建本通用 1.5，印刷页 12）：组成文件与优先顺序、相对方须可回溯
    - GFQ#全咨转委托（全咨本通用 3.4–3.5，印刷页 14）：委托其他咨询单位、联合体的责任归属
    issues:
    - 同一 EPC 总包在一个项目上是发包方（客户），在另一个项目上可能是合作伙伴·交付伙伴（联合体或分包相对方）；现有 OBJ-02「一单位多角色」可承载，但「客户类型」单值会随项目变化，须依赖变更留痕而非覆盖。
  - id:
    - SH-C5
    name: 资本方
    definition: 为投资、融资或承保委托我方做技术尽调或 IDI 检查的投资方、金融机构与保险公司。
    criterion: 委托目的是为其投资、融资或承保决策取得技术结论（VS-01 委托 + VS-03 获得风险结论）；其不是项目建设单位。
    boundary: 与「合作伙伴·金融机构」互斥按协议类型：账户、授信、保函协议下是合作伙伴·金融机构，技术尽调服务合同下是客户·资本方；同一银行可同时具两个角色（跨类别多角色允许）。与「渠道伙伴」互斥按是否订约：只转介绍、不订服务合同的是渠道伙伴（保险公司、TIS、物业、设计院），订约委托检查的才是资本方。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 资本方
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      participate:
      - VS-03.1 编制检查计划
      - VS-03.3 发布不符合项
      - VS-03.5 登记报告认可
    evidence:
    - BIZBOK v11 §2.8（印刷页 269–275）：具体干系人按信息概念类型区分，不按客户名称区分
    - FIDW#客户提供条件（附件 2，印刷页 e；9／15；32）：客户可由第三方接口承压，接口责任须显式约定
    issues:
    - BASE 的 members 把「投资方和金融机构（技术尽调）」与「保险公司（IDI 委托）」并入一个子类；两者在 VS-03 的参与相同，暂不需再分，但保险公司同时出现在渠道伙伴 members（TIS）与阶段参与者 SH-X5，须在信息图上避免同一单位被登记两处。
  roles:
  - id:
    - SH-C6a
    name: 发起人
    definition: 客户内部提出需求、推动立项的人。
    criterion: 在商机与项目上以需求提出方身份出现（VS-01.1 采集线索、VS-01.2 赢得委托、VS-02.0 开始项目）；常为客户的项目或设计管理负责人。
    boundary: 5 个决策链角色是客户内部的人的角色，与 5 个客户子类正交：任一子类的客户内部都可能有这 5 个角色，客户子类判别该单位是什么客户，决策链角色判别该人做什么。角色之间不互斥：同一联系人可兼任发起人与使用者，小微客户中老板常兼任发起人、决策人、经济买方、付款方；兼属时以「本笔业务中该人的实际行为」为准，且不改变往来单位的客户类型。
    carrier:
      obj: OBJ-03
      attr: 决策链角色
      value: 发起人
    involvement:
      trigger: []
      receive: []
      participate:
      - VS-01.1 采集线索
      - VS-01.2 赢得委托
      - VS-02.0 开始项目
      - VS-02.1 确认概念
      - VS-02.2 确认方案
      - VS-02.3 完成初步设计
      - VS-02.4 完成深化设计
      - VS-02.5 完成招标采购配合
      - VS-02.6 完成施工配合
      - VS-02.7 完成收尾
      - VS-03.5 登记报告认可
      - VS-04.6 完成合同履行
      - VS-04.3 开具发票
      - VS-04.5 确认最终价款
    evidence:
    - UAE#联系人与项目联系：Contact 及项目联系人关系（SP 14；AD 67）
    - VP26#O01 交易对方与沟通人员（依据 E02、E03）
    - FIDW#变更（5.1.1–5.1.4，印刷页 14）：客户在服务完成前发起变更、可要求咨询方提交提案，变更由客户侧推动
    issues:
    - OBJ-03 的「决策链角色」为单值属性，兼任时无法表达；建议改为多值，或把角色挂在「联系人—项目/商机」关系上（同一人在不同项目角色不同）。
  - id:
    - SH-C6b
    name: 决策人
    definition: 客户内部对选定服务方拍板的人。
    criterion: 在 VS-01.2 赢得委托、VS-04.1 签署合同上代表客户作出决定或签署；多为产品、工程负责人或集团决策层。
    boundary: 与「经济买方」的边界是「定不定这家服务方」vs「谈不谈价格与条款」；与「付款方」的边界是「决策与签署」vs「办理付款」。三者可由同一人兼任，以本笔业务中是否行使该项职权判别，不靠职级推断。
    carrier:
      obj: OBJ-03
      attr: 决策链角色
      value: 决策人
    involvement:
      trigger: []
      receive: []
      participate:
      - VS-01.2 赢得委托
      - VS-02.1 确认概念
      - VS-02.2 确认方案
      - VS-02.7 完成收尾
      - VS-04.1 签署合同
      - VS-04.6 完成合同履行
    evidence:
    - FIDW#变更（5.1.1–5.1.4，印刷页 14）：变更须客户书面接受或发出通知，客户侧存在有权作出意思表示的人
    - AIA15#服务协议承诺（17.1，开头；Legal Prerequisites，印刷页 1040–1041）：协议连接双方目标、服务、时间与支付，未谈妥内容不自动成为承诺
    issues: []
  - id:
    - SH-C6c
    name: 经济买方
    definition: 客户内部负责招采与成本、谈价格的人。
    criterion: 在 VS-01.2、VS-02.5、VS-04.1、VS-04.5 上参与价格、招标采购与最终价款的商定；多为招采、成本岗。
    boundary: 与「决策人」按是否拍板 vs 是否谈价；与「付款方」按是否定金额 vs 是否办付款。经济买方与付款方常分属两个部门，因此不能合并为一个「有钱的人」。
    carrier:
      obj: OBJ-03
      attr: 决策链角色
      value: 经济买方
    involvement:
      trigger: []
      receive: []
      participate:
      - VS-01.2 赢得委托
      - VS-02.5 完成招标采购配合
      - VS-02.7 完成收尾
      - VS-04.1 签署合同
      - VS-04.6 完成合同履行
      - VS-04.5 确认最终价款
    evidence:
    - FIDW#变更价款与先行指令（5.2.1–5.2.4，印刷页 14–15）：双方须书面约定价值或计算方法，并书面确认
    - GFD#阶段费用与付款（两本附件 6，印刷页 43–44）：阶段服务费用与多次付款分开列示
    issues: []
  - id:
    - SH-C6d
    name: 付款方
    definition: 客户内部办理付款的财务人员。
    criterion: 在 VS-04.3 开具发票、VS-04.4 回收款项上出现；多为客户财务岗。
    boundary: 与「经济买方」按「办付款 vs 定价格」；与「决策人」按「执行支付 vs 作出决定」。付款方可对部分款项提异议但不改变其角色，异议是行为事实而非另一角色。
    carrier:
      obj: OBJ-03
      attr: 决策链角色
      value: 付款方
    involvement:
      trigger: []
      receive: []
      participate:
      - VS-04.3 开具发票
      - VS-04.4 回收款项
    evidence:
    - FIDW#争议账单（7.5.1，印刷页 19–20）：客户在开单后 7 天内说明拒付理由并照付余款，付款侧存在独立的异议与支付行为
    - GFQ#全咨争议款项（全咨本通用 6.3，印刷页 22）：书面异议须说明数额理由，无争议部分按期支付
    issues:
    - SH-C6d 的 receive 为空，但付款方在 VS-04.4 回收款项中实际是付款行为的实施方；本卡不改 involvement 事实，仅记录该项待 one-architecture 复核（疑为「触」而非「参」）。
  - id:
    - SH-C6e
    name: 使用者
    definition: 客户内部使用我方成果的设计、工程管理人员。
    criterion: 在 VS-02.0–VS-02.6 上接收并确认、使用我方成果；多为客户的设计管理、工程管理人员。
    boundary: 与「社会公众·最终用户」互斥：使用者是客户内部人员，与我方成果有工作往来；最终用户是不进系统的建筑使用者。与「发起人」可兼任但不必然相同，以是否在阶段上使用并确认成果判别。
    carrier:
      obj: OBJ-03
      attr: 决策链角色
      value: 使用者
    involvement:
      trigger: []
      receive: []
      participate:
      - VS-02.0 开始项目
      - VS-02.1 确认概念
      - VS-02.2 确认方案
      - VS-02.3 完成初步设计
      - VS-02.4 完成深化设计
      - VS-02.6 完成施工配合
      - VS-04.2 确认收入
    evidence:
    - GFD#交付签收（房建本通用 7.1–7.3，印刷页 20）：记录图纸名称、形式、份数、交付与签收日期及双方签名
    - GFD#成果审查（房建本通用 8.1–8.7，印刷页 20–21）：有异议重新报审，期限重起
    issues:
    - SH-C6e 参与 VS-04.2 确认收入，但确认收入是我方内部会计事实，客户侧人员不可能是参与者；BASE 此处疑为按价值流阶段整体挂靠所致，建议复核（不改事实，只记录）。
- category: 合作伙伴
  type: 外部
  subclasses:
  - id:
    - SH-P1
    - SH-P1c
    name: 交付伙伴
    definition: 受我方委托承担部分设计、顾问工作，或以海外持牌资格、联合体身份与我方共同履约的单位（外协设计和顾问、海外持牌伙伴、联合体伙伴）。
    criterion: 与我方签的是分包合同（专业分包、人力外包）或联合体协议；其工作进入我方对客户的交付成果；或与我方作为同一客户合同的共同相对方。
    boundary: 与「供应商」互斥按协议类型与责任方向：交付伙伴承担的是我方对客户的部分交付责任（分包合同、联合体协议，VS-05.1–VS-05.6），供应商只提供产品、材料、软件、数据或保险（采购合同）。同一单位可同时具两个角色（如既是分包方又供材料），兼属时以「该笔业务签的是哪类协议」为准，不对单位整体归类。联合体伙伴与分包方的边界：联合体伙伴与客户是同一合同的共同相对方（VS-01.2
      赢得委托），分包方在我方与客户合同之下；海外持牌伙伴以持牌资格配合交付，属本子类的一种，不另立子类。
    carrier:
      obj: OBJ-02
      attr: 角色
      value: 供应商（细分：分包方、外包方）、联合体伙伴、海外持牌伙伴
    involvement:
      trigger:
      - VS-01 完成服务方选定
      receive: []
      participate:
      - VS-02.2 确认方案
      - VS-02.3 完成初步设计
      - VS-02.4 完成深化设计
