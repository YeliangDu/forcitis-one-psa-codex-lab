    - SH-P1 与 SH-P1c 合并为一个子类后 involvement 不同（SH-P1 的 trigger 为空，SH-P1c 有 VS-01），本卡按并集列示；建议保留两条干系人记录，子类层只作汇总口径。
  - id:
