    criterion: 授权文件、选定服务方的决议或实际审批记录证明其具有相应决定权。
    boundary: 与五种客户子类正交，可兼任发起人、经济买方或使用者；以具体事项的授权范围为准，职务高低、联系人标签及参与会议本身不证明有决定权。
