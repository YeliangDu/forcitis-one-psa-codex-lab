categories:
- category: 客户
  subclasses:
  - id:
    - SH-C1
    name: 开发商
    definition: 为其开发建设并销售、出租或经营的项目，与我方已有、拟有或曾有设计咨询服务约定的开发企业。
    criterion: 商机、委托文件或协议显示，对方以项目开发企业身份委托我方，服务对象是其开发项目。
    boundary: 业务特征可与自用业主、既有建筑业主重叠，但 STKH-07 已定同一往来单位同一时点只有一个客户类型；以当前有效客户类型为准，项目具体身份另记，冲突不得自行按项目切换主档类型。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 开发商
    involvement: &id001
      trigger:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-04 完成服务价款约定与支付
      participate: []
    evidence:
    - BIZBOK v11 §2.8，印刷页269–275，按 CARD.md 已核补充；支持类别、具体干系人与定义细化的方法，不直接证明本企业的具体子类。
    - Unanet AE，UAE#往来单位身份，SP第6页、AD第67页，支持客户身份概念；Vantagepoint，VP26#交易对方与沟通人员，E02、E03，页码无；两者笔记均未证明本卡五种客户类型。
    - 开发商这一具体细分的合同或产品直接依据：无。
    issues:
    - BASE.yaml 的 relation 包含“参”，但 involvement.participate 为空；保留原映射，需核对阶段参与是否遗漏。
    - 开发与自用、既有建筑服务同时存在时，客户类型的归类优先规则尚未提供。
  - id:
    - SH-C2
    name: 自用业主
    definition: 为自身使用或承担公共使用职责的建设项目，与我方已有、拟有或曾有服务约定的企业、政府或公共业主。
    criterion: 项目用途及委托材料显示服务于对方自身经营、办公、生产或公共使用需求；代建、平台公司还须核对其委托授权及所代表的业主。
    boundary: 与开发商、既有建筑业主的业务特征可能重叠，主档仍按 STKH-07 五选一；政府机关作为本项目客户时，不因机关性质就归为企业监管。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 自用业主
    involvement: *id001
    evidence:
    - BIZBOK v11 §2.8，印刷页269–275，按 CARD.md 已核补充；支持类别、具体干系人与定义细化的方法，不直接证明本企业的具体子类。
    - Unanet AE，UAE#往来单位身份，SP第6页、AD第67页，支持客户身份概念；Vantagepoint，VP26#交易对方与沟通人员，E02、E03，页码无；两者笔记均未证明本卡五种客户类型。
    - 自用业主及代建、平台公司这一具体细分的合同或产品直接依据：无。
    issues:
    - BASE.yaml 将代建、平台公司列入本类，但这些单位的组织名称不能证明项目自用，应核对实际用途与授权。
    - BASE.yaml 的 relation 包含“参”，但阶段参与清单为空；未补写。
  - id:
    - SH-C3
    name: 既有建筑业主
    definition: 为在用建筑的检查、评估或改造，与我方已有、拟有或曾有服务约定的产权人或获授权管理人。
    criterion: 委托范围针对既有建筑，且产权材料或管理授权证明对方有权委托；物业企业代业主委托时须有相应授权。
    boundary: 开发商或自用业主也可能委托既有建筑服务，但主档客户类型仍为单值；仅配合现场工作的物业属于 SH-X8 的项目参与身份，不凭现场配合归入本类。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 既有建筑业主
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-02 获得交付成果
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      participate:
      - VS-03.1 编制检查计划
      - VS-03.3 发布不符合项
      - VS-03.4 跟进整改
      - VS-03.5 登记报告认可
    evidence:
    - BIZBOK v11 §2.8，印刷页269–275，按 CARD.md 已核补充；支持类别、具体干系人与定义细化的方法，不直接证明本企业的具体子类。
    - Unanet AE，UAE#往来单位身份，SP第6页、AD第67页，支持客户身份概念；Vantagepoint，VP26#交易对方与沟通人员，E02、E03，页码无；两者笔记均未证明本卡五种客户类型。
    - AIA手册第十五版，AIA15#建成后服务，印刷页954、PDF页974，支持建成后评估、维护与改造服务；不直接规定本企业客户分类。
    issues:
    - 产权人、业委会、产权单位、管理人及代理物业的授权性质须分别留证，不能因都归本类而视为相同签约主体。
    - 与其他客户类型重叠时的单值归类规则待明确。
  - id:
    - SH-C4
    name: 发包方
    definition: 在承包链中将幕墙、照明等专项服务委托给我方的设计院或工程总承包单位。
    criterion: 协议、任务订单或明确的拟委托材料显示，对方将其承接范围内的专项服务交由我方承担。
    boundary: 本类是上游专项委托方，不泛指所有合同中的发包人；同一设计院可在其他交易中成为我方供方或联合体伙伴，以各协议中的委托方向判断；只协同设计时保留 SH-X1 项目身份。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 发包方
    involvement: *id001
    evidence:
    - BIZBOK v11 §2.8，印刷页269–275，按 CARD.md 已核补充；支持类别、具体干系人与定义细化的方法，不直接证明本企业的具体子类。
    - Unanet AE，UAE#往来单位身份，SP第6页、AD第67页，支持客户身份概念；Vantagepoint，VP26#交易对方与沟通人员，E02、E03，页码无；两者笔记均未证明本卡五种客户类型。
    - GF设计合同，GFD#设计分包责任，房建本印刷及PDF页15、专业本15–16；支持承包链中部分设计服务的委托关系，不直接规定本卡“发包方”客户类型。
    - FIDIC白皮书2017，FIDW#转委托责任，1.6.2–1.6.4，印刷页5、PDF页28；支持转委托与对客责任的区分。
    issues:
    - 应防止把协议身份“发包人”直接转换成客户类型“发包方”。
    - BASE.yaml 的 relation 包含“参”，但阶段参与清单为空；未补写。
  - id:
    - SH-C5
    name: 资本方
    definition: 为投资、融资或承保判断，与我方已有、拟有或曾有技术尽调或 IDI 检查服务约定的机构。
    criterion: 委托目的及服务范围明确指向投资、融资或承保风险判断，且对方是该项服务的实际或拟委托客户。
    boundary: 金融机构委托我方技术尽调时可具有客户身份；为我方开户、开保函或监管资金时属于合作伙伴中的金融机构；向我方法人出资时另以股东身份判断，各关系可并存，客户类型仍按 STKH-07 单值管理。
    carrier:
      obj: OBJ-02
      attr: 客户类型
      value: 资本方
    involvement:
      trigger:
      - VS-01 完成服务方选定
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      receive:
      - VS-01 完成服务方选定
      - VS-03 获得风险结论
      - VS-04 完成服务价款约定与支付
      participate:
      - VS-03.1 编制检查计划
      - VS-03.3 发布不符合项
      - VS-03.5 登记报告认可
    evidence:
    - BIZBOK v11 §2.8，印刷页269–275，按 CARD.md 已核补充；支持类别、具体干系人与定义细化的方法，不直接证明本企业的具体子类。
    - Unanet AE，UAE#往来单位身份，SP第6页、AD第67页，支持客户身份概念；Vantagepoint，VP26#交易对方与沟通人员，E02、E03，页码无；两者笔记均未证明本卡五种客户类型。
    - 投资方、金融机构技术尽调及保险公司 IDI 委托这一具体分类的合同或产品直接依据：无。
    issues:
    - 不得仅按机构名称或行业归类；同一家保险公司还可能是职业责任保险供应商或渠道伙伴。
  roles:
  - id:
    - SH-C6a
    name: 发起人
    parent: 客户内的角色
    definition: 在客户内部提出服务需求并推动项目或委托立项的人员。
    criterion: 需求提出记录、商机沟通或立项材料显示其实际承担需求发起和推动职责。
    boundary: 与五种客户子类正交，任一子类内部均可存在；与其他决策链角色不互斥，同一联系人可兼任，以具体商机或项目中的职责及有效授权为准，不要求五个角色分别由五个人承担。
