      - VS-01.2 赢得委托
      - VS-02.0 开始项目
      - VS-02.1 确认概念
      - VS-02.2 确认方案
      - VS-02.3 完成初步设计
      - VS-02.4 完成深化设计
      - VS-02.5 完成招标采购配合
