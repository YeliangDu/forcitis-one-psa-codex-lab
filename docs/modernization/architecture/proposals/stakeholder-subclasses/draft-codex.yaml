summary_issues:
- 本稿仅细化既定六类，不新增类别；定义与判别标准为依据现有类别及对象关系形成的草稿，未将其表述为已经执行的企业规则。
- BIZBOK §2.8 印刷页269–275来自 CARD.md 的已核补充，bizbok-v11.md 本身未收录该节；其方法证据与本企业分类决定分别标明，未编造更精确页码。
- BIZBOK 示例将监管方置于合作伙伴、审计员置于人力资源；本稿遵守已定六类，并按本卡外部审计机构的受托服务关系归入供应商，不机械照搬示例。
- 客户五类描述的业务特征并非天然互斥，但 STKH-07 已定主档客户类型单值；跨项目出现多种特征时的归类优先规则尚缺，不能自行改为多值或随项目切换主档。
- 客户五种决策链角色与五种客户子类正交；角色可以兼任，也可能分属多人，不能推定每个客户都已识别齐全或由五个人分别担任。
- 交付伙伴与供应商采用不同观察维度；外协分包方既属于交付伙伴分组，也属于供应商业务角色细分，不能强制两组互斥。
- SH-P1 共用编号拆明外协设计顾问与海外持牌伙伴；SH-O1 共用编号拆明三种股东类型；复用原始映射仅保持来源，不证明各细分的阶段参与已分别核实。
- 审计机构、出租方判为供应商下的再细分；金融机构判为合作伙伴下的新子类并使用已定独立业务角色；没有新增第七类。
- OBJECTS.md 供应商细分还列有外包方、劳务派遣单位，BASE.yaml 未单列相应 SH 及 involvement；应核对其与外协分包的边界及映射，未增造编号或阶段；派遣单位与派遣人员分别属于单位关系和人员用工关系。
- 往来单位业务角色与项目内身份分层保存；主管机关与主管部门、金融机构与资金监管银行等可以关联同一主体，不能据名称相近合并身份或参与映射。
- 管理层与员工可重叠，员工下七项是可兼任的运营角色；人员对象、任职、项目职责、注册资格和系统权限不能互相替代。
- 员工总体没有独立 SH 或 involvement，故以七个既有编号标明覆盖范围，并将汇总 involvement 标为未提供；各角色原始清单均保留。
- OBJ-126 已定为股东一级对象，后续须核对 OBJ-91 出资关系、OBJ-02 既有合伙人角色，以及跨被投资法人的类型与期间表达。
- SH-X1至SH-X8继续保留为 BASE.yaml 已定的无类别阶段参与者，本次未强行归入六类；其中 SH-X7 对 VS-15.2、VS-15.3 的参与依据值得核对，未并入金融机构映射。
- involvement 以 BASE.yaml 三个清单为准，不依据 relation、定义、合同范本或供应商上位类型补增、删除或继承阶段；发现的疑点只列于 issues。
- 成熟产品及合同资料仅作对应概念旁证；没有直接支持具体细分时标明无，不把一般客户、联系人、供方或人员概念当成本企业全部分类的外部证明。
- Unanet 引用简称沿用笔记，SP为Setting Up Projects、AD为Administering the System、PM为Using Project Management、BI为Using Billing、AR为Using Accounts Receivable、AP为Using Accounts Payable；所引印刷页与PDF页一致。Vantagepoint与Maister笔记没有稳定页码，均标明无。
