    - Unanet AE，UAE#联系人与项目联系，SP第14页、AD第67页；Vantagepoint，VP26#交易对方与沟通人员，E02、E03，页码无；只支持联系人及其业务关系，未证明五种决策链角色的固定枚举。
    - FIDIC白皮书2017，FIDW#授权代表，2.7.1、3.6.1–3.6.2，印刷页9–10、PDF页32–33；支持代表权限须明确，不能由联系人姓名推定授权。
    issues:
    - 选定服务方、确认成果和签署合同的权限可能分属不同人员，不能由一个“决策人”标签概括全部授权。
