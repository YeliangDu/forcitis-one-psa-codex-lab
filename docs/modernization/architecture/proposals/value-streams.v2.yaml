      name: 完成薪酬发放
      capabilities: [CAP-054, CAP-056, CAP-103]
      description: 提交应付薪酬、代发付款、发放后过账。
      participants: [SH-E6, SH-M1, SH-E3]
      entry:
        all:
          - {ref: OBJ-73, state: 已批准}
      exit:
        all:
          - {ref: OBJ-85, state: 已结清, note: 应付薪酬类型（AGG-52 回溯新增）}
          - {ref: OBJ-86, state: 已成功 / 已核销, note: 成功后核销即转「已核销」（STEP3 C-13）}
          - {ref: OBJ-73, state: 已发放 → 已过账}
      value_item: 员工按时足额收到工资。
      notes: "部分员工成功、部分退票时，成功行保留实付金额、时间与领取依据，失败行待补发，整期薪酬保持「已批准」；仅失败部分重入本段补发，个人清单及送达记录关联薪酬行。全部应付薪酬行实付后整期转「已发放」，过账沿原流程。依据 R1-B-24。"
    - id: VS-13.6
      order: 6
      name: 完成离职结清
      capabilities: [CAP-005, CAP-056]
      description: "离职申请、劳动合同终止，最后一期薪酬随月度结算发放；人力经办在解除或终止时出具并交付证明，登记交付证据。档案及社保转移、公积金变更及转移 / 封存分别记录责任人、法定到期日、申请日、经办结果日和回执；证明单据与回执挂证据（OBJ-53）。离职生效和外部办理成功分别留痕，期限据 LAB#离职证明与保管 / 解除证明内容、SOC#公积金增减员（R1-B-31），不以一次减员状态代替各项办结证据。"
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E3, SH-E1, SH-E6, SH-M1]
      entry:
        all:
          - {ref: OBJ-56, state: 待离职}
      exit:
        all:
          - {ref: OBJ-56, state: 已离职}
          - {ref: OBJ-62, state: 减员（转移 / 封存）}
          - {ref: OBJ-05, state: 已终止, note: 劳动合同类型}
      in_stage_states:
        - {ref: OBJ-57, state: 已结束（任职区间终止）, note: CON-1017-ARC-10 S-10：PRC-128 离职终止任职区间；只记录、不作门}
        - {ref: OBJ-123, state: 生效（待计发调整已登记）/ 已结束, note: CON-1017-ARC-10 S-10：PRC-178 离职时补休转计发加班工资；不作门}
      value_item: 员工依法离职、结清权益。
      notes: 可在任何时点进入；账号停用是平台身份事项，不是业务对象状态；工作交接清单是单据，不作门（用户答复 Q-D 第 3 项不做，intent 2026-10-16-082311）。 劳动仲裁不入条件：Q-E 第 2 项选 b（intent 2026-10-16-090004），法律纠纷不新增对象，劳动合同不产生往来款项，仲裁案件过程线下。


# CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C13 题；CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C14 题：采用一条内部服务价值流，合同档案三流程保持支撑。
- id: VS-14
  name: 获得内部服务
  category: support
  working_name: 内部服务申请到办结
  description: 员工登记用印、IT 需求、IT 资产使用或员工活动事项；用印及受控 IT 类别按制度配置审批，领用和活动全部由规则控制，不设批准步骤；周年贺卡按入职周年自动生成，直到事项办结或资产归还；不含合同借阅、归档及逾期催还。
  triggering_stakeholders: [SH-E1, SH-E2, SH-E3, SH-E4, SH-E5, SH-E6, SH-E7]
  trigger_note: 四类事务各自独立，一次登记只对应一种服务；周年贺卡由人员入职事实与调度触发，适用员工和周年口径须配置并按员工、入职日期、周年日期、类型去重；资产调拨、报修、归还是已领用后的重入。
  value: 员工所需行政与信息技术服务办妥，用印和资产使用有据可查。
  value_receivers: [SH-E1, SH-E2, SH-E3, SH-E4, SH-E5, SH-E6, SH-E7]
  ends_in:
    - {ref: OBJ-113, state: 已关闭 / 已驳回 / 已撤回}
    - {ref: OBJ-114, state: 已关闭 / 已退回 / 已撤回}
    - {ref: OBJ-115, state: "已结束", note: "仅归还资产命令结束的使用期间，流程结局为已归还；调拨结束旧期间不表示归还", agg: AGG-115}
    - {ref: OBJ-115, state: "已维修登记", note: "归还结束使用，维修登记仅结束当次维修服务", agg: AGG-121}
    - {ref: OBJ-116, state: 已完成}
  stages:
    - id: VS-14.1
      order: 1
      name: 提交申请
      capabilities: [CAP-054, CAP-056, CAP-093]
      description: 员工登记用印、IT 需求、IT 资产领用或活动事项；周年贺卡按入职周年自动生成，同样先经活动规则校验。
      participants: [SH-E1, SH-E2, SH-E3, SH-E4, SH-E5, SH-E6, SH-E7]
      entry:
        all:
          - {ref: 缺对象状态, state: 员工有需办理的内部服务事项, gap: MS-24, note: 触发事实，含入职周年到期的自动登记，不要求员工主动申请}
      exit:
        any:
          - {ref: OBJ-113, state: 审批中 / 已批准, note: 来源审批已通过且累计份数守卫满足时直通已批准；需人审时按上线前须填的制度配置解析负责人和加审范围}
