        any:
          - {ref: 缺对象状态, state: 年检或核查通知已到, gap: MS-20, note: 外部通知；由本段 PRC-78 发起核查}
          - {ref: 缺对象状态, state: 资质有效期临近, gap: MS-20, note: 定时；由本段 PRC-78 发起延续}
      in_stage_states:
        - {ref: OBJ-65, state: 核查中, note: 年检或动态核查开始后在段内}
        - {ref: OBJ-65, state: 延续中, note: 有效期临近，提出延续后在段内}
      exit:
        any:
          - {ref: OBJ-65, state: 有效, note: 核查通过或延续后取得新有效期}
          - {ref: OBJ-65, state: 已降级 / 已撤销 / 已到期, note: 停止；到期指未延续}
        all:
          - {ref: OBJ-64, state: 有效, note: 资质所需的注册执业人员}
      value_item: 承接资格持续有效，投标与签约可引用。
      notes: 进入条件改为「年检或核查通知已到、或有效期临近」，核查中、延续中移作段内状态（SD-07 用户裁定 2026-10-16；流程 PRC-78 属 revenue，须其复核）；资质维护纳入（用户答复 Q-D 第 1 项，intent 2026-10-16-082311）；信息图 OBJ-65 已补「核查中」「延续中」两个状态（MS-12 消除）；我方资质的类别范围仍待定（信息图 OBJ-65 范围列）。 培训不新增对象（用户答复 Q-E 第 3 项选 b，intent 2026-10-16-090004）：继续教育学时作注册执业证书（OBJ-64）属性，按注册期累计，不作门状态。

# ───────────── 内部 ─────────────

- id: VS-07
  category: support  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首价值流用途分类告知
  name: 完成人员任用
  working_name: 招聘到入职
  description: 用人经理提出用人需要、候选人应聘，经录用决定办理入职，直到新员工开始任职；入职后的考勤、报酬与离职见 VS-13。
  triggering_stakeholders: [SH-E1, SH-H1]
  trigger_note: 用人经理提出招聘需求；求职者应聘（含调入等非招聘入职）。
  value: 用人经理及时得到合格人员；候选人得到明确的录用结果并顺利入职。
  value_receivers: [SH-E1, SH-H1]
  ends_in:
    - {ref: OBJ-56, state: 试用期 / 正式, note: 不约定试用期的直接为「正式」（STEP3 C-14）}
    - {ref: OBJ-56, state: 未录用, note: 候选阶段终态，停止}
  stages:
    - id: VS-07.1
      order: 1
      name: 提出招聘需求
      capabilities: [CAP-056, CAP-058]
      description: 提出、批准、关闭招聘需求。
      participants: [SH-E1, SH-E6, SH-M1]
      skippable: true
      entry:
        all:
          - {ref: OBJ-58, state: 已启用}
      exit:
        any:
          - {ref: OBJ-60, state: 已批准, caveat: SC-03}
          - {ref: OBJ-60, state: 已关闭（录满 / 取消）}
      value_item: 用人需要被确认并有编制依据。
      notes: 调入等非招聘入职跳过本段。
    - id: VS-07.2
      order: 2
      name: 完成录用
      capabilities: [CAP-056]
      description: 候选人登记、面试、录用决定。
      participants: [SH-H1, SH-E1, SH-E6]
      entry:
        all:
          - {ref: OBJ-56, state: 已登记（候选）}
      exit:
        any:
          - {ref: OBJ-56, state: 待入职}
          - {ref: OBJ-56, state: 未录用, note: 停止}
      value_item: 候选人得到明确的录用结果。
    - id: VS-07.3
      order: 3
      name: 完成人员入职与任职
      capabilities: [CAP-005, CAP-056]
      description: 登记入职、建立任职、签订劳动合同、参保增员、建立薪酬档案。
      participants: [SH-H1, SH-E1, SH-E6]
      entry:
        all:
          - {ref: OBJ-56, state: 待入职}
      exit:
        all:
          - {ref: OBJ-56, state: 试用期 / 正式, note: 不约定试用期的直接为「正式」（STEP3 C-14）}
          - {ref: OBJ-05, state: 已签署生效 / 履行中, note: 劳动合同类型；未满一个月未签只预警；生效后即转「履行中」（STEP3 C-14）}
          - {ref: OBJ-62, state: 在缴, note: 增员后的参保状态}
      in_stage_states:
        - {ref: OBJ-57, state: 生效（任职版本）, note: CON-1017-ARC-10 S-7：PRC-83、PRC-136 登记或变更任职；任职无状态机，只记录、不作门（见本段 notes）}
        - {ref: OBJ-109, state: 已确认, note: CON-1017-ARC-10 S-8：PRC-85 试用期评估；状态推断，随 SC-06 定；不作门}
        - {ref: OBJ-122, state: 已开账, note: CON-1017-ARC-10 S-8：PRC-160 入职开立年度假期额度账户；不作门}
      value_item: 员工开始工作并有合同与社保保障。
      notes: 任职（OBJ-57）是按生效区间版本化的对象、没有状态机，主任职生效随登记入职完成，不作门条件。

- id: VS-08
  category: support  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首价值流用途分类告知
  name: 完成垫付费用报销
  working_name: 报销到付款
  description: "员工在公务支出前申请费用额度、出差批准或借支，费用发生后提交报销或还款，经核定、入账并付款结清。"
  triggering_stakeholders: [SH-E1, SH-E2, SH-E3, SH-E4, SH-E5, SH-E6, SH-E7]
  trigger_note: "适用费用制度的员工有需事前批准的公务支出 / 出差计划、需要借支，或已发生公务垫付费用时发起；费用事前申请（OBJ-118）和出差申请（OBJ-119）是独立对象，尚未垫付也可从 VS-08.0 进入。触发与受益清单覆盖各类员工角色，具体适用类别与办理权限仍依费用制度。"
  value: "员工在支出前取得所需额度或出差批准，获得借支支持，公务垫付费用及时足额得到补偿。"
  value_receivers: [SH-E1, SH-E2, SH-E3, SH-E4, SH-E5, SH-E6, SH-E7]
  ends_in:
    - {ref: OBJ-88, state: 已付}
    - {ref: OBJ-85, state: 已结清, note: 其他应收「员工借款」类型}
  stages:
    - id: VS-08.0
      order: 1
      name: 批准事前申请
      capabilities: [CAP-118, CAP-119]  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I05 题；页首阶段能力补列与处理清单  # STEP3 后新增段，按阶段描述映射（one-architecture 提议）
      description: 员工对需事前申请的费用类别（业务招待、差旅等）在支出前申请额度或出差，经批准后才可占用。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E3, SH-E2, SH-M1, SH-E6, SH-E1, SH-P2]
      skippable: true
      entry:
        all:
          - {ref: 缺对象状态, state: 员工有需事前申请的支出计划, gap: MS-18, note: 触发事实，非对象状态}
      exit:
        any:
          - {ref: OBJ-118, state: 已批准, note: CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I05 题；AGG-130，独立金额批准记录}
          - {ref: OBJ-119, state: 已批准, note: CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I05 题；AGG-132，独立行程批准记录}
      in_stage_states:
        - {ref: OBJ-120, state: 已批准 / 已驳回, note: CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I07 题；PRC-173 超标订单审批，独立于出差申请批准与月账单核对，不作所有申请的门}
      value_item: 员工在支出前已取得额度或出差批准，报销时有据可依。
      notes: 只对需事前申请的类别；其余报销直接从 VS-08.1 开始（SD-03 用户裁定 2026-10-16）。
    - id: VS-08.1
      order: 2
      name: 完成借款发放与归还
      capabilities: [CAP-056, CAP-103]
      description: 员工借款发放与还款（借款与报销各自结算，Q24）。
      participants: [SH-E3, SH-E6, SH-M1]
      skippable: true
      entry:
        all:
          - {ref: OBJ-85, state: 未结, note: 其他应收「员工借款」, agg: AGG-49}
      exit:
        all:
          - {ref: OBJ-85, state: 已结清, agg: AGG-49}
      value_item: 员工无须自垫大额公务支出。
    - id: VS-08.2
