stakeholder_categories:
  # 每个类别对应一个一级业务对象（BIZBOK v11 §2.8 准则 11，印刷页 272）；没有对象的写理由并登记 04。
  - {category: 客户, type: 外部, obj: OBJ-01, role_attr: 角色, role: 客户, desc: 与我方有、将有或曾有服务约定，或直接从我方服务获益的单位或个人（由往来单位管理 CAP-001 推导）。}
  - {category: 合作伙伴, type: 外部, obj: OBJ-01, role_attr: 角色, role: 供应商、渠道伙伴、联合体伙伴、海外持牌伙伴、金融机构, desc: 协助我方交付、向我方供货或转介绍业务的单位（由往来单位管理 CAP-001 细化）。}
  - {category: 监管机构, type: 外部, obj: OBJ-01, role_attr: 角色, role: 主管机关, desc: 依法审批、监督我方成果或要求我方申报缴款的机关（由往来单位管理 CAP-001 细化）。}
  - {category: 人力资源, type: 两者, obj: OBJ-56, desc: 与我方法人存在或将建立劳动、劳务关系的自然人，含候选阶段（由人员管理 CAP-056 推导）。}
  - {category: 股东和合伙人, type: 两者, obj: OBJ-126, role_attr: 股东类型, role: 单位股东、自然人股东、合伙人, desc: 向我方法人出资并取得回报的单位或个人（用户 2026-10-19 STKH-02：新增一级对象「股东」）。}
  - {category: 社会公众, type: 外部, obj: null, decr: DECR-02, desc: 不与我方订约或往来、只获得建筑安全与效果等非货币价值的公众。}

value_streams:

# ───────────── 外部：客户触发 ─────────────

- id: VS-01
  category: business  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首价值流用途分类告知
  name: 完成服务方选定
  working_name: 获客到赢单
  description: 客户为一项建设或检查需求寻找、比较并选定专业服务方，直到以中标或委托确立我方承接；手册售前 BD0、BD1 两段。
  triggering_stakeholders: [SH-C1, SH-C2, SH-C3, SH-C4, SH-C5, SH-P3, SH-P1c]
  trigger_note: 客户发起人询价、邀标或发布招标；渠道伙伴转介绍（间接）；联合体伙伴邀请联合投标。我方市场活动产生的线索同样进入第 1 段。触发干系人可以有多个（BIZBOK 第 158 页）。
  value: 客户得到可信的方案、报价与承诺，以合理代价选定能胜任的服务方。
  value_receivers: [SH-C1, SH-C2, SH-C3, SH-C4, SH-C5]  # STKH-06：触发与受益只写客户子类，决策链角色只作阶段参与者
  ends_in:
    - {ref: OBJ-18, state: 已赢单}
    - {ref: OBJ-18, state: 丢单 / 已放弃, note: 价值流停止（G178 §2.2 每段后可停止）}
  stages:
    - id: VS-01.1
      order: 1
      name: 采集线索
      capabilities: [CAP-001, CAP-016, CAP-017, CAP-018]
      manual_stage: BD0 市场
      description: 经市场活动、客户活动、转介绍或客户来询形成线索，跟进核实是否为合格的业务机会。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E5, SH-C6a, SH-P3, SH-P2, SH-E2, SH-E6]
      entry:
        any:
          - {ref: OBJ-17, state: 新建}
          - {ref: OBJ-16, state: 进行中}
          - {ref: OBJ-105, state: 已计划}
      exit:
        any:
          - {ref: OBJ-17, state: 已确认（转商机）}
          - {ref: OBJ-17, state: 已关闭（无价值，原因必填）, note: 停止}
      in_stage_states:
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-16, state: 已结束, note: PRC-01 市场活动已举办；取信息图原值，不作门}
        - {ref: OBJ-105, state: 已完成（结果反馈）, note: PRC-02 客户活动已完成；取信息图原值，不作门}
        - {ref: OBJ-01, state: 有效（档案已核实）, note: PRC-05 在形成线索与转商机时登记并核实往来单位档案（P-3）；不作门}
      value_item: 客户需求被识别并有人负责跟进。
      notes: 门 = 线索「已确认」→ 商机新建（STAGE_TYPES_DRAFT §3.1）；可跳过（客户直接邀标或委托时直接从第 2 段进入）。
    - id: VS-01.2
      order: 2
      name: 赢得委托
      capabilities: [CAP-018, CAP-019, CAP-024, CAP-026]
      manual_stage: BD1 业务拓展（投标前、投标、投标后作商机「跟进中」内部阶段，不升格，§3.1）
      description: 理解需求、做独立性检查、编制方案与报价，投标或议标，直到中标或取得委托。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E5, SH-E2, SH-E4, SH-C6a, SH-C6b, SH-C6c, SH-P1c, SH-X4, SH-M1, SH-E6]
      entry:
        all:
          - {ref: OBJ-18, state: 跟进中}
          - {ref: OBJ-24, state: 已启用, note: 报价所据服务产品须为启用（第 ③ 步预警：服务产品原无阶段引用）}
          - {ref: OBJ-26, state: 已生效, note: 报价估算取用的标准成本费率表版本须为生效}
      exit:
        any:
          - {ref: OBJ-18, state: 已赢单, note: 须中标或委托证据（I-4）；可伴随 OBJ-20「已中标」}
          - {ref: OBJ-18, state: 丢单 / 已放弃, note: 停止}
      in_stage_states:
        - {ref: OBJ-18, state: 已决定参投, note: 参投决策（PRC-183，用户 VS01-10）；放弃即 VS-01.2 退出}
        - {ref: OBJ-23, state: 无冲突 / 有冲突已获书面同意, note: 售前拦截（D-4 b）：是不变量不是门}
        - {ref: OBJ-21, state: 已通过}
        - {ref: OBJ-20, state: 已递交}
        - {ref: OBJ-65, state: 有效, note: 投标引用我方资质}
        - {ref: OBJ-19, state: 已公告 / 已定标, note: 外部引用对象，只记录、不控制，不作门（第 ③ 步补，STEP3 C-20）}
        - {ref: OBJ-12, state: 已申请 / 已批准, note: 先行投入授权在赢单前申请与批准（如有）；VS-02、VS-04 以「批准」起始，原无产出阶段（STEP3 C-23）}
        # SD-13（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-13, state: 待缴 / 已缴 / 已退 / 被没收（可部分扣减）, note: 投标保证金的现金形态（PRC-10、PRC-153）；如有，不作门}
        - {ref: OBJ-13, state: 已开立 / 已到期 / 被索赔, note: 投标保证金的保函形态（PRC-10）；如有，不作门}
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-18, state: 跟进中（内部阶段）, note: PRC-03 新建并跟进商机；段内持续维护，不作门}
        - {ref: OBJ-24, state: 已启用, note: PRC-12 发布本段报价所据的服务产品版本；不作门}
        - {ref: OBJ-26, state: 已生效（生效期不重叠）, note: PRC-13 批准并生效报价估算所据的标准成本费率表版本；不作门}
        - {ref: OBJ-46, state: 规划 / 在建（外部状态）, note: CON-1017-ARC-10 S-1：PRC-14 登记建设工程；外部引用对象只记录、不作门（同 VS-02.6、VS-03.1，STEP3 C-20）}
      value_item: 客户收到经我方审定的方案与报价承诺，并据此作出选择。
      notes: 报价被取代、投标被撤回时在本段内重入；联合体协议是投标的次级对象（OBJ-05 类型）。

- id: VS-02
  category: business  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首价值流用途分类告知
  name: 获得交付成果
  working_name: 交付到认可
  description: 客户获得按服务产品与协议范围约定的专业成果（设计咨询、品控、造价等），逐段提交、认可，直到项目结算与复盘；阶段即手册交付七段（另含目录中的「概念」），按协议范围在 WBS 上裁剪。品控类服务在施工期做的检查留在施工段（VS-02.6）；资本方或既有建筑业主委托的检查、尽调归 VS-03。
  triggering_stakeholders: [SH-C1, SH-C2, SH-C3, SH-C4]  # STKH-06
  trigger_note: 客户发起人在赢单或直接委托后要求开工；与签约先后无关（S3：阶段与商务分界脱开）。
  value: 客户按约获得可审查、可报审、可施工的专业成果，建成效果与安全达到要求。
  value_receivers: [SH-C1, SH-C2, SH-C3, SH-C4, SH-S1, SH-S2]  # STKH-06
  starts_when:
    any:
      - {ref: OBJ-18, state: 已赢单}
      - {ref: OBJ-12, state: 已批准, note: 先行投入}
      - {ref: OBJ-05, state: 已生效, note: 直接签约的项目合同或任务订单}
  ends_in:
    - {ref: OBJ-29, state: 已结项 → 已归档}
    - {ref: OBJ-29, state: 已终止 / 已取消, note: 停止}
  cross_stage_activities_note: 资源需求与分配（OBJ-44、45）、工时（OBJ-66）、设计变更（OBJ-40）、延期申请（OBJ-41）、项目风险与问题（OBJ-108）、我方成果不符合项（OBJ-38）贯穿各段，不另立阶段，其流程在第 ⑥a 步按阶段映射。
  cross_stage_activities:
    # 第 ③ 步补（STEP3 C-21）：把贯穿活动的产出写成对象状态，使工时等与 VS-10 事实过账的衔接进入共享依赖表；不是门。
    - name: 资源与工时
      description: 提出与满足资源需求、确认资源分配，填报并审批工时。
      inputs:
        - {ref: OBJ-29, state: 执行中, caveat: SC-04}
      outputs:
        - {ref: OBJ-44, state: 已部分满足 / 已满足}
        - {ref: OBJ-45, state: 已确认}
        - {ref: OBJ-66, state: 已通过}
    - name: 变更、延期与风险
      description: 设计变更、延期申请、项目风险与问题、我方成果不符合项的登记与处置。
      inputs:
        - {ref: OBJ-29, state: 执行中, caveat: SC-04}
      outputs:
        - {ref: OBJ-40, state: 已关闭}
        - {ref: OBJ-41, state: 已批准 / 已拒绝 / 视为批准}
        - {ref: OBJ-108, state: 已关闭 / 已接受}
        - {ref: OBJ-38, state: 已关闭, note: 我方成果类}
  stage_pattern:
    entry_common:
      all:
        - {ref: OBJ-30, state: 未开始 / 进行中, note: 该阶段的 WBS 阶段节点已建出且未作废（S1b 按协议范围裁剪）；不依赖启动段的退出}
    exit_common:
      all:
        - any:
            - {ref: OBJ-35, state: 已认可, note: 该阶段节点下需客户认可的交付物, caveat: SC-02}
            - all:
                - {ref: OBJ-35, state: 已交付（签收） / 审查中, note: 交付侧事实（D-8）, caveat: SC-02}
                - {ref: OBJ-35, state: 已声明, note: 交付侧事实（D-8）；期满判定不在交付侧, caveat: SC-02}
        - {ref: OBJ-30, state: 已完成, caveat: SC-01}
    gate_rule: 门只预警；需审定的门走审批，未完成不挡下一阶段（S2）；阶段并行、倒序、跳段是常态（S2 取证 89.5% 有重叠），故不以前一段退出作为后一段进入。退出只用交付侧事实，视为同意的期满判定在收入确认段（D-8）。
  stages:
    - id: VS-02.0
      order: 1
      name: 开始项目
      capabilities: [CAP-029]
      manual_stage: 1 启动
      description: 建立项目、组建团队、编制交付计划与预算，召开启动会，接收发包人首批资料。
      participants: [SH-E2, SH-M1, SH-E6, SH-C6a, SH-C6e]
      entry:
        any:
          - {ref: OBJ-18, state: 已赢单}
          - {ref: OBJ-12, state: 已批准, note: 先行投入}
          - {ref: OBJ-05, state: 已生效, note: 直接签约的项目合同或任务订单}
      exit:
        all:
          - {ref: OBJ-29, state: 已立项 / 执行中, caveat: SC-04, note: 开工后项目即离开「已立项」，只写「已立项」会误报（STEP3 C-01）}
          - {ref: OBJ-31, state: 已批准（对客）/ 内部锁定}
          - {ref: OBJ-32, state: 已锁定（成本基线）}
          - {ref: OBJ-30, state: 已完成, note: 启动阶段节点, caveat: SC-01}
      in_stage_states:
        - {ref: OBJ-34, state: 在岗, note: 组建团队；项目团队名册待 Q13，不作门（STEP3 C-02）}
        - {ref: OBJ-42, state: 已提供, note: 发包人首批资料（STEP3 C-02）}
        # SD-13（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-33, state: 已提出 / 已批准 / 已驳回, note: 完工估算在阶段门处提出或更新（如有）；PRC-30 提出并批准估算，不作门}
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-26, state: 已生效（生效期不重叠）, note: PRC-13 生效的费率版本供本段编制并锁定预算；按 SD-14 作为段内状态，不作门}
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-42, state: 已确认 / 有缺陷（退回）, note: PRC-26 在本段核对发包人资料，确认可用性或退回补充；区别于进入条件「已提供」，不作门}
        - {ref: OBJ-44, state: 已提出 / 已部分满足 / 已满足, note: CON-1017-ARC-10 S-2：PRC-20 贯穿 VS-02.0–02.6，列在首段；只记录、不作门}
        - {ref: OBJ-108, state: 已登记 / 应对中 / 已关闭, note: CON-1017-ARC-10 S-2：PRC-27 贯穿 VS-02.0–02.7，列在首段；只记录、不作门}
        - {ref: OBJ-45, state: 已计划 / 已确认, note: CON-1017-ARC-13：PRC-20 贯穿 VS-02.0–02.6，列在首段（同 OBJ-44）；只记录、不作门}
      value_item: 客户与我方对范围、计划和团队有一致的基线。
      notes: 进入条件同价值流起始条件；立项是本段的结果，不是 BD1 → 启动的门（STAGE_TYPES_DRAFT §3.1）；启动会纪要作证据类型「会议纪要」（OBJ-53）。
    - id: VS-02.1
      order: 2
      name: 确认概念
      capabilities: [CAP-029]
      manual_stage: 目录阶段「概念」（景观线用；手册七段之外的目录候选，S1）
      optional: true
      description: 形成设计概念与方向供客户选择。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E3, SH-E4, SH-E2, SH-C6b, SH-C6e, SH-X1, SH-C6a, SH-M1]
      entry:
        pattern: entry_common
        all:
          - {ref: OBJ-42, state: 已提供, note: 提资；未「已确认」只预警}
      exit: {pattern: exit_common}
      in_stage_states:
        # SD-13（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-33, state: 已提出 / 已批准 / 已驳回, note: 完工估算在阶段门处提出或更新（如有）；PRC-30 提出并批准估算，不作门}
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-42, state: 已确认 / 有缺陷（退回）, note: PRC-26 在本段核对发包人资料，确认可用性或退回补充；区别于进入条件「已提供」，不作门}
      value_item: 客户选定设计方向。
      notes: 进入条件同 VS-02.2 要求发包人资料「已提供」（AEC 通行：概念设计也需任务书与基础资料；SD-01 用户裁定 2026-10-16）。
    - id: VS-02.2
      order: 3
      name: 确认方案
      capabilities: [CAP-029]
      manual_stage: 2 方案（照明「方案初步」占此位）
      description: 提资消化、方案设计、客户确认。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E3, SH-E4, SH-E2, SH-C6b, SH-C6e, SH-X1, SH-R1, SH-P1, SH-C6a, SH-M1]
      entry:
        pattern: entry_common
        all:
          - {ref: OBJ-42, state: 已提供, note: 提资；未「已确认」只预警}
      exit: {pattern: exit_common}
      in_stage_states:
        - {ref: OBJ-37, state: 通过, note: 签发前内审}
        # SD-13（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-33, state: 已提出 / 已批准 / 已驳回, note: 完工估算在阶段门处提出或更新（如有）；PRC-30 提出并批准估算，不作门}
        - {ref: 缺对象状态, state: 产值已填报 / 产值已抽查, gap: MS-23, note: PRC-151 向完工估算只追加产值估计行，不改估算批准状态；信息图 OBJ-33 无对应状态，不作门}
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-42, state: 已确认 / 有缺陷（退回）, note: PRC-26 在本段核对发包人资料，确认可用性或退回补充；区别于进入条件「已提供」，不作门}
        - {ref: OBJ-40, state: 已发出 / 已关闭, note: CON-1017-ARC-10 S-2：PRC-31 贯穿 VS-02.2–02.6，列在首段；只记录、不作门}
        - {ref: OBJ-41, state: 已批准 / 已拒绝 / 视为批准, note: CON-1017-ARC-10 S-2：PRC-32 贯穿 VS-02.2–02.6，列在首段；只记录、不作门}
      value_item: 客户确认的方案，可据以推进报规与初设。
    - id: VS-02.3
      order: 4
      name: 完成初步设计
      capabilities: [CAP-029]
      manual_stage: 3 初设（照明「方案深化」占此位；景观无此段）
      description: 提资消化、初步设计、客户确认，配合报审。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E3, SH-E4, SH-E2, SH-E7, SH-C6e, SH-X1, SH-R1, SH-P1, SH-C6a, SH-M1]
      entry:
        pattern: entry_common
        all:
          - {ref: OBJ-42, state: 已提供}
      exit: {pattern: exit_common}
      in_stage_states:
        - {ref: OBJ-37, state: 通过}
        # SD-13（用户 2026-10-17 ANM 批准）
