      value_item: 员工的法定保障与纳税义务按期履行。
      notes: "与 VS-13.5 并行；薪酬已批准可准备资料，正式个税申报须关联已发生的支付及扣缴事实、申报所属期，完成缴库后留存回执；本说明不将两个阶段强制串行。依据 R1-B-28。"
    - id: VS-13.5
