- id: VS-03
  category: business  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首价值流用途分类告知
  name: 获得风险结论
  working_name: 检查服务
  description: 资本方或既有建筑业主为投资、承保或安全合规委托我方做技术尽调、IDI 技术检查、周期检查，获得独立的检查结论与整改闭合状态。独立成价值流【推出】：触发者（资本方、既有建筑业主）与价值（风险结论）都与交付成果不同，BIZBOK 第 157–158 页要求触发者与价值各异的价值流各自独立，只经共享对象状态相互影响。边界：品控类服务在施工期做的检查留在 VS-02.6；资本方或既有建筑业主委托的检查归本价值流。阶段用自有阶段（检查策划、现场检查、发现发布、整改跟踪、报告认可），阶段类型目录另设「检查」类（用户答复 Q-A 选 a，intent 2026-10-16-082311）。
  triggering_stakeholders: [SH-C5, SH-C3, SH-P3]
  trigger_note: 投资方或金融机构委托尽调；保险公司委托 IDI 检查；既有建筑业主委托周期检查或专项检查；保险公司和 TIS、物业转介绍（间接）。检查计划到期只作提醒（派生 / 策略，不是对象状态），由人工转线索或商机，另签协议后经协议「已签署生效」或商机「赢单」进入（用户答复 U-3 选派生，intent 2026-10-16-090004）。
  value: 委托方得到独立、可追溯的风险信息与合规结论，并能跟踪问题整改到闭合。
  value_receivers: [SH-C5, SH-C3, SH-S1, SH-S2]
  starts_when:
    any:
      - {ref: OBJ-18, state: 已赢单}
      - {ref: OBJ-05, state: 已生效}
  ends_in:
    - {ref: OBJ-35, state: 已认可, note: 检查报告类交付物}
    - {ref: OBJ-48, state: 不再受托, note: 周期检查终止}
  stages:
    - id: VS-03.1
      order: 1
      name: 编制检查计划
      capabilities: [CAP-029, CAP-046, CAP-005]  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首阶段能力补列与处理清单
      description: 确定受检建设工程与部位、检查表模板与频次，安排检查。
      participants: [SH-E2, SH-E4, SH-C5, SH-C3, SH-X8]
      entry:
        all:
          - {ref: OBJ-29, state: 执行中, caveat: SC-04}
        any:
          - {ref: OBJ-48, state: 已生效, note: 仅 IDI；周期检查到期只作提醒（派生），续做另签协议，不由到期提醒直接重入（STEP3 C-04，U-3 选派生，intent 090004）}
          - {ref: OBJ-49, state: 已计划}
      exit:
        all:
          - {ref: OBJ-49, state: 已安排}
      in_stage_states:
        - {ref: OBJ-46, state: 已竣工（在用）, note: 受检建设工程；外部引用对象，只记录、不控制（R5），不作门（STEP3 C-20）}
        - {ref: OBJ-47, state: 在用, note: 受检建筑系统与部位（仅 IDI 完整登记，Q31a）}
        # SD-13（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-50, state: 已生效, note: PRC-42 发布本段所用的检查表模板版本，只增版本；不作门}
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-29, state: 执行中, caveat: SC-04, note: PRC-17 建立受检项目并开始执行，承接检查策划的准备工作；不作门}
        - {ref: OBJ-48, state: 已生效, note: PRC-41 制定并生效本段的检查计划，确定频次与安排依据；不作门}
      value_item: 委托方确认检查范围、时间与方法。
      notes: 本段起五段为阶段类型目录「检查」类的自有阶段（用户答复 Q-A 选 a，intent 2026-10-16-082311）；运营期周期检查同样适用，不套招采、施工段。
    - id: VS-03.2
      order: 2
      name: 完成现场检查
      capabilities: [CAP-029]
      description: 现场检查、记录与审核。
      participants: [SH-E3, SH-E4, SH-X5, SH-X2, SH-X8]
      entry:
        all:
          - {ref: OBJ-49, state: 已安排}
      exit:
        all:
          - {ref: OBJ-49, state: 已审核 → 已锁定}
      in_stage_states:
        - {ref: OBJ-38, state: 已识别, note: 客户资产类不符合项在现场检查中识别；VS-03.3 以其进入，原无产出阶段（STEP3 C-24）}
        - {ref: OBJ-53, state: 已采集 / 已封存, note: CON-1017-ARC-10 S-3：PRC-33 现场采集证据；只记录、不作门（intent 114200 F-1）}
      value_item: 受检对象的现状被客观记录并经审核。
    - id: VS-03.3
      order: 3
      name: 发布不符合项
      capabilities: [CAP-029]
      description: 复核并发布客户资产类不符合项，建议外部检测。
      participants: [SH-E4, SH-C5, SH-C3, SH-X6]
      entry:
        all:
          - {ref: OBJ-38, state: 已识别, note: 客户资产类}
      exit:
        all:
          - {ref: OBJ-38, state: 已发布}
      in_stage_states:
        - {ref: OBJ-52, state: 已建议, note: 如需外部检测；原写作单项 any，等于必备条件，改为段内状态（STEP3 C-05）}
      value_item: 委托方收到分级的风险发现与处置建议。
    - id: VS-03.4
      order: 4
      name: 跟进整改
      capabilities: [CAP-029]
      description: 跟踪整改申报与复查，采信或不采信外部检测报告。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E3, SH-X2, SH-X6, SH-X5, SH-C3, SH-E4]
      entry:
        all:
          - {ref: OBJ-38, state: 整改中}
      exit:
        any:
          - {ref: OBJ-38, state: 已闭合（复查通过）}
          - {ref: OBJ-38, state: 客户书面接受风险}
          - {ref: OBJ-38, state: 已停止跟踪（原因必填）}
      in_stage_states:
        - {ref: OBJ-52, state: 已采信 / 未采信（原因）}
      value_item: 风险得到处置或被有依据地接受。
      notes: 可跳过（尽调类无整改跟踪）；复查不通过回到「整改中」重入本段。
    - id: VS-03.5
      order: 5
      name: 登记报告认可
      capabilities: [CAP-029]
      description: 编制、签发检查或尽调报告，客户认可。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E4, SH-E7, SH-C5, SH-C3, SH-C6a, SH-M1]
      entry:
        all:
          - {ref: OBJ-49, state: 已锁定}
      exit:
        all:
          - {ref: OBJ-35, state: 已签发 → 已认可, note: 报告类交付物；评估结论、风险等级是其属性, caveat: SC-02}
      value_item: 委托方据报告作投资、承保或运维决策。

- id: VS-04
  category: business  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首价值流用途分类告知
  name: 完成服务价款约定与支付
  working_name: 收入链（签约到回款）
  description: 客户与我方约定价款与付款条件，按认可的成果确认应付、取得合规发票、付款并最终确认价款；与交付经对象状态衔接，不随交付阶段推进（S3）。
  triggering_stakeholders: [SH-C1, SH-C2, SH-C3, SH-C4, SH-C5]
  trigger_note: 客户接受报价或中标结果后签约；客户按付款条件付款。客户决策链的经济买方（SH-C6c）、付款方（SH-C6d）作阶段参与者。
  value: 客户的权利义务明确，取得合规发票，按约付款，价款可核对、最终确认。
  value_receivers: [SH-C1, SH-C2, SH-C3, SH-C4, SH-C5]
  starts_when:
    any:
      - {ref: OBJ-18, state: 已赢单}
      - {ref: OBJ-12, state: 已批准}
      - {ref: OBJ-05, state: 已生效, note: 框架协议下的任务订单}
  ends_in:
    - {ref: OBJ-05, state: 已结算（结算书经双方确认）}
    - {ref: OBJ-85, state: 已结清, note: 应收方向，含质保金类型}
    - {ref: OBJ-05, state: 已终止（原因必填）, note: 停止；终止清算}
  stages:
    - id: VS-04.1
      order: 1
      name: 签署合同
      capabilities: [CAP-005]
      description: 起草协议（复制承诺快照）、登记合同—项目关联与范围挂 WBS、登记视为同意参数与发包人代表、回签生效；变更与签证经协议变更产生新基线。
      participants: [SH-E5, SH-E2, SH-E6, SH-C6c, SH-C6b, SH-M1]
      entry:
        any:
          - {ref: OBJ-18, state: 已赢单}
          - {ref: OBJ-12, state: 已批准}
      exit:
        all:
          - {ref: OBJ-05, state: 已生效（无生效条件的回签即生效；附生效条件的先「已签署」，经确认生效条件满足后生效；基线 1；GL5-01）}
          - {ref: OBJ-07, state: 已生效}
          - {ref: OBJ-12, state: 已转正（并入协议）, note: 适用条件：有先行投入时；原写作单项 any，改为 all 并注适用条件（STEP3 C-06）}
      in_stage_states:
        # SD-13（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-13, state: 待缴 / 已缴 / 已退 / 被没收（可部分扣减）, note: 履约保证金、押金及中标后退还的投标保证金的现金形态（PRC-10、PRC-153）；如有，不作门}
        - {ref: OBJ-13, state: 已开立 / 已到期 / 被索赔, note: 履约保证金、押金及中标后退还的投标保证金的保函形态（PRC-10）；如有，不作门}
      value_item: 客户与我方对范围、价款、付款条件与认可方式有生效的约定。
      notes: 退出条件不含履约义务 OBJ-08「未履行」：它是 B-08 计算的派生值，无存储状态，阶段门不引用派生值（RD-11；METHOD 第 ④ 步第 7 条）；履约义务划分待 Q21。协议变更（OBJ-09）、索赔（OBJ-10）改在 VS-04.6 履约重入（SD-02 用户裁定 2026-10-16；原 STEP3 C-07 在本段重入）；依法招标的项目合同须与投标承诺比对（不变量）。
    - id: VS-04.6
      order: 2
      name: 完成合同履行
      capabilities: [CAP-005]  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首阶段能力补列与处理清单  # STEP3 后新增段，按阶段描述映射（one-architecture 提议）
      description: 协议生效后履行期内的协议变更、签证、索赔与框架协议下的任务订单；与收入确认、开票、回款在时间上并行。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E2, SH-E5, SH-E6, SH-C6b, SH-C6c, SH-C6a, SH-M1]
      entry:
        all:
          - {ref: OBJ-05, state: 已生效 / 履行中, note: 协议生效后即转「履行中」，只写「已生效」会误报（STEP3 C-08）}
      exit:
        all:
          - {ref: OBJ-05, state: 已完成, note: 全部履约义务已履行，由编排写回（AGG-13，聚合稿）}
      in_stage_states:
        - {ref: OBJ-09, state: 已生效（新基线）/ 驳回, note: 协议变更在本段重入（STEP3 C-07；SD-02 用户裁定 2026-10-16 自 VS-04.1 移入）}
        - {ref: OBJ-10, state: 已认定 / 已拒绝 / 撤回, note: 索赔在本段重入（STEP3 C-07；SD-02 用户裁定 2026-10-16 自 VS-04.1 移入）}
        - {ref: OBJ-05, state: 已生效, note: 框架协议下的任务订单（框架任务订单，PRC-50）在本段占用框架限额并提交}
      value_item: 履行期内的变更、签证与索赔有据可依，价款与范围的调整被及时确认。
      notes: 本段与 VS-04.2 确认收入、VS-04.3 开具发票、VS-04.4 回款在时间上并行，可重入（SD-02 用户裁定 2026-10-16）；增设本段前 VS-04.1 与 VS-04.5 之间没有履约阶段，变更、索赔、任务订单只能挂在合同签订上。
    - id: VS-04.2
      order: 3
      name: 确认收入
      capabilities: [CAP-053, CAP-005]  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首阶段能力补列与处理清单
      description: 依客户认可的交付侧事实确认收入（规则层，无状态，ADR-0016 决定 4），形成合同资产；视为同意的期满判定在本段，判定记在 B-08 收入确认行上（D-8、AGG-44）。
      participants: [SH-E6, SH-E2, SH-C6e]
      entry:
        all:
          - {ref: OBJ-05, state: 已生效 / 履行中 / 已完成, note: 收入确认须协议已生效（intent 2026-10-16-074053 P-1）；协议生效后即转「履行中」，只写「已生效」会误报（STEP3 C-08）}
          - any:
              - {ref: OBJ-35, state: 已认可, caveat: SC-02}
              - all:
                  - {ref: OBJ-35, state: 已交付（签收） / 审查中, caveat: SC-02}
                  - {ref: OBJ-35, state: 已声明, caveat: SC-02}
      exit:
        all:
          - {ref: 缺对象状态, state: 收入确认事实已过账, gap: MS-17, note: 收入确认行提交的过账候选已由过账服务（PRC-92，VS-10 事实过账）过账；信息图 OBJ-75 经营事实已非对象，OBJ-81 形态待定 Q20，暂无对象状态可指}
      in_stage_states:
        - {ref: OBJ-53, state: 已采集, note: CON-1017-ARC-10 S-3：PRC-33 采集触发确认的证据；只记录、不作门}
      value_item: 已交付并被认可的价值在账上可见。
      notes: 退出条件改为「收入确认事实已过账」（SD-08 用户裁定 2026-10-16：过账由 finance 的过账服务 PRC-92 完成、服务全部价值流，不给 PRC-92 逐段加标；收入线只提交过账候选）；此前曾改用存储状态 OBJ-98「已记账」（J 检查 J2.4，L-1）：原写 OBJ-08「已部分履行 / 已履行」是 B-08 按累计确认与分摊价格之比计算的派生值（AG §2.2 派生值清单，RD-11），门不引用派生值；ADR-0016 决定 4 定收入确认为无状态规则层，OBJ-81 无可作门的状态，与 STEP3 C-16 的写法（VS-10 输入为「收入确认行提交过账候选」、不引用 OBJ-81）一致；账上可见即 value_item。进入用与 VS-02 退出同一组交付侧事实；「视为同意已成立」是存在收入确认行上的判定（按合同审查期与送达日，D-8、AGG-44），不是读模型派生，也不是对象状态，故不入条件；门只留 OBJ-08；期满无结论且无声明的情形如何进入，见 STEP1 第 6 节第 8 条。
    - id: VS-04.3
      order: 4
      name: 开具发票
      capabilities: [CAP-103, CAP-005]  # CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-C12 题；页首阶段能力补列与处理清单
      description: 开票申请准入，开具销项发票并改写在制余额。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E6, SH-C6d, SH-E2, SH-E5, SH-M1, SH-R2, SH-C6a, SH-R1]
      entry:
        any:
          - {ref: OBJ-07, state: 可结算, note: 以认可为条件的付款条件项，在交付物「已认可」（OBJ-35，VS-02 退出）后可结算；其余按日期或里程碑触发，由节点事实决定（STEP3 C-22 改）}
          - {ref: OBJ-82, state: 草稿, note: 回签前只允许预收 / 首付款类型且附委托或中标证据（intent 074053 P-1）}
      exit:
        all:
          - {ref: OBJ-82, state: 已开票}
          - {ref: OBJ-83, state: 已开具, note: 销项蓝字}
      in_stage_states:
        # SD-14（用户 2026-10-17 ANM 批准）
        - {ref: OBJ-07, state: 可结算, note: PRC-152 在申请开票前登记付款条件达成；本段可按日期或里程碑重入，不作门}
      value_item: 客户取得与约定一致的合规发票。
      notes: 红冲（OBJ-83「红冲确认中 / 部分红冲 / 全额红冲」）后在本段重入。
    - id: VS-04.4
      order: 5
      name: 回收款项
      capabilities: [CAP-103]
      description: 由发票形成应收，跟踪账龄与催收，认领收款并核销。
      participants: [SH-E6, SH-E2, SH-C6d, SH-X7, SH-P5]
      entry:
        all:
          - {ref: OBJ-85, state: 未结 / 已部分结清 / 争议, note: 应收方向；部分收款后、争议时重入（STEP3 C-09）}
      exit:
        any:
          - all:
              - {ref: OBJ-85, state: 已结清}
              - {ref: OBJ-86, state: 已分配, note: 收方向}
          - {ref: OBJ-85, state: 已核销（坏账）, note: 坏账核销没有收款，原写法要求同时「已分配」，改为两路之一（STEP3 C-09）}
      value_item: 客户付款被准确认领与核对。
      in_stage_states:
        - {ref: 派生, state: 质保金到期可收, note: 质保金类型应收（OBJ-85「未结」）按到期日在读模型派生的提示，不是对象状态，不作门，不重入 VS-04.5（STEP3 C-10 改）}
      notes: 质保金类型应收（OBJ-85 类型「质保金」，状态「未结」）已被本段进入条件覆盖，到期收回在本段完成；预收款（OBJ-85 类型「预收」）可先于第 2、3 段，之后核销时重入；争议（OBJ-85「争议」）回到本段。 法律纠纷不新增对象（用户答复 Q-E 第 2 项选 b，intent 2026-10-16-090004）：往来款项（OBJ-85）「争议」状态加处置分类「诉讼」，起诉状、判决书、律师函作证据（OBJ-53）类型，案件过程线下。商业汇票不单独成对象：收款方式「商票」（OBJ-86 方式）带到期日与兑付状态（收到 → 已兑付 / 已逾期），属资金收付属性，不作本段门。
    - id: VS-04.5
      order: 6
      name: 确认最终价款
      capabilities: [CAP-005]
      description: 竣工或协议完成后编制结算书、双方确认最终价款；质保金收回归回款段（VS-04.4）。
      # SD-12（用户 2026-10-17 ANM 批准）
      participants: [SH-E2, SH-E6, SH-C6c, SH-X4, SH-C6a, SH-E5, SH-M1]
      entry:
