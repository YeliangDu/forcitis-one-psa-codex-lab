    - {ref: OBJ-92, state: 已申报 → 已缴款, note: 本期适用的个税及社保公积金申报缴款完成，与 VS-13.4 退出一致；不能代替薪酬实付}
    - {ref: OBJ-56, state: 已离职, note: 劳动关系最终结束的结局，与正常月度循环分别记录}
