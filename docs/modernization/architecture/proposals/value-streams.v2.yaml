          - {ref: OBJ-112, state: 已决议 → 已支付}
      in_stage_states:
        - {ref: OBJ-112, state: 已部分支付}
        - {ref: OBJ-92, state: 已申报 / 已缴款, note: CON-1017-ARC-10 S-9：PRC-113 股息红利个税并入扣缴申报，随利润分配发生，归段保留；不作门}
      value_item: 股东和合伙人取得回报。
      notes: 分配额不得超过所属年度已关账的可分配利润（INV-117）；部分支付时停在「部分支付」，后续支付重入本段；自然人股东的股息红利个税经 OBJ-92 个税扣缴类型申报（VS-13.4 同一对象类型分工，不另设门）。
