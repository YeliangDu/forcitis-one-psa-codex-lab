      inputs:
        - {ref: OBJ-73, state: 已过账}
        - {ref: OBJ-97, state: 已开放}
      outputs:
        - {ref: OBJ-98, state: 已记账（不可逆）, note: 成本结转类型分录}
    - name: 期末结转
      description: 期末结转前置检查与结转分录。
      inputs:
        - {ref: OBJ-97, state: 已开放}
        - {ref: OBJ-93, state: 在用 / 已闲置, note: 折旧与摊销按期计提（STEP3 C-16）}
      outputs:
        - {ref: OBJ-98, state: 已记账（不可逆）, note: 期末结转类型分录}
    - name: 对账与报表编制
      description: 收付口径与外部法定账对账，出具三大报表与经营月报；报表、经营月报、对账差异记录是单据，不是对象状态（用户答复 Q-B 选 a，intent 2026-10-16-082311）。
      inputs:
        - {ref: OBJ-97, state: 已关账}
  stages:
    # SD-11（用户 2026-10-17 ANM 批准）
    - id: VS-10.0
      order: 1
      name: 执行记账结转
      capabilities: [CAP-103]
      description: 在开放期间内过账业务事实、生成会计分录、处理受控手工凭证，分配人工成本、分摊间接成本、计提折旧并完成期末结转；处置待处理队列、过账拒收记录与勾稽差异案。
      participants: [SH-E6, SH-M1]
      entry:
        all:
          - {ref: OBJ-97, state: 已开放}
      exit:
        all:
          - {ref: OBJ-98, state: 已记账（不可逆）, note: 本期间期末结转、成本结转与手工调整类型分录}
          - {ref: 缺对象状态, state: 会计分录待处理队列已清空、过账拒收记录已处置, gap: MS-21, note: PRC-135、PRC-158、PRC-169；指无待处理队列、无未处置拒收记录或未结差异案，信息图无对应对象状态}
      in_stage_states:
