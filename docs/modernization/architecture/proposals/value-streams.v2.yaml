          - {ref: 缺对象状态, state: 三大报表已出具, gap: MS-19, note: 流程 PRC-106 出具三大报表（读模型）；SD-05 用户裁定的退出条件保留，对账部分已改指 OBJ-125}
      value_item: 管理层与股东拿到可勾稽的期间报告。
      # SD-11（用户 2026-10-17 ANM 批准）
      notes: 关账与记账两项由退出移到进入条件，退出改为「三大报表已出具、对账已完成」（SD-05 用户裁定 2026-10-16）。用户答复 Q-B 选 a（intent 2026-10-16-082311）：门只用对象状态，原定为期间关账、报表发布两段，本次 SD-11 增补 VS-10.0 期间内记账与结转；贯穿活动保留来源与产出说明，非对象的清理条件另列 MS-21；MS-08、MS-09 消除。

