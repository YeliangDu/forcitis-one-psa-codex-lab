      value_item: 薪酬结果准确并经批准。
    - id: VS-13.4
      order: 4
      name: 完成个税及社保公积金申报缴纳
      capabilities: [CAP-054, CAP-056, CAP-103]
      description: "准备个税及社保公积金申报资料；正式个税申报逐薪酬行关联实际支付、扣缴事实与申报所属期，申报后缴库并登记金额、日期及回执。社保、公积金按各自义务所属期办理申报缴款，不以薪酬批准月份代替所得实际支付及扣缴月份。依据 R1-B-28、IIT#扣缴义务人 / 扣缴缴库期限 / 全员全额报送内容。"
      participants: [SH-E6, SH-R2]
      entry:
        all:
          - {ref: OBJ-73, state: 已批准 / 已发放 / 已过账, note: 申报常在发放后，只写「已批准」会误报（STEP3 C-19）}
          - {ref: OBJ-92, state: 待申报, note: 个税扣缴、社保公积金类型（与 VS-06.1 对称，STEP3 C-19）}
      exit:
