# 价值流第 2 版（提议稿，METHOD 第 4 稿第 ① 步；待用户确认；不改现行 togaf/value-streams.yaml）
# 说明与差距表、覆盖矩阵、共享对象依赖表、需用户定的点见同目录 STEP1_VALUE_STREAMS.md；评审意见处理记录在该文末。
# 结构依据：G178 §2.1 价值流四要素（名称、描述、触发干系人、价值）、§2.2 阶段六要素（名称、描述、参与干系人、进入条件、退出条件、价值项）（2026-10-16 对照本地原文核对）；
#   G178 与 BIZBOK 冲突按 BIZBOK（intent 2026-10-15-222350）：阶段可回退、跳过、重入；不拆子价值流；进出条件写对象状态；价值流之间只经共享对象状态相互影响（BIZBOK 第 157 页）。
# 业务内容：手册交付七段即「获得交付成果」的阶段，门按对象状态重写，工作子阶段不升格（intent 2026-10-16-072440 M-6）；BD0、BD1 是商机的阶段（STAGE_TYPES_DRAFT §3.1）。
# 已定口径：门只预警留痕，需审定的门走审批、审批未完成不挡下一阶段；对象自身的不变量照常拒绝（intent 061232 S2）；阶段与商务分界脱开（S3）；阶段 ≠ 状态机（METHOD J3）；
#   视为同意的期满判定放 receivables.wip，交付侧只记送达与无异议声明（D-8，intent 061232）。
# 条件写法：ref 指信息图 ENTERPRISE_INFO_MAP_DRAFT.md 的 OBJ 编号，state 取该对象「关键状态」列的原值；
#   all = 全部满足，any = 至少一项满足，可嵌套；pattern 引用本价值流 stage_pattern 的条件，与同处的 all / any 再取「且」；
#   指不到对象状态的写 ref: 缺对象状态 + gap 编号（见文末 missing_states，第 ② 步回补输入）；
#   对象状态有冲突或待定的另加 caveat（见文末 state_caveats）；ref: 派生 表示读模型派生的段内状态，不是对象状态，不作门。
# 门只引用对象状态：运行单据、报表、对账等非对象事实不作门（评审 B3）；对应的工作写在 cross_stage_activities。
# 跨价值流关系不手写：脚本 vs_links_gen.py 从本文件各段条件生成「对象状态 → 引用它的阶段」共享依赖表（写入 STEP1 第 3.3 节）。
# 能力字段已去掉：能力图按第 ② 步重建后，在第 ③ 步做能力—阶段对账（METHOD 第 4 稿 ③-2）。
# 编号：VS-13 由原 VS-07 拆出，编号不重排，以免评审意见引用失效。

meta:
  version: 2
  status: proposal
  date: "2026-10-16"
  step: "METHOD 第 4 稿第 ①（价值流骨架）；阶段进出条件经第 ③ 步复核（proposals/STEP3_STAGES.md，修正标 STEP3 C-xx）"
  supersedes_on_adoption: togaf/value-streams.yaml
  sources:
    stakeholders: proposals/STAKEHOLDERS.md（用户指定，intent 2026-10-15-213742）
    objects: proposals/ENTERPRISE_INFO_MAP_DRAFT.md（OBJ-01–OBJ-112；OBJ-111、OBJ-112 为第 ② 步回补新增，intent 2026-10-16-082311）
    aggregates: proposals/ENTERPRISE_AGGREGATES_DRAFT.md §4.3–§4.3.4（收入链与三条价值流走查）
    stage_types: proposals/STAGE_TYPES_DRAFT.md（S1–S6 用户已定）
    bizbok: BIZBOK v11 第 157–158 页（价值流互相独立、只经共享对象状态相互影响；触发者与价值各异者各自成流；触发干系人可为多个）；第 151 页（价值流、能力、信息、组织是并列的架构域）
  common_rules:
    - 阶段可回退、跳过、重入，留痕（谁、何时、原因）；G178「上一阶段退出即下一阶段进入」不用。
    - 门只预警留痕；拒绝只来自对象自身的不变量（第 ④ 步），不是阶段门。
    - 不拆子价值流；价值流不触发、不指向其他价值流，只因共享同一对象的状态而相互影响（BIZBOK 第 157 页）。
    - 门只引用对象状态；运行单据、报表、对账不是对象状态，不作门，其工作列为贯穿活动。
    - 阶段内的人工步骤、审批、退回属业务流程（第 ⑥a 步），与阶段多对多，不在此展开。

