      participants: [SH-E3, SH-E1, SH-E6]
      entry:
        all:
          - {ref: OBJ-56, state: 试用期 / 正式 / 待离职, note: 离职当月仍须确认考勤（STEP3 C-17）}
          - {ref: OBJ-28, state: 已维护}
      exit:
