        - {ref: OBJ-93, state: 在用 / 已闲置 / 处置, note: CON-1017-ARC-13：PRC-99 计提折旧并处置公司资产（本段）；折旧与处置损益过账，只记录、不作门}
      value_item: 期间业务与调整已记账，成本与损益已结转，关账前待处理事项已清理。
      notes: 期间内记账与结转（finance STAGES.md ST-3）；承载 PRC-92–96、PRC-98、PRC-99、PRC-135、PRC-158、PRC-169。对象状态取 OBJ-97、OBJ-98 原值，队列与处置记录以 MS-21 保留缺口；原贯穿活动保留来源与产出说明。
    - id: VS-10.1
      # SD-11（用户 2026-10-17 ANM 批准）
      order: 2
      name: 关闭会计期间
      capabilities: [CAP-103]
