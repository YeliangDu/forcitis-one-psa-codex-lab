          - {ref: OBJ-111, state: 已锁定}
          - {ref: OBJ-68, state: 已批准 / 已销假, note: 当月请假已汇入}
          - {ref: OBJ-72, state: 已批准 / 已补偿, note: 当月加班已汇入；「已补偿」由月度考勤确认事件触发，可与锁定同时发生（STEP3 C-17）}
      value_item: 员工确认当月出勤，作为计薪依据。
      notes: 锁定后的变动计入下月并标原月份，不重开当月（INV-105）；月度考勤确认经第 ② 步回补为信息图 OBJ-111（人员的次级），MS-01 消除。
    - id: VS-13.2
      order: 2
