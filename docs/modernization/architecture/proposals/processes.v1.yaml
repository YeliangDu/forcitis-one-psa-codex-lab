      - {actor: 财务, command: 停用供应商角色, aggregate: AGG-01, branch: 停用, emits: [角色已停用]}
    notes: 未合格或已停用的供应商不得签分包、采购协议或付款（INV-04）；资质到期见「年检、核查与延续企业资质」。

  - id: PRC-70
    name: 起草并生效供方协议
