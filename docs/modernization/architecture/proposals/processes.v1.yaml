    stages: [VS-05.1]
    owner_bc: B-01
    human_orchestration: true
    human_note: 申请 → 评审 → 合格，暂停或停用须原因
    steps:
      - {actor: 项目经理, command: 申请供应商角色, aggregate: AGG-01}
      - {actor: 财务, command: 登记资质证书, aggregate: AGG-02}
