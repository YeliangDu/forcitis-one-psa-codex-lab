# 无需系统支持的阶段：无。51 个阶段都至少被一个流程覆盖；其中 VS-02.1 概念、VS-02.5 招采的专业工作在系统外，
# 系统只经贯穿流程（编制 / 评审 / 签发交付物、送达与客户认可、阶段与工作包推进、阶段门预警）登记交付物与阶段进度。
stages_without_process: []

gaps:
  - id: G-01
    kind: 缺命令
    severity: 高
    title: 聚合稿 §2.2 没有命令列，命令名无登记处
    detail: 聚合表每个聚合只有事件列；命令只在 §2.3、§4.3、§4.6 零散出现。本稿 named 为 true 的命令是字面出现者，其余由事件、状态序列或不变量反推，措辞待统一。一个步骤只改一个聚合、EventCatalogueTest 与 ⑥b 的「每个改变状态的步骤对应一个命令」都需要命令清单。
    back_to: 第 ④ 步（交付物增一列「命令 → 发出的事件 → 前置不变量」）
    change: 全部聚合
    flows: []
  - id: G-02
    kind: 缺依赖边
    severity: 高
    title: 含「审批」状态的聚合没有写 platform.approval 依赖
    detail: 'AGG-55、39、53、70、72、73、98 已写 platform.approval（api），下列聚合的信息图状态含审批 / 批准却没有：AGG-12 报价（草拟 → 审批中 → 已通过）、AGG-13 协议（审批中，合同评审）、AGG-15 协议变更、AGG-17 风险交付授权（申请 → 批准）、AGG-22 项目预算（审批中）、AGG-45 开票申请（审批中）、AGG-59 费用报销（审批中）、AGG-75 激励方案、AGG-79 经营计划（审批）、AGG-05 费率表与 AGG-40 分摊规则（草拟 → 已批准）。二选一：① 引用列补 platform.approval（api），新增 B-02、B-03、B-04、B-05、B-07、B-08、B-12、B-18 到 platform.approval 的边（platform.approval 只依赖人员组织、工作日历与平台，按 §4.3.4 的论证不成环，但 B-18 等层位会变，本稿未改聚合稿故未重跑 aggregates_dep_check.py）；② 像 AGG-65 那样把批准写成本聚合的命令。AGG-26 资源分配的部门负责人审批、AGG-21 交付计划对客批准是否走审批流也一并确定。'
