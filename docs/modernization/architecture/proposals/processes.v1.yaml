      - {actor: 出纳, command: 登记付款失败, aggregate: AGG-53, branch: 退票, emits: [付款已失败], inner: [{command: 释放核销占用, aggregate: AGG-52}]}
      - {actor: 系统策略, command: 核销应付, aggregate: AGG-52, emits: [应付已核销, 应付已结清], desc: 订阅付款已成功，把占用转为核销（R-03）}
      - {actor: 系统策略, command: 置付款已核销, aggregate: AGG-53, desc: 订阅应付已核销}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-53, named: true, calls: PRC-92}
