      - {actor: 用人经理, command: 记录面试, aggregate: AGG-62}
      - {actor: 用人经理, command: 作出录用决定, aggregate: AGG-62}
      - {actor: 用人经理, command: 标记未录用, aggregate: AGG-62, branch: 未录用}
