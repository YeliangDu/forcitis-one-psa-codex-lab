# 全企业业务流程清单第 1 版（提议稿，METHOD 第 4 稿第 ⑥a 步；待用户确认；不进 SSOT）
# 说明、分组表、gaps 与待交 one-glossary 用语见同目录 STEP6A_PROCESSES.md；校验与计数由 processes_check.py 输出。
# 输入：value-streams.v2.yaml（13 条价值流、51 个阶段）；ENTERPRISE_AGGREGATES_DRAFT.md §2.2（聚合、事件、订阅方）、§2.3、§4.1、§4.3、§4.6；STEP3_STAGES.md §4（R-01–R-12）。
# 只列清单，不画 BPMN；人工编排流程（human_orchestration: true）留给 ⑥b 画图。
#
# 字段约定
#   trigger.type：event（领域事件 + 发布聚合）、time（定时）、human（人工发起）、call（被其他流程的步骤调用）
#   steps：有序；每步 actor（人工角色或系统策略）+ command + aggregate + emits（事件，须取自聚合稿 §2.2 该聚合的事件列）
#     read: true            只读步骤，不需命令；reads 列出读取的聚合（方向须与 §4.1 依赖边一致）
#     platform_task: true   平台已建模块上的人工任务（审批、身份），不是企业聚合；service 写模块名
#     named: true           命令名在聚合稿（§2.3、§4.3、§4.6 等）中字面出现；缺省为本稿由事件、状态、不变量反推的命令名（见 gaps G-01）
#     branch                同一位置的分支（不是顺序下一步）
#     inner                 同一命令内部再改另一个聚合（两次事务各改一个聚合），方向按主聚合所在 BC 检查
#     also + c_exception    ADR 认可的多聚合同事务（C 类），只有开票 / 红冲（INV-73）
#     calls                 本步之后调用另一个流程
#     gap                   本步受某条 gaps 影响
#   human_orchestration：含需流程引擎调度的人工任务（审批、评审、客户或外部回复、超时、退回重做）；单纯的人工录入不算
#   owner_bc：编排所在 BC 或流程模块；步骤涉及的聚合须在 owner_bc 自身或其上游（§4.1，下游调上游）

meta:
  version: 1
  status: proposal
  date: "2026-10-16"
  step: METHOD 第 4 稿第 ⑥a（全企业业务流程清单）
  sources:
    stages: proposals/value-streams.v2.yaml
    aggregates: proposals/ENTERPRISE_AGGREGATES_DRAFT.md
    stage_review: proposals/STEP3_STAGES.md
  check: python3 -I docs/modernization/architecture/proposals/processes_check.py

processes:

  # ───────────── VS-01 选定服务方 ─────────────
  - id: PRC-01
    name: 举办市场活动
    trigger: {type: human, desc: 市场部立项并开展活动}
    stages: [VS-01.1]
    owner_bc: B-03
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, command: 开展市场活动, aggregate: AGG-08}
      - {actor: 市场和客户经理, command: 结束市场活动, aggregate: AGG-08, emits: [市场活动已结束]}
    notes: 活动产生的线索由「登记并跟进线索」承接，活动对象只在线索上留来源引用。

  - id: PRC-02
    name: 计划并完成客户活动
    trigger: {type: human, desc: 客户经理为拜访或跟进排计划}
    stages: [VS-01.1]
    owner_bc: B-03
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, command: 计划客户活动, aggregate: AGG-102, emits: [客户活动已计划]}
      - {actor: 市场和客户经理, command: 变更客户活动, aggregate: AGG-102, branch: 变更, emits: [客户活动已变更]}
      - {actor: 市场和客户经理, command: 完成客户活动, aggregate: AGG-102, emits: [客户活动已完成], desc: 须填结果反馈（INV-110）}
      - {actor: 市场和客户经理, command: 取消客户活动, aggregate: AGG-102, branch: 取消, emits: [客户活动已取消]}
      - {actor: 系统策略, read: true, reads: [AGG-102], desc: P-47 计划日期已过仍未反馈则提醒}
    notes: 完成事件供 reporting 算拜访量与计划完成率。

  - id: PRC-03
    name: 登记并跟进线索
    trigger: {type: human, desc: 客户来询、转介绍或市场活动产生线索}
    stages: [VS-01.1]
    owner_bc: B-03
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, read: true, reads: [AGG-01, AGG-08], desc: 关联往来单位（可无）与市场活动}
      - {actor: 市场和客户经理, command: 登记线索, aggregate: AGG-09}
      - {actor: 市场和客户经理, command: 认领线索, aggregate: AGG-09}
      - {actor: 市场和客户经理, command: 确认线索, aggregate: AGG-09, emits: [线索已确认], desc: 门 = 线索已确认}
      - {actor: 市场和客户经理, command: 关闭线索, aggregate: AGG-09, branch: 无价值, emits: [线索已关闭], desc: 须填原因（INV-24）}
    notes: 线索挂起与恢复属线索自身状态转换，未单列步骤。

  - id: PRC-04
    name: 线索转为商机
    trigger: {type: human, desc: 线索已确认后由客户经理新建商机（门 = 线索已确认 → 商机新建）}
    stages: [VS-01.1, VS-01.2]
    owner_bc: B-03
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, command: 新建商机, aggregate: AGG-10, desc: 须有正式往来单位与唯一负责人（INV-25、26）}
    notes: 线索可跳过（客户直接邀标或委托时从商机开始）；「线索已确认」事件在聚合稿订阅方为「暂无」，故触发写人工发起。

  - id: PRC-05
    name: 维护往来单位档案
    trigger: {type: human, desc: 业务人员登记新客户或供方，或档案信息变更}
    stages: [VS-01.1, VS-05.1]
    owner_bc: B-01
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, command: 登记往来单位, aggregate: AGG-01, emits: [往来单位已登记]}
      - {actor: 财务, command: 变更银行账户, aggregate: AGG-01, emits: [银行账户已变更], desc: 订阅方 B-10 付款写入前做 P-01 预警}
      - {actor: 财务, command: 合并往来单位, aggregate: AGG-01, branch: 合并, emits: [往来单位已合并]}
      - {actor: 财务, command: 停用往来单位, aggregate: AGG-01, branch: 停用, emits: [往来单位已停用]}
    notes: 主数据维护，单聚合；列入清单是为了覆盖阶段 VS-01.1 的往来单位引用与 VS-05.1 的准入前置。

  - id: PRC-06
    name: 做独立性检查
    trigger: {type: human, desc: 我方为 IDI 风险管理机构时，商机进入跟进后发起}
    stages: [VS-01.2]
    owner_bc: B-03
    human_orchestration: true
    human_note: 有冲突时须取得并登记书面同意，可能等待或退回
    steps:
      - {actor: 市场和客户经理, read: true, reads: [AGG-33], desc: 读建设工程与我方参与记录}
      - {actor: 技术专家, command: 登记独立性检查结论, aggregate: AGG-18, emits: [独立性检查已有结论]}
    notes: 签约时读检查结论拦截（INV-33）见「起草、评审并回签协议」。

  - id: PRC-07
    name: 编制并生效报价
    trigger: {type: human, desc: 商机跟进中，客户询价或邀标}
    stages: [VS-01.2]
    owner_bc: B-03
    human_orchestration: true
    human_note: 报价评审（草拟 → 审批中 → 已通过 / 驳回）
    steps:
      - {actor: 市场和客户经理, read: true, reads: [AGG-05, AGG-06, AGG-07], desc: 读费率、系数与协议价目的生效版本（INV-32）}
      - {actor: 市场和客户经理, command: 编制报价版本, aggregate: AGG-12}
      - {actor: 项目总监, platform_task: true, service: platform.approval, command: 报价评审, gap: G-02}
      - {actor: 市场和客户经理, command: 生效报价版本, aggregate: AGG-12, named: true, emits: [报价版本已生效, 报价版本已被取代], desc: 旧版同事务被取代（INV-30）}
    notes: 报价被取代、投标被撤回时在本段内重入。

  - id: PRC-08
    name: 参加投标
    trigger: {type: human, desc: 收到邀标或招标公告}
    stages: [VS-01.2]
    owner_bc: B-03
    human_orchestration: true
    human_note: 截止时间、开标公示等外部等待，可撤回或撤销
    steps:
      - {actor: 市场和客户经理, read: true, reads: [REF-01, AGG-01], desc: 读招标项目登记与联合体成员}
      - {actor: 市场和客户经理, command: 登记资格预审结果, aggregate: AGG-11}
      - {actor: 市场和客户经理, command: 递交投标, aggregate: AGG-11, named: true, emits: [投标已递交], desc: 携承诺快照}
      - {actor: 市场和客户经理, command: 撤回或撤销投标, aggregate: AGG-11, branch: 撤回, emits: [投标已撤销]}
      - {actor: 市场和客户经理, command: 登记中标, aggregate: AGG-11, named: true, emits: [投标已中标]}
      - {actor: 市场和客户经理, command: 登记未中标, aggregate: AGG-11, branch: 未中标, emits: [投标未中标]}
      - {actor: 系统策略, read: true, reads: [AGG-11], desc: P-13 投标截止临近提醒}
    notes: 联合体协议作投标的次级对象，不放合同。

  - id: PRC-09
    name: 商机赢单或丢单
    trigger:
      type: event
      events: [{event: 投标已中标, aggregate: AGG-11}]
      desc: 同 BC 内联动；直接委托时由客户经理凭委托证据人工发起
    stages: [VS-01.2]
    owner_bc: B-03
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 商机赢单, aggregate: AGG-10, named: true, emits: [OpportunityAccepted], desc: 须中标或委托证据（INV-27）}
      - {actor: 市场和客户经理, command: 登记商机丢单, aggregate: AGG-10, branch: 丢单, emits: [商机已丢单]}
      - {actor: 市场和客户经理, command: 放弃商机, aggregate: AGG-10, branch: 放弃, emits: [商机已放弃]}
    notes: OpportunityAccepted 的订阅方 B-07（售前投入转入，P-43）；项目由项目经理人工建立。

  - id: PRC-10
    name: 收付保证金与保函
    trigger: {type: human, desc: 投标、履约或质保需缴纳或收取保证金、开立保函}
    stages: [VS-01.2, VS-04.1]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 出纳, command: 登记保证金缴纳, aggregate: AGG-51, emits: [保证金已缴]}
      - {actor: 出纳, command: 退还保证金, aggregate: AGG-51, emits: [保证金已退]}
      - {actor: 出纳, command: 没收保证金, aggregate: AGG-51, branch: 没收, emits: [保证金已没收]}
      - {actor: 出纳, command: 登记保函到期或索赔, aggregate: AGG-51, branch: 保函, emits: [保函已到期]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-51, named: true, calls: PRC-92}
    notes: 退还与没收互斥各只一次（INV-20）；P-10 保证金比例与退还时限为判定加提醒。

  - id: PRC-11
    name: 投标未中标后退还保证金
    trigger:
      type: event
      events: [{event: 投标未中标, aggregate: AGG-11}]
    stages: [VS-01.2]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 退还保证金, aggregate: AGG-51, emits: [保证金已退], desc: 签约后 5 日未退为 P-10 提醒}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-51, named: true, calls: PRC-92}
    notes: 订阅关系 B-09 → B-03（api、事件）已有。

  - id: PRC-12
    name: 发布服务产品与阶段类型版本
    trigger: {type: human, desc: 目录管理员发布新版本}
    stages: [VS-01.2, VS-02.0]
    owner_bc: B-02
    human_orchestration: false
    steps:
      - {actor: 技术专家, command: 发布服务产品版本, aggregate: AGG-03, emits: [服务产品版本已发布]}
      - {actor: 技术专家, command: 发布阶段类型版本, aggregate: AGG-04, emits: [阶段类型版本已发布]}
    notes: 被引用版本不可改，只增版本（INV-34）。

  - id: PRC-13
    name: 批准并生效费率、计费系数与协议价目版本
    trigger: {type: human, desc: 财务或经营管理发起新费率、系数或协议价目版本}
    stages: [VS-01.2, VS-02.0]
    owner_bc: B-02
    human_orchestration: true
    human_note: 草拟 → 已批准 → 生效，批准环节须财务审定
    steps:
      - {actor: 财务, command: 批准费率版本, aggregate: AGG-05, gap: G-02}
      - {actor: 财务, command: 生效费率版本, aggregate: AGG-05, emits: [费率版本已生效, 费率版本已被取代]}
      - {actor: 财务, command: 生效计费系数版本, aggregate: AGG-06, emits: [计费系数版本已生效], desc: 粒度待定 Q18}
      - {actor: 市场和客户经理, command: 生效协议价目版本, aggregate: AGG-07, emits: [协议价目版本已生效]}
    notes: 报价与项目预算读取这些版本（INV-32、INV-44）。

  - id: PRC-14
    name: 登记建设工程与招标项目
    trigger: {type: human, desc: 客户经理或项目经理登记受检对象或招标信息}
    stages: [VS-01.2, VS-02.6, VS-03.1]
    owner_bc: B-01
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, command: 登记建设工程, aggregate: AGG-33, emits: [建设工程已登记]}
      - {actor: 市场和客户经理, command: 登记招标项目, aggregate: REF-01, gap: G-06}
      - {actor: 市场和客户经理, command: 更新外部状态, aggregate: AGG-33, desc: 只记录并带登记日期与来源（R-08）}
    notes: 外部引用对象只记录、不控制，不作阶段门。

  - id: PRC-15
    name: 未签约的售前投入转费用
    trigger:
      type: event
      events: [{event: 商机已丢单, aggregate: AGG-10}, {event: 商机已放弃, aggregate: AGG-10}]
      desc: 另有定时分支：超过 N 个月未签约转费用
    stages: [VS-01.2]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 售前投入转费用, aggregate: AGG-43, emits: [成本结转已过账]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-43, named: true, calls: PRC-92}
    notes: P-43。

  - id: PRC-16
    name: 申请并转正风险交付授权
    trigger: {type: human, desc: 签约前需先行投入，项目经理申请授权}
    stages: [VS-01.2, VS-02.0, VS-04.1]
    owner_bc: B-05
    human_orchestration: true
    human_note: 申请 → 批准 → 转正或叫停
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-10, AGG-19, AGG-38], desc: 读商机、项目与依据证据}
      - {actor: 项目经理, command: 申请风险交付授权, aggregate: AGG-17}
      - {actor: 管理层, platform_task: true, service: platform.approval, command: 授权审批, gap: G-02}
      - {actor: 管理层, command: 批准风险交付授权, aggregate: AGG-17, emits: [风险交付授权已批准]}
      - {actor: 商务, command: 转正风险交付授权, aggregate: AGG-17, branch: 转正, emits: [Regularized], desc: 并入协议；转正与叫停互斥（INV-19）}
      - {actor: 管理层, command: 叫停风险交付授权, aggregate: AGG-17, branch: 叫停, emits: [Halted]}
    notes: 口径与转正时点待流程梳理（C-56）。


  # ───────────── VS-02 获得交付成果 ─────────────
  - id: PRC-17
    name: 建立项目并组建团队
    trigger: {type: human, desc: 项目经理在商机赢单或先行投入批准后发起}
    stages: [VS-02.0]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-10, AGG-33], desc: 读来源商机与建设工程}
      - {actor: 项目经理, command: 建立项目, aggregate: AGG-19, named: true, emits: [项目已建立], desc: 项目可先于合同}
      - {actor: 项目经理, command: 登记我方参与记录, aggregate: AGG-33, desc: 随 D-4 b 由交付登记}
      - {actor: 项目经理, command: 建立项目 WBS, aggregate: AGG-20, desc: 每项目一棵，阶段按协议范围裁剪}
      - {actor: 项目经理, command: 维护项目团队成员, aggregate: AGG-24, gap: G-14}
    notes: 项目已建立的订阅方 B-07（售前投入转入，P-43）；项目建立前置（赢单或先行投入授权）见 G-13。

  - id: PRC-18
    name: 编制并批准交付计划
    trigger: {type: human, desc: 项目启动后编制}
    stages: [VS-02.0]
    owner_bc: B-04
    human_orchestration: true
    human_note: 对客批准需发包人审核，5 天未审核视为同意（P-17）
    steps:
      - {actor: 项目经理, command: 编制交付计划版本, aggregate: AGG-21}
      - {actor: 项目经理, command: 批准交付计划, aggregate: AGG-21, emits: [交付计划已批准], desc: 对客批准或内部锁定}
      - {actor: 系统策略, read: true, reads: [AGG-21], desc: P-17 发包人 5 天未审核提醒}
    notes: 里程碑认可事件随 Q21 待定（见 G-14）。

  - id: PRC-19
    name: 编制并锁定项目预算
    trigger: {type: human, desc: 项目启动后编制成本基线}
    stages: [VS-02.0]
    owner_bc: B-04
    human_orchestration: true
    human_note: 编制中 → 审批中 → 已锁定
    steps:
      - {actor: 项目经理, read: true, reads: [AGG-05, AGG-12], desc: 读费率版本与赢单报价版本（P-18 毛利预警）}
      - {actor: 项目经理, command: 编制项目预算版本, aggregate: AGG-22}
      - {actor: 项目总监, platform_task: true, service: platform.approval, command: 项目预算审批, gap: G-02}
      - {actor: 项目经理, command: 锁定项目预算, aggregate: AGG-22, emits: [项目预算已锁定]}
    notes: 锁定时冻结费率版本（INV-44）。

  - id: PRC-20
    name: 提出并满足资源需求
    trigger: {type: human, desc: 项目经理按工作包提资源需求}
    stages: [VS-02.0, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-04
    human_orchestration: true
    human_note: 部门负责人审批资源分配
    steps:
      - {actor: 项目经理, command: 提出资源需求, aggregate: AGG-25, emits: [资源需求已提出]}
      - {actor: 部门负责人, command: 确认资源分配, aggregate: AGG-26, emits: [资源分配已确认], desc: P-27 超产能写入前预警}
    notes: 具名人员、时段与工作包；审批在聚合自身状态（已计划 → 已确认），未走 platform.approval（见 G-02 待核）。

  - id: PRC-21
    name: 推进阶段与工作包
    trigger: {type: human, desc: 设计师与项目经理按工作进程更新}
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 开始阶段, aggregate: AGG-20, emits: [阶段已开始]}
      - {actor: 项目经理, command: 完成阶段, aggregate: AGG-20, emits: [阶段已完成]}
      - {actor: 项目经理, command: 锁定工作包, aggregate: AGG-20, emits: [工作包已锁定]}
      - {actor: 项目经理, command: 作废工作包, aggregate: AGG-20, branch: 作废, emits: [工作包已作废]}
    notes: 阶段节点只记工作进程，不记客户认可（§4.4.1）；工作包删除规则随 D-6。

  - id: PRC-22
    name: 阶段门预警（读模型）
    trigger:
      type: event
      events: [{event: 阶段已完成, aggregate: AGG-20}]
      desc: reporting 订阅两侧事件（交付执行的阶段进度、质量与认可的交付物状态）
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7]
    owner_bc: reporting
    human_orchestration: false
    steps:
      - {actor: reporting 读模型, read: true, reads: [AGG-20, AGG-27], desc: 合并阶段已完成与交付物已认可 / 已声明，产生门预警并留痕，不进聚合}
    notes: STEP3 R-12；门只预警不拦截（S2）。其余价值流的门预警同此模式，按阶段登记时补。

  - id: PRC-23
    name: 填报并审批工时
    trigger: {type: human, desc: 员工按日填报工时}
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7, VS-01.2, VS-03.2]
    owner_bc: B-06
    human_orchestration: true
    human_note: 提交 → 审批 → 通过 / 退回 / 驳回，可撤回
    steps:
      - {actor: 员工, read: true, reads: [AGG-62, AGG-20, AGG-10, AGG-68, AGG-108, AGG-70, AGG-72, AGG-29], desc: 读人员、工作包、日历与标准工时、请假、加班、返工认定}
      - {actor: 员工, command: 提交工时单, aggregate: AGG-39, emits: [TimesheetSubmitted]}
      - {actor: 项目经理, platform_task: true, service: platform.approval, command: 工时审批}
      - {actor: 项目经理, command: 通过工时单, aggregate: AGG-39, emits: [TimesheetApproved]}
      - {actor: 项目经理, command: 退回工时单, aggregate: AGG-39, branch: 退回, emits: [TimesheetReturned]}
      - {actor: 项目经理, command: 驳回工时单, aggregate: AGG-39, branch: 驳回, emits: [TimesheetRejected]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-39, named: true, emits: [工时已过账], calls: PRC-92}
    notes: 已建 cost.timesheet；INV-37 缺费率的工时失败并告警；售前阶段可记工时归集到商机或客户活动。

  - id: PRC-24
    name: 暂停、恢复、终止或取消项目
    trigger: {type: human, desc: 项目总监或项目经理按情形发起}
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7]
    owner_bc: B-04
    human_orchestration: true
    human_note: 终止与取消须原因，可能经审批（状态机待 Q09）
    steps:
      - {actor: 项目总监, command: 暂停项目, aggregate: AGG-19, emits: [项目已暂停]}
      - {actor: 项目总监, command: 恢复项目, aggregate: AGG-19, emits: [项目已恢复]}
      - {actor: 项目总监, command: 终止项目, aggregate: AGG-19, branch: 终止, emits: [项目已终止]}
      - {actor: 项目总监, command: 取消项目, aggregate: AGG-19, branch: 取消, emits: [项目已取消], desc: 无任何投入时}
    notes: 状态机与承担法人待 Q09、Q11（G-14）。

  - id: PRC-25
    name: 转入售前投入
    trigger:
      type: event
      events: [{event: OpportunityAccepted, aggregate: AGG-10}, {event: ContractSigned, aggregate: AGG-13}, {event: 项目已建立, aggregate: AGG-19}]
    stages: [VS-02.0, VS-04.1]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 转入售前投入, aggregate: AGG-43, emits: [成本结转已过账], desc: 赢单、回签、项目已建立后按冲销加新事实转入（P-43）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-43, named: true, calls: PRC-92}
    notes: 口径见 C-53。

  - id: PRC-26
    name: 接收并确认发包人提供资料
    trigger: {type: human, desc: 发包人提供首批或后续资料}
    stages: [VS-02.0, VS-02.2, VS-02.3, VS-02.4]
    owner_bc: B-28
    human_orchestration: true
    human_note: 确认或退回缺陷资料，逾期提醒
    steps:
      - {actor: 项目经理, command: 登记资料已提供, aggregate: AGG-32}
      - {actor: 设计师和顾问, command: 确认发包人资料, aggregate: AGG-32, emits: [发包人资料已确认]}
      - {actor: 设计师和顾问, command: 退回发包人资料, aggregate: AGG-32, branch: 有缺陷, emits: [发包人资料已退回]}
    notes: 资料不合格是设计变更与延期的起因；P-26 逾期未提供提醒。

  - id: PRC-27
    name: 登记并处置项目风险与问题
    trigger: {type: human, desc: 项目成员发现过程风险或问题}
    stages: [VS-02.0, VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-02.7]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 登记风险与问题, aggregate: AGG-104, emits: [风险与问题已登记]}
      - {actor: 项目经理, command: 记录应对措施, aggregate: AGG-104}
      - {actor: 项目经理, command: 关闭风险与问题, aggregate: AGG-104, emits: [风险与问题已关闭]}
      - {actor: 项目总监, command: 接受风险与问题, aggregate: AGG-104, branch: 接受, emits: [风险与问题已接受], desc: 须记接受人与依据（INV-113）}
    notes: 客户满意度低分经 P-45 自动登记。

  - id: PRC-28
    name: 编制、评审并签发交付物
    trigger: {type: human, desc: 设计师按工作包编制成果}
    stages: [VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-03.5]
    owner_bc: B-28
    human_orchestration: true
    human_note: 内部评审不通过须整改后复审
    steps:
      - {actor: 设计师和顾问, read: true, reads: [AGG-19, AGG-20, AGG-66], desc: 读项目、阶段与签发人执业证书（INV-47）}
      - {actor: 设计师和顾问, command: 编制交付物, aggregate: AGG-27}
      - {actor: 技术专家, command: 登记内部评审结论, aggregate: AGG-27, desc: 未通过内部评审即交付为 P-22 写入前预警}
      - {actor: 注册执业人员, command: 签发交付物, aggregate: AGG-27, emits: [交付物已签发]}
    notes: 检查报告走同一流程（INV-51 同 BC 前置读不符合项）；已发布版本不可改，只出新版本（INV-46）。

  - id: PRC-29
    name: 送达交付物并登记客户认可
    trigger: {type: human, desc: 项目经理向客户送达交付物}
    stages: [VS-02.1, VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6, VS-03.5]
    owner_bc: B-28
    human_orchestration: true
    human_note: 客户审查期、退回修改、轮次与书面声明
    steps:
      - {actor: 项目经理, command: 登记提交轮次送达, aggregate: AGG-27, named: true, emits: [交付物已送达]}
      - {actor: 项目经理, command: 登记客户认可, aggregate: AGG-27, named: true, emits: [交付物已认可], desc: 有阻断性不符合项时拒绝（INV-48）}
      - {actor: 项目经理, command: 登记客户退回, aggregate: AGG-27, branch: 退回, emits: [AcceptanceReturned], desc: 轮次加 1}
      - {actor: 项目经理, command: 登记客户无异议声明, aggregate: AGG-27, named: true, branch: 书面声明, emits: [无异议已声明]}
    notes: 交付侧不判断视为同意；期满判定在 B-08（D-8）。订阅方 B-08、B-05。

  - id: PRC-30
    name: 提出并批准完工估算
    trigger: {type: human, desc: 项目总监在各阶段门处更新成本}
    stages: [VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-04
    human_orchestration: true
    human_note: 提出 → 已批准 / 已驳回
    steps:
      - {actor: 项目总监, command: 提出完工估算, aggregate: AGG-23}
      - {actor: 项目总监, command: 批准完工估算, aggregate: AGG-23, emits: [完工估算已批准]}
    notes: 完工估算不用于收入确认（INV-45，依赖禁止）；P-19 EAC 超预算预警。

  - id: PRC-31
    name: 提出并发出设计变更
    trigger: {type: human, desc: 设计、发包人或现场原因引起设计变更}
    stages: [VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-28
    human_orchestration: true
    human_note: 提出 → 原因认定与影响评估 → 编制 → 内审 → 发出，可退回
    steps:
      - {actor: 设计师和顾问, command: 提出设计变更, aggregate: AGG-30}
      - {actor: 技术专家, command: 认定变更归因与影响, aggregate: AGG-30, desc: 归因必填（INV-54）}
      - {actor: 技术专家, command: 内审设计变更, aggregate: AGG-30}
      - {actor: 项目经理, command: 发出设计变更, aggregate: AGG-30, emits: [设计变更已发出]}
      - {actor: 项目经理, command: 标记待主张, aggregate: AGG-30, desc: 发包人原因且增加工作量时标待主张或写不主张理由（P-24）}
      - {actor: 项目经理, command: 关闭设计变更, aggregate: AGG-30}
    notes: 合同侧的协议变更、索赔单向引用设计变更 ID；交付不读合同。

  - id: PRC-32
    name: 申请并答复延期
    trigger: {type: human, desc: 出现影响进度的客观原因，项目经理发出延期通知}
    stages: [VS-02.2, VS-02.3, VS-02.4, VS-02.5, VS-02.6]
    owner_bc: B-04
    human_orchestration: true
    human_note: 5 天内通知、10 天内提交说明，发包人 5 天未答复视为批准
    steps:
      - {actor: 项目经理, command: 通知延期, aggregate: AGG-31}
      - {actor: 项目经理, command: 提交延期详细说明, aggregate: AGG-31}
      - {actor: 项目经理, command: 登记延期批准, aggregate: AGG-31, emits: [延期已批准]}
      - {actor: 项目经理, command: 登记延期拒绝, aggregate: AGG-31, branch: 拒绝, emits: [延期已拒绝]}
      - {actor: 系统策略, command: 登记延期视为批准, aggregate: AGG-31, branch: 超时, emits: [延期视为批准]}
    notes: P-25 期限临近提醒；合同侧协议变更、索赔引用延期申请。

  - id: PRC-33
    name: 采集、关联并封存证据
    trigger: {type: human, desc: 检查员、项目经理或设计师采集证据}
    stages: [VS-02.4, VS-02.7, VS-03.2, VS-04.2]
    owner_bc: B-28
    human_orchestration: false
    steps:
      - {actor: 设计师和顾问, command: 采集证据, aggregate: AGG-38}
      - {actor: 设计师和顾问, command: 上传证据摘要, aggregate: AGG-38}
      - {actor: 设计师和顾问, command: 关联证据, aggregate: AGG-38, desc: 挂交付物、阶段、不符合项或检查（引用方按 ID 引用证据）}
      - {actor: 项目经理, command: 封存证据, aggregate: AGG-38, emits: [证据已封存]}
      - {actor: 项目经理, command: 作废证据, aggregate: AGG-38, branch: 作废, desc: 须原因，保留原件}
    notes: 证据位置与保存期随 Q29、Q34；施工图审查意见与合格书作证据类型（R-06）。

  - id: PRC-34
    name: 处置我方成果不符合项
    trigger: {type: human, desc: 评审、检查或客户反馈发现我方成果问题}
    stages: [VS-02.6, VS-02.7]
    owner_bc: B-28
    human_orchestration: true
    human_note: 识别 → 确认 → 处置（返工或让步）→ 关闭，让步须客户书面确认
    steps:
      - {actor: 设计师和顾问, command: 登记不符合项, aggregate: AGG-28}
      - {actor: 技术专家, command: 确认不符合项, aggregate: AGG-28, emits: [不符合项已确认]}
      - {actor: 技术专家, command: 认定返工, aggregate: AGG-29, branch: 返工, emits: [返工已认定], desc: 返工工时只能由返工认定产生（INV-53）}
      - {actor: 技术专家, command: 撤销返工认定, aggregate: AGG-29, branch: 撤销, emits: [返工认定已撤销]}
      - {actor: 项目经理, command: 让步接受不符合项, aggregate: AGG-28, branch: 让步, desc: 须客户书面确认（INV-49）}
      - {actor: 技术专家, command: 关闭不符合项, aggregate: AGG-28, emits: [不符合项已关闭]}
    notes: 客户反馈的成果问题归本流程，过程问题归项目风险与问题（Q-E）。

  - id: PRC-35
    name: 项目或协议终止、结项后清算成本
    trigger:
      type: event
      events: [{event: 项目已终止, aggregate: AGG-19}, {event: 项目已取消, aggregate: AGG-19}, {event: 项目已结项, aggregate: AGG-19}, {event: 协议已终止, aggregate: AGG-13}]
    stages: [VS-02.7, VS-04.5]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 终止清算成本, aggregate: AGG-43, emits: [成本结转已过账], desc: 终止清算与超期转费用}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-43, named: true, calls: PRC-92}
    notes: 订阅关系 B-07 → B-04、B-05（事件）已有。

  - id: PRC-36
    name: 封存成果
    trigger: {type: human, desc: 项目经理收尾，结项前封存已发布交付物}
    stages: [VS-02.7]
    owner_bc: B-28
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 封存交付物, aggregate: AGG-27, emits: [交付物已封存]}
    notes: 证据封存见「采集、关联并封存证据」；结项编排读取两者已封存（INV-40 第三项）。

  - id: PRC-37
    name: 回访客户满意度
    trigger: {type: human, desc: 项目收尾，项目经理发出满意度调查}
    stages: [VS-02.7]
    owner_bc: B-28
    human_orchestration: true
    human_note: 等待客户回复，评分后跟进
    steps:
      - {actor: 项目经理, command: 发出满意度调查, aggregate: AGG-105}
      - {actor: 项目经理, command: 登记调查回收, aggregate: AGG-105}
      - {actor: 项目经理, command: 评分满意度调查, aggregate: AGG-105, emits: [满意度调查已评分]}
      - {actor: 系统策略, command: 登记风险与问题, aggregate: AGG-104, branch: 低分, emits: [风险与问题已登记], desc: P-45 低于阈值（待定）经 api 调交付执行登记命令，按调查 ID 幂等}
      - {actor: 项目经理, command: 登记满意度跟进, aggregate: AGG-105, emits: [满意度调查已跟进]}
    notes: B-28 → B-04 单向。

  - id: PRC-38
    name: 编制并发布项目复盘
    trigger: {type: human, desc: 项目进入收尾，项目经理编制复盘}
    stages: [VS-02.7]
    owner_bc: B-04
    human_orchestration: true
    human_note: 草拟 → 已评审 → 已发布，评审人意见可退回
    steps:
      - {actor: 项目经理, command: 编制项目复盘, aggregate: AGG-103}
      - {actor: 技术专家, command: 评审项目复盘, aggregate: AGG-103}
      - {actor: 项目经理, command: 发布项目复盘, aggregate: AGG-103, emits: [项目复盘已发布]}
    notes: 报价只存复盘 ID，不回读（§7 第 19 条）。

  - id: PRC-39
    name: 项目结项
    trigger: {type: human, desc: 项目经理在项目收尾时发起结项检查}
    stages: [VS-02.7]
    owner_bc: B-29
    human_orchestration: true
    human_note: 结项审批；审批通过前任一拒绝项不满足即退回
    steps:
      - {actor: 项目经理, read: true, command: 发起结项检查, reads: [AGG-27, AGG-38, AGG-44, AGG-55, AGG-39, AGG-13, AGG-17], named: true, desc: 无状态返回检查结果；拒绝项 3 条（收入覆盖、供方协议已结算或有结论、资料已封存）与预警项 2 条；检查单经 platform.audit 留痕}
      - {actor: 项目经理, platform_task: true, service: platform.approval, command: 提交结项申请, named: true, desc: 编排方实现审批钩子，提交时与审批通过时各跑一次检查}
      - {actor: 系统策略, command: 结项, aggregate: AGG-19, named: true, emits: [项目已结项], desc: 审批通过后调用，按结项申请 ID 幂等（INV-40）}
    notes: D-9 用户已定 a：无聚合的流程模块 B-29，位于 B-04、B-05、B-06、B-08、B-11、B-28 下游；收入覆盖结论载体随 Q20。

  - id: PRC-40
    name: 归档项目
    trigger: {type: human, desc: 结项后成果与证据已封存，项目经理归档}
    stages: [VS-02.7]
    owner_bc: B-04
    human_orchestration: false
    steps:
      - {actor: 项目经理, command: 归档项目, aggregate: AGG-19, emits: [项目已归档]}
    notes: 封存条件已在结项检查时核过（INV-40 第三项）。


  # ───────────── VS-03 获得风险结论 ─────────────
  - id: PRC-41
    name: 制定检查计划并到期提醒
    trigger: {type: human, desc: 协议签署生效或商机赢单后，检查负责人制定周期检查计划}
    stages: [VS-03.1]
    owner_bc: B-26
    human_orchestration: false
    steps:
      - {actor: 检查负责人, read: true, reads: [AGG-13, AGG-33], desc: 读协议与受检部位}
      - {actor: 检查负责人, command: 登记检查计划, aggregate: AGG-34, desc: 只有到期日，到期提醒是派生 / 策略（R-04）}
      - {actor: 系统策略, read: true, reads: [AGG-34], desc: P-28 到期提醒与逾期未委托提醒，由人工转线索，上游不订阅下游事件}
    notes: 人工转线索后另起「登记并跟进线索」；按周期结算用协议付款条件项。

  - id: PRC-42
    name: 发布检查表模板版本
    trigger: {type: human, desc: 检查表模板管理员发布新版本}
    stages: [VS-03.1]
    owner_bc: B-26
    human_orchestration: false
    steps:
      - {actor: 技术专家, command: 发布检查表模板版本, aggregate: AGG-36, emits: [检查表模板版本已生效]}
    notes: 被引用版本不可改（INV-34）。

  - id: PRC-43
    name: 实施现场检查并锁定
    trigger: {type: human, desc: 检查负责人安排检查并派人现场检查}
    stages: [VS-03.1, VS-03.2, VS-02.6]
    owner_bc: B-26
    human_orchestration: true
    human_note: 记录提交后审核，可退回补充
    steps:
      - {actor: 检查负责人, read: true, reads: [AGG-19, AGG-33, AGG-36, AGG-62, AGG-34], desc: 读项目、部位、模板、检查人员资质（P-29）}
      - {actor: 检查负责人, command: 安排检查, aggregate: AGG-35, desc: 已计划 → 已安排；TIS 负责人兼项限制 P-44}
      - {actor: 检查人员, command: 提交检查记录, aggregate: AGG-35, desc: 每个检查项须有结果或未检原因（INV-55）}
      - {actor: 检查负责人, command: 审核检查记录, aggregate: AGG-35}
      - {actor: 检查负责人, command: 锁定检查, aggregate: AGG-35, emits: [检查已锁定], desc: 锁定后只能追加更正}
      - {actor: 检查人员, command: 采集证据, aggregate: AGG-38, desc: B-26 → B-28 api}
    notes: 品控类服务在施工期做的检查同此流程（M-11 施工期类型）。

  - id: PRC-44
    name: 发布客户资产类不符合项并建议外部检测
    trigger: {type: human, desc: 检查锁定后，检查负责人复核发现}
    stages: [VS-03.3]
    owner_bc: B-26
    human_orchestration: true
    human_note: 复核后发布，可建议外部检测
    steps:
      - {actor: 检查人员, command: 登记不符合项, aggregate: AGG-28, desc: 经质量与认可 api 发起，来源检查 ID 只作回溯线索}
      - {actor: 检查负责人, command: 复核不符合项, aggregate: AGG-28}
      - {actor: 检查负责人, command: 发布不符合项, aggregate: AGG-28, emits: [不符合项已发布], desc: 发布前至少引用一条证据（INV-50）}
      - {actor: 检查负责人, command: 建议外部检测, aggregate: AGG-37}
    notes: R-07：不拆聚合，跨 BC 经 api 的代价由本流程体现。

  - id: PRC-45
    name: 跟踪整改并复查闭合
    trigger: {type: human, desc: 业主整改后申报，检查负责人复查}
    stages: [VS-03.4]
    owner_bc: B-26
    human_orchestration: true
    human_note: 整改申报、复查通过或回整改，反复多轮，逾期提醒（P-23）
    steps:
      - {actor: 业主代表, command: 登记整改申报, aggregate: AGG-28, desc: 整改中 → 整改已申报}
      - {actor: 检查负责人, command: 复查检查, aggregate: AGG-35, desc: 复查是一次新的检查，经本 BC 检查命令}
      - {actor: 检查负责人, command: 闭合不符合项, aggregate: AGG-28, emits: [不符合项已闭合], desc: 须引用复查或整改证据（INV-50）}
      - {actor: 检查负责人, command: 退回整改, aggregate: AGG-28, branch: 复查未通过}
      - {actor: 检查负责人, command: 登记客户接受风险, aggregate: AGG-28, branch: 客户书面接受风险}
      - {actor: 检查负责人, command: 停止跟踪不符合项, aggregate: AGG-28, branch: 不再跟踪, desc: 原因必填}
    notes: 严重等级未闭合不得签发竣工最终风险评估报告（INV-51，在交付物签发处读）。

  - id: PRC-46
    name: 采信外部检测报告
    trigger: {type: human, desc: 业主委托外部检测并取得报告}
    stages: [VS-03.4]
    owner_bc: B-26
    human_orchestration: true
    human_note: 业主委托与报告回收的外部等待
    steps:
      - {actor: 检查负责人, command: 登记业主委托外部检测, aggregate: AGG-37}
      - {actor: 检查负责人, command: 登记外部检测报告, aggregate: AGG-37}
      - {actor: 检查负责人, command: 采信外部检测报告, aggregate: AGG-37, emits: [外部检测报告已采信]}
      - {actor: 检查负责人, command: 不采信外部检测报告, aggregate: AGG-37, branch: 不采信, emits: [外部检测报告未采信], desc: 原因必填；非业主委托机构的报告为 P-30 写入前预警}
    notes: 外部检测报告只引用、不修改（INV-57）。


  # ───────────── VS-04 约定并支付服务价款 ─────────────
  - id: PRC-47
    name: 起草、评审并回签协议
    trigger: {type: human, desc: 商务在赢单或直接委托后起草项目合同或任务订单}
    stages: [VS-04.1]
    owner_bc: B-05
    human_orchestration: true
    human_note: 合同评审审批；客户回签；依法招标项目须比对中标承诺
    steps:
      - {actor: 商务, read: true, reads: [AGG-10, AGG-11, AGG-18, AGG-19, AGG-20], desc: 读商机、承诺快照、独立性检查结论、项目与 WBS 节点}
      - {actor: 商务, command: 起草协议, aggregate: AGG-13, named: true, desc: 复制承诺快照}
      - {actor: 商务, command: 登记合同—项目关联与范围挂 WBS, aggregate: AGG-13, named: true, emits: [合同—项目关联已登记]}
      - {actor: 商务, command: 登记视为同意参数与发包人代表, aggregate: AGG-13, named: true, desc: ADR-0047 第 5 条第 1 点}
      - {actor: 法务, platform_task: true, service: platform.approval, command: 合同评审, gap: G-02}
      - {actor: 商务, command: 回签, aggregate: AGG-13, named: true, emits: [ContractSigned], desc: 回签即生效；基线化前比对承诺（INV-05、07）}
    notes: 直建例外须经审批（INV-06）；订阅方 B-07、B-08。

  - id: PRC-48
    name: 提出并生效协议变更或签证
    trigger: {type: human, desc: 范围、价款、工期变化，或现场发生签证事项}
    stages: [VS-04.1]
    owner_bc: B-05
    human_orchestration: true
    human_note: 提出 → 影响评估 → 审批 → 已生效 / 驳回
    steps:
      - {actor: 商务, read: true, reads: [AGG-30, AGG-31, AGG-13], desc: 读所主张的设计变更与延期申请}
      - {actor: 商务, command: 提出协议变更, aggregate: AGG-15}
      - {actor: 商务, command: 评估变更影响, aggregate: AGG-15}
      - {actor: 项目总监, platform_task: true, service: platform.approval, command: 协议变更审批, gap: G-02}
      - {actor: 商务, command: 生效协议变更, aggregate: AGG-15, emits: [ChangeOrderApproved]}
      - {actor: 商务, command: 确认现场签证, aggregate: AGG-15, branch: 签证, emits: [SiteVisaConfirmed]}
      - {actor: 系统策略, command: 应用变更, aggregate: AGG-13, named: true, emits: [新基线已生效], desc: 按变更 ID 幂等}
    notes: 生效后只能经协议变更产生新基线（INV-07、16）；B-08 订阅新基线更新开票与收入额度。

  - id: PRC-49
    name: 提出并认定索赔
    trigger: {type: human, desc: 对方或我方出现可索赔事项，在时限内通知}
    stages: [VS-04.1, VS-04.5]
    owner_bc: B-05
    human_orchestration: true
    human_note: 已通知 → 已提交 → 已认定 / 已拒绝 / 撤回，索赔时限
    steps:
      - {actor: 商务, read: true, reads: [AGG-30, AGG-31], desc: 读所引用的设计变更与延期申请}
      - {actor: 商务, command: 提出索赔, aggregate: AGG-16, emits: [ClaimAsserted], desc: 超时限须注明理由（INV-17）}
      - {actor: 商务, command: 认定索赔, aggregate: AGG-16, emits: [ClaimSettled]}
      - {actor: 商务, command: 拒绝或撤回索赔, aggregate: AGG-16, branch: 拒绝或撤回}
    notes: P-08 索赔时限临近提醒。

  - id: PRC-50
    name: 占用框架限额并提交任务订单
    trigger: {type: human, desc: 商务按框架协议起草任务订单}
    stages: [VS-04.1]
    owner_bc: B-05
    human_orchestration: true
    human_note: 占用被拒则订单不得提交；驳回、作废、终止释放
    steps:
      - {actor: 商务, command: 占用框架限额, aggregate: AGG-14, emits: [限额已占用, 框架限额占用被拒]}
      - {actor: 商务, command: 提交任务订单, aggregate: AGG-13, named: true, desc: 引用占用 ID}
      - {actor: 系统策略, command: 释放框架限额, aggregate: AGG-14, branch: 驳回或作废, emits: [限额已释放], desc: 孤儿占用靠定时释放兜底}
    notes: P-04 回签后超额占用预警。

  - id: PRC-51
    name: 建立并更新开票与收入额度
    trigger:
      type: event
      events: [{event: ContractSigned, aggregate: AGG-13}, {event: 新基线已生效, aggregate: AGG-13}]
    stages: [VS-04.1, VS-04.3]
    owner_bc: B-08
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 更新开票与收入额度, aggregate: AGG-44, named: true, emits: [可开票额度已更新]}
    notes: 协议已终止、协议已结算的订阅反应聚合稿未写，见 G-08。

  - id: PRC-52
    name: 开放可触发收入确认的证据类型
    trigger: {type: human, desc: 审计师书面认可后，财务申请逐类开放}
    stages: [VS-04.2]
    owner_bc: B-08
    human_orchestration: true
    human_note: 批准人与依据文件
    steps:
      - {actor: 财务, command: 开放证据类型, aggregate: AGG-92, emits: [证据类型已开放]}
    notes: ADR-0047 第 4 条第 4 点；审计师认可前只有带客户签字日的客户价值确认单可触发（INV-23）。

  - id: PRC-53
    name: 确认收入
    trigger:
      type: event
      events: [{event: 交付物已认可, aggregate: AGG-27}]
    stages: [VS-04.2]
    owner_bc: B-08
    human_orchestration: false
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-13, AGG-92, AGG-38], desc: 校验证据类型已开放、须附证据齐全、发包人代表或通知联系人匹配，派生认可日}
      - {actor: 系统策略, command: 确认收入, aggregate: AGG-44, named: true, emits: [RevenueRecognized], desc: 规则层（ADR-0016 决定 4），在履约义务额度上占用}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-44, named: true, calls: PRC-92, desc: 业务日期 = 认可日}
    notes: 期间落已关账月时由期间闸门路由到开放期间并标原期间（INV-92）。

  - id: PRC-54
    name: 视为同意期满处理
    trigger:
      type: event
      events: [{event: 交付物已送达, aggregate: AGG-27}]
      desc: 按合同审查期参数与送达日算期满日，到期触发待办
    stages: [VS-04.2]
    owner_bc: B-08
    human_orchestration: true
    human_note: 期满待办、项目经理人工声明、期满前退回则取消
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-13, AGG-27], command: 计算期满日并生成待办, desc: P-21；核对期满前无退回、声明日不早于期满日}
      - {actor: 项目经理, command: 登记期满未收异议声明, aggregate: AGG-44, emits: [视为同意已成立], desc: 附函件检索记录，D-8}
      - {actor: 系统策略, command: 确认收入, aggregate: AGG-44, named: true, emits: [RevenueRecognized]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-44, named: true, calls: PRC-92}
    notes: 视为同意不自动确认收入，须人工声明（ADR-0047 第 5 条）。

  - id: PRC-55
    name: 结转合同履约成本
    trigger:
      type: event
      events: [{event: BusinessFactAttributed, aggregate: AGG-77}]
      desc: 过账事实为收入确认类型时
    stages: [VS-04.2]
    owner_bc: B-07
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 结转合同履约成本, aggregate: AGG-43, named: true, emits: [成本结转已过账], desc: 转出金额配对已确认收入（INV-88，待定 Q20）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-43, named: true, calls: PRC-92}
    notes: N-16：与收入确认同期间但不同事务。

  - id: PRC-56
    name: 付款条件项转为可结算
    trigger:
      type: event
      events: [{event: 交付物已认可, aggregate: AGG-27}]
    stages: [VS-04.3]
    owner_bc: B-05
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 标记付款条件项可结算, aggregate: AGG-13, desc: 条件状态，可开票额度的金额在 AGG-44}
    notes: STEP3 C-22 / R-02：可结算留在 B-05，由认可事件触发；B-05 → B-28 边已有。

  - id: PRC-57
    name: 申请并开具销项发票
    trigger: {type: human, desc: 项目经理或商务按付款条件提出开票}
    stages: [VS-04.3]
    owner_bc: B-08
    human_orchestration: true
    human_note: 开票申请审批、驳回、撤回；税务平台开具结果
    steps:
      - {actor: 商务, read: true, reads: [AGG-13, AGG-38], desc: 读协议付款条件项与预收证据}
      - {actor: 商务, command: 提交开票申请, aggregate: AGG-45}
      - {actor: 财务主管, platform_task: true, service: platform.approval, command: 开票申请审批, gap: G-02}
      - {actor: 财务, command: 开票申请准入, aggregate: AGG-45, named: true, emits: [InvoiceEligibilityConfirmed], desc: 协议须已生效，预收例外附委托函或中标通知书（INV-71）}
      - {actor: 财务, command: 驳回开票申请, aggregate: AGG-45, branch: 驳回, emits: [开票申请已驳回]}
      - {actor: 财务, command: 开具销项发票并改写 WIP, aggregate: AGG-46, named: true, also: [AGG-44], c_exception: INV-73, emits: [InvoiceIssued], desc: 经税务平台开具；同事务改写开票额度}
      - {actor: 财务, command: 作废开票申请, aggregate: AGG-45, branch: 作废, emits: [开票申请已作废], desc: 只发生在开具前}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-46, named: true, calls: PRC-92}
    notes: 本稿唯一的 C 类（INV-73，ADR-0016 决定 5）；P-07 付款条件到期未开票提醒。

  - id: PRC-58
    name: 红冲销项发票
    trigger: {type: human, desc: 开票有误或业务取消，财务发起红冲}
    stages: [VS-04.3]
    owner_bc: B-08
    human_orchestration: true
    human_note: 对方在税务平台确认红字信息，72 小时未确认自动作废
    steps:
      - {actor: 财务, command: 发起红字信息确认, aggregate: AGG-46, desc: 已用途确认或入账的蓝字发票红冲前须对方确认}
      - {actor: 财务, command: 红冲发票, aggregate: AGG-46, emits: [发票已红冲]}
      - {actor: 系统策略, command: 回冲开票额度, aggregate: AGG-44, gap: G-08, desc: INV-73 只写开票接受与作废同事务，红冲是否同事务未写；本稿按两次事务写}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-46, named: true, calls: PRC-92}
    notes: 蓝字不得作废，更正走红字（INV-72）；订阅方 B-09，其反应见 G-08。

  - id: PRC-59
    name: 由销项发票创建应收
    trigger:
      type: event
      events: [{event: InvoiceIssued, aggregate: AGG-46}]
    stages: [VS-04.4]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 创建应收, aggregate: AGG-49, named: true, desc: 销售应收只由蓝字发票产生（INV-76）}
    notes: §4.3 步 8 写事件「应收已创建」，AGG-49 事件列无此名，见 G-08。

  - id: PRC-60
    name: 认领收款并核销应收
    trigger: {type: human, desc: 出纳每日认领到账流水}
    stages: [VS-04.4]
    owner_bc: B-09
    human_orchestration: false
    steps:
      - {actor: 出纳, read: true, reads: [AGG-88, AGG-87], desc: 读流水行与资金账户}
      - {actor: 出纳, command: 收款认领, aggregate: AGG-50, named: true, emits: [CashReceived]}
      - {actor: 出纳, command: 在应收上核销占用, aggregate: AGG-49, named: true, emits: [应收已结清], desc: 核销合计不超过未结余额（INV-77）；结清时发事件}
      - {actor: 出纳, command: 记分配行与流水行, aggregate: AGG-50, named: true, emits: [收款已分配], desc: 分配合计等于到账金额（INV-78）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-50, named: true, calls: PRC-92}
    notes: 额度占用，不新增 C 类；收款作废时释放占用。

  - id: PRC-61
