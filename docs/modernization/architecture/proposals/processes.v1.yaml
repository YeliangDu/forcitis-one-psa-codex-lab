      - {actor: 用人经理, command: 确认绩效评估, aggregate: AGG-106, emits: [绩效评估已确认]}
      - {actor: 人力, command: 办理转正, aggregate: AGG-62, desc: 转正前读评估（P-46）}
    notes: 评估结果是转正输入，不是拒绝条件。


  # ───────────── VS-08 报销垫付费用 ─────────────
  - id: PRC-86
    name: 发放与归还员工借款
    trigger: {type: human, desc: 员工事前申请借支，财务发放}
    stages: [VS-08.1]
    owner_bc: B-10
    human_orchestration: true
    human_note: 事前预批、发放、归还或冲抵
    steps:
      - {actor: 财务, command: 确认应付, aggregate: AGG-52, named: true, gap: G-11, desc: 类型「员工借款」；来源聚合与归还、冲抵未写}
    notes: 发放走「发起、审批并执行付款」；借款与报销各自结算（Q24）。

  - id: PRC-87
    name: 提交、核定并确认报销应付
    trigger: {type: human, desc: 员工提交费用报销}
    stages: [VS-08.2]
    owner_bc: B-12
    human_orchestration: true
    human_note: 报销审批、驳回释放占用
    steps:
      - {actor: 员工, read: true, reads: [AGG-19, AGG-10, AGG-62], desc: 读项目或商机与人员}
      - {actor: 员工, command: 占用进项发票入账, aggregate: AGG-89, desc: 提交前占用，已占用则拒（INV-74）}
      - {actor: 员工, command: 预算占用, aggregate: AGG-80, named: true, emits: [BudgetReserved]}
      - {actor: 员工, command: 提交费用报销, aggregate: AGG-59, desc: 原始凭证要素齐全（INV-84）}
      - {actor: 部门负责人, platform_task: true, service: platform.approval, command: 报销审批, gap: G-02}
      - {actor: 财务, command: 核定费用报销, aggregate: AGG-59, emits: [费用报销已核定], desc: 确定所属期间；超事前预批额度 P-37 预警}
      - {actor: 财务, command: 驳回释放, aggregate: AGG-89, named: true, branch: 驳回, desc: 释放发票占用}
      - {actor: 系统策略, command: 确认应付, aggregate: AGG-52, named: true, inner: [{command: 占用进项发票入账, aggregate: AGG-89}], emits: [应付已确认], gap: G-17, desc: 报销应付}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-59, named: true, calls: PRC-92}
    notes: 报销「已付」状态缺来源，见 G-09；发票占用在 B-12 提交前与 B-10 确认应付时各出现一次，见 G-17。


  # ───────────── VS-09 达成经营目标 ─────────────
  - id: PRC-88
    name: 编制、批准并基线化经营计划与预算
    trigger: {type: time, desc: 经营计划周期开始}
    stages: [VS-09.1, VS-09.3]
    owner_bc: B-18
    human_orchestration: true
    human_note: 计划审批、调整产生新版本
    steps:
      - {actor: 管理层, command: 编制经营计划版本, aggregate: AGG-79}
      - {actor: 管理层, platform_task: true, service: platform.approval, command: 经营计划审批, gap: G-02}
      - {actor: 管理层, command: 基线化经营计划, aggregate: AGG-79, emits: [经营计划已基线化]}
      - {actor: 财务, command: 开立预算账户, aggregate: AGG-80}
      - {actor: 财务, command: 调整预算, aggregate: AGG-80, emits: [BudgetAdjusted]}
    notes: 基线不可变，只出新版本（INV-101）；复盘后调整计划也走本流程。

  - id: PRC-89
    name: 编制滚动预测
    trigger: {type: time, desc: 每周销售预测承诺；按期现金流预测}
    stages: [VS-09.2]
    owner_bc: B-18
    human_orchestration: false
    steps:
      - {actor: 市场和客户经理, command: 编制预测版本, aggregate: AGG-79, desc: 经营计划类型「预测」，目标值按人员 × 期间 × 指标}
      - {actor: 财务, command: 编制现金流预测, aggregate: AGG-79}
    notes: 迁移时在途 1,212 单提示流程未闭环，只读归档（信息图 M-8）。

  - id: PRC-90
    name: 出具经营月报并复盘
    trigger:
      type: event
      events: [{event: AccountingPeriodClosed, aggregate: AGG-81}]
    stages: [VS-09.3, VS-10.2]
    owner_bc: reporting
    human_orchestration: true
    human_note: 管理层复盘会议，确定经营动作
    steps:
      - {actor: reporting 读模型, read: true, reads: [AGG-79, AGG-80, AGG-100], desc: 关账后对比目标与实际，解释偏差；reporting 订阅全部领域事件（ADR-0023）}
    notes: 需要调整计划时转入「编制、批准并基线化经营计划与预算」，reporting 只读，不调用命令。


  # ───────────── VS-10 获得期间报告 ─────────────
  - id: PRC-91
    name: 认定工时有效性
    trigger: {type: time, desc: 期间封期前由项目经理对已审批工时批量认定}
    stages: [VS-10.1]
    owner_bc: B-06
    human_orchestration: true
    human_note: 项目经理逐项目逐期间确认
    steps:
      - {actor: 项目经理, command: 认定工时有效性, aggregate: AGG-39, emits: [工时已认定], desc: 有效 / 无效 / 返工 / 可计费四类之和等于填报总数}
    notes: 认定结果是人工成本分配的输入（INV-89 只分配已锁定工时）。

  - id: PRC-92
    name: 过账业务事实
    trigger: {type: call, desc: 各触账 BC 的「提交过账候选」调用本管道（开放主机服务 + 发布语言）}
    stages: [VS-10.1]
    owner_bc: B-16
    human_orchestration: false
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-81], desc: 同事务读锁校验目标期间开放；已关账则路由到开放期间并标原期间（INV-92）}
      - {actor: 系统策略, command: 过账, aggregate: AGG-77, named: true, emits: [BusinessFactAttributed], desc: 借贷平衡、法人一致、幂等（INV-93、94）}
      - {actor: 系统策略, command: 冲销并重过账, aggregate: AGG-77, branch: 更正, emits: [BusinessFactRestated], desc: 事实只追加，更正只能冲销（INV-95）}
    notes: 所有触账流程的最后一步都调用本流程；订阅方 B-07、B-17、B-20。

  - id: PRC-93
    name: 生成会计分录
    trigger:
      type: event
      events: [{event: BusinessFactAttributed, aggregate: AGG-77}, {event: BusinessFactRestated, aggregate: AGG-77}]
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: true
    human_note: 待处理队列与推送死信需财务处理
    steps:
      - {actor: 系统策略, command: 生成分录, aggregate: AGG-84, named: true, emits: [分录已记账], desc: 两账分录同一事务（INV-96）；来源不在授权表则进待处理}
      - {actor: 财务, command: 处理待处理队列, aggregate: AGG-84, named: true}
      - {actor: 系统策略, command: 推送与重投, aggregate: AGG-84, named: true, desc: 收付口径分录推送外部法定账至已确认记账，失败为死信}
    notes: G1 期间银行、税费、固定资产、薪酬汇总走 ledger 内导入通道。

  - id: PRC-94
    name: 制单并过账受控手工凭证
    trigger: {type: human, desc: 财务因调整、差异或年度审计调整制单}
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: true
    human_note: 制单、复核、审批，复核人不同于制单人
    steps:
      - {actor: 财务, command: 制单手工凭证, aggregate: AGG-98}
      - {actor: 财务主管, command: 复核手工凭证, aggregate: AGG-98}
      - {actor: 财务主管, platform_task: true, service: platform.approval, command: 手工凭证审批}
      - {actor: 财务主管, command: 提交过账候选, aggregate: AGG-98, named: true, emits: [手工凭证已提交过账], calls: PRC-92, desc: 年度审计调整类带显式落账期间（仅第 13 期）}
    notes: 显式期间未开放即拒并告警，不改落其他期间（ADR-0046）。

  - id: PRC-95
    name: 期末结转
    trigger: {type: time, desc: 月末业务过账完成后}
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: false
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-84], desc: 读本期分录与余额}
      - {actor: 财务, command: 生成期末结转运行, aggregate: AGG-99, desc: 每（法人，期间，模板）只有一次有效运行（INV-109）}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-99, named: true, emits: [期末结转已过账], calls: PRC-92}
    notes: 已过账的只能冲销重做；损益结转、未分配利润等期末凭证。

  - id: PRC-96
    name: 分配人工成本
    trigger: {type: time, desc: 工时认定并薪酬过账后，月末}
    stages: [VS-10.1]
    owner_bc: B-07
    human_orchestration: true
    human_note: 试算后财务确认
    steps:
      - {actor: 系统策略, read: true, reads: [AGG-77, AGG-81], desc: 读已过账的工时与薪酬事实，只分配已锁定工时}
      - {actor: 财务, command: 试算人工成本分配, aggregate: AGG-41, desc: P-41 有工时无薪酬、有薪酬无工时预警}
      - {actor: 财务, command: 确认人工成本分配, aggregate: AGG-41}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-41, named: true, emits: [人工成本分配已过账], calls: PRC-92}
    notes: 分配合计等于实际人工成本，零容差（INV-89）；口径待 FD-09。

  - id: PRC-97
    name: 批准并生效分摊规则版本
    trigger: {type: human, desc: 财务按期间首日发布规则}
    stages: [VS-10.1]
    owner_bc: B-07
    human_orchestration: true
    human_note: 草稿 → 已批准 → 生效
    steps:
      - {actor: 财务, command: 批准分摊规则版本, aggregate: AGG-40, gap: G-02}
      - {actor: 财务, command: 生效分摊规则版本, aggregate: AGG-40, emits: [分摊规则已生效], desc: 只在期间首日生效（INV-91）}
    notes: 被引用版本不可改。

  - id: PRC-98
    name: 分摊间接成本
    trigger: {type: time, desc: 月末}
    stages: [VS-10.1]
    owner_bc: B-07
    human_orchestration: true
    human_note: 试算后确认生效
    steps:
      - {actor: 财务, command: 试算分摊运行, aggregate: AGG-42, desc: 基数为零时结转下期（P-42）}
      - {actor: 财务, command: 生效分摊运行, aggregate: AGG-42, emits: [分摊已生效], desc: 管理口径；每期间一次有效全量运行（INV-90）}
    notes: 冲销按原比例。

  - id: PRC-99
    name: 计提折旧并处置公司资产
    trigger: {type: time, desc: 月末按期计提}
    stages: [VS-10.1]
    owner_bc: B-24
    human_orchestration: false
    steps:
      - {actor: 财务, read: true, reads: [AGG-55], desc: 读采购或租赁协议}
      - {actor: 财务, command: 登记公司资产, aggregate: AGG-91}
      - {actor: 系统策略, command: 计提折旧与摊销, aggregate: AGG-91}
      - {actor: 财务, command: 处置资产, aggregate: AGG-91, branch: 处置, emits: [资产已处置]}
      - {actor: 系统策略, command: 提交过账候选, aggregate: AGG-91, named: true, calls: PRC-92, desc: 折旧与处置过账}
    notes: G1 期间为 ledger 内导入通道（ADR-0022 决定 7）。

  - id: PRC-100
    name: 发布总账配置版本
    trigger: {type: human, desc: 财务评审并发布科目表、映射表、授权表新版本}
    stages: [VS-10.1]
    owner_bc: B-20
    human_orchestration: true
    human_note: 配置类版本须财务批准
    steps:
      - {actor: 财务主管, command: 发布科目表版本, aggregate: AGG-82, emits: [科目表版本已生效]}
      - {actor: 财务主管, command: 发布映射表版本, aggregate: AGG-85, emits: [映射表版本已生效]}
      - {actor: 财务主管, command: 发布授权表版本, aggregate: AGG-94, emits: [授权表版本已生效]}
    notes: 口径转换规则按代码类变更管理，不建聚合。

  - id: PRC-101
    name: 月结检查并关账
    trigger: {type: human, desc: 财务在会计期间结束时发起月结}
    stages: [VS-10.1]
    owner_bc: B-17
    human_orchestration: true
    human_note: 发起人与确认人须不同；前置检查未通过退回开放重入
    steps:
      - {actor: 财务, read: true, reads: [AGG-84, AGG-99, AGG-77, AGG-81], command: 月结检查, named: true, desc: 队列为空、死信为空、期末结转已过账、明细账与控制科目一致、试算平衡、三条对账等式等}
      - {actor: 财务, command: 发起关账, aggregate: AGG-81, named: true}
      - {actor: 财务主管, command: 确认关账, aggregate: AGG-81, named: true, emits: [AccountingPeriodClosed]}
      - {actor: 财务主管, command: 退回开放, aggregate: AGG-81, branch: 前置检查未通过}
    notes: 已关账期间是终态，回退是在开放期间重入第 1–3 步（冲销加新事实，标原期间）；「关账中」是否仍接受过账未定（§7 第 15 条）。

  - id: PRC-102
    name: 启用第 13 期并年末关账
    trigger: {type: time, desc: 会计年度末，12 月关账前}
    stages: [VS-10.1]
    owner_bc: B-17
    human_orchestration: true
    human_note: 财务批准启用，两人关账
    steps:
      - {actor: 财务主管, command: 登记第 13 期启用, aggregate: AGG-96, named: true, emits: [第 13 期启用登记已生效]}
      - {actor: 财务主管, command: 开放第 13 期, aggregate: AGG-81, named: true}
      - {actor: 财务, command: 发起年末关账, aggregate: AGG-81, desc: 12 月与第 13 期共用一组前置检查}
      - {actor: 财务主管, command: 确认年末关账, aggregate: AGG-81, emits: [AccountingPeriodClosed], desc: 两期同事务原子关账（INV-99）；第 13 期的事件不触发 L2}
    notes: 未启用的年度 12 月照常关账；12 月关账后启用状态锁定（INV-104）。

  - id: PRC-103
    name: 生成期间余额快照
    trigger:
      type: event
      events: [{event: AccountingPeriodClosed, aggregate: AGG-81}]
    stages: [VS-10.2]
    owner_bc: B-20
    human_orchestration: false
    steps:
      - {actor: 系统策略, command: 生成快照, aggregate: AGG-100, named: true, emits: [期间余额快照已生成], desc: 只追加；之后的更正进开放期间快照的调整栏（INV-106）}
    notes: 订阅方向 B-20 → B-19（事件）。

  - id: PRC-104
    name: 外部法定账对账与签字
    trigger:
      type: event
      events: [{event: 期间余额快照已生成, aggregate: AGG-100}]
    stages: [VS-10.2]
    owner_bc: B-20
    human_orchestration: true
    human_note: 差异逐项处理，财务负责人签字接受
    steps:
      - {actor: 财务, read: true, reads: [AGG-100, AGG-84], desc: 读快照与推送状态及外部法定账余额}
      - {actor: 财务, command: 登记对账差异, aggregate: AGG-101}
      - {actor: 财务主管, command: 签字接受差异, aggregate: AGG-101, emits: [对账已完成], desc: 差异清零或签字接受，否则收付口径账簿不得出表（INV-107）}
    notes: 权责口径不等对账。

  - id: PRC-105
    name: 评审并生效报表行定义版本
    trigger: {type: human, desc: 财务编制报表行到科目的映射}
    stages: [VS-10.2]
    owner_bc: B-21
    human_orchestration: true
    human_note: 财务评审后生效
    steps:
      - {actor: 财务, command: 编制报表行定义版本, aggregate: AGG-86}
      - {actor: 财务主管, command: 生效报表行定义版本, aggregate: AGG-86, desc: 只在期间首日生效（INV-91）}
    notes: 草拟 → 财务评审 → 生效。

  - id: PRC-106
    name: 出具三大报表
    trigger: {type: human, desc: 期间已关账后，财务出表}
    stages: [VS-10.2]
    owner_bc: B-21
    human_orchestration: true
