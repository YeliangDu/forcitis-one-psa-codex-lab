# state-transitions.proposal.yaml — 允许跃迁表（让"合法跃迁"可判定）
#
# 为什么需要：登记网络里 05 写的是「状态条件 · 合法跃迁」，但"合法"必须有可判定的跃迁集合；
#   否则状态机由代码自由实现，不变量无处安放。本文件把每个有状态对象的允许跃迁显式列出。
#
# 规则：
#   T-1 每条跃迁必须有 guard（不变量/规则 ID）或显式标注 free（无额外约束）。
#   T-2 终态（不可再改）必须写 terminal: true，并写更正路径（冲销/重开/新增版本）。
#   T-3 跃迁的 by 取 STAKEHOLDERS.md 的 SH-ID（谁有权触发），与 ADR-0045 角色—岗位—人分层一致。
#   T-4 任何状态必须可达（无孤儿状态），任何非终态必须有出边。
#   T-5 状态名沿用 ENTERPRISE_INFO_MAP_DRAFT.md「关键状态」列的原值，不另立新名。
#
# normative: false；提议稿。guard 里引用的 INV-xx 需与 ENTERPRISE_AGGREGATES_DRAFT.md 逐条核对（本稿只标候选）。

version: 0.1
status: proposal
normative: false
updated: '2026-10-18'

objects:
  - obj: OBJ-05                        # 协议
    states: [草案, 审批中, 已签署生效, 履行中, 已完成, 已结算, 已终止, 无效]
    transitions:
      - {from: 草案, to: 审批中, guard: free, by: SH-E5}
      - {from: 审批中, to: 已签署生效, guard: 合同评审通过, by: SH-M1}
      - {from: 审批中, to: 草案, guard: 驳回, by: SH-M1}
      - {from: 已签署生效, to: 履行中, guard: free, by: SH-E2}
      - {from: 履行中, to: 已完成, guard: free, by: SH-E2}
      - {from: 已完成, to: 已结算, guard: 结算书经双方确认, by: SH-E6}
      - {from: "*", to: 已终止, guard: 原因必填, by: SH-M1}
      - {from: "*", to: 无效, guard: 违法分包认定, by: SH-R2}
    notes: 生效后只经「协议变更 OBJ-09」产生新基线，不新增协议状态；「合同评审」是审批单据，不另立对象（M-20）。

  - obj: OBJ-29                        # 项目（Q09 待定，本表是候选，不是定稿）
    states: [已立项, 执行中, 已暂停, 收尾中, 已结项, 已归档, 已终止, 已取消]
    transitions:
      - {from: 已立项, to: 执行中, guard: free, by: SH-E2}
      - {from: 执行中, to: 已暂停, guard: 原因必填, by: SH-E2}
      - {from: 已暂停, to: 执行中, guard: free, by: SH-E2}
      - {from: 执行中, to: 收尾中, guard: free, by: SH-E2}
      - {from: 收尾中, to: 已结项, guard: 成果与证据齐备, by: SH-E2}
      - {from: 已结项, to: 已归档, guard: 证据封存, by: SH-E6}
      - {from: "*", to: 已终止, guard: 原因必填, by: SH-M1}
      - {from: 已立项, to: 已取消, guard: 无任何投入, by: SH-M1}
    guards:
      - id: INV-39
        rule: 已结项、已终止、已取消、已暂停的项目不得新记工时（工时单侧前置，命令方为 AGG-39）
        applies_to: [已结项, 已终止, 已取消, 已暂停]
    terminal: [已归档, 已终止, 已取消]
    notes: 与 Q09 一致——暂停期间拒绝记工时已答，其余取值仍待定；本表列出的取值是候选。

  - obj: OBJ-66                        # 工时单
    states: [草稿, 已提交, 已通过, 已退回, 已驳回, 已过账]
    transitions:
      - {from: 草稿, to: 已提交, guard: free, by: SH-E3}
      - {from: 已提交, to: 已通过, guard: INV-39（项目状态合法）, by: SH-E1}
      - {from: 已提交, to: 已退回, guard: free, by: SH-E1}
      - {from: 已提交, to: 已驳回, guard: 原因必填, by: SH-E1}
      - {from: 已退回, to: 草稿, guard: 改原单再提交, by: SH-E3}
      - {from: 已驳回, to: 草稿, guard: 改原单再提交, by: SH-E3}
      - {from: 已提交, to: 草稿, guard: 撤回（事件 TimesheetApprovalWithdrawn）, by: SH-E3}
      - {from: 已通过, to: 已过账, guard: INV-92（期间闸门）, by: SH-E6}
    notes: 撤回是转换不是状态；不设「已取消」终态；已过账属 Phase 2；关期后只能冲销或修正（TS-UNIQ 审查）。

  - obj: OBJ-82                        # 开票申请
    states: [草稿, 审批中, 准入通过, 已开票, 驳回, 撤回, 作废]
    transitions:
      - {from: 草稿, to: 审批中, guard: free, by: SH-E6}
      - {from: 审批中, to: 准入通过, guard: 产值单已确认, by: SH-E6}
      - {from: 审批中, to: 驳回, guard: 原因必填, by: SH-E6}
      - {from: 草稿, to: 撤回, guard: free, by: SH-E6}
      - {from: 准入通过, to: 已开票, guard: 发票已开具（OBJ-83）, by: SH-E6}
      - {from: 准入通过, to: 作废, guard: 开具前, by: SH-E6}
    terminal: [已开票, 作废, 驳回, 撤回]
    notes: 作废只允许在开具前；开具后的更正走 OBJ-83 红冲，不回退本对象。

  - obj: OBJ-83                        # 增值税发票（销项/进项双轨）
    states: [已开具, 部分红冲, 全额红冲, 已取得, 已用途确认, 已入账, 进项转出, 红冲确认中]
    transitions:
      - {from: 已开具, to: 部分红冲, guard: 红字信息确认单已通过, by: SH-E6}
      - {from: 已开具, to: 全额红冲, guard: 红字信息确认单已通过, by: SH-E6}
      - {from: 已取得, to: 已用途确认, guard: 查验通过, by: SH-E6}
      - {from: 已用途确认, to: 已入账, guard: INV-95（只追加）, by: SH-E6}
      - {from: 已入账, to: 进项转出, guard: 用途变化, by: SH-E6}
      - {from: 已用途确认, to: 红冲确认中, guard: 蓝字已确认或已入账, by: SH-E6}
      - {from: 红冲确认中, to: 已开具, guard: 72 小时未确认自动作废, by: 系统}
    terminal: [全额红冲]
    notes: 红字信息确认单由税务平台登记，不另立对象（原 OBJ-84 并入）。

  - obj: OBJ-97                        # 会计期间
    states: [未开, 开放, 关账中, 已关账]
    transitions:
      - {from: 未开, to: 开放, guard: free, by: SH-E6}
      - {from: 开放, to: 关账中, guard: 前置检查通过, by: SH-E6}
      - {from: 关账中, to: 已关账, guard: INV-92（同事务读锁解除）, by: SH-M1}
      - {from: 已关账, to: 开放, guard: 重开须审批（留痕）, by: SH-M1}
    notes: 期间闸门按 INV-92 的"同事务读锁"实现；重开必须有审批与理由，是唯一允许的回退跃迁。

  - obj: OBJ-113                       # 用印申请
    states: [草稿, 审批中, 已批准, 已驳回, 已用印, 已关闭]
    transitions:
      - {from: 草稿, to: 审批中, guard: free, by: SH-E5}
      - {from: 审批中, to: 已批准, guard: free, by: SH-M1}
      - {from: 审批中, to: 已驳回, guard: 原因必填, by: SH-M1}
      - {from: 已批准, to: 已用印, guard: 印章登记, by: SH-E6}
      - {from: 已用印, to: 已关闭, guard: 归档, by: SH-E6}
    terminal: [已关闭, 已驳回]

  - obj: OBJ-73                        # 月度薪酬结算
    states: [草稿, 已计算, 审核中, 已批准, 已发放, 已过账]
    transitions:
      - {from: 草稿, to: 已计算, guard: 考勤已确认（OBJ-111）, by: SH-E6}
      - {from: 已计算, to: 审核中, guard: free, by: SH-E6}
      - {from: 审核中, to: 已批准, guard: free, by: SH-M1}
      - {from: 已批准, to: 已发放, guard: 银行回单, by: SH-E6}
      - {from: 已发放, to: 已过账, guard: 期间开放, by: SH-E6}
    notes: 更正走冲销，不回退状态（INV-95 同源规则）。
