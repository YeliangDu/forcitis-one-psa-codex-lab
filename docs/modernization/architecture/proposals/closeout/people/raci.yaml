roles:
  SH-E3:
  - positions:
    - 待岗位体系定
    note: 任一在职员工（请假、补卡、加班、确认的本人）；无全员角色编号，借用 SH-E3
    org_needs:
    - 全部在职员工（B-13 员工引用）
    - 需通用角色 SH-E0 全体员工，待 one-architecture 定
  - positions:
    - 待岗位体系定
    note: 任一在职员工（专项附加扣除的本人填报）；无全员角色编号，借用 SH-E3（同 b31 格式问题）
    org_needs:
    - 全部在职员工（B-13 员工引用）
    - 需通用角色 SH-E0 全体员工，待 one-architecture 定
  - positions:
    - 待岗位体系定
    org_needs:
    - 能参与起草知识条目的设计师与顾问
  - positions:
    - 待岗位体系定
    note: 任一在职员工（申请人、提出人、使用人）；无全员角色编号，借用 SH-E3（分片格式问题 1）
    org_needs:
    - 全部在职员工（B-13 员工引用）可发起用印、IT 需求、领用、报修、员工活动
    - 需通用角色 SH-E0 全体员工，待 one-architecture 定
  SH-E1:
  - positions:
    - 待岗位体系定
    note: 申请人所在组织单元的负责人 = cost_object_owner（部门负责人 / 用人经理）
    org_needs:
    - 每个组织单元恰有一名负责人字段（责任人），AR-12 判缺位
    - 汇报线上级（AR-11 上交对象）与上级组织负责人（AR-12 上交对象）
    - 调岗后在途请假审批人的解析时点待定
  - positions:
    - 待岗位体系定
    note: 用人经理（绩效评估的评估人、奖金核定的责任人解析结果之一）
    org_needs:
    - 评估人 = 被评人员的直属用人经理（AGG-62 读）
    - 试用期评估超 P7D 未完成提醒人力（PRC-85）
  SH-M1:
  - positions:
    - 待岗位体系定
    note: 请假审批超期升级对象，暂拟，待 U3
    org_needs:
    - 审批超期 P3D 升级接收人
  - positions:
    - 待岗位体系定
    note: A 的实例级解析与超期提醒对象
    org_needs:
    - 每个组织单元恰有一名负责人字段
    - 汇报线上级（AR-11 上交对象）
    - 上级组织负责人（AR-12 上交对象）
    - 超期提醒收件人（审批 P2D、参保增减员、申报期限）
  - positions:
    - 待岗位体系定
    org_needs:
    - 能对所辖组织单元的经营目标负责并编制、审批计划（部门负责人；公司级为管理层负责人）
    - 能受理 AR-11 / AR-12 转来的上级代批
  - positions:
    - 待岗位体系定
    note: A 的实例级解析：申请人（提出人）所在组织单元的负责人 = cost_object_owner
    org_needs:
    - 每个组织单元恰有一名负责人字段（责任人），AR-12 判缺位
    - 汇报线上级（AR-11 上交对象）与上级组织负责人（AR-12 上交对象）
    - 另：信息部门负责人收超时提醒（受理逾期、离职逾期未归还），非审批
  SH-E6:
  - positions:
    - 待岗位体系定
    note: 本组职能为人力（考勤）；SH-E6 同时用于人力与财务，按 function 区分
    functions:
      人力（考勤）:
        org_needs:
        - 维护工作日历、标准工时版本、假期规则版本
        - 修复来源对照后重新拉取考勤
        - 接收导入失败告警与月度考勤暂缓知会
        - 法人数据范围内至少 2 人（发布与确认分离）
  - positions:
    - 待岗位体系定
    note: 本组职能：薪酬岗、社保岗、申报岗、人力、薪酬规则确认；财务主管（月度薪酬审核人）经 cost_object_owner 解析，不由 SH-E6 直授
    functions:
      薪酬岗:
        org_needs:
        - 薪酬计算结果核对与提交审核（制单人）
        - 薪酬查看与调薪权限逐人授予（ADR-0032）
        - 至少 2 人（制单与审核分离）
      社保岗:
        org_needs:
        - 参保增减员办理
        - 缴费基数读写权限逐人授予
      申报岗:
        org_needs:
        - 个税、社保、公积金申报与缴款登记
        - 申报明细读取逐人授予
        - 与 B-10 缴款资金支出人分离
      人力:
        org_needs:
        - 激励方案编制
        - 调整评估或方案后重新触发奖金草拟
      薪酬规则确认:
        org_needs:
        - 薪酬规则版本发布与确认（人力出、财务确认，U7③）
  - positions:
    - 待岗位体系定
    org_needs:
    - 能开立与调剂预算账户、编制现金流预测的财务经办
    - 财务负责人岗位承担预算账户类命令的问责 A
  - positions:
    - 待岗位体系定
    note: 本组三个职能：行政经办、信息（IT）资产管理员 / 处理人、行政（活动）；SH-E6 无法区分，按 function 区分（分片格式问题 3）
    functions:
      行政经办:
        org_needs:
        - 保管并使用印章的经办人，至少 2 人（经办人不得登记自己申请的用印）
        - 用印法人数据范围
      信息（IT）资产管理员/处理人:
        org_needs:
        - IT 服务台受理与解决人员
        - 资产管理员至少 2 人（归还验收不得验收自己名下资产）
        - 读 B-24 资产卡片
      行政:
        org_needs:
        - 组织员工活动并确认完成的行政人员
  system:
  - note: 规则自动执行（定时、事件反应、自动批准、默认确认、自动锁定），非人
  - note: 规则自动执行（计算、过账、发放标记、申报生成、定时生效），非人
  - note: 规则自动执行（自动关闭、规则自动通过），非人
  platform.approval:
  - note: 审批平台回调落地批准 / 驳回命令，非人；审批结果的责任归 A（cost_object_owner）
  - note: 审批平台回调落地批准 / 驳回命令，非人；审批结果的责任归 A（cost_object_owner）
  - note: 审批平台回调落地批准 / 驳回命令，非人；审批结果的责任归 A（cost_object_owner）
  SH-E5:
  - positions:
    - 待岗位体系定
    org_needs:
    - 能按人员口径填报每周销售预测承诺的市场与客户经理
  SH-E4:
  - positions:
    - 待岗位体系定
    org_needs:
    - 能起草与修订知识条目的技术专家
    - 能评审专业内容的专业负责人（归属专业组织单元的责任人，技术委员会）
  SH-E2:
  - positions:
    - 待岗位体系定
    org_needs:
    - 项目复盘编制人，能在复盘详情页提炼并调用创建知识条目
  SH-O1:
  - positions:
    - 待岗位体系定
    org_needs:
    - 仅知会，不参与动作
  财务负责人:
  - positions:
    - 待岗位体系定
    org_needs:
    - 对预算账户开立、调整、占用类命令问责的岗位（resolve: type）
