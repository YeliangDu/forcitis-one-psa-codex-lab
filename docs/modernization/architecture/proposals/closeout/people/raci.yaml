roles:
  SH-E3:
  - positions:
    - 待岗位体系定
    note: 任一在职员工（申请离职、撤回的员工本人）；无全员角色编号，借用 SH-E3（沿 b31 口径）
    org_needs:
    - 全部在职员工可在本人范围内申请离职、撤回申请，需通用角色 SH-E0 全体员工，待 one-architecture 定
  - positions:
    - 待岗位体系定
    note: 任一在职员工（请假、补卡、加班、确认的本人）；无全员角色编号，借用 SH-E3
    org_needs:
    - 全部在职员工（B-13 员工引用）
    - 需通用角色 SH-E0 全体员工，待 one-architecture 定
  - positions:
    - 待岗位体系定
    note: 任一在职员工（专项附加扣除的本人填报）；无全员角色编号，借用 SH-E3（同 b31 格式问题）
    org_needs:
    - 全部在职员工（B-13 员工引用）
    - 需通用角色 SH-E0 全体员工，待 one-architecture 定
  - positions:
    - 待岗位体系定
    org_needs:
    - 能参与起草知识条目的设计师与顾问
  - positions:
    - 待岗位体系定
    note: 任一在职员工（申请人、提出人、使用人）；无全员角色编号，借用 SH-E3（分片格式问题 1）
    org_needs:
    - 全部在职员工（B-13 员工引用）可发起用印、IT 需求、领用、报修、员工活动
    - 需通用角色 SH-E0 全体员工，待 one-architecture 定
  SH-E1:
  - positions:
    - 待岗位体系定
    note: 用人经理：招聘需求提出人、面试评价与录用决定人
    org_needs:
    - 能提出招聘需求、记录面试、作出录用决定、标记未录用；候选人信息仅限本人所提招聘需求下的候选人（访问限制按 ADR-0043）
  - positions:
    - 待岗位体系定
    note: 申请人所在组织单元的负责人 = cost_object_owner（部门负责人 / 用人经理）
    org_needs:
    - 每个组织单元恰有一名负责人字段（责任人），AR-12 判缺位
    - 汇报线上级（AR-11 上交对象）与上级组织负责人（AR-12 上交对象）
    - 调岗后在途请假审批人的解析时点待定
  - positions:
    - 待岗位体系定
    note: 用人经理（绩效评估的评估人、奖金核定的责任人解析结果之一）
    org_needs:
    - 评估人 = 被评人员的直属用人经理（AGG-62 读）
    - 试用期评估超 P7D 未完成提醒人力（PRC-85）
  SH-M1:
  - positions:
    - 待岗位体系定
    note: A 的类型级占位：归属组织单元责任人（部门负责人，cost_object_owner）；岗位体系定后改实例级（V-18）
    org_needs:
    - 每个组织单元恰有一名负责人字段（AGG-61 责任人），AR-12 判缺位
    - 汇报线上级（AR-11 上交对象）与上级组织负责人（AR-12 上交对象）
    - 区域负责人收数据范围待复核提醒（P-31），非审批
  - positions:
    - 待岗位体系定
    note: 请假审批超期升级对象，暂拟，待 U3
    org_needs:
    - 审批超期 P3D 升级接收人
  - positions:
    - 待岗位体系定
    note: A 的实例级解析与超期提醒对象
    org_needs:
    - 每个组织单元恰有一名负责人字段
    - 汇报线上级（AR-11 上交对象）
    - 上级组织负责人（AR-12 上交对象）
    - 超期提醒收件人（审批 P2D、参保增减员、申报期限）
  - positions:
    - 待岗位体系定
    org_needs:
    - 能对所辖组织单元的经营目标负责并编制、审批计划（部门负责人；公司级为管理层负责人）
    - 能受理 AR-11 / AR-12 转来的上级代批
  - positions:
    - 待岗位体系定
    note: 仅用印、受控 IT 人审及离职资产逾期通知角色；领用及活动无批准权
    org_needs:
    - 正式制度配置的用印责任与加审角色、按 IT 类别配置的批准负责人，上线前须填，不默认申请人或提出人部门负责人
    - AR-11 本人、AR-12 缺位委派不替代制度责任归属
    - 离职生效后 7 个日历日未归还时原组织单元负责人收提醒，非审批；无 IT 受理超时提醒角色需求
  SH-E6:
  - positions:
    - 待岗位体系定
    note: 本组四个职能：人事主数据维护、招聘、人事办理、执业证书管理；SH-E6 无法区分，按 function 区分
    functions:
      人事主数据维护:
        org_needs:
        - 维护法人、组织单元、职位目录、法人归属的人事主数据岗，按法人与组织数据范围授权
        - 至少 2 人（互为后备）
