# VS-13 薪酬类聚合权责对照条目（收敛产物，提议稿）。格式依 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 A 节。
# 口径：每个「对象×命令」恰一个 A。审批类命令（批准、生效激励方案版本、核定奖金）A = 实例级 cost_object_owner，与 vs13.processes.yaml 骨架
#   approval.approver 一致；驳回、退回类命令是审批人决定的回调落地，A 同批准、R = platform.approval。非审批命令 A 取发起或执行方（持发令权，不持审批权）。
# cost_object_owner 的解析（字段名由本稿按「谁对费用负责、谁批」写出，字段是否存在待 one-data 核）：
#   月度薪酬审核 = 薪酬结算.薪酬法人.财务责任人；激励方案审批 = 激励方案版本.适用范围.责任人（管理层）；奖金核定审批 = 被核定人员所在组织单元.负责人。
# 边界：AR-01、AR-02 金额阈值待用户定（U7′、U10′）；AR-11 审批人就是提交人或被核定人本人 → 汇报线上级；AR-12 责任人缺位 → 上级组织负责人
#   （二者 APPROVAL_RULES 中处理方式为 tbd，待用户定）。超期提醒（审批 P2D、参保 P30D 等）只提醒，非审批，记在 boundary.escalate 或 reminder。
# 敏感判据（sensitive）：命令的人类执行者或审批人需要读写个人级薪酬金额、奖金、发薪账户、缴费基数或个人级申报明细（ADR-0026 第 7 项 L3）时为 true；
#   这类权限落在薪酬与日薪等 L3 敏感读资源之下，ADR-0032 第 2 项第 4 条要求登记为双人逐人，只授给人、不随岗位（第 1 项；ADR-0029 岗位授予搁置）。
#   用户点名的三类敏感权限：薪酬查看（提交审核、批准、退回薪酬重算、核定奖金、驳回奖金核定、草拟奖金核定、提交申报、更正申报）、
#   调薪（调整薪酬档案）、发薪账户（建立薪酬档案；调整薪酬档案同时改账户）。参保增员因写缴费基数一并判 true。
#   纯系统执行且无人持有权限的命令判 false 并写 note。权限码名与授予方式（TWO_PERSON_INDIVIDUAL）由 one-rules 在 permission-grant-modes.txt 登记，本稿只判是否敏感。
# 岗位到人的映射待岗位体系重梳（ADR-0029 搁置），roles 只记 org_needs；SH-E6 内部分岗按 function 区分（分片格式问题 5）。

entries:
- object: AGG-106
  command: 编制绩效评估
  raci:
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
    C: []
    I: []
  sensitive: false
- object: AGG-106
  command: 登记绩效更正
  raci:
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
    C: [SH-E6]
    I: []
  sensitive: false
  note: 追加更正记录引用原已确认评估，不改原评估（INV-114）；S-32 新增
- object: AGG-106
  command: 编制试用期绩效评估
  raci:
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
    C: []
    I: [SH-E6]
  boundary:
    escalate: {when: 待办 P7D 未完成（非打断，PRC-85）, to: SH-E6, note: 提醒，非审批}
  sensitive: false
- object: AGG-106
  command: 提交绩效评估
  raci:
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
    C: []
    I: []
  sensitive: false
- object: AGG-106
  command: 确认绩效评估
  raci:
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
    C: []
    I: [SH-E6]
  sensitive: false
  sensitive_reason: 绩效评价属敏感个人信息（ADR-0043 访问级别），但不在 ADR-0032 首批双人逐人资源内；是否登记 two-person-resources.txt 交 one-rules 复核
- object: AGG-73
  command: 计算月度薪酬
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 系统自动计算，无人持有执行权限；薪酬岗查看结果所需的薪酬查看权限在「提交审核」条目判定
- object: AGG-73
  command: 提交薪酬审核
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [SH-E6]
    C: []
    I: [cost_object_owner]
  boundary:
    segregation: [制单人 ≠ 审批人（AR-11）]
  sensitive: true
  sensitive_reason: 提交人核对全员实发与异常清单，需薪酬查看权限（个人级实发为 L3）
- object: AGG-73
  command: 批准月度薪酬
  raci:
    A: {resolve: instance, field: 薪酬结算.薪酬法人.财务责任人, alias: cost_object_owner}
    R: [SH-E6]
    C: []
    I: [SH-E6]
  boundary:
    limit_rule: AR-01、AR-02（金额阈值待用户定 U7′）
    segregation: [制单人 ≠ A, A 不得审批含本人薪酬结算行的结算]
    delegate: {when: AR-11, to: 汇报线上级}
    escalate: {when: AR-12, to: 上级组织负责人}
    reminder: {after: P2D, to: SH-M1, note: 审批超期提醒，非审批（暂拟，U7′）}
  sensitive: true
  sensitive_reason: 审批人在审批页看到全员实发合计与异常清单，需薪酬查看权限
  approval: {approver: cost_object_owner, doc_type: 月度薪酬审核}
  note: 审批类命令：骨架 approval.approver = cost_object_owner，解析为薪酬法人的财务责任人（vs13.notes.md 结构问题 15）
- object: AGG-73
  command: 退回薪酬重算
  raci:
    A: {resolve: instance, field: 薪酬结算.薪酬法人.财务责任人, alias: cost_object_owner}
    R: [platform.approval]
    C: []
    I: [SH-E6]
  sensitive: true
  sensitive_reason: 同「批准」：审批人的驳回决定凭同一薪酬查看权限作出
  note: 审批人驳回决定经审批平台回调落地，A 同批准
- object: AGG-73
  command: 撤回薪酬审核
  raci:
    A: {resolve: instance, field: 薪酬结算.提交人}
    R: [SH-E6]
    C: []
    I: [cost_object_owner]
  sensitive: false
  note: 仅提交人本人可撤回，其持有的提交审核权限已按敏感判定，撤回不新增查看范围
- object: AGG-73
  command: 提交过账候选
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 系统自动，批准即提交；过账路由规则见 INV-92
- object: AGG-73
  command: 标记薪酬已发放
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 应付已结清事件自动执行，不设人工标记
- object: AGG-73
  command: 登记代发结果
  raci:
    A: {resolve: instance, field: 月度薪酬结算.法人.财务负责人}
    R: [SH-E6]
    C: []
    I: [SH-E6]
  sensitive: true
  note: 薪酬结算行为 SENSITIVE / spi；R 为持银行回单的财务职能人员，I 为薪酬岗
- object: AGG-73
  command: 发起薪酬补发
  raci:
    A: {resolve: instance, field: 月度薪酬结算.法人.财务负责人}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: true
  note: R 为薪酬岗；I 为补发对象员工
- object: AGG-73
  command: 登记薪酬补发顺延
  raci:
    A: {resolve: instance, field: 月度薪酬结算.法人.财务负责人}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: true
  note: R 为薪酬岗；I 为补发对象员工（必须通知）
- object: AGG-73
  command: 标记薪酬已过账
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 过账事实事件自动执行
- object: AGG-74
  command: 参保增员
  raci:
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  boundary:
    escalate: {when: 入职后 30 日未增员（P-32、PRC-84 P30D）, to: SH-M1, note: 提醒，非审批}
  sensitive: true
  sensitive_reason: 登记缴费基数，基数是工资的映射（SPI），需薪酬查看权限范围内的写权限
- object: AGG-74
  command: 参保减员
  raci:
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  boundary:
    escalate: {when: 离职后 15 日未减员（PRC-130 P15D）, to: SH-M1, note: 提醒，非审批}
  sensitive: false
  note: 减员只写减员日与回执引用，不写缴费基数
- object: AGG-74
  command: 调整缴费基数
  raci:
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  sensitive: true
  sensitive_reason: 登记缴费基数，基数是工资的映射（SPI），同参保增员
  note: 年度调整，追加新版本；S-32 新增
- object: AGG-74
  command: 变更参保缴纳主体
  raci:
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  boundary:
    escalate: {when: 调岗生效后新主体 30 日未增员（P-32）, to: SH-M1, note: 提醒，非审批}
  sensitive: true
  sensitive_reason: 登记缴费基数，基数是工资的映射（SPI），同参保增员
  note: 跨法人调岗引起，原主体减员与新主体增员同事务
- object: AGG-75
  command: 编制激励方案版本
  raci:
    A: {resolve: type, role: SH-E6, function: 人力}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  boundary:
    segregation: [编制人 ≠ 审批人]
  sensitive: false
  note: 激励方案规则与额度为 INTERNAL（非个人级），不敏感
- object: AGG-75
  command: 生效激励方案版本
  raci:
    A: {resolve: instance, field: 激励方案版本.适用范围.责任人, alias: cost_object_owner}
    R: [system]
    C: []
    I: [SH-E6]
  boundary:
    limit_rule: AR-01、AR-02
    segregation: [编制人 ≠ A]
    delegate: {when: AR-11, to: 汇报线上级}
    escalate: {when: AR-12, to: 上级组织负责人}
  sensitive: false
  approval: {approver: cost_object_owner, doc_type: 激励方案审批}
  note: 审批类命令：A 为方案适用范围的责任人（管理层，SH-M1）；回调与到期生效由系统执行
- object: AGG-75
  command: 驳回激励方案版本
  raci:
    A: {resolve: instance, field: 激励方案版本.适用范围.责任人, alias: cost_object_owner}
    R: [platform.approval]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 审批人驳回决定经审批平台回调落地
- object: AGG-75
  command: 撤回激励方案版本
  raci:
    A: {resolve: instance, field: 激励方案版本.编制人}
    R: [SH-E6]
    C: []
    I: []
  sensitive: false
- object: AGG-76
  command: 草拟奖金核定
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: [SH-E1]
    I: [SH-E6]
  sensitive: true
  sensitive_reason: 人力重新触发草拟时需看到个人奖金草案金额（工资类 L3）
  note: 系统按方案规则草拟；人力在调整评估或方案后手工重新触发，不改额
- object: AGG-76
  command: 核定奖金
  raci:
    A: {resolve: instance, field: 被核定人员所在组织单元.负责人, alias: cost_object_owner}
    R: [SH-E1]
    C: []
    I: [SH-E6]
  boundary:
    limit_rule: AR-01、AR-02
    segregation: [核定人 ≠ 被核定人本人]
    delegate: {when: AR-11, to: 汇报线上级}
    escalate: {when: AR-12, to: 上级组织负责人}
  sensitive: true
  sensitive_reason: 核定人在审批页看到被核定人的奖金金额（工资类 L3）
  approval: {approver: cost_object_owner, doc_type: 奖金核定审批}
  note: 审批类命令：A 为被核定人员所在组织单元的责任人；评估人与核定人可能同一人，缓解见 vs13.notes.md 结构问题 16
- object: AGG-76
  command: 驳回奖金核定
  raci:
    A: {resolve: instance, field: 被核定人员所在组织单元.负责人, alias: cost_object_owner}
    R: [platform.approval]
    C: []
    I: [SH-E6]
  sensitive: true
  sensitive_reason: 同「核定奖金」
  note: 审批人驳回决定经审批平台回调落地
- object: AGG-93
  command: 建立薪酬档案
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: true
  sensitive_reason: 含薪资标准与发薪账户（金融账户信息，L3），建立与读取均需敏感权限
- object: AGG-93
  command: 调整薪酬档案
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [SH-E6]
    C: []
    I: [cost_object_owner]
  boundary:
    segregation: [调整人 ≠ 调薪决定人]
    limit_rule: 调薪决定若进 platform.approval，则 AR-01、AR-02（U9′）
  sensitive: true
  sensitive_reason: 调薪即改写个人薪资标准（L3），按用户点名的调薪权限判敏感
  pending: {U9: 调薪是否走 platform.approval}
  note: U9 未定：若调薪决定进审批，A 改为员工所在组织单元负责人，并拆出提交与批准
- object: AGG-93
  command: 终止薪酬档案
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 离职事件（Separated）后系统自动结束最后一个生效版本，不读写薪资金额与发薪账户，无人持有执行权限；S-32 新增
- object: AGG-93
  command: 登记补休转加班工资
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
    C: []
    I: [SH-E3]
  sensitive: false
  note: 补休已到期未休或 Separated 触发，系统自动登记补休转加班工资时长，不读写薪资金额与发薪账户，无人持有执行权限；金额由 PRC-124 计算生成；S-41 新增
- object: AGG-120
  command: 更新专项附加扣除
  raci:
    A: {resolve: instance, field: 专项附加扣除声明.所属人员}
    R: [SH-E3, SH-E6]
    C: []
    I: []
  sensitive: false
  note: 专项附加扣除含子女、赡养、住房等家庭与财产信息，属 SPI，按 ADR-0043 登记访问级别；不属 ADR-0032 首批薪酬 L3 资源，是否升格交 one-rules 复核（来源为员工自助还是人力代录入见 U9）
- object: AGG-95
  command: 并入扣缴申报
  raci:
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 系统按利润分配已支付事件自动并入，无人持有执行权限
- object: AGG-95
  command: 生成申报
  raci:
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 系统自动生成并校验，无人持有执行权限
- object: AGG-95
  command: 提交申报
  raci:
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  boundary:
    escalate: {when: 申报期限临近或超期（个税次月十五日内〔中〕；暂拟 P15D，PRC-125）, to: SH-M1, note: 提醒，非审批}
    segregation: [申报登记人 ≠ 缴款资金支出人（B-10 出纳）]
  sensitive: true
  sensitive_reason: 申报明细含全员应税收入、个税与证件号（L3），导出申报文件需敏感权限
- object: AGG-95
  command: 登记缴款
  raci:
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  boundary:
    segregation: [登记人 ≠ 缴款资金支出人（B-10 出纳）]
  sensitive: false
  note: 只登记缴款日、金额合计与回单引用，不含个人级明细
- object: AGG-95
  command: 更正申报
  raci:
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [SH-E6]
    C: []
    I: [SH-M1]
  sensitive: true
  sensitive_reason: 更正涉及个人级申报明细（L3），同「提交申报」
- object: AGG-95
  command: 提交过账候选
  raci:
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 系统自动，过账路由规则见 INV-92
- object: AGG-119
  command: 发布薪酬规则版本
  raci:
    A: {resolve: type, role: SH-E6, function: 薪酬规则确认}
    R: [SH-E6]
    C: [SH-E6]
    I: [SH-M1]
  boundary:
    segregation: [编制人 ≠ 确认人（U7③ 推荐）]
  sensitive: false
  note: 规则版本（税率表、扣除标准、社保公积金比例）为 INTERNAL 配置，非个人级；但它决定全员薪酬计算结果，人力出、财务确认见 U7③
roles:
