# VS-13 考勤类聚合事件目录（收敛产物，提议稿）。事件名取聚合稿 AGG 事件列与分片 emits，不自造；负载只含 ID 与值对象（时长、日期、月份、代码）。
# 聚合稿其余命令的「（内部）」不发布事件。复用 EventCatalogueTest 口径与 processes_check.py 的校验待 one-architecture 并入。
# subscribers 的 type：流程（某 PRC 步骤订阅）、事件策略（同 BC 反应）、仅分析。读取（api）不算订阅，写在 note。

bc: [B-27, B-14]
published:
- name: 请假已批准
  published_by: AGG-70
  by_command: 批准请假
  payload: [请假ID, 员工ID, 假期类型码, 起止时刻, 时长（分钟）, 批准方式（规则自动 / 人审）, 审批实例ID（可空）, 批准时间]
  subscribers:
  - {type: 事件策略, who: AGG-71 批准转已用, via: 请假批准后转已用, used_by: PRC-116 第 5 步}
  - {type: 仅分析}
  note: 聚合稿写「仅分析」，本流程同 BC 订阅，订阅方列须改；B-06 工时单最低时数经 api 读取已批准与待批请假（INV-65），不订阅
- name: 请假已撤销
  published_by: AGG-70
  by_command: 撤销请假
  payload: [请假ID, 员工ID, 撤销前状态（审批中 / 已批准）, 撤销时间]
  subscribers:
  - {type: 仅分析}
  note: 额度释放与回冲由 PRC-116 同一步骤的 inner 命令完成，不靠订阅此事件
- name: 请假已销假
  published_by: AGG-70
  by_command: 销假
  payload: [请假ID, 员工ID, 实际结束时刻, 回冲时长（分钟）]
  subscribers:
  - {type: 仅分析}
- name: 加班已批准
  published_by: AGG-72
  by_command: 批准加班
  payload: [加班ID, 员工ID, 加班日期, 批准时长（分钟）, 加班类型码, 补偿方式码]
  subscribers:
  - {type: 仅分析}
  note: 聚合稿写「同 BC：AGG-97 汇入当月」，PRC-118 实为生成时读取（api），不订阅；补偿方式为补休的由 PRC-117 第 2 步判断后接第 4 步计入补休额度（同流程接续，不靠订阅）
- name: 加班已补偿
  published_by: AGG-72
  by_command: 标记加班已补偿
  payload: [加班ID, 员工ID, 补偿方式码, 月度考勤确认ID]
  subscribers:
  - {type: 仅分析}
  note: 加班费计入薪酬由 B-15 经 api 读取月度考勤，不订阅此事件；只发于补偿方式为付薪的加班，补休的不发（改标已计入补休额度，补偿追踪在 AGG-71 额度行）
- name: 月度考勤已确认
  published_by: AGG-97
  by_command: 员工确认 / 默认确认月度考勤
  payload: [月度考勤确认ID, 员工ID, 月份, 确认方式（员工 / 默认）, 默认确认原因（逾期未确认 / 已离职，可空）, 确认时间]
  subscribers:
  - {type: 事件策略, who: AGG-72 标记加班已补偿, via: 月度考勤确认后标记加班补偿, used_by: PRC-118 第 3 步}
  note: 两条命令发同一事件，订阅方凭确认方式区分
- name: 月度考勤已锁定
  published_by: AGG-97
  by_command: 锁定
  payload: [月度考勤确认ID, 员工ID, 月份, 默认确认原因（可空）, 锁定时间]
  subscribers:
  - {type: 流程, who: B-15, used_by: PRC-124 触发器}
  note: 按人员 × 月发出；法人当月在职人员全部锁定才能算薪，汇聚由 B-27 只读查询承载（vs13.notes.md 结构问题 6）
- name: 标准工时版本已生效
  published_by: AGG-108
  by_command: 发布标准工时版本
  payload: [标准工时版本ID, 法人ID（可空）, 生效区间, 确认人ID]
  subscribers:
  - {type: 仅分析}
  note: B-06 与 B-27 按 ID 与日期经 api 读取，不订阅
- name: 假期规则已生效
  published_by: AGG-118
  by_command: 发布假期规则版本
  payload: [假期规则版本ID, 假期类型码, 适用范围, 生效日]
  subscribers:
  - {type: 仅分析}
  note: 聚合稿：AGG-71 年度开账按 ID 与日期读取，不订阅
- name: 补休已到期未休
  name_status: 〔缺〕S-41 提议名，待 one-glossary 登记
  published_by: AGG-71
  by_command: 补休到期转计薪
  payload: [员工ID, 补休额度行ID, 到期日]
  subscribers:
  - {type: 流程, who: B-15, used_by: PRC-178 触发器（入口 1）}
  note: 补休额度有效期（时长待 U15）届满仍有未休余额时发；载荷不含余额，B-15 经 api 读取（边 B-15 → B-27 已有）；离职时不发此事件，B-15 直接订阅 Separated（PRC-178 入口 2）
- name: 工作日历锁定日期被修改
  published_by: AGG-68
  by_command: 维护工作日历年度
  payload: [日历年度, 法人ID（可空）, 变更日期集合]
  subscribers:
  - {type: 仅分析}
  note: 订阅方以代码为准（聚合稿）；术语表另有「工作日历年度已维护」（WorkCalendarYearMaintained），两者关系见 vs13att.notes.md 结构问题 7
consumed:
- name: 审批已通过
  from: platform.approval
  handled_by: [批准请假]
  used_by: [PRC-116 第 4 步入口]
- name: 审批已驳回
  from: platform.approval
  handled_by: [驳回请假]
  used_by: [PRC-116 第 6 步]
- name: 审批已撤回
  from: platform.approval
  handled_by: [撤销请假]
  used_by: [PRC-116 第 3 步 withdraw 边]
  note: 事件名由 platform.approval 事件目录定，本稿不自造
- name: Separated
  from: B-13
  handled_by: [事件策略「离职当月考勤默认确认」→ 默认确认月度考勤, 事件策略「离职结算补休余额」→ 离职结算补休余额]
  used_by: [PRC-128 第 7 步（vs07）, 事件策略「离职结算补休余额」（计发见 PRC-178）]
  note: B-27 订阅 B-13 的边及 B-13 事件的订阅方清单需补登（vs07 接缝问题 1）
- name: Employed
  from: B-13
  handled_by: [事件策略「年度开账」→ 开立年度额度账户]
  used_by: [年中入职开账]
  note: 提议订阅，边需补登
not_subscribed:
- {name: 离职登记已撤销（〔缺〕，vs07 提议）, from: B-13, reason: B-27 的离职处置只在 Separated 之后发生（离职日前无待办可撤），撤销登记无需通知 B-27；建议删去 vs07 PRC-128 撤销步骤向 B-27 发该事件的边}
- {name: 任职已变更, from: B-13, reason: 在途请假审批人是否随调岗重新解析待用户定（vs13att.notes.md 待用户定 1）；未定前不订阅}
