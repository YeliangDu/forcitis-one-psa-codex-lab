# VS-13 考勤类聚合权责对照条目（收敛产物，提议稿；格式依 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 A 节）
# 口径：每个「对象×命令」恰一个 A。仅 批准请假 一条需审批（人审路径），A = 实例级 cost_object_owner（申请人所在组织单元的负责人），
#   与 vs13.processes.yaml PRC-116 第 3 步 approval.approver 一致；escalation_rules 对应 boundary.delegate=AR-11、escalate=AR-12。驳回请假是审批决定的回调落地，A 同批准，R=platform.approval。
#   加班批准、月度考勤默认确认与锁定已取消人工（用户新原则），A 取对规则负责的类型级角色（人力 · 考勤），R=system，不持审批权。
#   员工确认是数据主体对自己事实的确认，不是审批：A 为员工本人。
#   sensitive 全 false：本组无命令属 ADR-0032 敏感权限（病假等事由随 ADR-0043 分级可见，那是数据访问级别，不是命令权限），未逐条核对清单，请 one-rules 复核。
#   岗位到人的映射待岗位体系重梳（ADR-0029 搁置），roles 只记 org_needs。

entries:
# ───────── AGG-69 考勤记录 ─────────
- object: AGG-69
  command: 导入考勤记录
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 定时拉取；失败与无法对应人员的记录整批告警人力（I），修复后人力重新拉取
- object: AGG-69
  command: 补卡
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
    C: []
    I: [SH-E1]
  boundary:
    limit_rule: R-b（每月次数上限、补卡时限、只补缺卡；待 U4）
    pending: 'U4：是否仍需上级确认（若需，增审批节点 cost_object_owner 单级）'
  sensitive: false
# ───────── AGG-70 请假 ─────────
- object: AGG-70
  command: 提交请假
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
    C: []
    I: [SH-E1]
  boundary:
    limit_rule: R-a（额度内、假期规则允许、天数不超免审批阈值且无需证明材料则自动批准；阈值与假别清单待 U3）
  sensitive: false
- object: AGG-70
  command: 批准请假
  raci:
    A: {resolve: instance, field: 申请人所在组织单元.负责人, alias: cost_object_owner}
    R: [SH-E1, system]
    C: []
    I: [SH-E3]
  boundary:
    limit_rule: R-a（规则内由系统自动批准并知会 A；超出才人审）
    segregation: [申请人 ≠ A]
    delegate: {when: AR-11, to: 汇报线上级}
    escalate: {when: AR-12, to: 上级组织负责人}
    timeout_escalate: {after: P3D, to: SH-M1, note: 暂拟，待 U3；审批超期升级，非另一级审批}
  sensitive: false
  approval: {approver: cost_object_owner, doc_type: 请假审批}
- object: AGG-70
  command: 驳回请假
  raci:
    A: {resolve: instance, field: 申请人所在组织单元.负责人, alias: cost_object_owner}
    R: [platform.approval]
    C: []
    I: [SH-E3]
  sensitive: false
  note: 审批人的驳回决定经审批平台回调落地，A 同批准
- object: AGG-70
  command: 撤销请假
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
    C: []
    I: [SH-E1]
  sensitive: false
  note: 不再审批；审批中撤销同时撤回审批实例
- object: AGG-70
  command: 销假
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
    C: []
    I: [SH-E1]
  sensitive: false
  note: 事实登记，不再审批，知会直属上级（U3 推荐，待确认）
# ───────── AGG-71 假期余额账户 ─────────
- object: AGG-71
  command: 占用余额
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
    C: []
    I: []
  boundary:
    limit_rule: INV-68（超额度且政策不允许透支则拒绝；允许透支的转人审）
  sensitive: false
- object: AGG-71
  command: 批准转已用
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: []
  sensitive: false
  note: 同 BC 事件反应，规则自动执行
- object: AGG-71
  command: 释放余额占用
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: []
  sensitive: false
- object: AGG-71
  command: 回冲已用额度
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-71
  command: 开立年度额度账户
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: []
  sensitive: false
- object: AGG-71
  command: 年度结转并关闭额度账户
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: []
  sensitive: false
- object: AGG-71
  command: 计入补休额度
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E3, SH-E1]
  sensitive: false
  note: 加班批准后由规则自动执行；有效期长度待 U15；员工与直属上级知晓额度与到期日
- object: AGG-71
  command: 补休到期转计薪
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E3, SH-E6]
  sensitive: false
  note: 定时规则自动执行，不作废；转计薪待处理时告警人力；计发金额归 B-15（PRC-124）
- object: AGG-71
  command: 离职结算补休余额
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 订阅 Separated 的规则自动执行；占用中请假释放不了的告警人力；计发归 B-15（PRC-124）
# ───────── AGG-72 加班 ─────────
- object: AGG-72
  command: 加班申请
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3, SH-E1]
    C: []
    I: [SH-E1, SH-E6]
  boundary:
    limit_rule: R-c（补登期限、与已批准请假重叠拒绝；补偿方式按加班日类型限定：法定节假日只付薪、休息日付薪或补休；月累计超 36 小时只预警知会人力，不拦截；待 U5）
  sensitive: false
  note: 用人经理可代员工登记（R 含 SH-E1）；人力仅在超 36 小时时收到知会
- object: AGG-72
  command: 批准加班
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E3, SH-E1]
  boundary:
    limit_rule: R-d（以打卡可证实时长为准）
  sensitive: false
  note: 取消人工批准；加班费真实性由打卡核实，必要性由超 36 小时预警与月度考勤知会兜底
- object: AGG-72
  command: 驳回加班
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-72
  command: 标记加班已补偿
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: []
  sensitive: false
- object: AGG-72
  command: 标记加班已计补休
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: []
  sensitive: false
  note: 计入补休额度的同一事务内规则自动执行
# ───────── AGG-97 月度考勤确认 ─────────
- object: AGG-97
  command: 生成月度考勤
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 当月有日期导入失败时暂缓生成并知会人力（I）
- object: AGG-97
  command: 员工确认
  raci:
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
    C: []
    I: []
  sensitive: false
  note: 数据主体对自己出勤事实的确认（劳动争议中的出勤证据），不是审批，不设 approval
- object: AGG-97
  command: 重新生成月度考勤
  raci:
    A: {resolve: instance, field: 员工}
    R: [system]
    C: []
    I: []
  sensitive: false
- object: AGG-97
  command: 默认确认月度考勤
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E1]
  boundary:
    limit_rule: R-e（确认期限届满或人员已离职才默认确认；待 U6）
  sensitive: false
  note: 取代人力代确认；用人经理收逾期未确认名单（I）
- object: AGG-97
  command: 锁定
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
    C: []
    I: [SH-E1]
  boundary:
    limit_rule: R-e（确认期限届满自动锁定）
  sensitive: false
  note: 人力不再手工锁定
# ───────── AGG-118 假期类型与额度规则 ─────────
- object: AGG-118
  command: 发布假期规则版本
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [SH-E6]
    C: []
    I: []
  boundary:
    segregation: [发布人 ≠ 确认人（D17 细则 8，待用户定）]
  sensitive: false
# ───────── B-14 ─────────
- object: AGG-68
  command: 维护工作日历年度
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: false
  note: 全员可读；B-06、B-27 经 api 读取
- object: AGG-108
  command: 发布标准工时版本
  raci:
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [SH-E6]
    C: []
    I: []
  boundary:
    segregation: [发布人 ≠ 确认人（D17 细则 8，待用户定）]
  sensitive: false
roles:
  SH-E3:
    positions: [待岗位体系定]
    note: 任一在职员工（请假、补卡、加班、确认的本人）；无全员角色编号，借用 SH-E3
    org_needs: [全部在职员工（B-13 员工引用）, 需通用角色 SH-E0 全体员工，待 one-architecture 定]
  SH-E1:
    positions: [待岗位体系定]
    note: 申请人所在组织单元的负责人 = cost_object_owner（部门负责人 / 用人经理）
    org_needs: [每个组织单元恰有一名负责人字段（责任人），AR-12 判缺位, 汇报线上级（AR-11 上交对象）与上级组织负责人（AR-12 上交对象）, 调岗后在途请假审批人的解析时点待定]
  SH-M1:
    positions: [待岗位体系定]
    note: 请假审批超期升级对象，暂拟，待 U3
    org_needs: [审批超期 P3D 升级接收人]
  SH-E6:
    positions: [待岗位体系定]
    note: 本组职能为人力（考勤）；SH-E6 同时用于人力与财务，按 function 区分
    functions:
      人力（考勤）:
        org_needs: [维护工作日历、标准工时版本、假期规则版本, 修复来源对照后重新拉取考勤, 接收导入失败告警与月度考勤暂缓知会, 法人数据范围内至少 2 人（发布与确认分离）]
  system: {note: 规则自动执行（定时、事件反应、自动批准、默认确认、自动锁定），非人}
  platform.approval: {note: 审批平台回调落地批准 / 驳回命令，非人；审批结果的责任归 A（cost_object_owner）}
