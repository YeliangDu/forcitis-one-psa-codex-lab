# vs0911 事件目录（收敛产物，提议稿）。事件名取聚合稿；负载只含 ID 与值对象。
# subscribers: 订阅方（PRC 步骤 / 同 BC 策略 / 「仅分析」）。通知（notify）不是订阅，不列。

events:

  - name: 经营计划已基线化
    publisher: AGG-79
    emitted_by: 基线化经营计划
    payload: [计划ID, 版本ID, 被取代版本ID（可空）, 目标类型, 基线生效日]
    subscribers: [仅分析]
    note: PRC-88#7（开立预算账户）由 #6 的目标类型分流进入，是流程顺序，不是事件订阅；财务经企业微信通知得知。若日后要自动开户则改为同 BC 策略订阅本事件（提议，当前不做，CS-1.8）。

  - name: 经营复盘已定稿
    publisher: AGG-79
    emitted_by: 〔缺〕定稿经营复盘
    payload: [经营复盘ID, 复盘组织单元ID, 复盘期间, 动作数量, 含调整经营计划类动作（是否）]
    subscribers: [仅分析]
    note: 提议事件（聚合稿 AGG-79 只有经营计划已基线化）；供 reporting 算复盘覆盖率与动作量。PRC-88 的人工触发不订阅本事件，由编制人看动作发起。

  - name: 经营复盘已闭环
    publisher: AGG-79
    emitted_by: 〔缺〕定稿经营复盘（无动作）、〔缺〕完成经营动作（最后一个动作）
    payload: [经营复盘ID, 复盘组织单元ID, 复盘期间, 闭环日]
    subscribers: [仅分析]
    note: 提议事件；供 reporting 算动作按期完成率。

  - name: BudgetReserved
    publisher: AGG-80
    emitted_by: 占用预算
    payload: [预算账户ID, 占用ID, 占用额（金额值对象）, 占用方类型, 占用方单据ID（不校验）, 是否超额]
    subscribers: [仅分析]
    note: 超额预警（AR-03 / RULE-406）若采预警方案，由命令返回标志加预警策略承接，策略归属待用户定 1 后定。

  - name: BudgetReleased
    publisher: AGG-80
    emitted_by: 释放预算占用
    payload: [预算账户ID, 占用ID, 释放额（金额值对象）, 释放原因代码]
    subscribers: [仅分析]

  - name: BudgetConsumed
    publisher: AGG-80
    emitted_by: 〔缺〕消耗预算占用
    payload: [预算账户ID, 占用ID, 消耗额（金额值对象）]
    subscribers: [仅分析]
    note: 聚合稿事件列有，命令列无发出它的命令；命令为〔缺〕提议（孤儿）。

  - name: BudgetAdjusted
    publisher: AGG-80
    emitted_by: 调整预算
    payload: [预算账户ID, 调整记录ID, 调整额（金额值对象）, 调整后额度（金额值对象）]
    subscribers: [仅分析]
    note: 词表预算调整（budget_adjusted）定义为基线新版本的受控变更，口径待 one-glossary 与 one-architecture 定（notes 结构问题 2）。

  - name: 知识条目已发布
    publisher: AGG-107
    emitted_by: 发布知识条目
    payload: [条目ID, 版本ID, 类别, 适用范围（取值）, 有效期（值对象）]
    subscribers: [仅分析]
    note: 引用方（B-02、B-03、B-04、B-28）按 ID 与版本引用，不订阅（INV-115）。

  - name: 知识条目已修订
    publisher: AGG-107
    emitted_by: 修订知识条目
    payload: [条目ID, 新版本ID, 被取代版本ID]
    subscribers: [仅分析]
    note: 发出时机是新版本创建（起草中），不是发布；聚合稿如此，待 one-architecture 确认是否应在新版本发布时发。

  - name: 知识条目已废止
    publisher: AGG-107
    emitted_by: 废止知识条目
    payload: [条目ID, 版本ID]
    subscribers: [仅分析]

inbound_events:
  - {name: 审批已通过, publisher: platform.approval, subscriber_commands: [〔缺〕通过经营计划审批], steps: [PRC-88#5], note: 方向待 one-architecture 在审批回调约定中确认（notes 接缝问题 3、6）}
  - {name: 审批已驳回, publisher: platform.approval, subscriber_commands: [〔缺〕驳回经营计划审批], steps: [PRC-88#4], note: 同上}
  - {name: AccountingPeriodClosed, publisher: B-19, subscriber_commands: [〔缺〕创建经营复盘], steps: [PRC-181#1], note: 月度关账触发复盘创建；B-18 → B-19 事件边聚合稿 §4.1 尚无，见 notes 接缝问题 8}
