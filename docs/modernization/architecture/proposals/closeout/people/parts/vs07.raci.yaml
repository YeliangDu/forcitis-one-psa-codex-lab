# B-13 权责对照条目（收敛产物，提议稿；格式依 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 A 节）
# 口径：每个「对象×命令」恰一个 A。B-13 聚合内的 4 个人工批准（批准招聘需求、批准公司终止、批准调岗申请、批准劳动合同）A = 类型级 resolve: type、role: SH-M1
#   （与 vs07.processes.yaml 骨架 approval.approver: SH-M1 一致；业务上是归属组织单元责任人，实例级待岗位体系重梳，见 vs07.notes.md「权责对照条目」与 V-18），
#   escalation_rules 对应 boundary.delegate=AR-11、escalate=AR-12；这 4 个批准是聚合单级命令，不经 platform.approval，故驳回类命令 R 为批准人本人，不是 platform.approval。
#   非审批命令的 A 取发起或执行方（持发令权，不持审批权）；定时 / 事件反应命令 A 取类型级人力职能、R=system。
# 敏感判据（sensitive，ADR-0032 第 1 项「敏感权限只授给人」）：命令的人类执行者或审批人需要读写个人信息（employees、employment_versions、interviews、hiring_decisions、
#   separation_requests、labor_contracts、practice_certificates 均为 SENSITIVE，ADR-0043）或离职原因类别（可能含健康等特殊个人信息，U-11）或含薪酬约定的劳动合同条款（L3）时为 true，
#   权限逐人授予、不随岗位（ADR-0029 搁置）。组织、职位、招聘需求、任职、法人归属为 INTERNAL 的判 false；员工本人范围内的自助命令与纯系统执行命令判 false 并写理由。
#   权限码名与授予方式（INDIVIDUAL / TWO_PERSON_INDIVIDUAL）由 one-rules 在 permission-grant-modes.txt 登记，本稿只判是否敏感；双人逐人级（如离职、劳动合同薪酬条款）请 one-rules 复核。
# 岗位到人的映射待岗位体系重梳（ADR-0029 搁置），roles 只记 org_needs；SH-E6 内部分岗按 function 区分。
