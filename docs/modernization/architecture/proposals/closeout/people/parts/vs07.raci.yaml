roles:
  SH-E3:
    positions:
    - 待岗位体系定
    note: 任一在职员工（申请离职、撤回的员工本人）；无全员角色编号，借用 SH-E3（沿 b31 口径）
    org_needs:
    - 全部在职员工可在本人范围内申请离职、撤回申请，需通用角色 SH-E0 全体员工，待 one-architecture 定
  SH-E1:
    positions:
    - 待岗位体系定
    note: 用人经理：招聘需求提出人、面试评价与录用决定人
    org_needs:
    - 能提出招聘需求、记录面试、作出录用决定、标记未录用；候选人信息仅限本人所提招聘需求下的候选人（访问限制按 ADR-0043）
  SH-M1:
    positions:
    - 待岗位体系定
    note: A 的类型级占位：归属组织单元责任人（部门负责人，cost_object_owner）；岗位体系定后改实例级（V-18）
    org_needs:
    - 每个组织单元恰有一名负责人字段（AGG-61 责任人），AR-12 判缺位
    - 汇报线上级（AR-11 上交对象）与上级组织负责人（AR-12 上交对象）
    - 区域负责人收数据范围待复核提醒（P-31），非审批
  SH-E6:
    positions:
    - 待岗位体系定
    note: 本组四个职能：人事主数据维护、招聘、人事办理、执业证书管理；SH-E6 无法区分，按 function 区分
    functions:
      人事主数据维护:
        org_needs:
        - 维护法人、组织单元、职位目录、法人归属的人事主数据岗，按法人与组织数据范围授权
        - 至少 2 人（互为后备）
      招聘:
        org_needs:
        - 招聘专员：登记候选人与答复、发出录用通知；候选人个人信息访问限招聘相关角色（ADR-0043），逐人授予
      人事办理:
        org_needs:
        - 人事专员：登记入职、办理转正、办理离职与撤销、提交 / 签订 / 终止依据登记劳动合同、提交调岗申请
        - 公司终止的发起人（人力）与批准人（部门负责人）分人；劳动合同提交人与批准人分人
        - 涉离职原因、劳动合同条款的权限逐人授予（ADR-0032）
      执业证书管理:
        org_needs:
        - 办理并登记延续注册执业证书的人力岗，读 AGG-66
  SH-E7:
    positions:
    - 待岗位体系定
    note: 注册执业人员：登记本人继续教育学时
    org_needs:
    - 持有注册执业证书的员工，在本人范围内登记学时
  SH-H1:
    note: 候选人（外部），不进系统操作，答复由人力登记
    org_needs: []
  SH-R2:
    note: 注册执业管理机构（外部），受理延续注册，由人力线下办理并登记
    org_needs: []
  system:
    note: 规则自动执行（定时生效、事件反应、规则守卫），非人
