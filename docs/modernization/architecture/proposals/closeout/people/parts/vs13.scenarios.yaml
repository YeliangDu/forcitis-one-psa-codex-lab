PRC-115:
- id: PRC-115-S01
  path:
  - 第 1 步 导入考勤记录
  covers:
  - 考勤已导入
  expect: 前一日打卡记录全部导入且人员对应无误，不触发告警，月度考勤可取数
  outcome: 考勤已导入
- id: PRC-115-S02
  path:
  - 第 1 步 导入考勤记录
  - 第 2 步 告警导入失败
  covers:
  - 拉取失败、批次不完整或存在无法对应人员的记录
  - 导入失败已告警
  expect: 拉取失败或批次不完整，整批告警人力与信息，缺失日期不被当作全勤，人力修复后重新拉取
  outcome: 导入失败已告警
- id: PRC-115-S03
  path:
  - 第 1 步 导入考勤记录
  - 第 2 步 告警导入失败
  covers:
  - 拉取失败、批次不完整或存在无法对应人员的记录
  - 导入失败已告警
  expect: 存在无法对应人员的记录时整批不入库并告警，不静默跳过
  outcome: 导入失败已告警
- id: PRC-115-S04
  path:
  - 第 1 步 导入考勤记录
  - 第 3 步 补卡
  covers:
  - 员工发现已导入日期缺卡并发起补卡
  - 补卡已记录
  expect: 补卡另记一条，原打卡记录不改；所属月已锁定则计入下月更正行并标原月份，知会用人经理
  outcome: 补卡已记录
- id: PRC-115-S05
  path:
  - 第 1 步 导入考勤记录
  - 第 3 步 补卡
  - 第 3 步 补卡
  covers:
  - 超出每月补卡次数上限、补卡时限，或该日并不缺卡
  expect: 补卡超次数或超时限或该日并不缺卡，被拒绝并停留在补卡页，不产生记录
  outcome: 补卡已记录
PRC-116:
- id: PRC-116-S01
  path:
  - 第 1 步 占用余额
  covers:
  - 超出可用额度且假期类型政策不允许透支
  - 额度不足被拒
  expect: 额度不足且政策不允许透支，请假被拒，不占用余额
  outcome: 额度不足被拒
- id: PRC-116-S02
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 额度内、假期规则允许、天数不超免审批阈值且无需证明材料
  - 已批准
  expect: 额度内年假等常规请假自动批准，占用转已用，知会直属上级
  outcome: 已批准
- id: PRC-116-S03
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 已批准
  expect: 超阈值长假进入部门负责人审批，审批通过回调后批准，占用转已用
  outcome: 已批准
- id: PRC-116-S04
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 6 步 〔缺〕驳回请假
  covers:
  - 审批驳回
  - 已驳回
  expect: 审批驳回，释放余额占用，申请人收到驳回通知
  outcome: 已驳回
- id: PRC-116-S05
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 7 步 撤销请假
  covers:
  - 员工在审批中撤回
  - 已撤销
  expect: 审批中员工撤回，同时撤回审批实例并释放余额占用
  outcome: 已撤销
- id: PRC-116-S06
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  covers:
  - 请假审批超时 P3D 无人处理升级至管理层
  expect: 审批 3 日无人处理，非中断边界计时触发，升级提醒管理层后结束于已提醒；审批任务不中断，主线照常等待审批人处理
  outcome: 已提醒
- id: PRC-116-S07
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  - 第 7 步 撤销请假
  covers:
  - 请假开始前员工撤销
  - 已撤销
  expect: 已批准但尚未开始的请假，员工撤销，已用额度回冲
  outcome: 已撤销
- id: PRC-116-S08
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  - 第 8 步 销假
  covers:
  - 请假期间员工提前结束
  - 已销假
  expect: 请假已开始后员工提前结束，登记销假，未休完部分回冲已用额度，知会直属上级
  outcome: 已销假
- id: PRC-116-S09
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 已批准
  expect: 申请人本人是部门负责人时，按 AR-11 由其上级审批，批准后转已用
  outcome: 已批准
- id: PRC-116-S10
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 已批准
  expect: 政策允许透支的请假不自动批准，进入人工审批，通过后批准
  outcome: 已批准
- id: PRC-116-S11
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  - 第 7 步 撤销请假
  - 第 8 步 销假
  covers:
  - 请假已开始
  - 已销假
  expect: 请假已开始后员工点撤销，系统不允许撤销，转为销假办理
  outcome: 已销假
- id: PRC-116-S12
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 额度内、假期规则允许、天数不超免审批阈值且无需证明材料
  - 已批准
  expect: 假期类型为补休，不占年度账户，按到期日先后冲抵补休额度行（请假日不晚于额度行到期日），额度内自动批准，占用转已用，知会直属上级；额度行余额不足或请假日已晚于所有额度行到期日，同 S01 被拒
  outcome: 已批准
PRC-117:
- id: PRC-117-S01
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  covers:
  - 加班日考勤已导入
  - 已批准
  expect: 登记加班后，加班日考勤导入时以打卡核实，能支持登记时长即自动批准，不设人工审批
  outcome: 已批准
- id: PRC-117-S02
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  - 第 3 步 〔缺〕驳回加班
  covers:
  - 打卡记录不支持登记的加班时长
  - 已驳回
  expect: 打卡不支持登记的加班时长，驳回并通知登记人
  outcome: 已驳回
- id: PRC-117-S03
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  covers:
  - 已批准
  expect: 当月累计超 36 小时只预警并知会人力、留痕，不拦截登记
  outcome: 已批准
- id: PRC-117-S04
  path:
  - 第 1 步 加班申请
  - 第 1 步 加班申请
  covers:
  - 补登超过允许期限，或加班时段与已批准请假重叠
  expect: 补登超期或与已批准请假重叠，被拒并停留在登记页
  outcome: 已批准
- id: PRC-117-S05
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  covers:
  - 补偿方式为补休
  - 补休已休完
  expect: 休息日加班选补休，打卡核实批准后计一笔补休额度行并把加班标为已计入补休额度；员工在额度到期日前排定补休（走请假，冲抵额度行），额度休完，结束
  outcome: 补休已休完
- id: PRC-117-S06
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  covers:
  - 补休额度到期前 P150D 员工仍未排定补休，非中断边界计时提醒员工与直属上级
  - 已提醒
  expect: 到期前一定时间员工仍未排定补休，非中断边界计时触发，提醒员工与直属上级排定补休后结束于已提醒；主线照常等待员工排定，额度不作废
  outcome: 已提醒
- id: PRC-117-S07
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  - 第 6 步 〔缺〕补休到期转计薪
  covers:
  - 补休额度到期日届满仍有未休余额
  - 补休额度到期日
  - 已转计薪
  expect: 到期日届满仍有未休余额，不作废，转为计薪时长并关闭额度行，当月薪酬由 B-15 按加班工资基数 200% 计发（PRC-124-S10）
  outcome: 已转计薪
- id: PRC-117-S08
  path:
  - 第 1 步 加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  - 第 6 步 〔缺〕补休到期转计薪
  covers:
  - 补休额度到期日届满仍有未休余额
  - 额度行仍有占用中的补休请假
  - 转计薪待处理
  expect: 到期时额度行仍有占用中的补休请假（待批或未开始），先不转计薪，告警人力；请假处理后下次定时再转
  outcome: 转计薪待处理
- id: PRC-117-S09
  path:
  - 第 7 步 〔缺〕离职结算补休余额
  covers:
  - 员工离职生效，仍有未休补休余额
  - 离职余额已结算
  expect: 离职生效（Separated）后，未休补休余额全部转为计薪时长并关闭额度行，随最后一期薪酬按 200% 计发，不作废
  outcome: 离职余额已结算
- id: PRC-117-S10
  path:
  - 第 7 步 〔缺〕离职结算补休余额
  covers:
  - 员工离职生效，仍有未休补休余额
  - 离职时额度行仍有无法释放的占用中请假
  - 结算待处理
  expect: 离职时额度行仍有无法释放的占用中请假，该额度行暂不结算，告警人力处理后再结算，其余额度行照常结算
  outcome: 结算待处理
PRC-118:
- id: PRC-118-S01
  path:
  - 第 1 步 生成月度考勤
  - 第 2 步 员工确认
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 员工确认期限届满
  - 已锁定
  expect: 员工在期限内确认，期限届满后自动锁定，补偿加班标记已补偿
  outcome: 已锁定
- id: PRC-118-S02
  path:
  - 第 1 步 生成月度考勤
  - 第 2 步 员工确认
  - 第 5 步 补卡
  - 第 6 步 〔缺〕重新生成月度考勤
  - 第 2 步 员工确认
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 提出更正
  expect: 员工提出更正，补卡或重提请假后重新生成，再确认并锁定
  outcome: 已锁定
- id: PRC-118-S03
  path:
  - 第 1 步 生成月度考勤
  - 第 2 步 员工确认
  - 第 7 步 〔缺〕默认确认月度考勤
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 确认期限届满仍未确认
  - 员工确认超时 P3D 由系统默认确认并锁定，名单知会用人经理
  expect: 逾期未确认，系统默认确认并标记逾期未确认，随后锁定
  outcome: 已锁定
- id: PRC-118-S04
  path:
  - 第 1 步 生成月度考勤
  - 第 7 步 〔缺〕默认确认月度考勤
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 人员当月已离职（离职生效后账号已吊销，本人无法确认）
  expect: 离职当月账号已吊销，系统默认确认并标记已离职，随后锁定
  outcome: 已锁定
- id: PRC-118-S05
  path:
  - 第 1 步 生成月度考勤
  covers:
  - 当月有日期的考勤导入失败或缺批次
  - 已暂缓
  expect: 当月有日期导入失败或缺批次，暂缓生成并告警人力，不当作全勤
  outcome: 已暂缓
PRC-120:
- id: PRC-120-S01
  path:
  - 第 1 步 编制绩效评估
  - 第 2 步 提交绩效评估
  - 第 3 步 确认绩效评估
  covers:
  - 已确认
  expect: 用人经理编制、提交、确认月度评估，确认后不可改并发出绩效评估已确认
  outcome: 已确认
- id: PRC-120-S02
  path:
  - 第 1 步 编制绩效评估
  covers:
  - 同一人同期同类型已有已确认评估
  expect: 同一人同期同类型已有已确认评估，编制被拒
  outcome: 已确认
- id: PRC-120-S03
  path:
  - 第 1 步 编制绩效评估
  - 第 2 步 提交绩效评估
  - 第 3 步 确认绩效评估
  - 第 4 步 登记绩效更正
  covers:
  - 已确认评估发现错误
  - 已更正
  expect: 已确认评估发现错误，评估人追加更正记录引用原评估，原评估不改，更正未涉及已核定奖金，通知人力后结束
  outcome: 已更正
- id: PRC-120-S04
  path:
  - 第 1 步 编制绩效评估
  - 第 2 步 提交绩效评估
  - 第 3 步 确认绩效评估
  - 第 4 步 登记绩效更正
  covers:
  - 更正的评估已被奖金核定引用
  expect: 更正的评估已被奖金核定引用，人力核对后转 PRC-122 人力触发入口重新草拟奖金，不自动改已核定奖金
  outcome: 转 PRC-122 重新草拟奖金
PRC-121:
- id: PRC-121-S01
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  - 第 3 步 生效激励方案版本
  covers:
  - 方案生效日期到达
  - 已生效
  expect: 编制后审批通过，到生效日期自动生效，不再人工点击
  outcome: 已生效
- id: PRC-121-S02
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  - 第 1 步 编制激励方案版本
  covers:
  - 审批驳回
  expect: 审批驳回，退回编制修改，流程不结束
  outcome: 已生效
- id: PRC-121-S03
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  covers:
  - 编制人在审批中撤回
  - 已撤回
  expect: 编制人在审批中撤回，审批实例撤销，流程以已撤回结束
  outcome: 已撤回
- id: PRC-121-S04
  path:
  - 第 1 步 编制激励方案版本
  - 第 1 步 编制激励方案版本
  covers:
  - 生效日期早于已核定奖金所属期
  expect: 生效日期早于已核定奖金所属期，被拒并停留在编辑页
  outcome: 已生效
- id: PRC-121-S05
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  - 第 3 步 生效激励方案版本
  covers:
  - 已生效
  expect: 方案额度合计超阈值时审批加一级（AR-01），通过后到期自动生效
  outcome: 已生效
PRC-122:
- id: PRC-122-S01
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  - 第 2 步 奖金核定审批
  - 第 3 步 核定奖金
  covers:
  - 已核定
  expect: 月度评估确认后系统草拟，责任人批准，审批通过的回调后核定奖金
  outcome: 已核定
- id: PRC-122-S02
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  covers:
  - 评估类型不是月度（如试用期评估），无需核定
  - 无需核定
  expect: 试用期评估确认不触发奖金核定
  outcome: 无需核定
- id: PRC-122-S03
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  covers:
  - 没有生效的激励方案版本，或草拟金额超出方案额度，已中止
  - 已中止
  expect: 没有生效方案或草拟金额超额度，已中止并告警人力
  outcome: 已中止
- id: PRC-122-S04
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  - 第 2 步 奖金核定审批
  - 第 4 步 〔缺〕驳回奖金核定
  covers:
  - 审批驳回
  - 已驳回
  expect: 责任人驳回，奖金不核定，通知人力调整后重新草拟
  outcome: 已驳回
- id: PRC-122-S05
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  - 第 2 步 奖金核定审批
  - 第 3 步 核定奖金
  covers:
  - 已核定
  expect: 奖金金额超阈值时加一级或两级审批（AR-01、AR-02），通过后核定
  outcome: 已核定
PRC-124:
- id: PRC-124-S01
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 4 步 批准
  - 第 5 步 提交过账候选
  covers:
  - 已批准
  expect: 法人当月人员全部锁定后自动计算，薪酬岗提交，责任人批准，提交过账候选
  outcome: 已批准
- id: PRC-124-S02
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 1 步 计算
  covers:
  - 审批驳回，退回重算
  expect: 审批驳回退回重算，重新计算后再提交
  outcome: 已批准
- id: PRC-124-S03
  path:
  - 第 1 步 计算
  covers:
  - 该法人当月仍有在职人员月度考勤未锁定，待锁定
  - 待锁定
  expect: 仍有人员考勤未锁定，不计算，待全部锁定后再触发
  outcome: 待锁定
- id: PRC-124-S04
  path:
  - 第 1 步 计算
  covers:
  - 有人员没有生效的薪酬档案版本、应参保人员没有参保基数或没有适用的薪酬规则版本，已中止
  - 已中止
  expect: 缺薪酬档案、参保基数或规则版本，已中止并告警人力
  outcome: 已中止
- id: PRC-124-S05
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 4 步 批准
  - 第 5 步 提交过账候选
  covers:
  - 薪酬审核超时 P2D 无人处理升级至管理层
  expect: 审批 2 日无人处理，升级提醒管理层（不打断原审批）
  outcome: 已批准
- id: PRC-124-S06
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 1 步 计算
  covers:
  - 提交人撤回审批
  expect: 提交人撤回审批，退回重算
  outcome: 已批准
- id: PRC-124-S07
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 1 步 计算
  covers:
  - 核对发现需修正输入后重算
  expect: 薪酬岗核对异常清单发现输入有误，修正后重算，不进入审批
  outcome: 已批准
- id: PRC-124-S08
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 4 步 批准
  - 第 5 步 提交过账候选
  covers:
  - 已批准
  expect: 薪酬总额超阈值时加一级或两级审批（AR-01、AR-02）
  outcome: 已批准
- id: PRC-124-S09
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 4 步 批准
  - 第 5 步 提交过账候选
  covers:
  - 薪酬所属会计期间已关账，路由到开放期间
  expect: 所属期间已关账，过账路由到开放期间并标原期间，不拒绝
  outcome: 已批准
- id: PRC-124-S10
  path:
  - 第 1 步 计算
  - 第 2 步 提交审核
  - 第 3 步 薪酬审核
  - 第 4 步 批准
  - 第 5 步 提交过账候选
  covers:
  - 已批准
  expect: 当月有补休到期未休或离职结算的补休转计薪时长，计算时读取并按加班工资基数折算的时薪 × 200% 计入加班费，已读过的额度行不重复计；缺加班工资基数按已中止处理，不静默按零
  outcome: 已批准
PRC-125:
- id: PRC-125-S01
  path:
  - 第 1 步 生成申报
  - 第 2 步 提交申报
  - 第 3 步 提交申报
  - 第 4 步 登记缴款
  - 第 6 步 提交过账候选
  covers:
  - 已申报缴款
  expect: 系统生成申报数据，人力线下申报并登记回执与缴款，提交过账候选
  outcome: 已申报缴款
- id: PRC-125-S02
  path:
  - 第 1 步 生成申报
  covers:
  - 人员缺证件信息或申报金额与薪酬结算不一致
  - 已中止
  expect: 证件信息缺失或金额与薪酬结算不一致，已中止并告警
  outcome: 已中止
- id: PRC-125-S03
  path:
  - 第 1 步 生成申报
  - 第 2 步 提交申报
  - 第 3 步 提交申报
  - 第 4 步 登记缴款
  - 第 5 步 更正申报
  - 第 4 步 登记缴款
  - 第 6 步 提交过账候选
  covers:
  - 申报被退回或发现差错
  expect: 申报被退回，更正申报后重新登记缴款
  outcome: 已申报缴款
- id: PRC-125-S04
  path:
  - 第 1 步 生成申报
  - 第 2 步 提交申报
  - 第 3 步 提交申报
  - 第 4 步 登记缴款
  - 第 6 步 提交过账候选
  covers:
  - 已申报缴款
  expect: 股息红利并入项随同期申报批次一并申报
  outcome: 已申报缴款
- id: PRC-125-S05
  path:
  - 第 1 步 生成申报
  - 第 2 步 提交申报
  covers:
  - 提交申报超时 P15D 升级至管理层
  expect: 申报期限前未提交，非中断升级提醒管理层督办后结束于已提醒；提交申报任务不中断，主线照常办理
  outcome: 已提醒
- id: PRC-125-S06
  path:
  - 第 1 步 生成申报
  - 第 2 步 提交申报
  - 第 3 步 提交申报
  - 第 4 步 登记缴款
  - 第 6 步 提交过账候选
  covers:
  - 所属会计期间已关账，路由到开放期间
  expect: 所属会计期间已关账，过账路由到开放期间并标原期间
  outcome: 已申报缴款
- id: PRC-125-S07
  path:
  - 第 7 步 调整缴费基数
  - 第 8 步 提交申报
  covers:
  - 基数已调整
  expect: 年度缴费基数调整期到达，人力核对核定依据后登记新参保版本，在经办平台办理并回填回执，基数已调整
  outcome: 基数已调整
PRC-113:
- id: PRC-113-S01
  path:
  - 第 1 步 并入扣缴申报
  covers:
  - 已并入申报
  expect: 自然人股东的分红按 20% 代扣并并入当期个税申报批次
  outcome: 已并入申报
- id: PRC-113-S02
  path:
  - 第 1 步 并入扣缴申报
  covers:
  - 股东是法人或机构
  - 无需扣缴
  expect: 法人股东不涉及个税，不并入申报
  outcome: 无需扣缴
PRC-126:
- id: PRC-126-S01
  path:
  - 第 1 步 提交应付薪酬
  covers:
  - 应付已提交
  expect: 薪酬批准后提交法人 × 月一笔实发合计的应付
  outcome: 应付已提交
- id: PRC-126-S02
  path:
  - 第 1 步 提交应付薪酬
  covers:
  - 该薪酬结算已提交过应付
  expect: 重复触发按来源单据 ID 幂等，不重复提交
  outcome: 应付已提交
PRC-127:
- id: PRC-127-S01
  path:
  - 第 1 步 标记薪酬已发放
  covers:
  - 已发放
  expect: 应付结清后置已发放，工资条可查看并通知员工
  outcome: 已发放
- id: PRC-127-S02
  path:
  - 第 1 步 标记薪酬已发放
  covers:
  - 已发放
  expect: 退票时付款已失败，应付未结清，不触发本流程，薪酬保持已批准
  outcome: 已发放
- id: PRC-127-S03
  path:
  - 第 1 步 标记薪酬已发放
  covers:
  - 该薪酬的过账事实已入账
  expect: 置已发放时过账事实已入账，转 PRC-134 置已过账
  outcome: 已发放
PRC-134:
- id: PRC-134-S01
  path:
  - 第 1 步 标记已过账
  covers:
  - 已过账
  expect: 薪酬已发放后过账完成，置已过账
  outcome: 已过账
- id: PRC-134-S02
  path:
  - 第 1 步 标记已过账
  covers:
  - 薪酬尚未发放
  - 待发放后再置位
  expect: 过账先于发放，记标志，待薪酬发放完成流程触发后再置位
  outcome: 待发放后再置位
PRC-145:
- id: PRC-145-S01
  path:
  - 第 1 步 比对三口径
  covers:
  - 三口径一致
  expect: 劳动合同用人单位、数据范围法人、扣缴义务人三者一致，不预警
  outcome: 三口径一致
- id: PRC-145-S02
  path:
  - 第 1 步 比对三口径
  covers:
  - 三口径中任意两个不一致
  - 已预警
  expect: 三口径中任意两个不一致，预警人力，不拒绝；同一差异已有未处理预警不重复发
  outcome: 已预警
PRC-119:
- id: PRC-119-S01
  path:
  - 第 1 步 维护工作日历年度
  covers:
  - 工作日历已维护
  expect: 人力依据国家节假日安排维护当年法定节假日与调休
  outcome: 工作日历已维护
- id: PRC-119-S02
  path:
  - 第 2 步 发布标准工时版本
  covers:
  - 同一法人（空为默认）已有版本的生效区间重叠
  - 版本被拒
  expect: 新标准工时版本与现有版本生效区间重叠，被拒
  outcome: 版本被拒
- id: PRC-119-S03
  path:
  - 第 2 步 发布标准工时版本
  covers:
  - 标准工时版本已发布
  expect: 新标准工时版本区间不重叠，发布并生效，生效后不可改
  outcome: 标准工时版本已发布
PRC-123:
- id: PRC-123-S01
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 薪酬档案已调整
  expect: 调薪生效日在未结月份，引用调薪决定依据后产生新版本，发出薪酬档案已变更
  outcome: 薪酬档案已调整
- id: PRC-123-S02
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 生效日早于已批准的月度薪酬所属月
  expect: 已批准结算不改，补发补扣由下月结算更正行承接
  outcome: 薪酬档案已调整
- id: PRC-123-S03
  path:
  - 第 2 步 更新专项附加扣除
  covers:
  - 专项附加扣除已更新
  expect: 员工本人（或人力代录入）年度更新专项附加扣除，由 AGG-120 追加新声明并取代旧声明，不设审批
  outcome: 专项附加扣除已更新
- id: PRC-123-S04
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 未引用调薪决定依据
  - 调整被拒
  expect: 未引用调薪决定依据，调整被拒
  outcome: 调整被拒
PRC-160:
- id: PRC-160-S01
  path:
  - 第 1 步 年度结转并关闭额度账户
  - 第 2 步 开立年度额度账户
  covers:
  - 年度账户已开立
  expect: 年初对每名在职人员先按上年规则结转并关闭上年账户，再按当日生效规则版本开立新年度账户（含上年结转）
  outcome: 年度账户已开立
- id: PRC-160-S02
  path:
  - 第 1 步 年度结转并关闭额度账户
  - 第 2 步 开立年度额度账户
  covers:
  - 无上年度账户（年中入职触发）
  - 年度账户已开立
  expect: 年中入职由入职生效触发，无上年账户，按规则折算应享后直接开立当年账户
  outcome: 年度账户已开立
- id: PRC-160-S03
  path:
  - 第 1 步 年度结转并关闭额度账户
  covers:
  - 上年账户仍有占用中的占用行
  - 结转待处理
  expect: 上年账户仍有占用中的占用行（跨年请假未处理），结转与开账暂停并告警人力，处理后重新触发
  outcome: 结转待处理
PRC-162:
- id: PRC-162-S01
  path:
  - 第 1 步 发布假期规则版本
  covers:
  - 假期规则版本已发布
  expect: 人力发布新的假期规则版本，区间不与既有版本重叠，发布即生效，生效后不可改
  outcome: 假期规则版本已发布
- id: PRC-162-S02
  path:
  - 第 1 步 发布假期规则版本
  covers:
  - 同一假期类型同一适用范围的生效区间与既有版本重叠
  - 版本被拒
  expect: 同一假期类型同一适用范围生效区间与既有版本重叠，被 INV-123 拒绝
  outcome: 版本被拒
