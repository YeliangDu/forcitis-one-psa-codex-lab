PRC-115:
- id: PRC-115-S01
  path:
  - 第 1 步 导入考勤记录
  covers:
  - 考勤已导入
  expect: 前一日打卡记录全部导入且人员对应无误，不触发告警，月度考勤可取数
  outcome: 考勤已导入
- id: PRC-115-S02
  path:
  - 第 1 步 导入考勤记录
  - 第 2 步 告警导入失败
  covers:
  - 拉取失败、批次不完整或存在无法对应人员的记录
  - 导入失败已告警
  expect: 拉取失败或批次不完整，整批告警人力与信息，缺失日期不被当作全勤，人力修复后重新拉取
  outcome: 导入失败已告警
- id: PRC-115-S03
  path:
  - 第 1 步 导入考勤记录
  - 第 2 步 告警导入失败
  covers:
  - 拉取失败、批次不完整或存在无法对应人员的记录
  - 导入失败已告警
  expect: 存在无法对应人员的记录时整批不入库并告警，不静默跳过
  outcome: 导入失败已告警
- id: PRC-115-S04
  path:
  - 第 1 步 导入考勤记录
  - 第 3 步 补卡
  covers:
  - 员工发现已导入日期缺卡并发起补卡
  - 补卡已记录
  expect: 补卡另记一条，原打卡记录不改；所属月已锁定则计入下月更正行并标原月份，知会用人经理
  outcome: 补卡已记录
- id: PRC-115-S05
  path:
  - 第 1 步 导入考勤记录
  - 第 3 步 补卡
  - 第 3 步 补卡
  covers:
  - 超出每月补卡次数上限、补卡时限，或该日并不缺卡
  expect: 补卡超次数或超时限或该日并不缺卡，被拒绝并停留在补卡页，不产生记录
  outcome: 补卡已记录
PRC-116:
- id: PRC-116-S01
  path:
  - 第 1 步 占用余额
  covers:
  - 超出可用额度且假期类型政策不允许透支
  - 额度不足被拒
  expect: 额度不足且政策不允许透支，请假被拒，不占用余额
  outcome: 额度不足被拒
- id: PRC-116-S02
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 额度内、假期规则允许、天数不超免审批阈值且无需证明材料
  - 已批准
  expect: 额度内年假等常规请假自动批准，占用转已用，知会直属上级
  outcome: 已批准
- id: PRC-116-S03
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 已批准
  expect: 超阈值长假进入部门负责人审批，审批通过回调后批准，占用转已用
  outcome: 已批准
- id: PRC-116-S04
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 6 步 〔缺〕驳回请假
  covers:
  - 审批驳回
  - 已驳回
  expect: 审批驳回，释放余额占用，申请人收到驳回通知
  outcome: 已驳回
- id: PRC-116-S05
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 7 步 撤销请假
  covers:
  - 员工在审批中撤回
  - 已撤销
  expect: 审批中员工撤回，同时撤回审批实例并释放余额占用
  outcome: 已撤销
- id: PRC-116-S06
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  covers:
  - 请假审批超时 P3D 无人处理升级至管理层
  expect: 审批 3 日无人处理，非中断边界计时触发，升级提醒管理层后结束于已提醒；审批任务不中断，主线照常等待审批人处理
  outcome: 已提醒
- id: PRC-116-S07
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  - 第 7 步 撤销请假
  covers:
  - 请假开始前员工撤销
  - 已撤销
  expect: 已批准但尚未开始的请假，员工撤销，已用额度回冲
  outcome: 已撤销
- id: PRC-116-S08
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  - 第 8 步 销假
  covers:
  - 请假期间员工提前结束
  - 已销假
  expect: 请假已开始后员工提前结束，登记销假，未休完部分回冲已用额度，知会直属上级
  outcome: 已销假
- id: PRC-116-S09
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 已批准
  expect: 申请人本人是部门负责人时，按 AR-11 由其上级审批，批准后转已用
  outcome: 已批准
- id: PRC-116-S10
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 3 步 请假审批
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 已批准
  expect: 政策允许透支的请假不自动批准，进入人工审批，通过后批准
  outcome: 已批准
- id: PRC-116-S11
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  - 第 7 步 撤销请假
  - 第 8 步 销假
  covers:
  - 请假已开始
  - 已销假
  expect: 请假已开始后员工点撤销，系统不允许撤销，转为销假办理
  outcome: 已销假
- id: PRC-116-S12
  path:
  - 第 1 步 占用余额
  - 第 2 步 提交请假
  - 第 4 步 批准请假
  - 第 5 步 批准转已用
  covers:
  - 额度内、假期规则允许、天数不超免审批阈值且无需证明材料
  - 已批准
  expect: 假期类型为补休，不占年度账户，按到期日先后冲抵补休额度行（请假日不晚于额度行到期日），额度内自动批准，占用转已用，知会直属上级；额度行余额不足或请假日已晚于所有额度行到期日，同 S01 被拒
  outcome: 已批准
PRC-117:
- id: PRC-117-S01
  path:
  - 第 1 步 提交加班申请
  - 第 2 步 批准加班
  covers:
  - 加班日考勤已导入
  - 已批准
  expect: 登记加班后，加班日考勤导入时以打卡核实，能支持登记时长即自动批准，不设人工审批
  outcome: 已批准
- id: PRC-117-S02
  path:
  - 第 1 步 提交加班申请
  - 第 2 步 批准加班
  - 第 3 步 〔缺〕驳回加班
  covers:
  - 打卡记录不支持登记的加班时长
  - 已驳回
  expect: 打卡不支持登记的加班时长，驳回并通知登记人
  outcome: 已驳回
- id: PRC-117-S03
  path:
  - 第 1 步 提交加班申请
  - 第 2 步 批准加班
  covers:
  - 已批准
  expect: 当月累计超 36 小时只预警并知会人力、留痕，不拦截登记
  outcome: 已批准
- id: PRC-117-S04
  path:
  - 第 1 步 提交加班申请
  - 第 1 步 提交加班申请
  covers:
  - 补登超过允许期限，或加班时段与已批准请假重叠
  expect: 补登超期或与已批准请假重叠，被拒并停留在登记页
  outcome: 已批准
- id: PRC-117-S05
  path:
  - 第 1 步 提交加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  covers:
  - 补偿方式为补休
  - 补休已休完
  expect: 休息日加班计补休，打卡核实批准后计一笔补休额度行并把加班标为已计入补休额度；员工在额度到期日前排定补休（走请假，冲抵额度行），额度休完，结束
  outcome: 补休已休完
- id: PRC-117-S06
  path:
  - 第 1 步 提交加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  covers:
  - 有效期届满前（时长待用户定 U15）员工仍未排定补休，非中断边界计时提醒员工与直属上级
  - 已提醒
  expect: 有效期届满前（时长待用户定 U15）员工仍未排定补休，非中断边界计时触发，提醒员工与直属上级排定补休后结束于已提醒；主线照常等待员工排定，额度不作废
  outcome: 已提醒
- id: PRC-117-S07
  path:
  - 第 1 步 提交加班申请
  - 第 2 步 批准加班
  - 第 4 步 〔缺〕计入补休额度
  - 第 5 步 提交请假
  covers:
  - 补休额度有效期届满仍有未休余额
  - 已移交计发
  expect: 有效期届满仍有未休余额，额度不作废，由 B-27 发补休已到期未休，交 PRC-178 由 B-15 转计发加班工资（PRC-178-S01）；PRC-117 到此结束
  outcome: 已移交计发
PRC-118:
- id: PRC-118-S01
  path:
  - 第 1 步 生成月度考勤
  - 第 2 步 员工确认
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 员工确认期限届满
  - 已锁定
  expect: 员工在期限内确认，期限届满后自动锁定，补偿加班标记已补偿
  outcome: 已锁定
- id: PRC-118-S02
  path:
  - 第 1 步 生成月度考勤
  - 第 2 步 员工确认
  - 第 5 步 补卡
  - 第 6 步 〔缺〕重新生成月度考勤
  - 第 2 步 员工确认
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 提出更正
  expect: 员工提出更正，补卡或重提请假后重新生成，再确认并锁定
  outcome: 已锁定
- id: PRC-118-S03
  path:
  - 第 1 步 生成月度考勤
  - 第 2 步 员工确认
  - 第 7 步 〔缺〕默认确认月度考勤
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 确认期限届满仍未确认
  - 员工确认超时 P3D 由系统默认确认并锁定，名单知会用人经理
  expect: 逾期未确认，系统默认确认并标记逾期未确认，随后锁定
  outcome: 已锁定
- id: PRC-118-S04
  path:
  - 第 1 步 生成月度考勤
  - 第 7 步 〔缺〕默认确认月度考勤
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 人员当月已离职（离职生效后账号已吊销，本人无法确认）
  expect: 离职当月账号已吊销，系统默认确认并标记已离职，随后锁定
  outcome: 已锁定
- id: PRC-118-S05
  path:
  - 第 1 步 生成月度考勤
  covers:
  - 当月有日期的考勤导入失败或缺批次
  - 已暂缓
  expect: 当月有日期导入失败或缺批次，暂缓生成并告警人力，不当作全勤
  outcome: 已暂缓
- id: PRC-118-S06
  path:
  - 第 7 步 〔缺〕默认确认月度考勤
  - 第 3 步 标记加班已补偿
  - 第 4 步 锁定
  covers:
  - 员工离职生效（订阅 Separated）
  - 已锁定
  expect: 员工离职生效，该人员离职当月已生成未确认的月度考勤立即默认确认并标记已离职，随后锁定，不等确认期限（S-42）
  outcome: 已锁定
PRC-120:
- id: PRC-120-S01
  path:
  - 第 1 步 编制绩效评估
  - 第 2 步 提交绩效评估
  - 第 3 步 确认绩效评估
  covers:
  - 已确认
  expect: 用人经理编制、提交、确认月度评估，确认后不可改并发出绩效评估已确认
  outcome: 已确认
- id: PRC-120-S02
  path:
  - 第 1 步 编制绩效评估
  covers:
  - 同一人同期同类型已有已确认评估
  expect: 同一人同期同类型已有已确认评估，编制被拒
  outcome: 已确认
- id: PRC-120-S03
  path:
  - 第 1 步 编制绩效评估
  - 第 2 步 提交绩效评估
  - 第 3 步 确认绩效评估
  - 第 4 步 登记绩效更正
  covers:
  - 已确认评估发现错误
  - 已更正
  expect: 已确认评估发现错误，评估人追加更正记录引用原评估，原评估不改，更正未涉及已核定奖金，通知人力后结束
  outcome: 已更正
- id: PRC-120-S04
  path:
  - 第 1 步 编制绩效评估
  - 第 2 步 提交绩效评估
  - 第 3 步 确认绩效评估
  - 第 4 步 登记绩效更正
  covers:
  - 更正的评估已被奖金核定引用
  expect: 更正的评估已被奖金核定引用，人力核对后转 PRC-122 人力触发入口重新草拟奖金，不自动改已核定奖金
  outcome: 转 PRC-122 重新草拟奖金
PRC-121:
- id: PRC-121-S01
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  - 第 3 步 生效激励方案版本
  covers:
  - 方案生效日期到达
  - 已生效
  expect: 编制后审批通过，到生效日期自动生效，不再人工点击
  outcome: 已生效
- id: PRC-121-S02
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  - 第 1 步 编制激励方案版本
  covers:
  - 审批驳回
  expect: 审批驳回，退回编制修改，流程不结束
  outcome: 已生效
- id: PRC-121-S03
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  covers:
  - 编制人在审批中撤回
  - 已撤回
  expect: 编制人在审批中撤回，审批实例撤销，流程以已撤回结束
  outcome: 已撤回
- id: PRC-121-S04
  path:
  - 第 1 步 编制激励方案版本
  - 第 1 步 编制激励方案版本
  covers:
  - 生效日期早于已核定奖金所属期
  expect: 生效日期早于已核定奖金所属期，被拒并停留在编辑页
  outcome: 已生效
- id: PRC-121-S05
  path:
  - 第 1 步 编制激励方案版本
  - 第 2 步 激励方案审批
  - 第 3 步 生效激励方案版本
  covers:
  - 已生效
  expect: 方案额度合计超阈值时审批加一级（AR-01），通过后到期自动生效
  outcome: 已生效
PRC-122:
- id: PRC-122-S01
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  - 第 2 步 奖金核定审批
  - 第 3 步 核定奖金
  - 第 5 步 提交过账候选
  covers:
  - 已核定
  expect: 月度评估确认后系统草拟，责任人批准，审批通过的回调后核定奖金；按被核定人员服务期间（考核期间）各项目直接人工占比拆分，提交「奖金核定重分类」记账事实（借 奖金（计提）贷 奖金（已核定），按法人与项目），不进成本
  outcome: 已核定
- id: PRC-122-S02
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  covers:
  - 评估类型不是月度（如试用期评估），无需核定
  - 无需核定
  expect: 试用期评估确认不触发奖金核定
  outcome: 无需核定
- id: PRC-122-S03
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  covers:
  - 没有生效的激励方案版本，或草拟金额超出方案额度，已中止
  - 已中止
  expect: 没有生效方案或草拟金额超额度，已中止并告警人力
  outcome: 已中止
- id: PRC-122-S04
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  - 第 2 步 奖金核定审批
  - 第 4 步 〔缺〕驳回奖金核定
  covers:
  - 审批驳回
  - 已驳回
  expect: 责任人驳回，奖金不核定，通知人力调整后重新草拟
  outcome: 已驳回
- id: PRC-122-S05
  path:
  - 第 1 步 〔缺〕草拟奖金核定
  - 第 2 步 奖金核定审批
