- id: PRC-145-S01
  path:
  - 第 1 步 比对三口径
  covers:
  - 三口径一致
  expect: 劳动合同用人单位、数据范围法人、扣缴义务人三者一致，不预警
  outcome: 三口径一致
- id: PRC-145-S02
  path:
  - 第 1 步 比对三口径
  covers:
  - 三口径中任意两个不一致
  - 已预警
  expect: 三口径中任意两个不一致，预警人力，不拒绝；同一差异已有未处理预警不重复发
  outcome: 已预警
PRC-119:
- id: PRC-119-S01
  path:
  - 第 1 步 维护工作日历年度
  covers:
  - 工作日历已维护
  expect: 人力依据国家节假日安排维护当年法定节假日与调休
  outcome: 工作日历已维护
- id: PRC-119-S02
  path:
  - 第 2 步 发布标准工时版本
  covers:
  - 同一法人（空为默认）已有版本的生效区间重叠
  - 版本被拒
  expect: 新标准工时版本与现有版本生效区间重叠，被拒
  outcome: 版本被拒
- id: PRC-119-S03
  path:
  - 第 2 步 发布标准工时版本
  covers:
  - 标准工时版本已发布
  expect: 新标准工时版本区间不重叠，发布并生效，生效后不可改
  outcome: 标准工时版本已发布
PRC-123:
- id: PRC-123-S01
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 薪酬档案已调整
  expect: 调薪生效日在未结月份，引用调薪决定依据后产生新版本，发出薪酬档案已变更
  outcome: 薪酬档案已调整
- id: PRC-123-S02
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 生效日早于已批准的月度薪酬所属月
  expect: 已批准结算不改，补发补扣由下月结算更正行承接
  outcome: 薪酬档案已调整
- id: PRC-123-S03
  path:
  - 第 2 步 更新专项附加扣除
  covers:
  - 专项附加扣除已更新
  expect: 员工本人（或人力代录入）年度更新专项附加扣除，由 AGG-120 追加新声明并取代旧声明，不设审批
  outcome: 专项附加扣除已更新
- id: PRC-123-S04
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 未引用调薪决定依据
  - 调整被拒
  expect: 未引用调薪决定依据，调整被拒
  outcome: 调整被拒
- id: PRC-123-S05
  path:
  - 第 1 步 调整薪酬档案
  covers:
  - 转正已办理
  - 薪酬档案已调整
  expect: 收到转正已办理，生成待办提醒薪酬岗，按劳动合同约定的转正工资登记新版本（版本生效日 = 转正日，U-12），引用劳动合同或转正决定为依据；不自动改薪
  outcome: 薪酬档案已调整
PRC-160:
- id: PRC-160-S01
  path:
  - 第 1 步 年度结转额度账户
  - 第 2 步 开立年度额度账户
  covers:
  - 年度账户已开立
  expect: 年初对每名在职人员先按上年规则结转上年账户，再按当日生效规则版本开立新年度账户（含上年结转）
  outcome: 年度账户已开立
- id: PRC-160-S02
  path:
  - 第 1 步 年度结转额度账户
  - 第 2 步 开立年度额度账户
  covers:
  - 无上年度账户（年中入职触发）
  - 年度账户已开立
  expect: 年中入职由入职生效触发，无上年账户，按规则折算应享后直接开立当年账户
  outcome: 年度账户已开立
- id: PRC-160-S03
  path:
  - 第 1 步 年度结转额度账户
  covers:
  - 上年账户仍有占用中的占用行
  - 结转待处理
  expect: 上年账户仍有占用中的占用行（跨年请假未处理），结转与开账暂停并告警人力，处理后重新触发
  outcome: 结转待处理
PRC-178:
- id: PRC-178-S01
  path:
  - 第 1 步 〔缺〕登记补休转加班工资
  covers:
  - 已计入加班工资
  expect: B-27 发补休已到期未休后，B-15 读取该额度行未休余额，按加班工资基数折算的时薪 × 200% 登记计入加班工资，当月薪酬由 PRC-124 读取（PRC-124-S10）；以额度行 ID 幂等
  outcome: 已计入加班工资
- id: PRC-178-S02
  path:
  - 第 1 步 〔缺〕登记补休转加班工资
  covers:
  - 加班工资基数取不到或补休额度行余额读取失败
  - 登记待处理
  expect: 到期入口取不到加班工资基数或读不到额度行余额，不登记、不按零处理，告警薪酬岗；补齐后重新触发
  outcome: 登记待处理
- id: PRC-178-S03
  path:
  - 第 2 步 〔缺〕登记补休转加班工资
  covers:
  - 员工离职生效，仍有未休补休余额
  - 离职余额已计入加班工资
  expect: 员工离职生效（Separated）后，B-15 读取其全部未休补休余额，按加班工资基数 200% 登记计入加班工资，随最后一期薪酬计发，不作废
  outcome: 离职余额已计入加班工资
- id: PRC-178-S04
  path:
  - 第 2 步 〔缺〕登记补休转加班工资
  covers:
  - 加班工资基数取不到或补休额度行余额读取失败
  - 登记待处理
  expect: 离职入口取不到加班工资基数或读不到额度行余额，不登记、不按零处理，告警薪酬岗；补齐后重新触发，其余额度行不受影响
  outcome: 登记待处理
- id: PRC-178-S05
  path:
  - 第 2 步 〔缺〕登记补休转加班工资
  covers:
  - 员工无未休补休余额
  - 无需计发
  expect: 员工离职时没有未休补休余额，无需登记
  outcome: 无需计发
PRC-162:
- id: PRC-162-S01
  path:
  - 第 1 步 发布假期规则版本
  covers:
  - 假期规则版本已发布
  expect: 人力发布新的假期规则版本，区间不与既有版本重叠，发布即生效，生效后不可改
  outcome: 假期规则版本已发布
- id: PRC-162-S02
  path:
  - 第 1 步 发布假期规则版本
  covers:
  - 同一假期类型同一适用范围的生效区间与既有版本重叠
  - 版本被拒
  expect: 同一假期类型同一适用范围生效区间与既有版本重叠，被 INV-123 拒绝
  outcome: 版本被拒

PRC-180:
- id: PRC-180-S01
  path:
  - 第 1 步 发布薪酬规则版本
  covers:
  - 薪酬规则版本已发布
  expect: 人力编制、财务确认后发布新的薪酬规则版本，区间不与既有版本重叠，发布即生效，生效后不可改
  outcome: 薪酬规则版本已发布
- id: PRC-180-S02
  path:
  - 第 1 步 发布薪酬规则版本
  covers:
  - 同一规则类别同一适用范围的生效区间与既有版本重叠
  - 版本被拒
  expect: 同一规则类别同一适用范围生效区间与既有版本重叠，被 INV-139 拒绝
  outcome: 版本被拒
