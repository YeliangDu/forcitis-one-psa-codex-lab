  params: [档案ID, 薪资结构与标准, 生效日, 调薪决定依据引用]
  preconditions:
  - {ref: R-VS13-j, text: 必须引用调薪决定依据（审批单据 ID 或决定文件），无依据拒绝（结局「调整被拒」）}
  - {ref: D17, text: 追加新版本，同事务结束旧版本区间；生效日依据人事业务生效日（U-12）}
  - {ref: 遗留, text: 生效日早于已批准月度薪酬所属月时仍记录新版本，对已批准月份的影响由 AGG-73 补发补扣行承接（结构问题 2②），本命令不改已批准结算}
  authority:
    ref: raci:AGG-93/调整薪酬档案
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [SH-E6]
    pending: U9（若调薪决定进 platform.approval，A 改为员工所在组织单元负责人，并拆出提交与批准两条命令）
  idempotency_key: 档案ID + 生效日（同键返回已有版本）
  state_change: 创建 → 生效（新版本）；生效 → 已结束（旧版本，同事务）
  emits: 薪酬档案已变更
