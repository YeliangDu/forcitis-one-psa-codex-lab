# ───────────── AGG-76 奖金核定 ─────────────
- name: 草拟奖金核定
  aggregate: AGG-76
  entity: bonus_determinations
  kind: automatic
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语 draft_bonus_determination）
  source: 分片 vs13.notes.md 结构问题 8、新用语
  params: [绩效评估ID, 被核定人员, 法人, 激励方案版本ID, 核定期间]
