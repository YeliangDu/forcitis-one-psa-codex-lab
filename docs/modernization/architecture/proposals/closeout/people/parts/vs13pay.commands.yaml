# VS-13 薪酬类聚合命令目录（收敛产物，提议稿；规格见 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 B 节）
# 范围：B-15 的 AGG-73 月度薪酬结算、AGG-74 社保与公积金参保、AGG-75 激励方案版本、AGG-76 奖金核定、AGG-93 人员薪酬档案、
#   AGG-95 个税扣缴与社保公积金申报、提议的「AGG-119」；B-13 的 AGG-106 绩效评估（PRC-85、120 用）。
# 依据：vs13.processes.yaml、vs13.notes.md、vs07.processes.yaml（PRC-84、85、130、145 的相关步骤）、聚合稿 §2.2、data-model.people.yaml、terms.yaml。
# 命令名沿用聚合稿与分片，不自造。name_status 非空的是〔缺〕命令：
#   「沿用分片提议名」= vs13.notes.md 新用语已提议（草拟奖金核定、退回薪酬重算、驳回奖金核定、发布薪酬规则版本）；
#   「收敛新增」= 分片只在审批步写了 withdraw / on_reject 边而无命令，状态机需要命令落地（驳回激励方案版本、撤回激励方案版本、撤回薪酬审核），
#   命名沿用 b31 的「撤回用印申请」「驳回 IT 需求」模式，名字是本稿所取，请 one-glossary 登记前确认。
# 规则卡引用：R-VS13-a…j = vs13.notes.md 结构问题 14 的候选规则 R-a…R-j（加前缀避免与别组重名）；INV / P / AR 取聚合稿与 APPROVAL_RULES。
# 发令权 authority 指向 vs13pay.raci.yaml 的条目。kind：human 人发起；callback 审批平台回调；automatic 系统规则（含事件策略与定时）。
# 同名命令按「聚合 + 名称」唯一：提交过账候选在 AGG-73 与 AGG-95 各一条。
# 事件载荷不含个人级薪酬、奖金、个税金额与账户（ADR-0026 第 7 项 L3 不进事件），见 vs13pay.events.yaml。
# state_change: none 的命令只写属性（引用、标志），不改状态，列在 vs13pay.state-machines.yaml 的 non_state_commands。
# 「孤儿」= 未被任一流程步骤、事件策略或维护用到。本稿 0 个孤儿命令（发布薪酬规则版本只被「维护」用到，见 notes 结构问题 3）。

bc: B-15
also_bc: {AGG-106: B-13}
aggregates: [AGG-73, AGG-74, AGG-75, AGG-76, AGG-93, AGG-95, AGG-119, AGG-106]
commands:

# ───────────── AGG-106 绩效评估（B-13） ─────────────
- name: 编制绩效评估
  aggregate: AGG-106
  entity: performance_reviews
  kind: human
  source: 聚合稿 AGG 命令列
  params: [被评人员, 评估人, 评估期间, 评估类型（月度）, 评估时任职版本（可空）]
  preconditions:
  - {ref: INV-114, text: 同一人同期同类型只有一份评估（部分唯一索引）；已有已确认评估则返回已有结果而不是报错（PRC-120 步 1 出口）}
  - {ref: 状态, text: 评估期间已结束（定时提醒用人经理）}
  authority:
    ref: raci:AGG-106/编制绩效评估
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
  idempotency_key: 评估ID（客户端预生成 UUIDv7）；同人同期同类型重复提交返回已有
  state_change: 创建草拟
  emits: （内部）
  used_by: [PRC-120 第 1 步]
  orphan: false
- name: 编制试用期绩效评估
  aggregate: AGG-106
  entity: performance_reviews
  kind: human
  source: 聚合稿 AGG 命令列
  params: [被评人员, 评估人, 试用期届满日（作评估期间）, 评估时任职版本（可空）]
  preconditions:
  - {ref: INV-114, text: 同一人同期同类型只有一份评估}
  - {ref: 状态, text: 人员处于试用期且试用期届满前 N 日已生成评估待办（N 待用户定，V-12）}
  authority:
    ref: raci:AGG-106/编制试用期绩效评估
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
  idempotency_key: 评估ID（客户端预生成 UUIDv7）
  state_change: 创建草拟
  emits: （内部）
  used_by: [PRC-85 第 1 步]
  orphan: false
- name: 提交绩效评估
  aggregate: AGG-106
  entity: performance_reviews
  kind: human
  source: 聚合稿 AGG 命令列
  params: [评估ID]
  preconditions:
  - {ref: 状态, text: 评估为草拟}
  - {ref: U11, text: 提交的接收方（上级复核、被评人阅知或申诉）未定；本稿不设审批，只改状态}
  authority:
    ref: raci:AGG-106/提交绩效评估
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
  idempotency_key: 评估ID（已提交再提交无操作）
  state_change: 草拟 → 已提交
  emits: （内部）
  used_by: [PRC-120 第 2 步]
  orphan: false
- name: 确认绩效评估
  aggregate: AGG-106
  entity: performance_reviews
  kind: human
  source: 聚合稿 AGG 命令列
  params: [评估ID, 结论]
  preconditions:
  - {ref: INV-114, text: 确认后不得改，更正另记}
  - {ref: 状态, text: 月度评估须已提交（U11）；试用期评估无提交环节，可由草拟直接确认（PRC-85 步 2）〔推〕}
  authority:
    ref: raci:AGG-106/确认绩效评估
    A: {resolve: instance, field: 绩效评估.评估人}
    R: [SH-E1]
  idempotency_key: 评估ID（已确认再确认无操作）
  state_change: 已提交 → 已确认（试用期可草拟 → 已确认）
  emits: 绩效评估已确认
  used_by: [PRC-120 第 3 步, PRC-85 第 2 步]
  orphan: false

# ───────────── AGG-73 月度薪酬结算 ─────────────
- name: 计算
  aggregate: AGG-73
  entity: payroll_settlements
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [薪酬法人（扣缴义务人口径）, 薪酬月份, 重算序号]
  preconditions:
  - {ref: R-VS13-h, text: 该法人当月在职人员的月度考勤全部已锁定（AGG-97）；有未锁定的结局为「待锁定」，不建结算也不改状态}
  - {ref: 数据齐备, text: 每人有生效薪酬档案版本（AGG-93）、应参保人员有参保基数（AGG-74）、适用的薪酬规则版本取得到（同 INV-116，取不到失败并告警）；缺则结局为「已中止」，不静默跳过}
  - {ref: INV-70, text: 代扣只限法定项目；以法定货币支付}
  - {ref: 状态, text: 无结算、或结算为已计算（提交审核前发现输入有误重算）、或已退回（重新计算）}
  - {ref: R-VS13-h, text: 同时生成异常清单（环比波动超阈值、实发为负、入离职折算、含补发补扣行），只提示不拦截}
  authority:
    ref: raci:AGG-73/计算
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
  idempotency_key: 薪酬法人 + 薪酬月份 + 重算序号（同一序号重复执行返回已有结果）
  state_change: 创建 → 已计算；已计算 → 已计算（重算）；已退回 → 已计算
  emits: （内部）
  used_by: [PRC-124 第 1 步（第 2 步判断出口、第 3 步驳回与撤回出口回到本步）]
  orphan: false
- name: 提交审核
  aggregate: AGG-73
  entity: payroll_settlements
  kind: human
  source: 聚合稿 AGG 命令列
  params: [结算ID, 异常清单核对确认]
  preconditions:
  - {ref: 状态, text: 结算为已计算且异常清单已生成}
  - {ref: 职责分离, text: 提交人记为制单人，不得审批同一份结算（PRC-124 segregation）}
  - {ref: 副作用, text: 发起月度薪酬审核（platform.approval）}
  authority:
    ref: raci:AGG-73/提交审核
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [SH-E6]
  idempotency_key: 结算ID + 计算序号（同一计算结果重复提交返回已有审批实例）
  state_change: 已计算 → 审核中
  emits: （内部）
  used_by: [PRC-124 第 2 步]
  orphan: false
- name: 批准
  aggregate: AGG-73
  entity: payroll_settlements
  kind: callback
  source: 聚合稿 AGG 命令列
  params: [审批实例ID, 审批结果（通过）]
  preconditions:
  - {ref: 状态, text: 结算为审核中且审批实例ID一致}
  - {ref: INV-70, text: 代扣只限法定项目；以法定货币支付}
  - {ref: AR-01/AR-02/AR-11, text: 月度薪酬金额按阈值加审；审批人就是制单人或结算含其本人薪酬行的，上交其上级（APPROVAL_RULES，AR-01、AR-02 阈值待用户定 U7′）}
  authority:
    ref: raci:AGG-73/批准
    A: {resolve: instance, field: 薪酬结算.薪酬法人.财务责任人, alias: cost_object_owner}
    R: [SH-E6]
    approval: {approver: cost_object_owner, doc_type: 月度薪酬审核}
  idempotency_key: 审批实例ID（同一审批实例重复回调不重复生效）
  state_change: 审核中 → 已批准
  emits: 薪酬已批准
  used_by: [PRC-124 第 4 步]
  orphan: false
- name: 退回薪酬重算
  aggregate: AGG-73
  unused_ok: "审批驳回回调，由 PRC-124 第 3 步 on_reject 边触发"
  entity: payroll_settlements
  kind: callback
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语、结构问题 2①）
  source: 分片 vs13.notes.md 新用语〔缺〕退回薪酬重算（return_payroll_for_recalculation）
  params: [审批实例ID, 驳回意见]
  preconditions:
  - {ref: 状态, text: 结算为审核中且审批实例ID一致}
  authority:
    ref: raci:AGG-73/退回薪酬重算
    A: {resolve: instance, field: 薪酬结算.薪酬法人.财务责任人, alias: cost_object_owner}
    R: [platform.approval]
  idempotency_key: 审批实例ID
  state_change: 审核中 → 已退回
  emits: （内部）
  used_by: [PRC-124 第 3 步（on_reject 回到第 1 步）]
  orphan: false
- name: 撤回薪酬审核
  aggregate: AGG-73
  entity: payroll_settlements
  kind: human
  name_status: 〔缺〕收敛新增，沿用 b31「撤回用印申请」命名模式，待 one-glossary 登记
  source: 收敛新增（分片只在 PRC-124 第 3 步写了 withdraw 边，无命令）
  params: [结算ID, 撤回原因]
  preconditions:
  - {ref: 状态, text: 结算为审核中}
  - {ref: 权限, text: 仅提交人本人}
  authority:
    ref: raci:AGG-73/撤回薪酬审核
    A: {resolve: instance, field: 薪酬结算.提交人}
    R: [SH-E6]
  idempotency_key: 结算ID（已退回再撤回无操作）
  state_change: 审核中 → 已退回
  emits: （内部）
  used_by: [PRC-124 第 3 步（撤回边 withdraw 回到第 1 步）]
  orphan: false
- name: 提交过账候选
  aggregate: AGG-73
  entity: payroll_settlements
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [结算ID]
  preconditions:
  - {ref: 状态, text: 结算为已批准；批准时只提交一次候选（符合性审查 断链 7）}
  - {ref: INV-92, text: 所属会计期间已关账的，按 ADR-0045 路由到开放期间并标原期间，不拒绝}
  authority:
    ref: raci:AGG-73/提交过账候选
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
  idempotency_key: 结算ID（只提交一次）
  state_change: none（只写过账引用，不改状态）
  emits: （内部）
  used_by: [PRC-124 第 5 步]
  orphan: false
- name: 标记薪酬已发放
  aggregate: AGG-73
  entity: payroll_settlements
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [结算ID, 应付ID, 发放日, 银行回单引用]
  preconditions:
  - {ref: 状态, text: 结算为已批准}
  - {ref: 订阅过滤, text: 应付已结清事件的应付类型为应付薪酬（B-15 只处理应付薪酬，结构问题 4②）}
  - {ref: 遗留, text: 代发个别员工退票时应付「结清」语义不清（vs13.notes.md 结构问题 2④），未定前不处理部分失败}
  authority:
    ref: raci:AGG-73/标记薪酬已发放
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
  idempotency_key: 应付ID（同一应付结清重复通知无操作）
  state_change: 已批准 → 已发放
  emits: 薪酬已发放
  used_by: [PRC-127 第 1 步]
  orphan: false
- name: 标记已过账
  aggregate: AGG-73
  entity: payroll_settlements
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [结算ID, 过账ID]
  preconditions:
  - {ref: 订阅过滤, text: BusinessFactAttributed 的来源单据类型为月度薪酬结算（结构问题 4③）}
  - {ref: 状态, text: 结算已发放则置为已过账；尚未发放只置位「过账事实已入账」，待发放后由 PRC-127 回到 PRC-134 再置位（结构问题 13）}
  authority:
    ref: raci:AGG-73/标记已过账
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
  idempotency_key: 过账ID
  state_change: 已发放 → 已过账；已批准 → 已批准（只置位）
  emits: （内部）
  used_by: [PRC-134 第 1 步]
  orphan: false

# ───────────── AGG-74 社保与公积金参保 ─────────────
- name: 参保增员
  aggregate: AGG-74
  entity: insurance_enrollments
  kind: human
  source: 聚合稿 AGG 命令列
  params: [人员, 缴纳主体法人, 参保地, 险种, 缴费基数, 增员生效日, 增员回执引用]
  preconditions:
  - {ref: 人员有效, text: 人员已入职（读 B-13）；同一人员同缴纳主体无在保登记}
  - {ref: 候选规则, text: 用工类型为退休返聘或实习的不办理参保〔推〕；PRC-84 步 1 两个分支都指向第 2 步，未写「无需增员」结局，见 notes 接缝问题 3}
  - {ref: P-32, text: 入职 30 日内申报，超期预警提醒不拦截（社会保险法第五十八条）}
  authority:
    ref: raci:AGG-74/参保增员
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
  idempotency_key: 人员 + 缴纳主体 + 增员生效日（同键返回已有）
  state_change: 创建 → 在保
  emits: 参保已增员
  used_by: [PRC-84 第 1 步]
  orphan: false
- name: 参保减员
  aggregate: AGG-74
  entity: insurance_enrollments
  kind: human
  source: 聚合稿 AGG 命令列
  params: [参保登记ID, 减员生效日, 减员回执引用]
  preconditions:
  - {ref: 状态, text: 登记为在保}
  - {ref: 候选规则, text: 用工类型为退休返聘或实习的结局为「无需减员」，不改状态（PRC-130 步 1）}
  authority:
    ref: raci:AGG-74/参保减员
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
  idempotency_key: 参保登记ID（已减员再减员无操作）
  state_change: 在保 → 已减员
  emits: 参保已减员
  used_by: [PRC-130 第 1 步]
  orphan: false

- name: 变更参保缴纳主体
  aggregate: AGG-74
  entity: insurance_enrollments
  kind: human
  name_status: 〔缺〕聚合稿无此命令；PRC-136（跨法人调岗）第 12 步用到，沿 vs07.notes.md 新用语 ChangeInsuranceContributor
  source: 分片 vs07.notes.md 新用语、PRC-136 第 12 步
  params: [参保登记ID, 新缴纳主体法人, 变更生效日, 原主体减员回执引用, 新主体增员回执引用, 缴费基数]
  preconditions:
  - {ref: 状态, text: 原登记为在保，新缴纳主体与原主体不同}
  - {ref: 同主体唯一, text: 同一人员在新缴纳主体无在保登记}
  - {ref: P-32, text: 与入职增员同属 P-32 范畴，新主体增员超期预警不拦截}
  authority:
    ref: raci:AGG-74/变更参保缴纳主体
    A: {resolve: type, role: SH-E6, function: 社保岗}
    R: [SH-E6]
  idempotency_key: 参保登记ID + 新缴纳主体 + 变更生效日（同键返回已有）
  state_change: 原登记 在保 → 已减员；同事务为新缴纳主体创建登记 → 在保
  emits: 参保已减员、参保已增员
  used_by: [PRC-136 第 12 步]
  orphan: false

# ───────────── AGG-75 激励方案版本 ─────────────
- name: 编制激励方案版本
  aggregate: AGG-75
  entity: incentive_plan_versions
  kind: human
  source: 聚合稿 AGG 命令列
  params: [方案（新方案或既有方案）, 规则条款, 额度（法人或组织单元 × 金额或提取比例）, 生效日期, 决定出处]
  preconditions:
  - {ref: R-VS13-f, text: 生效日期不得早于已核定奖金所属期，违反拒绝并停留在编制页}
  - {ref: D15, text: 版本只追加，生效区间不与同方案既有版本重叠}
  - {ref: 状态, text: 版本为草稿（含被驳回后回到草稿）}
  - {ref: 副作用, text: 发起激励方案审批（platform.approval）}
  authority:
    ref: raci:AGG-75/编制激励方案版本
    A: {resolve: type, role: SH-E6, function: 人力}
    R: [SH-E6]
  idempotency_key: 方案版本ID（客户端预生成 UUIDv7）+ 提交序号
  state_change: 草稿 → 审批中
  emits: （内部）
  used_by: [PRC-121 第 1 步（驳回回到本步）]
  orphan: false
- name: 生效激励方案版本
  aggregate: AGG-75
  entity: incentive_plan_versions
  kind: callback
  source: 聚合稿 AGG 命令列
  params: [审批实例ID（审批通过触发时）]
  preconditions:
  - {ref: 状态, text: 版本为审批中且审批实例ID一致；或已批准且生效日期到达（定时触发）}
  - {ref: AR-01/AR-02, text: 激励方案额度按阈值加审（APPROVAL_RULES）}
  - {ref: D15, text: 后继版本生效时，同事务结束前一版本的生效区间}
