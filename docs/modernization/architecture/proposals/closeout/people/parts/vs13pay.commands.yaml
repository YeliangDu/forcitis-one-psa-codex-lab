  orphan: false
- name: 驳回奖金核定
  aggregate: AGG-76
  entity: bonus_determinations
  kind: callback
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语 reject_bonus_determination）
  source: 分片 vs13.notes.md 新用语
  params: [审批实例ID, 驳回意见]
  preconditions:
