  kind: human
  source: 聚合稿 AGG 命令列
  params: [人员, 薪资结构与标准, 个税扣缴义务人法人, 发薪账户, 生效日]
  preconditions:
  - {ref: 人员有效, text: 人员已入职（读 B-13）；一人一份薪酬档案}
  - {ref: 法人有效, text: 个税扣缴义务人是申请日有效法人主体（三口径之一，P-48）}
  authority:
    ref: raci:AGG-93/建立薪酬档案
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [SH-E6]
  idempotency_key: 人员 + 生效日（同键返回已有）
