# ───────────── AGG-119 ─────────────
- name: 发布薪酬规则版本
  aggregate: AGG-119
  entity: payroll_rule_versions
  kind: human
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语 publish_payroll_rule_version）
  source: 分片 vs13.notes.md 结构问题 1、新用语
  params: [规则类别（个税税率与起征、专项附加扣除标准、社保公积金比例与基数、计算口径）, 适用范围（参保地或法人，可空为全国默认）, 生效区间, 规则明细, 依据引用（法规条文或公司制度）]
  preconditions:
  - {ref: INV-139, text: 同一规则类别同一适用范围的生效区间不重叠（每版本一个聚合，D15；S-43 给号）}
  - {ref: U7③, text: 编制与确认由谁维护待定（人力出、财务确认）；推荐编制人 ≠ 确认人〔推〕}
  - {ref: 状态, text: 版本为草稿}
  authority:
    ref: raci:AGG-119/发布薪酬规则版本
    A: {resolve: type, role: SH-E6, function: 薪酬规则确认}
    R: [SH-E6]
  idempotency_key: 规则版本ID（客户端预生成 UUIDv7）
  state_change: 草稿 → 已生效；已生效 → 已被取代（前一版本，同事务）
  emits: 薪酬规则已生效
  used_by: [PRC-180 第 1 步]
  orphan: false

# ───────────── 事件策略（非聚合命令，调用上面的命令） ─────────────
event_policies:
- name: 评估确认生成奖金草案
  trigger_event: 绩效评估已确认（B-13 发布，仅月度评估）
  effect: 调用草拟奖金核定；另有人力调整评估或激励方案后手工重新触发
  uses_command: 草拟奖金核定
  used_by: [PRC-122 触发器]
  rules: [R-VS13-g]
  note: 事件须带评估类型，订阅方过滤（结构问题 4①）
- name: 月度考勤锁定后计算薪酬
  trigger_event: 月度考勤已锁定（B-27 发布，按人员 × 月）
  effect: 检查该法人当月在职人员是否全部已锁定，是则调用计算；人力补齐档案或规则版本后可手工重新发起
  uses_command: 计算月度薪酬
  used_by: [PRC-124 触发器]
  rules: [R-VS13-h]
  note: 法人级汇聚无事件承载，建议 B-27 提供只读查询「法人当月未锁定名单」（vs13.notes.md 结构问题 6）
- name: 审批通过回调
  trigger_event: 审批已通过（platform.approval）
  effect: 调用对应的批准命令
  uses_command: 生效激励方案版本 / 核定奖金 / 批准
  used_by: [PRC-121 第 3 步, PRC-122 第 3 步, PRC-124 第 4 步]
  rules: []
  note: 回调走事件或注册处理器，platform 不依赖 B-15（vs13.notes.md 接缝问题 1）
- name: 审批驳回回调
  trigger_event: 审批已驳回（platform.approval）
  effect: 调用对应的驳回命令
  uses_command: 驳回激励方案版本 / 驳回奖金核定 / 退回薪酬重算
  used_by: [PRC-121 第 2 步, PRC-122 第 4 步, PRC-124 第 3 步]
  rules: []
  note: ''
- name: 审批撤回回调
  trigger_event: 审批已撤回（platform.approval 通用撤回，事件名由 platform 定）
  effect: 提交人撤回审批后，调用对应的撤回命令（撤回为人发起，回调只落地状态）
  uses_command: 撤回激励方案版本 / 撤回薪酬审核
  used_by: [PRC-121 第 2 步 withdraw 边, PRC-124 第 3 步 withdraw 边]
  rules: []
  note: 事件名以 platform.approval 事件目录为准，本稿不自造
- name: 生效日期到达
  trigger_event: 定时：激励方案版本生效日期到达（platform.scheduling）
  effect: 对已批准的版本调用生效激励方案版本
  uses_command: 生效激励方案版本
  used_by: [PRC-121 第 3 步]
  rules: [R-VS13-f]
  note: ''
- name: 薪酬批准后生成申报
  trigger_event: 薪酬已批准（同 BC）；另有申报期前提醒（P-39，定时）与人力发起本月申报批次
  effect: 按扣缴义务人法人与所属期调用生成申报（个税、社保、公积金各一条）
  uses_command: 生成申报
  used_by: [PRC-125 触发器]
  rules: [R-VS13-i]
  note: 股息红利并入后当月无薪酬批准时由定时与人工触发（vs13.notes.md 结构问题 11）
- name: 薪酬批准后提交应付
  trigger_event: 薪酬已批准（同 BC）
  effect: 调用 B-10 的提交应付薪酬（AGG-52）提交法人 × 月一笔实发合计；B-15 在 AGG-73 回写应付引用
  uses_command: 提交应付薪酬（AGG-52，B-10 命令目录，本稿不收）
  used_by: [PRC-126 第 1 步]
  rules: []
  note: 回写应付引用无命令，见 notes 结构问题 7
- name: 应付结清后标记已发放
  trigger_event: 应付已结清（B-10 发布；B-15 只处理应付薪酬）
  effect: 调用标记薪酬已发放；若过账事实已入账，接着走 PRC-134 的标记已过账
  uses_command: 标记薪酬已发放
  used_by: [PRC-127 第 1 步]
  rules: []
  note: 事件须带应付类型与来源单据类型（结构问题 4②）
- name: 过账完成后置位已过账
  trigger_event: BusinessFactAttributed（B-16 发布；B-15 只处理薪酬来源）
  effect: 调用标记已过账
  uses_command: 标记薪酬已过账
