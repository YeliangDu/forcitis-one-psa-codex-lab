  - {ref: 唯一性, text: 同一人同核定期间无草拟或已核定的核定单；被驳回后重新草拟另建新核定单}
  - {ref: U10, text: 评分到金额的映射不足以自动算时回到人力草拟}
  - {ref: 副作用, text: 发起奖金核定审批（platform.approval）}
  authority:
    ref: raci:AGG-76/草拟奖金核定
