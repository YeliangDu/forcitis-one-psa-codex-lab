# ───────────── AGG-95 个税扣缴与社保公积金申报 ─────────────
- name: 并入扣缴申报
  aggregate: AGG-95
  entity: tax_social_filings
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [利润分配ID, 股东, 所属期, 股息红利金额, 代扣税额（B-10 随事件带，结构问题 4）]
  preconditions:
  - {ref: 订阅过滤, text: 股东为自然人；法人或机构股东结局为「无需扣缴」，不改状态}
  - {ref: 状态, text: 所属期的个税扣缴申报为待申报或尚无（无则创建）；已申报则失败并告警，不静默（CLAUDE.md 第 6 条），处理方式见 notes 结构问题 5}
  authority:
    ref: raci:AGG-95/并入扣缴申报
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [system]
  idempotency_key: 利润分配ID + 股东（同一分配行重复通知无操作）
  state_change: 创建 → 待申报；待申报 → 待申报（追加行）
  emits: （内部）
  used_by: [PRC-113 第 1 步]
  orphan: false
- name: 生成申报
  aggregate: AGG-95
  entity: tax_social_filings
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [扣缴义务人法人, 所属期, 申报类别（个税扣缴、社保、公积金）]
  preconditions:
  - {ref: R-VS13-i, text: 人员证件信息齐全、申报金额与薪酬结算一致，不一致失败并告警（结局「已中止」）}
  - {ref: 数据齐备, text: 所属期薪酬结算为已批准或有股息红利并入项；所属期取自会计期间（读 B-19）}
  authority:
    ref: raci:AGG-95/生成申报
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [system]
  idempotency_key: 扣缴义务人法人 + 所属期 + 申报类别 + 生成序号
  state_change: 创建 → 待申报；待申报 → 待申报（重新汇总）
  emits: （内部）
  used_by: [PRC-125 第 1 步]
  orphan: false
- name: 提交申报
  aggregate: AGG-95
  entity: tax_social_filings
  kind: human
  source: 聚合稿 AGG 命令列
  params: [申报ID, 申报日, 回执引用（受理回执）]
  preconditions:
  - {ref: 状态, text: 申报为待申报且已登记受理回执（线下在申报端完成，U1、U2）}
  - {ref: P-39, text: 个税法定期限次月十五日内〔中，核对原文〕，超期只提醒不拦截}
  - {ref: 事件条件, text: 当期个税、社保、公积金三类申报均已提交后才发布「个税与社保公积金申报已提交」}
  authority:
    ref: raci:AGG-95/提交申报
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [SH-E6]
  idempotency_key: 申报ID（已申报再提交无操作）
  state_change: 待申报 → 已申报
  emits: 个税与社保公积金申报已提交
  used_by: [PRC-125 第 2 步（个税）, PRC-125 第 3 步（社保公积金）]
  orphan: false
- name: 登记缴款
  aggregate: AGG-95
  entity: tax_social_payments
  kind: human
  source: 聚合稿 AGG 命令列
  params: [申报ID, 缴款日, 缴款金额, 缴款渠道, 银行回单引用]
  preconditions:
  - {ref: 状态, text: 申报为已申报，且未被退回或发现差错（有差错先更正申报）}
  - {ref: 职责分离, text: 登记人不得是缴款资金支出人（B-10 出纳，PRC-125 segregation）}
  authority:
    ref: raci:AGG-95/登记缴款
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [SH-E6]
  idempotency_key: 申报ID + 银行回单引用（同一回单重复登记返回已有）
  state_change: 已申报 → 已缴款
  emits: （内部）
  used_by: [PRC-125 第 4 步]
  orphan: false
- name: 更正申报
  aggregate: AGG-95
  entity: tax_social_filings
  kind: human
  source: 聚合稿 AGG 命令列
  params: [原申报ID, 更正原因, 更正回执引用]
  preconditions:
  - {ref: 状态, text: 原申报为已申报，且被退回或发现差错（PRC-125 步 4 出口）}
  - {ref: 数据, text: 更正生成新申报行并引用原申报（corrects_filing_id），原申报置为已更正}
  authority:
    ref: raci:AGG-95/更正申报
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [SH-E6]
  idempotency_key: 原申报ID + 更正序号
  state_change: 原申报 已申报 → 已更正；创建 → 已申报（新申报行）
  emits: （内部）
  used_by: [PRC-125 第 5 步]
  orphan: false
- name: 提交过账候选
  aggregate: AGG-95
  entity: tax_social_payments
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [申报ID, 缴款登记ID]
  preconditions:
  - {ref: 状态, text: 申报为已缴款}
  - {ref: INV-92, text: 所属会计期间已关账的，按 ADR-0045 路由到开放期间并标原期间，不拒绝}
  authority:
    ref: raci:AGG-95/提交过账候选
    A: {resolve: type, role: SH-E6, function: 申报岗}
    R: [system]
  idempotency_key: 缴款登记ID（只提交一次）
  state_change: none（只写过账引用，不改状态）
  emits: （内部）
  used_by: [PRC-125 第 6 步]
  orphan: false

# ───────────── AGG-119 ─────────────
- name: 发布薪酬规则版本
  aggregate: AGG-119
  unused_ok: "维护用：配置型版本发布，无业务流程（vs13pay.notes.md 结构问题 3）"
  entity: payroll_rule_versions
  kind: human
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语 publish_payroll_rule_version）
  source: 分片 vs13.notes.md 结构问题 1、新用语
  params: [规则类别（个税税率与起征、专项附加扣除标准、社保公积金比例与基数、计算口径）, 适用范围（参保地或法人，可空为全国默认）, 生效区间, 规则明细, 依据引用（法规条文或公司制度）]
  preconditions:
  - {ref: D15, text: 每版本一个聚合，同类别同适用范围的生效区间不重叠}
  - {ref: U7③, text: 编制与确认由谁维护待定（人力出、财务确认）；推荐编制人 ≠ 确认人〔推〕}
  - {ref: 状态, text: 版本为草稿}
  authority:
    ref: raci:AGG-119/发布薪酬规则版本
    A: {resolve: type, role: SH-E6, function: 薪酬规则确认}
    R: [SH-E6]
  idempotency_key: 规则版本ID（客户端预生成 UUIDv7）
  state_change: 草稿 → 已生效；已生效 → 已结束（前一版本，同事务）
  emits: 薪酬规则已生效
  used_by: [维护（薪酬规则版本维护，无流程步骤；AGG-73 计算读取其生效版本，见 notes 结构问题 3）]
  orphan: false

# ───────────── 事件策略（非聚合命令，调用上面的命令） ─────────────
event_policies:
- name: 评估确认生成奖金草案
  trigger_event: 绩效评估已确认（B-13 发布，仅月度评估）
  effect: 调用草拟奖金核定；另有人力调整评估或激励方案后手工重新触发
  uses_command: 草拟奖金核定
  used_by: [PRC-122 触发器]
  rules: [R-VS13-g]
  note: 事件须带评估类型，订阅方过滤（结构问题 4①）
- name: 月度考勤锁定后计算薪酬
  trigger_event: 月度考勤已锁定（B-27 发布，按人员 × 月）
  effect: 检查该法人当月在职人员是否全部已锁定，是则调用计算；人力补齐档案或规则版本后可手工重新发起
  uses_command: 计算
  used_by: [PRC-124 触发器]
  rules: [R-VS13-h]
  note: 法人级汇聚无事件承载，建议 B-27 提供只读查询「法人当月未锁定名单」（vs13.notes.md 结构问题 6）
- name: 审批通过回调
  trigger_event: 审批已通过（platform.approval）
  effect: 调用对应的批准命令
  uses_command: 生效激励方案版本 / 核定奖金 / 批准
  used_by: [PRC-121 第 3 步, PRC-122 第 3 步, PRC-124 第 4 步]
  rules: []
  note: 回调走事件或注册处理器，platform 不依赖 B-15（vs13.notes.md 接缝问题 1）
- name: 审批驳回回调
  trigger_event: 审批已驳回（platform.approval）
  effect: 调用对应的驳回命令
  uses_command: 驳回激励方案版本 / 驳回奖金核定 / 退回薪酬重算
