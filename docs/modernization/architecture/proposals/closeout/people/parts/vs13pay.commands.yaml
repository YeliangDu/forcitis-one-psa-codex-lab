- name: 登记补休转加班工资
  aggregate: AGG-93
  entity: payroll_comp_leave_conversions
  kind: automatic
  name_status: 〔缺〕S-41 裁定新增，待回补聚合稿，待 one-glossary 登记（register_comp_leave_overtime_pay）
  source: S-41（one-architecture 裁定）；用户页 P13-05；劳动法第四十四条、工资支付暂行规定第十三条
  params: [人员, 补休额度行ID, 转计发时长（分钟）, 来源（到期未休 / 离职）, 所属薪酬月份]
  preconditions:
  - {ref: 来源, text: 到期入口由 B-27 发的补休已到期未休触发，离职入口由 B-13 的 Separated 触发；经既有边 B-15 → B-27（api）读取额度行未休余额，读取失败则失败并告警薪酬岗，不静默}
  - {ref: 加班工资基数, text: 取薪酬档案生效版本的加班工资基数；取不到则失败并告警薪酬岗，不静默按零（CLAUDE.md 第 6 条）}
  - {ref: 计发, text: 本命令只登记时长与来源，不算钱；计入加班工资的金额（时长 × 加班工资基数折算的时薪 × 200%）由 PRC-124 计算时读取登记生成}
  - {ref: 离职, text: 离职入口读取该员工全部未休余额，余额为零无需登记}
  authority:
    ref: raci:AGG-93/登记补休转加班工资
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
  idempotency_key: 补休额度行ID（已登记无操作）
  state_change: none（只追加登记行，不改状态）
  emits: （内部）
  used_by: [PRC-178 第 1 步、第 2 步]
  orphan: false
- name: 终止薪酬档案
  aggregate: AGG-93
  entity: payroll_profile_versions
  kind: automatic
  name_status: 〔缺〕S-32 裁定新增（B-15 订阅 Separated 后结束最后一个生效版本，显式优于由人员状态推断），待回补聚合稿，待 one-glossary 登记（terminate_payroll_profile）
  source: S-32（one-architecture 裁定）；对象增删改查检查 QC-OBJECTS.md（离职后薪酬档案版本无结束命令）
  params: [人员, 终止日（离职日）, 离职事件ID]
  preconditions:
  - {ref: 状态, text: 人员存在生效或未来生效的档案版本；无任何版本失败并告警薪酬岗，不静默（CLAUDE.md 第 6 条）；最后一个版本已终止则无操作}
  - {ref: D17, text: 结束最后一个生效版本的区间，止于离职日；终止日之后才生效的版本一并作废；离职当月的入离职折算仍读离职日之前有效的版本，不受影响}
  - {ref: 重新入职, text: 重新入职按 PRC-84 在原档案根下建立新版本，不重用已终止版本}
  authority:
    ref: raci:AGG-93/终止薪酬档案
    A: {resolve: type, role: SH-E6, function: 薪酬岗}
    R: [system]
  idempotency_key: 人员 + 离职事件ID（已终止无操作）
  state_change: 生效 → 已结束（最后一个版本）
  emits: （内部）
  used_by: [PRC-130 第 1 步]
  orphan: false

