    A: {resolve: instance, field: 激励方案版本.适用范围.责任人, alias: cost_object_owner}
    R: [platform.approval]
  idempotency_key: 审批实例ID
  state_change: 审批中 → 草稿
  emits: （内部）
  used_by: [PRC-121 第 2 步（on_reject 回到第 1 步）]
