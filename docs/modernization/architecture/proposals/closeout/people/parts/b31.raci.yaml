# B-31 权责对照条目（收敛产物，提议稿；格式依 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 A 节）
# 口径：每个「对象×命令」恰一个 A。现行审批类命令仅批准用印申请、批准 IT 需求，A = 按 ARCH_VS14 D15 正式责任配置解析的实例级 cost_object_owner
#   （用印人工批准责任、IT 受控类别与责任表；用印仅无来源单据有人审），与 b31.processes.yaml 的解析别名一致；AR-11、AR-12 只处理本人及缺位，不代替制度责任归属。
#   驳回类命令是审批人决定的回调落地，A 同批准，R=platform.approval。非审批命令 A 取发起或执行方（A 持发令权，不持审批权）。
#   本组无命令属 ADR-0032 敏感权限（sensitive 全 false，待 one-rules / 安全复核）。岗位到人的映射待岗位体系重梳（ADR-0029 搁置），roles 只记 org_needs。

entries:
- object: AGG-113
  command: 提交用印申请
  raci:
    A: {resolve: instance, field: 申请人}
    R: [SH-E3]
    C: []
    I: []
  sensitive: false
  note: 有已批准来源单据的，系统经 platform.approval 校验来源审批实例已通过、份数不超审批载荷，通过则直接置已批准，该路径无人审批（规则核对，S-40）；校验不过则拒绝并告诉申请人原因
- object: AGG-113
  command: 批准用印申请
  raci:
    A: {resolve: instance, field: 按用印用途、法人、归属对象的制度责任配置解析, alias: cost_object_owner}  # 解析别名；实际责任人按 ARCH_VS14 D15 配置
    R: [SH-M1]
    C: []
    I: [SH-E3]
  boundary:
    pending: 'ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：用印人工批准责任及加审范围（ARCH-B31-materials 1、2）'
    segregation: [提交人 ≠ A]
    delegate: {when: AR-11, to: 汇报线上级}
    escalate: {when: AR-12, to: 上级组织负责人}
  sensitive: false
  approval: {approver: cost_object_owner, doc_type: 用印审批}  # 解析别名；实际责任人按 ARCH_VS14 D15 配置
  note: 仅无来源单据人审，责任及加审按正式制度配置；AR-16 候选不直接启用；来源直通不增加人审
- object: AGG-113
  command: 驳回用印申请
  raci:
    A: {resolve: instance, field: 按用印用途、法人、归属对象的制度责任配置解析, alias: cost_object_owner}  # 解析别名；实际责任人按 ARCH_VS14 D15 配置
    R: [platform.approval]
    C: []
    I: [SH-E3]
  sensitive: false
  note: 审批人的驳回决定经审批平台回调落地，A 同批准
- object: AGG-113
  command: 撤回用印申请
  raci:
    A: {resolve: instance, field: 申请人}
    R: [SH-E3]
    C: []
    I: []
  sensitive: false
- object: AGG-113
  command: 登记用印
  raci:
    A: {resolve: type, role: SH-E6, function: 行政经办}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  boundary:
    segregation: [经办人 ≠ 申请人]
  sensitive: false
  note: 盖章在系统外，系统登记并卡份数（INV-119）
- object: AGG-113
  command: 关闭用印申请
  raci:
    A: {resolve: type, role: SH-E6, function: 行政经办}
    R: [system]
    C: []
    I: [SH-E3]
  sensitive: false
  note: 规则自动关闭，不设人工关闭；A 为对用印登记负责的行政经办角色
- object: AGG-114
  command: 提交 IT 需求
  raci:
    A: {resolve: instance, field: 提出人}
    R: [SH-E3]
    C: []
    I: []
  sensitive: false
- object: AGG-114
  command: 批准 IT 需求
  raci:
    A: {resolve: instance, field: 按 IT 类别和正式制度责任配置解析, alias: cost_object_owner}  # 解析别名；实际责任人按 ARCH_VS14 D15 配置
    R: [SH-M1]
    C: []
    I: [SH-E3]
  boundary:
    segregation: [提交人 ≠ A]
    delegate: {when: AR-11, to: 汇报线上级}
    escalate: {when: AR-12, to: 上级组织负责人}
    pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：IT 受控类别与责任表、IT 金额适用口径（ARCH-B31-materials 3、4）
  sensitive: false
  approval: {approver: cost_object_owner, doc_type: IT需求审批}  # 解析别名；实际责任人按 ARCH_VS14 D15 配置
- object: AGG-114
  command: 驳回 IT 需求
  raci:
    A: {resolve: instance, field: 按 IT 类别和正式制度责任配置解析, alias: cost_object_owner}  # 解析别名；实际责任人按 ARCH_VS14 D15 配置
    R: [platform.approval]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-114
  command: 撤回 IT 需求
  raci:
    A: {resolve: instance, field: 提出人}
    R: [SH-E3]
    C: []
    I: []
  sensitive: false
- object: AGG-114
  command: 受理 IT 需求
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-114
  command: 解决 IT 需求
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-114
  command: 关闭 IT 需求
  raci:
    A: {resolve: instance, field: 提出人}
    R: [SH-E3]
    C: []
    I: [SH-E6]
  sensitive: false
  note: 仅提出人人工确认且有处理结论才关闭（INV-120），无系统代关权，人工超期保持状态
- object: AGG-114
  command: 退回 IT 需求
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-115
  command: 申请领用资产
  raci:
    A: {resolve: instance, field: 使用人}
    R: [SH-E3]
    C: [SH-E6]
    I: []
  sensitive: false
- object: AGG-115
  command: 登记领用
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  boundary:
    segregation: [登记人 ≠ 使用人]
  sensitive: false
- object: AGG-115
  command: 申请调拨资产
  raci:
    A: {resolve: instance, field: 调出使用人}
    R: [SH-E3]
    C: [SH-E6]
    I: [SH-M1]
  sensitive: false
  note: 同一核算主体内跨组织只通知调出、调入两侧负责人，不增加批准；交接同事务结束旧期间、开启新期间
- object: AGG-115
  command: 撤销调拨申请
  raci:
    A: {resolve: instance, field: 调出使用人}
    R: [SH-E3, SH-E6]
    C: []
    I: []
  sensitive: false
- object: AGG-115
  command: 调拨资产
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: []
    I: [SH-E3, SH-M1]
  boundary:
    segregation: [登记人 ≠ 调出使用人]
  sensitive: false
- object: AGG-115
  command: 归还资产
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: []
    I: [SH-E3, SH-M1]
  boundary:
    segregation: [验收人 ≠ 归还人]
    escalate: {when: 仅离职生效后 7 个日历日仍未归还, to: 原组织单元负责人（SH-M1）提醒，非中断、非审批；完成取消；聚合 ID + 到期时点幂等}
  sensitive: false
- object: AGG-121
  command: 报修资产
  raci:
    A: {resolve: instance, field: 使用人}
    R: [SH-E3]
    C: []
    I: [SH-E6]
  sensitive: false
- object: AGG-121
  command: 登记维修结果
  raci:
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
    C: ['external:维修服务商']
    I: [SH-E3]
  sensitive: false
  note: 无法修复的报废归 B-24，B-31 不发起
- object: AGG-116
  command: 提交员工活动申请
  raci:
    A: {resolve: type, role: SH-E6, function: 行政}
    R: [system, SH-E3]
    C: []
    I: []
  sensitive: false
  note: 周年系统自动，其他活动人工登记；全部规则控制，不设 SH-M1 批准或 AR-01/AR-02 活动金额加审，规则维护责任上线前须填
- object: AGG-116
  command: 完成员工活动
  raci:
    A: {resolve: type, role: SH-E6, function: 行政}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: false
- object: AGG-116
  command: 取消员工活动登记
  raci:
    A: {resolve: type, role: SH-E6, function: 行政}
    R: [SH-E6]
    C: []
    I: [SH-E3]
  sensitive: false
  note: 沿活动组织办理职能执行取消，不持人工批准权；已批准或已完成均可取消，原因必填，记取消人、时间及审计，保留原登记和完成历史；重登另建记录关联原单（B31-8）。
roles:
  SH-E3:
    positions: [待岗位体系定]
    note: 任一在职员工（申请人、提出人、使用人）；无全员角色编号，借用 SH-E3（分片格式问题 1）
    org_needs: [全部在职员工（B-13 员工引用）可发起用印、IT 需求、领用、报修、员工活动, 需通用角色 SH-E0 全体员工，待 one-architecture 定]
  SH-M1:
    positions: [待岗位体系定]
    note: 仅用印、受控 IT 人审及离职资产逾期通知角色；领用及活动无批准权
    org_needs: [正式制度配置的用印责任与加审角色、按 IT 类别配置的批准负责人，上线前须填，不默认申请人或提出人部门负责人, AR-11 本人、AR-12 缺位委派不替代制度责任归属, 离职生效后 7 个日历日未归还时原组织单元负责人收提醒，非审批；无 IT 受理超时提醒角色需求]
  SH-E6:
    positions: [待岗位体系定]
    note: 本组三个职能：行政经办、信息（IT）资产管理员 / 处理人、行政（活动）；SH-E6 无法区分，按 function 区分（分片格式问题 3）
    functions:
      行政经办:
        org_needs: [保管并使用印章的经办人，至少 2 人（经办人不得登记自己申请的用印）, 用印法人数据范围]
      信息（IT）资产管理员/处理人:
        org_needs: [IT 服务台受理与解决人员, 资产管理员至少 2 人（归还验收不得验收自己名下资产）, 读 B-24 资产卡片]
      行政:
        org_needs: [组织员工活动并确认完成、办理取消登记及留痕的行政人员]
  system: {note: 规则自动执行（自动关闭、规则自动通过），非人}
  platform.approval: {note: 仅用印及受控 IT 需求审批回调，责任人按 D15 制度配置；领用及活动无审批绑定}
