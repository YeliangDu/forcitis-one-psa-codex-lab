# b31 验收场景（B-31 行政事务）。covers 与骨架的 decision.when、timeout、outcomes 逐字相同。
PRC-139:
  - id: PRC-139-S01
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [累计登记份数已达批准份数或经办人确认放弃剩余份数, 已关闭]
    expect: 申请人提交后负责人批准，经办人一次登记全部批准份数，系统自动关闭申请
    outcome: 已关闭
  - id: PRC-139-S02
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 3 步 驳回用印申请]
    covers: [审批已驳回, 已驳回]
    expect: 负责人驳回，审批平台回调驳回用印申请，写驳回意见并通知申请人
    outcome: 已驳回
  - id: PRC-139-S03
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请（申请人撤回）]
    covers: [已撤回]
    expect: 审批中申请人撤回，申请结束且不再进入用印登记
    outcome: 已撤回
  - id: PRC-139-S04
    path: [第 1 步 提交用印申请]
    covers: [用印法人在申请日不是有效法人主体]
    expect: 规则拒绝并要求改正，不进入审批，回到第 1 步
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S05
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [otherwise, 累计登记份数已达批准份数或经办人确认放弃剩余份数]
    expect: 第一次登记未达批准份数，继续登记；第二次达到后自动关闭
    outcome: 已关闭
  - id: PRC-139-S06
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印]
    covers: [累计登记份数超过批准份数]
    expect: 拒绝登记（INV-新-P2），回到第 4 步
    outcome: 回第 4 步（未登记）
  - id: PRC-139-S07
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [累计登记份数已达批准份数或经办人确认放弃剩余份数]
    expect: 经办人确认放弃剩余份数，申请关闭
    outcome: 已关闭
  - id: PRC-139-S08
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请（AR-11 上交上级）, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [已关闭]
    expect: 申请人本人就是所在组织单元负责人，命中 AR-11 上交其上级审批后通过，登记并关闭
    outcome: 已关闭
  - id: PRC-139-S09
    path: [第 1 步 提交用印申请, 第 4 步 登记用印]
    covers: [申请未批准]
    expect: 申请未批准时登记被拒绝（状态机已挡的兜底，INV-新-P1）
    outcome: 回第 4 步（未登记）
  - id: PRC-139-S10
    path: [第 1 步 提交用印申请, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [来源审批实例已通过且份数不超审批载荷份数, 已关闭]
    expect: 合同用印，申请人填已批准合同的审批实例 ID，系统经 platform.approval 校验实例已通过、份数不超审批载荷，不设人审直接置已批准；印章保管人核对后盖章登记，份数到齐后自动关闭
    outcome: 已关闭
  - id: PRC-139-S11
    path: [第 1 步 提交用印申请]
    covers: [来源审批实例未通过或申请份数超过审批载荷份数]
    expect: 填写的来源审批实例尚未通过（审批中、已驳回或已撤回），拒绝提交并告诉申请人原因，留在草稿，不进审批
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S12
    path: [第 1 步 提交用印申请]
    covers: [来源审批实例未通过或申请份数超过审批载荷份数]
    expect: 来源审批实例已通过，但申请份数（含该实例已被其他有效用印申请占用的份数）超过审批载荷份数，拒绝提交并告诉申请人原因，留在草稿
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S13
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请（授权委托书加总经理一级，pending B31-1）, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [otherwise, 已关闭]
    expect: 授权委托书无来源单据，先由申请人所在组织单元负责人批准，再加一级由总经理批准（加审规则待 one-architecture 给号）；通过后保管人盖章登记并关闭
    outcome: 已关闭
PRC-142:
  - id: PRC-142-S01
    path: [第 1 步 提交 IT 需求, 第 3 步 受理 IT 需求, 第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求]
    covers: [otherwise, 已关闭]
    expect: 常规类别不审批、直接受理，解决后提出人确认关闭
    outcome: 已关闭
  - id: PRC-142-S02
    path: [第 1 步 提交 IT 需求, 第 2 步 批准 IT 需求, 第 3 步 受理 IT 需求, 第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求]
    covers: [需求类别要求审批, otherwise]
    expect: 受控类别由提出人所在组织单元负责人批准，通过后受理、解决、关闭
    outcome: 已关闭
  - id: PRC-142-S03
    path: [第 1 步 提交 IT 需求, 第 2 步 批准 IT 需求, 第 7 步 驳回 IT 需求]
    covers: [审批已驳回, 已退回]
    expect: 审批驳回，回调驳回 IT 需求，需求标为已退回并通知提出人
    outcome: 已退回
  - id: PRC-142-S04
    path: [第 1 步 提交 IT 需求, 第 2 步 批准 IT 需求（提出人撤回）]
    covers: [已撤回]
    expect: 审批中提出人撤回，工单结束
    outcome: 已撤回
  - id: PRC-142-S05
    path: [第 1 步 提交 IT 需求, 第 3 步 受理 IT 需求（超时）, 第 4 步 解决 IT 需求]
    covers: [受理 IT 需求超时：P2D 逾期未受理，提醒信息部门负责人（非中断）]
    expect: 2 个工作日未受理，提醒信息部门负责人；受理继续进行，不中断
    outcome: 受理继续
  - id: PRC-142-S06
    path: [第 1 步 提交 IT 需求, 第 3 步 受理 IT 需求, 第 4 步 解决 IT 需求, 第 6 步 退回 IT 需求]
    covers: [需求不成立或无法实现, 已退回]
    expect: 信息部门判定需求不成立或无法实现，退回提出人并写退回原因
    outcome: 已退回
  - id: PRC-142-S07
    path: [第 1 步 提交 IT 需求, 第 3 步 受理 IT 需求, 第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求（超时）]
    covers: [关闭 IT 需求超时：P5D 解决后到期未确认，系统自动关闭（中断）]
    expect: 解决后 5 日提出人未确认，系统代关
    outcome: 已关闭
  - id: PRC-142-S08
    path: [第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求, 第 3 步 受理 IT 需求]
    covers: [提出人认为未解决]
    expect: 提出人认为未解决，回到第 3 步重新受理
    outcome: 回第 3 步
  - id: PRC-142-S09
    path: [第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求]
    covers: [无处理结论]
    expect: 无处理结论时关闭被拒绝（INV-新-P3），回到第 4 步
    outcome: 回第 4 步（未关闭）
PRC-143:
  - id: PRC-143-S01
    path: [第 1 步 申请领用资产, 第 3 步 登记领用]
    covers: [领用的资产类别在使用人岗位标准配置内, otherwise, 已领用]
    expect: 标准配置内的领用规则自动通过，不设审批，资产管理员登记领用
    outcome: 已领用
  - id: PRC-143-S02
    path: [第 1 步 申请领用资产, 第 2 步 批准领用, 第 3 步 登记领用]
    covers: [otherwise, 已领用]
    expect: 超出标准配置，申请人所在组织单元负责人批准后登记领用
    outcome: 已领用
  - id: PRC-143-S03
    path: [第 1 步 申请领用资产, 第 2 步 批准领用, 第 4 步 〔缺〕驳回领用]
    covers: [审批已驳回, 已驳回]
    expect: 超配领用审批驳回，回调驳回领用，申请标为已驳回并通知申请人
    outcome: 已驳回
  - id: PRC-143-S04
    path: [第 1 步 申请领用资产, 第 2 步 批准领用（申请人撤回）]
    covers: [已撤回]
    expect: 超配领用审批中申请人撤回，申请结束
    outcome: 已撤回
  - id: PRC-143-S05
    path: [第 1 步 申请领用资产]
    covers: [资产卡片不存在、已处置或不属 IT 资产类别]
    expect: 拒绝并回到第 1 步，要求重新选择资产卡片
    outcome: 回第 1 步（未提交）
  - id: PRC-143-S06
    path: [第 1 步 申请领用资产]
    covers: [该资产已有未归还的使用人]
    expect: 申请时提前拒绝（INV-新-P4），应先归还或改走调拨
    outcome: 回第 1 步（未提交）
  - id: PRC-143-S07
    path: [第 1 步 申请领用资产, 第 2 步 批准领用, 第 3 步 登记领用]
    covers: [该资产已有未归还的使用人]
    expect: 审批通过后登记时发现已有使用人（并发），兜底拒绝并回到第 1 步
    outcome: 回第 1 步（未登记）
PRC-155:
  - id: PRC-155-S01
    path: [第 1 步 〔缺〕申请调拨资产, 第 2 步 调拨资产]
    covers: [otherwise, 已调拨]
    expect: 申请后资产管理员登记交接，结束调出方使用期间并开启调入方使用期间
    outcome: 已调拨
  - id: PRC-155-S02
    path: [第 1 步 〔缺〕申请调拨资产, 转 PRC-143]
    covers: [资产没有当前使用人, 已转领用]
    expect: 资产没有当前使用人，不走调拨，转入领用流程
    outcome: 已转领用
  - id: PRC-155-S03
    path: [第 1 步 〔缺〕申请调拨资产]
    covers: [调入使用人在调拨日不是在职员工]
    expect: 拒绝并回到第 1 步，要求改选调入使用人
    outcome: 回第 1 步（未提交）
  - id: PRC-155-S04
    path: [第 1 步 〔缺〕申请调拨资产（申请人撤销）]
    covers: [已撤销]
    expect: 申请后、登记前撤销，调拨结束，使用人不变
    outcome: 已撤销
  - id: PRC-155-S05
    path: [第 1 步 〔缺〕申请调拨资产, 第 2 步 调拨资产]
    covers: [调出方不是该资产当前使用人]
    expect: 登记时调出方已不是当前使用人，拒绝（INV-新-P4），回到第 1 步
    outcome: 回第 1 步（未登记）
PRC-156:
  - id: PRC-156-S01
    path: [第 1 步 归还资产]
    covers: [otherwise, 已归还]
    expect: 资产管理员验收后登记归还日，结束使用期间（人工触发）
    outcome: 已归还
  - id: PRC-156-S02
    path: [事件 员工已离职, 第 1 步 归还资产]
    covers: [已归还]
    expect: 员工离职事件为其名下每件未归还资产生成归还待办，验收登记后归还
    outcome: 已归还
  - id: PRC-156-S03
    path: [事件 员工已离职, 第 1 步 归还资产]
    covers: [该资产没有未结束的使用期间]
    expect: 待办生成后资产已先行归还，再登记被拒绝，待办由事件处理器取消
    outcome: 回第 1 步（未登记）
  - id: PRC-156-S04
    path: [事件 员工已离职, 第 1 步 归还资产（超时）]
    covers: [归还资产超时：P7D 离职后逾期未归还，提醒离职员工原组织单元负责人（非中断）]
    expect: 离职后 7 日仍未归还，提醒原组织单元负责人；待办继续
    outcome: 待办继续
PRC-157:
  - id: PRC-157-S01
    path: [第 1 步 报修资产, 第 2 步 登记维修结果]
    covers: [otherwise, 已维修登记]
    expect: 使用人报修，维修在系统外完成，资产管理员登记维修结果与证据
    outcome: 已维修登记
  - id: PRC-157-S02
    path: [第 1 步 报修资产, 第 2 步 登记维修结果]
    covers: [已维修登记]
    expect: 维修结果为无法修复，登记在工单结果列，财务在 B-24 另行发起报废
    outcome: 已维修登记
  - id: PRC-157-S03
    path: [第 1 步 报修资产]
    covers: [报修人不是该资产当前使用人]
    expect: 规则拒绝，回到第 1 步；资产管理员代报时选使用人
    outcome: 回第 1 步（未报修）
PRC-144:
  - id: PRC-144-S01
    path: [第 1 步 提交员工活动申请, 第 3 步 完成员工活动]
    covers: [otherwise, 已完成]
    expect: 周年贺卡一类福利型活动只登记、不审批，行政确认完成
    outcome: 已完成
  - id: PRC-144-S02
    path: [第 1 步 提交员工活动申请, 第 2 步 批准员工活动申请, 第 3 步 完成员工活动]
    covers: [活动类型要求审批, otherwise, 已完成]
    expect: 节日活动或创新项目发布由申请人所在组织单元负责人批准，通过后行政组织并确认完成
    outcome: 已完成
  - id: PRC-144-S03
    path: [第 1 步 提交员工活动申请, 第 2 步 批准员工活动申请, 第 4 步 驳回员工活动申请]
    covers: [审批已驳回, 已驳回]
    expect: 审批驳回，回调驳回员工活动申请，写驳回意见并通知申请人
    outcome: 已驳回
  - id: PRC-144-S04
    path: [第 1 步 提交员工活动申请, 第 2 步 批准员工活动申请（申请人撤回）]
    covers: [已撤回]
    expect: 审批中申请人撤回，申请结束
    outcome: 已撤回
  - id: PRC-144-S05
    path: [第 1 步 提交员工活动申请, 第 2 步 批准员工活动申请（AR-01 加审）, 第 3 步 完成员工活动]
    covers: [已完成]
    expect: 费用预估超第一阈值，命中 AR-01，加审财务负责人后通过，完成
    outcome: 已完成
  - id: PRC-144-S06
    path: [第 1 步 提交员工活动申请, 第 2 步 批准员工活动申请（AR-11 上交上级）, 第 3 步 完成员工活动]
    covers: [已完成]
    expect: 申请人本人就是所在组织单元负责人，命中 AR-11 上交其上级审批后通过
    outcome: 已完成
