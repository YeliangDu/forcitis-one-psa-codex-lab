# b31 验收场景（B-31 行政事务）。covers 与骨架的 decision.when、timeout、outcomes 逐字相同。
PRC-139:
  - id: PRC-139-S01
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [累计登记份数已达批准份数或经办人确认放弃剩余份数, 已关闭]
    expect: 申请人提交后负责人批准，经办人一次登记全部批准份数，系统自动关闭申请
    outcome: 已关闭
  - id: PRC-139-S02
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 3 步 驳回用印申请]
    covers: [审批已驳回, 已驳回]
    expect: 负责人驳回，审批平台回调驳回用印申请，写驳回意见并通知申请人
    outcome: 已驳回
  - id: PRC-139-S03
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请（申请人撤回）]
    covers: [已撤回]
    expect: 审批中申请人撤回，申请结束且不再进入用印登记
    outcome: 已撤回
  - id: PRC-139-S04
    path: [第 1 步 提交用印申请]
    covers: [用印法人在申请日不是有效法人主体]
    expect: 规则拒绝并要求改正，不进入审批，回到第 1 步
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S05
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [otherwise, 累计登记份数已达批准份数或经办人确认放弃剩余份数]
    expect: 第一次登记未达批准份数，继续登记；第二次达到后自动关闭
    outcome: 已关闭
  - id: PRC-139-S06
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印]
    covers: [累计登记份数超过批准份数]
    expect: 拒绝登记（INV-119），回到第 4 步
    outcome: 回第 4 步（未登记）
  - id: PRC-139-S07
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [累计登记份数已达批准份数或经办人确认放弃剩余份数]
    expect: 经办人确认放弃剩余份数，申请关闭
    outcome: 已关闭
  - id: PRC-139-S08
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请（AR-11 上交上级）, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [已关闭]
    expect: 按有效制度配置解析的责任人就是申请人本人，命中 AR-11 上交其上级审批后通过，登记并关闭
    outcome: 已关闭
  - id: PRC-139-S09
    path: [第 1 步 提交用印申请, 第 4 步 登记用印]
    covers: [申请未批准]
    expect: 申请未批准时登记被拒绝（状态机已挡的兜底，INV-118）
    outcome: 回第 4 步（未登记）
  - id: PRC-139-S10
    path: [第 1 步 提交用印申请, 第 4 步 登记用印, 第 5 步 关闭用印申请]
    covers: [来源审批实例已通过且份数不超审批载荷份数, 已关闭]
    expect: 合同用印，申请人填已批准合同的审批实例 ID，系统经 platform.approval 校验实例已通过、份数不超审批载荷，不设人审直接置已批准；印章保管人核对后盖章登记，份数到齐后自动关闭
    outcome: 已关闭
  - id: PRC-139-S11
    path: [第 1 步 提交用印申请]
    covers: [来源审批实例未通过或申请份数超过审批载荷份数]
    expect: 填写的来源审批实例尚未通过（审批中、已驳回或已撤回），拒绝提交并告诉申请人原因，留在草稿，不进审批
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S12
    path: [第 1 步 提交用印申请]
    covers: [来源审批实例未通过或申请份数超过审批载荷份数]
    expect: 来源审批实例已通过，但累计份数校验（INV-138：含该实例已被其他有效用印申请占用的份数）超过审批载荷份数，拒绝提交并告诉申请人原因，留在草稿
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S13
    path: [第 1 步 提交用印申请]
    covers: [无来源单据且用印责任或加审配置缺失、无有效版或不能执行]
    expect: 无来源单据却无有效责任或加审范围配置时拒绝并告警；AR-16 只有候选范围不能直接启用；来源审批直通仍按 INV-138
    outcome: 回第 1 步（未提交）
  - id: PRC-139-S14
    path: [第 3 步 驳回用印申请, 原单第 1 步重提, 第 2 步制度责任人批准, 第 4 步登记, 第 5 步关闭]
    covers: [otherwise, 已关闭]
    expect: 原单已驳回重提，保留原编号、旧意见与轮次，新轮重新核对来源、份数和有效制度版本；旧审批实例回调不得作用新轮
    outcome: 已关闭
  - id: PRC-139-S15
    path: [审批期撤回, 原单第 1 步重提]
    covers: [已撤回, otherwise]
    expect: 已撤回原单可重提且增加提交轮次；同轮重复请求回放，旧轮次与原编号保留；不得建立新单替代原单
    outcome: 进入新轮
  - id: PRC-139-S16
    path: [第 4 步 登记用印]
    covers: [报价用印的版本、法人、拟发文件与实际用印凭据对应缺失或不一致]
    expect: 报价版本、法人、拟发文件或实际用印凭据关系缺失/不一致拒绝并告警；只有已批准、来源审批通过或申请登记不能当实际用印
    outcome: 回第 4 步（未登记）
  - id: PRC-139-S17
    path: [第 4 步 登记用印, 第 5 步 关闭用印申请, 关闭后核验]
    covers: [已关闭]
    expect: 已关闭仍可核验同一报价版本、用印法人、拟发文件与实际盖章凭据；关闭不抹去登记行；B-03 发出前校验入口及依赖环保持未闭合，本卡未实现发出
    outcome: 已关闭
  - id: PRC-139-S18
    path: [第 1 步 提交用印申请, 第 2 步 批准用印申请]
    covers: [otherwise]
    expect: 已有正式批准责任和加审配置版本，按用途、法人、归属对象解析责任人及授权层级；不是默认部门负责人；AR-11/AR-12 仅处理本人和缺位，不替代责任归属
    outcome: 进入登记
PRC-142:
  - id: PRC-142-S01
    path: [第 1 步 提交 IT 需求, 第 3 步 受理 IT 需求, 第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求]
    covers: [otherwise, 已关闭]
    expect: 常规类别提交后为已提交，通知信息部门直接受理到处理中，跳过批准申请的人审；解决到已解决后由提出人确认关闭
    outcome: 已关闭
  - id: PRC-142-S02
    path: [第 1 步 提交 IT 需求, 第 2 步 批准 IT 需求, 第 3 步 受理 IT 需求, 第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求]
    covers: [需求类别要求审批, otherwise]
    expect: 受控类别提交后为审批中，负责人批准后为已提交，信息部门受理后为处理中；解决到已解决后关闭；未把已提交当作处理中
    outcome: 已关闭
  - id: PRC-142-S03
    path: [第 1 步 提交 IT 需求, 第 2 步 批准 IT 需求, 第 7 步 驳回 IT 需求]
    covers: [审批已驳回, 已退回]
    expect: 审批驳回，回调驳回 IT 需求，需求标为已退回并通知提出人
    outcome: 已退回
  - id: PRC-142-S04
    path: [第 1 步 提交 IT 需求, 第 2 步 批准 IT 需求（提出人撤回）]
    covers: [已撤回]
    expect: 审批中提出人撤回，工单结束
    outcome: 已撤回
  - id: PRC-142-S05
    path: [第 1 步 提交 IT 需求, 人工逾期查询或催办]
    covers: [otherwise]
    expect: 常规类别已提交后长期未受理仍保持已提交，无自动提醒、无到期任务；人可查询逾期和人工催办，受理只能由人执行
    outcome: 仍为已提交
  - id: PRC-142-S06
    path: [第 1 步 提交 IT 需求, 第 3 步 受理 IT 需求, 第 6 步 退回 IT 需求]
    covers: [需求不成立或无法实现, 已退回]
    expect: 信息部门受理后判定需求不成立或无法实现，不执行解决、不发 IT 需求已解决，由处理中退回提出人并写退回原因
    outcome: 已退回
  - id: PRC-142-S07
    path: [第 4 步 解决 IT 需求, 提出人长期未确认]
    covers: [otherwise]
    expect: 有处理结论的已解决工单长期未人工确认仍保持已解决，不登记系统代关任务，不自动关闭；仅提出人可人工关闭
    outcome: 仍为已解决
  - id: PRC-142-S08
    path: [第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求, 第 3 步 受理 IT 需求]
    covers: [提出人认为未解决]
    expect: 提出人认为未解决，回到第 3 步重新受理
    outcome: 回第 3 步
  - id: PRC-142-S09
    path: [第 4 步 解决 IT 需求, 第 5 步 关闭 IT 需求]
    covers: [无处理结论]
    expect: 缺处理结论时即使提出人确认也拒绝关闭（INV-120），回第 4 步补结论，不写已关闭
    outcome: 回第 4 步（未关闭）
  - id: PRC-142-S10
    path: [第 1 步 提交 IT 需求]
    covers: [IT 类别表或责任配置缺失、类别未列或无有效版]
    expect: 类别未列、责任表缺失、重叠、无有效版本或提供维护责任不完整拒绝并告警，不默认常规支持、不猜部门负责人
    outcome: 回第 1 步（未提交）
  - id: PRC-142-S11
    path: [第 1 步 提交 IT 需求]
    covers: [涉及金额但承载方、适用阈值或币种配置不完整]
    expect: 金额先明确由 IT 或采购承载；采购承载走采购自身控制，IT 自身承载缺两档阈值或币种拒绝，不补零、不设不限额；无金额类别不凭空加审
    outcome: 回第 1 步（未提交）
  - id: PRC-142-S12
    path: [已退回或已撤回原单, 第 1 步重新提交]
    covers: [otherwise]
    expect: 提出人原单重提保留原编号、旧轮次和意见，按当前有效类别表重新到审批中或已提交；旧轮回调不作用新轮
    outcome: 进入新轮
PRC-143:
  - id: PRC-143-S01
    path: [第 1 步 申请领用资产, 现第 2 步（原第 3 步）登记领用]
    covers: [otherwise, 已领用]
    expect: 标准配置内规则完整通过直达已通过，无审批任务、回调或 SH-M1 批准权；签收后登记已领用，同事务开启在用期间
    outcome: 已领用
  - id: PRC-143-S02
    path: [第 1 步 申请领用资产, 现第 2 步（原第 3 步）登记领用]
    covers: [otherwise, 已领用]
    expect: 超配有可执行允许规则且通过，仍只登记直达已通过后交付，不恢复人审
    outcome: 已领用
  - id: PRC-143-S03
    path: [第 1 步 申请领用资产]
    covers: [岗位标准或超配规则、清单维护配置缺失或无有效版]
    expect: 规则缺失、无有效版或提供维护责任未填拒绝并告警；不能回退负责人酌情批准
    outcome: 回第 1 步（未提交）
  - id: PRC-143-S04
    path: [第 1 步 申请领用资产]
    covers: [岗位标准及超配可执行规则校验不通过]
    expect: 超配规则明确拒绝或不满足，拒绝并告警，无审批、驳回回调及审批期撤回路径
    outcome: 回第 1 步（未提交）
  - id: PRC-143-S05
    path: [第 1 步 申请领用资产]
    covers: [资产卡片不存在、已处置或不属 IT 资产类别]
    expect: 卡片无效拒绝并回第 1 步
    outcome: 回第 1 步（未提交）
  - id: PRC-143-S06
    path: [第 1 步 申请领用资产]
    covers: [该资产已有未归还的使用人]
    expect: 申请时提前拒绝唯一使用人冲突（INV-121），先归还或改调拨
    outcome: 回第 1 步（未提交）
  - id: PRC-143-S07
    path: [第 1 步 申请领用资产, 现第 2 步（原第 3 步）登记领用]
    covers: [该资产已有未归还的使用人]
    expect: 规则通过后并发占用，交付登记时兜底拒绝（INV-121），不开第二个在用期间
    outcome: 回第 1 步（未登记）
PRC-155:
  - id: PRC-155-S01
    path: [第 1 步 〔缺〕申请调拨资产, 第 2 步 调拨资产]
    covers: [otherwise, 已调拨]
    expect: 申请后资产管理员登记交接，结束调出方使用期间并开启调入方使用期间；同一核算主体内跨组织只通知调出、调入两侧负责人，不新增批准或调入方确认；双方实物交接凭据保留，旧期间结束不算归还
    outcome: 已调拨
  - id: PRC-155-S02
    path: [第 1 步 〔缺〕申请调拨资产, 转 PRC-143]
    covers: [资产没有当前使用人, 已转领用]
    expect: 资产没有当前使用人，不走调拨，转入领用流程
    outcome: 已转领用
  - id: PRC-155-S03
    path: [第 1 步 〔缺〕申请调拨资产]
    covers: [调入使用人在调拨日不是在职员工]
    expect: 拒绝并回到第 1 步，要求改选调入使用人
    outcome: 回第 1 步（未提交）
  - id: PRC-155-S04
    path: [第 1 步 〔缺〕申请调拨资产（申请人撤销）]
    covers: [已撤销]
    expect: 申请后、登记前撤销，调拨结束，使用人不变
    outcome: 已撤销
  - id: PRC-155-S05
    path: [第 1 步 〔缺〕申请调拨资产, 第 2 步 调拨资产]
    covers: [调出方不是该资产当前使用人]
    expect: 登记时调出方已不是当前使用人，拒绝（INV-新-P4），回到第 1 步
    outcome: 回第 1 步（未登记）
PRC-156:
  - id: PRC-156-S01
    path: [第 1 步 归还资产]
    covers: [otherwise, 已归还]
    expect: 资产管理员验收后登记归还日，结束使用期间（人工触发）；手工入口无论经过多少天都不登记、套用或触发离职 P7D 提醒
    outcome: 已归还
  - id: PRC-156-S02
    path: [事件 员工已离职, 第 1 步 归还资产]
    covers: [已归还]
    expect: 员工离职事件为其名下每件未归还资产生成归还待办，验收登记后归还
    outcome: 已归还
  - id: PRC-156-S03
    path: [事件 员工已离职, 第 1 步 归还资产]
    covers: [该资产没有未结束的使用期间]
    expect: 待办生成后资产已先行归还，再登记被拒绝，待办由事件处理器取消
    outcome: 回第 1 步（未登记）
  - id: PRC-156-S04
    path: [事件 员工已离职, 第 1 步 归还资产（超时）]
    covers: [P7D, 已提醒]
    expect: 仅 Separated 已生效入口，自离职生效时点起 7 个日历日仍未归还时非中断提醒原组织单元负责人，期间保持在用；不从流程启动或事件到达起算，归还待办继续且不阻塞离职
    outcome: 已提醒
  - id: PRC-156-S05
    path: [Separated 生效后生成待办并登记固定期限, 第 1 步 归还资产, 到期消息到达]
    covers: [已归还]
    expect: 归还完成取消原到期任务；取消与到期并发仍核对当前期间，已归还不得提醒或重开待办
    outcome: 已归还
  - id: PRC-156-S06
    path: [离职生效 8 日后才收到 Separated, 重复到达同一事件或重试]
    covers: [P7D, 已提醒]
    expect: 固定到期时点仍为离职生效 + 7 个日历日；未归还立即按聚合 ID + 到期时点幂等补到期提醒一次，重复/晚到不重置或延后期限；原组织单元负责人接收
    outcome: 已提醒
  - id: PRC-156-S07
    path: [离职后已经归还, 晚到或重复 Separated]
    covers: [该资产没有未结束的使用期间]
    expect: 核对当前期间已结束，不重建归还待办或到期任务，不发提醒；调拨结束旧期间须检查当前在用期间，不能把它误当归还
    outcome: 无重复待办
  - id: PRC-156-S08
    path: [离职生效前收到事件或仅离职登记]
    covers: [otherwise]
    expect: 生效前不生成待办或期限；只处理已生效 Separated，不订阅离职登记已撤销；缺离职生效时点或原组织单元信息拒绝并告警，不以事件到达时点兜底
    outcome: 不生成待办
PRC-157:
  - id: PRC-157-S01
    path: [第 1 步 报修资产, 第 2 步 登记维修结果]
    covers: [otherwise, 已维修登记]
    expect: 使用人对在用资产报修，AGG-121 到已报修；维修在系统外完成，管理员登记结果与证据到已维修登记，同时确认当次服务办结，不结束资产使用期间
    outcome: 已维修登记
  - id: PRC-157-S02
