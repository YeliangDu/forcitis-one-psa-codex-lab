    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 周年贺卡（累计 219）、创新项目发布申请（31）、感恩节活动（2,106，已于 2024-11-11 停用）迁为同一聚合的不同活动类型；在途 周年贺卡 38、创新项目 4、感恩节 75 按 ADR-0036 第 5 条 / U-4 处理（感恩节在途停用已久，建议审结或作废，见 notes 待用户定 9）；A8 早于投产日停用（C-7）"
