# B-31 organization.administration（行政事务，S-09，intent 2026-10-16-152807）流程骨架：PRC-139、142、143、144、155、156、157。
# 字段按 closeout/CONVENTIONS.md（含 §5）；归段按 33e28272 的 VS-14 与目录、ARCH_VS14 的 B31 答复同步，不沿用 S-31 的空 stages。
# 证据：OA_PROCESS_INVENTORY.md 第 111–122 行只给 A8 模板与用量，无节点级步骤；步骤按通行做法起草，标〔推〕的是推断，不是 A8 事实。
# 已定口径：审批走 platform.approval（C-3–C-7，intent 2026-10-16-144943）；A8 早于投产日停用；全部历史迁入（U-1–U-4）；
#   IT 资产是固定资产，卡片、折旧、报废账务在 B-24 AGG-91，B-31 只记使用记录（intent 2026-10-16-152926）。
# 用户原则：能由规则和不变量守卫的不设人工审批；保留的人审 approver 沿用 cost_object_owner 解析别名，责任按 ARCH_VS14 D15 用印人工批准责任、IT 受控类别与责任表配置，
#   实际责任人按 ARCH_VS14 D15 配置；本人及缺位沿 AR-11、AR-12；加审范围须填 ARCH_VS14 D15 用印加审范围、IT 金额适用口径，AR-16 候选不能直接启用；每个人审写 why_human。
# 多入口：PRC-143 原有 5 个触发、4 条入口，生成器只把开始事件接到第 1 步，故拆为 4 个流程；拆出流程已给号 PRC-155、156、157（2acfd46e 目录）。
# 负担参数：本片全部 effort、wait、decision.p 为经验估值（非生产实测或已批准制度），已估 p 是同一判断各互斥出口占比、合计 1，PRC-144 新增取消路径后整组 p 留 null 待取证；不含撤回和超时发生率。
# wait 为进入任务到开始办理的等待小时，不与 effort 混算；无法估的写 null，见 b31.notes.md。frequency_ref 仅给待取证线索，不把历史累计折成年频次。

processes:

  # ───────────── 用印 ─────────────

  - id: PRC-139
    name: 用印申请与用印登记
    type: business
    stages: [VS-14.1, VS-14.2, VS-14.3, VS-14.4]
    stages_note: >-
      VS-14.1：步 1 正式记录用印申请；来源审批经 platform.approval 校验通过且 INV-138 满足时草稿直达已批准，跳过 .2；需人审的草稿到审批中，均符合 OBJ-113 出口。VS-14.2：步 2 按上线前须填的 D15 制度配置（版本、生效日、批准人及依据，B31-1）解析责任人和加审层级，不沿用候选部门负责人或 AR-16 范围，审批中到已批准；步 3 驳回及审批期撤回提前结束本轮，原单可经步 1 重提并保留轮次。VS-14.3：步 4 核对批准及 INV-118、119、138 后登记实际用印到已用印，记录报价版本、用印法人、拟发文件与凭据对应；分次登记为已用印自环。VS-14.4：步 5 份数到齐或确认放弃剩余份数后规则关闭到已关闭；已关闭仍可核验实际用印凭据，未实际盖章不算已用印；报价发出前由 REF-04 经 B-31 api 核验实际用印登记（B31-16，ADR-0057 待批）。
    primary_object: OBJ-113
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 用印申请表单（累计 11,570 单，来源字段待取证）迁为已关闭或已驳回的历史单据；在途 252 单按 ADR-0036 第 5 条 / U-4 在切换前审结或撤回，清不完的以草稿迁入并沿用原编号，由申请人在新系统重新提交（迁入不启动审批实例）；A8 早于投产日停用（C-7）"
    scope: "申请人看自己的单据；行政经办与按制度配置解析的用印责任人看相关单据；用印法人数据范围待正式授权"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "申请人不得登记自己申请的用印（〔推〕通行的印章管理职责分离）"}
      - {roles: [SH-E3, SH-M1], rule: "申请人不得批准自己的用印申请（解析出的审批人就是申请人时按 AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "员工申请用印"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 111 项用印申请；需按申请日期去重并明确统计窗口）"
    outcomes: [已关闭, 已驳回, 已撤回]
    scenarios: [PRC-139-S01, PRC-139-S02, PRC-139-S03, PRC-139-S04, PRC-139-S05, PRC-139-S06, PRC-139-S07, PRC-139-S08, PRC-139-S09, PRC-139-S10, PRC-139-S11, PRC-139-S12, PRC-139-S13, PRC-139-S14, PRC-139-S15, PRC-139-S16, PRC-139-S17, PRC-139-S18, PRC-139-S19, PRC-139-S20, PRC-139-S21, PRC-139-S22]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工（报价、合同、证明等用印需求方）；无全员编号，见 notes 格式问题 1
        org_needs:
          responsibility: "提出用印申请，写明印章类别、用印法人、文件与份数；有已批准来源单据（合同、报价等）的，填来源审批实例 ID，并对来源文件的真实性负责"
          approval_right: "无（只提交，不批准、不登记）"
          department_hint: "申请人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # ARCH_VS14 D15 用印人工批准责任解析的负责人（cost_object_owner 别名）
        org_needs:
          responsibility: "按用印用途、法人、归属对象的正式制度配置判断无来源单据用印；责任归属不由 AR-11、AR-12 代替"
          approval_right: "仅在 D15 用印人工批准责任及加审范围配置完整时批准；AR-16 候选范围不能直接启用"
          department_hint: "按正式制度配置解析，不默认申请人部门"
          position_hint: "正式责任角色与授权层级上线前须填，见 ARCH-B31-materials 1、2"
      - id: SH-E6
        as: performer      # 行政经办：保管印章并登记用印
        org_needs:
          responsibility: "保管印章，按已批准内容（来源审批实例已通过，或负责人已批准）核对后实际盖章，并登记用印时间、份数、经办人，归档扫描件"
          approval_right: "登记用印（不批准申请）"
          department_hint: "行政"
          position_hint: "印章保管与行政事务经办人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交用印申请
        aggregate: AGG-113
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 选印章类别（公章 / 合同专用章 / 法定代表人名章 / 财务章等）和用印法人；填用印事由、文件、份数。有已批准来源单据（合同、报价等）的填其审批实例 ID，系统经 platform.approval 校验该实例已通过、份数不超审批载荷份数，通过则不设人审，直接进入用印登记；校验不过则拒绝提交并告诉申请人原因，不静默。无来源单据的（证明、介绍信、授权委托书等）进入负责人审批（S-40）；无来源单据到审批中；来源校验通过到已批准；已驳回或已撤回的原单可由申请人重提，沿用原编号，创建新审批轮次并保留旧轮次、意见与凭据，重新核对来源实例及累计份数；无来源单据时须先取到有效制度配置才允许进入审批
        permission: 用印申请.提交
        page: 用印申请编辑页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取用印法人与申请人}          # B-31 → B-13（回补新边）
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}          # B-31 → platform.approval（回补新边）
          - {mode: api, direction: out, bc: platform.approval, name: 校验来源审批实例已通过并读取审批载荷份数}   # 既有边 B-31 → platform.approval，不加 B-31 → B-03 / B-05（S-40）
        notify: [{to: SH-E6, how: 企业微信待办（来源审批校验通过且份数不超载荷、直接进入用印登记时）}]
        decision:
          - {when: 用印法人在申请日不是有效法人主体, goto: 1, p: 0.02}     # 规则拒绝并要求改正，不进审批
          - {when: 来源审批实例未通过或申请份数超过审批载荷份数, goto: 1, p: 0.03}   # 规则拒绝并告诉申请人原因，不进审批、不静默
          - {when: 来源审批实例已通过且份数不超审批载荷份数, goto: 4, p: 0.7}   # 规则核对通过，不设人审，由印章保管人用印登记
          - {when: 无来源单据且用印责任或加审配置缺失、无有效版或不能执行, goto: 1, p: 0.02}
          - {when: otherwise, goto: 2, p: 0.23}                           # 无来源单据，进负责人审批
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：用印人工批准责任、用印加审范围（ARCH-B31-materials 1、2）
      - actor: SH-M1
        where: in_system
        command: 批准用印申请
        aggregate: AGG-113
        wait: {typical_h: 24, p90_h: 72}  # 经验估值；null 表示待取证
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        emits: [用印申请已批准]           # 仅分析
        desc: 仅无来源单据的申请进入；按用途、法人、归属对象从正式制度 D15 配置解析负责人、授权层级及加审条件；按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；AR-11、AR-12 仅处理本人和缺位委派，AR-16 候选范围不能直接启用；批准回调只接受本轮审批实例，审批中到已批准
        approval:
          engine: platform.approval
          doc_type: 用印审批
          approver: cost_object_owner     # 解析别名；实际责任人按 ARCH_VS14 D15 配置（用印人工批准责任）
          escalation_rules: [AR-11, AR-12]
          why_human: "无来源单据没有可复用的上游批准，文件内容是否应当盖章需正式制度确定的责任人判断；负责人及加审范围须上线前配置；来源审批通过且 INV-138 满足的路径不进人审。"
          on_reject: 3
        withdraw: {to: end, outcome: 已撤回}
        permission: 用印申请.批准
        page: 审批平台待办
        audit: true
        metric_event: true
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：用印人工批准责任、用印加审范围（ARCH-B31-materials 1、2）
        notify: [{to: SH-E3, how: 企业微信待办结果}]
        decision:
          - {when: 审批已驳回, goto: 3, p: 0.1}
          - {when: otherwise, goto: 4, p: 0.9}
      - actor: platform
        where: automatic
        command: 驳回用印申请
        aggregate: AGG-113
        desc: 审批平台回调：申请标为已驳回，写驳回意见；回调到已驳回
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        decision:
          - {when: otherwise, goto: end, outcome: 已驳回, p: 1}
        outcome: 已驳回
      - actor: SH-E6
        where: offline
        evidence: [实际用印时间, 用印份数, 经办人, 已盖章文件扫描件〔推〕, 对应报价版本引用（报价用途）, 用印法人, 拟发文件引用及其与盖章凭据的对应关系]
        command: 登记用印
        aggregate: AGG-113
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 10, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [用印已办理]               # 仅分析；REF-04 经 api 核验实际登记，不订阅事件
        desc: 印章保管人核对已批准（来源审批实例已通过，或负责人已批准）后在系统外盖章（实物印章），本系统登记结果；可分多次登记，累计份数不得超过批准份数；首次登记到已用印，后续登记仍为已用印；执行 INV-118、INV-119、INV-138，报价用途须登记同一报价版本、用印法人、拟发文件与实际盖章凭据的可核验关系；仅已批准或来源审批通过不算已用印；缺核验对应则拒绝并告警
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
          - {mode: api, direction: in, bc: B-32, name: 核验实际用印登记}   # REF-04 → B-31；B-32 仅为流程模块图节点
        permission: 用印申请.登记用印
        page: 用印登记页
        audit: true
        metric_event: true
        decision:
          - {when: 累计登记份数超过批准份数, goto: 4, p: 0.01}      # INV-新-P2 拒绝
          - {when: 申请未批准, goto: 4, p: 0.01}                    # INV-新-P1 拒绝（状态机已挡，兜底）
          - {when: 报价用印的版本、法人、拟发文件与实际用印凭据对应缺失或不一致, goto: 4, p: 0.01}
          - {when: 累计登记份数已达批准份数或经办人确认放弃剩余份数, goto: 5, p: 0.87}
          - {when: otherwise, goto: 4, p: 0.1}                     # 仍有未用印份数，继续登记
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：报价实际用印核验（ARCH-B31-materials 8）
      - actor: system
        where: automatic
        command: 关闭用印申请
        aggregate: AGG-113
        desc: 规则关闭：累计份数达到批准份数或经办人确认放弃剩余份数后自动关闭，不设人工关闭；由已用印到已关闭；关闭不删除实际用印登记、文件或凭据引用，关闭后仍能核验同一报价版本、法人及拟发文件
        outcome: 已关闭
    notes: >-
      原单重提已定，沿用提交用印申请命令并保留审批轮次；来源复用仍只经 platform.approval，不加 B-31 → B-03/B-05 反查。实际用印核验由 REF-04（报价发出编排，暂名，图节点 B-32）经 api 读取 B-31 登记，逐项匹配同一报价版本、法人、拟发文件与凭据；已用印及关闭后的实际登记均保留可核验，仅批准不算实际用印。读不到、未用印、对应不符、凭据缺失或核验失败均拒绝发出并告警；核验及留痕成功后由 REF-04 调用 B-03 发出命令，B-03 不依赖 B-31、不订阅用印事件或持有其投影。33e28272 已同步该结构并查环无环；ADR-0057 为提议稿待用户批，正式名称与命名空间待 one-glossary，运行时入口交负责组另卡落实。

  # ───────────── IT 需求 ─────────────

  - id: PRC-142
    name: IT 需求工单
    type: business
    stages: [VS-14.1, VS-14.2, VS-14.3, VS-14.4]
    stages_note: >-
      VS-14.1：步 1 依上线前须填的 D15 受控类别表判断（逐类填负责人、是否需人审、理由、表提供方与维护方、采购交接，B31-3），常规草稿到已提交（待受理），需人审草稿到审批中；未列类别或有效配置缺失拒绝并告警。VS-14.2：步 2 按类别和正式制度配置批准到已提交，步 3 人工受理到处理中，两步共同形成退出；常规类别直接受理。VS-14.3：在步 3 受理之后、步 4 解决之前判断，需求不成立或无法实现直接步 6 退回，不执行解决及其事件；成立才到已解决。VS-14.4：步 5 仅提出人人工确认且满足 INV-120 才关闭到已关闭，未解决回步 3 重开；步 6 从处理中、步 7 从审批中提前到已退回，撤回也可提前结束。不设受理提醒或系统代关（B31-2），不调用调度，人工超期不自动改变状态，保留人工催办和逾期查询。
    primary_object: OBJ-114
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 需求工单表单（累计 1,622 单，来源字段待取证）迁为已关闭或已退回的历史工单；在途 105 单按 ADR-0036 第 5 条 / U-4 切换前清空，清不完的以草稿迁入沿用原编号；A8 早于投产日停用（C-7）"
    scope: "提出人看自己的工单；信息部门看全部；需审批类别的审批人看待办单据"
    segregation:
      - {roles: [SH-E3, SH-M1], rule: "提出人不得批准自己的 IT 需求（解析出的审批人就是提出人时按 AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "员工提出 IT 需求"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 112 项需求工单；需按工单日期、类别去重并明确统计窗口）"
    outcomes: [已关闭, 已退回, 已撤回]
    scenarios: [PRC-142-S01, PRC-142-S02, PRC-142-S03, PRC-142-S04, PRC-142-S05, PRC-142-S06, PRC-142-S07, PRC-142-S08, PRC-142-S09, PRC-142-S10, PRC-142-S11, PRC-142-S12]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工，见 notes 格式问题 1
        org_needs:
          responsibility: "提出 IT 需求，描述问题与优先级，解决后确认关闭"
          approval_right: "无（只提交与确认）"
          department_hint: "需求提出人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # ARCH_VS14 D15 IT 受控类别与责任表指定的负责人（仅需人审类别）
        org_needs:
          responsibility: "按受控类别和正式制度配置判断业务必要性及范围，不默认提出人部门负责人"
          approval_right: "仅批准已配置为需人审的类别；金额先分清 IT 或采购承载，IT 自身承载才配置两档阈值和币种"
          department_hint: "各类别责任表指定，上线前须填"
          position_hint: "批准角色、类别表提供方与维护方、默认路由及采购交接上线前须填，见 ARCH-B31-materials 3、4"
      - id: SH-E6
        as: performer      # 信息（IT）：受理与解决
        org_needs:
          responsibility: "受理、处理并解决 IT 需求，登记处理过程与结论，不成立时退回提出人"
          approval_right: "受理、解决、退回 IT 需求（不审批）"
          department_hint: "信息（IT）"
          position_hint: "IT 服务台与运维人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交 IT 需求
        aggregate: AGG-114
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 按 D15 受控类别与责任表逐类读取是否需人审、判断理由、批准负责人、表提供方和维护方、默认路由、采购交接；未列类别不得默认普通支持。按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；常规到已提交（待受理），需人审到审批中；金额在采购承载则留采购，IT 自身承载时须有两档阈值及币种，缺适用口径不放行
        permission: IT需求.提交
        page: IT需求提交页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取提出人与处理人}
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：IT 受控类别与责任表、IT 金额适用口径（ARCH-B31-materials 3、4）
        notify: [{to: SH-E6, how: 企业微信待办（无需审批类别直接受理时）}]
        decision:
          - {when: IT 类别表或责任配置缺失、类别未列或无有效版, goto: 1, p: 0.02}
          - {when: 涉及金额但承载方、适用阈值或币种配置不完整, goto: 1, p: 0.01}
          - {when: 需求类别要求审批, goto: 2, p: 0.2}
          - {when: otherwise, goto: 3, p: 0.77}
      - actor: SH-M1
        where: in_system
        command: 批准 IT 需求
        aggregate: AGG-114
        wait: {typical_h: 24, p90_h: 72}  # 经验估值；null 表示待取证
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 仅有效类别表要求人审的需求进入；按类别与正式制度配置解析负责人，按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；批准后才到已提交（待受理）；采购承载金额不在 IT 重复加审，IT 自身承载的两档阈值及币种须先填
        approval:
          engine: platform.approval
          doc_type: IT需求审批
          approver: cost_object_owner     # 解析别名；实际责任人按 ARCH_VS14 D15 配置（IT 受控类别与责任表）
          escalation_rules: [AR-11, AR-12]
          why_human: "类别表逐类登记需要人判断的理由，正式制度指定的责任人判断必要性与范围；类别及责任表缺失拒绝并告警，不默认提出人部门负责人。"
          on_reject: 7
        withdraw: {to: end, outcome: 已撤回}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}
        permission: IT需求.批准
        page: 审批平台待办
        audit: true
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：IT 受控类别与责任表、IT 金额适用口径（ARCH-B31-materials 3、4）
        decision:
          - {when: 审批已驳回, goto: 7, p: 0.1}
          - {when: otherwise, goto: 3, p: 0.9}
      - actor: SH-E6
        where: in_system
        command: 受理 IT 需求
        aggregate: AGG-114
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 常规类别从已提交受理；需审批类别步 2 批准后也是已提交，本步指定处理人后进入处理中；与步 2 合起来达到 VS-14.2 退出，不把已提交误改为处理中；受理仍由人办理，保留人工催办和逾期查询，不登记、取消或执行受理超时任务
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}      # 仅经审批的类别
        permission: IT需求.受理
        page: IT需求工作台
        decision:                          # 先分流再解决：不成立时不执行解决命令、不发 IT 需求已解决（ARCH_VS14 A3）
          - {when: 需求不成立或无法实现, goto: 6, p: 0.1}
          - {when: otherwise, goto: 4, p: 0.9}
      - actor: SH-E6
        where: in_system
        command: 解决 IT 需求
        aggregate: AGG-114
        effort: {typical_min: 30, p90_min: 120}  # 经验估值；null 表示待取证
        emits: [IT 需求已解决]            # 仅分析
        desc: 记录处理过程与处理结论；实际排查在系统外进行，本系统登记过程与结论；只在需求成立时执行，处理中 → 已解决；不成立的已在步 3 后分流到步 6 退回
        permission: IT需求.解决
        page: IT需求工作台
        metric_event: true
      - actor: SH-E3
        where: in_system
        command: 关闭 IT 需求
        aggregate: AGG-114
        wait: {typical_h: 24, p90_h: 120}  # 经验估值；null 表示待取证
        effort: {typical_min: 3, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 仅提出人人工确认且已有处理结论（INV-120）后，已解决到已关闭；无处理结论拒绝并回解决步骤补结论，反馈未解决则回步 3 重开到处理中；不设超时代关或相应到期任务，人工超期保持状态，保留人工催办及逾期查询
        permission: IT需求.关闭
        page: IT需求详情页
        decision:
          - {when: 无处理结论, goto: 4, p: 0.01}      # INV-新-P3 拒绝
          - {when: 提出人认为未解决, goto: 3, p: 0.09}
          - {when: otherwise, goto: end, outcome: 已关闭, p: 0.9}
        outcome: 已关闭
      - actor: SH-E6
        where: in_system
        command: 退回 IT 需求
        aggregate: AGG-114
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 需求不成立或无法实现时退回提出人，写退回原因；由处理中到已退回
        permission: IT需求.退回
        page: IT需求工作台
        notify: [{to: SH-E3, how: 企业微信}]
        decision:
          - {when: otherwise, goto: end, outcome: 已退回, p: 1}
        outcome: 已退回
      - actor: platform
        where: automatic
        command: 驳回 IT 需求
        aggregate: AGG-114
        desc: 审批平台回调：需求标为已退回，写驳回意见；由审批中到已退回
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        outcome: 已退回
    notes: 〔缺〕驳回 IT 需求与退回 IT 需求都以「已退回」结束；前者承接审批驳回回调，后者是信息部门主动退回，见 notes 新用语。

  # ───────────── IT 资产使用（B-31 部分）：领用 ─────────────

  - id: PRC-143
    name: IT 资产领用
    type: business
    stages: [VS-14.1, VS-14.3]
    stages_note: >-
      VS-14.1：现步 1（原步 1）申请领用资产，岗位标准和超配可执行规则通过才草稿到已通过，缺失或不满足拒绝并告警；全部领用只登记、由规则控制，不设人审，跳过 VS-14.2（B31-5）；岗位配置清单、超配规则及其提供与维护方为上线前须填 D15 配置。VS-14.3：现步 2（原步 3）以规则已通过为前提实物签收并登记，INV-121 兜底，同事务创建在用使用期间、申请到已领用。流程在已领用结束；归还另由 PRC-156 重入 .4，调拨由 PRC-155 重入 .3。原步 2、4 及其审批期撤回已删除，历史状态、审批轮次和原编号仅作迁入历史保留。
    primary_object: OBJ-115
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 的 IT 资产领用（累计 1）、调拨（139）、报修（128）三类表单迁入使用记录与维修工单（调拨、报修见 PRC-155、157），须能对应到 B-24 资产卡片（对应方法待取证，见 notes 待用户定 4）；信息变更（137）、内购（3）、报废回收（1）、采购申请不属 B-31，归 B-24 / 采购，由财务组处理；在途调拨 0、报修 2、内购 1 按 ADR-0036 第 5 条 / U-4；A8 早于投产日停用（C-7）"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "使用人不得登记自己的领用（领用登记由资产管理员完成）"}
    triggers:
      - {type: human, name: "申请领用"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 121 项 IT资产领用申请；需核对线下领用记录及统计窗口）"
    outcomes: [已领用]
    scenarios: [PRC-143-S01, PRC-143-S02, PRC-143-S03, PRC-143-S04, PRC-143-S05, PRC-143-S06, PRC-143-S07]
    roles:
      - id: SH-E3
        as: initiator      # 使用人（任一员工），见 notes 格式问题 1
        org_needs:
          responsibility: "申请领用 IT 资产，签收设备，并对名下资产负责"
          approval_right: "无（只申请）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：交付、登记
        org_needs:
          responsibility: "交付设备并登记领用，保证同一资产同一时刻只有一个使用人"
          approval_right: "登记领用（不批准申请）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请领用资产
        aggregate: AGG-115
        effort: {typical_min: 5, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 全部领用只登记；读取 B-24 有效卡片及 B-13 使用人，申请时提前检查唯一使用人；岗位标准与超配可执行规则校验通过后草稿直达已通过。按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；规则不满足也拒绝并告警，不能改由负责人酌情批准；清单提供方及维护方上线前须填
        permission: IT资产.申请领用
        page: IT资产领用申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}      # B-31 → B-24（回补新边，intent 152926）
          - {mode: api, direction: out, bc: B-13, name: 读取使用人}
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：领用规则及清单维护（ARCH-B31-materials 5）
        notify: [{to: SH-E6, how: 企业微信待办（规则通过、待登记领用时）}]
        decision:
          - {when: 资产卡片不存在、已处置或不属 IT 资产类别, goto: 1, p: 0.01}
          - {when: 该资产已有未归还的使用人, goto: 1, p: 0.04}                      # INV-新-P4 提前拒绝；应先归还或改走调拨
          - {when: 岗位标准或超配规则、清单维护配置缺失或无有效版, goto: 1, p: 0.02}
          - {when: 岗位标准及超配可执行规则校验不通过, goto: 1, p: 0.02}
          - {when: otherwise, goto: 2, p: 0.91}           # 规则自动通过，不设审批
      - actor: SH-E6
        where: offline
        evidence: [领用人签收, 交付日期, 设备实物状态〔推〕]
        command: 登记领用
        aggregate: AGG-115
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 15, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [资产已领用]               # 仅分析；离职交接可读
        desc: 规则已通过后线下实物交付并签收，本系统登记使用人、起始日及签收凭据；不依赖审批通过事件；申请已通过到已领用，并同事务开启在用使用期间；交付时兜底 INV-121，已有使用人则拒绝
        permission: IT资产.登记领用
        page: IT资产使用登记页
        audit: true
        metric_event: true
        decision:
          - {when: 该资产已有未归还的使用人, goto: 1, p: 0.02}      # INV-新-P4 拒绝（兜底，申请时已提前拒绝）
          - {when: otherwise, goto: end, p: 0.98}
        outcome: 已领用
    notes: >-
      仅占 .1、.3；原步 2 批准、原步 4 驳回及审批期撤回不再是现行命令。历史审批中、已驳回、已撤回、轮次、原编号全量保留，ADR-0036 U-4 不因本次取消审批而改写或批量改草稿。卡片、折旧、报废及盘点账务归 B-24。

  # ───────────── IT 资产使用：调拨 ─────────────

  - id: PRC-155
    name: IT 资产调拨
    type: business
    stages: [VS-14.3]
    stages_note: >-
      仅占 VS-14.3：已领用或已调拨资产的使用期间在用，符合 OBJ-115 的在用进入条件；步 1 提出调拨请求（调拨申请草稿 → 已申请），本次为已使用资产重入，不是 VS-14.1 的初次领用申请；同一核算主体内跨组织调拨只通知调出、调入两侧负责人，不设批准（B31-6）。步 2 登记交接，调拨申请已申请 → 已调拨，并同事务结束调出期间、开启调入期间，满足本段已调拨退出；使用未结束，不归 VS-14.4，日后归还由 PRC-156 承接。无当前使用人的请求转 PRC-143 初次领用，结局已转领用；撤销只结束本次调拨；跨法人转让及账务归固定资产流程。
    primary_object: OBJ-115
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：A8 调拨申请表单（累计 139、在途 0）迁入使用期间历史"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "调出使用人不得登记自己的调拨（交接登记由资产管理员完成）"}
    triggers:
      - {type: human, name: "申请调拨"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 115 项 IT资产调拨申请；需核对交接登记及统计窗口）"
    outcomes: [已调拨, 已转领用, 已撤销]
    scenarios: [PRC-155-S01, PRC-155-S02, PRC-155-S03, PRC-155-S04, PRC-155-S05]
    roles:
      - id: SH-E3
        as: initiator      # 调出使用人
        org_needs:
          responsibility: "发起调拨，选定调入使用人，配合交接"
          approval_right: "无（只申请，调拨由规则守卫、不设审批）"
          department_hint: "调出使用人所在组织单元"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：核对并登记交接
        org_needs:
          responsibility: "核对并登记交接，结束调出方使用期间并开启调入方使用期间"
          approval_right: "登记调拨（不批准申请）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-M1
        as: informed      # 调出、调入使用人所在组织单元的负责人：知悉
        org_needs:
          responsibility: "知悉跨组织单元的调拨，对本单元资产使用情况负责"
          approval_right: "无（同一核算主体内跨组织只通知调出、调入两侧负责人，不增加批准）"
          department_hint: "调出方、调入方所在组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 〔缺〕申请调拨资产
        aggregate: AGG-115
        effort: {typical_min: 5, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 调出使用人（或资产管理员）选调入使用人；调拨不设人工审批，由规则守卫（同一时刻只有一个使用人、调入使用人须在职），跨组织单元的调拨通知两侧负责人（A8 有调拨申请表单，聚合稿回补只有「调拨资产」命令）；调拨请求到已申请；无使用人转领用时为已转领用；仅同一核算主体内换使用人，卡片有效及唯一使用人校验保留，跨法人转让交固定资产流程，不在此登记
        permission: IT资产.申请调拨
        page: IT资产调拨申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}
          - {mode: api, direction: out, bc: B-13, name: 读取使用人}
        notify: [{to: SH-M1, how: 企业微信（跨组织单元调拨时通知调出、调入两侧负责人）}]
        withdraw: {to: end, outcome: 已撤销}
        decision:
          - {when: 资产没有当前使用人, goto: PRC-143, p: 0.05}      # 无使用人的资产走领用，不走调拨
          - {when: 调入使用人在调拨日不是在职员工, goto: 1, p: 0.02}
          - {when: otherwise, goto: 2, p: 0.93}
      - actor: SH-E6
        where: offline
        evidence: [调出方与调入方交接确认, 交接日期]
        command: 调拨资产
        aggregate: AGG-115
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 15, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [资产已调拨]               # 仅分析
        desc: 实物交接在系统外；本系统同一事务结束调出方的使用期间并开启调入方的使用期间，保证同一时刻只有一个使用人；调拨申请到已调拨；旧期间在用 → 已结束，新期间为在用
        permission: IT资产.登记调拨
        page: IT资产使用登记页
        audit: true
        metric_event: true
        decision:
          - {when: 调出方不是该资产当前使用人, goto: 1, p: 0.02}      # INV-新-P4 拒绝
          - {when: otherwise, goto: end, p: 0.98}
        outcome: 已调拨
    notes: >-
      同一核算主体内跨组织调拨只通知双方，不增加批准或调入方负责人确认；保留实物交接记录，同事务结束旧期间并开新期间，旧期间结束不等于归还。跨法人转让及账务归 B-24 固定资产流程；不新增批准或驳回调拨命令。

  # ───────────── IT 资产使用：归还 ─────────────

  - id: PRC-156
    name: IT 资产归还
    type: business
    stages: [VS-14.4]
    stages_note: >-
      仅占 VS-14.4：承接 PRC-143 的已领用或 PRC-155 的已调拨，已有在用使用期间时，由人工登记或 B-13 Separated 生成归还待办重入，不重复 VS-14.1–VS-14.3。步 1 验收并归还资产，结局已归还对应 OBJ-115 的本段退出；AGG-115 使用期间转换写在用 → 已结束且 process_outcome 为已归还；按 ARCH_VS14 A4，VS-14 出口的已结束限定为归还资产命令产生，调拨结束旧期间不算归还。离职触发的归还待办不作 VS-13.6 退出条件；仅离职入口按离职生效日（非事件到达日）起 7 个日历日仍未归还，非中断提醒原组织单元负责人，归还完成取消到期任务，幂等键为聚合 ID + 到期时点，手工入口不套期限（B31-7，参数按 D15 记版本）；离职逾期的已提醒只结束非中断提醒分支，不代替归还。
    primary_object: OBJ-115
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：归还以使用期间结束日迁入；离职归还待办不迁（切换后由 Separated 事件生成）"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "资产管理员不得验收登记自己名下资产的归还（由另一名管理员或其负责人处理）"}
    triggers:
      - {type: human, name: 资产管理员手工登记归还（不套离职期限）}
      - {type: event, name: "员工已离职", event: Separated, bc: B-13}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 未列独立归还模板；线索为 AGG-115 使用期间结束日、归还记录与 Separated 后待办，需区分调拨结束与归还）"
    outcomes: [已归还, 已提醒]
    scenarios: [PRC-156-S01, PRC-156-S02, PRC-156-S03, PRC-156-S04, PRC-156-S05, PRC-156-S06, PRC-156-S07, PRC-156-S08]
    roles:
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：验收并登记
        org_needs:
          responsibility: "验收归还的设备并登记归还日，处理离职触发的归还待办"
          approval_right: "登记归还（验收人不得是名下资产自己的管理员）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-E3
        as: informed      # 使用人
        org_needs:
          responsibility: "按要求归还设备，对归还前的资产负责"
          approval_right: "无（只知悉）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: informed      # 离职员工原组织单元负责人：逾期未归还时收到提醒
        org_needs:
          responsibility: "离职员工原组织单元负责人，对逾期未归还的资产收到提醒并督促"
          approval_right: "无（只接收提醒）"
          department_hint: "离职员工原组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E6
        where: offline
        evidence: [归还验收人, 归还日期, 设备实物状态]
        command: 归还资产
        aggregate: AGG-115
        wait: {typical_h: null, p90_h: null}  # 经验估值；null 表示待取证
        effort: {typical_min: 15, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [资产已归还]               # 仅分析；离职交接可读
        desc: 双入口：手工归还不登记离职到期任务；仅已生效离职 Separated 为名下每件仍在用资产生成归还待办。离职到期时点固定为离职生效后 7 个日历日，不从流程启动或事件到达起算；B-31 向 platform.scheduling 登记该到期时点，逾期仍未归还则非中断提醒原组织单元负责人；归还完成取消任务。幂等键为聚合 ID + 到期时点，晚到事件及重试不重置期限，晚到时已到期则核对当前在用期间后执行一次到期提醒；已归还不建待办、不提醒。实物验收后登记归还日，使用期间在用到已结束，process_outcome 为已归还；调拨结束不混作归还，INV-121 保持。该提醒按本次答复登记 D15 版本、生效日、批准人及依据，配置未登记则拒绝并告警；本卡未实现调度器。
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}      # 事件触发时；人工触发无此项
          - {mode: api, direction: out, bc: platform.scheduling, name: 仅离职入口登记离职生效后 7 个日历日提醒并在归还完成时取消}
        permission: IT资产.登记归还
        page: IT资产使用登记页
        audit: true
        metric_event: true
        notify: [{to: SH-E6, how: 企业微信待办（事件触发时）}]
        # 非中断超时分支结局为已提醒，原任务继续；提醒不改对象状态。
        timeout: {after: "P7D", escalate_to: SH-M1, interrupting: false}   # ARCH_VS14 D15 离职归还提醒：仅离职生效后 7 个日历日，完成取消；起点非任务启动/事件到达
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：离职归还提醒（已定 7 个日历日，以 B31-20261017-122917-ctg 登记版本、生效日、批准人及依据）
        decision:
          - {when: 该资产没有未结束的使用期间, goto: 1, p: 0.02}      # 已先行归还或待办重复：拒绝登记，待办由事件处理器取消
          - {when: otherwise, goto: end, p: 0.98}
        outcome: 已归还
    notes: >-
      timeout.after P7D 仅表示离职入口的日历期限，绝非从本任务开始等待 P7D；起算点为离职生效时点，手工入口不适用。双入口的条件及绝对到期时点写在本步描述，通用描述图不足以证明运行时定时语义；本卡仅流程设计。归还完成取消，重复或晚到 Separated 不重置期限。不订阅离职登记已撤销，归还不作 VS-13.6 出口条件。

  # ───────────── IT 资产使用：报修 ─────────────

  - id: PRC-157
    name: IT 资产报修与维修登记
    type: business
    stages: [VS-14.3, VS-14.4]
    stages_note: >-
      VS-14.3：已有在用资产故障后重入，步 1 报修资产创建 AGG-121 维修单到已报修，步 2 登记维修结果到已维修登记，对应本段 OBJ-115 / AGG-121 退出；不重复初次领用的 VS-14.1、VS-14.2，也不设维修审批。按 ARCH_VS14 A5，VS-14.3 进入已拆为 AGG-121 已报修，不把已报修放入 AGG-115。VS-14.4：步 2 同时确认本次维修登记，已维修登记保持为该次服务办结事实（进入与退出同态），不加空转命令；已修复或无法修复是结果属性，不作状态，维修结束不等于资产已归还。
    primary_object: OBJ-115
    primary_object_note: "AGG-121 维修单是 OBJ-115 的维修工单子生命周期"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：A8 报修申请表单（累计 128、在途 2）迁为维修工单历史；在途 2 按 U-4 切换前办结；全部维修明细与原编号保留，结果已修复/无法修复仅为属性，终态仍为已维修登记，不新增审批，不因取消其他流程审批批量改历史或草稿"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    triggers:
      - {type: human, name: "报修"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 116 项 IT资产报修申请；需核对维修完成记录及统计窗口）"
    outcomes: [已维修登记]
    scenarios: [PRC-157-S01, PRC-157-S02, PRC-157-S03]
    roles:
      - id: SH-E3
        as: initiator      # 使用人
        org_needs:
          responsibility: "发现设备故障时报修，描述故障"
          approval_right: "无（只报修）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：送修并登记维修结果
        org_needs:
          responsibility: "送修或内部处理，并登记维修结果与证据"
          approval_right: "登记维修结果（不审批）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-E6
        as: informed      # 财务（B-24 资产卡片维护人），知悉维修无法修复的结果
        org_needs:
          responsibility: "作为 B-24 资产卡片维护人，知悉维修无法修复的结果并另行发起报废"
          approval_right: "无（只知悉，报废由财务在 B-24 发起）"
          department_hint: "财务"
          position_hint: "固定资产核算与卡片维护人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 报修资产
        aggregate: AGG-121
        effort: {typical_min: 5, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 使用人填故障描述，生成维修工单；报修不经审批（维修结果登记与采购、费用报销各走各自的审批；单项维修费用若超限额走采购 / 费控，不属 B-31）；维修单草稿 → 已报修
        permission: IT资产.报修
        page: IT资产报修页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}
        decision:
          - {when: 报修人不是该资产当前使用人, goto: 1, p: 0.02}      # 规则拒绝，使用人名下才能报修；资产管理员代报时选使用人
          - {when: otherwise, goto: 2, p: 0.98}
      - actor: SH-E6
        where: external:维修服务商
        evidence: [维修单或发票引用, 维修结果, 完成日期]
        command: 登记维修结果
        aggregate: AGG-121
        wait: {typical_h: 24, p90_h: 120}  # 经验估值；null 表示待取证
        effort: {typical_min: 10, p90_min: 30}  # 经验估值；null 表示待取证
        desc: 从已报修登记到已维修登记，同时确认本次维修服务办结；维修在系统外（内部处理或送修厂商），无接口，本系统只登记结果与证据；无法修复的资产由财务在 B-24 另行报废，B-31 不发起（B-31 → B-24 只有读取边，见 notes 接缝问题 1）
        permission: IT资产.登记维修结果
        page: IT资产维修工单页
        audit: true
        outcome: 已维修登记
    notes: 维修结果（已修复 / 无法修复）由工单的结果列表达，骨架不分叉。

  # ───────────── 员工活动 ─────────────

  - id: PRC-144
    name: 申请员工活动
    type: business
    stages: [VS-14.1, VS-14.4]
    stages_note: >-
      VS-14.1：现步 1（原步 1）只登记、由规则控制（B31-8），统一规则登记，全部活动通过预算、组织安排及类型规则后草稿直达已批准（规则结果，无人工批准）；周年贺卡读 B-13 入职日期与有效人员事实，由 platform.scheduling 按入职周年于业务日自动生成（B31-10），以员工、入职日期、周年日期、类型去重；适用员工、闰日、重新入职、补跑口径与规则维护责任为上线前须填配置，缺配置拒绝并告警；其他活动可人工登记。VS-14.2 无人审直接跳过；VS-14.3 活动举办无独立对象状态，亦跳过。VS-14.4：现步 2（原步 3）组织活动并登记完成，已批准到已完成，只有已完成是本段正常退出。新增步 3「取消员工活动登记」是登记生命周期的逆向纠错，从已批准或已完成到提议终态已取消；归属于 PRC-144 的登记撤销路径，不构成 VS-14.4 服务办结退出、不新增阶段或人审。原步 2、4 和审批期撤回、AR-01/AR-02 活动金额加审已删除，历史状态与轮次保留迁入；费用、报销、采购保留自身流程。
    primary_object: OBJ-116
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 周年贺卡（累计 219）、创新项目发布申请（31）、感恩节活动（2,106，已于 2024-11-11 停用）迁为同一聚合的不同活动类型；在途 周年贺卡 38、创新项目 4、感恩节 75 按 ADR-0036 第 5 条 / U-4 处理（感恩节在途停用已久，建议审结或作废，见 notes 待用户定 9）；A8 早于投产日停用（C-7）；历史审批中、已驳回、已撤回、审批轮次与原编号全量保留；在途按 ADR-0036 U-4 逐项处置，不因取消审批批量改草稿"
    scope: "申请人看自己的申请；行政与人力看全部"
    triggers:
      - {type: time, name: 系统按入职周年自动生成（经 platform.scheduling 按业务日触发，尚未实现）}
      - {type: human, name: 其他活动人工登记}
      - {type: human, name: 已批准或已完成的活动登记取消, entry: 3}   # CONVENTIONS entry：从步 3 进入，不重复登记或完成（CON-1017-ARC-08）
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 113、118、120 项周年贺卡、感恩节活动、创新项目发布；需区分已停用类型及统计窗口）"
    outcomes: [已完成, 已取消]
    scenarios: [PRC-144-S01, PRC-144-S02, PRC-144-S03, PRC-144-S04, PRC-144-S05, PRC-144-S06, PRC-144-S07, PRC-144-S08, PRC-144-S09, PRC-144-S10, PRC-144-S11, PRC-144-S12, PRC-144-S13]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工，见 notes 格式问题 1
        org_needs:
          responsibility: "登记周年贺卡以外的活动类型、参与人和费用预估；周年贺卡由系统自动生成，无需员工申请"
          approval_right: "无（只提交）"
          department_hint: "申请人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 行政：组织实施、确认完成
        org_needs:
          responsibility: "组织实施活动并确认完成；登记记错或活动取消时办理取消登记，写原因并保留审计，按需要重新登记"
          approval_right: "确认完成、取消员工活动登记（均不审批）"
          department_hint: "行政"
          position_hint: "行政事务经办人员；岗位体系未定，按职能描述"
    steps:
      - actor: system
        where: automatic
