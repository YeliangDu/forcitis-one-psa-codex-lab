# vs0911 权责对照条目（收敛产物，提议稿）。格式依 RESPONSIBILITY_MATRIX_SPEC 第 A 节。
# A 唯一；approver 与骨架 approval.approver 一致：platform.approval 的骨架写 cost_object_owner，在此展开为
#   经营计划：归属对象 = 经营计划版本的归属组织单元，A = {resolve: instance, field: 经营计划版本.归属组织单元.负责人}（公司级计划为管理层负责人）；
#   知识条目评审（engine aggregate，专业复核）：approver 写类型级角色 SH-E4，A = {resolve: type, role: SH-E4}（技术委员会的专业负责人）；知识条目其余命令的问责 A 仍按实例解析为归属组织单元负责人。
# 边界：AR-01、02 金额阈值不适用；AR-11 责任人就是提交人本人 → 汇报线上级；AR-12 责任人缺位 → 上级组织负责人（二者 guard: approval，处理方式交用户定）。
# 无审批的命令只有执行与问责（A），boundary 写规则守卫而非加审。

entries:

  # AGG-79 经营计划版本
  - {object: AGG-79, command: 编制经营计划版本, raci: {A: {resolve: instance, field: 经营计划版本.归属组织单元.负责人}, R: [SH-M1], C: [SH-E6], I: []}, boundary: {segregation: [编制人 ≠ 审批人（见审批命令）]}, sensitive: false}
  - {object: AGG-79, command: 〔缺〕提交经营计划审批, raci: {A: {resolve: instance, field: 经营计划版本.归属组织单元.负责人}, R: [SH-M1], C: [], I: []}, boundary: {rule: 候选规则-目标值完整}, sensitive: false}
  - {object: AGG-79, command: 〔缺〕撤回经营计划审批, raci: {A: {resolve: instance, field: 经营计划版本.归属组织单元.负责人}, R: [SH-M1], C: [], I: []}, boundary: {when: 审批未结束}, sensitive: false}
  - object: AGG-79
    command: 〔缺〕通过经营计划审批
    raci:
      A:
        resolve: instance
        field: 经营计划版本.归属组织单元.负责人
      R:
      - platform.approval
      C: []
      I:
      - SH-M1
    boundary:
      limit_rule: 无（计划不是金额单据，AR-01、02 不适用）
      segregation:
      - 提交人 ≠ A
      delegate:
        when: AR-11
        to: 汇报线上级
      escalate:
        when: AR-12
        to: 上级组织负责人
    sensitive: false
    approver: cost_object_owner
    why_human: 目标值与资源取舍是否合理、是否可达，需要责任人凭经营判断
    note: 审批平台任务「经营计划审批」的结果由本命令落地；原「经营计划审批」伪命令条目已并入本条（one-architecture 2026-10-16）
  - {object: AGG-79, command: 〔缺〕驳回经营计划审批, raci: {A: {resolve: instance, field: 经营计划版本.归属组织单元.负责人}, R: [platform.approval], C: [], I: [SH-M1]}, boundary: {note: 回调命令}, sensitive: false}
  - {object: AGG-79, command: 作废经营计划草稿, raci: {A: {resolve: instance, field: 经营计划版本.归属组织单元.负责人}, R: [SH-M1], C: [], I: []}, boundary: {when: 仅编制中，审批中须先撤回}, sensitive: false}
  - {object: AGG-79, command: 基线化经营计划, raci: {A: {resolve: instance, field: 经营计划版本.归属组织单元.负责人}, R: [system], C: [], I: [SH-E6]}, boundary: {rule: INV-101, note: 审批通过自动执行，不设人工确认（待用户定 9）}, sensitive: false}
  - {object: AGG-79, command: 编制预测版本, raci: {A: {resolve: instance, field: 预测人员.直属上级}, R: [SH-E5], C: [], I: [SH-M1]}, boundary: {note: 预测不审批；逾期升级对象与期限待用户定 4}, sensitive: false}
  - {object: AGG-79, command: 编制现金流预测, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [SH-E6], C: [SH-E5], I: [SH-M1]}, boundary: {note: 限财务与管理层可见}, sensitive: false}

  # AGG-79 经营复盘记录（次级，PRC-181；不设审批，规则守卫）
  - {object: AGG-79, command: 〔缺〕创建经营复盘, raci: {A: {resolve: instance, field: 经营复盘.复盘组织单元.负责人}, R: [system], C: [SH-E6], I: [SH-M1]}, boundary: {rule: 候选规则-复盘期间已关账、候选规则-复盘唯一}, sensitive: false}
  - {object: AGG-79, command: 〔缺〕记录偏差解释, raci: {A: {resolve: instance, field: 经营复盘.复盘组织单元.负责人}, R: [SH-M1], C: [SH-E6], I: []}, boundary: {when: 仅复盘中}, sensitive: false}
  - {object: AGG-79, command: 〔缺〕确定经营动作, raci: {A: {resolve: instance, field: 经营复盘.复盘组织单元.负责人}, R: [SH-M1], C: [SH-E6], I: []}, boundary: {rule: 候选规则-动作要素齐全}, sensitive: false}
  - {object: AGG-79, command: 〔缺〕定稿经营复盘, raci: {A: {resolve: instance, field: 经营复盘.复盘组织单元.负责人}, R: [SH-M1], C: [SH-E6], I: [SH-O1]}, boundary: {rule: 候选规则-偏差须解释、候选规则-定稿后不可改, note: 不设审批}, sensitive: false}
  - {object: AGG-79, command: 〔缺〕完成经营动作, raci: {A: {resolve: instance, field: 经营复盘.复盘组织单元.负责人}, R: [SH-M1], C: [], I: []}, boundary: {rule: 候选规则-动作责任人本人登记, note: 逾期只提醒复盘责任人，不自动完成}, sensitive: false}

  # AGG-80 预算账户（调整与开立不设审批，规则守卫）
  - {object: AGG-80, command: 开立预算账户, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [SH-E6], C: [], I: [SH-M1]}, boundary: {rule: 候选规则-预算类型分流、候选规则-额度不超基线}, sensitive: false}
  - {object: AGG-80, command: 调整预算, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [SH-E6], C: [], I: [SH-M1]}, boundary: {rule: 候选规则-额度总额内调剂, escalate: 超出即拒绝并改走经营计划新版本审批}, sensitive: false}
  - {object: AGG-80, command: 占用预算, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [system（B-11、B-12 调用）], C: [], I: []}, boundary: {rule: AR-03 / RULE-406 超额只预警, note: 拦截或预警待用户定 1}, sensitive: false}
  - {object: AGG-80, command: 释放预算占用, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [system（B-11、B-12、定时对账）], C: [], I: []}, boundary: {}, sensitive: false}
  - {object: AGG-80, command: 调整预算占用, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [system（B-11 PRC-71 经 api 调用）], C: [], I: []}, boundary: {rule: INV-102 / F-Q2 超额只预警, note: 调用方 PRC-71（finance 组），S-31 SQ-08}, sensitive: false}
  - {object: AGG-80, command: 〔缺〕消耗预算占用, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [system], C: [], I: []}, boundary: {note: 孤儿命令}, sensitive: false}

  - {object: AGG-80, command: 关闭预算账户, raci: {A: {resolve: type, role: SH-M1, function: 财务负责人}, R: [system, SH-E6], C: [], I: []}, boundary: {note: 预算期届满或新基线取代时由 PRC-161 定时关闭}, sensitive: false}

  # AGG-107 知识条目
  - {object: AGG-107, command: 创建知识条目, raci: {A: {resolve: instance, field: 知识条目.归属组织单元.负责人}, R: [SH-E4, SH-E2], C: [], I: []}, boundary: {note: SH-E2 经 B-04 提炼入口调用}, sensitive: false}
  - {object: AGG-107, command: 起草知识条目, raci: {A: {resolve: instance, field: 知识条目.归属组织单元.负责人}, R: [SH-E4], C: [SH-E3], I: []}, boundary: {}, sensitive: false}
  - {object: AGG-107, command: 提交知识条目评审, raci: {A: {resolve: instance, field: 知识条目.归属组织单元.负责人}, R: [SH-E4], C: [], I: []}, boundary: {rule: 候选规则-必填校验}, sensitive: false}
  - object: AGG-107
    command: 评审知识条目
    approver: SH-E4
    raci:
      A: {resolve: type, role: SH-E4}
      R: [SH-E4]
      C: []
      I: [SH-M1]
    boundary:
      limit_rule: 无（非金额单据）
      segregation: [起草人 ≠ A]
      delegate: {when: AR-11, to: 汇报线上级（聚合内由系统改指审批人）}
      escalate: {when: AR-12, to: 上级组织负责人（聚合内由系统改指）}
    why_human: 知识内容的技术正确性、适用范围与有效期属专业判断
    sensitive: false
  - {object: AGG-107, command: 发布知识条目, raci: {A: {resolve: instance, field: 知识条目.归属组织单元.负责人}, R: [SH-E4], C: [], I: [SH-E3]}, boundary: {rule: INV-115, note: 案例类客户信息脱敏确认待用户定 6}, sensitive: false}
  - {object: AGG-107, command: 修订知识条目, raci: {A: {resolve: instance, field: 知识条目.归属组织单元.负责人}, R: [SH-E4], C: [], I: []}, boundary: {note: 修订须重新评审}, sensitive: false}
  - {object: AGG-107, command: 废止知识条目, raci: {A: {resolve: instance, field: 知识条目.归属组织单元.负责人}, R: [SH-E4], C: [], I: [SH-M1]}, boundary: {rule: INV-115}, sensitive: false}

roles:
  SH-M1: {positions: [待岗位体系定], org_needs: [能对所辖组织单元的经营目标负责并编制、审批计划（部门负责人；公司级为管理层负责人）, 能受理 AR-11 / AR-12 转来的上级代批]}
  SH-E6: {positions: [待岗位体系定], org_needs: [能开立与调剂预算账户、编制现金流预测的财务经办, 财务负责人岗位承担预算账户类命令的问责 A]}
  SH-E5: {positions: [待岗位体系定], org_needs: [能按人员口径填报每周销售预测承诺的市场与客户经理]}
  SH-E4: {positions: [待岗位体系定], org_needs: [能起草与修订知识条目的技术专家, 能评审专业内容的专业负责人（归属专业组织单元的责任人，技术委员会）]}
  SH-E2: {positions: [待岗位体系定], org_needs: [项目复盘编制人，能在复盘详情页提炼并调用创建知识条目]}
  SH-E3: {positions: [待岗位体系定], org_needs: [能参与起草知识条目的设计师与顾问]}
  SH-O1: {positions: [待岗位体系定], org_needs: [仅知会，不参与动作]}
  财务负责人: {positions: [待岗位体系定], org_needs: [对预算账户开立、调整、占用类命令问责的岗位（resolve: type）]}
