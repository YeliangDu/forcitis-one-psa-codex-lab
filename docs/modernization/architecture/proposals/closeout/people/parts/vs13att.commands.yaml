# VS-13 考勤类聚合命令目录（收敛产物，提议稿；规格见 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 B 节）
# 范围：B-27 的 AGG-69 考勤记录、AGG-70 请假、AGG-71 假期余额账户、AGG-72 加班、AGG-97 月度考勤确认、AGG-118 假期类型与额度规则；B-14 的 AGG-68 工作日历年度、AGG-108 标准工时版本。
# 依据：vs13.processes.yaml（PRC-115–119，质检修订版：请假条件触发人审、加班取消审批改自动批准、月度考勤期满默认确认并自动锁定、补卡规则守卫）、vs13.notes.md、vs07.processes.yaml（PRC-128 对 B-27 的事件）、
#   data-model.people.yaml、聚合稿 AGG 命令列。命令名沿用聚合稿与分片，不自造；
#   name_status 非空的是〔缺〕命令：沿用 vs13.notes.md「新用语」提议名 5 条（驳回请假、驳回加班、回冲已用额度、重新生成月度考勤、默认确认月度考勤），
#   收敛新增 1 条（开立年度额度账户：账户须先开账才能占用，聚合稿只写「年度开账按规则版本计算应享」而无命令，见 vs13att.notes.md 结构问题 1）。
#   已取消：代员工确认（分片提议名，被默认确认月度考勤取代）。
# 发令权 authority 指向 vs13att.raci.yaml 的条目。kind：human 人发起；callback 审批平台回调；automatic 系统规则（定时、事件反应、规则守卫）。
# 规则卡候选 R-a…R-e 沿用 vs13.notes.md 结构问题 14 的编号（交 one-rules 出卡）。
# 「孤儿」= 未被任一流程步骤、事件策略或维护用到。本稿 1 个孤儿命令（发布假期规则版本：无流程覆盖 AGG-118 的维护），交 one-architecture。

bc: [B-27, B-14]
aggregates: [AGG-69, AGG-70, AGG-71, AGG-72, AGG-97, AGG-118, AGG-68, AGG-108]
platform_steps:   # 非本组聚合命令，属平台任务，不入目录
- {name: 告警导入失败, service: platform.integration, used_by: PRC-115 第 2 步, note: 告警人力与信息，不静默；不改本组聚合状态}
- {name: 请假审批, service: platform.approval, used_by: PRC-116 第 3 步, note: 审批任务本身；结果由批准请假 / 驳回请假 / 撤销请假落到聚合}
commands:
# ───────── AGG-69 考勤记录 ─────────
- name: 导入考勤记录
  aggregate: AGG-69
  entity: attendance_records
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [导入批次号, 拉取日期, 记录条数, 校验和, 打卡记录（外部记录标识、来源对照标识、打卡时刻、记录类型）]
  preconditions:
  - {ref: INV-69, text: 只追加不可改；以外部记录标识幂等}
  - {ref: CLAUDE.md 第 6 条, text: 来源对照解析不到人员的记录整批失败并告警，不静默跳过}
  authority:
    ref: raci:AGG-69/导入考勤记录
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 外部记录标识 + 来源系统（重复拉取不重复写入）
  emits: （内部）
  used_by: [PRC-115 第 1 步]
  orphan: false
- name: 补卡
  aggregate: AGG-69
  entity: attendance_records
  kind: human
  source: 聚合稿 AGG 命令列
  params: [员工ID, 缺卡日期, 补卡时刻, 被补记录引用（可空）, 补卡事由]
  preconditions:
  - {ref: INV-69, text: 原记录不改，补卡另记一条}
  - {ref: R-b, text: 只能补该日缺失的打卡、每月补卡次数不超上限、不超补卡时限，违反即拒绝并停留补卡页（次数与时限待 U4）}
  - {ref: INV-105, text: 所属月月度考勤已锁定的，补卡照常记录，其对考勤的影响计入下月更正行并标原月份}
  authority:
    ref: raci:AGG-69/补卡
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
  idempotency_key: 补卡请求ID（客户端预生成 UUIDv7）
  emits: （内部）
  used_by: [PRC-115 第 3 步, PRC-118 第 5 步]
  orphan: false
# ───────── AGG-70 请假 ─────────
- name: 提交请假
  aggregate: AGG-70
  entity: leave_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [请假ID, 员工ID, 假期类型, 起止时刻, 事由, 余额占用ID, 证明材料引用（可空）]
  preconditions:
  - {ref: INV-68, text: 已占用余额（先调用占用余额，同一次操作）；额度不足且政策不允许透支则在占用处被拒}
  - {ref: INV-116, text: 按日拆分取当日生效的标准工时版本，取不到失败并告警，不回退默认值}
  - {ref: R-a, text: 分流：额度内、假期规则允许、单次天数不超免审批阈值且该假别无需证明材料 → 已提交（自动批准路径）；其余 → 审批中（阈值与假别清单待 U3）}
  - {ref: 状态, text: 请假为草稿}
  authority:
    ref: raci:AGG-70/提交请假
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
  idempotency_key: 请假ID（客户端预生成 UUIDv7；同一 ID 重复提交返回已有结果）
  emits: （内部）
  used_by: [PRC-116 第 2 步, PRC-117 第 5 步]
  orphan: false
- name: 批准请假
  aggregate: AGG-70
  entity: leave_requests
  kind: callback
  kind_note: 人审路径为审批平台回调；规则内自动批准路径由系统直接发令（automatic）。两条路径汇合在同一命令
  source: 聚合稿 AGG 命令列
  params: [请假ID, 审批实例ID（人审路径；自动批准路径为空）]
  preconditions:
  - {ref: 状态, text: 自动路径：请假为已提交；人审路径：请假为审批中且审批实例ID一致}
  - {ref: R-a, text: 自动路径复核同一规则，守卫不成立不得自动批准}
  - {ref: AR-11/AR-12, text: 人审路径：申请人本人是部门负责人时按 AR-11 由其上级审批；负责人缺位按 AR-12 上交（APPROVAL_RULES，已有）}
  authority:
    ref: raci:AGG-70/批准请假
    A: {resolve: instance, field: 申请人所在组织单元.负责人, alias: cost_object_owner}
    R: [SH-E1, system]
    approval: {approver: cost_object_owner, doc_type: 请假审批}
  idempotency_key: 请假ID + 审批实例ID（同一审批实例重复回调不重复生效）
  emits: 请假已批准
  used_by: [PRC-116 第 4 步]
  orphan: false
- name: 驳回请假
  aggregate: AGG-70
  entity: leave_requests
  kind: callback
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：驳回请假，reject_leave_request）
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-70 无驳回命令
  params: [审批实例ID, 驳回意见]
  preconditions:
  - {ref: 状态, text: 请假为审批中且审批实例ID一致}
  authority:
    ref: raci:AGG-70/驳回请假
    A: {resolve: instance, field: 申请人所在组织单元.负责人, alias: cost_object_owner}
    R: [platform.approval]
  idempotency_key: 审批实例ID
  emits: （内部）
  used_by: [PRC-116 第 6 步]
  orphan: false
- name: 撤销请假
  aggregate: AGG-70
  entity: leave_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [请假ID, 撤销原因]
  preconditions:
  - {ref: 状态, text: 请假为审批中，或已批准且尚未开始；已开始的只能销假}
  - {ref: 权限, text: 仅申请人本人}
  - {ref: 接缝, text: 审批中撤销须同时撤回审批实例（platform.approval 取消能力，vs13.notes.md 接缝问题 1）}
  authority:
    ref: raci:AGG-70/撤销请假
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
  idempotency_key: 请假ID（已撤销再撤销无操作）
  emits: 请假已撤销
  used_by: [PRC-116 第 7 步（由第 3 步 withdraw 边与第 5 步撤销出口进入）]
  orphan: false
- name: 销假
  aggregate: AGG-70
  entity: leave_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [请假ID, 实际结束时刻]
  preconditions:
  - {ref: 状态, text: 请假为已批准且已开始、尚未休完}
  - {ref: 权限, text: 仅申请人本人；销假是事实登记，不再审批}
  authority:
    ref: raci:AGG-70/销假
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
  idempotency_key: 请假ID（已销假再销假无操作）
  emits: 请假已销假
  used_by: [PRC-116 第 8 步]
  orphan: false
# ───────── AGG-71 假期余额账户 ─────────
- name: 占用余额
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: human
  source: 聚合稿 AGG 命令列
  params: [员工ID, 假期类型, 年度（补休类无，改记所冲抵的补休额度行）, 占用时长（分钟）, 请假ID]
  preconditions:
  - {ref: INV-68, text: 占用后不得超过可用额度；政策允许透支的假期类型例外，例外进入人审（R-a）}
  - {ref: 账户存在, text: 该人员 × 假期类型 × 年度账户已开账，否则失败并告警，不隐式开账；假期类型为补休的不看年度账户，改按到期日先后冲抵该员工的补休额度行（有效且请假日不晚于到期日），无可冲抵的额度行即额度不足}
  - {ref: 读取, text: 按日拆分读工作日历（AGG-68）与标准工时版本（AGG-108），取不到当日生效版本失败（INV-116）}
  authority:
    ref: raci:AGG-71/占用余额
    A: {resolve: instance, field: 员工}
    R: [SH-E3]
  idempotency_key: 请假ID（同一请假重复占用返回已有占用行）
  emits: （内部）
  used_by: [PRC-116 第 1 步]
  orphan: false
- name: 批准转已用
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [占用ID]
  preconditions:
  - {ref: 状态, text: 占用行为占用}
  authority:
    ref: raci:AGG-71/批准转已用
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 占用ID（已转用无操作）
  emits: （内部）
  used_by: [PRC-116 第 5 步]
  orphan: false
- name: 释放余额占用
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [占用ID, 释放原因（驳回 / 审批中撤销 / 孤儿占用）]
  preconditions:
  - {ref: 状态, text: 占用行为占用}
  authority:
    ref: raci:AGG-71/释放余额占用
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 占用ID（已释放无操作）
  emits: （内部）
  used_by: [PRC-116 第 6 步 inner, PRC-116 第 7 步 inner, 事件策略「孤儿占用定时释放」]
  orphan: false
- name: 回冲已用额度
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: automatic
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：回冲已用额度，refund_used_leave_balance）
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-71 无此命令
  params: [占用ID, 回冲时长（分钟）, 回冲原因（已批准后撤销 / 销假）]
  preconditions:
  - {ref: 状态, text: 占用行为已转用}
  - {ref: 回冲上限, text: 回冲时长不超过该行已用时长；销假为未休完部分，撤销为全部；补休类回冲回原补休额度行}
  authority:
    ref: raci:AGG-71/回冲已用额度
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 占用ID + 回冲来源（请假ID + 撤销 / 销假）
  emits: （内部）
  used_by: [PRC-116 第 7 步 inner, PRC-116 第 8 步 inner]
  orphan: false
- name: 开立年度额度账户
  aggregate: AGG-71
  entity: leave_balance_accounts
  kind: automatic
  name_status: 〔缺〕收敛新增，待 one-glossary 登记（open_leave_balance_account）
  source: 收敛新增（聚合稿 AGG-71 写「年度开账按规则版本计算应享」而无命令）
  params: [员工ID, 假期类型, 年度]
  preconditions:
  - {ref: INV-123, text: 按该假期类型当日生效的假期规则版本计算应享（含上年结转）；取不到生效版本失败并告警，不回退默认值}
  - {ref: 唯一, text: 人员 × 假期类型 × 年度至多一个账户；假期类型补休不开年度账户（补休额度行独立于年度，按有效期到期，见计入补休额度）}
  authority:
    ref: raci:AGG-71/开立年度额度账户
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 员工ID + 假期类型 + 年度（已开账无操作）
  emits: （内部）
  used_by: [PRC-160 第 2 步（事件策略「年度开账」）]
  orphan: false
- name: 年度结转并关闭额度账户
  aggregate: AGG-71
  entity: leave_balance_accounts
  kind: automatic
  name_status: 〔缺〕收敛新增，待 one-glossary 登记（carry_over_and_close_leave_balance_account）
  source: 收敛新增（AGG-118 已有结转规则，AGG-71 缺年度届满的终结命令）
  params: [员工ID, 假期类型, 年度]
  preconditions:
  - {ref: 结转规则, text: 按 AGG-118 当日生效规则版本的结转与清零规则计算结转额度，记在本账户并关闭；下一年度账户开立时读取该结转额度计入应享；取不到规则版本失败并告警}
  - {ref: 状态, text: 账户为已开账，年度已届满，无占用中的占用行（占用中的跨年请假先处理）}
  authority:
    ref: raci:AGG-71/年度结转并关闭额度账户
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 员工ID + 假期类型 + 年度（已结转无操作）
  state_change: 已开账 → 已结转
  emits: （内部）
  used_by: []
  orphan: false
- name: 计入补休额度
  aggregate: AGG-71
  entity: leave_comp_grants
  kind: automatic
  name_status: 〔缺〕收敛新增，待 one-glossary 登记（credit_comp_leave_grant）
  source: 用户页 P13-05（2026-10-16 审题）：休息日加班计补休，按加班时长给员工计补休额度；依据劳动法第四十四条
  params: [加班ID, 员工ID, 额度时长（分钟，= 批准加班时长）, 到期日（= 加班日 + 补休有效期，U15）]
  preconditions:
  - {ref: 来源, text: 加班为已批准，补偿方式为补休，加班类型为休息日（法定节假日只能付薪）；工作日延时按现有补偿政策}
  - {ref: 补休有效期, text: 取当日生效的假期规则版本（AGG-118）中假期类型补休的有效期长度（U15 待用户定）；取不到失败并告警，不回退默认值}
  - {ref: 唯一, text: 一笔加班至多一条额度行，以加班 ID 幂等}
  authority:
    ref: raci:AGG-71/计入补休额度
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 加班ID（已计入无操作）
  state_change: 创建 → 有效
  emits: （内部）
  used_by: [PRC-117 第 4 步]
  orphan: false
- name: 补休到期转计薪
  aggregate: AGG-71
  entity: leave_comp_grants
  kind: automatic
  name_status: 〔缺〕收敛新增，待 one-glossary 登记（convert_expired_comp_leave_to_pay）
  source: 用户页 P13-05；劳动法第四十四条（不能安排补休的支付不低于 200% 工资报酬）、工资支付暂行规定第十三条（以加班工资基数折算）
  params: [补休额度行ID]
  preconditions:
  - {ref: 到期, text: 到期日届满；未休余额不作废，转为计薪时长并关闭额度行（余额为零时只关闭）}
  - {ref: 占用, text: 额度行无占用中的补休请假，否则结局为转计薪待处理，告警人力，不改状态}
  - {ref: 计发, text: 本命令不算钱；金额由 B-15 在 PRC-124 读取转计薪时长，按加班工资基数折算 200% 计发}
  authority:
    ref: raci:AGG-71/补休到期转计薪
    A: {resolve: type, role: SH-E6, function: 人力（考勤）}
    R: [system]
  idempotency_key: 补休额度行ID（已转计薪或已休完无操作）
  state_change: 有效 → 已转计薪（余额大于零）；有效 → 已休完（余额为零）
  emits: （内部）
  used_by: [PRC-117 第 6 步, 事件策略「补休额度到期转计薪」]
  orphan: false
- name: 离职结算补休余额
  aggregate: AGG-71
  entity: leave_comp_grants
  kind: automatic
  name_status: 〔缺〕收敛新增，待 one-glossary 登记（settle_comp_leave_on_separation）
  source: 用户页 P13-05；离职时未休余额一并结算进最后一次薪酬
  params: [员工ID, 离职日期]
  preconditions:
  - {ref: 触发, text: 离职生效后（Separated）；该员工全部有效额度行的未休余额转为计薪时长并关闭（余额为零的只关闭）}
  - {ref: 占用, text: 额度行仍有无法释放的占用中请假的，该行结局为结算待处理，告警人力，其余额度行照常结算}
