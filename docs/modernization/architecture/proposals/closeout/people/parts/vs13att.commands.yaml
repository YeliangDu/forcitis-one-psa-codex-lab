event_policies:
- name: 每日拉取打卡
  trigger_event: 定时：每日（platform.scheduling）；人力修复对照后人工触发重新拉取
  effect: 经 platform.integration 拉取前一日打卡，调用导入考勤记录
  uses_command: 导入考勤记录
  used_by: [PRC-115 触发器]
  rules: [INV-69]
  note: 定时边 B-27 → platform.scheduling 待统一约定（vs13.notes.md 接缝问题 2）
- name: 审批通过回调
  trigger_event: 审批已通过（platform.approval）
  effect: 调用批准请假（人审路径）
  uses_command: 批准请假
  used_by: [PRC-116 第 3 步 → 第 4 步]
  rules: []
  note: 回调走事件或注册处理器，platform 不依赖 B-27（vs13.notes.md 接缝问题 1）
- name: 审批驳回回调
  trigger_event: 审批已驳回（platform.approval）
  effect: 调用驳回请假，随后释放余额占用
  uses_command: 驳回请假
  used_by: [PRC-116 第 6 步]
  rules: []
  note: ''
- name: 审批撤回回调
  trigger_event: 审批已撤回（platform.approval 通用撤回，事件名由 platform 定）
  effect: 调用撤销请假
  uses_command: 撤销请假
  used_by: [PRC-116 第 3 步 withdraw 边]
  rules: []
  note: 事件名以 platform.approval 事件目录为准，本稿不自造；员工在「我的请假页」直接撤销走人发起路径
- name: 请假批准后转已用
  trigger_event: 请假已批准（本聚合发布，同 BC）
  effect: 把该请假的占用转为已用
  uses_command: 批准转已用
  used_by: [PRC-116 第 5 步]
  rules: []
  note: 聚合稿 §2.2 写请假已批准「仅分析」，本流程在同 BC 内订阅；订阅方列须改
- name: 孤儿占用定时释放
  trigger_event: 定时：占用后超时仍无对应请假单
  effect: 释放该占用（占用成功而提交请假失败留下的孤儿占用）
  uses_command: 释放余额占用
  used_by: [PRC-116 第 1 步（聚合稿 §7 第 6 条）]
  rules: []
  note: 超时时长待 one-rules 定
- name: 加班日考勤导入后核实
  trigger_event: 加班日考勤已导入（导入考勤记录写入该日记录，本 BC 内）
  effect: 以打卡核实登记的加班时长；支持则批准加班，不支持则驳回加班
  uses_command: 批准加班 / 驳回加班
  used_by: [PRC-117 第 2 步、第 3 步]
  rules: [R-d]
  note: 加班日考勤迟迟未导入时保持已申请，导入失败的告警走 PRC-115
- name: 月度考勤确认后标记加班补偿
  trigger_event: 月度考勤已确认（本 BC 内）
  effect: 把该员工该月汇入的、补偿方式为付薪的已批准加班标记为已补偿
  uses_command: 标记加班已补偿
  used_by: [PRC-118 第 3 步]
  rules: []
  note: 补偿方式为补休的加班不走本策略，计入补休额度时已标已计入补休额度（vs13att.notes.md 结构问题 5 已解）
- name: 月末生成月度考勤
  trigger_event: 定时：月末（platform.scheduling）；人力在导入修复后重新发起
  effect: 对当月在职与当月离职人员逐人生成月度考勤
  uses_command: 生成月度考勤
  used_by: [PRC-118 触发器]
  rules: [INV-105]
  note: ''
- name: 确认期限届满默认确认
  trigger_event: 定时：员工确认期限届满（platform.scheduling，期限待 U6）
  effect: 对仍为已生成的月度考勤发默认确认月度考勤（标记逾期未确认）
  uses_command: 默认确认月度考勤
  used_by: [PRC-118 第 2 步 timeout → 第 7 步]
  rules: [R-e]
  note: ''
- name: 确认期限届满自动锁定
  trigger_event: 定时：员工确认期限届满（同上）
  effect: 对已确认的月度考勤发锁定；未确认者先默认确认再锁定
  uses_command: 锁定
  used_by: [PRC-118 第 4 步]
  rules: [R-e]
  note: ''
- name: 离职当月考勤默认确认
  trigger_event: Separated（B-13 发布，vs07 PRC-128 第 7 步）
  effect: 该人员当月（及仍未确认的以往月份）已生成而未确认的月度考勤，立即发默认确认月度考勤（标记已离职）；尚未生成的由 PRC-118 第 1 步在月末处理
  uses_command: 默认确认月度考勤
  used_by: [PRC-128 第 7 步（B-27 订阅）]
  rules: [R-e]
  note: 取代 vs07 原「考勤待代确认」待办；B-27 → B-13 现只有 api 边，事件边需补登（vs07 接缝问题 1）；若用户改回人力代确认（U6′），此策略取消
- name: 年度开账
  trigger_event: 定时：每年年初；Employed（B-13 发布）覆盖年中入职
  effect: 对每名在职人员 × 占额度的假期类型开立该年度账户
  uses_command: 开立年度额度账户
  used_by: [PRC-160（定时与入职生效触发）；PRC-116 第 1 步前提（账户须存在）]
  rules: [INV-123]
  note: 订阅 Employed 的边 B-27 → B-13 需补登；年中入职的应享折算归 AGG-118 规则；不含补休（补休额度行独立于年度）
- name: 补休额度到期转计薪
  trigger_event: 定时：补休额度行到期日（platform.scheduling；幂等键 = 额度行 ID + 到期日）
  effect: 额度行有未休余额则转为计薪时长并关闭，余额为零则只关闭；占用中的补休请假未处理时转计薪待处理，下次定时再转
  uses_command: 补休到期转计薪
