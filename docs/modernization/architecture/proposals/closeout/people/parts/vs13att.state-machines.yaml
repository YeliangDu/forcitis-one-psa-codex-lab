# VS-13 考勤类聚合状态机（收敛产物，提议稿）。范围同 vs13att.commands.yaml。
# kind：forward 正向；reverse 逆向（驳回、撤销、销假、回冲）。from 为 null = 创建。守卫引用 INV（聚合稿）、R-a…R-e（vs13.notes.md 结构问题 14，交 one-rules）、AR（APPROVAL_RULES）。
# perpetual: true = 配置型长期存续的根，无终态（反复维护），不适用「非终态能到终态」检查。
# AGG-71 分两台机器：根（人员 × 假期类型 × 年度账户，额度计数器）与次级实体占用行（占用 → 已转用 → 已释放）。
# 终态/稳态说明：已批准的请假休完后仍停在「已批准」（无「已完成」状态），该状态有出边（撤销、销假），因此不列终态，由「非终态能到终态」覆盖；已转用占用行同理。
# process_steps：PRC-115–119 每个改聚合状态的步骤对应的转换，由 vs13att 检查脚本逐项核对（见 vs13att.notes.md「收敛自检」）。

bc: [B-27, B-14]
machines:
- aggregate: AGG-69
  machine: attendance_record
  entity: attendance_records
  states: [已记录]
  initial: []
  terminal: [已记录]
  note: 只追加不可改（INV-69），记录类型（打卡 / 外勤 / 补卡）是属性不分状态；导入与补卡都是创建，创建即终态
  transitions:
  - {from: null, to: 已记录, command: 导入考勤记录, guard: [INV-69], kind: forward}
  - {from: null, to: 已记录, command: 补卡, guard: [INV-69, R-b, INV-105：所属月已锁定则计入下月更正行], kind: forward}
- aggregate: AGG-70
  machine: leave_request
  entity: leave_requests
  states: [草稿, 已提交, 审批中, 已批准, 已驳回, 已撤销, 已销假]
  initial: [草稿]
  terminal: [已驳回, 已撤销, 已销假]
  note: 草稿来自编辑页保存或迁入；已提交 = 规则内自动批准路径的瞬时待批状态（聚合稿与数据模型状态列无此状态，见 vs13att.notes.md 结构问题 2）；已批准休完后仍停在已批准
  transitions:
  - {from: 草稿, to: 已提交, command: 提交请假, guard: [INV-68, INV-116, R-a：规则内自动批准路径], kind: forward}
  - {from: 草稿, to: 审批中, command: 提交请假, guard: [INV-68, INV-116, R-a：超阈值 / 需证明材料 / 透支转人审], kind: forward}
  - {from: 已提交, to: 已批准, command: 批准请假, guard: [R-a], kind: forward}
  - {from: 审批中, to: 已批准, command: 批准请假, guard: [AR-11, AR-12], kind: forward}
  - {from: 审批中, to: 已驳回, command: 驳回请假, guard: [], kind: reverse}
  - {from: 审批中, to: 已撤销, command: 撤销请假, guard: [仅申请人，同时撤回审批实例], kind: reverse}
  - {from: 已批准, to: 已撤销, command: 撤销请假, guard: [仅申请人，请假未开始], kind: reverse}
  - {from: 已批准, to: 已销假, command: 销假, guard: [仅申请人，请假已开始且未休完], kind: reverse}
- aggregate: AGG-71
  machine: leave_balance_account
  entity: leave_balance_accounts
  states: [已开账, 已结转]
  initial: []
  terminal: [已结转]
  note: 根只存应享 / 已用 / 占用计数器（投影，可由请假与规则重算对账）；占用 / 转用 / 释放 / 回冲同时改计数器，对应占用行机器的转换；年度届满按 AGG-118 结转规则结转并关闭，下一年度另开新账户（收敛新增终态）
  transitions:
  - {from: null, to: 已开账, command: 开立年度额度账户, guard: [INV-123], kind: forward}
  - {from: 已开账, to: 已开账, command: 占用余额, guard: [INV-68], kind: forward, effect: 占用 +}
  - {from: 已开账, to: 已开账, command: 批准转已用, guard: [], kind: forward, effect: 占用 −，已用 +}
  - {from: 已开账, to: 已开账, command: 释放余额占用, guard: [], kind: reverse, effect: 占用 −}
  - {from: 已开账, to: 已开账, command: 回冲已用额度, guard: [回冲不超已用], kind: reverse, effect: 已用 −}
  - {from: 已开账, to: 已结转, command: 年度结转并关闭额度账户, guard: [年度届满, AGG-118 结转规则版本取得到（取不到失败并告警）, 无占用中的占用行], kind: forward}
- aggregate: AGG-71
  machine: leave_balance_hold
  entity: leave_balance_holds
  states: [占用, 已转用, 已释放]
  initial: []
  terminal: [已释放]
  note: 一张请假一条占用行；销假部分回冲时行仍为已转用（时长减少）
  transitions:
  - {from: null, to: 占用, command: 占用余额, guard: [INV-68, 账户已开账], kind: forward}
  - {from: 占用, to: 已转用, command: 批准转已用, guard: [], kind: forward}
  - {from: 占用, to: 已释放, command: 释放余额占用, guard: [驳回 / 审批中撤销 / 孤儿占用], kind: reverse}
  - {from: 已转用, to: 已释放, command: 回冲已用额度, guard: [已批准后撤销：全部回冲], kind: reverse}
  - {from: 已转用, to: 已转用, command: 回冲已用额度, guard: [销假：未休完部分回冲], kind: reverse}
- aggregate: AGG-71
  machine: leave_comp_grant
  entity: leave_comp_grants
  states: [有效, 已转计薪, 已休完]
  initial: []
  terminal: [已转计薪, 已休完]
  note: 补休额度行：一笔休息日加班选补休产生一行，带到期日（加班日 + 补休有效期，U15），独立于年度账户；占用 / 转用 / 释放 / 回冲只改行内计数器，行仍为有效；到期或离职时未休余额转为计薪时长（已转计薪），余额为零只关闭（已休完）；不作废。占用中的补休请假未处理时不转，保持有效并告警（转计薪待处理，是前置条件失败，不产生转换）
  transitions:
  - {from: null, to: 有效, command: 计入补休额度, guard: [加班已批准且补偿方式为补休, 休息日加班, 补休有效期取得到], kind: forward}
  - {from: 有效, to: 有效, command: 占用余额, guard: [INV-68：补休类按到期日先后冲抵, 请假日不晚于到期日], kind: forward, effect: 占用 +}
  - {from: 有效, to: 有效, command: 批准转已用, guard: [], kind: forward, effect: 占用 −，已用 +}
  - {from: 有效, to: 有效, command: 释放余额占用, guard: [], kind: reverse, effect: 占用 −}
  - {from: 有效, to: 有效, command: 回冲已用额度, guard: [回冲不超已用, 回冲回原额度行], kind: reverse, effect: 已用 −}
  - {from: 有效, to: 已转计薪, command: 补休到期转计薪, guard: [到期日届满, 未休余额大于零, 无占用中的补休请假], kind: forward}
  - {from: 有效, to: 已休完, command: 补休到期转计薪, guard: [到期日届满, 未休余额为零], kind: forward}
  - {from: 有效, to: 已转计薪, command: 离职结算补休余额, guard: [离职生效后, 未休余额大于零, 无法释放的占用中请假已处理], kind: forward}
  - {from: 有效, to: 已休完, command: 离职结算补休余额, guard: [离职生效后, 未休余额为零], kind: forward}
- aggregate: AGG-72
  machine: overtime_request
  entity: overtime_requests
  states: [已申请, 已批准, 已补偿, 已计入补休额度, 已驳回]
  initial: []
  terminal: [已补偿, 已计入补休额度, 已驳回]
  note: 登记即创建（无草稿）；批准由系统以打卡核实代替人工；登记后无撤销命令（见 vs13att.notes.md 结构问题 4）；付薪的随月度考勤确认标已补偿，补休的在计入补休额度时标已计入补休额度，之后补偿追踪转到 AGG-71 额度行（补休到期转计薪、休完）
  transitions:
  - {from: null, to: 已申请, command: 加班申请, guard: [R-c], kind: forward}
  - {from: 已申请, to: 已批准, command: 批准加班, guard: [R-d], kind: forward}
  - {from: 已申请, to: 已驳回, command: 驳回加班, guard: [R-d：打卡不支持登记时长], kind: reverse}
  - {from: 已批准, to: 已补偿, command: 标记加班已补偿, guard: [月度考勤已确认, 补偿方式为付薪], kind: forward}
  - {from: 已批准, to: 已计入补休额度, command: 标记加班已计补休, guard: [补偿方式为补休, 已计入补休额度], kind: forward}
- aggregate: AGG-97
  machine: monthly_attendance_confirmation
  entity: monthly_attendance_confirmations
  states: [已生成, 已确认, 已锁定]
  initial: []
  terminal: [已锁定]
  note: 暂缓（月内有日期导入失败）不创建聚合，是生成命令的前置条件失败；确认方式（员工 / 默认）与默认确认原因（逾期未确认 / 已离职）是属性不分状态；已确认后到确认期限届满前不可重新生成，更正走下月更正行
  transitions:
  - {from: null, to: 已生成, command: 生成月度考勤, guard: [导入无缺失（CLAUDE.md 第 6 条）, INV-116, INV-105], kind: forward}
  - {from: 已生成, to: 已生成, command: 重新生成月度考勤, guard: [INV-105：未确认未锁定], kind: forward}
  - {from: 已生成, to: 已确认, command: 员工确认, guard: [INV-105, 确认期限内], kind: forward}
  - {from: 已生成, to: 已确认, command: 默认确认月度考勤, guard: [R-e：期限届满或人员已离职], kind: forward}
  - {from: 已确认, to: 已锁定, command: 锁定, guard: [R-e：确认期限届满, INV-105], kind: forward}
- aggregate: AGG-118
  machine: leave_entitlement_rule_version
  entity: leave_entitlement_rule_versions
  states: [已生效]
  initial: []
  terminal: [已生效]
  perpetual: true
  reason: "配置型版本聚合：发布即生效，被新版本取代不改旧版本状态，无业务终结"
  note: 每版本一个聚合，发布即生效，生效后不可改（D15），更正另发布新版本；假期类型（leave_types）为受控代码表，只由迁移维护，无命令（见 vs13att.notes.md 结构问题 6）
  transitions:
  - {from: null, to: 已生效, command: 发布假期规则版本, guard: [INV-123], kind: forward}
- aggregate: AGG-68
  machine: work_calendar_year
  entity: work_calendar_years
  states: [已建]
  initial: []
  terminal: []
  perpetual: true
  reason: 长期存续配置（按日历年度反复维护的可变根，无业务终结；年度过去后只读，不是状态）
  note: 可变根 + 审计，过去日期锁定；首次维护创建，之后每年反复维护（现状为整集替换，是否改按配置型版本化待 one-data）
  transitions:
  - {from: null, to: 已建, command: 维护工作日历年度, guard: [], kind: forward}
  - {from: 已建, to: 已建, command: 维护工作日历年度, guard: [过去日期锁定], kind: forward}
- aggregate: AGG-108
  machine: standard_work_hour_version
  entity: standard_work_hour_versions
  states: [已生效]
  initial: []
  terminal: [已生效]
  note: 每版本一个聚合，发布即生效，生效后不可改（INV-116）；被新版本取代不改旧版本状态，按日期区间取当日生效版本
  transitions:
  - {from: null, to: 已生效, command: 发布标准工时版本, guard: [INV-116：区间不重叠], kind: forward}
process_steps:
# PRC-115
- {process: PRC-115, step: 1, command: 导入考勤记录, machine: attendance_record, transition: [null, 已记录]}
- {process: PRC-115, step: 3, command: 补卡, machine: attendance_record, transition: [null, 已记录]}
# PRC-116
- {process: PRC-116, step: 1, command: 占用余额, machine: leave_balance_hold, transition: [null, 占用], outcome_on_reject: 额度不足被拒（前置条件 INV-68 失败，不产生转换）}
- {process: PRC-116, step: 2, command: 提交请假, machine: leave_request, transition: [草稿, 已提交], also: [草稿, 审批中]}
- {process: PRC-116, step: 4, command: 批准请假, machine: leave_request, transition: [已提交, 已批准], also: [审批中, 已批准], outcome: 已批准}
- {process: PRC-116, step: 5, command: 批准转已用, machine: leave_balance_hold, transition: [占用, 已转用]}
- {process: PRC-116, step: 6, command: 驳回请假, machine: leave_request, transition: [审批中, 已驳回], outcome: 已驳回}
- {process: PRC-116, step: 6, command: 释放余额占用, machine: leave_balance_hold, transition: [占用, 已释放], inner: true}
- {process: PRC-116, step: 7, command: 撤销请假, machine: leave_request, transition: [审批中, 已撤销], also: [已批准, 已撤销], outcome: 已撤销}
- {process: PRC-116, step: 7, command: 释放余额占用, machine: leave_balance_hold, transition: [占用, 已释放], inner: true}
- {process: PRC-116, step: 7, command: 回冲已用额度, machine: leave_balance_hold, transition: [已转用, 已释放], inner: true}
- {process: PRC-116, step: 8, command: 销假, machine: leave_request, transition: [已批准, 已销假], outcome: 已销假}
- {process: PRC-116, step: 8, command: 回冲已用额度, machine: leave_balance_hold, transition: [已转用, 已转用], inner: true}
# PRC-117
- {process: PRC-117, step: 1, command: 加班申请, machine: overtime_request, transition: [null, 已申请]}
- {process: PRC-117, step: 2, command: 批准加班, machine: overtime_request, transition: [已申请, 已批准], outcome: 已批准}
- {process: PRC-117, step: 3, command: 驳回加班, machine: overtime_request, transition: [已申请, 已驳回], outcome: 已驳回}
- {process: PRC-117, step: 4, command: 计入补休额度, machine: leave_comp_grant, transition: [null, 有效]}
- {process: PRC-117, step: 4, command: 标记加班已计补休, machine: overtime_request, transition: [已批准, 已计入补休额度], inner: true}
- {process: PRC-117, step: 5, command: 提交请假, machine: leave_request, transition: [草稿, 已提交], also: [草稿, 审批中], outcome: 补休已休完}
- {process: PRC-117, step: 6, command: 补休到期转计薪, machine: leave_comp_grant, transition: [有效, 已转计薪], also: [有效, 已休完], outcome: 已转计薪, outcome_on_reject: 转计薪待处理（占用中的补休请假未处理，前置条件失败，不产生转换）}
- {process: PRC-117, step: 7, command: 离职结算补休余额, machine: leave_comp_grant, transition: [有效, 已转计薪], also: [有效, 已休完], outcome: 离职余额已结算, outcome_on_reject: 结算待处理（无法释放的占用中请假，前置条件失败，不产生转换）}
# PRC-118
- {process: PRC-118, step: 1, command: 生成月度考勤, machine: monthly_attendance_confirmation, transition: [null, 已生成], outcome_on_reject: 已暂缓（前置条件失败，不产生转换）}
- {process: PRC-118, step: 2, command: 员工确认, machine: monthly_attendance_confirmation, transition: [已生成, 已确认]}
- {process: PRC-118, step: 3, command: 标记加班已补偿, machine: overtime_request, transition: [已批准, 已补偿]}
- {process: PRC-118, step: 4, command: 锁定, machine: monthly_attendance_confirmation, transition: [已确认, 已锁定], outcome: 已锁定}
- {process: PRC-118, step: 5, command: 补卡, machine: attendance_record, transition: [null, 已记录]}
- {process: PRC-118, step: 6, command: 重新生成月度考勤, machine: monthly_attendance_confirmation, transition: [已生成, 已生成]}
- {process: PRC-118, step: 7, command: 默认确认月度考勤, machine: monthly_attendance_confirmation, transition: [已生成, 已确认]}
# PRC-119
- {process: PRC-119, step: 1, command: 维护工作日历年度, machine: work_calendar_year, transition: [已建, 已建], also: [null, 已建], outcome: 工作日历已维护}
- {process: PRC-119, step: 2, command: 发布标准工时版本, machine: standard_work_hour_version, transition: [null, 已生效], outcome: 标准工时版本已发布, outcome_on_reject: 版本被拒（前置条件 INV-116 失败）}
# 事件策略（非 PRC 步骤）
- {process: 事件策略, step: 孤儿占用定时释放, command: 释放余额占用, machine: leave_balance_hold, transition: [占用, 已释放]}
- {process: PRC-160, step: 1, command: 年度结转并关闭额度账户, machine: leave_balance_account, transition: [已开账, 已结转]}
- {process: PRC-160, step: 2, command: 开立年度额度账户, machine: leave_balance_account, transition: [null, 已开账], outcome: 年度账户已开立}
- {process: 事件策略, step: 确认期限届满默认确认, command: 默认确认月度考勤, machine: monthly_attendance_confirmation, transition: [已生成, 已确认]}
- {process: 事件策略, step: 离职当月考勤默认确认, command: 默认确认月度考勤, machine: monthly_attendance_confirmation, transition: [已生成, 已确认]}
- {process: PRC-162, step: 1, command: 发布假期规则版本, machine: leave_entitlement_rule_version, transition: [null, 已生效], outcome: 假期规则版本已发布, outcome_on_reject: 版本被拒（前置条件 INV-123 失败）}
