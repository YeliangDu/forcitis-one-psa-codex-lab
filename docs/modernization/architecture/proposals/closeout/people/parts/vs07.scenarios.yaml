# vs07 验收场景：path 写「第 n 步 任务名」；covers 与骨架里 decision.when、timeout 对应命令名、on_time、outcomes 的文字逐字相同。
# 超时场景的 covers 以「超时：」开头，后接命令名。
PRC-80:
  - id: PRC-80-S01
    path: [第 1 步 查看法人、组织与职位现状, 第 3 步 调整组织单元]
    covers: [调整组织单元, 撤销的组织单元下仍有在职任职]
    expect: 撤销的组织单元下仍有在职任职被 INV-60 拒绝，退回第 3 步改正，提示先调岗（PRC-136）
    outcome: 已维护
  - id: PRC-80-S02
    path: [第 1 步 查看法人、组织与职位现状, 第 3 步 调整组织单元, 第 6 步 标记数据范围待复核并通知区域负责人]
    covers: [调整组织单元, 已维护]
    expect: 组织单元调整成功，区域负责人收到数据范围待复核提醒，已有授予不被收回（P-31），流程结束
    outcome: 已维护
  - id: PRC-80-S03
    path: [第 1 步 查看法人、组织与职位现状, 第 4 步 指定法人归属]
    covers: [指定法人归属, 法人归属期间与同一对象已有期间重叠]
    expect: 同一对象法人归属期间重叠被 INV-新-P5 拒绝，退回第 4 步改正
    outcome: 已维护
  - id: PRC-80-S04
    path: [第 1 步 查看法人、组织与职位现状, 第 2 步 登记法人主体]
    covers: [登记法人主体, 已维护]
    expect: 新法人主体登记成功，法人代码发号后不可改
    outcome: 已维护
  - id: PRC-80-S05
    path: [第 1 步 查看法人、组织与职位现状, 第 4 步 指定法人归属]
    covers: [指定法人归属, 已维护]
    expect: 法人归属指定成功，platform.identity 与 B-15 收到法人归属已变更
    outcome: 已维护
  - id: PRC-80-S06
    path: [第 1 步 查看法人、组织与职位现状, 第 5 步 停用岗位]
    covers: [职位仍被在职任职引用]
    expect: 职位仍被在职任职引用，停用被 INV-63 拒绝，退回第 5 步
    outcome: 已维护
  - id: PRC-80-S07
    path: [第 1 步 查看法人、组织与职位现状, 第 5 步 停用岗位]
    covers: [停用岗位, 已维护]
    expect: 无引用的职位停用成功
    outcome: 已维护
  - id: PRC-80-S08
    path: [第 1 步 查看法人、组织与职位现状, 第 7 步 更名法人主体]
    covers: [更名法人主体, 已维护]
    expect: 法人主体更名成功，追加名称版本，法人代码不变
    outcome: 已维护
  - id: PRC-80-S09
    path: [第 1 步 查看法人、组织与职位现状, 第 8 步 停用法人主体]
    covers: [停用法人主体, 已维护]
    expect: 法人主体停用成功，不再作为法人使用
    outcome: 已维护
  - id: PRC-80-S10
    path: [第 1 步 查看法人、组织与职位现状, 第 9 步 启用法人主体]
    covers: [启用法人主体, 已维护]
    expect: 已停用的法人主体恢复为有效
    outcome: 已维护
  - id: PRC-80-S11
    path: [第 1 步 查看法人、组织与职位现状, 第 10 步 新建岗位]
    covers: [新建岗位, 已维护]
    expect: 新增职位目录条目成功，同职位编码重复新建返回已有结果
    outcome: 已维护
  - id: PRC-80-S12
    path: [第 1 步 查看法人、组织与职位现状, 第 11 步 修改岗位]
    covers: [修改岗位, 已维护]
    expect: 追加职位目录条目的新版本，已停用的职位不可修改
    outcome: 已维护
  - id: PRC-80-S13
    path: [第 1 步 查看法人、组织与职位现状, 第 12 步 更正法人归属]
    covers: [更正法人归属, 更正后期间与同一对象其他期间重叠, 已维护]
    expect: 更正后期间与同一对象其他期间重叠被 INV-122 拒绝，退回第 12 步；不重叠的更正只追加更正行，成功
    outcome: 已维护
  - id: PRC-80-S14
    path: [第 1 步 查看法人、组织与职位现状, 第 13 步 结束法人归属]
    covers: [结束法人归属, 该对象没有当前法人归属, 已维护]
    expect: 有当前归属时写入结束日关闭期间并发法人归属已结束；没有当前归属被拒绝退回第 13 步；操作人终止本人归属被拒绝
    outcome: 已维护
  - id: PRC-80-S15
    path: [第 1 步 查看法人、组织与职位现状, 第 14 步 更正法人主体代码]
    covers: [更正法人主体代码, 法人代码已用于发号, 已维护]
    expect: 代码未发号时更正成功、状态仍有效；已发号被 INV-59 拒绝退回第 14 步
    outcome: 已维护

PRC-81:
  - id: PRC-81-S01
    path: [第 1 步 查看职位目录与组织单元, 第 2 步 提交招聘需求, 第 3 步 批准招聘需求]
    covers: [批准, 已批准]
    expect: 用人经理提交，部门负责人（类型级 SH-M1）批准，人力收到待办；提出人与批准人为同一人时 segregation 拒绝
    outcome: 已批准
  - id: PRC-81-S02
    path: [第 1 步 查看职位目录与组织单元, 第 2 步 提交招聘需求, 第 3 步 批准招聘需求, 第 4 步 关闭招聘需求]
    covers: [批准招聘需求被驳回, 已关闭]
    expect: 部门负责人驳回，以关闭招聘需求代驳回
    outcome: 已关闭
  - id: PRC-81-S03
    path: [第 1 步 查看职位目录与组织单元, 第 2 步 提交招聘需求, 第 4 步 关闭招聘需求]
    covers: [提出人在批准前撤回, 已关闭]
    expect: 提出人在批准前撤回，直接关闭
    outcome: 已关闭
  - id: PRC-81-S04
    path: [第 1 步 查看职位目录与组织单元, 第 2 步 提交招聘需求, 第 3 步 批准招聘需求]
    covers: [批准, 已批准]
    expect: 提出人本人就是组织单元责任人，按 AR-11 转上级组织负责人批准（处理方式待 V-18）
    outcome: 已批准

PRC-82:
  - id: PRC-82-S01
    path: [第 1 步 登记候选人, 第 2 步 记录面试, 第 3 步 作出录用决定, 第 4 步 〔缺〕登记候选人答复]
    covers: [面试通过并决定录用, 候选人确认入职日期, 人员待入职]
    expect: 候选人面试通过、录用、确认入职日，发出录用决定已作出，PRC-83 启动
    outcome: 人员待入职
  - id: PRC-82-S02
    path: [第 1 步 登记候选人, 第 2 步 记录面试, 第 3 步 作出录用决定, 第 4 步 〔缺〕登记候选人答复]
    covers: [候选人已放弃]
    expect: 候选人放弃录用，流程结束，候选人个人信息仍受访问限制
    outcome: 候选人已放弃
  - id: PRC-82-S03
    path: [第 1 步 登记候选人, 第 2 步 记录面试, 第 5 步 标记未录用]
    covers: [标记未录用, 未录用]
    expect: 面试未通过，标记未录用，线下通知候选人
    outcome: 未录用
  - id: PRC-82-S04
    path: [第 1 步 登记候选人, 第 2 步 记录面试, 第 3 步 作出录用决定, 第 4 步 〔缺〕登记候选人答复]
    covers: ["超时：〔缺〕登记候选人答复"]
    expect: 录用通知发出后超过答复期限（P7D，V-19）未答复，逾期提醒用人经理决定是否撤销录用
    outcome: 候选人已放弃

PRC-85:
  - id: PRC-85-S01
    path: [第 1 步 编制试用期绩效评估, 第 2 步 确认绩效评估, 第 3 步 办理转正]
    covers: [已转正]
    expect: 试用期届满前生成评估待办，确认评估后办理转正，B-15 收到转正已办理，被评员工收到通知
    outcome: 已转正
  - id: PRC-85-S02
    path: [第 1 步 编制试用期绩效评估, 第 2 步 确认绩效评估, 第 3 步 办理转正]
    covers: [公司决定不予转正, 转入离职办理]
    expect: 公司决定不予转正，转入 PRC-128（公司单方终止，需批准）
    outcome: 转入离职办理
  - id: PRC-85-S03
    path: [第 1 步 编制试用期绩效评估]
    covers: ["超时：编制试用期绩效评估"]
    expect: 评估待办 P7D 内未编制，超时升级提醒人力（V-12）
    outcome: 已转正
  - id: PRC-85-S04
    path: [第 1 步 编制试用期绩效评估, 第 2 步 确认绩效评估, 第 3 步 办理转正]
    covers: ["超时：办理转正"]
    expect: 试用期届满后 P3D 仍未办理转正或终止，超时升级提醒职能高管（V-12）
    outcome: 已转正

PRC-83:
  - id: PRC-83-S01
    path: [第 1 步 登记入职, 第 2 步 〔缺〕入职生效, 第 3 步 建立任职, 第 4 步 提交劳动合同, 第 5 步 批准劳动合同, 第 6 步 签订劳动合同]
    covers: [入职日到达（当天开始时）, 批准, 入职已办理（人员试用期 / 正式，协议已签署生效）]
    expect: 提前登记入职，入职日到时生效，建立任职，劳动合同提交、批准、签订
    outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
  - id: PRC-83-S02
    path: [第 1 步 登记入职, 第 2 步 〔缺〕入职生效, 第 3 步 建立任职]
    covers: [与该人员已有主任职区间重叠]
    expect: 主任职区间与已有区间重叠被 INV-62 拒绝，退回第 3 步改正
    outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
  - id: PRC-83-S03
    path: [第 1 步 登记入职, 第 2 步 〔缺〕入职生效, 第 3 步 建立任职, 第 4 步 提交劳动合同]
    covers: [试用期超过法定上限]
    expect: 试用期超过法定上限被 INV-14 拒绝，退回第 4 步改正
    outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
  - id: PRC-83-S04
    path: [第 1 步 登记入职, 第 2 步 〔缺〕入职生效, 第 3 步 建立任职, 第 4 步 提交劳动合同, 第 5 步 批准劳动合同]
    covers: [批准劳动合同被驳回]
    expect: 部门负责人驳回劳动合同，退回人力第 4 步修改
    outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
  - id: PRC-83-S05
    path: [第 1 步 登记入职, 第 6 步 签订劳动合同]
    covers: [用工满一个月仍未签订]
    expect: 用工满一个月仍未签订，提醒人力，不拒绝（P-05）
    outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
  - id: PRC-83-S06
    path: [第 1 步 登记入职, 第 2 步 〔缺〕入职生效]
    covers: [入职日不晚于今天]
    expect: 补登入职（入职日不晚于登记日），入职生效立即执行，生效日仍为登记的入职日
    outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）

PRC-84:
  - id: PRC-84-S01
    path: [第 1 步 参保增员, 第 2 步 建立薪酬档案]
    covers: [社保与公积金参保在缴，薪酬档案已建立]
    expect: 入职生效后办理参保增员并建立薪酬档案，生效日为入职日
    outcome: 社保与公积金参保在缴，薪酬档案已建立
  - id: PRC-84-S02
    path: [第 1 步 参保增员, 第 2 步 建立薪酬档案]
    covers: [用工类型为退休返聘或实习]
    expect: 退休返聘或实习不参保，只建立薪酬档案（T-4）
    outcome: 社保与公积金参保在缴，薪酬档案已建立
  - id: PRC-84-S03
    path: [第 1 步 参保增员]
    covers: ["超时：参保增员"]
    expect: 入职满 P30D 仍未办理参保增员，逾期提醒并升级（P-32）
    outcome: 社保与公积金参保在缴，薪酬档案已建立

PRC-137:
  - id: PRC-137-S01
    path: [第 1 步 〔缺〕建立待开通登录身份, 第 2 步 〔缺〕开通企业微信成员, 第 3 步 〔缺〕绑定外部身份]
    covers: [已开通并绑定]
    expect: 登记入职后入职日前 3 个工作日自动开通企业微信成员并绑定，入职日放行登录
    outcome: 已开通并绑定
  - id: PRC-137-S02
    path: [第 1 步 〔缺〕建立待开通登录身份, 第 2 步 〔缺〕开通企业微信成员, 第 4 步 〔缺〕告警开通未完成, 第 2 步 〔缺〕开通企业微信成员, 第 3 步 〔缺〕绑定外部身份]
    covers: [企业微信返回失败或 userid 已被占用, 已修正并重试]
    expect: 企业微信返回失败，告警信息部门与人力，修正后重试成功
    outcome: 已开通并绑定
  - id: PRC-137-S03
    path: [第 1 步 〔缺〕建立待开通登录身份, 第 2 步 〔缺〕开通企业微信成员, 第 4 步 〔缺〕告警开通未完成]
    covers: [企业微信返回失败或 userid 已被占用]
    expect: userid 已被占用，开通失败，告警不静默
    outcome: 开通失败已告警
  - id: PRC-137-S04
    path: [第 1 步 〔缺〕建立待开通登录身份, 第 2 步 〔缺〕开通企业微信成员, 第 4 步 〔缺〕告警开通未完成]
    covers: [开通失败，或入职日已到仍未绑定, "超时：〔缺〕告警开通未完成", 开通失败已告警]
    expect: 入职日已到仍未绑定，告警；P1D（1 个工作日）内未处理超时升级（T-2）
    outcome: 开通失败已告警

PRC-128:
  - id: PRC-128-S01
    path: [第 1 步 申请离职, 第 5 步 〔缺〕登记劳动合同终止依据, 第 6 步 办理离职, 第 7 步 〔缺〕离职生效, 第 8 步 终止任职, 第 9 步 终止劳动合同]
    covers: [离职日结束时（时点待用户定）；离职日不晚于登记日则登记时立即执行, 步 7 之后立即, 离职已生效]
    expect: 员工申请离职，离职日在未来，不设批准；登记时不发 Separated，离职日结束时发出并吊销会话
    outcome: 离职已生效
  - id: PRC-128-S02
    path: [第 1 步 申请离职, 第 5 步 〔缺〕登记劳动合同终止依据, 第 6 步 办理离职, 第 7 步 〔缺〕离职生效, 第 8 步 终止任职, 第 9 步 终止劳动合同]
    covers: [离职日结束时（时点待用户定）；离职日不晚于登记日则登记时立即执行, 离职已生效]
    expect: 离职日不晚于登记日，登记即刻生效并吊销
    outcome: 离职已生效
  - id: PRC-128-S03
    path: [第 1 步 申请离职, 第 5 步 〔缺〕登记劳动合同终止依据, 第 6 步 办理离职, 第 10 步 〔缺〕撤销离职登记]
    covers: [离职日前员工撤回或公司撤销, 离职登记已撤销]
    expect: 离职日前撤销离职登记，状态回在职（B-27、B-31 均只在 Separated 后处置，无待办可取消，S-42）
    outcome: 离职登记已撤销
  - id: PRC-128-S04
    path: [第 1 步 申请离职, 第 2 步 〔缺〕批准公司终止, 第 5 步 〔缺〕登记劳动合同终止依据, 第 6 步 办理离职, 第 7 步 〔缺〕离职生效, 第 8 步 终止任职, 第 9 步 终止劳动合同]
    covers: [来源为公司单方终止, 批准, 离职已生效]
    expect: 公司单方终止：人力发起，部门负责人（类型级 SH-M1）批准，登记依据，办理离职
    outcome: 离职已生效
  - id: PRC-128-S05
    path: [第 1 步 申请离职, 第 2 步 〔缺〕批准公司终止, 第 3 步 〔缺〕驳回公司终止]
    covers: [公司终止被驳回, 终止已驳回]
    expect: 公司单方终止被部门负责人驳回，人力知悉
    outcome: 终止已驳回
  - id: PRC-128-S06
    path: [第 1 步 申请离职, 第 4 步 〔缺〕撤回离职申请]
    covers: [员工撤回申请, 离职申请已撤回]
    expect: 员工在登记离职日前撤回申请
    outcome: 离职申请已撤回
  - id: PRC-128-S07
    path: [第 1 步 申请离职, 第 2 步 〔缺〕批准公司终止]
    covers: [批准]
    expect: 公司终止的发起人不能批准自己发起的终止（segregation）；被终止员工即部门负责人时按 AR-11 转上级（V-18）
    outcome: 离职已生效
  - id: PRC-128-S08
    path: [第 1 步 申请离职, 第 5 步 〔缺〕登记劳动合同终止依据, 第 6 步 办理离职, 第 7 步 〔缺〕离职生效, 第 8 步 终止任职, 第 9 步 终止劳动合同]
