PRC-136:
  - id: PRC-136-S01
    path: [第 1 步 〔缺〕提交调岗申请]
    covers: [新职位已停用或新组织单元已撤销]
    expect: 新职位已停用，调岗被 INV-63 拒绝并退回第 1 步改正
    outcome: 调岗已生效
  - id: PRC-136-S02
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 6 步 〔缺〕变更任职, 第 7 步 〔缺〕任职变更生效, 第 9 步 〔缺〕重算默认角色与数据范围, 第 10 步 标记数据范围待复核并通知区域负责人]
    covers: [批准, 业务生效日到达（补登 / 当日登记则立即执行）, 调岗已生效]
    expect: 同法人调岗：新组织单元责任人批准，写入未来版本；业务生效日才发任职已变更，重算默认授予并生成待调整权限
    outcome: 调岗已生效
  - id: PRC-136-S03
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 3 步 〔缺〕驳回调岗申请]
    covers: [批准调岗申请被驳回, 已驳回]
    expect: 批准人驳回调岗
    outcome: 已驳回
  - id: PRC-136-S04
    path: [第 1 步 〔缺〕提交调岗申请, 第 3 步 〔缺〕驳回调岗申请]
    covers: [提交人在批准前撤回, 已驳回]
