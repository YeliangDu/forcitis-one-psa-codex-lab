    outcome: 已驳回
  - id: PRC-136-S05
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 4 步 提交劳动合同, 第 5 步 签订劳动合同, 第 6 步 〔缺〕变更任职, 第 7 步 〔缺〕任职变更生效, 第 8 步 终止劳动合同, 第 9 步 〔缺〕重算默认角色与数据范围, 第 10 步 标记数据范围待复核并通知区域负责人, 第 11 步 调整薪酬档案, 第 12 步 〔缺〕变更参保缴纳主体]
    covers: [批准且跨法人调动, 跨法人调动, 调岗引起薪酬变化或跨法人调动, 调岗已生效]
    expect: 跨法人调动：新合同提交（要素与已批准调岗一致）、线下签订、原合同终止、薪酬扣缴义务人与参保缴纳主体变更；三口径不一致时 PRC-145 预警
    outcome: 调岗已生效
  - id: PRC-136-S06
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 6 步 〔缺〕变更任职]
    covers: [与该人员其他主任职区间冲突]
    expect: 主任职区间冲突被 INV-62 拒绝并退回第 1 步改正
    outcome: 调岗已生效
  - id: PRC-136-S07
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 4 步 提交劳动合同]
    covers: [试用期超过法定上限或合同要素与已批准调岗不一致]
    expect: 跨法人合同试用期超限或要素与调岗不一致被 INV-14、R-04 拒绝并退回第 4 步
    outcome: 调岗已生效
  - id: PRC-136-S08
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 6 步 〔缺〕变更任职, 第 7 步 〔缺〕任职变更生效, 第 9 步 〔缺〕重算默认角色与数据范围, 第 10 步 标记数据范围待复核并通知区域负责人, 第 11 步 调整薪酬档案]
    covers: [调岗引起薪酬变化或跨法人调动, 调岗已生效]
    expect: 同法人调岗引起薪酬变化，调整薪酬档案后结束
    outcome: 调岗已生效
  - id: PRC-136-S09
    path: [第 1 步 〔缺〕提交调岗申请, 第 2 步 〔缺〕批准调岗申请, 第 6 步 〔缺〕变更任职, 第 7 步 〔缺〕任职变更生效]
    covers: [业务生效日到达（补登 / 当日登记则立即执行）]
    expect: 提前登记的调岗写入未来版本，业务生效日到时才生效；补登当日立即生效
    outcome: 调岗已生效

PRC-138:
