    path: [第 1 步 吊销会话, 第 2 步 〔缺〕停用登录身份, 第 3 步 〔缺〕删除全部角色授予, 第 4 步 〔缺〕确认放行离职处置, 第 5 步 〔缺〕停用应急账号]
