# vs0911 状态机（收敛产物，提议稿）。state: 状态；initial: 新建伪状态 [新建]；terminal: 终态。
# 来源：vs0911.data-model.yaml 的状态列、聚合稿 INV、vs0911.processes.yaml 的步骤。标「提议」的状态或转换聚合稿与数据模型未列，供 one-architecture 裁定。
# steps: 该转换对应的流程步骤（PRC-NN#n），自检脚本核对每个改状态的步骤都有转换。

state_machines:

  - aggregate: AGG-79
    entity: 经营计划版本（business_plan_versions.状态）
    states:
      - {name: 编制中, desc: 可改目标值与动作}
      - {name: 审批中, desc: 已提交，等待归属组织单元责任人审批}
      - {name: 已通过, desc: "提议：审批通过到基线化之间的过渡态；数据模型状态列未列（基线化自动执行）"}
      - {name: 基线, desc: 不可变（INV-101）}
      - {name: 已编制, desc: "提议：预测与现金流预测版本的结果态，不经审批、不基线化；数据模型状态列未列"}
      - {name: 被取代, terminal: true, desc: 被同计划新基线或新滚动版本取代}
      - {name: 已作废, terminal: true, desc: S-32：编制人放弃的废弃草稿，不再进入审批}
    transitions:
      - {from: "[新建]", to: 编制中, command: 编制经营计划版本, guard: [INV-101], steps: [PRC-88#1]}
      - {from: 编制中, to: 编制中, command: 编制经营计划版本, guard: [INV-101], steps: [PRC-88#1], note: 编辑}
      - {from: 编制中, to: 已作废, command: 作废经营计划草稿, guard: [INV-101：仅编制中，审批中须先撤回], steps: [PRC-88#9], reverse: 作废}
      - {from: 编制中, to: 审批中, command: 〔缺〕提交经营计划审批, guard: [候选规则-目标值完整], steps: [PRC-88#2]}
      - {from: 审批中, to: 编制中, command: 〔缺〕撤回经营计划审批, guard: [平台可取消审批实例], steps: ["PRC-88#3(withdraw)"], reverse: 撤回}
      - {from: 审批中, to: 编制中, command: 〔缺〕驳回经营计划审批, guard: [], steps: [PRC-88#4], reverse: 驳回}
      - {from: 审批中, to: 已通过, command: 〔缺〕通过经营计划审批, guard: [候选规则-编制人不审自己], steps: [PRC-88#5]}
      - {from: 已通过, to: 基线, command: 基线化经营计划, guard: [INV-101, 候选规则-审批通过自动基线化], steps: [PRC-88#6]}
      - {from: 基线, to: 被取代, command: 基线化经营计划, guard: [INV-101], steps: [PRC-88#6], cascade: true, note: 同计划新版本基线化时，原基线版本被取代（引用在新版本的被取代版本引用上）}
      - {from: "[新建]", to: 已编制, command: 编制预测版本, guard: [INV-101, 候选规则-预测不审批], steps: [PRC-89#1]}
      - {from: "[新建]", to: 已编制, command: 编制现金流预测, guard: [INV-101], steps: [PRC-89#2]}
      - {from: 已编制, to: 被取代, command: 编制预测版本, guard: [INV-101], steps: [PRC-89#1], cascade: true, note: 下一次滚动的新版本取代上一版（现金流预测同理，由编制现金流预测触发）}
    platform_task_steps:
      - {step: PRC-88#3, desc: 经营计划审批是 platform.approval 的任务，不是聚合命令；其结果由 PRC-88#4、#5 的回调命令承接，撤回由 withdraw 承接}
    reverse_paths: [撤回（审批中 → 编制中）, 驳回（审批中 → 编制中）]
    no_reverse: 基线不可冲销、不可撤销，更正只出新版本（INV-101）
    open_questions:
      - 撤回后版本回到编制中，而流程结局记「已撤回」；是否需要独立「已撤回」状态由 one-architecture 定（废弃草稿已由 S-32 新增作废经营计划草稿处理）
      - 预测类型是否经审批成基线（待用户定 4，VS-09.2 notes 与 PRC-89 不一致）

  - aggregate: AGG-79
    entity: 经营复盘（business_reviews.状态；次级，PRC-181）
    states:
      - {name: 复盘中, desc: 可记录偏差解释、确定经营动作}
      - {name: 已定稿, desc: 偏差解释与动作清单不可改，动作跟踪中}
      - {name: 已闭环, terminal: true, desc: 无动作定稿，或全部动作已完成}
    transitions:
      - {from: "[新建]", to: 复盘中, command: 〔缺〕创建经营复盘, guard: [候选规则-复盘期间已关账, 候选规则-复盘唯一], steps: [PRC-181#1]}
      - {from: 复盘中, to: 复盘中, command: 〔缺〕记录偏差解释, guard: [], steps: [PRC-181#2], note: 编辑}
      - {from: 复盘中, to: 复盘中, command: 〔缺〕确定经营动作, guard: [候选规则-动作要素齐全], steps: [PRC-181#3], note: 追加动作}
      - {from: 复盘中, to: 已定稿, command: 〔缺〕定稿经营复盘, guard: [候选规则-偏差须解释, 候选规则-定稿后不可改], steps: [PRC-181#4]}
      - {from: 复盘中, to: 已闭环, command: 〔缺〕定稿经营复盘, guard: [候选规则-偏差须解释], steps: [PRC-181#4], note: 无动作时直接闭环}
      - {from: 已定稿, to: 已定稿, command: 〔缺〕完成经营动作, guard: [], steps: [PRC-181#5], note: 仍有未完成的动作}
      - {from: 已定稿, to: 已闭环, command: 〔缺〕完成经营动作, guard: [], steps: [PRC-181#5], note: 最后一个动作完成}
    reverse_paths: []
    no_reverse: 定稿后不可回退，更正另记经营动作；闭环为终态
    open_questions:
      - 经营复盘落 AGG-79 次级还是独立聚合（结构问题 11，请 one-architecture 定）
      - 动作的取消与延期是否需要（待用户定 11）

  - aggregate: AGG-79
    entity: 经营动作（action_items.状态；次级，PRC-181）
    states:
      - {name: 待完成}
      - {name: 已完成, terminal: true}
    transitions:
      - {from: "[新建]", to: 待完成, command: 〔缺〕确定经营动作, guard: [候选规则-动作要素齐全], steps: [PRC-181#3]}
      - {from: 待完成, to: 已完成, command: 〔缺〕完成经营动作, guard: [候选规则-动作责任人本人登记], steps: [PRC-181#5]}
    reverse_paths: []
    no_reverse: 完成不可回退；逾期是按期限派生的提示，不是状态

  - aggregate: AGG-80
    entity: 预算账户（budget_accounts.状态）
    states:
      - {name: 已开立, desc: 生效，可占用、可调剂}
      - {name: 已关闭, terminal: true, desc: 计划周期结束或被新基线取代后关闭，不再接受占用与调剂（收敛新增终态）}
    transitions:
      - {from: "[新建]", to: 已开立, command: 开立预算账户, guard: [INV-101, 候选规则-预算类型分流, 候选规则-额度不超基线], steps: [PRC-88#7]}
      - {from: 已开立, to: 已开立, command: 调整预算, guard: [候选规则-额度总额内调剂], steps: [PRC-88#8], note: 额度调剂，状态不变，记调整记录}
      - {from: 已开立, to: 已关闭, command: 关闭预算账户, guard: [计划周期已结束或已被新基线取代, 无占用中的占用行（占用中的先释放或消耗）], steps: [PRC-161#1], note: S-32：PRC-161 年末定时触发，B-18 向 platform.scheduling 登记}
    reverse_paths: []
    no_reverse: 调整只追加（budget_account_adjustments）；反向调整另记一条

  - aggregate: AGG-80
    entity: 预算占用行（budget_reservations.状态）
    states:
      - {name: 占用中}
      - {name: 已消耗, terminal: true}
      - {name: 已释放, terminal: true}
    transitions:
      - {from: "[新建]", to: 占用中, command: 预算占用, kind: entry, guard: [G-3 拦截或预警待定, AR-03], steps: [], note: 发起步骤在 PRC-70、PRC-87（他组），本片段只有 PRC-88#7 入口声明}
      - {from: 占用中, to: 已释放, command: 释放预算占用, guard: [], steps: [], reverse: 释放, note: 驳回、作废、终止及孤儿占用定时释放}
      - {from: 占用中, to: 占用中, command: 调整预算占用, kind: non_state, guard: [INV-102 只预警], steps: [], note: 按增减额改占用额，状态不变（PRC-71 他组调用，S-31 SQ-08）}
      - {from: 占用中, to: 已消耗, command: 〔缺〕消耗预算占用, guard: [], steps: [], note: 命令为〔缺〕，孤儿}
    reverse_paths: [释放（占用中 → 已释放）]
    no_reverse: 已消耗、已释放不可回退；重新占用另建占用行

  - aggregate: AGG-107
    entity: 知识条目版本（knowledge_entry_versions.状态）
    states:
      - {name: 起草中}
      - {name: 评审中}
      - {name: 已评审通过, desc: "提议：评审通过到发布之间的态；数据模型状态列写「起草、评审、发布、修订被取代、废止」，未单列"}
      - {name: 已发布, desc: 不得修改（INV-115）}
      - {name: 被取代, terminal: true, desc: 其后继版本已发布}
      - {name: 已废止, terminal: true, desc: 不得被新引用，已有引用不受影响}
    transitions:
      - {from: "[新建]", to: 起草中, command: 创建知识条目, guard: [必填类别], steps: [PRC-107#1]}
      - {from: 起草中, to: 起草中, command: 起草知识条目, guard: [INV-115], steps: [PRC-107#2], note: 编辑；退回后也回到本步}
      - {from: 起草中, to: 评审中, command: 提交知识条目评审, guard: [候选规则-必填校验], steps: [PRC-107#3]}
      - {from: 评审中, to: 已评审通过, command: 评审知识条目, guard: [候选规则-评审人不是起草人, AR-11, AR-12], steps: [PRC-107#4]}
      - {from: 评审中, to: 起草中, command: 〔缺〕退回知识条目, guard: [], steps: [PRC-107#5], reverse: 退回}
      - {from: 已评审通过, to: 已发布, command: 发布知识条目, guard: [INV-115], steps: [PRC-107#6]}
      - {from: 已发布, to: 被取代, command: 发布知识条目, guard: [INV-115], steps: [PRC-107#6], cascade: true, note: 修订版本发布时，其引用的被取代版本变被取代}
      - {from: "[新建]", to: 起草中, command: 修订知识条目, requires_source_state: 已发布, guard: [INV-115], steps: [PRC-107#7], note: 产生新版本（新行）起于起草中并引用被取代版本；原版本仍为已发布直至新版本发布；须重新评审}
      - {from: 已发布, to: 已废止, command: 废止知识条目, guard: [INV-115], steps: [PRC-107#8], reverse: 废止}
    reverse_paths: [退回（评审中 → 起草中）, 废止（已发布 → 已废止）]
    no_reverse: 已发布版本不可撤回，更正只出新版本；废止不可恢复，需要时新建条目或新版本
    open_questions:
      - 评审中起草人撤回提交、评审逾期无命令（QC-VS-11 缺口，待用户定 8）
