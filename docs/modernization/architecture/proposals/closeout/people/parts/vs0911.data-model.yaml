# vs0911 表级数据模型片段：B-18 operations.planning（AGG-79、AGG-80）、B-30 km.knowledge（AGG-107）。
# 格式依 closeout/CONVENTIONS.md §3（含 pi 字段）；schema 名按 NAMING_STANDARD 由 BC 定，此处不写。
# 跨 BC 的「不校验」引用（占用方单据 ID、来源复盘 ID）不写进 references，写在 reason，因为 references 表示有依赖边的引用；见 notes 接缝问题。
# 迁入暂存（staging）由 platform.integration 的迁入登记承担（SESSION_PLAYBOOK §14.2 M5），业务聚合不另建。

- aggregate: AGG-79
  bc: B-18
  tables:
    - name: business_plans
      role: root
      key: uuid_v7
      versioned: none
      history_migration: full
      sensitivity: internal
      pi: none
      column_families: [计划编码, 目标类型, 计划周期, 创建与乐观锁, 事件序号]
      reason: "versioned none：根只留标识与不随版本变的列，状态、审批、基线随 business_plan_versions（D17 细则 5）。历史：来源待取证（信息图 OBJ-100 记「有 business_plan 等」，无生产量）"
    - name: business_plan_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-79, by: business_plan_id}
        - {to: AGG-79, by: superseded_version_id}
      versioned: append_only
      history_migration: full
      sensitivity: internal
      pi: none
      column_families: [版本号, 状态（编制中、审批中、基线、被取代）, 基线生效日, 确认人与确认时间, 审批实例引用, 决定出处, 被取代版本引用, 审计列]
      reason: "D15 形状：版本只追加，带生效日与确认人，不追溯；基线后的行不可改（INV-101），基线前的状态变迁由审计还原。审批实例在 platform.approval，只存引用。D15 原为配置类，计划版本是业务单据版本，沿用其形状，见 notes 格式问题 2。历史来源待取证"
    - name: plan_target_values
      role: child
      key: uuid_v7
      references:
        - {to: AGG-79, by: business_plan_version_id}
        - {to: AGG-61, by: org_unit_id, cross_bc: true}
        - {to: AGG-62, by: employee_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: internal
      pi: pi
      column_families: [指标, 期间, 目标值, 组织单元, 人员（销售预测承诺按人员）]
      reason: "versioned none：目标值随所属版本，基线后不可改，改动出新版本。pi：按人员的行含员工 ID，属个人信息，数值本身是计划值不是薪酬。在途 1,212 单预测迁为只读历史（信息图 M-8）。AGG-79 引用列未列人员，见 notes 接缝问题 1"
    - name: action_items
      role: child
      key: uuid_v7
      references:
        - {to: AGG-79, by: business_plan_version_id}
        - {to: AGG-61, by: org_unit_id, cross_bc: true}
        - {to: AGG-62, by: owner_employee_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: internal
      pi: pi
      column_families: [经营动作描述, 责任人, 期限, 来源（复盘偏差）]
      reason: "OBJ-100 定义含「动作」，VS-09.3 退出写「经营动作写入计划」，聚合稿 AGG-79 内含列只写目标值；暂建，是否独立成表或并入版本待 notes 结构问题 4。versioned none：随版本，基线后不可改。历史来源待取证"

- aggregate: AGG-80
  bc: B-18
  tables:
    - name: budget_accounts
      role: root
      key: uuid_v7
      references:
        - {to: AGG-79, by: business_plan_version_id}
        - {to: AGG-61, by: org_unit_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: internal
      pi: none
      column_families: [账户编码, 预算主体（组织单元、预算科目）, 预算期间, 当前额度, 已占用与已消耗合计, 状态（可冻结）, 乐观锁, 事件序号]
      reason: "versioned none：额度变动记在 budget_account_adjustments，占用记在 budget_reservations；根上的合计列在拦截方案下是乐观锁保护的额度占用核心，在预警方案下只作展示。历史来源待取证"
    - name: budget_account_adjustments
      role: child
      key: uuid_v7
      references:
        - {to: AGG-80, by: budget_account_id}
        - {to: AGG-79, by: business_plan_version_id}
      versioned: append_only
      history_migration: full
      sensitivity: internal
      pi: none
      column_families: [调整额, 调整前后额度, 原因, 调整人, 调整时间, 所依计划版本引用]
      reason: "预算调整只追加（BudgetAdjusted）；调整是否产生基线新版本待 notes 结构问题 2。历史来源待取证"
    - name: budget_reservations
      role: child
      key: uuid_v7
      references:
        - {to: AGG-80, by: budget_account_id}
      versioned: none
      history_migration: full
      sensitivity: internal
      pi: none
      column_families: [占用标识, 占用额, 状态（占用、消耗、释放）, 占用方类型与单据 ID, 占用时间, 释放时间与原因]
      reason: "versioned none：一行一次占用，状态变迁由审计还原；占用方单据（供方协议、费用报销等，B-11、B-12）的 ID 只记录、不校验：B-18 不得依赖下游，聚合稿 AGG-80 引用列未登记该项，见 notes 接缝问题 2。额度占用模式要求孤儿占用定时释放与对账兜底。占用行是否全量迁入取决于老系统是否有占用记录，待取证"

- aggregate: AGG-107
  bc: B-30
  tables:
    - name: knowledge_entries
      role: root
      key: uuid_v7
      versioned: none
      history_migration: full
      sensitivity: internal
      pi: none
      column_families: [条目编码, 类别, 当前已发布版本引用, 创建与乐观锁, 事件序号]
      reason: "versioned none：根只留编码与类别，内容随 knowledge_entry_versions。历史：库内无知识条目实体（信息图 OBJ-110 取证），迁入集合为空；A8 文档中心 567 份文档是否转条目见 notes 待用户定 5"
    - name: knowledge_entry_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-107, by: knowledge_entry_id}
        - {to: AGG-107, by: superseded_version_id}
      versioned: append_only
      history_migration: full
      sensitivity: tbd
      pi: tbd
      column_families: [版本号, 状态（起草、评审、发布、修订被取代、废止）, 标题与内容, 适用范围（业务线、项目类型等取值）, 有效期, 发布日, 被取代版本引用, 来源复盘 ID（只记录）, 审计列]
      reason: "D15 形状：已发布版本不得修改，修订出新版本并引用被取代版本（INV-115）。sensitivity 与 pi 为 tbd：技术案例的正文可能带客户、项目和人员信息，是否要求脱敏、是否限范围可见待用户定（notes 待用户定 6）。来源复盘 ID 属 B-04 的 AGG-103，只记录不校验。外部知识平台文件夹引用不在本表，走 platform.integration 来源对照（D16），见 notes 结构问题 5"
    - name: knowledge_entry_reviews
      role: child
      key: uuid_v7
      references:
        - {to: AGG-107, by: knowledge_entry_version_id}
        - {to: AGG-62, by: reviewer_employee_id, cross_bc: true}
      versioned: append_only
      history_migration: full
      sensitivity: internal
      pi: pi
      column_families: [评审结论（通过、退回）, 意见, 评审人, 评审时间]
      reason: "审批人与审批记录在聚合内（聚合稿 AGG-107；B-30 无到 platform.approval 的边）；记录只追加。pi：含评审人员工 ID。迁入集合为空，同 knowledge_entries"
