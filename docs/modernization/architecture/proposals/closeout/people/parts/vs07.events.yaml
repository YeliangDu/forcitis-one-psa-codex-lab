# B-13 事件目录（收敛产物，提议稿）。事件名取聚合稿 AGG 事件列与分片 emits，不自造；负载只含 ID 与值对象（日期、代码、人数）。个人评价、离职原因、薪酬等敏感内容不入载荷。
# 聚合稿其余命令的「（内部）」不发布事件。subscribers 的 type：流程（某 PRC 步骤订阅）、事件策略（同 BC 或他 BC 反应）、仅分析。读取（api）不算订阅，写在 note。
# consumed：B-13 本组不订阅外部事件（审批在聚合内，F-3，不经 platform.approval 回调）；定时到点由 platform.scheduling 触发命令，见 vs07.commands.yaml 事件策略（定时边待统一，vs13att.notes.md 接缝问题 2）。
# 复用 EventCatalogueTest 口径与 processes_check.py 的校验待 one-architecture 并入。
bc: B-13
published:
- name: 组织单元已调整
  published_by: AGG-61
  by_command: 调整组织单元
  payload: [组织单元ID, 调整类型码, 上级组织单元ID, 负责人ID, 状态码, 业务生效日]
  subscribers:
  - {type: 事件策略, who: platform.identity 标记数据范围待复核并通知区域负责人, used_by: PRC-80 第 6 步（P-31）}
  - {type: 事件策略, who: B-13 向差旅服务商同步员工与组织, used_by: PRC-177 触发器（同 BC）}
  - &id001 {type: 仅分析}
  note: 已在聚合稿登记订阅方 platform.identity；P-31 现只由本事件触发，需扩任职已变更（接缝问题 5）
- name: 法人归属已变更
  name_status: 〔缺〕沿用分片提议名
  published_by: AGG-117
  by_command: 指定法人归属
  payload: [归属对象类型码, 归属对象ID, 法人主体ID, 期间起, 期间止]
  subscribers:
  - {type: 事件策略, who: platform.identity 数据范围法人口径, used_by: PRC-80 第 4 步 cross_bc}
  - {type: 事件策略, who: B-15 三口径预警（PRC-145）, used_by: PRC-80 第 4 步 cross_bc}
  note: 词表已有 法人归属已确立 / 已结束 / 结束日已更正（LegalEntityAttributed 等，已建代码事件）；聚合稿与分片用「法人归属已变更」，是否改用词表名交 one-glossary（vs07conv.notes.md 新用语）
- name: 法人归属已结束
  published_by: AGG-117
  by_command: 结束法人归属
  payload: [归属对象类型码, 归属对象ID, 法人主体ID, 期间起, 期间止]
  subscribers:
  - {type: 事件策略, who: platform.identity 数据范围法人口径, used_by: PRC-80 第 13 步}
  - {type: 事件策略, who: B-15 三口径预警（PRC-145）, used_by: PRC-80 第 13 步}
  note: 词表已有（LegalEntityAttributionEnded，已建代码事件）；订阅方沿「法人归属已变更」，待 one-architecture 核
- name: 岗位已停用
  published_by: AGG-64
  by_command: 停用岗位
  payload: [职位ID, 停用日]
  subscribers:
  - *id001
  note: Q-08 后改称职位目录条目已停用，交 one-glossary
- name: 招聘需求已批准
  published_by: AGG-65
  by_command: 批准招聘需求
  payload: [招聘需求ID, 职位ID, 组织单元ID, 需求人数, 批准时间]
  subscribers:
  - *id001
  note: 人力收待办是 notify，不是事件订阅
- name: 招聘需求已关闭
  published_by: AGG-65
  by_command: 关闭招聘需求
  payload: [招聘需求ID, 关闭原因码, 关闭时间]
  subscribers:
  - *id001
- name: 人员已登记
  published_by: AGG-62
  by_command: 登记候选人
  payload: [人员ID, 登记时间]
  subscribers:
  - *id001
  note: 草案事件（聚合稿）
- name: 录用决定已作出
  published_by: AGG-62
  by_command: 登记候选人答复
  payload: [人员ID, 招聘需求ID, 拟任职位ID, 拟入职日, 确认日]
  subscribers:
  - {type: 流程, ref: PRC-83, used_by: PRC-83 触发器（同 BC，候选人确认入职日后办理入职）}
  note: 聚合稿挂在作出录用决定；本稿改挂登记候选人答复，使触发语与 PRC-83 一致（vs07.notes.md 结构问题 4，请 one-architecture 二选一：改挂，或把事件改名为「录用决定已确认」）
- name: 入职已登记
  name_status: 〔缺〕沿用样板
  published_by: AGG-62
  by_command: 登记入职
  payload: [人员ID, 入职日, 用工类型码, 工号]
  subscribers:
  - {type: 流程, ref: PRC-137, who: platform.identity, used_by: PRC-137 第 1 步}
  note: 提前登记时发在登记时，账号可提前准备（S3、S4）
- name: Employed
  published_by: AGG-62
  by_command: 入职生效
  payload: [人员ID, 入职日, 用工类型码, 是否含试用期]
  subscribers:
  - {type: 流程, ref: PRC-84, who: B-15, used_by: PRC-84 第 1 步触发器}
  - {type: 事件策略, who: B-13 向差旅服务商同步员工与组织, used_by: PRC-177 触发器（同 BC）}
  - {type: 流程, ref: PRC-137, who: platform.identity, used_by: PRC-137 第 3 步（放行登录）}
  note: 事件在入职日（业务生效日）发出；迁入不发（ADR-0036 M7）
- name: 转正已办理
  name_status: 〔缺〕沿用分片提议名
  published_by: AGG-62
  by_command: 办理转正
  payload: [人员ID, 转正日]
  subscribers:
  - {type: 事件策略, who: B-15 复核转正后薪酬, used_by: PRC-123 触发器（入口 1；vs13pay 事件策略「转正后复核薪酬」，S-42）}
  note: 转正日晚于办理日（提前登记）时事件应在转正日发出，无「转正生效」命令（结构问题 4）
- name: Separated
  published_by: AGG-62
  by_command: 离职生效
  payload: [人员ID, 离职日, 用工类型码]
  subscribers:
  - {type: 事件策略, who: platform.identity 吊销会话, used_by: PRC-129}
  - {type: 流程, ref: PRC-138, who: platform.identity, used_by: PRC-138 触发器}
  - {type: 流程, ref: PRC-130, who: B-15, used_by: PRC-130 触发器（终止薪酬档案、参保减员）}
  - {type: 流程, ref: PRC-178, who: B-15, used_by: PRC-178 入口 2（读取未休补休余额，计入加班工资，随最后一期薪酬计发；S-41）}
  - {type: 事件策略, who: B-13 向差旅服务商同步员工与组织, used_by: PRC-177 触发器（同 BC）}
  - {type: 事件策略, who: B-31 离职生成归还待办, used_by: PRC-143C 触发器（b31.events 已列）}
  - {type: 事件策略, who: B-27 离职当月考勤默认确认, used_by: PRC-118 第 7 步（事件入口；vs13att 事件策略「离职当月考勤默认确认」）}
  - {type: 事件策略, who: B-13 离职生效后终止任职与劳动合同, used_by: PRC-128 第 8、9 步（同 BC）}
  note: 离职日结束才发（V-1），不在登记时提前发（PG-12）；订阅方清单与 b31.events.yaml、vs13att.events.yaml 一致，聚合稿 AGG-62 订阅方列需补 B-31、B-27（B-27 只补「离职当月考勤默认确认」；S-42 已删「离职结算补休余额」订阅，补休余额由 B-15 的 PRC-178 入口 2 承接）
- name: 离职登记已撤销
  name_status: 〔缺〕沿用分片提议名
  published_by: AGG-62
  by_command: 撤销离职登记
  payload: [人员ID, 原离职日, 撤销时间]
  subscribers:
  - {type: 仅分析}
  note: S-42：B-27 与 B-31 均不订阅本事件。B-27 只在 Separated 后处置（用户 2026-10-16，已从 PRC-128 第 10 步删去该 cross_bc）；B-31 的归还待办只在 Separated 后生成，撤销发生在离职生效前，无可取消的待办，故删去订阅方 B-31（PRC-128 第 10 步同删 cross_bc）。仅当 V-15 选 b（B-13 对外发「离职已登记」让 B-31 提前生成待办）才需恢复订阅，届时随 V-15 另议
- name: 任职已变更
  published_by: AGG-63
  by_command: 建立任职 / 终止任职 / 任职变更生效
  payload: [任职ID, 人员ID, 变更类型码（建立 / 变更 / 终止）, 组织单元ID, 职位ID, 职级ID, 业务生效日]
  subscribers:
  - {type: 事件策略, who: platform.identity 重算默认角色与数据范围, used_by: PRC-136 第 9 步；PRC-83 第 3 步}
  - {type: 事件策略, who: platform.identity 标记数据范围待复核并通知区域负责人, used_by: PRC-136 第 10 步（P-31 需扩触发）}
  - {type: 流程, ref: PRC-136, who: B-15, used_by: PRC-136 第 11 步（调整薪酬档案）}
  - {type: 事件策略, who: B-13 向差旅服务商同步员工与组织, used_by: PRC-177 触发器（同 BC）}
  note: 须在业务生效日发出（U-12）：任职变更生效发出，写入未来版本的变更任职不发；离职终止任职先于 Separated 之后发出，platform.identity 对已离职人员忽略（PG-12）。聚合稿「仅分析」，订阅方列需补 platform.identity、B-15；B-27 是否订阅待 B-27 组确认（不列）
- name: 劳动合同已签订
  published_by: AGG-67
  by_command: 签订劳动合同
  payload: [劳动合同ID, 人员ID, 用人单位法人ID, 合同类型码, 期限起止, 签署日]
  subscribers:
  - {type: 事件策略, who: B-15 员工法人三口径比对预警（PRC-145）, used_by: PRC-83 第 6 步、PRC-136 第 5 步 cross_bc}
  note: 聚合稿「仅分析」，订阅方列需补 B-15（S-20）
- name: 劳动合同已终止
  published_by: AGG-67
  by_command: 终止劳动合同
  payload: [劳动合同ID, 人员ID, 终止日, 终止原因码]
  subscribers:
  - *id001
- name: 执业证书已到期
  published_by: AGG-66
  by_command: 标记执业证书已到期
  payload: [证书ID, 人员ID, 到期日]
  subscribers:
  - *id001
  note: 通知持证人与人力是 notify
consumed: []
