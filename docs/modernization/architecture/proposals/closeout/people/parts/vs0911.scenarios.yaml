# vs0911 验收场景：PRC-88、PRC-89、PRC-107、PRC-161、PRC-181、PRC-182。covers 与骨架 decision.when、超时、outcomes 文字逐字相同。

PRC-88:
  - id: PRC-88-S01
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划, 第 7 步 开立预算账户]
    covers: [审批通过, 目标类型为预算, 预算账户已开立]
    expect: 预算类经营计划经责任人审批通过后自动基线化，财务开立预算账户，流程结束
    outcome: 预算账户已开立
  - id: PRC-88-S02
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划]
    covers: [审批通过, 经营计划新版本已基线化]
    expect: 非预算类（如承诺类）计划审批通过后自动基线化并通知财务，流程结束，不开立预算账户
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S03
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 4 步 驳回经营计划审批, 第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批]
    covers: [驳回]
    expect: 责任人驳回后版本回到编制中并通知编制人，修改再提交，二次审批通过
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S04
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批]
    covers: [已撤回]
    expect: 审批未结束前编制人撤回提交，审批实例取消，版本回到编制中
    outcome: 已撤回
  - id: PRC-88-S05
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划]
    covers: [AR-11 责任人就是编制人本人]
    expect: 责任人就是编制人本人时审批改指其上级，上级通过后自动基线化
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S06
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划]
    covers: [AR-12 责任人缺位]
    expect: 归属组织单元无责任人或责任人缺位时审批改指上级组织负责人，通过后自动基线化
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S07
    path: [第 7 步 开立预算账户, 第 8 步 调整预算]
    covers: [预算期内出现调整需求, 已调整]
    expect: 账户开立后出现调整需求，财务在基线额度总额内调剂，留审计，流程结束
    outcome: 已调整
  - id: PRC-88-S08
    path: [第 7 步 开立预算账户, 第 8 步 调整预算, 第 1 步 编制经营计划版本]
    covers: [调整超出基线额度总额或要改目标值（规则拒绝）]
    expect: 调整超出已基线额度总额或要改目标值时规则拒绝，改走第 1 步编制新版本
    outcome: 规则拒绝后回到第 1 步编制新版本（无流程结局）
  - id: PRC-88-S09
    path: [第 1 步 编制经营计划版本, 第 9 步 作废经营计划草稿]
    covers: [编制人放弃编制中的草稿, 已作废]
    expect: 编制人在编制中放弃草稿，版本作废为终态，不再进入审批，留审计
    outcome: 已作废

PRC-89:
  - id: PRC-89-S01
    path: [第 1 步 编制预测版本]
    covers: [经营计划新版本已编制（预测）]
    expect: 每周触发，市场和客户经理编制预测版本，本期非现金流预测期，流程结束
    outcome: 经营计划新版本已编制（预测）
  - id: PRC-89-S02
    path: [第 1 步 编制预测版本, 第 2 步 编制现金流预测]
    covers: [本期为现金流预测期, 经营计划新版本已编制（现金流预测）]
    expect: 预测周期末编制预测版本后，财务编制现金流预测，流程结束
    outcome: 经营计划新版本已编制（现金流预测）
  - id: PRC-89-S03
    path: [第 1 步 编制预测版本]
    covers: [超时 P7D 编制预测版本逾期未报，升级提醒 SH-M1]
    expect: 7 天未提交预测版本，非中断边界计时触发，升级提醒管理层后结束于已提醒；编制任务不中断，主线照常
    outcome: 已提醒

PRC-107:
  - id: PRC-107-S01
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 5 步 发布知识条目]
    covers: [技术专家主动起草, 评审通过, 已发布]
    expect: 技术专家创建、起草并提交，专业负责人评审通过后发布，管理层收到发布通知；无复审结论则结束
    outcome: 已发布
  - id: PRC-107-S02
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 5 步 发布知识条目]
    covers: [otherwise]
    expect: 评审结论为退回，起草人收到通知后回到起草修改再提交，评审通过后发布
    outcome: 已发布
  - id: PRC-107-S03
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 5 步 发布知识条目]
    covers: [项目复盘编制人在复盘详情页决定提炼，调用创建知识条目]
    expect: 项目经理在项目复盘详情页的提炼入口调用创建知识条目，来源复盘 ID 只记录不校验，经起草、评审后发布
    outcome: 已发布
  - id: PRC-107-S04
    path: [第 5 步 发布知识条目, 第 6 步 修订知识条目]
    covers: [已发布版本有效期届满前提前量到达，提醒复审, 复审认为仍适用但内容或适用范围需更新, 已修订]
    expect: 到期前提醒复审，复审认为仍适用但需更新时修订产生新版本，本实例以已修订结束；新版本以起草中从第 2 步重新进入，发布前旧版本仍可引用
    outcome: 已修订
  - id: PRC-107-S05
    path: [第 5 步 发布知识条目, 第 7 步 废止知识条目]
    covers: [复审认为不再适用, 已废止]
    expect: 复审认为不再适用时废止，新引用被拒绝，已有引用不受影响
    outcome: 已废止
  - id: PRC-107-S06
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 5 步 发布知识条目]
    covers: [AR-11, AR-12]
    expect: 评审人为起草人本人时被拒绝；起草人就是专业负责人时由其上级评审，专业角色缺位时由上级组织负责人评审；通过后发布
    outcome: 已发布
  - id: PRC-107-S07
    path: [第 3 步 提交知识条目评审, 第 4 步 评审知识条目]
    covers: [超时 P10D 评审知识条目逾期未处理，升级提醒 SH-M1]
    expect: 评审 10 天未处理，非中断边界计时触发，升级提醒管理层负责人后结束于已提醒；评审任务不中断，主线照常（期限为估值，待用户定 8）
    outcome: 已提醒

PRC-161:
  - id: PRC-161-S01
    path: [第 1 步 关闭预算账户]
    covers: [预算账户已关闭]
    expect: 预算期届满且账户无占用中的占用行，账户置已关闭，之后不再接受占用与调剂
    outcome: 预算账户已关闭
  - id: PRC-161-S02
    path: [第 1 步 关闭预算账户]
    covers: [账户仍有占用中的占用行, 关闭待处理]
    expect: 账户仍有占用中的占用行，不关闭并告警财务，释放或消耗后重新触发
    outcome: 关闭待处理

PRC-181:
  - id: PRC-181-S01
    path: [第 1 步 创建经营复盘, 第 2 步 记录偏差解释, 第 3 步 确定经营动作, 第 4 步 定稿经营复盘, 第 5 步 完成经营动作]
    covers: [会计期间已关账, 经营复盘已闭环]
    expect: 月度关账后系统为复盘组织单元创建经营复盘，责任人解释超容忍度的偏差、确定带责任人与期限的动作并定稿，动作责任人登记完成，全部动作完成后复盘闭环
    outcome: 经营复盘已闭环
  - id: PRC-181-S02
    path: [第 1 步 创建经营复盘, 第 2 步 记录偏差解释, 第 3 步 确定经营动作, 第 4 步 定稿经营复盘]
    covers: [复盘未确定任何经营动作, 经营复盘已闭环]
    expect: 偏差均在容忍度内或责任人认定无需动作，定稿时没有动作，复盘直接闭环
    outcome: 经营复盘已闭环
  - id: PRC-181-S03
    path: [第 1 步 创建经营复盘, 第 2 步 记录偏差解释, 第 3 步 确定经营动作, 第 4 步 定稿经营复盘]
    covers: [经营动作含调整经营计划, 已转调整计划]
    expect: 动作中含调整经营计划类，定稿后转 PRC-88（经营复盘后调整计划）由编制人另起新版本并引用该动作；其余动作随复盘记录继续跟踪
    outcome: 已转调整计划
  - id: PRC-181-S04
    path: [第 1 步 创建经营复盘, 第 2 步 记录偏差解释, 第 3 步 确定经营动作, 第 4 步 定稿经营复盘, 第 5 步 完成经营动作, 第 5 步 完成经营动作]
    covers: [仍有未完成的经营动作, 经营复盘已闭环]
    expect: 有多个动作时，每登记一个完成后若仍有未完成的动作则继续跟踪，最后一个完成后复盘闭环
    outcome: 经营复盘已闭环
  - id: PRC-181-S05
    path: [第 1 步 创建经营复盘]
    covers: [复盘期间尚未关账, 复盘待期间关账]
    expect: 季度或年度综合复盘到点而期间尚未关账，不创建复盘并告警财务；期间关账后由月度触发补建
    outcome: 复盘待期间关账
  - id: PRC-181-S06
    path: [第 5 步 完成经营动作]
    covers: [超时 各经营动作自带的期限 经营动作逾期未完成，系统提醒复盘责任人]
    expect: 动作到期未完成，非中断边界计时触发，提醒复盘责任人后结束于已提醒；动作不自动完成也不自动取消，主线照常
    outcome: 已提醒

PRC-182:
  - id: PRC-182-S01
    path: 已发布知识条目被报价版本、服务产品版本、交付物引用
    outcome: null
    covers:
      - 被引用次数
    expect: 按知识条目版本 × 引用方类型汇总被引用次数，同一引用方单据去重，显示最近一次被引用日
  - id: PRC-182-S02
    path: 知识条目版本有效期临近届满且统计窗口内仍有引用
    outcome: null
    covers:
      - 建议复审修订
    expect: 列入建议复审修订，只提示不改状态；修订在 PRC-107 由技术专家发起
  - id: PRC-182-S03
    path: 知识条目版本有效期已届满或统计窗口内无引用，且无后继版本
    outcome: null
    covers:
      - 建议废止
    expect: 列入建议废止，只提示不改状态；废止在 PRC-107 由技术专家发起
  - id: PRC-182-S04
    path: 知识条目版本已废止
    outcome: null
    covers:
      - 已废止
    expect: 既有引用仍计入被引用次数，不再出现新增引用（INV-115）；条目退出建议清单
