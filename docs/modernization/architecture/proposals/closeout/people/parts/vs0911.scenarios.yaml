# vs0911 验收场景：PRC-88、PRC-89、PRC-107。covers 与骨架 decision.when、超时、outcomes 文字逐字相同。

PRC-88:
  - id: PRC-88-S01
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划, 第 7 步 开立预算账户]
    covers: [审批通过, 目标类型为预算, 预算账户已开立]
    expect: 预算类经营计划经责任人审批通过后自动基线化，财务开立预算账户，流程结束
    outcome: 预算账户已开立
  - id: PRC-88-S02
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划]
    covers: [审批通过, 经营计划新版本已基线化]
    expect: 非预算类（如承诺类）计划审批通过后自动基线化并通知财务，流程结束，不开立预算账户
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S03
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 4 步 驳回经营计划审批, 第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批]
    covers: [驳回]
    expect: 责任人驳回后版本回到编制中并通知编制人，修改再提交，二次审批通过
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S04
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批]
    covers: [已撤回]
    expect: 审批未结束前编制人撤回提交，审批实例取消，版本回到编制中
    outcome: 已撤回
  - id: PRC-88-S05
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划]
    covers: [AR-11 责任人就是编制人本人]
    expect: 责任人就是编制人本人时审批改指其上级，上级通过后自动基线化
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S06
    path: [第 1 步 编制经营计划版本, 第 2 步 提交经营计划审批, 第 3 步 经营计划审批, 第 5 步 通过经营计划审批, 第 6 步 基线化经营计划]
    covers: [AR-12 责任人缺位]
    expect: 归属组织单元无责任人或责任人缺位时审批改指上级组织负责人，通过后自动基线化
    outcome: 经营计划新版本已基线化
  - id: PRC-88-S07
    path: [第 7 步 开立预算账户, 第 8 步 调整预算]
    covers: [预算期内出现调整需求, 已调整]
    expect: 账户开立后出现调整需求，财务在基线额度总额内调剂，留审计，流程结束
    outcome: 已调整
  - id: PRC-88-S08
    path: [第 7 步 开立预算账户, 第 8 步 调整预算, 第 1 步 编制经营计划版本]
    covers: [调整超出基线额度总额或要改目标值（规则拒绝）]
    expect: 调整超出已基线额度总额或要改目标值时规则拒绝，改走第 1 步编制新版本
    outcome: 规则拒绝后回到第 1 步编制新版本（无流程结局）
  - id: PRC-88-S09
    path: [第 1 步 编制经营计划版本, 第 9 步 作废经营计划草稿]
    covers: [编制人放弃编制中的草稿, 已作废]
    expect: 编制人在编制中放弃草稿，版本作废为终态，不再进入审批，留审计
    outcome: 已作废

PRC-89:
  - id: PRC-89-S01
    path: [第 1 步 编制预测版本]
    covers: [经营计划新版本已编制（预测）]
    expect: 每周触发，市场和客户经理编制预测版本，本期非现金流预测期，流程结束
    outcome: 经营计划新版本已编制（预测）
  - id: PRC-89-S02
    path: [第 1 步 编制预测版本, 第 2 步 编制现金流预测]
    covers: [本期为现金流预测期, 经营计划新版本已编制（现金流预测）]
    expect: 预测周期末编制预测版本后，财务编制现金流预测，流程结束
    outcome: 经营计划新版本已编制（现金流预测）
  - id: PRC-89-S03
    path: [第 1 步 编制预测版本]
    covers: [超时 P7D 编制预测版本逾期未报，升级提醒 SH-M1]
    expect: 7 天未提交预测版本，非中断边界计时触发，升级提醒管理层后结束于已提醒；编制任务不中断，主线照常
    outcome: 已提醒

PRC-107:
  - id: PRC-107-S01
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 6 步 发布知识条目]
    covers: [评审通过, 已发布]
    expect: 技术专家创建、起草并提交，专业负责人评审通过后发布，无后续事件结束
    outcome: 已发布
  - id: PRC-107-S02
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 5 步 退回知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 6 步 发布知识条目]
    covers: [退回]
    expect: 评审退回起草并通知起草人，修改后再提交，评审通过后发布
    outcome: 已发布
  - id: PRC-107-S03
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 6 步 发布知识条目]
    covers: [项目复盘编制人决定提炼，调用创建知识条目]
    expect: 项目经理在项目复盘详情页的提炼入口调用创建知识条目，经起草、评审后发布
    outcome: 已发布
  - id: PRC-107-S04
    path: [第 6 步 发布知识条目, 第 7 步 修订知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目, 第 6 步 发布知识条目]
    covers: [有效期届满或适用范围变化且仍适用]
    expect: 有效期届满或适用范围变化且仍适用时修订产生新版本，重新评审后发布
    outcome: 已发布
  - id: PRC-107-S05
    path: [第 6 步 发布知识条目, 第 8 步 废止知识条目]
    covers: [有效期届满且不再适用, 已废止]
    expect: 有效期届满且不再适用时废止，废止后不得被新引用，已有引用不受影响
    outcome: 已废止
  - id: PRC-107-S06
    path: [第 1 步 创建知识条目, 第 2 步 起草知识条目, 第 3 步 提交知识条目评审, 第 4 步 评审知识条目]
    covers: [AR-11 起草人就是归属责任人]
    expect: 评审人为起草人本人时被规则拒绝，评审改指其上级；通过后进入发布
    outcome: 已发布

PRC-161:
  - id: PRC-161-S01
    path: [第 1 步 关闭预算账户]
    covers: [预算账户已关闭]
    expect: 预算期届满且账户无占用中的占用行，账户置已关闭，之后不再接受占用与调剂
    outcome: 预算账户已关闭
  - id: PRC-161-S02
    path: [第 1 步 关闭预算账户]
    covers: [账户仍有占用中的占用行, 关闭待处理]
    expect: 账户仍有占用中的占用行，不关闭并告警财务，释放或消耗后重新触发
    outcome: 关闭待处理
