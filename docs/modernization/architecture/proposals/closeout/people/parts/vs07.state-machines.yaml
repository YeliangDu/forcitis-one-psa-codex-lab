# B-13 状态机（收敛产物，提议稿）。每聚合一台机器（AGG-62、AGG-63 内两个子生命周期合成一台，状态名带前缀，各子生命周期以 from: null 的创建转换为入口）。
# kind：forward 正向；reverse 逆向（驳回、撤回、撤销、放弃、恢复）；non_state 只追加记录、不改状态的自环。from 为 null = 创建。守卫引用 INV（聚合稿）、R-nn（vs07.notes.md 规则候选，交 one-rules）、AR（APPROVAL_RULES）。
# perpetual: true = 配置型长期存续的根，无终态（反复维护），不适用「非终态能到终态」。
# process_steps：PRC-79–85、128、136 每个改聚合状态的步骤对应的转换（also = 同一步骤对应的另外转换，如同事务改两个子生命周期或分支）；
#   PRC-84、85 的 B-15 / AGG-106 步骤、PRC-136 第 11–12 步的转换在 vs13pay.state-machines.yaml，这里只指引。
# 自检（可达性、非终态到终态、流程步骤对转换）见 vs07conv.notes.md「收敛自检」。

bc: B-13
machines:
- aggregate: AGG-60
  machine: legal_entity
  entity: legal_entities
  states: [有效, 已停用]
  initial: []
  terminal: []
  perpetual: true
  reason: "法人主体只增不删、可停用可启用，长期存在，无业务终结"
  note: 根只留代码，名称与状态随版本表；聚合稿只列登记法人主体，更名 / 停用 / 启用三条〔缺〕命令取自词表事件（法人主体已更名 / 已停用 / 已启用），经对象增删改查检查补入（vs07.notes.md 结构问题 19）；词表区分已登记与已启用，本稿登记即有效；代码更正（仅未发号前，INV-59）按已建代码补「更正法人主体代码」，状态不变
  transitions:
  - from: null
    to: 有效
    command: 登记法人主体
    guard: [INV-59]
    kind: forward
  - from: 有效
    to: 有效
    command: 更名法人主体
    guard: [INV-59：代码不改]
    kind: forward
    note: 追加名称版本
  - from: 有效
    to: 已停用
    command: 停用法人主体
    guard: []
    kind: forward
  - from: 已停用
    to: 有效
    command: 启用法人主体
    guard: []
    kind: reverse
  - from: 有效
    to: 有效
    command: 更正法人主体代码
    guard: [INV-59：仅代码未发号时]
    kind: non_state
    note: 恢复
- aggregate: AGG-61
  machine: org_unit
  entity: org_units
  states:
  - 已启用
  - 已停用
  - {name: 已撤销, terminal: true}
  initial: []
  note: 状态取数据模型「启用 / 停用 / 撤销」；调整组织单元一条命令按「调整类型」参数新建、变更、停用、恢复、撤销（聚合稿只有这一条命令）；已撤销与停用是两个不同状态（RULE-355）
  transitions:
  - from: null
    to: 已启用
    command: 调整组织单元
    guard: []
    kind: forward
    note: 新建
  - from: 已启用
    to: 已启用
    command: 调整组织单元
    guard: []
    kind: forward
    note: 变更名称、上级、负责人、单元类型
  - from: 已启用
    to: 已停用
    command: 调整组织单元
    guard: []
    kind: forward
  - from: 已停用
    to: 已启用
    command: 调整组织单元
    guard: []
    kind: reverse
    note: 恢复启用
  - from: 已启用
    to: 已撤销
    command: 调整组织单元
    guard: [INV-60：下有在职任职则拒绝]
    kind: forward
  - from: 已停用
    to: 已撤销
    command: 调整组织单元
    guard: [INV-60]
    kind: forward
- aggregate: AGG-117
  machine: legal_entity_attribution
  entity: legal_entity_attributions
  states: [已指定]
  initial: []
  terminal: []
  perpetual: true
  reason: "归属对象的期间聚合，期间在版本表追加，历史只能关闭不能改写，随归属对象长期存续，无生命周期终态"
  note: 根是归属对象（部门或员工）的期间聚合，期间在版本表追加，历史只能关闭不能改写；无生命周期终态
  transitions:
  - from: null
    to: 已指定
    command: 指定法人归属
    guard: [INV-122]
    kind: forward
  - from: 已指定
    to: 已指定
    command: 指定法人归属
    guard: [INV-122：新期间只能从最近一段开始日之后起算]
    kind: forward
  - from: 已指定
    to: 已指定
    command: 更正法人归属
    guard: [INV-122：仅已关闭期间的结束日，只追加更正行]
    kind: non_state
  - from: 已指定
    to: 已指定
    command: 结束法人归属
    guard: [INV-122：只关闭当前期间, 操作人不得终止本人归属]
    kind: non_state
    note: 关闭当前期间，聚合随归属对象长期存续
- aggregate: AGG-64
  machine: job_catalog_entry
  entity: jobs
  states:
  - 已启用
  - {name: 已停用, terminal: true}
  initial: [已启用]
  note: 新建 / 修改命令聚合稿缺（vs07.notes.md 结构问题 8），经对象增删改查检查补〔缺〕新建岗位、修改岗位（结构问题 19）；初始目录仍由初始化录入；职级、职位族暂随本聚合不拆（S-10）
  transitions:
  - from: null
    to: 已启用
    command: 新建岗位
    guard: []
    kind: forward
  - from: 已启用
    to: 已启用
    command: 修改岗位
    guard: []
    kind: forward
    note: 追加版本
  - from: 已启用
    to: 已停用
    command: 停用岗位
    guard: [INV-63]
    kind: forward
- aggregate: AGG-65
  machine: recruitment_requisition
  entity: recruitment_requisitions
  states:
  - 草稿
  - 已提交
  - 已批准
  - {name: 已关闭, terminal: true}
  initial: [草稿]
  note: 草稿来自编辑页保存或迁入，保存草稿不是领域命令；聚合稿状态「已驳回」「招聘中」本稿不设：v1 以关闭代驳回，进入「招聘中」的命令聚合稿与分片均缺（PG-08），见 vs07conv.notes.md 结构问题 2
  transitions:
  - from: 草稿
    to: 已提交
    command: 提交招聘需求
    guard: [R-01]
    kind: forward
  - from: 已提交
    to: 已批准
    command: 批准招聘需求
    guard: [AR-11, AR-12, 提出人 ≠ 批准人]
    kind: forward
    process_outcome: 已批准
  - from: 已提交
    to: 已关闭
    command: 关闭招聘需求
    guard: [批准人驳回，或提出人撤回]
    kind: reverse
    process_outcome: 已关闭
  - from: 已批准
    to: 已关闭
    command: 关闭招聘需求
    guard: [取消或录满（PG-08：录满无触发）]
    kind: forward
    process_outcome: 已关闭
- aggregate: AGG-62
  machine: person
  entity: employees / employment_versions / interviews / hiring_decisions / separation_requests
  sub_machines: [人员, 离职申请]
  states:
  - 人员:候选人
  - 人员:待答复
  - 人员:录用已确认
  - 人员:待入职
  - 人员:试用期
  - 人员:正式
  - 人员:待离职
  - {name: '人员:未录用', terminal: true}
  - {name: '人员:候选人已放弃', terminal: true}
  - {name: '人员:已离职', terminal: true}
  - 离职申请:已申请
  - 离职申请:已受理
  - 离职申请:已批准
  - 离职申请:已登记
  - {name: '离职申请:已驳回', terminal: true}
  - {name: '离职申请:已撤回', terminal: true}
  - {name: '离职申请:已生效', terminal: true}
  - {name: '离职申请:已撤销', terminal: true}
  initial: []
  note: '同一聚合两个子生命周期合成一台（状态名带「人员:」「离职申请:」前缀，各子生命周期以 from: null 的创建转换为入口）。人员:试用期 / 正式 都是在职（词表「在职」Employed）；停薪留职（数据模型状态列）无命令，本稿不设。办理离职、离职生效、撤销离职登记同事务改两个子生命周期，各列两条转换'
  transitions:
  - from: null
    to: 人员:候选人
    command: 登记候选人
    guard: [T-5：个人信息保护]
    kind: forward
  - from: 人员:候选人
    to: 人员:候选人
    command: 记录面试
    guard: [面试轮次追加，不改状态]
    kind: non_state
  - from: 人员:候选人
    to: 人员:待答复
    command: 作出录用决定
    guard: [R-02：拟任职位须启用, V-8：不另设审批]
    kind: forward
  - from: 人员:待答复
    to: 人员:录用已确认
    command: 登记候选人答复
    guard: [答复为接受并确认入职日, V-19：答复期限提醒]
    kind: forward
  - from: 人员:待答复
    to: 人员:候选人已放弃
    command: 登记候选人答复
    guard: [答复为放弃]
    kind: reverse
    process_outcome: 候选人已放弃
  - from: 人员:候选人
    to: 人员:未录用
    command: 标记未录用
    guard: [面试结论为不通过]
    kind: forward
    process_outcome: 未录用
  - from: 人员:录用已确认
    to: 人员:待入职
    command: 登记入职
    guard: [U-12：入职日为人事业务生效日]
    kind: forward
  - from: null
    to: 人员:待入职
    command: 登记入职
    guard: [非招聘入职（调入、返聘）无候选阶段，直接登记〔推〕]
    kind: forward
  - from: 人员:待入职
    to: 人员:试用期
    command: 入职生效
    guard: [U-12：入职日到达, 用工约定含试用期]
    kind: forward
  - from: 人员:待入职
    to: 人员:正式
    command: 入职生效
    guard: [U-12：入职日到达, 用工约定无试用期（如实习、退休返聘）〔推〕]
    kind: forward
  - from: 人员:试用期
    to: 人员:正式
    command: 办理转正
    guard: [P-46：转正前读评估，结论是输入不是拒绝条件]
    kind: forward
    process_outcome: 已转正
  - from: 人员:试用期
    to: 人员:待离职
    command: 办理离职
    guard: [离职申请为已受理或已批准, U-12]
    kind: forward
  - from: 人员:正式
    to: 人员:待离职
    command: 办理离职
    guard: [离职申请为已受理或已批准, U-12]
    kind: forward
  - from: 人员:待离职
    to: 人员:已离职
    command: 离职生效
    guard: [U-12：离职日结束, G-2：发 Separated 即吊销会话]
    kind: forward
    process_outcome: 离职已生效
  - from: 人员:待离职
    to: 人员:试用期
    command: 撤销离职登记
    guard: [离职日前；回到登记前状态]
    kind: reverse
  - from: 人员:待离职
    to: 人员:正式
    command: 撤销离职登记
    guard: [离职日前；回到登记前状态]
    kind: reverse
  - from: null
    to: 离职申请:已申请
    command: 申请离职
    guard: [来源为公司终止：依据与原因类别必填, 人员为试用期或正式且无进行中申请]
    kind: forward
  - from: null
    to: 离职申请:已受理
    command: 申请离职
    guard: [来源为员工：自动受理（V-20）, R-03：期望离职日早于法定通知期只预警]
    kind: forward
  - from: 离职申请:已申请
    to: 离职申请:已批准
    command: 批准公司终止
    guard: [AR-11, AR-12, 发起人 ≠ 批准人]
    kind: forward
  - from: 离职申请:已申请
    to: 离职申请:已驳回
    command: 驳回公司终止
    guard: []
    kind: reverse
    process_outcome: 终止已驳回
  - from: 离职申请:已受理
    to: 离职申请:已撤回
    command: 撤回离职申请
    guard: [登记离职日前, 仅申请人（人力代录入的由人力代撤回）]
    kind: reverse
    process_outcome: 离职申请已撤回
  - from: 离职申请:已受理
    to: 离职申请:已登记
    command: 办理离职
    guard: [V-1：离职日语义]
    kind: forward
  - from: 离职申请:已批准
    to: 离职申请:已登记
    command: 办理离职
    guard: [V-1：离职日语义]
    kind: forward
  - from: 离职申请:已登记
    to: 离职申请:已生效
    command: 离职生效
    guard: [U-12]
    kind: forward
  - from: 离职申请:已登记
    to: 离职申请:已撤销
    command: 撤销离职登记
    guard: [离职日前；离职日后不可撤销]
    kind: reverse
    process_outcome: 离职登记已撤销
- aggregate: AGG-63
  machine: assignment
  entity: assignments / assignment_versions
  sub_machines: [任职, 调岗申请]
  states:
  - 任职:生效中
  - 任职:变更待生效
  - {name: '任职:已终止', terminal: true}
  - 调岗申请:已提交
  - 调岗申请:已批准
  - 调岗申请:已写入
  - {name: '调岗申请:已驳回', terminal: true}
  - {name: '调岗申请:已生效', terminal: true}
  initial: []
  note: '同一聚合两个子生命周期合成一台（前缀「任职:」「调岗申请:」，各以 from: null 为入口）。任职是版本化对象（D6），「任职:变更待生效」表示已写入未来版本、未到业务生效日；变更任职、任职变更生效同事务改两个子生命周期。数据模型无调岗申请表（vs07conv.notes.md 结构问题 5）'
  transitions:
  - from: null
    to: 任职:生效中
    command: 建立任职
    guard: [INV-62, INV-63, INV-60]
    kind: forward
  - from: 任职:生效中
    to: 任职:已终止
    command: 终止任职
    guard: [区间止于离职日]
    kind: forward
  - from: null
    to: 调岗申请:已提交
    command: 提交调岗申请
    guard: [INV-63, INV-60]
    kind: forward
  - from: 调岗申请:已提交
    to: 调岗申请:已批准
    command: 批准调岗申请
    guard: [AR-11, AR-12, 提交人 ≠ 批准人]
    kind: forward
  - from: 调岗申请:已提交
    to: 调岗申请:已驳回
    command: 驳回调岗申请
    guard: [批准人驳回，或提交人撤回]
    kind: reverse
    process_outcome: 已驳回
  - from: 任职:生效中
    to: 任职:变更待生效
    command: 变更任职
    guard: [INV-62：原子关旧开新，主任职不重叠, 跨法人：新劳动合同已签订]
    kind: forward
  - from: 调岗申请:已批准
    to: 调岗申请:已写入
    command: 变更任职
    guard: [调岗申请为已批准]
    kind: forward
  - from: 任职:变更待生效
    to: 任职:生效中
    command: 任职变更生效
    guard: [U-12：业务生效日到达]
    kind: forward
  - from: 调岗申请:已写入
    to: 调岗申请:已生效
    command: 任职变更生效
    guard: [U-12]
    kind: forward
    process_outcome: 调岗已生效
- aggregate: AGG-66
  machine: practice_certificate
  entity: practice_certificates
  states:
  - 有效
  - {name: 已到期, terminal: true}
  - {name: 已注销, terminal: true}
  initial: [有效]
  note: 登记注册执业证书、注销注册执业证书聚合稿缺，经对象增删改查检查补〔缺〕命令（vs07.notes.md 结构问题 19），对应数据模型状态列「有效 / 到期 / 注销」；迁入的存量证书仍直接为有效
  transitions:
  - from: null
    to: 有效
    command: 登记注册执业证书
    guard: [INV-47]
    kind: forward
    process_outcome: 证书已登记
  - from: 有效
    to: 已注销
    command: 注销注册执业证书
    guard: [证书为有效]
    kind: forward
    process_outcome: 证书已注销
  - from: 有效
    to: 有效
    command: 登记继续教育学时
    guard: [按注册期累计，追加不改写]
    kind: non_state
    process_outcome: 学时已登记
  - from: 有效
    to: 有效
    command: 延续注册执业证书
    guard: [V-14：学时未达标只预警，不拒绝]
    kind: forward
    process_outcome: 证书已延续
  - from: 有效
    to: 已到期
    command: 标记执业证书已到期
    guard: [有效期届满且无新注册期]
    kind: forward
    process_outcome: 执业证书已到期
- aggregate: AGG-67
  machine: labor_contract
  entity: labor_contracts
  states:
  - 草案
  - 审批中
  - 已批准
  - 已签署生效
  - {name: 已终止, terminal: true}
  initial: [草案]
  note: 草案来自编辑页保存，保存草案不是领域命令；续订另立新合同。跨法人调动的新合同在 R-04 通过时由草案直接进入已批准（免二次批准）。「已完成 / 已结算」不适用
  transitions:
  - from: 草案
    to: 审批中
    command: 提交劳动合同
    guard: [INV-14, 常规入职合同（非跨法人调动）]
    kind: forward
  - from: 草案
    to: 已批准
    command: 提交劳动合同
    guard: [INV-14, R-04：跨法人调动，合同要素与已批准调岗一致]
    kind: forward
  - from: 审批中
    to: 已批准
    command: 批准劳动合同
    guard: [AR-11, AR-12, 提交人 ≠ 批准人]
    kind: forward
  - from: 审批中
    to: 草案
    command: 驳回劳动合同
    guard: []
    kind: reverse
  - from: 已批准
    to: 已签署生效
    command: 签订劳动合同
    guard: [INV-14, P-05：满一个月未签只提醒]
    kind: forward
    process_outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
  - from: 已签署生效
    to: 已签署生效
    command: 登记劳动合同终止依据
    guard: [依据文件线下签署或送达]
    kind: non_state
  - from: 已签署生效
    to: 已终止
    command: 终止劳动合同
    guard: [终止日 = 离职日或调动生效日]
    kind: forward
process_steps:
- process: PRC-80
  step: 2
  command: 登记法人主体
  machine: legal_entity
  transition: [null, 有效]
  outcome: 已维护
- process: PRC-80
  step: 3
  command: 调整组织单元
  machine: org_unit
  transition: [null, 已启用]
  also:
  - [已启用, 已启用]
  - [已启用, 已撤销]
  outcome: 已维护
  rule_reject: 撤销下仍有在职任职被 INV-60 拒绝，退回本步，不产生转换
- process: PRC-80
  step: 4
  command: 指定法人归属
  machine: legal_entity_attribution
  transition: [null, 已指定]
  also:
  - [已指定, 已指定]
  outcome: 已维护
  rule_reject: 期间重叠被 INV-122 拒绝，退回本步
- process: PRC-80
  step: 5
  command: 停用岗位
  machine: job_catalog_entry
  transition: [已启用, 已停用]
  outcome: 已维护
  rule_reject: 仍被在职任职引用被 INV-63 拒绝，退回本步
- process: PRC-80
  step: 7
  command: 更名法人主体
  machine: legal_entity
  transition: [有效, 有效]
  outcome: 已维护
- process: PRC-80
  step: 8
  command: 停用法人主体
  machine: legal_entity
  transition: [有效, 已停用]
  outcome: 已维护
- process: PRC-80
  step: 9
  command: 启用法人主体
  machine: legal_entity
  transition: [已停用, 有效]
  outcome: 已维护
- process: PRC-80
  step: 10
  command: 新建岗位
  machine: job_catalog_entry
  transition: [null, 已启用]
  outcome: 已维护
- process: PRC-80
  step: 11
  command: 修改岗位
  machine: job_catalog_entry
  transition: [已启用, 已启用]
  outcome: 已维护
- process: PRC-80
  step: 12
  command: 更正法人归属
  machine: legal_entity_attribution
  transition: [已指定, 已指定]
  outcome: 已维护
  rule_reject: 更正后期间重叠被 INV-122 拒绝，退回本步
- process: PRC-80
  step: 13
  command: 结束法人归属
  machine: legal_entity_attribution
  transition: [已指定, 已指定]
  outcome: 已维护
  rule_reject: 无当前归属被拒绝，退回本步
- process: PRC-80
  step: 14
  command: 更正法人主体代码
  machine: legal_entity
  transition: [有效, 有效]
  outcome: 已维护
  rule_reject: 已发号被 INV-59 拒绝，退回本步
- process: PRC-81
  step: 2
  command: 提交招聘需求
  machine: recruitment_requisition
  transition: [草稿, 已提交]
- process: PRC-81
  step: 3
  command: 批准招聘需求
  machine: recruitment_requisition
  transition: [已提交, 已批准]
  outcome: 已批准
- process: PRC-81
  step: 4
  command: 关闭招聘需求
  machine: recruitment_requisition
  transition: [已提交, 已关闭]
  also:
  - [已批准, 已关闭]
  outcome: 已关闭
  note: 第 2 步 withdraw 边与第 3 步驳回出口都进入本步
- process: PRC-82
  step: 1
  command: 登记候选人
  machine: person
  transition: [null, '人员:候选人']
- process: PRC-82
  step: 2
  command: 记录面试
  machine: person
  transition: ['人员:候选人', '人员:候选人']
- process: PRC-82
  step: 3
  command: 作出录用决定
  machine: person
  transition: ['人员:候选人', '人员:待答复']
- process: PRC-82
  step: 4
  command: 登记候选人答复
  machine: person
  transition: ['人员:待答复', '人员:录用已确认']
  also:
  - ['人员:待答复', '人员:候选人已放弃']
  outcome: 候选人已放弃
  note: 接受 → 录用决定已作出 → PRC-83；放弃 → 以候选人已放弃结束
- process: PRC-82
  step: 5
  command: 标记未录用
  machine: person
  transition: ['人员:候选人', '人员:未录用']
  outcome: 未录用
- process: PRC-83
  step: 1
  command: 登记入职
  machine: person
  transition: ['人员:录用已确认', '人员:待入职']
  also:
  - [null, '人员:待入职']
- process: PRC-83
  step: 2
  command: 入职生效
  machine: person
  transition: ['人员:待入职', '人员:试用期']
  also:
  - ['人员:待入职', '人员:正式']
- process: PRC-83
  step: 3
  command: 建立任职
  machine: assignment
  transition: [null, '任职:生效中']
  rule_reject: 主任职区间重叠被 INV-62 拒绝，退回本步
- process: PRC-83
  step: 4
  command: 提交劳动合同
  machine: labor_contract
  transition: [草案, 审批中]
  rule_reject: 试用期超限被 INV-14 拒绝，退回本步
- process: PRC-83
  step: 5
  command: 批准劳动合同
  machine: labor_contract
  transition: [审批中, 已批准]
  note: 驳回出口（on_reject 退回第 4 步）对应驳回劳动合同：审批中 → 草案
- process: PRC-83
  step: 6
  command: 签订劳动合同
  machine: labor_contract
  transition: [已批准, 已签署生效]
  outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
- process: PRC-84
  step: 1
  command: 参保增员
  machine: AGG-74:insurance_enrollment（vs13pay）
  transition: [null, 在缴]
  note: B-15 聚合，转换在 vs13pay.state-machines.yaml
- process: PRC-84
  step: 2
  command: 建立薪酬档案
  machine: AGG-93:compensation_profile（vs13pay）
  transition: [null, 已生效]
  outcome: 社保与公积金参保在缴，薪酬档案已建立
  note: B-15 聚合，转换在 vs13pay.state-machines.yaml
- process: PRC-85
  step: 1
  command: 编制试用期绩效评估
  machine: AGG-106:performance_review（vs13pay）
  transition: [null, 草拟]
  note: 转换已在 vs13pay.state-machines.yaml，齐全
- process: PRC-85
  step: 2
  command: 确认绩效评估
  machine: AGG-106:performance_review（vs13pay）
  transition: [草拟, 已确认]
  note: 试用期评估无提交环节〔推〕，转换已在 vs13pay
- process: PRC-85
  step: 3
  command: 办理转正
  machine: person
  transition: ['人员:试用期', '人员:正式']
  outcome: 已转正
  note: 决定「公司决定不予转正」转 PRC-128，不改本机状态
- process: PRC-79
  step: 登记注册执业证书
  command: 登记注册执业证书
  machine: practice_certificate
  transition: [null, 有效]
  outcome: 证书已登记
- process: PRC-79
  step: 注销注册执业证书
  command: 注销注册执业证书
  machine: practice_certificate
  transition: [有效, 已注销]
  outcome: 证书已注销
- process: PRC-79
  step: 登记继续教育学时
  command: 登记继续教育学时
  machine: practice_certificate
  transition: [有效, 有效]
  outcome: 学时已登记
- process: PRC-79
  step: 延续注册执业证书
  command: 延续注册执业证书
  machine: practice_certificate
  transition: [有效, 有效]
  outcome: 证书已延续
- process: PRC-79
  step: 标记执业证书已到期
  command: 标记执业证书已到期
  machine: practice_certificate
  transition: [有效, 已到期]
  outcome: 执业证书已到期
- process: PRC-128
  step: 1
  command: 申请离职
  machine: person
  transition: [null, '离职申请:已受理']
  also:
  - [null, '离职申请:已申请']
  note: 来源=员工 → 已受理；来源=公司终止 → 已申请；withdraw 边进入第 4 步
- process: PRC-128
  step: 2
  command: 批准公司终止
  machine: person
  transition: ['离职申请:已申请', '离职申请:已批准']
- process: PRC-128
  step: 3
  command: 驳回公司终止
  machine: person
  transition: ['离职申请:已申请', '离职申请:已驳回']
  outcome: 终止已驳回
- process: PRC-128
  step: 4
  command: 撤回离职申请
  machine: person
  transition: ['离职申请:已受理', '离职申请:已撤回']
  outcome: 离职申请已撤回
- process: PRC-128
  step: 5
  command: 登记劳动合同终止依据
  machine: labor_contract
  transition: [已签署生效, 已签署生效]
- process: PRC-128
  step: 6
  command: 办理离职
  machine: person
  transition: ['离职申请:已受理', '离职申请:已登记']
  also:
  - ['离职申请:已批准', '离职申请:已登记']
  - ['人员:试用期', '人员:待离职']
  - ['人员:正式', '人员:待离职']
- process: PRC-128
  step: 7
  command: 离职生效
  machine: person
  transition: ['人员:待离职', '人员:已离职']
  also:
  - ['离职申请:已登记', '离职申请:已生效']
- process: PRC-128
  step: 8
  command: 终止任职
  machine: assignment
  transition: ['任职:生效中', '任职:已终止']
- process: PRC-128
  step: 9
  command: 终止劳动合同
  machine: labor_contract
  transition: [已签署生效, 已终止]
  outcome: 离职已生效
- process: PRC-128
  step: 10
  command: 撤销离职登记
  machine: person
  transition: ['离职申请:已登记', '离职申请:已撤销']
  also:
  - ['人员:待离职', '人员:试用期']
  - ['人员:待离职', '人员:正式']
  outcome: 离职登记已撤销
- process: PRC-136
  step: 1
  command: 提交调岗申请
  machine: assignment
  transition: [null, '调岗申请:已提交']
  rule_reject: 新职位已停用或新组织单元已撤销被 INV-63 / INV-60 拒绝，退回本步
  note: withdraw 边进入第 3 步
- process: PRC-136
  step: 2
  command: 批准调岗申请
  machine: assignment
  transition: ['调岗申请:已提交', '调岗申请:已批准']
- process: PRC-136
  step: 3
  command: 驳回调岗申请
  machine: assignment
  transition: ['调岗申请:已提交', '调岗申请:已驳回']
  outcome: 已驳回
- process: PRC-136
  step: 4
  command: 提交劳动合同
  machine: labor_contract
  transition: [草案, 已批准]
  rule_reject: 试用期超限或要素与调岗不一致被 INV-14 / R-04 拒绝，退回本步
  note: 跨法人分支；R-04 通过免二次批准
- process: PRC-136
  step: 5
  command: 签订劳动合同
  machine: labor_contract
  transition: [已批准, 已签署生效]
- process: PRC-136
  step: 6
  command: 变更任职
  machine: assignment
  transition: ['任职:生效中', '任职:变更待生效']
