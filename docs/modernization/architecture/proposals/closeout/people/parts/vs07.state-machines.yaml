- process: PRC-136
  step: 7
  command: 任职变更生效
  machine: assignment
  transition: ['任职:变更待生效', '任职:生效中']
  also:
  - ['调岗申请:已写入', '调岗申请:已生效']
  outcome: 调岗已生效
- process: PRC-136
  step: 8
  command: 终止劳动合同
  machine: labor_contract
  transition: [已签署生效, 已终止]
- process: PRC-136
  step: 11
  command: 调整薪酬档案
  machine: AGG-93:compensation_profile（vs13pay）
  transition: [已生效, 已结束]
  also:
  - [null, 已生效]
  outcome: 调岗已生效
  note: B-15 聚合，转换在 vs13pay
- process: PRC-136
  step: 12
  command: 变更参保缴纳主体
  machine: AGG-74:insurance_enrollment（vs13pay）
  transition: [在缴, 已减员]
  also:
  - [null, 在缴]
  outcome: 调岗已生效
  note: B-15 聚合，〔缺〕命令与转换已在 vs13pay
- {process: 平台步骤, step: PRC-80 第 6 步、PRC-136 第 9–10 步、PRC-137、PRC-138、PRC-129, command: （platform.identity，见 vs07.commands.yaml 平台命令清单）, machine: null, transition: null, note: 平台任务，不改 B-13 聚合状态，不做状态机}
- process: 事件策略
  step: 入职日到点生效
  command: 入职生效
