# VS-13 获得报酬流程骨架（vs13 子代理，铺开；质检修订版，用户新原则：能规则化的不设人工审批）。字段依 closeout/CONVENTIONS.md（含第 5 节）；v1 字段原样保留，只增补，审批取舍造成的 human_orchestration 变化见 notes 格式问题。
# v1 的中文 actor 已换成 SH- 编号：员工 SH-E3；部门负责人 / 用人经理 SH-E1；人力 / 财务 / 财务主管 SH-E6（内部分岗用行尾注释）；管理层 SH-M1；系统策略 system；平台任务 platform。
# 命令名写〔缺〕表示聚合稿 §2.2 没有，不假装存在，见 vs13.notes.md「新用语」。
# 已定口径：考勤打卡来自企业微信（intent 2026-10-16-152603）；薪酬新系统自算；个税公司代扣代缴；一次投产、全部历史迁入（U-1–U-4）；A8 行政流程迁入走通用审批（C-3–C-7）。
# 审批取舍（本稿）：取消 3 个人工节点（加班批准、月度考勤人力锁定与代确认、奖金草拟）并把请假改为额度与规则内自动通过、超阈值才人审；保留 4 个人工审批（请假异常单、激励方案、奖金核定、月度薪酬审核），均 approver=cost_object_owner 并写 why_human；逐项理由见 QC-VS-13.md。
# 扩展写法（用到的 CONVENTIONS 以外写法，均记入 notes「格式问题」）：decision 项可带 outcome；events 项可带 filter；steps 可带 entry（分支步骤的进入条件）；审批超时由 timeout 表示。
# 判断点依据写在 decision 后的注释行（CONVENTIONS 无 basis 字段）。

processes:

  # ───────────── VS-13.1 考勤确认 ─────────────

  - id: PRC-115
    name: 导入考勤记录并补卡
    trigger:
      type: time
      desc: 每日同步考勤来源
    triggers:
      - {type: time, name: "每日拉取企业微信打卡记录（platform.scheduling 定时）"}
      - {type: human, name: "人力修复人员对照后重新拉取"}
    stages: []
    primary_object: OBJ-70
    support: "B-27 考勤原始记录的导入与补卡，是月度考勤确认（PRC-118）的输入，结局（考勤已导入、补卡已记录）不造 VS-13.1 的任一退出条件（月度考勤已锁定、请假已汇入、加班已汇入）（STAGE_ALIGN.md 归段判据第 6 项）"
    owner_bc: B-27
    human_orchestration: false
    migration: "历史打卡（老系统约 79.5 万行）与补卡经迁入通道全量迁入为考勤记录，来源对照区分来源系统；迁入不触发导入流程、不发事件（ADR-0036 M7）"
    scope: "员工本人看自己的考勤；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [考勤已导入, 导入失败已告警, 补卡已记录]
    scenarios: [PRC-115-S01, PRC-115-S02, PRC-115-S03, PRC-115-S04, PRC-115-S05]   # S01 每日导入成功；S02 拉取失败或批次不完整，告警后人力重拉；S03 存在无法对应人员的记录，整批告警；S04 员工补卡，原记录不改，所属月已锁定则计入下月更正行；S05 补卡超次数或时限，被拒回补卡页
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 补卡发起人（员工）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收导入失败告警，修复人员对照后重新拉取", approval_right: "无", department_hint: "人力资源部、信息部门", position_hint: "人力资源专员、考勤管理员"}}       # 人力、信息：导入失败告警
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属补卡", approval_right: "无（补卡不设审批，由次数与时限规则守卫）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：补卡知会
    steps:
      - actor: system
        where: external:企业微信
        evidence: [导入批次号, 拉取日期, 记录条数, 校验和]
        command: 导入考勤记录
        aggregate: AGG-69
        desc: 经 platform.integration 的企业微信适配器每日拉取前一日打卡，转换后调用本 BC 写入；只追加不可改（INV-69），以企业微信记录 ID 幂等；企业微信成员经来源对照解析到人员 ID，解析不到的记录整批告警不静默。补卡只补已导入日期上缺失的打卡，故员工补卡从本步之后进入步骤 3
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 拉取企业微信打卡记录}
        decision:
          - {when: "拉取失败、批次不完整或存在无法对应人员的记录", goto: 2}
          - {when: "员工发现已导入日期缺卡并发起补卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 考勤已导入
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；INV-69；用户事实 intent 2026-10-16-152603（打卡来源企业微信）
      - actor: platform
        where: automatic
        platform_task: true
        service: platform.integration
        command: 告警导入失败
        desc: 告警人力与信息，不静默；缺失日期不得被月度考勤当作“全勤”（PRC-118 步骤 1 校验）；修复后由人力重新拉取（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 导入失败已告警
      - actor: SH-E3
        where: in_system
        entry: 员工对已导入日期的缺卡发起补卡
        branch: 补卡
        command: 补卡
        aggregate: AGG-69
        pending: U4
        desc: 原打卡记录不改，补卡另记一条（INV-69）；规则守卫（不设上级审批）：只能补该日缺失的打卡、每月补卡次数不超上限、不超补卡时限，违反即拒绝并停留在补卡页；所属月份月度考勤已锁定的，补卡照常记录，其对考勤的影响计入下月更正行并标原月份（INV-105）。次数上限与时限待用户定 U4
        permission: 考勤.补卡
        page: 补卡申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "超出每月补卡次数上限、补卡时限，或该日并不缺卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 补卡已记录
    notes: 来源系统已定为企业微信（原 v1 备注“来源系统待定 R2”作废）。外勤、出差、特殊假别等非打卡类考勤聚合稿无命令，见 notes 结构问题。补卡不设人审：证据在打卡与补卡留痕，滥用靠次数与时限规则及月度考勤员工确认、用人经理知会兜底（QC-VS-13.md）。

  - id: PRC-116
    name: 申请并审批请假
    trigger:
      type: human
      desc: 员工提交请假
    triggers:
      - {type: human, name: "员工提交请假"}
    stages: [VS-13.1]
    primary_object: OBJ-68
    owner_bc: B-27
    human_orchestration: true
    human_note: 请假审批、驳回或撤销释放额度；额度与假期规则内的请假自动通过，只有异常单进入人工审批
    migration: "历史请假（老系统请假档案约 2.4 万条）全量迁入为已结实例，已用额度按迁入对账不重算、不发事件；在途（审批中）按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）"
    scope: "员工本人、其审批人、人力；病假等事由随 ADR-0043 分级限制可见范围（事由敏感度 tbd，交 U-11）"
    segregation:
      - {roles: [SH-E3, SH-E1], rule: "申请人不得审批本人请假（申请人本身是部门负责人时，按 AR-11 由其上级审批）"}
    outcomes: [已批准, 已驳回, 已撤销, 已销假, 额度不足被拒, 已提醒]
    scenarios: [PRC-116-S01, PRC-116-S02, PRC-116-S03, PRC-116-S04, PRC-116-S05, PRC-116-S06, PRC-116-S07, PRC-116-S08, PRC-116-S09, PRC-116-S10, PRC-116-S11, PRC-116-S12]   # S01 额度不足被拒；S02 额度内年假自动批准；S03 超阈值长假进入审批并批准；S04 审批驳回释放占用；S05 审批中员工撤回；S06 审批 3 日无人处理，非中断升级提醒管理层（结局已提醒，主线照常）；S07 已批准未开始，员工撤销回冲；S08 请假已开始提前销假回冲；S09 申请人本人是部门负责人，由其上级审批（AR-11）；S10 政策允许透支，进入审批；S11 请假已开始后员工点撤销，转为销假办理；S12 假期类型为补休，冲抵补休额度行并自动批准
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为申请人所在组织单元的责任人，判断异常请假能否离岗", approval_right: "正常一级审批（cost_object_owner 解析结果）；超阈值时 AR-11、AR-12 加审", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 申请人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: informed, org_needs: {responsibility: "接收审批超期或期限提醒的升级，必要时督办", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 审批超期升级对象；暂拟，待 U3
      - {id: SH-E6, as: informed, org_needs: {responsibility: "维护额度与假期规则，接收请假知会", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：额度与假期规则维护方，知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 占用余额
        aggregate: AGG-71
        reads: [AGG-68, AGG-108, AGG-118]
        desc: 与提交请假是员工的同一次操作，分两个聚合两个事务，最终一致；占用以请假 ID 幂等，孤儿占用由定时释放（聚合稿 §7 第 6 条）；同时读工作日历与标准工时版本做按日拆分（取不到当日生效版本须失败并告警，INV-116）。假期类型为补休时（劳动法第四十四条：休息日加班先安排补休），不占年度账户，按到期日先后冲抵员工的补休额度行（PRC-117 计入），请假日不得晚于所冲抵额度行的到期日，额度不足同样被拒
        permission: 请假.提交
        page: 请假申请页
        cross_bc:
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与汇报线}
        decision:
          - {when: "超出可用额度且假期类型政策不允许透支", goto: end, rule: INV-68}
          - {when: otherwise, goto: 2}
        outcome: 额度不足被拒
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        pending: U3
        desc: 起止时刻可跨日、半天或按小时；按日拆分，非工作日计 0（补休作为请假类型同样按日拆分，与年假一样扣减当日最低应填工时，RULE-413）。系统按规则分流：额度内、假期类型规则允许、单次天数不超免审批阈值、该假别无需证明材料的，自动批准并知会直属上级；其余（超阈值、需证明材料的假别、政策允许的透支）进入人工审批。阈值与假别清单待用户定 U3
        permission: 请假.提交
        page: 请假申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "额度内、假期规则允许、天数不超免审批阈值且无需证明材料", goto: 4}
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；INV-68（额度）；AGG-118（假期规则）；阈值待 U3
      - actor: SH-E1               # 部门负责人
        where: in_system
        platform_task: true
        service: platform.approval
        command: 请假审批
        pending: U3
        desc: 只有超阈值长假、需证明材料的假别（是否合规需人看材料）、政策允许的透支才到此；工时单最低时数扣减已批准与待批请假（INV-65，B-06 经 api 读取，只取时长）
        approval:
          engine: platform.approval
          doc_type: 请假审批
          approver: cost_object_owner   # 请假单的归属对象是申请人所在组织单元，其责任人即部门负责人（SH-E1）
          why_human: "超阈值长假、需证明材料的假别与透支需判断业务上能否离岗（项目人力安排）和材料真伪，规则只能校验额度、假期规则与天数，不能代替这一判断；额度内的常规请假已自动通过。"
          escalation_rules: [AR-11, AR-12]
          on_reject: 6
        permission: 请假.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: false}   # 暂拟 3 日无人处理升级提醒管理层，待 U3；非中断，升级后接独立结束事件「已提醒」，主线照常（BPMN_STYLE 第 3 节，S-28）
        withdraw: {to: 7}
        decision:
          - {when: 审批驳回, goto: 6}
          - {when: 员工在审批中撤回, goto: 7}
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起请假审批}
      - actor: system
        where: automatic
        command: 批准请假
        aggregate: AGG-70
        emits: [请假已批准]
        desc: 两条路径汇合：规则内自动批准，或审批平台通过的回调（走审批的路径带“审批已通过”事件）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 批准转已用
        aggregate: AGG-71
        on_event: [{aggregate: AGG-70, event: 请假已批准}]
        desc: 同 BC 事件反应，把占用转为已用；批准后员工仍可在开始前撤销或开始后销假
        decision:
          - {when: 请假开始前员工撤销, goto: 7}
          - {when: 请假期间员工提前结束, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已批准
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回请假
        aggregate: AGG-70
        desc: 审批驳回的回调；聚合稿 AGG-70 没有驳回命令（NOTES 铺开备忘）
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: SH-E3
        where: in_system
        entry: 请假审批中或已批准、尚未开始时，员工撤销
        branch: 撤销
        command: 撤销请假
        aggregate: AGG-70
        emits: [请假已撤销]
        desc: 审批中撤销须同时撤回审批实例（platform.approval 的取消能力，见 notes 接缝问题 1）；已开始的请假不能撤销，只能销假
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}          # 审批中撤销：占用尚未转已用
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}    # 已批准后撤销：占用已转已用，需回冲
        permission: 请假.撤销
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 请假已开始, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已撤销
      - actor: SH-E3
        where: in_system
        entry: 已批准的请假提前结束
        branch: 销假
        command: 销假
        aggregate: AGG-70
        emits: [请假已销假]
        desc: 未休完的部分回冲已用额度；销假是事实登记，不再审批，知会直属上级（U3 推荐，待确认）
        inner:
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}
        permission: 请假.销假
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        outcome: 已销假
    notes: 驳回、撤销、销假的额度回冲在聚合稿没有对应命令（驳回请假、回冲已用额度均为〔缺〕）；补休类回冲回原额度行。v1 把“占用余额”写在“提交请假”之前，骨架保留 v1 顺序并说明为同一次操作。

  - id: PRC-117
    name: 申请并批准加班
    trigger:
      type: human
      desc: 员工或部门提出加班
    triggers:
      - {type: human, name: "员工或用人经理登记加班"}
    stages: [VS-13.1]
    primary_object: OBJ-72
    owner_bc: B-27
    human_orchestration: false
    human_note: 加班审批已取消：事前登记，事后以打卡核实，批准由系统按规则作出（质检修订，用户原则）；补休额度的计入与到期前提醒均由规则执行，无人审；到期未休与离职时转计发加班工资归 PRC-178（S-41）
    migration: "历史加班（老系统是否有加班记录尚未取证）全量迁入为已结实例；在途按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）；迁入的补偿方式为调休的加班，其未休余额是否迁为补休额度行待取证后定，不凭推测"
    scope: "员工本人、其用人经理、人力；补休额度只本人与人力可见"
    outcomes: [已批准, 已驳回, 补休已休完, 已提醒, 已移交计发]
    scenarios: [PRC-117-S01, PRC-117-S02, PRC-117-S03, PRC-117-S04, PRC-117-S05, PRC-117-S06, PRC-117-S07]   # S01 登记、加班日后打卡核实、自动批准（付薪）；S02 打卡不支持登记的加班时长，驳回；S03 当月累计超 36 小时预警并知会、不拦截；S04 补登超过允许期限，被拒回登记页；S05 休息日加班计补休，批准后计入补休额度，到期前员工休完；S06 到期前员工未排定补休，非中断提醒员工与直属上级，主线照常；S07 有效期届满仍有未休余额，交 PRC-178 转计发加班工资
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责；在补休额度有效期届满前自行排定并休完补休", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属加班登记，也可代员工登记；补休额度到期前收到提醒，与员工排定补休", approval_right: "无（加班不设审批，由打卡核实）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：登记知会；也可代员工登记；补休到期前提醒
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收当月加班超 36 小时的预警", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：当月超 36 小时预警知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交加班申请
        aggregate: AGG-72
        pending: U5
        desc: 登记即事前申请，不设审批：每月累计超 36 小时只预警并留痕，不拦截（P-34；劳动法第四十一条）；补偿方式由加班日类型限定：法定节假日只能付加班费（300%），不补休；休息日由单位安排补休，不能安排补休的付加班费（200%）（劳动法第四十四条：先安排补休，不能安排的支付不低于 200%）；工作日延时按现有补偿政策（口径不变，加班费 150%）；补偿方式不由员工选择：休息日加班默认计补休，确因工作不能安排补休的由直属上级在登记时标明「不能安排补休」，改付加班费；不设审批（劳动法第四十四条「单位安排补休」）。非工作日工时与加班、补休的衔接另定（BC 接缝由 one-architecture 负责，one-rules FD2-05 规则卡作输入）；事后补登的允许期限待用户定 U5
        permission: 加班.申请
        page: 加班申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信通知}]   # 人力仅超 36 小时时才发
        decision:
          - {when: "补登超过允许期限，或加班时段与已批准请假重叠", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        on_time: 加班日考勤已导入
        command: 批准加班
        aggregate: AGG-72
        emits: [加班已批准]
        desc: 以打卡核实代替人工批准：加班日的打卡记录（AGG-69）能支持登记的加班时长即批准（以打卡可证实的时长为准）；批准后汇入当月月度考勤（PRC-118 读取，不订阅），工时单引用加班 ID；补偿方式为补休的，继续计入补休额度
        decision:
          - {when: 打卡记录不支持登记的加班时长, goto: 3}
          - {when: 补偿方式为补休, goto: 4}
          - {when: otherwise, goto: end}
        outcome: 已批准
        # 依据：用户原则「能规则化就不设人审」；加班费真实性由打卡校验，必要性由超 36 小时预警与月度考勤知会兜底
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回加班
        aggregate: AGG-72
        desc: 聚合稿 AGG-72 没有驳回命令；打卡不支持时驳回并告知登记人
        notify: [{to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: system
        where: automatic
        branch: 补休
        command: 〔缺〕计入补休额度
        aggregate: AGG-71
        pending: U15
        desc: 补休额度归 B-27（S-44）：加班批准且直属上级未标「不能安排补休」的休息日加班，按批准时长给员工计一笔补休额度行（假期类型补休）；本期工时（B-06）不读加班审批与补休余额（RULE-412），到期日 = 加班日 + 补休有效期（时长待用户定 U15），额度行不按年度、不随年度结转；同一事务内把加班标记为已计入补休额度，以加班 ID 幂等；由此不再出现「已批准却无人追踪补偿」的加班
        inner:
          - {command: 〔缺〕标记加班已计补休, aggregate: AGG-72}
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（补休额度已计入及到期日）}]
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        calls: PRC-116
        desc: 员工在额度到期日前自行向直属上级排定并休补休：补休走请假（假期类型补休，占用补休额度行，PRC-116）；有效期届满前（时长待用户定 U15）员工与直属上级收到提醒（非中断，主线照常）；补休由单位安排，系统不替单位判断「已安排」，故不因员工未休而作废额度（劳动法第四十四条）
        permission: 请假.提交
        page: 我的请假页
        pending: U15
        timeout: {after: "有效期届满前（时长待用户定 U15）", escalate_to: SH-E1, interrupting: false}   # 有效期长度与提前提醒的时点待 U15，骨架不先定；升级只提醒员工与直属上级，非中断，升级后接独立结束事件「已提醒」，主线照常（BPMN_STYLE 第 3 节）
        decision:
          - {when: 补休额度有效期届满仍有未休余额, goto: PRC-178, outcome: 已移交计发}
          - {when: otherwise, goto: end}
        outcome: 补休已休完
    notes: 加班“已补偿”：付薪的由月度考勤已确认事件触发（PRC-118）；补休的在计入补休额度时标「已计入补休额度」，补偿追踪转到 AGG-71 额度行。补偿方式（加班费或补休）在 AGG-72 记录；补休以请假冲抵（假期类型补休），不再叫「调休」——词表「调休」专指工作日历的调休上班日（B-14）。补休有效期时长待用户定 U15（见 notes 待用户定）；到期与离职都不作废：B-27 在有效期届满时发「补休已到期未休」、离职时随 Separated，由 B-15 经 PRC-178 读取补休余额并计入加班工资（S-41），PRC-117 只管补休登记与到期前提醒。原 v1 的审批节点取消，PRC-117 不再是人工编排流程（catalog 的 human_orchestration 须随之改为 false，见 notes 格式问题）。

  - id: PRC-118
    name: 生成、确认并锁定月度考勤
    trigger:
      type: time
      desc: 月末
    triggers:
      - {type: time, name: "月末生成（platform.scheduling 定时）；确认期限届满锁定"}
      - {type: human, name: "人力在导入修复后重新发起生成"}
      - {type: event, entry: 7, name: "员工离职生效（B-13 发布 Separated；S-42）", event: Separated, bc: B-13}
    stages: [VS-13.1]
    primary_object: OBJ-111
    secondary_objects: [OBJ-72]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-27
    human_orchestration: false
    human_note: 员工确认或更正，逾期默认确认并自动锁定（人力不再手工锁定、不再代确认；质检修订）
    migration: "历史月度考勤确认（老系统月 × 一级部门 1,026 单）与人员 × 月不对应：按 NOTES 待用户定数据 2 处理，本流程不触发、不回放；锁定前的在途月份按当前状态迁入"
    scope: "员工本人看自己的；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [已锁定, 已暂缓]
    scenarios: [PRC-118-S01, PRC-118-S02, PRC-118-S03, PRC-118-S04, PRC-118-S05, PRC-118-S06]   # S06 员工离职生效（Separated），离职当月已生成未确认的月度考勤立即默认确认并锁定；S01 员工确认后期限届满自动锁定；S02 员工提出更正，补卡后重新生成再确认；S03 逾期未确认，默认确认并锁定、标记；S04 离职当月，账号已吊销，默认确认并锁定；S05 当月有日期导入失败，暂缓生成
    roles:
      - {id: SH-E3, as: performer, org_needs: {responsibility: "核对并确认本人当月出勤、请假、加班，有异议提出更正", approval_right: "无（确认是数据主体对自己事实的确认，不是审批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 员工：确认或更正本人月度考勤
      - {id: SH-E1, as: informed, org_needs: {responsibility: "接收逾期未确认名单，必要时提醒下属", approval_right: "无", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：逾期未确认名单知会
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：导入失败暂缓知会
    steps:
      - actor: system
        where: automatic
        command: 生成月度考勤
        aggregate: AGG-97
        reads: [AGG-69, AGG-70, AGG-72, AGG-68]
        desc: 汇总考勤、请假、加班，人员 × 月一份；含出勤天数、请假（按类型，含补休）、加班（按补偿方式：付薪的汇入加班费时长，补休的汇入计入补休额度的时长、不进加班费）与更正行；月内存在无导入批次或批次失败的日期时失败并告警，不得当作全勤；审批中的请假不汇入，批准后计入下月更正行并标原月份（INV-105）
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取当月在职与当月离职人员}
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 暂缓时才发
        decision:
          - {when: "当月有日期的考勤导入失败或缺批次", goto: end}
          - {when: "人员当月已离职（离职生效后账号已吊销，本人无法确认）", goto: 7}
          - {when: otherwise, goto: 2}
        outcome: 已暂缓
        # 依据：CLAUDE.md 第 6 条；PRC-115 步骤 2；RULE-363（离职生效即吊销登录）；STEP3 C-17（离职当月仍须确认考勤）
      - actor: SH-E3
        where: in_system
        command: 员工确认
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 员工核对本人当月出勤、请假、加班，无误即确认，有异议提出更正；这是数据主体对自己事实的确认（劳动争议中的出勤证据），不是审批，不设 approval；期限内未确认由系统默认确认，不追办、不人工代确认
        permission: 月度考勤.确认
        page: 我的月度考勤页
        audit: true
        timeout: {after: "P3D", escalate_to: system, interrupting: true}   # 暂拟 3 天，起算点与期限待用户定 U6；届满由系统默认确认（步骤 7）
        decision:
          - {when: 提出更正, goto: 5}
          - {when: 确认期限届满仍未确认, goto: 7}
          - {when: otherwise, goto: 3}
      - actor: system
        where: automatic
        command: 标记加班已补偿
        aggregate: AGG-72
        on_event: [{aggregate: AGG-97, event: 月度考勤已确认}]
        emits: [加班已补偿]
        desc: 订阅月度考勤已确认（同 BC），只标补偿方式为付薪的已批准加班，按加班 ID 幂等；补休的加班在计入补休额度时已标（PRC-117 第 4 步），不在此标
      - actor: system
        where: automatic
        on_time: 员工确认期限届满
        command: 锁定
        aggregate: AGG-97
        emits: [月度考勤已锁定]
        desc: 确认期限届满自动锁定，未确认者标记“逾期未确认”；锁定后不改，补卡、请假、加班变动计入下月并标原月份（INV-105）；月度考勤已锁定是 B-15 薪酬结算可取数的依据
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]     # 逾期未确认名单
        outcome: 已锁定
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 月度考勤已锁定}
      - actor: SH-E3
        where: in_system
        entry: 员工对生成结果有异议
        branch: 提出更正
        command: 补卡
        aggregate: AGG-69
        calls: PRC-115
        desc: 缺卡走补卡；请假或加班有误由员工撤销或重提（PRC-116、PRC-117）；锁定前的更正都回到“重新生成”
        permission: 考勤.补卡
        page: 我的月度考勤页
      - actor: system
        where: automatic
        branch: 重新生成
        command: 〔缺〕重新生成月度考勤
        aggregate: AGG-97
        desc: 确认前依据最新考勤、请假、加班重新汇总，幂等；已确认或已锁定的不可重新生成（INV-105）
        decision:
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        entry: 逾期未确认，或人员当月已离职、本人无法登录确认，或员工离职生效（订阅 B-13 的 Separated，S-42）
        branch: 默认确认
        command: 〔缺〕默认确认月度考勤
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 取代原“人力手工锁定”与“人力代员工确认”：按生成结果默认确认并标记（逾期未确认 / 已离职），留存标记与审计；锁定后的异议走下月更正行。是否改回人力代确认离职人员见 U6。S-42 事件入口：订阅 B-13 的 Separated，对该人员当月（及仍未确认的以往月份）已生成而未确认的月度考勤立即默认确认并标记已离职，不等确认期限；尚未生成的由第 1 步月末处理（已离职分支直达本步）；已确认或已锁定的不重复（幂等）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
        decision:
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；RULE-363；STEP3 C-17（“确认”由默认确认满足，待 U6 确认）
    notes: "补休额度的到期未休与离职转计发不经月度考勤，由 B-15 在 PRC-178 读取 B-27 补休余额并登记，PRC-124 读取本 BC 的登记（月度考勤只汇总当月发生的出勤、请假、加班）。员工确认是员工本人对自己月度考勤的确认，不是审批（质检修订：notes 格式问题 2 作答），故不写 approval，catalog 的 human_orchestration 须改为 false。人力不再手工锁定、不再代确认，减少两次人工；用人经理不复核（U6 推荐不变）。次要对象：OBJ-72 加班（付薪类「已补偿」由月度考勤确认事件触发）。"

  # ───────────── VS-13.2 绩效激励 ─────────────

  - id: PRC-120
    name: 评估月度绩效
    trigger:
      type: time
      desc: 评估期间结束
    triggers:
      - {type: time, name: "评估期间结束（platform.scheduling 定时提醒用人经理）"}
    stages: [VS-13.2]
    primary_object: OBJ-109
    owner_bc: B-13
    human_orchestration: false
    migration: "历史月度评估（老系统月度评估表 三类模板）全量迁入为已确认评估，不发事件、不触发奖金核定（ADR-0036 M7）"
    scope: "被评人员本人、其用人经理与上级、人力；评估结论按个人信息分级（ADR-0043）"
    outcomes: [已确认, 已更正]
    scenarios: [PRC-120-S01, PRC-120-S02, PRC-120-S03, PRC-120-S04]   # S01 编制、提交、确认；S02 同人同期同类型已有已确认评估被拒；S03 已确认评估发现错误，评估人追加更正记录（未涉及已核定奖金）；S04 更正涉及已核定奖金，人力转 PRC-122 重新草拟
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制、提交并确认下属月度绩效评估，对评估结论负责", approval_right: "无（评估是专业判断）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：评估完成知会
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制绩效评估
        aggregate: AGG-106
        desc: 评估期间结束由系统提醒用人经理；类型为月度；同一人同期同类型只一份（INV-114）
        permission: 绩效评估.编制
        page: 绩效评估编辑页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 同一人同期同类型已有已确认评估, goto: end, rule: INV-114}
          - {when: otherwise, goto: 2}
        outcome: 已确认
      - actor: SH-E1
        where: in_system
        command: 提交绩效评估
        aggregate: AGG-106
        pending: U11
        desc: 提交的接收方（上级复核、被评人阅知或申诉）v1 未写，见 notes 待用户定 U11；本稿不设审批，评估是用人经理的专业判断而非审批，若 U11 定上级复核再按 cost_object_owner 加人工审批
        permission: 绩效评估.提交
        page: 绩效评估编辑页
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        pending: U11
        desc: 确认后不可改（INV-114）；事件须带评估类型（月度 / 试用期），否则 PRC-122 无法区分（notes 结构问题）
        permission: 绩效评估.确认
        page: 绩效评估编辑页
        audit: true
        decision:
          - {when: 已确认评估发现错误, goto: 4}
          - {when: otherwise, goto: end}
        outcome: 已确认
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}
      - actor: SH-E1
        where: in_system
        entry: 已确认评估发现错误
        branch: 更正
        command: 登记绩效更正
        aggregate: AGG-106
        desc: 已确认评估不改（INV-114），评估人追加一条更正记录引用原评估，写明更正项、更正后结论、原因与依据；不设审批：更正是评估人对自己评估的专业修正，留痕在更正记录与审计，原评估与奖金核定的复核由规则守卫（须引用原评估、原因必填）与下游人力知会兜底；更正后若该评估已被奖金核定引用，人力在 PRC-122 人力触发入口重新草拟，系统不自动改已核定奖金
        permission: 绩效评估.更正
        page: 绩效评估更正页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]      # 人力核对是否涉及已核定奖金
        decision:
          - {when: 更正的评估已被奖金核定引用, goto: PRC-122}
          - {when: otherwise, goto: end}
        outcome: 已更正
    notes: 状态流转由用户定，细则为推断，待流程梳理确认（v1）。试用期评估是 PRC-85 的步骤，不在本流程。S-35：更正分支承载 AGG-106 登记绩效更正；不设人审的理由见步 4 desc，若用户认为更正须上级复核再加 approval（cost_object_owner）。

  - id: PRC-121
    name: 制定激励方案
    trigger:
      type: human
      desc: 管理层与人力制定
    triggers:
      - {type: human, name: "人力按管理层要求编制激励方案版本"}
    stages: [VS-15.1, VS-15.2, VS-15.3]
    stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；VS-15.1 编制、VS-15.2 已生效、VS-15.3 已结束，均由本流程完成（判据推出 VS-15.2、VS-15.3）；原支撑理由：B-15 激励方案版本的配置维护，结局（已生效）不造 VS-13.2 的退出条件（激励方案「生效」是 VS-13.2 的进入条件；退出是评估已确认、奖金已核定）（STAGE_ALIGN.md 归段判据第 6 项）"
    primary_object: OBJ-74
    owner_bc: B-15
    human_orchestration: true
    human_note: 编制 → 审批 → 到期自动生效
    migration: "历史激励方案（老系统无流程，奖金计提来自线下导入）按方案版本重建后迁入；在途无；迁入不触发审批（ADR-0036 M7）"
    scope: "人力、管理层；方案含薪酬敏感数据"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "方案编制人不得审批本人编制的方案（AR-11 同理）"}
    outcomes: [已生效, 已撤回]
    scenarios: [PRC-121-S01, PRC-121-S02, PRC-121-S03, PRC-121-S04, PRC-121-S05]   # S01 编制、审批通过、到期自动生效；S02 审批驳回退回修改；S03 编制人在审批中撤回；S04 生效日早于已核定奖金所属期，被拒回编制；S05 方案额度合计超阈值，加一级（AR-01）
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "按管理层要求编制激励方案版本（规则与额度），对内容完整性负责", approval_right: "无（编制人不得审批本人编制的方案）", department_hint: "人力资源部", position_hint: "人力资源负责人、薪酬岗"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "作为方案适用范围的责任人，对经营取舍负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值时上加一级", department_hint: "公司管理层", position_hint: "总经理、分管副总、事业部负责人"}}       # 管理层：方案适用范围（法人或事业部）的责任人
    steps:
      - actor: SH-E6               # 人力
        where: in_system
        command: 编制激励方案版本
        aggregate: AGG-75
        desc: 规则与额度；版本化配置（D15），生效日期向后，不追溯已核定奖金；规则守卫：生效日期不得早于已核定奖金所属期，违反即拒绝并停留在编辑页
        permission: 激励方案.编制
        page: 激励方案编辑页
        decision:
          - {when: "生效日期早于已核定奖金所属期", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 激励方案审批
        gap: G-02
        pending: U10
        desc: 方案规则与额度是经营决策，保留人审
        approval:
          engine: platform.approval
          doc_type: 激励方案审批
          approver: cost_object_owner   # 方案的归属对象是其适用范围（法人或事业部），责任人为管理层（SH-M1）
          why_human: "激励方案的规则与额度决定公司对员工的奖金承诺，涉及经营导向与预算取舍，没有客观条件可由规则代替；生效后不可追溯修改，故事先由责任人批准。"
          escalation_rules: [AR-01, AR-02]   # 金额取方案额度上限合计；阈值待 U10
          on_reject: 1
        permission: 激励方案.审批
        page: 审批待办页
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: end, outcome: 已撤回}
        decision:
          - {when: 审批驳回, goto: 1}
          - {when: 编制人在审批中撤回, goto: end}
          - {when: otherwise, goto: 3}
        outcome: 已撤回
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起激励方案审批}
      - actor: system
        where: automatic
        on_time: 方案生效日期到达
        command: 生效激励方案版本
        aggregate: AGG-75
        emits: [激励方案已生效]
        desc: 审批通过后到生效日期自动生效，不再由人力手工点击；前置：审批已通过
        audit: true
        outcome: 已生效
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
    notes: G-02 已处理（AGG-75 引用 platform.approval，intent 114200 F-2）。驳回回到编制，不结束流程，故结局词去掉“已驳回”、加“已撤回”。

  - id: PRC-122
    name: 核定奖金
    trigger:
      type: event
      events:
        - {event: 绩效评估已确认, aggregate: AGG-106, filter: "评估类型为月度"}
    triggers:
      - {type: event, name: "绩效评估已确认（仅月度评估；B-13 发布）"}
      - {type: human, name: "人力在调整评估或激励方案后重新草拟"}
    stages: [VS-13.2]
    primary_object: OBJ-104
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统按方案规则草拟，责任人审批核定（质检修订：取消人力手工草拟）
    migration: "历史奖金（2020–2025 历史奖金与奖金计提来自老系统线下导入）按个人 × 期间迁入为已核定；迁入不触发核定（ADR-0036 M7）"
    scope: "人力、管理层与奖金归属人本人；奖金属薪酬敏感信息"
    segregation:
      - {roles: [SH-E1, SH-E1], rule: "用人经理既是评估人又是核定人时，奖金由系统按方案规则草拟、不得由其改额；核定人是被核定人本人时按 AR-11 由其上级核定"}
    outcomes: [已核定, 无需核定, 已中止, 已驳回, 期间关账中待重试]
    scenarios: [PRC-122-S01, PRC-122-S02, PRC-122-S03, PRC-122-S04, PRC-122-S05, PRC-122-S06, PRC-122-S07]   # S01 月度评估确认后草拟、核定并提交重分类（全程）；S02 试用期评估确认不触发；S03 没有生效方案或草拟金额超方案额度，已中止并告警人力；S04 责任人驳回；S05 奖金金额超阈值，加一级或两级（AR-01、AR-02）；S06 核定期间无项目人工，整额留原法人；S07 核定期间人工成本分配未过账或期间关账中，延后重试
    roles:
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为被评人所在组织单元的责任人，核对草拟奖金是否有规则看不到的情况", approval_right: "正常一级审批（cost_object_owner 解析结果）；本人是被核定人时由上级核定", department_hint: "被评人所在组织单元", position_hint: "部门负责人、用人经理"}}       # 被评人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "奖金金额超阈值时的上一级责任人", approval_right: "加审一级（AR-02 总经理）", department_hint: "公司管理层", position_hint: "总经理"}}       # 金额超阈值时加审（AR-02 总经理一级）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收奖金草拟已中止或被驳回的告警，调整方案或评估后重新草拟", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力：已中止告警
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕草拟奖金核定
        aggregate: AGG-76
        reads: [AGG-75, AGG-106]
        pending: U10
        desc: 读激励方案与核定依据的绩效评估，按方案规则草拟个人奖金（评分到金额的映射在方案规则里；映射不足以自动算时回到人力草拟，见 U10）；草拟金额超出方案额度的拒绝并告警
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 绩效评估已确认}
          - {mode: api, direction: out, bc: B-13, name: 读取绩效评估结论}
        decision:
          - {when: 评估类型不是月度（如试用期评估），无需核定, goto: end}
          - {when: 没有生效的激励方案版本，或草拟金额超出方案额度，已中止, goto: end}
          - {when: otherwise, goto: 2}
        # 依据：PRC-85 的试用期评估也发“绩效评估已确认”，事件现无评估类型（notes 结构问题 4）；失败并告警人力，不静默（CLAUDE.md 第 6 条）
      - actor: SH-E1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 奖金核定审批
        pending: U10
        desc: 责任人核对草拟奖金，可批准或驳回，不改金额；奖金是对个人的资金承诺，保留人审
        approval:
          engine: platform.approval
          doc_type: 奖金核定审批
          approver: cost_object_owner   # 奖金单的归属对象是被评人所在组织单元，责任人即部门负责人（SH-E1）
          why_human: "奖金按方案规则草拟只是基线，兑现前须由为该成本负责的人确认没有规则看不到的情况（如离岗、争议、业绩调整）；奖金直接增加人工成本并进入薪酬，故保留正常一级。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U10；责任人就是被核定人本人时按 AR-11
          on_reject: 4
        permission: 奖金.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 审批驳回, goto: 4}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起奖金核定审批}
      - actor: system
        where: automatic
        command: 核定奖金
        aggregate: AGG-76
        emits: [奖金已核定]
        desc: 审批通过的回调后核定；发放经月度薪酬结算（PRC-124 读取已核定奖金）
        audit: true
        decision:
          - {when: otherwise, goto: 5}
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回奖金核定
        aggregate: AGG-76
        desc: 审批驳回的回调；聚合稿 AGG-76 没有驳回命令；人力调整后重新草拟（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-76
        calls: PRC-92
        pending: S-4b 拆分口径（拆分依据与新增 B-15 读 B-16 的边，交 one-architecture、one-arch-finance 核）
        desc: 核定后提交一次「奖金核定重分类」记账事实（S-4b，one-architecture @a747e42af；finance PRC-96 @0d93dd7e）：只在负债内部重分类、不进成本——借 应付职工薪酬—奖金（计提），贷 应付职工薪酬—奖金（已核定），金额为核定额；按法人与项目拆分：读被核定人员在核定期间已过账的人工事实，按「成本法人 × 项目」的直接人工占比拆核定额，尾差并入金额最大的一行；核定期间没有项目人工的部分拆不到项目，整额记被核定人员的成本法人、不带项目，由 B-07 按 LEB-05 留原法人转费用，不跨法人；拆分明细随事实携带。差额（核定额与累计计提之差）转成本调整行归 B-07（PRC-96 步 2 ③），本步不算。所属会计期间已关账的按 ADR-0045 与 INV-92 路由到开放期间并标原期间
        audit: true
        period_gate: true
        legal_entity: 被核定人员核定期间的成本法人（与人工事实一致，ADR-0073 第 1 条、LEB-04）
        notify: [{to: SH-E6, how: 企业微信告警}]     # 延后重试超过下次关账仍未提交时才发
        decision:
          - {when: "核定期间的人工成本分配尚未过账，或 PRC-92 返回期间关账中，延后由投递重试；到下次关账仍未提交的告警人力", goto: end, outcome: 期间关账中待重试}
          - {when: "所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已核定
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 读取已过账人工事实（按人员 × 期间）}
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 订阅方 B-15（奖金核定依据）。聚合稿 AGG-76 没有“额度不得超出激励方案”的不变量，草拟时拒绝先按前置检查写，见 notes 结构问题。原 v1 的人力手工草拟取消，catalog 的 human_orchestration 须由 false 改为 true（notes 格式问题）。

  # ───────────── VS-13.3 薪酬结算 ─────────────

  - id: PRC-124
    name: 计算、审核并批准月度薪酬
    trigger:
      type: event
      events:
        - {event: 月度考勤已锁定, aggregate: AGG-97}
    triggers:
      - {type: event, name: "月度考勤已锁定（B-27 发布；按人员 × 月发出，法人当月在职人员全部锁定才能计算）"}
      - {type: human, name: "人力在补齐档案或规则版本后重新发起法人 × 月计算"}
    stages: [VS-13.3]
    primary_object: OBJ-73
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统计算，薪酬岗提交审核，财务责任人审批，可退回重算（高风险，保留人审）
    migration: "历史月度薪酬结算（老系统算薪审核表与税金计算、工资条约 2.9 万行）按法人 × 月迁入为已发放 / 已过账结算，只迁结果与证据，不重算、不发事件、不重新过账（ADR-0036 M7）；在途月份按当前状态迁入通用审批"
    scope: "按法人数据范围；薪酬结算行属敏感个人信息，仅人力薪酬岗与财务主管可见，员工只看本人工资条"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "提交审核者不得审批同一份结算（制单与审批分离，AR-11）；任何人不得审批含本人薪酬结算行的结算，含本人时由其上级审批（SH-E6 内部分岗：薪酬岗 / 财务主管）"}
    outcomes: [已批准, 待锁定, 已中止]
    scenarios: [PRC-124-S01, PRC-124-S02, PRC-124-S03, PRC-124-S04, PRC-124-S05, PRC-124-S06, PRC-124-S07, PRC-124-S08, PRC-124-S09, PRC-124-S10]   # S01 全部锁定后计算、提交、审批、批准、提交过账候选（全程）；S02 审批驳回退回重算；S03 有人员未锁定，待锁定；S04 缺薪酬档案或规则版本，已中止并告警；S05 审批 2 日无人处理升级；S06 提交人撤回审批；S07 薪酬岗核对异常清单后重算；S08 薪酬总额超阈值，加一级或两级（AR-01、AR-02）；S09 所属期间已关账，过账路由到开放期间并标原期间；S10 当月有补休到期未休或离职结算的补休余额，按加班工资基数 200% 计入加班费
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统计算结果与异常清单，确认无误后提交审核，对输入修正负责", approval_right: "无（提交人不得审批同一份结算）", department_hint: "人力资源部（薪酬岗）", position_hint: "薪酬岗"}}      # 人力（薪酬岗）：核对异常清单、提交审核
      - {id: SH-E6, as: approver, org_needs: {responsibility: "作为薪酬法人的财务责任人，对薪酬支付依据的合理性负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值加审", department_hint: "财务部", position_hint: "财务负责人、财务主管"}}       # 财务（薪酬法人的责任人 / 财务主管）：审批
      - {id: SH-M1, as: informed, org_needs: {responsibility: "知悉薪酬总额；审批超期时接收升级提醒", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 管理层：薪酬总额知会；审批超期升级对象（VS-13.3 participants）
    steps:
      - actor: system
        where: automatic
        command: 计算月度薪酬
        aggregate: AGG-73
        reads: [AGG-97, AGG-74, AGG-76, AGG-93, AGG-62, AGG-119, AGG-120]
        pending: U7
        desc: >-
          薪酬自算（intent 2026-10-16-152603，聚合稿“薪酬汇总导入”口径作废），月度考勤已锁定后由系统自动计算，不再由人手工发起。
          读月度考勤已锁定（含锁定后更正行）、PRC-178 登记的补休转加班工资时长（本 BC AGG-93，按登记所属月读取、已计入结算的登记不重复）、薪酬档案版本（按薪酬期间生效日分段）、参保（缴费基数）、已核定奖金、适用的〔缺〕薪酬规则版本（个税税率表与减除费用、社保公积金比例与基数上下限、计薪天数）、人员与法人。
          按人员：应发 = 档案薪酬项（调薪、入离职当月按计薪日折算）+ 已核定奖金 − 事假等扣款 + 加班费（来自月度考勤的加班补偿方式，付薪部分）+ 补休转计薪费（PRC-178 登记的补休转加班工资时长 × 加班工资基数折算的时薪 × 200%，工资支付暂行规定第十三条；加班工资基数取薪酬档案，取不到则已中止并告警）± 上期锁定后更正行（标原月份）；
          代扣 = 社保公积金个人部分（参保缴费基数 × 规则版本比例）+ 个人所得税（居民个人工资薪金累计预扣，用专项附加扣除与规则版本的税率表）；
          只限法定代扣项目（INV-70）；实发 = 应发 − 代扣；汇总为法人 × 月。同时生成异常清单（环比波动超阈值、实发为负、新入离职折算、含补发补扣行），供薪酬岗核对与审批人参考，只提示不拦截
        audit: true
        legal_entity: 薪酬法人（个税扣缴义务人口径，三口径分别记录，Q-09）
        cross_bc:
          - {mode: api, direction: out, bc: B-27, name: 读取月度考勤确认}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        decision:
          - {when: "该法人当月仍有在职人员月度考勤未锁定，待锁定", goto: end}
          - {when: "有人员没有生效的薪酬档案版本、应参保人员没有参保基数或没有适用的薪酬规则版本，已中止", goto: end}
          - {when: otherwise, goto: 2}
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；阶段进入条件 VS-13.3（法人当月在职人员均已锁定）
      - actor: SH-E6               # 人力（薪酬岗）
        where: in_system
        command: 提交薪酬审核
        aggregate: AGG-73
        desc: 薪酬岗核对计算结果与异常清单，确认无误提交审批；发现输入有误可先修正再重算，不进入审批
        permission: 薪酬结算.提交审核
        page: 薪酬结算页
        audit: true
        decision:
          - {when: 核对发现需修正输入后重算, goto: 1}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起薪酬审核}
      - actor: SH-E6               # 财务（薪酬法人的责任人）
        where: in_system
        platform_task: true
        service: platform.approval
        command: 薪酬审核
        pending: U7
        desc: 对全员薪酬的资金支付依据作审批；审批人看到结算汇总与异常清单
        approval:
          engine: platform.approval
          doc_type: 月度薪酬审核
          approver: cost_object_owner   # 薪酬结算的归属对象是薪酬法人（扣缴义务人口径），责任人为该法人的财务负责人 / 财务主管（SH-E6）
          why_human: "月度薪酬是全员资金支付与个税扣缴的依据，规则只能校验口径一致（考勤已锁定、规则版本、法定代扣），无法判断本月薪酬总额与异常波动是否合理；属高风险，保留人审（正常一级，金额超阈值再加审）。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U7
          on_reject: 1
        permission: 薪酬结算.审核
        page: 审批待办页
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P2D", escalate_to: SH-M1, interrupting: false}   # 暂拟 2 日无人处理升级，待 U7（发薪日）
        withdraw: {to: 1}
        decision:
          - {when: 审批驳回，退回重算, goto: 1}
          - {when: 提交人撤回审批, goto: 1}
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 批准月度薪酬
        aggregate: AGG-73
        emits: [薪酬已批准]
        desc: 审批通过的回调；代扣只限法定项目，以法定货币支付（INV-70）；薪酬已批准触发申报（PRC-125）与提交应付薪酬（PRC-126）；退回重算在聚合稿无命令，〔缺〕退回薪酬重算（notes 结构问题 2）
        audit: true
        metric_event: true
        legal_entity: 薪酬法人（个税扣缴义务人口径）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-73
        calls: PRC-92
        desc: 职工薪酬计提；批准时提交一次候选，发放只置“已发放”，“已过账”由事件策略 PRC-134 置位（G-18 已处理）；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "薪酬所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已批准
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 6e 前薪酬汇总导入（FD-30）作废：一次投产后薪酬在本系统自算，AGG-73 对 platform.integration“薪酬汇总导入”的依赖应删除（notes 结构问题）。取批准时提交一次过账候选。薪酬岗“计算”改为系统自动，保留“提交审核”一步作为制单人签收，兼顾高风险的两人控制。

  # ───────────── VS-13.4 申报缴纳 ─────────────

  - id: PRC-125
    name: 申报个税扣缴与社保公积金
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
      - {type: time, name: "每月申报期前提醒（P-39，platform.scheduling）；股息红利并入后无薪酬批准时也须有触发"}
      - {type: human, name: "人力发起本月申报批次"}
      - {type: time, entry: 7, name: "年度缴费基数调整期（社保公积金缴费基数核定通知后；B-15 向 platform.scheduling 登记定时，按 CONVENTIONS 定时约定）"}
    stages: [VS-13.4, VS-06.1]
    primary_object: OBJ-92
    secondary_objects: [OBJ-62]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-15
    human_orchestration: false
    migration: "历史申报与缴款（老系统税金计算与申报记录）按所属期 × 类型迁入为已缴款；迁入不触发申报、不重新过账（ADR-0036 M7）"
    scope: "按扣缴义务人法人；申报明细含证件号码等个人信息，仅人力薪酬岗可见"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "申报登记与缴款资金支出（出纳，B-10）不得为同一人；申报数据由系统生成，人工只做外部申报与登记回执（SH-E6 内部分岗）"}
    outcomes: [已申报缴款, 已中止, 已提醒, 基数已调整]
    scenarios: [PRC-125-S01, PRC-125-S02, PRC-125-S03, PRC-125-S04, PRC-125-S05, PRC-125-S06, PRC-125-S07]   # S01 系统生成申报数据，线下申报，登记回执与缴款（全程）；S02 证件信息缺失或金额不一致，已中止并告警；S03 申报被退回更正；S04 股息红利并入同期个税申报；S05 个税申报期限提醒升级（非中断，结局已提醒，主线照常）；S06 所属会计期间已关账，过账路由到开放期间；S07 年度缴费基数调整：登记新参保版本后向社保公积金经办平台申报并回填回执
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统生成的申报数据，在外部渠道办理申报与缴款并登记回执", approval_right: "无（人工只做外部申报与登记；缴款资金支出由出纳另行执行）", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "申报期限提醒的升级对象", approval_right: "无", department_hint: "公司管理层", position_hint: "分管副总"}}       # 申报期限提醒升级对象
      - {id: SH-R2, as: external, org_needs: {responsibility: "受理申报并出具回执", approval_right: "无（外部机构，系统外）", department_hint: "外部（税务、社保、公积金经办机构）", position_hint: "不适用"}}       # 税务、社保、公积金经办机构
    steps:
      - actor: system
        where: automatic
        command: 生成申报
        aggregate: AGG-95
        reads: [AGG-74, AGG-81, AGG-73]
        pending: U1
        desc: 读当月参保增减员、薪酬结算、扣缴义务人法人与所属期（会计期间）；按所属期汇总薪酬批准结果与股息红利并入项，生成个税扣缴申报数据（按自然人电子税务局扣缴客户端的导入格式〔中〕）与社保公积金申报明细；校验人员证件信息、申报金额与薪酬结算一致，不一致失败并告警。申报方式为骨架暂拟的 a)，用户未定，见 notes 待用户定 U1、U2
        legal_entity: 扣缴义务人法人
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]     # 生成完成与已中止都发
        cross_bc:
          - {mode: api, direction: out, bc: B-19, name: 读取会计期间与所属期}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        decision:
          - {when: "人员缺证件信息或申报金额与薪酬结算不一致", goto: end}
          - {when: otherwise, goto: 2}
        outcome: 已中止
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税申报回执, 申报日, 申报明细文件]
        command: 提交申报
        aggregate: AGG-95
        pending: U1
        desc: 个税：人力在扣缴客户端导入申报数据并申报，本系统登记申报回执（个人所得税法第九条、第十条；个人所得税扣缴申报管理办法）。法定期限为次月十五日内〔中，核对原文〕（P-39）
        period_gate: false
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # 自次月 1 日起算，P-39 提醒并升级转管理层督办；非中断，独立结束事件「已提醒」（S-28）
        notify: [{to: SH-E6, how: 企业微信待办}]
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕申报端对接（仅方式 b 时启用）}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费申报回执, 公积金汇缴回执, 申报日]
        command: 提交申报
        aggregate: AGG-95
        emits: [个税与社保公积金申报已提交]
        pending: U2
        desc: 社保公积金：人力在税务或社保经办渠道申报社保费、在公积金管理中心办理汇缴，各地渠道不同〔中〕，本系统登记回执；三类均已提交后发出事件
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税缴款凭证, 社保费与公积金缴款凭证, 缴款日]
        command: 登记缴款
        aggregate: AGG-95
        desc: 税款与社保公积金的缴款资金支出不在 AGG-95，缴款凭证与银行流水的对账见 notes 接缝问题
        audit: true
        decision:
          - {when: 申报被退回或发现差错, goto: 5}
          - {when: otherwise, goto: 6}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [更正申报回执, 更正原因]
        entry: 申报被退回或发现差错
        branch: 更正
        command: 更正申报
        aggregate: AGG-95
        audit: true
        decision:
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-95
        calls: PRC-92
        desc: 个税与社保公积金过账；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已申报缴款
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
      - actor: SH-E6               # 人力
        where: in_system
        entry: 年度缴费基数调整期到达
        branch: 年度基数调整
        command: 调整缴费基数
        aggregate: AGG-74
        desc: 每年缴费年度起始前后，社保公积金缴费基数按核定通知（上年度月平均工资）调整；定时（platform.scheduling）到点生成待办提醒人力；人力核对基数核定依据后在系统登记新参保版本，追加新版本并结束旧版本区间（D17），已减员登记不调整，同一登记同一缴费年度至多一次，更正另出新版本；之后在经办平台申报
        permission: 参保登记.调整缴费基数
        page: 参保登记调整页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 8}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费基数申报回执, 公积金基数调整回执, 办理日]
        command: 提交申报
        aggregate: AGG-95
        desc: 新参保版本出后，人力在社保与公积金经办平台办理基数申报与调整（各地渠道不同〔中〕），办理后回填回执；之后每月参保明细按新版本基数生成
        audit: true
        decision:
          - {when: otherwise, goto: end}
        outcome: 基数已调整
    notes: "申报方式用户未定（intent 2026-10-16-152603 只定“个税公司代扣代缴”），骨架先按 a) 画：系统生成申报数据，人工在外部申报端申报并回填回执（offline + 证据）。“生成申报”由人力手工改为系统自动（质检修订）；S-35：年度基数调整分支（步 7、8）承载 AGG-74 调整缴费基数，年度调整期由定时触发，办理在经办平台（offline 带回执），回填后出新参保版本；v1“申报端回执、更正申报无超时或退回分支，按非人工编排（⑥a 评审 M1）”保留。次要对象：OBJ-62 社保与公积金参保（年度基数调整分支产生新参保版本）。"

  - id: PRC-201
    name: 登记代发结果并补发薪酬
    type: business
    trigger:
      type: human
      desc: 财务收到银行代发回单后登记；有支付失败行时经更正工资卡账户发起补发
    triggers:
      - {type: human, name: "财务收到银行代发回单"}
      - {type: human, name: "薪酬岗在员工更正工资卡账户后发起补发", entry: 4}
    stages: [VS-13.5]
    stages_note: "VS-13.5 代发付款：步 1、5 登记代发结果使薪酬结算行到已实付，全部行已实付且应付已结清时同一事务推进月度薪酬结算到已发放（OBJ-73，VS-13.5 退出条件）；支付失败行经步 2–4 补发后重入步 5（PAYROLL_LINE_PAYMENT.md，ARC-1022-COO-06）"
    primary_object: OBJ-73
    owner_bc: B-15
    human_orchestration: true
    human_note: 银行回单的事实登记与补发都不设人审，由守卫控制（回单逐行核对、补发金额等于原实发、补发截止日按工作日历计算）
    migration: "历史薪酬按已发放迁入，薪酬结算行写一条 空 → 已实付 初始转换（ADR-0058 决定 8）；老系统失败与补发记录先取证再定，不推定"
    scope: "薪酬结算行属敏感个人信息：财务职能人员只见本法人代发结果，薪酬岗见本法人薪酬结算行，员工只见本人"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "登记代发结果者（财务，持回单）与发起补发者（人力薪酬岗）不得为同一人"}
    frequency_ref: 待取证（按法人 × 月一次登记；补发频次待取证）
    outcomes: [已发放, 待应付结清, 已提醒]
    scenarios: [PRC-201-S01, PRC-201-S02, PRC-201-S03, PRC-201-S04, PRC-201-S05, PRC-201-S06]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "按银行代发回单逐行登记代发结果（含银行退回日）", approval_right: "无", department_hint: "财务部", position_hint: "财务职能人员（出纳）"}}
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "支付失败行在员工更正工资卡后于补发截止日前发起补发；长假确实办不完时登记顺延并通知员工", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源职能人员（薪酬岗）"}}
      - {id: SH-E3, as: informed, org_needs: {responsibility: "本人支付失败时更正工资卡账户；补发顺延时收到通知", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E6, as: informed, org_needs: {responsibility: "补发截止日到期未补发时收到提醒并督办", approval_right: "无", department_hint: "财务部", position_hint: "法人财务负责人"}}
      - {id: SH-M1, as: informed, org_needs: {responsibility: "补发逾期超过 5 个工作日时收到升级提醒并督办", approval_right: "无", department_hint: "管理层", position_hint: "法人负责人（ROLE-26 总经理，按法人解析）"}}
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记代发结果
        aggregate: AGG-73
        desc: 上传银行代发回单，逐行与薪酬结算行核对人员与实发金额，任一不符整批拒绝并列出差异；成功行到已实付，失败行到支付失败（失败原因、银行退回日必填）；根须为已批准；失败行同时算出补发截止日（见步 2）
        permission: 薪酬代发结果.登记
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 15, p90_min: 60}
        decision:
          - {when: 有薪酬结算行支付失败, goto: 2, p: 0.1}
          - {when: 全部薪酬结算行已实付且应付已结清, goto: end, outcome: 已发放, p: 0.6}
          - {when: otherwise, goto: end, outcome: 待应付结清, p: 0.3}
      - actor: system
        where: automatic
        command: 通知支付失败员工更正工资卡
        platform_task: true
        service: platform.notification
        desc: >-
          通知失败员工与薪酬岗，并经 platform.scheduling 按补发截止日登记到期提醒（幂等键：薪酬结算行 ID + 补发轮次 + 截止日）。
          补发截止日（用户 FCQ-06，intent 2026-10-22-103824）：自银行退回日的次日起算 3 天，第 3 天为截止日；截止日遇节假日或休息日，提前到最近的工作日；
          工作日按 ADR-0072 已确认的工作日历（AGG-68）判定，日历版本缺失时拒绝计算并告警。工资卡账户存放与更正位置待 U8（vs13.notes.md 接缝问题 3）。
        notify:
          - {to: SH-E3, how: 企业微信通知}
          - {to: SH-E6, how: "企业微信待办（薪酬岗）；到期提醒：到期日 = 退回日次日起 3 天，遇节假日或休息日提前到最近工作日，到期未补发计入逾期统计（FCQ-06/07）"}
          - {to: SH-E6, how: "到期提醒法人财务负责人：到期日 = 退回日次日起 3 天（同上）"}
        timeout: {after: "到期后 5 个工作日", escalate_to: ROLE-26, interrupting: false}   # 仍未补发升级到法人负责人（ROLE-26 总经理，按法人解析）；与 ADR-0073 会签逾期链同一纪律（FCQ-07）
        metric_event: true
        decision:
          - {when: 补发截止日落在长假内且确实无法在截止日前办完, goto: 3, p: 0.05}
          - {when: otherwise, goto: 4, p: 0.95}
      - actor: SH-E6
        where: in_system
        command: 登记薪酬补发顺延
        aggregate: AGG-73
        desc: 长假确实没法在 3 天内办完时可顺延：顺延截止日只能是长假前最后一个工作日或长假后第一个工作日（按工作日历），并必须通知员工；不满足则拒绝；顺延后仍未办完照常进逾期统计（FCQ-06）
        permission: 薪酬补发.顺延
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 3, p90_min: 10}
        notify: [{to: SH-E3, how: 企业微信通知（补发顺延及新截止日）}]
      - actor: SH-E6
        where: in_system
        command: 发起薪酬补发
        aggregate: AGG-73
        emits: [薪酬补发已发起]
        desc: 员工工资卡已更正后于补发截止日（或顺延截止日）前发起补发，补发金额等于原实发，不重算；薪酬结算行 支付失败 → 待支付；PRC-126 第 2 步据此调 B-10「登记薪酬补发明细」，在原应付上挂补发明细（不新建应付），由 PRC-75 付清；截止日后才发起的照常补发，但该行已计入逾期统计
        permission: 薪酬补发.发起
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 5, p90_min: 15}
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 薪酬补发已发起}
      - actor: SH-E6
        where: in_system
        command: 登记代发结果
        aggregate: AGG-73
        desc: 登记补发回单；最后一行已实付且应付已结清时同一事务推进根到已发放；补发成功即取消该行的到期提醒
        permission: 薪酬代发结果.登记
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 5, p90_min: 15}
        decision:
          - {when: 有薪酬结算行支付失败, goto: 2, p: 0.05}
          - {when: 全部薪酬结算行已实付且应付已结清, goto: end, outcome: 已发放, p: 0.8}
          - {when: otherwise, goto: end, outcome: 待应付结清, p: 0.15}
    notes: "ARC-1022-COO-06；one-architecture 给号 PRC-201（PRC_ALLOCATIONS.md）。补发时限与提醒按用户 FCQ-06/07（intent 2026-10-22-103824）。待应付结清时由 PRC-127 收到应付已结清后推进根。已实付后银行再退票不建模（J-4，出现首例再开卡）。"

event_policies:

  - id: PRC-113
    name: 并入股息红利个税扣缴申报
    trigger:
      type: event
      events:
        - {event: 利润分配已支付, aggregate: AGG-109}
    triggers:
      - {type: event, name: "利润分配已支付（B-10 发布）"}
    stages: [VS-12.2]
    primary_object: OBJ-92
    owner_bc: B-15
    migration: "历史股息红利个税（老系统无独立记录，是否存在待取证）按所属期迁入申报批次；迁入不触发（ADR-0036 M7）"
    outcomes: [已并入申报, 无需扣缴]
    scenarios: [PRC-113-S01, PRC-113-S02]   # S01 自然人股东分红并入当期个税申报；S02 法人股东不扣缴个税
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉申报批次中出现股息红利并入项", approval_right: "无", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}       # 人力：申报批次中出现并入项
      - {id: SH-O1, as: external, org_needs: {responsibility: "自然人股东是个税纳税人，法人股东自行处理所得", approval_right: "无（外部相关方）", department_hint: "外部（股东）", position_hint: "不适用"}}       # 股东：自然人股东是纳税人
    step:
      actor: system
      where: automatic
      command: 并入扣缴申报
      aggregate: AGG-95
      desc: 自然人股东的股息红利所得适用 20% 比例税率，由支付方代扣代缴（个人所得税法第三条、第九条）；并入当期申报批次，实际申报在 PRC-125；法人股东不涉及个税，合伙人的所得性质因被投资主体而异，见 notes 结构问题
      legal_entity: 扣缴义务人法人
      audit: true
      decision:
        - {when: 股东是法人或机构, goto: end, outcome: 无需扣缴}
        - {when: otherwise, goto: end, outcome: 已并入申报}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 利润分配已支付}
    notes: 沿已有边 B-15 → B-10，不新增反向边。扣缴额须在支付前确定，见 notes 接缝问题 4。

  - id: PRC-126
    name: 提交应付薪酬
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
        - {event: 薪酬补发已发起, aggregate: AGG-73}
        - {event: 付款已部分退回, aggregate: AGG-53}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
      - {type: event, name: "薪酬补发已发起（同 BC，PRC-201 第 3 步）", entry: 2}
      - {type: event, name: "付款已部分退回（B-10 发布；重发此前因退回款未登记被拒的补发明细）", entry: 2}
    stages: [VS-13.5]
    stages_note: "VS-13.5：触发状态「已批准」（OBJ-73）是 VS-13.5 的进入条件，本策略提交应付薪酬正是 VS-13.5「提交应付薪酬、代发付款」的第一步，结局应付已确认导向 VS-13.5 退出「已结清」；不归 VS-13.4——VS-13.4 申报缴纳与应付无关，同为「已批准」进入只是字面重合；原挂 VS-13.3（触发状态所在段的退出）按 #421 第 6a 项改（2026-10-16）"
    primary_object: OBJ-85
    owner_bc: B-15
    migration: "历史薪酬的应付（老系统付款申请单-人事约 1.5 千行）作为已结清应付迁入，只迁结果与证据；迁入不触发（ADR-0036 M7）"
    outcomes: [应付已提交, 补发明细已登记, 待退回到账]
    scenarios: [PRC-126-S01, PRC-126-S02, PRC-126-S03, PRC-126-S04]   # S01 批准后提交合计；S02 重复触发幂等；S03 退回款未登记被拒后重发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "财务知悉待付清单出现应付薪酬或补发明细，按付款流程办理", approval_right: "无", department_hint: "财务部", position_hint: "出纳、应付会计"}}       # 财务：待付清单出现应付薪酬
    steps:
      - actor: system
        where: automatic
        command: 提交应付薪酬
        aggregate: AGG-52
        emits: [应付已确认]
        desc: 薪酬已批准时提交法人 × 月一笔实发合计（新建应付），按薪酬结算 ID 幂等；之后走 PRC-75“发起、审批并执行付款”（B-10）；P-40 每月至少一次支付工资（工资支付暂行规定第七条）；代发明细（员工 × 账户 × 金额）如何随付款交给银行见 notes 接缝问题 3
        audit: true
        legal_entity: 薪酬法人（发薪法人）
        decision:
          - {when: 该薪酬结算已提交过应付, goto: end, outcome: 应付已提交}
          - {when: otherwise, goto: end, outcome: 应付已提交}
        cross_bc:
          - {mode: api, direction: out, bc: B-10, name: 提交应付薪酬}
      - actor: system
        where: automatic
        command: 登记薪酬补发明细
        aggregate: AGG-52
        desc: 薪酬补发已发起时，在原应付薪酬上登记补发明细（已部分结清 → 已部分结清，不新建应付；补发金额等于原实发），由 PRC-75 付清代发退回后恢复的未结余额；守卫：累计补发额不超过累计冲回额，退回款（AGG-53 登记代发退回）未登记的拒收并告警；收到付款已部分退回后重发此前被拒的补发明细；幂等键：薪酬结算行 ID + 补发轮次（one-arch-finance @1565ca88，one-architecture 2026-10-22 定稿 J-1、J-3）
        audit: true
        legal_entity: 薪酬法人（发薪法人）
        notify: [{to: SH-E6, how: 企业微信待办}]      # 被拒时提醒薪酬岗与出纳
        decision:
          - {when: 补发因退回款未登记被拒, goto: end, outcome: 待退回到账}
          - {when: otherwise, goto: end, outcome: 补发明细已登记}
        cross_bc:
          - {mode: api, direction: out, bc: B-10, name: 登记薪酬补发明细}
    notes: 应付薪酬由 B-10 的 AGG-52 承载；补发不新建应付，挂原应付补发明细；付款、核销、代发退回见 PRC-75、PRC-131、PRC-132（B-10，财务组），本组只写接缝。

  - id: PRC-127
    name: 标记薪酬已发放
    trigger:
      type: event
      events:
        - {event: 应付已结清, aggregate: AGG-52, filter: "应付类型为应付薪酬且来源为月度薪酬结算"}
    triggers:
      - {type: event, name: "应付已结清（B-10 发布；B-15 只处理应付薪酬）"}
    stages: [VS-13.5]
    primary_object: OBJ-73
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的发放状态随结算迁入"
    outcomes: [已发放]
    scenarios: [PRC-127-S01, PRC-127-S02, PRC-127-S03]   # S01 应付结清后置已发放并通知工资条；S02 退票时付款已失败，薪酬保持已批准；S03 置已发放时过账事实已入账，转 PRC-134
    roles:
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人工资条", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：工资条可查看
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已发放", approval_right: "无", department_hint: "财务部、人力资源部", position_hint: "薪酬岗、财务"}}
    step:
      actor: system
      where: automatic
      command: 标记薪酬已发放
      aggregate: AGG-73
      emits: [薪酬已发放]
      desc: 应付已结清且全部薪酬结算行已实付才置已发放；有支付失败行时保持已批准，待补发登记成功后由「登记代发结果」同一事务推进（PAYROLL_LINE_PAYMENT.md）；已发放与事实已过账两个条件任一后到者触发置已过账
      audit: true
      notify: [{to: SH-E3, how: 企业微信通知（工资条可查看）}]
      decision:
        - {when: 该薪酬的过账事实已入账, goto: PRC-134}
        - {when: otherwise, goto: end, outcome: 已发放}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 应付已结清}
    notes: 订阅关系 B-15 → B-10（api、事件）。应付已结清事件需带应付类型与来源，B-15 与 B-12 都订阅，各自过滤（notes 结构问题 4）。

  - id: PRC-134
    name: 标记薪酬已过账
    trigger:
      type: event
      events:
        - {event: BusinessFactAttributed, aggregate: AGG-77, filter: "来源单据为月度薪酬结算"}
    triggers:
      - {type: event, name: "BusinessFactAttributed（B-16 发布；B-15 只处理薪酬来源）"}
    stages: [VS-13.5]
    stages_note: "触发是过账事实（BusinessFactAttributed），不是任一阶段的对象状态；改按结局归段：置位月度薪酬结算「已过账」，是 VS-13.5 退出条件「已发放 → 已过账」的末端（归段判据第 6 项）"
    primary_object: OBJ-73
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的已过账状态随结算迁入"
    outcomes: [已过账, 待发放后再置位]
    scenarios: [PRC-134-S01, PRC-134-S02]   # S01 已发放后过账完成置已过账；S02 过账先于发放，记标志待 PRC-127 触发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已过账", approval_right: "无", department_hint: "财务部", position_hint: "总账会计"}}
    step:
      actor: system
      where: automatic
      command: 标记薪酬已过账
      aggregate: AGG-73
      desc: 按来源单据 ID 取薪酬结算行；已发放与事实已过账两个条件任一后到者触发（符合性审查 断链 7）
      audit: true
      decision:
        - {when: 薪酬尚未发放, goto: end, outcome: 待发放后再置位}
        - {when: otherwise, goto: end, outcome: 已过账}
      cross_bc:
        - {mode: event, direction: in, bc: B-16, name: BusinessFactAttributed}
    notes: 由原 PRC-124 末步与 PRC-127 第二步拆出（G-18 已处理）。

  - id: PRC-145
    name: 员工法人三口径不一致预警
    trigger:
      type: event
      events:
        - {event: 劳动合同已签订, aggregate: AGG-67}
        - {event: 〔缺〕法人归属已变更, aggregate: AGG-117}
        - {event: 法人归属已结束, aggregate: AGG-117}   # 2026-10-21 补：终止归属后三口径可能出现缺口，同样复核
        - {event: 薪酬档案已变更, aggregate: AGG-93}
    triggers:
      - {type: event, name: "劳动合同已签订（B-13）"}
      - {type: event, name: "〔缺〕法人归属已变更（B-13）"}
      - {type: event, name: "法人归属已结束（B-13）"}
      - {type: event, name: "薪酬档案已变更（同 BC）"}
    stages: [VS-07.3]
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: B-15
    basis: S-20（one-architecture）；用户 Q-09（intent 2026-10-16-134134）
    migration: "迁入不触发（ADR-0036 M7）；迁入完成后由人力用对账清单一次性核对三口径，不批量发预警"
    outcomes: [三口径一致, 已预警]
    scenarios: [PRC-145-S01, PRC-145-S02]   # S01 三口径一致不预警；S02 入职后劳动合同用人单位与扣缴义务人不一致，预警人力
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收三口径不一致预警并核对更正", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力
    step:
      actor: system
      where: automatic
      desc: 比对劳动合同用人单位（AGG-67）、数据范围法人（AGG-117）、个税扣缴义务人（AGG-93），按同一业务日期取当时有效版本；不一致只预警人力，不拒绝；同一人员同一差异已有未处理预警时不重复发
      notify: [{to: SH-E6, how: 企业微信待办}]
      decision:
        - {when: 三口径中任意两个不一致, goto: end, outcome: 已预警}
        - {when: otherwise, goto: end, outcome: 三口径一致}
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: 劳动合同已签订}
        - {mode: event, direction: in, bc: B-13, name: 〔缺〕法人归属已变更}
        - {mode: api, direction: out, bc: B-13, name: 读取劳动合同用人单位与数据范围法人}
    notes: "B-15 → B-13（api、事件）已有边；扣缴义务人在本 BC。无业务对象，primary_object: none。理由：只预警三口径不一致，不改任何对象状态。"

  - id: PRC-160
    name: 开立年度假期额度账户
    type: event_policy
    trigger:
      type: time
      desc: 每年年初（按日历年度）；年中入职由入职生效触发
    triggers:
      - {type: time, name: "每年年初（B-27 向 platform.scheduling 登记，幂等键 = 聚合 ID + 到期时点）"}
      - {type: event, name: "入职生效（年中入职）", event: Employed, bc: B-13}
    stages: [VS-07.3]
    stages_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I08 题（页首架构处理告知）：VS-07.3 仅对应入职生效 Employed 入口；年初定时开户为年度例行支撑，不表示完成入职。补休按额度行有效期处理，不随年度开户结转。"
    primary_object: OBJ-122
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I08 题；信息图现单列 OBJ-122，保留处理、审批及核对依据。"
    owner_bc: B-27
    migration: "迁入不触发（ADR-0036 M7）；迁入年度的在途额度账户随 AGG-71 迁入，不重新开账"
    outcomes: [年度账户已开立, 结转待处理]
    scenarios: [PRC-160-S01, PRC-160-S02, PRC-160-S03]   # S01 年初先结转上年账户再开立新年账户；S02 年中入职无上年账户，直接开立；S03 上年账户仍有占用中的占用行，结转待处理并告警
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收结转或开账失败告警并跟进处理", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、考勤管理员"}}       # 人力（考勤）：结转或开账失败告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人当年度假期额度", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：当年额度可查看
    steps:
      - actor: system
        where: automatic
        command: 年度结转额度账户
        aggregate: AGG-71
        desc: 按 AGG-118 当日生效规则版本的结转与清零规则计算上年账户的结转额度并置账户为已结转，结转额度记在上年账户上供下一步读取；规则版本取不到失败并告警，不静默（CLAUDE.md 第 6 条）；年中入职触发时无上年账户，跳过本步
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: 无上年度账户（年中入职触发）, goto: 2}
          - {when: 上年账户仍有占用中的占用行, goto: end, outcome: 结转待处理}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        command: 开立年度额度账户
        aggregate: AGG-71
        desc: 对每名在职人员 × 占额度的假期类型开立该年度账户，应享按 AGG-118 当日生效规则版本计算（含上年结转；年中入职按规则折算）；补休不在此开账：补休额度行由加班批准时计入（PRC-117），按补休有效期独立到期，不随日历年度开立、结转或清零；取不到生效版本失败并告警，不回退默认值；已开账无操作
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（本年度额度已开立）}]
        outcome: 年度账户已开立
    notes: "补休额度独立于年度，不在本策略处理（结转与开账只对年度账户，补休额度行的到期未休与离职转计发加班工资见 PRC-178）。B-27 → B-13 订阅 Employed 的事件边需补登（vs13att.notes.md 接缝问题 2）。定时由 B-27 向 platform.scheduling 登记，到点调本 BC 命令，边 B-27 → platform.scheduling 按平台依赖登记（CONVENTIONS §5）。无人工审批。无业务对象，primary_object: none。理由：额度账户（AGG-71）在信息图无对应对象（OBJ-69 假期额度已降为派生余额），结局不改任何阶段对象状态。"

  - id: PRC-178
    name: 转计发加班工资
    type: event_policy
    trigger:
      type: event
      events:
        - {event: 〔缺〕补休已到期未休, aggregate: AGG-71}
        - {event: Separated, aggregate: AGG-62}
    triggers:
      - {type: event, name: "〔缺〕补休已到期未休（B-27 发布）", event: 补休已到期未休, bc: B-27}
      - {type: event, entry: 2, name: "员工离职生效（B-13 发布 Separated）", event: Separated, bc: B-13}
    stages: [VS-13.6]
    stages_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I09 题：VS-13.6 仅对应 Separated 离职入口；到期入口仅支撑薪酬结算，不表示离职结清；两入口向 OBJ-123 登记待计发调整并留幂等依据，U15 未定。"
    primary_object: OBJ-123
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I09 题；信息图现单列 OBJ-123，保留处理、审批及核对依据。"
    owner_bc: B-15
    basis: S-41（one-architecture）；用户页 P13-05；劳动法第四十四条（休息日加班不能安排补休的，支付不低于工资 200% 的报酬）、工资支付暂行规定第十三条（以加班工资基数折算）
    migration: "迁入不触发（ADR-0036 M7）；迁入的补偿方式为调休的加班，其未休余额是否迁为补休额度行待取证后定，迁入后到期的补休余额按本策略转计发"
    scope: "员工本人只看自己的补休转计发结果；薪酬岗与人力可见；金额属敏感个人信息，不进事件载荷"
    outcomes: [已计入加班工资, 离职余额已计入加班工资, 无需计发, 登记待处理]
    scenarios: [PRC-178-S01, PRC-178-S02, PRC-178-S03, PRC-178-S04, PRC-178-S05]   # S01 补休到期未休，读取余额按加班工资基数 200% 计入加班工资；S02 到期入口取不到加班工资基数或读不到余额，登记待处理并告警；S03 员工离职生效，未休补休余额一并计入加班工资；S04 离职入口取不到加班工资基数或读不到余额，登记待处理并告警；S05 离职时无未休补休余额，无需计发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收补休转计发登记待处理的告警并补齐加班工资基数后重新触发", approval_right: "无", department_hint: "人力资源部", position_hint: "薪酬岗"}}       # 人力（薪酬岗）：登记待处理告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉本人到期未休的补休余额已转计发加班工资", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：到期未休余额转计发通知
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕登记补休转加班工资
        aggregate: AGG-93
        pending: U15
        desc: B-27 在补休额度有效期（时长待用户定 U15）届满、仍有未休余额时发出补休已到期未休；B-15 经既有边 B-15 → B-27 读取该额度行的未休余额，按加班工资基数折算的时薪 × 200% 计入加班工资（劳动法第四十四条、工资支付暂行规定第十三条；会计上为累积带薪缺勤负债，企业会计准则第 9 号），登记以额度行 ID 幂等，当月薪酬在 PRC-124 读取，不在本策略算钱；加班工资基数取不到或余额读不到时失败并告警薪酬岗，不静默按零
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（余额已转计发加班工资）}, {to: SH-E6, how: 企业微信待办}]      # 薪酬岗仅登记待处理时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-27, name: 〔缺〕补休已到期未休}
          - {mode: api, direction: out, bc: B-27, name: 读取补休额度行余额}
        decision:
          - {when: 加班工资基数取不到或补休额度行余额读取失败, goto: end, outcome: 登记待处理}
          - {when: otherwise, goto: end, outcome: 已计入加班工资}
      - actor: system
        where: automatic
        entry: 员工离职生效，仍有未休补休余额
        branch: 离职
        command: 〔缺〕登记补休转加班工资
        aggregate: AGG-93
        pending: U15
        desc: 离职生效后（Separated）B-15 读取该员工全部未休补休余额（离职生效后劳动关系已终止，不再有补休可安排，余额只能折算计发；劳动法第四十四条、《工资支付暂行规定》第十三条），按加班工资基数折算的时薪 × 200% 计入加班工资，随最后一期薪酬由 PRC-124 计发；按额度行 ID 幂等，已登记的额度行不重复；加班工资基数取不到或余额读不到时失败并告警薪酬岗，不静默按零；无未休余额则无需计发
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]      # 薪酬岗仅登记待处理时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
          - {mode: api, direction: out, bc: B-27, name: 读取补休额度行余额}
        decision:
          - {when: 员工无未休补休余额, goto: end, outcome: 无需计发}
          - {when: 加班工资基数取不到或补休额度行余额读取失败, goto: end, outcome: 登记待处理}
          - {when: otherwise, goto: end, outcome: 离职余额已计入加班工资}
    notes: "入口 1 的事件由 B-27 在补休额度有效期届满发出，入口 2 订阅 B-13 的 Separated（与 PRC-130 同事件）；边 B-15 → B-27（api）与 B-15 → B-13（事件）均已有，不新增。B-27 侧保留命令补休到期转计薪（到期未休，发补休已到期未休），金额与登记全在 B-15；B-27 因占用中请假暂不能转计薪时的告警属 B-27 命令前置条件（vs13att.commands.yaml）。S-42：B-27 不订阅 Separated 做补休结算（原命令离职结算补休余额已删），离职时由 B-15 入口 2 直接读取余额。无业务对象，primary_object: none。理由：结局只在人员薪酬档案（AGG-93，OBJ-61 已降为属性）登记待计发加班工资，信息图无对应对象，不改任何阶段对象状态。"

single_aggregate:

  - id: PRC-119
    name: 维护工作日历与标准工时版本
    type: single_aggregate
    aggregate: AGG-68
    owner_bc: B-14
    stages: [VS-15.2]
    stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；判据：工作日历「已维护」为 VS-15.2 退出；原支撑理由：B-14 工作日历与标准工时版本的配置维护，结局不造任何阶段的退出条件（工作日历「已维护」是 VS-13.1 的进入条件，判据按退出条件归段）（STAGE_ALIGN.md 归段判据第 6 项）"
    primary_object: OBJ-28
    desc: 人力每年维护或调整标准工时
    triggers:
      - {type: human, name: "人力每年维护工作日历，或调整标准工时"}
    migration: "历史工作日历年度与标准工时版本（已建 AGG-68 / AGG-108）按生效区间迁入；迁入不发事件（ADR-0036 M7）"
    scope: "人力维护；全员可读"
    outcomes: [工作日历已维护, 标准工时版本已发布, 版本被拒]
    scenarios: [PRC-119-S01, PRC-119-S02, PRC-119-S03]   # S01 年度维护日历；S02 发布新标准工时版本，与现有版本区间重叠被拒；S03 新标准工时版本区间不重叠，发布成功
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "每年维护工作日历与标准工时版本，对依据文件的准确性负责", approval_right: "无（版本区间由不变量守卫）", department_hint: "人力资源部", position_hint: "人力资源专员、考勤管理员"}}      # 人力
    steps:
      - actor: SH-E6
        where: in_system
        command: 维护工作日历年度
        aggregate: AGG-68
        emits: [WorkCalendarLockedDaysChanged]
        desc: 依据当年国家节假日安排与调休上班日，维护法定节假日与调休；依据文件引用记入版本
        permission: 工作日历.维护
        page: 工作日历维护页
        audit: true
        outcome: 工作日历已维护
        cross_bc:
          - {mode: api, direction: in, bc: B-27, name: 读取工作日历}
          - {mode: api, direction: in, bc: B-06, name: 读取工作日历}
      - actor: SH-E6
        where: in_system
        command: 发布标准工时版本
        aggregate: AGG-108
        emits: [标准工时版本已生效]
        desc: 生效后不得修改，更正另追加新版本（INV-116），不追溯已确认的工时与请假拆分；法人可空表示默认
        permission: 标准工时.发布
        page: 标准工时版本页
        audit: true
        decision:
          - {when: 同一法人（空为默认）已有版本的生效区间重叠, goto: end, rule: INV-116, outcome: 版本被拒}
          - {when: otherwise, goto: end, outcome: 标准工时版本已发布}
        cross_bc:
          - {mode: api, direction: in, bc: B-06, name: 读取标准工时版本}
          - {mode: api, direction: in, bc: B-27, name: 读取标准工时版本}
    notes: B-06、B-27 经 api 按 ID 与日期读取。事件“标准工时版本已生效”订阅方列宜写仅分析（G-15）。法人引用 B-14 → B-13 无登记边，见 NOTES 数据接缝问题 1。

  - id: PRC-123
    name: 调整薪酬档案与专项附加扣除
