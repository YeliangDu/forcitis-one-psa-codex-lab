    scope: "仅人力薪酬岗与财务主管可见和调整；员工只读本人；薪酬与专项附加扣除均为敏感个人信息（ADR-0043）"
    outcomes: [薪酬档案已调整, 专项附加扣除已更新, 调整被拒]
    scenarios: [PRC-123-S01, PRC-123-S02, PRC-123-S03, PRC-123-S04, PRC-123-S05]   # S05 转正已办理，生成待办提醒薪酬岗按劳动合同约定的转正工资登记新版本（版本生效日 = 转正日），不自动改薪；S01 调薪生效日在未结月份；S02 生效日早于已批准薪酬所属月，补发补扣走下月；S03 年度更新专项附加扣除；S04 未引用调薪决定依据，调整被拒
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "依据调薪决定登记薪酬档案版本，年度更新专项附加扣除，对依据完整性负责", approval_right: "无（无依据即由规则拒绝；调薪决定是否进审批待用户定 U9）", department_hint: "人力资源部（薪酬岗）", position_hint: "薪酬岗"}}      # 人力（薪酬岗）
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "本人年度申报或修改专项附加扣除，对申报内容负责；接收本人薪酬变更通知并核对", approval_right: "无（员工对申报内容负责，税务端核验）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：本人发令（AGG-120），并接收本人薪酬变更通知
    commands:
      - actor: SH-E6
        where: in_system
        command: 调整薪酬档案
        emits: [薪酬档案已变更]
        aggregate: AGG-93
        pending: U9
        entry: 人力按调薪决定登记，或收到转正已办理的待办后按劳动合同约定的转正工资登记（S-42）
        desc: 薪酬属性版本，调薪产生新版本，生效依据人事业务生效日（U-12）；规则守卫：调整必须引用调薪决定依据（审批单据 ID 或决定文件），无依据即拒绝。调薪决定本身是否进审批平台见 notes 待用户定 U9（推荐进：approver=cost_object_owner，薪酬标准变更是对个人长期薪酬的承诺，规则无法判断合理性，属高风险，金额超阈值按 AR-01、AR-02 加审），U9 定后此步前加审批节点
        permission: 薪酬档案.调整
        page: 薪酬档案页
        audit: true
        metric_event: true
        legal_entity: 扣缴义务人法人（三口径之一）
        decision:
          - {when: "未引用调薪决定依据", goto: end, outcome: 调整被拒}
          - {when: "生效日早于已批准的月度薪酬所属月", goto: end, outcome: 薪酬档案已调整}   # 已批准结算不改；补发补扣由下月结算更正行承接，AGG-73 无此行类型（notes 结构问题）
          - {when: otherwise, goto: end, outcome: 薪酬档案已调整}
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与任职}
          - {mode: event, direction: in, bc: B-13, name: 〔缺〕转正已办理}   # S-42：订阅后生成待办提醒人力（薪酬岗），不自动改薪；待办的版本生效日 = 转正日（U-12）
      - actor: SH-E3
        where: in_system
        command: 更新专项附加扣除
        aggregate: AGG-120
        pending: U9
        desc: AGG-120 专项附加扣除声明（S-32 自 AGG-93 拆出）：员工本人发令，年度生命周期，与薪酬档案版本无共享命令与不变量；人力代录入是否保留见 notes 待用户定 U9；不设审批（员工对申报内容负责，税务端核验）；含未成年子女等信息，按敏感个人信息处理（拿不准归 SPI，交 U-11）
        permission: 专项附加扣除.更新
        page: 专项附加扣除页
        audit: true
        outcome: 专项附加扣除已更新
    notes: 单聚合维护含 AGG-93 与 AGG-120 两个聚合，不拆（S-43 #24 同类）：同一 BC（B-15）、同一页面与同一权限组；每条命令与每条转换各只改一个聚合（调整薪酬档案改 AGG-93，更新专项附加扣除改 AGG-120），一个事务一个聚合，检查口径以条目级 aggregate 为准。AGG-93 含敏感个人信息，按 ADR-0043 登记访问级别。建立薪酬档案在 PRC-84。S-42 事件入口：B-15 订阅 B-13 的〔缺〕转正已办理（事件策略「转正后复核薪酬」，边 B-15 → B-13 事件已有），生成待办提醒薪酬岗按劳动合同约定的转正工资调整薪酬档案，版本生效日 = 转正日（U-12），不自动改薪（工资金额以劳动合同约定为准，系统不推定）；待办处理仍走第 1 步，须引用调薪决定依据（劳动合同或转正决定文件）；取代原 PG-10「转正调薪靠人力人工发现」。

