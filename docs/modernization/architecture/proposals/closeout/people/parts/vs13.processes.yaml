# VS-13 获得报酬流程骨架（vs13 子代理，铺开；质检修订版，用户新原则：能规则化的不设人工审批）。字段依 closeout/CONVENTIONS.md（含第 5 节）；v1 字段原样保留，只增补，审批取舍造成的 human_orchestration 变化见 notes 格式问题。
# v1 的中文 actor 已换成 SH- 编号：员工 SH-E3；部门负责人 / 用人经理 SH-E1；人力 / 财务 / 财务主管 SH-E6（内部分岗用行尾注释）；管理层 SH-M1；系统策略 system；平台任务 platform。
# 命令名写〔缺〕表示聚合稿 §2.2 没有，不假装存在，见 vs13.notes.md「新用语」。
# 已定口径：考勤打卡来自企业微信（intent 2026-10-16-152603）；薪酬新系统自算；个税公司代扣代缴；一次投产、全部历史迁入（U-1–U-4）；A8 行政流程迁入走通用审批（C-3–C-7）。
# 审批取舍（本稿）：取消 3 个人工节点（加班批准、月度考勤人力锁定与代确认、奖金草拟）并把请假改为额度与规则内自动通过、超阈值才人审；保留 4 个人工审批（请假异常单、激励方案、奖金核定、月度薪酬审核），均 approver=cost_object_owner 并写 why_human；逐项理由见 QC-VS-13.md。
# 扩展写法（用到的 CONVENTIONS 以外写法，均记入 notes「格式问题」）：decision 项可带 outcome；events 项可带 filter；steps 可带 entry（分支步骤的进入条件）；审批超时由 timeout 表示。
# 判断点依据写在 decision 后的注释行（CONVENTIONS 无 basis 字段）。

processes:

  # ───────────── VS-13.1 考勤确认 ─────────────

  - id: PRC-115
    name: 导入考勤记录并补卡
    trigger:
      type: time
      desc: 每日同步考勤来源
    triggers:
      - {type: time, name: "每日拉取企业微信打卡记录（platform.scheduling 定时）"}
      - {type: human, name: "人力修复人员对照后重新拉取"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    migration: "历史打卡（老系统约 79.5 万行）与补卡经迁入通道全量迁入为考勤记录，来源对照区分来源系统；迁入不触发导入流程、不发事件（ADR-0036 M7）"
    scope: "员工本人看自己的考勤；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [考勤已导入, 导入失败已告警, 补卡已记录]
    scenarios: [PRC-115-S01, PRC-115-S02, PRC-115-S03, PRC-115-S04, PRC-115-S05]   # S01 每日导入成功；S02 拉取失败或批次不完整，告警后人力重拉；S03 存在无法对应人员的记录，整批告警；S04 员工补卡，原记录不改，所属月已锁定则计入下月更正行；S05 补卡超次数或时限，被拒回补卡页
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 补卡发起人（员工）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收导入失败告警，修复人员对照后重新拉取", approval_right: "无", department_hint: "人力资源部、信息部门", position_hint: "人力资源专员、考勤管理员"}}       # 人力、信息：导入失败告警
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属补卡", approval_right: "无（补卡不设审批，由次数与时限规则守卫）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：补卡知会
    steps:
      - actor: system
        where: external:企业微信
        evidence: [导入批次号, 拉取日期, 记录条数, 校验和]
        command: 导入考勤记录
        aggregate: AGG-69
        desc: 经 platform.integration 的企业微信适配器每日拉取前一日打卡，转换后调用本 BC 写入；只追加不可改（INV-69），以企业微信记录 ID 幂等；企业微信成员经来源对照解析到人员 ID，解析不到的记录整批告警不静默。补卡只补已导入日期上缺失的打卡，故员工补卡从本步之后进入步骤 3
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 拉取企业微信打卡记录}
        decision:
          - {when: "拉取失败、批次不完整或存在无法对应人员的记录", goto: 2}
          - {when: "员工发现已导入日期缺卡并发起补卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 考勤已导入
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；INV-69；用户事实 intent 2026-10-16-152603（打卡来源企业微信）
      - actor: platform
        where: automatic
        platform_task: true
        service: platform.integration
        command: 告警导入失败
        desc: 告警人力与信息，不静默；缺失日期不得被月度考勤当作“全勤”（PRC-118 步骤 1 校验）；修复后由人力重新拉取（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 导入失败已告警
      - actor: SH-E3
        where: in_system
        entry: 员工对已导入日期的缺卡发起补卡
        branch: 补卡
        command: 补卡
        aggregate: AGG-69
        pending: U4
        desc: 原打卡记录不改，补卡另记一条（INV-69）；规则守卫（不设上级审批）：只能补该日缺失的打卡、每月补卡次数不超上限、不超补卡时限，违反即拒绝并停留在补卡页；所属月份月度考勤已锁定的，补卡照常记录，其对考勤的影响计入下月更正行并标原月份（INV-105）。次数上限与时限待用户定 U4
        permission: 考勤.补卡
        page: 补卡申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "超出每月补卡次数上限、补卡时限，或该日并不缺卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 补卡已记录
    notes: 来源系统已定为企业微信（原 v1 备注“来源系统待定 R2”作废）。外勤、出差、特殊假别等非打卡类考勤聚合稿无命令，见 notes 结构问题。补卡不设人审：证据在打卡与补卡留痕，滥用靠次数与时限规则及月度考勤员工确认、用人经理知会兜底（QC-VS-13.md）。

  - id: PRC-116
    name: 申请并审批请假
    trigger:
      type: human
      desc: 员工提交请假
    triggers:
      - {type: human, name: "员工提交请假"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: true
    human_note: 请假审批、驳回或撤销释放额度；额度与假期规则内的请假自动通过，只有异常单进入人工审批
    migration: "历史请假（老系统请假档案约 2.4 万条）全量迁入为已结实例，已用额度按迁入对账不重算、不发事件；在途（审批中）按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）"
    scope: "员工本人、其审批人、人力；病假等事由随 ADR-0043 分级限制可见范围（事由敏感度 tbd，交 U-11）"
    segregation:
      - {roles: [SH-E3, SH-E1], rule: "申请人不得审批本人请假（申请人本身是部门负责人时，按 AR-11 由其上级审批）"}
    outcomes: [已批准, 已驳回, 已撤销, 已销假, 额度不足被拒]
    scenarios: [PRC-116-S01, PRC-116-S02, PRC-116-S03, PRC-116-S04, PRC-116-S05, PRC-116-S06, PRC-116-S07, PRC-116-S08, PRC-116-S09, PRC-116-S10, PRC-116-S11]   # S01 额度不足被拒；S02 额度内年假自动批准；S03 超阈值长假进入审批并批准；S04 审批驳回释放占用；S05 审批中员工撤回；S06 审批 3 日无人处理升级；S07 已批准未开始，员工撤销回冲；S08 请假已开始提前销假回冲；S09 申请人本人是部门负责人，由其上级审批（AR-11）；S10 政策允许透支，进入审批；S11 请假已开始后员工点撤销，转为销假办理
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为申请人所在组织单元的责任人，判断异常请假能否离岗", approval_right: "正常一级审批（cost_object_owner 解析结果）；超阈值时 AR-11、AR-12 加审", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 申请人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: informed, org_needs: {responsibility: "接收审批超期或期限提醒的升级，必要时督办", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 审批超期升级对象；暂拟，待 U3
      - {id: SH-E6, as: informed, org_needs: {responsibility: "维护额度与假期规则，接收请假知会", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：额度与假期规则维护方，知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 占用余额
        aggregate: AGG-71
        reads: [AGG-68, AGG-108, AGG-118]
        desc: 与提交请假是员工的同一次操作，分两个聚合两个事务，最终一致；占用以请假 ID 幂等，孤儿占用由定时释放（聚合稿 §7 第 6 条）；同时读工作日历与标准工时版本做按日拆分（取不到当日生效版本须失败并告警，INV-116）
        permission: 请假.提交
        page: 请假申请页
        cross_bc:
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与汇报线}
        decision:
          - {when: "超出可用额度且假期类型政策不允许透支", goto: end, rule: INV-68}
          - {when: otherwise, goto: 2}
        outcome: 额度不足被拒
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        pending: U3
        desc: 起止时刻可跨日、半天或按小时；按日拆分，非工作日计 0。系统按规则分流：额度内、假期类型规则允许、单次天数不超免审批阈值、该假别无需证明材料的，自动批准并知会直属上级；其余（超阈值、需证明材料的假别、政策允许的透支）进入人工审批。阈值与假别清单待用户定 U3
        permission: 请假.提交
        page: 请假申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "额度内、假期规则允许、天数不超免审批阈值且无需证明材料", goto: 4}
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；INV-68（额度）；AGG-118（假期规则）；阈值待 U3
      - actor: SH-E1               # 部门负责人
        where: in_system
        platform_task: true
        service: platform.approval
        command: 请假审批
        pending: U3
        desc: 只有超阈值长假、需证明材料的假别（是否合规需人看材料）、政策允许的透支才到此；工时单最低时数扣减已批准与待批请假（INV-65，B-06 经 api 读取，只取时长）
        approval:
          engine: platform.approval
          doc_type: 请假审批
          approver: cost_object_owner   # 请假单的归属对象是申请人所在组织单元，其责任人即部门负责人（SH-E1）
          why_human: "超阈值长假、需证明材料的假别与透支需判断业务上能否离岗（项目人力安排）和材料真伪，规则只能校验额度、假期规则与天数，不能代替这一判断；额度内的常规请假已自动通过。"
          escalation_rules: [AR-11, AR-12]
          on_reject: 6
        permission: 请假.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: true}   # 暂拟 3 日无人处理升级转管理层处理，待 U3；写中断是因非中断的升级分支会与主线在下游并发（生成器 R14）
        withdraw: {to: 7}
        decision:
          - {when: 审批驳回, goto: 6}
          - {when: 员工在审批中撤回, goto: 7}
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起请假审批}
      - actor: system
        where: automatic
        command: 批准请假
        aggregate: AGG-70
        emits: [请假已批准]
        desc: 两条路径汇合：规则内自动批准，或审批平台通过的回调（走审批的路径带“审批已通过”事件）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 批准转已用
        aggregate: AGG-71
        on_event: [{aggregate: AGG-70, event: 请假已批准}]
        desc: 同 BC 事件反应，把占用转为已用；批准后员工仍可在开始前撤销或开始后销假
        decision:
          - {when: 请假开始前员工撤销, goto: 7}
          - {when: 请假期间员工提前结束, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已批准
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回请假
        aggregate: AGG-70
        desc: 审批驳回的回调；聚合稿 AGG-70 没有驳回命令（NOTES 铺开备忘）
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: SH-E3
        where: in_system
        entry: 请假审批中或已批准、尚未开始时，员工撤销
        branch: 撤销
        command: 撤销请假
        aggregate: AGG-70
        emits: [请假已撤销]
        desc: 审批中撤销须同时撤回审批实例（platform.approval 的取消能力，见 notes 接缝问题 1）；已开始的请假不能撤销，只能销假
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}          # 审批中撤销：占用尚未转已用
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}    # 已批准后撤销：占用已转已用，需回冲
        permission: 请假.撤销
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 请假已开始, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已撤销
      - actor: SH-E3
        where: in_system
        entry: 已批准的请假提前结束
        branch: 销假
        command: 销假
        aggregate: AGG-70
        emits: [请假已销假]
        desc: 未休完的部分回冲已用额度；销假是事实登记，不再审批，知会直属上级（U3 推荐，待确认）
        inner:
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}
        permission: 请假.销假
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        outcome: 已销假
    notes: 驳回、撤销、销假的额度回冲在聚合稿没有对应命令（驳回请假、回冲已用额度均为〔缺〕）。v1 把“占用余额”写在“提交请假”之前，骨架保留 v1 顺序并说明为同一次操作。

  - id: PRC-117
    name: 申请并批准加班
    trigger:
      type: human
      desc: 员工或部门提出加班
    triggers:
      - {type: human, name: "员工或用人经理登记加班"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    human_note: 加班审批已取消：事前登记，事后以打卡核实，批准由系统按规则作出（质检修订，用户原则）
    migration: "历史加班（老系统是否有加班记录尚未取证）全量迁入为已结实例；在途按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）"
    scope: "员工本人、其用人经理、人力"
    outcomes: [已批准, 已驳回]
    scenarios: [PRC-117-S01, PRC-117-S02, PRC-117-S03, PRC-117-S04]   # S01 登记、加班日后打卡核实、自动批准；S02 打卡不支持登记的加班时长，驳回；S03 当月累计超 36 小时预警并知会、不拦截；S04 补登超过允许期限，被拒回登记页
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属加班登记，也可代员工登记", approval_right: "无（加班不设审批，由打卡核实）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：登记知会；也可代员工登记
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收当月加班超 36 小时的预警", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：当月超 36 小时预警知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 加班申请
        aggregate: AGG-72
        pending: U5
        desc: 登记即事前申请，不设审批：每月累计超 36 小时只预警并留痕，不拦截（P-34；劳动法第四十一条）；补偿方式按加班日类型由规则定（法定节假日付加班费，休息日与工作日按补偿政策选加班费或调休），不由人审；事后补登的允许期限待用户定 U5
        permission: 加班.申请
        page: 加班申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信通知}]   # 人力仅超 36 小时时才发
        decision:
          - {when: "补登超过允许期限，或加班时段与已批准请假重叠", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        on_time: 加班日考勤已导入
        command: 批准加班
        aggregate: AGG-72
        emits: [加班已批准]
        desc: 以打卡核实代替人工批准：加班日的打卡记录（AGG-69）能支持登记的加班时长即批准（以打卡可证实的时长为准）；批准后汇入当月月度考勤（PRC-118 读取，不订阅），工时单引用加班 ID
        decision:
          - {when: 打卡记录不支持登记的加班时长, goto: 3}
          - {when: otherwise, goto: end}
        outcome: 已批准
        # 依据：用户原则「能规则化就不设人审」；加班费真实性由打卡校验，必要性由超 36 小时预警与月度考勤知会兜底
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回加班
        aggregate: AGG-72
        desc: 聚合稿 AGG-72 没有驳回命令；打卡不支持时驳回并告知登记人
        notify: [{to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
    notes: 加班“已补偿”由月度考勤已确认事件触发（PRC-118），补偿方式（加班费或调休）在 AGG-72 记录；调休由请假冲抵。原 v1 的审批节点取消，PRC-117 不再是人工编排流程（catalog 的 human_orchestration 须随之改为 false，见 notes 格式问题）。

  - id: PRC-118
    name: 生成、确认并锁定月度考勤
    trigger:
      type: time
      desc: 月末
    triggers:
      - {type: time, name: "月末生成（platform.scheduling 定时）；确认期限届满锁定"}
      - {type: human, name: "人力在导入修复后重新发起生成"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    human_note: 员工确认或更正，逾期默认确认并自动锁定（人力不再手工锁定、不再代确认；质检修订）
    migration: "历史月度考勤确认（老系统月 × 一级部门 1,026 单）与人员 × 月不对应：按 NOTES 待用户定数据 2 处理，本流程不触发、不回放；锁定前的在途月份按当前状态迁入"
    scope: "员工本人看自己的；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [已锁定, 已暂缓]
    scenarios: [PRC-118-S01, PRC-118-S02, PRC-118-S03, PRC-118-S04, PRC-118-S05]   # S01 员工确认后期限届满自动锁定；S02 员工提出更正，补卡后重新生成再确认；S03 逾期未确认，默认确认并锁定、标记；S04 离职当月，账号已吊销，默认确认并锁定；S05 当月有日期导入失败，暂缓生成
    roles:
      - {id: SH-E3, as: performer, org_needs: {responsibility: "核对并确认本人当月出勤、请假、加班，有异议提出更正", approval_right: "无（确认是数据主体对自己事实的确认，不是审批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 员工：确认或更正本人月度考勤
      - {id: SH-E1, as: informed, org_needs: {responsibility: "接收逾期未确认名单，必要时提醒下属", approval_right: "无", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：逾期未确认名单知会
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：导入失败暂缓知会
    steps:
      - actor: system
        where: automatic
        command: 生成月度考勤
        aggregate: AGG-97
        reads: [AGG-69, AGG-70, AGG-72, AGG-68]
        desc: 汇总考勤、请假、加班，人员 × 月一份；含出勤天数、请假（按类型）、加班（按补偿方式）与更正行；月内存在无导入批次或批次失败的日期时失败并告警，不得当作全勤；审批中的请假不汇入，批准后计入下月更正行并标原月份（INV-105）
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取当月在职与当月离职人员}
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 暂缓时才发
        decision:
          - {when: "当月有日期的考勤导入失败或缺批次", goto: end}
          - {when: "人员当月已离职（离职生效后账号已吊销，本人无法确认）", goto: 7}
          - {when: otherwise, goto: 2}
        outcome: 已暂缓
        # 依据：CLAUDE.md 第 6 条；PRC-115 步骤 2；RULE-363（离职生效即吊销登录）；STEP3 C-17（离职当月仍须确认考勤）
      - actor: SH-E3
        where: in_system
        command: 员工确认
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 员工核对本人当月出勤、请假、加班，无误即确认，有异议提出更正；这是数据主体对自己事实的确认（劳动争议中的出勤证据），不是审批，不设 approval；期限内未确认由系统默认确认，不追办、不人工代确认
        permission: 月度考勤.确认
        page: 我的月度考勤页
        audit: true
        timeout: {after: "P3D", escalate_to: system, interrupting: true}   # 暂拟 3 天，起算点与期限待用户定 U6；届满由系统默认确认（步骤 7）
        decision:
          - {when: 提出更正, goto: 5}
          - {when: 确认期限届满仍未确认, goto: 7}
          - {when: otherwise, goto: 3}
      - actor: system
        where: automatic
        command: 标记加班已补偿
        aggregate: AGG-72
        on_event: [{aggregate: AGG-97, event: 月度考勤已确认}]
        emits: [加班已补偿]
        desc: 订阅月度考勤已确认（同 BC），按加班 ID 幂等
      - actor: system
        where: automatic
        on_time: 员工确认期限届满
        command: 锁定
        aggregate: AGG-97
        emits: [月度考勤已锁定]
        desc: 确认期限届满自动锁定，未确认者标记“逾期未确认”；锁定后不改，补卡、请假、加班变动计入下月并标原月份（INV-105）；月度考勤已锁定是 B-15 薪酬结算可取数的依据
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]     # 逾期未确认名单
        outcome: 已锁定
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 月度考勤已锁定}
      - actor: SH-E3
        where: in_system
        entry: 员工对生成结果有异议
        branch: 提出更正
        command: 补卡
        aggregate: AGG-69
        calls: PRC-115
        desc: 缺卡走补卡；请假或加班有误由员工撤销或重提（PRC-116、PRC-117）；锁定前的更正都回到“重新生成”
        permission: 考勤.补卡
        page: 我的月度考勤页
      - actor: system
        where: automatic
        branch: 重新生成
        command: 〔缺〕重新生成月度考勤
        aggregate: AGG-97
        desc: 确认前依据最新考勤、请假、加班重新汇总，幂等；已确认或已锁定的不可重新生成（INV-105）
        decision:
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        entry: 逾期未确认，或人员当月已离职、本人无法登录确认
        branch: 默认确认
        command: 〔缺〕默认确认月度考勤
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 取代原“人力手工锁定”与“人力代员工确认”：按生成结果默认确认并标记（逾期未确认 / 已离职），留存标记与审计；锁定后的异议走下月更正行。是否改回人力代确认离职人员见 U6
        audit: true
        decision:
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；RULE-363；STEP3 C-17（“确认”由默认确认满足，待 U6 确认）
    notes: 员工确认是员工本人对自己月度考勤的确认，不是审批（质检修订：notes 格式问题 2 作答），故不写 approval，catalog 的 human_orchestration 须改为 false。人力不再手工锁定、不再代确认，减少两次人工；用人经理不复核（U6 推荐不变）。

  # ───────────── VS-13.2 绩效激励 ─────────────

  - id: PRC-120
    name: 评估月度绩效
    trigger:
      type: time
      desc: 评估期间结束
    triggers:
      - {type: time, name: "评估期间结束（platform.scheduling 定时提醒用人经理）"}
    stages: [VS-13.2]
    owner_bc: B-13
    human_orchestration: false
    migration: "历史月度评估（老系统月度评估表 三类模板）全量迁入为已确认评估，不发事件、不触发奖金核定（ADR-0036 M7）"
    scope: "被评人员本人、其用人经理与上级、人力；评估结论按个人信息分级（ADR-0043）"
    outcomes: [已确认]
    scenarios: [PRC-120-S01, PRC-120-S02]   # S01 编制、提交、确认；S02 同人同期同类型已有已确认评估被拒
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制、提交并确认下属月度绩效评估，对评估结论负责", approval_right: "无（评估是专业判断）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：评估完成知会
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制绩效评估
        aggregate: AGG-106
        desc: 评估期间结束由系统提醒用人经理；类型为月度；同一人同期同类型只一份（INV-114）
        permission: 绩效评估.编制
        page: 绩效评估编辑页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 同一人同期同类型已有已确认评估, goto: end, rule: INV-114}
          - {when: otherwise, goto: 2}
        outcome: 已确认
      - actor: SH-E1
        where: in_system
        command: 提交绩效评估
        aggregate: AGG-106
        pending: U11
        desc: 提交的接收方（上级复核、被评人阅知或申诉）v1 未写，见 notes 待用户定 U11；本稿不设审批，评估是用人经理的专业判断而非审批，若 U11 定上级复核再按 cost_object_owner 加人工审批
        permission: 绩效评估.提交
        page: 绩效评估编辑页
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        pending: U11
        desc: 确认后不可改（INV-114）；事件须带评估类型（月度 / 试用期），否则 PRC-122 无法区分（notes 结构问题）
        permission: 绩效评估.确认
        page: 绩效评估编辑页
        audit: true
        outcome: 已确认
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}
    notes: 状态流转由用户定，细则为推断，待流程梳理确认（v1）。试用期评估是 PRC-85 的步骤，不在本流程。

  - id: PRC-121
    name: 制定激励方案
    trigger:
      type: human
      desc: 管理层与人力制定
    triggers:
      - {type: human, name: "人力按管理层要求编制激励方案版本"}
    stages: [VS-13.2]
    owner_bc: B-15
    human_orchestration: true
    human_note: 编制 → 审批 → 到期自动生效
    migration: "历史激励方案（老系统无流程，奖金计提来自线下导入）按方案版本重建后迁入；在途无；迁入不触发审批（ADR-0036 M7）"
    scope: "人力、管理层；方案含薪酬敏感数据"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "方案编制人不得审批本人编制的方案（AR-11 同理）"}
    outcomes: [已生效, 已撤回]
    scenarios: [PRC-121-S01, PRC-121-S02, PRC-121-S03, PRC-121-S04, PRC-121-S05]   # S01 编制、审批通过、到期自动生效；S02 审批驳回退回修改；S03 编制人在审批中撤回；S04 生效日早于已核定奖金所属期，被拒回编制；S05 方案额度合计超阈值，加一级（AR-01）
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "按管理层要求编制激励方案版本（规则与额度），对内容完整性负责", approval_right: "无（编制人不得审批本人编制的方案）", department_hint: "人力资源部", position_hint: "人力资源负责人、薪酬岗"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "作为方案适用范围的责任人，对经营取舍负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值时上加一级", department_hint: "公司管理层", position_hint: "总经理、分管副总、事业部负责人"}}       # 管理层：方案适用范围（法人或事业部）的责任人
    steps:
      - actor: SH-E6               # 人力
        where: in_system
        command: 编制激励方案版本
        aggregate: AGG-75
        desc: 规则与额度；版本化配置（D15），生效日期向后，不追溯已核定奖金；规则守卫：生效日期不得早于已核定奖金所属期，违反即拒绝并停留在编辑页
        permission: 激励方案.编制
        page: 激励方案编辑页
        decision:
          - {when: "生效日期早于已核定奖金所属期", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 激励方案审批
        gap: G-02
        pending: U10
        desc: 方案规则与额度是经营决策，保留人审
        approval:
          engine: platform.approval
          doc_type: 激励方案审批
          approver: cost_object_owner   # 方案的归属对象是其适用范围（法人或事业部），责任人为管理层（SH-M1）
          why_human: "激励方案的规则与额度决定公司对员工的奖金承诺，涉及经营导向与预算取舍，没有客观条件可由规则代替；生效后不可追溯修改，故事先由责任人批准。"
          escalation_rules: [AR-01, AR-02]   # 金额取方案额度上限合计；阈值待 U10
          on_reject: 1
        permission: 激励方案.审批
        page: 审批待办页
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: end, outcome: 已撤回}
        decision:
          - {when: 审批驳回, goto: 1}
          - {when: 编制人在审批中撤回, goto: end}
          - {when: otherwise, goto: 3}
        outcome: 已撤回
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起激励方案审批}
      - actor: system
        where: automatic
        on_time: 方案生效日期到达
        command: 生效激励方案版本
        aggregate: AGG-75
        emits: [激励方案已生效]
        desc: 审批通过后到生效日期自动生效，不再由人力手工点击；前置：审批已通过
        audit: true
        outcome: 已生效
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
    notes: G-02 已处理（AGG-75 引用 platform.approval，intent 114200 F-2）。驳回回到编制，不结束流程，故结局词去掉“已驳回”、加“已撤回”。

  - id: PRC-122
    name: 核定奖金
    trigger:
      type: event
      events:
        - {event: 绩效评估已确认, aggregate: AGG-106, filter: "评估类型为月度"}
    triggers:
      - {type: event, name: "绩效评估已确认（仅月度评估；B-13 发布）"}
      - {type: human, name: "人力在调整评估或激励方案后重新草拟"}
    stages: [VS-13.2]
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统按方案规则草拟，责任人审批核定（质检修订：取消人力手工草拟）
    migration: "历史奖金（2020–2025 历史奖金与奖金计提来自老系统线下导入）按个人 × 期间迁入为已核定；迁入不触发核定（ADR-0036 M7）"
    scope: "人力、管理层与奖金归属人本人；奖金属薪酬敏感信息"
    segregation:
      - {roles: [SH-E1, SH-E1], rule: "用人经理既是评估人又是核定人时，奖金由系统按方案规则草拟、不得由其改额；核定人是被核定人本人时按 AR-11 由其上级核定"}
    outcomes: [已核定, 无需核定, 已中止, 已驳回]
    scenarios: [PRC-122-S01, PRC-122-S02, PRC-122-S03, PRC-122-S04, PRC-122-S05]   # S01 月度评估确认后草拟并核定（全程）；S02 试用期评估确认不触发；S03 没有生效方案或草拟金额超方案额度，已中止并告警人力；S04 责任人驳回；S05 奖金金额超阈值，加一级或两级（AR-01、AR-02）
    roles:
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为被评人所在组织单元的责任人，核对草拟奖金是否有规则看不到的情况", approval_right: "正常一级审批（cost_object_owner 解析结果）；本人是被核定人时由上级核定", department_hint: "被评人所在组织单元", position_hint: "部门负责人、用人经理"}}       # 被评人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "奖金金额超阈值时的上一级责任人", approval_right: "加审一级（AR-02 总经理）", department_hint: "公司管理层", position_hint: "总经理"}}       # 金额超阈值时加审（AR-02 总经理一级）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收奖金草拟已中止或被驳回的告警，调整方案或评估后重新草拟", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力：已中止告警
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕草拟奖金核定
        aggregate: AGG-76
        reads: [AGG-75, AGG-106]
        pending: U10
        desc: 读激励方案与核定依据的绩效评估，按方案规则草拟个人奖金（评分到金额的映射在方案规则里；映射不足以自动算时回到人力草拟，见 U10）；草拟金额超出方案额度的拒绝并告警
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 绩效评估已确认}
          - {mode: api, direction: out, bc: B-13, name: 读取绩效评估结论}
        decision:
          - {when: 评估类型不是月度（如试用期评估），无需核定, goto: end}
          - {when: 没有生效的激励方案版本，或草拟金额超出方案额度，已中止, goto: end}
          - {when: otherwise, goto: 2}
        # 依据：PRC-85 的试用期评估也发“绩效评估已确认”，事件现无评估类型（notes 结构问题 4）；失败并告警人力，不静默（CLAUDE.md 第 6 条）
      - actor: SH-E1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 奖金核定审批
        aggregate: AGG-76
        pending: U10
        desc: 责任人核对草拟奖金，可批准或驳回，不改金额；奖金是对个人的资金承诺，保留人审
        approval:
          engine: platform.approval
          doc_type: 奖金核定审批
          approver: cost_object_owner   # 奖金单的归属对象是被评人所在组织单元，责任人即部门负责人（SH-E1）
          why_human: "奖金按方案规则草拟只是基线，兑现前须由为该成本负责的人确认没有规则看不到的情况（如离岗、争议、业绩调整）；奖金直接增加人工成本并进入薪酬，故保留正常一级。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U10；责任人就是被核定人本人时按 AR-11
          on_reject: 4
        permission: 奖金.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 审批驳回, goto: 4}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起奖金核定审批}
      - actor: system
        where: automatic
        command: 核定奖金
        aggregate: AGG-76
        emits: [奖金已核定]
        desc: 审批通过的回调后核定；发放经月度薪酬结算（PRC-124 读取已核定奖金）
        audit: true
        outcome: 已核定
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回奖金核定
        aggregate: AGG-76
        desc: 审批驳回的回调；聚合稿 AGG-76 没有驳回命令；人力调整后重新草拟（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
    notes: 订阅方 B-15（奖金核定依据）。聚合稿 AGG-76 没有“额度不得超出激励方案”的不变量，草拟时拒绝先按前置检查写，见 notes 结构问题。原 v1 的人力手工草拟取消，catalog 的 human_orchestration 须由 false 改为 true（notes 格式问题）。

  # ───────────── VS-13.3 薪酬结算 ─────────────

  - id: PRC-124
    name: 计算、审核并批准月度薪酬
    trigger:
      type: event
      events:
        - {event: 月度考勤已锁定, aggregate: AGG-97}
    triggers:
      - {type: event, name: "月度考勤已锁定（B-27 发布；按人员 × 月发出，法人当月在职人员全部锁定才能计算）"}
      - {type: human, name: "人力在补齐档案或规则版本后重新发起法人 × 月计算"}
    stages: [VS-13.3]
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统计算，薪酬岗提交审核，财务责任人审批，可退回重算（高风险，保留人审）
    migration: "历史月度薪酬结算（老系统算薪审核表与税金计算、工资条约 2.9 万行）按法人 × 月迁入为已发放 / 已过账结算，只迁结果与证据，不重算、不发事件、不重新过账（ADR-0036 M7）；在途月份按当前状态迁入通用审批"
    scope: "按法人数据范围；薪酬行属敏感个人信息，仅人力薪酬岗与财务主管可见，员工只看本人工资条"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "提交审核者不得审批同一份结算（制单与审批分离，AR-11）；任何人不得审批含本人薪酬行的结算，含本人时由其上级审批（SH-E6 内部分岗：薪酬岗 / 财务主管）"}
    outcomes: [已批准, 待锁定, 已中止]
    scenarios: [PRC-124-S01, PRC-124-S02, PRC-124-S03, PRC-124-S04, PRC-124-S05, PRC-124-S06, PRC-124-S07, PRC-124-S08, PRC-124-S09]   # S01 全部锁定后计算、提交、审批、批准、提交过账候选（全程）；S02 审批驳回退回重算；S03 有人员未锁定，待锁定；S04 缺薪酬档案或规则版本，已中止并告警；S05 审批 2 日无人处理升级；S06 提交人撤回审批；S07 薪酬岗核对异常清单后重算；S08 薪酬总额超阈值，加一级或两级（AR-01、AR-02）；S09 所属期间已关账，过账路由到开放期间并标原期间
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统计算结果与异常清单，确认无误后提交审核，对输入修正负责", approval_right: "无（提交人不得审批同一份结算）", department_hint: "人力资源部（薪酬岗）", position_hint: "薪酬岗"}}      # 人力（薪酬岗）：核对异常清单、提交审核
      - {id: SH-E6, as: approver, org_needs: {responsibility: "作为薪酬法人的财务责任人，对薪酬支付依据的合理性负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值加审", department_hint: "财务部", position_hint: "财务负责人、财务主管"}}       # 财务（薪酬法人的责任人 / 财务主管）：审批
      - {id: SH-M1, as: informed, org_needs: {responsibility: "知悉薪酬总额；审批超期时接收升级提醒", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 管理层：薪酬总额知会；审批超期升级对象（VS-13.3 participants）
    steps:
      - actor: system
        where: automatic
        command: 计算
        aggregate: AGG-73
        reads: [AGG-97, AGG-74, AGG-76, AGG-93, AGG-62]
        pending: U7
        desc: >-
          薪酬自算（intent 2026-10-16-152603，聚合稿“薪酬汇总导入”口径作废），月度考勤已锁定后由系统自动计算，不再由人手工发起。
          读月度考勤已锁定（含锁定后更正行）、薪酬档案版本（按薪酬期间生效日分段）、参保（缴费基数）、已核定奖金、适用的〔缺〕薪酬规则版本（个税税率表与减除费用、社保公积金比例与基数上下限、计薪天数）、人员与法人。
          按人员：应发 = 档案薪酬项（调薪、入离职当月按计薪日折算）+ 已核定奖金 − 事假等扣款 + 加班费（来自月度考勤的加班补偿方式）± 上期锁定后更正行（标原月份）；
          代扣 = 社保公积金个人部分（参保缴费基数 × 规则版本比例）+ 个人所得税（居民个人工资薪金累计预扣，用专项附加扣除与规则版本的税率表）；
          只限法定代扣项目（INV-70）；实发 = 应发 − 代扣；汇总为法人 × 月。同时生成异常清单（环比波动超阈值、实发为负、新入离职折算、含补发补扣行），供薪酬岗核对与审批人参考，只提示不拦截
        audit: true
        legal_entity: 薪酬法人（个税扣缴义务人口径，三口径分别记录，Q-09）
        cross_bc:
          - {mode: api, direction: out, bc: B-27, name: 读取月度考勤确认}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        decision:
          - {when: "该法人当月仍有在职人员月度考勤未锁定，待锁定", goto: end}
          - {when: "有人员没有生效的薪酬档案版本、应参保人员没有参保基数或没有适用的薪酬规则版本，已中止", goto: end}
          - {when: otherwise, goto: 2}
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；阶段进入条件 VS-13.3（法人当月在职人员均已锁定）
      - actor: SH-E6               # 人力（薪酬岗）
        where: in_system
        command: 提交审核
        aggregate: AGG-73
        desc: 薪酬岗核对计算结果与异常清单，确认无误提交审批；发现输入有误可先修正再重算，不进入审批
        permission: 薪酬结算.提交审核
        page: 薪酬结算页
        audit: true
        decision:
          - {when: 核对发现需修正输入后重算, goto: 1}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起薪酬审核}
      - actor: SH-E6               # 财务（薪酬法人的责任人）
        where: in_system
        platform_task: true
        service: platform.approval
        command: 薪酬审核
        pending: U7
        desc: 对全员薪酬的资金支付依据作审批；审批人看到结算汇总与异常清单
        approval:
          engine: platform.approval
          doc_type: 月度薪酬审核
          approver: cost_object_owner   # 薪酬结算的归属对象是薪酬法人（扣缴义务人口径），责任人为该法人的财务负责人 / 财务主管（SH-E6）
          why_human: "月度薪酬是全员资金支付与个税扣缴的依据，规则只能校验口径一致（考勤已锁定、规则版本、法定代扣），无法判断本月薪酬总额与异常波动是否合理；属高风险，保留人审（正常一级，金额超阈值再加审）。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U7
          on_reject: 1
        permission: 薪酬结算.审核
        page: 审批待办页
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P2D", escalate_to: SH-M1, interrupting: false}   # 暂拟 2 日无人处理升级，待 U7（发薪日）
        withdraw: {to: 1}
        decision:
          - {when: 审批驳回，退回重算, goto: 1}
          - {when: 提交人撤回审批, goto: 1}
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 批准
        aggregate: AGG-73
        emits: [薪酬已批准]
        desc: 审批通过的回调；代扣只限法定项目，以法定货币支付（INV-70）；薪酬已批准触发申报（PRC-125）与提交应付薪酬（PRC-126）；退回重算在聚合稿无命令，〔缺〕退回薪酬重算（notes 结构问题 2）
        audit: true
        metric_event: true
        legal_entity: 薪酬法人（个税扣缴义务人口径）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-73
        calls: PRC-92
        desc: 职工薪酬计提；批准时提交一次候选，发放只置“已发放”，“已过账”由事件策略 PRC-134 置位（G-18 已处理）；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "薪酬所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已批准
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 6e 前薪酬汇总导入（FD-30）作废：一次投产后薪酬在本系统自算，AGG-73 对 platform.integration“薪酬汇总导入”的依赖应删除（notes 结构问题）。取批准时提交一次过账候选。薪酬岗“计算”改为系统自动，保留“提交审核”一步作为制单人签收，兼顾高风险的两人控制。

  # ───────────── VS-13.4 申报缴纳 ─────────────

  - id: PRC-125
    name: 申报个税扣缴与社保公积金
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
      - {type: time, name: "每月申报期前提醒（P-39，platform.scheduling）；股息红利并入后无薪酬批准时也须有触发"}
      - {type: human, name: "人力发起本月申报批次"}
    stages: [VS-13.4, VS-06.1]
    owner_bc: B-15
    human_orchestration: false
    migration: "历史申报与缴款（老系统税金计算与申报记录）按所属期 × 类型迁入为已缴款；迁入不触发申报、不重新过账（ADR-0036 M7）"
    scope: "按扣缴义务人法人；申报明细含证件号码等个人信息，仅人力薪酬岗可见"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "申报登记与缴款资金支出（出纳，B-10）不得为同一人；申报数据由系统生成，人工只做外部申报与登记回执（SH-E6 内部分岗）"}
    outcomes: [已申报缴款, 已中止]
    scenarios: [PRC-125-S01, PRC-125-S02, PRC-125-S03, PRC-125-S04, PRC-125-S05, PRC-125-S06]   # S01 系统生成申报数据，线下申报，登记回执与缴款（全程）；S02 证件信息缺失或金额不一致，已中止并告警；S03 申报被退回更正；S04 股息红利并入同期个税申报；S05 个税申报期限提醒升级；S06 所属会计期间已关账，过账路由到开放期间
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统生成的申报数据，在外部渠道办理申报与缴款并登记回执", approval_right: "无（人工只做外部申报与登记；缴款资金支出由出纳另行执行）", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "申报期限提醒的升级对象", approval_right: "无", department_hint: "公司管理层", position_hint: "分管副总"}}       # 申报期限提醒升级对象
      - {id: SH-R2, as: external, org_needs: {responsibility: "受理申报并出具回执", approval_right: "无（外部机构，系统外）", department_hint: "外部（税务、社保、公积金经办机构）", position_hint: "不适用"}}       # 税务、社保、公积金经办机构
    steps:
      - actor: system
        where: automatic
        command: 生成申报
        aggregate: AGG-95
        reads: [AGG-74, AGG-81, AGG-73]
        pending: U1
        desc: 读当月参保增减员、薪酬结算、扣缴义务人法人与所属期（会计期间）；按所属期汇总薪酬批准结果与股息红利并入项，生成个税扣缴申报数据（按自然人电子税务局扣缴客户端的导入格式〔中〕）与社保公积金申报明细；校验人员证件信息、申报金额与薪酬结算一致，不一致失败并告警。申报方式为骨架暂拟的 a)，用户未定，见 notes 待用户定 U1、U2
        legal_entity: 扣缴义务人法人
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]     # 生成完成与已中止都发
        cross_bc:
          - {mode: api, direction: out, bc: B-19, name: 读取会计期间与所属期}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        decision:
          - {when: "人员缺证件信息或申报金额与薪酬结算不一致", goto: end}
          - {when: otherwise, goto: 2}
        outcome: 已中止
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税申报回执, 申报日, 申报明细文件]
        command: 提交申报
        aggregate: AGG-95
        pending: U1
        desc: 个税：人力在扣缴客户端导入申报数据并申报，本系统登记申报回执（个人所得税法第九条、第十条；个人所得税扣缴申报管理办法）。法定期限为次月十五日内〔中，核对原文〕（P-39）
        period_gate: false
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: true}   # 自次月 1 日起算，P-39 提醒并升级转管理层督办；写中断同 PRC-116（R14）
        notify: [{to: SH-E6, how: 企业微信待办}]
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕申报端对接（仅方式 b 时启用）}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费申报回执, 公积金汇缴回执, 申报日]
        command: 提交申报
        aggregate: AGG-95
        emits: [个税与社保公积金申报已提交]
        pending: U2
        desc: 社保公积金：人力在税务或社保经办渠道申报社保费、在公积金管理中心办理汇缴，各地渠道不同〔中〕，本系统登记回执；三类均已提交后发出事件
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税缴款凭证, 社保费与公积金缴款凭证, 缴款日]
        command: 登记缴款
        aggregate: AGG-95
        desc: 税款与社保公积金的缴款资金支出不在 AGG-95，缴款凭证与银行流水的对账见 notes 接缝问题
        audit: true
        decision:
          - {when: 申报被退回或发现差错, goto: 5}
          - {when: otherwise, goto: 6}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [更正申报回执, 更正原因]
        entry: 申报被退回或发现差错
        branch: 更正
        command: 更正申报
        aggregate: AGG-95
        audit: true
        decision:
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-95
        calls: PRC-92
        desc: 个税与社保公积金过账；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已申报缴款
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 申报方式用户未定（intent 2026-10-16-152603 只定“个税公司代扣代缴”），骨架先按 a) 画：系统生成申报数据，人工在外部申报端申报并回填回执（offline + 证据）。“生成申报”由人力手工改为系统自动（质检修订）；v1“申报端回执、更正申报无超时或退回分支，按非人工编排（⑥a 评审 M1）”保留。

event_policies:

  - id: PRC-113
    name: 并入股息红利个税扣缴申报
    trigger:
      type: event
      events:
        - {event: 利润分配已支付, aggregate: AGG-109}
    triggers:
      - {type: event, name: "利润分配已支付（B-10 发布）"}
    stages: [VS-12.2, VS-13.4]
    owner_bc: B-15
    migration: "历史股息红利个税（老系统无独立记录，是否存在待取证）按所属期迁入申报批次；迁入不触发（ADR-0036 M7）"
    outcomes: [已并入申报, 无需扣缴]
    scenarios: [PRC-113-S01, PRC-113-S02]   # S01 自然人股东分红并入当期个税申报；S02 法人股东不扣缴个税
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉申报批次中出现股息红利并入项", approval_right: "无", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}       # 人力：申报批次中出现并入项
      - {id: SH-O1, as: external, org_needs: {responsibility: "自然人股东是个税纳税人，法人股东自行处理所得", approval_right: "无（外部相关方）", department_hint: "外部（股东）", position_hint: "不适用"}}       # 股东：自然人股东是纳税人
    step:
      actor: system
      where: automatic
      command: 并入扣缴申报
      aggregate: AGG-95
      desc: 自然人股东的股息红利所得适用 20% 比例税率，由支付方代扣代缴（个人所得税法第三条、第九条）；并入当期申报批次，实际申报在 PRC-125；法人股东不涉及个税，合伙人的所得性质因被投资主体而异，见 notes 结构问题
      legal_entity: 扣缴义务人法人
      audit: true
      decision:
        - {when: 股东是法人或机构, goto: end, outcome: 无需扣缴}
        - {when: otherwise, goto: end, outcome: 已并入申报}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 利润分配已支付}
    notes: 沿已有边 B-15 → B-10，不新增反向边。扣缴额须在支付前确定，见 notes 接缝问题 4。

  - id: PRC-126
    name: 提交应付薪酬
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
    stages: [VS-13.5]
    owner_bc: B-15
    migration: "历史薪酬的应付（老系统付款申请单-人事约 1.5 千行）作为已结清应付迁入，只迁结果与证据；迁入不触发（ADR-0036 M7）"
    outcomes: [应付已提交]
    scenarios: [PRC-126-S01, PRC-126-S02]   # S01 薪酬批准后提交法人 × 月一笔实发合计；S02 重复触发幂等不重复提交
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "财务知悉待付清单出现应付薪酬，按付款流程办理", approval_right: "无", department_hint: "财务部", position_hint: "出纳、应付会计"}}       # 财务：待付清单出现应付薪酬
    step:
      actor: system
      where: automatic
      command: 提交应付薪酬
      aggregate: AGG-52
      emits: [应付已确认]
      desc: 法人 × 月一笔实发合计，按来源单据 ID 幂等；之后走 PRC-75“发起、审批并执行付款”（B-10）；P-40 每月至少一次支付工资（工资支付暂行规定第七条）；代发明细（员工 × 账户 × 金额）如何随付款交给银行见 notes 接缝问题 3
      audit: true
      legal_entity: 薪酬法人（发薪法人）
      decision:
        - {when: 该薪酬结算已提交过应付, goto: end, outcome: 应付已提交}
        - {when: otherwise, goto: end, outcome: 应付已提交}
      cross_bc:
        - {mode: api, direction: out, bc: B-10, name: 提交应付薪酬}
    notes: 应付薪酬类型由 B-10 的 AGG-52 承载；付款、核销见 PRC-75、PRC-131、PRC-132（B-10，财务组），本组只写接缝。

  - id: PRC-127
    name: 薪酬发放完成
    trigger:
      type: event
      events:
        - {event: 应付已结清, aggregate: AGG-52, filter: "应付类型为应付薪酬且来源为月度薪酬结算"}
    triggers:
      - {type: event, name: "应付已结清（B-10 发布；B-15 只处理应付薪酬）"}
    stages: [VS-13.5]
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的发放状态随结算迁入"
    outcomes: [已发放]
    scenarios: [PRC-127-S01, PRC-127-S02, PRC-127-S03]   # S01 应付结清后置已发放并通知工资条；S02 退票时付款已失败，薪酬保持已批准；S03 置已发放时过账事实已入账，转 PRC-134
    roles:
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人工资条", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：工资条可查看
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已发放", approval_right: "无", department_hint: "财务部、人力资源部", position_hint: "薪酬岗、财务"}}
    step:
      actor: system
      where: automatic
      command: 标记薪酬已发放
      aggregate: AGG-73
      emits: [薪酬已发放]
      desc: 退票时付款已失败，薪酬保持已批准，重入付款；已发放与事实已过账两个条件任一后到者触发置已过账
      audit: true
      notify: [{to: SH-E3, how: 企业微信通知（工资条可查看）}]
      decision:
        - {when: 该薪酬的过账事实已入账, goto: PRC-134}
        - {when: otherwise, goto: end, outcome: 已发放}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 应付已结清}
    notes: 订阅关系 B-15 → B-10（api、事件）。应付已结清事件需带应付类型与来源，B-15 与 B-12 都订阅，各自过滤（notes 结构问题 4）。

  - id: PRC-134
    name: 薪酬事实已过账置位
    trigger:
      type: event
      events:
        - {event: BusinessFactAttributed, aggregate: AGG-77, filter: "来源单据为月度薪酬结算"}
    triggers:
      - {type: event, name: "BusinessFactAttributed（B-16 发布；B-15 只处理薪酬来源）"}
    stages: [VS-13.3]
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的已过账状态随结算迁入"
    outcomes: [已过账, 待发放后再置位]
    scenarios: [PRC-134-S01, PRC-134-S02]   # S01 已发放后过账完成置已过账；S02 过账先于发放，记标志待 PRC-127 触发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已过账", approval_right: "无", department_hint: "财务部", position_hint: "总账会计"}}
    step:
      actor: system
      where: automatic
      command: 标记已过账
      aggregate: AGG-73
      desc: 按来源单据 ID 取薪酬行；已发放与事实已过账两个条件任一后到者触发（符合性审查 断链 7）
      audit: true
      decision:
        - {when: 薪酬尚未发放, goto: end, outcome: 待发放后再置位}
        - {when: otherwise, goto: end, outcome: 已过账}
      cross_bc:
        - {mode: event, direction: in, bc: B-16, name: BusinessFactAttributed}
    notes: 由原 PRC-124 末步与 PRC-127 第二步拆出（G-18 已处理）。

  - id: PRC-145
    name: 员工法人三口径不一致预警
    trigger:
      type: event
      events:
        - {event: 劳动合同已签订, aggregate: AGG-67}
        - {event: 〔缺〕法人归属已变更, aggregate: AGG-117}
        - {event: 薪酬档案已变更, aggregate: AGG-93}
    triggers:
      - {type: event, name: "劳动合同已签订（B-13）"}
      - {type: event, name: "〔缺〕法人归属已变更（B-13）"}
      - {type: event, name: "薪酬档案已变更（同 BC）"}
    stages: [VS-07.3]
    owner_bc: B-15
    basis: S-20（one-architecture）；用户 Q-09（intent 2026-10-16-134134）
    migration: "迁入不触发（ADR-0036 M7）；迁入完成后由人力用对账清单一次性核对三口径，不批量发预警"
    outcomes: [三口径一致, 已预警]
    scenarios: [PRC-145-S01, PRC-145-S02]   # S01 三口径一致不预警；S02 入职后劳动合同用人单位与扣缴义务人不一致，预警人力
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收三口径不一致预警并核对更正", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力
    step:
      actor: system
      where: automatic
      desc: 比对劳动合同用人单位（AGG-67）、数据范围法人（AGG-117）、个税扣缴义务人（AGG-93），按同一业务日期取当时有效版本；不一致只预警人力，不拒绝；同一人员同一差异已有未处理预警时不重复发
      notify: [{to: SH-E6, how: 企业微信待办}]
      decision:
        - {when: 三口径中任意两个不一致, goto: end, outcome: 已预警}
        - {when: otherwise, goto: end, outcome: 三口径一致}
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: 劳动合同已签订}
        - {mode: event, direction: in, bc: B-13, name: 〔缺〕法人归属已变更}
        - {mode: api, direction: out, bc: B-13, name: 读取劳动合同用人单位与数据范围法人}
    notes: B-15 → B-13（api、事件）已有边；扣缴义务人在本 BC。

single_aggregate:

  - id: PRC-119
    name: 维护工作日历与标准工时版本
    type: single_aggregate
    aggregate: AGG-68
    owner_bc: B-14
    stages: [VS-13.1]
    desc: 人力每年维护或调整标准工时
    triggers:
      - {type: human, name: "人力每年维护工作日历，或调整标准工时"}
    migration: "历史工作日历年度与标准工时版本（已建 AGG-68 / AGG-108）按生效区间迁入；迁入不发事件（ADR-0036 M7）"
    scope: "人力维护；全员可读"
    outcomes: [工作日历已维护, 标准工时版本已发布, 版本被拒]
    scenarios: [PRC-119-S01, PRC-119-S02, PRC-119-S03]   # S01 年度维护日历；S02 发布新标准工时版本，与现有版本区间重叠被拒；S03 新标准工时版本区间不重叠，发布成功
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "每年维护工作日历与标准工时版本，对依据文件的准确性负责", approval_right: "无（版本区间由不变量守卫）", department_hint: "人力资源部", position_hint: "人力资源专员、考勤管理员"}}      # 人力
    commands:
      - actor: SH-E6
        where: in_system
        command: 维护工作日历年度
        aggregate: AGG-68
        emits: [WorkCalendarLockedDaysChanged]
        desc: 依据当年国家节假日安排与调休上班日，维护法定节假日与调休；依据文件引用记入版本
        permission: 工作日历.维护
        page: 工作日历维护页
        audit: true
        outcome: 工作日历已维护
        cross_bc:
          - {mode: api, direction: in, bc: B-27, name: 读取工作日历}
          - {mode: api, direction: in, bc: B-06, name: 读取工作日历}
      - actor: SH-E6
        where: in_system
        command: 发布标准工时版本
        aggregate: AGG-108
        emits: [标准工时版本已生效]
        desc: 生效后不得修改，更正另追加新版本（INV-116），不追溯已确认的工时与请假拆分；法人可空表示默认
        permission: 标准工时.发布
        page: 标准工时版本页
        audit: true
        decision:
          - {when: 同一法人（空为默认）已有版本的生效区间重叠, goto: end, rule: INV-116, outcome: 版本被拒}
          - {when: otherwise, goto: end, outcome: 标准工时版本已发布}
        cross_bc:
          - {mode: api, direction: in, bc: B-06, name: 读取标准工时版本}
          - {mode: api, direction: in, bc: B-27, name: 读取标准工时版本}
    notes: B-06、B-27 经 api 按 ID 与日期读取。事件“标准工时版本已生效”订阅方列宜写仅分析（G-15）。法人引用 B-14 → B-13 无登记边，见 NOTES 数据接缝问题 1。

  - id: PRC-123
    name: 调整薪酬档案与专项附加扣除
    type: single_aggregate
    aggregate: AGG-93
    owner_bc: B-15
    stages: [VS-13.3, VS-13.4]
    desc: 调薪、年度专项附加扣除更新
    triggers:
      - {type: human, name: "人力按调薪决定登记薪酬档案新版本"}
      - {type: human, name: "人力按年度更新专项附加扣除"}
    migration: "历史薪酬档案版本与专项附加扣除（老系统调薪申请单约 1 千行、工资补录档案）按生效区间迁入；迁入不发事件、不触发三口径预警（ADR-0036 M7）"
    scope: "仅人力薪酬岗与财务主管可见和调整；员工只读本人；薪酬与专项附加扣除均为敏感个人信息（ADR-0043）"
    outcomes: [薪酬档案已调整, 专项附加扣除已更新, 调整被拒]
    scenarios: [PRC-123-S01, PRC-123-S02, PRC-123-S03, PRC-123-S04]   # S01 调薪生效日在未结月份；S02 生效日早于已批准薪酬所属月，补发补扣走下月；S03 年度更新专项附加扣除；S04 未引用调薪决定依据，调整被拒
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "依据调薪决定登记薪酬档案版本，年度更新专项附加扣除，对依据完整性负责", approval_right: "无（无依据即由规则拒绝；调薪决定是否进审批待用户定 U9）", department_hint: "人力资源部（薪酬岗）", position_hint: "薪酬岗"}}      # 人力（薪酬岗）
      - {id: SH-E3, as: informed, org_needs: {responsibility: "接收本人薪酬变更通知并核对", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：本人薪酬变更通知
    commands:
      - actor: SH-E6
        where: in_system
        command: 调整薪酬档案
        emits: [薪酬档案已变更]
        aggregate: AGG-93
        pending: U9
        desc: 薪酬属性版本，调薪产生新版本，生效依据人事业务生效日（U-12）；规则守卫：调整必须引用调薪决定依据（审批单据 ID 或决定文件），无依据即拒绝。调薪决定本身是否进审批平台见 notes 待用户定 U9（推荐进：approver=cost_object_owner，薪酬标准变更是对个人长期薪酬的承诺，规则无法判断合理性，属高风险，金额超阈值按 AR-01、AR-02 加审），U9 定后此步前加审批节点
        permission: 薪酬档案.调整
        page: 薪酬档案页
        audit: true
        metric_event: true
        legal_entity: 扣缴义务人法人（三口径之一）
        decision:
          - {when: "未引用调薪决定依据", goto: end, outcome: 调整被拒}
          - {when: "生效日早于已批准的月度薪酬所属月", goto: end, outcome: 薪酬档案已调整}   # 已批准结算不改；补发补扣由下月结算更正行承接，AGG-73 无此行类型（notes 结构问题）
          - {when: otherwise, goto: end, outcome: 薪酬档案已调整}
        cross_bc:
