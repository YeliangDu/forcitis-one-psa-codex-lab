    support: "B-15 薪酬档案与专项附加扣除的维护，结局（档案已调整、扣除已更新）不造 VS-13.3、VS-13.4 的任一退出条件（月度薪酬结算已批准、法定申报已申报缴款），服务薪酬结算的输入（STAGE_ALIGN.md 归段判据第 6 项）"
    desc: 调薪、年度专项附加扣除更新
    triggers:
      - {type: human, name: "人力按调薪决定登记薪酬档案新版本"}
