# 表级数据模型 · B-15 organization.payroll（schema 暂名 organization_payroll；基线尚无该 schema，全部新建）
# 字段约定：closeout/CONVENTIONS.md §3（含 pi 字段）。聚合号未给者写「AGG-待定-<名称>」。
# 已建 / 新建、D17 依据、迁入来源与分级理由见 b15data.DATA_MODEL.md；问题见 b15data.notes.md。
# 所有 SENSITIVE 行：个人信息保护法第 28 条、ADR-0043；工资是否 SPI 待 U-11，ADR-0043 第 2 项「拿不准按 SPI」故按 spi 登记。

# ───────────────────────── AGG-73 月度薪酬结算（法人 × 月） ─────────────────────────
- aggregate: AGG-73
  bc: B-15
  tables:
    - name: payroll_settlements
      role: root
      key: uuid_v7
      references:
        - {to: AGG-60, by: legal_entity_id, cross_bc: true}
        - {to: AGG-73, by: reverses_settlement_id}
        - {to: AGG-52, by: payable_id, cross_bc: true}
        - {to: AGG-77, by: posting_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: none
      column_families: [法人, 薪酬月份, 结算类型（正常 / 冲销）, 冲销的原结算, 状态（草稿 → 已计算 → 审核中 → 已批准 → 已发放 → 已过账）, 实发合计, 审批引用, 批准人与时间, 发放登记（发放日、银行回单引用）, 应付引用, 过账引用, 乐观锁]
      reason: "versioned none：单据，状态由审计还原，更正走冲销另立结算（D17 第二类）；业务唯一：法人 × 月 × 正常类型（不含已冲销）；history_migration full：用户已定全部历史迁入（U-1–U-4），老系统薪酬数据来源待取证，不推定；先迁原行后迁冲销行（ADR-0036 第 3、7 条）；SENSITIVE：法人月度工资汇总（L3，ADR-0026 第 7 项）；pi none：本表无个人标识，个人明细在 payroll_settlement_lines；应付只存 AGG-52 的 ID（法人 × 月一笔实发合计），过账只存 AGG-77 的 ID"
    - name: payroll_settlement_rule_refs
      role: link
      key: uuid_v7
      references:
        - {to: AGG-73, by: payroll_settlement_id}
        - {to: AGG-119, by: payroll_rule_version_id}
      versioned: snapshot
      history_migration: full
      sensitivity: INTERNAL
      pi: none
      column_families: [所用规则版本 ID, 规则类别]
      reason: "D7、D17 细则 6：记所用规则版本；迁入的历史结算无对应规则版本，不造引用，该行不存在即表示「迁入结果，未经本系统计算」（NOTES 结构问题 3）；INTERNAL：规则本身非个人信息"
    - name: payroll_settlement_lines
      role: child
      key: uuid_v7
      references:
        - {to: AGG-73, by: payroll_settlement_id}
        - {to: AGG-62, by: employee_id, cross_bc: true}
        - {to: AGG-60, by: withholding_legal_entity_id, cross_bc: true}
        - {to: AGG-93, by: payroll_profile_version_id}
        - {to: AGG-74, by: insurance_enrollment_version_id}
        - {to: AGG-97, by: monthly_attendance_confirmation_id, cross_bc: true}
      versioned: snapshot
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [人员（工资条为单据）, 扣缴义务人法人, 应发合计, 代扣合计, 个税, 实发, 所用档案版本 ID, 所用参保版本 ID, 所用考勤确认 ID, 发放状态（待支付 / 已实付 / 支付失败，ARC-1022-COO-06）, version（ADR-0075 转换序号来源）, 回单批次号, 实付日期, 失败原因, 银行退回日, 补发截止日, 顺延截止日与顺延通知记录, 是否逾期, 补发轮次]
      reason: "期间快照：批准后不改，记所用版本（D7）；SENSITIVE + spi：个人工资（ADR-0026 第 7 项 L3；工资是否 SPI 交 U-11 ③，未确认按 SPI，ADR-0043 第 2 项），个人信息保护法第 28 条、ADR-0043；迁入行的所用版本引用允许为空并标来源对照，老系统来源待取证；发薪账户不复制，经档案版本 ID 取"
    - name: payroll_line_items
      role: child
      key: uuid_v7
      references:
        - {to: AGG-73, by: payroll_settlement_line_id}
        - {to: AGG-76, by: bonus_determination_id}
      versioned: snapshot
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [项目类别（应发 / 法定代扣 / 个税 / 奖金 / 更正）, 项目编码, 金额, 计算依据（所用费率或基数、公式参数快照）, 奖金核定引用, 更正月份]
      reason: "计算明细 / 项目行；期间快照；INV-70 代扣限法定项目由聚合校验；SENSITIVE + spi 同 payroll_settlement_lines（个人信息保护法第 28 条、ADR-0043）；迁入只迁老系统已有的项目粒度，粒度不足时合并为单行并标注（待取证）"

# ───────────────────────── AGG-74 社保与公积金参保（写法以 SAMPLE §3 为准） ─────────────────────────
- aggregate: AGG-74
  bc: B-15
  tables:
    - name: insurance_enrollments
      role: root
      key: uuid_v7
      references:
        - {to: AGG-62, by: employee_id, cross_bc: true}
        - {to: AGG-60, by: contributing_legal_entity_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: pi
      column_families: [参保人员, 缴纳主体, 状态, 乐观锁]
      reason: "versioned none：根只留标识与当前状态，险种、基数进版本表（D17 细则 5）；老系统来源待取证；退休返聘与实习不参保（用户已定 T-4），不建行；个人信息保护法第 28 条、ADR-0043"
    - name: insurance_enrollment_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-74, by: insurance_enrollment_id}
      versioned: effective_dated
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [生效区间, 参保地, 险种, 缴费基数, 增员 / 减员, 增减员回执引用]
      reason: "缴费基数属个人财产信息，按 ADR-0043 列级访问，个人信息保护法第 28 条；生效依据 DECLARED（办理业务日）；参保地为本稿对样板列族的补充（OBJ-62 定义含参保地，规则版本按参保地取比例）；迁入按 ADR-0036，来源待取证"

# ───────────────────────── AGG-75 激励方案版本 ─────────────────────────
- aggregate: AGG-75
  bc: B-15
  tables:
    - name: incentive_plans
      role: root
      key: uuid_v7
      versioned: none
      history_migration: full
      sensitivity: INTERNAL
      pi: none
      column_families: [方案编码, 方案类型（年终奖 / 项目奖 / 销售提成，待梳理）, 创建与乐观锁]
      reason: "versioned none：根只留编码与类型，规则与额度随版本表（D17 细则 5）；来源待取证（老系统奖金规则多半在制度文件而非结构化数据，不推定）"
    - name: incentive_plan_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-75, by: incentive_plan_id}
      versioned: effective_dated
      history_migration: full
      sensitivity: INTERNAL
      pi: none
      column_families: [生效区间, 状态（编制 → 审批 → 生效 → 结束）, 规则条款, 确认人与确认时间, 决定出处 decision_ref, 审批引用]
      reason: "配置型 D15（版本只追加，不追溯）又带生效区间，故 effective_dated；使用方（AGG-76）记所用方案版本 ID（D7）；审批经 platform.approval（聚合稿 F-2），只存审批单 ID"
    - name: incentive_plan_version_quotas
      role: child
      key: uuid_v7
      references:
        - {to: AGG-75, by: incentive_plan_version_id}
        - {to: AGG-60, by: legal_entity_id, cross_bc: true}
        - {to: AGG-61, by: org_unit_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: INTERNAL
      pi: none
      column_families: [额度范围（法人 / 组织单元）, 额度金额或提取比例, 币种]
      reason: "随版本，版本生效后不改；额度按法人或组织单元，不到个人，故 pi none（个人额度在 AGG-76）；versioned none 因生效区间由所属版本承担"

# ───────────────────────── AGG-76 奖金核定 ─────────────────────────
- aggregate: AGG-76
  bc: B-15
  tables:
    - name: bonus_determinations
      role: root
      key: uuid_v7
      references:
        - {to: AGG-75, by: incentive_plan_version_id}
        - {to: AGG-62, by: employee_id, cross_bc: true}
        - {to: AGG-60, by: legal_entity_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [核定单号, 方案版本 ID, 被核定人员, 法人, 核定期间, 核定金额, 状态（草拟 → 已核定 → 已发放）, 核定人与时间, 重分类过账引用（幂等键；拆分明细随事实存于 B-16，S-4b）, 乐观锁]
      reason: "versioned none：单据，状态由审计还原，已核定后更正另记（D17 第二类）；已发放由 AGG-73 批准后事件置位，本表不存结算引用；SENSITIVE + spi：个人奖金（工资类 L3；SPI 待 U-11 ③，从严），个人信息保护法第 28 条、ADR-0043；迁入来源待取证，原编号经 legacy_numbers（ADR-0036）"
    - name: bonus_determination_evidences
      role: link
      key: uuid_v7
      references:
        - {to: AGG-76, by: bonus_determination_id}
        - {to: AGG-106, by: performance_review_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: pi
      column_families: [核定依据的绩效评估 ID]
      reason: "对应 OBJ-104「0..N 绩效评估作核定依据」（完整性检查）；只存评估 ID，评估内容不复制；评估含 SPI 可能（交 U-11），故本表从严 SENSITIVE；随核定行迁入"

# ───────────────────────── AGG-138 奖金计提运行（技术聚合·运行单据，同 AGG-41；S-6，ARC-1022-APE-01） ─────────────────────────
- aggregate: AGG-138
  bc: B-15
  tables:
    - name: bonus_accrual_runs
      role: root
      key: uuid_v7
      references:
        - {to: AGG-60, by: legal_entity_id, cross_bc: true}
      versioned: none
      history_migration: none
      sensitivity: INTERNAL
      pi: none
      column_families: [法人, 期间, 状态（计算中 → 已计算 → 已提交过账 / 已中止）, 所用费率表版本引用, 中止原因, 过账引用（幂等键）, 乐观锁]
      reason: "技术聚合（运行单据），无业务对象（one-architecture @3541ced0b 第 6 点）；每法人 × 期间一行（唯一），S-6 新增；历史计提随事实迁入 B-16，本表不迁；按项目不到个人，INTERNAL"
    - name: bonus_accrual_lines
      role: child
      key: uuid_v7
      references:
        - {to: AGG-19, by: project_id, cross_bc: true}
        - {to: AGG-60, by: legal_entity_id, cross_bc: true}
      versioned: none
      history_migration: none
      sensitivity: INTERNAL
      pi: none
      column_families: [计提运行 ID, 法人, 项目, 业务线, 规则类型（合同额百分比 / 历史比率）, 计提基数, 计提率, 激励方案版本 ID（合同额百分比时填）, 计提额, 基数事实引用]
      reason: "法人 × 项目一行，供对账与追溯基数；只追加，随运行提交后不改"

# ───────────────────────── AGG-93 人员薪酬档案（写法以 SAMPLE §3 为准） ─────────────────────────
- aggregate: AGG-93
  bc: B-15
  tables:
    - name: payroll_profiles
      role: root
      key: uuid_v7
      references:
        - {to: AGG-62, by: employee_id, cross_bc: true}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: pi
      column_families: [所属人员, 乐观锁]
      reason: "versioned none：根只留所属人员，个人信息最小化（D17 第四类）；薪酬属性全部进 payroll_profile_versions；个人信息保护法第 28 条、ADR-0043"
    - name: payroll_profile_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-93, by: payroll_profile_id}
        - {to: AGG-60, by: withholding_legal_entity_id, cross_bc: true}
      versioned: effective_dated
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [生效区间, 薪资结构与标准, 个税扣缴义务人, 发薪账户, 调薪依据引用]
      reason: "敏感个人信息与金融账户信息（个人信息保护法第 28 条，ADR-0043 最高访问级别）；扣缴义务人是三口径之一（S13）；调薪为新版本事件，依据引用调薪申请单据 ID；迁入按 ADR-0036，来源待取证（信息图证 OA 调薪申请 #60 只作证据）；发薪账户列级 SPI（金融账户），不进分析层、日志、审计原值"
    - name: payroll_comp_leave_conversions
      role: child
      key: uuid_v7
      references:
        - {to: AGG-93, by: payroll_profile_id}
        - {to: AGG-71, by: comp_leave_grant_id, cross_bc: true}
        - {to: AGG-73, by: payroll_settlement_id}
      versioned: append_only
      history_migration: none
      sensitivity: SENSITIVE
      pi: pi
      column_families: [转计发时长, 来源, 所属薪酬月份, 登记时间, 计入结算引用]
      reason: "S-41 新增：B-15 读取 B-27 补休余额后登记的转加班工资时长，只追加，更正另记；按补休额度行 ID 幂等；金额不存，PRC-124 计算时按加班工资基数折算 200% 生成；history_migration none：迁入不触发（ADR-0036 M7），迁入的补休余额是否迁为额度行待取证后定；SENSITIVE：关联个人薪酬计发，pi：所属人员经档案根；额度行只存 AGG-71 的 ID（B-15 → B-27）；计入结算引用在结算计算时回填，不构成对 AGG-73 的状态依赖"

# ───────────────────────── AGG-120 专项附加扣除声明（S-32 自 AGG-93 拆出；员工本人发令、年度生命周期、含未成年人敏感信息） ─────────────────────────
- aggregate: AGG-120
  bc: B-15
  tables:
    - name: payroll_special_deduction_declarations
      role: root
      key: uuid_v7
      references:
        - {to: AGG-93, by: payroll_profile_id}
      versioned: effective_dated
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [扣除年度, 生效月区间, 提交日期与来源（本人填报 / 个税端下载）, 状态]
      reason: "专项附加扣除年度属性（S-32 自 AGG-93 拆出为 AGG-120）；每年重新确认，年内可修改，修改追加新生效区间；SENSITIVE + spi：涉子女、赡养、住房等家庭与财产信息，个人信息保护法第 28 条、ADR-0043；迁入来源待取证（个税端下载件是否留存未知）"
    - name: payroll_special_deduction_items
      role: child
      key: uuid_v7
      references:
        - {to: AGG-120, by: payroll_special_deduction_declaration_id}
        - {to: AGG-119, by: deduction_standard_version_id}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [扣除类别（子女教育 / 继续教育 / 大病医疗 / 住房贷款利息 / 住房租金 / 赡养老人 / 婴幼儿照护）, 月扣除额, 分摊比例, 受益人关系与信息, 证明材料引用, 所用扣除标准版本 ID]
      reason: "随申报，生效后不改；受益人含未成年子女信息，个人信息保护法第 28 条明列「不满十四周岁未成年人的个人信息」为敏感，且工资 SPI 待核，故 spi；是否另立独立表与访问级别交 U-11 / one-data（NOTES 待用户定）；记所用扣除标准版本 ID（D7）"

# ───────────────────────── AGG-95 个税扣缴与社保公积金申报 ─────────────────────────
- aggregate: AGG-95
  bc: B-15
  tables:
    - name: tax_social_filings
      role: root
      key: uuid_v7
      references:
        - {to: AGG-60, by: withholding_legal_entity_id, cross_bc: true}
        - {to: AGG-81, by: accounting_period_id, cross_bc: true}
        - {to: AGG-73, by: payroll_settlement_id}
        - {to: AGG-95, by: corrects_filing_id}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      pi: none
      column_families: [扣缴义务人法人, 申报类别（个税扣缴 / 社保 / 公积金）, 所属期, 来源结算引用, 申报方式（待用户）, 状态（待申报 → 已申报 → 已缴款）, 更正的原申报, 申报期限, 提交人与时间, 乐观锁]
      reason: "versioned none：单据，状态由审计还原，更正另立申报（D17 第二类）；最小形态：系统生成申报数据，回执与缴款登记回写，申报方式待用户（NOTES 待用户定）；SENSITIVE：法人级税费汇总；pi none：个人明细在 tax_social_filing_lines；迁入：政府端权威登记，老系统只可能有登记行，来源待取证，缺口写入对账（ADR-0036 第 7、8 条）"
    - name: tax_social_filing_lines
      role: child
      key: uuid_v7
      references:
        - {to: AGG-95, by: tax_social_filing_id}
        - {to: AGG-62, by: employee_id, cross_bc: true}
        - {to: AGG-109, by: profit_distribution_id, cross_bc: true}
      versioned: snapshot
      history_migration: full
      sensitivity: SENSITIVE
      pi: spi
      column_families: [申报对象人员, 收入类别（工资薪金 / 股息红利 / 其他）, 应税收入, 累计预扣, 本期个税, 社保公积金个人与单位部分, 申报身份信息（证件类型与号码、取自生成时刻的人员档案）, 来源（薪酬结算行 / 利润分配）]
      reason: "期间快照：提交后不改，更正走新申报；个税申报需证件号码，列级 SPI（个人信息保护法第 28 条、ADR-0043，证件号 L3 + SPI），其来源（B-13 档案范围）待用户定（NOTES 待用户定）；自然人股东股息红利并入（AGG-109 事件）；迁入来源待取证"
    - name: tax_social_filing_receipts
      role: child
      key: uuid_v7
      references:
        - {to: AGG-95, by: tax_social_filing_id}
      versioned: append_only
      history_migration: full
      sensitivity: INTERNAL
      pi: none
      column_families: [回执类别（受理 / 退回）, 回执编号, 回执时间, 回执文件引用, 登记人]
      reason: "只追加：回执是外部权威事实，更正不改行；不含个人标识（回执文件引用指向附件，附件内容另按分级）"
    - name: tax_social_payments
      role: child
      key: uuid_v7
      references:
        - {to: AGG-95, by: tax_social_filing_id}
        - {to: AGG-77, by: posting_id, cross_bc: true}
      versioned: append_only
      history_migration: full
      sensitivity: INTERNAL
      pi: none
      column_families: [缴款日, 缴款金额, 缴款渠道, 银行回单引用, 过账引用]
