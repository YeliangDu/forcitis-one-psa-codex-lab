# VS-13 薪酬类聚合事件目录（收敛产物，提议稿）。范围同 vs13pay.commands.yaml。
# 事件名取聚合稿 §2.2「事件」列与分片 emits，不自造；〔缺〕标在 name_status。
# 载荷只含 ID、代码、日期、期间与计数，不含个人级薪酬、奖金、个税金额、发薪账户和绩效结论
#   （依据 ADR-0026 第 7 项：L3 字段不进事件；ADR-0043 个人信息分级）。订阅方需要金额时经 api 读取。
# subscribers 的 type：流程（某流程触发）、仅分析。consumed 为 B-15（含 AGG-106 对应的 B-13 部分）订阅的外部事件。
# 复用 EventCatalogueTest 口径与 processes_check.py 的校验待 one-architecture 并入。

bc: B-15
also_bc: {AGG-106: B-13}
published:
- name: 绩效评估已确认
  published_by: AGG-106
  publishing_bc: B-13
  by_command: 确认绩效评估
  payload: [绩效评估ID, 被评人ID, 评估类型码, 评估期间, 确认时间]
  subscribers:
  - {type: 流程, ref: PRC-122, filter: 评估类型为月度, handled_by: 草拟奖金核定}
  - {type: 仅分析}
  note: 评估结论不入载荷（个人评价为敏感信息）；PRC-122 经 api 读取结论。试用期评估由 PRC-85 发出，B-15 不处理，转正读 AGG-106（P-46）
- name: 激励方案已生效
  published_by: AGG-75
  by_command: 生效激励方案版本
  payload: [激励方案ID, 方案版本ID, 方案类型码, 生效区间, 审批实例ID]
  subscribers:
  - {type: 仅分析}
  note: 仅在版本变为已生效时发布，已批准（生效日期未到）不发布
- name: 奖金已核定
  published_by: AGG-76
  by_command: 核定奖金
  payload: [奖金核定ID, 被核定人员ID, 法人ID, 核定期间, 激励方案版本ID, 审批实例ID, 核定时间]
  subscribers:
  - {type: 仅分析}
  note: 金额不入载荷；PRC-124 在同 BC 内读已核定奖金，不订阅
- name: 薪酬已批准
  published_by: AGG-73
  by_command: 批准
  payload: [薪酬结算ID, 法人ID, 薪酬月份, 人员行数, 审批实例ID, 批准时间]
  subscribers:
  - {type: 流程, ref: PRC-125, handled_by: 生成申报}
  - {type: 流程, ref: PRC-126, handled_by: 提交应付薪酬（B-10 AGG-52）}
  note: 实发合计不入载荷，PRC-126 经 api 提交应付时带金额
- name: 薪酬已发放
  published_by: AGG-73
  by_command: 标记薪酬已发放
  payload: [薪酬结算ID, 法人ID, 薪酬月份, 应付ID, 发放日]
  subscribers:
  - {type: 仅分析}
  note: 「已过账」不发事件；发放与过账的先后由 PRC-127 回到 PRC-134 处理
- name: 参保已增员
  published_by: AGG-74
  by_command: 参保增员
  payload: [参保登记ID, 人员ID, 缴纳主体法人ID, 险种码, 增员生效日]
  subscribers:
  - {type: 仅分析}
  note: 缴费基数不入载荷；入职阶段门（聚合稿阶段 2）读参保状态，不订阅
- name: 参保已减员
  published_by: AGG-74
  by_command: 参保减员
  payload: [参保登记ID, 人员ID, 缴纳主体法人ID, 减员生效日]
  subscribers:
  - {type: 仅分析}
- name: 薪酬档案已变更
  published_by: AGG-93
  by_command: 建立薪酬档案 / 调整薪酬档案
  payload: [薪酬档案ID, 档案版本ID, 人员ID, 变更类别码（建立、调整）, 生效日, 扣缴义务人法人ID]
  subscribers:
  - {type: 流程, ref: PRC-145, handled_by: 三口径比对预警（同 BC）}
  note: 薪资标准与发薪账户不入载荷。聚合稿原写订阅方「仅分析」，本稿补 PRC-145 订阅（vs13.notes.md 结构问题 12）
- name: 个税与社保公积金申报已提交
  published_by: AGG-95
  by_command: 提交申报
  payload: [扣缴义务人法人ID, 所属期, 申报ID列表, 申报日]
  subscribers:
  - {type: 仅分析}
  note: 个税、社保、公积金三类均已提交后发布一次。缴款与银行流水对账的订阅方未定（vs13.notes.md 接缝问题 5：B-22 订阅或 B-15 经 api 读取流水）
- name: 薪酬规则已生效
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语 payroll_rule_version_published）
  published_by: AGG-待定-薪酬规则版本
  by_command: 发布薪酬规则版本
  payload: [规则版本ID, 规则类别码, 适用范围, 生效区间]
  subscribers:
  - {type: 仅分析}
  note: AGG-73 计算时按薪酬期间读取生效版本，不订阅

external_published:
- {name: 应付已确认, published_by: AGG-52, bc: B-10, by_command: 提交应付薪酬, used_by: PRC-126 第 1 步, note: 属 B-10 事件目录，本稿不收}
- {name: 转正已办理, name_status: 〔缺〕分片提议名, published_by: AGG-62, bc: B-13, by_command: 办理转正, used_by: PRC-85 第 3 步（出边到 B-15）, note: 属 B-13 事件目录，B-15 当前无处理（结构问题 10）}

consumed:
- name: 审批已通过
  from: platform.approval
  handled_by: [生效激励方案版本, 核定奖金, 批准]
  used_by: [PRC-121 第 3 步入口, PRC-122 第 3 步入口, PRC-124 第 4 步入口]
- name: 审批已驳回
  from: platform.approval
  handled_by: [驳回激励方案版本, 驳回奖金核定, 退回薪酬重算]
  used_by: [PRC-121 第 2 步 on_reject, PRC-122 第 4 步, PRC-124 第 3 步 on_reject]
- name: 审批已撤回
  from: platform.approval
  name_status: 事件名由 platform.approval 事件目录定，本稿不自造
  handled_by: [撤回激励方案版本, 撤回薪酬审核]
  used_by: [PRC-121 第 2 步 withdraw, PRC-124 第 3 步 withdraw]
- name: 绩效评估已确认
  from: B-13
  handled_by: [草拟奖金核定]
  used_by: [PRC-122 触发器]
  note: 仅月度评估；订阅方按评估类型过滤
- name: 月度考勤已锁定
  from: B-27
  handled_by: [计算]
  used_by: [PRC-124 触发器]
  note: 按人员 × 月发出，法人级汇聚由计算的前置条件检查
- name: 应付已结清
  from: B-10
  handled_by: [标记薪酬已发放]
  used_by: [PRC-127 触发器]
  note: B-15 与 B-12 都订阅，按应付类型过滤只处理应付薪酬
- name: BusinessFactAttributed
  from: B-16
  handled_by: [标记已过账]
  used_by: [PRC-134 触发器]
  note: 按来源单据类型过滤只处理月度薪酬结算
- name: 利润分配已支付
  from: B-10
  handled_by: [并入扣缴申报]
  used_by: [PRC-113 触发器]
- name: Employed
  from: B-13
  handled_by: [事件策略「入职后办理参保与建档」→ 参保增员、建立薪酬档案]
  used_by: [PRC-84 触发器]
- name: Separated
  from: B-13
  handled_by: [事件策略「离职后办理参保减员」→ 参保减员]
  used_by: [PRC-130 触发器]
- name: 劳动合同已签订
  from: B-13
  handled_by: [事件策略「三口径比对预警」（无聚合命令）]
  used_by: [PRC-145 触发器]
- name: 法人归属已变更
  name_status: 〔缺〕B-13 AGG-117 事件（已在聚合稿回补稿）
  from: B-13
  handled_by: [事件策略「三口径比对预警」（无聚合命令）]
  used_by: [PRC-145 触发器]
  note: 订阅方列需补 B-15（vs13.notes.md 结构问题 12）
