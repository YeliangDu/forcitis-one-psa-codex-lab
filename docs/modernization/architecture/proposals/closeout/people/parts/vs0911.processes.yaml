# vs0911 流程骨架片段：VS-09 PRC-88、PRC-89、PRC-181；VS-11 PRC-107、读模型 PRC-182。格式依 closeout/CONVENTIONS.md（含 §5）。
# 第二版（QC 修订）：按用户新原则重判人工审批——审批人一律 cost_object_owner，加审只引 APPROVAL_RULES guard: approval，每个人工审批写 why_human，
#   能规则化的改成拒绝 / 自动分流（候选规则见 vs0911.notes.md「QC 修订」）；审批回调按 §5 写成下一步 cross_bc 入事件；通知写 notify；可撤回写 withdraw。
# v1 字段原样保留，v1 中文 actor 换成 SH- 编号；聚合稿没有的命令写〔缺〕，见 vs0911.notes.md「新用语」。
# 读模型 PRC-90（出具经营月报，目录已去「并复盘」）属 reporting，不在本片段；PRC-181 承接复盘写入。

processes:

  - id: PRC-88
    name: 编制、批准并基线化经营计划与预算
    trigger:
      type: time
      desc: 经营计划周期开始
    stages: [VS-09.1, VS-09.3]
    stages_note: "跳过 VS-09.2 有意：SD-15 已批准 VS-09.3 有两种退出：经营计划新版本、经营复盘已闭环；本流程第二个触发（复盘后调整计划）产生经营计划新版本，PRC-181 承接经营复盘已闭环，该路径不经滚动预测；VS-09.2 的新版本由 PRC-89 产生"
    primary_object: OBJ-100
    owner_bc: B-18
    human_orchestration: true
    human_note: 计划审批、调整产生新版本
    migration: "全部历史迁入（U-1–U-4）：已基线的版本原样迁为基线，不可变；编制中与审批中的按当前状态迁入；预算账户与占用、消耗、释放历史随迁。来源待取证"
    scope: "经营计划与预算按组织单元范围可见；管理层与财务经办"
    segregation:
      - {roles: [SH-M1], rule: "编制人与审批人不得为同一人；责任人就是编制人时按 AR-11 由其上级审批"}
    triggers:
      - {type: time, name: 经营计划周期开始（年度、季度）}
      - {type: human, name: 经营复盘后调整计划（VS-09.3 退出条件：计划新版本）}
    outcomes: [经营计划新版本已基线化, 预算账户已开立, 已调整, 已撤回, 已作废]
    scenarios: [PRC-88-S01, PRC-88-S02, PRC-88-S03, PRC-88-S04, PRC-88-S05, PRC-88-S06, PRC-88-S07, PRC-88-S08, PRC-88-S09]
    roles:
      - {id: SH-M1, as: initiator, org_needs: {responsibility: 编制所辖组织单元的经营计划版本并提交审批, approval_right: 无（编制与提交）, department_hint: 计划归属组织单元（部门、事业部；公司级为管理层）, position_hint: 组织单元负责人或其指定的计划编制人}}
      - {id: SH-M1, as: approver, org_needs: {responsibility: 对本组织单元经营计划的可达性与资源取舍负责, approval_right: 经营计划审批（实例级，计划归属组织单元的责任人）, department_hint: 计划归属组织单元（公司级为管理层）, position_hint: 组织单元负责人（部门负责人）；公司级为管理层负责人}}        # 审批人是计划归属组织单元的责任人，与编制人分离见 segregation
      - {id: SH-E6, as: performer, org_needs: {responsibility: 为预算类基线开立预算账户，在基线额度总额内调剂账户额度, approval_right: 无（账户级调剂由规则守卫，不设审批）, department_hint: 财务部门, position_hint: 预算管理与预算会计职能岗}}       # 财务
      - {id: SH-O1, as: informed, org_needs: {responsibility: 获知经营计划基线, approval_right: 无, department_hint: 不适用（股东和合伙人）, position_hint: 不适用}}        # VS-09 价值接收方；不参与动作
    steps:
      - actor: SH-M1
        where: in_system
        command: 编制经营计划版本
        aggregate: AGG-79
        desc: 目标值按组织 × 期间 × 指标；目标类型含预算、承诺、挑战、预测、减值计划（terms 目标类型）；复盘后调整另起新版本，不改已基线版本（INV-101）
        permission: 经营计划.编制
        page: 经营计划编辑页
        decision:
          - {when: 编制人放弃编制中的草稿, goto: 9}
          - {when: otherwise, goto: 2}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕提交经营计划审批
        aggregate: AGG-79
        gap: G-02
        desc: 提交审批的命令聚合稿未列（同 AGG-12 的「提交报价评审」写法）
        permission: 经营计划.提交审批
        page: 经营计划编辑页
        notify: [{to: SH-M1, how: 企业微信待办}]      # 通知归属组织单元的责任人
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}

      - actor: SH-M1
        platform_task: true
        service: platform.approval
        where: in_system
        command: 经营计划审批
        desc: 审批人按计划归属组织单元解析为其责任人；方案是否可达、资源取舍是判断，不能规则化；基线不可变由 INV-101 守卫
        approval:
          engine: platform.approval
          doc_type: 经营计划审批
          approver: cost_object_owner     # 归属对象是组织单元，其责任人即部门负责人（公司级计划为管理层负责人）
          escalation_rules: [AR-11, AR-12]  # 责任人就是编制人本人 / 责任人缺位；AR-01、02 的金额阈值不适用（计划不是金额单据）
          why_human: 目标值与资源取舍是否合理、是否可达，需要责任人凭经营判断，规则只能守「基线不可变」「编制人不审自己」，不能替代判断
          on_reject: 4
        withdraw: {to: end, outcome: 已撤回}   # 审批未结束前，编制人可撤回提交（〔缺〕撤回经营计划审批，见 notes 新用语）
        permission: 经营计划.审批
        page: 经营计划审批待办
        notify: [{to: SH-M1, how: 企业微信待办}]
        audit: true
        decision:
          - {when: 审批通过, goto: 5}
          - {when: otherwise, goto: 4}

      - actor: platform
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回经营计划审批
        aggregate: AGG-79
        desc: 审批驳回的回调；退回编制（版本回到编制中）
        notify: [{to: SH-M1, how: 企业微信通知}]      # 通知编制人
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: 1}

      - actor: platform
        where: automatic
        command: 〔缺〕通过经营计划审批
        aggregate: AGG-79
        desc: 审批通过的回调
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}

      - actor: system
        where: automatic
        command: 基线化经营计划
        aggregate: AGG-79
        emits: [经营计划已基线化]
        desc: 审批通过即自动基线化，人的判断已在审批完成，不再设人工确认；基线不可变，只出新版本（INV-101）；事件仅分析
        notify: [{to: SH-E6, how: 企业微信通知}]      # 预算类通知财务开立账户
        audit: true
        metric_event: true
        decision:
          - {when: 目标类型为预算, goto: 7}
          - {when: otherwise, goto: end}
        outcome: 经营计划新版本已基线化                 # 非预算类型在此结束

      - actor: SH-E6
        where: in_system
        command: 开立预算账户
        aggregate: AGG-80
        pending: vs0911-待定1              # 预算占用超额拦截还是预警未定，影响占用步骤
        desc: 预算基线按维度树逐级生成预算账户（terms 预算分解）；开立后采购、报销等调用预算占用（占用与释放步骤在 PRC-70、PRC-87，不在本流程）
        permission: 预算账户.开立
        page: 预算账户管理页
        cross_bc:
          - {mode: api, direction: in, bc: B-11, name: 占用预算}       # B-11 → B-18 api 边已有
          - {mode: api, direction: in, bc: B-12, name: 占用预算}       # B-12 → B-18 api 边已有
        decision:
          - {when: 预算期内出现调整需求, goto: 8}
          - {when: otherwise, goto: end, outcome: 预算账户已开立}
        outcome: 预算账户已开立

      - actor: SH-E6
        where: in_system
        on_time: 预算期内出现调整需求
        command: 调整预算
        aggregate: AGG-80
        emits: [BudgetAdjusted]
        desc: 账户级调整只在已基线额度总额内调剂，由规则守卫（超出即拒绝，改走新版本，不设审批）；terms 的预算调整是「产生预算基线新版本的受控变更」，聚合稿 AGG-80 的调整预算是账户命令，两者口径不一致，见 NOTES 结构问题 2
        permission: 预算账户.调整
        page: 预算账户调整页
        audit: true
        metric_event: true
        decision:
          - {when: 调整超出基线额度总额或要改目标值（规则拒绝）, goto: 1}   # 受控变更走新版本，INV-101
          - {when: otherwise, goto: end}
        outcome: 已调整

      - actor: SH-M1
        where: in_system
        entry: 编制人放弃编制中的草稿
        branch: 放弃
        command: 作废经营计划草稿
        aggregate: AGG-79
        desc: 仅编制中的版本可放弃（INV-101）：审批中须先撤回再作废，基线不可作废（只出新版本）；草稿未提交、无下游引用，编制人自行作废，不设审批，原因必填并留审计；作废为终态，不再进入审批，要继续须另起新版本
        permission: 经营计划.作废
        page: 经营计划编辑页
        audit: true
        decision:
          - {when: otherwise, goto: end}
        outcome: 已作废
    notes: 基线不可变，只出新版本（INV-101）；复盘后调整计划也走本流程。预算账户拦截或预警未定（INV-102、〔支研〕问题 11），影响占用步骤，见 NOTES 待用户定 1。账户级预算调整不设审批：额度总额内由财务调剂并留审计，超出由规则拒绝并改走新版本审批。

  - id: PRC-89
    name: 编制滚动预测
    trigger:
      type: time
      desc: 每周销售预测承诺；按期现金流预测
    stages: [VS-09.2]
    primary_object: OBJ-100
    owner_bc: B-18
    human_orchestration: false
    migration: "全部历史迁入（U-1–U-4）：已闭环的预测版本迁为历史版本；在途 1,212 单（信息图 M-8）提示流程未闭环，迁入后只读归档，不重开。来源待取证"
    scope: "销售预测按人员本人及其管理链可见；现金流预测限财务与管理层"
    triggers:
      - {type: time, name: 每周销售预测承诺（预测周期末含现金流预测）}
    outcomes: [经营计划新版本已编制（预测）, 经营计划新版本已编制（现金流预测）, 已提醒]
    scenarios: [PRC-89-S01, PRC-89-S02, PRC-89-S03]
    roles:
      - {id: SH-E5, as: initiator, org_needs: {responsibility: 按周编制本人的销售预测版本, approval_right: 无（预测不审批）, department_hint: 市场与客户部门, position_hint: 市场和客户经理职能岗}}       # 市场和客户经理
      - {id: SH-E6, as: performer, org_needs: {responsibility: 在预测周期末编制现金流预测, approval_right: 无, department_hint: 财务部门, position_hint: 现金流与资金预测职能岗}}       # 财务
      - {id: SH-E2, as: performer, org_needs: {responsibility: VS-09.2 参与者；本骨架无其动作，待用户确认, approval_right: 无, department_hint: 项目管理相关部门, position_hint: 项目经理职能岗}}       # VS-09.2 参与者含项目经理；本骨架无其动作，待用户确认（NOTES 待用户定 4）
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知预测与逾期未报升级, approval_right: 无, department_hint: 管理层, position_hint: 管理层负责人}}
    steps:
      - actor: SH-E5
        where: in_system
        on_time: 每周
        command: 编制预测版本
        aggregate: AGG-79
        desc: 经营计划类型「预测」，目标值按人员 × 期间 × 指标；每次滚动产生新版本（VS-09.2 退出）。预测是预期不是承诺，不设审批
        permission: 预测.编制
        page: 销售预测填报页
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与组织单元}   # B-18 → B-13 api 边已有；AGG-79 引用列缺人员，见 NOTES 接缝问题 1
        timeout: {after: "P7D", escalate_to: SH-M1, interrupting: false}      # 逾期未报的升级对象与期限：待用户定（NOTES 待用户定 4）
        pending: vs0911-待定4
        decision:
          - {when: 本期为现金流预测期, goto: 2}
          - {when: otherwise, goto: end, outcome: 经营计划新版本已编制（预测）}
        outcome: 经营计划新版本已编制（预测）

      - actor: SH-E6
        where: in_system
        command: 编制现金流预测
        aggregate: AGG-79
        desc: 指标为现金流（信息图 M-9），在当期销售预测版本之后编制；新版本是否经审批成为新基线，VS-09.2 notes 与本流程不一致，见 NOTES 结构问题 3
        permission: 现金流预测.编制
        page: 现金流预测编辑页
        outcome: 经营计划新版本已编制（现金流预测）
    notes: 迁移时在途 1,212 单提示流程未闭环，只读归档（信息图 M-8）。读模型 PRC-90 出具经营月报并复盘属 reporting，不在本片段。现金流预测在当期销售预测之后编制（QC 修订：原为两个独立入口，生成器无多入口写法，见 NOTES 格式问题 1）。

  - id: PRC-107
    name: 知识条目的起草、评审、发布与修订废止
    trigger:
      type: human
      desc: 技术专家主动起草；项目复盘发布后由复盘编制人决定提炼；已发布版本修订时以新版本重新进入
    stages: [VS-11.1, VS-11.2, VS-11.3]
    stages_note: "VS-11.1 由第 1–3 步承载（提交评审使 OBJ-110 到评审，即本段退出）"
    primary_object: OBJ-110
    owner_bc: B-30
    human_orchestration: true
    human_note: 有效期届满前定时提醒复审，修订或废止由人决定；评审结论可退回起草
    merged_from: [PRC-108, PRC-109, PRC-110]
    migration: "老系统无知识条目实体（信息图 OBJ-110 取证），迁入集合为空，无在途实例；A8 文档中心 567 份文档与项目档案 203 条知识平台文件夹引用是否转条目，见 NOTES 待用户定 5"
    scope: "已发布版本全员可读；起草中与评审中的版本限起草人、评审人与知识管理员；案例类若含客户信息，访问范围见 NOTES 待用户定 6"
    segregation:
      - {roles: [SH-E4], rule: "同一知识条目版本的起草人与评审人不得为同一人（SH-E4 兼任起草与评审两种身份，按人区分）；起草人就是专业负责人时按 AR-11 由其上级评审"}
    triggers:
      - {type: human, name: 技术专家主动起草}
      - {type: call, name: 项目复盘编制人在复盘详情页决定提炼，调用创建知识条目, bc: B-04}
      - {type: time, name: 已发布版本有效期届满前提前量到达，提醒复审}    # CONVENTIONS §5：登记 platform.scheduling，只提醒，不自动改状态
    outcomes: [已发布, 已修订, 已废止, 已提醒]
    frequency_ref: 待取证（老系统无知识条目，投产后起累计）
    scenarios: [PRC-107-S01, PRC-107-S02, PRC-107-S03, PRC-107-S04, PRC-107-S05, PRC-107-S06, PRC-107-S07]
    roles:
      - {id: SH-E4, as: initiator, org_needs: {responsibility: 起草、提交、发布、修订与废止知识条目, approval_right: 无（起草与发布；评审由他人）, department_hint: 技术委员会及各专业组织单元, position_hint: 技术专家（专业组成员）}}       # 技术专家（技术委员会）
      - {id: SH-E4, as: approver, org_needs: {responsibility: 对知识条目的技术正确性、适用范围与有效期负专业责任, approval_right: 知识条目评审（类型级专业角色，聚合内单级评审）, department_hint: 知识条目所属专业类别对应的组织单元（技术委员会）, position_hint: 专业负责人（技术委员会的专业负责人）}}        # 评审人：类型级专业角色（resolve: type），与起草人分离见 segregation
      - {id: SH-E2, as: initiator, org_needs: {responsibility: 在项目复盘后决定提炼并从提炼入口创建知识条目, approval_right: 无, department_hint: 项目管理相关部门, position_hint: 项目经理职能岗（复盘编制人）}}       # 项目经理：复盘编制人，从复盘提炼
      - {id: SH-E3, as: performer, org_needs: {responsibility: 参与起草知识条目内容（VS-11.1）, approval_right: 无, department_hint: 设计与咨询相关部门, position_hint: 设计师和顾问}}       # 第 2 步协作编辑
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知知识条目发布情况；评审逾期时收到升级提醒并督办, approval_right: 无（评审不由管理层做）, department_hint: 管理层, position_hint: 管理层负责人}}        # 第 4 步逾期升级、第 5 步发布通知
    steps:
      - actor: SH-E4
        where: in_system
        command: 创建知识条目
        aggregate: AGG-107
        desc: 技术专家主动创建；从项目复盘提炼时由复盘编制人（SH-E2）在 B-04 的提炼入口调用同一命令，来源复盘 ID 只记录不校验。「项目复盘已发布」订阅方是 B-04 自身，不是本 BC（AGG-103），所以触发写 call，不写 event
        permission: 知识条目.创建
        page: 知识条目编辑页（提炼入口在 B-04 项目复盘详情页）
        effort: {typical_min: 2, p90_min: 5}
        cross_bc:
          - {mode: api, direction: in, bc: B-04, name: 创建知识条目}    # B-04 → B-30 api 边已有

      - actor: SH-E4
        where: in_system
        command: 起草知识条目
        aggregate: AGG-107
        desc: 填类别、适用范围、有效期与正文；设计师和顾问（SH-E3）可协作编辑；评审退回后回到本步；修订产生的新版本经第三个触发从本步重新进入
        permission: 知识条目.起草
        page: 知识条目编辑页
        effort: {typical_min: 120, p90_min: 480}

      - actor: SH-E4
        where: in_system
        command: 提交知识条目评审
        aggregate: AGG-107
        desc: 类别、适用范围、有效期缺一不得提交（规则校验）；提交后进入「评审中」，即 VS-11.1 退出
        permission: 知识条目.提交评审
        page: 知识条目详情页
        effort: {typical_min: 2, p90_min: 5}
        notify: [{to: SH-E4, how: 企业微信待办}]      # 通知评审人（归属专业组织单元的责任人）

      - actor: SH-E4
        where: in_system
        command: 评审知识条目
        aggregate: AGG-107
        desc: 评审结论为通过或退回，退回由本命令的结论表达，不另设退回命令；审批人与审批记录在聚合内（审批人经 api 读人员）；B-30 无到 platform.approval 的边，评审是聚合内单级命令（见 NOTES 结构问题 1）
        approval:
          engine: aggregate
          doc_type: 知识条目评审           # B-30 聚合内单级评审命令，不经 platform.approval
          approver: SH-E4                 # 类型级专业角色（resolve: type）：知识条目所属专业类别对应的技术委员会专业负责人
          escalation_rules: [AR-11, AR-12]  # 评审人就是起草人本人 / 专业角色缺位：聚合内由系统改指其上级为审批人；金额类规则不适用
          why_human: 知识内容的技术正确性、适用范围与有效期是否恰当属专业判断，规则只能校验必填项、评审人不是起草人、已发布不可改（INV-115），不能替代
          on_reject: 2
        permission: 知识条目.评审
        page: 知识条目评审页
        audit: true
        effort: {typical_min: 30, p90_min: 120}
        wait: {typical_h: 24, p90_h: 120}
        timeout: {after: "P10D", escalate_to: SH-M1, interrupting: false}   # 10 天为估值，期限与升级对象仍归 NOTES 待用户定 8
        pending: vs0911-待定8
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取审批人}     # B-30 → B-13 api 边已有
        notify: [{to: SH-E4, how: 企业微信通知}]      # 通知起草人评审结论
        decision:
          - {when: 评审通过, goto: 5, p: 0.8}
          - {when: otherwise, goto: 2, p: 0.2}

      - actor: SH-E4
        where: in_system
        command: 发布知识条目
        aggregate: AGG-107
        emits: [知识条目已发布]
        pending: vs0911-待定6               # 案例类含客户信息的访问范围与脱敏确认
        desc: 发布后为「已发布」，即 VS-11.2 退出；已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅
        permission: 知识条目.发布
        page: 知识条目详情页
        audit: true
        metric_event: true
        effort: {typical_min: 2, p90_min: 5}
        notify: [{to: SH-M1, how: 企业微信通知}]      # 管理层获知发布情况
        cross_bc:
          - {mode: api, direction: in, bc: B-02, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-03, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-04, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-28, name: 校验知识条目版本存在且未废止}
        decision:
          - {when: 复审认为仍适用但内容或适用范围需更新, goto: 6, p: 0.2}
          - {when: 复审认为不再适用, goto: 7, p: 0.1}
          - {when: otherwise, goto: end, outcome: 已发布, p: 0.7}
        outcome: 已发布                   # 发布后无复审结论则流程在此结束

      - actor: SH-E4
        where: in_system
        on_time: 有效期届满前提前量到达，或适用范围变化
        command: 修订知识条目
        aggregate: AGG-107
        emits: [知识条目已修订]
        desc: 产生新版本（引用被取代版本），本实例以「已修订」结束；新版本以起草中经第三个触发重新进入本流程第 2 步，评审发布后才取代旧版本，旧版本此前仍可引用
        permission: 知识条目.修订
        page: 知识条目编辑页
        audit: true
        metric_event: true
        outcome: 已修订

      - actor: SH-E4
        where: in_system
        on_time: 有效期届满
        command: 废止知识条目
        aggregate: AGG-107
        branch: 废止
        emits: [知识条目已废止]
        desc: 废止后不得被新引用，已有引用不受影响（INV-115）
        permission: 知识条目.废止
        page: 知识条目详情页
        audit: true
        metric_event: true
        outcome: 已废止
    notes: 合并原 PRC-108、109、110（⑥a 评审 H2 c）；2026-10-17 并入云端试点 VS-11（pilot/RESULT.md 第 4 节第 1–12 条，one-architecture 裁定）。已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅。项目复盘提炼入口的页面在 B-04，命令在本 BC。评审是专业判断，保留人工，按聚合内审批写；补 B-30 → platform.approval 边的影响见 NOTES 结构问题 1。评审中撤回提交、评审逾期中断处理 AGG-107 无命令，由 one-architecture 回补聚合稿，本稿只写非中断升级提醒。

  - id: PRC-181
    name: 记录经营复盘并跟踪动作
    trigger:
      type: event
      desc: 会计期间已关账（经营月报据此出具）；或季度、年度综合复盘到期
    stages: [VS-09.3]
    stages_note: "归 VS-09.3：SD-15 已批准退出条件补「经营复盘已闭环」，由本流程无动作定稿或全部经营动作完成产生；需调整计划时转 PRC-88 产生另一种退出「经营计划新版本」。批准依据：intent 2026-10-17-084935-one-coordinator-ANM-页提交-ANM-2026.md（AN-11）；价值流定义由 one-architecture 写回"
    primary_object: OBJ-100
    owner_bc: B-18
    human_orchestration: true
    human_note: 偏差解释、经营动作的确定与完成登记由人判断；全过程不设审批，靠规则守卫与逾期提醒
    migration: "不迁入历史复盘：老系统是否有经营复盘或偏差处置记录来源待取证；投产后从首个关账期间起记录。取证若发现在途的偏差处置事项，再按当前状态迁入为复盘与经营动作"
    scope: "复盘记录与经营动作按复盘组织单元的数据范围可见：该组织单元责任人及其上级、财务、管理层；动作责任人见本人的动作"
    triggers:
      - {type: event, entry: 1, name: "会计期间已关账（月度；经营月报据此出具，B-19 发布）", event: AccountingPeriodClosed, bc: B-19}
      - {type: time, entry: 1, name: "季度、年度综合复盘到期（B-18 向 platform.scheduling 登记，幂等键 = 复盘组织单元 ID + 复盘期间）"}
    outcomes: [经营复盘已闭环, 已转调整计划, 复盘待期间关账, 已提醒]
    scenarios: [PRC-181-S01, PRC-181-S02, PRC-181-S03, PRC-181-S04, PRC-181-S05, PRC-181-S06]
    roles:
      - {id: SH-M1, as: initiator, org_needs: {responsibility: 对所辖组织单元的经营偏差作出解释，确定经营动作及其责任人和期限，定稿复盘, approval_right: 无（复盘记录不设审批）, department_hint: 复盘组织单元（部门、事业部；公司级为管理层）, position_hint: 组织单元负责人（部门负责人）；公司级为管理层负责人}}
      - {id: SH-M1, as: performer, org_needs: {responsibility: 作为经营动作责任人完成动作并登记完成, approval_right: 无, department_hint: 动作责任人所在组织单元, position_hint: 组织单元负责人或其指定的动作责任人}}       # 动作责任人可以是复盘责任人本人或其指定的人员，一律取 SH-M1 的职责口径，岗位体系定后再核
      - {id: SH-E6, as: performer, org_needs: {responsibility: 经营月报出具后为偏差提供口径说明与财务分析支持, approval_right: 无, department_hint: 财务部门, position_hint: 经营分析与管理会计职能岗}}       # VS-09.3 参与者；系统内无其命令，口径说明经月报与线下沟通，是否需要系统内步骤见 NOTES 待用户定 10
      - {id: SH-O1, as: informed, org_needs: {responsibility: 获知经营复盘结论与动作完成情况, approval_right: 无, department_hint: 不适用（股东和合伙人）, position_hint: 不适用}}        # VS-09 价值接收方；经营月报与复盘摘要的接收方，不参与动作
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕创建经营复盘
        aggregate: AGG-79
        desc: 为每个有已基线经营计划的复盘组织单元，按关账期间（或综合复盘周期末期间）创建一条经营复盘，关联当期基线版本；偏差数据由经营月报（PRC-90，reporting 读模型）展示，复盘记录只存引用与偏差解释，不复制报表数；同一组织单元 × 复盘期间只一条（幂等）；综合复盘到点而期间尚未关账的不创建，告警财务，关账后由月度触发补建
        audit: true
        notify:
          - {to: SH-M1, how: 企业微信待办}      # 通知复盘责任人
          - {to: SH-E6, how: 企业微信通知（期间未关账时：待关账后自动补建）}
        cross_bc:
          - {mode: event, direction: in, bc: B-19, name: AccountingPeriodClosed}       # B-18 → B-19 事件边尚无，见 NOTES 接缝问题 8
        decision:
          - {when: 复盘期间尚未关账, goto: end, outcome: 复盘待期间关账}
          - {when: otherwise, goto: 2}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕记录偏差解释
        aggregate: AGG-79
        desc: 对目标偏差超出容忍度的指标逐项写解释（原因与是否可持续）；未超容忍度的指标可不解释；容忍度为规则参数（候选规则，交 one-rules）
        permission: 经营复盘.记录偏差解释
        page: 经营复盘编辑页
        decision:
          - {when: otherwise, goto: 3}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕确定经营动作
        aggregate: AGG-79
        desc: 每个动作写描述、类型（含「调整经营计划」）、责任人、期限和来源偏差；一次复盘可确定多个动作，重复本步；动作责任人收到待办
        permission: 经营复盘.确定经营动作
        page: 经营复盘编辑页
        notify: [{to: SH-M1, how: 企业微信待办}]      # 通知动作责任人
        decision:
          - {when: otherwise, goto: 4}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕定稿经营复盘
        aggregate: AGG-79
        emits: [经营复盘已定稿]
        desc: 规则守卫：超出容忍度的偏差都有解释才可定稿；每个动作都有责任人和期限；定稿后结论不可改，更正另记经营动作。不设审批：复盘记录不产生资金、对外效力或不可逆后果，约束靠上述规则与逾期提醒。含「调整经营计划」类动作的，复盘转 PRC-88（经营复盘后调整计划，编制人另起新版本并引用该动作）；其余动作的跟踪随经营复盘记录继续，见 NOTES 格式问题 10
        permission: 经营复盘.定稿
        page: 经营复盘编辑页
        audit: true
        metric_event: true
        decision:
          - {when: 复盘未确定任何经营动作, goto: end, outcome: 经营复盘已闭环}
          - {when: 经营动作含调整经营计划, goto: PRC-88, outcome: 已转调整计划}
          - {when: otherwise, goto: 5}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕完成经营动作
        aggregate: AGG-79
        emits: [经营复盘已闭环]
        desc: 动作责任人登记完成说明；全部动作完成后经营复盘闭环；到期未完成的动作非中断，由系统提醒复盘责任人，不自动完成、不自动取消；动作的取消与延期是否需要见 NOTES 待用户定 11
        permission: 经营动作.完成
        page: 经营动作跟踪页
        audit: true
        metric_event: true
        timeout: {after: "各经营动作自带的期限（确定动作时登记，B-18 向 platform.scheduling 登记到期提醒）", escalate_to: system, interrupting: false}      # 系统向复盘责任人发提醒（企业微信通知），与动作责任人同为 SH-M1 角色，故升级任务放系统泳道
        decision:
          - {when: 仍有未完成的经营动作, goto: 5}
          - {when: otherwise, goto: end, outcome: 经营复盘已闭环}
        outcome: 经营复盘已闭环
    notes: 对应价值流 VS-09.3「偏差有解释、有责任人和动作」。经营月报（PRC-90）只读不写，复盘记录由本流程写入。经营复盘记录先放 AGG-79（经营计划版本的次级「复盘记录」），不新增聚合，见 NOTES 结构问题 11，待 one-architecture 定。PRC-88 的第二个触发（经营复盘后调整计划）由「调整经营计划」类动作承接。

event_policies:

  - id: PRC-161
    name: 关闭预算账户
    type: event_policy
    trigger:
      type: time
      desc: 预算期届满（年末）
    triggers:
      - {type: time, name: "预算期届满（B-18 向 platform.scheduling 登记，幂等键 = 聚合 ID + 到期时点）"}
    stages: []
    primary_object: OBJ-100
    primary_object_note: "预算账户是 OBJ-100 的类型「预算」"
    support: "B-18 预算期届满的定时例行处理：只有定时触发（无对象状态），结局（预算账户已关闭）不造 VS-09.3 的退出条件（OBJ-100 新版本）（STAGE_ALIGN.md 归段判据第 6 项）"
    owner_bc: B-18
    migration: "迁入不触发（ADR-0036 M7）；迁入时已届满的预算账户按迁入对账核对状态，不回放关闭"
    outcomes: [预算账户已关闭, 关闭待处理]
    scenarios: [PRC-161-S01, PRC-161-S02]   # S01 预算期届满，账户无占用中的占用行，关闭；S02 仍有占用中的占用行，关闭待处理并告警财务
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收关闭待处理告警，先释放或消耗占用中的占用行后重新触发", approval_right: "无", department_hint: "财务部", position_hint: "预算会计、财务负责人"}}       # 财务：占用未清告警
    steps:
      - actor: system
        where: automatic
        command: 关闭预算账户
        aggregate: AGG-80
        desc: 预算期届满或已被同计划新基线取代的账户关闭，之后不再接受占用与调剂；仍有占用中的占用行的账户不关闭，告警财务先释放或消耗，不静默（CLAUDE.md 第 6 条）；已关闭无操作
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: 账户仍有占用中的占用行, goto: end, outcome: 关闭待处理}
          - {when: otherwise, goto: end, outcome: 预算账户已关闭}
    notes: 定时由 B-18 向 platform.scheduling 登记，到点调本 BC 命令，边 B-18 → platform.scheduling 按平台依赖登记（CONVENTIONS §5）。账户关闭后占用方单据（B-11、B-12）再调用预算占用会被拒绝并提示，由占用方单据所属流程处理。无人工审批：关闭由日期与占用状态守卫。

read_models:

  - id: PRC-182
    name: 查看知识条目使用情况
    type: read_model
    stages: [VS-11.3]
    stages_note: "读模型只读 OBJ-110 已发布版本及其引用，不造任何状态；服务本段（修订废止）的复审决策，为旁路读，按其读取的「发布」状态（VS-11.3 进入条件）留在 VS-11.3（归段判据第 6 项）"
    owner_bc: reporting
    reads: [AGG-107, AGG-12, AGG-03, AGG-27]
    migration: "读模型不迁入，随迁入后的知识条目与引用事件重建；老系统没有知识条目实体与引用关系（信息图 OBJ-110 取证，迁入集合为空），投产后起累计"
    scope: "技术委员会与各专业负责人见本专业类别全部条目；管理层见全部；起草人见本人起草的条目；引用方只显示单据类型与编号，不显示客户信息（案例类含客户信息的访问范围待用户定 6）"
    frequency_ref: 不适用（读模型，随领域事件刷新；访问量待取证）
    scenarios: [PRC-182-S01, PRC-182-S02, PRC-182-S03, PRC-182-S04]
    roles:
      - {id: SH-E4, as: performer, org_needs: {responsibility: 依据使用情况决定知识条目的修订或废止, approval_right: 无（只读；修订与废止在 PRC-107）, department_hint: 技术委员会及各专业组织单元, position_hint: 专业负责人、技术专家}}
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知知识条目的使用与复审情况, approval_right: 无, department_hint: 管理层, position_hint: 管理层负责人}}
    events:
      - {event: 知识条目已发布, aggregate: AGG-107, bc: B-30}
      - {event: 知识条目已修订, aggregate: AGG-107, bc: B-30}
      - {event: 知识条目已废止, aggregate: AGG-107, bc: B-30}
      - {event: 报价版本已生效, aggregate: AGG-12, bc: B-03}
      - {event: 服务产品版本已发布, aggregate: AGG-03, bc: B-02}
      - {event: 交付物已签发, aggregate: AGG-27, bc: B-28}
    desc: 服务 VS-11.3「修订废止」的决策：哪些已发布条目被引用多、有效期将满，应优先复审修订；哪些长期无人引用、有效期已满，应废止。引用方（报价版本、服务产品版本、交付物）按 ID 与版本引用知识条目版本（INV-115，不订阅），reporting 订阅引用方的领域事件，事件负载带所引用的知识条目版本 ID（见 NOTES 接缝问题 9）；本读模型不读业务交易表，不改任何对象状态
    query: "读 reporting 层的知识条目版本与引用事件，按知识条目版本 × 引用方类型 × 统计窗口汇总被引用次数（引用方单据去重）和最近一次被引用日，并派生距有效期届满天数与建议动作（建议复审修订、建议废止）；建议只是提示，不改状态，修订与废止由 PRC-107 的人工命令完成"
    dimensions:
      - 知识条目（含版本）
      - 知识类别
      - 适用范围
      - 引用方类型（报价版本、服务产品版本、交付物）
      - 归属组织单元
      - 统计窗口
    metrics:
      - 被引用次数
      - 最近一次被引用日
      - 距有效期届满天数
      - 建议动作
    suggestions:
      - code: 建议复审修订
        rule: 已发布版本距有效期届满不足提前量，且统计窗口内仍有引用
      - code: 建议废止
        rule: 已发布版本有效期已届满或统计窗口内无引用，且无后继版本
    refresh: 订阅领域事件增量更新（reporting L1，ADR-0023），每日定时全量校正一次
    freshness: 事件到达后分钟级；以每日校正为准
    permission: 知识条目使用情况.查看
    page: 知识条目使用情况页
    notes: 只读、无命令。提前量与「无引用」的统计窗口为规则参数，待用户定 12（推荐窗口 12 个月、提前量 30 天）。已废止条目的既有引用仍计入，新引用被 INV-115 拒绝，故废止后不再新增引用。引用关系的口径依赖引用方事件负载，见 NOTES 接缝问题 9。
