  emits: （内部）
  used_by:
  - PRC-80 第 11 步
  orphan: false
- name: 提交招聘需求
  aggregate: AGG-65
  entity: recruitment_requisitions
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 需求ID（客户端预生成）
  - 职位ID
  - 组织单元ID
  - 需求人数
  - 期望到岗日
  - 需求说明
  preconditions:
  - ref: R-01
    text: 职位须启用、组织单元须有效，违反拒绝并退回改正
  - ref: 状态
    text: 需求为草稿
  authority:
    ref: raci:AGG-65/提交招聘需求
    A:
      resolve: instance
      field: 招聘需求.提出人
    R:
    - SH-E1
  idempotency_key: 需求ID（同一 ID 重复提交返回已有结果）
  state_change: 草稿 → 已提交
  emits: （内部）
  used_by:
  - PRC-81 第 2 步
  orphan: false
- name: 批准招聘需求
  aggregate: AGG-65
  entity: recruitment_requisitions
  kind: human
  source: 聚合稿 AGG 命令列（B-13 聚合内单级批准，F-3，不经 platform.approval）
  params:
  - 需求ID
  - 批准意见
  preconditions:
  - ref: 状态
    text: 需求为已提交
  - ref: AR-11/AR-12
    text: 提出人本人就是归属组织单元责任人则上交其上级；责任人缺位上交上级组织负责人（待 V-18）
  - ref: 职责分离
    text: 提出人 ≠ 批准人
  authority:
    ref: raci:AGG-65/批准招聘需求
    A:
      resolve: type
      role: SH-M1
    R:
    - SH-M1
    approval:
      approver: SH-M1
      doc_type: 招聘需求批准
  idempotency_key: 需求ID（已批准再批准无操作）
  state_change: 已提交 → 已批准
  emits: 招聘需求已批准
  used_by:
  - PRC-81 第 3 步
  orphan: false
- name: 关闭招聘需求
  aggregate: AGG-65
  entity: recruitment_requisitions
  kind: human
  source: 聚合稿 AGG 命令列（v1 以关闭代驳回）
  params:
  - 需求ID
  - 关闭原因（驳回 / 撤回 / 取消 / 录满）
  preconditions:
  - ref: 状态
    text: 需求为已提交（批准人驳回，或提出人撤回），或已批准（取消、录满）
  - ref: PG-08
    text: 录满无触发，暂由人力或提出人手工关闭
  authority:
    ref: raci:AGG-65/关闭招聘需求
