event_policies:
- name: 入职日到点生效
  trigger_event: 定时：入职日到达（当天开始，platform.scheduling）；补登（入职日不晚于登记日）时登记后立即触发
  effect: 系统发令入职生效
  uses_command: 入职生效
  used_by:
  - PRC-83 第 2 步
  rules:
  - U-12
  note: 提前登记的须排定定时；迁入的在途待入职须重新排定（PRC-83 migration）
- name: 离职日到点生效
  trigger_event: 定时：离职日结束时（时点待 V-1，platform.scheduling）；离职日不晚于登记日则办理离职后立即触发
  effect: 系统发令离职生效
  uses_command: 离职生效
  used_by:
  - PRC-128 第 7 步
  rules:
  - U-12
  - V-1
  note: 迁入的已登记未到离职日的须重新排定（PRC-128 migration）
- name: 离职生效后终止任职与劳动合同
  trigger_event: Separated（本聚合发布，同 BC；Separated 先于本策略，PG-12）
  effect: 依次发令终止任职、终止劳动合同；终止劳动合同失败告警人力并重试，不回滚 Separated
  uses_command: 终止任职 / 终止劳动合同
  used_by:
  - PRC-128 第 8、9 步
  rules:
  - PG-12
  note: platform.identity 对已离职人员的「任职已变更」忽略（接缝问题 3）
- name: 业务生效日到点任职变更生效
  trigger_event: 定时：调岗业务生效日到达（platform.scheduling）；补登 / 当日登记则变更任职后立即触发
  effect: 系统发令任职变更生效
  uses_command: 任职变更生效
  used_by:
  - PRC-136 第 7 步
  rules:
  - U-12
  note: ''
