platform_commands:
- name: 建立待开通登录身份
  name_status: 〔缺〕
  service: platform.identity
  trigger: 入职已登记（B-13）
  purpose: 以人员 ID 为键建立待开通登录身份，拟定企业微信 userid = 工号；登录放行起点 = 入职日
  used_by:
  - PRC-137 第 1 步
  kind: event_reaction
  english: CreatePendingLoginIdentity
- name: 开通企业微信成员
  name_status: 〔缺〕（出站，ACL）
  service: platform.integration（由 platform.identity 编排）
  trigger: 建立待开通登录身份完成；入职日前 3 个工作日（T-1、T-2）
  purpose: 经企业微信适配器开通成员，返回 userid 与开通时间；失败或 userid 已被占用转告警开通未完成
  used_by:
  - PRC-137 第 2 步
  kind: outbound_api
  english: ProvisionWeComMember
- name: 绑定外部身份
  name_status: 〔缺〕
  service: platform.identity
  trigger: 开通企业微信成员成功；入职日前绑定的处于「待生效」，Employed 到达后放行登录
  purpose: 按 userid 精确绑定到人员，不按姓名或手机号模糊匹配
  used_by:
  - PRC-137 第 3 步
  kind: event_reaction
  english: BindExternalIdentity
- name: 告警开通未完成
  name_status: 〔缺〕
  service: platform.identity
  trigger: 开通失败，或入职日已到仍未绑定
  purpose: 告警信息部门与人力，不静默；1 个工作日未处理升级（T-2）
  used_by:
  - PRC-137 第 4 步
  kind: alert
  english: AlertProvisioningIncomplete
- name: 吊销会话
  name_status: 已有（平台已建，非〔缺〕）
  service: platform.identity
  trigger: Separated（B-13）
  purpose: 吊销该人员全部会话与每请求复核（RULE-363）；失败重试并告警信息部门
  used_by:
  - PRC-129 第 1 步
  - PRC-138 第 1 步（calls PRC-129）
  kind: event_reaction
  english: RevokeSessions
- name: 停用登录身份
  name_status: 〔缺〕
  service: platform.identity
  trigger: Separated（B-13）
  purpose: 登录以人员在职为准，离职后即使企业微信账号未停用也拒绝登录
  used_by:
  - PRC-138 第 2 步
  kind: event_reaction
  english: DisableLoginIdentity
- name: 删除全部角色授予
  name_status: 〔缺〕
  service: platform.identity
  trigger: Separated（B-13）
  purpose: 逐条写审计（ADR-0027 第 1 项第 6 点）；涉及超管或安全审计员持有人，或会使可用超管少于 2 名时不自动收回，转确认放行离职处置
  used_by:
  - PRC-138 第 3 步
  kind: event_reaction
  english: RevokeAllRoleGrants
- name: 确认放行离职处置
  name_status: 〔缺〕
  service: platform.identity
  trigger: 删除全部角色授予命中超管 / 安全审计员持有人（ADR-0027 第 7 点）
  purpose: 另一名超管持有人在系统内人工确认后放行，写审计；放行人不得是离职者本人。安全联锁，不是业务审批（V-17）
  used_by:
  - PRC-138 第 4 步
  kind: human
