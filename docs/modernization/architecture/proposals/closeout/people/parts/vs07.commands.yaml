      resolve: type
      role: SH-M1
    R:
    - SH-M1
    - SH-E1
    - SH-E6
  idempotency_key: 需求ID（已关闭再关闭无操作）
  state_change: 已提交 / 已批准 → 已关闭
  emits: 招聘需求已关闭
  used_by:
  - PRC-81 第 4 步（含第 2 步 withdraw 边进入）
  orphan: false
  note: 驳回是批准人决定，A 同批准；提出人撤回与已批准后取消 / 录满由提出人或人力执行同一命令（R）
