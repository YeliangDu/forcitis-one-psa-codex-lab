# B-13 命令目录（收敛产物，提议稿；规格见 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 B 节）
# 范围：AGG-60 法人主体、AGG-61 组织单元、AGG-62 人员、AGG-63 任职、AGG-64 职位目录与职级、AGG-65 招聘需求、AGG-66 注册执业证书、AGG-67 劳动合同、AGG-117 法人归属。AGG-106 绩效评估已在 vs13pay.*，不重复。
# 依据：vs07.processes.yaml（PRC-79–85、128、136，质检修订版）、vs07.notes.md、SAMPLE.md、data-model.people.yaml、聚合稿 AGG 命令列与回补稿。命令名沿用聚合稿与分片，不自造；
#   name_status 非空的是〔缺〕命令（聚合稿没有），全部沿用 vs07.notes.md「新用语」的提议名。
# 发令权 authority 指向 vs07.raci.yaml。kind：human 人发起；automatic 系统规则（定时、事件反应、规则守卫）；callback 审批平台回调——本组无（B-13 内批准是聚合单级命令，F-3，不经 platform.approval）。
# unused_ok：声明「目录有、骨架步骤不直接引用」的原因（维护用、骨架 approval.on_reject 边触发）。
# platform_commands：platform.identity 在 PRC-137、138、129（及 PRC-136 第 9–10 步）中的命令清单，不做状态机，只列名、触发事件、用途；〔缺〕名沿用 vs07.notes.md 新用语。
# 「孤儿」= 未被任一流程步骤、事件策略或维护用到。本稿 0 个孤儿（更正法人归属已于对象增删改查检查后并入 PRC-80 第 12 步，见 QC-OBJECTS.md）。
# 对象增删改查补缺（QC-OBJECTS.md）：更名 / 停用 / 启用法人主体（AGG-60）、新建 / 修改岗位（AGG-64）、登记 / 注销注册执业证书（AGG-66）共 7 条〔缺〕命令，命名取词表事件或数据模型状态列，不自造；name_status 非空。
bc: B-13
aggregates:
- AGG-60
- AGG-61
- AGG-62
- AGG-63
- AGG-64
- AGG-65
- AGG-66
- AGG-67
- AGG-117
commands:
- name: 登记法人主体
  aggregate: AGG-60
  entity: legal_entities
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 法人代码
  - 法人名称
  - 法人类型
  - 生效日
  preconditions:
  - ref: INV-59
    text: 法人代码发号后不可改；同代码重复登记返回已有结果
  - ref: R-B13-1
    text: 五家法人由初始化录入，之后新增走本命令（DATA_MODEL B-13）
  authority:
    ref: raci:AGG-60/登记法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人代码（同代码重复登记返回已有结果）
  state_change: 创建 → 有效
  emits: （内部）
  used_by:
  - PRC-80 第 2 步
  orphan: false
- name: 更名法人主体
  aggregate: AGG-60
  entity: legal_entity_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；词表事件「法人主体已更名」
  source: 词表事件法人主体已更名、已建代码；聚合稿命令列只有登记法人主体
  params:
  - 法人主体ID
  - 新名称
  - 生效日
  preconditions:
  - ref: INV-59
    text: 法人代码发号后不可改；更名只改名称，不改代码
  - ref: 状态
    text: 法人主体为有效
  authority:
    ref: raci:AGG-60/更名法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID + 生效日（同键重提无操作）
  state_change: 有效 → 有效（追加名称版本）
  emits: （内部）
  used_by:
  - PRC-80 第 7 步
  orphan: false
- name: 停用法人主体
  aggregate: AGG-60
  entity: legal_entity_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；词表事件「法人主体已停用」
  source: 词表事件法人主体已停用、已建代码；聚合稿命令列只有登记法人主体
  params:
  - 法人主体ID
  - 停用日
  - 停用原因
  preconditions:
  - ref: 状态
    text: 法人主体为有效
  - ref: 待定
    text: 法人主体仍有有效法人归属或在职任职时是否拒绝，聚合稿与词表均未定（vs07.notes.md 结构问题 19），本命令暂只校验状态
  authority:
    ref: raci:AGG-60/停用法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID（已停用再停用无操作）
  state_change: 有效 → 已停用
  emits: （内部）
  used_by:
  - PRC-80 第 8 步
  orphan: false
- name: 启用法人主体
  aggregate: AGG-60
  entity: legal_entity_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；词表事件「法人主体已启用」
  source: 词表事件法人主体已启用、已建代码；聚合稿命令列只有登记法人主体
  params:
  - 法人主体ID
  - 启用日
  preconditions:
  - ref: 状态
    text: 法人主体为已停用（词表另区分已登记与已启用，本稿登记即有效，见 vs07.notes.md 结构问题 19）
  authority:
    ref: raci:AGG-60/启用法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID（有效再启用无操作）
  state_change: 已停用 → 有效（恢复）
  emits: （内部）
  used_by:
  - PRC-80 第 9 步
  orphan: false
- name: 调整组织单元
  aggregate: AGG-61
  entity: org_units
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 组织单元ID（新建时为空）
  - 调整类型（新建 / 变更 / 停用 / 恢复启用 / 撤销）
  - 名称与简称
  - 上级组织单元
  - 单元类型
  - 是否交付单元
  - 负责人（人员ID）
  - 业务生效日
  preconditions:
  - ref: INV-60
    text: 撤销的组织单元下仍有在职任职则拒绝并提示先调岗（PRC-136），人力改正后重提
  - ref: 状态
    text: 已撤销的组织单元不可再调整
  - ref: 结构问题 14
    text: 负责人（责任人）是 cost_object_owner 的解析来源，须在版本表按生效区间保存；变更负责人即改变审批归属
  authority:
    ref: raci:AGG-61/调整组织单元
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 调整请求ID（客户端预生成 UUIDv7）
  state_change: 创建 → 启用；启用 ⇄ 停用；启用 / 停用 → 已撤销
  emits: 组织单元已调整
  used_by:
  - PRC-80 第 3 步
  orphan: false
- name: 指定法人归属
  aggregate: AGG-117
  entity: legal_entity_attributions
  kind: human
  source: 分片 vs07.notes.md 新用语、聚合稿 AGG-117 回补（聚合稿现列「指定法人归属」）
  params:
  - 归属对象类型（部门 / 员工）
  - 归属对象ID
  - 法人主体ID
  - 期间起
  - 期间止（可空）
  preconditions:
  - ref: INV-122
    text: 同一部门 / 员工的法人归属期间不重叠（原 INV-新-P5；EXCLUDE 约束），重叠则拒绝，人力改正后重提
  - ref: INV-59
    text: 读：法人主体须存在
  - ref: Q-09
    text: 三口径之一，与用人单位、扣缴义务人不一致只预警（B-15 PRC-145），本命令不拒绝
  authority:
    ref: raci:AGG-117/指定法人归属
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 归属请求ID（客户端预生成 UUIDv7）
  state_change: 创建 / 追加期间 → 已指定
  emits: 〔缺〕法人归属已变更
  used_by:
  - PRC-80 第 4 步
  orphan: false
- name: 更正法人归属
  aggregate: AGG-117
  entity: legal_entity_attribution_corrections
  kind: human
  source: 聚合稿 AGG-117（命令名以已建代码为准，交 one-glossary）
  params:
  - 归属对象类型
  - 归属对象ID
  - 原期间
  - 更正后结束日
  - 更正理由
  preconditions:
  - ref: INV-122
    text: 更正后期间仍不重叠；更正只追加，不改写历史
  - ref: 状态
    text: 仅已关闭期间的结束日可更正（词表：法人归属结束日已更正）
  authority:
    ref: raci:AGG-117/更正法人归属
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 更正序号（同对象同期间单调递增）
  state_change: 已指定 → 已指定（追加更正行）
  emits: （内部）
  used_by:
  - PRC-80 第 12 步
  orphan: false
- name: 结束法人归属
  aggregate: AGG-117
  entity: legal_entity_attributions
  kind: human
  name_status: 〔缺〕规划原缺，已建代码 EndLegalEntityAttribution；词表事件「法人归属已结束」（LegalEntityAttributionEnded），命令中文名交 one-glossary
  source: 已建代码；one-architecture command-mapping（2026-10-21）
  params:
  - 归属对象类型（部门 / 员工）
  - 归属对象ID
  - 结束日
  preconditions:
  - ref: INV-122
    text: 只关闭当前期间，结束日不早于开始日；历史只追加不改写
  - ref: 状态
    text: 该对象须有当前法人归属，否则拒绝
  - ref: 职责分离
    text: 操作人不得终止本人的法人归属（已建代码 OwnAttributionGuard）
  authority:
    ref: raci:AGG-117/结束法人归属
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 归属对象 + 乐观锁版本
  state_change: 已指定 → 已指定（关闭当前期间）
  emits: 法人归属已结束
  used_by:
  - PRC-80 第 13 步
  orphan: false
- name: 更正法人主体代码
  aggregate: AGG-60
  entity: legal_entities
  kind: human
  name_status: 〔缺〕规划原缺，已建代码 UpdateLegalEntity 的代码更正分支，命令中文名交 one-glossary
  source: 已建代码；one-architecture command-mapping（2026-10-21）
  params:
  - 法人主体ID
  - 更正后法人代码
  preconditions:
  - ref: INV-59
    text: 法人代码发号后不可改；仅该代码未用于发号时可更正，已发号则拒绝
  authority:
    ref: raci:AGG-60/更正法人主体代码
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID + 乐观锁版本
  state_change: 有效 → 有效（改代码，状态不变）
  emits: （内部）
  used_by:
  - PRC-80 第 14 步
  orphan: false
- name: 停用岗位
  aggregate: AGG-64
  entity: jobs
  kind: human
  source: 聚合稿 AGG 命令列（Q-08 后改称职位目录条目，命令名交 one-glossary）
  params:
  - 职位ID
  - 停用日
  preconditions:
  - ref: INV-63
    text: 职位仍被在职任职引用则拒绝，人力改正后重提
  - ref: 状态
    text: 职位为启用
  authority:
    ref: raci:AGG-64/停用岗位
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 职位ID（已停用再停用无操作）
  state_change: 启用 → 已停用
  emits: 岗位已停用
  used_by:
  - PRC-80 第 5 步
  orphan: false
- name: 新建岗位
  aggregate: AGG-64
  entity: jobs
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；Q-08 后为职位目录条目，命令名交 one-glossary
  source: jobs 数据模型（职位编码跨版本不变）、vs07.notes.md 结构问题 8
  params:
  - 职位编码
  - 名称
  - 职位族
  - 职级
  - 启用日
  preconditions:
  - ref: 数据模型
    text: 职位编码跨版本不变，同编码重复新建返回已有结果
  - ref: JOB_CATALOG P-0
    text: 职位与职级是两个独立维度；职级、职位族暂随本聚合不拆（S-10）
  authority:
    ref: raci:AGG-64/新建岗位
