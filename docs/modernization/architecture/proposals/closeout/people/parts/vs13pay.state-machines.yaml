# VS-13 薪酬类聚合状态机（收敛产物，提议稿）。范围同 vs13pay.commands.yaml。
# kind：forward 正向；reverse 逆向（驳回、撤回、更正）。from: null = 创建。守卫引用 INV / P / AR（聚合稿与 APPROVAL_RULES）、
#   R-VS13-a…j（vs13.notes.md 结构问题 14 的候选规则，交 one-rules）、U（vs13.notes.md 待用户定）。
# 状态取值以 data-model.people.yaml 的「状态」列为底，缺的状态在 added_states 列出（交 one-data 回填）。
# 版本型聚合（AGG-93、AGG-119）按版本行立机器，根表无生命周期；AGG-120 专项附加扣除声明由 S-32 自 AGG-93 拆出，独立一台。
# non_state_commands：只写属性、不改状态的命令；流程步骤对到这里即视为已覆盖。
# 自检（可达性、非终态到终态、流程步骤对转换）见 vs13pay.notes.md「收敛自检」。

bc: B-15
also_bc: {AGG-106: B-13}
machines:

- aggregate: AGG-106
  machine: performance_review
  entity: performance_reviews
  states: [草拟, 已提交, 已确认]
  initial: [草拟]
  terminal: [已确认]
  note: 已确认后不得改，更正另记（INV-114）；更正由 S-32 新增的登记绩效更正追加记录，不改状态
  transitions:
  - {from: null, to: 草拟, command: 编制绩效评估, guard: [INV-114], kind: forward}
  - {from: null, to: 草拟, command: 编制试用期绩效评估, guard: [INV-114], kind: forward}
  - {from: 草拟, to: 已提交, command: 提交绩效评估, guard: [U11：接收方未定], kind: forward}
  - {from: 已提交, to: 已确认, command: 确认绩效评估, guard: [INV-114], kind: forward, process_outcome: 已确认}
  - {from: 草拟, to: 已确认, command: 确认绩效评估, guard: [试用期评估无提交环节（PRC-85 步 2）〔推〕], kind: forward, process_outcome: 已确认}
  - {from: 已确认, to: 已确认, command: 登记绩效更正, guard: [INV-114：追加更正记录引用原评估，不改原评估], kind: reverse}

- aggregate: AGG-73
  machine: payroll_settlement
  entity: payroll_settlements
  states: [已计算, 审核中, 已批准, 已发放, 已过账, 已退回]
  initial: [已计算]
  terminal: [已过账]
  added_states: [已退回]
  non_state_commands:
  - {command: 提交过账候选, reason: 只写过账引用；批准时提交一次，「已过账」由事件置位（PRC-134）}
  note: |
    数据模型状态列为「草稿 → 已计算 → 审核中 → 已批准 → 已发放 → 已过账」。计算由系统自动，没有人工草稿，创建即为已计算，草稿不用；
    审批驳回与提交人撤回后回到第 1 步重算，补「已退回」。已发放与已过账先后不定：过账可先于发放（PRC-134 出口「待发放后再置位」），
    故已批准上有一条只置位的自环；发放时若过账事实已入账，由 PRC-127 回到 PRC-134 补置已过账。结局「待锁定」「已中止」不建结算，不是状态。
  transitions:
  - {from: null, to: 已计算, command: 计算月度薪酬, guard: [R-VS13-h, INV-70, 规则版本取得到（同 INV-116）], kind: forward}
  - {from: 已计算, to: 已计算, command: 计算月度薪酬, guard: [提交审核前发现输入有误重算], kind: forward}
  - {from: 已退回, to: 已计算, command: 计算月度薪酬, guard: [退回或撤回后重新计算], kind: forward}
  - {from: 已计算, to: 审核中, command: 提交薪酬审核, guard: [异常清单已生成, 制单人 ≠ 审批人（AR-11）], kind: forward}
  - {from: 审核中, to: 已批准, command: 批准月度薪酬, guard: [INV-70, AR-01, AR-02, AR-11], kind: forward, process_outcome: 已批准}
  - {from: 审核中, to: 已退回, command: 退回薪酬重算, guard: [], kind: reverse}
  - {from: 审核中, to: 已退回, command: 撤回薪酬审核, guard: [仅提交人], kind: reverse}
  - {from: 已批准, to: 已发放, command: 标记薪酬已发放, guard: [应付已结清且应付类型为应付薪酬, 全部薪酬结算行已实付], kind: forward, process_outcome: 已发放}
  - {from: 已批准, to: 已批准, command: 标记薪酬已过账, guard: [薪酬尚未发放：只置位过账事实已入账], kind: forward, process_outcome: 待发放后再置位}
  - {from: 已发放, to: 已过账, command: 标记薪酬已过账, guard: [来源单据类型为月度薪酬结算], kind: forward, process_outcome: 已过账}

- aggregate: AGG-73
  machine: payroll_line_payment
  entity: payroll_settlement_lines
  states: [待支付, 已实付, 支付失败]
  initial: [待支付]
  terminal: [已实付]
  added_states: [待支付, 已实付, 支付失败]
  note: |
    ARC-1022-COO-06（PAYROLL_LINE_PAYMENT.md（ARC-1022-COO-06））。子实体自有状态机（ADR-0075）：转换主体为薪酬结算行，aggregate_type_code 为 PayrollSettlementLine（薪酬结算行，one-glossary PR #572），
    序号取薪酬结算行 version；每条命令都推进根 version。计算建行即置待支付并写第一条转换（空 → 待支付，序号 1，决定 3）；
    批准前重算不删行，只改金额、version 照常推进（允许跳号，决定 5）；登记代发结果前置根为已批准。
    已实付后银行再退票不建模（接缝 J-4）。迁入：历史已发放结算每行写一条 空 → 已实付 初始转换。
  transitions:
  - {from: null, to: 待支付, command: 计算月度薪酬, guard: [建行时置待支付，version 1、序号 1（ADR-0075 决定 3）], kind: forward}
  - {from: 待支付, to: 待支付, command: 计算月度薪酬, guard: [批准前重算只改金额不改状态，version 照常推进、不写转换（决定 5）], kind: non_state}
  - {from: 待支付, to: 已实付, command: 登记代发结果, guard: [回单行人员与实发金额一致], kind: forward}
  - {from: 待支付, to: 支付失败, command: 登记代发结果, guard: [失败原因必填], kind: forward}
  - {from: 支付失败, to: 待支付, command: 发起薪酬补发, guard: [工资卡账户已更正, 补发金额等于原实发], kind: reverse}
  - {from: 支付失败, to: 支付失败, command: 登记薪酬补发顺延, guard: [原截止日落在长假内, 顺延日为长假前最后或长假后第一个工作日, 已通知员工], kind: non_state}

- aggregate: AGG-74
  machine: insurance_enrollment
  entity: insurance_enrollments
  states: [在缴, 已减员]
  initial: [在缴]
  terminal: [已减员]
  added_states: [在缴, 已减员]
  non_state_commands:
  - {command: 调整缴费基数, reason: 追加缴费基数新版本（同事务结束旧版本区间），状态仍为在缴；S-32 新增}
  note: 数据模型状态列只写「状态」未列取值，本稿取在缴与已减员。重新入职另建登记（同一人员同缴纳主体至多一个在缴）。缴费基数年度调整由 S-32 新增的调整缴费基数追加新版本
  transitions:
  - {from: null, to: 在缴, command: 参保增员, guard: [人员已入职, 同人同主体无在缴, 用工类型不是退休返聘或实习〔推〕], kind: forward}
  - {from: 在缴, to: 已减员, command: 参保减员, guard: [用工类型不是退休返聘或实习], kind: forward, process_outcome: 社保与公积金参保已减员}
  - {from: 在缴, to: 已减员, command: 变更参保缴纳主体, guard: [新缴纳主体与原主体不同, 同事务为新主体创建在缴登记], kind: forward}
  - {from: null, to: 在缴, command: 变更参保缴纳主体, guard: [新主体无在缴登记], kind: forward}

- aggregate: AGG-75
  machine: incentive_plan_version
  entity: incentive_plan_versions
  states: [草稿, 审批中, 已批准, 已生效, 已结束, 已撤回]
  initial: [草稿]
  terminal: [已结束, 已撤回]
  added_states: [草稿, 已批准, 已撤回]
  note: |
    数据模型状态列为「编制 → 审批 → 生效 → 结束」。草稿即编制页保存（编辑页行为，不是领域命令）；驳回回到草稿再编制（PRC-121 on_reject 回第 1 步）。
    已批准 = 审批通过但生效日期未到，到期由定时触发生效激励方案版本。已结束 = 同方案后继版本生效，旧版本区间同事务结束（D15），没有独立命令。
  transitions:
  - {from: 草稿, to: 审批中, command: 编制激励方案版本, guard: [R-VS13-f, D15], kind: forward}
  - {from: 审批中, to: 已生效, command: 生效激励方案版本, guard: [AR-01, AR-02, 生效日期已到], kind: forward, process_outcome: 已生效}
  - {from: 审批中, to: 已批准, command: 生效激励方案版本, guard: [AR-01, AR-02, 生效日期未到], kind: forward}
  - {from: 已批准, to: 已生效, command: 生效激励方案版本, guard: [生效日期到达（定时）], kind: forward, process_outcome: 已生效}
  - {from: 审批中, to: 草稿, command: 驳回激励方案版本, guard: [], kind: reverse}
  - {from: 审批中, to: 已撤回, command: 撤回激励方案版本, guard: [仅编制人], kind: reverse, process_outcome: 已撤回}
  - {from: 已生效, to: 已结束, command: 生效激励方案版本, guard: [后继版本生效，同事务结束旧区间（D15）], kind: forward}

- aggregate: AGG-76
  machine: bonus_determination
  entity: bonus_determinations
  states: [草拟, 已核定, 已驳回]
  initial: [草拟]
  terminal: [已核定, 已驳回]
  added_states: [已驳回]
  note: |
    数据模型状态列为「草拟 → 已核定 → 已发放」。驳回另补「已驳回」；重新草拟另建新核定单（同一人同期无草拟或已核定时）。
    「已发放」未建模：数据模型说明由 AGG-73 批准后事件置位，但聚合稿与流程都没有置位命令或事件策略，本稿不自造，见 notes 结构问题 2。
    该状态补上后，已核定不再是终态。
  transitions:
  - {from: null, to: 草拟, command: 草拟奖金核定, guard: [R-VS13-g, 评估类型为月度], kind: forward}
  - {from: 草拟, to: 已核定, command: 核定奖金, guard: [AR-01, AR-02, AR-11, R-VS13-g：核定人不改额], kind: forward, process_outcome: 已核定}
  - {from: 草拟, to: 已驳回, command: 驳回奖金核定, guard: [], kind: reverse, process_outcome: 已驳回}

- aggregate: AGG-93
  machine: payroll_profile_version
  entity: payroll_profile_versions
  states: [已生效, 已结束]
  initial: [已生效]
  terminal: [已结束]
  added_states: [已生效, 已结束]
  non_state_commands:
  - {command: 登记补休转加班工资, reason: 只追加补休转加班工资登记行（表 payroll_comp_leave_conversions，只追加），不改档案版本状态；S-41 新增}
  note: 根表 payroll_profiles 无生命周期；版本行按生效区间，调薪追加新版本并结束旧版本（D17）。未来生效日的版本也记为生效（区间决定何时适用）。离职后由 S-32 新增的终止薪酬档案结束最后一个生效版本；重新入职在原根下建立新版本
  transitions:
  - {from: null, to: 已生效, command: 建立薪酬档案, guard: [人员已入职, 一人一档案], kind: forward, process_outcome: 社保与公积金参保在缴，薪酬档案已建立}
  - {from: null, to: 已生效, command: 调整薪酬档案, guard: [R-VS13-j：引用调薪决定依据, U9], kind: forward, process_outcome: 薪酬档案已调整}
  - {from: 已生效, to: 已结束, command: 调整薪酬档案, guard: [同事务结束旧版本区间（D17）], kind: forward}
  - {from: 已生效, to: 已结束, command: 终止薪酬档案, guard: [Separated：区间止于离职日, 无版本时失败并告警], kind: forward, process_outcome: 薪酬档案已终止}

- aggregate: AGG-120
  machine: special_deduction_declaration
  entity: payroll_special_deduction_declarations
  states: [有效, 已取代]
  initial: [有效]
  terminal: [已取代]
  added_states: [有效, 已取代]
  note: 数据模型状态列只写「状态」未列取值，本稿取有效与已取代；年内修改追加新声明并取代旧声明
  transitions:
  - {from: null, to: 有效, command: 更新专项附加扣除, guard: [扣除额不超扣除标准版本], kind: forward, process_outcome: 专项附加扣除已更新}
  - {from: 有效, to: 已取代, command: 更新专项附加扣除, guard: [同事务取代旧声明], kind: forward}

- aggregate: AGG-95
  machine: tax_social_filing
  entity: tax_social_filings
  states: [待申报, 已申报, 已缴款, 已更正]
  initial: [待申报]
  terminal: [已缴款, 已更正]
  added_states: [已更正]
  non_state_commands:
  - {command: 提交过账候选, reason: 只写过账引用；缴款登记后提交，过账结果不回写申报状态}
  note: |
    数据模型状态列为「待申报 → 已申报 → 已缴款」，更正通过 corrects_filing_id 另起新行。原申报被更正后补「已更正」（终态），新行从已申报起，再走登记缴款。
    申报类别（个税扣缴、社保、公积金）各一条申报行，三类各自走本机器；「个税与社保公积金申报已提交」在三类均到已申报后发布。
  transitions:
  - {from: null, to: 待申报, command: 并入扣缴申报, guard: [股东为自然人, 所属期尚无个税申报], kind: forward}
  - {from: 待申报, to: 待申报, command: 并入扣缴申报, guard: [股东为自然人, 所属期个税申报为待申报], kind: forward}
  - {from: null, to: 待申报, command: 生成申报, guard: [R-VS13-i], kind: forward}
  - {from: 待申报, to: 待申报, command: 生成申报, guard: [R-VS13-i：重新汇总], kind: forward}
  - {from: 待申报, to: 已申报, command: 提交申报, guard: [已登记受理回执, P-39], kind: forward}
  - {from: 已申报, to: 已缴款, command: 登记缴款, guard: [职责分离：登记人 ≠ 缴款资金支出人], kind: forward, process_outcome: 已申报缴款}
  - {from: 已申报, to: 已更正, command: 更正申报, guard: [被退回或发现差错], kind: reverse}
  - {from: null, to: 已申报, command: 更正申报, guard: [引用原申报 corrects_filing_id，与原申报置已更正同事务], kind: reverse}

- aggregate: AGG-119
  machine: payroll_rule_version
  entity: payroll_rule_versions
  states: [草稿, 已生效, 已被取代]
  initial: [草稿]
  terminal: [已被取代]
  perpetual: true
  reason: "配置型版本聚合：发布即生效，被后继版本取代时旧版本置已被取代，无业务终结命令；更正出新版本，不修改、不冲销旧版本（D15）"
  added_states: [草稿, 已生效, 已被取代]
  note: 数据模型「版本状态」列未列取值，本稿取草稿、已生效、已被取代（S-43 取代原「已结束」，口径同 AGG-118、AGG-108）；草稿即编制页保存。每版本一个聚合，同类别同适用范围生效区间不重叠（INV-139）
  transitions:
  - {from: 草稿, to: 已生效, command: 发布薪酬规则版本, guard: [INV-139：区间不重叠, U7③：编制人 ≠ 确认人〔推〕], kind: forward, process_outcome: 薪酬规则版本已发布}
  - {from: 已生效, to: 已被取代, command: 发布薪酬规则版本, guard: [后继版本发布，同事务结束旧区间（INV-139）], kind: forward}
