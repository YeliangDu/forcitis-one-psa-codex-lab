# vs07：人员组 VS-07 任用员工、VS-13.6 离职结清的其余流程（PRC-83、84、137 已定稿，不在此）。
# 格式：closeout/CONVENTIONS.md 全量（where / evidence / approval.engine / segregation 等）。
# 已定口径：U-12 业务生效日；Q-03 入职后开通企业微信；Q-08 只要职位目录；Q-09 三口径；F-3 B-13 内批准为聚合单级命令；
#   S-14 platform.identity 编排企业微信开通与停用；S-20 三口径预警在 B-15（PRC-145）；T-1–T-5（样板答复）；RULE-363 离职即吊销。
# 〔缺〕= 聚合稿 / 平台没有的命令或事件，见 vs07.notes.md「新用语」。
# 扩展（已记入 notes「格式问题」）：decision 项可带 outcome（goto end 时的结局词）；步骤可带 branch 标签表示并列入口 / 备选路径（v1 已有）。

processes:

  # ───────────── VS-07 任用员工 ─────────────

  - id: PRC-80
    name: 维护法人、组织与岗位
    trigger: {type: human, desc: 人力调整组织、岗位或登记法人主体}
    triggers:
      - {type: human, name: "人力登记法人主体或指定法人归属"}
      - {type: human, name: "人力调整组织单元"}
      - {type: human, name: "人力停用职位"}
    stages: [VS-07.1, VS-07.3]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "法人、组织单元、职位目录、法人归属全量迁入（U-3、U-4），迁入不触发 P-31 待复核（ADR-0036 M7）；无在途实例"
    scope: "人力按法人与组织数据范围维护"
    outcomes: [已维护, 已拒绝]
    scenarios: [PRC-80-S01, PRC-80-S02, PRC-80-S03]
    roles:
      - {id: SH-E6, as: initiator}      # 人力
      - {id: SH-M1, as: informed}       # 区域负责人：数据范围待复核时被通知（P-31）；区域负责人是否归 SH-M1 见 notes 格式问题
    steps:
      - actor: SH-E6
        where: in_system
        branch: 登记法人
        command: 登记法人主体
        aggregate: AGG-60
        desc: 法人代码发号后不可改（INV-59）；五家法人由初始化录入，之后新增走本步（DATA_MODEL B-13）
        permission: 法人.登记
        page: 法人登记页
        audit: true
        decision:
          - {when: otherwise, goto: end, outcome: 已维护}
      - actor: SH-E6
        where: in_system
        branch: 调整组织
        command: 调整组织单元
        aggregate: AGG-61
        emits: [组织单元已调整]
        desc: 按人事业务生效日生效（U-12）；B-13 自为记录系统，不再有 A8 同步来源（U-1、U-7）
        permission: 组织单元.调整
        page: 组织单元维护页
        audit: true
        decision:
          - {when: 撤销的组织单元下仍有在职任职, goto: end, rule: INV-60, outcome: 已拒绝}   # 拒绝并提示先调岗（PRC-136）
          - {when: otherwise, goto: 5}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 组织单元已调整}   # P-31；聚合稿 AGG-61 订阅方已写
      - actor: SH-E6
        where: in_system
        branch: 指定法人归属
        command: 〔缺〕指定法人归属        # 已建代码有对应命令，聚合稿未列（AGG-117 回补）
        aggregate: AGG-117
        emits: [〔缺〕法人归属已变更]
        desc: 部门默认法人或员工单独指定法人，按期间；同一对象期间不重叠（INV-新-P5）。三口径之一，不一致由 B-15 预警（PRC-145），本步不拒绝
        permission: 法人归属.指定
        page: 法人归属维护页
        audit: true
        added_in: closeout
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕法人归属已变更}   # 数据范围
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕法人归属已变更}               # PRC-145 订阅
        decision:
          - {when: otherwise, goto: end, outcome: 已维护}
      - actor: SH-E6
        where: in_system
        branch: 停用职位
        command: 停用岗位                    # Q-08 后为职位目录条目，改称待 one-glossary（notes 新用语）
        aggregate: AGG-64
        emits: [岗位已停用]
        desc: 职位仍被在职任职引用则拒绝（INV-63）
        permission: 职位目录.停用
        page: 职位目录维护页
        audit: true
        decision:
          - {when: 职位仍被在职任职引用, goto: end, rule: INV-63, outcome: 已拒绝}
          - {when: otherwise, goto: end, outcome: 已维护}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-61, event: 组织单元已调整}]
        desc: P-31；对应词表「待调整权限」（ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 已维护
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 组织单元已调整}
    notes: "步 1–4 为并列入口（人力每次择一执行）；步 5 是步 2 的事件反应。职位目录的新建与修改命令聚合稿未列（notes 结构问题）。"

  - id: PRC-81
    name: 提出并批准招聘需求
    trigger: {type: human, desc: 用人经理提出}
    triggers:
      - {type: human, name: "用人经理提出招聘需求"}
    stages: [VS-07.1]
    owner_bc: B-13
    human_orchestration: true
    human_note: 提交、批准或驳回，批准为本聚合命令
    type: business
    migration: "招聘需求全量迁入（来源 A8 用人申请表单，待取证）；在途（已提交 / 已批准未关闭）按当前状态迁入，已关闭只迁结局与审计；迁入不发事件"
    scope: "用人经理看本部门；人力看全部"
    segregation:
      - {roles: [SH-E1, SH-E6], rule: "提出人与批准人不得为同一人"}
    outcomes: [已批准, 已关闭]
    scenarios: [PRC-81-S01, PRC-81-S02]
    roles:
      - {id: SH-E1, as: initiator}
      - {id: SH-E6, as: approver}       # 人力；批准人待用户定
      - {id: SH-M1, as: informed}       # VS-07.1 participants 含 SH-M1，本流程无其动作，仅知会
    steps:
      - actor: SH-E1
        where: in_system
        read: true
        reads: [AGG-64, AGG-61]
        desc: 读职位目录与组织单元；Q-08 无编制，超编检查 P-33 已关闭，不再做
        permission: 招聘需求.提交
        page: 招聘需求编辑页
      - actor: SH-E1
        where: in_system
        command: 提交招聘需求
        aggregate: AGG-65
        desc: 职位、组织单元、人数、期望到岗日；〔缺〕与候选人关联命令未见（PG-08）
        permission: 招聘需求.提交
        page: 招聘需求编辑页
        notify: [{to: SH-E6, how: 企业微信待办}]
      - actor: SH-E6
        where: in_system
        command: 批准招聘需求
        aggregate: AGG-65
        emits: [招聘需求已批准]
        approval:
          engine: aggregate             # B-13 聚合内单级批准，不经 platform.approval（F-3；§4.3.4 第 4 条）
          doc_type: 招聘需求批准
          approver: SH-E6
          multi_level: false
          on_reject: 4
        permission: 招聘需求.批准
        page: 招聘需求审批页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 批准, goto: end, outcome: 已批准}
          - {when: otherwise, goto: 4}
      - actor: SH-E6
        where: in_system
        branch: 驳回或关闭
        command: 关闭招聘需求
        aggregate: AGG-65
        emits: [招聘需求已关闭]
        desc: v1 以关闭代驳回，状态「已驳回」无独立命令；已批准后因取消或录满关闭也走本命令（录满无触发，PG-08）
        permission: 招聘需求.关闭
        page: 招聘需求审批页
        outcome: 已关闭
    notes: 批准不经 platform.approval（会成环）；需要多级审批时移出 B-13（聚合稿 §7 第 12 条），见 notes 待用户定。调入等非招聘入职跳过本流程。

  - id: PRC-82
    name: 登记候选人并作出录用决定
    trigger: {type: human, desc: 求职者应聘或用人经理推荐}
    triggers:
      - {type: human, name: "求职者应聘或用人经理推荐，人力登记候选人"}
    stages: [VS-07.2]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "候选人面试与录用记录全量迁入并加个人信息保护（用户 T-5，ADR-0043）：分级与访问限招聘相关角色；在途候选人按当前阶段迁入；迁入不发事件"
    scope: "人力看全部候选人；用人经理只看本人所提招聘需求下的候选人（访问限制按 ADR-0043）"
    outcomes: [录用决定已作出, 未录用, 候选人已放弃]
    scenarios: [PRC-82-S01, PRC-82-S02]
    roles:
      - {id: SH-H1, as: external}
      - {id: SH-E6, as: performer}      # 人力
      - {id: SH-E1, as: performer}      # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记候选人
        aggregate: AGG-62
        emits: [人员已登记]
        desc: 候选人并入人员的候选阶段（OBJ-59）；含个人信息，ADR-0043
        permission: 候选人.登记
        page: 候选人登记页
        audit: true
      - actor: SH-E1
        where: in_system
        command: 记录面试
        aggregate: AGG-62
        desc: 面试在线下或会议系统进行，本系统登记轮次、评价与结论
        permission: 面试.记录
        page: 面试记录页
        audit: true
        decision:
          - {when: 面试通过并决定录用, goto: 3}
          - {when: otherwise, goto: 5}
      - actor: SH-E1
        where: in_system
        command: 作出录用决定
        aggregate: AGG-62
        desc: 录用结论、拟入职日、拟任职职位与职级；录用是否需上级批准聚合稿无命令（notes 待用户定）。〔聚合稿将「录用决定已作出」挂在本命令；候选人答复在其后，见 notes 结构问题〕
        permission: 录用决定.作出
        page: 录用决定页
        audit: true
      - actor: SH-E6
        where: offline
        evidence: [候选人确认入职日的回执（邮件或签回的录用通知）, 确认日, 确认的入职日]
        command: 〔缺〕登记候选人答复
        aggregate: AGG-62
        emits: [录用决定已作出]
        desc: 录用通知书线下或邮件发出，候选人接受或放弃；接受则本步发「录用决定已作出」，触发 PRC-83（候选人确认入职日后办理入职）
        permission: 候选人.登记答复
        page: 录用决定页
        audit: true
        added_in: closeout
        decision:
          - {when: 候选人确认入职日期, goto: PRC-83, outcome: 录用决定已作出}
          - {when: 候选人放弃或录用决定撤销, goto: end, outcome: 候选人已放弃}   # 放弃命令缺：PG-09
      - actor: SH-E1
        where: in_system
        branch: 未录用
        command: 标记未录用
        aggregate: AGG-62
        desc: 通知候选人线下（邮件或电话），本系统不记通知
        permission: 候选人.标记未录用
        page: 面试记录页
        audit: true
        outcome: 未录用
    notes: 候选人个人信息按 ADR-0043 分级，数据组表级处理；保留期待 one-data 按 D12 登记。

  - id: PRC-85
    name: 试用期评估与转正
    trigger: {type: time, desc: 试用期届满前（P-46）}
    triggers:
      - {type: time, name: "试用期届满前 N 日生成评估待办（N 待用户定）"}
    stages: [VS-07.3, VS-13.2]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "试用期评估与转正申请全量迁入（OA_PROCESS_INVENTORY 第 63、75 行：A8 试用期员工转正申请在途 3、转正申请表已停用在途 7）；在途按当前状态迁入；迁入不触发转正事件与薪酬联动（ADR-0036 M7）"
    scope: "用人经理看所辖员工；人力看全部；评估内容限评估人、被评人与人力（ADR-0043）"
    outcomes: [已转正, 转入离职办理]
    scenarios: [PRC-85-S01, PRC-85-S02]
    roles:
      - {id: SH-E1, as: performer}
      - {id: SH-E6, as: performer}      # 人力
      - {id: SH-E3, as: informed}       # 被评员工收到转正结果通知
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制试用期绩效评估
        aggregate: AGG-106
        desc: 由到期定时提醒触发（定时命令约定缺：PG-10）；评估人是用人经理
        permission: 绩效评估.编制
        page: 试用期评估编辑页
        notify: [{to: SH-E1, how: 企业微信待办}]
        timeout: {after: "P7D", escalate_to: SH-E6, interrupting: false}   # 提醒期限待用户定（notes 待用户定）
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        desc: INV-114：同期同类型只一份，确认后不可改；事件须带评估类型，供 B-15 区分月度 / 试用期
        permission: 绩效评估.确认
        page: 试用期评估编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}   # 奖金核定依据，聚合稿已登记订阅方
      - actor: SH-E6
        where: in_system
        command: 办理转正
        aggregate: AGG-62
        emits: [〔缺〕转正已办理]
        desc: 转正前读评估（P-46）；评估结论是转正输入，不是拒绝条件。转正日为业务生效日（U-12），可提前登记、到日生效；用工状态由「试用期」转「正式」
        permission: 转正.办理
        page: 转正办理页
        audit: true
        decision:
          - {when: 公司决定不予转正, goto: PRC-128, outcome: 转入离职办理}   # 不予转正的依据与批准待用户定
          - {when: otherwise, goto: end, outcome: 已转正}
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕转正已办理}   # B-15 据此复核转正后薪酬（PG-10）；聚合稿现只发内部事件
    notes: "转正后薪酬是否调整由 B-15 自己的调薪流程处理，本流程只发事件（PG-10）。"

  # ───────────── VS-13.6 离职结清（入转调离成套）─────────────

  - id: PRC-128
    name: 办理离职
    trigger: {type: human, desc: 员工提出离职或公司决定终止}
    triggers:
      - {type: human, name: "员工提出离职"}
      - {type: human, name: "公司决定终止"}
    stages: [VS-13.6]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "离职申请全量迁入（A8 员工离职申请，OA_PROCESS_INVENTORY 第 62 行，在途 22）；在途按当前状态迁入，已登记未到离职日的须重新排定「离职生效」定时；迁入不触发 Separated、账号吊销与参保减员（ADR-0036 M7）；历史离职人员账号状态按迁入对账（C-7）"
    scope: "员工看本人申请；用人经理看所辖员工；人力看全部（原因类别含健康时限人力，SPI 交 U-11）"
    segregation:
      - {roles: [SH-E6], rule: "公司单方终止：发起人与批准人不得为同一人"}
    outcomes: [离职已生效, 申请已驳回, 离职登记已撤销]
    scenarios: [PRC-128-S01, PRC-128-S02, PRC-128-S03, PRC-128-S04]
    roles:
      - {id: SH-E3, as: initiator}      # 申请人是任一类员工；stakeholders 无泛员工编号，暂取 SH-E3（格式问题）
      - {id: SH-E6, as: approver}       # 人力负责人
      - {id: SH-E6, as: performer}      # 人力
      - {id: SH-E1, as: informed}       # 用人经理
      - {id: SH-E6, as: informed}       # 信息（IT）：离职提醒，资产归还见 B-31
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请离职
        aggregate: AGG-62
        desc: 期望离职日（人事业务生效日，U-12）、原因类别；也可线下提出由人力代录入（本系统登记提出日与来源）
        permission: 离职.申请
        page: 离职申请页
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 3}
      - actor: SH-E6
        where: in_system
        branch: 公司单方终止
        command: 〔缺〕发起公司终止
        aggregate: AGG-62
        desc: 公司决定终止劳动关系（含试用期不予转正转入，PRC-85）；依据与原因类别必填
        permission: 离职.发起终止
        page: 离职申请页
        audit: true
        added_in: closeout
      - actor: SH-E6
        where: in_system
        command: 批准离职申请
        aggregate: AGG-62
        approval:
          engine: aggregate             # B-13 聚合内单级批准（F-3），不经 platform.approval
          doc_type: 离职申请批准
          approver: SH-E6
          multi_level: false
          on_reject: 4
        permission: 离职.批准
        page: 离职审批页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 批准, goto: 5}          # 批准后状态「待离职」，即 VS-13.6 进入条件
          - {when: otherwise, goto: 4}
      - actor: SH-E6
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回离职申请
        aggregate: AGG-62
        desc: 驳回或员工撤回；聚合稿缺命令（PG-09）
        permission: 离职.驳回
        page: 离职审批页
        audit: true
        added_in: closeout
        outcome: 申请已驳回
      - actor: SH-E6
        where: offline
        evidence: [离职协议或解除 / 终止通知的扫描件, 签署或送达日, 离职日]
        command: 〔缺〕登记劳动合同终止依据
        aggregate: AGG-67
        desc: 协商一致、员工辞职或公司解除，均线下签署或送达；本系统登记依据文件与日期。离职证明另行线下出具，不作门（VS-13.6 备注）
        permission: 劳动合同.登记终止依据
        page: 离职办理页
        audit: true
        added_in: closeout
      - actor: SH-E6
        where: in_system
        command: 办理离职
        aggregate: AGG-62
        desc: 登记离职日（人事业务生效日，最后在职日，U-12）与原因类别；可提前登记、到日生效。离职日不晚于登记日（含补登、即时终止）则立即进入步 7。聚合稿原为「→ Separated」，现改为登记，Separated 由步 7 到日发出，不得在登记时提前发（PG-12）
        permission: 离职.办理
        page: 离职办理页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 离职日前员工撤回或公司撤销, goto: 10}
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 离职日结束时（时点待用户定）；离职日不晚于登记日则登记时立即执行
        command: 〔缺〕离职生效
        aggregate: AGG-62
        emits: [Separated]
        desc: 人员状态由「待离职」转「已离职」，生效日为登记的离职日。Separated 在先于步 8、9 发出：吊销会话与访问是安全关键（RULE-363），不得因任职或合同终止失败而推迟
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: Separated}   # PRC-129 吊销会话、PRC-138 停用企业微信与解绑；§1.4 G-2
          - {mode: event, direction: out, bc: B-15, name: Separated}               # PRC-130 参保减员，并作为最后一期薪酬结算的在职终点
          - {mode: event, direction: out, bc: B-31, name: Separated}               # 生成 IT 资产归还待办（b31 PRC-143；聚合稿回补 §1），B-13 不依赖 B-31
          - {mode: event, direction: out, bc: B-27, name: Separated}               # 生成离职当月考勤待代确认；B-27 → B-13 现只有 api 边（接缝问题）
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职区间止于离职日。因 Separated 已先发出，platform.identity 对已离职人员的「任职已变更」忽略（PG-12）
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 终止日 = 离职日，依据文件见步 5。失败告警人力并重试，不回滚 Separated
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: end, outcome: 离职已生效}
      - actor: SH-E6
        where: in_system
        branch: 撤销离职登记
        command: 〔缺〕撤销离职登记
        aggregate: AGG-62
        emits: [〔缺〕离职登记已撤销]
        desc: 离职日前撤销，状态回「在职」，已生成的归还待办与考勤待代确认随事件取消；离职日后不可撤销（已吊销访问，需走再入职）
        permission: 离职.撤销登记
        page: 离职办理页
        audit: true
        added_in: closeout
        outcome: 离职登记已撤销
        cross_bc:
          - {mode: event, direction: out, bc: B-31, name: 〔缺〕离职登记已撤销}
          - {mode: event, direction: out, bc: B-27, name: 〔缺〕离职登记已撤销}
    notes: >
      账号侧见 PRC-129（吊销会话）、PRC-138（角色授予、企业微信停用、解绑）；参保减员见 PRC-130；最后一期薪酬随月度结算发放（B-15）。
      工作交接清单是单据不作门（VS-13.6 备注，Q-D 第 3 项不做）；IT 资产归还待办由 B-31 订阅 Separated 生成，B-13 不读 B-31。
      离职当月考勤确认由谁代确认见 notes 待用户定。

  - id: PRC-136
    name: 调岗（任职变更，按人事业务生效日，触发数据范围复核）
    trigger: {type: human, desc: 人力按人事业务生效日登记调岗、职级调整或汇报线变更}
    triggers:
      - {type: human, name: "人力登记调岗、职级调整或汇报线变更"}
    stages: [VS-07.3]
    owner_bc: B-13
    human_orchestration: true
    human_note: 调岗申请需批准（推荐，待用户定），批准为本聚合命令（F-3）
    type: business
    new: true
    basis: A8 与老系统的人事异动只作证据（OA_PROCESS_INVENTORY 第 65 行「人事异动表」）；U-12；INV-62；词表「待调整权限」（ADR-0032 第 4 项）；Q-09
    migration: "历史人事异动回放为任职版本（A8 人事异动，按人事业务生效日），在途按当前状态迁入（OA_PROCESS_INVENTORY 第 65 行在途 1）；迁入不触发本流程与数据范围复核（ADR-0036 M7）"
    scope: "人力按法人与组织数据范围；用人经理看所辖员工的异动"
    segregation:
      - {roles: [SH-E6], rule: "调岗申请的提交人与批准人不得为同一人"}
    outcomes: [调岗已生效, 已驳回, 已拒绝]
    scenarios: [PRC-136-S01, PRC-136-S02, PRC-136-S03, PRC-136-S04]
    roles:
      - {id: SH-E6, as: initiator}      # 人力提交（发起人待用户定）
      - {id: SH-E6, as: approver}       # 人力负责人，聚合内单级
      - {id: SH-E6, as: performer}      # 信息（IT）、薪酬与社保经办：步 10–13
      - {id: SH-E1, as: informed}       # 原、新用人经理
      - {id: SH-E3, as: informed}       # 被调动员工
      - {id: SH-M1, as: informed}       # 区域负责人：数据范围待复核时被通知
    steps:
      - actor: SH-E6
        where: in_system
        command: 〔缺〕提交调岗申请
        aggregate: AGG-63
        desc: 员工、新组织单元、新职位与职级、汇报线、主 / 兼、业务生效日（U-12，可提前登记、补登落回真实日期）。读职位目录与组织单元，须未停用；系统比对新组织单元默认法人与当前用人单位，标记是否跨法人
        permission: 调岗.提交
        page: 调岗申请页
        audit: true
        added_in: closeout
        decision:
          - {when: 新职位已停用或新组织单元已撤销, goto: end, rule: INV-63, outcome: 已拒绝}   # INV-63 / INV-60 相关
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: in_system
        command: 〔缺〕批准调岗申请
        aggregate: AGG-63
        approval:
          engine: aggregate             # 同 F-3：B-13 内单级批准；新旧部门会签若需要，移出 B-13（notes 待用户定）
          doc_type: 调岗批准
          approver: SH-E6
          multi_level: false
          on_reject: 3
        permission: 调岗.批准
        page: 调岗审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: 批准且跨法人调动, goto: 4}
          - {when: 批准, goto: 7}
          - {when: otherwise, goto: 3}
      - actor: SH-E6
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回调岗申请
        aggregate: AGG-63
        permission: 调岗.驳回
        page: 调岗审批页
        audit: true
        added_in: closeout
        outcome: 已驳回
      - actor: SH-E6
        where: in_system
        branch: 跨法人调动
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位变更：与新法人另订劳动合同（或三方变更协议），用人单位为新法人，工龄连续计算；试用期不得重新约定（INV-14 同检）。劳动合同主体变更必须在调岗生效日前完成
        legal_entity: 新用人单位
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        decision:
          - {when: 试用期超过法定上限, goto: 4, rule: INV-14}
          - {when: otherwise, goto: 5}
      - actor: SH-E6
        where: in_system
        branch: 跨法人调动
        command: 批准劳动合同
        aggregate: AGG-67
        approval:
          engine: aggregate
          doc_type: 劳动合同批准
          approver: SH-E6
          multi_level: false
          on_reject: 4
        permission: 劳动合同.批准
        page: 劳动合同审批页
        audit: true
        decision:
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 4}
      - actor: SH-E6
        where: offline
        branch: 跨法人调动
        evidence: [三方变更协议或新劳动合同的扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 员工、原法人、新法人线下签署；签订发「劳动合同已签订」，B-15 的 PRC-145 据此比对三口径（不一致只预警）
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 劳动合同已签订}   # PRC-145 订阅
      - actor: system
        where: automatic
        command: 〔缺〕变更任职
        aggregate: AGG-63
        desc: 原子命令：旧任职区间止于业务生效日，新任职区间始于同日（PG-05）；主任职区间不得重叠（INV-62），兼任不受此限。写入未来版本，此时不对外发事件
        decision:
          - {when: 与该人员其他主任职区间冲突, goto: 1, rule: INV-62}   # 退回改正后重提
          - {when: otherwise, goto: 8}
      - actor: system
        where: automatic
        on_time: 业务生效日到达（补登 / 当日登记则立即执行）
        command: 〔缺〕任职变更生效
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职已变更须在业务生效日发出（U-12），平台与薪酬才能按真实日期重算
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 订阅方聚合稿现为「仅分析」，需补（PG-02、06）
          - {mode: event, direction: out, bc: B-15, name: 任职已变更}                  # B-15 → B-13 边已有；订阅方聚合稿未登记（PG-07）
        decision:
          - {when: 跨法人调动, goto: 9}
          - {when: otherwise, goto: 10}
      - actor: system
        where: automatic
        branch: 跨法人调动
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 原劳动合同终止于业务生效日，原因为调动（与步 4–6 的新合同衔接，工龄连续）
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕重算默认角色与数据范围
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 按新任职重算默认角色与数据范围（具体规则随 ADR-0029 重起草，此处只定触发点）；人工单独授予的角色与范围不自动收回，交步 11
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 沿用 PRC-80 步 5 命令；P-31 现只由组织单元已调整触发，任职已变更触发需新增策略，生成「待调整权限」条目（敏感角色持有人送组织数据管理员与安全审计员，含自定义部门或列出法人的授权送新部门负责人，ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        decision:
          - {when: 调岗引起薪酬变化或跨法人调动, goto: 12}
          - {when: otherwise, goto: end, outcome: 调岗已生效}
      - actor: SH-E6
        where: in_system
        bc: B-15
        branch: 调岗引起薪酬变化或跨法人
        command: 调整薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪资结构、标准变化；跨法人时个税扣缴义务人随用人单位变更（三口径之一，不一致由 PRC-145 预警）。薪酬属敏感个人信息，ADR-0043 最高访问级别
        permission: 薪酬档案.调整
        page: 薪酬档案维护页
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
        decision:
          - {when: 跨法人调动, goto: 13}
          - {when: otherwise, goto: end, outcome: 调岗已生效}
      - actor: SH-E6
        where: offline
        bc: B-15
        branch: 跨法人调动
        evidence: [社保增减员回执, 公积金缴存单位变更回执, 办理日]
        command: 〔缺〕变更参保缴纳主体
        aggregate: AGG-74
        emits: [参保已减员, 参保已增员]
        desc: 原法人减员、新法人增员（缴纳主体变更），人社与公积金网办办理后回填；与入职增员同属 P-32 范畴
        permission: 参保.变更缴纳主体
        page: 参保登记页
        audit: true
        added_in: closeout
        legal_entity: 新用人单位
        outcome: 调岗已生效
    notes: >
      晋升只改职级不换职位（JOB_CATALOG_DRAFT §1 P-1），同走本流程。跨法人调动是劳动合同主体变更，牵涉三口径同时改变（用人单位、数据范围法人、扣缴义务人），
      步 4–6、9、12–13 是该分支；PRC-145 只预警不拒绝。调岗对请假审批人与在途单据是否联动待 B-27 组确认。
      步 10–13 是对「任职已变更」的事件反应，与后续步骤并行，此处按顺序列出。

  - id: PRC-138
    name: 离职停用企业微信账号并解绑
    type: business
    new: true
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 与 PRC-129（吊销会话）互补；离职生效即时，不等企业微信账号停用
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    owner_bc: platform.identity   # S-14（one-architecture 同意 J-1）
    human_orchestration: false
    basis: intent 2026-10-16-134134 Q-03；规则卡 RULE-363；ADR-0027 第 1 项第 6 点、第 7 点；IDENTITY_LIFECYCLE.md 对 C1 设计的含义第 3 条（在职判断以人事离职为准，不以企业微信账号是否存在为准）；S-14
    migration: "不适用（迁入不发事件）；历史离职人员的企业微信状态在迁入对账中核对（C-7）"
    scope: "信息部门与安全审计员"
    outcomes: [已停用并解绑]
    scenarios: [PRC-138-S01, PRC-138-S02, PRC-138-S03]
    roles:
      - {id: SH-E6, as: performer}      # 信息（IT）
      - {id: SH-E6, as: informed}       # 人力
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 吊销会话
        calls: PRC-129
        desc: 即时，先于一切企业微信动作
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用登录身份
        desc: 登录以人员在职为准，离职后即使企业微信账号未停用也拒绝登录（含放行起点之后的再登录）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕删除全部角色授予
        desc: ADR-0027 第 1 项第 6 点：逐条写审计。涉及超管（super_admin）或安全审计员持有人，或会使可用超管少于 2 名时，不自动收回，转步 4 待放行（第 7 点，防止全员锁死）；会话吊销与登录身份停用不受此限
        audit: true
        decision:
          - {when: 离职者持有超管或安全审计员角色, goto: 4, rule: "ADR-0027 第 7 点"}
          - {when: otherwise, goto: 5}
      - actor: platform
        where: in_system
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕确认放行离职处置
        desc: 另一名超管持有人在系统内人工确认后放行，写审计（ADR-0027 第 7 点，Q-3「暂停，转人工确认」）；放行后继续步 5
        permission: 身份.放行离职处置
        page: 待放行离职处置页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 5}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用应急账号
        desc: ADR-0027 第 1 项第 6 点：离职者名下的应急账号置为停用；无则跳过（不是错误）
        audit: true
      - actor: system
        where: external:企业微信
        evidence: [企业微信返回的成员停用结果, 停用时间]
        bc: platform.identity
        command: 〔缺〕停用企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动停用成员；与 PRC-137 开通对称（T-1）。以 api 同步调用，不经 B-13，方向 platform.identity → platform.integration 已有边，PG-04 不再适用于停用
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕停用企业微信成员}
        decision:
          - {when: 企业微信返回失败（成员已不存在视为已停用）, goto: 8}
          - {when: otherwise, goto: 7}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕解绑外部身份
        desc: 解除企业微信 userid 与人员的绑定，保留绑定历史；userid 不再分配给他人（取工号时与再入职的关系见 notes 结构问题）
        audit: true
        metric_event: true
        decision:
          - {when: otherwise, goto: end, outcome: 已停用并解绑}
      - actor: system
        where: automatic
        on_time: 步 6 失败，或离职生效后规定时限内企业微信成员仍未停用
        desc: 告警信息部门与人力，不静默；老系统取证 15% 离职者离职后仍成功登录（IDENTITY_LIFECYCLE），时限待用户定，推荐与开通失败相同的 1 个工作日（T-2）
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}
      - actor: SH-E6
        where: external:企业微信
        evidence: [企业微信管理端的停用记录, 停用时间, 经办人]
        command: 〔缺〕登记企业微信成员手工停用
        bc: platform.identity
        desc: 信息部门在企业微信管理后台手工停用，完成后在本系统登记并重试步 6（已停用视为成功）；这是系统外动作，本系统只登记结果
        permission: 身份.登记企业微信手工处理
        page: 外部身份处理页
        audit: true
        decision:
          - {when: 已处理并重试, goto: 6}
          - {when: otherwise, goto: end, outcome: 已停用并解绑}
    notes: 参保减员由 PRC-130 另行处理；PRC-137 / 138 成对，开通与停用均由 platform.identity 编排。

event_policies:

  - id: PRC-129
    name: 离职后吊销会话
    type: event_policy
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    owner_bc: platform.identity
    migration: "不适用（迁入不发事件，ADR-0036 M7；历史离职人员的会话与授予按迁入对账）"
    outcomes: [会话已吊销]
    scenarios: [PRC-129-S01]
    roles:
      - {id: SH-E6, as: informed}       # 信息（IT）：吊销失败告警
    step:
      actor: platform
      where: automatic
      platform_task: true
      service: platform.identity
      command: 吊销会话
      desc: 聚合稿 §1.4 G-2 强制事件反应，RULE-363 已定，安全关键：收到 Separated 即吊销该人员的全部会话与每请求复核，不依赖企业微信账号状态。失败重试并告警信息部门，不静默（CLAUDE.md 第 6 条）；其余离职处置（角色授予、应急账号、登录身份）见 PRC-138
      audit: true
      outcome: 会话已吊销
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: Separated}
    notes: 平台已建模块，不是企业聚合；与 PRC-138 配合。

  - id: PRC-130
    name: 离职后参保减员
    type: event_policy
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 人力收到离职事件后 15 日内办理转移手续（P-32）
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    owner_bc: B-15
    migration: "不适用（迁入不发事件；历史参保减员记录随 AGG-74 全量迁入）"
    outcomes: [参保已减员, 无需减员]
    scenarios: [PRC-130-S01, PRC-130-S02]
    roles:
      - {id: SH-E6, as: performer}      # 人力（薪酬与社保）
    step:
      actor: SH-E6
      where: offline
      evidence: [社保减员回执, 公积金封存或转移回执, 办理日]
      command: 参保减员
      aggregate: AGG-74
      emits: [参保已减员]
      desc: 社保减员与公积金封存 / 转移在人社与公积金网办办理，没有面向本系统的接口，办理后回填；离职日起 15 日内（P-32）。退休返聘与实习不参保，无需减员（用户已定 T-4）
      permission: 参保.减员
      page: 参保登记页
      audit: true
      notify: [{to: SH-E6, how: 企业微信待办}]
      timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # P-32 提醒，逾期升级给职能高管〔推〕
      decision:
        - {when: 用工类型为退休返聘或实习, goto: end, outcome: 无需减员}
        - {when: otherwise, goto: end, outcome: 参保已减员}
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: Separated}
        - {mode: api, direction: out, bc: B-13, name: 读取用工类型}
    notes: B-15 → B-13（api、事件）已有边。工资结清与离职当月社保费用口径属 B-15 薪酬结算，不在本策略。

single_aggregate:

  - id: PRC-79
    name: 登记继续教育并延续注册执业证书
    type: single_aggregate
    aggregate: AGG-66
    owner_bc: B-13
    stages: [VS-06.2]
    desc: 注册期内累计学时与到期临近（定时）
    migration: "注册执业证书与继续教育学时全量迁入（来源待取证，若老系统与 A8 无记录则为空集）；迁入不发「执业证书已到期」"
    scope: "注册执业人员看本人；人力看全部；INV-47 在交付物处只读证书有效性"
    triggers:
      - {type: human, name: "注册执业人员登记继续教育学时"}
      - {type: human, name: "人力延续注册执业证书"}
      - {type: time, name: "证书有效期届满"}
    outcomes: [学时已登记, 证书已延续, 执业证书已到期]
    scenarios: [PRC-79-S01, PRC-79-S02]
    roles:
      - {id: SH-E7, as: initiator}      # 注册执业人员
      - {id: SH-E6, as: performer}      # 人力
      - {id: SH-R2, as: external}       # 注册执业管理机构：延续注册的受理方
    commands:
      - actor: SH-E7
        where: in_system
        command: 登记继续教育学时
        emits: []
        desc: 按注册期累计，必修与选修分开；学时证明作附件
        permission: 执业证书.登记学时
        page: 继续教育学时登记页
        audit: true
        outcome: 学时已登记
      - actor: SH-E6
        where: offline
        evidence: [延续注册的回执或新证书扫描件, 新有效期止]
        command: 延续注册执业证书
        emits: []
        desc: 延续注册在注册执业管理机构办理，没有面向本系统的接口；办理后登记结果。注册期内累计学时达标是延续注册条件（聚合稿 AGG-66 内含，尚未列入 §1.2 INV 表）；延续已在系统外发生，学时未达标时预警不拒绝登记（notes 待用户定 V-14）
        permission: 执业证书.延续
        page: 执业证书维护页
        audit: true
        decision:
          - {when: otherwise, goto: end, outcome: 证书已延续}
      - actor: system
        where: automatic
        on_time: 证书有效期届满；届满前 N 日提醒（N 待用户定）
        command: 标记执业证书已到期
        branch: 到期
        emits: [执业证书已到期]
        desc: 定时命令约定缺（PG-10 同类）；事件仅分析
        notify: [{to: SH-E7, how: 企业微信通知}, {to: SH-E6, how: 企业微信待办}]
        outcome: 执业证书已到期
    notes: 学时达标是延续注册条件；签发人须具备约定资格（INV-47 在交付物处读）。到期标记的定时由 platform.scheduling 承担。
