event_policies:
- name: 离职生成归还待办
  trigger_event: Separated（B-13 发布）
  effect: 为该员工名下每件有未结束使用期间的资产生成一个 PRC-156 实例（归还待办）；非聚合命令，待办出现即第 1 步开始
  uses_command: 归还资产
  used_by: [PRC-156 触发器]
  rules: [R-B31-9]
  note: 订阅 B-13 Separated 的边需 one-architecture 补登（分片接缝问题 3）
- name: 审批通过回调
  trigger_event: 审批已通过（platform.approval）
  effect: 调用对应的批准命令
  uses_command: 批准用印申请 / 批准 IT 需求 / 批准领用 / 批准员工活动申请
  used_by: [PRC-139、142、143、144 的批准步]
  rules: []
  note: 回调走事件或注册处理器，platform 不依赖 B-31（分片接缝问题 5）
- name: 审批驳回回调
  trigger_event: 审批已驳回（platform.approval）
  effect: 调用对应的驳回命令
  uses_command: 驳回用印申请 / 驳回 IT 需求 / 驳回领用 / 驳回员工活动申请
  used_by: [PRC-139 第 3 步、PRC-142 第 7 步、PRC-143 第 4 步、PRC-144 第 4 步]
  rules: []
  note: ''
- name: 审批撤回回调
  trigger_event: 审批已撤回（platform.approval 通用撤回，事件名由 platform 定）
  effect: 调用对应的撤回命令
  uses_command: 撤回用印申请 / 撤回 IT 需求 / 撤回领用 / 撤回员工活动申请
  used_by: [各审批步 withdraw 边]
  rules: []
  note: 事件名以 platform.approval 事件目录为准，本稿不自造
- name: 关闭超时
  trigger_event: 定时：解决后 P5D 未确认
  effect: 系统代发关闭 IT 需求（关闭方式=超期自动关闭）
  uses_command: 关闭 IT 需求
  used_by: [PRC-142 第 5 步 timeout]
  rules: [R-B31-4]
  note: ''
- name: 用印份数到齐关闭
  trigger_event: 已用印（本聚合内部）
  effect: 累计份数达批准份数或确认放弃后系统发关闭用印申请
  uses_command: 关闭用印申请
  used_by: [PRC-139 第 5 步]
  rules: [R-B31-2]
  note: ''
