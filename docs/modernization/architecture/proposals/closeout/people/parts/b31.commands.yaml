event_policies:
- name: 离职生成归还待办
  trigger_event: Separated（B-13 发布）
  effect: 仅已生效 Separated 生成仍在用资产的 PRC-156 待办；向 platform.scheduling 登记离职生效后 7 个日历日的固定到期时点；归还完成取消；晚到、重试、已归还的事件不重置或重建期限
  uses_command: 归还资产
  used_by: [PRC-156 触发器]
  rules: [R-B31-9]
  note: 幂等键为聚合 ID + 到期时点；本次答复登记 D15 版本、生效日、批准人及依据；仅离职入口，非中断提醒原组织单元负责人；不订阅离职登记已撤销，不阻塞 VS-13.6
- name: 审批通过回调
  trigger_event: 审批已通过（platform.approval）
  effect: 调用对应的批准命令
  uses_command: 批准用印申请 / 批准 IT 需求
  used_by: [PRC-139、142 的批准步]
  rules: []
  note: 回调走事件或注册处理器，platform 不依赖 B-31（分片接缝问题 5）
- name: 审批驳回回调
  trigger_event: 审批已驳回（platform.approval）
  effect: 调用对应的驳回命令
  uses_command: 驳回用印申请 / 驳回 IT 需求
  used_by: [PRC-139 第 3 步, PRC-142 第 7 步]
  rules: []
  note: ''
- name: 审批撤回回调
  trigger_event: 审批已撤回（platform.approval 通用撤回，事件名由 platform 定）
  effect: 调用对应的撤回命令
  uses_command: 撤回用印申请 / 撤回 IT 需求
  used_by: [PRC-139、142 审批步 withdraw 边]
  rules: []
  note: 事件名以 platform.approval 事件目录为准，本稿不自造
- name: 用印份数到齐关闭
  trigger_event: 已用印（本聚合内部）
  effect: 累计份数达批准份数或确认放弃后系统发关闭用印申请
  uses_command: 关闭用印申请
  used_by: [PRC-139 第 5 步]
  rules: [R-B31-2]
  note: ''
- name: 周年自动生成（设计，尚未实现）
  trigger_event: platform.scheduling 按业务日到达已配置入职周年
  effect: 读 B-13 入职日期及有效人员事实，按活动和周年规则校验后用同一登记入口；员工 + 入职日期 + 周年日期 + 活动类型去重，重复或补跑不重建
  uses_command: 提交员工活动申请
  used_by: [PRC-144 第 1 步]
  rules: [R-B31-10]
  note: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：周年自动生成规则（ARCH-B31-materials 7），不是已运行的领域事件
