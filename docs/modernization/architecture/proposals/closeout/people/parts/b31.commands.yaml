# B-31 命令目录（收敛产物，提议稿；规格见 closeout/RESPONSIBILITY_MATRIX_SPEC.md 第 B 节）
# 依据：b31.processes.yaml、b31.notes.md、聚合稿 AGG-113–116 命令列、data-model.people.yaml。命令名沿用聚合稿与分片，不自造；
#   「name_status」非空的是〔缺〕命令：沿用分片提议名的 3 条（撤回用印申请、驳回 IT 需求、申请调拨资产），
#   以及收敛时新增的 2 条（撤回 IT 需求、撤销调拨申请）；B31-5、8 已撤领用/活动的审批期撤回（ARCH_VS14），历史状态与轮次保留。
# 发令权 authority 指向 b31.raci.yaml 的条目（A 取 SPEC 第 A 节口径）。kind：human 人发起；callback 审批平台回调；automatic 系统规则。
# 「孤儿」= 未被任一流程步骤、事件策略或维护用到。本稿 0 个孤儿命令。

bc: B-31
aggregates: [AGG-113, AGG-114, AGG-115, AGG-116, AGG-121]
commands:
- name: 提交用印申请
  aggregate: AGG-113
  entity: seal_applications
  kind: human
  source: 聚合稿 AGG 命令列
  params: [印章类别（公章 / 合同专用章 / 法定代表人名章 / 财务章等）, 用印法人, 用印事由, 用印文件（名称、份数、引用）, 申请份数, 来源单据（类型、审批实例ID，可空；无来源单据的申请为空）, 审批轮次（原单重提时新轮）, 所用制度配置版本]
  preconditions:
  - {ref: R-B31-1, text: 用印法人须为申请日有效法人主体，否则拒绝并留在草稿}
  - {ref: R-B31-12, text: 填了来源审批实例ID的，经 platform.approval 校验实例已通过；校验不过则拒绝并告诉申请人原因，留在草稿，不静默}
  - {ref: INV-138, text: 同一来源审批实例的累计用印份数（本申请份数加上该实例已被其他有效用印申请占用的份数）不超审批载荷份数；超出则拒绝并告诉申请人原因，留在草稿，不静默}
  - {ref: 状态, text: 申请为草稿或已驳回、已撤回；原单重提保留原编号及旧轮次，新建本轮审批实例，旧回调不得作用新轮}
  - {ref: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」, text: 无来源单据时用印责任、加审配置须完整有效，否则拒绝并告警；来源直通仍按 INV-138}
  authority:
    ref: raci:AGG-113/提交用印申请
    A: {resolve: instance, field: 申请人}
    R: [SH-E3]
  idempotency_key: 申请ID + 提交轮次（同轮重试回放，重提增加轮次并保留历史）
  emits: 用印申请已批准（仅来源审批校验通过时直接置已批准；其余情形为内部）
  used_by: [PRC-139 第 1 步]
  orphan: false
- name: 批准用印申请
  aggregate: AGG-113
  entity: seal_applications
  kind: callback
  source: 聚合稿 AGG 命令列
  params: [审批实例ID, 审批结果（通过）]
  preconditions:
  - {ref: 状态, text: 申请为审批中且审批实例ID一致；仅无来源单据的申请有此审批；须匹配当前审批轮次，历史或重复回调不得作用新轮}
  - {ref: R-B31-11, text: 按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；AR-11、AR-12 不替代责任归属}
  - {ref: R-B31-12, text: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：用印加审范围与授权层级须有正式制度版本；AR-16 候选范围不直接启用}
  authority:
    ref: raci:AGG-113/批准用印申请
    A: {resolve: instance, field: 按用印用途、法人、归属对象的制度责任配置解析, alias: cost_object_owner}
    R: [SH-M1]
    approval: {approver: cost_object_owner, doc_type: 用印审批}
  idempotency_key: 审批实例ID（同一审批实例重复回调不重复生效）
  emits: 用印申请已批准
  used_by: [PRC-139 第 2 步]
  orphan: false
- name: 驳回用印申请
  aggregate: AGG-113
  entity: seal_applications
  kind: callback
  source: 聚合稿 AGG 命令列
  params: [审批实例ID, 驳回意见]
  preconditions:
  - {ref: 状态, text: 申请为审批中且审批实例ID一致；须匹配当前审批轮次，历史或重复回调不得作用新轮}
  authority:
    ref: raci:AGG-113/驳回用印申请
    A: {resolve: instance, field: 按用印用途、法人、归属对象的制度责任配置解析, alias: cost_object_owner}
    R: [platform.approval]
  idempotency_key: 审批实例ID
  emits: （内部）
  used_by: [PRC-139 第 3 步]
  orphan: false
- name: 撤回用印申请
  aggregate: AGG-113
  entity: seal_applications
  kind: human
  name_status: 〔缺〕沿用分片提议名（notes 新用语）
  source: 分片 b31.notes.md 新用语〔缺〕撤回用印申请（WithdrawSealApplication）
  params: [申请ID, 撤回原因]
  preconditions:
  - {ref: 状态, text: 申请为审批中}
  - {ref: 权限, text: 仅申请人本人}
  authority:
    ref: raci:AGG-113/撤回用印申请
    A: {resolve: instance, field: 申请人}
    R: [SH-E3]
  idempotency_key: 申请ID（已撤回再撤回无操作）
  emits: （内部）
  used_by: [PRC-139 第 2 步（撤回边 withdraw）]
  orphan: false
- name: 登记用印
  aggregate: AGG-113
  entity: seal_usage_records
  kind: human
  source: 聚合稿 AGG 命令列
  params: [申请ID, 登记请求ID, 实际用印时间, 本次用印份数, 经办人, 盖章文件扫描件引用, 确认放弃剩余份数（是 / 否）, 报价版本引用（报价用途，仅记录）, 用印法人, 拟发文件及实际盖章凭据对应, 所用核验配置版本]
  preconditions:
  - {ref: INV-118, text: 申请须已批准（来源审批校验通过或负责人已批准）}
  - {ref: INV-119, text: 累计登记份数不得超过批准份数}
  - {ref: R-B31-2, text: 本次用印份数为 0 仅当确认放弃剩余份数〔推〕；达到批准份数或确认放弃后触发关闭}
  - {ref: 职责分离, text: 经办人不得是申请人本人（PRC-139 segregation）}
  - {ref: INV-138, text: 同一来源实例累计用印份数不超过批准份数}
  - {ref: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」, text: 报价实际用印须与同一报价版本、用印法人、拟发文件和实际盖章凭据可核验对应；缺失或不一致拒绝并告警，审批通过不算已用印}
  authority:
    ref: raci:AGG-113/登记用印
    A: {resolve: type, role: SH-E6, function: 行政经办}
    R: [SH-E6]
  idempotency_key: 登记请求ID（客户端预生成 UUIDv7；重复登记返回已有登记行）
  emits: 已用印
  used_by: [PRC-139 第 4 步]
  orphan: false
- name: 关闭用印申请
  aggregate: AGG-113
  entity: seal_applications
  kind: automatic
  source: 聚合稿 AGG 命令列
  params: [申请ID]
  preconditions:
  - {ref: R-B31-2, text: 累计登记份数已达批准份数，或经办人已确认放弃剩余份数；不设人工关闭}
  - {ref: 凭据保留, text: 关闭不抹去实际用印登记和凭据对应，已关闭仍可核验}
  authority:
    ref: raci:AGG-113/关闭用印申请
    A: {resolve: type, role: SH-E6, function: 行政经办}
    R: [system]
  idempotency_key: 申请ID（已关闭无操作）
  emits: （内部）
  used_by: [PRC-139 第 5 步]
  orphan: false
- name: 提交 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [需求类别, 描述, 优先级, 所用类别、责任及金额适用配置版本, 提交轮次]
  preconditions:
  - {ref: R-B31-3, text: 逐类填是否需人审、理由、批准责任人、提供方、维护方、默认路由及采购交接；未列类别或无有效版拒绝并告警，不默认常规支持}
  - {ref: 状态, text: 工单为草稿或已退回、已撤回；仅提出人原单重提，保留旧轮次、意见和原编号，新轮重新核对配置}
  - {ref: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」, text: 先明确金额由 IT 或采购承载；采购金额留采购，IT 自身承载须有两档阈值和币种，不补零、不作不限额}
  authority:
    ref: raci:AGG-114/提交 IT 需求
    A: {resolve: instance, field: 提出人}
    R: [SH-E3]
  idempotency_key: 工单ID + 提交轮次（同轮回放，重提增加轮次）
  emits: （内部）
  used_by: [PRC-142 第 1 步]
  orphan: false
- name: 批准 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: callback
  source: 聚合稿 AGG 命令列
  params: [审批实例ID, 审批结果（通过）]
  preconditions:
  - {ref: 状态, text: 工单为审批中且审批实例ID一致；须匹配当前审批轮次，历史或重复回调不得作用新轮}
  - {ref: R-B31-11, text: 按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；本人及缺位沿 AR-11、AR-12，不能替代制度责任归属}
  authority:
    ref: raci:AGG-114/批准 IT 需求
    A: {resolve: instance, field: 按 IT 类别和正式制度责任配置解析, alias: cost_object_owner}
    R: [SH-M1]
    approval: {approver: cost_object_owner, doc_type: IT需求审批}
  idempotency_key: 审批实例ID
  emits: （内部）
  used_by: [PRC-142 第 2 步]
  orphan: false
- name: 驳回 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: callback
  name_status: 〔缺〕沿用分片提议名（notes 新用语）
  source: 分片 b31.notes.md 新用语〔缺〕驳回 IT 需求（RejectItRequest）；与「退回 IT 需求」终态同为已退回，但发令方不同（审批回调 vs 信息部门），保留两条
  params: [审批实例ID, 驳回意见]
  preconditions:
  - {ref: 状态, text: 工单为审批中且审批实例ID一致；须匹配当前审批轮次，历史或重复回调不得作用新轮}
  authority:
    ref: raci:AGG-114/驳回 IT 需求
    A: {resolve: instance, field: 按 IT 类别和正式制度责任配置解析, alias: cost_object_owner}
    R: [platform.approval]
  idempotency_key: 审批实例ID
  emits: （内部）
  used_by: [PRC-142 第 7 步]
  orphan: false
- name: 撤回 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: human
  name_status: 〔缺〕收敛新增，沿用分片命名模式，待 one-glossary 登记
  source: 收敛新增（分片仅写 withdraw 边，无命令）
  params: [工单ID, 撤回原因]
  preconditions:
  - {ref: 状态, text: 工单为审批中}
  - {ref: 权限, text: 仅提出人本人}
  authority:
    ref: raci:AGG-114/撤回 IT 需求
    A: {resolve: instance, field: 提出人}
    R: [SH-E3]
  idempotency_key: 工单ID
  emits: （内部）
  used_by: [PRC-142 第 2 步（撤回边 withdraw）]
  orphan: false
- name: 受理 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [工单ID, 处理人, 重开说明（提出人反馈未解决时）]
  preconditions:
  - {ref: 状态, text: 工单为已提交；或已解决且提出人反馈未解决（重开，回处理中）}
  authority:
    ref: raci:AGG-114/受理 IT 需求
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
  idempotency_key: 工单ID + 受理序号（重开后为新序号）
  emits: （内部）
  used_by: [PRC-142 第 3 步（重开经 第 5 步 判断出口回到第 3 步）]
  orphan: false
- name: 解决 IT 需求
  aggregate: AGG-114
  entity: it_request_handlings
  kind: human
  source: 聚合稿 AGG 命令列
  params: [工单ID, 处理时间, 处理说明, 处理结论]
  preconditions:
  - {ref: 状态, text: 工单为处理中}
  - {ref: INV-120, text: 解决须写出处理结论（供关闭时校验）}
  - {ref: A3, text: 受理之后解决之前已判定需求成立且可实现；否则由处理中直接退回，不写已解决、不发解决事件}
  authority:
    ref: raci:AGG-114/解决 IT 需求
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
  idempotency_key: 工单ID + 处理记录ID（客户端预生成 UUIDv7）
  emits: IT 需求已解决
  used_by: [PRC-142 第 4 步]
  orphan: false
- name: 关闭 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [工单ID, 提出人人工确认]
  preconditions:
  - {ref: 状态, text: 工单为已解决且仅提出人本人确认；系统无代关权}
  - {ref: INV-120, text: 关闭须有处理结论；无结论拒绝；未解决可回受理重开}
  - {ref: R-B31-4, text: 人工超期不自动改变状态；不登记受理提醒或代关任务，保留人工催办和逾期查询}
  authority:
    ref: raci:AGG-114/关闭 IT 需求
    A: {resolve: instance, field: 提出人}
    R: [SH-E3]
  idempotency_key: 工单ID（已关闭无操作）
  emits: （内部）
  used_by: [PRC-142 第 5 步]
  orphan: false
- name: 退回 IT 需求
  aggregate: AGG-114
  entity: it_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [工单ID, 退回原因]
  preconditions:
  - {ref: 状态, text: 工单为处理中；需求不成立或无法实现}
  authority:
    ref: raci:AGG-114/退回 IT 需求
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
  idempotency_key: 工单ID（已退回无操作）
  emits: （内部）
  used_by: [PRC-142 第 6 步]
  orphan: false
- name: 申请领用资产
  aggregate: AGG-115
  entity: it_asset_use_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params: [资产卡片ID（AGG-91，仅引用）, 使用人, 领用说明, 所用领用规则及清单配置版本]
  preconditions:
  - {ref: R-B31-5, text: 全部领用只登记，岗位标准及超配可执行规则通过直达已通过；规则缺失、无有效版或不满足拒绝并告警，不转人审；清单提供方及维护责任上线前须填}
  - {ref: R-B31-6, text: 资产无未归还使用人，申请时提前拒绝（INV-121 的提前判定）}
  - {ref: 卡片有效, text: 卡片存在、未处置、属 IT 资产类别（读 B-24）}
  authority:
    ref: raci:AGG-115/申请领用资产
    A: {resolve: instance, field: 使用人}
    R: [SH-E3]
  idempotency_key: 申请ID（客户端预生成 UUIDv7）
  emits: （内部）
  used_by: [PRC-143 第 1 步]
  orphan: false
- name: 登记领用
  aggregate: AGG-115
  entity: it_asset_use_periods
  kind: human
  source: 聚合稿 AGG 命令列
  params: [申请ID, 领用人签收, 交付日期（使用期间起始日）, 设备实物状态]
  preconditions:
  - {ref: INV-121, text: 同一资产同一时刻只有一个使用人，使用期间不重叠}
  - {ref: R-B31-6, text: 登记时兜底拒绝已有未归还使用人的资产}
  - {ref: 状态, text: 申请为已通过（岗位标准及超配规则已通过，无审批回调前提）}
  - {ref: 职责分离, text: 使用人不得登记自己的领用}
  authority:
    ref: raci:AGG-115/登记领用
    A: {resolve: type, role: SH-E6, function: 信息（IT）资产管理员/处理人}
    R: [SH-E6]
  idempotency_key: 申请ID（同一申请只开一个使用期间）
  emits: 资产已领用
  used_by: [PRC-143 现第 2 步（原第 3 步）]
  orphan: false
- name: 申请调拨资产
  aggregate: AGG-115
  entity: it_asset_use_requests
  kind: human
  name_status: 〔缺〕沿用分片提议名（notes 新用语）
  source: 分片 b31.notes.md 新用语〔缺〕申请调拨资产（RequestAssetTransfer）
  params: [资产卡片ID, 调出使用人, 调入使用人, 调拨说明]
  preconditions:
  - {ref: R-B31-7, text: 调入使用人须在调拨日在职；资产无当前使用人转领用；跨组织单元通知两侧负责人；同一核算主体内跨组织只通知双方，不增批准；跨法人转让归固定资产流程}
  - {ref: R-B31-6, text: 调出方须为当前使用人}
  - {ref: 卡片有效, text: 卡片存在、未处置且属于同一核算主体；跨法人转让归 B-24 固定资产流程，不在本命令办理}
  authority:
    ref: raci:AGG-115/申请调拨资产
    A: {resolve: instance, field: 调出使用人}
    R: [SH-E3]
  idempotency_key: 申请ID（客户端预生成 UUIDv7）
  emits: （内部）
  used_by: [PRC-155 第 1 步]
  orphan: false
