# B-31 事件目录（收敛产物，提议稿）。事件名取聚合稿 AGG-113–116「事件」列与分片 emits，不自造；负载只含 ID 与值对象（金额、份数、日期、代码）。
# 聚合稿其余命令的「（内部）」不发布事件。subscribers 当前均为「仅分析」，本组无流程订阅 B-31 自身事件。
# consumed 为 B-31 订阅的外部事件。复用 EventCatalogueTest 口径与 processes_check.py 的校验待 one-architecture 并入。

bc: B-31
published:
- name: 用印申请已批准
  published_by: AGG-113
  by_command: 批准用印申请
  payload: [用印申请ID, 印章类别码, 用印法人ID, 申请人ID, 批准份数, 审批实例ID, 来源审批实例ID, 批准时间]
  note: 来源审批校验通过的申请由提交用印申请直接置已批准时同样发布（审批实例ID 为空，来源审批实例ID 有值）
  subscribers:
  - {type: 仅分析}
- name: 用印已办理
  published_by: AGG-113
  by_command: 登记用印
  payload: [用印申请ID, 用印登记行ID, 经办人ID, 本次用印份数, 累计用印份数, 实际用印时间, 对应报价版本引用（报价用途）, 用印法人ID, 拟发文件引用, 实际用印凭据对应]
  subscribers:
  - {type: 仅分析}
  note: 按 33e28272 AGG-113 同步事件名；每次实际登记发布，关闭不删除凭据；事件仅分析。实际用印核验由 REF-04（暂名，图节点 B-32）经 api 读同一报价版本、法人、拟发文件及凭据的登记，不订阅本事件；B-03 不依赖 B-31。读不到或对应不符即拒绝发出并告警；ADR-0057 提议待批，正式名称与命名空间待 one-glossary。
- name: IT 需求已解决
  published_by: AGG-114
  by_command: 解决 IT 需求
  payload: [IT需求ID, 需求类别码, 提出人ID, 处理人ID, 解决时间]
  subscribers:
  - {type: 仅分析}
  note: 仅受理后、解决命令前判定成立且可实现才发布；不成立或无法实现直接退回，不发布
- name: 资产已领用
  published_by: AGG-115
  by_command: 登记领用
  payload: [资产卡片ID, 使用期间ID, 使用人ID, 起始日, 来源申请ID]
  subscribers:
  - {type: 仅分析}
  note: 离职交接（PRC-128）经读模型读取，不订阅事件（分片接缝问题 3）
- name: 资产已调拨
  published_by: AGG-115
  by_command: 调拨资产
  payload: [资产卡片ID, 调出使用期间ID, 调入使用期间ID, 调出使用人ID, 调入使用人ID, 调拨日, 来源申请ID]
  subscribers:
  - {type: 仅分析}
- name: 资产已归还
  published_by: AGG-115
  by_command: 归还资产
  payload: [资产卡片ID, 使用期间ID, 使用人ID, 归还日, 归还时状态码]
  subscribers:
  - {type: 仅分析}
  note: 离职交接（PRC-128）经读模型读取
- name: 员工活动申请已批准
  published_by: AGG-116
  by_command: 提交员工活动申请
  payload: [员工活动申请ID, 活动类型码, 参与人员引用, 所用活动规则版本, 所用周年规则版本（周年入口）, 入职日期（周年入口）, 周年日期（周年入口）, 规则通过时间]
  subscribers:
  - {type: 仅分析}
  note: 全部活动规则通过的登记结果，非人工批准；周年触发器尚未实现。取消员工活动登记仅聚合内部记状态及原因、人、时间与审计，无跨 BC 消费需求，不另造取消事件；登记内容和完成历史不删除。
consumed:
- name: 审批已通过
  from: platform.approval
  handled_by: [批准用印申请, 批准 IT 需求]
  used_by: [PRC-139 第 4 步入口（仅本轮人工审批）, PRC-142 第 3 步入口（仅受控类别）]
- name: 审批已驳回
  from: platform.approval
  handled_by: [驳回用印申请, 驳回 IT 需求]
  used_by: [PRC-139 第 3 步, PRC-142 第 7 步]
- name: Separated
  from: B-13
  handled_by: [事件策略「离职生成归还待办」→ 归还资产]
  used_by: [PRC-156 触发器]
  note: 仅离职已生效后生成仍在用资产待办；按生效时点 + 7 个日历日登记固定期限，晚到/重试不重置，已归还不重建；归还完成取消。B-31 → B-13 事件与 → platform.scheduling 登记；不订阅离职登记已撤销，不阻塞 VS-13.6
