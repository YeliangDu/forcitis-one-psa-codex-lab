      reason: "versioned none：只是归属期间的聚合根，期间在 org_unit_legal_entities 与 employee_legal_entities；PI 标记：员工行为 PI，访问级别 INTERNAL。已建聚合（terms 法人归属）聚合稿无编号"
    - name: org_unit_legal_entities
      role: version
      key: uuid_v7
      references:
        - {to: AGG-117, by: legal_entity_attribution_id}
        - {to: AGG-60, by: legal_entity_id}
        - {to: AGG-61, by: org_unit_id}
      versioned: effective_dated
      history_migration: full
      sensitivity: INTERNAL
      column_families: [生效区间, 部门默认法人, 子树覆盖]
      reason: "数据范围法人口径（ADR-0026 D-1）；生效依据 DECLARED；PI 标记：NONE"
    - name: employee_legal_entities
      role: version
