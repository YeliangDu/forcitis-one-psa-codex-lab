      reason: "P-6：职位族与子族版本化，DECLARED；PI 标记：NONE"
    - name: job_grades
      role: child
      key: uuid_v7
      versioned: none
      history_migration: none
      sensitivity: INTERNAL
      column_families: [职级编码, 序位]
      reason: "versioned none：编码与序位标识，定义随 job_grade_versions；职级与职位是两个独立维度（JOB_CATALOG P-0）；history_migration none 同 jobs（旧「岗位编码」实为职级编码，只作映射证据）；PI 标记：NONE"
    - name: job_grade_versions
