# 表级数据模型 · 人员组片段（B-13、B-14、B-27 在前；B-15、B-18、B-30、B-31 由 parts/ 合并于后）
# 字段约定：以 closeout/CONVENTIONS.md §3 为准（one-architecture 2026-10-16），本片段只用其固定字段，未加字段：
#   aggregate 聚合编号 AGG-NN；bc BC 编号 B-NN；tables 该聚合的表。
#   表字段：name（snake_case 复数，不写 schema）、role（root 根 / child 次级 / version 版本 / link 关联 / staging 迁入暂存）、
#     key（uuid_v7）、references（{to: AGG-NN, by: xxx_id, cross_bc: true}；同 BC 跨聚合省略 cross_bc；不指向聚合的 platform.* 引用见 DATA_MODEL.md）、
#     versioned（none / effective_dated / snapshot / append_only）、history_migration（full / open_items / none，非 full 写 reason）、
#     sensitivity（取 data-classification.txt 的访问级别名 PUBLIC / INTERNAL / SENSITIVE / RESTRICTED；拿不准写 tbd 并写 reason）、
#     column_families（列族，不列字段）、reason（history_migration、sensitivity 非默认或 versioned 为 none 时必填）。
# 本片段的约定：
#   1. 个人信息标记（NONE / PI / SPI，ADR-0043）无专用字段，写在 reason 里（以「PI」「SPI」起头）；格式问题见 NOTES.data.md。
#   2. 聚合号 AGG-117（法人归属）、AGG-118（假期类型与额度规则）已由 one-architecture 补号（PRC_ALLOCATIONS）；仍无号者写「AGG-待定-<名称>」。
#   3. 已建 / 改形 / 新建、D17 依据、迁入来源与 via、数据类别，放 DATA_MODEL.md，不在本文件。
#   4. B-13 升级为自有人事记录系统（用户 2026-10-16 U-1、U-7；one-architecture 裁定为已定事项的落地改写）：
#      快照来源撤销，版本表生效依据为 DECLARED 人事业务生效日（U-12）；sync_* 表不属任何聚合，见 DATA_MODEL.md「不属聚合的技术表」。

# ───────────────────────── B-13 organization.workforce ─────────────────────────
- aggregate: AGG-60
  bc: B-13
  tables:
    - name: legal_entities
      role: root
      key: uuid_v7
      versioned: none
      history_migration: full
      sensitivity: INTERNAL
      column_families: [法人代码（发号后不可改）, 创建与乐观锁, 事件序号]
      reason: "versioned none：根表只留代码与标识，名称、状态随 legal_entity_versions（D17 细则 5、8）；历史：五家法人由初始化录入，全量即全部版本。PI 标记：NONE"
    - name: legal_entity_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-60, by: legal_entity_id}
      versioned: effective_dated
      history_migration: full
      sensitivity: INTERNAL
      column_families: [生效区间, 修订序号, 名称, 状态, 创建时间]
      reason: "生效依据 DECLARED（业务声明日）；PI 标记：NONE"

