- aggregate: AGG-62
  bc: B-13
  tables:
    - name: employees
      role: root
      key: uuid_v7
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      column_families: [工号, 姓名, 性别, 企业邮箱, 登录名, 权限用在职二值, 创建与乐观锁, 事件序号, 来源对照标识]
      reason: "versioned none：个人信息最小化只留当前值（D17 细则 2 第四类）；用工类型、状态、收费标识随 employment_versions。PI 标记：PI；列级访问级别按 ADR-0043 另议（邮箱、性别、企业微信 ID 现登 SENSITIVE，ADR-0043 拟改 INTERNAL）。企业微信 userid 不留在本表，走来源对照（D16、Q-03）"
    - name: employment_versions
      role: version
      key: uuid_v7
      references:
        - {to: AGG-62, by: employee_id}
      versioned: effective_dated
      history_migration: full
      sensitivity: SENSITIVE
      column_families: [生效区间, 修订序号, 用工类型, 用工状态（候选 → 试用 → 正式 → 待离职 → 已离职 / 未录用 / 停薪留职）, 入职日 / 转正日 / 离职日, 是否收费员工]
      reason: "新建；生效依据 DECLARED 人事业务生效日（U-12），可提前登记、补登落回真实日期；PI 标记：PI，用工状态含离职原因等时按 U-11 复判"
    - name: interviews
      role: child
      key: uuid_v7
      references:
        - {to: AGG-62, by: employee_id}
        - {to: AGG-65, by: recruitment_requisition_id}
      versioned: none
      history_migration: none
      sensitivity: SENSITIVE
      column_families: [面试轮次, 面试时间, 面试人, 评价与结论]
      reason: "versioned none：单一记录，审计可还原；history_migration none：候选阶段记录不迁（旧系统用人申请只作证据，来源 OA 表单未建对照，待 one-data 取证确认）；PI 标记：PI（候选人评价），SPI 与否交 U-11"
    - name: hiring_decisions
      role: child
      key: uuid_v7
      references:
        - {to: AGG-62, by: employee_id}
        - {to: AGG-65, by: recruitment_requisition_id}
        - {to: AGG-64, by: job_id}
      versioned: none
      history_migration: none
      sensitivity: SENSITIVE
      column_families: [录用结论（录用 / 未录用）, 拟入职日, 拟任职位与职级, 决定人与时间]
      reason: "versioned none：单一记录，审计可还原；history_migration none：已入职者的结果已体现在 employment_versions 与 assignment_versions；PI 标记：PI"
    - name: separation_requests
      role: child
      key: uuid_v7
      references:
        - {to: AGG-62, by: employee_id}
      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      column_families: [申请日期, 期望离职日, 离职原因类别, 状态（已申请 → 已批准 / 已驳回）, 批准人与时间]
      reason: "versioned none：单级批准的单据，状态由审计还原；历史来源待取证（老系统离职申请表单）；PI 标记：PI，离职原因含健康等时可能 SPI，交 U-11"

