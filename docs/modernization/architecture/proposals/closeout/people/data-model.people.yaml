      reason: "数据范围法人口径，优先于部门对照；生效依据 DECLARED；PI 标记：PI（与可识别自然人有关），访问级别 INTERNAL"
    - name: legal_entity_attribution_corrections
      role: child
      key: uuid_v7
      references:
        - {to: AGG-61, by: org_unit_id}
        - {to: AGG-62, by: employee_id}
      versioned: append_only
      history_migration: none
      sensitivity: INTERNAL
      column_families: [更正对象, 原期间, 更正后结束日, 更正理由, 更正人, 更正序号]
      reason: "history_migration none：更正只发生在新系统内，迁入不产生更正；PI 标记：PI（员工行），访问级别 INTERNAL"

