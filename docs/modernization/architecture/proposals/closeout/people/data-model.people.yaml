      versioned: none
      history_migration: full
      sensitivity: SENSITIVE
      column_families: [录用结论（录用 / 未录用）, 拟入职日, 拟任职位与职级, 决定人与时间]
      reason: "用户已定 T-5（intent 2026-10-16-162821）：候选人面试与录用记录迁入，加个人信息保护，分级与访问按 ADR-0043（访问限招聘相关角色）；来源与保留期待 one-data 核对；PI 标记：PI（候选人评价）"
    - name: separation_requests
