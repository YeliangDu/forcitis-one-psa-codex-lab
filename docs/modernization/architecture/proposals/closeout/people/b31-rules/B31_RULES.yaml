status: 待用户逐条确认的草案，未批准的业务路径不启用
说明:
- 现行做法仅指所提供的表单与流程配置，不代表实际执行情况。
- 行业通行为离线经验建议，未联网核验。
- ARCH_VS14及b31分片已移出工作树，本次读取保留快照，并核对仓库中的B31用户答复。
- config为拟配置项，不表示已配置或已批准。
groups:
- group: 用印
  rules:
  - id: YY-01
    text: 在职员工可为职责内事项申请用印，代办须注明委托人和事由。
    basis: 经验值
    source: 建议明确申请资格和代办责任，便于追溯事项来源。
    config: 申请资格、代办条件及委托材料
  - id: YY-02
    text: 按用印法人和用途引用签章服务的有效印章台账。
    basis: 已采纳规则
    source: 签章草案决定3，现已采纳为ADR-0064决定3。
    config: 法人及用途对应的台账条目
  - id: YY-03
    text: 逐份列明文件、份数及原件或复印件，提交后变更内容须重新核准。
    basis: 现行做法+经验值
    source: evidence_r4.md Q5-A「用印申请」、Q5-B「原/复印件」；变更重核为建议。
    config: 文件清单及变更重提规则
  - id: YY-04
    text: 仅已批准的申请可以办理实际用印。
    basis: 已采纳规则
    source: ENTERPRISE_AGGREGATES_DRAFT.md INV-118。
    config: 无
  - id: YY-05
    text: 保存获批文件版本及盖章凭据，二者须可对应核验。
    basis: 已采纳规则
    source: ADR-0054决定1保全要求；ADR-0057决定2核验要求。
    config: 文件版本、盖章凭据及对应方式
  - id: YY-06
    text: 经办人逐次登记时间、印章和实际份数，申请及同一来源累计均不得超批。
    basis: 已采纳规则
    source: AGG-113；INV-119、INV-138；签章草案决定3。
    config: 实际登记引用的申请、来源审批及台账版本
- group: 用印加审
  rules:
  - id: JS-01
    text: 无来源单据的用印申请由事项负责人审批，负责人按用途和法人配置。
    basis: 经验值
    source: 建议由对事项负责的人核准，不默认申请人的部门负责人。
    config: 用途及法人对应的事项负责人、替补与授权层级，待定
  - id: JS-02
    text: 无来源单据且使用合同章或法人章的，加审人为用印法人的授权负责人。
    basis: 经验值
    source: 建议对代表法人作出承诺的用印增加授权复核。
    config: 加审印章类型及法人授权负责人，待定
  - id: JS-03
    text: 无来源的担保或跨法人事项经法务、财务复核后，由用印法人的授权负责人加审。
    basis: 经验值
    source: 建议分别核对责任承担、财务影响和法人授权，不以盖章替代事项决策。
    config: 专项事项范围、复核角色及加审负责人，待定
  - id: JS-04
    text: 来源审批已通过且累计份数合规的直接办理，不因印章类型另加审批。
    basis: 已采纳规则
    source: ARCH_VS14「B31-1」及「用印加审范围」；INV-138。
    config: 来源审批复用条件及批准份数
- group: 报价用印
  rules:
  - id: BJ-01
    text: 报价用印关联商机及确定的报价版本，投标用印另关联对应投标事项。
    basis: 现行做法+已采纳规则
    source: evidence_r4.md Q5-A「用印申请」的商机及项目关联；ADR-0057决定2。
    config: 商机、报价版本及投标事项引用
  - id: BJ-02
    text: 用印清单逐页标明空白页和待填栏，内容未定的页面不得预先盖章。
    basis: 经验值
    source: 建议避免盖章后补入未经核准的内容，并保留逐页核对依据。
    config: 空白页及待填栏登记要求
  - id: BJ-03
    text: 报价或投标发出前，须核对报价版本、用印法人、拟发文件与实际用印凭据一致。
    basis: 用户已定+已采纳规则
    source: B31-16；ADR-0057决定2，只有批准或申请登记不能替代实际用印。
    config: 实际用印核验对应关系，不得配置跳过
  - id: BJ-04
    text: 报价版本或拟发文件变更后须重新办理对应文件用印，不沿用旧凭据。
    basis: 已采纳规则+经验值
    source: ADR-0057决定2要求同版同文件核验；变更后重办为配套建议。
    config: 文件变更识别及重新办理条件
- group: IT 类别
  rules:
  - id: IT-01
    text: 需求类分为信息系统改进、账号与权限、软件安装、设备配置和资产借用。
    basis: 现行做法+经验值
    source: evidence_r4.md Q5-B「需求类型」归并建议；账号与权限为新增建议。
    config: 需求类别清单、提供方及维护方，待确认
  - id: IT-02
    text: 故障类分为业务系统、电脑、网络、邮箱与加密、打印与会议设备及其他故障。
    basis: 现行做法+经验值
    source: evidence_r4.md Q5-B「需求类型」；按业务用途归并，不沿用厂商名称。
    config: 故障类别及其细分清单，待确认
  - id: IT-03
    text: 常规故障和已授权的安装、配置、借用直接受理，新增功能、权限或软件授权先经事项负责人审批。
    basis: 经验值
    source: 建议区分恢复既有服务与新增授权；工单审批不替代权限授予或采购控制。
    config: 逐类人审标志、理由、事项负责人及采购交接，待确认
  - id: IT-04
    text: IT 负责人按类别指定受理人和替补。
    basis: 现行做法+经验值
    source: evidence_r5.md「需求工单」有IT负责人及处理人；分派职责、替补和时限为建议。；处理时限与 B31-2 冲突，审题撤下
    config: 类别受理人与替补，待行政补
  - id: IT-05
    text: IT单据不记金额，采购金额与审批留在采购单。
    basis: 用户已定
    source: CARD2.md背景转述的2026-10-20用户决定。
    config: IT金额组不适用
  - id: IT-06
    text: 不设超时提醒或自动代关，处理人填结论后由提出人确认关闭，未解决可重开。
    basis: 用户已定+已采纳规则
    source: B31-2；INV-120；b31.notes.md「R-B31-4」。
    config: 关闭及重开条件，不设自动代关参数
- group: 资产领用
  rules:
  - id: ZC-01
    text: 按岗位标准核对类别、规格和数量后登记领用，每项资产同一时刻仅一名使用人。
    basis: 用户已定+已采纳规则
    source: B31-5；ARCH_VS14「领用规则及清单维护」；INV-121。
    config: 岗位配置标准、计量单位、清单提供方及维护方，待定
  - id: ZC-02
    text: 超配在允许条件确认前拒绝领用，不新增领用审批。
    basis: 用户已定
    source: B31-5；ARCH_VS14明确规则不满足时拒绝，不转人审。
    config: 超配允许条件待定，未定不开放超配
  - id: ZC-03
    text: 同法人调拨由双方完成交接并通知两侧负责人，跨法人转让交固定资产流程。
    basis: 用户已定+已采纳规则
    source: B31-6；ARCH_VS14「B31-6」及A4；INV-121。
    config: 交接清单、双方确认及两侧负责人
  - id: ZC-04
    text: 离职资产须登记归还验收，生效满七个日历日未归还提醒原组织单元负责人且不阻断离职。
    basis: 用户已定+经验值
    source: B31-7及ARCH_VS14对应口径；归还验收清单为建议。
    config: 已定七个日历日；归还验收清单待确认
- group: 员工活动
  rules:
  - id: HD-01
    text: 活动类型列为周年贺卡、节日活动和创新项目发布，新增类型须先确认规则。
    basis: 现行做法+经验值
    source: evidence_r2.md「④ Q02已知模板」；三类归并及新增前确认规则为建议。
    config: 活动类型、适用人员及启停清单，待确认
  - id: HD-02
    text: 在职员工可登记本人组织的节日活动或创新项目发布，周年贺卡由系统自动生成。
    basis: 经验值+用户已定
    source: 人工登记资格为建议，便于明确组织责任；周年自动生成依据B31-10。
    config: 各类活动登记资格及组织安排，待确认
  - id: HD-03
    text: 活动不设人工审批；有花费的先行期只填预估金额，不校验预算，预算上线后再加检查。
    basis: 用户已定+经验值
    source: B31-8；预算在 W2 建（B31R 审题，以 Q6 答复定稿）
    config: 预算来源、额度校验、无费用条件及规则维护方，待定
  - id: HD-04
    text: 登记内容和参与人不得改写，取消须记原因、操作人和时间并保留原记录。
    basis: 已采纳规则
    source: b31.notes.md「OBJ-116生命周期」及R-B31-10。
    config: 取消原因及操作记录
  - id: HD-05
    text: 取消后重登须新建并关联原单，重复提交返回同一结果，自动任务不重建已取消记录。
    basis: 已采纳规则
    source: b31.notes.md「OBJ-116生命周期」；out.md §3.6。
    config: 原单与重登关系、周年生成去重条件
- group: 周年贺卡
  rules:
  - id: ZN-01
    text: 全体正式员工。
    basis: 用户已定
    source: CARD2.md背景转述的用户决定，intent 2026-10-20-232338。
    config: 适用范围为全体正式员工
  - id: ZN-02
    text: 满周年自动生成。
    basis: 用户已定
    source: CARD2.md背景；B31-10。
    config: 按员工、本次入职日期、周年日期及活动类型去重
  - id: ZN-03
    text: 闰日入职平年取 02-28。
    basis: 用户已定
    source: CARD2.md背景转述的用户决定，intent 2026-10-20-232338。
    config: 闰日入职平年周年日期为02-28
  - id: ZN-04
    text: 重新入职从本次入职重算。
    basis: 用户已定
    source: CARD2.md背景转述的用户决定，intent 2026-10-20-232338。
    config: 使用本系统人事记录中的本次入职日期
  - id: ZN-05
    text: 漏发不补。
    basis: 用户已定
    source: CARD2.md背景转述的用户决定，intent 2026-10-20-232338。
    config: 不启用跨日补发
  - id: ZN-06
    text: 周年当日生成并发送本人、通知行政；离职不发，停薪留职照发。
    basis: 用户已定+经验值
    source: 用户原话「满周年就有，全体正式员工」（intent 2026-10-20-232338）；B31R 审题
    config: 业务日为Asia/Shanghai；执行时点、行政接收角色及停薪留职处理待确认
open_points:
- 卡要求“超配需审批”，与B31-5及卡内“不得冲突”要求矛盾；本稿保留无人审，超配允许条件须另定，改回审批须用户明确变更原决定。
- 须补齐用途与法人对应的审批责任表，包括事项负责人、加审人、法务财务复核人、替补和本人申请时的处理方式。
- 担保或跨法人事项已有来源审批时，仍遵守来源直通；专项审查由哪个来源业务承载、缺少专项证据如何处理，须先明确。
- 招标要求预盖空白页或待填栏时，是否允许例外及如何回收核销须另定，未定前按BJ-02拒绝。
- 须确认IT完整分类与逐类责任表；已有授权的判断依据、资产借用与领用边界、采购交接条件须明确。
- 须提供岗位资产配置标准、超配允许条件，以及活动预算和组织安排的可执行清单与维护责任。
- 周年执行时点和行政接收角色须确认，须明确同日重试与跨日漏发的界线，不改变漏发不补决定。
- 用印批准后完全不用、取消申请、剩余份数放弃及来源份数占用释放，须形成一致处置规则。
已验证:
- 已读取工作卡、必读规范、out.md、所提供取证材料及相关决定。
- 已核对仓库B31用户答复、INV-118、INV-119、INV-120、INV-121、INV-138及相关ADR。
- 共7组35条，各组3至6条，每条最长44字。
- 未修改文件、未联网、未启动容器。
- 工作树仍仅见原有未跟踪文件.claude/launch.json。
未运行:
- 业务验收、编译、前后端测试及数据库验证。
- 完整密钥扫描及precheck各子检查未有效执行，不能声称通过。
