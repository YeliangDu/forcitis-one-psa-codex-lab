        desc: AGG-120 专项附加扣除声明（S-32 自 AGG-93 拆出）：员工本人发令，年度生命周期，与薪酬档案版本无共享命令与不变量；人力代录入是否保留见 notes 待用户定 U9；不设审批（员工对申报内容负责，税务端核验）；含未成年子女等信息，按敏感个人信息处理（拿不准归 SPI，交 U-11）
