        audit: true
        outcome: 专项附加扣除已更新
    notes: 单聚合维护含 AGG-93 与 AGG-120 两个聚合，不拆（S-43 #24 同类）：同一 BC（B-15）、同一页面与同一权限组；每条命令与每条转换各只改一个聚合（调整薪酬档案改 AGG-93，更新专项附加扣除改 AGG-120），一个事务一个聚合，检查口径以条目级 aggregate 为准。AGG-93 含敏感个人信息，按 ADR-0043 登记访问级别。建立薪酬档案在 PRC-84。S-42 事件入口：B-15 订阅 B-13 的〔缺〕转正已办理（事件策略「转正后复核薪酬」，边 B-15 → B-13 事件已有），生成待办提醒薪酬岗按劳动合同约定的转正工资调整薪酬档案，版本生效日 = 转正日（U-12），不自动改薪（工资金额以劳动合同约定为准，系统不推定）；待办处理仍走第 1 步，须引用调薪决定依据（劳动合同或转正决定文件）；取代原 PG-10「转正调薪靠人力人工发现」。

