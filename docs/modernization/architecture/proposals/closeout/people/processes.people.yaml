# 人员组 ⑥b 流程骨架片段（one-arch-people）：VS-07 任用员工、VS-09 达成经营目标、VS-11 沉淀复用知识、VS-13 获得报酬，及 B-31 行政事务。
# 字段按 closeout/CONVENTIONS.md（含 where / evidence、approval.engine）；编号与名称以 closeout/process-catalog.yaml 为准。
# PRC-83、84、137 为用户已批准的样板（SAMPLE.md，intent 2026-10-16-162820、162821）；其余由分片 parts/*.processes.yaml 合并而来。
# 命令名写〔缺〕表示聚合稿 §2.2 / 平台没有这条命令或事件，提议新增（见 NOTES.md「新用语」「聚合稿回补」），不假装存在。
# 带 CONVENTIONS 以外的键（decision.outcome、events.filter、steps.entry、entry_of 等）见 NOTES.md「格式问题」，待 one-architecture 裁定。

meta:
  version: 2
  group: people
  status: proposal-fragment
  date: "2026-10-16"
  scope: [VS-07, VS-09, VS-11, VS-13, B-31]














































processes:

  - id: PRC-80
    name: 维护法人、组织与岗位
    trigger: {type: human, desc: 人力调整组织、岗位或登记法人主体}
    triggers:
      - {type: human, name: "人力登记法人主体"}
      - {type: human, name: "人力调整组织单元"}
      - {type: human, name: "人力指定法人归属"}
      - {type: human, name: "人力停用职位"}
      - {type: human, name: "人力更名、停用或启用法人主体"}
      - {type: human, name: "人力新建或修改职位"}
      - {type: human, name: "人力更正法人归属"}
    stages: [VS-07.1, VS-07.3]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "法人、组织单元、职位目录、法人归属全量迁入（U-3、U-4），迁入不触发 P-31 待复核（ADR-0036 M7）；无在途实例"
    scope: "人力按法人与组织数据范围维护"
    outcomes: [已维护]
    scenarios: [PRC-80-S01, PRC-80-S02, PRC-80-S03, PRC-80-S04, PRC-80-S05, PRC-80-S06, PRC-80-S07, PRC-80-S08, PRC-80-S09, PRC-80-S10, PRC-80-S11, PRC-80-S12, PRC-80-S13]
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "维护法人、组织单元、职位目录与法人归属主数据", approval_right: "无（全部由不变量守卫，不设审批）", department_hint: "人力资源部", position_hint: "人事主数据维护岗（职能：维护组织与职位目录）"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "数据范围待复核时确认是否调整授权", approval_right: "无", department_hint: "区域或事业部", position_hint: "区域负责人（职能：对本区域组织数据范围负责）"}}       # 区域负责人：数据范围待复核时被通知（P-31）；区域负责人是否归 SH-M1 见 notes 格式问题 7
    steps:
      - actor: SH-E6
        where: in_system
        read: true
        command: 查看法人、组织与职位现状
        reads: [AGG-60, AGG-61, AGG-117, AGG-64]
        desc: 人力进入维护页查看现状后择一维护；各类维护互不依赖，本步是它们的共同入口（生成器把所有开始事件接到第 1 步，故写成入口选择）
        permission: 组织维护.查看
        page: 法人组织职位维护页
        decision:
          - {when: 登记法人主体, goto: 2}
          - {when: 调整组织单元, goto: 3}
          - {when: 指定法人归属, goto: 4}
          - {when: 更名法人主体, goto: 7}
          - {when: 停用法人主体, goto: 8}
          - {when: 启用法人主体, goto: 9}
          - {when: 新建岗位, goto: 10}
          - {when: 修改岗位, goto: 11}
          - {when: 更正法人归属, goto: 12}
          - {when: otherwise, goto: 5}      # 其余即停用职位
      - actor: SH-E6
        where: in_system
        branch: 登记法人
        command: 登记法人主体
        aggregate: AGG-60
        desc: 法人代码发号后不可改（INV-59）；五家法人由初始化录入，之后新增走本步（DATA_MODEL B-13）
        permission: 法人.登记
        page: 法人登记页
        audit: true
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 调整组织
        command: 调整组织单元
        aggregate: AGG-61
        emits: [组织单元已调整]
        desc: 按人事业务生效日生效（U-12）；B-13 自为记录系统，不再有 A8 同步来源（U-1、U-7）。撤销的组织单元下仍有在职任职则拒绝并提示先调岗（PRC-136），人力改正后重提
        permission: 组织单元.调整
        page: 组织单元维护页
        audit: true
        decision:
          - {when: 撤销的组织单元下仍有在职任职, goto: 3, rule: INV-60}
          - {when: otherwise, goto: 6}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 组织单元已调整}   # P-31；聚合稿 AGG-61 订阅方已写
      - actor: SH-E6
        where: in_system
        branch: 指定法人归属
        command: 指定法人归属        # 已建代码有对应命令；聚合稿 AGG-117 现已列入，去〔缺〕标记（QC-OBJECTS.md）
        aggregate: AGG-117
        emits: [〔缺〕法人归属已变更]
        desc: 部门默认法人或员工单独指定法人，按期间；同一对象期间不重叠（INV-新-P5，重叠则拒绝，人力改正后重提）。三口径之一，不一致由 B-15 预警（PRC-145），本步不拒绝
        permission: 法人归属.指定
        page: 法人归属维护页
        audit: true
        added_in: closeout
        decision:
          - {when: 法人归属期间与同一对象已有期间重叠, goto: 4, rule: INV-新-P5}
          - {when: otherwise, goto: end}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕法人归属已变更}   # 数据范围
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕法人归属已变更}               # PRC-145 订阅
      - actor: SH-E6
        where: in_system
        branch: 停用职位
        command: 停用岗位                    # Q-08 后为职位目录条目，改称待 one-glossary（notes 新用语）
        aggregate: AGG-64
        emits: [岗位已停用]
        desc: 职位仍被在职任职引用则拒绝，人力改正后重提（INV-63）
        permission: 职位目录.停用
        page: 职位目录维护页
        audit: true
        decision:
          - {when: 职位仍被在职任职引用, goto: 5, rule: INV-63}
          - {when: otherwise, goto: end}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-61, event: 组织单元已调整}]
        desc: P-31；对应词表「待调整权限」（ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 已维护
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 组织单元已调整}
      - actor: SH-E6
        where: in_system
        branch: 更名法人
        command: 更名法人主体        # 词表事件「法人主体已更名」；聚合稿只列登记法人主体（对象增删改查检查补缺，notes 结构问题 19）
        aggregate: AGG-60
        desc: 只改名称，追加名称版本；法人代码发号后不可改（INV-59）
        permission: 法人.更名
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 停用法人
        command: 停用法人主体        # 词表事件「法人主体已停用」
        aggregate: AGG-60
        desc: 法人主体不再作为法人使用；仍有有效法人归属或在职任职时是否拒绝，聚合稿与词表未定（notes 结构问题 19），暂只校验状态
        permission: 法人.停用
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 启用法人
        command: 启用法人主体        # 词表事件「法人主体已启用」
        aggregate: AGG-60
        desc: 恢复已停用的法人主体为有效
        permission: 法人.启用
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 新建职位
        command: 新建岗位        # Q-08 后为职位目录条目，命令名交 one-glossary
        aggregate: AGG-64
        desc: 新增职位目录条目（职位编码、名称、职位族、职级）；职位编码跨版本不变，同编码重复新建返回已有结果；初始目录仍由初始化录入
        permission: 职位目录.新建
        page: 职位目录维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 修改职位
        command: 修改岗位
        aggregate: AGG-64
        desc: 追加职位目录条目的新版本（名称、职位族、职级）；已停用的职位不可修改
        permission: 职位目录.修改
        page: 职位目录维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 更正法人归属
        command: 更正法人归属        # 聚合稿 AGG-117 已有命令，原无流程步骤引用
        aggregate: AGG-117
        desc: 只更正已关闭期间的结束日，只追加更正行不改写历史；更正后期间仍不得与同一对象其他期间重叠（INV-122），重叠则拒绝，人力改正后重提
        permission: 法人归属.更正
        page: 法人归属维护页
        audit: true
        decision:
          - {when: 更正后期间与同一对象其他期间重叠, goto: 12, rule: INV-122}
          - {when: otherwise, goto: end}
    notes: "步 2–5、7–12 是人力择一执行的备选路径（步 1 是入口选择）；步 6 是步 3 的事件反应。职位目录的新建与修改命令聚合稿未列（notes 结构问题）。本流程无人工审批：全部由不变量守卫（INV-59、60、63、新-P5）。"

  - id: PRC-81
    name: 提出并批准招聘需求
    trigger: {type: human, desc: 用人经理提出}
    triggers:
      - {type: human, name: "用人经理提出招聘需求"}
    stages: [VS-07.1]
    owner_bc: B-13
    human_orchestration: true
    human_note: 提交、批准或驳回，批准为本聚合命令
    type: business
    migration: "招聘需求全量迁入（来源 A8 用人申请表单，OA_PROCESS_INVENTORY 第 67 行，在途 5，待取证）；在途（已提交 / 已批准未关闭）按当前状态迁入，已关闭只迁结局与审计；迁入不发事件"
    scope: "用人经理看本部门；部门负责人看本部门；人力看全部"
    segregation:
      - {roles: [SH-E1, SH-M1], rule: "提出人与批准人不得为同一人；提出人本人就是归属组织单元的责任人时按 AR-11 由上级组织负责人批（处理方式待用户 V-18）"}
    outcomes: [已批准, 已关闭]
    scenarios: [PRC-81-S01, PRC-81-S02, PRC-81-S03, PRC-81-S04]
    roles:
      - {id: SH-E1, as: initiator, org_needs: {responsibility: "提出本部门招聘需求", approval_right: "无（提出人不得批准自己的需求）", department_hint: "用人部门", position_hint: "用人经理（职能：对本部门用人需求负责）"}}
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对本组织单元的用人取舍负责", approval_right: "批准招聘需求（类型级，单级）", department_hint: "需求所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人 = 招聘需求归属组织单元的责任人（cost_object_owner）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "需求批准后开展招聘", approval_right: "无", department_hint: "人力资源部", position_hint: "招聘专员（职能：组织招聘）"}}       # 人力：批准后开始招聘
    steps:
      - actor: SH-E1
        where: in_system
        read: true
        command: 查看职位目录与组织单元
        reads: [AGG-64, AGG-61]
        desc: 读职位目录与组织单元；Q-08 无编制，超编检查 P-33 已关闭，不再做
        permission: 招聘需求.提交
        page: 招聘需求编辑页
      - actor: SH-E1
        where: in_system
        command: 提交招聘需求
        aggregate: AGG-65
        desc: 职位、组织单元、人数、期望到岗日；职位须启用、组织单元须有效（规则候选 R-01，拒绝）；〔缺〕与候选人关联命令未见（PG-08）
        permission: 招聘需求.提交
        page: 招聘需求编辑页
        audit: true
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: 4, outcome: 已关闭}      # 批准前提出人撤回，走「关闭招聘需求」
        decision:
          - {when: 提出人在批准前撤回, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        command: 批准招聘需求
        aggregate: AGG-65
        emits: [招聘需求已批准]
        approval:
          engine: aggregate             # B-13 聚合内单级批准，不经 platform.approval（F-3；§4.3.4 第 4 条），故无审批平台回调
          doc_type: 招聘需求批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 4
          why_human: "增加人员成本是部门负责人对用人取舍的管理判断；Q-08 不管编制，没有可由规则判定的人数上限，职位有效等可校验的条件已由规则拒绝（R-01）"
        permission: 招聘需求.批准
        page: 招聘需求审批页
        audit: true
        pending: V-18
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信待办}]
        outcome: 已批准
        decision:
          - {when: 批准, goto: end}
          - {when: otherwise, goto: 4}
      - actor: SH-M1
        where: in_system
        branch: 驳回或关闭
        command: 关闭招聘需求
        aggregate: AGG-65
        emits: [招聘需求已关闭]
        desc: v1 以关闭代驳回，状态「已驳回」无独立命令；驳回由批准人执行，提出人撤回与已批准后因取消或录满的关闭由提出人或人力执行同一命令（录满无触发，PG-08）
        permission: 招聘需求.关闭
        page: 招聘需求审批页
        audit: true
        outcome: 已关闭
    notes: 批准不经 platform.approval（会成环）；需要多级审批时移出 B-13（聚合稿 §7 第 12 条），见 notes 待用户定 V-9、V-18。调入等非招聘入职跳过本流程。

  - id: PRC-82
    name: 登记候选人并作出录用决定
    trigger: {type: human, desc: 求职者应聘或用人经理推荐}
    triggers:
      - {type: human, name: "求职者应聘或用人经理推荐，人力登记候选人"}
    stages: [VS-07.2]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "候选人面试与录用记录全量迁入并加个人信息保护（用户 T-5，ADR-0043；A8 应聘登记表 / 面试评估表 / 录用审批表，OA_PROCESS_INVENTORY 第 55、74、57 行）：分级与访问限招聘相关角色；在途候选人按当前阶段迁入；迁入不发事件"
    scope: "人力看全部候选人；用人经理只看本人所提招聘需求下的候选人（访问限制按 ADR-0043）"
    outcomes: [录用决定已作出, 未录用, 候选人已放弃]
    scenarios: [PRC-82-S01, PRC-82-S02, PRC-82-S03, PRC-82-S04]
    roles:
      - {id: SH-H1, as: external, org_needs: {responsibility: "应聘、面试、答复录用通知", approval_right: "无", department_hint: "（外部）", position_hint: "候选人"}}
      - {id: SH-E6, as: performer, org_needs: {responsibility: "登记候选人与答复，发出录用通知", approval_right: "无", department_hint: "人力资源部", position_hint: "招聘专员（职能：候选人登记与录用事务）"}}      # 人力
      - {id: SH-E1, as: performer, org_needs: {responsibility: "面试评价并作出录用决定", approval_right: "作出录用决定（自行决定，不另设审批，V-8 待定）", department_hint: "用人部门", position_hint: "用人经理（职能：对所辖用人决定负责）"}}      # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记候选人
        aggregate: AGG-62
        emits: [人员已登记]
        desc: 候选人并入人员的候选阶段（OBJ-59）；含个人信息，ADR-0043
        permission: 候选人.登记
        page: 候选人登记页
        audit: true
      - actor: SH-E1
        where: in_system
        command: 记录面试
        aggregate: AGG-62
        desc: 面试在线下或会议系统进行，本系统登记轮次、评价与结论
        permission: 面试.记录
        page: 面试记录页
        audit: true
        decision:
          - {when: 面试通过并决定录用, goto: 3}
          - {when: otherwise, goto: 5}
      - actor: SH-E1
        where: in_system
        command: 作出录用决定
        aggregate: AGG-62
        desc: 录用结论、拟入职日、拟任职职位与职级；拟任职位须启用（规则候选 R-02，拒绝）。用人经理即归属对象责任人，自行决定，不另设审批（V-8 推荐；A8 有「录用审批表」，见 QC）。〔聚合稿将「录用决定已作出」挂在本命令；候选人答复在其后，见 notes 结构问题〕
        permission: 录用决定.作出
        page: 录用决定页
        audit: true
        pending: V-8
        notify: [{to: SH-E6, how: 企业微信待办}]
      - actor: SH-E6
        where: offline
        evidence: [候选人确认入职日的回执（邮件或签回的录用通知）, 确认日, 确认的入职日]
        command: 〔缺〕登记候选人答复
        aggregate: AGG-62
        emits: [录用决定已作出]
        desc: 录用通知书线下或邮件发出，候选人接受或放弃；接受则本步发「录用决定已作出」，触发 PRC-83（候选人确认入职日后办理入职）
        permission: 候选人.登记答复
        page: 录用决定页
        audit: true
        added_in: closeout
        pending: V-19
        timeout: {after: "P7D", escalate_to: SH-E1, interrupting: false}   # 录用通知发出后答复期限（V-19 待定），逾期提醒用人经理决定是否撤销录用
        outcome: 候选人已放弃
        decision:
          - {when: 候选人确认入职日期, goto: PRC-83}
          - {when: otherwise, goto: end}      # 候选人放弃或录用决定撤销（放弃命令缺：PG-09）
      - actor: SH-E1
        where: in_system
        branch: 未录用
        command: 标记未录用
        aggregate: AGG-62
        desc: 通知候选人线下（邮件或电话），本系统不记通知
        permission: 候选人.标记未录用
        page: 面试记录页
        audit: true
        outcome: 未录用
    notes: 候选人个人信息按 ADR-0043 分级，数据组表级处理；保留期待 one-data 按 D12 登记。本流程无人工审批（录用决定是用人经理对自己所辖的决定）；是否另设录用审批待用户 V-8。

  - id: PRC-83
    name: 办理入职与任职
    trigger:
      type: event
      events: [{event: 录用决定已作出, aggregate: AGG-62}]
      desc: 候选人确认入职日后，人力办理入职（同 BC）
    triggers:
      - {type: event, name: "录用决定已作出", event: 录用决定已作出, bc: B-13}
    stages: [VS-07.3]
    owner_bc: B-13
    human_orchestration: false
    migration: "已在职员工的人员、任职版本、劳动合同全量迁入（U-3、U-4，S17）；在途（待入职）按当前状态迁入，已登记未到入职日的须重新排定「入职生效」定时；迁入不发入职已登记与 Employed，不触发 PRC-84、PRC-137（ADR-0036 M7）；A8 员工入职模板（OA_PROCESS_INVENTORY 第 56 行，在途 1）随迁入对账"
    scope: "人力按法人与组织数据范围；用人经理看所辖新员工的入职与任职"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "劳动合同的提交人（人力）与批准人（新员工归属组织单元负责人）不得为同一人"}
    outcomes: [入职已办理]
    scenarios: [PRC-83-S01, PRC-83-S02, PRC-83-S03, PRC-83-S04, PRC-83-S05, PRC-83-S06]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "登记入职、建立任职、提交并登记劳动合同", approval_right: "无（劳动合同批准由部门负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：入职与合同事务）"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对新员工所在组织单元的用人负责", approval_right: "批准劳动合同（类型级，单级）", department_hint: "新员工所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人 = 新员工归属组织单元的责任人（cost_object_owner），劳动合同单级批准
      - {id: SH-H1, as: external, org_needs: {responsibility: "确认入职日、签署劳动合同", approval_right: "无", department_hint: "（外部）", position_hint: "候选人（入职前）"}}       # 候选人：确认入职日、签合同
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉新员工入职与任职", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理"}}       # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记入职
        aggregate: AGG-62
        emits: [〔缺〕入职已登记]        # S3；PG-01
        desc: 填入职日（人事业务生效日，S2）；用工类型；工号由本系统发号
        permission: 入职.登记
        page: 入职登记页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕入职已登记}   # 触发 PRC-137（S4、S5）
        decision:
          - {when: 入职日不晚于今天, goto: 2}
          - {when: otherwise, goto: 2}      # 提前登记：第 2 步在入职日到时由系统执行
      - actor: system
        where: automatic
        on_time: 入职日到达（当天开始时）
        command: 〔缺〕入职生效
        aggregate: AGG-62
        emits: [Employed]
        desc: 人员状态由「待入职」转「在职」；补登时立即执行，生效日仍为登记的入职日（S2）
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: Employed}               # 触发 PRC-84
          - {mode: event, direction: out, bc: platform.identity, name: Employed}  # 放行登录（S4）
      - actor: SH-E6
        where: in_system
        command: 建立任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 组织单元、职位、职级、汇报线、主 / 兼；生效日默认等于入职日（S9）
        permission: 任职.建立
        page: 任职维护页
        audit: true
        decision:
          - {when: 与该人员已有主任职区间重叠, goto: 3, rule: INV-62}    # INV-62 拒绝，改正后重提
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 默认角色与数据范围（S10）
      - actor: SH-E6
        where: in_system
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位（法人口径之一，S13）、期限、试用期
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        legal_entity: 用人单位
        notify: [{to: SH-M1, how: 企业微信待办}]
        decision:
          - {when: 试用期超过法定上限, goto: 4, rule: INV-14}            # INV-14 拒绝
          - {when: otherwise, goto: 5}
      - actor: SH-M1
        where: in_system
        command: 批准劳动合同
        aggregate: AGG-67
        approval:
          doc_type: 劳动合同批准
          engine: aggregate                                # B-13 聚合内单级批准，不经 platform.approval（S11），故无审批平台回调
          approver: SH-M1                      # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 4                                     # 退回人力改合同（驳回命令〔缺〕，PG-09）
          why_human: "合同期限、岗位与薪酬约定是否与录用决定一致、用人单位是否正确是法律与管理判断；法定试用期上限已由 INV-14 拒绝，不属人工判断"
        permission: 劳动合同.批准
        page: 劳动合同审批页
        audit: true
        pending: V-18
        decision:
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 4}                     # 驳回：退回人力改合同
      - actor: SH-E6
        where: offline
        evidence: [已签署劳动合同扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 候选人（SH-H1）线下或电子签署，人力登记签署日
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        outcome: 入职已办理
        decision:
          - {when: 用工满一个月仍未签订, goto: 6}          # P-05 提醒，不拒绝（S12）
          - {when: otherwise, goto: end}    # 三口径预警移至 B-15 事件策略（S-20）

  - id: PRC-84
    name: 入职后参保增员与建立薪酬档案
    trigger:
      type: event
      events: [{event: Employed, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "入职生效", event: Employed, bc: B-13}
    stages: [VS-07.3]
    owner_bc: B-15
    human_orchestration: false
    migration: "历史参保增员记录与薪酬档案随 AGG-74、AGG-93 全量迁入（U-3、U-4），薪酬档案按生效日版本回放；迁入不发事件，不触发本流程（ADR-0036 M7）"
    scope: "人力（薪酬与社保）按法人范围；薪酬属敏感个人信息，ADR-0043 最高访问级别"
    outcomes: [薪酬档案已建立]
    scenarios: [PRC-84-S01, PRC-84-S02, PRC-84-S03]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理参保增员并建立薪酬档案", approval_right: "无", department_hint: "人力资源部（薪酬与社保）", position_hint: "薪酬与社保专员（职能：参保经办与薪酬档案）"}}      # 人力（薪酬与社保）
    steps:
      - actor: SH-E6
        where: offline
        evidence: [社保增员回执, 公积金增员回执, 办理日]
        command: 参保增员
        aggregate: AGG-74
        emits: [参保已增员]
        desc: 入职 30 日内办理，逾期提醒（P-32）
        permission: 参保.增员
        page: 参保登记页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P30D", escalate_to: SH-M1, interrupting: false}   # P-32 逾期提醒，升级给职能高管〔推〕
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Employed}
        decision:
          - {when: 用工类型为退休返聘或实习, goto: 2}   # 不参保（用户已定 T-4）
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: in_system
        command: 建立薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪酬属性版本生效日 = 入职日（S2、S15）
        permission: 薪酬档案.建立
        page: 薪酬档案维护页
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与任职}
        decision:
          - {when: otherwise, goto: end}

  - id: PRC-85
    name: 试用期评估与转正
    trigger: {type: time, desc: 试用期届满前（P-46）}
    triggers:
      - {type: time, name: "试用期届满前 N 日生成评估待办（N 待用户定）"}
    stages: [VS-07.3, VS-13.2]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "试用期评估与转正申请全量迁入（OA_PROCESS_INVENTORY 第 59、61、63、75 行：A8 试用期评估流程第一、二个月、试用期员工转正申请、转正申请表；在途合计 6 + 8 + 3 + 7）；在途按当前状态迁入；迁入不触发转正事件与薪酬联动（ADR-0036 M7）"
    scope: "用人经理看所辖员工；人力看全部；评估内容限评估人、被评人与人力（ADR-0043）"
    outcomes: [已转正, 转入离职办理]
    scenarios: [PRC-85-S01, PRC-85-S02, PRC-85-S03, PRC-85-S04]
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制并确认试用期绩效评估", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理（职能：试用期评估人）"}}
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理转正", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员（职能：办理转正与用工状态变更）"}}      # 人力
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉转正结果", approval_right: "无", department_hint: "所属部门", position_hint: "被评员工"}}       # 被评员工收到转正结果通知
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制试用期绩效评估
        aggregate: AGG-106
        desc: 由到期定时提醒触发（定时命令约定缺：PG-10）；评估人是用人经理
        permission: 绩效评估.编制
        page: 试用期评估编辑页
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]
        pending: V-12
        timeout: {after: "P7D", escalate_to: SH-E6, interrupting: false}   # 提醒期限待用户定（V-12）
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        desc: INV-114：同期同类型只一份，确认后不可改；事件须带评估类型，供 B-15 区分月度 / 试用期
        permission: 绩效评估.确认
        page: 试用期评估编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}   # 奖金核定依据，聚合稿已登记订阅方
      - actor: SH-E6
        where: in_system
        command: 办理转正
        aggregate: AGG-62
        emits: [〔缺〕转正已办理]
        desc: 转正前读评估（P-46）；评估结论是转正输入，不是拒绝条件。转正日为业务生效日（U-12），可提前登记、到日生效；用工状态由「试用期」转「正式」。不予转正的依据与批准走 PRC-128（公司单方终止，由归属组织单元责任人批准），V-10
        permission: 转正.办理
        page: 转正办理页
        audit: true
        pending: V-12
        notify: [{to: SH-E3, how: 企业微信通知}, {to: SH-E1, how: 企业微信通知}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: false}   # 试用期届满仍未办理转正或终止的超期提醒（天数待用户 V-12）
        outcome: 已转正
        decision:
          - {when: 公司决定不予转正, goto: PRC-128}
          - {when: otherwise, goto: end}
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕转正已办理}   # B-15 订阅后在 PRC-123 生成待办复核转正后薪酬（S-42，PG-10）；聚合稿现只发内部事件
    notes: "转正后薪酬是否调整由 B-15 自己的调薪流程处理，本流程只发事件（PG-10）。无人工审批：转正是评估确认后的登记，不予转正转入 PRC-128（保留审批）。"

  - id: PRC-88
    name: 编制、批准并基线化经营计划与预算
    trigger:
      type: time
      desc: 经营计划周期开始
    stages: [VS-09.1, VS-09.3]
    owner_bc: B-18
    human_orchestration: true
    human_note: 计划审批、调整产生新版本
    migration: "全部历史迁入（U-1–U-4）：已基线的版本原样迁为基线，不可变；编制中与审批中的按当前状态迁入；预算账户与占用、消耗、释放历史随迁。来源待取证"
    scope: "经营计划与预算按组织单元范围可见；管理层与财务经办"
    segregation:
      - {roles: [SH-M1], rule: "编制人与审批人不得为同一人；责任人就是编制人时按 AR-11 由其上级审批"}
    triggers:
      - {type: time, name: 经营计划周期开始（年度、季度）}
      - {type: human, name: 经营复盘后调整计划（VS-09.3 退出条件：计划新版本）}
    outcomes: [已基线化, 预算账户已开立, 已调整, 已撤回, 已作废]
    scenarios: [PRC-88-S01, PRC-88-S02, PRC-88-S03, PRC-88-S04, PRC-88-S05, PRC-88-S06, PRC-88-S07, PRC-88-S08, PRC-88-S09]
    roles:
      - {id: SH-M1, as: initiator, org_needs: {responsibility: 编制所辖组织单元的经营计划版本并提交审批, approval_right: 无（编制与提交）, department_hint: 计划归属组织单元（部门、事业部；公司级为管理层）, position_hint: 组织单元负责人或其指定的计划编制人}}
      - {id: SH-M1, as: approver, org_needs: {responsibility: 对本组织单元经营计划的可达性与资源取舍负责, approval_right: 经营计划审批（实例级，计划归属组织单元的责任人）, department_hint: 计划归属组织单元（公司级为管理层）, position_hint: 组织单元负责人（部门负责人）；公司级为管理层负责人}}        # 审批人是计划归属组织单元的责任人，与编制人分离见 segregation
      - {id: SH-E6, as: performer, org_needs: {responsibility: 为预算类基线开立预算账户，在基线额度总额内调剂账户额度, approval_right: 无（账户级调剂由规则守卫，不设审批）, department_hint: 财务部门, position_hint: 预算管理与预算会计职能岗}}       # 财务
      - {id: SH-O1, as: informed, org_needs: {responsibility: 获知经营计划基线, approval_right: 无, department_hint: 不适用（股东和合伙人）, position_hint: 不适用}}        # VS-09 价值接收方；不参与动作
    steps:
      - actor: SH-M1
        where: in_system
        command: 编制经营计划版本
        aggregate: AGG-79
        desc: 目标值按组织 × 期间 × 指标；目标类型含预算、承诺、挑战、预测、减值计划（terms 目标类型）；复盘后调整另起新版本，不改已基线版本（INV-101）
        permission: 经营计划.编制
        page: 经营计划编辑页
        decision:
          - {when: 编制人放弃编制中的草稿, goto: 9}
          - {when: otherwise, goto: 2}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕提交经营计划审批
        aggregate: AGG-79
        gap: G-02
        desc: 提交审批的命令聚合稿未列（同 AGG-12 的「提交报价评审」写法）
        permission: 经营计划.提交审批
        page: 经营计划编辑页
        notify: [{to: SH-M1, how: 企业微信待办}]      # 通知归属组织单元的责任人
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}

      - actor: SH-M1
        platform_task: true
        service: platform.approval
        where: in_system
        command: 经营计划审批
        desc: 审批人按计划归属组织单元解析为其责任人；方案是否可达、资源取舍是判断，不能规则化；基线不可变由 INV-101 守卫
        approval:
          engine: platform.approval
          doc_type: 经营计划审批
          approver: cost_object_owner     # 归属对象是组织单元，其责任人即部门负责人（公司级计划为管理层负责人）
          escalation_rules: [AR-11, AR-12]  # 责任人就是编制人本人 / 责任人缺位；AR-01、02 的金额阈值不适用（计划不是金额单据）
          why_human: 目标值与资源取舍是否合理、是否可达，需要责任人凭经营判断，规则只能守「基线不可变」「编制人不审自己」，不能替代判断
          on_reject: 4
        withdraw: {to: end, outcome: 已撤回}   # 审批未结束前，编制人可撤回提交（〔缺〕撤回经营计划审批，见 notes 新用语）
        permission: 经营计划.审批
        page: 经营计划审批待办
        notify: [{to: SH-M1, how: 企业微信待办}]
        audit: true
        decision:
          - {when: 审批通过, goto: 5}
          - {when: otherwise, goto: 4}

      - actor: platform
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回经营计划审批
        aggregate: AGG-79
        desc: 审批驳回的回调；退回编制（版本回到编制中）
        notify: [{to: SH-M1, how: 企业微信通知}]      # 通知编制人
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: 1}

      - actor: platform
        where: automatic
        command: 〔缺〕通过经营计划审批
        aggregate: AGG-79
        desc: 审批通过的回调
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}

      - actor: system
        where: automatic
        command: 基线化经营计划
        aggregate: AGG-79
        emits: [经营计划已基线化]
        desc: 审批通过即自动基线化，人的判断已在审批完成，不再设人工确认；基线不可变，只出新版本（INV-101）；事件仅分析
        notify: [{to: SH-E6, how: 企业微信通知}]      # 预算类通知财务开立账户
        audit: true
        metric_event: true
        decision:
          - {when: 目标类型为预算, goto: 7}
          - {when: otherwise, goto: end}
        outcome: 已基线化                 # 非预算类型在此结束

      - actor: SH-E6
        where: in_system
        command: 开立预算账户
        aggregate: AGG-80
        pending: vs0911-待定1              # 预算占用超额拦截还是预警未定，影响占用步骤
        desc: 预算基线按维度树逐级生成预算账户（terms 预算分解）；开立后采购、报销等调用预算占用（占用与释放步骤在 PRC-70、PRC-87，不在本流程）
        permission: 预算账户.开立
        page: 预算账户管理页
        cross_bc:
          - {mode: api, direction: in, bc: B-11, name: 预算占用}       # B-11 → B-18 api 边已有
          - {mode: api, direction: in, bc: B-12, name: 预算占用}       # B-12 → B-18 api 边已有
        decision:
          - {when: 预算期内出现调整需求, goto: 8}
          - {when: otherwise, goto: end, outcome: 预算账户已开立}
        outcome: 预算账户已开立

      - actor: SH-E6
        where: in_system
        on_time: 预算期内出现调整需求
        command: 调整预算
        aggregate: AGG-80
        emits: [BudgetAdjusted]
        desc: 账户级调整只在已基线额度总额内调剂，由规则守卫（超出即拒绝，改走新版本，不设审批）；terms 的预算调整是「产生预算基线新版本的受控变更」，聚合稿 AGG-80 的调整预算是账户命令，两者口径不一致，见 NOTES 结构问题 2
        permission: 预算账户.调整
        page: 预算账户调整页
        audit: true
        metric_event: true
        decision:
          - {when: 调整超出基线额度总额或要改目标值（规则拒绝）, goto: 1}   # 受控变更走新版本，INV-101
          - {when: otherwise, goto: end}
        outcome: 已调整

      - actor: SH-M1
        where: in_system
        entry: 编制人放弃编制中的草稿
        branch: 放弃
        command: 作废经营计划草稿
        aggregate: AGG-79
        desc: 仅编制中的版本可放弃（INV-101）：审批中须先撤回再作废，基线不可作废（只出新版本）；草稿未提交、无下游引用，编制人自行作废，不设审批，原因必填并留审计；作废为终态，不再进入审批，要继续须另起新版本
        permission: 经营计划.作废
        page: 经营计划编辑页
        audit: true
        decision:
          - {when: otherwise, goto: end}
        outcome: 已作废
    notes: 基线不可变，只出新版本（INV-101）；复盘后调整计划也走本流程。预算账户拦截或预警未定（INV-102、〔支研〕问题 11），影响占用步骤，见 NOTES 待用户定 1。账户级预算调整不设审批：额度总额内由财务调剂并留审计，超出由规则拒绝并改走新版本审批。

  - id: PRC-89
    name: 编制滚动预测
    trigger:
      type: time
      desc: 每周销售预测承诺；按期现金流预测
    stages: [VS-09.2]
    owner_bc: B-18
    human_orchestration: false
    migration: "全部历史迁入（U-1–U-4）：已闭环的预测版本迁为历史版本；在途 1,212 单（信息图 M-8）提示流程未闭环，迁入后只读归档，不重开。来源待取证"
    scope: "销售预测按人员本人及其管理链可见；现金流预测限财务与管理层"
    triggers:
      - {type: time, name: 每周销售预测承诺（预测周期末含现金流预测）}
    outcomes: [预测版本已编制, 现金流预测已编制, 已提醒]
    scenarios: [PRC-89-S01, PRC-89-S02, PRC-89-S03]
    roles:
      - {id: SH-E5, as: initiator, org_needs: {responsibility: 按周编制本人的销售预测版本, approval_right: 无（预测不审批）, department_hint: 市场与客户部门, position_hint: 市场和客户经理职能岗}}       # 市场和客户经理
      - {id: SH-E6, as: performer, org_needs: {responsibility: 在预测周期末编制现金流预测, approval_right: 无, department_hint: 财务部门, position_hint: 现金流与资金预测职能岗}}       # 财务
      - {id: SH-E2, as: performer, org_needs: {responsibility: VS-09.2 参与者；本骨架无其动作，待用户确认, approval_right: 无, department_hint: 项目管理相关部门, position_hint: 项目经理职能岗}}       # VS-09.2 参与者含项目经理；本骨架无其动作，待用户确认（NOTES 待用户定 4）
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知预测与逾期未报升级, approval_right: 无, department_hint: 管理层, position_hint: 管理层负责人}}
    steps:
      - actor: SH-E5
        where: in_system
        on_time: 每周
        command: 编制预测版本
        aggregate: AGG-79
        desc: 经营计划类型「预测」，目标值按人员 × 期间 × 指标；每次滚动产生新版本（VS-09.2 退出）。预测是预期不是承诺，不设审批
        permission: 预测.编制
        page: 销售预测填报页
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与组织单元}   # B-18 → B-13 api 边已有；AGG-79 引用列缺人员，见 NOTES 接缝问题 1
        timeout: {after: "P7D", escalate_to: SH-M1, interrupting: false}      # 逾期未报的升级对象与期限：待用户定（NOTES 待用户定 4）
        pending: vs0911-待定4
        decision:
          - {when: 本期为现金流预测期, goto: 2}
          - {when: otherwise, goto: end, outcome: 预测版本已编制}
        outcome: 预测版本已编制

      - actor: SH-E6
        where: in_system
        command: 编制现金流预测
        aggregate: AGG-79
        desc: 指标为现金流（信息图 M-9），在当期销售预测版本之后编制；新版本是否经审批成为新基线，VS-09.2 notes 与本流程不一致，见 NOTES 结构问题 3
        permission: 现金流预测.编制
        page: 现金流预测编辑页
        outcome: 现金流预测已编制
    notes: 迁移时在途 1,212 单提示流程未闭环，只读归档（信息图 M-8）。读模型 PRC-90 出具经营月报并复盘属 reporting，不在本片段。现金流预测在当期销售预测之后编制（QC 修订：原为两个独立入口，生成器无多入口写法，见 NOTES 格式问题 1）。

  - id: PRC-107
    name: 知识条目的起草、评审、发布与修订废止
    trigger:
      type: human
      desc: 技术专家主动起草；或项目复盘发布后由复盘编制人决定提炼
    stages: [VS-11.1, VS-11.2, VS-11.3]
    owner_bc: B-30
    human_orchestration: true
    human_note: 有效期届满的修订或废止（定时）；评审意见可退回起草
    merged_from: [PRC-108, PRC-109, PRC-110]
    migration: "全部历史迁入（U-1–U-4）：库内无知识条目实体（信息图 OBJ-110 取证），迁入集合为空；A8 文档中心 567 份文档与项目档案 203 条知识平台文件夹引用是否转条目，见 NOTES 待用户定 5"
    scope: "已发布版本全员可读；起草中与评审中的版本限起草人、评审人与管理员；案例类若含客户信息，访问范围待用户定"
    segregation:
      - {roles: [SH-E4], rule: "起草人与评审人不得为同一人；起草人就是归属责任人时按 AR-11 由其上级评审"}
    triggers:
      - {type: human, name: 技术专家主动起草}
      - {type: call, name: 项目复盘编制人在交付执行中决定提炼，调用创建知识条目, bc: B-04}
    outcomes: [已发布, 已废止]
    scenarios: [PRC-107-S01, PRC-107-S02, PRC-107-S03, PRC-107-S04, PRC-107-S05, PRC-107-S06]
    roles:
      - {id: SH-E4, as: initiator, org_needs: {responsibility: 起草、提交、发布、修订与废止知识条目, approval_right: 无（起草与发布；评审由他人）, department_hint: 技术委员会及各专业组织单元, position_hint: 技术专家（专业组成员）}}       # 技术专家（技术委员会）
      - {id: SH-E4, as: approver, org_needs: {responsibility: 对知识条目的技术正确性、适用范围与有效期负专业责任, approval_right: 知识条目评审（类型级专业角色，聚合内单级评审）, department_hint: 知识条目所属专业类别对应的组织单元（技术委员会）, position_hint: 专业负责人（技术委员会的专业负责人）}}        # 评审人：类型级专业角色（resolve: type），与起草人分离见 segregation
      - {id: SH-E2, as: initiator, org_needs: {responsibility: 在项目复盘后决定提炼并从提炼入口创建知识条目, approval_right: 无, department_hint: 项目管理相关部门, position_hint: 项目经理职能岗（复盘编制人）}}       # 项目经理：复盘编制人，从复盘提炼
      - {id: SH-E3, as: performer, org_needs: {responsibility: 参与起草（VS-11.1）, approval_right: 无, department_hint: 设计与咨询相关部门, position_hint: 设计师和顾问}}       # 设计师和顾问，VS-11.1 参与起草
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知知识条目发布情况, approval_right: 无（评审不由管理层做）, department_hint: 管理层, position_hint: 管理层负责人}}        # VS-11.2 参与者含管理层；评审不由管理层做
    steps:
      - actor: SH-E4
        where: in_system
        command: 创建知识条目
        aggregate: AGG-107
        desc: 技术专家主动创建；从项目复盘提炼时由复盘编制人（SH-E2）在 B-04 的提炼入口调用同一命令，来源复盘 ID 只记录不校验。「项目复盘已发布」订阅方是 B-04 自身，不是本 BC（AGG-103），所以触发写 call，不写 event
        permission: 知识条目.创建
        page: 知识条目编辑页（提炼入口在 B-04 项目复盘详情页）
        cross_bc:
          - {mode: api, direction: in, bc: B-04, name: 创建知识条目}    # B-04 → B-30 api 边已有
        decision:
          - {when: otherwise, goto: 2}

      - actor: SH-E4
        where: in_system
        command: 起草知识条目
        aggregate: AGG-107
        desc: 填类别、适用范围、有效期、正文；退回后也回到本步
        permission: 知识条目.起草
        page: 知识条目编辑页

      - actor: SH-E4
        where: in_system
        command: 提交知识条目评审
        aggregate: AGG-107
        desc: 类别、适用范围、有效期缺一不得提交（规则校验）
        permission: 知识条目.提交评审
        page: 知识条目详情页
        notify: [{to: SH-E4, how: 企业微信待办}]      # 通知评审人（归属专业组织单元的责任人）

      - actor: SH-E4
        where: in_system
        command: 评审知识条目
        aggregate: AGG-107
        desc: 审批人与审批记录在聚合内（审批人经 api 读人员）；B-30 无到 platform.approval 的边，评审是聚合内单级命令（见 NOTES 结构问题 1）
        approval:
          engine: aggregate
          doc_type: 知识条目评审           # B-30 聚合内单级评审命令，不经 platform.approval
          approver: SH-E4                 # 类型级专业角色（resolve: type）：知识条目所属专业类别对应的技术委员会专业负责人
          escalation_rules: [AR-11, AR-12]  # 评审人就是起草人本人 / 专业角色缺位：聚合内由系统改指其上级为审批人；金额类规则不适用
          why_human: 知识内容的技术正确性、适用范围与有效期是否恰当属专业判断，规则只能校验必填项、评审人不是起草人、已发布不可改（INV-115），不能替代
          on_reject: 5
        permission: 知识条目.评审
        page: 知识条目评审页
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取审批人}     # B-30 → B-13 api 边已有
        decision:
          - {when: 评审通过, goto: 6}
          - {when: otherwise, goto: 5}

      - actor: SH-E4
        where: in_system
        branch: 退回
        command: 〔缺〕退回知识条目
        aggregate: AGG-107
        desc: 评审退回起草，v1 注明无独立命令
        permission: 知识条目.退回
        page: 知识条目评审页
        notify: [{to: SH-E4, how: 企业微信通知}]      # 通知起草人
        decision:
          - {when: otherwise, goto: 2}

      - actor: SH-E4
        where: in_system
        command: 发布知识条目
        aggregate: AGG-107
        emits: [知识条目已发布]
        pending: vs0911-待定6               # 案例类含客户信息的访问范围与脱敏确认
        desc: 已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅
        permission: 知识条目.发布
        page: 知识条目详情页
        audit: true
        metric_event: true
        cross_bc:
          - {mode: api, direction: in, bc: B-02, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-03, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-04, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-28, name: 校验知识条目版本存在且未废止}
        decision:
          - {when: 有效期届满或适用范围变化且仍适用, goto: 7}
          - {when: 有效期届满且不再适用, goto: 8}
          - {when: otherwise, goto: end, outcome: 已发布}
        outcome: 已发布                   # 发布后无后续事件则流程在此结束

      - actor: SH-E4
        where: in_system
        on_time: 有效期届满或适用范围变化
        command: 修订知识条目
        aggregate: AGG-107
        emits: [知识条目已修订]
        desc: 产生新版本并引用被取代版本，修订须重新评审（回到提交评审）
        permission: 知识条目.修订
        page: 知识条目编辑页
        audit: true
        metric_event: true
        decision:
          - {when: otherwise, goto: 3}

      - actor: SH-E4
        where: in_system
        on_time: 有效期届满
        command: 废止知识条目
        aggregate: AGG-107
        branch: 废止
        emits: [知识条目已废止]
        desc: 废止后不得被新引用，已有引用不受影响（INV-115）
        permission: 知识条目.废止
        page: 知识条目详情页
        audit: true
        metric_event: true
        outcome: 已废止
    notes: 合并原 PRC-108、109、110（⑥a 评审 H2 c）。已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅。B-04 → B-30 边已有。项目复盘提炼入口的页面在 B-04，命令在本 BC。评审是专业判断，保留人工，按聚合内审批写；补 B-30 → platform.approval 边的影响见 NOTES 结构问题 1。

  - id: PRC-115
    name: 导入考勤记录并补卡
    trigger:
      type: time
      desc: 每日同步考勤来源
    triggers:
      - {type: time, name: "每日拉取企业微信打卡记录（platform.scheduling 定时）"}
      - {type: human, name: "人力修复人员对照后重新拉取"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    migration: "历史打卡（老系统约 79.5 万行）与补卡经迁入通道全量迁入为考勤记录，来源对照区分来源系统；迁入不触发导入流程、不发事件（ADR-0036 M7）"
    scope: "员工本人看自己的考勤；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [考勤已导入, 导入失败已告警, 补卡已记录]
    scenarios: [PRC-115-S01, PRC-115-S02, PRC-115-S03, PRC-115-S04, PRC-115-S05]   # S01 每日导入成功；S02 拉取失败或批次不完整，告警后人力重拉；S03 存在无法对应人员的记录，整批告警；S04 员工补卡，原记录不改，所属月已锁定则计入下月更正行；S05 补卡超次数或时限，被拒回补卡页
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 补卡发起人（员工）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收导入失败告警，修复人员对照后重新拉取", approval_right: "无", department_hint: "人力资源部、信息部门", position_hint: "人力资源专员、考勤管理员"}}       # 人力、信息：导入失败告警
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属补卡", approval_right: "无（补卡不设审批，由次数与时限规则守卫）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：补卡知会
    steps:
      - actor: system
        where: external:企业微信
        evidence: [导入批次号, 拉取日期, 记录条数, 校验和]
        command: 导入考勤记录
        aggregate: AGG-69
        desc: 经 platform.integration 的企业微信适配器每日拉取前一日打卡，转换后调用本 BC 写入；只追加不可改（INV-69），以企业微信记录 ID 幂等；企业微信成员经来源对照解析到人员 ID，解析不到的记录整批告警不静默。补卡只补已导入日期上缺失的打卡，故员工补卡从本步之后进入步骤 3
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 拉取企业微信打卡记录}
        decision:
          - {when: "拉取失败、批次不完整或存在无法对应人员的记录", goto: 2}
          - {when: "员工发现已导入日期缺卡并发起补卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 考勤已导入
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；INV-69；用户事实 intent 2026-10-16-152603（打卡来源企业微信）
      - actor: platform
        where: automatic
        platform_task: true
        service: platform.integration
        command: 告警导入失败
        desc: 告警人力与信息，不静默；缺失日期不得被月度考勤当作“全勤”（PRC-118 步骤 1 校验）；修复后由人力重新拉取（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 导入失败已告警
      - actor: SH-E3
        where: in_system
        entry: 员工对已导入日期的缺卡发起补卡
        branch: 补卡
        command: 补卡
        aggregate: AGG-69
        pending: U4
        desc: 原打卡记录不改，补卡另记一条（INV-69）；规则守卫（不设上级审批）：只能补该日缺失的打卡、每月补卡次数不超上限、不超补卡时限，违反即拒绝并停留在补卡页；所属月份月度考勤已锁定的，补卡照常记录，其对考勤的影响计入下月更正行并标原月份（INV-105）。次数上限与时限待用户定 U4
        permission: 考勤.补卡
        page: 补卡申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "超出每月补卡次数上限、补卡时限，或该日并不缺卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 补卡已记录
    notes: 来源系统已定为企业微信（原 v1 备注“来源系统待定 R2”作废）。外勤、出差、特殊假别等非打卡类考勤聚合稿无命令，见 notes 结构问题。补卡不设人审：证据在打卡与补卡留痕，滥用靠次数与时限规则及月度考勤员工确认、用人经理知会兜底（QC-VS-13.md）。

  - id: PRC-116
    name: 申请并审批请假
    trigger:
      type: human
      desc: 员工提交请假
    triggers:
      - {type: human, name: "员工提交请假"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: true
    human_note: 请假审批、驳回或撤销释放额度；额度与假期规则内的请假自动通过，只有异常单进入人工审批
    migration: "历史请假（老系统请假档案约 2.4 万条）全量迁入为已结实例，已用额度按迁入对账不重算、不发事件；在途（审批中）按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）"
    scope: "员工本人、其审批人、人力；病假等事由随 ADR-0043 分级限制可见范围（事由敏感度 tbd，交 U-11）"
    segregation:
      - {roles: [SH-E3, SH-E1], rule: "申请人不得审批本人请假（申请人本身是部门负责人时，按 AR-11 由其上级审批）"}
    outcomes: [已批准, 已驳回, 已撤销, 已销假, 额度不足被拒, 已提醒]
    scenarios: [PRC-116-S01, PRC-116-S02, PRC-116-S03, PRC-116-S04, PRC-116-S05, PRC-116-S06, PRC-116-S07, PRC-116-S08, PRC-116-S09, PRC-116-S10, PRC-116-S11, PRC-116-S12]   # S01 额度不足被拒；S02 额度内年假自动批准；S03 超阈值长假进入审批并批准；S04 审批驳回释放占用；S05 审批中员工撤回；S06 审批 3 日无人处理，非中断升级提醒管理层（结局已提醒，主线照常）；S07 已批准未开始，员工撤销回冲；S08 请假已开始提前销假回冲；S09 申请人本人是部门负责人，由其上级审批（AR-11）；S10 政策允许透支，进入审批；S11 请假已开始后员工点撤销，转为销假办理；S12 假期类型为补休，冲抵补休额度行并自动批准
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为申请人所在组织单元的责任人，判断异常请假能否离岗", approval_right: "正常一级审批（cost_object_owner 解析结果）；超阈值时 AR-11、AR-12 加审", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 申请人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: informed, org_needs: {responsibility: "接收审批超期或期限提醒的升级，必要时督办", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 审批超期升级对象；暂拟，待 U3
      - {id: SH-E6, as: informed, org_needs: {responsibility: "维护额度与假期规则，接收请假知会", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：额度与假期规则维护方，知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 占用余额
        aggregate: AGG-71
        reads: [AGG-68, AGG-108, AGG-118]
        desc: 与提交请假是员工的同一次操作，分两个聚合两个事务，最终一致；占用以请假 ID 幂等，孤儿占用由定时释放（聚合稿 §7 第 6 条）；同时读工作日历与标准工时版本做按日拆分（取不到当日生效版本须失败并告警，INV-116）。假期类型为补休时（劳动法第四十四条：休息日加班先安排补休），不占年度账户，按到期日先后冲抵员工的补休额度行（PRC-117 计入），请假日不得晚于所冲抵额度行的到期日，额度不足同样被拒
        permission: 请假.提交
        page: 请假申请页
        cross_bc:
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与汇报线}
        decision:
          - {when: "超出可用额度且假期类型政策不允许透支", goto: end, rule: INV-68}
          - {when: otherwise, goto: 2}
        outcome: 额度不足被拒
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        pending: U3
        desc: 起止时刻可跨日、半天或按小时；按日拆分，非工作日计 0（补休作为请假类型同样按日拆分，与年假一样扣减当日最低应填工时，RULE-413）。系统按规则分流：额度内、假期类型规则允许、单次天数不超免审批阈值、该假别无需证明材料的，自动批准并知会直属上级；其余（超阈值、需证明材料的假别、政策允许的透支）进入人工审批。阈值与假别清单待用户定 U3
        permission: 请假.提交
        page: 请假申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "额度内、假期规则允许、天数不超免审批阈值且无需证明材料", goto: 4}
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；INV-68（额度）；AGG-118（假期规则）；阈值待 U3
      - actor: SH-E1               # 部门负责人
        where: in_system
        platform_task: true
        service: platform.approval
        command: 请假审批
        pending: U3
        desc: 只有超阈值长假、需证明材料的假别（是否合规需人看材料）、政策允许的透支才到此；工时单最低时数扣减已批准与待批请假（INV-65，B-06 经 api 读取，只取时长）
        approval:
          engine: platform.approval
          doc_type: 请假审批
          approver: cost_object_owner   # 请假单的归属对象是申请人所在组织单元，其责任人即部门负责人（SH-E1）
          why_human: "超阈值长假、需证明材料的假别与透支需判断业务上能否离岗（项目人力安排）和材料真伪，规则只能校验额度、假期规则与天数，不能代替这一判断；额度内的常规请假已自动通过。"
          escalation_rules: [AR-11, AR-12]
          on_reject: 6
        permission: 请假.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: false}   # 暂拟 3 日无人处理升级提醒管理层，待 U3；非中断，升级后接独立结束事件「已提醒」，主线照常（BPMN_STYLE 第 3 节，S-28）
        withdraw: {to: 7}
        decision:
          - {when: 审批驳回, goto: 6}
          - {when: 员工在审批中撤回, goto: 7}
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起请假审批}
      - actor: system
        where: automatic
        command: 批准请假
        aggregate: AGG-70
        emits: [请假已批准]
        desc: 两条路径汇合：规则内自动批准，或审批平台通过的回调（走审批的路径带“审批已通过”事件）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 批准转已用
        aggregate: AGG-71
        on_event: [{aggregate: AGG-70, event: 请假已批准}]
        desc: 同 BC 事件反应，把占用转为已用；批准后员工仍可在开始前撤销或开始后销假
        decision:
          - {when: 请假开始前员工撤销, goto: 7}
          - {when: 请假期间员工提前结束, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已批准
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回请假
        aggregate: AGG-70
        desc: 审批驳回的回调；聚合稿 AGG-70 没有驳回命令（NOTES 铺开备忘）
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: SH-E3
        where: in_system
        entry: 请假审批中或已批准、尚未开始时，员工撤销
        branch: 撤销
        command: 撤销请假
        aggregate: AGG-70
        emits: [请假已撤销]
        desc: 审批中撤销须同时撤回审批实例（platform.approval 的取消能力，见 notes 接缝问题 1）；已开始的请假不能撤销，只能销假
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}          # 审批中撤销：占用尚未转已用
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}    # 已批准后撤销：占用已转已用，需回冲
        permission: 请假.撤销
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 请假已开始, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已撤销
      - actor: SH-E3
        where: in_system
        entry: 已批准的请假提前结束
        branch: 销假
        command: 销假
        aggregate: AGG-70
        emits: [请假已销假]
        desc: 未休完的部分回冲已用额度；销假是事实登记，不再审批，知会直属上级（U3 推荐，待确认）
        inner:
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}
        permission: 请假.销假
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        outcome: 已销假
    notes: 驳回、撤销、销假的额度回冲在聚合稿没有对应命令（驳回请假、回冲已用额度均为〔缺〕）；补休类回冲回原额度行。v1 把“占用余额”写在“提交请假”之前，骨架保留 v1 顺序并说明为同一次操作。

  - id: PRC-117
    name: 申请并批准加班
    trigger:
      type: human
      desc: 员工或部门提出加班
    triggers:
      - {type: human, name: "员工或用人经理登记加班"}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    human_note: 加班审批已取消：事前登记，事后以打卡核实，批准由系统按规则作出（质检修订，用户原则）；补休额度的计入与到期前提醒均由规则执行，无人审；到期未休与离职时转计发加班工资归 PRC-178（S-41）
    migration: "历史加班（老系统是否有加班记录尚未取证）全量迁入为已结实例；在途按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）；迁入的补偿方式为调休的加班，其未休余额是否迁为补休额度行待取证后定，不凭推测"
    scope: "员工本人、其用人经理、人力；补休额度只本人与人力可见"
    outcomes: [已批准, 已驳回, 补休已休完, 已提醒, 已移交计发]
    scenarios: [PRC-117-S01, PRC-117-S02, PRC-117-S03, PRC-117-S04, PRC-117-S05, PRC-117-S06, PRC-117-S07]   # S01 登记、加班日后打卡核实、自动批准（付薪）；S02 打卡不支持登记的加班时长，驳回；S03 当月累计超 36 小时预警并知会、不拦截；S04 补登超过允许期限，被拒回登记页；S05 休息日加班计补休，批准后计入补休额度，到期前员工休完；S06 到期前员工未排定补休，非中断提醒员工与直属上级，主线照常；S07 有效期届满仍有未休余额，交 PRC-178 转计发加班工资
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责；在补休额度有效期届满前自行排定并休完补休", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属加班登记，也可代员工登记；补休额度到期前收到提醒，与员工排定补休", approval_right: "无（加班不设审批，由打卡核实）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：登记知会；也可代员工登记；补休到期前提醒
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收当月加班超 36 小时的预警", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：当月超 36 小时预警知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 加班申请
        aggregate: AGG-72
        pending: U5
        desc: 登记即事前申请，不设审批：每月累计超 36 小时只预警并留痕，不拦截（P-34；劳动法第四十一条）；补偿方式由加班日类型限定：法定节假日只能付加班费（300%），不补休；休息日由单位安排补休，不能安排补休的付加班费（200%）（劳动法第四十四条：先安排补休，不能安排的支付不低于 200%）；工作日延时按现有补偿政策（口径不变，加班费 150%）；补偿方式不由员工选择：休息日加班默认计补休，确因工作不能安排补休的由直属上级在登记时标明「不能安排补休」，改付加班费；不设审批（劳动法第四十四条「单位安排补休」）。非工作日工时与加班、补休的衔接另定（BC 接缝由 one-architecture 负责，one-rules FD2-05 规则卡作输入）；事后补登的允许期限待用户定 U5
        permission: 加班.申请
        page: 加班申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信通知}]   # 人力仅超 36 小时时才发
        decision:
          - {when: "补登超过允许期限，或加班时段与已批准请假重叠", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        on_time: 加班日考勤已导入
        command: 批准加班
        aggregate: AGG-72
        emits: [加班已批准]
        desc: 以打卡核实代替人工批准：加班日的打卡记录（AGG-69）能支持登记的加班时长即批准（以打卡可证实的时长为准）；批准后汇入当月月度考勤（PRC-118 读取，不订阅），工时单引用加班 ID；补偿方式为补休的，继续计入补休额度
        decision:
          - {when: 打卡记录不支持登记的加班时长, goto: 3}
          - {when: 补偿方式为补休, goto: 4}
          - {when: otherwise, goto: end}
        outcome: 已批准
        # 依据：用户原则「能规则化就不设人审」；加班费真实性由打卡校验，必要性由超 36 小时预警与月度考勤知会兜底
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回加班
        aggregate: AGG-72
        desc: 聚合稿 AGG-72 没有驳回命令；打卡不支持时驳回并告知登记人
        notify: [{to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: system
        where: automatic
        branch: 补休
        command: 〔缺〕计入补休额度
        aggregate: AGG-71
        pending: U15
        desc: 补休额度归 B-27（S-44）：加班批准且直属上级未标「不能安排补休」的休息日加班，按批准时长给员工计一笔补休额度行（假期类型补休）；本期工时（B-06）不读加班审批与补休余额（RULE-412），到期日 = 加班日 + 补休有效期（时长待用户定 U15），额度行不按年度、不随年度结转；同一事务内把加班标记为已计入补休额度，以加班 ID 幂等；由此不再出现「已批准却无人追踪补偿」的加班
        inner:
          - {command: 〔缺〕标记加班已计补休, aggregate: AGG-72}
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（补休额度已计入及到期日）}]
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        calls: PRC-116
        desc: 员工在额度到期日前自行向直属上级排定并休补休：补休走请假（假期类型补休，占用补休额度行，PRC-116）；有效期届满前（时长待用户定 U15）员工与直属上级收到提醒（非中断，主线照常）；补休由单位安排，系统不替单位判断「已安排」，故不因员工未休而作废额度（劳动法第四十四条）
        permission: 请假.提交
        page: 我的请假页
        pending: U15
        timeout: {after: "有效期届满前（时长待用户定 U15）", escalate_to: SH-E1, interrupting: false}   # 有效期长度与提前提醒的时点待 U15，骨架不先定；升级只提醒员工与直属上级，非中断，升级后接独立结束事件「已提醒」，主线照常（BPMN_STYLE 第 3 节）
        decision:
          - {when: 补休额度有效期届满仍有未休余额, goto: PRC-178, outcome: 已移交计发}
          - {when: otherwise, goto: end}
        outcome: 补休已休完
    notes: 加班“已补偿”：付薪的由月度考勤已确认事件触发（PRC-118）；补休的在计入补休额度时标「已计入补休额度」，补偿追踪转到 AGG-71 额度行。补偿方式（加班费或补休）在 AGG-72 记录；补休以请假冲抵（假期类型补休），不再叫「调休」——词表「调休」专指工作日历的调休上班日（B-14）。补休有效期时长待用户定 U15（见 notes 待用户定）；到期与离职都不作废：B-27 在有效期届满时发「补休已到期未休」、离职时随 Separated，由 B-15 经 PRC-178 读取补休余额并计入加班工资（S-41），PRC-117 只管补休登记与到期前提醒。原 v1 的审批节点取消，PRC-117 不再是人工编排流程（catalog 的 human_orchestration 须随之改为 false，见 notes 格式问题）。

  - id: PRC-118
    name: 生成、确认并锁定月度考勤
    trigger:
      type: time
      desc: 月末
    triggers:
      - {type: time, name: "月末生成（platform.scheduling 定时）；确认期限届满锁定"}
      - {type: human, name: "人力在导入修复后重新发起生成"}
      - {type: event, entry: 7, name: "员工离职生效（B-13 发布 Separated；S-42）", event: Separated, bc: B-13}
    stages: [VS-13.1]
    owner_bc: B-27
    human_orchestration: false
    human_note: 员工确认或更正，逾期默认确认并自动锁定（人力不再手工锁定、不再代确认；质检修订）
    migration: "历史月度考勤确认（老系统月 × 一级部门 1,026 单）与人员 × 月不对应：按 NOTES 待用户定数据 2 处理，本流程不触发、不回放；锁定前的在途月份按当前状态迁入"
    scope: "员工本人看自己的；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [已锁定, 已暂缓]
    scenarios: [PRC-118-S01, PRC-118-S02, PRC-118-S03, PRC-118-S04, PRC-118-S05, PRC-118-S06]   # S06 员工离职生效（Separated），离职当月已生成未确认的月度考勤立即默认确认并锁定；S01 员工确认后期限届满自动锁定；S02 员工提出更正，补卡后重新生成再确认；S03 逾期未确认，默认确认并锁定、标记；S04 离职当月，账号已吊销，默认确认并锁定；S05 当月有日期导入失败，暂缓生成
    roles:
      - {id: SH-E3, as: performer, org_needs: {responsibility: "核对并确认本人当月出勤、请假、加班，有异议提出更正", approval_right: "无（确认是数据主体对自己事实的确认，不是审批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 员工：确认或更正本人月度考勤
      - {id: SH-E1, as: informed, org_needs: {responsibility: "接收逾期未确认名单，必要时提醒下属", approval_right: "无", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：逾期未确认名单知会
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：导入失败暂缓知会
    steps:
      - actor: system
        where: automatic
        command: 生成月度考勤
        aggregate: AGG-97
        reads: [AGG-69, AGG-70, AGG-72, AGG-68]
        desc: 汇总考勤、请假、加班，人员 × 月一份；含出勤天数、请假（按类型，含补休）、加班（按补偿方式：付薪的汇入加班费时长，补休的汇入计入补休额度的时长、不进加班费）与更正行；月内存在无导入批次或批次失败的日期时失败并告警，不得当作全勤；审批中的请假不汇入，批准后计入下月更正行并标原月份（INV-105）
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取当月在职与当月离职人员}
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 暂缓时才发
        decision:
          - {when: "当月有日期的考勤导入失败或缺批次", goto: end}
          - {when: "人员当月已离职（离职生效后账号已吊销，本人无法确认）", goto: 7}
          - {when: otherwise, goto: 2}
        outcome: 已暂缓
        # 依据：CLAUDE.md 第 6 条；PRC-115 步骤 2；RULE-363（离职生效即吊销登录）；STEP3 C-17（离职当月仍须确认考勤）
      - actor: SH-E3
        where: in_system
        command: 员工确认
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 员工核对本人当月出勤、请假、加班，无误即确认，有异议提出更正；这是数据主体对自己事实的确认（劳动争议中的出勤证据），不是审批，不设 approval；期限内未确认由系统默认确认，不追办、不人工代确认
        permission: 月度考勤.确认
        page: 我的月度考勤页
        audit: true
        timeout: {after: "P3D", escalate_to: system, interrupting: true}   # 暂拟 3 天，起算点与期限待用户定 U6；届满由系统默认确认（步骤 7）
        decision:
          - {when: 提出更正, goto: 5}
          - {when: 确认期限届满仍未确认, goto: 7}
          - {when: otherwise, goto: 3}
      - actor: system
        where: automatic
        command: 标记加班已补偿
        aggregate: AGG-72
        on_event: [{aggregate: AGG-97, event: 月度考勤已确认}]
        emits: [加班已补偿]
        desc: 订阅月度考勤已确认（同 BC），只标补偿方式为付薪的已批准加班，按加班 ID 幂等；补休的加班在计入补休额度时已标（PRC-117 第 4 步），不在此标
      - actor: system
        where: automatic
        on_time: 员工确认期限届满
        command: 锁定
        aggregate: AGG-97
        emits: [月度考勤已锁定]
        desc: 确认期限届满自动锁定，未确认者标记“逾期未确认”；锁定后不改，补卡、请假、加班变动计入下月并标原月份（INV-105）；月度考勤已锁定是 B-15 薪酬结算可取数的依据
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]     # 逾期未确认名单
        outcome: 已锁定
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 月度考勤已锁定}
      - actor: SH-E3
        where: in_system
        entry: 员工对生成结果有异议
        branch: 提出更正
        command: 补卡
        aggregate: AGG-69
        calls: PRC-115
        desc: 缺卡走补卡；请假或加班有误由员工撤销或重提（PRC-116、PRC-117）；锁定前的更正都回到“重新生成”
        permission: 考勤.补卡
        page: 我的月度考勤页
      - actor: system
        where: automatic
        branch: 重新生成
        command: 〔缺〕重新生成月度考勤
        aggregate: AGG-97
        desc: 确认前依据最新考勤、请假、加班重新汇总，幂等；已确认或已锁定的不可重新生成（INV-105）
        decision:
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        entry: 逾期未确认，或人员当月已离职、本人无法登录确认，或员工离职生效（订阅 B-13 的 Separated，S-42）
        branch: 默认确认
        command: 〔缺〕默认确认月度考勤
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 取代原“人力手工锁定”与“人力代员工确认”：按生成结果默认确认并标记（逾期未确认 / 已离职），留存标记与审计；锁定后的异议走下月更正行。是否改回人力代确认离职人员见 U6。S-42 事件入口：订阅 B-13 的 Separated，对该人员当月（及仍未确认的以往月份）已生成而未确认的月度考勤立即默认确认并标记已离职，不等确认期限；尚未生成的由第 1 步月末处理（已离职分支直达本步）；已确认或已锁定的不重复（幂等）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
        decision:
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；RULE-363；STEP3 C-17（“确认”由默认确认满足，待 U6 确认）
    notes: 补休额度的到期未休与离职转计发不经月度考勤，由 B-15 在 PRC-178 读取 B-27 补休余额并登记，PRC-124 读取本 BC 的登记（月度考勤只汇总当月发生的出勤、请假、加班）。员工确认是员工本人对自己月度考勤的确认，不是审批（质检修订：notes 格式问题 2 作答），故不写 approval，catalog 的 human_orchestration 须改为 false。人力不再手工锁定、不再代确认，减少两次人工；用人经理不复核（U6 推荐不变）。

  # ───────────── VS-13.2 绩效激励 ─────────────

  - id: PRC-120
    name: 评估月度绩效
    trigger:
      type: time
      desc: 评估期间结束
    triggers:
      - {type: time, name: "评估期间结束（platform.scheduling 定时提醒用人经理）"}
    stages: [VS-13.2]
    owner_bc: B-13
    human_orchestration: false
    migration: "历史月度评估（老系统月度评估表 三类模板）全量迁入为已确认评估，不发事件、不触发奖金核定（ADR-0036 M7）"
    scope: "被评人员本人、其用人经理与上级、人力；评估结论按个人信息分级（ADR-0043）"
    outcomes: [已确认, 已更正]
    scenarios: [PRC-120-S01, PRC-120-S02, PRC-120-S03, PRC-120-S04]   # S01 编制、提交、确认；S02 同人同期同类型已有已确认评估被拒；S03 已确认评估发现错误，评估人追加更正记录（未涉及已核定奖金）；S04 更正涉及已核定奖金，人力转 PRC-122 重新草拟
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制、提交并确认下属月度绩效评估，对评估结论负责", approval_right: "无（评估是专业判断）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：评估完成知会
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制绩效评估
        aggregate: AGG-106
        desc: 评估期间结束由系统提醒用人经理；类型为月度；同一人同期同类型只一份（INV-114）
        permission: 绩效评估.编制
        page: 绩效评估编辑页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 同一人同期同类型已有已确认评估, goto: end, rule: INV-114}
          - {when: otherwise, goto: 2}
        outcome: 已确认
      - actor: SH-E1
        where: in_system
        command: 提交绩效评估
        aggregate: AGG-106
        pending: U11
        desc: 提交的接收方（上级复核、被评人阅知或申诉）v1 未写，见 notes 待用户定 U11；本稿不设审批，评估是用人经理的专业判断而非审批，若 U11 定上级复核再按 cost_object_owner 加人工审批
        permission: 绩效评估.提交
        page: 绩效评估编辑页
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        pending: U11
        desc: 确认后不可改（INV-114）；事件须带评估类型（月度 / 试用期），否则 PRC-122 无法区分（notes 结构问题）
        permission: 绩效评估.确认
        page: 绩效评估编辑页
        audit: true
        decision:
          - {when: 已确认评估发现错误, goto: 4}
          - {when: otherwise, goto: end}
        outcome: 已确认
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}
      - actor: SH-E1
        where: in_system
        entry: 已确认评估发现错误
        branch: 更正
        command: 登记绩效更正
        aggregate: AGG-106
        desc: 已确认评估不改（INV-114），评估人追加一条更正记录引用原评估，写明更正项、更正后结论、原因与依据；不设审批：更正是评估人对自己评估的专业修正，留痕在更正记录与审计，原评估与奖金核定的复核由规则守卫（须引用原评估、原因必填）与下游人力知会兜底；更正后若该评估已被奖金核定引用，人力在 PRC-122 人力触发入口重新草拟，系统不自动改已核定奖金
        permission: 绩效评估.更正
        page: 绩效评估更正页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]      # 人力核对是否涉及已核定奖金
        decision:
          - {when: 更正的评估已被奖金核定引用, goto: PRC-122}
          - {when: otherwise, goto: end}
        outcome: 已更正
    notes: 状态流转由用户定，细则为推断，待流程梳理确认（v1）。试用期评估是 PRC-85 的步骤，不在本流程。S-35：更正分支承载 AGG-106 登记绩效更正；不设人审的理由见步 4 desc，若用户认为更正须上级复核再加 approval（cost_object_owner）。

  - id: PRC-121
    name: 制定激励方案
    trigger:
      type: human
      desc: 管理层与人力制定
    triggers:
      - {type: human, name: "人力按管理层要求编制激励方案版本"}
    stages: [VS-13.2]
    owner_bc: B-15
    human_orchestration: true
    human_note: 编制 → 审批 → 到期自动生效
    migration: "历史激励方案（老系统无流程，奖金计提来自线下导入）按方案版本重建后迁入；在途无；迁入不触发审批（ADR-0036 M7）"
    scope: "人力、管理层；方案含薪酬敏感数据"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "方案编制人不得审批本人编制的方案（AR-11 同理）"}
    outcomes: [已生效, 已撤回]
    scenarios: [PRC-121-S01, PRC-121-S02, PRC-121-S03, PRC-121-S04, PRC-121-S05]   # S01 编制、审批通过、到期自动生效；S02 审批驳回退回修改；S03 编制人在审批中撤回；S04 生效日早于已核定奖金所属期，被拒回编制；S05 方案额度合计超阈值，加一级（AR-01）
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "按管理层要求编制激励方案版本（规则与额度），对内容完整性负责", approval_right: "无（编制人不得审批本人编制的方案）", department_hint: "人力资源部", position_hint: "人力资源负责人、薪酬岗"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "作为方案适用范围的责任人，对经营取舍负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值时上加一级", department_hint: "公司管理层", position_hint: "总经理、分管副总、事业部负责人"}}       # 管理层：方案适用范围（法人或事业部）的责任人
    steps:
      - actor: SH-E6               # 人力
        where: in_system
        command: 编制激励方案版本
        aggregate: AGG-75
        desc: 规则与额度；版本化配置（D15），生效日期向后，不追溯已核定奖金；规则守卫：生效日期不得早于已核定奖金所属期，违反即拒绝并停留在编辑页
        permission: 激励方案.编制
        page: 激励方案编辑页
        decision:
          - {when: "生效日期早于已核定奖金所属期", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 激励方案审批
        gap: G-02
        pending: U10
        desc: 方案规则与额度是经营决策，保留人审
        approval:
          engine: platform.approval
          doc_type: 激励方案审批
          approver: cost_object_owner   # 方案的归属对象是其适用范围（法人或事业部），责任人为管理层（SH-M1）
          why_human: "激励方案的规则与额度决定公司对员工的奖金承诺，涉及经营导向与预算取舍，没有客观条件可由规则代替；生效后不可追溯修改，故事先由责任人批准。"
          escalation_rules: [AR-01, AR-02]   # 金额取方案额度上限合计；阈值待 U10
          on_reject: 1
        permission: 激励方案.审批
        page: 审批待办页
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: end, outcome: 已撤回}
        decision:
          - {when: 审批驳回, goto: 1}
          - {when: 编制人在审批中撤回, goto: end}
          - {when: otherwise, goto: 3}
        outcome: 已撤回
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起激励方案审批}
      - actor: system
        where: automatic
        on_time: 方案生效日期到达
        command: 生效激励方案版本
        aggregate: AGG-75
        emits: [激励方案已生效]
        desc: 审批通过后到生效日期自动生效，不再由人力手工点击；前置：审批已通过
        audit: true
        outcome: 已生效
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
    notes: G-02 已处理（AGG-75 引用 platform.approval，intent 114200 F-2）。驳回回到编制，不结束流程，故结局词去掉“已驳回”、加“已撤回”。

  - id: PRC-122
    name: 核定奖金
    trigger:
      type: event
      events:
        - {event: 绩效评估已确认, aggregate: AGG-106, filter: "评估类型为月度"}
    triggers:
      - {type: event, name: "绩效评估已确认（仅月度评估；B-13 发布）"}
      - {type: human, name: "人力在调整评估或激励方案后重新草拟"}
    stages: [VS-13.2]
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统按方案规则草拟，责任人审批核定（质检修订：取消人力手工草拟）
    migration: "历史奖金（2020–2025 历史奖金与奖金计提来自老系统线下导入）按个人 × 期间迁入为已核定；迁入不触发核定（ADR-0036 M7）"
    scope: "人力、管理层与奖金归属人本人；奖金属薪酬敏感信息"
    segregation:
      - {roles: [SH-E1, SH-E1], rule: "用人经理既是评估人又是核定人时，奖金由系统按方案规则草拟、不得由其改额；核定人是被核定人本人时按 AR-11 由其上级核定"}
    outcomes: [已核定, 无需核定, 已中止, 已驳回]
    scenarios: [PRC-122-S01, PRC-122-S02, PRC-122-S03, PRC-122-S04, PRC-122-S05]   # S01 月度评估确认后草拟并核定（全程）；S02 试用期评估确认不触发；S03 没有生效方案或草拟金额超方案额度，已中止并告警人力；S04 责任人驳回；S05 奖金金额超阈值，加一级或两级（AR-01、AR-02）
    roles:
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为被评人所在组织单元的责任人，核对草拟奖金是否有规则看不到的情况", approval_right: "正常一级审批（cost_object_owner 解析结果）；本人是被核定人时由上级核定", department_hint: "被评人所在组织单元", position_hint: "部门负责人、用人经理"}}       # 被评人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "奖金金额超阈值时的上一级责任人", approval_right: "加审一级（AR-02 总经理）", department_hint: "公司管理层", position_hint: "总经理"}}       # 金额超阈值时加审（AR-02 总经理一级）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收奖金草拟已中止或被驳回的告警，调整方案或评估后重新草拟", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力：已中止告警
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕草拟奖金核定
        aggregate: AGG-76
        reads: [AGG-75, AGG-106]
        pending: U10
        desc: 读激励方案与核定依据的绩效评估，按方案规则草拟个人奖金（评分到金额的映射在方案规则里；映射不足以自动算时回到人力草拟，见 U10）；草拟金额超出方案额度的拒绝并告警
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 绩效评估已确认}
          - {mode: api, direction: out, bc: B-13, name: 读取绩效评估结论}
        decision:
          - {when: 评估类型不是月度（如试用期评估），无需核定, goto: end}
          - {when: 没有生效的激励方案版本，或草拟金额超出方案额度，已中止, goto: end}
          - {when: otherwise, goto: 2}
        # 依据：PRC-85 的试用期评估也发“绩效评估已确认”，事件现无评估类型（notes 结构问题 4）；失败并告警人力，不静默（CLAUDE.md 第 6 条）
      - actor: SH-E1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 奖金核定审批
        pending: U10
        desc: 责任人核对草拟奖金，可批准或驳回，不改金额；奖金是对个人的资金承诺，保留人审
        approval:
          engine: platform.approval
          doc_type: 奖金核定审批
          approver: cost_object_owner   # 奖金单的归属对象是被评人所在组织单元，责任人即部门负责人（SH-E1）
          why_human: "奖金按方案规则草拟只是基线，兑现前须由为该成本负责的人确认没有规则看不到的情况（如离岗、争议、业绩调整）；奖金直接增加人工成本并进入薪酬，故保留正常一级。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U10；责任人就是被核定人本人时按 AR-11
          on_reject: 4
        permission: 奖金.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 审批驳回, goto: 4}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起奖金核定审批}
      - actor: system
        where: automatic
        command: 核定奖金
        aggregate: AGG-76
        emits: [奖金已核定]
        desc: 审批通过的回调后核定；发放经月度薪酬结算（PRC-124 读取已核定奖金）
        audit: true
        outcome: 已核定
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回奖金核定
        aggregate: AGG-76
        desc: 审批驳回的回调；聚合稿 AGG-76 没有驳回命令；人力调整后重新草拟（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
    notes: 订阅方 B-15（奖金核定依据）。聚合稿 AGG-76 没有“额度不得超出激励方案”的不变量，草拟时拒绝先按前置检查写，见 notes 结构问题。原 v1 的人力手工草拟取消，catalog 的 human_orchestration 须由 false 改为 true（notes 格式问题）。

  # ───────────── VS-13.3 薪酬结算 ─────────────

  - id: PRC-124
    name: 计算、审核并批准月度薪酬
    trigger:
      type: event
      events:
        - {event: 月度考勤已锁定, aggregate: AGG-97}
    triggers:
      - {type: event, name: "月度考勤已锁定（B-27 发布；按人员 × 月发出，法人当月在职人员全部锁定才能计算）"}
      - {type: human, name: "人力在补齐档案或规则版本后重新发起法人 × 月计算"}
    stages: [VS-13.3]
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统计算，薪酬岗提交审核，财务责任人审批，可退回重算（高风险，保留人审）
    migration: "历史月度薪酬结算（老系统算薪审核表与税金计算、工资条约 2.9 万行）按法人 × 月迁入为已发放 / 已过账结算，只迁结果与证据，不重算、不发事件、不重新过账（ADR-0036 M7）；在途月份按当前状态迁入通用审批"
    scope: "按法人数据范围；薪酬行属敏感个人信息，仅人力薪酬岗与财务主管可见，员工只看本人工资条"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "提交审核者不得审批同一份结算（制单与审批分离，AR-11）；任何人不得审批含本人薪酬行的结算，含本人时由其上级审批（SH-E6 内部分岗：薪酬岗 / 财务主管）"}
    outcomes: [已批准, 待锁定, 已中止]
    scenarios: [PRC-124-S01, PRC-124-S02, PRC-124-S03, PRC-124-S04, PRC-124-S05, PRC-124-S06, PRC-124-S07, PRC-124-S08, PRC-124-S09, PRC-124-S10]   # S01 全部锁定后计算、提交、审批、批准、提交过账候选（全程）；S02 审批驳回退回重算；S03 有人员未锁定，待锁定；S04 缺薪酬档案或规则版本，已中止并告警；S05 审批 2 日无人处理升级；S06 提交人撤回审批；S07 薪酬岗核对异常清单后重算；S08 薪酬总额超阈值，加一级或两级（AR-01、AR-02）；S09 所属期间已关账，过账路由到开放期间并标原期间；S10 当月有补休到期未休或离职结算的补休余额，按加班工资基数 200% 计入加班费
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统计算结果与异常清单，确认无误后提交审核，对输入修正负责", approval_right: "无（提交人不得审批同一份结算）", department_hint: "人力资源部（薪酬岗）", position_hint: "薪酬岗"}}      # 人力（薪酬岗）：核对异常清单、提交审核
      - {id: SH-E6, as: approver, org_needs: {responsibility: "作为薪酬法人的财务责任人，对薪酬支付依据的合理性负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值加审", department_hint: "财务部", position_hint: "财务负责人、财务主管"}}       # 财务（薪酬法人的责任人 / 财务主管）：审批
      - {id: SH-M1, as: informed, org_needs: {responsibility: "知悉薪酬总额；审批超期时接收升级提醒", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 管理层：薪酬总额知会；审批超期升级对象（VS-13.3 participants）
    steps:
      - actor: system
        where: automatic
        command: 计算
        aggregate: AGG-73
        reads: [AGG-97, AGG-74, AGG-76, AGG-93, AGG-62, AGG-119, AGG-120]
        pending: U7
        desc: >-
          薪酬自算（intent 2026-10-16-152603，聚合稿“薪酬汇总导入”口径作废），月度考勤已锁定后由系统自动计算，不再由人手工发起。
          读月度考勤已锁定（含锁定后更正行）、PRC-178 登记的补休转加班工资时长（本 BC AGG-93，按登记所属月读取、已计入结算的登记不重复）、薪酬档案版本（按薪酬期间生效日分段）、参保（缴费基数）、已核定奖金、适用的〔缺〕薪酬规则版本（个税税率表与减除费用、社保公积金比例与基数上下限、计薪天数）、人员与法人。
          按人员：应发 = 档案薪酬项（调薪、入离职当月按计薪日折算）+ 已核定奖金 − 事假等扣款 + 加班费（来自月度考勤的加班补偿方式，付薪部分）+ 补休转计薪费（PRC-178 登记的补休转加班工资时长 × 加班工资基数折算的时薪 × 200%，工资支付暂行规定第十三条；加班工资基数取薪酬档案，取不到则已中止并告警）± 上期锁定后更正行（标原月份）；
          代扣 = 社保公积金个人部分（参保缴费基数 × 规则版本比例）+ 个人所得税（居民个人工资薪金累计预扣，用专项附加扣除与规则版本的税率表）；
          只限法定代扣项目（INV-70）；实发 = 应发 − 代扣；汇总为法人 × 月。同时生成异常清单（环比波动超阈值、实发为负、新入离职折算、含补发补扣行），供薪酬岗核对与审批人参考，只提示不拦截
        audit: true
        legal_entity: 薪酬法人（个税扣缴义务人口径，三口径分别记录，Q-09）
        cross_bc:
          - {mode: api, direction: out, bc: B-27, name: 读取月度考勤确认}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        decision:
          - {when: "该法人当月仍有在职人员月度考勤未锁定，待锁定", goto: end}
          - {when: "有人员没有生效的薪酬档案版本、应参保人员没有参保基数或没有适用的薪酬规则版本，已中止", goto: end}
          - {when: otherwise, goto: 2}
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；阶段进入条件 VS-13.3（法人当月在职人员均已锁定）
      - actor: SH-E6               # 人力（薪酬岗）
        where: in_system
        command: 提交审核
        aggregate: AGG-73
        desc: 薪酬岗核对计算结果与异常清单，确认无误提交审批；发现输入有误可先修正再重算，不进入审批
        permission: 薪酬结算.提交审核
        page: 薪酬结算页
        audit: true
        decision:
          - {when: 核对发现需修正输入后重算, goto: 1}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起薪酬审核}
      - actor: SH-E6               # 财务（薪酬法人的责任人）
        where: in_system
        platform_task: true
        service: platform.approval
        command: 薪酬审核
        pending: U7
        desc: 对全员薪酬的资金支付依据作审批；审批人看到结算汇总与异常清单
        approval:
          engine: platform.approval
          doc_type: 月度薪酬审核
          approver: cost_object_owner   # 薪酬结算的归属对象是薪酬法人（扣缴义务人口径），责任人为该法人的财务负责人 / 财务主管（SH-E6）
          why_human: "月度薪酬是全员资金支付与个税扣缴的依据，规则只能校验口径一致（考勤已锁定、规则版本、法定代扣），无法判断本月薪酬总额与异常波动是否合理；属高风险，保留人审（正常一级，金额超阈值再加审）。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U7
          on_reject: 1
        permission: 薪酬结算.审核
        page: 审批待办页
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P2D", escalate_to: SH-M1, interrupting: false}   # 暂拟 2 日无人处理升级，待 U7（发薪日）
        withdraw: {to: 1}
        decision:
          - {when: 审批驳回，退回重算, goto: 1}
          - {when: 提交人撤回审批, goto: 1}
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 批准
        aggregate: AGG-73
        emits: [薪酬已批准]
        desc: 审批通过的回调；代扣只限法定项目，以法定货币支付（INV-70）；薪酬已批准触发申报（PRC-125）与提交应付薪酬（PRC-126）；退回重算在聚合稿无命令，〔缺〕退回薪酬重算（notes 结构问题 2）
        audit: true
        metric_event: true
        legal_entity: 薪酬法人（个税扣缴义务人口径）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-73
        calls: PRC-92
        desc: 职工薪酬计提；批准时提交一次候选，发放只置“已发放”，“已过账”由事件策略 PRC-134 置位（G-18 已处理）；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "薪酬所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已批准
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 6e 前薪酬汇总导入（FD-30）作废：一次投产后薪酬在本系统自算，AGG-73 对 platform.integration“薪酬汇总导入”的依赖应删除（notes 结构问题）。取批准时提交一次过账候选。薪酬岗“计算”改为系统自动，保留“提交审核”一步作为制单人签收，兼顾高风险的两人控制。

  # ───────────── VS-13.4 申报缴纳 ─────────────

  - id: PRC-125
    name: 申报个税扣缴与社保公积金
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
      - {type: time, name: "每月申报期前提醒（P-39，platform.scheduling）；股息红利并入后无薪酬批准时也须有触发"}
      - {type: human, name: "人力发起本月申报批次"}
      - {type: time, entry: 7, name: "年度缴费基数调整期（社保公积金缴费基数核定通知后；B-15 向 platform.scheduling 登记定时，按 CONVENTIONS 定时约定）"}
    stages: [VS-13.4, VS-06.1]
    owner_bc: B-15
    human_orchestration: false
    migration: "历史申报与缴款（老系统税金计算与申报记录）按所属期 × 类型迁入为已缴款；迁入不触发申报、不重新过账（ADR-0036 M7）"
    scope: "按扣缴义务人法人；申报明细含证件号码等个人信息，仅人力薪酬岗可见"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "申报登记与缴款资金支出（出纳，B-10）不得为同一人；申报数据由系统生成，人工只做外部申报与登记回执（SH-E6 内部分岗）"}
    outcomes: [已申报缴款, 已中止, 已提醒, 基数已调整]
    scenarios: [PRC-125-S01, PRC-125-S02, PRC-125-S03, PRC-125-S04, PRC-125-S05, PRC-125-S06, PRC-125-S07]   # S01 系统生成申报数据，线下申报，登记回执与缴款（全程）；S02 证件信息缺失或金额不一致，已中止并告警；S03 申报被退回更正；S04 股息红利并入同期个税申报；S05 个税申报期限提醒升级（非中断，结局已提醒，主线照常）；S06 所属会计期间已关账，过账路由到开放期间；S07 年度缴费基数调整：登记新参保版本后向社保公积金经办平台申报并回填回执
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统生成的申报数据，在外部渠道办理申报与缴款并登记回执", approval_right: "无（人工只做外部申报与登记；缴款资金支出由出纳另行执行）", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "申报期限提醒的升级对象", approval_right: "无", department_hint: "公司管理层", position_hint: "分管副总"}}       # 申报期限提醒升级对象
      - {id: SH-R2, as: external, org_needs: {responsibility: "受理申报并出具回执", approval_right: "无（外部机构，系统外）", department_hint: "外部（税务、社保、公积金经办机构）", position_hint: "不适用"}}       # 税务、社保、公积金经办机构
    steps:
      - actor: system
        where: automatic
        command: 生成申报
        aggregate: AGG-95
        reads: [AGG-74, AGG-81, AGG-73]
        pending: U1
        desc: 读当月参保增减员、薪酬结算、扣缴义务人法人与所属期（会计期间）；按所属期汇总薪酬批准结果与股息红利并入项，生成个税扣缴申报数据（按自然人电子税务局扣缴客户端的导入格式〔中〕）与社保公积金申报明细；校验人员证件信息、申报金额与薪酬结算一致，不一致失败并告警。申报方式为骨架暂拟的 a)，用户未定，见 notes 待用户定 U1、U2
        legal_entity: 扣缴义务人法人
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]     # 生成完成与已中止都发
        cross_bc:
          - {mode: api, direction: out, bc: B-19, name: 读取会计期间与所属期}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        decision:
          - {when: "人员缺证件信息或申报金额与薪酬结算不一致", goto: end}
          - {when: otherwise, goto: 2}
        outcome: 已中止
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税申报回执, 申报日, 申报明细文件]
        command: 提交申报
        aggregate: AGG-95
        pending: U1
        desc: 个税：人力在扣缴客户端导入申报数据并申报，本系统登记申报回执（个人所得税法第九条、第十条；个人所得税扣缴申报管理办法）。法定期限为次月十五日内〔中，核对原文〕（P-39）
        period_gate: false
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # 自次月 1 日起算，P-39 提醒并升级转管理层督办；非中断，独立结束事件「已提醒」（S-28）
        notify: [{to: SH-E6, how: 企业微信待办}]
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕申报端对接（仅方式 b 时启用）}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费申报回执, 公积金汇缴回执, 申报日]
        command: 提交申报
        aggregate: AGG-95
        emits: [个税与社保公积金申报已提交]
        pending: U2
        desc: 社保公积金：人力在税务或社保经办渠道申报社保费、在公积金管理中心办理汇缴，各地渠道不同〔中〕，本系统登记回执；三类均已提交后发出事件
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税缴款凭证, 社保费与公积金缴款凭证, 缴款日]
        command: 登记缴款
        aggregate: AGG-95
        desc: 税款与社保公积金的缴款资金支出不在 AGG-95，缴款凭证与银行流水的对账见 notes 接缝问题
        audit: true
        decision:
          - {when: 申报被退回或发现差错, goto: 5}
          - {when: otherwise, goto: 6}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [更正申报回执, 更正原因]
        entry: 申报被退回或发现差错
        branch: 更正
        command: 更正申报
        aggregate: AGG-95
        audit: true
        decision:
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-95
        calls: PRC-92
        desc: 个税与社保公积金过账；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已申报缴款
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
      - actor: SH-E6               # 人力
        where: in_system
        entry: 年度缴费基数调整期到达
        branch: 年度基数调整
        command: 调整缴费基数
        aggregate: AGG-74
        desc: 每年缴费年度起始前后，社保公积金缴费基数按核定通知（上年度月平均工资）调整；定时（platform.scheduling）到点生成待办提醒人力；人力核对基数核定依据后在系统登记新参保版本，追加新版本并结束旧版本区间（D17），已减员登记不调整，同一登记同一缴费年度至多一次，更正另出新版本；之后在经办平台申报
        permission: 参保登记.调整缴费基数
        page: 参保登记调整页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 8}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费基数申报回执, 公积金基数调整回执, 办理日]
        command: 提交申报
        aggregate: AGG-95
        desc: 新参保版本出后，人力在社保与公积金经办平台办理基数申报与调整（各地渠道不同〔中〕），办理后回填回执；之后每月参保明细按新版本基数生成
        audit: true
        decision:
          - {when: otherwise, goto: end}
        outcome: 基数已调整
    notes: 申报方式用户未定（intent 2026-10-16-152603 只定“个税公司代扣代缴”），骨架先按 a) 画：系统生成申报数据，人工在外部申报端申报并回填回执（offline + 证据）。“生成申报”由人力手工改为系统自动（质检修订）；S-35：年度基数调整分支（步 7、8）承载 AGG-74 调整缴费基数，年度调整期由定时触发，办理在经办平台（offline 带回执），回填后出新参保版本；v1“申报端回执、更正申报无超时或退回分支，按非人工编排（⑥a 评审 M1）”保留。

  - id: PRC-128
    name: 办理离职
    trigger: {type: human, desc: 员工提出离职或公司决定终止}
    triggers:
      - {type: human, name: "员工提出离职"}
      - {type: human, name: "公司决定终止"}
    stages: [VS-13.6]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "离职申请全量迁入（A8 员工离职申请，OA_PROCESS_INVENTORY 第 62 行，在途 22）；在途按当前状态迁入，已登记未到离职日的须重新排定「离职生效」定时；迁入不触发 Separated、账号吊销与参保减员（ADR-0036 M7）；历史离职人员账号状态按迁入对账（C-7）"
    scope: "员工看本人申请；用人经理与部门负责人看所辖员工；人力看全部（原因类别含健康时限人力，SPI 交 U-11）"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "公司单方终止：发起人（人力）与批准人（被终止员工所属组织单元责任人）不得为同一人"}
    outcomes: [离职已生效, 离职申请已撤回, 终止已驳回, 离职登记已撤销]
    scenarios: [PRC-128-S01, PRC-128-S02, PRC-128-S03, PRC-128-S04, PRC-128-S05, PRC-128-S06, PRC-128-S07, PRC-128-S08]
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出离职申请或撤回", approval_right: "无", department_hint: "所属部门", position_hint: "员工（任一类员工）"}}      # 申请人是任一类员工；stakeholders 无泛员工编号，暂取 SH-E3（格式问题）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对被终止员工所属组织单元负责", approval_right: "批准公司单方终止（类型级，单级）", department_hint: "被终止员工所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人：仅公司单方终止时批准（cost_object_owner）；员工提出的离职不审批
      - {id: SH-E6, as: performer, org_needs: {responsibility: "发起公司终止、登记终止依据、办理离职", approval_right: "无（公司终止的批准由部门负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：离职办理）"}}      # 人力：公司终止的发起、登记依据与离职办理
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉所辖员工离职", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理"}}       # 用人经理
      - {id: SH-E6, as: informed, org_needs: {responsibility: "收到离职提醒，资产归还见 B-31", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：账号与设备）"}}       # 信息（IT）：离职提醒，资产归还见 B-31
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请离职
        aggregate: AGG-62
        desc: 期望离职日（人事业务生效日，U-12）、原因类别、来源。员工本人提出，或线下提出由人力代录入（来源=员工，本系统登记提出日与来源）；公司单方终止由人力以来源=公司终止在同一命令发起，依据与原因类别必填（含试用期不予转正转入，PRC-85）。期望离职日早于法定通知期只预警，不拒绝（规则候选 R-03）
        permission: 离职.申请
        page: 离职申请页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}, {to: SH-M1, how: 企业微信通知}]
        withdraw: {to: 4, outcome: 离职申请已撤回}
        decision:
          - {when: 员工撤回申请, goto: 4}
          - {when: 来源为公司单方终止, goto: 2}
          - {when: otherwise, goto: 5}          # 员工提出的离职劳动者有权解除，不设批准（V-20）
      - actor: SH-M1
        where: in_system
        command: 〔缺〕批准公司终止
        aggregate: AGG-62
        approval:
          engine: aggregate             # B-13 聚合内单级批准（F-3），不经 platform.approval，故无审批平台回调
          doc_type: 公司终止批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 3
          why_human: "单方解除的事由是否成立、证据是否充分是法律与管理判断（劳动合同法第 39、40、41 条），事实真伪规则无法判定；发起人与批准人分离由 segregation 守卫"
        permission: 离职.批准终止
        page: 离职审批页
        audit: true
        added_in: closeout
        pending: V-18
        notify: [{to: SH-E6, how: 企业微信通知}]
        decision:
          - {when: 批准, goto: 5}          # 批准后状态「待离职」，即 VS-13.6 进入条件
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回公司终止
        aggregate: AGG-62
        desc: 批准人驳回公司单方终止，发起人（人力）知悉；聚合稿缺命令（PG-09）
        permission: 离职.驳回终止
        page: 离职审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E6, how: 企业微信通知}]
        outcome: 终止已驳回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E3
        where: in_system
        branch: 撤回
        command: 〔缺〕撤回离职申请
        aggregate: AGG-62
        desc: 员工（或人力代录入的来源=员工）在登记离职日前撤回申请；聚合稿缺命令（PG-09）
        permission: 离职.撤回申请
        page: 离职申请页
        audit: true
        added_in: closeout
        outcome: 离职申请已撤回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: offline
        evidence: [离职协议或解除 / 终止通知的扫描件, 签署或送达日, 离职日]
        command: 〔缺〕登记劳动合同终止依据
        aggregate: AGG-67
        desc: 协商一致、员工辞职或公司解除，均线下签署或送达；本系统登记依据文件与日期。离职证明另行线下出具，不作门（VS-13.6 备注）
        permission: 劳动合同.登记终止依据
        page: 离职办理页
        audit: true
        added_in: closeout
      - actor: SH-E6
        where: in_system
        command: 办理离职
        aggregate: AGG-62
        desc: 登记离职日（人事业务生效日，最后在职日，U-12）与原因类别；可提前登记、到日生效。离职日不晚于登记日（含补登、即时终止）则立即进入步 7。聚合稿原为「→ Separated」，现改为登记，Separated 由步 7 到日发出，不得在登记时提前发（PG-12）
        permission: 离职.办理
        page: 离职办理页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 离职日前员工撤回或公司撤销, goto: 10}
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 离职日结束时（时点待用户定）；离职日不晚于登记日则登记时立即执行
        command: 〔缺〕离职生效
        aggregate: AGG-62
        emits: [Separated]
        desc: 人员状态由「待离职」转「已离职」，生效日为登记的离职日。Separated 在先于步 8、9 发出：吊销会话与访问是安全关键（RULE-363），不得因任职或合同终止失败而推迟
        audit: true
        metric_event: true
        pending: V-1
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: Separated}   # PRC-129 吊销会话、PRC-138 停用企业微信与解绑；§1.4 G-2
          - {mode: event, direction: out, bc: B-15, name: Separated}               # PRC-130 参保减员，PRC-178 读取未休补休余额计入加班工资，并作为最后一期薪酬结算的在职终点
          - {mode: event, direction: out, bc: B-31, name: Separated}               # 生成 IT 资产归还待办（b31 PRC-143；聚合稿回补 §1），B-13 不依赖 B-31
          - {mode: event, direction: out, bc: B-27, name: Separated}               # B-27 默认确认离职当月考勤（PRC-118 第 7 步事件入口）；B-27 → B-13 现只有 api 边（接缝问题）
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职区间止于离职日。因 Separated 已先发出，platform.identity 对已离职人员的「任职已变更」忽略（PG-12）
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 终止日 = 离职日，依据文件见步 5。失败告警人力并重试，不回滚 Separated
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 离职已生效
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 撤销离职登记
        command: 〔缺〕撤销离职登记
        aggregate: AGG-62
        emits: [〔缺〕离职登记已撤销]
        desc: 离职日前撤销，状态回「在职」；B-27、B-31 均只在 Separated 后处置，不订阅本事件（S-42，撤销发生在离职生效前，无待办可取消）；离职日后不可撤销（已吊销访问，需走再入职）
        permission: 离职.撤销登记
        page: 离职办理页
        audit: true
        added_in: closeout
        outcome: 离职登记已撤销
    notes: >
      账号侧见 PRC-129（吊销会话）、PRC-138（角色授予、企业微信停用、解绑）；参保减员见 PRC-130；最后一期薪酬随月度结算发放（B-15），未休补休余额由 B-15 订阅 Separated，经 PRC-178 读取余额并计入加班工资，随最后一期薪酬一并计发（PRC-124）。
      工作交接清单是单据不作门（VS-13.6 备注，Q-D 第 3 项不做）；IT 资产归还待办由 B-31 订阅 Separated 生成，B-13 不读 B-31。
      离职当月考勤确认由谁代确认见 notes 待用户定。员工提出的离职不再设批准（V-20）；公司单方终止保留一级批准。
      「发起公司终止」不再是独立命令，并入「申请离职」的来源取值，以便两个入口汇合在同一首步。

  - id: PRC-136
    name: 调岗（任职变更，按人事业务生效日，触发数据范围复核）
    trigger: {type: human, desc: 人力按人事业务生效日登记调岗、职级调整或汇报线变更}
    triggers:
      - {type: human, name: "人力登记调岗、职级调整或汇报线变更"}
    stages: [VS-07.3]
    owner_bc: B-13
    human_orchestration: true
    human_note: 调岗申请需批准（推荐，待用户定），批准为本聚合命令（F-3）
    type: business
    new: true
    basis: A8 与老系统的人事异动只作证据（OA_PROCESS_INVENTORY 第 65 行「人事异动表」）；U-12；INV-62；词表「待调整权限」（ADR-0032 第 4 项）；Q-09
    migration: "历史人事异动回放为任职版本（A8 人事异动，按人事业务生效日），在途按当前状态迁入（OA_PROCESS_INVENTORY 第 65 行在途 1）；迁入不触发本流程与数据范围复核（ADR-0036 M7）"
    scope: "人力按法人与组织数据范围；用人经理看所辖员工的异动"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "调岗申请的提交人（人力）与批准人（新组织单元责任人）不得为同一人"}
    outcomes: [调岗已生效, 已驳回]
    scenarios: [PRC-136-S01, PRC-136-S02, PRC-136-S03, PRC-136-S04, PRC-136-S05, PRC-136-S06, PRC-136-S07, PRC-136-S08, PRC-136-S09]
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "提交调岗申请，办理合同与薪酬、参保变更", approval_right: "无（调岗批准由新组织单元负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：任职变更事务）"}}      # 人力提交（发起人待用户定）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对接收方组织单元的人工成本负责", approval_right: "批准调岗申请（类型级，单级）", department_hint: "新组织单元", position_hint: "部门负责人（职能：新组织单元责任人）"}}       # 部门负责人 = 新组织单元（接收方，调岗生效后承担人工成本）的责任人，cost_object_owner；原部门负责人只被通知
      - {id: SH-E6, as: performer, org_needs: {responsibility: "信息、薪酬与社保经办", approval_right: "无", department_hint: "信息部门与人力资源部（薪酬与社保）", position_hint: "信息管理员、薪酬与社保专员（职能）"}}      # 信息（IT）、薪酬与社保经办：步 9–12
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉原、新用人经理所辖变动", approval_right: "无", department_hint: "原、新用人部门", position_hint: "用人经理"}}       # 原、新用人经理
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉本人调岗", approval_right: "无", department_hint: "所属部门", position_hint: "被调动员工"}}       # 被调动员工
    steps:
      - actor: SH-E6
        where: in_system
        command: 〔缺〕提交调岗申请
        aggregate: AGG-63
        desc: 员工、新组织单元、新职位与职级、汇报线、主 / 兼、业务生效日（U-12，可提前登记、补登落回真实日期）。读职位目录与组织单元，须未停用，否则拒绝并退回改正（INV-63、INV-60）；系统比对新组织单元默认法人与当前用人单位，标记是否跨法人
        permission: 调岗.提交
        page: 调岗申请页
        audit: true
        added_in: closeout
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: 3, outcome: 已驳回}      # 批准前撤回走「驳回调岗申请」命令（含提交人撤回）
        decision:
          - {when: 新职位已停用或新组织单元已撤销, goto: 1, rule: INV-63}    # INV-63 / INV-60 相关
          - {when: 提交人在批准前撤回, goto: 3}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        command: 〔缺〕批准调岗申请
        aggregate: AGG-63
        approval:
          engine: aggregate             # 同 F-3：B-13 内单级批准，故无审批平台回调；新旧部门会签若需要，移出 B-13（notes 待用户定）
          doc_type: 调岗批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 3
          why_human: "调岗改变成本归属、汇报线与授权范围，接收部门是否需要、是否合适是管理判断；职位有效（INV-63）、任职不重叠（INV-62）、跨法人合同（INV-14）等可校验条件已由规则拒绝；汇报线变更会影响后续审批链，故不设免批"
        permission: 调岗.批准
        page: 调岗审批页
        audit: true
        added_in: closeout
        pending: V-5, V-18
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: 批准且跨法人调动, goto: 4}
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回调岗申请
        aggregate: AGG-63
        desc: 批准人驳回；提交人撤回走同一命令
        permission: 调岗.驳回
        page: 调岗审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E6, how: 企业微信通知}]
        outcome: 已驳回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 跨法人调动
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位变更：与新法人另订劳动合同（或三方变更协议），用人单位为新法人，工龄连续计算；试用期不得重新约定（INV-14 同检）。合同要素须与已批准的调岗一致（规则候选 R-04，拒绝，取代原「批准劳动合同」一级审批）。劳动合同主体变更必须在调岗生效日前完成
        legal_entity: 新用人单位
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        decision:
          - {when: 试用期超过法定上限或合同要素与已批准调岗不一致, goto: 4, rule: INV-14}
          - {when: otherwise, goto: 5}
      - actor: SH-E6
        where: offline
        branch: 跨法人调动
        evidence: [三方变更协议或新劳动合同的扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 员工、原法人、新法人线下签署；签订发「劳动合同已签订」，B-15 的 PRC-145 据此比对三口径（不一致只预警）
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 劳动合同已签订}   # PRC-145 订阅
      - actor: system
        where: automatic
        command: 〔缺〕变更任职
        aggregate: AGG-63
        desc: 原子命令：旧任职区间止于业务生效日，新任职区间始于同日（PG-05）；主任职区间不得重叠（INV-62），兼任不受此限。写入未来版本，此时不对外发事件
        audit: true
        decision:
          - {when: 与该人员其他主任职区间冲突, goto: 1, rule: INV-62}   # 退回改正后重提
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 业务生效日到达（补登 / 当日登记则立即执行）
        command: 〔缺〕任职变更生效
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职已变更须在业务生效日发出（U-12），平台与薪酬才能按真实日期重算
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 订阅方聚合稿现为「仅分析」，需补（PG-02、06）
          - {mode: event, direction: out, bc: B-15, name: 任职已变更}                  # B-15 → B-13 边已有；订阅方聚合稿未登记（PG-07）
        decision:
          - {when: 跨法人调动, goto: 8}
          - {when: otherwise, goto: 9}
      - actor: system
        where: automatic
        branch: 跨法人调动
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 原劳动合同终止于业务生效日，原因为调动（与步 4–5 的新合同衔接，工龄连续）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕重算默认角色与数据范围
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 按新任职重算默认角色与数据范围（具体规则随 ADR-0029 重起草，此处只定触发点）；人工单独授予的角色与范围不自动收回，交步 10
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 沿用 PRC-80 步 6 命令；P-31 现只由组织单元已调整触发，任职已变更触发需新增策略，生成「待调整权限」条目（敏感角色持有人送组织数据管理员与安全审计员，含自定义部门或列出法人的授权送新部门负责人，ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 调岗已生效
        decision:
          - {when: 调岗引起薪酬变化或跨法人调动, goto: 11}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        bc: B-15
        branch: 调岗引起薪酬变化或跨法人
        command: 调整薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪资结构、标准变化；跨法人时个税扣缴义务人随用人单位变更（三口径之一，不一致由 PRC-145 预警）。薪酬属敏感个人信息，ADR-0043 最高访问级别
        permission: 薪酬档案.调整
        page: 薪酬档案维护页
        audit: true
        outcome: 调岗已生效
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
        decision:
          - {when: 跨法人调动, goto: 12}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: offline
        bc: B-15
        branch: 跨法人调动
        evidence: [社保增减员回执, 公积金缴存单位变更回执, 办理日]
        command: 〔缺〕变更参保缴纳主体
        aggregate: AGG-74
        emits: [参保已减员, 参保已增员]
        desc: 原法人减员、新法人增员（缴纳主体变更），人社与公积金网办办理后回填；与入职增员同属 P-32 范畴
        permission: 参保.变更缴纳主体
        page: 参保登记页
        audit: true
        added_in: closeout
        legal_entity: 新用人单位
        outcome: 调岗已生效
    notes: >
      晋升只改职级不换职位（JOB_CATALOG_DRAFT §1 P-1），同走本流程。跨法人调动是劳动合同主体变更，牵涉三口径同时改变（用人单位、数据范围法人、扣缴义务人），
      步 4–5、8、11–12 是该分支；PRC-145 只预警不拒绝。调岗对请假审批人与在途单据是否联动待 B-27 组确认。
      步 9–12 是对「任职已变更」的事件反应，与后续步骤并行，此处按顺序列出。
      原「批准劳动合同」一级审批取消，改由规则 R-04 拒绝（合同要素与已批准调岗不一致）与 INV-14；调岗批准一次即够。

  - id: PRC-137
    name: 入职开通企业微信账号并绑定外部身份
    trigger:
      type: event
      events: [{event: 〔缺〕入职已登记, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "入职已登记", event: 〔缺〕入职已登记, bc: B-13}
    stages: [VS-07.3]
    owner_bc: platform.identity   # J-1 / S-14 one-architecture 同意
    human_orchestration: false
    migration: "不适用（迁入不发事件）；已在职员工的企业微信身份按迁入对账绑定（C-7）"
    scope: "信息部门与人力"
    outcomes: [已开通并绑定, 开通失败已告警]
    scenarios: [PRC-137-S01, PRC-137-S02, PRC-137-S03, PRC-137-S04]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "处理企业微信开通失败", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：企业微信与账号管理）"}}      # 信息（IT）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "入职日未绑定时知悉告警", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员"}}       # 人力，逾期告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "收到开通通知", approval_right: "无", department_hint: "所属部门", position_hint: "新员工"}}       # 新员工，收到开通通知
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕建立待开通登录身份
        desc: 以人员 ID 为键；拟定企业微信 userid = 工号（S6）；登录放行起点 = 入职日（S4）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 〔缺〕入职已登记}
      - actor: system                   # 用户已定 T-1：本系统在登记入职后自动开通（intent 2026-10-16-162821）
        where: external:企业微信
        evidence: [企业微信返回的成员 userid, 开通时间]
        bc: platform.identity
        command: 〔缺〕开通企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动开通成员；入职日前 3 个工作日开通（提前登记时排到该日，晚于该日登记的立即开通）（用户已定 T-1、T-2）
        notify: [{to: SH-E3, how: 企业微信通知}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕开通企业微信成员}
        decision:
          - {when: 企业微信返回失败或 userid 已被占用, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕绑定外部身份
        desc: 按 userid 精确绑定到人员（S6）；入职日前绑定的身份处于「待生效」，订阅 Employed 后放行登录
        audit: true
        metric_event: true
        outcome: 已开通并绑定
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Employed}
        decision:
          - {when: otherwise, goto: end}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        on_time: 开通失败，或入职日已到仍未绑定
        command: 〔缺〕告警开通未完成
        desc: 告警信息部门与人力，不静默（S8）；开通失败由信息部门 1 个工作日内处理（用户已定 T-2）；信息部门修正后重试
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}   # 1 个工作日（T-2）；逾期升级给职能高管〔推〕
        outcome: 开通失败已告警
        decision:
          - {when: 已修正并重试, goto: 2}
          - {when: otherwise, goto: end}

  # ───────────── VS-13.6 离职结清（入转调离成套）─────────────

  - id: PRC-138
    name: 离职停用企业微信账号并解绑
    type: business
    new: true
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 与 PRC-129（吊销会话）互补；离职生效即时，不等企业微信账号停用
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    owner_bc: platform.identity   # S-14（one-architecture 同意 J-1）
    human_orchestration: false
    basis: intent 2026-10-16-134134 Q-03；规则卡 RULE-363；ADR-0027 第 1 项第 6 点、第 7 点；IDENTITY_LIFECYCLE.md 对 C1 设计的含义第 3 条（在职判断以人事离职为准，不以企业微信账号是否存在为准）；S-14
    migration: "不适用（迁入不发事件）；历史离职人员的企业微信状态在迁入对账中核对（C-7）"
    scope: "信息部门与安全审计员"
    outcomes: [已停用并解绑]
    scenarios: [PRC-138-S01, PRC-138-S02, PRC-138-S03, PRC-138-S04]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "手工停用企业微信成员并登记，放行离职处置", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：账号与企业微信管理）"}}      # 信息（IT）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉停用结果", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员"}}       # 人力
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 吊销会话
        calls: PRC-129
        desc: 即时，先于一切企业微信动作
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用登录身份
        desc: 登录以人员在职为准，离职后即使企业微信账号未停用也拒绝登录（含放行起点之后的再登录）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕删除全部角色授予
        desc: ADR-0027 第 1 项第 6 点：逐条写审计。涉及超管（super_admin）或安全审计员持有人，或会使可用超管少于 2 名时，不自动收回，转步 4 待放行（第 7 点，防止全员锁死）；会话吊销与登录身份停用不受此限
        audit: true
        pending: V-17
        decision:
          - {when: 离职者持有超管或安全审计员角色, goto: 4, rule: "ADR-0027 第 7 点"}
          - {when: otherwise, goto: 5}
      - actor: platform
        where: in_system
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕确认放行离职处置
        desc: 另一名超管持有人在系统内人工确认后放行，写审计（ADR-0027 第 7 点，Q-3「暂停，转人工确认」）；放行后继续步 5。这是防全员锁死的安全联锁，不是业务审批：需有人先确认已有接任的可用超管，规则无法替人选定接任者；放行人不得是离职者本人。能否改为「规则拒绝自动收回并告警，待超管补足后自动继续」见 V-17 选项 c
        permission: 身份.放行离职处置
        page: 待放行离职处置页
        audit: true
        pending: V-17
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 5}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用应急账号
        desc: ADR-0027 第 1 项第 6 点：离职者名下的应急账号置为停用；无则跳过（不是错误）
        audit: true
      - actor: system
        where: external:企业微信
        evidence: [企业微信返回的成员停用结果, 停用时间]
        bc: platform.identity
        command: 〔缺〕停用企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动停用成员；与 PRC-137 开通对称（T-1）。以 api 同步调用，不经 B-13，方向 platform.identity → platform.integration 已有边，PG-04 不再适用于停用。失败（成员已不存在视为已停用，不算失败）告警信息部门与人力，不静默（老系统取证 15% 离职者离职后仍成功登录，IDENTITY_LIFECYCLE）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕停用企业微信成员}
        decision:
          - {when: 企业微信返回失败, goto: 8}
          - {when: otherwise, goto: 7}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕解绑外部身份
        desc: 解除企业微信 userid 与人员的绑定，保留绑定历史；userid 不再分配给他人（取工号时与再入职的关系见 notes 结构问题）
        audit: true
        metric_event: true
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: external:企业微信
        evidence: [企业微信管理端的停用记录, 停用时间, 经办人]
        bc: platform.identity
        command: 〔缺〕登记企业微信成员手工停用
        desc: 信息部门在企业微信管理后台手工停用，完成后在本系统登记并重试步 6（已停用视为成功）；这是系统外动作，本系统只登记结果。离职生效后规定时限内仍未停用则升级，不静默（时限待用户 V-13，推荐 1 个工作日，同 T-2）
        permission: 身份.登记企业微信手工处理
        page: 外部身份处理页
        audit: true
        pending: V-13
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}   # 1 个工作日；升级给职能高管〔推〕
        outcome: 已停用并解绑
        decision:
          - {when: 已处理并重试, goto: 6}
          - {when: otherwise, goto: end}
    notes: 参保减员由 PRC-130 另行处理；PRC-137 / 138 成对，开通与停用均由 platform.identity 编排。本流程无业务审批；步 4 是安全联锁，见 V-17。

  - id: PRC-139
    name: 用印申请与用印登记
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 用印申请表单（累计 11,570 单，来源字段待取证）迁为已关闭或已驳回的历史单据；在途 252 单按 ADR-0036 第 5 条 / U-4 在切换前审结或撤回，清不完的以草稿迁入并沿用原编号，由申请人在新系统重新提交（迁入不启动审批实例）；A8 早于投产日停用（C-7）"
    scope: "申请人看自己的单据；行政经办和申请人所在组织单元负责人看相关单据；用印法人所属数据范围 〔推〕"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "申请人不得登记自己申请的用印（〔推〕通行的印章管理职责分离）"}
      - {roles: [SH-E3, SH-M1], rule: "申请人不得批准自己的用印申请（解析出的审批人就是申请人时按 AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "员工申请用印"}
    outcomes: [已关闭, 已驳回, 已撤回]
    scenarios: [PRC-139-S01, PRC-139-S02, PRC-139-S03, PRC-139-S04, PRC-139-S05, PRC-139-S06, PRC-139-S07, PRC-139-S08, PRC-139-S09, PRC-139-S10, PRC-139-S11, PRC-139-S12, PRC-139-S13]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工（报价、合同、证明等用印需求方）；无全员编号，见 notes 格式问题 1
        org_needs:
          responsibility: "提出用印申请，写明印章类别、用印法人、文件与份数；有已批准来源单据（合同、报价等）的，填来源审批实例 ID，并对来源文件的真实性负责"
          approval_right: "无（只提交，不批准、不登记）"
          department_hint: "申请人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # 申请人所在组织单元的负责人（cost_object_owner）
        org_needs:
          responsibility: "对本组织单元员工提出的、没有已批准来源单据的用印申请（证明、介绍信、授权委托书等），判断文件是否应当盖章"
          approval_right: "批准本组织单元员工无来源单据的用印申请（审批平台，加审按 AR-11、AR-12、AR-16；无来源单据的授权委托书、公章、法定代表人名章用印加总经理一级，待用户在 PB31-01 确认）。有已批准来源单据的申请不经此审批"
          department_hint: "申请人所在组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
      - id: SH-E6
        as: performer      # 行政经办：保管印章并登记用印
        org_needs:
          responsibility: "保管印章，按已批准内容（来源审批实例已通过，或负责人已批准）核对后实际盖章，并登记用印时间、份数、经办人，归档扫描件"
          approval_right: "登记用印（不批准申请）"
          department_hint: "行政"
          position_hint: "印章保管与行政事务经办人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交用印申请
        aggregate: AGG-113
        desc: 选印章类别（公章 / 合同专用章 / 法定代表人名章 / 财务章等）和用印法人；填用印事由、文件、份数。有已批准来源单据（合同、报价等）的填其审批实例 ID，系统经 platform.approval 校验该实例已通过、份数不超审批载荷份数，通过则不设人审，直接进入用印登记；校验不过则拒绝提交并告诉申请人原因，不静默。无来源单据的（证明、介绍信、授权委托书等）进入负责人审批（S-40）
        permission: 用印申请.提交
        page: 用印申请编辑页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取用印法人与申请人}          # B-31 → B-13（回补新边）
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}          # B-31 → platform.approval（回补新边）
          - {mode: api, direction: out, bc: platform.approval, name: 校验来源审批实例已通过并读取审批载荷份数}   # 既有边 B-31 → platform.approval，不加 B-31 → B-03 / B-05（S-40）
        decision:
          - {when: 用印法人在申请日不是有效法人主体, goto: 1}     # 规则拒绝并要求改正，不进审批
          - {when: 来源审批实例未通过或申请份数超过审批载荷份数, goto: 1}   # 规则拒绝并告诉申请人原因，不进审批、不静默
          - {when: 来源审批实例已通过且份数不超审批载荷份数, goto: 4}   # 规则核对通过，不设人审，由印章保管人用印登记
          - {when: otherwise, goto: 2}                           # 无来源单据，进负责人审批
      - actor: SH-M1
        where: in_system
        command: 批准用印申请
        aggregate: AGG-113
        emits: [用印申请已批准]           # 仅分析
        desc: 仅无来源单据的申请进入：申请人所在组织单元负责人在审批平台审批；授权委托书，以及公章、法定代表人名章用于无来源单据的，加一级由总经理批（引用 AR-16「无来源单据的高风险用印」，待用户在 PB31-01 确认，pending B31-1）；批准时由 platform.approval 回调本聚合命令
        approval:
          engine: platform.approval
          doc_type: 用印审批
          approver: cost_object_owner     # 申请人所在组织单元的负责人
          escalation_rules: [AR-11, AR-12, AR-16]
          why_human: "无来源单据（证明、介绍信、授权委托书等）没有可由规则核对的已批准上游审批，规则无法判断文件内容是否应当盖章，须申请人所在组织单元负责人判断；有已批准来源单据的申请不进入本步（规则核对通过，不设人审）。"
          on_reject: 3
        withdraw: {to: end, outcome: 已撤回}
        permission: 用印申请.批准
        page: 审批平台待办
        audit: true
        metric_event: true
        pending: B31-1
        notify: [{to: SH-E3, how: 企业微信待办结果}]
        decision:
          - {when: 审批已驳回, goto: 3}
          - {when: otherwise, goto: 4}
      - actor: platform
        where: automatic
        command: 驳回用印申请
        aggregate: AGG-113
        desc: 审批平台回调：申请标为已驳回，写驳回意见
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        decision:
          - {when: otherwise, goto: end, outcome: 已驳回}
        outcome: 已驳回
      - actor: SH-E6
        where: offline
        evidence: [实际用印时间, 用印份数, 经办人, 已盖章文件扫描件〔推〕]
        command: 登记用印
        aggregate: AGG-113
        emits: [已用印]                   # 仅分析
        desc: 印章保管人核对已批准（来源审批实例已通过，或负责人已批准）后在系统外盖章（实物印章），本系统登记结果；可分多次登记，累计份数不得超过批准份数
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
        permission: 用印申请.登记用印
        page: 用印登记页
        audit: true
        metric_event: true
        decision:
          - {when: 累计登记份数超过批准份数, goto: 4}      # INV-新-P2 拒绝
          - {when: 申请未批准, goto: 4}                    # INV-新-P1 拒绝（状态机已挡，兜底）
          - {when: 累计登记份数已达批准份数或经办人确认放弃剩余份数, goto: 5}
          - {when: otherwise, goto: 4}                     # 仍有未用印份数，继续登记
      - actor: system
        where: automatic
        command: 关闭用印申请
        aggregate: AGG-113
        desc: 规则关闭：累计份数达到批准份数或经办人确认放弃剩余份数后自动关闭，不设人工关闭
        outcome: 已关闭
    notes: >
      撤回（申请人在审批中撤回）聚合稿无命令，沿用 platform.approval 通用撤回并回调〔缺〕撤回用印申请，见 notes 新用语。
      来源单据引用审批实例 ID，经既有边 B-31 → platform.approval 校验，不加 B-31 → B-03 / B-05 业务边（S-40）；报价是否须先「已用印」才能发出，若 B-05 要读 B-31 会产生 B-05 → B-31 反向依赖，见 notes 接缝问题 4。

  # ───────────── IT 需求 ─────────────

  - id: PRC-142
    name: IT 需求工单
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 需求工单表单（累计 1,622 单，来源字段待取证）迁为已关闭或已退回的历史工单；在途 105 单按 ADR-0036 第 5 条 / U-4 切换前清空，清不完的以草稿迁入沿用原编号；A8 早于投产日停用（C-7）"
    scope: "提出人看自己的工单；信息部门看全部；需审批类别的审批人看待办单据"
    segregation:
      - {roles: [SH-E3, SH-M1], rule: "提出人不得批准自己的 IT 需求（解析出的审批人就是提出人时按 AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "员工提出 IT 需求"}
    outcomes: [已关闭, 已退回, 已撤回]
    scenarios: [PRC-142-S01, PRC-142-S02, PRC-142-S03, PRC-142-S04, PRC-142-S05, PRC-142-S06, PRC-142-S07, PRC-142-S08, PRC-142-S09]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工，见 notes 格式问题 1
        org_needs:
          responsibility: "提出 IT 需求，描述问题与优先级，解决后确认关闭"
          approval_right: "无（只提交与确认）"
          department_hint: "需求提出人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # 提出人所在组织单元的负责人（仅受控类别表标为需审批的类别）
        org_needs:
          responsibility: "对本组织单元员工提出的受控类别 IT 需求（如权限提升），判断业务必要性与范围"
          approval_right: "批准受控类别 IT 需求（审批平台，加审按 AR-11、AR-12）；并作为受理超时的提醒对象（信息部门负责人）"
          department_hint: "提出人所在组织单元；超时提醒对象为信息（IT）部门"
          position_hint: "组织单元负责人（部门负责人），超时提醒对象为信息部门负责人；岗位体系未定，按职能描述"
      - id: SH-E6
        as: performer      # 信息（IT）：受理与解决
        org_needs:
          responsibility: "受理、处理并解决 IT 需求，登记处理过程与结论，不成立时退回提出人"
          approval_right: "受理、解决、退回 IT 需求（不审批）"
          department_hint: "信息（IT）"
          position_hint: "IT 服务台与运维人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交 IT 需求
        aggregate: AGG-114
        desc: 选需求类别，写描述和优先级；常规类别不审批、直接受理，受控类别表标为需审批的类别（如权限提升〔推〕）才进审批
        permission: IT需求.提交
        page: IT需求提交页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取提出人与处理人}
        pending: B31-3
        decision:
          - {when: 需求类别要求审批, goto: 2}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        command: 批准 IT 需求
        aggregate: AGG-114
        desc: 仅受控类别表标为需审批的类别；提出人所在组织单元的负责人审批
        approval:
          engine: platform.approval
          doc_type: IT需求审批
          approver: cost_object_owner     # 提出人所在组织单元的负责人
          escalation_rules: [AR-11, AR-12]
          why_human: "需审批的类别（如权限提升）是否确有业务必要、范围是否恰当，需要懂业务的部门负责人判断；规则只能依据类别表决定是否进审批，不能判断必要性。"
          on_reject: 7
        withdraw: {to: end, outcome: 已撤回}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}
        permission: IT需求.批准
        page: 审批平台待办
        audit: true
        pending: B31-3
        decision:
          - {when: 审批已驳回, goto: 7}
          - {when: otherwise, goto: 3}
      - actor: SH-E6
        where: in_system
        command: 受理 IT 需求
        aggregate: AGG-114
        desc: 信息部门指定处理人，进入处理中
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}      # 仅经审批的类别
        permission: IT需求.受理
        page: IT需求工作台
        timeout: {after: "P2D", escalate_to: SH-M1, interrupting: false}   # 〔推〕2 个工作日内受理，逾期提醒信息部门负责人（SH-M1 职能高管），待用户定 2
        pending: B31-2
      - actor: SH-E6
        where: in_system
        command: 解决 IT 需求
        aggregate: AGG-114
        emits: [IT 需求已解决]            # 仅分析
        desc: 记录处理过程与处理结论；实际排查在系统外进行，本系统登记过程与结论
        permission: IT需求.解决
        page: IT需求工作台
        metric_event: true
        decision:
          - {when: 需求不成立或无法实现, goto: 6}
          - {when: otherwise, goto: 5}
      - actor: SH-E3
        where: in_system
        command: 关闭 IT 需求
        aggregate: AGG-114
        desc: 提出人确认后关闭；解决后超期未确认由系统代关〔推〕
        permission: IT需求.关闭
        page: IT需求详情页
        timeout: {after: "P5D", escalate_to: system, interrupting: true}   # 〔推〕解决后 5 日未确认自动关闭，待用户定 2
        pending: B31-2
        decision:
          - {when: 无处理结论, goto: 4}      # INV-新-P3 拒绝
          - {when: 提出人认为未解决, goto: 3}
          - {when: otherwise, goto: end, outcome: 已关闭}
        outcome: 已关闭
      - actor: SH-E6
        where: in_system
        command: 退回 IT 需求
        aggregate: AGG-114
        desc: 需求不成立或无法实现时退回提出人，写退回原因
        permission: IT需求.退回
        page: IT需求工作台
        notify: [{to: SH-E3, how: 企业微信}]
        decision:
          - {when: otherwise, goto: end, outcome: 已退回}
        outcome: 已退回
      - actor: platform
        where: automatic
        command: 驳回 IT 需求
        aggregate: AGG-114
        desc: 审批平台回调：需求标为已退回，写驳回意见
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        outcome: 已退回
    notes: 〔缺〕驳回 IT 需求与退回 IT 需求都以「已退回」结束；前者承接审批驳回回调，后者是信息部门主动退回，见 notes 新用语。

  # ───────────── IT 资产使用（B-31 部分）：领用 ─────────────

  - id: PRC-143
    name: IT 资产领用
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 的 IT 资产领用（累计 1）、调拨（139）、报修（128）三类表单迁入使用记录与维修工单（调拨、报修见 PRC-155、143D），须能对应到 B-24 资产卡片（对应方法待取证，见 notes 待用户定 4）；信息变更（137）、内购（3）、报废回收（1）、采购申请不属 B-31，归 B-24 / 采购，由财务组处理；在途调拨 0、报修 2、内购 1 按 ADR-0036 第 5 条 / U-4；A8 早于投产日停用（C-7）"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "使用人不得登记自己的领用（领用登记由资产管理员完成）"}
      - {roles: [SH-E3, SH-M1], rule: "申请人不得批准自己的超标配置领用（AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "申请领用"}
    outcomes: [已领用, 已驳回, 已撤回]
    scenarios: [PRC-143-S01, PRC-143-S02, PRC-143-S03, PRC-143-S04, PRC-143-S05, PRC-143-S06, PRC-143-S07]
    roles:
      - id: SH-E3
        as: initiator      # 使用人（任一员工），见 notes 格式问题 1
        org_needs:
          responsibility: "申请领用 IT 资产，签收设备，并对名下资产负责"
          approval_right: "无（只申请）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # 申请人所在组织单元的负责人（仅超出岗位标准配置时）
        org_needs:
          responsibility: "对本组织单元员工超出岗位标准配置的领用，判断业务需要是否成立"
          approval_right: "批准超出岗位标准配置的领用（审批平台，加审按 AR-11、AR-12）"
          department_hint: "申请人所在组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：交付、登记
        org_needs:
          responsibility: "交付设备并登记领用，保证同一资产同一时刻只有一个使用人"
          approval_right: "登记领用（不批准申请）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请领用资产
        aggregate: AGG-115
        desc: 选 B-24 资产卡片（只引用卡片 ID，不复制卡片信息）；在使用人岗位标准配置内的领用由规则自动通过、只登记，超出标准配置才进审批
        permission: IT资产.申请领用
        page: IT资产领用申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}      # B-31 → B-24（回补新边，intent 152926）
          - {mode: api, direction: out, bc: B-13, name: 读取使用人}
        pending: B31-5
        decision:
          - {when: 资产卡片不存在、已处置或不属 IT 资产类别, goto: 1}
          - {when: 该资产已有未归还的使用人, goto: 1}                      # INV-新-P4 提前拒绝；应先归还或改走调拨
          - {when: 领用的资产类别在使用人岗位标准配置内, goto: 3}           # 规则自动通过，不设审批
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        command: 批准领用
        aggregate: AGG-115
        desc: 仅超出岗位标准配置的领用；申请人所在组织单元负责人审批
        approval:
          engine: platform.approval
          doc_type: IT资产领用审批
          approver: cost_object_owner     # 申请人所在组织单元的负责人
          escalation_rules: [AR-11, AR-12]
          why_human: "超出岗位标准配置的设备由部门承担使用成本，是否确有业务需要要由部门负责人判断；规则只能核对是否在标准配置内，不能判断超配是否合理。"
          on_reject: 4
        withdraw: {to: end, outcome: 已撤回}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}
        permission: IT资产.批准领用
        page: 审批平台待办
        audit: true
        pending: B31-5
        decision:
          - {when: 审批已驳回, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: SH-E6
        where: offline
        evidence: [领用人签收, 交付日期, 设备实物状态〔推〕]
        command: 登记领用
        aggregate: AGG-115
        emits: [资产已领用]               # 仅分析；离职交接可读
        desc: 实物在系统外交付，本系统登记使用人与起始日，打开该卡片的一个使用期间
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}      # 仅超出标准配置、经审批的领用
        permission: IT资产.登记领用
        page: IT资产使用登记页
        audit: true
        metric_event: true
        decision:
          - {when: 该资产已有未归还的使用人, goto: 1}      # INV-新-P4 拒绝（兜底，申请时已提前拒绝）
          - {when: otherwise, goto: end}
        outcome: 已领用
      - actor: platform
        where: automatic
        command: 〔缺〕驳回领用
        aggregate: AGG-115
        desc: 审批平台回调：领用申请标为已驳回
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        outcome: 已驳回
    notes: >
      本流程只画 B-31 领用部分（用户 intent 2026-10-16-152926：IT 资产是固定资产）。
      原 PRC-143 的调拨、归还、报修拆为 PRC-155、143C、143D（多入口，生成器只支持第 1 步入口）；
      报废、盘点、采购申请归 B-24 / 采购（财务组），不在本文件。
      盘点只读 B-31 使用记录核对，建议由财务组在 B-24 流程里写读取（B-24 不依赖 B-31，见接缝问题 2）。

  # ───────────── IT 资产使用：调拨 ─────────────

  - id: PRC-144
    name: 员工活动类申请（周年贺卡、节日活动、创新项目发布）
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 周年贺卡（累计 219）、创新项目发布申请（31）、感恩节活动（2,106，已于 2024-11-11 停用）迁为同一聚合的不同活动类型；在途 周年贺卡 38、创新项目 4、感恩节 75 按 ADR-0036 第 5 条 / U-4 处理（感恩节在途停用已久，建议审结或作废，见 notes 待用户定 9）；A8 早于投产日停用（C-7）"
    scope: "申请人看自己的申请；行政与人力看全部"
    segregation:
      - {roles: [SH-E3, SH-M1], rule: "申请人不得批准自己的活动申请（解析出的审批人就是申请人时按 AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "员工提出活动申请"}
    outcomes: [已完成, 已驳回, 已撤回]
    scenarios: [PRC-144-S01, PRC-144-S02, PRC-144-S03, PRC-144-S04, PRC-144-S05, PRC-144-S06]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工，见 notes 格式问题 1
        org_needs:
          responsibility: "提出员工活动申请，写明活动类型、参与人与费用预估"
          approval_right: "无（只提交）"
          department_hint: "申请人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # 申请人所在组织单元的负责人（仅受控活动类型表标为需审批的类型）
        org_needs:
          responsibility: "对本组织单元提出的节日活动、创新项目发布，判断是否举办与规模"
          approval_right: "批准节日活动、创新项目发布申请（审批平台，加审按 AR-01、AR-11、AR-12）"
          department_hint: "申请人所在组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
      - id: SH-E6
        as: performer      # 行政：组织实施、确认完成
        org_needs:
          responsibility: "组织实施活动并确认完成"
          approval_right: "确认完成（不审批）"
          department_hint: "行政"
          position_hint: "行政事务经办人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交员工活动申请
        aggregate: AGG-116
        desc: 选活动类型（受控参考数据），填参与人、费用预估（只记录引用，不是预算控制）；周年贺卡一类福利型活动只登记，节日活动、创新项目发布进审批
        permission: 员工活动.提交
        page: 员工活动申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取申请人与参与人}
        pending: B31-8
        decision:
          - {when: 活动类型要求审批, goto: 2}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        command: 批准员工活动申请
        aggregate: AGG-116
        emits: [员工活动申请已批准]       # 仅分析
        desc: 申请人所在组织单元的负责人在审批平台审批
        approval:
          engine: platform.approval
          doc_type: 员工活动审批
          approver: cost_object_owner     # 申请人所在组织单元的负责人
          escalation_rules: [AR-01, AR-11, AR-12]
          why_human: "举办活动占用部门工时、资源和费用，是否举办、规模多大要在团队计划内取舍，规则无法判断；费用本身在报销时另按预算规则预警。"
          on_reject: 4
        withdraw: {to: end, outcome: 已撤回}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}
        permission: 员工活动.批准
        page: 审批平台待办
        audit: true
        metric_event: true
        pending: B31-8
        decision:
          - {when: 审批已驳回, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: SH-E6
        where: offline
        evidence: [活动完成确认, 实际参与人〔推〕]
        command: 完成员工活动
        aggregate: AGG-116
        desc: 活动在系统外举办，本系统登记完成；活动费用若报销，由 B-12 费用报销单引用本申请 ID（不校验，B-12 不被本聚合依赖）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}      # 仅经审批的活动类型
        permission: 员工活动.完成
        page: 员工活动详情页
        decision:
          - {when: otherwise, goto: end}
        outcome: 已完成
      - actor: platform
        where: automatic
        command: 驳回员工活动申请
        aggregate: AGG-116
        desc: 审批平台回调：申请标为已驳回，写驳回意见
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        outcome: 已驳回
    notes: 周年贺卡是否由系统按入职周年自动生成（而不是员工申请）A8 无节点证据，见 notes 待用户定 10。

  - id: PRC-155
    name: IT 资产调拨
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：A8 调拨申请表单（累计 139、在途 0）迁入使用期间历史"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "调出使用人不得登记自己的调拨（交接登记由资产管理员完成）"}
    triggers:
      - {type: human, name: "申请调拨"}
    outcomes: [已调拨, 已转领用, 已撤销]
    scenarios: [PRC-155-S01, PRC-155-S02, PRC-155-S03, PRC-155-S04, PRC-155-S05]
    roles:
      - id: SH-E3
        as: initiator      # 调出使用人
        org_needs:
          responsibility: "发起调拨，选定调入使用人，配合交接"
          approval_right: "无（只申请，调拨由规则守卫、不设审批）"
          department_hint: "调出使用人所在组织单元"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：核对并登记交接
        org_needs:
          responsibility: "核对并登记交接，结束调出方使用期间并开启调入方使用期间"
          approval_right: "登记调拨（不批准申请）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-M1
        as: informed      # 调出、调入使用人所在组织单元的负责人：知悉
        org_needs:
          responsibility: "知悉跨组织单元的调拨，对本单元资产使用情况负责"
          approval_right: "无（只知悉；是否改为调入方确认见 notes 待用户定 6）"
          department_hint: "调出方、调入方所在组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 〔缺〕申请调拨资产
        aggregate: AGG-115
        desc: 调出使用人（或资产管理员）选调入使用人；调拨不设人工审批，由规则守卫（同一时刻只有一个使用人、调入使用人须在职），跨组织单元的调拨通知两侧负责人（A8 有调拨申请表单，聚合稿回补只有「调拨资产」命令）
        permission: IT资产.申请调拨
        page: IT资产调拨申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}
          - {mode: api, direction: out, bc: B-13, name: 读取使用人}
        notify: [{to: SH-M1, how: 企业微信（跨组织单元调拨时通知调出、调入两侧负责人）}]
        withdraw: {to: end, outcome: 已撤销}
        pending: B31-6
        decision:
          - {when: 资产没有当前使用人, goto: PRC-143}      # 无使用人的资产走领用，不走调拨
          - {when: 调入使用人在调拨日不是在职员工, goto: 1}
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: offline
        evidence: [调出方与调入方交接确认, 交接日期]
        command: 调拨资产
        aggregate: AGG-115
        emits: [资产已调拨]               # 仅分析
        desc: 实物交接在系统外；本系统同一事务结束调出方的使用期间并开启调入方的使用期间，保证同一时刻只有一个使用人
        permission: IT资产.登记调拨
        page: IT资产使用登记页
        audit: true
        metric_event: true
        decision:
          - {when: 调出方不是该资产当前使用人, goto: 1}      # INV-新-P4 拒绝
          - {when: otherwise, goto: end}
        outcome: 已调拨
    notes: >
      调拨取消人工审批：资产归属与折旧在 B-24，B-31 只换使用人；是否要求跨组织单元调拨由调入方负责人确认，见 notes 待用户定 6。
      〔缺〕批准调拨、〔缺〕驳回调拨两个命令不再需要，见 notes 新用语。

  # ───────────── IT 资产使用：归还 ─────────────

  - id: PRC-156
    name: IT 资产归还
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：归还以使用期间结束日迁入；离职归还待办不迁（切换后由 Separated 事件生成）"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "资产管理员不得验收登记自己名下资产的归还（由另一名管理员或其负责人处理）"}
    triggers:
      - {type: human, name: "资产管理员登记归还"}
      - {type: event, name: "员工已离职", event: Separated, bc: B-13}
    outcomes: [已归还]
    scenarios: [PRC-156-S01, PRC-156-S02, PRC-156-S03, PRC-156-S04]
    roles:
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：验收并登记
        org_needs:
          responsibility: "验收归还的设备并登记归还日，处理离职触发的归还待办"
          approval_right: "登记归还（验收人不得是名下资产自己的管理员）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-E3
        as: informed      # 使用人
        org_needs:
          responsibility: "按要求归还设备，对归还前的资产负责"
          approval_right: "无（只知悉）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: informed      # 离职员工原组织单元负责人：逾期未归还时收到提醒
        org_needs:
          responsibility: "离职员工原组织单元负责人，对逾期未归还的资产收到提醒并督促"
          approval_right: "无（只接收提醒）"
          department_hint: "离职员工原组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E6
        where: offline
        evidence: [归还验收人, 归还日期, 设备实物状态]
        command: 归还资产
        aggregate: AGG-115
        emits: [资产已归还]               # 仅分析；离职交接可读
        desc: 实物验收在系统外，本系统登记归还日并结束使用期间；员工离职事件触发时，系统为该员工名下每件未归还资产生成一个归还待办（即本流程的实例，聚合稿回补 §1 的建议），待办的出现就是本步的开始
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}      # 事件触发时；人工触发无此项
        permission: IT资产.登记归还
        page: IT资产使用登记页
        audit: true
        metric_event: true
        notify: [{to: SH-E6, how: 企业微信待办（事件触发时）}]
        timeout: {after: "P7D", escalate_to: SH-M1, interrupting: false}   # 〔推〕离职后 7 日仍未归还提醒原部门负责人，待用户定 7
        pending: B31-7
        decision:
          - {when: 该资产没有未结束的使用期间, goto: 1}      # 已先行归还或待办重复：拒绝登记，待办由事件处理器取消
          - {when: otherwise, goto: end}
        outcome: 已归还
    notes: >
      原稿的〔缺〕生成归还待办一步取消：事件启动流程实例，实例的第一个任务就是归还待办；订阅 Separated 的 B-31 → B-13 事件边仍需登记（接缝问题 3、V-15）。
      人工触发用于员工在职期间更换设备、资产管理员收回等场景。

  # ───────────── IT 资产使用：报修 ─────────────

  - id: PRC-157
    name: IT 资产报修与维修登记
    type: business
    stages: []
    support: "行政支撑：不在客户价值流上，按 B-31 行政事务查漏（S-31）"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：A8 报修申请表单（累计 128、在途 2）迁为维修工单历史；在途 2 按 U-4 切换前办结"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    triggers:
      - {type: human, name: "报修"}
    outcomes: [已维修登记]
    scenarios: [PRC-157-S01, PRC-157-S02, PRC-157-S03]
    roles:
      - id: SH-E3
        as: initiator      # 使用人
        org_needs:
          responsibility: "发现设备故障时报修，描述故障"
          approval_right: "无（只报修）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：送修并登记维修结果
        org_needs:
          responsibility: "送修或内部处理，并登记维修结果与证据"
          approval_right: "登记维修结果（不审批）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-E6
        as: informed      # 财务（B-24 资产卡片维护人），知悉维修无法修复的结果
        org_needs:
          responsibility: "作为 B-24 资产卡片维护人，知悉维修无法修复的结果并另行发起报废"
          approval_right: "无（只知悉，报废由财务在 B-24 发起）"
          department_hint: "财务"
          position_hint: "固定资产核算与卡片维护人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 报修资产
        aggregate: AGG-121
        desc: 使用人填故障描述，生成维修工单；报修不经审批（维修结果登记与采购、费用报销各走各自的审批；单项维修费用若超限额走采购 / 费控，不属 B-31）
        permission: IT资产.报修
        page: IT资产报修页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}
        decision:
          - {when: 报修人不是该资产当前使用人, goto: 1}      # 规则拒绝，使用人名下才能报修；资产管理员代报时选使用人
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: external:维修服务商
        evidence: [维修单或发票引用, 维修结果, 完成日期]
        command: 登记维修结果
        aggregate: AGG-121
        desc: 维修在系统外（内部处理或送修厂商），无接口，本系统只登记结果与证据；无法修复的资产由财务在 B-24 另行报废，B-31 不发起（B-31 → B-24 只有读取边，见 notes 接缝问题 1）
        permission: IT资产.登记维修结果
        page: IT资产维修工单页
        audit: true
        outcome: 已维修登记
    notes: 维修结果（已修复 / 无法修复）由工单的结果列表达，骨架不分叉。

  # ───────────── 员工活动 ─────────────

event_policies:

  - id: PRC-113
    name: 并入股息红利个税扣缴申报
    trigger:
      type: event
      events:
        - {event: 利润分配已支付, aggregate: AGG-109}
    triggers:
      - {type: event, name: "利润分配已支付（B-10 发布）"}
    stages: [VS-12.2, VS-13.4]
    owner_bc: B-15
    migration: "历史股息红利个税（老系统无独立记录，是否存在待取证）按所属期迁入申报批次；迁入不触发（ADR-0036 M7）"
    outcomes: [已并入申报, 无需扣缴]
    scenarios: [PRC-113-S01, PRC-113-S02]   # S01 自然人股东分红并入当期个税申报；S02 法人股东不扣缴个税
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉申报批次中出现股息红利并入项", approval_right: "无", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}       # 人力：申报批次中出现并入项
      - {id: SH-O1, as: external, org_needs: {responsibility: "自然人股东是个税纳税人，法人股东自行处理所得", approval_right: "无（外部相关方）", department_hint: "外部（股东）", position_hint: "不适用"}}       # 股东：自然人股东是纳税人
    step:
      actor: system
      where: automatic
      command: 并入扣缴申报
      aggregate: AGG-95
      desc: 自然人股东的股息红利所得适用 20% 比例税率，由支付方代扣代缴（个人所得税法第三条、第九条）；并入当期申报批次，实际申报在 PRC-125；法人股东不涉及个税，合伙人的所得性质因被投资主体而异，见 notes 结构问题
      legal_entity: 扣缴义务人法人
      audit: true
      decision:
        - {when: 股东是法人或机构, goto: end, outcome: 无需扣缴}
        - {when: otherwise, goto: end, outcome: 已并入申报}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 利润分配已支付}
    notes: 沿已有边 B-15 → B-10，不新增反向边。扣缴额须在支付前确定，见 notes 接缝问题 4。

  - id: PRC-126
    name: 提交应付薪酬
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
    stages: [VS-13.5]
    owner_bc: B-15
    migration: "历史薪酬的应付（老系统付款申请单-人事约 1.5 千行）作为已结清应付迁入，只迁结果与证据；迁入不触发（ADR-0036 M7）"
    outcomes: [应付已提交]
    scenarios: [PRC-126-S01, PRC-126-S02]   # S01 薪酬批准后提交法人 × 月一笔实发合计；S02 重复触发幂等不重复提交
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "财务知悉待付清单出现应付薪酬，按付款流程办理", approval_right: "无", department_hint: "财务部", position_hint: "出纳、应付会计"}}       # 财务：待付清单出现应付薪酬
    step:
      actor: system
      where: automatic
      command: 提交应付薪酬
      aggregate: AGG-52
      emits: [应付已确认]
      desc: 法人 × 月一笔实发合计，按来源单据 ID 幂等；之后走 PRC-75“发起、审批并执行付款”（B-10）；P-40 每月至少一次支付工资（工资支付暂行规定第七条）；代发明细（员工 × 账户 × 金额）如何随付款交给银行见 notes 接缝问题 3
      audit: true
      legal_entity: 薪酬法人（发薪法人）
      decision:
        - {when: 该薪酬结算已提交过应付, goto: end, outcome: 应付已提交}
        - {when: otherwise, goto: end, outcome: 应付已提交}
      cross_bc:
        - {mode: api, direction: out, bc: B-10, name: 提交应付薪酬}
    notes: 应付薪酬类型由 B-10 的 AGG-52 承载；付款、核销见 PRC-75、PRC-131、PRC-132（B-10，财务组），本组只写接缝。

  - id: PRC-127
    name: 薪酬发放完成
    trigger:
      type: event
      events:
        - {event: 应付已结清, aggregate: AGG-52, filter: "应付类型为应付薪酬且来源为月度薪酬结算"}
    triggers:
      - {type: event, name: "应付已结清（B-10 发布；B-15 只处理应付薪酬）"}
    stages: [VS-13.5]
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的发放状态随结算迁入"
    outcomes: [已发放]
    scenarios: [PRC-127-S01, PRC-127-S02, PRC-127-S03]   # S01 应付结清后置已发放并通知工资条；S02 退票时付款已失败，薪酬保持已批准；S03 置已发放时过账事实已入账，转 PRC-134
    roles:
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人工资条", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：工资条可查看
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已发放", approval_right: "无", department_hint: "财务部、人力资源部", position_hint: "薪酬岗、财务"}}
    step:
      actor: system
      where: automatic
      command: 标记薪酬已发放
      aggregate: AGG-73
      emits: [薪酬已发放]
      desc: 退票时付款已失败，薪酬保持已批准，重入付款；已发放与事实已过账两个条件任一后到者触发置已过账
      audit: true
      notify: [{to: SH-E3, how: 企业微信通知（工资条可查看）}]
      decision:
        - {when: 该薪酬的过账事实已入账, goto: PRC-134}
        - {when: otherwise, goto: end, outcome: 已发放}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 应付已结清}
    notes: 订阅关系 B-15 → B-10（api、事件）。应付已结清事件需带应付类型与来源，B-15 与 B-12 都订阅，各自过滤（notes 结构问题 4）。

  - id: PRC-129
    name: 离职后吊销会话
    type: event_policy
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    owner_bc: platform.identity
    migration: "不适用（迁入不发事件，ADR-0036 M7；历史离职人员的会话与授予按迁入对账）"
    outcomes: [会话已吊销]
    scenarios: [PRC-129-S01, PRC-129-S02]
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "吊销失败时处理告警", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员"}}       # 信息（IT）：吊销失败告警
    step:
      actor: platform
      where: automatic
      platform_task: true
      service: platform.identity
      command: 吊销会话
      desc: 聚合稿 §1.4 G-2 强制事件反应，RULE-363 已定，安全关键：收到 Separated 即吊销该人员的全部会话与每请求复核，不依赖企业微信账号状态。失败重试并告警信息部门，不静默（CLAUDE.md 第 6 条）；其余离职处置（角色授予、应急账号、登录身份）见 PRC-138
      audit: true
      notify: [{to: SH-E6, how: 企业微信待办}]
      outcome: 会话已吊销
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: Separated}
    notes: 平台已建模块，不是企业聚合；与 PRC-138 配合。无人工审批：吊销是强制反应。

  - id: PRC-130
    name: 离职后参保减员
    type: event_policy
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 人力收到离职事件后 15 日内办理转移手续（P-32）
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    owner_bc: B-15
    migration: "不适用（迁入不发事件；历史参保减员记录随 AGG-74 全量迁入）"
    outcomes: [参保已减员, 无需减员]
    scenarios: [PRC-130-S01, PRC-130-S02, PRC-130-S03, PRC-130-S04, PRC-130-S05]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理参保减员与公积金封存或转移", approval_right: "无", department_hint: "人力资源部（薪酬与社保）", position_hint: "薪酬与社保专员（职能：参保经办）"}}      # 人力（薪酬与社保）
    steps:
      - actor: system
        where: automatic
        command: 终止薪酬档案
        aggregate: AGG-93
        desc: S-32：B-15 订阅 Separated 后结束人员最后一个生效的薪酬档案版本，区间止于离职日（显式优于由人员状态推断）；离职当月的入离职折算仍读离职日之前有效的版本；人员无任何档案版本失败并告警薪酬岗，不静默，不阻断后续参保减员；已终止无操作
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
        decision:
          - {when: 人员无任何薪酬档案版本, goto: 2}
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: offline
        evidence: [社保减员回执, 公积金封存或转移回执, 办理日]
        command: 参保减员
        aggregate: AGG-74
        emits: [参保已减员]
        desc: 社保减员与公积金封存 / 转移在人社与公积金网办办理，没有面向本系统的接口，办理后回填；离职日起 15 日内（P-32）。退休返聘与实习不参保，无需减员（用户已定 T-4）
        permission: 参保.减员
        page: 参保登记页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # P-32 提醒，逾期升级给职能高管〔推〕
        decision:
          - {when: 用工类型为退休返聘或实习, goto: end, outcome: 无需减员}
          - {when: otherwise, goto: end, outcome: 参保已减员}
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取用工类型}
    notes: B-15 → B-13（api、事件）已有边。工资结清与离职当月社保费用口径属 B-15 薪酬结算，不在本策略。无人工审批。流程名沿用目录「离职后参保减员」，第 1 步终止薪酬档案是 S-32 并入的第二类离职反应（目录名待 one-architecture 视情改为含薪酬档案）。

  - id: PRC-134
    name: 薪酬事实已过账置位
    trigger:
      type: event
      events:
        - {event: BusinessFactAttributed, aggregate: AGG-77, filter: "来源单据为月度薪酬结算"}
    triggers:
      - {type: event, name: "BusinessFactAttributed（B-16 发布；B-15 只处理薪酬来源）"}
    stages: [VS-13.3]
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的已过账状态随结算迁入"
    outcomes: [已过账, 待发放后再置位]
    scenarios: [PRC-134-S01, PRC-134-S02]   # S01 已发放后过账完成置已过账；S02 过账先于发放，记标志待 PRC-127 触发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已过账", approval_right: "无", department_hint: "财务部", position_hint: "总账会计"}}
    step:
      actor: system
      where: automatic
      command: 标记已过账
      aggregate: AGG-73
      desc: 按来源单据 ID 取薪酬行；已发放与事实已过账两个条件任一后到者触发（符合性审查 断链 7）
      audit: true
      decision:
        - {when: 薪酬尚未发放, goto: end, outcome: 待发放后再置位}
        - {when: otherwise, goto: end, outcome: 已过账}
      cross_bc:
        - {mode: event, direction: in, bc: B-16, name: BusinessFactAttributed}
    notes: 由原 PRC-124 末步与 PRC-127 第二步拆出（G-18 已处理）。

  - id: PRC-145
    name: 员工法人三口径不一致预警
    trigger:
      type: event
      events:
        - {event: 劳动合同已签订, aggregate: AGG-67}
        - {event: 〔缺〕法人归属已变更, aggregate: AGG-117}
        - {event: 薪酬档案已变更, aggregate: AGG-93}
    triggers:
      - {type: event, name: "劳动合同已签订（B-13）"}
      - {type: event, name: "〔缺〕法人归属已变更（B-13）"}
      - {type: event, name: "薪酬档案已变更（同 BC）"}
    stages: [VS-07.3]
    owner_bc: B-15
    basis: S-20（one-architecture）；用户 Q-09（intent 2026-10-16-134134）
    migration: "迁入不触发（ADR-0036 M7）；迁入完成后由人力用对账清单一次性核对三口径，不批量发预警"
    outcomes: [三口径一致, 已预警]
    scenarios: [PRC-145-S01, PRC-145-S02]   # S01 三口径一致不预警；S02 入职后劳动合同用人单位与扣缴义务人不一致，预警人力
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收三口径不一致预警并核对更正", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力
    step:
      actor: system
      where: automatic
      desc: 比对劳动合同用人单位（AGG-67）、数据范围法人（AGG-117）、个税扣缴义务人（AGG-93），按同一业务日期取当时有效版本；不一致只预警人力，不拒绝；同一人员同一差异已有未处理预警时不重复发
      notify: [{to: SH-E6, how: 企业微信待办}]
      decision:
        - {when: 三口径中任意两个不一致, goto: end, outcome: 已预警}
        - {when: otherwise, goto: end, outcome: 三口径一致}
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: 劳动合同已签订}
        - {mode: event, direction: in, bc: B-13, name: 〔缺〕法人归属已变更}
        - {mode: api, direction: out, bc: B-13, name: 读取劳动合同用人单位与数据范围法人}
    notes: B-15 → B-13（api、事件）已有边；扣缴义务人在本 BC。

  - id: PRC-160
    name: 开立年度假期额度账户
    type: event_policy
    trigger:
      type: time
      desc: 每年年初（按日历年度）；年中入职由入职生效触发
    triggers:
      - {type: time, name: "每年年初（B-27 向 platform.scheduling 登记，幂等键 = 聚合 ID + 到期时点）"}
      - {type: event, name: "入职生效（年中入职）", event: Employed, bc: B-13}
    stages: [VS-13.1]
    owner_bc: B-27
    migration: "迁入不触发（ADR-0036 M7）；迁入年度的在途额度账户随 AGG-71 迁入，不重新开账"
    outcomes: [年度账户已开立, 结转待处理]
    scenarios: [PRC-160-S01, PRC-160-S02, PRC-160-S03]   # S01 年初先结转上年账户再开立新年账户；S02 年中入职无上年账户，直接开立；S03 上年账户仍有占用中的占用行，结转待处理并告警
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收结转或开账失败告警并跟进处理", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、考勤管理员"}}       # 人力（考勤）：结转或开账失败告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人当年度假期额度", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：当年额度可查看
    steps:
      - actor: system
        where: automatic
        command: 年度结转额度账户
        aggregate: AGG-71
        desc: 按 AGG-118 当日生效规则版本的结转与清零规则计算上年账户的结转额度并置账户为已结转，结转额度记在上年账户上供下一步读取；规则版本取不到失败并告警，不静默（CLAUDE.md 第 6 条）；年中入职触发时无上年账户，跳过本步
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: 无上年度账户（年中入职触发）, goto: 2}
          - {when: 上年账户仍有占用中的占用行, goto: end, outcome: 结转待处理}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        command: 开立年度额度账户
        aggregate: AGG-71
        desc: 对每名在职人员 × 占额度的假期类型开立该年度账户，应享按 AGG-118 当日生效规则版本计算（含上年结转；年中入职按规则折算）；补休不在此开账：补休额度行由加班批准时计入（PRC-117），按补休有效期独立到期，不随日历年度开立、结转或清零；取不到生效版本失败并告警，不回退默认值；已开账无操作
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（本年度额度已开立）}]
        outcome: 年度账户已开立
    notes: 补休额度独立于年度，不在本策略处理（结转与开账只对年度账户，补休额度行的到期未休与离职转计发加班工资见 PRC-178）。B-27 → B-13 订阅 Employed 的事件边需补登（vs13att.notes.md 接缝问题 2）。定时由 B-27 向 platform.scheduling 登记，到点调本 BC 命令，边 B-27 → platform.scheduling 按平台依赖登记（CONVENTIONS §5）。无人工审批。

  - id: PRC-161
    name: 年末关闭预算账户
    type: event_policy
    trigger:
      type: time
      desc: 预算期届满（年末）
    triggers:
      - {type: time, name: "预算期届满（B-18 向 platform.scheduling 登记，幂等键 = 聚合 ID + 到期时点）"}
    stages: [VS-09.3]
    owner_bc: B-18
    migration: "迁入不触发（ADR-0036 M7）；迁入时已届满的预算账户按迁入对账核对状态，不回放关闭"
    outcomes: [预算账户已关闭, 关闭待处理]
    scenarios: [PRC-161-S01, PRC-161-S02]   # S01 预算期届满，账户无占用中的占用行，关闭；S02 仍有占用中的占用行，关闭待处理并告警财务
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收关闭待处理告警，先释放或消耗占用中的占用行后重新触发", approval_right: "无", department_hint: "财务部", position_hint: "预算会计、财务负责人"}}       # 财务：占用未清告警
    steps:
      - actor: system
        where: automatic
        command: 关闭预算账户
        aggregate: AGG-80
        desc: 预算期届满或已被同计划新基线取代的账户关闭，之后不再接受占用与调剂；仍有占用中的占用行的账户不关闭，告警财务先释放或消耗，不静默（CLAUDE.md 第 6 条）；已关闭无操作
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: 账户仍有占用中的占用行, goto: end, outcome: 关闭待处理}
          - {when: otherwise, goto: end, outcome: 预算账户已关闭}
    notes: 定时由 B-18 向 platform.scheduling 登记，到点调本 BC 命令，边 B-18 → platform.scheduling 按平台依赖登记（CONVENTIONS §5）。账户关闭后占用方单据（B-11、B-12）再调用预算占用会被拒绝并提示，由占用方单据所属流程处理。无人工审批：关闭由日期与占用状态守卫。

  - id: PRC-177
    name: 向差旅服务商同步员工与组织
    type: event_policy
    trigger:
      type: event
      events:
        - {event: Employed, aggregate: AGG-62}
        - {event: Separated, aggregate: AGG-62}
        - {event: 任职已变更, aggregate: AGG-63}
        - {event: 组织单元已调整, aggregate: AGG-61}
    triggers:
      - {type: event, name: "入职生效", event: Employed, bc: B-13}
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
      - {type: event, name: "任职已变更（调岗）", event: 任职已变更, bc: B-13}
      - {type: event, name: "组织单元已调整", event: 组织单元已调整, bc: B-13}
    stages: []
    support: "行政支撑：员工与组织的单向同步，服务差旅预订，不在客户价值流上（S-31 SQ-31）"
    owner_bc: B-13
    basis: S-31 SQ-31（one-architecture）：platform.integration 在 L0，不能订阅 B-13（S-22 不采用平台订阅业务事件），故由 B-13 订阅本 BC 事件并经既有边 B-13 → platform.integration 推送
    migration: "迁入不触发（ADR-0036 M7）；上线时由集成册登记的一次性全量初始同步另办，不属本策略"
    outcomes: [已同步, 同步失败已告警]
    scenarios: [PRC-177-S01, PRC-177-S02, PRC-177-S03]   # S01 入职后推送新员工；S02 组织单元调整后推送组织树；S03 差旅服务商返回失败，告警不静默
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收同步失败告警并跟进重试", approval_right: "无", department_hint: "信息部门、人力资源部", position_hint: "信息管理员、人事专员"}}       # 信息（IT）与人力：同步失败告警
    steps:
      - actor: system
        where: external:差旅服务商
        evidence: [推送批次编号, 差旅服务商回执（受理结果与失败明细）]
        bc: platform.integration
        command: 推送员工与组织
        desc: 单向推送：入职、调岗、组织调整推送最新员工与组织单元，离职推送停用；只推送差旅预订必需的字段（姓名、工号、所属组织单元、状态），不含薪酬、证件等敏感个人信息（个人信息保护法最小必要）；按事件 ID 幂等，重复事件不重复推送；差旅服务商返回失败或回执缺失告警信息部门与人力，保留批次待重试，不静默（CLAUDE.md 第 6 条）
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 推送员工与组织}
        decision:
          - {when: 差旅服务商返回失败或回执缺失, goto: end, outcome: 同步失败已告警}
          - {when: otherwise, goto: end, outcome: 已同步}
    notes: 方向 B-13 → platform.integration 为既有边，不新增边；订阅的是本 BC 事件。外部系统名按 S-31 写「差旅服务商」，集成册登记（SESSION_PLAYBOOK §14.3）。差旅订单、账单、审批进 B-12（S-31 SQ-27、28），与本策略无关。无人工审批。

  - id: PRC-178
    name: 补休到期未休或离职时转计发加班工资
    type: event_policy
    trigger:
      type: event
      events:
        - {event: 〔缺〕补休已到期未休, aggregate: AGG-71}
        - {event: Separated, aggregate: AGG-62}
    triggers:
      - {type: event, name: "〔缺〕补休已到期未休（B-27 发布）", event: 补休已到期未休, bc: B-27}
      - {type: event, entry: 2, name: "员工离职生效（B-13 发布 Separated）", event: Separated, bc: B-13}
    stages: [VS-13.3]
    owner_bc: B-15
    basis: S-41（one-architecture）；用户页 P13-05；劳动法第四十四条（休息日加班不能安排补休的，支付不低于工资 200% 的报酬）、工资支付暂行规定第十三条（以加班工资基数折算）
    migration: "迁入不触发（ADR-0036 M7）；迁入的补偿方式为调休的加班，其未休余额是否迁为补休额度行待取证后定，迁入后到期的补休余额按本策略转计发"
    scope: "员工本人只看自己的补休转计发结果；薪酬岗与人力可见；金额属敏感个人信息，不进事件载荷"
    outcomes: [已计入加班工资, 离职余额已计入加班工资, 无需计发, 登记待处理]
    scenarios: [PRC-178-S01, PRC-178-S02, PRC-178-S03, PRC-178-S04, PRC-178-S05]   # S01 补休到期未休，读取余额按加班工资基数 200% 计入加班工资；S02 到期入口取不到加班工资基数或读不到余额，登记待处理并告警；S03 员工离职生效，未休补休余额一并计入加班工资；S04 离职入口取不到加班工资基数或读不到余额，登记待处理并告警；S05 离职时无未休补休余额，无需计发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收补休转计发登记待处理的告警并补齐加班工资基数后重新触发", approval_right: "无", department_hint: "人力资源部", position_hint: "薪酬岗"}}       # 人力（薪酬岗）：登记待处理告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉本人到期未休的补休余额已转计发加班工资", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：到期未休余额转计发通知
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕登记补休转加班工资
        aggregate: AGG-93
        pending: U15
        desc: B-27 在补休额度有效期（时长待用户定 U15）届满、仍有未休余额时发出补休已到期未休；B-15 经既有边 B-15 → B-27 读取该额度行的未休余额，按加班工资基数折算的时薪 × 200% 计入加班工资（劳动法第四十四条、工资支付暂行规定第十三条；会计上为累积带薪缺勤负债，企业会计准则第 9 号），登记以额度行 ID 幂等，当月薪酬在 PRC-124 读取，不在本策略算钱；加班工资基数取不到或余额读不到时失败并告警薪酬岗，不静默按零
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（余额已转计发加班工资）}, {to: SH-E6, how: 企业微信待办}]      # 薪酬岗仅登记待处理时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-27, name: 〔缺〕补休已到期未休}
          - {mode: api, direction: out, bc: B-27, name: 读取补休额度行余额}
        decision:
          - {when: 加班工资基数取不到或补休额度行余额读取失败, goto: end, outcome: 登记待处理}
          - {when: otherwise, goto: end, outcome: 已计入加班工资}
      - actor: system
        where: automatic
        entry: 员工离职生效，仍有未休补休余额
        branch: 离职
        command: 〔缺〕登记补休转加班工资
        aggregate: AGG-93
        pending: U15
        desc: 离职生效后（Separated）B-15 读取该员工全部未休补休余额（离职生效后劳动关系已终止，不再有补休可安排，余额只能折算计发；劳动法第四十四条、《工资支付暂行规定》第十三条），按加班工资基数折算的时薪 × 200% 计入加班工资，随最后一期薪酬由 PRC-124 计发；按额度行 ID 幂等，已登记的额度行不重复；加班工资基数取不到或余额读不到时失败并告警薪酬岗，不静默按零；无未休余额则无需计发
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]      # 薪酬岗仅登记待处理时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
          - {mode: api, direction: out, bc: B-27, name: 读取补休额度行余额}
        decision:
          - {when: 员工无未休补休余额, goto: end, outcome: 无需计发}
          - {when: 加班工资基数取不到或补休额度行余额读取失败, goto: end, outcome: 登记待处理}
          - {when: otherwise, goto: end, outcome: 离职余额已计入加班工资}
    notes: 入口 1 的事件由 B-27 在补休额度有效期届满发出，入口 2 订阅 B-13 的 Separated（与 PRC-130 同事件）；边 B-15 → B-27（api）与 B-15 → B-13（事件）均已有，不新增。B-27 侧保留命令补休到期转计薪（到期未休，发补休已到期未休），金额与登记全在 B-15；B-27 因占用中请假暂不能转计薪时的告警属 B-27 命令前置条件（vs13att.commands.yaml）。S-42：B-27 不订阅 Separated 做补休结算（原命令离职结算补休余额已删），离职时由 B-15 入口 2 直接读取余额。

single_aggregate:

  - id: PRC-79
    name: 登记继续教育并延续注册执业证书
    type: single_aggregate
    aggregate: AGG-66
    owner_bc: B-13
