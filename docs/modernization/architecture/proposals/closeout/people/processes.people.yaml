# 人员组 ⑥b 流程骨架片段（one-arch-people）：VS-07 任用员工、VS-09 达成经营目标、VS-11 沉淀复用知识、VS-13 获得报酬，及 B-31 行政事务。
# 字段按 closeout/CONVENTIONS.md（含 where / evidence、approval.engine）；编号与名称以 closeout/process-catalog.yaml 为准。
# PRC-83、84、137 为用户已批准的样板（SAMPLE.md，intent 2026-10-16-162820、162821）；其余由分片 parts/*.processes.yaml 合并而来。
# 命令名写〔缺〕表示聚合稿 §2.2 / 平台没有这条命令或事件，提议新增（见 NOTES.md「新用语」「聚合稿回补」），不假装存在。
# 带 CONVENTIONS 以外的键（decision.outcome、events.filter、steps.entry、entry_of 等）见 NOTES.md「格式问题」，待 one-architecture 裁定。

meta:
  version: 2
  group: people
  status: proposal-fragment
  date: "2026-10-16"
  scope: [VS-07, VS-09, VS-11, VS-13, B-31]

processes:

  - id: PRC-80
    name: 维护法人、组织与岗位
    trigger: {type: human, desc: 人力调整组织、岗位或登记法人主体}
    triggers:
      - {type: human, name: "人力登记法人主体"}
      - {type: human, name: "人力调整组织单元"}
      - {type: human, name: "人力指定法人归属"}
      - {type: human, name: "人力停用职位"}
      - {type: human, name: "人力更名、停用或启用法人主体"}
      - {type: human, name: "人力新建或修改职位"}
      - {type: human, name: "人力更正法人归属"}
      - {type: human, name: "人力结束法人归属"}
      - {type: human, name: "人力更正法人主体代码（未发号前）"}
    stages: [VS-15.2, VS-15.3]
    stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；VS-15.2 组织单元与岗位启用、VS-15.3 停用；法人主体筹建存续不作门；法人主体筹建存续不作门；原支撑理由：B-13 主数据维护：法人主体、组织单元、法人归属、职位目录条目的维护，结局不造任何阶段的退出条件（职位「启用」只是 VS-07.1 的进入条件，判据按退出条件归段），服务多条价值流（STAGE_ALIGN.md 归段判据第 6 项）"
    primary_object: OBJ-55
    secondary_objects: [OBJ-54, OBJ-58]
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "法人、组织单元、职位目录、法人归属全量迁入（U-3、U-4），迁入不触发 P-31 待复核（ADR-0036 M7）；无在途实例"
    scope: "人力按法人与组织数据范围维护"
    outcomes: [已维护]
    scenarios: [PRC-80-S01, PRC-80-S02, PRC-80-S03, PRC-80-S04, PRC-80-S05, PRC-80-S06, PRC-80-S07, PRC-80-S08, PRC-80-S09, PRC-80-S10, PRC-80-S11, PRC-80-S12, PRC-80-S13, PRC-80-S14, PRC-80-S15]
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "维护法人、组织单元、职位目录与法人归属主数据", approval_right: "无（全部由不变量守卫，不设审批）", department_hint: "人力资源部", position_hint: "人事主数据维护岗（职能：维护组织与职位目录）"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "数据范围待复核时确认是否调整授权", approval_right: "无", department_hint: "区域或事业部", position_hint: "区域负责人（职能：对本区域组织数据范围负责）"}}       # 区域负责人：数据范围待复核时被通知（P-31）；区域负责人是否归 SH-M1 见 notes 格式问题 7
    steps:
      - actor: SH-E6
        where: in_system
        read: true
        command: 查看法人、组织与职位现状
        reads: [AGG-60, AGG-61, AGG-117, AGG-64]
        desc: 人力进入维护页查看现状后择一维护；各类维护互不依赖，本步是它们的共同入口（生成器把所有开始事件接到第 1 步，故写成入口选择）
        permission: 组织维护.查看
        page: 法人组织职位维护页
        decision:
          - {when: 登记法人主体, goto: 2}
          - {when: 调整组织单元, goto: 3}
          - {when: 指定法人归属, goto: 4}
          - {when: 更名法人主体, goto: 7}
          - {when: 停用法人主体, goto: 8}
          - {when: 启用法人主体, goto: 9}
          - {when: 新建岗位, goto: 10}
          - {when: 修改岗位, goto: 11}
          - {when: 更正法人归属, goto: 12}
          - {when: 结束法人归属, goto: 13}
          - {when: 更正法人主体代码, goto: 14}
          - {when: otherwise, goto: 5}      # 其余即停用职位
      - actor: SH-E6
        where: in_system
        branch: 登记法人
        command: 登记法人主体
        aggregate: AGG-60
        desc: 法人代码发号后不可改（INV-59）；五家法人由初始化录入，之后新增走本步（DATA_MODEL B-13）
        permission: 法人.登记
        page: 法人登记页
        audit: true
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 调整组织
        command: 调整组织单元
        aggregate: AGG-61
        emits: [组织单元已调整]
        desc: 按人事业务生效日生效（U-12）；B-13 自为记录系统，不再有 A8 同步来源（U-1、U-7）。撤销的组织单元下仍有在职任职则拒绝并提示先调岗（PRC-136），人力改正后重提
        permission: 组织单元.调整
        page: 组织单元维护页
        audit: true
        decision:
          - {when: 撤销的组织单元下仍有在职任职, goto: 3, rule: INV-60}
          - {when: otherwise, goto: 6}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 组织单元已调整}   # P-31；聚合稿 AGG-61 订阅方已写
      - actor: SH-E6
        where: in_system
        branch: 指定法人归属
        command: 指定法人归属        # 已建代码有对应命令；聚合稿 AGG-117 现已列入，去〔缺〕标记（QC-OBJECTS.md）
        aggregate: AGG-117
        emits: [〔缺〕法人归属已变更]
        desc: 部门默认法人或员工单独指定法人，按期间；同一对象期间不重叠（INV-新-P5，重叠则拒绝，人力改正后重提）。三口径之一，不一致由 B-15 预警（PRC-145），本步不拒绝
        permission: 法人归属.指定
        page: 法人归属维护页
        audit: true
        added_in: closeout
        decision:
          - {when: 法人归属期间与同一对象已有期间重叠, goto: 4, rule: INV-新-P5}
          - {when: otherwise, goto: end}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕法人归属已变更}   # 数据范围
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕法人归属已变更}               # PRC-145 订阅
      - actor: SH-E6
        where: in_system
        branch: 停用职位
        command: 停用岗位                    # Q-08 后为职位目录条目，改称待 one-glossary（notes 新用语）
        aggregate: AGG-64
        emits: [岗位已停用]
        desc: 职位仍被在职任职引用则拒绝，人力改正后重提（INV-63）
        permission: 职位目录.停用
        page: 职位目录维护页
        audit: true
        decision:
          - {when: 职位仍被在职任职引用, goto: 5, rule: INV-63}
          - {when: otherwise, goto: end}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-61, event: 组织单元已调整}]
        desc: P-31；对应词表「待调整权限」（ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 已维护
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 组织单元已调整}
      - actor: SH-E6
        where: in_system
        branch: 更名法人
        command: 更名法人主体        # 词表事件「法人主体已更名」；聚合稿只列登记法人主体（对象增删改查检查补缺，notes 结构问题 19）
        aggregate: AGG-60
        desc: 只改名称，追加名称版本；法人代码发号后不可改（INV-59）
        permission: 法人.更名
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 停用法人
        command: 停用法人主体        # 词表事件「法人主体已停用」
        aggregate: AGG-60
        desc: 法人主体不再作为法人使用；仍有有效法人归属或在职任职时是否拒绝，聚合稿与词表未定（notes 结构问题 19），暂只校验状态
        permission: 法人.停用
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 启用法人
        command: 启用法人主体        # 词表事件「法人主体已启用」
        aggregate: AGG-60
        desc: 恢复已停用的法人主体为有效
        permission: 法人.启用
        page: 法人维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 新建职位
        command: 新建岗位        # Q-08 后为职位目录条目，命令名交 one-glossary
        aggregate: AGG-64
        desc: 新增职位目录条目（职位编码、名称、职位族、职级）；职位编码跨版本不变，同编码重复新建返回已有结果；初始目录仍由初始化录入
        permission: 职位目录.新建
        page: 职位目录维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 修改职位
        command: 修改岗位
        aggregate: AGG-64
        desc: 追加职位目录条目的新版本（名称、职位族、职级）；已停用的职位不可修改
        permission: 职位目录.修改
        page: 职位目录维护页
        audit: true
        added_in: closeout
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 更正法人归属
        command: 更正法人归属        # 聚合稿 AGG-117 已有命令，原无流程步骤引用
        aggregate: AGG-117
        desc: 只更正已关闭期间的结束日，只追加更正行不改写历史；更正后期间仍不得与同一对象其他期间重叠（INV-122），重叠则拒绝，人力改正后重提
        permission: 法人归属.更正
        page: 法人归属维护页
        audit: true
        decision:
          - {when: 更正后期间与同一对象其他期间重叠, goto: 12, rule: INV-122}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 结束法人归属
        command: 结束法人归属        # 已建代码 EndLegalEntityAttribution，规划原缺（one-architecture command-mapping 2026-10-21）
        aggregate: AGG-117
        desc: 为部门或员工当前的法人归属期间写入结束日，关闭当前期间；只关闭不改写历史，结束日不得早于期间开始日；操作人不得终止本人的归属；发「法人归属已结束」
        permission: 法人归属.终止
        page: 法人归属维护页
        audit: true
        emits: [法人归属已结束]
        decision:
          - {when: 该对象没有当前法人归属, goto: 13}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 更正法人主体代码
        command: 更正法人主体代码        # 已建代码 UpdateLegalEntity 的代码更正分支，规划原缺（one-architecture command-mapping 2026-10-21）
        aggregate: AGG-60
        desc: 法人代码登记有误且尚未用该代码发号时更正；已发号则拒绝（INV-59），只能另登法人主体
        permission: 法人主体.更正代码
        page: 法人主体维护页
        audit: true
        decision:
          - {when: 法人代码已用于发号, goto: 14, rule: INV-59}
          - {when: otherwise, goto: end}
    notes: "步 2–5、7–14 是人力择一执行的备选路径（步 1 是入口选择）；步 6 是步 3 的事件反应。职位目录的新建与修改命令聚合稿未列（notes 结构问题）。本流程无人工审批：全部由不变量守卫（INV-59、60、63、新-P5）。"

  - id: PRC-81
    name: 提出并批准招聘需求
    trigger: {type: human, desc: 用人经理提出}
    triggers:
      - {type: human, name: "用人经理提出招聘需求"}
    stages: [VS-07.1]
    primary_object: OBJ-60
    owner_bc: B-13
    human_orchestration: true
    human_note: 提交、批准或驳回，批准为本聚合命令
    type: business
    migration: "招聘需求全量迁入（来源 A8 用人申请表单，OA_PROCESS_INVENTORY 第 67 行，在途 5，待取证）；在途（已提交 / 已批准未关闭）按当前状态迁入，已关闭只迁结局与审计；迁入不发事件"
    scope: "用人经理看本部门；部门负责人看本部门；人力看全部"
    segregation:
      - {roles: [SH-E1, SH-M1], rule: "提出人与批准人不得为同一人；提出人本人就是归属组织单元的责任人时按 AR-11 由上级组织负责人批（处理方式待用户 V-18）"}
    outcomes: [已批准, 已关闭]
    scenarios: [PRC-81-S01, PRC-81-S02, PRC-81-S03, PRC-81-S04]
    roles:
      - {id: SH-E1, as: initiator, org_needs: {responsibility: "提出本部门招聘需求", approval_right: "无（提出人不得批准自己的需求）", department_hint: "用人部门", position_hint: "用人经理（职能：对本部门用人需求负责）"}}
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对本组织单元的用人取舍负责", approval_right: "批准招聘需求（类型级，单级）", department_hint: "需求所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人 = 招聘需求归属组织单元的责任人（cost_object_owner）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "需求批准后开展招聘", approval_right: "无", department_hint: "人力资源部", position_hint: "招聘专员（职能：组织招聘）"}}       # 人力：批准后开始招聘
    steps:
      - actor: SH-E1
        where: in_system
        read: true
        command: 查看职位目录与组织单元
        reads: [AGG-64, AGG-61]
        desc: 读职位目录与组织单元；Q-08 无编制，超编检查 P-33 已关闭，不再做
        permission: 招聘需求.提交
        page: 招聘需求编辑页
      - actor: SH-E1
        where: in_system
        command: 提交招聘需求
        aggregate: AGG-65
        desc: 职位、组织单元、人数、期望到岗日；职位须启用、组织单元须有效（规则候选 R-01，拒绝）；〔缺〕与候选人关联命令未见（PG-08）
        permission: 招聘需求.提交
        page: 招聘需求编辑页
        audit: true
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: 4, outcome: 已关闭}      # 批准前提出人撤回，走「关闭招聘需求」
        decision:
          - {when: 提出人在批准前撤回, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        command: 批准招聘需求
        aggregate: AGG-65
        emits: [招聘需求已批准]
        approval:
          engine: aggregate             # B-13 聚合内单级批准，不经 platform.approval（F-3；§4.3.4 第 4 条），故无审批平台回调
          doc_type: 招聘需求批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 4
          why_human: "增加人员成本是部门负责人对用人取舍的管理判断；Q-08 不管编制，没有可由规则判定的人数上限，职位有效等可校验的条件已由规则拒绝（R-01）"
        permission: 招聘需求.批准
        page: 招聘需求审批页
        audit: true
        pending: V-18
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信待办}]
        outcome: 已批准
        decision:
          - {when: 批准, goto: end}
          - {when: otherwise, goto: 4}
      - actor: SH-M1
        where: in_system
        branch: 驳回或关闭
        command: 关闭招聘需求
        aggregate: AGG-65
        emits: [招聘需求已关闭]
        desc: v1 以关闭代驳回，状态「已驳回」无独立命令；驳回由批准人执行，提出人撤回与已批准后因取消或录满的关闭由提出人或人力执行同一命令（录满无触发，PG-08）
        permission: 招聘需求.关闭
        page: 招聘需求审批页
        audit: true
        outcome: 已关闭
    notes: 批准不经 platform.approval（会成环）；需要多级审批时移出 B-13（聚合稿 §7 第 12 条），见 notes 待用户定 V-9、V-18。调入等非招聘入职跳过本流程。

  - id: PRC-82
    name: 登记候选人并作出录用决定
    trigger: {type: human, desc: 求职者应聘或用人经理推荐}
    triggers:
      - {type: human, name: "求职者应聘或用人经理推荐，人力登记候选人"}
    stages: [VS-07.2]
    primary_object: OBJ-56
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "候选人面试与录用记录全量迁入并加个人信息保护（用户 T-5，ADR-0043；A8 应聘登记表 / 面试评估表 / 录用审批表，OA_PROCESS_INVENTORY 第 55、74、57 行）：分级与访问限招聘相关角色；在途候选人按当前阶段迁入；迁入不发事件"
    scope: "人力看全部候选人；用人经理只看本人所提招聘需求下的候选人（访问限制按 ADR-0043）"
    outcomes: [人员待入职, 未录用, 候选人已放弃]
    scenarios: [PRC-82-S01, PRC-82-S02, PRC-82-S03, PRC-82-S04]
    roles:
      - {id: SH-H1, as: external, org_needs: {responsibility: "应聘、面试、答复录用通知", approval_right: "无", department_hint: "（外部）", position_hint: "候选人"}}
      - {id: SH-E6, as: performer, org_needs: {responsibility: "登记候选人与答复，发出录用通知", approval_right: "无", department_hint: "人力资源部", position_hint: "招聘专员（职能：候选人登记与录用事务）"}}      # 人力
      - {id: SH-E1, as: performer, org_needs: {responsibility: "面试评价并作出录用决定", approval_right: "作出录用决定（自行决定，不另设审批，V-8 待定）", department_hint: "用人部门", position_hint: "用人经理（职能：对所辖用人决定负责）"}}      # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记候选人
        aggregate: AGG-62
        emits: [人员已登记]
        desc: 候选人并入人员的候选阶段（OBJ-59）；含个人信息，ADR-0043
        permission: 候选人.登记
        page: 候选人登记页
        audit: true
      - actor: SH-E1
        where: in_system
        command: 记录面试
        aggregate: AGG-62
        desc: 面试在线下或会议系统进行，本系统登记轮次、评价与结论
        permission: 面试.记录
        page: 面试记录页
        audit: true
        decision:
          - {when: 面试通过并决定录用, goto: 3}
          - {when: otherwise, goto: 5}
      - actor: SH-E1
        where: in_system
        command: 作出录用决定
        aggregate: AGG-62
        desc: 录用结论、拟入职日、拟任职职位与职级；拟任职位须启用（规则候选 R-02，拒绝）。用人经理即归属对象责任人，自行决定，不另设审批（V-8 推荐；A8 有「录用审批表」，见 QC）。〔聚合稿将「录用决定已作出」挂在本命令；候选人答复在其后，见 notes 结构问题〕
        permission: 录用决定.作出
        page: 录用决定页
        audit: true
        pending: V-8
        notify: [{to: SH-E6, how: 企业微信待办}]
      - actor: SH-E6
        where: offline
        evidence: [候选人确认入职日的回执（邮件或签回的录用通知）, 确认日, 确认的入职日]
        command: 〔缺〕登记候选人答复
        aggregate: AGG-62
        emits: [录用决定已作出]
        desc: 录用通知书线下或邮件发出，候选人接受或放弃；接受则本步发「录用决定已作出」，触发 PRC-83（候选人确认入职日后办理入职）
        permission: 候选人.登记答复
        page: 录用决定页
        audit: true
        added_in: closeout
        pending: V-19
        timeout: {after: "P7D", escalate_to: SH-E1, interrupting: false}   # 录用通知发出后答复期限（V-19 待定），逾期提醒用人经理决定是否撤销录用
        outcome: 候选人已放弃
        decision:
          - {when: 候选人确认入职日期, goto: PRC-83}
          - {when: otherwise, goto: end}      # 候选人放弃或录用决定撤销（放弃命令缺：PG-09）
      - actor: SH-E1
        where: in_system
        branch: 未录用
        command: 标记未录用
        aggregate: AGG-62
        desc: 通知候选人线下（邮件或电话），本系统不记通知
        permission: 候选人.标记未录用
        page: 面试记录页
        audit: true
        outcome: 未录用
    notes: 候选人个人信息按 ADR-0043 分级，数据组表级处理；保留期待 one-data 按 D12 登记。本流程无人工审批（录用决定是用人经理对自己所辖的决定）；是否另设录用审批待用户 V-8。

  - id: PRC-83
    name: 办理员工入职与任职
    trigger:
      type: event
      events: [{event: 录用决定已作出, aggregate: AGG-62}]
      desc: 候选人确认入职日后，人力办理入职（同 BC）
    triggers:
      - {type: event, name: "录用决定已作出", event: 录用决定已作出, bc: B-13}
    stages: [VS-07.3]
    primary_object: OBJ-56
    secondary_objects: [OBJ-05, OBJ-57]   # F-1：本流程写入的次要对象（自 notes 迁来）
    notes: "次要对象：OBJ-05 协议（劳动合同类型，签订后生效）、OBJ-57 任职（版本化、无状态机，不作退出条件）。"
    owner_bc: B-13
    human_orchestration: false
    migration: "已在职员工的人员、任职版本、劳动合同全量迁入（U-3、U-4，S17）；在途（待入职）按当前状态迁入，已登记未到入职日的须重新排定「入职生效」定时；迁入不发入职已登记与 Employed，不触发 PRC-84、PRC-137（ADR-0036 M7）；A8 员工入职模板（OA_PROCESS_INVENTORY 第 56 行，在途 1）随迁入对账"
    scope: "人力按法人与组织数据范围；用人经理看所辖新员工的入职与任职"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "劳动合同的提交人（人力）与批准人（新员工归属组织单元负责人）不得为同一人"}
    outcomes: [入职已办理（人员试用期 / 正式，协议已签署生效）]
    scenarios: [PRC-83-S01, PRC-83-S02, PRC-83-S03, PRC-83-S04, PRC-83-S05, PRC-83-S06]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "登记入职、建立任职、提交并登记劳动合同", approval_right: "无（劳动合同批准由部门负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：入职与合同事务）"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对新员工所在组织单元的用人负责", approval_right: "批准劳动合同（类型级，单级）", department_hint: "新员工所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人 = 新员工归属组织单元的责任人（cost_object_owner），劳动合同单级批准
      - {id: SH-H1, as: external, org_needs: {responsibility: "确认入职日、签署劳动合同", approval_right: "无", department_hint: "（外部）", position_hint: "候选人（入职前）"}}       # 候选人：确认入职日、签合同
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉新员工入职与任职", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理"}}       # 用人经理
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记入职
        aggregate: AGG-62
        emits: [〔缺〕入职已登记]        # S3；PG-01
        desc: 填入职日（人事业务生效日，S2）；用工类型；工号由本系统发号
        permission: 入职.登记
        page: 入职登记页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 〔缺〕入职已登记}   # 触发 PRC-137（S4、S5）
        decision:
          - {when: 入职日不晚于今天, goto: 2}
          - {when: otherwise, goto: 2}      # 提前登记：第 2 步在入职日到时由系统执行
      - actor: system
        where: automatic
        on_time: 入职日到达（当天开始时）
        command: 〔缺〕入职生效
        aggregate: AGG-62
        emits: [Employed]
        desc: 人员状态由「待入职」转「在职」；补登时立即执行，生效日仍为登记的入职日（S2）
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: Employed}               # 触发 PRC-84
          - {mode: event, direction: out, bc: platform.identity, name: Employed}  # 放行登录（S4）
      - actor: SH-E6
        where: in_system
        command: 建立任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 组织单元、职位、职级、汇报线、主 / 兼；生效日默认等于入职日（S9）
        permission: 任职.建立
        page: 任职维护页
        audit: true
        decision:
          - {when: 与该人员已有主任职区间重叠, goto: 3, rule: INV-62}    # INV-62 拒绝，改正后重提
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 默认角色与数据范围（S10）
      - actor: SH-E6
        where: in_system
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位（法人口径之一，S13）、期限、试用期
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        legal_entity: 用人单位
        notify: [{to: SH-M1, how: 企业微信待办}]
        decision:
          - {when: 试用期超过法定上限, goto: 4, rule: INV-14}            # INV-14 拒绝
          - {when: otherwise, goto: 5}
      - actor: SH-M1
        where: in_system
        command: 批准劳动合同
        aggregate: AGG-67
        approval:
          doc_type: 劳动合同批准
          engine: aggregate                                # B-13 聚合内单级批准，不经 platform.approval（S11），故无审批平台回调
          approver: SH-M1                      # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 4                                     # 退回人力改合同（驳回命令〔缺〕，PG-09）
          why_human: "合同期限、岗位与薪酬约定是否与录用决定一致、用人单位是否正确是法律与管理判断；法定试用期上限已由 INV-14 拒绝，不属人工判断"
        permission: 劳动合同.批准
        page: 劳动合同审批页
        audit: true
        pending: V-18
        decision:
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 4}                     # 驳回：退回人力改合同
      - actor: SH-E6
        where: offline
        evidence: [已签署劳动合同扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 候选人（SH-H1）线下或电子签署，人力登记签署日
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        outcome: 入职已办理（人员试用期 / 正式，协议已签署生效）
        decision:
          - {when: 用工满一个月仍未签订, goto: 6}          # P-05 提醒，不拒绝（S12）
          - {when: otherwise, goto: end}    # 三口径预警移至 B-15 事件策略（S-20）

  - id: PRC-84
    name: 增员参保并建立薪酬档案
    trigger:
      type: event
      events: [{event: Employed, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "入职生效", event: Employed, bc: B-13}
    stages: [VS-07.3]
    stages_note: "VS-07.3：触发状态 Employed（试用期 / 正式）是 VS-07.3 的退出条件，参保增员与建薪酬档案是入职任职的收尾；不归 VS-13.1——VS-13.1 进入条件同一状态只是字面重合，本流程不产生考勤确认的任何进出事实（#421 第 6a 项）"
    primary_object: OBJ-62
    owner_bc: B-15
    human_orchestration: false
    migration: "历史参保增员记录与薪酬档案随 AGG-74、AGG-93 全量迁入（U-3、U-4），薪酬档案按生效日版本回放；迁入不发事件，不触发本流程（ADR-0036 M7）"
    scope: "人力（薪酬与社保）按法人范围；薪酬属敏感个人信息，ADR-0043 最高访问级别"
    outcomes: [社保与公积金参保在缴，薪酬档案已建立]
    scenarios: [PRC-84-S01, PRC-84-S02, PRC-84-S03]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理参保增员并建立薪酬档案", approval_right: "无", department_hint: "人力资源部（薪酬与社保）", position_hint: "薪酬与社保专员（职能：参保经办与薪酬档案）"}}      # 人力（薪酬与社保）
    steps:
      - actor: SH-E6
        where: offline
        evidence: [社保增员回执, 公积金增员回执, 办理日]
        command: 参保增员
        aggregate: AGG-74
        emits: [参保已增员]
        desc: 入职 30 日内办理，逾期提醒（P-32）
        permission: 参保.增员
        page: 参保登记页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P30D", escalate_to: SH-M1, interrupting: false}   # P-32 逾期提醒，升级给职能高管〔推〕
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Employed}
        decision:
          - {when: 用工类型为退休返聘或实习, goto: 2}   # 不参保（用户已定 T-4）
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: in_system
        command: 建立薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪酬属性版本生效日 = 入职日（S2、S15）
        permission: 薪酬档案.建立
        page: 薪酬档案维护页
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与任职}
        decision:
          - {when: otherwise, goto: end}

  - id: PRC-85
    name: 评估并转正试用期员工
    trigger: {type: time, desc: 试用期届满前（P-46）}
    triggers:
      - {type: time, name: "试用期届满前 N 日生成评估待办（N 待用户定）"}
    stages: [VS-07.3, VS-13.2]
    primary_object: OBJ-56
    secondary_objects: [OBJ-109]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "试用期评估与转正申请全量迁入（OA_PROCESS_INVENTORY 第 59、61、63、75 行：A8 试用期评估流程第一、二个月、试用期员工转正申请、转正申请表；在途合计 6 + 8 + 3 + 7）；在途按当前状态迁入；迁入不触发转正事件与薪酬联动（ADR-0036 M7）"
    scope: "用人经理看所辖员工；人力看全部；评估内容限评估人、被评人与人力（ADR-0043）"
    outcomes: [已转正, 转入离职办理]
    scenarios: [PRC-85-S01, PRC-85-S02, PRC-85-S03, PRC-85-S04]
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制并确认试用期绩效评估", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理（职能：试用期评估人）"}}
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理转正", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员（职能：办理转正与用工状态变更）"}}      # 人力
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉转正结果", approval_right: "无", department_hint: "所属部门", position_hint: "被评员工"}}       # 被评员工收到转正结果通知
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制试用期绩效评估
        aggregate: AGG-106
        desc: 由到期定时提醒触发（定时命令约定缺：PG-10）；评估人是用人经理
        permission: 绩效评估.编制
        page: 试用期评估编辑页
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]
        pending: V-12
        timeout: {after: "P7D", escalate_to: SH-E6, interrupting: false}   # 提醒期限待用户定（V-12）
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        desc: INV-114：同期同类型只一份，确认后不可改；事件须带评估类型，供 B-15 区分月度 / 试用期
        permission: 绩效评估.确认
        page: 试用期评估编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}   # 奖金核定依据，聚合稿已登记订阅方
      - actor: SH-E6
        where: in_system
        command: 办理转正
        aggregate: AGG-62
        emits: [〔缺〕转正已办理]
        desc: 转正前读评估（P-46）；评估结论是转正输入，不是拒绝条件。转正日为业务生效日（U-12），可提前登记、到日生效；用工状态由「试用期」转「正式」。不予转正的依据与批准走 PRC-128（公司单方终止，由归属组织单元责任人批准），V-10
        permission: 转正.办理
        page: 转正办理页
        audit: true
        pending: V-12
        notify: [{to: SH-E3, how: 企业微信通知}, {to: SH-E1, how: 企业微信通知}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: false}   # 试用期届满仍未办理转正或终止的超期提醒（天数待用户 V-12）
        outcome: 已转正
        decision:
          - {when: 公司决定不予转正, goto: PRC-128}
          - {when: otherwise, goto: end}
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 〔缺〕转正已办理}   # B-15 订阅后在 PRC-123 生成待办复核转正后薪酬（S-42，PG-10）；聚合稿现只发内部事件
    notes: "转正后薪酬是否调整由 B-15 自己的调薪流程处理，本流程只发事件（PG-10）。无人工审批：转正是评估确认后的登记，不予转正转入 PRC-128（保留审批）。次要对象：OBJ-109 绩效评估（试用期类型，已确认后才转正）。"

  - id: PRC-88
    name: 编制、批准并基线化经营计划与预算
    trigger:
      type: time
      desc: 经营计划周期开始
    stages: [VS-09.1, VS-09.3]
    stages_note: "跳过 VS-09.2 有意：SD-15 已批准 VS-09.3 有两种退出：经营计划新版本、经营复盘已闭环；本流程第二个触发（复盘后调整计划）产生经营计划新版本，PRC-181 承接经营复盘已闭环，该路径不经滚动预测；VS-09.2 的新版本由 PRC-89 产生"
    primary_object: OBJ-100
    owner_bc: B-18
    human_orchestration: true
    human_note: 计划审批、调整产生新版本
    migration: "全部历史迁入（U-1–U-4）：已基线的版本原样迁为基线，不可变；编制中与审批中的按当前状态迁入；预算账户与占用、消耗、释放历史随迁。来源待取证"
    scope: "经营计划与预算按组织单元范围可见；管理层与财务经办"
    segregation:
      - {roles: [SH-M1], rule: "编制人与审批人不得为同一人；责任人就是编制人时按 AR-11 由其上级审批"}
    triggers:
      - {type: time, name: 经营计划周期开始（年度、季度）}
      - {type: human, name: 经营复盘后调整计划（VS-09.3 退出条件：计划新版本）}
    outcomes: [经营计划新版本已基线化, 预算账户已开立, 已调整, 已撤回, 已作废]
    scenarios: [PRC-88-S01, PRC-88-S02, PRC-88-S03, PRC-88-S04, PRC-88-S05, PRC-88-S06, PRC-88-S07, PRC-88-S08, PRC-88-S09]
    roles:
      - {id: SH-M1, as: initiator, org_needs: {responsibility: 编制所辖组织单元的经营计划版本并提交审批, approval_right: 无（编制与提交）, department_hint: 计划归属组织单元（部门、事业部；公司级为管理层）, position_hint: 组织单元负责人或其指定的计划编制人}}
      - {id: SH-M1, as: approver, org_needs: {responsibility: 对本组织单元经营计划的可达性与资源取舍负责, approval_right: 经营计划审批（实例级，计划归属组织单元的责任人）, department_hint: 计划归属组织单元（公司级为管理层）, position_hint: 组织单元负责人（部门负责人）；公司级为管理层负责人}}        # 审批人是计划归属组织单元的责任人，与编制人分离见 segregation
      - {id: SH-E6, as: performer, org_needs: {responsibility: 为预算类基线开立预算账户，在基线额度总额内调剂账户额度, approval_right: 无（账户级调剂由规则守卫，不设审批）, department_hint: 财务部门, position_hint: 预算管理与预算会计职能岗}}       # 财务
      - {id: SH-O1, as: informed, org_needs: {responsibility: 获知经营计划基线, approval_right: 无, department_hint: 不适用（股东和合伙人）, position_hint: 不适用}}        # VS-09 价值接收方；不参与动作
    steps:
      - actor: SH-M1
        where: in_system
        command: 编制经营计划版本
        aggregate: AGG-79
        desc: 目标值按组织 × 期间 × 指标；目标类型含预算、承诺、挑战、预测、减值计划（terms 目标类型）；复盘后调整另起新版本，不改已基线版本（INV-101）
        permission: 经营计划.编制
        page: 经营计划编辑页
        decision:
          - {when: 编制人放弃编制中的草稿, goto: 9}
          - {when: otherwise, goto: 2}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕提交经营计划审批
        aggregate: AGG-79
        gap: G-02
        desc: 提交审批的命令聚合稿未列（同 AGG-12 的「提交报价评审」写法）
        permission: 经营计划.提交审批
        page: 经营计划编辑页
        notify: [{to: SH-M1, how: 企业微信待办}]      # 通知归属组织单元的责任人
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}

      - actor: SH-M1
        platform_task: true
        service: platform.approval
        where: in_system
        command: 经营计划审批
        desc: 审批人按计划归属组织单元解析为其责任人；方案是否可达、资源取舍是判断，不能规则化；基线不可变由 INV-101 守卫
        approval:
          engine: platform.approval
          doc_type: 经营计划审批
          approver: cost_object_owner     # 归属对象是组织单元，其责任人即部门负责人（公司级计划为管理层负责人）
          escalation_rules: [AR-11, AR-12]  # 责任人就是编制人本人 / 责任人缺位；AR-01、02 的金额阈值不适用（计划不是金额单据）
          why_human: 目标值与资源取舍是否合理、是否可达，需要责任人凭经营判断，规则只能守「基线不可变」「编制人不审自己」，不能替代判断
          on_reject: 4
        withdraw: {to: end, outcome: 已撤回}   # 审批未结束前，编制人可撤回提交（〔缺〕撤回经营计划审批，见 notes 新用语）
        permission: 经营计划.审批
        page: 经营计划审批待办
        notify: [{to: SH-M1, how: 企业微信待办}]
        audit: true
        decision:
          - {when: 审批通过, goto: 5}
          - {when: otherwise, goto: 4}

      - actor: platform
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回经营计划审批
        aggregate: AGG-79
        desc: 审批驳回的回调；退回编制（版本回到编制中）
        notify: [{to: SH-M1, how: 企业微信通知}]      # 通知编制人
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: 1}

      - actor: platform
        where: automatic
        command: 〔缺〕通过经营计划审批
        aggregate: AGG-79
        desc: 审批通过的回调
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}

      - actor: system
        where: automatic
        command: 基线化经营计划
        aggregate: AGG-79
        emits: [经营计划已基线化]
        desc: 审批通过即自动基线化，人的判断已在审批完成，不再设人工确认；基线不可变，只出新版本（INV-101）；事件仅分析
        notify: [{to: SH-E6, how: 企业微信通知}]      # 预算类通知财务开立账户
        audit: true
        metric_event: true
        decision:
          - {when: 目标类型为预算, goto: 7}
          - {when: otherwise, goto: end}
        outcome: 经营计划新版本已基线化                 # 非预算类型在此结束

      - actor: SH-E6
        where: in_system
        command: 开立预算账户
        aggregate: AGG-80
        pending: vs0911-待定1              # 预算占用超额拦截还是预警未定，影响占用步骤
        desc: 预算基线按维度树逐级生成预算账户（terms 预算分解）；开立后采购、报销等调用预算占用（占用与释放步骤在 PRC-70、PRC-87，不在本流程）
        permission: 预算账户.开立
        page: 预算账户管理页
        cross_bc:
          - {mode: api, direction: in, bc: B-11, name: 占用预算}       # B-11 → B-18 api 边已有
          - {mode: api, direction: in, bc: B-12, name: 占用预算}       # B-12 → B-18 api 边已有
        decision:
          - {when: 预算期内出现调整需求, goto: 8}
          - {when: otherwise, goto: end, outcome: 预算账户已开立}
        outcome: 预算账户已开立

      - actor: SH-E6
        where: in_system
        on_time: 预算期内出现调整需求
        command: 调整预算
        aggregate: AGG-80
        emits: [BudgetAdjusted]
        desc: 账户级调整只在已基线额度总额内调剂，由规则守卫（超出即拒绝，改走新版本，不设审批）；terms 的预算调整是「产生预算基线新版本的受控变更」，聚合稿 AGG-80 的调整预算是账户命令，两者口径不一致，见 NOTES 结构问题 2
        permission: 预算账户.调整
        page: 预算账户调整页
        audit: true
        metric_event: true
        decision:
          - {when: 调整超出基线额度总额或要改目标值（规则拒绝）, goto: 1}   # 受控变更走新版本，INV-101
          - {when: otherwise, goto: end}
        outcome: 已调整

      - actor: SH-M1
        where: in_system
        entry: 编制人放弃编制中的草稿
        branch: 放弃
        command: 作废经营计划草稿
        aggregate: AGG-79
        desc: 仅编制中的版本可放弃（INV-101）：审批中须先撤回再作废，基线不可作废（只出新版本）；草稿未提交、无下游引用，编制人自行作废，不设审批，原因必填并留审计；作废为终态，不再进入审批，要继续须另起新版本
        permission: 经营计划.作废
        page: 经营计划编辑页
        audit: true
        decision:
          - {when: otherwise, goto: end}
        outcome: 已作废
    notes: 基线不可变，只出新版本（INV-101）；复盘后调整计划也走本流程。预算账户拦截或预警未定（INV-102、〔支研〕问题 11），影响占用步骤，见 NOTES 待用户定 1。账户级预算调整不设审批：额度总额内由财务调剂并留审计，超出由规则拒绝并改走新版本审批。

  - id: PRC-89
    name: 编制滚动预测
    trigger:
      type: time
      desc: 每周销售预测承诺；按期现金流预测
    stages: [VS-09.2]
    primary_object: OBJ-100
    owner_bc: B-18
    human_orchestration: false
    migration: "全部历史迁入（U-1–U-4）：已闭环的预测版本迁为历史版本；在途 1,212 单（信息图 M-8）提示流程未闭环，迁入后只读归档，不重开。来源待取证"
    scope: "销售预测按人员本人及其管理链可见；现金流预测限财务与管理层"
    triggers:
      - {type: time, name: 每周销售预测承诺（预测周期末含现金流预测）}
    outcomes: [经营计划新版本已编制（预测）, 经营计划新版本已编制（现金流预测）, 已提醒]
    scenarios: [PRC-89-S01, PRC-89-S02, PRC-89-S03]
    roles:
      - {id: SH-E5, as: initiator, org_needs: {responsibility: 按周编制本人的销售预测版本, approval_right: 无（预测不审批）, department_hint: 市场与客户部门, position_hint: 市场和客户经理职能岗}}       # 市场和客户经理
      - {id: SH-E6, as: performer, org_needs: {responsibility: 在预测周期末编制现金流预测, approval_right: 无, department_hint: 财务部门, position_hint: 现金流与资金预测职能岗}}       # 财务
      - {id: SH-E2, as: performer, org_needs: {responsibility: VS-09.2 参与者；本骨架无其动作，待用户确认, approval_right: 无, department_hint: 项目管理相关部门, position_hint: 项目经理职能岗}}       # VS-09.2 参与者含项目经理；本骨架无其动作，待用户确认（NOTES 待用户定 4）
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知预测与逾期未报升级, approval_right: 无, department_hint: 管理层, position_hint: 管理层负责人}}
    steps:
      - actor: SH-E5
        where: in_system
        on_time: 每周
        command: 编制预测版本
        aggregate: AGG-79
        desc: 经营计划类型「预测」，目标值按人员 × 期间 × 指标；每次滚动产生新版本（VS-09.2 退出）。预测是预期不是承诺，不设审批
        permission: 预测.编制
        page: 销售预测填报页
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取人员与组织单元}   # B-18 → B-13 api 边已有；AGG-79 引用列缺人员，见 NOTES 接缝问题 1
        timeout: {after: "P7D", escalate_to: SH-M1, interrupting: false}      # 逾期未报的升级对象与期限：待用户定（NOTES 待用户定 4）
        pending: vs0911-待定4
        decision:
          - {when: 本期为现金流预测期, goto: 2}
          - {when: otherwise, goto: end, outcome: 经营计划新版本已编制（预测）}
        outcome: 经营计划新版本已编制（预测）

      - actor: SH-E6
        where: in_system
        command: 编制现金流预测
        aggregate: AGG-79
        desc: 指标为现金流（信息图 M-9），在当期销售预测版本之后编制；新版本是否经审批成为新基线，VS-09.2 notes 与本流程不一致，见 NOTES 结构问题 3
        permission: 现金流预测.编制
        page: 现金流预测编辑页
        outcome: 经营计划新版本已编制（现金流预测）
    notes: 迁移时在途 1,212 单提示流程未闭环，只读归档（信息图 M-8）。读模型 PRC-90 出具经营月报并复盘属 reporting，不在本片段。现金流预测在当期销售预测之后编制（QC 修订：原为两个独立入口，生成器无多入口写法，见 NOTES 格式问题 1）。

  - id: PRC-107
    name: 知识条目的起草、评审、发布与修订废止
    trigger:
      type: human
      desc: 技术专家主动起草；项目复盘发布后由复盘编制人决定提炼；已发布版本修订时以新版本重新进入
    stages: [VS-11.1, VS-11.2, VS-11.3]
    stages_note: "VS-11.1 由第 1–3 步承载（提交评审使 OBJ-110 到评审，即本段退出）"
    primary_object: OBJ-110
    owner_bc: B-30
    human_orchestration: true
    human_note: 有效期届满前定时提醒复审，修订或废止由人决定；评审结论可退回起草
    merged_from: [PRC-108, PRC-109, PRC-110]
    migration: "老系统无知识条目实体（信息图 OBJ-110 取证），迁入集合为空，无在途实例；A8 文档中心 567 份文档与项目档案 203 条知识平台文件夹引用是否转条目，见 NOTES 待用户定 5"
    scope: "已发布版本全员可读；起草中与评审中的版本限起草人、评审人与知识管理员；案例类若含客户信息，访问范围见 NOTES 待用户定 6"
    segregation:
      - {roles: [SH-E4], rule: "同一知识条目版本的起草人与评审人不得为同一人（SH-E4 兼任起草与评审两种身份，按人区分）；起草人就是专业负责人时按 AR-11 由其上级评审"}
    triggers:
      - {type: human, name: 技术专家主动起草}
      - {type: call, name: 项目复盘编制人在复盘详情页决定提炼，调用创建知识条目, bc: B-04}
      - {type: time, name: 已发布版本有效期届满前提前量到达，提醒复审}    # CONVENTIONS §5：登记 platform.scheduling，只提醒，不自动改状态
    outcomes: [已发布, 已修订, 已废止, 已提醒]
    frequency_ref: 待取证（老系统无知识条目，投产后起累计）
    scenarios: [PRC-107-S01, PRC-107-S02, PRC-107-S03, PRC-107-S04, PRC-107-S05, PRC-107-S06, PRC-107-S07]
    roles:
      - {id: SH-E4, as: initiator, org_needs: {responsibility: 起草、提交、发布、修订与废止知识条目, approval_right: 无（起草与发布；评审由他人）, department_hint: 技术委员会及各专业组织单元, position_hint: 技术专家（专业组成员）}}       # 技术专家（技术委员会）
      - {id: SH-E4, as: approver, org_needs: {responsibility: 对知识条目的技术正确性、适用范围与有效期负专业责任, approval_right: 知识条目评审（类型级专业角色，聚合内单级评审）, department_hint: 知识条目所属专业类别对应的组织单元（技术委员会）, position_hint: 专业负责人（技术委员会的专业负责人）}}        # 评审人：类型级专业角色（resolve: type），与起草人分离见 segregation
      - {id: SH-E2, as: initiator, org_needs: {responsibility: 在项目复盘后决定提炼并从提炼入口创建知识条目, approval_right: 无, department_hint: 项目管理相关部门, position_hint: 项目经理职能岗（复盘编制人）}}       # 项目经理：复盘编制人，从复盘提炼
      - {id: SH-E3, as: performer, org_needs: {responsibility: 参与起草知识条目内容（VS-11.1）, approval_right: 无, department_hint: 设计与咨询相关部门, position_hint: 设计师和顾问}}       # 第 2 步协作编辑
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知知识条目发布情况；评审逾期时收到升级提醒并督办, approval_right: 无（评审不由管理层做）, department_hint: 管理层, position_hint: 管理层负责人}}        # 第 4 步逾期升级、第 5 步发布通知
    steps:
      - actor: SH-E4
        where: in_system
        command: 创建知识条目
        aggregate: AGG-107
        desc: 技术专家主动创建；从项目复盘提炼时由复盘编制人（SH-E2）在 B-04 的提炼入口调用同一命令，来源复盘 ID 只记录不校验。「项目复盘已发布」订阅方是 B-04 自身，不是本 BC（AGG-103），所以触发写 call，不写 event
        permission: 知识条目.创建
        page: 知识条目编辑页（提炼入口在 B-04 项目复盘详情页）
        effort: {typical_min: 2, p90_min: 5}
        cross_bc:
          - {mode: api, direction: in, bc: B-04, name: 创建知识条目}    # B-04 → B-30 api 边已有

      - actor: SH-E4
        where: in_system
        command: 起草知识条目
        aggregate: AGG-107
        desc: 填类别、适用范围、有效期与正文；设计师和顾问（SH-E3）可协作编辑；评审退回后回到本步；修订产生的新版本经第三个触发从本步重新进入
        permission: 知识条目.起草
        page: 知识条目编辑页
        effort: {typical_min: 120, p90_min: 480}

      - actor: SH-E4
        where: in_system
        command: 提交知识条目评审
        aggregate: AGG-107
        desc: 类别、适用范围、有效期缺一不得提交（规则校验）；提交后进入「评审中」，即 VS-11.1 退出
        permission: 知识条目.提交评审
        page: 知识条目详情页
        effort: {typical_min: 2, p90_min: 5}
        notify: [{to: SH-E4, how: 企业微信待办}]      # 通知评审人（归属专业组织单元的责任人）

      - actor: SH-E4
        where: in_system
        command: 评审知识条目
        aggregate: AGG-107
        desc: 评审结论为通过或退回，退回由本命令的结论表达，不另设退回命令；审批人与审批记录在聚合内（审批人经 api 读人员）；B-30 无到 platform.approval 的边，评审是聚合内单级命令（见 NOTES 结构问题 1）
        approval:
          engine: aggregate
          doc_type: 知识条目评审           # B-30 聚合内单级评审命令，不经 platform.approval
          approver: SH-E4                 # 类型级专业角色（resolve: type）：知识条目所属专业类别对应的技术委员会专业负责人
          escalation_rules: [AR-11, AR-12]  # 评审人就是起草人本人 / 专业角色缺位：聚合内由系统改指其上级为审批人；金额类规则不适用
          why_human: 知识内容的技术正确性、适用范围与有效期是否恰当属专业判断，规则只能校验必填项、评审人不是起草人、已发布不可改（INV-115），不能替代
          on_reject: 2
        permission: 知识条目.评审
        page: 知识条目评审页
        audit: true
        effort: {typical_min: 30, p90_min: 120}
        wait: {typical_h: 24, p90_h: 120}
        timeout: {after: "P10D", escalate_to: SH-M1, interrupting: false}   # 10 天为估值，期限与升级对象仍归 NOTES 待用户定 8
        pending: vs0911-待定8
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取审批人}     # B-30 → B-13 api 边已有
        notify: [{to: SH-E4, how: 企业微信通知}]      # 通知起草人评审结论
        decision:
          - {when: 评审通过, goto: 5, p: 0.8}
          - {when: otherwise, goto: 2, p: 0.2}

      - actor: SH-E4
        where: in_system
        command: 发布知识条目
        aggregate: AGG-107
        emits: [知识条目已发布]
        pending: vs0911-待定6               # 案例类含客户信息的访问范围与脱敏确认
        desc: 发布后为「已发布」，即 VS-11.2 退出；已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅
        permission: 知识条目.发布
        page: 知识条目详情页
        audit: true
        metric_event: true
        effort: {typical_min: 2, p90_min: 5}
        notify: [{to: SH-M1, how: 企业微信通知}]      # 管理层获知发布情况
        cross_bc:
          - {mode: api, direction: in, bc: B-02, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-03, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-04, name: 校验知识条目版本存在且未废止}
          - {mode: api, direction: in, bc: B-28, name: 校验知识条目版本存在且未废止}
        decision:
          - {when: 复审认为仍适用但内容或适用范围需更新, goto: 6, p: 0.2}
          - {when: 复审认为不再适用, goto: 7, p: 0.1}
          - {when: otherwise, goto: end, outcome: 已发布, p: 0.7}
        outcome: 已发布                   # 发布后无复审结论则流程在此结束

      - actor: SH-E4
        where: in_system
        on_time: 有效期届满前提前量到达，或适用范围变化
        command: 修订知识条目
        aggregate: AGG-107
        emits: [知识条目已修订]
        desc: 产生新版本（引用被取代版本），本实例以「已修订」结束；新版本以起草中经第三个触发重新进入本流程第 2 步，评审发布后才取代旧版本，旧版本此前仍可引用
        permission: 知识条目.修订
        page: 知识条目编辑页
        audit: true
        metric_event: true
        outcome: 已修订

      - actor: SH-E4
        where: in_system
        on_time: 有效期届满
        command: 废止知识条目
        aggregate: AGG-107
        branch: 废止
        emits: [知识条目已废止]
        desc: 废止后不得被新引用，已有引用不受影响（INV-115）
        permission: 知识条目.废止
        page: 知识条目详情页
        audit: true
        metric_event: true
        outcome: 已废止
    notes: 合并原 PRC-108、109、110（⑥a 评审 H2 c）；2026-10-17 并入云端试点 VS-11（pilot/RESULT.md 第 4 节第 1–12 条，one-architecture 裁定）。已发布版本不得修改（INV-115）；引用方按 ID 与版本引用，不订阅。项目复盘提炼入口的页面在 B-04，命令在本 BC。评审是专业判断，保留人工，按聚合内审批写；补 B-30 → platform.approval 边的影响见 NOTES 结构问题 1。评审中撤回提交、评审逾期中断处理 AGG-107 无命令，由 one-architecture 回补聚合稿，本稿只写非中断升级提醒。

  - id: PRC-115
    name: 导入考勤记录并补卡
    trigger:
      type: time
      desc: 每日同步考勤来源
    triggers:
      - {type: time, name: "每日拉取企业微信打卡记录（platform.scheduling 定时）"}
      - {type: human, name: "人力修复人员对照后重新拉取"}
    stages: []
    primary_object: OBJ-70
    support: "B-27 考勤原始记录的导入与补卡，是月度考勤确认（PRC-118）的输入，结局（考勤已导入、补卡已记录）不造 VS-13.1 的任一退出条件（月度考勤已锁定、请假已汇入、加班已汇入）（STAGE_ALIGN.md 归段判据第 6 项）"
    owner_bc: B-27
    human_orchestration: false
    migration: "历史打卡（老系统约 79.5 万行）与补卡经迁入通道全量迁入为考勤记录，来源对照区分来源系统；迁入不触发导入流程、不发事件（ADR-0036 M7）"
    scope: "员工本人看自己的考勤；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [考勤已导入, 导入失败已告警, 补卡已记录]
    scenarios: [PRC-115-S01, PRC-115-S02, PRC-115-S03, PRC-115-S04, PRC-115-S05]   # S01 每日导入成功；S02 拉取失败或批次不完整，告警后人力重拉；S03 存在无法对应人员的记录，整批告警；S04 员工补卡，原记录不改，所属月已锁定则计入下月更正行；S05 补卡超次数或时限，被拒回补卡页
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 补卡发起人（员工）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收导入失败告警，修复人员对照后重新拉取", approval_right: "无", department_hint: "人力资源部、信息部门", position_hint: "人力资源专员、考勤管理员"}}       # 人力、信息：导入失败告警
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属补卡", approval_right: "无（补卡不设审批，由次数与时限规则守卫）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：补卡知会
    steps:
      - actor: system
        where: external:企业微信
        evidence: [导入批次号, 拉取日期, 记录条数, 校验和]
        command: 导入考勤记录
        aggregate: AGG-69
        desc: 经 platform.integration 的企业微信适配器每日拉取前一日打卡，转换后调用本 BC 写入；只追加不可改（INV-69），以企业微信记录 ID 幂等；企业微信成员经来源对照解析到人员 ID，解析不到的记录整批告警不静默。补卡只补已导入日期上缺失的打卡，故员工补卡从本步之后进入步骤 3
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 拉取企业微信打卡记录}
        decision:
          - {when: "拉取失败、批次不完整或存在无法对应人员的记录", goto: 2}
          - {when: "员工发现已导入日期缺卡并发起补卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 考勤已导入
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；INV-69；用户事实 intent 2026-10-16-152603（打卡来源企业微信）
      - actor: platform
        where: automatic
        platform_task: true
        service: platform.integration
        command: 告警导入失败
        desc: 告警人力与信息，不静默；缺失日期不得被月度考勤当作“全勤”（PRC-118 步骤 1 校验）；修复后由人力重新拉取（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 导入失败已告警
      - actor: SH-E3
        where: in_system
        entry: 员工对已导入日期的缺卡发起补卡
        branch: 补卡
        command: 补卡
        aggregate: AGG-69
        pending: U4
        desc: 原打卡记录不改，补卡另记一条（INV-69）；规则守卫（不设上级审批）：只能补该日缺失的打卡、每月补卡次数不超上限、不超补卡时限，违反即拒绝并停留在补卡页；所属月份月度考勤已锁定的，补卡照常记录，其对考勤的影响计入下月更正行并标原月份（INV-105）。次数上限与时限待用户定 U4
        permission: 考勤.补卡
        page: 补卡申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "超出每月补卡次数上限、补卡时限，或该日并不缺卡", goto: 3}
          - {when: otherwise, goto: end}
        outcome: 补卡已记录
    notes: 来源系统已定为企业微信（原 v1 备注“来源系统待定 R2”作废）。外勤、出差、特殊假别等非打卡类考勤聚合稿无命令，见 notes 结构问题。补卡不设人审：证据在打卡与补卡留痕，滥用靠次数与时限规则及月度考勤员工确认、用人经理知会兜底（QC-VS-13.md）。

  - id: PRC-116
    name: 申请并审批请假
    trigger:
      type: human
      desc: 员工提交请假
    triggers:
      - {type: human, name: "员工提交请假"}
    stages: [VS-13.1]
    primary_object: OBJ-68
    owner_bc: B-27
    human_orchestration: true
    human_note: 请假审批、驳回或撤销释放额度；额度与假期规则内的请假自动通过，只有异常单进入人工审批
    migration: "历史请假（老系统请假档案约 2.4 万条）全量迁入为已结实例，已用额度按迁入对账不重算、不发事件；在途（审批中）按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）"
    scope: "员工本人、其审批人、人力；病假等事由随 ADR-0043 分级限制可见范围（事由敏感度 tbd，交 U-11）"
    segregation:
      - {roles: [SH-E3, SH-E1], rule: "申请人不得审批本人请假（申请人本身是部门负责人时，按 AR-11 由其上级审批）"}
    outcomes: [已批准, 已驳回, 已撤销, 已销假, 额度不足被拒, 已提醒]
    scenarios: [PRC-116-S01, PRC-116-S02, PRC-116-S03, PRC-116-S04, PRC-116-S05, PRC-116-S06, PRC-116-S07, PRC-116-S08, PRC-116-S09, PRC-116-S10, PRC-116-S11, PRC-116-S12]   # S01 额度不足被拒；S02 额度内年假自动批准；S03 超阈值长假进入审批并批准；S04 审批驳回释放占用；S05 审批中员工撤回；S06 审批 3 日无人处理，非中断升级提醒管理层（结局已提醒，主线照常）；S07 已批准未开始，员工撤销回冲；S08 请假已开始提前销假回冲；S09 申请人本人是部门负责人，由其上级审批（AR-11）；S10 政策允许透支，进入审批；S11 请假已开始后员工点撤销，转为销假办理；S12 假期类型为补休，冲抵补休额度行并自动批准
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为申请人所在组织单元的责任人，判断异常请假能否离岗", approval_right: "正常一级审批（cost_object_owner 解析结果）；超阈值时 AR-11、AR-12 加审", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 申请人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: informed, org_needs: {responsibility: "接收审批超期或期限提醒的升级，必要时督办", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 审批超期升级对象；暂拟，待 U3
      - {id: SH-E6, as: informed, org_needs: {responsibility: "维护额度与假期规则，接收请假知会", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：额度与假期规则维护方，知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 占用余额
        aggregate: AGG-71
        reads: [AGG-68, AGG-108, AGG-118]
        desc: 与提交请假是员工的同一次操作，分两个聚合两个事务，最终一致；占用以请假 ID 幂等，孤儿占用由定时释放（聚合稿 §7 第 6 条）；同时读工作日历与标准工时版本做按日拆分（取不到当日生效版本须失败并告警，INV-116）。假期类型为补休时（劳动法第四十四条：休息日加班先安排补休），不占年度账户，按到期日先后冲抵员工的补休额度行（PRC-117 计入），请假日不得晚于所冲抵额度行的到期日，额度不足同样被拒
        permission: 请假.提交
        page: 请假申请页
        cross_bc:
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与汇报线}
        decision:
          - {when: "超出可用额度且假期类型政策不允许透支", goto: end, rule: INV-68}
          - {when: otherwise, goto: 2}
        outcome: 额度不足被拒
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        pending: U3
        desc: 起止时刻可跨日、半天或按小时；按日拆分，非工作日计 0（补休作为请假类型同样按日拆分，与年假一样扣减当日最低应填工时，RULE-413）。系统按规则分流：额度内、假期类型规则允许、单次天数不超免审批阈值、该假别无需证明材料的，自动批准并知会直属上级；其余（超阈值、需证明材料的假别、政策允许的透支）进入人工审批。阈值与假别清单待用户定 U3
        permission: 请假.提交
        page: 请假申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: "额度内、假期规则允许、天数不超免审批阈值且无需证明材料", goto: 4}
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；INV-68（额度）；AGG-118（假期规则）；阈值待 U3
      - actor: SH-E1               # 部门负责人
        where: in_system
        platform_task: true
        service: platform.approval
        command: 请假审批
        pending: U3
        desc: 只有超阈值长假、需证明材料的假别（是否合规需人看材料）、政策允许的透支才到此；工时单最低时数扣减已批准与待批请假（INV-65，B-06 经 api 读取，只取时长）
        approval:
          engine: platform.approval
          doc_type: 请假审批
          approver: cost_object_owner   # 请假单的归属对象是申请人所在组织单元，其责任人即部门负责人（SH-E1）
          why_human: "超阈值长假、需证明材料的假别与透支需判断业务上能否离岗（项目人力安排）和材料真伪，规则只能校验额度、假期规则与天数，不能代替这一判断；额度内的常规请假已自动通过。"
          escalation_rules: [AR-11, AR-12]
          on_reject: 6
        permission: 请假.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        timeout: {after: "P3D", escalate_to: SH-M1, interrupting: false}   # 暂拟 3 日无人处理升级提醒管理层，待 U3；非中断，升级后接独立结束事件「已提醒」，主线照常（BPMN_STYLE 第 3 节，S-28）
        withdraw: {to: 7}
        decision:
          - {when: 审批驳回, goto: 6}
          - {when: 员工在审批中撤回, goto: 7}
          - {when: otherwise, goto: 4}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起请假审批}
      - actor: system
        where: automatic
        command: 批准请假
        aggregate: AGG-70
        emits: [请假已批准]
        desc: 两条路径汇合：规则内自动批准，或审批平台通过的回调（走审批的路径带“审批已通过”事件）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 批准转已用
        aggregate: AGG-71
        on_event: [{aggregate: AGG-70, event: 请假已批准}]
        desc: 同 BC 事件反应，把占用转为已用；批准后员工仍可在开始前撤销或开始后销假
        decision:
          - {when: 请假开始前员工撤销, goto: 7}
          - {when: 请假期间员工提前结束, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已批准
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回请假
        aggregate: AGG-70
        desc: 审批驳回的回调；聚合稿 AGG-70 没有驳回命令（NOTES 铺开备忘）
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: SH-E3
        where: in_system
        entry: 请假审批中或已批准、尚未开始时，员工撤销
        branch: 撤销
        command: 撤销请假
        aggregate: AGG-70
        emits: [请假已撤销]
        desc: 审批中撤销须同时撤回审批实例（platform.approval 的取消能力，见 notes 接缝问题 1）；已开始的请假不能撤销，只能销假
        inner:
          - {command: 释放余额占用, aggregate: AGG-71}          # 审批中撤销：占用尚未转已用
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}    # 已批准后撤销：占用已转已用，需回冲
        permission: 请假.撤销
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 请假已开始, goto: 8}
          - {when: otherwise, goto: end}
        outcome: 已撤销
      - actor: SH-E3
        where: in_system
        entry: 已批准的请假提前结束
        branch: 销假
        command: 销假
        aggregate: AGG-70
        emits: [请假已销假]
        desc: 未休完的部分回冲已用额度；销假是事实登记，不再审批，知会直属上级（U3 推荐，待确认）
        inner:
          - {command: 〔缺〕回冲已用额度, aggregate: AGG-71}
        permission: 请假.销假
        page: 我的请假页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        outcome: 已销假
    notes: 驳回、撤销、销假的额度回冲在聚合稿没有对应命令（驳回请假、回冲已用额度均为〔缺〕）；补休类回冲回原额度行。v1 把“占用余额”写在“提交请假”之前，骨架保留 v1 顺序并说明为同一次操作。

  - id: PRC-117
    name: 申请并批准加班
    trigger:
      type: human
      desc: 员工或部门提出加班
    triggers:
      - {type: human, name: "员工或用人经理登记加班"}
    stages: [VS-13.1]
    primary_object: OBJ-72
    owner_bc: B-27
    human_orchestration: false
    human_note: 加班审批已取消：事前登记，事后以打卡核实，批准由系统按规则作出（质检修订，用户原则）；补休额度的计入与到期前提醒均由规则执行，无人审；到期未休与离职时转计发加班工资归 PRC-178（S-41）
    migration: "历史加班（老系统是否有加班记录尚未取证）全量迁入为已结实例；在途按当前状态迁入通用审批（C-3–C-7，ADR-0036 M7）；迁入的补偿方式为调休的加班，其未休余额是否迁为补休额度行待取证后定，不凭推测"
    scope: "员工本人、其用人经理、人力；补休额度只本人与人力可见"
    outcomes: [已批准, 已驳回, 补休已休完, 已提醒, 已移交计发]
    scenarios: [PRC-117-S01, PRC-117-S02, PRC-117-S03, PRC-117-S04, PRC-117-S05, PRC-117-S06, PRC-117-S07]   # S01 登记、加班日后打卡核实、自动批准（付薪）；S02 打卡不支持登记的加班时长，驳回；S03 当月累计超 36 小时预警并知会、不拦截；S04 补登超过允许期限，被拒回登记页；S05 休息日加班计补休，批准后计入补休额度，到期前员工休完；S06 到期前员工未排定补休，非中断提醒员工与直属上级，主线照常；S07 有效期届满仍有未休余额，交 PRC-178 转计发加班工资
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出并对本人申请事项的真实性负责；在补休额度有效期届满前自行排定并休完补休", approval_right: "无（本人申请不得自批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉下属加班登记，也可代员工登记；补休额度到期前收到提醒，与员工排定补休", approval_right: "无（加班不设审批，由打卡核实）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：登记知会；也可代员工登记；补休到期前提醒
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收当月加班超 36 小时的预警", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员"}}       # 人力：当月超 36 小时预警知会
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交加班申请
        aggregate: AGG-72
        pending: U5
        desc: 登记即事前申请，不设审批：每月累计超 36 小时只预警并留痕，不拦截（P-34；劳动法第四十一条）；补偿方式由加班日类型限定：法定节假日只能付加班费（300%），不补休；休息日由单位安排补休，不能安排补休的付加班费（200%）（劳动法第四十四条：先安排补休，不能安排的支付不低于 200%）；工作日延时按现有补偿政策（口径不变，加班费 150%）；补偿方式不由员工选择：休息日加班默认计补休，确因工作不能安排补休的由直属上级在登记时标明「不能安排补休」，改付加班费；不设审批（劳动法第四十四条「单位安排补休」）。非工作日工时与加班、补休的衔接另定（BC 接缝由 one-architecture 负责，one-rules FD2-05 规则卡作输入）；事后补登的允许期限待用户定 U5
        permission: 加班.申请
        page: 加班申请页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E6, how: 企业微信通知}]   # 人力仅超 36 小时时才发
        decision:
          - {when: "补登超过允许期限，或加班时段与已批准请假重叠", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        on_time: 加班日考勤已导入
        command: 批准加班
        aggregate: AGG-72
        emits: [加班已批准]
        desc: 以打卡核实代替人工批准：加班日的打卡记录（AGG-69）能支持登记的加班时长即批准（以打卡可证实的时长为准）；批准后汇入当月月度考勤（PRC-118 读取，不订阅），工时单引用加班 ID；补偿方式为补休的，继续计入补休额度
        decision:
          - {when: 打卡记录不支持登记的加班时长, goto: 3}
          - {when: 补偿方式为补休, goto: 4}
          - {when: otherwise, goto: end}
        outcome: 已批准
        # 依据：用户原则「能规则化就不设人审」；加班费真实性由打卡校验，必要性由超 36 小时预警与月度考勤知会兜底
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回加班
        aggregate: AGG-72
        desc: 聚合稿 AGG-72 没有驳回命令；打卡不支持时驳回并告知登记人
        notify: [{to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: system
        where: automatic
        branch: 补休
        command: 〔缺〕计入补休额度
        aggregate: AGG-71
        pending: U15
        desc: 补休额度归 B-27（S-44）：加班批准且直属上级未标「不能安排补休」的休息日加班，按批准时长给员工计一笔补休额度行（假期类型补休）；本期工时（B-06）不读加班审批与补休余额（RULE-412），到期日 = 加班日 + 补休有效期（时长待用户定 U15），额度行不按年度、不随年度结转；同一事务内把加班标记为已计入补休额度，以加班 ID 幂等；由此不再出现「已批准却无人追踪补偿」的加班
        inner:
          - {command: 〔缺〕标记加班已计补休, aggregate: AGG-72}
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（补休额度已计入及到期日）}]
      - actor: SH-E3
        where: in_system
        command: 提交请假
        aggregate: AGG-70
        calls: PRC-116
        desc: 员工在额度到期日前自行向直属上级排定并休补休：补休走请假（假期类型补休，占用补休额度行，PRC-116）；有效期届满前（时长待用户定 U15）员工与直属上级收到提醒（非中断，主线照常）；补休由单位安排，系统不替单位判断「已安排」，故不因员工未休而作废额度（劳动法第四十四条）
        permission: 请假.提交
        page: 我的请假页
        pending: U15
        timeout: {after: "有效期届满前（时长待用户定 U15）", escalate_to: SH-E1, interrupting: false}   # 有效期长度与提前提醒的时点待 U15，骨架不先定；升级只提醒员工与直属上级，非中断，升级后接独立结束事件「已提醒」，主线照常（BPMN_STYLE 第 3 节）
        decision:
          - {when: 补休额度有效期届满仍有未休余额, goto: PRC-178, outcome: 已移交计发}
          - {when: otherwise, goto: end}
        outcome: 补休已休完
    notes: 加班“已补偿”：付薪的由月度考勤已确认事件触发（PRC-118）；补休的在计入补休额度时标「已计入补休额度」，补偿追踪转到 AGG-71 额度行。补偿方式（加班费或补休）在 AGG-72 记录；补休以请假冲抵（假期类型补休），不再叫「调休」——词表「调休」专指工作日历的调休上班日（B-14）。补休有效期时长待用户定 U15（见 notes 待用户定）；到期与离职都不作废：B-27 在有效期届满时发「补休已到期未休」、离职时随 Separated，由 B-15 经 PRC-178 读取补休余额并计入加班工资（S-41），PRC-117 只管补休登记与到期前提醒。原 v1 的审批节点取消，PRC-117 不再是人工编排流程（catalog 的 human_orchestration 须随之改为 false，见 notes 格式问题）。

  - id: PRC-118
    name: 生成、确认并锁定月度考勤
    trigger:
      type: time
      desc: 月末
    triggers:
      - {type: time, name: "月末生成（platform.scheduling 定时）；确认期限届满锁定"}
      - {type: human, name: "人力在导入修复后重新发起生成"}
      - {type: event, entry: 7, name: "员工离职生效（B-13 发布 Separated；S-42）", event: Separated, bc: B-13}
    stages: [VS-13.1]
    primary_object: OBJ-111
    secondary_objects: [OBJ-72]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-27
    human_orchestration: false
    human_note: 员工确认或更正，逾期默认确认并自动锁定（人力不再手工锁定、不再代确认；质检修订）
    migration: "历史月度考勤确认（老系统月 × 一级部门 1,026 单）与人员 × 月不对应：按 NOTES 待用户定数据 2 处理，本流程不触发、不回放；锁定前的在途月份按当前状态迁入"
    scope: "员工本人看自己的；用人经理看汇报线内；人力看法人数据范围内"
    outcomes: [已锁定, 已暂缓]
    scenarios: [PRC-118-S01, PRC-118-S02, PRC-118-S03, PRC-118-S04, PRC-118-S05, PRC-118-S06]   # S06 员工离职生效（Separated），离职当月已生成未确认的月度考勤立即默认确认并锁定；S01 员工确认后期限届满自动锁定；S02 员工提出更正，补卡后重新生成再确认；S03 逾期未确认，默认确认并锁定、标记；S04 离职当月，账号已吊销，默认确认并锁定；S05 当月有日期导入失败，暂缓生成
    roles:
      - {id: SH-E3, as: performer, org_needs: {responsibility: "核对并确认本人当月出勤、请假、加班，有异议提出更正", approval_right: "无（确认是数据主体对自己事实的确认，不是审批）", department_hint: "员工所在部门", position_hint: "全体在职员工"}}      # 员工：确认或更正本人月度考勤
      - {id: SH-E1, as: informed, org_needs: {responsibility: "接收逾期未确认名单，必要时提醒下属", approval_right: "无", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}       # 用人经理：逾期未确认名单知会
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：导入失败暂缓知会
    steps:
      - actor: system
        where: automatic
        command: 生成月度考勤
        aggregate: AGG-97
        reads: [AGG-69, AGG-70, AGG-72, AGG-68]
        desc: 汇总考勤、请假、加班，人员 × 月一份；含出勤天数、请假（按类型，含补休）、加班（按补偿方式：付薪的汇入加班费时长，补休的汇入计入补休额度的时长、不进加班费）与更正行；月内存在无导入批次或批次失败的日期时失败并告警，不得当作全勤；审批中的请假不汇入，批准后计入下月更正行并标原月份（INV-105）
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取当月在职与当月离职人员}
          - {mode: api, direction: out, bc: B-14, name: 读取工作日历与标准工时版本}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 暂缓时才发
        decision:
          - {when: "当月有日期的考勤导入失败或缺批次", goto: end}
          - {when: "人员当月已离职（离职生效后账号已吊销，本人无法确认）", goto: 7}
          - {when: otherwise, goto: 2}
        outcome: 已暂缓
        # 依据：CLAUDE.md 第 6 条；PRC-115 步骤 2；RULE-363（离职生效即吊销登录）；STEP3 C-17（离职当月仍须确认考勤）
      - actor: SH-E3
        where: in_system
        command: 员工确认
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 员工核对本人当月出勤、请假、加班，无误即确认，有异议提出更正；这是数据主体对自己事实的确认（劳动争议中的出勤证据），不是审批，不设 approval；期限内未确认由系统默认确认，不追办、不人工代确认
        permission: 月度考勤.确认
        page: 我的月度考勤页
        audit: true
        timeout: {after: "P3D", escalate_to: system, interrupting: true}   # 暂拟 3 天，起算点与期限待用户定 U6；届满由系统默认确认（步骤 7）
        decision:
          - {when: 提出更正, goto: 5}
          - {when: 确认期限届满仍未确认, goto: 7}
          - {when: otherwise, goto: 3}
      - actor: system
        where: automatic
        command: 标记加班已补偿
        aggregate: AGG-72
        on_event: [{aggregate: AGG-97, event: 月度考勤已确认}]
        emits: [加班已补偿]
        desc: 订阅月度考勤已确认（同 BC），只标补偿方式为付薪的已批准加班，按加班 ID 幂等；补休的加班在计入补休额度时已标（PRC-117 第 4 步），不在此标
      - actor: system
        where: automatic
        on_time: 员工确认期限届满
        command: 锁定
        aggregate: AGG-97
        emits: [月度考勤已锁定]
        desc: 确认期限届满自动锁定，未确认者标记“逾期未确认”；锁定后不改，补卡、请假、加班变动计入下月并标原月份（INV-105）；月度考勤已锁定是 B-15 薪酬结算可取数的依据
        audit: true
        notify: [{to: SH-E1, how: 企业微信待办}]     # 逾期未确认名单
        outcome: 已锁定
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 月度考勤已锁定}
      - actor: SH-E3
        where: in_system
        entry: 员工对生成结果有异议
        branch: 提出更正
        command: 补卡
        aggregate: AGG-69
        calls: PRC-115
        desc: 缺卡走补卡；请假或加班有误由员工撤销或重提（PRC-116、PRC-117）；锁定前的更正都回到“重新生成”
        permission: 考勤.补卡
        page: 我的月度考勤页
      - actor: system
        where: automatic
        branch: 重新生成
        command: 〔缺〕重新生成月度考勤
        aggregate: AGG-97
        desc: 确认前依据最新考勤、请假、加班重新汇总，幂等；已确认或已锁定的不可重新生成（INV-105）
        decision:
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        entry: 逾期未确认，或人员当月已离职、本人无法登录确认，或员工离职生效（订阅 B-13 的 Separated，S-42）
        branch: 默认确认
        command: 〔缺〕默认确认月度考勤
        aggregate: AGG-97
        emits: [月度考勤已确认]
        pending: U6
        desc: 取代原“人力手工锁定”与“人力代员工确认”：按生成结果默认确认并标记（逾期未确认 / 已离职），留存标记与审计；锁定后的异议走下月更正行。是否改回人力代确认离职人员见 U6。S-42 事件入口：订阅 B-13 的 Separated，对该人员当月（及仍未确认的以往月份）已生成而未确认的月度考勤立即默认确认并标记已离职，不等确认期限；尚未生成的由第 1 步月末处理（已离职分支直达本步）；已确认或已锁定的不重复（幂等）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
        decision:
          - {when: otherwise, goto: 3}
        # 依据：用户原则「能规则化就不设人审」；RULE-363；STEP3 C-17（“确认”由默认确认满足，待 U6 确认）
    notes: "补休额度的到期未休与离职转计发不经月度考勤，由 B-15 在 PRC-178 读取 B-27 补休余额并登记，PRC-124 读取本 BC 的登记（月度考勤只汇总当月发生的出勤、请假、加班）。员工确认是员工本人对自己月度考勤的确认，不是审批（质检修订：notes 格式问题 2 作答），故不写 approval，catalog 的 human_orchestration 须改为 false。人力不再手工锁定、不再代确认，减少两次人工；用人经理不复核（U6 推荐不变）。次要对象：OBJ-72 加班（付薪类「已补偿」由月度考勤确认事件触发）。"

  # ───────────── VS-13.2 绩效激励 ─────────────

  - id: PRC-120
    name: 评估月度绩效
    trigger:
      type: time
      desc: 评估期间结束
    triggers:
      - {type: time, name: "评估期间结束（platform.scheduling 定时提醒用人经理）"}
    stages: [VS-13.2]
    primary_object: OBJ-109
    owner_bc: B-13
    human_orchestration: false
    migration: "历史月度评估（老系统月度评估表 三类模板）全量迁入为已确认评估，不发事件、不触发奖金核定（ADR-0036 M7）"
    scope: "被评人员本人、其用人经理与上级、人力；评估结论按个人信息分级（ADR-0043）"
    outcomes: [已确认, 已更正]
    scenarios: [PRC-120-S01, PRC-120-S02, PRC-120-S03, PRC-120-S04]   # S01 编制、提交、确认；S02 同人同期同类型已有已确认评估被拒；S03 已确认评估发现错误，评估人追加更正记录（未涉及已核定奖金）；S04 更正涉及已核定奖金，人力转 PRC-122 重新草拟
    roles:
      - {id: SH-E1, as: performer, org_needs: {responsibility: "编制、提交并确认下属月度绩效评估，对评估结论负责", approval_right: "无（评估是专业判断）", department_hint: "员工所在组织单元", position_hint: "部门负责人、用人经理"}}
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收系统告警与知会并跟进处理", approval_right: "无", department_hint: "人力资源部（薪酬事项含财务部）", position_hint: "人力资源专员、薪酬岗"}}       # 人力：评估完成知会
    steps:
      - actor: SH-E1
        where: in_system
        command: 编制绩效评估
        aggregate: AGG-106
        desc: 评估期间结束由系统提醒用人经理；类型为月度；同一人同期同类型只一份（INV-114）
        permission: 绩效评估.编制
        page: 绩效评估编辑页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 同一人同期同类型已有已确认评估, goto: end, rule: INV-114}
          - {when: otherwise, goto: 2}
        outcome: 已确认
      - actor: SH-E1
        where: in_system
        command: 提交绩效评估
        aggregate: AGG-106
        pending: U11
        desc: 提交的接收方（上级复核、被评人阅知或申诉）v1 未写，见 notes 待用户定 U11；本稿不设审批，评估是用人经理的专业判断而非审批，若 U11 定上级复核再按 cost_object_owner 加人工审批
        permission: 绩效评估.提交
        page: 绩效评估编辑页
      - actor: SH-E1
        where: in_system
        command: 确认绩效评估
        aggregate: AGG-106
        emits: [绩效评估已确认]
        pending: U11
        desc: 确认后不可改（INV-114）；事件须带评估类型（月度 / 试用期），否则 PRC-122 无法区分（notes 结构问题）
        permission: 绩效评估.确认
        page: 绩效评估编辑页
        audit: true
        decision:
          - {when: 已确认评估发现错误, goto: 4}
          - {when: otherwise, goto: end}
        outcome: 已确认
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 绩效评估已确认}
      - actor: SH-E1
        where: in_system
        entry: 已确认评估发现错误
        branch: 更正
        command: 登记绩效更正
        aggregate: AGG-106
        desc: 已确认评估不改（INV-114），评估人追加一条更正记录引用原评估，写明更正项、更正后结论、原因与依据；不设审批：更正是评估人对自己评估的专业修正，留痕在更正记录与审计，原评估与奖金核定的复核由规则守卫（须引用原评估、原因必填）与下游人力知会兜底；更正后若该评估已被奖金核定引用，人力在 PRC-122 人力触发入口重新草拟，系统不自动改已核定奖金
        permission: 绩效评估.更正
        page: 绩效评估更正页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]      # 人力核对是否涉及已核定奖金
        decision:
          - {when: 更正的评估已被奖金核定引用, goto: PRC-122}
          - {when: otherwise, goto: end}
        outcome: 已更正
    notes: 状态流转由用户定，细则为推断，待流程梳理确认（v1）。试用期评估是 PRC-85 的步骤，不在本流程。S-35：更正分支承载 AGG-106 登记绩效更正；不设人审的理由见步 4 desc，若用户认为更正须上级复核再加 approval（cost_object_owner）。

  - id: PRC-121
    name: 制定激励方案
    trigger:
      type: human
      desc: 管理层与人力制定
    triggers:
      - {type: human, name: "人力按管理层要求编制激励方案版本"}
    stages: [VS-15.1, VS-15.2, VS-15.3]
    stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；VS-15.1 编制、VS-15.2 已生效、VS-15.3 已结束，均由本流程完成（判据推出 VS-15.2、VS-15.3）；原支撑理由：B-15 激励方案版本的配置维护，结局（已生效）不造 VS-13.2 的退出条件（激励方案「生效」是 VS-13.2 的进入条件；退出是评估已确认、奖金已核定）（STAGE_ALIGN.md 归段判据第 6 项）"
    primary_object: OBJ-74
    owner_bc: B-15
    human_orchestration: true
    human_note: 编制 → 审批 → 到期自动生效
    migration: "历史激励方案（老系统无流程，奖金计提来自线下导入）按方案版本重建后迁入；在途无；迁入不触发审批（ADR-0036 M7）"
    scope: "人力、管理层；方案含薪酬敏感数据"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "方案编制人不得审批本人编制的方案（AR-11 同理）"}
    outcomes: [已生效, 已撤回]
    scenarios: [PRC-121-S01, PRC-121-S02, PRC-121-S03, PRC-121-S04, PRC-121-S05]   # S01 编制、审批通过、到期自动生效；S02 审批驳回退回修改；S03 编制人在审批中撤回；S04 生效日早于已核定奖金所属期，被拒回编制；S05 方案额度合计超阈值，加一级（AR-01）
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "按管理层要求编制激励方案版本（规则与额度），对内容完整性负责", approval_right: "无（编制人不得审批本人编制的方案）", department_hint: "人力资源部", position_hint: "人力资源负责人、薪酬岗"}}      # 人力
      - {id: SH-M1, as: approver, org_needs: {responsibility: "作为方案适用范围的责任人，对经营取舍负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值时上加一级", department_hint: "公司管理层", position_hint: "总经理、分管副总、事业部负责人"}}       # 管理层：方案适用范围（法人或事业部）的责任人
    steps:
      - actor: SH-E6               # 人力
        where: in_system
        command: 编制激励方案版本
        aggregate: AGG-75
        desc: 规则与额度；版本化配置（D15），生效日期向后，不追溯已核定奖金；规则守卫：生效日期不得早于已核定奖金所属期，违反即拒绝并停留在编辑页
        permission: 激励方案.编制
        page: 激励方案编辑页
        decision:
          - {when: "生效日期早于已核定奖金所属期", goto: 1}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 激励方案审批
        gap: G-02
        pending: U10
        desc: 方案规则与额度是经营决策，保留人审
        approval:
          engine: platform.approval
          doc_type: 激励方案审批
          approver: cost_object_owner   # 方案的归属对象是其适用范围（法人或事业部），责任人为管理层（SH-M1）
          why_human: "激励方案的规则与额度决定公司对员工的奖金承诺，涉及经营导向与预算取舍，没有客观条件可由规则代替；生效后不可追溯修改，故事先由责任人批准。"
          escalation_rules: [AR-01, AR-02]   # 金额取方案额度上限合计；阈值待 U10
          on_reject: 1
        permission: 激励方案.审批
        page: 审批待办页
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: end, outcome: 已撤回}
        decision:
          - {when: 审批驳回, goto: 1}
          - {when: 编制人在审批中撤回, goto: end}
          - {when: otherwise, goto: 3}
        outcome: 已撤回
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起激励方案审批}
      - actor: system
        where: automatic
        on_time: 方案生效日期到达
        command: 生效激励方案版本
        aggregate: AGG-75
        emits: [激励方案已生效]
        desc: 审批通过后到生效日期自动生效，不再由人力手工点击；前置：审批已通过
        audit: true
        outcome: 已生效
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
    notes: G-02 已处理（AGG-75 引用 platform.approval，intent 114200 F-2）。驳回回到编制，不结束流程，故结局词去掉“已驳回”、加“已撤回”。

  - id: PRC-122
    name: 核定奖金
    trigger:
      type: event
      events:
        - {event: 绩效评估已确认, aggregate: AGG-106, filter: "评估类型为月度"}
    triggers:
      - {type: event, name: "绩效评估已确认（仅月度评估；B-13 发布）"}
      - {type: human, name: "人力在调整评估或激励方案后重新草拟"}
    stages: [VS-13.2]
    primary_object: OBJ-104
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统按方案规则草拟，责任人审批核定（质检修订：取消人力手工草拟）
    migration: "历史奖金（2020–2025 历史奖金与奖金计提来自老系统线下导入）按个人 × 期间迁入为已核定；迁入不触发核定（ADR-0036 M7）"
    scope: "人力、管理层与奖金归属人本人；奖金属薪酬敏感信息"
    segregation:
      - {roles: [SH-E1, SH-E1], rule: "用人经理既是评估人又是核定人时，奖金由系统按方案规则草拟、不得由其改额；核定人是被核定人本人时按 AR-11 由其上级核定"}
    outcomes: [已核定, 无需核定, 已中止, 已驳回, 期间关账中待重试]
    scenarios: [PRC-122-S01, PRC-122-S02, PRC-122-S03, PRC-122-S04, PRC-122-S05, PRC-122-S06, PRC-122-S07]   # S01 月度评估确认后草拟、核定并提交重分类（全程）；S02 试用期评估确认不触发；S03 没有生效方案或草拟金额超方案额度，已中止并告警人力；S04 责任人驳回；S05 奖金金额超阈值，加一级或两级（AR-01、AR-02）；S06 核定期间无项目人工，整额留原法人；S07 核定期间人工成本分配未过账或期间关账中，延后重试
    roles:
      - {id: SH-E1, as: approver, org_needs: {responsibility: "作为被评人所在组织单元的责任人，核对草拟奖金是否有规则看不到的情况", approval_right: "正常一级审批（cost_object_owner 解析结果）；本人是被核定人时由上级核定", department_hint: "被评人所在组织单元", position_hint: "部门负责人、用人经理"}}       # 被评人所在组织单元的责任人（cost_object_owner 解析结果）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "奖金金额超阈值时的上一级责任人", approval_right: "加审一级（AR-02 总经理）", department_hint: "公司管理层", position_hint: "总经理"}}       # 金额超阈值时加审（AR-02 总经理一级）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收奖金草拟已中止或被驳回的告警，调整方案或评估后重新草拟", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力：已中止告警
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕草拟奖金核定
        aggregate: AGG-76
        reads: [AGG-75, AGG-106]
        pending: U10
        desc: 读激励方案与核定依据的绩效评估，按方案规则草拟个人奖金（评分到金额的映射在方案规则里；映射不足以自动算时回到人力草拟，见 U10）；草拟金额超出方案额度的拒绝并告警
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 绩效评估已确认}
          - {mode: api, direction: out, bc: B-13, name: 读取绩效评估结论}
        decision:
          - {when: 评估类型不是月度（如试用期评估），无需核定, goto: end}
          - {when: 没有生效的激励方案版本，或草拟金额超出方案额度，已中止, goto: end}
          - {when: otherwise, goto: 2}
        # 依据：PRC-85 的试用期评估也发“绩效评估已确认”，事件现无评估类型（notes 结构问题 4）；失败并告警人力，不静默（CLAUDE.md 第 6 条）
      - actor: SH-E1
        where: in_system
        platform_task: true
        service: platform.approval
        command: 奖金核定审批
        pending: U10
        desc: 责任人核对草拟奖金，可批准或驳回，不改金额；奖金是对个人的资金承诺，保留人审
        approval:
          engine: platform.approval
          doc_type: 奖金核定审批
          approver: cost_object_owner   # 奖金单的归属对象是被评人所在组织单元，责任人即部门负责人（SH-E1）
          why_human: "奖金按方案规则草拟只是基线，兑现前须由为该成本负责的人确认没有规则看不到的情况（如离岗、争议、业绩调整）；奖金直接增加人工成本并进入薪酬，故保留正常一级。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U10；责任人就是被核定人本人时按 AR-11
          on_reject: 4
        permission: 奖金.审批
        page: 审批待办页
        notify: [{to: SH-E1, how: 企业微信待办}]
        decision:
          - {when: 审批驳回, goto: 4}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起奖金核定审批}
      - actor: system
        where: automatic
        command: 核定奖金
        aggregate: AGG-76
        emits: [奖金已核定]
        desc: 审批通过的回调后核定；发放经月度薪酬结算（PRC-124 读取已核定奖金）
        audit: true
        decision:
          - {when: otherwise, goto: 5}
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        branch: 驳回
        command: 〔缺〕驳回奖金核定
        aggregate: AGG-76
        desc: 审批驳回的回调；聚合稿 AGG-76 没有驳回命令；人力调整后重新草拟（人工触发）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        decision:
          - {when: otherwise, goto: end}
        outcome: 已驳回
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-76
        calls: PRC-92
        pending: S-4b 拆分口径（拆分依据与新增 B-15 读 B-16 的边，交 one-architecture、one-arch-finance 核）
        desc: 核定后提交一次「奖金核定重分类」记账事实（S-4b，one-architecture @a747e42af；finance PRC-96 @0d93dd7e）：只在负债内部重分类、不进成本——借 应付职工薪酬—奖金（计提），贷 应付职工薪酬—奖金（已核定），金额为核定额；按法人与项目拆分：读被核定人员在核定期间已过账的人工事实，按「成本法人 × 项目」的直接人工占比拆核定额，尾差并入金额最大的一行；核定期间没有项目人工的部分拆不到项目，整额记被核定人员的成本法人、不带项目，由 B-07 按 LEB-05 留原法人转费用，不跨法人；拆分明细随事实携带。差额（核定额与累计计提之差）转成本调整行归 B-07（PRC-96 步 2 ③），本步不算。所属会计期间已关账的按 ADR-0045 与 INV-92 路由到开放期间并标原期间
        audit: true
        period_gate: true
        legal_entity: 被核定人员核定期间的成本法人（与人工事实一致，ADR-0073 第 1 条、LEB-04）
        notify: [{to: SH-E6, how: 企业微信告警}]     # 延后重试超过下次关账仍未提交时才发
        decision:
          - {when: "核定期间的人工成本分配尚未过账，或 PRC-92 返回期间关账中，延后由投递重试；到下次关账仍未提交的告警人力", goto: end, outcome: 期间关账中待重试}
          - {when: "所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已核定
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 读取已过账人工事实（按人员 × 期间）}
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 订阅方 B-15（奖金核定依据）。聚合稿 AGG-76 没有“额度不得超出激励方案”的不变量，草拟时拒绝先按前置检查写，见 notes 结构问题。原 v1 的人力手工草拟取消，catalog 的 human_orchestration 须由 false 改为 true（notes 格式问题）。

  # ───────────── VS-13.3 薪酬结算 ─────────────

  - id: PRC-124
    name: 计算、审核并批准月度薪酬
    trigger:
      type: event
      events:
        - {event: 月度考勤已锁定, aggregate: AGG-97}
    triggers:
      - {type: event, name: "月度考勤已锁定（B-27 发布；按人员 × 月发出，法人当月在职人员全部锁定才能计算）"}
      - {type: human, name: "人力在补齐档案或规则版本后重新发起法人 × 月计算"}
    stages: [VS-13.3]
    primary_object: OBJ-73
    owner_bc: B-15
    human_orchestration: true
    human_note: 系统计算，薪酬岗提交审核，财务责任人审批，可退回重算（高风险，保留人审）
    migration: "历史月度薪酬结算（老系统算薪审核表与税金计算、工资条约 2.9 万行）按法人 × 月迁入为已发放 / 已过账结算，只迁结果与证据，不重算、不发事件、不重新过账（ADR-0036 M7）；在途月份按当前状态迁入通用审批"
    scope: "按法人数据范围；薪酬结算行属敏感个人信息，仅人力薪酬岗与财务主管可见，员工只看本人工资条"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "提交审核者不得审批同一份结算（制单与审批分离，AR-11）；任何人不得审批含本人薪酬结算行的结算，含本人时由其上级审批（SH-E6 内部分岗：薪酬岗 / 财务主管）"}
    outcomes: [已批准, 待锁定, 已中止]
    scenarios: [PRC-124-S01, PRC-124-S02, PRC-124-S03, PRC-124-S04, PRC-124-S05, PRC-124-S06, PRC-124-S07, PRC-124-S08, PRC-124-S09, PRC-124-S10]   # S01 全部锁定后计算、提交、审批、批准、提交过账候选（全程）；S02 审批驳回退回重算；S03 有人员未锁定，待锁定；S04 缺薪酬档案或规则版本，已中止并告警；S05 审批 2 日无人处理升级；S06 提交人撤回审批；S07 薪酬岗核对异常清单后重算；S08 薪酬总额超阈值，加一级或两级（AR-01、AR-02）；S09 所属期间已关账，过账路由到开放期间并标原期间；S10 当月有补休到期未休或离职结算的补休余额，按加班工资基数 200% 计入加班费
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统计算结果与异常清单，确认无误后提交审核，对输入修正负责", approval_right: "无（提交人不得审批同一份结算）", department_hint: "人力资源部（薪酬岗）", position_hint: "薪酬岗"}}      # 人力（薪酬岗）：核对异常清单、提交审核
      - {id: SH-E6, as: approver, org_needs: {responsibility: "作为薪酬法人的财务责任人，对薪酬支付依据的合理性负责", approval_right: "正常一级审批（cost_object_owner 解析结果）；金额超阈值加审", department_hint: "财务部", position_hint: "财务负责人、财务主管"}}       # 财务（薪酬法人的责任人 / 财务主管）：审批
      - {id: SH-M1, as: informed, org_needs: {responsibility: "知悉薪酬总额；审批超期时接收升级提醒", approval_right: "无（升级只提醒，不替代审批人）", department_hint: "公司管理层", position_hint: "总经理、分管副总"}}       # 管理层：薪酬总额知会；审批超期升级对象（VS-13.3 participants）
    steps:
      - actor: system
        where: automatic
        command: 计算月度薪酬
        aggregate: AGG-73
        reads: [AGG-97, AGG-74, AGG-76, AGG-93, AGG-62, AGG-119, AGG-120]
        pending: U7
        desc: >-
          薪酬自算（intent 2026-10-16-152603，聚合稿“薪酬汇总导入”口径作废），月度考勤已锁定后由系统自动计算，不再由人手工发起。
          读月度考勤已锁定（含锁定后更正行）、PRC-178 登记的补休转加班工资时长（本 BC AGG-93，按登记所属月读取、已计入结算的登记不重复）、薪酬档案版本（按薪酬期间生效日分段）、参保（缴费基数）、已核定奖金、适用的〔缺〕薪酬规则版本（个税税率表与减除费用、社保公积金比例与基数上下限、计薪天数）、人员与法人。
          按人员：应发 = 档案薪酬项（调薪、入离职当月按计薪日折算）+ 已核定奖金 − 事假等扣款 + 加班费（来自月度考勤的加班补偿方式，付薪部分）+ 补休转计薪费（PRC-178 登记的补休转加班工资时长 × 加班工资基数折算的时薪 × 200%，工资支付暂行规定第十三条；加班工资基数取薪酬档案，取不到则已中止并告警）± 上期锁定后更正行（标原月份）；
          代扣 = 社保公积金个人部分（参保缴费基数 × 规则版本比例）+ 个人所得税（居民个人工资薪金累计预扣，用专项附加扣除与规则版本的税率表）；
          只限法定代扣项目（INV-70）；实发 = 应发 − 代扣；汇总为法人 × 月。同时生成异常清单（环比波动超阈值、实发为负、新入离职折算、含补发补扣行），供薪酬岗核对与审批人参考，只提示不拦截
        audit: true
        legal_entity: 薪酬法人（个税扣缴义务人口径，三口径分别记录，Q-09）
        cross_bc:
          - {mode: api, direction: out, bc: B-27, name: 读取月度考勤确认}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        notify: [{to: SH-E6, how: 企业微信待办}]     # 已中止时才发
        decision:
          - {when: "该法人当月仍有在职人员月度考勤未锁定，待锁定", goto: end}
          - {when: "有人员没有生效的薪酬档案版本、应参保人员没有参保基数或没有适用的薪酬规则版本，已中止", goto: end}
          - {when: otherwise, goto: 2}
        # 依据：CLAUDE.md 第 6 条（缺失输入失败并告警）；阶段进入条件 VS-13.3（法人当月在职人员均已锁定）
      - actor: SH-E6               # 人力（薪酬岗）
        where: in_system
        command: 提交薪酬审核
        aggregate: AGG-73
        desc: 薪酬岗核对计算结果与异常清单，确认无误提交审批；发现输入有误可先修正再重算，不进入审批
        permission: 薪酬结算.提交审核
        page: 薪酬结算页
        audit: true
        decision:
          - {when: 核对发现需修正输入后重算, goto: 1}
          - {when: otherwise, goto: 3}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 发起薪酬审核}
      - actor: SH-E6               # 财务（薪酬法人的责任人）
        where: in_system
        platform_task: true
        service: platform.approval
        command: 薪酬审核
        pending: U7
        desc: 对全员薪酬的资金支付依据作审批；审批人看到结算汇总与异常清单
        approval:
          engine: platform.approval
          doc_type: 月度薪酬审核
          approver: cost_object_owner   # 薪酬结算的归属对象是薪酬法人（扣缴义务人口径），责任人为该法人的财务负责人 / 财务主管（SH-E6）
          why_human: "月度薪酬是全员资金支付与个税扣缴的依据，规则只能校验口径一致（考勤已锁定、规则版本、法定代扣），无法判断本月薪酬总额与异常波动是否合理；属高风险，保留人审（正常一级，金额超阈值再加审）。"
          escalation_rules: [AR-01, AR-02, AR-11]   # 金额阈值待 U7
          on_reject: 1
        permission: 薪酬结算.审核
        page: 审批待办页
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P2D", escalate_to: SH-M1, interrupting: false}   # 暂拟 2 日无人处理升级，待 U7（发薪日）
        withdraw: {to: 1}
        decision:
          - {when: 审批驳回，退回重算, goto: 1}
          - {when: 提交人撤回审批, goto: 1}
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 批准月度薪酬
        aggregate: AGG-73
        emits: [薪酬已批准]
        desc: 审批通过的回调；代扣只限法定项目，以法定货币支付（INV-70）；薪酬已批准触发申报（PRC-125）与提交应付薪酬（PRC-126）；退回重算在聚合稿无命令，〔缺〕退回薪酬重算（notes 结构问题 2）
        audit: true
        metric_event: true
        legal_entity: 薪酬法人（个税扣缴义务人口径）
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-73
        calls: PRC-92
        desc: 职工薪酬计提；批准时提交一次候选，发放只置“已发放”，“已过账”由事件策略 PRC-134 置位（G-18 已处理）；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "薪酬所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已批准
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
    notes: 6e 前薪酬汇总导入（FD-30）作废：一次投产后薪酬在本系统自算，AGG-73 对 platform.integration“薪酬汇总导入”的依赖应删除（notes 结构问题）。取批准时提交一次过账候选。薪酬岗“计算”改为系统自动，保留“提交审核”一步作为制单人签收，兼顾高风险的两人控制。

  # ───────────── VS-13.4 申报缴纳 ─────────────

  - id: PRC-125
    name: 申报个税扣缴与社保公积金
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
      - {type: time, name: "每月申报期前提醒（P-39，platform.scheduling）；股息红利并入后无薪酬批准时也须有触发"}
      - {type: human, name: "人力发起本月申报批次"}
      - {type: time, entry: 7, name: "年度缴费基数调整期（社保公积金缴费基数核定通知后；B-15 向 platform.scheduling 登记定时，按 CONVENTIONS 定时约定）"}
    stages: [VS-13.4, VS-06.1]
    primary_object: OBJ-92
    secondary_objects: [OBJ-62]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-15
    human_orchestration: false
    migration: "历史申报与缴款（老系统税金计算与申报记录）按所属期 × 类型迁入为已缴款；迁入不触发申报、不重新过账（ADR-0036 M7）"
    scope: "按扣缴义务人法人；申报明细含证件号码等个人信息，仅人力薪酬岗可见"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "申报登记与缴款资金支出（出纳，B-10）不得为同一人；申报数据由系统生成，人工只做外部申报与登记回执（SH-E6 内部分岗）"}
    outcomes: [已申报缴款, 已中止, 已提醒, 基数已调整]
    scenarios: [PRC-125-S01, PRC-125-S02, PRC-125-S03, PRC-125-S04, PRC-125-S05, PRC-125-S06, PRC-125-S07]   # S01 系统生成申报数据，线下申报，登记回执与缴款（全程）；S02 证件信息缺失或金额不一致，已中止并告警；S03 申报被退回更正；S04 股息红利并入同期个税申报；S05 个税申报期限提醒升级（非中断，结局已提醒，主线照常）；S06 所属会计期间已关账，过账路由到开放期间；S07 年度缴费基数调整：登记新参保版本后向社保公积金经办平台申报并回填回执
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "核对系统生成的申报数据，在外部渠道办理申报与缴款并登记回执", approval_right: "无（人工只做外部申报与登记；缴款资金支出由出纳另行执行）", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}      # 人力
      - {id: SH-M1, as: informed, org_needs: {responsibility: "申报期限提醒的升级对象", approval_right: "无", department_hint: "公司管理层", position_hint: "分管副总"}}       # 申报期限提醒升级对象
      - {id: SH-R2, as: external, org_needs: {responsibility: "受理申报并出具回执", approval_right: "无（外部机构，系统外）", department_hint: "外部（税务、社保、公积金经办机构）", position_hint: "不适用"}}       # 税务、社保、公积金经办机构
    steps:
      - actor: system
        where: automatic
        command: 生成申报
        aggregate: AGG-95
        reads: [AGG-74, AGG-81, AGG-73]
        pending: U1
        desc: 读当月参保增减员、薪酬结算、扣缴义务人法人与所属期（会计期间）；按所属期汇总薪酬批准结果与股息红利并入项，生成个税扣缴申报数据（按自然人电子税务局扣缴客户端的导入格式〔中〕）与社保公积金申报明细；校验人员证件信息、申报金额与薪酬结算一致，不一致失败并告警。申报方式为骨架暂拟的 a)，用户未定，见 notes 待用户定 U1、U2
        legal_entity: 扣缴义务人法人
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]     # 生成完成与已中止都发
        cross_bc:
          - {mode: api, direction: out, bc: B-19, name: 读取会计期间与所属期}
          - {mode: api, direction: out, bc: B-13, name: 读取人员与法人}
        decision:
          - {when: "人员缺证件信息或申报金额与薪酬结算不一致", goto: end}
          - {when: otherwise, goto: 2}
        outcome: 已中止
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税申报回执, 申报日, 申报明细文件]
        command: 提交申报
        aggregate: AGG-95
        pending: U1
        desc: 个税：人力在扣缴客户端导入申报数据并申报，本系统登记申报回执（个人所得税法第九条、第十条；个人所得税扣缴申报管理办法）。法定期限为次月十五日内〔中，核对原文〕（P-39）
        period_gate: false
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # 自次月 1 日起算，P-39 提醒并升级转管理层督办；非中断，独立结束事件「已提醒」（S-28）
        notify: [{to: SH-E6, how: 企业微信待办}]
        audit: true
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕申报端对接（仅方式 b 时启用）}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费申报回执, 公积金汇缴回执, 申报日]
        command: 提交申报
        aggregate: AGG-95
        emits: [个税与社保公积金申报已提交]
        pending: U2
        desc: 社保公积金：人力在税务或社保经办渠道申报社保费、在公积金管理中心办理汇缴，各地渠道不同〔中〕，本系统登记回执；三类均已提交后发出事件
      - actor: SH-E6               # 人力
        where: offline
        evidence: [个税缴款凭证, 社保费与公积金缴款凭证, 缴款日]
        command: 登记缴款
        aggregate: AGG-95
        desc: 税款与社保公积金的缴款资金支出不在 AGG-95，缴款凭证与银行流水的对账见 notes 接缝问题
        audit: true
        decision:
          - {when: 申报被退回或发现差错, goto: 5}
          - {when: otherwise, goto: 6}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [更正申报回执, 更正原因]
        entry: 申报被退回或发现差错
        branch: 更正
        command: 更正申报
        aggregate: AGG-95
        audit: true
        decision:
          - {when: otherwise, goto: 4}
      - actor: system
        where: automatic
        command: 提交过账候选
        aggregate: AGG-95
        calls: PRC-92
        desc: 个税与社保公积金过账；所属会计期间已关账的，按 ADR-0045 与 INV-92 路由到开放期间并标原期间，不拒绝
        period_gate: true
        decision:
          - {when: "所属会计期间已关账，路由到开放期间", goto: end, rule: INV-92}
          - {when: otherwise, goto: end}
        outcome: 已申报缴款
        cross_bc:
          - {mode: api, direction: out, bc: B-16, name: 提交过账候选}
      - actor: SH-E6               # 人力
        where: in_system
        entry: 年度缴费基数调整期到达
        branch: 年度基数调整
        command: 调整缴费基数
        aggregate: AGG-74
        desc: 每年缴费年度起始前后，社保公积金缴费基数按核定通知（上年度月平均工资）调整；定时（platform.scheduling）到点生成待办提醒人力；人力核对基数核定依据后在系统登记新参保版本，追加新版本并结束旧版本区间（D17），已减员登记不调整，同一登记同一缴费年度至多一次，更正另出新版本；之后在经办平台申报
        permission: 参保登记.调整缴费基数
        page: 参保登记调整页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 8}
      - actor: SH-E6               # 人力
        where: offline
        evidence: [社保费基数申报回执, 公积金基数调整回执, 办理日]
        command: 提交申报
        aggregate: AGG-95
        desc: 新参保版本出后，人力在社保与公积金经办平台办理基数申报与调整（各地渠道不同〔中〕），办理后回填回执；之后每月参保明细按新版本基数生成
        audit: true
        decision:
          - {when: otherwise, goto: end}
        outcome: 基数已调整
    notes: "申报方式用户未定（intent 2026-10-16-152603 只定“个税公司代扣代缴”），骨架先按 a) 画：系统生成申报数据，人工在外部申报端申报并回填回执（offline + 证据）。“生成申报”由人力手工改为系统自动（质检修订）；S-35：年度基数调整分支（步 7、8）承载 AGG-74 调整缴费基数，年度调整期由定时触发，办理在经办平台（offline 带回执），回填后出新参保版本；v1“申报端回执、更正申报无超时或退回分支，按非人工编排（⑥a 评审 M1）”保留。次要对象：OBJ-62 社保与公积金参保（年度基数调整分支产生新参保版本）。"

  - id: PRC-128
    name: 办理员工离职
    trigger: {type: human, desc: 员工提出离职或公司决定终止}
    triggers:
      - {type: human, name: "员工提出离职"}
      - {type: human, name: "公司决定终止"}
    stages: [VS-13.6]
    primary_object: OBJ-56
    secondary_objects: [OBJ-05, OBJ-57]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-13
    human_orchestration: false
    type: business
    migration: "离职申请全量迁入（A8 员工离职申请，OA_PROCESS_INVENTORY 第 62 行，在途 22）；在途按当前状态迁入，已登记未到离职日的须重新排定「离职生效」定时；迁入不触发 Separated、账号吊销与参保减员（ADR-0036 M7）；历史离职人员账号状态按迁入对账（C-7）"
    scope: "员工看本人申请；用人经理与部门负责人看所辖员工；人力看全部（原因类别含健康时限人力，SPI 交 U-11）"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "公司单方终止：发起人（人力）与批准人（被终止员工所属组织单元责任人）不得为同一人"}
    outcomes: [离职已生效, 离职申请已撤回, 终止已驳回, 离职登记已撤销]
    scenarios: [PRC-128-S01, PRC-128-S02, PRC-128-S03, PRC-128-S04, PRC-128-S05, PRC-128-S06, PRC-128-S07, PRC-128-S08]
    roles:
      - {id: SH-E3, as: initiator, org_needs: {responsibility: "提出离职申请或撤回", approval_right: "无", department_hint: "所属部门", position_hint: "员工（任一类员工）"}}      # 申请人是任一类员工；stakeholders 无泛员工编号，暂取 SH-E3（格式问题）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对被终止员工所属组织单元负责", approval_right: "批准公司单方终止（类型级，单级）", department_hint: "被终止员工所在组织单元", position_hint: "部门负责人（职能：组织单元责任人）"}}       # 部门负责人：仅公司单方终止时批准（cost_object_owner）；员工提出的离职不审批
      - {id: SH-E6, as: performer, org_needs: {responsibility: "发起公司终止、登记终止依据、办理离职", approval_right: "无（公司终止的批准由部门负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：离职办理）"}}      # 人力：公司终止的发起、登记依据与离职办理
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉所辖员工离职", approval_right: "无", department_hint: "用人部门", position_hint: "用人经理"}}       # 用人经理
      - {id: SH-E6, as: informed, org_needs: {responsibility: "收到离职提醒，资产归还见 B-31", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：账号与设备）"}}       # 信息（IT）：离职提醒，资产归还见 B-31
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请离职
        aggregate: AGG-62
        desc: 期望离职日（人事业务生效日，U-12）、原因类别、来源。员工本人提出，或线下提出由人力代录入（来源=员工，本系统登记提出日与来源）；公司单方终止由人力以来源=公司终止在同一命令发起，依据与原因类别必填（含试用期不予转正转入，PRC-85）。期望离职日早于法定通知期只预警，不拒绝（规则候选 R-03）
        permission: 离职.申请
        page: 离职申请页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}, {to: SH-M1, how: 企业微信通知}]
        withdraw: {to: 4, outcome: 离职申请已撤回}
        decision:
          - {when: 员工撤回申请, goto: 4}
          - {when: 来源为公司单方终止, goto: 2}
          - {when: otherwise, goto: 5}          # 员工提出的离职劳动者有权解除，不设批准（V-20）
      - actor: SH-M1
        where: in_system
        command: 〔缺〕批准公司终止
        aggregate: AGG-62
        approval:
          engine: aggregate             # B-13 聚合内单级批准（F-3），不经 platform.approval，故无审批平台回调
          doc_type: 公司终止批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 3
          why_human: "单方解除的事由是否成立、证据是否充分是法律与管理判断（劳动合同法第 39、40、41 条），事实真伪规则无法判定；发起人与批准人分离由 segregation 守卫"
        permission: 离职.批准终止
        page: 离职审批页
        audit: true
        added_in: closeout
        pending: V-18
        notify: [{to: SH-E6, how: 企业微信通知}]
        decision:
          - {when: 批准, goto: 5}          # 批准后状态「待离职」，即 VS-13.6 进入条件
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回公司终止
        aggregate: AGG-62
        desc: 批准人驳回公司单方终止，发起人（人力）知悉；聚合稿缺命令（PG-09）
        permission: 离职.驳回终止
        page: 离职审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E6, how: 企业微信通知}]
        outcome: 终止已驳回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E3
        where: in_system
        branch: 撤回
        command: 〔缺〕撤回离职申请
        aggregate: AGG-62
        desc: 员工（或人力代录入的来源=员工）在登记离职日前撤回申请；聚合稿缺命令（PG-09）
        permission: 离职.撤回申请
        page: 离职申请页
        audit: true
        added_in: closeout
        outcome: 离职申请已撤回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: offline
        evidence: [离职协议或解除 / 终止通知的扫描件, 签署或送达日, 离职日]
        command: 〔缺〕登记劳动合同终止依据
        aggregate: AGG-67
        desc: 协商一致、员工辞职或公司解除，均线下签署或送达；本系统登记依据文件与日期。离职证明另行线下出具，不作门（VS-13.6 备注）
        permission: 劳动合同.登记终止依据
        page: 离职办理页
        audit: true
        added_in: closeout
      - actor: SH-E6
        where: in_system
        command: 办理离职
        aggregate: AGG-62
        desc: 登记离职日（人事业务生效日，最后在职日，U-12）与原因类别；可提前登记、到日生效。离职日不晚于登记日（含补登、即时终止）则立即进入步 7。聚合稿原为「→ Separated」，现改为登记，Separated 由步 7 到日发出，不得在登记时提前发（PG-12）
        permission: 离职.办理
        page: 离职办理页
        audit: true
        notify: [{to: SH-E1, how: 企业微信通知}]
        decision:
          - {when: 离职日前员工撤回或公司撤销, goto: 10}
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 离职日结束时（时点待用户定）；离职日不晚于登记日则登记时立即执行
        command: 〔缺〕离职生效
        aggregate: AGG-62
        emits: [Separated]
        desc: 人员状态由「待离职」转「已离职」，生效日为登记的离职日。Separated 在先于步 8、9 发出：吊销会话与访问是安全关键（RULE-363），不得因任职或合同终止失败而推迟
        audit: true
        metric_event: true
        pending: V-1
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: Separated}   # platform.identity 吊销会话作业（原 PRC-129，已退役）、PRC-138 停用企业微信与解绑；§1.4 G-2
          - {mode: event, direction: out, bc: B-15, name: Separated}               # PRC-130 参保减员，PRC-178 读取未休补休余额计入加班工资，并作为最后一期薪酬结算的在职终点
          - {mode: event, direction: out, bc: B-31, name: Separated}               # 生成 IT 资产归还待办（b31 PRC-143；聚合稿回补 §1），B-13 不依赖 B-31
          - {mode: event, direction: out, bc: B-27, name: Separated}               # B-27 默认确认离职当月考勤（PRC-118 第 7 步事件入口）；B-27 → B-13 现只有 api 边（接缝问题）
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止任职
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职区间止于离职日。因 Separated 已先发出，platform.identity 对已离职人员的「任职已变更」忽略（PG-12）
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}
      - actor: system
        where: automatic
        on_time: 步 7 之后立即
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 终止日 = 离职日，依据文件见步 5。失败告警人力并重试，不回滚 Separated
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        outcome: 离职已生效
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 撤销离职登记
        command: 〔缺〕撤销离职登记
        aggregate: AGG-62
        emits: [〔缺〕离职登记已撤销]
        desc: 离职日前撤销，状态回「在职」；B-27、B-31 均只在 Separated 后处置，不订阅本事件（S-42，撤销发生在离职生效前，无待办可取消）；离职日后不可撤销（已吊销访问，需走再入职）
        permission: 离职.撤销登记
        page: 离职办理页
        audit: true
        added_in: closeout
        outcome: 离职登记已撤销
    notes: >
      账号侧见 platform.identity 吊销会话作业（原 PRC-129，已退役）、PRC-138（角色授予、企业微信停用、解绑）；参保减员见 PRC-130；最后一期薪酬随月度结算发放（B-15），未休补休余额由 B-15 订阅 Separated，经 PRC-178 读取余额并计入加班工资，随最后一期薪酬一并计发（PRC-124）。
      工作交接清单是单据不作门（VS-13.6 备注，Q-D 第 3 项不做）；IT 资产归还待办由 B-31 订阅 Separated 生成，B-13 不读 B-31。
      离职当月考勤确认由谁代确认见 notes 待用户定。员工提出的离职不再设批准（V-20）；公司单方终止保留一级批准。
      「发起公司终止」不再是独立命令，并入「申请离职」的来源取值，以便两个入口汇合在同一首步。

      次要对象：OBJ-05 协议（劳动合同类型，终止是后续步骤，失败不回滚已离职）、OBJ-57 任职（任职区间止于离职日）。

  - id: PRC-136
    name: 变更任职
    trigger: {type: human, desc: 人力按人事业务生效日登记调岗、职级调整或汇报线变更}
    triggers:
      - {type: human, name: "人力登记调岗、职级调整或汇报线变更"}
    stages: [VS-07.3]
    primary_object: OBJ-57
    secondary_objects: [OBJ-05, OBJ-62]   # F-1：本流程写入的次要对象（自 notes 迁来）
    owner_bc: B-13
    human_orchestration: true
    human_note: 调岗申请需批准（推荐，待用户定），批准为本聚合命令（F-3）
    type: business
    new: true
    basis: A8 与老系统的人事异动只作证据（OA_PROCESS_INVENTORY 第 65 行「人事异动表」）；U-12；INV-62；词表「待调整权限」（ADR-0032 第 4 项）；Q-09
    migration: "历史人事异动回放为任职版本（A8 人事异动，按人事业务生效日），在途按当前状态迁入（OA_PROCESS_INVENTORY 第 65 行在途 1）；迁入不触发本流程与数据范围复核（ADR-0036 M7）"
    scope: "人力按法人与组织数据范围；用人经理看所辖员工的异动"
    segregation:
      - {roles: [SH-E6, SH-M1], rule: "调岗申请的提交人（人力）与批准人（新组织单元责任人）不得为同一人"}
    outcomes: [调岗已生效, 已驳回]
    scenarios: [PRC-136-S01, PRC-136-S02, PRC-136-S03, PRC-136-S04, PRC-136-S05, PRC-136-S06, PRC-136-S07, PRC-136-S08, PRC-136-S09]
    roles:
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "提交调岗申请，办理合同与薪酬、参保变更", approval_right: "无（调岗批准由新组织单元负责人）", department_hint: "人力资源部", position_hint: "人事专员（职能：任职变更事务）"}}      # 人力提交（发起人待用户定）
      - {id: SH-M1, as: approver, org_needs: {responsibility: "对接收方组织单元的人工成本负责", approval_right: "批准调岗申请（类型级，单级）", department_hint: "新组织单元", position_hint: "部门负责人（职能：新组织单元责任人）"}}       # 部门负责人 = 新组织单元（接收方，调岗生效后承担人工成本）的责任人，cost_object_owner；原部门负责人只被通知
      - {id: SH-E6, as: performer, org_needs: {responsibility: "信息、薪酬与社保经办", approval_right: "无", department_hint: "信息部门与人力资源部（薪酬与社保）", position_hint: "信息管理员、薪酬与社保专员（职能）"}}      # 信息（IT）、薪酬与社保经办：步 9–12
      - {id: SH-E1, as: informed, org_needs: {responsibility: "知悉原、新用人经理所辖变动", approval_right: "无", department_hint: "原、新用人部门", position_hint: "用人经理"}}       # 原、新用人经理
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉本人调岗", approval_right: "无", department_hint: "所属部门", position_hint: "被调动员工"}}       # 被调动员工
    steps:
      - actor: SH-E6
        where: in_system
        command: 〔缺〕提交调岗申请
        aggregate: AGG-63
        desc: 员工、新组织单元、新职位与职级、汇报线、主 / 兼、业务生效日（U-12，可提前登记、补登落回真实日期）。读职位目录与组织单元，须未停用，否则拒绝并退回改正（INV-63、INV-60）；系统比对新组织单元默认法人与当前用人单位，标记是否跨法人
        permission: 调岗.提交
        page: 调岗申请页
        audit: true
        added_in: closeout
        notify: [{to: SH-M1, how: 企业微信待办}]
        withdraw: {to: 3, outcome: 已驳回}      # 批准前撤回走「驳回调岗申请」命令（含提交人撤回）
        decision:
          - {when: 新职位已停用或新组织单元已撤销, goto: 1, rule: INV-63}    # INV-63 / INV-60 相关
          - {when: 提交人在批准前撤回, goto: 3}
          - {when: otherwise, goto: 2}
      - actor: SH-M1
        where: in_system
        command: 〔缺〕批准调岗申请
        aggregate: AGG-63
        approval:
          engine: aggregate             # 同 F-3：B-13 内单级批准，故无审批平台回调；新旧部门会签若需要，移出 B-13（notes 待用户定）
          doc_type: 调岗批准
          approver: SH-M1   # 类型级角色（resolve: type，部门负责人，见 notes 权责对照条目）；归属对象的责任人即其人
          escalation_rules: [AR-11, AR-12]
          multi_level: false
          on_reject: 3
          why_human: "调岗改变成本归属、汇报线与授权范围，接收部门是否需要、是否合适是管理判断；职位有效（INV-63）、任职不重叠（INV-62）、跨法人合同（INV-14）等可校验条件已由规则拒绝；汇报线变更会影响后续审批链，故不设免批"
        permission: 调岗.批准
        page: 调岗审批页
        audit: true
        added_in: closeout
        pending: V-5, V-18
        notify: [{to: SH-E1, how: 企业微信通知}, {to: SH-E3, how: 企业微信通知}]
        decision:
          - {when: 批准且跨法人调动, goto: 4}
          - {when: 批准, goto: 6}
          - {when: otherwise, goto: 3}
      - actor: SH-M1
        where: in_system
        branch: 驳回
        command: 〔缺〕驳回调岗申请
        aggregate: AGG-63
        desc: 批准人驳回；提交人撤回走同一命令
        permission: 调岗.驳回
        page: 调岗审批页
        audit: true
        added_in: closeout
        notify: [{to: SH-E6, how: 企业微信通知}]
        outcome: 已驳回
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        branch: 跨法人调动
        command: 提交劳动合同
        aggregate: AGG-67
        desc: 用人单位变更：与新法人另订劳动合同（或三方变更协议），用人单位为新法人，工龄连续计算；试用期不得重新约定（INV-14 同检）。合同要素须与已批准的调岗一致（规则候选 R-04，拒绝，取代原「批准劳动合同」一级审批）。劳动合同主体变更必须在调岗生效日前完成
        legal_entity: 新用人单位
        permission: 劳动合同.提交
        page: 劳动合同编辑页
        audit: true
        decision:
          - {when: 试用期超过法定上限或合同要素与已批准调岗不一致, goto: 4, rule: INV-14}
          - {when: otherwise, goto: 5}
      - actor: SH-E6
        where: offline
        branch: 跨法人调动
        evidence: [三方变更协议或新劳动合同的扫描件, 签署日]
        command: 签订劳动合同
        aggregate: AGG-67
        emits: [劳动合同已签订]
        desc: 员工、原法人、新法人线下签署；签订发「劳动合同已签订」，B-15 的 PRC-145 据此比对三口径（不一致只预警）
        permission: 劳动合同.登记签订
        page: 劳动合同编辑页
        audit: true
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 劳动合同已签订}   # PRC-145 订阅
      - actor: system
        where: automatic
        command: 〔缺〕变更任职
        aggregate: AGG-63
        desc: 原子命令：旧任职区间止于业务生效日，新任职区间始于同日（PG-05）；主任职区间不得重叠（INV-62），兼任不受此限。写入未来版本，此时不对外发事件
        audit: true
        decision:
          - {when: 与该人员其他主任职区间冲突, goto: 1, rule: INV-62}   # 退回改正后重提
          - {when: otherwise, goto: 7}
      - actor: system
        where: automatic
        on_time: 业务生效日到达（补登 / 当日登记则立即执行）
        command: 〔缺〕任职变更生效
        aggregate: AGG-63
        emits: [任职已变更]
        desc: 任职已变更须在业务生效日发出（U-12），平台与薪酬才能按真实日期重算
        audit: true
        metric_event: true
        cross_bc:
          - {mode: event, direction: out, bc: platform.identity, name: 任职已变更}   # 订阅方聚合稿现为「仅分析」，需补（PG-02、06）
          - {mode: event, direction: out, bc: B-15, name: 任职已变更}                  # B-15 → B-13 边已有；订阅方聚合稿未登记（PG-07）
        decision:
          - {when: 跨法人调动, goto: 8}
          - {when: otherwise, goto: 9}
      - actor: system
        where: automatic
        branch: 跨法人调动
        command: 终止劳动合同
        aggregate: AGG-67
        emits: [劳动合同已终止]
        desc: 原劳动合同终止于业务生效日，原因为调动（与步 4–5 的新合同衔接，工龄连续）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕重算默认角色与数据范围
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 按新任职重算默认角色与数据范围（具体规则随 ADR-0029 重起草，此处只定触发点）；人工单独授予的角色与范围不自动收回，交步 10
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 标记数据范围待复核并通知区域负责人
        on_event: [{aggregate: AGG-63, event: 任职已变更}]
        desc: 沿用 PRC-80 步 6 命令；P-31 现只由组织单元已调整触发，任职已变更触发需新增策略，生成「待调整权限」条目（敏感角色持有人送组织数据管理员与安全审计员，含自定义部门或列出法人的授权送新部门负责人，ADR-0032 第 4 项），只提醒不收回
        notify: [{to: SH-M1, how: 企业微信待办}]
        outcome: 调岗已生效
        decision:
          - {when: 调岗引起薪酬变化或跨法人调动, goto: 11}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: in_system
        bc: B-15
        branch: 调岗引起薪酬变化或跨法人
        command: 调整薪酬档案
        aggregate: AGG-93
        emits: [薪酬档案已变更]
        desc: 薪资结构、标准变化；跨法人时个税扣缴义务人随用人单位变更（三口径之一，不一致由 PRC-145 预警）。薪酬属敏感个人信息，ADR-0043 最高访问级别
        permission: 薪酬档案.调整
        page: 薪酬档案维护页
        audit: true
        outcome: 调岗已生效
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 任职已变更}
        decision:
          - {when: 跨法人调动, goto: 12}
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: offline
        bc: B-15
        branch: 跨法人调动
        evidence: [社保增减员回执, 公积金缴存单位变更回执, 办理日]
        command: 〔缺〕变更参保缴纳主体
        aggregate: AGG-74
        emits: [参保已减员, 参保已增员]
        desc: 原法人减员、新法人增员（缴纳主体变更），人社与公积金网办办理后回填；与入职增员同属 P-32 范畴
        permission: 参保.变更缴纳主体
        page: 参保登记页
        audit: true
        added_in: closeout
        legal_entity: 新用人单位
        outcome: 调岗已生效
    notes: >
      晋升只改职级不换职位（JOB_CATALOG_DRAFT §1 P-1），同走本流程。跨法人调动是劳动合同主体变更，牵涉三口径同时改变（用人单位、数据范围法人、扣缴义务人），
      步 4–5、8、11–12 是该分支；PRC-145 只预警不拒绝。调岗对请假审批人与在途单据是否联动待 B-27 组确认。
      步 9–12 是对「任职已变更」的事件反应，与后续步骤并行，此处按顺序列出。
      原「批准劳动合同」一级审批取消，改由规则 R-04 拒绝（合同要素与已批准调岗不一致）与 INV-14；调岗批准一次即够。

      次要对象：OBJ-05 协议（跨法人另订并终止原劳动合同）、OBJ-62 社保与公积金参保（跨法人变更缴纳主体）。

  - id: PRC-137
    name: 入职开通企业微信账号并绑定外部身份
    trigger:
      type: event
      events: [{event: 〔缺〕入职已登记, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "入职已登记", event: 〔缺〕入职已登记, bc: B-13}
    stages: [VS-07.3]
    stages_note: "留 VS-07.3：纯事件触发（入职已登记 = Employed，即 VS-07.3 退出条件「人员试用期 / 正式」的产生事件）的多步反应，行为等同事件策略；因 type 为 business，脚本按结局归段而判不支持，已列 STAGE_ALIGN.md 请 one-architecture 裁定"
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    notes: "无业务对象，primary_object: none。理由：企业微信账号是平台身份事项，不是业务对象状态（VS-13.6 notes）。"
    owner_bc: platform.identity   # J-1 / S-14 one-architecture 同意
    human_orchestration: false
    migration: "不适用（迁入不发事件）；已在职员工的企业微信身份按迁入对账绑定（C-7）"
    scope: "信息部门与人力"
    outcomes: [已开通并绑定, 开通失败已告警]
    scenarios: [PRC-137-S01, PRC-137-S02, PRC-137-S03, PRC-137-S04]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "处理企业微信开通失败", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：企业微信与账号管理）"}}      # 信息（IT）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "入职日未绑定时知悉告警", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员"}}       # 人力，逾期告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "收到开通通知", approval_right: "无", department_hint: "所属部门", position_hint: "新员工"}}       # 新员工，收到开通通知
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕建立待开通登录身份
        desc: 以人员 ID 为键；拟定企业微信 userid = 工号（S6）；登录放行起点 = 入职日（S4）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: 〔缺〕入职已登记}
      - actor: system                   # 用户已定 T-1：本系统在登记入职后自动开通（intent 2026-10-16-162821）
        where: external:企业微信
        evidence: [企业微信返回的成员 userid, 开通时间]
        bc: platform.identity
        command: 〔缺〕开通企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动开通成员；入职日前 3 个工作日开通（提前登记时排到该日，晚于该日登记的立即开通）（用户已定 T-1、T-2）
        notify: [{to: SH-E3, how: 企业微信通知}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕开通企业微信成员}
        decision:
          - {when: 企业微信返回失败或 userid 已被占用, goto: 4}
          - {when: otherwise, goto: 3}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕绑定外部身份
        desc: 按 userid 精确绑定到人员（S6）；入职日前绑定的身份处于「待生效」，订阅 Employed 后放行登录
        audit: true
        metric_event: true
        outcome: 已开通并绑定
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Employed}
        decision:
          - {when: otherwise, goto: end}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        on_time: 开通失败，或入职日已到仍未绑定
        command: 〔缺〕告警开通未完成
        desc: 告警信息部门与人力，不静默（S8）；开通失败由信息部门 1 个工作日内处理（用户已定 T-2）；信息部门修正后重试
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}   # 1 个工作日（T-2）；逾期升级给职能高管〔推〕
        outcome: 开通失败已告警
        decision:
          - {when: 已修正并重试, goto: 2}
          - {when: otherwise, goto: end}

  # ───────────── VS-13.6 离职结清（入转调离成套）─────────────

  - id: PRC-138
    name: 离职停用企业微信账号并解绑
    type: business
    new: true
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 与 platform.identity 吊销会话作业（原 PRC-129，已退役）互补；离职生效即时，不等企业微信账号停用
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    stages_note: "留 VS-13.6：纯事件触发（离职已生效 = Separated，即 VS-13.6 退出条件「人员已离职」的产生事件）的多步反应，行为等同事件策略；因 type 为 business，脚本按结局归段而判不支持，已列 STAGE_ALIGN.md 请 one-architecture 裁定"
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: platform.identity   # S-14（one-architecture 同意 J-1）
    human_orchestration: false
    basis: intent 2026-10-16-134134 Q-03；规则卡 RULE-363；ADR-0027 第 1 项第 6 点、第 7 点；IDENTITY_LIFECYCLE.md 对 C1 设计的含义第 3 条（在职判断以人事离职为准，不以企业微信账号是否存在为准）；S-14
    migration: "不适用（迁入不发事件）；历史离职人员的企业微信状态在迁入对账中核对（C-7）"
    scope: "信息部门与安全审计员"
    outcomes: [已停用并解绑]
    scenarios: [PRC-138-S01, PRC-138-S02, PRC-138-S03, PRC-138-S04]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "手工停用企业微信成员并登记，放行离职处置", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员（职能：账号与企业微信管理）"}}      # 信息（IT）
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉停用结果", approval_right: "无", department_hint: "人力资源部", position_hint: "人事专员"}}       # 人力
    steps:
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 吊销会话
        desc: 即时，先于一切企业微信动作；调用 platform.identity 吊销会话平台作业（原 PRC-129 已退役移出流程目录，CON-1017-ARC-10 R-1）
        audit: true
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用登录身份
        desc: 登录以人员在职为准，离职后即使企业微信账号未停用也拒绝登录（含放行起点之后的再登录）
        audit: true
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕删除全部角色授予
        desc: ADR-0027 第 1 项第 6 点：逐条写审计。涉及超管（super_admin）或安全审计员持有人，或会使可用超管少于 2 名时，不自动收回，转步 4 待放行（第 7 点，防止全员锁死）；会话吊销与登录身份停用不受此限
        audit: true
        pending: V-17
        decision:
          - {when: 离职者持有超管或安全审计员角色, goto: 4, rule: "ADR-0027 第 7 点"}
          - {when: otherwise, goto: 5}
      - actor: platform
        where: in_system
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕确认放行离职处置
        desc: 另一名超管持有人在系统内人工确认后放行，写审计（ADR-0027 第 7 点，Q-3「暂停，转人工确认」）；放行后继续步 5。这是防全员锁死的安全联锁，不是业务审批：需有人先确认已有接任的可用超管，规则无法替人选定接任者；放行人不得是离职者本人。能否改为「规则拒绝自动收回并告警，待超管补足后自动继续」见 V-17 选项 c
        permission: 身份.放行离职处置
        page: 待放行离职处置页
        audit: true
        pending: V-17
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: otherwise, goto: 5}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕停用应急账号
        desc: ADR-0027 第 1 项第 6 点：离职者名下的应急账号置为停用；无则跳过（不是错误）
        audit: true
      - actor: system
        where: external:企业微信
        evidence: [企业微信返回的成员停用结果, 停用时间]
        bc: platform.identity
        command: 〔缺〕停用企业微信成员
        desc: 经 platform.integration 的企业微信适配器自动停用成员；与 PRC-137 开通对称（T-1）。以 api 同步调用，不经 B-13，方向 platform.identity → platform.integration 已有边，PG-04 不再适用于停用。失败（成员已不存在视为已停用，不算失败）告警信息部门与人力，不静默（老系统取证 15% 离职者离职后仍成功登录，IDENTITY_LIFECYCLE）
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 〔缺〕停用企业微信成员}
        decision:
          - {when: 企业微信返回失败, goto: 8}
          - {when: otherwise, goto: 7}
      - actor: platform
        where: automatic
        bc: platform.identity
        platform_task: true
        service: platform.identity
        command: 〔缺〕解绑外部身份
        desc: 解除企业微信 userid 与人员的绑定，保留绑定历史；userid 不再分配给他人（取工号时与再入职的关系见 notes 结构问题）
        audit: true
        metric_event: true
        decision:
          - {when: otherwise, goto: end}
      - actor: SH-E6
        where: external:企业微信
        evidence: [企业微信管理端的停用记录, 停用时间, 经办人]
        bc: platform.identity
        command: 〔缺〕登记企业微信成员手工停用
        desc: 信息部门在企业微信管理后台手工停用，完成后在本系统登记并重试步 6（已停用视为成功）；这是系统外动作，本系统只登记结果。离职生效后规定时限内仍未停用则升级，不静默（时限待用户 V-13，推荐 1 个工作日，同 T-2）
        permission: 身份.登记企业微信手工处理
        page: 外部身份处理页
        audit: true
        pending: V-13
        timeout: {after: "P1D", escalate_to: SH-M1, interrupting: false}   # 1 个工作日；升级给职能高管〔推〕
        outcome: 已停用并解绑
        decision:
          - {when: 已处理并重试, goto: 6}
          - {when: otherwise, goto: end}
    notes: "参保减员由 PRC-130 另行处理；PRC-137 / 138 成对，开通与停用均由 platform.identity 编排。本流程无业务审批；步 4 是安全联锁，见 V-17。无业务对象，primary_object: none。理由：企业微信账号是平台身份事项，不是业务对象状态（VS-13.6 notes）。"

  - id: PRC-139
    name: 用印申请与用印登记
    type: business
    stages: [VS-14.1, VS-14.2, VS-14.3, VS-14.4]
    stages_note: >-
      VS-14.1：步 1 正式记录用印申请；来源审批经 platform.approval 校验通过且 INV-138 满足时草稿直达已批准，跳过 .2；需人审的草稿到审批中，均符合 OBJ-113 出口。VS-14.2：步 2 按上线前须填的 D15 制度配置（版本、生效日、批准人及依据，B31-1）解析责任人和加审层级，不沿用候选部门负责人或 AR-16 范围，审批中到已批准；步 3 驳回及审批期撤回提前结束本轮，原单可经步 1 重提并保留轮次。VS-14.3：步 4 核对批准及 INV-118、119、138 后登记实际用印到已用印，记录报价版本、用印法人、拟发文件与凭据对应；分次登记为已用印自环。VS-14.4：步 5 份数到齐或确认放弃剩余份数后规则关闭到已关闭；已关闭仍可核验实际用印凭据，未实际盖章不算已用印；报价发出前由 REF-04 经 B-31 api 核验实际用印登记（B31-16，ADR-0057 待批）。
    primary_object: OBJ-113
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 用印申请表单（累计 11,570 单，来源字段待取证）迁为已关闭或已驳回的历史单据；在途 252 单按 ADR-0036 第 5 条 / U-4 在切换前审结或撤回，清不完的以草稿迁入并沿用原编号，由申请人在新系统重新提交（迁入不启动审批实例）；A8 早于投产日停用（C-7）"
    scope: "申请人看自己的单据；行政经办与按制度配置解析的用印责任人看相关单据；用印法人数据范围待正式授权"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "申请人不得登记自己申请的用印（〔推〕通行的印章管理职责分离）"}
      - {roles: [SH-E3, SH-M1], rule: "申请人不得批准自己的用印申请（解析出的审批人就是申请人时按 AR-11 上交其上级）"}
    triggers:
      - {type: human, name: "员工申请用印"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 111 项用印申请；需按申请日期去重并明确统计窗口）"
    outcomes: [已关闭, 已驳回, 已撤回]
    scenarios: [PRC-139-S01, PRC-139-S02, PRC-139-S03, PRC-139-S04, PRC-139-S05, PRC-139-S06, PRC-139-S07, PRC-139-S08, PRC-139-S09, PRC-139-S10, PRC-139-S11, PRC-139-S12, PRC-139-S13, PRC-139-S14, PRC-139-S15, PRC-139-S16, PRC-139-S17, PRC-139-S18, PRC-139-S19, PRC-139-S20, PRC-139-S21, PRC-139-S22]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工（报价、合同、证明等用印需求方）；无全员编号，见 notes 格式问题 1
        org_needs:
          responsibility: "提出用印申请，写明印章类别、用印法人、文件与份数；有已批准来源单据（合同、报价等）的，填来源审批实例 ID，并对来源文件的真实性负责"
          approval_right: "无（只提交，不批准、不登记）"
          department_hint: "申请人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # ARCH_VS14 D15 用印人工批准责任解析的负责人（cost_object_owner 别名）
        org_needs:
          responsibility: "按用印用途、法人、归属对象的正式制度配置判断无来源单据用印；责任归属不由 AR-11、AR-12 代替"
          approval_right: "仅在 D15 用印人工批准责任及加审范围配置完整时批准；AR-16 候选范围不能直接启用"
          department_hint: "按正式制度配置解析，不默认申请人部门"
          position_hint: "正式责任角色与授权层级上线前须填，见 ARCH-B31-materials 1、2"
      - id: SH-E6
        as: performer      # 行政经办：保管印章并登记用印
        org_needs:
          responsibility: "保管印章，按已批准内容（来源审批实例已通过，或负责人已批准）核对后实际盖章，并登记用印时间、份数、经办人，归档扫描件"
          approval_right: "登记用印（不批准申请）"
          department_hint: "行政"
          position_hint: "印章保管与行政事务经办人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 提交用印申请
        aggregate: AGG-113
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 选印章类别（公章 / 合同专用章 / 法定代表人名章 / 财务章等）和用印法人；填用印事由、文件、份数。有已批准来源单据（合同、报价等）的填其审批实例 ID，系统经 platform.approval 校验该实例已通过、份数不超审批载荷份数，通过则不设人审，直接进入用印登记；校验不过则拒绝提交并告诉申请人原因，不静默。无来源单据的（证明、介绍信、授权委托书等）进入负责人审批（S-40）；无来源单据到审批中；来源校验通过到已批准；已驳回或已撤回的原单可由申请人重提，沿用原编号，创建新审批轮次并保留旧轮次、意见与凭据，重新核对来源实例及累计份数；无来源单据时须先取到有效制度配置才允许进入审批
        permission: 用印申请.提交
        page: 用印申请编辑页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取用印法人与申请人}          # B-31 → B-13（回补新边）
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}          # B-31 → platform.approval（回补新边）
          - {mode: api, direction: out, bc: platform.approval, name: 校验来源审批实例已通过并读取审批载荷份数}   # 既有边 B-31 → platform.approval，不加 B-31 → B-03 / B-05（S-40）
        notify: [{to: SH-E6, how: 企业微信待办（来源审批校验通过且份数不超载荷、直接进入用印登记时）}]
        decision:
          - {when: 用印法人在申请日不是有效法人主体, goto: 1, p: 0.02}     # 规则拒绝并要求改正，不进审批
          - {when: 来源审批实例未通过或申请份数超过审批载荷份数, goto: 1, p: 0.03}   # 规则拒绝并告诉申请人原因，不进审批、不静默
          - {when: 来源审批实例已通过且份数不超审批载荷份数, goto: 4, p: 0.7}   # 规则核对通过，不设人审，由印章保管人用印登记
          - {when: 无来源单据且用印责任或加审配置缺失、无有效版或不能执行, goto: 1, p: 0.02}
          - {when: otherwise, goto: 2, p: 0.23}                           # 无来源单据，进负责人审批
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：用印人工批准责任、用印加审范围（ARCH-B31-materials 1、2）
      - actor: SH-M1
        where: in_system
        command: 批准用印申请
        aggregate: AGG-113
        wait: {typical_h: 24, p90_h: 72}  # 经验估值；null 表示待取证
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        emits: [用印申请已批准]           # 仅分析
        desc: 仅无来源单据的申请进入；按用途、法人、归属对象从正式制度 D15 配置解析负责人、授权层级及加审条件；按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；AR-11、AR-12 仅处理本人和缺位委派，AR-16 候选范围不能直接启用；批准回调只接受本轮审批实例，审批中到已批准
        approval:
          engine: platform.approval
          doc_type: 用印审批
          approver: cost_object_owner     # 解析别名；实际责任人按 ARCH_VS14 D15 配置（用印人工批准责任）
          escalation_rules: [AR-11, AR-12]
          why_human: "无来源单据没有可复用的上游批准，文件内容是否应当盖章需正式制度确定的责任人判断；负责人及加审范围须上线前配置；来源审批通过且 INV-138 满足的路径不进人审。"
          on_reject: 3
        withdraw: {to: end, outcome: 已撤回}
        permission: 用印申请.批准
        page: 审批平台待办
        audit: true
        metric_event: true
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：用印人工批准责任、用印加审范围（ARCH-B31-materials 1、2）
        notify: [{to: SH-E3, how: 企业微信待办结果}]
        decision:
          - {when: 审批已驳回, goto: 3, p: 0.1}
          - {when: otherwise, goto: 4, p: 0.9}
      - actor: platform
        where: automatic
        command: 驳回用印申请
        aggregate: AGG-113
        desc: 审批平台回调：申请标为已驳回，写驳回意见；回调到已驳回
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        decision:
          - {when: otherwise, goto: end, outcome: 已驳回, p: 1}
        outcome: 已驳回
      - actor: SH-E6
        where: offline
        evidence: [实际用印时间, 用印份数, 经办人, 已盖章文件扫描件〔推〕, 对应报价版本引用（报价用途）, 用印法人, 拟发文件引用及其与盖章凭据的对应关系]
        command: 登记用印
        aggregate: AGG-113
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 10, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [用印已办理]               # 仅分析；REF-04 经 api 核验实际登记，不订阅事件
        desc: 印章保管人核对已批准（来源审批实例已通过，或负责人已批准）后在系统外盖章（实物印章），本系统登记结果；可分多次登记，累计份数不得超过批准份数；首次登记到已用印，后续登记仍为已用印；执行 INV-118、INV-119、INV-138，报价用途须登记同一报价版本、用印法人、拟发文件与实际盖章凭据的可核验关系；仅已批准或来源审批通过不算已用印；缺核验对应则拒绝并告警
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}
          - {mode: api, direction: in, bc: B-32, name: 核验实际用印登记}   # REF-04 → B-31；B-32 仅为流程模块图节点
        permission: 用印申请.登记用印
        page: 用印登记页
        audit: true
        metric_event: true
        decision:
          - {when: 累计登记份数超过批准份数, goto: 4, p: 0.01}      # INV-新-P2 拒绝
          - {when: 申请未批准, goto: 4, p: 0.01}                    # INV-新-P1 拒绝（状态机已挡，兜底）
          - {when: 报价用印的版本、法人、拟发文件与实际用印凭据对应缺失或不一致, goto: 4, p: 0.01}
          - {when: 累计登记份数已达批准份数或经办人确认放弃剩余份数, goto: 5, p: 0.87}
          - {when: otherwise, goto: 4, p: 0.1}                     # 仍有未用印份数，继续登记
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：报价实际用印核验（ARCH-B31-materials 8）
      - actor: system
        where: automatic
        command: 关闭用印申请
        aggregate: AGG-113
        desc: 规则关闭：累计份数达到批准份数或经办人确认放弃剩余份数后自动关闭，不设人工关闭；由已用印到已关闭；关闭不删除实际用印登记、文件或凭据引用，关闭后仍能核验同一报价版本、法人及拟发文件
        outcome: 已关闭
    notes: >-
      原单重提已定，沿用提交用印申请命令并保留审批轮次；来源复用仍只经 platform.approval，不加 B-31 → B-03/B-05 反查。实际用印核验由 REF-04（报价发出编排，暂名，图节点 B-32）经 api 读取 B-31 登记，逐项匹配同一报价版本、法人、拟发文件与凭据；已用印及关闭后的实际登记均保留可核验，仅批准不算实际用印。读不到、未用印、对应不符、凭据缺失或核验失败均拒绝发出并告警；核验及留痕成功后由 REF-04 调用 B-03 发出命令，B-03 不依赖 B-31、不订阅用印事件或持有其投影。33e28272 已同步该结构并查环无环；ADR-0057 为提议稿待用户批，正式名称与命名空间待 one-glossary，运行时入口交负责组另卡落实。

  # ───────────── IT 需求 ─────────────

  - id: PRC-142
    name: IT 需求工单
    type: business
    stages: [VS-14.1, VS-14.2, VS-14.3, VS-14.4]
    stages_note: >-
      VS-14.1：步 1 依上线前须填的 D15 受控类别表判断（逐类填负责人、是否需人审、理由、表提供方与维护方、采购交接，B31-3），常规草稿到已提交（待受理），需人审草稿到审批中；未列类别或有效配置缺失拒绝并告警。VS-14.2：步 2 按类别和正式制度配置批准到已提交，步 3 人工受理到处理中，两步共同形成退出；常规类别直接受理。VS-14.3：在步 3 受理之后、步 4 解决之前判断，需求不成立或无法实现直接步 6 退回，不执行解决及其事件；成立才到已解决。VS-14.4：步 5 仅提出人人工确认且满足 INV-120 才关闭到已关闭，未解决回步 3 重开；步 6 从处理中、步 7 从审批中提前到已退回，撤回也可提前结束。不设受理提醒或系统代关（B31-2），不调用调度，人工超期不自动改变状态，保留人工催办和逾期查询。
    primary_object: OBJ-114
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: true
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 需求工单表单（累计 1,622 单，来源字段待取证）迁为已关闭或已退回的历史工单；在途 105 单按 ADR-0036 第 5 条 / U-4 切换前清空，清不完的以草稿迁入沿用原编号；A8 早于投产日停用（C-7）"
    scope: "提出人看自己的工单；信息部门看全部；需审批类别的审批人看待办单据"
    segregation:
