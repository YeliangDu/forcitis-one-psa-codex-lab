    outcomes: [已关闭, 已退回, 已撤回]
    scenarios: [PRC-142-S01, PRC-142-S02, PRC-142-S03, PRC-142-S04, PRC-142-S05, PRC-142-S06, PRC-142-S07, PRC-142-S08, PRC-142-S09, PRC-142-S10, PRC-142-S11, PRC-142-S12]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工，见 notes 格式问题 1
        org_needs:
          responsibility: "提出 IT 需求，描述问题与优先级，解决后确认关闭"
          approval_right: "无（只提交与确认）"
          department_hint: "需求提出人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: approver      # ARCH_VS14 D15 IT 受控类别与责任表指定的负责人（仅需人审类别）
        org_needs:
          responsibility: "按受控类别和正式制度配置判断业务必要性及范围，不默认提出人部门负责人"
          approval_right: "仅批准已配置为需人审的类别；金额先分清 IT 或采购承载，IT 自身承载才配置两档阈值和币种"
