        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取提出人与处理人}
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：IT 受控类别与责任表、IT 金额适用口径（ARCH-B31-materials 3、4）
        notify: [{to: SH-E6, how: 企业微信待办（无需审批类别直接受理时）}]
        decision:
          - {when: IT 类别表或责任配置缺失、类别未列或无有效版, goto: 1, p: 0.02}
          - {when: 涉及金额但承载方、适用阈值或币种配置不完整, goto: 1, p: 0.01}
          - {when: 需求类别要求审批, goto: 2, p: 0.2}
          - {when: otherwise, goto: 3, p: 0.77}
      - actor: SH-M1
        where: in_system
        command: 批准 IT 需求
        aggregate: AGG-114
        wait: {typical_h: 24, p90_h: 72}  # 经验估值；null 表示待取证
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 仅有效类别表要求人审的需求进入；按类别与正式制度配置解析负责人，按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；批准后才到已提交（待受理）；采购承载金额不在 IT 重复加审，IT 自身承载的两档阈值及币种须先填
        approval:
          engine: platform.approval
          doc_type: IT需求审批
          approver: cost_object_owner     # 解析别名；实际责任人按 ARCH_VS14 D15 配置（IT 受控类别与责任表）
          escalation_rules: [AR-11, AR-12]
          why_human: "类别表逐类登记需要人判断的理由，正式制度指定的责任人判断必要性与范围；类别及责任表缺失拒绝并告警，不默认提出人部门负责人。"
          on_reject: 7
        withdraw: {to: end, outcome: 已撤回}
        cross_bc:
          - {mode: api, direction: out, bc: platform.approval, name: 提交审批}
        permission: IT需求.批准
        page: 审批平台待办
        audit: true
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：IT 受控类别与责任表、IT 金额适用口径（ARCH-B31-materials 3、4）
        decision:
          - {when: 审批已驳回, goto: 7, p: 0.1}
          - {when: otherwise, goto: 3, p: 0.9}
      - actor: SH-E6
        where: in_system
        command: 受理 IT 需求
        aggregate: AGG-114
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 常规类别从已提交受理；需审批类别步 2 批准后也是已提交，本步指定处理人后进入处理中；与步 2 合起来达到 VS-14.2 退出，不把已提交误改为处理中；受理仍由人办理，保留人工催办和逾期查询，不登记、取消或执行受理超时任务
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已通过}      # 仅经审批的类别
        permission: IT需求.受理
        page: IT需求工作台
        decision:                          # 先分流再解决：不成立时不执行解决命令、不发 IT 需求已解决（ARCH_VS14 A3）
          - {when: 需求不成立或无法实现, goto: 6, p: 0.1}
          - {when: otherwise, goto: 4, p: 0.9}
      - actor: SH-E6
        where: in_system
        command: 解决 IT 需求
        aggregate: AGG-114
        effort: {typical_min: 30, p90_min: 120}  # 经验估值；null 表示待取证
        emits: [IT 需求已解决]            # 仅分析
        desc: 记录处理过程与处理结论；实际排查在系统外进行，本系统登记过程与结论；只在需求成立时执行，处理中 → 已解决；不成立的已在步 3 后分流到步 6 退回
        permission: IT需求.解决
        page: IT需求工作台
        metric_event: true
      - actor: SH-E3
        where: in_system
        command: 关闭 IT 需求
        aggregate: AGG-114
        wait: {typical_h: 24, p90_h: 120}  # 经验估值；null 表示待取证
        effort: {typical_min: 3, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 仅提出人人工确认且已有处理结论（INV-120）后，已解决到已关闭；无处理结论拒绝并回解决步骤补结论，反馈未解决则回步 3 重开到处理中；不设超时代关或相应到期任务，人工超期保持状态，保留人工催办及逾期查询
        permission: IT需求.关闭
        page: IT需求详情页
        decision:
          - {when: 无处理结论, goto: 4, p: 0.01}      # INV-新-P3 拒绝
          - {when: 提出人认为未解决, goto: 3, p: 0.09}
          - {when: otherwise, goto: end, outcome: 已关闭, p: 0.9}
        outcome: 已关闭
      - actor: SH-E6
        where: in_system
        command: 退回 IT 需求
        aggregate: AGG-114
        effort: {typical_min: 5, p90_min: 15}  # 经验估值；null 表示待取证
        desc: 需求不成立或无法实现时退回提出人，写退回原因；由处理中到已退回
        permission: IT需求.退回
        page: IT需求工作台
        notify: [{to: SH-E3, how: 企业微信}]
        decision:
          - {when: otherwise, goto: end, outcome: 已退回, p: 1}
        outcome: 已退回
      - actor: platform
        where: automatic
        command: 驳回 IT 需求
        aggregate: AGG-114
        desc: 审批平台回调：需求标为已退回，写驳回意见；由审批中到已退回
        cross_bc:
          - {mode: event, direction: in, bc: platform.approval, name: 审批已驳回}
        notify: [{to: SH-E3, how: 企业微信}]
        outcome: 已退回
    notes: 〔缺〕驳回 IT 需求与退回 IT 需求都以「已退回」结束；前者承接审批驳回回调，后者是信息部门主动退回，见 notes 新用语。

  # ───────────── IT 资产使用（B-31 部分）：领用 ─────────────

  - id: PRC-143
    name: IT 资产领用
    type: business
    stages: [VS-14.1, VS-14.3]
    stages_note: >-
      VS-14.1：现步 1（原步 1）申请领用资产，岗位标准和超配可执行规则通过才草稿到已通过，缺失或不满足拒绝并告警；全部领用只登记、由规则控制，不设人审，跳过 VS-14.2（B31-5）；岗位配置清单、超配规则及其提供与维护方为上线前须填 D15 配置。VS-14.3：现步 2（原步 3）以规则已通过为前提实物签收并登记，INV-121 兜底，同事务创建在用使用期间、申请到已领用。流程在已领用结束；归还另由 PRC-156 重入 .4，调拨由 PRC-155 重入 .3。原步 2、4 及其审批期撤回已删除，历史状态、审批轮次和原编号仅作迁入历史保留。
    primary_object: OBJ-115
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 的 IT 资产领用（累计 1）、调拨（139）、报修（128）三类表单迁入使用记录与维修工单（调拨、报修见 PRC-155、157），须能对应到 B-24 资产卡片（对应方法待取证，见 notes 待用户定 4）；信息变更（137）、内购（3）、报废回收（1）、采购申请不属 B-31，归 B-24 / 采购，由财务组处理；在途调拨 0、报修 2、内购 1 按 ADR-0036 第 5 条 / U-4；A8 早于投产日停用（C-7）"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "使用人不得登记自己的领用（领用登记由资产管理员完成）"}
    triggers:
      - {type: human, name: "申请领用"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 121 项 IT资产领用申请；需核对线下领用记录及统计窗口）"
    outcomes: [已领用]
    scenarios: [PRC-143-S01, PRC-143-S02, PRC-143-S03, PRC-143-S04, PRC-143-S05, PRC-143-S06, PRC-143-S07]
    roles:
      - id: SH-E3
        as: initiator      # 使用人（任一员工），见 notes 格式问题 1
        org_needs:
          responsibility: "申请领用 IT 资产，签收设备，并对名下资产负责"
          approval_right: "无（只申请）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：交付、登记
        org_needs:
          responsibility: "交付设备并登记领用，保证同一资产同一时刻只有一个使用人"
          approval_right: "登记领用（不批准申请）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 申请领用资产
        aggregate: AGG-115
        effort: {typical_min: 5, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 全部领用只登记；读取 B-24 有效卡片及 B-13 使用人，申请时提前检查唯一使用人；岗位标准与超配可执行规则校验通过后草稿直达已通过。按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；规则不满足也拒绝并告警，不能改由负责人酌情批准；清单提供方及维护方上线前须填
        permission: IT资产.申请领用
        page: IT资产领用申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}      # B-31 → B-24（回补新边，intent 152926）
          - {mode: api, direction: out, bc: B-13, name: 读取使用人}
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：领用规则及清单维护（ARCH-B31-materials 5）
        notify: [{to: SH-E6, how: 企业微信待办（规则通过、待登记领用时）}]
        decision:
          - {when: 资产卡片不存在、已处置或不属 IT 资产类别, goto: 1, p: 0.01}
          - {when: 该资产已有未归还的使用人, goto: 1, p: 0.04}                      # INV-新-P4 提前拒绝；应先归还或改走调拨
          - {when: 岗位标准或超配规则、清单维护配置缺失或无有效版, goto: 1, p: 0.02}
          - {when: 岗位标准及超配可执行规则校验不通过, goto: 1, p: 0.02}
          - {when: otherwise, goto: 2, p: 0.91}           # 规则自动通过，不设审批
      - actor: SH-E6
        where: offline
        evidence: [领用人签收, 交付日期, 设备实物状态〔推〕]
        command: 登记领用
        aggregate: AGG-115
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 15, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [资产已领用]               # 仅分析；离职交接可读
        desc: 规则已通过后线下实物交付并签收，本系统登记使用人、起始日及签收凭据；不依赖审批通过事件；申请已通过到已领用，并同事务开启在用使用期间；交付时兜底 INV-121，已有使用人则拒绝
        permission: IT资产.登记领用
        page: IT资产使用登记页
        audit: true
        metric_event: true
        decision:
          - {when: 该资产已有未归还的使用人, goto: 1, p: 0.02}      # INV-新-P4 拒绝（兜底，申请时已提前拒绝）
          - {when: otherwise, goto: end, p: 0.98}
        outcome: 已领用
    notes: >-
      仅占 .1、.3；原步 2 批准、原步 4 驳回及审批期撤回不再是现行命令。历史审批中、已驳回、已撤回、轮次、原编号全量保留，ADR-0036 U-4 不因本次取消审批而改写或批量改草稿。卡片、折旧、报废及盘点账务归 B-24。

  # ───────────── IT 资产使用：调拨 ─────────────

  - id: PRC-144
    name: 申请员工活动
    type: business
    stages: [VS-14.1, VS-14.4]
    stages_note: >-
      VS-14.1：现步 1（原步 1）只登记、由规则控制（B31-8），统一规则登记，全部活动通过预算、组织安排及类型规则后草稿直达已批准（规则结果，无人工批准）；周年贺卡读 B-13 入职日期与有效人员事实，由 platform.scheduling 按入职周年于业务日自动生成（B31-10），以员工、入职日期、周年日期、类型去重；适用员工、闰日、重新入职、补跑口径与规则维护责任为上线前须填配置，缺配置拒绝并告警；其他活动可人工登记。VS-14.2 无人审直接跳过；VS-14.3 活动举办无独立对象状态，亦跳过。VS-14.4：现步 2（原步 3）组织活动并登记完成，已批准到已完成，只有已完成是本段正常退出。新增步 3「取消员工活动登记」是登记生命周期的逆向纠错，从已批准或已完成到提议终态已取消；归属于 PRC-144 的登记撤销路径，不构成 VS-14.4 服务办结退出、不新增阶段或人审。原步 2、4 和审批期撤回、AR-01/AR-02 活动金额加审已删除，历史状态与轮次保留迁入；费用、报销、采购保留自身流程。
    primary_object: OBJ-116
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "全部历史迁入（U-1–U-4）：A8 周年贺卡（累计 219）、创新项目发布申请（31）、感恩节活动（2,106，已于 2024-11-11 停用）迁为同一聚合的不同活动类型；在途 周年贺卡 38、创新项目 4、感恩节 75 按 ADR-0036 第 5 条 / U-4 处理（感恩节在途停用已久，建议审结或作废，见 notes 待用户定 9）；A8 早于投产日停用（C-7）；历史审批中、已驳回、已撤回、审批轮次与原编号全量保留；在途按 ADR-0036 U-4 逐项处置，不因取消审批批量改草稿"
    scope: "申请人看自己的申请；行政与人力看全部"
    triggers:
      - {type: time, name: 系统按入职周年自动生成（经 platform.scheduling 按业务日触发，尚未实现）}
      - {type: human, name: 其他活动人工登记}
      - {type: human, name: 已批准或已完成的活动登记取消, entry: 3}   # CONVENTIONS entry：从步 3 进入，不重复登记或完成（CON-1017-ARC-08）
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 113、118、120 项周年贺卡、感恩节活动、创新项目发布；需区分已停用类型及统计窗口）"
    outcomes: [已完成, 已取消]
    scenarios: [PRC-144-S01, PRC-144-S02, PRC-144-S03, PRC-144-S04, PRC-144-S05, PRC-144-S06, PRC-144-S07, PRC-144-S08, PRC-144-S09, PRC-144-S10, PRC-144-S11, PRC-144-S12, PRC-144-S13]
    roles:
      - id: SH-E3
        as: initiator      # 任一员工，见 notes 格式问题 1
        org_needs:
          responsibility: "登记周年贺卡以外的活动类型、参与人和费用预估；周年贺卡由系统自动生成，无需员工申请"
          approval_right: "无（只提交）"
          department_hint: "申请人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 行政：组织实施、确认完成
        org_needs:
          responsibility: "组织实施活动并确认完成；登记记错或活动取消时办理取消登记，写原因并保留审计，按需要重新登记"
          approval_right: "确认完成、取消员工活动登记（均不审批）"
          department_hint: "行政"
          position_hint: "行政事务经办人员；岗位体系未定，按职能描述"
    steps:
      - actor: system
        where: automatic
        command: 提交员工活动申请
        aggregate: AGG-116
        desc: 全部活动采用同一提交员工活动申请登记入口，系统校验活动类型、预算及组织安排的可执行规则，通过才草稿直达已批准（规则结果）；按业务日期取已批准且已生效的唯一 D15 版本；版本只追加，含版本、生效日、作者、批准人、确认时间及制度名称、版本、条款或本次答复依据；单据保存所用版本。配置缺失、重叠、无有效版或不能执行时拒绝并告警，不设默认负责人、不补零、不当不限额；规则不满足拒绝并告警，不能让经办人酌情替代人审。周年贺卡读取 B-13 入职日期与有效人员事实，B-31 登记 platform.scheduling 按业务日触发；适用员工、闰日、重新入职及补跑口径和维护责任须填；以员工 + 入职日期 + 周年日期 + 活动类型去重，重复调度和补跑不重复生成；其他活动保留人工登记（权限员工活动.提交、员工活动申请页），仍由本步校验；登记后活动类型、说明、费用预估引用及参与人等内容不可修改，记错或活动取消先取消再以新登记重登，保留被取消登记引用；周年重复调度/补跑仍返回原记录（包括已取消），不自动重登，显式重登以被取消登记引用识别并幂等返回后继登记；当前仅设计，未实现触发器
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取入职日期、有效人员事实与活动参与人}
          - {mode: api, direction: out, bc: platform.scheduling, name: 登记入职周年业务日触发与补跑去重（尚未实现）}
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：活动规则及维护、周年自动生成规则（ARCH-B31-materials 6、7）
        notify: [{to: SH-E6, how: 企业微信待办（规则已批准、待组织完成活动时）}]
        decision:
          - {when: 活动类型、预算或组织安排规则及维护配置缺失或无有效版, goto: 1, p: null}
          - {when: 活动类型、预算或组织安排可执行规则校验不通过, goto: 1, p: null}
          - {when: 周年适用员工、闰日、重新入职或补跑规则缺失, goto: 1, p: null}
          - {when: 已有活动登记已取消且不是显式重登, goto: end, outcome: 已取消, p: null}
          - {when: 登记记错或活动取消, goto: 3, p: null}
          - {when: 员工、入职日期、周年日期及活动类型已生成, goto: 2, p: null}
          - {when: otherwise, goto: 2, p: null}
        emits: [员工活动申请已批准]       # 仅分析
      - actor: SH-E6
        where: offline
        evidence: [活动完成确认, 实际参与人〔推〕]
        command: 完成员工活动
        aggregate: AGG-116
        wait: {typical_h: null, p90_h: null}  # 经验估值；null 表示待取证
        effort: {typical_min: null, p90_min: null}  # 经验估值；null 表示待取证
        desc: 规则已批准后在系统外组织活动，本系统登记完成；无审批回调前提，活动举办无独立状态，已批准直接到已完成；重复调度仅返回已有活动，已完成的返回既有结果，不再举办；已取消的只返回取消结果，不执行完成命令、不重新举办。登记内容不可改，完成确认不改写原登记内容；如确认内容记错或活动取消，走步 3 留痕取消后按需重登。费用、报销或采购引用活动并继续走自身流程，不增活动金额加审
        permission: 员工活动.完成
        page: 员工活动详情页
        decision:
          - {when: 登记记错或活动取消, goto: 3, p: null}
          - {when: otherwise, goto: end, p: null}
        outcome: 已完成
      - actor: SH-E6
        where: in_system
        command: 取消员工活动登记
        aggregate: AGG-116
        desc: 独立取消入口可从已批准（规则通过、尚未完成）或已完成直接进入，不重复提交或完成；登记内容不可修改，记错或活动取消须填写取消原因，记录取消人和取消时间、原状态及审计后到已取消，不删登记内容、完成记录或历史。缺原因拒绝并告警，重复取消返回原取消结果，不改写首次原因、人和时间；取消不设人工批准（B31-8）。重登使用步 1 的既有命令创建新登记并引用被取消登记，重新校验有效规则；不在已取消原单上修改或恢复，不自动冲销费用、报销或采购。
        permission: 员工活动.取消
        page: 员工活动详情页
        added_in: closeout
        audit: true
        decision:
          - {when: 未填写取消原因, goto: 3, p: null}
          - {when: otherwise, goto: end, outcome: 已取消, p: null}
        outcome: 已取消
    notes: 周年自动生成已获选择，当前未实现运行时触发器或补跑；登记入口沿既有提交员工活动申请，新增取消员工活动登记，已取消为提议终态（见 b31.notes.md 新用语）。去重键仍为员工、入职日期、周年日期、活动类型；自动重复/补跑只回放包括取消在内的原结果；显式重登以被取消登记引用区分并幂等返回后继登记。全部活动无人工批准、驳回、审批期撤回或活动金额加审；取消不是恢复旧审批期撤回，登记内容不可改，取消留原因、人、时间与审计，不删历史。取消属登记生命周期逆向，不能算 VS-14.4 的正常退出；多入口描述图当前统一连步 1，已完成后直接进入步 3 的入口约束须在实现契约验证，图不证明该入口行为。PRC-144 新增取消分支后的出口概率无实测依据，整组 p 留 null 待取证，其他流程经验估值不变。

  - id: PRC-155
    name: IT 资产调拨
    type: business
    stages: [VS-14.3]
    stages_note: >-
      仅占 VS-14.3：已领用或已调拨资产的使用期间在用，符合 OBJ-115 的在用进入条件；步 1 提出调拨请求（调拨申请草稿 → 已申请），本次为已使用资产重入，不是 VS-14.1 的初次领用申请；同一核算主体内跨组织调拨只通知调出、调入两侧负责人，不设批准（B31-6）。步 2 登记交接，调拨申请已申请 → 已调拨，并同事务结束调出期间、开启调入期间，满足本段已调拨退出；使用未结束，不归 VS-14.4，日后归还由 PRC-156 承接。无当前使用人的请求转 PRC-143 初次领用，结局已转领用；撤销只结束本次调拨；跨法人转让及账务归固定资产流程。
    primary_object: OBJ-115
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：A8 调拨申请表单（累计 139、在途 0）迁入使用期间历史"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "调出使用人不得登记自己的调拨（交接登记由资产管理员完成）"}
    triggers:
      - {type: human, name: "申请调拨"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 115 项 IT资产调拨申请；需核对交接登记及统计窗口）"
    outcomes: [已调拨, 已转领用, 已撤销]
    scenarios: [PRC-155-S01, PRC-155-S02, PRC-155-S03, PRC-155-S04, PRC-155-S05]
    roles:
      - id: SH-E3
        as: initiator      # 调出使用人
        org_needs:
          responsibility: "发起调拨，选定调入使用人，配合交接"
          approval_right: "无（只申请，调拨由规则守卫、不设审批）"
          department_hint: "调出使用人所在组织单元"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：核对并登记交接
        org_needs:
          responsibility: "核对并登记交接，结束调出方使用期间并开启调入方使用期间"
          approval_right: "登记调拨（不批准申请）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-M1
        as: informed      # 调出、调入使用人所在组织单元的负责人：知悉
        org_needs:
          responsibility: "知悉跨组织单元的调拨，对本单元资产使用情况负责"
          approval_right: "无（同一核算主体内跨组织只通知调出、调入两侧负责人，不增加批准）"
          department_hint: "调出方、调入方所在组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 〔缺〕申请调拨资产
        aggregate: AGG-115
        effort: {typical_min: 5, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 调出使用人（或资产管理员）选调入使用人；调拨不设人工审批，由规则守卫（同一时刻只有一个使用人、调入使用人须在职），跨组织单元的调拨通知两侧负责人（A8 有调拨申请表单，聚合稿回补只有「调拨资产」命令）；调拨请求到已申请；无使用人转领用时为已转领用；仅同一核算主体内换使用人，卡片有效及唯一使用人校验保留，跨法人转让交固定资产流程，不在此登记
        permission: IT资产.申请调拨
        page: IT资产调拨申请页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}
          - {mode: api, direction: out, bc: B-13, name: 读取使用人}
        notify: [{to: SH-M1, how: 企业微信（跨组织单元调拨时通知调出、调入两侧负责人）}]
        withdraw: {to: end, outcome: 已撤销}
        decision:
          - {when: 资产没有当前使用人, goto: PRC-143, p: 0.05}      # 无使用人的资产走领用，不走调拨
          - {when: 调入使用人在调拨日不是在职员工, goto: 1, p: 0.02}
          - {when: otherwise, goto: 2, p: 0.93}
      - actor: SH-E6
        where: offline
        evidence: [调出方与调入方交接确认, 交接日期]
        command: 调拨资产
        aggregate: AGG-115
        wait: {typical_h: 8, p90_h: 48}  # 经验估值；null 表示待取证
        effort: {typical_min: 15, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [资产已调拨]               # 仅分析
        desc: 实物交接在系统外；本系统同一事务结束调出方的使用期间并开启调入方的使用期间，保证同一时刻只有一个使用人；调拨申请到已调拨；旧期间在用 → 已结束，新期间为在用
        permission: IT资产.登记调拨
        page: IT资产使用登记页
        audit: true
        metric_event: true
        decision:
          - {when: 调出方不是该资产当前使用人, goto: 1, p: 0.02}      # INV-新-P4 拒绝
          - {when: otherwise, goto: end, p: 0.98}
        outcome: 已调拨
    notes: >-
      同一核算主体内跨组织调拨只通知双方，不增加批准或调入方负责人确认；保留实物交接记录，同事务结束旧期间并开新期间，旧期间结束不等于归还。跨法人转让及账务归 B-24 固定资产流程；不新增批准或驳回调拨命令。

  # ───────────── IT 资产使用：归还 ─────────────

  - id: PRC-156
    name: IT 资产归还
    type: business
    stages: [VS-14.4]
    stages_note: >-
      仅占 VS-14.4：承接 PRC-143 的已领用或 PRC-155 的已调拨，已有在用使用期间时，由人工登记或 B-13 Separated 生成归还待办重入，不重复 VS-14.1–VS-14.3。步 1 验收并归还资产，结局已归还对应 OBJ-115 的本段退出；AGG-115 使用期间转换写在用 → 已结束且 process_outcome 为已归还；按 ARCH_VS14 A4，VS-14 出口的已结束限定为归还资产命令产生，调拨结束旧期间不算归还。离职触发的归还待办不作 VS-13.6 退出条件；仅离职入口按离职生效日（非事件到达日）起 7 个日历日仍未归还，非中断提醒原组织单元负责人，归还完成取消到期任务，幂等键为聚合 ID + 到期时点，手工入口不套期限（B31-7，参数按 D15 记版本）；离职逾期的已提醒只结束非中断提醒分支，不代替归还。
    primary_object: OBJ-115
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：归还以使用期间结束日迁入；离职归还待办不迁（切换后由 Separated 事件生成）"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    segregation:
      - {roles: [SH-E3, SH-E6], rule: "资产管理员不得验收登记自己名下资产的归还（由另一名管理员或其负责人处理）"}
    triggers:
      - {type: human, name: 资产管理员手工登记归还（不套离职期限）}
      - {type: event, name: "员工已离职", event: Separated, bc: B-13}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 未列独立归还模板；线索为 AGG-115 使用期间结束日、归还记录与 Separated 后待办，需区分调拨结束与归还）"
    outcomes: [已归还, 已提醒]
    scenarios: [PRC-156-S01, PRC-156-S02, PRC-156-S03, PRC-156-S04, PRC-156-S05, PRC-156-S06, PRC-156-S07, PRC-156-S08]
    roles:
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：验收并登记
        org_needs:
          responsibility: "验收归还的设备并登记归还日，处理离职触发的归还待办"
          approval_right: "登记归还（验收人不得是名下资产自己的管理员）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-E3
        as: informed      # 使用人
        org_needs:
          responsibility: "按要求归还设备，对归还前的资产负责"
          approval_right: "无（只知悉）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-M1
        as: informed      # 离职员工原组织单元负责人：逾期未归还时收到提醒
        org_needs:
          responsibility: "离职员工原组织单元负责人，对逾期未归还的资产收到提醒并督促"
          approval_right: "无（只接收提醒）"
          department_hint: "离职员工原组织单元"
          position_hint: "组织单元负责人（部门负责人）；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E6
        where: offline
        evidence: [归还验收人, 归还日期, 设备实物状态]
        command: 归还资产
        aggregate: AGG-115
        wait: {typical_h: null, p90_h: null}  # 经验估值；null 表示待取证
        effort: {typical_min: 15, p90_min: 30}  # 经验估值；null 表示待取证
        emits: [资产已归还]               # 仅分析；离职交接可读
        desc: 双入口：手工归还不登记离职到期任务；仅已生效离职 Separated 为名下每件仍在用资产生成归还待办。离职到期时点固定为离职生效后 7 个日历日，不从流程启动或事件到达起算；B-31 向 platform.scheduling 登记该到期时点，逾期仍未归还则非中断提醒原组织单元负责人；归还完成取消任务。幂等键为聚合 ID + 到期时点，晚到事件及重试不重置期限，晚到时已到期则核对当前在用期间后执行一次到期提醒；已归还不建待办、不提醒。实物验收后登记归还日，使用期间在用到已结束，process_outcome 为已归还；调拨结束不混作归还，INV-121 保持。该提醒按本次答复登记 D15 版本、生效日、批准人及依据，配置未登记则拒绝并告警；本卡未实现调度器。
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}      # 事件触发时；人工触发无此项
          - {mode: api, direction: out, bc: platform.scheduling, name: 仅离职入口登记离职生效后 7 个日历日提醒并在归还完成时取消}
        permission: IT资产.登记归还
        page: IT资产使用登记页
        audit: true
        metric_event: true
        notify: [{to: SH-E6, how: 企业微信待办（事件触发时）}]
        # 非中断超时分支结局为已提醒，原任务继续；提醒不改对象状态。
        timeout: {after: "P7D", escalate_to: SH-M1, interrupting: false}   # ARCH_VS14 D15 离职归还提醒：仅离职生效后 7 个日历日，完成取消；起点非任务启动/事件到达
        pending: ARCH_VS14.md「上线前须填的 D15 配置与规则约束」：离职归还提醒（已定 7 个日历日，以 B31-20261017-122917-ctg 登记版本、生效日、批准人及依据）
        decision:
          - {when: 该资产没有未结束的使用期间, goto: 1, p: 0.02}      # 已先行归还或待办重复：拒绝登记，待办由事件处理器取消
          - {when: otherwise, goto: end, p: 0.98}
        outcome: 已归还
    notes: >-
      timeout.after P7D 仅表示离职入口的日历期限，绝非从本任务开始等待 P7D；起算点为离职生效时点，手工入口不适用。双入口的条件及绝对到期时点写在本步描述，通用描述图不足以证明运行时定时语义；本卡仅流程设计。归还完成取消，重复或晚到 Separated 不重置期限。不订阅离职登记已撤销，归还不作 VS-13.6 出口条件。

  # ───────────── IT 资产使用：报修 ─────────────

  - id: PRC-157
    name: IT 资产报修与维修登记
    type: business
    stages: [VS-14.3, VS-14.4]
    stages_note: >-
      VS-14.3：已有在用资产故障后重入，步 1 报修资产创建 AGG-121 维修单到已报修，步 2 登记维修结果到已维修登记，对应本段 OBJ-115 / AGG-121 退出；不重复初次领用的 VS-14.1、VS-14.2，也不设维修审批。按 ARCH_VS14 A5，VS-14.3 进入已拆为 AGG-121 已报修，不把已报修放入 AGG-115。VS-14.4：步 2 同时确认本次维修登记，已维修登记保持为该次服务办结事实（进入与退出同态），不加空转命令；已修复或无法修复是结果属性，不作状态，维修结束不等于资产已归还。
    primary_object: OBJ-115
    primary_object_note: "AGG-121 维修单是 OBJ-115 的维修工单子生命周期"
    owner_bc: B-31
    group: people
    status: draft
    human_orchestration: false
    bpmn: ~
    migration: "见 PRC-143：A8 报修申请表单（累计 128、在途 2）迁为维修工单历史；在途 2 按 U-4 切换前办结；全部维修明细与原编号保留，结果已修复/无法修复仅为属性，终态仍为已维修登记，不新增审批，不因取消其他流程审批批量改历史或草稿"
    scope: "使用人看自己名下资产；信息部门（资产管理员）看全部"
    triggers:
      - {type: human, name: "报修"}
    frequency_ref: "待取证（OA_PROCESS_INVENTORY.md 表第 116 项 IT资产报修申请；需核对维修完成记录及统计窗口）"
    outcomes: [已维修登记]
    scenarios: [PRC-157-S01, PRC-157-S02, PRC-157-S03]
    roles:
      - id: SH-E3
        as: initiator      # 使用人
        org_needs:
          responsibility: "发现设备故障时报修，描述故障"
          approval_right: "无（只报修）"
          department_hint: "使用人所在组织单元（全部门）"
          position_hint: "任一在职员工，不限职位"
      - id: SH-E6
        as: performer      # 信息（IT）资产管理员：送修并登记维修结果
        org_needs:
          responsibility: "送修或内部处理，并登记维修结果与证据"
          approval_right: "登记维修结果（不审批）"
          department_hint: "信息（IT）"
          position_hint: "IT 资产管理员；岗位体系未定，按职能描述"
      - id: SH-E6
        as: informed      # 财务（B-24 资产卡片维护人），知悉维修无法修复的结果
        org_needs:
          responsibility: "作为 B-24 资产卡片维护人，知悉维修无法修复的结果并另行发起报废"
          approval_right: "无（只知悉，报废由财务在 B-24 发起）"
          department_hint: "财务"
          position_hint: "固定资产核算与卡片维护人员；岗位体系未定，按职能描述"
    steps:
      - actor: SH-E3
        where: in_system
        command: 报修资产
        aggregate: AGG-121
        effort: {typical_min: 5, p90_min: 10}  # 经验估值；null 表示待取证
        desc: 使用人填故障描述，生成维修工单；报修不经审批（维修结果登记与采购、费用报销各走各自的审批；单项维修费用若超限额走采购 / 费控，不属 B-31）；维修单草稿 → 已报修
        permission: IT资产.报修
        page: IT资产报修页
        added_in: closeout
        cross_bc:
          - {mode: api, direction: out, bc: B-24, name: 读取资产卡片}
        decision:
          - {when: 报修人不是该资产当前使用人, goto: 1, p: 0.02}      # 规则拒绝，使用人名下才能报修；资产管理员代报时选使用人
          - {when: otherwise, goto: 2, p: 0.98}
      - actor: SH-E6
        where: external:维修服务商
        evidence: [维修单或发票引用, 维修结果, 完成日期]
        command: 登记维修结果
        aggregate: AGG-121
        wait: {typical_h: 24, p90_h: 120}  # 经验估值；null 表示待取证
        effort: {typical_min: 10, p90_min: 30}  # 经验估值；null 表示待取证
        desc: 从已报修登记到已维修登记，同时确认本次维修服务办结；维修在系统外（内部处理或送修厂商），无接口，本系统只登记结果与证据；无法修复的资产由财务在 B-24 另行报废，B-31 不发起（B-31 → B-24 只有读取边，见 notes 接缝问题 1）
        permission: IT资产.登记维修结果
        page: IT资产维修工单页
        audit: true
        outcome: 已维修登记
    notes: 维修结果（已修复 / 无法修复）由工单的结果列表达，骨架不分叉。

  # ───────────── 员工活动 ─────────────

  - id: PRC-181
    name: 记录经营复盘并跟踪动作
    trigger:
      type: event
      desc: 会计期间已关账（经营月报据此出具）；或季度、年度综合复盘到期
    stages: [VS-09.3]
    stages_note: "归 VS-09.3：SD-15 已批准退出条件补「经营复盘已闭环」，由本流程无动作定稿或全部经营动作完成产生；需调整计划时转 PRC-88 产生另一种退出「经营计划新版本」。批准依据：intent 2026-10-17-084935-one-coordinator-ANM-页提交-ANM-2026.md（AN-11）；价值流定义由 one-architecture 写回"
    primary_object: OBJ-100
    owner_bc: B-18
    human_orchestration: true
    human_note: 偏差解释、经营动作的确定与完成登记由人判断；全过程不设审批，靠规则守卫与逾期提醒
    migration: "不迁入历史复盘：老系统是否有经营复盘或偏差处置记录来源待取证；投产后从首个关账期间起记录。取证若发现在途的偏差处置事项，再按当前状态迁入为复盘与经营动作"
    scope: "复盘记录与经营动作按复盘组织单元的数据范围可见：该组织单元责任人及其上级、财务、管理层；动作责任人见本人的动作"
    triggers:
      - {type: event, entry: 1, name: "会计期间已关账（月度；经营月报据此出具，B-19 发布）", event: AccountingPeriodClosed, bc: B-19}
      - {type: time, entry: 1, name: "季度、年度综合复盘到期（B-18 向 platform.scheduling 登记，幂等键 = 复盘组织单元 ID + 复盘期间）"}
    outcomes: [经营复盘已闭环, 已转调整计划, 复盘待期间关账, 已提醒]
    scenarios: [PRC-181-S01, PRC-181-S02, PRC-181-S03, PRC-181-S04, PRC-181-S05, PRC-181-S06]
    roles:
      - {id: SH-M1, as: initiator, org_needs: {responsibility: 对所辖组织单元的经营偏差作出解释，确定经营动作及其责任人和期限，定稿复盘, approval_right: 无（复盘记录不设审批）, department_hint: 复盘组织单元（部门、事业部；公司级为管理层）, position_hint: 组织单元负责人（部门负责人）；公司级为管理层负责人}}
      - {id: SH-M1, as: performer, org_needs: {responsibility: 作为经营动作责任人完成动作并登记完成, approval_right: 无, department_hint: 动作责任人所在组织单元, position_hint: 组织单元负责人或其指定的动作责任人}}       # 动作责任人可以是复盘责任人本人或其指定的人员，一律取 SH-M1 的职责口径，岗位体系定后再核
      - {id: SH-E6, as: performer, org_needs: {responsibility: 经营月报出具后为偏差提供口径说明与财务分析支持, approval_right: 无, department_hint: 财务部门, position_hint: 经营分析与管理会计职能岗}}       # VS-09.3 参与者；系统内无其命令，口径说明经月报与线下沟通，是否需要系统内步骤见 NOTES 待用户定 10
      - {id: SH-O1, as: informed, org_needs: {responsibility: 获知经营复盘结论与动作完成情况, approval_right: 无, department_hint: 不适用（股东和合伙人）, position_hint: 不适用}}        # VS-09 价值接收方；经营月报与复盘摘要的接收方，不参与动作
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕创建经营复盘
        aggregate: AGG-79
        desc: 为每个有已基线经营计划的复盘组织单元，按关账期间（或综合复盘周期末期间）创建一条经营复盘，关联当期基线版本；偏差数据由经营月报（PRC-90，reporting 读模型）展示，复盘记录只存引用与偏差解释，不复制报表数；同一组织单元 × 复盘期间只一条（幂等）；综合复盘到点而期间尚未关账的不创建，告警财务，关账后由月度触发补建
        audit: true
        notify:
          - {to: SH-M1, how: 企业微信待办}      # 通知复盘责任人
          - {to: SH-E6, how: 企业微信通知（期间未关账时：待关账后自动补建）}
        cross_bc:
          - {mode: event, direction: in, bc: B-19, name: AccountingPeriodClosed}       # B-18 → B-19 事件边尚无，见 NOTES 接缝问题 8
        decision:
          - {when: 复盘期间尚未关账, goto: end, outcome: 复盘待期间关账}
          - {when: otherwise, goto: 2}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕记录偏差解释
        aggregate: AGG-79
        desc: 对目标偏差超出容忍度的指标逐项写解释（原因与是否可持续）；未超容忍度的指标可不解释；容忍度为规则参数（候选规则，交 one-rules）
        permission: 经营复盘.记录偏差解释
        page: 经营复盘编辑页
        decision:
          - {when: otherwise, goto: 3}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕确定经营动作
        aggregate: AGG-79
        desc: 每个动作写描述、类型（含「调整经营计划」）、责任人、期限和来源偏差；一次复盘可确定多个动作，重复本步；动作责任人收到待办
        permission: 经营复盘.确定经营动作
        page: 经营复盘编辑页
        notify: [{to: SH-M1, how: 企业微信待办}]      # 通知动作责任人
        decision:
          - {when: otherwise, goto: 4}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕定稿经营复盘
        aggregate: AGG-79
        emits: [经营复盘已定稿]
        desc: 规则守卫：超出容忍度的偏差都有解释才可定稿；每个动作都有责任人和期限；定稿后结论不可改，更正另记经营动作。不设审批：复盘记录不产生资金、对外效力或不可逆后果，约束靠上述规则与逾期提醒。含「调整经营计划」类动作的，复盘转 PRC-88（经营复盘后调整计划，编制人另起新版本并引用该动作）；其余动作的跟踪随经营复盘记录继续，见 NOTES 格式问题 10
        permission: 经营复盘.定稿
        page: 经营复盘编辑页
        audit: true
        metric_event: true
        decision:
          - {when: 复盘未确定任何经营动作, goto: end, outcome: 经营复盘已闭环}
          - {when: 经营动作含调整经营计划, goto: PRC-88, outcome: 已转调整计划}
          - {when: otherwise, goto: 5}

      - actor: SH-M1
        where: in_system
        command: 〔缺〕完成经营动作
        aggregate: AGG-79
        emits: [经营复盘已闭环]
        desc: 动作责任人登记完成说明；全部动作完成后经营复盘闭环；到期未完成的动作非中断，由系统提醒复盘责任人，不自动完成、不自动取消；动作的取消与延期是否需要见 NOTES 待用户定 11
        permission: 经营动作.完成
        page: 经营动作跟踪页
        audit: true
        metric_event: true
        timeout: {after: "各经营动作自带的期限（确定动作时登记，B-18 向 platform.scheduling 登记到期提醒）", escalate_to: system, interrupting: false}      # 系统向复盘责任人发提醒（企业微信通知），与动作责任人同为 SH-M1 角色，故升级任务放系统泳道
        decision:
          - {when: 仍有未完成的经营动作, goto: 5}
          - {when: otherwise, goto: end, outcome: 经营复盘已闭环}
        outcome: 经营复盘已闭环
    notes: 对应价值流 VS-09.3「偏差有解释、有责任人和动作」。经营月报（PRC-90）只读不写，复盘记录由本流程写入。经营复盘记录先放 AGG-79（经营计划版本的次级「复盘记录」），不新增聚合，见 NOTES 结构问题 11，待 one-architecture 定。PRC-88 的第二个触发（经营复盘后调整计划）由「调整经营计划」类动作承接。

  - id: PRC-201
    name: 登记代发结果并补发薪酬
    type: business
    trigger:
      type: human
      desc: 财务收到银行代发回单后登记；有支付失败行时经更正工资卡账户发起补发
    triggers:
      - {type: human, name: "财务收到银行代发回单"}
      - {type: human, name: "薪酬岗在员工更正工资卡账户后发起补发", entry: 4}
    stages: [VS-13.5]
    stages_note: "VS-13.5 代发付款：步 1、5 登记代发结果使薪酬结算行到已实付，全部行已实付且应付已结清时同一事务推进月度薪酬结算到已发放（OBJ-73，VS-13.5 退出条件）；支付失败行经步 2–4 补发后重入步 5（PAYROLL_LINE_PAYMENT.md，ARC-1022-COO-06）"
    primary_object: OBJ-73
    owner_bc: B-15
    human_orchestration: true
    human_note: 银行回单的事实登记与补发都不设人审，由守卫控制（回单逐行核对、补发金额等于原实发、补发截止日按工作日历计算）
    migration: "历史薪酬按已发放迁入，薪酬结算行写一条 空 → 已实付 初始转换（ADR-0058 决定 8）；老系统失败与补发记录先取证再定，不推定"
    scope: "薪酬结算行属敏感个人信息：财务职能人员只见本法人代发结果，薪酬岗见本法人薪酬结算行，员工只见本人"
    segregation:
      - {roles: [SH-E6, SH-E6], rule: "登记代发结果者（财务，持回单）与发起补发者（人力薪酬岗）不得为同一人"}
    frequency_ref: 待取证（按法人 × 月一次登记；补发频次待取证）
    outcomes: [已发放, 待应付结清, 已提醒]
    scenarios: [PRC-201-S01, PRC-201-S02, PRC-201-S03, PRC-201-S04, PRC-201-S05, PRC-201-S06]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "按银行代发回单逐行登记代发结果（含银行退回日）", approval_right: "无", department_hint: "财务部", position_hint: "财务职能人员（出纳）"}}
      - {id: SH-E6, as: initiator, org_needs: {responsibility: "支付失败行在员工更正工资卡后于补发截止日前发起补发；长假确实办不完时登记顺延并通知员工", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源职能人员（薪酬岗）"}}
      - {id: SH-E3, as: informed, org_needs: {responsibility: "本人支付失败时更正工资卡账户；补发顺延时收到通知", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}
      - {id: SH-E6, as: informed, org_needs: {responsibility: "补发截止日到期未补发时收到提醒并督办", approval_right: "无", department_hint: "财务部", position_hint: "法人财务负责人"}}
      - {id: SH-M1, as: informed, org_needs: {responsibility: "补发逾期超过 5 个工作日时收到升级提醒并督办", approval_right: "无", department_hint: "管理层", position_hint: "法人负责人（ROLE-26 总经理，按法人解析）"}}
    steps:
      - actor: SH-E6
        where: in_system
        command: 登记代发结果
        aggregate: AGG-73
        desc: 上传银行代发回单，逐行与薪酬结算行核对人员与实发金额，任一不符整批拒绝并列出差异；成功行到已实付，失败行到支付失败（失败原因、银行退回日必填）；根须为已批准；失败行同时算出补发截止日（见步 2）
        permission: 薪酬代发结果.登记
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 15, p90_min: 60}
        decision:
          - {when: 有薪酬结算行支付失败, goto: 2, p: 0.1}
          - {when: 全部薪酬结算行已实付且应付已结清, goto: end, outcome: 已发放, p: 0.6}
          - {when: otherwise, goto: end, outcome: 待应付结清, p: 0.3}
      - actor: system
        where: automatic
        command: 通知支付失败员工更正工资卡
        platform_task: true
        service: platform.notification
        desc: >-
          通知失败员工与薪酬岗，并经 platform.scheduling 按补发截止日登记到期提醒（幂等键：薪酬结算行 ID + 补发轮次 + 截止日）。
          补发截止日（用户 FCQ-06，intent 2026-10-22-103824）：自银行退回日的次日起算 3 天，第 3 天为截止日；截止日遇节假日或休息日，提前到最近的工作日；
          工作日按 ADR-0072 已确认的工作日历（AGG-68）判定，日历版本缺失时拒绝计算并告警。工资卡账户存放与更正位置待 U8（vs13.notes.md 接缝问题 3）。
        notify:
          - {to: SH-E3, how: 企业微信通知}
          - {to: SH-E6, how: "企业微信待办（薪酬岗）；到期提醒：到期日 = 退回日次日起 3 天，遇节假日或休息日提前到最近工作日，到期未补发计入逾期统计（FCQ-06/07）"}
          - {to: SH-E6, how: "到期提醒法人财务负责人：到期日 = 退回日次日起 3 天（同上）"}
        timeout: {after: "到期后 5 个工作日", escalate_to: ROLE-26, interrupting: false}   # 仍未补发升级到法人负责人（ROLE-26 总经理，按法人解析）；与 ADR-0073 会签逾期链同一纪律（FCQ-07）
        metric_event: true
        decision:
          - {when: 补发截止日落在长假内且确实无法在截止日前办完, goto: 3, p: 0.05}
          - {when: otherwise, goto: 4, p: 0.95}
      - actor: SH-E6
        where: in_system
        command: 登记薪酬补发顺延
        aggregate: AGG-73
        desc: 长假确实没法在 3 天内办完时可顺延：顺延截止日只能是长假前最后一个工作日或长假后第一个工作日（按工作日历），并必须通知员工；不满足则拒绝；顺延后仍未办完照常进逾期统计（FCQ-06）
        permission: 薪酬补发.顺延
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 3, p90_min: 10}
        notify: [{to: SH-E3, how: 企业微信通知（补发顺延及新截止日）}]
      - actor: SH-E6
        where: in_system
        command: 发起薪酬补发
        aggregate: AGG-73
        emits: [薪酬补发已发起]
        desc: 员工工资卡已更正后于补发截止日（或顺延截止日）前发起补发，补发金额等于原实发，不重算；薪酬结算行 支付失败 → 待支付；PRC-126 第 2 步据此调 B-10「登记薪酬补发明细」，在原应付上挂补发明细（不新建应付），由 PRC-75 付清；截止日后才发起的照常补发，但该行已计入逾期统计
        permission: 薪酬补发.发起
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 5, p90_min: 15}
        cross_bc:
          - {mode: event, direction: out, bc: B-15, name: 薪酬补发已发起}
      - actor: SH-E6
        where: in_system
        command: 登记代发结果
        aggregate: AGG-73
        desc: 登记补发回单；最后一行已实付且应付已结清时同一事务推进根到已发放；补发成功即取消该行的到期提醒
        permission: 薪酬代发结果.登记
        page: 薪酬代发结果登记页
        audit: true
        effort: {typical_min: 5, p90_min: 15}
        decision:
          - {when: 有薪酬结算行支付失败, goto: 2, p: 0.05}
          - {when: 全部薪酬结算行已实付且应付已结清, goto: end, outcome: 已发放, p: 0.8}
          - {when: otherwise, goto: end, outcome: 待应付结清, p: 0.15}
    notes: "ARC-1022-COO-06；one-architecture 给号 PRC-201（PRC_ALLOCATIONS.md）。补发时限与提醒按用户 FCQ-06/07（intent 2026-10-22-103824）。待应付结清时由 PRC-127 收到应付已结清后推进根。已实付后银行再退票不建模（J-4，出现首例再开卡）。"

event_policies:

  - id: PRC-113
    name: 并入股息红利个税扣缴申报
    trigger:
      type: event
      events:
        - {event: 利润分配已支付, aggregate: AGG-109}
    triggers:
      - {type: event, name: "利润分配已支付（B-10 发布）"}
    stages: [VS-12.2]
    primary_object: OBJ-92
    owner_bc: B-15
    migration: "历史股息红利个税（老系统无独立记录，是否存在待取证）按所属期迁入申报批次；迁入不触发（ADR-0036 M7）"
    outcomes: [已并入申报, 无需扣缴]
    scenarios: [PRC-113-S01, PRC-113-S02]   # S01 自然人股东分红并入当期个税申报；S02 法人股东不扣缴个税
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉申报批次中出现股息红利并入项", approval_right: "无", department_hint: "人力资源部（薪酬、申报岗）", position_hint: "薪酬岗、申报岗"}}       # 人力：申报批次中出现并入项
      - {id: SH-O1, as: external, org_needs: {responsibility: "自然人股东是个税纳税人，法人股东自行处理所得", approval_right: "无（外部相关方）", department_hint: "外部（股东）", position_hint: "不适用"}}       # 股东：自然人股东是纳税人
    step:
      actor: system
      where: automatic
      command: 并入扣缴申报
      aggregate: AGG-95
      desc: 自然人股东的股息红利所得适用 20% 比例税率，由支付方代扣代缴（个人所得税法第三条、第九条）；并入当期申报批次，实际申报在 PRC-125；法人股东不涉及个税，合伙人的所得性质因被投资主体而异，见 notes 结构问题
      legal_entity: 扣缴义务人法人
      audit: true
      decision:
        - {when: 股东是法人或机构, goto: end, outcome: 无需扣缴}
        - {when: otherwise, goto: end, outcome: 已并入申报}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 利润分配已支付}
    notes: 沿已有边 B-15 → B-10，不新增反向边。扣缴额须在支付前确定，见 notes 接缝问题 4。

  - id: PRC-126
    name: 提交应付薪酬
    trigger:
      type: event
      events:
        - {event: 薪酬已批准, aggregate: AGG-73}
        - {event: 薪酬补发已发起, aggregate: AGG-73}
        - {event: 付款已部分退回, aggregate: AGG-53}
    triggers:
      - {type: event, name: "薪酬已批准（同 BC）"}
      - {type: event, name: "薪酬补发已发起（同 BC，PRC-201 第 3 步）", entry: 2}
      - {type: event, name: "付款已部分退回（B-10 发布；重发此前因退回款未登记被拒的补发明细）", entry: 2}
    stages: [VS-13.5]
    stages_note: "VS-13.5：触发状态「已批准」（OBJ-73）是 VS-13.5 的进入条件，本策略提交应付薪酬正是 VS-13.5「提交应付薪酬、代发付款」的第一步，结局应付已确认导向 VS-13.5 退出「已结清」；不归 VS-13.4——VS-13.4 申报缴纳与应付无关，同为「已批准」进入只是字面重合；原挂 VS-13.3（触发状态所在段的退出）按 #421 第 6a 项改（2026-10-16）"
    primary_object: OBJ-85
    owner_bc: B-15
    migration: "历史薪酬的应付（老系统付款申请单-人事约 1.5 千行）作为已结清应付迁入，只迁结果与证据；迁入不触发（ADR-0036 M7）"
    outcomes: [应付已提交, 补发明细已登记, 待退回到账]
    scenarios: [PRC-126-S01, PRC-126-S02, PRC-126-S03, PRC-126-S04]   # S01 批准后提交合计；S02 重复触发幂等；S03 退回款未登记被拒后重发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "财务知悉待付清单出现应付薪酬或补发明细，按付款流程办理", approval_right: "无", department_hint: "财务部", position_hint: "出纳、应付会计"}}       # 财务：待付清单出现应付薪酬
    steps:
      - actor: system
        where: automatic
        command: 提交应付薪酬
        aggregate: AGG-52
        emits: [应付已确认]
        desc: 薪酬已批准时提交法人 × 月一笔实发合计（新建应付），按薪酬结算 ID 幂等；之后走 PRC-75“发起、审批并执行付款”（B-10）；P-40 每月至少一次支付工资（工资支付暂行规定第七条）；代发明细（员工 × 账户 × 金额）如何随付款交给银行见 notes 接缝问题 3
        audit: true
        legal_entity: 薪酬法人（发薪法人）
        decision:
          - {when: 该薪酬结算已提交过应付, goto: end, outcome: 应付已提交}
          - {when: otherwise, goto: end, outcome: 应付已提交}
        cross_bc:
          - {mode: api, direction: out, bc: B-10, name: 提交应付薪酬}
      - actor: system
        where: automatic
        command: 登记薪酬补发明细
        aggregate: AGG-52
        desc: 薪酬补发已发起时，在原应付薪酬上登记补发明细（已部分结清 → 已部分结清，不新建应付；补发金额等于原实发），由 PRC-75 付清代发退回后恢复的未结余额；守卫：累计补发额不超过累计冲回额，退回款（AGG-53 登记代发退回）未登记的拒收并告警；收到付款已部分退回后重发此前被拒的补发明细；幂等键：薪酬结算行 ID + 补发轮次（one-arch-finance @1565ca88，one-architecture 2026-10-22 定稿 J-1、J-3）
        audit: true
        legal_entity: 薪酬法人（发薪法人）
        notify: [{to: SH-E6, how: 企业微信待办}]      # 被拒时提醒薪酬岗与出纳
        decision:
          - {when: 补发因退回款未登记被拒, goto: end, outcome: 待退回到账}
          - {when: otherwise, goto: end, outcome: 补发明细已登记}
        cross_bc:
          - {mode: api, direction: out, bc: B-10, name: 登记薪酬补发明细}
    notes: 应付薪酬由 B-10 的 AGG-52 承载；补发不新建应付，挂原应付补发明细；付款、核销、代发退回见 PRC-75、PRC-131、PRC-132（B-10，财务组），本组只写接缝。

  - id: PRC-127
    name: 标记薪酬已发放
    trigger:
      type: event
      events:
        - {event: 应付已结清, aggregate: AGG-52, filter: "应付类型为应付薪酬且来源为月度薪酬结算"}
    triggers:
      - {type: event, name: "应付已结清（B-10 发布；B-15 只处理应付薪酬）"}
    stages: [VS-13.5]
    primary_object: OBJ-73
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的发放状态随结算迁入"
    outcomes: [已发放]
    scenarios: [PRC-127-S01, PRC-127-S02, PRC-127-S03]   # S01 应付结清后置已发放并通知工资条；S02 退票时付款已失败，薪酬保持已批准；S03 置已发放时过账事实已入账，转 PRC-134
    roles:
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人工资条", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：工资条可查看
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已发放", approval_right: "无", department_hint: "财务部、人力资源部", position_hint: "薪酬岗、财务"}}
    step:
      actor: system
      where: automatic
      command: 标记薪酬已发放
      aggregate: AGG-73
      emits: [薪酬已发放]
      desc: 应付已结清且全部薪酬结算行已实付才置已发放；有支付失败行时保持已批准，待补发登记成功后由「登记代发结果」同一事务推进（PAYROLL_LINE_PAYMENT.md）；已发放与事实已过账两个条件任一后到者触发置已过账
      audit: true
      notify: [{to: SH-E3, how: 企业微信通知（工资条可查看）}]
      decision:
        - {when: 该薪酬的过账事实已入账, goto: PRC-134}
        - {when: otherwise, goto: end, outcome: 已发放}
      cross_bc:
        - {mode: event, direction: in, bc: B-10, name: 应付已结清}
    notes: 订阅关系 B-15 → B-10（api、事件）。应付已结清事件需带应付类型与来源，B-15 与 B-12 都订阅，各自过滤（notes 结构问题 4）。

  - id: PRC-129
    name: 离职后吊销会话
    type: retired                     # 原 event_policy；CON-1017-ARC-10 R-1 退役，进平台作业登记
    status: retired
    note: "CON-1017-ARC-10 R-1：移出流程目录，进平台作业登记（platform.identity 吊销会话作业；PROCESS_ANCHORING_RESEARCH 审题后修订第 3 条：平台身份机制的技术动作，不是业务人员按规则反复办理的流程）；PRC-138 第 1 步改为调用平台作业，不再 calls PRC-129"
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: []
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: platform.identity
    migration: "不适用（迁入不发事件，ADR-0036 M7；历史离职人员的会话与授予按迁入对账）"
    outcomes: [会话已吊销]
    scenarios: [PRC-129-S01, PRC-129-S02]
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "吊销失败时处理告警", approval_right: "无", department_hint: "信息部门", position_hint: "信息管理员"}}       # 信息（IT）：吊销失败告警
    step:
      actor: platform
      where: automatic
      platform_task: true
      service: platform.identity
      command: 吊销会话
      desc: 聚合稿 §1.4 G-2 强制事件反应，RULE-363 已定，安全关键：收到 Separated 即吊销该人员的全部会话与每请求复核，不依赖企业微信账号状态。失败重试并告警信息部门，不静默（CLAUDE.md 第 6 条）；其余离职处置（角色授予、应急账号、登录身份）见 PRC-138
      audit: true
      notify: [{to: SH-E6, how: 企业微信待办}]
      outcome: 会话已吊销
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: Separated}
    notes: "平台已建模块，不是企业聚合；与 PRC-138 配合。无人工审批：吊销是强制反应。无业务对象，primary_object: none。理由：会话吊销是平台身份事项，不是业务对象状态（VS-13.6 notes）。"

  - id: PRC-130
    name: 办理参保减员
    type: event_policy
    trigger:
      type: event
      events: [{event: Separated, aggregate: AGG-62}]
      desc: 人力收到离职事件后 15 日内办理转移手续（P-32）
    triggers:
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
    stages: [VS-13.6]
    primary_object: OBJ-62
    owner_bc: B-15
    migration: "不适用（迁入不发事件；历史参保减员记录随 AGG-74 全量迁入）"
    outcomes: [社保与公积金参保已减员, 无需减员]
    scenarios: [PRC-130-S01, PRC-130-S02, PRC-130-S03, PRC-130-S04, PRC-130-S05]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "办理参保减员与公积金封存或转移", approval_right: "无", department_hint: "人力资源部（薪酬与社保）", position_hint: "薪酬与社保专员（职能：参保经办）"}}      # 人力（薪酬与社保）
    steps:
      - actor: system
        where: automatic
        command: 终止薪酬档案
        aggregate: AGG-93
        desc: S-32：B-15 订阅 Separated 后结束人员最后一个生效的薪酬档案版本，区间止于离职日（显式优于由人员状态推断）；离职当月的入离职折算仍读离职日之前有效的版本；人员无任何档案版本失败并告警薪酬岗，不静默，不阻断后续参保减员；已终止无操作
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
        decision:
          - {when: 人员无任何薪酬档案版本, goto: 2}
          - {when: otherwise, goto: 2}
      - actor: SH-E6
        where: offline
        evidence: [社保减员回执, 公积金封存或转移回执, 办理日]
        command: 参保减员
        aggregate: AGG-74
        emits: [参保已减员]
        desc: 社保减员与公积金封存 / 转移在人社与公积金网办办理，没有面向本系统的接口，办理后回填；离职日起 15 日内（P-32）。退休返聘与实习不参保，无需减员（用户已定 T-4）
        permission: 参保.减员
        page: 参保登记页
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        timeout: {after: "P15D", escalate_to: SH-M1, interrupting: false}   # P-32 提醒，逾期升级给职能高管〔推〕
        decision:
          - {when: 用工类型为退休返聘或实习, goto: end, outcome: 无需减员}
          - {when: otherwise, goto: end, outcome: 社保与公积金参保已减员}
        cross_bc:
          - {mode: api, direction: out, bc: B-13, name: 读取用工类型}
    notes: B-15 → B-13（api、事件）已有边。工资结清与离职当月社保费用口径属 B-15 薪酬结算，不在本策略。无人工审批。流程名沿用目录「离职后参保减员」，第 1 步终止薪酬档案是 S-32 并入的第二类离职反应（目录名待 one-architecture 视情改为含薪酬档案）。

  - id: PRC-134
    name: 标记薪酬已过账
    trigger:
      type: event
      events:
        - {event: BusinessFactAttributed, aggregate: AGG-77, filter: "来源单据为月度薪酬结算"}
    triggers:
      - {type: event, name: "BusinessFactAttributed（B-16 发布；B-15 只处理薪酬来源）"}
    stages: [VS-13.5]
    stages_note: "触发是过账事实（BusinessFactAttributed），不是任一阶段的对象状态；改按结局归段：置位月度薪酬结算「已过账」，是 VS-13.5 退出条件「已发放 → 已过账」的末端（归段判据第 6 项）"
    primary_object: OBJ-73
    owner_bc: B-15
    migration: "迁入不触发（ADR-0036 M7）；历史薪酬的已过账状态随结算迁入"
    outcomes: [已过账, 待发放后再置位]
    scenarios: [PRC-134-S01, PRC-134-S02]   # S01 已发放后过账完成置已过账；S02 过账先于发放，记标志待 PRC-127 触发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "知悉薪酬已过账", approval_right: "无", department_hint: "财务部", position_hint: "总账会计"}}
    step:
      actor: system
      where: automatic
      command: 标记薪酬已过账
      aggregate: AGG-73
      desc: 按来源单据 ID 取薪酬结算行；已发放与事实已过账两个条件任一后到者触发（符合性审查 断链 7）
      audit: true
      decision:
        - {when: 薪酬尚未发放, goto: end, outcome: 待发放后再置位}
        - {when: otherwise, goto: end, outcome: 已过账}
      cross_bc:
        - {mode: event, direction: in, bc: B-16, name: BusinessFactAttributed}
    notes: 由原 PRC-124 末步与 PRC-127 第二步拆出（G-18 已处理）。

  - id: PRC-145
    name: 员工法人三口径不一致预警
    trigger:
      type: event
      events:
        - {event: 劳动合同已签订, aggregate: AGG-67}
        - {event: 〔缺〕法人归属已变更, aggregate: AGG-117}
        - {event: 法人归属已结束, aggregate: AGG-117}   # 2026-10-21 补：终止归属后三口径可能出现缺口，同样复核
        - {event: 薪酬档案已变更, aggregate: AGG-93}
    triggers:
      - {type: event, name: "劳动合同已签订（B-13）"}
      - {type: event, name: "〔缺〕法人归属已变更（B-13）"}
      - {type: event, name: "法人归属已结束（B-13）"}
      - {type: event, name: "薪酬档案已变更（同 BC）"}
    stages: [VS-07.3]
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: B-15
    basis: S-20（one-architecture）；用户 Q-09（intent 2026-10-16-134134）
    migration: "迁入不触发（ADR-0036 M7）；迁入完成后由人力用对账清单一次性核对三口径，不批量发预警"
    outcomes: [三口径一致, 已预警]
    scenarios: [PRC-145-S01, PRC-145-S02]   # S01 三口径一致不预警；S02 入职后劳动合同用人单位与扣缴义务人不一致，预警人力
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收三口径不一致预警并核对更正", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、薪酬岗"}}       # 人力
    step:
      actor: system
      where: automatic
      desc: 比对劳动合同用人单位（AGG-67）、数据范围法人（AGG-117）、个税扣缴义务人（AGG-93），按同一业务日期取当时有效版本；不一致只预警人力，不拒绝；同一人员同一差异已有未处理预警时不重复发
      notify: [{to: SH-E6, how: 企业微信待办}]
      decision:
        - {when: 三口径中任意两个不一致, goto: end, outcome: 已预警}
        - {when: otherwise, goto: end, outcome: 三口径一致}
      cross_bc:
        - {mode: event, direction: in, bc: B-13, name: 劳动合同已签订}
        - {mode: event, direction: in, bc: B-13, name: 〔缺〕法人归属已变更}
        - {mode: api, direction: out, bc: B-13, name: 读取劳动合同用人单位与数据范围法人}
    notes: "B-15 → B-13（api、事件）已有边；扣缴义务人在本 BC。无业务对象，primary_object: none。理由：只预警三口径不一致，不改任何对象状态。"

  - id: PRC-160
    name: 开立年度假期额度账户
    type: event_policy
    trigger:
      type: time
      desc: 每年年初（按日历年度）；年中入职由入职生效触发
    triggers:
      - {type: time, name: "每年年初（B-27 向 platform.scheduling 登记，幂等键 = 聚合 ID + 到期时点）"}
      - {type: event, name: "入职生效（年中入职）", event: Employed, bc: B-13}
    stages: [VS-07.3]
    stages_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I08 题（页首架构处理告知）：VS-07.3 仅对应入职生效 Employed 入口；年初定时开户为年度例行支撑，不表示完成入职。补休按额度行有效期处理，不随年度开户结转。"
    primary_object: OBJ-122
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I08 题；信息图现单列 OBJ-122，保留处理、审批及核对依据。"
    owner_bc: B-27
    migration: "迁入不触发（ADR-0036 M7）；迁入年度的在途额度账户随 AGG-71 迁入，不重新开账"
    outcomes: [年度账户已开立, 结转待处理]
    scenarios: [PRC-160-S01, PRC-160-S02, PRC-160-S03]   # S01 年初先结转上年账户再开立新年账户；S02 年中入职无上年账户，直接开立；S03 上年账户仍有占用中的占用行，结转待处理并告警
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收结转或开账失败告警并跟进处理", approval_right: "无", department_hint: "人力资源部", position_hint: "人力资源专员、考勤管理员"}}       # 人力（考勤）：结转或开账失败告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "查看本人当年度假期额度", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：当年额度可查看
    steps:
      - actor: system
        where: automatic
        command: 年度结转额度账户
        aggregate: AGG-71
        desc: 按 AGG-118 当日生效规则版本的结转与清零规则计算上年账户的结转额度并置账户为已结转，结转额度记在上年账户上供下一步读取；规则版本取不到失败并告警，不静默（CLAUDE.md 第 6 条）；年中入职触发时无上年账户，跳过本步
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: 无上年度账户（年中入职触发）, goto: 2}
          - {when: 上年账户仍有占用中的占用行, goto: end, outcome: 结转待处理}
          - {when: otherwise, goto: 2}
      - actor: system
        where: automatic
        command: 开立年度额度账户
        aggregate: AGG-71
        desc: 对每名在职人员 × 占额度的假期类型开立该年度账户，应享按 AGG-118 当日生效规则版本计算（含上年结转；年中入职按规则折算）；补休不在此开账：补休额度行由加班批准时计入（PRC-117），按补休有效期独立到期，不随日历年度开立、结转或清零；取不到生效版本失败并告警，不回退默认值；已开账无操作
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（本年度额度已开立）}]
        outcome: 年度账户已开立
    notes: "补休额度独立于年度，不在本策略处理（结转与开账只对年度账户，补休额度行的到期未休与离职转计发加班工资见 PRC-178）。B-27 → B-13 订阅 Employed 的事件边需补登（vs13att.notes.md 接缝问题 2）。定时由 B-27 向 platform.scheduling 登记，到点调本 BC 命令，边 B-27 → platform.scheduling 按平台依赖登记（CONVENTIONS §5）。无人工审批。无业务对象，primary_object: none。理由：额度账户（AGG-71）在信息图无对应对象（OBJ-69 假期额度已降为派生余额），结局不改任何阶段对象状态。"

  - id: PRC-161
    name: 关闭预算账户
    type: event_policy
    trigger:
      type: time
      desc: 预算期届满（年末）
    triggers:
      - {type: time, name: "预算期届满（B-18 向 platform.scheduling 登记，幂等键 = 聚合 ID + 到期时点）"}
    stages: []
    primary_object: OBJ-100
    primary_object_note: "预算账户是 OBJ-100 的类型「预算」"
    support: "B-18 预算期届满的定时例行处理：只有定时触发（无对象状态），结局（预算账户已关闭）不造 VS-09.3 的退出条件（OBJ-100 新版本）（STAGE_ALIGN.md 归段判据第 6 项）"
    owner_bc: B-18
    migration: "迁入不触发（ADR-0036 M7）；迁入时已届满的预算账户按迁入对账核对状态，不回放关闭"
    outcomes: [预算账户已关闭, 关闭待处理]
    scenarios: [PRC-161-S01, PRC-161-S02]   # S01 预算期届满，账户无占用中的占用行，关闭；S02 仍有占用中的占用行，关闭待处理并告警财务
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收关闭待处理告警，先释放或消耗占用中的占用行后重新触发", approval_right: "无", department_hint: "财务部", position_hint: "预算会计、财务负责人"}}       # 财务：占用未清告警
    steps:
      - actor: system
        where: automatic
        command: 关闭预算账户
        aggregate: AGG-80
        desc: 预算期届满或已被同计划新基线取代的账户关闭，之后不再接受占用与调剂；仍有占用中的占用行的账户不关闭，告警财务先释放或消耗，不静默（CLAUDE.md 第 6 条）；已关闭无操作
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        decision:
          - {when: 账户仍有占用中的占用行, goto: end, outcome: 关闭待处理}
          - {when: otherwise, goto: end, outcome: 预算账户已关闭}
    notes: 定时由 B-18 向 platform.scheduling 登记，到点调本 BC 命令，边 B-18 → platform.scheduling 按平台依赖登记（CONVENTIONS §5）。账户关闭后占用方单据（B-11、B-12）再调用预算占用会被拒绝并提示，由占用方单据所属流程处理。无人工审批：关闭由日期与占用状态守卫。

  - id: PRC-177
    name: 向差旅服务商同步员工与组织
    type: merged                      # 原 event_policy；CON-1017-ARC-10 R-3 并入集成流程 PRC-197
    merged_into: PRC-197
    status: merged
    trigger:
      type: event
      events:
        - {event: Employed, aggregate: AGG-62}
        - {event: Separated, aggregate: AGG-62}
        - {event: 任职已变更, aggregate: AGG-63}
        - {event: 组织单元已调整, aggregate: AGG-61}
    triggers:
      - {type: event, name: "入职生效", event: Employed, bc: B-13}
      - {type: event, name: "离职已生效", event: Separated, bc: B-13}
      - {type: event, name: "任职已变更（调岗）", event: 任职已变更, bc: B-13}
      - {type: event, name: "组织单元已调整", event: 组织单元已调整, bc: B-13}
    stages: []
    primary_object: none
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
    owner_bc: B-13
    basis: S-31 SQ-31（one-architecture）：platform.integration 在 L0，不能订阅 B-13（S-22 不采用平台订阅业务事件），故由 B-13 订阅本 BC 事件并经既有边 B-13 → platform.integration 推送
    migration: "迁入不触发（ADR-0036 M7）；上线时由集成册登记的一次性全量初始同步另办，不属本策略"
    outcomes: [已同步, 同步失败已告警]
    scenarios: [PRC-177-S01, PRC-177-S02, PRC-177-S03]   # S01 入职后推送新员工；S02 组织单元调整后推送组织树；S03 差旅服务商返回失败，告警不静默
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收同步失败告警并跟进重试", approval_right: "无", department_hint: "信息部门、人力资源部", position_hint: "信息管理员、人事专员"}}       # 信息（IT）与人力：同步失败告警
    steps:
      - actor: system
        where: external:差旅服务商
        evidence: [推送批次编号, 差旅服务商回执（受理结果与失败明细）]
        bc: platform.integration
        command: 推送员工与组织
        desc: 单向推送：入职、调岗、组织调整推送最新员工与组织单元，离职推送停用；只推送差旅预订必需的字段（姓名、工号、所属组织单元、状态），不含薪酬、证件等敏感个人信息（个人信息保护法最小必要）；按事件 ID 幂等，重复事件不重复推送；差旅服务商返回失败或回执缺失告警信息部门与人力，保留批次待重试，不静默（CLAUDE.md 第 6 条）
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]
        cross_bc:
          - {mode: api, direction: out, bc: platform.integration, name: 推送员工与组织}
        decision:
          - {when: 差旅服务商返回失败或回执缺失, goto: end, outcome: 同步失败已告警}
          - {when: otherwise, goto: end, outcome: 已同步}
    notes: 方向 B-13 → platform.integration 为既有边，不新增边；订阅的是本 BC 事件。外部系统名按 S-31 写「差旅服务商」，集成册登记（SESSION_PLAYBOOK §14.3）。差旅订单、账单、审批进 B-12（S-31 SQ-27、28），与本策略无关。无人工审批。

  - id: PRC-178
    name: 转计发加班工资
    type: event_policy
    trigger:
      type: event
      events:
        - {event: 〔缺〕补休已到期未休, aggregate: AGG-71}
        - {event: Separated, aggregate: AGG-62}
    triggers:
      - {type: event, name: "〔缺〕补休已到期未休（B-27 发布）", event: 补休已到期未休, bc: B-27}
      - {type: event, entry: 2, name: "员工离职生效（B-13 发布 Separated）", event: Separated, bc: B-13}
    stages: [VS-13.6]
    stages_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I09 题：VS-13.6 仅对应 Separated 离职入口；到期入口仅支撑薪酬结算，不表示离职结清；两入口向 OBJ-123 登记待计发调整并留幂等依据，U15 未定。"
    primary_object: OBJ-123
    primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I09 题；信息图现单列 OBJ-123，保留处理、审批及核对依据。"
    owner_bc: B-15
    basis: S-41（one-architecture）；用户页 P13-05；劳动法第四十四条（休息日加班不能安排补休的，支付不低于工资 200% 的报酬）、工资支付暂行规定第十三条（以加班工资基数折算）
    migration: "迁入不触发（ADR-0036 M7）；迁入的补偿方式为调休的加班，其未休余额是否迁为补休额度行待取证后定，迁入后到期的补休余额按本策略转计发"
    scope: "员工本人只看自己的补休转计发结果；薪酬岗与人力可见；金额属敏感个人信息，不进事件载荷"
    outcomes: [已计入加班工资, 离职余额已计入加班工资, 无需计发, 登记待处理]
    scenarios: [PRC-178-S01, PRC-178-S02, PRC-178-S03, PRC-178-S04, PRC-178-S05]   # S01 补休到期未休，读取余额按加班工资基数 200% 计入加班工资；S02 到期入口取不到加班工资基数或读不到余额，登记待处理并告警；S03 员工离职生效，未休补休余额一并计入加班工资；S04 离职入口取不到加班工资基数或读不到余额，登记待处理并告警；S05 离职时无未休补休余额，无需计发
    roles:
      - {id: SH-E6, as: informed, org_needs: {responsibility: "接收补休转计发登记待处理的告警并补齐加班工资基数后重新触发", approval_right: "无", department_hint: "人力资源部", position_hint: "薪酬岗"}}       # 人力（薪酬岗）：登记待处理告警
      - {id: SH-E3, as: informed, org_needs: {responsibility: "知悉本人到期未休的补休余额已转计发加班工资", approval_right: "无", department_hint: "员工所在部门", position_hint: "全体在职员工"}}       # 员工：到期未休余额转计发通知
    steps:
      - actor: system
        where: automatic
        command: 〔缺〕登记补休转加班工资
        aggregate: AGG-93
        pending: U15
        desc: B-27 在补休额度有效期（时长待用户定 U15）届满、仍有未休余额时发出补休已到期未休；B-15 经既有边 B-15 → B-27 读取该额度行的未休余额，按加班工资基数折算的时薪 × 200% 计入加班工资（劳动法第四十四条、工资支付暂行规定第十三条；会计上为累积带薪缺勤负债，企业会计准则第 9 号），登记以额度行 ID 幂等，当月薪酬在 PRC-124 读取，不在本策略算钱；加班工资基数取不到或余额读不到时失败并告警薪酬岗，不静默按零
        audit: true
        notify: [{to: SH-E3, how: 企业微信通知（余额已转计发加班工资）}, {to: SH-E6, how: 企业微信待办}]      # 薪酬岗仅登记待处理时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-27, name: 〔缺〕补休已到期未休}
          - {mode: api, direction: out, bc: B-27, name: 读取补休额度行余额}
        decision:
          - {when: 加班工资基数取不到或补休额度行余额读取失败, goto: end, outcome: 登记待处理}
          - {when: otherwise, goto: end, outcome: 已计入加班工资}
      - actor: system
        where: automatic
        entry: 员工离职生效，仍有未休补休余额
        branch: 离职
        command: 〔缺〕登记补休转加班工资
        aggregate: AGG-93
        pending: U15
        desc: 离职生效后（Separated）B-15 读取该员工全部未休补休余额（离职生效后劳动关系已终止，不再有补休可安排，余额只能折算计发；劳动法第四十四条、《工资支付暂行规定》第十三条），按加班工资基数折算的时薪 × 200% 计入加班工资，随最后一期薪酬由 PRC-124 计发；按额度行 ID 幂等，已登记的额度行不重复；加班工资基数取不到或余额读不到时失败并告警薪酬岗，不静默按零；无未休余额则无需计发
        audit: true
        notify: [{to: SH-E6, how: 企业微信待办}]      # 薪酬岗仅登记待处理时才发
        cross_bc:
          - {mode: event, direction: in, bc: B-13, name: Separated}
          - {mode: api, direction: out, bc: B-27, name: 读取补休额度行余额}
        decision:
          - {when: 员工无未休补休余额, goto: end, outcome: 无需计发}
          - {when: 加班工资基数取不到或补休额度行余额读取失败, goto: end, outcome: 登记待处理}
          - {when: otherwise, goto: end, outcome: 离职余额已计入加班工资}
    notes: "入口 1 的事件由 B-27 在补休额度有效期届满发出，入口 2 订阅 B-13 的 Separated（与 PRC-130 同事件）；边 B-15 → B-27（api）与 B-15 → B-13（事件）均已有，不新增。B-27 侧保留命令补休到期转计薪（到期未休，发补休已到期未休），金额与登记全在 B-15；B-27 因占用中请假暂不能转计薪时的告警属 B-27 命令前置条件（vs13att.commands.yaml）。S-42：B-27 不订阅 Separated 做补休结算（原命令离职结算补休余额已删），离职时由 B-15 入口 2 直接读取余额。无业务对象，primary_object: none。理由：结局只在人员薪酬档案（AGG-93，OBJ-61 已降为属性）登记待计发加班工资，信息图无对应对象，不改任何阶段对象状态。"

single_aggregate:

  - id: PRC-79
    name: 登记继续教育并延续注册执业证书
    type: single_aggregate
    aggregate: AGG-66
    owner_bc: B-13
    stages: [VS-06.2]
    primary_object: OBJ-64
    desc: 注册期内累计学时与到期临近（定时）
    migration: "注册执业证书与继续教育学时全量迁入（来源待取证，A8 模板清单无对应模板，若老系统亦无记录则为空集）；迁入不发「执业证书已到期」"
    scope: "注册执业人员看本人；人力看全部；INV-47 在交付物处只读证书有效性"
    triggers:
      - {type: human, name: "注册执业人员登记继续教育学时"}
      - {type: human, name: "人力延续注册执业证书"}
      - {type: time, name: "证书有效期届满"}
      - {type: human, name: "人力登记注册执业证书"}
      - {type: human, name: "人力注销注册执业证书"}
    outcomes: [学时已登记, 证书已延续, 执业证书已到期, 证书已登记, 证书已注销]
    scenarios: [PRC-79-S01, PRC-79-S02, PRC-79-S03, PRC-79-S04, PRC-79-S05, PRC-79-S06]
    states: [有效, 已到期, 已注销]
    transitions:
      - {command: 登记注册执业证书, from: null, to: 有效}
