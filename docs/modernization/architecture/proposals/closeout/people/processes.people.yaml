    scope: "人力薪酬岗编制、财务确认；薪酬计算只读生效版本；规则版本为内部配置，不含个人信息；已生效版本不可改"
    outcomes: [薪酬规则版本已发布, 版本被拒]
    scenarios: [PRC-180-S01, PRC-180-S02]
    roles:
      - {id: SH-E6, as: performer, org_needs: {responsibility: "依据法规与公司制度编制并发布薪酬规则版本，对依据完整性负责；编制人与确认人不得为同一人（U7③ 推荐）", approval_right: "无（区间唯一由不变量守卫；编制与确认分人见 U7③）", department_hint: "人力资源部与财务部", position_hint: "薪酬岗（编制）、财务确认人（职能：薪酬规则确认）"}}      # 人力出、财务确认
    steps:
      - actor: SH-E6
        where: in_system
        command: 发布薪酬规则版本
        aggregate: AGG-119
        emits: [薪酬规则已生效]
        pending: U7
        desc: 同一规则类别同一适用范围同一时点只有一个生效版本（INV-139）；草稿由编制页保存，确认后发布即生效，后继版本发布时同事务结束旧区间；生效后不得修改，更正另发布新版本，不追溯已批准的月度薪酬（D15）；编制人与确认人是否分设见 notes 待用户定 U7③（推荐分设）；AGG-73 计算时按薪酬期间读取生效版本，取不到则失败并告警（CLAUDE.md 第 6 条），不订阅事件
        permission: 薪酬规则.发布
        page: 薪酬规则版本页
        audit: true
        decision:
          - {when: 同一规则类别同一适用范围的生效区间与既有版本重叠, goto: end, rule: INV-139, outcome: 版本被拒}
          - {when: otherwise, goto: end, outcome: 薪酬规则版本已发布}
    notes: S-43 新增，补 AGG-119 无维护流程的缺口（PRC-124 第 1 步 reads 补 AGG-119、AGG-120）。写法同 PRC-162。无人工审批流程：区间唯一由 INV-139 守卫，编制与确认分人是职责分离（U7③ 推荐），不走 platform.approval。

read_models:

  - id: PRC-182
    name: 查看知识条目使用情况
    type: read_model
    stages: [VS-11.3]
    stages_note: "读模型只读 OBJ-110 已发布版本及其引用，不造任何状态；服务本段（修订废止）的复审决策，为旁路读，按其读取的「发布」状态（VS-11.3 进入条件）留在 VS-11.3（归段判据第 6 项）"
    owner_bc: reporting
    reads: [AGG-107, AGG-12, AGG-03, AGG-27]
    migration: "读模型不迁入，随迁入后的知识条目与引用事件重建；老系统没有知识条目实体与引用关系（信息图 OBJ-110 取证，迁入集合为空），投产后起累计"
    scope: "技术委员会与各专业负责人见本专业类别全部条目；管理层见全部；起草人见本人起草的条目；引用方只显示单据类型与编号，不显示客户信息（案例类含客户信息的访问范围待用户定 6）"
    frequency_ref: 不适用（读模型，随领域事件刷新；访问量待取证）
    scenarios: [PRC-182-S01, PRC-182-S02, PRC-182-S03, PRC-182-S04]
    roles:
      - {id: SH-E4, as: performer, org_needs: {responsibility: 依据使用情况决定知识条目的修订或废止, approval_right: 无（只读；修订与废止在 PRC-107）, department_hint: 技术委员会及各专业组织单元, position_hint: 专业负责人、技术专家}}
      - {id: SH-M1, as: informed, org_needs: {responsibility: 获知知识条目的使用与复审情况, approval_right: 无, department_hint: 管理层, position_hint: 管理层负责人}}
    events:
      - {event: 知识条目已发布, aggregate: AGG-107, bc: B-30}
      - {event: 知识条目已修订, aggregate: AGG-107, bc: B-30}
      - {event: 知识条目已废止, aggregate: AGG-107, bc: B-30}
      - {event: 报价版本已生效, aggregate: AGG-12, bc: B-03}
      - {event: 服务产品版本已发布, aggregate: AGG-03, bc: B-02}
      - {event: 交付物已签发, aggregate: AGG-27, bc: B-28}
    desc: 服务 VS-11.3「修订废止」的决策：哪些已发布条目被引用多、有效期将满，应优先复审修订；哪些长期无人引用、有效期已满，应废止。引用方（报价版本、服务产品版本、交付物）按 ID 与版本引用知识条目版本（INV-115，不订阅），reporting 订阅引用方的领域事件，事件负载带所引用的知识条目版本 ID（见 NOTES 接缝问题 9）；本读模型不读业务交易表，不改任何对象状态
    query: "读 reporting 层的知识条目版本与引用事件，按知识条目版本 × 引用方类型 × 统计窗口汇总被引用次数（引用方单据去重）和最近一次被引用日，并派生距有效期届满天数与建议动作（建议复审修订、建议废止）；建议只是提示，不改状态，修订与废止由 PRC-107 的人工命令完成"
    dimensions:
      - 知识条目（含版本）
      - 知识类别
      - 适用范围
      - 引用方类型（报价版本、服务产品版本、交付物）
      - 归属组织单元
      - 统计窗口
    metrics:
      - 被引用次数
      - 最近一次被引用日
      - 距有效期届满天数
      - 建议动作
    suggestions:
      - code: 建议复审修订
        rule: 已发布版本距有效期届满不足提前量，且统计窗口内仍有引用
      - code: 建议废止
        rule: 已发布版本有效期已届满或统计窗口内无引用，且无后继版本
    refresh: 订阅领域事件增量更新（reporting L1，ADR-0023），每日定时全量校正一次
    freshness: 事件到达后分钟级；以每日校正为准
    permission: 知识条目使用情况.查看
    page: 知识条目使用情况页
    notes: 只读、无命令。提前量与「无引用」的统计窗口为规则参数，待用户定 12（推荐窗口 12 个月、提前量 30 天）。已废止条目的既有引用仍计入，新引用被 INV-115 拒绝，故废止后不再新增引用。引用关系的口径依赖引用方事件负载，见 NOTES 接缝问题 9。
