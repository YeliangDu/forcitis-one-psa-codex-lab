# 人员组合并产物（由 parts/rebuild.py 从分片生成，不手改；改分片后重跑）
by_part:
  vs07:
    bc: B-13
    published:
    - name: 组织单元已调整
      published_by: AGG-61
      by_command: 调整组织单元
      payload:
      - 组织单元ID
      - 调整类型码
      - 上级组织单元ID
      - 负责人ID
      - 状态码
      - 业务生效日
      subscribers:
      - type: 事件策略
        who: platform.identity 标记数据范围待复核并通知区域负责人
        used_by: PRC-80 第 6 步（P-31）
      - type: 事件策略
        who: B-13 向差旅服务商同步员工与组织
        used_by: PRC-177 触发器（同 BC）
      - &id001
        type: 仅分析
      note: 已在聚合稿登记订阅方 platform.identity；P-31 现只由本事件触发，需扩任职已变更（接缝问题 5）
    - name: 法人归属已变更
      name_status: 〔缺〕沿用分片提议名
      published_by: AGG-117
      by_command: 指定法人归属
      payload:
      - 归属对象类型码
      - 归属对象ID
      - 法人主体ID
      - 期间起
      - 期间止
      subscribers:
      - type: 事件策略
        who: platform.identity 数据范围法人口径
        used_by: PRC-80 第 4 步 cross_bc
      - type: 事件策略
        who: B-15 三口径预警（PRC-145）
        used_by: PRC-80 第 4 步 cross_bc
      note: 词表已有 法人归属已确立 / 已结束 / 结束日已更正（LegalEntityAttributed 等，已建代码事件）；聚合稿与分片用「法人归属已变更」，是否改用词表名交 one-glossary（vs07conv.notes.md 新用语）
    - name: 法人归属已结束
      published_by: AGG-117
      by_command: 结束法人归属
      payload:
      - 归属对象类型码
      - 归属对象ID
      - 法人主体ID
      - 期间起
      - 期间止
      subscribers:
      - type: 事件策略
        who: platform.identity 数据范围法人口径
        used_by: PRC-80 第 13 步
      - type: 事件策略
        who: B-15 三口径预警（PRC-145）
        used_by: PRC-80 第 13 步
      note: 词表已有（LegalEntityAttributionEnded，已建代码事件）；订阅方沿「法人归属已变更」，待 one-architecture 核
    - name: 岗位已停用
      published_by: AGG-64
      by_command: 停用岗位
      payload:
      - 职位ID
      - 停用日
      subscribers:
      - *id001
      note: Q-08 后改称职位目录条目已停用，交 one-glossary
    - name: 招聘需求已批准
      published_by: AGG-65
      by_command: 批准招聘需求
      payload:
      - 招聘需求ID
      - 职位ID
      - 组织单元ID
      - 需求人数
      - 批准时间
      subscribers:
      - *id001
      note: 人力收待办是 notify，不是事件订阅
    - name: 招聘需求已关闭
      published_by: AGG-65
      by_command: 关闭招聘需求
      payload:
      - 招聘需求ID
      - 关闭原因码
      - 关闭时间
      subscribers:
      - *id001
    - name: 人员已登记
      published_by: AGG-62
      by_command: 登记候选人
      payload:
      - 人员ID
      - 登记时间
      subscribers:
      - *id001
      note: 草案事件（聚合稿）
    - name: 录用决定已作出
      published_by: AGG-62
      by_command: 登记候选人答复
      payload:
      - 人员ID
      - 招聘需求ID
      - 拟任职位ID
      - 拟入职日
      - 确认日
      subscribers:
      - type: 流程
        ref: PRC-83
        used_by: PRC-83 触发器（同 BC，候选人确认入职日后办理入职）
      note: 聚合稿挂在作出录用决定；本稿改挂登记候选人答复，使触发语与 PRC-83 一致（vs07.notes.md 结构问题 4，请 one-architecture 二选一：改挂，或把事件改名为「录用决定已确认」）
    - name: 入职已登记
      name_status: 〔缺〕沿用样板
      published_by: AGG-62
      by_command: 登记入职
      payload:
      - 人员ID
      - 入职日
      - 用工类型码
      - 工号
      subscribers:
      - type: 流程
        ref: PRC-137
        who: platform.identity
        used_by: PRC-137 第 1 步
      note: 提前登记时发在登记时，账号可提前准备（S3、S4）
    - name: Employed
      published_by: AGG-62
      by_command: 入职生效
      payload:
      - 人员ID
      - 入职日
      - 用工类型码
      - 是否含试用期
      subscribers:
      - type: 流程
        ref: PRC-84
        who: B-15
        used_by: PRC-84 第 1 步触发器
      - type: 事件策略
        who: B-13 向差旅服务商同步员工与组织
        used_by: PRC-177 触发器（同 BC）
      - type: 流程
        ref: PRC-137
        who: platform.identity
        used_by: PRC-137 第 3 步（放行登录）
      note: 事件在入职日（业务生效日）发出；迁入不发（ADR-0036 M7）
    - name: 转正已办理
      name_status: 〔缺〕沿用分片提议名
      published_by: AGG-62
      by_command: 办理转正
      payload:
      - 人员ID
      - 转正日
      subscribers:
      - type: 事件策略
        who: B-15 复核转正后薪酬
        used_by: PRC-123 触发器（入口 1；vs13pay 事件策略「转正后复核薪酬」，S-42）
      note: 转正日晚于办理日（提前登记）时事件应在转正日发出，无「转正生效」命令（结构问题 4）
    - name: Separated
      published_by: AGG-62
      by_command: 离职生效
      payload:
      - 人员ID
      - 离职日
      - 用工类型码
      subscribers:
      - type: 事件策略
        who: platform.identity 吊销会话
        used_by: PRC-129
      - type: 流程
        ref: PRC-138
        who: platform.identity
        used_by: PRC-138 触发器
      - type: 流程
        ref: PRC-130
        who: B-15
        used_by: PRC-130 触发器（终止薪酬档案、参保减员）
      - type: 流程
        ref: PRC-178
        who: B-15
        used_by: PRC-178 入口 2（读取未休补休余额，计入加班工资，随最后一期薪酬计发；S-41）
      - type: 事件策略
        who: B-13 向差旅服务商同步员工与组织
        used_by: PRC-177 触发器（同 BC）
      - type: 事件策略
        who: B-31 离职生成归还待办
        used_by: PRC-143C 触发器（b31.events 已列）
      - type: 事件策略
        who: B-27 离职当月考勤默认确认
        used_by: PRC-118 第 7 步（事件入口；vs13att 事件策略「离职当月考勤默认确认」）
      - type: 事件策略
        who: B-13 离职生效后终止任职与劳动合同
        used_by: PRC-128 第 8、9 步（同 BC）
      note: 离职日结束才发（V-1），不在登记时提前发（PG-12）；订阅方清单与 b31.events.yaml、vs13att.events.yaml 一致，聚合稿 AGG-62 订阅方列需补 B-31、B-27（B-27 只补「离职当月考勤默认确认」；S-42 已删「离职结算补休余额」订阅，补休余额由 B-15 的 PRC-178 入口 2 承接）
    - name: 离职登记已撤销
      name_status: 〔缺〕沿用分片提议名
      published_by: AGG-62
      by_command: 撤销离职登记
      payload:
      - 人员ID
      - 原离职日
      - 撤销时间
      subscribers:
      - type: 仅分析
      note: S-42：B-27 与 B-31 均不订阅本事件。B-27 只在 Separated 后处置（用户 2026-10-16，已从 PRC-128 第 10 步删去该 cross_bc）；B-31 的归还待办只在 Separated 后生成，撤销发生在离职生效前，无可取消的待办，故删去订阅方 B-31（PRC-128 第 10 步同删 cross_bc）。仅当 V-15 选 b（B-13
        对外发「离职已登记」让 B-31 提前生成待办）才需恢复订阅，届时随 V-15 另议
    - name: 任职已变更
      published_by: AGG-63
      by_command: 建立任职 / 终止任职 / 任职变更生效
      payload:
      - 任职ID
      - 人员ID
      - 变更类型码（建立 / 变更 / 终止）
      - 组织单元ID
      - 职位ID
      - 职级ID
      - 业务生效日
      subscribers:
      - type: 事件策略
        who: platform.identity 重算默认角色与数据范围
        used_by: PRC-136 第 9 步；PRC-83 第 3 步
      - type: 事件策略
        who: platform.identity 标记数据范围待复核并通知区域负责人
        used_by: PRC-136 第 10 步（P-31 需扩触发）
      - type: 流程
        ref: PRC-136
        who: B-15
        used_by: PRC-136 第 11 步（调整薪酬档案）
      - type: 事件策略
        who: B-13 向差旅服务商同步员工与组织
        used_by: PRC-177 触发器（同 BC）
      note: 须在业务生效日发出（U-12）：任职变更生效发出，写入未来版本的变更任职不发；离职终止任职先于 Separated 之后发出，platform.identity 对已离职人员忽略（PG-12）。聚合稿「仅分析」，订阅方列需补 platform.identity、B-15；B-27 是否订阅待 B-27 组确认（不列）
    - name: 劳动合同已签订
      published_by: AGG-67
      by_command: 签订劳动合同
      payload:
      - 劳动合同ID
      - 人员ID
      - 用人单位法人ID
      - 合同类型码
      - 期限起止
      - 签署日
      subscribers:
      - type: 事件策略
        who: B-15 员工法人三口径比对预警（PRC-145）
        used_by: PRC-83 第 6 步、PRC-136 第 5 步 cross_bc
      note: 聚合稿「仅分析」，订阅方列需补 B-15（S-20）
    - name: 劳动合同已终止
      published_by: AGG-67
      by_command: 终止劳动合同
      payload:
      - 劳动合同ID
      - 人员ID
      - 终止日
      - 终止原因码
      subscribers:
      - *id001
    - name: 执业证书已到期
      published_by: AGG-66
      by_command: 标记执业证书已到期
      payload:
      - 证书ID
      - 人员ID
      - 到期日
      subscribers:
      - *id001
      note: 通知持证人与人力是 notify
    consumed: []
  vs13att:
    bc:
    - B-27
    - B-14
    published:
    - name: 请假已批准
      published_by: AGG-70
      by_command: 批准请假
      payload:
      - 请假ID
      - 员工ID
      - 假期类型码
      - 起止时刻
      - 时长（分钟）
      - 批准方式（规则自动 / 人审）
      - 审批实例ID（可空）
      - 批准时间
      subscribers:
      - type: 事件策略
        who: AGG-71 批准转已用
        via: 请假批准后转已用
        used_by: PRC-116 第 5 步
      - type: 仅分析
      note: 聚合稿写「仅分析」，本流程同 BC 订阅，订阅方列须改；B-06 工时单最低时数经 api 读取已批准与待批请假（INV-65），不订阅
    - name: 请假已撤销
      published_by: AGG-70
      by_command: 撤销请假
      payload:
      - 请假ID
      - 员工ID
      - 撤销前状态（审批中 / 已批准）
      - 撤销时间
      subscribers:
      - type: 仅分析
      note: 额度释放与回冲由 PRC-116 同一步骤的 inner 命令完成，不靠订阅此事件
    - name: 请假已销假
      published_by: AGG-70
      by_command: 销假
      payload:
      - 请假ID
      - 员工ID
      - 实际结束时刻
      - 回冲时长（分钟）
      subscribers:
      - type: 仅分析
    - name: 加班已批准
      published_by: AGG-72
      by_command: 批准加班
      payload:
      - 加班ID
      - 员工ID
      - 加班日期
      - 批准时长（分钟）
      - 加班类型码
      - 补偿方式码
      subscribers:
      - type: 仅分析
      note: 聚合稿写「同 BC：AGG-97 汇入当月」，PRC-118 实为生成时读取（api），不订阅；补偿方式为补休的由 PRC-117 第 2 步判断后接第 4 步计入补休额度（同流程接续，不靠订阅）
    - name: 加班已补偿
      published_by: AGG-72
      by_command: 标记加班已补偿
      payload:
      - 加班ID
      - 员工ID
      - 补偿方式码
      - 月度考勤确认ID
      subscribers:
      - type: 仅分析
      note: 加班费计入薪酬由 B-15 经 api 读取月度考勤，不订阅此事件；只发于补偿方式为付薪的加班，补休的不发（改标已计入补休额度，补偿追踪在 AGG-71 额度行）
    - name: 月度考勤已确认
      published_by: AGG-97
      by_command: 员工确认 / 默认确认月度考勤
      payload:
      - 月度考勤确认ID
      - 员工ID
      - 月份
      - 确认方式（员工 / 默认）
      - 默认确认原因（逾期未确认 / 已离职，可空）
      - 确认时间
      subscribers:
      - type: 事件策略
        who: AGG-72 标记加班已补偿
        via: 月度考勤确认后标记加班补偿
        used_by: PRC-118 第 3 步
      note: 两条命令发同一事件，订阅方凭确认方式区分
    - name: 月度考勤已锁定
      published_by: AGG-97
      by_command: 锁定
      payload:
      - 月度考勤确认ID
      - 员工ID
      - 月份
      - 默认确认原因（可空）
      - 锁定时间
      subscribers:
      - type: 流程
        who: B-15
        used_by: PRC-124 触发器
      note: 按人员 × 月发出；法人当月在职人员全部锁定才能算薪，汇聚由 B-27 只读查询承载（vs13.notes.md 结构问题 6）
    - name: 标准工时版本已生效
      published_by: AGG-108
      by_command: 发布标准工时版本
      payload:
      - 标准工时版本ID
      - 法人ID（可空）
      - 生效区间
      - 确认人ID
      subscribers:
      - type: 仅分析
      note: B-06 与 B-27 按 ID 与日期经 api 读取，不订阅（聚合稿原文；S-42 要求删去聚合稿订阅方列中的 B-27，B-06 同理建议删，见 vs13att.notes.md 接缝问题 11）
    - name: 假期规则已生效
      published_by: AGG-118
      by_command: 发布假期规则版本
      payload:
      - 假期规则版本ID
      - 假期类型码
      - 适用范围
      - 生效日
      subscribers:
      - type: 仅分析
      note: 聚合稿：AGG-71 年度开账按 ID 与日期读取，不订阅
    - name: 补休已到期未休
      name_status: 〔缺〕S-41 提议名，待 one-glossary 登记
      published_by: AGG-71
      by_command: 补休到期转计薪
      payload:
      - 员工ID
      - 补休额度行ID
      - 到期日
      subscribers:
      - type: 流程
        who: B-15
        used_by: PRC-178 触发器（入口 1）
      note: 补休额度有效期（时长待 U15）届满仍有未休余额时发；载荷不含余额，B-15 经 api 读取（边 B-15 → B-27 已有）；离职时不发此事件，B-15 直接订阅 Separated（PRC-178 入口 2），B-27 不再有离职结算补休的订阅（S-42）
    - name: 工作日历锁定日期已修改
      published_by: AGG-68
      by_command: 维护工作日历年度
      payload:
      - 日历年度
      - 法人ID（可空）
      - 变更日期集合
      subscribers:
      - type: 仅分析
      note: 订阅方以代码为准（聚合稿）；术语表另有「工作日历年度已维护」（WorkCalendarYearMaintained），两者关系见 vs13att.notes.md 结构问题 7
    consumed:
    - name: 审批已通过
      from: platform.approval
      handled_by:
      - 批准请假
      used_by:
      - PRC-116 第 4 步入口
    - name: 审批已驳回
      from: platform.approval
      handled_by:
      - 驳回请假
      used_by:
      - PRC-116 第 6 步
    - name: 审批已撤回
      from: platform.approval
      handled_by:
      - 撤销请假
      used_by:
      - PRC-116 第 3 步 withdraw 边
      note: 事件名由 platform.approval 事件目录定，本稿不自造
    - name: Separated
      from: B-13
      handled_by:
      - 事件策略「离职当月考勤默认确认」→ 默认确认月度考勤
      used_by:
      - PRC-118 第 7 步（事件入口）
      note: B-27 订阅 B-13 的边及 B-13 事件的订阅方清单需补登（vs07 接缝问题 1）。S-42：补休结算不在此订阅（离职补休余额由 B-15 的 PRC-178 入口 2 承接）
    - name: Employed
      from: B-13
      handled_by:
      - 事件策略「年度开账」→ 开立年度额度账户
      used_by:
      - 年中入职开账
      note: 提议订阅，边需补登
    not_subscribed:
    - name: 离职登记已撤销（〔缺〕，vs07 提议）
      from: B-13
      reason: B-27 的离职处置只在 Separated 之后发生（离职日前无待办可撤），撤销登记无需通知 B-27；vs07 PRC-128 撤销步骤向 B-27 的该边已删（S-42 另删 B-31 订阅）
    - name: 任职已变更
      from: B-13
      reason: 在途请假审批人是否随调岗重新解析待用户定（vs13att.notes.md 待用户定 1）；未定前不订阅
  vs13pay:
    bc: B-15
    also_bc:
      AGG-106: B-13
    published:
    - name: 绩效评估已确认
      published_by: AGG-106
      publishing_bc: B-13
      by_command: 确认绩效评估
      payload:
      - 绩效评估ID
      - 被评人ID
      - 评估类型码
      - 评估期间
      - 确认时间
      subscribers:
      - type: 流程
        ref: PRC-122
        filter: 评估类型为月度
