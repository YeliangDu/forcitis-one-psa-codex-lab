# 人员组合并产物（由 parts/rebuild.py 从分片生成，不手改；改分片后重跑）
machines:
- aggregate: AGG-60
  machine: legal_entity
  entity: legal_entities
  perpetual: true
  reason: 法人主体只增不删、可停用可启用，长期存在，无业务终结
  note: 根只留代码，名称与状态随版本表；聚合稿只列登记法人主体，更名 / 停用 / 启用三条〔缺〕命令取自词表事件（法人主体已更名 / 已停用 / 已启用），经对象增删改查检查补入（vs07.notes.md 结构问题 19）；词表区分已登记与已启用，本稿登记即有效；代码更正（仅未发号前，INV-59）按已建代码补「更正法人主体代码」，状态不变
  states:
  - 有效
  - 已停用
  initial: null
  transitions:
  - from: null
    to: 有效
    command: 登记法人主体
    guard:
    - INV-59
    kind: forward
  - from: 有效
    to: 有效
    command: 更名法人主体
    guard:
    - INV-59：代码不改
    kind: forward
    note: 追加名称版本
  - from: 有效
    to: 已停用
    command: 停用法人主体
    guard: []
    kind: forward
  - from: 已停用
    to: 有效
    command: 启用法人主体
    guard: []
    kind: reverse
  - from: 有效
    to: 有效
    command: 更正法人主体代码
    guard:
    - INV-59：仅代码未发号时
    kind: non_state
    note: 恢复
  source_part: vs07
- aggregate: AGG-61
  machine: org_unit
  entity: org_units
  note: 状态取数据模型「启用 / 停用 / 撤销」；调整组织单元一条命令按「调整类型」参数新建、变更、停用、恢复、撤销（聚合稿只有这一条命令）；已撤销与停用是两个不同状态（RULE-355）
  states:
  - 已启用
  - 已停用
  - name: 已撤销
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 已启用
    command: 调整组织单元
    guard: []
    kind: forward
    note: 新建
  - from: 已启用
    to: 已启用
    command: 调整组织单元
    guard: []
    kind: forward
    note: 变更名称、上级、负责人、单元类型
  - from: 已启用
    to: 已停用
    command: 调整组织单元
    guard: []
    kind: forward
  - from: 已停用
    to: 已启用
    command: 调整组织单元
    guard: []
    kind: reverse
    note: 恢复启用
  - from: 已启用
    to: 已撤销
    command: 调整组织单元
    guard:
    - INV-60：下有在职任职则拒绝
    kind: forward
  - from: 已停用
    to: 已撤销
    command: 调整组织单元
    guard:
    - INV-60
    kind: forward
  source_part: vs07
- aggregate: AGG-117
  machine: legal_entity_attribution
  entity: legal_entity_attributions
  perpetual: true
  reason: 归属对象的期间聚合，期间在版本表追加，历史只能关闭不能改写，随归属对象长期存续，无生命周期终态
  note: 根是归属对象（部门或员工）的期间聚合，期间在版本表追加，历史只能关闭不能改写；无生命周期终态
  states:
  - 已指定
  initial: null
  transitions:
  - from: null
    to: 已指定
    command: 指定法人归属
    guard:
    - INV-122
    kind: forward
  - from: 已指定
    to: 已指定
    command: 指定法人归属
    guard:
    - INV-122：新期间只能从最近一段开始日之后起算
    kind: forward
  - from: 已指定
    to: 已指定
    command: 更正法人归属
    guard:
    - INV-122：仅已关闭期间的结束日，只追加更正行
    kind: non_state
  - from: 已指定
    to: 已指定
    command: 结束法人归属
    guard:
    - INV-122：只关闭当前期间
    - 操作人不得终止本人归属
    kind: non_state
    note: 关闭当前期间，聚合随归属对象长期存续
  source_part: vs07
- aggregate: AGG-64
  machine: job_catalog_entry
  entity: jobs
  note: 新建 / 修改命令聚合稿缺（vs07.notes.md 结构问题 8），经对象增删改查检查补〔缺〕新建岗位、修改岗位（结构问题 19）；初始目录仍由初始化录入；职级、职位族暂随本聚合不拆（S-10）
  states:
  - 已启用
  - name: 已停用
    terminal: true
  initial: 已启用
  transitions:
  - from: null
    to: 已启用
    command: 新建岗位
    guard: []
    kind: forward
  - from: 已启用
    to: 已启用
    command: 修改岗位
    guard: []
    kind: forward
    note: 追加版本
  - from: 已启用
    to: 已停用
    command: 停用岗位
    guard:
    - INV-63
    kind: forward
  source_part: vs07
- aggregate: AGG-65
  machine: recruitment_requisition
  entity: recruitment_requisitions
  note: 草稿来自编辑页保存或迁入，保存草稿不是领域命令；聚合稿状态「已驳回」「招聘中」本稿不设：v1 以关闭代驳回，进入「招聘中」的命令聚合稿与分片均缺（PG-08），见 vs07conv.notes.md 结构问题 2
  states:
  - 草稿
  - 已提交
  - 已批准
  - name: 已关闭
    terminal: true
  initial: 草稿
  transitions:
  - from: 草稿
    to: 已提交
    command: 提交招聘需求
    guard:
    - R-01
    kind: forward
  - from: 已提交
    to: 已批准
    command: 批准招聘需求
    guard:
    - AR-11
    - AR-12
    - 提出人 ≠ 批准人
    kind: forward
    process_outcome: 已批准
  - from: 已提交
    to: 已关闭
    command: 关闭招聘需求
    guard:
    - 批准人驳回，或提出人撤回
    kind: reverse
    process_outcome: 已关闭
  - from: 已批准
    to: 已关闭
    command: 关闭招聘需求
    guard:
    - 取消或录满（PG-08：录满无触发）
    kind: forward
    process_outcome: 已关闭
  source_part: vs07
- aggregate: AGG-62
  machine: person
  entity: employees / employment_versions / interviews / hiring_decisions / separation_requests
  sub_machines:
  - 人员
  - 离职申请
  note: '同一聚合两个子生命周期合成一台（状态名带「人员:」「离职申请:」前缀，各子生命周期以 from: null 的创建转换为入口）。人员:试用期 / 正式 都是在职（词表「在职」Employed）；停薪留职（数据模型状态列）无命令，本稿不设。办理离职、离职生效、撤销离职登记同事务改两个子生命周期，各列两条转换'
  states:
  - 人员:候选人
  - 人员:待答复
  - 人员:录用已确认
  - 人员:待入职
  - 人员:试用期
  - 人员:正式
  - 人员:待离职
  - name: 人员:未录用
    terminal: true
  - name: 人员:候选人已放弃
    terminal: true
  - name: 人员:已离职
    terminal: true
  - 离职申请:已申请
  - 离职申请:已受理
  - 离职申请:已批准
  - 离职申请:已登记
  - name: 离职申请:已驳回
    terminal: true
  - name: 离职申请:已撤回
    terminal: true
  - name: 离职申请:已生效
    terminal: true
  - name: 离职申请:已撤销
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 人员:候选人
    command: 登记候选人
    guard:
    - T-5：个人信息保护
    kind: forward
  - from: 人员:候选人
    to: 人员:候选人
    command: 记录面试
    guard:
    - 面试轮次追加，不改状态
    kind: non_state
  - from: 人员:候选人
    to: 人员:待答复
    command: 作出录用决定
    guard:
    - R-02：拟任职位须启用
    - V-8：不另设审批
    kind: forward
  - from: 人员:待答复
    to: 人员:录用已确认
    command: 登记候选人答复
    guard:
    - 答复为接受并确认入职日
    - V-19：答复期限提醒
    kind: forward
  - from: 人员:待答复
    to: 人员:候选人已放弃
    command: 登记候选人答复
    guard:
    - 答复为放弃
    kind: reverse
    process_outcome: 候选人已放弃
  - from: 人员:候选人
    to: 人员:未录用
    command: 标记未录用
    guard:
    - 面试结论为不通过
    kind: forward
    process_outcome: 未录用
  - from: 人员:录用已确认
    to: 人员:待入职
    command: 登记入职
    guard:
    - U-12：入职日为人事业务生效日
    kind: forward
  - from: null
    to: 人员:待入职
    command: 登记入职
    guard:
    - 非招聘入职（调入、返聘）无候选阶段，直接登记〔推〕
    kind: forward
  - from: 人员:待入职
    to: 人员:试用期
    command: 入职生效
    guard:
    - U-12：入职日到达
    - 用工约定含试用期
    kind: forward
  - from: 人员:待入职
    to: 人员:正式
    command: 入职生效
    guard:
    - U-12：入职日到达
    - 用工约定无试用期（如实习、退休返聘）〔推〕
    kind: forward
  - from: 人员:试用期
    to: 人员:正式
    command: 办理转正
    guard:
    - P-46：转正前读评估，结论是输入不是拒绝条件
    kind: forward
    process_outcome: 已转正
  - from: 人员:试用期
    to: 人员:待离职
    command: 办理离职
    guard:
    - 离职申请为已受理或已批准
    - U-12
    kind: forward
  - from: 人员:正式
    to: 人员:待离职
    command: 办理离职
    guard:
    - 离职申请为已受理或已批准
    - U-12
    kind: forward
  - from: 人员:待离职
    to: 人员:已离职
    command: 离职生效
    guard:
    - U-12：离职日结束
    - G-2：发 Separated 即吊销会话
    kind: forward
    process_outcome: 离职已生效
  - from: 人员:待离职
    to: 人员:试用期
    command: 撤销离职登记
    guard:
    - 离职日前；回到登记前状态
    kind: reverse
  - from: 人员:待离职
    to: 人员:正式
    command: 撤销离职登记
    guard:
    - 离职日前；回到登记前状态
    kind: reverse
  - from: null
    to: 离职申请:已申请
    command: 申请离职
    guard:
    - 来源为公司终止：依据与原因类别必填
    - 人员为试用期或正式且无进行中申请
    kind: forward
  - from: null
    to: 离职申请:已受理
    command: 申请离职
    guard:
    - 来源为员工：自动受理（V-20）
    - R-03：期望离职日早于法定通知期只预警
    kind: forward
  - from: 离职申请:已申请
    to: 离职申请:已批准
    command: 批准公司终止
    guard:
    - AR-11
    - AR-12
    - 发起人 ≠ 批准人
    kind: forward
  - from: 离职申请:已申请
    to: 离职申请:已驳回
    command: 驳回公司终止
    guard: []
    kind: reverse
    process_outcome: 终止已驳回
  - from: 离职申请:已受理
    to: 离职申请:已撤回
    command: 撤回离职申请
    guard:
    - 登记离职日前
    - 仅申请人（人力代录入的由人力代撤回）
    kind: reverse
    process_outcome: 离职申请已撤回
  - from: 离职申请:已受理
    to: 离职申请:已登记
    command: 办理离职
    guard:
    - V-1：离职日语义
    kind: forward
  - from: 离职申请:已批准
    to: 离职申请:已登记
    command: 办理离职
    guard:
    - V-1：离职日语义
    kind: forward
  - from: 离职申请:已登记
    to: 离职申请:已生效
    command: 离职生效
    guard:
    - U-12
    kind: forward
  - from: 离职申请:已登记
    to: 离职申请:已撤销
    command: 撤销离职登记
    guard:
    - 离职日前；离职日后不可撤销
    kind: reverse
    process_outcome: 离职登记已撤销
  source_part: vs07
- aggregate: AGG-63
  machine: assignment
  entity: assignments / assignment_versions
  sub_machines:
  - 任职
  - 调岗申请
  note: '同一聚合两个子生命周期合成一台（前缀「任职:」「调岗申请:」，各以 from: null 为入口）。任职是版本化对象（D6），「任职:变更待生效」表示已写入未来版本、未到业务生效日；变更任职、任职变更生效同事务改两个子生命周期。数据模型无调岗申请表（vs07conv.notes.md 结构问题 5）'
  states:
  - 任职:生效中
  - 任职:变更待生效
  - name: 任职:已终止
    terminal: true
  - 调岗申请:已提交
  - 调岗申请:已批准
  - 调岗申请:已写入
  - name: 调岗申请:已驳回
    terminal: true
  - name: 调岗申请:已生效
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 任职:生效中
    command: 建立任职
    guard:
    - INV-62
    - INV-63
    - INV-60
    kind: forward
  - from: 任职:生效中
    to: 任职:已终止
    command: 终止任职
    guard:
    - 区间止于离职日
    kind: forward
  - from: null
    to: 调岗申请:已提交
    command: 提交调岗申请
    guard:
    - INV-63
    - INV-60
    kind: forward
  - from: 调岗申请:已提交
    to: 调岗申请:已批准
    command: 批准调岗申请
    guard:
    - AR-11
    - AR-12
    - 提交人 ≠ 批准人
    kind: forward
  - from: 调岗申请:已提交
    to: 调岗申请:已驳回
    command: 驳回调岗申请
    guard:
    - 批准人驳回，或提交人撤回
    kind: reverse
    process_outcome: 已驳回
  - from: 任职:生效中
    to: 任职:变更待生效
    command: 变更任职
    guard:
    - INV-62：原子关旧开新，主任职不重叠
    - 跨法人：新劳动合同已签订
    kind: forward
  - from: 调岗申请:已批准
    to: 调岗申请:已写入
    command: 变更任职
    guard:
    - 调岗申请为已批准
    kind: forward
  - from: 任职:变更待生效
    to: 任职:生效中
    command: 任职变更生效
    guard:
    - U-12：业务生效日到达
    kind: forward
  - from: 调岗申请:已写入
    to: 调岗申请:已生效
    command: 任职变更生效
    guard:
    - U-12
    kind: forward
    process_outcome: 调岗已生效
  source_part: vs07
