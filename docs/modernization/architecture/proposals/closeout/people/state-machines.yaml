# 人员组合并产物（由 parts/rebuild.py 从分片生成，不手改；改分片后重跑）
machines:
- aggregate: AGG-69
  machine: attendance_record
  entity: attendance_records
  note: 只追加不可改（INV-69），记录类型（打卡 / 外勤 / 补卡）是属性不分状态；导入与补卡都是创建，创建即终态
  states:
  - name: 已记录
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 已记录
    command: 导入考勤记录
    guard:
    - INV-69
    kind: forward
  - from: null
    to: 已记录
    command: 补卡
    guard:
    - INV-69
    - R-b
    - INV-105：所属月已锁定则计入下月更正行
    kind: forward
  source_part: vs13att
- aggregate: AGG-70
  machine: leave_request
  entity: leave_requests
  note: 草稿来自编辑页保存或迁入；已提交 = 规则内自动批准路径的瞬时待批状态（聚合稿与数据模型状态列无此状态，见 vs13att.notes.md 结构问题 2）；已批准休完后仍停在已批准
  states:
  - 草稿
  - 已提交
  - 审批中
  - 已批准
  - name: 已驳回
    terminal: true
  - name: 已撤销
    terminal: true
  - name: 已销假
    terminal: true
  initial: 草稿
  transitions:
  - from: 草稿
    to: 已提交
    command: 提交请假
    guard:
    - INV-68
    - INV-116
    - R-a：规则内自动批准路径
    kind: forward
  - from: 草稿
    to: 审批中
    command: 提交请假
    guard:
    - INV-68
    - INV-116
    - R-a：超阈值 / 需证明材料 / 透支转人审
    kind: forward
  - from: 已提交
    to: 已批准
    command: 批准请假
    guard:
    - R-a
    kind: forward
  - from: 审批中
    to: 已批准
    command: 批准请假
    guard:
    - AR-11
    - AR-12
    kind: forward
  - from: 审批中
    to: 已驳回
    command: 驳回请假
    guard: []
    kind: reverse
  - from: 审批中
    to: 已撤销
    command: 撤销请假
    guard:
    - 仅申请人，同时撤回审批实例
    kind: reverse
  - from: 已批准
    to: 已撤销
    command: 撤销请假
    guard:
    - 仅申请人，请假未开始
    kind: reverse
  - from: 已批准
    to: 已销假
    command: 销假
    guard:
    - 仅申请人，请假已开始且未休完
    kind: reverse
  source_part: vs13att
- aggregate: AGG-71
  sub_machines:
  - leave_balance_account
  - leave_balance_hold
  states:
  - leave_balance_account:已开账
  - leave_balance_hold:占用
  - leave_balance_hold:已转用
  - name: leave_balance_hold:已释放
    terminal: true
  transitions:
  - from: null
    to: leave_balance_account:已开账
    command: 开立年度额度账户
    guard:
    - INV-123
    kind: forward
  - from: leave_balance_account:已开账
    to: leave_balance_account:已开账
    command: 占用余额
    guard:
    - INV-68
    kind: forward
    effect: 占用 +
  - from: leave_balance_account:已开账
    to: leave_balance_account:已开账
    command: 批准转已用
    guard: []
    kind: forward
    effect: 占用 −，已用 +
  - from: leave_balance_account:已开账
    to: leave_balance_account:已开账
    command: 释放余额占用
    guard: []
    kind: reverse
    effect: 占用 −
  - from: leave_balance_account:已开账
    to: leave_balance_account:已开账
    command: 回冲已用额度
    guard:
    - 回冲不超已用
    kind: reverse
    effect: 已用 −
  - from: null
    to: leave_balance_hold:占用
    command: 占用余额
    guard:
    - INV-68
    - 账户已开账
    kind: forward
  - from: leave_balance_hold:占用
    to: leave_balance_hold:已转用
    command: 批准转已用
    guard: []
    kind: forward
  - from: leave_balance_hold:占用
    to: leave_balance_hold:已释放
    command: 释放余额占用
    guard:
    - 驳回 / 审批中撤销 / 孤儿占用
    kind: reverse
  - from: leave_balance_hold:已转用
    to: leave_balance_hold:已释放
    command: 回冲已用额度
    guard:
    - 已批准后撤销：全部回冲
    kind: reverse
  - from: leave_balance_hold:已转用
    to: leave_balance_hold:已转用
    command: 回冲已用额度
    guard:
    - 销假：未休完部分回冲
    kind: reverse
  source_part: vs13att
  note: 同一聚合的多个子生命周期合成一台（rebuild.py）；状态名带子机前缀
- aggregate: AGG-72
  machine: overtime_request
  entity: overtime_requests
  note: 登记即创建（无草稿）；批准由系统以打卡核实代替人工；登记后无撤销命令（见 vs13att.notes.md 结构问题 4）
  states:
  - 已申请
  - 已批准
  - name: 已补偿
    terminal: true
  - name: 已驳回
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 已申请
    command: 加班申请
    guard:
    - R-c
    kind: forward
  - from: 已申请
    to: 已批准
    command: 批准加班
    guard:
    - R-d
    kind: forward
  - from: 已申请
    to: 已驳回
    command: 驳回加班
    guard:
    - R-d：打卡不支持登记时长
    kind: reverse
  - from: 已批准
    to: 已补偿
    command: 标记加班已补偿
    guard:
    - 月度考勤已确认
    kind: forward
  source_part: vs13att
- aggregate: AGG-97
  machine: monthly_attendance_confirmation
  entity: monthly_attendance_confirmations
  note: 暂缓（月内有日期导入失败）不创建聚合，是生成命令的前置条件失败；确认方式（员工 / 默认）与默认确认原因（逾期未确认 / 已离职）是属性不分状态；已确认后到确认期限届满前不可重新生成，更正走下月更正行
  states:
  - 已生成
  - 已确认
  - name: 已锁定
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 已生成
    command: 生成月度考勤
    guard:
    - 导入无缺失（CLAUDE.md 第 6 条）
    - INV-116
    - INV-105
    kind: forward
  - from: 已生成
    to: 已生成
    command: 重新生成月度考勤
    guard:
    - INV-105：未确认未锁定
    kind: forward
  - from: 已生成
    to: 已确认
    command: 员工确认
    guard:
    - INV-105
    - 确认期限内
    kind: forward
  - from: 已生成
    to: 已确认
    command: 默认确认月度考勤
    guard:
    - R-e：期限届满或人员已离职
    kind: forward
  - from: 已确认
    to: 已锁定
    command: 锁定
    guard:
    - R-e：确认期限届满
    - INV-105
    kind: forward
  source_part: vs13att
- aggregate: AGG-118
  machine: leave_entitlement_rule_version
  entity: leave_entitlement_rule_versions
  note: 每版本一个聚合，发布即生效，生效后不可改（D15），更正另发布新版本；假期类型（leave_types）为受控代码表，只由迁移维护，无命令（见 vs13att.notes.md 结构问题 6）
  states:
  - name: 已生效
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 已生效
    command: 发布假期规则版本
    guard:
    - INV-123
    kind: forward
  source_part: vs13att
- aggregate: AGG-68
  machine: work_calendar_year
  entity: work_calendar_years
  perpetual: true
  note: 可变根 + 审计，过去日期锁定；首次维护创建，之后每年反复维护（现状为整集替换，是否改按配置型版本化待 one-data）
  states:
  - 已建
  initial: null
  transitions:
  - from: null
    to: 已建
    command: 维护工作日历年度
    guard: []
    kind: forward
  - from: 已建
    to: 已建
    command: 维护工作日历年度
    guard:
    - 过去日期锁定
    kind: forward
  source_part: vs13att
- aggregate: AGG-108
  machine: standard_work_hour_version
  entity: standard_work_hour_versions
  note: 每版本一个聚合，发布即生效，生效后不可改（INV-116）；被新版本取代不改旧版本状态，按日期区间取当日生效版本
  states:
  - name: 已生效
    terminal: true
  initial: null
  transitions:
  - from: null
    to: 已生效
    command: 发布标准工时版本
    guard:
    - INV-116：区间不重叠
    kind: forward
  source_part: vs13att
- aggregate: AGG-106
  machine: performance_review
  entity: performance_reviews
  note: 已确认后不得改，更正另记（INV-114）；更正没有命令，见 notes 结构问题 8
  states:
  - 草拟
  - 已提交
  - name: 已确认
    terminal: true
  initial: 草拟
  transitions:
  - from: null
    to: 草拟
    command: 编制绩效评估
    guard:
    - INV-114
    kind: forward
  - from: null
    to: 草拟
    command: 编制试用期绩效评估
    guard:
    - INV-114
    kind: forward
  - from: 草拟
    to: 已提交
    command: 提交绩效评估
    guard:
    - U11：接收方未定
    kind: forward
  - from: 已提交
    to: 已确认
    command: 确认绩效评估
    guard:
    - INV-114
    kind: forward
    process_outcome: 已确认
  - from: 草拟
    to: 已确认
    command: 确认绩效评估
    guard:
    - 试用期评估无提交环节（PRC-85 步 2）〔推〕
    kind: forward
    process_outcome: 已确认
  source_part: vs13pay
- aggregate: AGG-73
  machine: payroll_settlement
  entity: payroll_settlements
  added_states:
  - 已退回
  note: '数据模型状态列为「草稿 → 已计算 → 审核中 → 已批准 → 已发放 → 已过账」。计算由系统自动，没有人工草稿，创建即为已计算，草稿不用；

    审批驳回与提交人撤回后回到第 1 步重算，补「已退回」。已发放与已过账先后不定：过账可先于发放（PRC-134 出口「待发放后再置位」），

    故已批准上有一条只置位的自环；发放时若过账事实已入账，由 PRC-127 回到 PRC-134 补置已过账。结局「待锁定」「已中止」不建结算，不是状态。

    '
  states:
  - 已计算
  - 审核中
  - 已批准
  - 已发放
  - name: 已过账
    terminal: true
  - 已退回
  initial: 已计算
  transitions:
  - from: null
    to: 已计算
    command: 计算
    guard:
    - R-VS13-h
    - INV-70
    - 规则版本取得到（同 INV-116）
    kind: forward
  - from: 已计算
    to: 已计算
    command: 计算
    guard:
    - 提交审核前发现输入有误重算
    kind: forward
  - from: 已退回
    to: 已计算
    command: 计算
    guard:
    - 退回或撤回后重新计算
    kind: forward
  - from: 已计算
    to: 审核中
    command: 提交审核
    guard:
    - 异常清单已生成
    - 制单人 ≠ 审批人（AR-11）
    kind: forward
  - from: 审核中
    to: 已批准
    command: 批准
    guard:
    - INV-70
    - AR-01
    - AR-02
    - AR-11
    kind: forward
    process_outcome: 已批准
  - from: 审核中
    to: 已退回
    command: 退回薪酬重算
    guard: []
    kind: reverse
  - from: 审核中
    to: 已退回
    command: 撤回薪酬审核
    guard:
    - 仅提交人
    kind: reverse
  - from: 已批准
    to: 已发放
    command: 标记薪酬已发放
    guard:
    - 应付已结清且应付类型为应付薪酬
    - 部分退票语义未定（结构问题 2④）
    kind: forward
    process_outcome: 已发放
  - from: 已批准
    to: 已批准
    command: 标记已过账
    guard:
    - 薪酬尚未发放：只置位过账事实已入账
    kind: forward
    process_outcome: 待发放后再置位
  - from: 已发放
    to: 已过账
    command: 标记已过账
    guard:
    - 来源单据类型为月度薪酬结算
    kind: forward
    process_outcome: 已过账
  - from: 已计算
    to: 已计算
    command: 提交过账候选
    kind: non_state
  - from: 审核中
    to: 审核中
    command: 提交过账候选
    kind: non_state
  - from: 已批准
    to: 已批准
    command: 提交过账候选
    kind: non_state
  - from: 已发放
    to: 已发放
    command: 提交过账候选
    kind: non_state
  - from: 已退回
    to: 已退回
    command: 提交过账候选
    kind: non_state
  source_part: vs13pay
- aggregate: AGG-74
  machine: insurance_enrollment
  entity: insurance_enrollments
  added_states:
  - 在保
  - 已减员
  note: 数据模型状态列只写「状态」未列取值，本稿取在保与已减员。重新入职另建登记（同一人员同缴纳主体至多一个在保）。缴费基数年度调整没有命令，见 notes 结构问题 9
  states:
  - 在保
  - name: 已减员
    terminal: true
  initial: 在保
  transitions:
  - from: null
    to: 在保
    command: 参保增员
    guard:
    - 人员已入职
    - 同人同主体无在保
    - 用工类型不是退休返聘或实习〔推〕
    kind: forward
  - from: 在保
    to: 已减员
    command: 参保减员
    guard:
    - 用工类型不是退休返聘或实习
    kind: forward
    process_outcome: 参保已减员
  source_part: vs13pay
- aggregate: AGG-75
  machine: incentive_plan_version
  entity: incentive_plan_versions
  added_states:
  - 草稿
  - 已批准
  - 已撤回
  note: '数据模型状态列为「编制 → 审批 → 生效 → 结束」。草稿即编制页保存（编辑页行为，不是领域命令）；驳回回到草稿再编制（PRC-121 on_reject 回第 1 步）。

    已批准 = 审批通过但生效日期未到，到期由定时触发生效激励方案版本。已结束 = 同方案后继版本生效，旧版本区间同事务结束（D15），没有独立命令。

    '
  states:
  - 草稿
  - 审批中
  - 已批准
  - 已生效
  - name: 已结束
    terminal: true
  - name: 已撤回
    terminal: true
  initial: 草稿
  transitions:
  - from: 草稿
    to: 审批中
    command: 编制激励方案版本
    guard:
    - R-VS13-f
    - D15
    kind: forward
  - from: 审批中
    to: 已生效
    command: 生效激励方案版本
    guard:
    - AR-01
    - AR-02
    - 生效日期已到
    kind: forward
    process_outcome: 已生效
  - from: 审批中
    to: 已批准
    command: 生效激励方案版本
    guard:
    - AR-01
    - AR-02
    - 生效日期未到
    kind: forward
  - from: 已批准
    to: 已生效
    command: 生效激励方案版本
    guard:
    - 生效日期到达（定时）
    kind: forward
    process_outcome: 已生效
  - from: 审批中
    to: 草稿
    command: 驳回激励方案版本
    guard: []
    kind: reverse
  - from: 审批中
    to: 已撤回
    command: 撤回激励方案版本
    guard:
    - 仅编制人
    kind: reverse
    process_outcome: 已撤回
  - from: 已生效
    to: 已结束
    command: 生效激励方案版本
    guard:
    - 后继版本生效，同事务结束旧区间（D15）
    kind: forward
  source_part: vs13pay
- aggregate: AGG-76
  machine: bonus_determination
  entity: bonus_determinations
  added_states:
  - 已驳回
  note: '数据模型状态列为「草拟 → 已核定 → 已发放」。驳回另补「已驳回」；重新草拟另建新核定单（同一人同期无草拟或已核定时）。

    「已发放」未建模：数据模型说明由 AGG-73 批准后事件置位，但聚合稿与流程都没有置位命令或事件策略，本稿不自造，见 notes 结构问题 2。

    该状态补上后，已核定不再是终态。

    '
  states:
  - 草拟
  - name: 已核定
    terminal: true
  - name: 已驳回
    terminal: true
  initial: 草拟
  transitions:
  - from: null
    to: 草拟
    command: 草拟奖金核定
    guard:
    - R-VS13-g
    - 评估类型为月度
    kind: forward
  - from: 草拟
    to: 已核定
    command: 核定奖金
    guard:
    - AR-01
    - AR-02
    - AR-11
    - R-VS13-g：核定人不改额
    kind: forward
    process_outcome: 已核定
  - from: 草拟
    to: 已驳回
    command: 驳回奖金核定
    guard: []
    kind: reverse
    process_outcome: 已驳回
  source_part: vs13pay
- aggregate: AGG-93
  sub_machines:
  - payroll_profile_version
  - special_deduction_declaration
  states:
  - payroll_profile_version:生效
  - name: payroll_profile_version:已结束
    terminal: true
  - special_deduction_declaration:有效
  - name: special_deduction_declaration:已取代
    terminal: true
  transitions:
  - from: null
    to: payroll_profile_version:生效
    command: 建立薪酬档案
    guard:
    - 人员已入职
    - 一人一档案
    kind: forward
    process_outcome: 薪酬档案已建立
  - from: null
    to: payroll_profile_version:生效
    command: 调整薪酬档案
    guard:
    - R-VS13-j：引用调薪决定依据
    - U9
    kind: forward
    process_outcome: 薪酬档案已调整
  - from: payroll_profile_version:生效
    to: payroll_profile_version:已结束
    command: 调整薪酬档案
    guard:
    - 同事务结束旧版本区间（D17）
    kind: forward
  - from: null
    to: special_deduction_declaration:有效
    command: 更新专项附加扣除
    guard:
    - 扣除额不超扣除标准版本
    kind: forward
    process_outcome: 专项附加扣除已更新
  - from: special_deduction_declaration:有效
    to: special_deduction_declaration:已取代
    command: 更新专项附加扣除
    guard:
    - 同事务取代旧声明
    kind: forward
  source_part: vs13pay
  note: 同一聚合的多个子生命周期合成一台（rebuild.py）；状态名带子机前缀
- aggregate: AGG-95
  machine: tax_social_filing
  entity: tax_social_filings
  added_states:
  - 已更正
