- id: PRC-139-S07
  path:
  - 第 1 步 提交用印申请
  - 第 2 步 批准用印申请
  - 第 4 步 登记用印
  - 第 5 步 关闭用印申请
  covers:
  - 累计登记份数已达批准份数或经办人确认放弃剩余份数
  expect: 经办人确认放弃剩余份数，申请关闭
  outcome: 已关闭
- id: PRC-139-S08
  path:
  - 第 1 步 提交用印申请
  - 第 2 步 批准用印申请（AR-11 上交上级）
  - 第 4 步 登记用印
  - 第 5 步 关闭用印申请
  covers:
  - 已关闭
  expect: 按有效制度配置解析的责任人就是申请人本人，命中 AR-11 上交其上级审批后通过，登记并关闭
  outcome: 已关闭
- id: PRC-139-S09
  path:
  - 第 1 步 提交用印申请
  - 第 4 步 登记用印
  covers:
  - 申请未批准
  expect: 申请未批准时登记被拒绝（状态机已挡的兜底，INV-118）
  outcome: 回第 4 步（未登记）
- id: PRC-139-S10
  path:
  - 第 1 步 提交用印申请
  - 第 4 步 登记用印
  - 第 5 步 关闭用印申请
  covers:
  - 来源审批实例已通过且份数不超审批载荷份数
  - 已关闭
  expect: 合同用印，申请人填已批准合同的审批实例 ID，系统经 platform.approval 校验实例已通过、份数不超审批载荷，不设人审直接置已批准；印章保管人核对后盖章登记，份数到齐后自动关闭
  outcome: 已关闭
- id: PRC-139-S11
  path:
  - 第 1 步 提交用印申请
  covers:
  - 来源审批实例未通过或申请份数超过审批载荷份数
  expect: 填写的来源审批实例尚未通过（审批中、已驳回或已撤回），拒绝提交并告诉申请人原因，留在草稿，不进审批
  outcome: 回第 1 步（未提交）
- id: PRC-139-S12
  path:
  - 第 1 步 提交用印申请
  covers:
  - 来源审批实例未通过或申请份数超过审批载荷份数
  expect: 来源审批实例已通过，但累计份数校验（INV-138：含该实例已被其他有效用印申请占用的份数）超过审批载荷份数，拒绝提交并告诉申请人原因，留在草稿
  outcome: 回第 1 步（未提交）
- id: PRC-139-S13
  path:
  - 第 1 步 提交用印申请
  covers:
  - 无来源单据且用印责任或加审配置缺失、无有效版或不能执行
  expect: 无来源单据却无有效责任或加审范围配置时拒绝并告警；AR-16 只有候选范围不能直接启用；来源审批直通仍按 INV-138
  outcome: 回第 1 步（未提交）
- id: PRC-139-S14
  path:
  - 第 3 步 驳回用印申请
  - 原单第 1 步重提
  - 第 2 步制度责任人批准
  - 第 4 步登记
  - 第 5 步关闭
  covers:
  - otherwise
  - 已关闭
  expect: 原单已驳回重提，保留原编号、旧意见与轮次，新轮重新核对来源、份数和有效制度版本；旧审批实例回调不得作用新轮
  outcome: 已关闭
- id: PRC-139-S15
  path:
  - 审批期撤回
  - 原单第 1 步重提
  covers:
  - 已撤回
  - otherwise
  expect: 已撤回原单可重提且增加提交轮次；同轮重复请求回放，旧轮次与原编号保留；不得建立新单替代原单
  outcome: 进入新轮
- id: PRC-139-S16
  path:
  - 第 4 步 登记用印
  covers:
  - 报价用印的版本、法人、拟发文件与实际用印凭据对应缺失或不一致
  expect: 报价版本、法人、拟发文件或实际用印凭据关系缺失/不一致拒绝并告警；只有已批准、来源审批通过或申请登记不能当实际用印
  outcome: 回第 4 步（未登记）
- id: PRC-139-S17
  path:
  - 第 4 步 登记用印
  - 第 5 步 关闭用印申请
  - 关闭后核验
  covers:
  - 已关闭
  expect: REF-04（暂名，图节点 B-32）经 api 核验已关闭登记的同一报价版本、用印法人、拟发文件与实际盖章凭据；关闭不抹去登记行，B-03 不读取或订阅 B-31；ADR-0057 提议待批，本卡未实现发出
  outcome: 已关闭
- id: PRC-139-S18
  path:
  - 第 1 步 提交用印申请
  - 第 2 步 批准用印申请
  covers:
  - otherwise
  expect: 已有正式批准责任和加审配置版本，按用途、法人、归属对象解析责任人及授权层级；不是默认部门负责人；AR-11/AR-12 仅处理本人和缺位，不替代责任归属
  outcome: 进入登记
- id: PRC-139-S19
  path:
  - 第 4 步 登记用印
  - REF-04 经 api 核验实际用印登记
  covers:
  - otherwise
  expect: REF-04 匹配已用印登记的同一报价版本、法人、拟发文件与凭据，取得用印登记 ID；核验及审计留痕成功后才调用 B-03 发出命令，B-03 仅存追溯标识，不订阅用印事件或建本地投影；本场景是跨组契约描述，不是发出入口运行验收
  outcome: 核验通过（发出由 REF-04 承接）
- id: PRC-139-S20
  path:
  - 仅申请或批准
  - REF-04 经 api 核验实际用印登记
  covers:
  - otherwise
  expect: 仅有已批准、来源审批通过或申请登记，没有实际用印登记时，REF-04 拒绝发出并告警，不调用 B-03 发出命令；不能用事件到达或历史核验代替本次查询
  outcome: 拒绝发出并告警
- id: PRC-139-S21
  path:
  - 第 4 步 登记用印
  - REF-04 经 api 核验实际用印登记
  covers:
  - 报价用印的版本、法人、拟发文件与实际用印凭据对应缺失或不一致
  expect: REF-04 对错报价版本、错法人、错拟发文件、缺登记 ID 或缺实际盖章凭据逐项拒绝发出并告警；读不到、超时或核验失败同样拒绝，无默认放行
  outcome: 拒绝发出并告警
- id: PRC-139-S22
  path:
  - REF-04 用印核验通过
  - 核验留痕
  - B-03 发出命令
  - 结果留痕
  covers:
  - otherwise
  expect: 核验留痕失败不调用发出命令；仅命令已成功后的结果留痕失败核对命令结果后补记，失败均告警，不盲目重调；B-31 只提供实际登记查询，不承担编排或报价状态变更
  outcome: 失败留痕与告警（跨组契约待运行验收）
PRC-142:
- id: PRC-142-S01
  path:
  - 第 1 步 提交 IT 需求
  - 第 3 步 受理 IT 需求
  - 第 4 步 解决 IT 需求
  - 第 5 步 关闭 IT 需求
  covers:
  - otherwise
  - 已关闭
  expect: 常规类别提交后为已提交，通知信息部门直接受理到处理中，跳过批准申请的人审；解决到已解决后由提出人确认关闭
  outcome: 已关闭
- id: PRC-142-S02
  path:
  - 第 1 步 提交 IT 需求
  - 第 2 步 批准 IT 需求
  - 第 3 步 受理 IT 需求
  - 第 4 步 解决 IT 需求
  - 第 5 步 关闭 IT 需求
  covers:
  - 需求类别要求审批
  - otherwise
  expect: 受控类别提交后为审批中，负责人批准后为已提交，信息部门受理后为处理中；解决到已解决后关闭；未把已提交当作处理中
  outcome: 已关闭
- id: PRC-142-S03
  path:
  - 第 1 步 提交 IT 需求
  - 第 2 步 批准 IT 需求
  - 第 7 步 驳回 IT 需求
  covers:
  - 审批已驳回
  - 已退回
  expect: 审批驳回，回调驳回 IT 需求，需求标为已退回并通知提出人
  outcome: 已退回
- id: PRC-142-S04
  path:
  - 第 1 步 提交 IT 需求
  - 第 2 步 批准 IT 需求（提出人撤回）
  covers:
  - 已撤回
  expect: 审批中提出人撤回，工单结束
  outcome: 已撤回
- id: PRC-142-S05
  path:
  - 第 1 步 提交 IT 需求
  - 人工逾期查询或催办
  covers:
  - otherwise
  expect: 常规类别已提交后长期未受理仍保持已提交，无自动提醒、无到期任务；人可查询逾期和人工催办，受理只能由人执行
  outcome: 仍为已提交
- id: PRC-142-S06
  path:
  - 第 1 步 提交 IT 需求
  - 第 3 步 受理 IT 需求
  - 第 6 步 退回 IT 需求
  covers:
  - 需求不成立或无法实现
  - 已退回
  expect: 信息部门受理后判定需求不成立或无法实现，不执行解决、不发 IT 需求已解决，由处理中退回提出人并写退回原因
  outcome: 已退回
- id: PRC-142-S07
  path:
  - 第 4 步 解决 IT 需求
  - 提出人长期未确认
  covers:
  - otherwise
  expect: 有处理结论的已解决工单长期未人工确认仍保持已解决，不登记系统代关任务，不自动关闭；仅提出人可人工关闭
  outcome: 仍为已解决
- id: PRC-142-S08
  path:
  - 第 4 步 解决 IT 需求
  - 第 5 步 关闭 IT 需求
  - 第 3 步 受理 IT 需求
  covers:
  - 提出人认为未解决
  expect: 提出人认为未解决，回到第 3 步重新受理
  outcome: 回第 3 步
- id: PRC-142-S09
  path:
  - 第 4 步 解决 IT 需求
  - 第 5 步 关闭 IT 需求
  covers:
  - 无处理结论
  expect: 缺处理结论时即使提出人确认也拒绝关闭（INV-120），回第 4 步补结论，不写已关闭
  outcome: 回第 4 步（未关闭）
- id: PRC-142-S10
  path:
  - 第 1 步 提交 IT 需求
  covers:
  - IT 类别表或责任配置缺失、类别未列或无有效版
  expect: 类别未列、责任表缺失、重叠、无有效版本或提供维护责任不完整拒绝并告警，不默认常规支持、不猜部门负责人
  outcome: 回第 1 步（未提交）
- id: PRC-142-S11
  path:
  - 第 1 步 提交 IT 需求
  covers:
  - 涉及金额但承载方、适用阈值或币种配置不完整
  expect: 金额先明确由 IT 或采购承载；采购承载走采购自身控制，IT 自身承载缺两档阈值或币种拒绝，不补零、不设不限额；无金额类别不凭空加审
  outcome: 回第 1 步（未提交）
- id: PRC-142-S12
  path:
  - 已退回或已撤回原单
  - 第 1 步重新提交
  covers:
  - otherwise
  expect: 提出人原单重提保留原编号、旧轮次和意见，按当前有效类别表重新到审批中或已提交；旧轮回调不作用新轮
  outcome: 进入新轮
PRC-143:
- id: PRC-143-S01
  path:
  - 第 1 步 申请领用资产
  - 现第 2 步（原第 3 步）登记领用
  covers:
  - otherwise
  - 已领用
  expect: 标准配置内规则完整通过直达已通过，无审批任务、回调或 SH-M1 批准权；签收后登记已领用，同事务开启在用期间
  outcome: 已领用
- id: PRC-143-S02
  path:
  - 第 1 步 申请领用资产
  - 现第 2 步（原第 3 步）登记领用
  covers:
  - otherwise
  - 已领用
  expect: 超配有可执行允许规则且通过，仍只登记直达已通过后交付，不恢复人审
  outcome: 已领用
- id: PRC-143-S03
  path:
  - 第 1 步 申请领用资产
  covers:
  - 岗位标准或超配规则、清单维护配置缺失或无有效版
  expect: 规则缺失、无有效版或提供维护责任未填拒绝并告警；不能回退负责人酌情批准
  outcome: 回第 1 步（未提交）
- id: PRC-143-S04
  path:
  - 第 1 步 申请领用资产
  covers:
  - 岗位标准及超配可执行规则校验不通过
  expect: 超配规则明确拒绝或不满足，拒绝并告警，无审批、驳回回调及审批期撤回路径
  outcome: 回第 1 步（未提交）
- id: PRC-143-S05
  path:
  - 第 1 步 申请领用资产
  covers:
  - 资产卡片不存在、已处置或不属 IT 资产类别
  expect: 卡片无效拒绝并回第 1 步
  outcome: 回第 1 步（未提交）
- id: PRC-143-S06
  path:
  - 第 1 步 申请领用资产
  covers:
  - 该资产已有未归还的使用人
  expect: 申请时提前拒绝唯一使用人冲突（INV-121），先归还或改调拨
  outcome: 回第 1 步（未提交）
- id: PRC-143-S07
  path:
  - 第 1 步 申请领用资产
  - 现第 2 步（原第 3 步）登记领用
  covers:
  - 该资产已有未归还的使用人
  expect: 规则通过后并发占用，交付登记时兜底拒绝（INV-121），不开第二个在用期间
  outcome: 回第 1 步（未登记）
PRC-144:
- id: PRC-144-S01
  path:
  - 系统按业务日到达入职周年
  - 第 1 步 提交员工活动申请
  - 现第 2 步（原第 3 步）完成员工活动
  covers:
  - otherwise
  - 已完成
  expect: B-31 读取 B-13 入职日期和有效人员事实，按已批准适用规则和周年日期自动生成，无需员工申请；类型、预算、组织安排规则通过直达已批准，行政登记完成；本卡未实现触发器
  outcome: 已完成
- id: PRC-144-S02
  path:
  - 人工登记其他活动
  - 第 1 步规则登记
  - 现第 2 步完成
  covers:
  - otherwise
  - 已完成
  expect: 其他活动人工登记走同一规则入口，预算及组织安排规则通过后到已批准再完成；无人工批准、驳回、审批期撤回或活动金额加审
  outcome: 已完成
- id: PRC-144-S03
  path:
  - 第 1 步规则登记
  covers:
  - 活动类型、预算或组织安排规则及维护配置缺失或无有效版
  expect: 规则或清单提供方、维护方未填、无有效版时拒绝并告警，不让经办人酌情放行
  outcome: 回第 1 步（未登记）
- id: PRC-144-S04
  path:
  - 第 1 步规则登记
  covers:
  - 活动类型、预算或组织安排可执行规则校验不通过
  expect: 预算或组织安排不满足时拒绝并告警，不回退人审；费用报销和采购另行走自身流程
  outcome: 回第 1 步（未登记）
- id: PRC-144-S05
  path:
  - 周年调度
  - 第 1 步规则登记
  covers:
  - 周年适用员工、闰日、重新入职或补跑规则缺失
  expect: 周年适用范围、闰日、重新入职、补跑口径任一缺失拒绝并告警，不猜日期或擅自补发；自动生成选择已定
  outcome: 回第 1 步（未登记）
- id: PRC-144-S06
  path:
  - 周年调度重复/补跑
  - 第 1 步幂等返回
  - 已有活动的完成结果
  covers:
  - 员工、入职日期、周年日期及活动类型已生成
  - 已有活动登记已取消且不是显式重登
  - 已完成
  - 已取消
  expect: 同一员工 + 入职日期 + 周年日期 + 活动类型，重复调度及补跑返回已有活动；未完成沿已有路径办理，已完成仅回放结果，不重复生成、通知或举办；已取消只回放取消结果，不重新完成或举办，显式重登另按被取消登记引用办理
  outcome: 已完成
- id: PRC-144-S07
  path:
  - 周年调度
  - 第 1 步规则登记
  covers:
  - otherwise
  expect: 闰日入职与重新入职按正式有效规则计算，保存对应 B-13 入职事实、周年日期及规则版本；变更只用新版本不追溯已生成活动；没有已批准规则不能运行
  outcome: 规则通过后已批准
- id: PRC-144-S08
  path:
  - 现第 2 步 完成员工活动
  - 第 3 步 取消员工活动登记
  covers:
  - 登记记错或活动取消
  - 已取消
  expect: 已完成登记记错，由行政办理取消，原因必填，记录取消人、时间、原状态及审计到已取消；原登记内容、参与人、完成记录和历史全部保留，不设人审，不计 VS-14.4 正常退出
  outcome: 已取消
- id: PRC-144-S09
  path:
  - 第 1 步规则登记到已批准
  - 第 3 步 取消员工活动登记
  covers:
  - 登记记错或活动取消
  - 已取消
  expect: 已批准但尚未举办的活动取消，可直接进入取消命令，无须先完成；只按规则登记，不恢复批准、驳回或审批期撤回；取消不自动冲销费用、报销或采购
  outcome: 已取消
- id: PRC-144-S10
  path:
  - 已批准或已完成
  - 第 3 步 取消员工活动登记（缺原因）
  covers:
  - 未填写取消原因
  expect: 缺取消原因时拒绝并告警，保持原状态和内容，不写已取消、不删除历史；原已完成仍保留正常办结事实
  outcome: 取消被拒绝（原状态不变）
- id: PRC-144-S11
  path:
  - 第 3 步取消到已取消
  - 再次取消
  covers:
  - 已取消
  expect: 同一登记重复取消回放首次结果，不覆盖原因、人、时间和审计；已取消不得再执行完成、修改或恢复原登记内容
  outcome: 已取消
- id: PRC-144-S12
  path:
  - 登记记错
  - 第 3 步取消
  - 显式第 1 步重登
  - 现第 2 步完成
  covers:
  - 登记记错或活动取消
  - 已取消
  - 已完成
  expect: 取消后用既有提交命令新建登记，保存被取消原登记引用并重新校验有效规则；同一被取消登记的重登请求幂等返回已有后继登记；周年自动重复/补跑仍返回旧取消结果，不自动重登；新旧登记及取消审计均可追溯
  outcome: 已完成（新登记）
- id: PRC-144-S13
  path:
  - 已批准或已完成
  - 尝试直接修改登记内容
  covers:
  - otherwise
  expect: 不提供修改登记内容命令，原活动类型、说明、费用预估引用和参与人不可直接改；记错按先取消再重登处理；无修改提示交架构按 B31-8 登记豁免，不伪造更新自环
  outcome: 原登记内容不变
PRC-145:
- id: PRC-145-S01
  path:
