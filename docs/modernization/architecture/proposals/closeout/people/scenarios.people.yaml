  covers:
  - P7D
  - 已提醒
  expect: 仅 Separated 已生效入口，自离职生效时点起 7 个日历日仍未归还时非中断提醒原组织单元负责人，期间保持在用；不从流程启动或事件到达起算，归还待办继续且不阻塞离职
  outcome: 已提醒
- id: PRC-156-S05
  path:
  - Separated 生效后生成待办并登记固定期限
  - 第 1 步 归还资产
  - 到期消息到达
  covers:
  - 已归还
  expect: 归还完成取消原到期任务；取消与到期并发仍核对当前期间，已归还不得提醒或重开待办
  outcome: 已归还
- id: PRC-156-S06
  path:
  - 离职生效 8 日后才收到 Separated
  - 重复到达同一事件或重试
  covers:
  - P7D
  - 已提醒
  expect: 固定到期时点仍为离职生效 + 7 个日历日；未归还立即按聚合 ID + 到期时点幂等补到期提醒一次，重复/晚到不重置或延后期限；原组织单元负责人接收
  outcome: 已提醒
- id: PRC-156-S07
  path:
  - 离职后已经归还
  - 晚到或重复 Separated
  covers:
  - 该资产没有未结束的使用期间
  expect: 核对当前期间已结束，不重建归还待办或到期任务，不发提醒；调拨结束旧期间须检查当前在用期间，不能把它误当归还
  outcome: 无重复待办
- id: PRC-156-S08
  path:
  - 离职生效前收到事件或仅离职登记
  covers:
  - otherwise
  expect: 生效前不生成待办或期限；只处理已生效 Separated，不订阅离职登记已撤销；缺离职生效时点或原组织单元信息拒绝并告警，不以事件到达时点兜底
  outcome: 不生成待办
PRC-157:
- id: PRC-157-S01
  path:
  - 第 1 步 报修资产
  - 第 2 步 登记维修结果
