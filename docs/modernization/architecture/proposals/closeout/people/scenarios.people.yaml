  path:
  - 第 1 步 关闭预算账户
  covers:
  - 账户仍有占用中的占用行
  - 关闭待处理
  expect: 账户仍有占用中的占用行，不关闭并告警财务，释放或消耗后重新触发
  outcome: 关闭待处理
PRC-162:
- id: PRC-162-S01
  path:
  - 第 1 步 发布假期规则版本
  covers:
  - 假期规则版本已发布
