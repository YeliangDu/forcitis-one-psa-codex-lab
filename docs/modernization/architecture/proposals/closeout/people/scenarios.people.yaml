PRC-201:
- id: PRC-201-S01
  path:
  - 第 1 步 登记代发结果
  covers:
  - 全部薪酬结算行已实付且应付已结清
  - 已发放
  expect: 回单全部成功，各行已实付；应付已结清已到，同一事务根到已发放；每行转换 2 条（空 → 待支付 序号 1、待支付 → 已实付）
  outcome: 已发放
- id: PRC-201-S02
  path:
  - 第 1 步 登记代发结果
  covers:
  - otherwise
  - 待应付结清
  expect: 回单全部成功但应付尚未结清，根保持已批准；应付已结清到达后由 PRC-127 推进到已发放
  outcome: 待应付结清
- id: PRC-201-S03
  path:
  - 第 1 步 登记代发结果
  - 第 2 步 通知支付失败员工更正工资卡
  - 第 4 步 发起薪酬补发
  - 第 5 步 登记代发结果
  covers:
  - 有薪酬结算行支付失败
  - 全部薪酬结算行已实付且应付已结清
  expect: 两行失败（原因与银行退回日必填）；银行退回日周一，补发截止日为周四；员工更正工资卡后于截止日前补发，PRC-126 在原应付挂补发明细；补发回单成功后最后一行已实付，根到已发放，到期提醒取消
  outcome: 已发放
- id: PRC-201-S04
  path:
  - 第 1 步 登记代发结果
  - 第 2 步 通知支付失败员工更正工资卡
  covers:
  - 超时 到期后 5 个工作日 通知支付失败员工更正工资卡，升级提醒 ROLE-26
  expect: 到期日仍未补发，按 notify 同时提醒法人财务负责人与负责薪酬的人力资源职能人员，该行计入补发逾期统计；到期后 5 个工作日仍未补发，非中断升级提醒法人负责人（ROLE-26 按法人解析），结束于已提醒；主线不中断
  outcome: 已提醒
- id: PRC-201-S05
  path:
  - 第 1 步 登记代发结果
  - 第 2 步 通知支付失败员工更正工资卡
  - 第 3 步 登记薪酬补发顺延
  - 第 4 步 发起薪酬补发
  covers:
  - 补发截止日落在长假内且确实无法在截止日前办完
  expect: 银行退回日在长假前一天，第 3 天落在长假内；薪酬岗登记顺延到长假后第一个工作日并通知员工；顺延日选其他日期被拒；顺延截止日前补发则不计逾期
  outcome: 已发放
- id: PRC-201-S06
  path:
  - 第 1 步 登记代发结果
  - 第 2 步 通知支付失败员工更正工资卡
  - 第 4 步 发起薪酬补发
  covers:
  - otherwise
  expect: 第 3 天是周日，截止日提前到周五（最近的工作日）；工作日历版本缺失时拒绝计算截止日并告警，不按自然日猜
  outcome: 已发放
PRC-203:
- id: PRC-203-S01
  path:
  - 第 1 步 〔缺〕启动奖金计提
  - 第 2 步 〔缺〕计算奖金计提
  - 第 3 步 提交过账候选
  covers:
  - 已提交过账
  expect: 人工成本分配过账后启动；历史比率项目按当月直接人工、合同额百分比项目按当月确认收入乘计提率，按法人与项目提交奖金计提记账事实（借 直接人工（项目）贷 奖金（计提）），计提率随事实携带
  outcome: 已提交过账
