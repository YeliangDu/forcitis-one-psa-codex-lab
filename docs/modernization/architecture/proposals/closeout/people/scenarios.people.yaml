  - 第 2 步 〔缺〕计算奖金计提
  covers:
  - 本期人工成本分配或收入确认尚有法人 × 期间未过账，延后由投递重试；到下次关账仍未齐的告警人力
  - 期间关账中待重试
  expect: 基数事实未齐时不按缺数计提，延后重试；逾期告警
  outcome: 期间关账中待重试
