  covers:
  - 薪酬规则版本已发布
  expect: 人力编制、财务确认后发布新的薪酬规则版本，区间不与既有版本重叠，发布即生效，生效后不可改
  outcome: 薪酬规则版本已发布
- id: PRC-180-S02
  path:
  - 第 1 步 发布薪酬规则版本
  covers:
  - 同一规则类别同一适用范围的生效区间与既有版本重叠
  - 版本被拒
  expect: 同一规则类别同一适用范围生效区间与既有版本重叠，被 INV-139 拒绝
  outcome: 版本被拒
PRC-181:
- id: PRC-181-S01
  path:
  - 第 1 步 创建经营复盘
  - 第 2 步 记录偏差解释
  - 第 3 步 确定经营动作
  - 第 4 步 定稿经营复盘
  - 第 5 步 完成经营动作
  covers:
  - 会计期间已关账
  - 经营复盘已闭环
  expect: 月度关账后系统为复盘组织单元创建经营复盘，责任人解释超容忍度的偏差、确定带责任人与期限的动作并定稿，动作责任人登记完成，全部动作完成后复盘闭环
  outcome: 经营复盘已闭环
- id: PRC-181-S02
  path:
  - 第 1 步 创建经营复盘
  - 第 2 步 记录偏差解释
  - 第 3 步 确定经营动作
  - 第 4 步 定稿经营复盘
  covers:
  - 复盘未确定任何经营动作
  - 经营复盘已闭环
  expect: 偏差均在容忍度内或责任人认定无需动作，定稿时没有动作，复盘直接闭环
  outcome: 经营复盘已闭环
- id: PRC-181-S03
  path:
  - 第 1 步 创建经营复盘
  - 第 2 步 记录偏差解释
  - 第 3 步 确定经营动作
  - 第 4 步 定稿经营复盘
  covers:
  - 经营动作含调整经营计划
  - 已转调整计划
  expect: 动作中含调整经营计划类，定稿后转 PRC-88（经营复盘后调整计划）由编制人另起新版本并引用该动作；其余动作随复盘记录继续跟踪
  outcome: 已转调整计划
- id: PRC-181-S04
  path:
  - 第 1 步 创建经营复盘
  - 第 2 步 记录偏差解释
  - 第 3 步 确定经营动作
  - 第 4 步 定稿经营复盘
  - 第 5 步 完成经营动作
  - 第 5 步 完成经营动作
  covers:
  - 仍有未完成的经营动作
  - 经营复盘已闭环
  expect: 有多个动作时，每登记一个完成后若仍有未完成的动作则继续跟踪，最后一个完成后复盘闭环
  outcome: 经营复盘已闭环
- id: PRC-181-S05
  path:
  - 第 1 步 创建经营复盘
  covers:
  - 复盘期间尚未关账
  - 复盘待期间关账
  expect: 季度或年度综合复盘到点而期间尚未关账，不创建复盘并告警财务；期间关账后由月度触发补建
  outcome: 复盘待期间关账
- id: PRC-181-S06
  path:
  - 第 5 步 完成经营动作
  covers:
  - 超时 各经营动作自带的期限 经营动作逾期未完成，系统提醒复盘责任人
  expect: 动作到期未完成，非中断边界计时触发，提醒复盘责任人后结束于已提醒；动作不自动完成也不自动取消，主线照常
  outcome: 已提醒
PRC-182:
