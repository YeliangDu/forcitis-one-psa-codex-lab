  expect: 手工停用超过 P1D（1 个工作日）时限未登记，超时升级提醒职能高管（V-13）
  outcome: 已停用并解绑
PRC-139:
- id: PRC-139-S01
  path:
  - 第 1 步 提交用印申请
  - 第 2 步 批准用印申请
  - 第 4 步 登记用印
  - 第 5 步 关闭用印申请
