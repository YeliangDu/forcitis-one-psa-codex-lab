  expect: 劳动合同用人单位、数据范围法人、扣缴义务人三者一致，不预警
  outcome: 三口径一致
- id: PRC-145-S02
  path:
  - 第 1 步 比对三口径
  covers:
  - 三口径中任意两个不一致
  - 已预警
  expect: 三口径中任意两个不一致，预警人力，不拒绝；同一差异已有未处理预警不重复发
  outcome: 已预警
PRC-155:
- id: PRC-155-S01
  path:
  - 第 1 步 〔缺〕申请调拨资产
  - 第 2 步 调拨资产
  covers:
  - otherwise
  - 已调拨
  expect: 申请后资产管理员登记交接，结束调出方使用期间并开启调入方使用期间；同一核算主体内跨组织只通知调出、调入两侧负责人，不新增批准或调入方确认；双方实物交接凭据保留，旧期间结束不算归还
  outcome: 已调拨
- id: PRC-155-S02
  path:
  - 第 1 步 〔缺〕申请调拨资产
  - 转 PRC-143
  covers:
  - 资产没有当前使用人
  - 已转领用
  expect: 资产没有当前使用人，不走调拨，转入领用流程
  outcome: 已转领用
- id: PRC-155-S03
  path:
  - 第 1 步 〔缺〕申请调拨资产
  covers:
  - 调入使用人在调拨日不是在职员工
  expect: 拒绝并回到第 1 步，要求改选调入使用人
  outcome: 回第 1 步（未提交）
- id: PRC-155-S04
  path:
  - 第 1 步 〔缺〕申请调拨资产（申请人撤销）
  covers:
  - 已撤销
  expect: 申请后、登记前撤销，调拨结束，使用人不变
  outcome: 已撤销
- id: PRC-155-S05
  path:
  - 第 1 步 〔缺〕申请调拨资产
  - 第 2 步 调拨资产
  covers:
  - 调出方不是该资产当前使用人
  expect: 登记时调出方已不是当前使用人，拒绝（INV-新-P4），回到第 1 步
  outcome: 回第 1 步（未登记）
PRC-156:
- id: PRC-156-S01
  path:
  - 第 1 步 归还资产
  covers:
  - otherwise
  - 已归还
  expect: 资产管理员验收后登记归还日，结束使用期间（人工触发）；手工入口无论经过多少天都不登记、套用或触发离职 P7D 提醒
  outcome: 已归还
- id: PRC-156-S02
  path:
  - 事件 员工已离职
  - 第 1 步 归还资产
  covers:
  - 已归还
  expect: 员工离职事件为其名下每件未归还资产生成归还待办，验收登记后归还
  outcome: 已归还
- id: PRC-156-S03
  path:
  - 事件 员工已离职
  - 第 1 步 归还资产
  covers:
  - 该资产没有未结束的使用期间
  expect: 待办生成后资产已先行归还，再登记被拒绝，待办由事件处理器取消
  outcome: 回第 1 步（未登记）
- id: PRC-156-S04
  path:
  - 事件 员工已离职
