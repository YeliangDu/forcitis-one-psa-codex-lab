- id: PRC-139-S05
  path:
  - 第 1 步 提交用印申请
  - 第 2 步 批准用印申请
  - 第 4 步 登记用印
  - 第 4 步 登记用印
  - 第 5 步 关闭用印申请
  covers:
  - otherwise
  - 累计登记份数已达批准份数或经办人确认放弃剩余份数
  expect: 第一次登记未达批准份数，继续登记；第二次达到后自动关闭
  outcome: 已关闭
- id: PRC-139-S06
  path:
  - 第 1 步 提交用印申请
  - 第 2 步 批准用印申请
  - 第 4 步 登记用印
  covers:
  - 累计登记份数超过批准份数
  expect: 拒绝登记（INV-119），回到第 4 步
