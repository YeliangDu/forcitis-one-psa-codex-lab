# 人员组合并产物（由 parts/rebuild.py 从分片生成，不手改；改分片后重跑）
commands:
- name: 登记法人主体
  aggregate: AGG-60
  entity: legal_entities
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 法人代码
  - 法人名称
  - 法人类型
  - 生效日
  preconditions:
  - ref: INV-59
    text: 法人代码发号后不可改；同代码重复登记返回已有结果
  - ref: R-B13-1
    text: 五家法人由初始化录入，之后新增走本命令（DATA_MODEL B-13）
  authority:
    ref: raci:AGG-60/登记法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人代码（同代码重复登记返回已有结果）
  state_change: 创建 → 有效
  emits: （内部）
  used_by:
  - PRC-80 第 2 步
  orphan: false
  source_part: vs07
- name: 更名法人主体
  aggregate: AGG-60
  entity: legal_entity_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；词表事件「法人主体已更名」
  source: 词表事件法人主体已更名、已建代码；聚合稿命令列只有登记法人主体
  params:
  - 法人主体ID
  - 新名称
  - 生效日
  preconditions:
  - ref: INV-59
    text: 法人代码发号后不可改；更名只改名称，不改代码
  - ref: 状态
    text: 法人主体为有效
  authority:
    ref: raci:AGG-60/更名法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID + 生效日（同键重提无操作）
  state_change: 有效 → 有效（追加名称版本）
  emits: （内部）
  used_by:
  - PRC-80 第 7 步
  orphan: false
  source_part: vs07
- name: 停用法人主体
  aggregate: AGG-60
  entity: legal_entity_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；词表事件「法人主体已停用」
  source: 词表事件法人主体已停用、已建代码；聚合稿命令列只有登记法人主体
  params:
  - 法人主体ID
  - 停用日
  - 停用原因
  preconditions:
  - ref: 状态
    text: 法人主体为有效
  - ref: 待定
    text: 法人主体仍有有效法人归属或在职任职时是否拒绝，聚合稿与词表均未定（vs07.notes.md 结构问题 19），本命令暂只校验状态
  authority:
    ref: raci:AGG-60/停用法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID（已停用再停用无操作）
  state_change: 有效 → 已停用
  emits: （内部）
  used_by:
  - PRC-80 第 8 步
  orphan: false
  source_part: vs07
- name: 启用法人主体
  aggregate: AGG-60
  entity: legal_entity_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；词表事件「法人主体已启用」
  source: 词表事件法人主体已启用、已建代码；聚合稿命令列只有登记法人主体
  params:
  - 法人主体ID
  - 启用日
  preconditions:
  - ref: 状态
    text: 法人主体为已停用（词表另区分已登记与已启用，本稿登记即有效，见 vs07.notes.md 结构问题 19）
  authority:
    ref: raci:AGG-60/启用法人主体
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 法人主体ID（有效再启用无操作）
  state_change: 已停用 → 有效（恢复）
  emits: （内部）
  used_by:
  - PRC-80 第 9 步
  orphan: false
  source_part: vs07
- name: 调整组织单元
  aggregate: AGG-61
  entity: org_units
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 组织单元ID（新建时为空）
  - 调整类型（新建 / 变更 / 停用 / 恢复启用 / 撤销）
  - 名称与简称
  - 上级组织单元
  - 单元类型
  - 是否交付单元
  - 负责人（人员ID）
  - 业务生效日
  preconditions:
  - ref: INV-60
    text: 撤销的组织单元下仍有在职任职则拒绝并提示先调岗（PRC-136），人力改正后重提
  - ref: 状态
    text: 已撤销的组织单元不可再调整
  - ref: 结构问题 14
    text: 负责人（责任人）是 cost_object_owner 的解析来源，须在版本表按生效区间保存；变更负责人即改变审批归属
  authority:
    ref: raci:AGG-61/调整组织单元
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 调整请求ID（客户端预生成 UUIDv7）
  state_change: 创建 → 启用；启用 ⇄ 停用；启用 / 停用 → 已撤销
  emits: 组织单元已调整
  used_by:
  - PRC-80 第 3 步
  orphan: false
  source_part: vs07
- name: 指定法人归属
  aggregate: AGG-117
  entity: legal_entity_attributions
  kind: human
  source: 分片 vs07.notes.md 新用语、聚合稿 AGG-117 回补（聚合稿现列「指定法人归属」）
  params:
  - 归属对象类型（部门 / 员工）
  - 归属对象ID
  - 法人主体ID
  - 期间起
  - 期间止（可空）
  preconditions:
  - ref: INV-122
    text: 同一部门 / 员工的法人归属期间不重叠（原 INV-新-P5；EXCLUDE 约束），重叠则拒绝，人力改正后重提
  - ref: INV-59
    text: 读：法人主体须存在
  - ref: Q-09
    text: 三口径之一，与用人单位、扣缴义务人不一致只预警（B-15 PRC-145），本命令不拒绝
  authority:
    ref: raci:AGG-117/指定法人归属
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 归属请求ID（客户端预生成 UUIDv7）
  state_change: 创建 / 追加期间 → 已指定
  emits: 〔缺〕法人归属已变更
  used_by:
  - PRC-80 第 4 步
  orphan: false
  source_part: vs07
- name: 更正法人归属
  aggregate: AGG-117
  entity: legal_entity_attribution_corrections
  kind: human
  source: 聚合稿 AGG-117（命令名以已建代码为准，交 one-glossary）
  params:
  - 归属对象类型
  - 归属对象ID
  - 原期间
  - 更正后结束日
  - 更正理由
  preconditions:
  - ref: INV-122
    text: 更正后期间仍不重叠；更正只追加，不改写历史
  - ref: 状态
    text: 仅已关闭期间的结束日可更正（词表：法人归属结束日已更正）
  authority:
    ref: raci:AGG-117/更正法人归属
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 更正序号（同对象同期间单调递增）
  state_change: 已指定 → 已指定（追加更正行）
  emits: （内部）
  used_by:
  - PRC-80 第 12 步
  orphan: false
  source_part: vs07
- name: 停用岗位
  aggregate: AGG-64
  entity: jobs
  kind: human
  source: 聚合稿 AGG 命令列（Q-08 后改称职位目录条目，命令名交 one-glossary）
  params:
  - 职位ID
  - 停用日
  preconditions:
  - ref: INV-63
    text: 职位仍被在职任职引用则拒绝，人力改正后重提
  - ref: 状态
    text: 职位为启用
  authority:
    ref: raci:AGG-64/停用岗位
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 职位ID（已停用再停用无操作）
  state_change: 启用 → 已停用
  emits: 岗位已停用
  used_by:
  - PRC-80 第 5 步
  orphan: false
  source_part: vs07
- name: 新建岗位
  aggregate: AGG-64
  entity: jobs
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；Q-08 后为职位目录条目，命令名交 one-glossary
  source: jobs 数据模型（职位编码跨版本不变）、vs07.notes.md 结构问题 8
  params:
  - 职位编码
  - 名称
  - 职位族
  - 职级
  - 启用日
  preconditions:
  - ref: 数据模型
    text: 职位编码跨版本不变，同编码重复新建返回已有结果
  - ref: JOB_CATALOG P-0
    text: 职位与职级是两个独立维度；职级、职位族暂随本聚合不拆（S-10）
  authority:
    ref: raci:AGG-64/新建岗位
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 职位编码（同编码重复新建返回已有）
  state_change: 创建 → 启用
  emits: （内部）
  used_by:
  - PRC-80 第 10 步
  orphan: false
  source_part: vs07
- name: 修改岗位
  aggregate: AGG-64
  entity: job_versions
  kind: human
  name_status: 〔缺〕收敛补缺（vs07.notes.md 结构问题 19，QC-OBJECTS.md）；Q-08 后为职位目录条目，命令名交 one-glossary
  source: job_versions 数据模型、vs07.notes.md 结构问题 8
  params:
  - 职位ID
  - 名称
  - 职位族
  - 职级
  - 生效日
  preconditions:
  - ref: 状态
    text: 职位为启用；已停用的职位不可修改
  authority:
    ref: raci:AGG-64/修改岗位
    A:
      resolve: type
      role: SH-E6
      function: 人事主数据维护
    R:
    - SH-E6
  idempotency_key: 职位ID + 生效日（同键重提无操作）
  state_change: 启用 → 启用（追加版本）
  emits: （内部）
  used_by:
  - PRC-80 第 11 步
  orphan: false
  source_part: vs07
- name: 提交招聘需求
  aggregate: AGG-65
  entity: recruitment_requisitions
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 需求ID（客户端预生成）
  - 职位ID
  - 组织单元ID
  - 需求人数
  - 期望到岗日
  - 需求说明
  preconditions:
  - ref: R-01
    text: 职位须启用、组织单元须有效，违反拒绝并退回改正
  - ref: 状态
    text: 需求为草稿
  authority:
    ref: raci:AGG-65/提交招聘需求
    A:
      resolve: instance
      field: 招聘需求.提出人
    R:
    - SH-E1
  idempotency_key: 需求ID（同一 ID 重复提交返回已有结果）
  state_change: 草稿 → 已提交
  emits: （内部）
  used_by:
  - PRC-81 第 2 步
  orphan: false
  source_part: vs07
- name: 批准招聘需求
  aggregate: AGG-65
  entity: recruitment_requisitions
  kind: human
  source: 聚合稿 AGG 命令列（B-13 聚合内单级批准，F-3，不经 platform.approval）
  params:
  - 需求ID
  - 批准意见
  preconditions:
  - ref: 状态
    text: 需求为已提交
  - ref: AR-11/AR-12
    text: 提出人本人就是归属组织单元责任人则上交其上级；责任人缺位上交上级组织负责人（待 V-18）
  - ref: 职责分离
    text: 提出人 ≠ 批准人
  authority:
    ref: raci:AGG-65/批准招聘需求
    A:
      resolve: type
      role: SH-M1
    R:
    - SH-M1
    approval:
      approver: SH-M1
      doc_type: 招聘需求批准
  idempotency_key: 需求ID（已批准再批准无操作）
  state_change: 已提交 → 已批准
  emits: 招聘需求已批准
  used_by:
  - PRC-81 第 3 步
  orphan: false
  source_part: vs07
- name: 关闭招聘需求
  aggregate: AGG-65
  entity: recruitment_requisitions
  kind: human
  source: 聚合稿 AGG 命令列（v1 以关闭代驳回）
  params:
  - 需求ID
  - 关闭原因（驳回 / 撤回 / 取消 / 录满）
  preconditions:
  - ref: 状态
    text: 需求为已提交（批准人驳回，或提出人撤回），或已批准（取消、录满）
  - ref: PG-08
    text: 录满无触发，暂由人力或提出人手工关闭
  authority:
    ref: raci:AGG-65/关闭招聘需求
    A:
      resolve: type
      role: SH-M1
    R:
    - SH-M1
    - SH-E1
    - SH-E6
  idempotency_key: 需求ID（已关闭再关闭无操作）
  state_change: 已提交 / 已批准 → 已关闭
  emits: 招聘需求已关闭
  used_by:
  - PRC-81 第 4 步（含第 2 步 withdraw 边进入）
  orphan: false
  note: 驳回是批准人决定，A 同批准；提出人撤回与已批准后取消 / 录满由提出人或人力执行同一命令（R）
  source_part: vs07
- name: 登记候选人
  aggregate: AGG-62
  entity: employees
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 姓名
  - 联系方式
  - 应聘职位或招聘需求ID
  - 来源（应聘 / 推荐）
  preconditions:
  - ref: T-5
    text: 候选人并入人员的候选阶段，个人信息保护，访问限招聘相关角色（ADR-0043）
  authority:
    ref: raci:AGG-62/登记候选人
    A:
      resolve: type
      role: SH-E6
      function: 招聘
    R:
    - SH-E6
  idempotency_key: 人员ID（客户端预生成 UUIDv7）；同姓名同联系方式疑似重复时提示不静默合并
  state_change: 创建 → 人员:候选人
  emits: 人员已登记
  used_by:
  - PRC-82 第 1 步
  orphan: false
  source_part: vs07
- name: 记录面试
  aggregate: AGG-62
  entity: interviews
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 人员ID
  - 招聘需求ID
  - 面试轮次
  - 面试时间
  - 面试人
  - 评价与结论（通过 / 不通过）
  preconditions:
  - ref: 状态
    text: 人员为候选人
  - ref: T-5
    text: 评价属个人信息，访问限招聘相关角色
  authority:
    ref: raci:AGG-62/记录面试
    A:
      resolve: instance
      field: 招聘需求.提出人
    R:
    - SH-E1
  idempotency_key: 人员ID + 面试轮次
  state_change: 人员:候选人 → 人员:候选人（追加面试行）
  emits: （内部）
  used_by:
  - PRC-82 第 2 步
  orphan: false
  source_part: vs07
- name: 作出录用决定
  aggregate: AGG-62
  entity: hiring_decisions
  kind: human
  source: 聚合稿 AGG 命令列（V-8：不另设审批）
  params:
  - 人员ID
  - 招聘需求ID
  - 录用结论
  - 拟入职日
  - 拟任职位ID
  - 拟职级ID
  preconditions:
  - ref: R-02
    text: 拟任职位须启用，违反拒绝
  - ref: 状态
    text: 人员为候选人且最近一轮面试通过
  authority:
    ref: raci:AGG-62/作出录用决定
    A:
      resolve: instance
      field: 招聘需求.提出人
    R:
    - SH-E1
  idempotency_key: 人员ID + 招聘需求ID（同对重复作出返回已有）
  state_change: 人员:候选人 → 人员:待答复
  emits: （内部）
  used_by:
  - PRC-82 第 3 步
  orphan: false
  note: 聚合稿把「录用决定已作出」挂在本命令；本稿改挂登记候选人答复（vs07.notes.md 结构问题 4）
  source_part: vs07
- name: 登记候选人答复
  aggregate: AGG-62
  entity: hiring_decisions
  kind: human
  name_status: 〔缺〕沿用分片提议名（vs07.notes.md 新用语：RecordCandidateReply）
  source: 分片 vs07.notes.md 结构问题 4、17
  params:
  - 人员ID
  - 答复（接受 / 放弃）
  - 确认日
  - 确认的入职日
  - 回执引用（邮件或签回的录用通知）
  preconditions:
  - ref: 状态
    text: 人员为待答复
  - ref: V-19
    text: 答复期限缺省 7 日，逾期提醒用人经理决定是否撤销录用，不自动失效
  authority:
    ref: raci:AGG-62/登记候选人答复
    A:
      resolve: type
      role: SH-E6
      function: 招聘
    R:
    - SH-E6
  idempotency_key: 人员ID + 招聘需求ID（已答复再答复返回已有）
  state_change: 人员:待答复 → 人员:录用已确认（接受）/ 人员:候选人已放弃（放弃）
  emits: 录用决定已作出
  used_by:
  - PRC-82 第 4 步
  orphan: false
  source_part: vs07
- name: 标记未录用
  aggregate: AGG-62
  entity: hiring_decisions
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 人员ID
  - 未录用原因类别
  preconditions:
  - ref: 状态
    text: 人员为候选人且面试结论为不通过
  authority:
    ref: raci:AGG-62/标记未录用
    A:
      resolve: instance
      field: 招聘需求.提出人
    R:
    - SH-E1
  idempotency_key: 人员ID（已标记再标记无操作）
  state_change: 人员:候选人 → 人员:未录用
  emits: （内部）
  used_by:
  - PRC-82 第 5 步
  orphan: false
  source_part: vs07
- name: 登记入职
  aggregate: AGG-62
  entity: employees
  kind: human
  source: 聚合稿 AGG 命令列（样板 S3：登记入职 → 入职已登记）
  params:
  - 人员ID
  - 入职日（人事业务生效日，U-12）
  - 用工类型
  - 是否收费员工
  - 试用期约定（可空）
  preconditions:
  - ref: 状态
    text: 人员为录用已确认；非招聘入职（调入、返聘）无候选阶段时直接登记〔推〕
  - ref: U-12
    text: 入职日可早于或晚于登记日；工号由本系统发号
  authority:
    ref: raci:AGG-62/登记入职
    A:
