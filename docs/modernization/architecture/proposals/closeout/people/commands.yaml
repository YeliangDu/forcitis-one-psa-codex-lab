# 人员组合并产物（由 parts/rebuild.py 从分片生成，不手改；改分片后重跑）
commands:
- name: 导入考勤记录
  aggregate: AGG-69
  entity: attendance_records
  kind: automatic
  source: 聚合稿 AGG 命令列
  params:
  - 导入批次号
  - 拉取日期
  - 记录条数
  - 校验和
  - 打卡记录（外部记录标识、来源对照标识、打卡时刻、记录类型）
  preconditions:
  - ref: INV-69
    text: 只追加不可改；以外部记录标识幂等
  - ref: CLAUDE.md 第 6 条
    text: 来源对照解析不到人员的记录整批失败并告警，不静默跳过
  authority:
    ref: raci:AGG-69/导入考勤记录
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 外部记录标识 + 来源系统（重复拉取不重复写入）
  emits: （内部）
  used_by:
  - PRC-115 第 1 步
  orphan: false
  source_part: vs13att
- name: 补卡
  aggregate: AGG-69
  entity: attendance_records
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 员工ID
  - 缺卡日期
  - 补卡时刻
  - 被补记录引用（可空）
  - 补卡事由
  preconditions:
  - ref: INV-69
    text: 原记录不改，补卡另记一条
  - ref: R-b
    text: 只能补该日缺失的打卡、每月补卡次数不超上限、不超补卡时限，违反即拒绝并停留补卡页（次数与时限待 U4）
  - ref: INV-105
    text: 所属月月度考勤已锁定的，补卡照常记录，其对考勤的影响计入下月更正行并标原月份
  authority:
    ref: raci:AGG-69/补卡
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
  idempotency_key: 补卡请求ID（客户端预生成 UUIDv7）
  emits: （内部）
  used_by:
  - PRC-115 第 3 步
  - PRC-118 第 5 步
  orphan: false
  source_part: vs13att
- name: 提交请假
  aggregate: AGG-70
  entity: leave_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 请假ID
  - 员工ID
  - 假期类型
  - 起止时刻
  - 事由
  - 余额占用ID
  - 证明材料引用（可空）
  preconditions:
  - ref: INV-68
    text: 已占用余额（先调用占用余额，同一次操作）；额度不足且政策不允许透支则在占用处被拒
  - ref: INV-116
    text: 按日拆分取当日生效的标准工时版本，取不到失败并告警，不回退默认值
  - ref: R-a
    text: 分流：额度内、假期规则允许、单次天数不超免审批阈值且该假别无需证明材料 → 已提交（自动批准路径）；其余 → 审批中（阈值与假别清单待 U3）
  - ref: 状态
    text: 请假为草稿
  authority:
    ref: raci:AGG-70/提交请假
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
  idempotency_key: 请假ID（客户端预生成 UUIDv7；同一 ID 重复提交返回已有结果）
  emits: （内部）
  used_by:
  - PRC-116 第 2 步
  orphan: false
  source_part: vs13att
- name: 批准请假
  aggregate: AGG-70
  entity: leave_requests
  kind: callback
  kind_note: 人审路径为审批平台回调；规则内自动批准路径由系统直接发令（automatic）。两条路径汇合在同一命令
  source: 聚合稿 AGG 命令列
  params:
  - 请假ID
  - 审批实例ID（人审路径；自动批准路径为空）
  preconditions:
  - ref: 状态
    text: 自动路径：请假为已提交；人审路径：请假为审批中且审批实例ID一致
  - ref: R-a
    text: 自动路径复核同一规则，守卫不成立不得自动批准
  - ref: AR-11/AR-12
    text: 人审路径：申请人本人是部门负责人时按 AR-11 由其上级审批；负责人缺位按 AR-12 上交（APPROVAL_RULES，已有）
  authority:
    ref: raci:AGG-70/批准请假
    A:
      resolve: instance
      field: 申请人所在组织单元.负责人
      alias: cost_object_owner
    R:
    - SH-E1
    - system
    approval:
      approver: cost_object_owner
      doc_type: 请假审批
  idempotency_key: 请假ID + 审批实例ID（同一审批实例重复回调不重复生效）
  emits: 请假已批准
  used_by:
  - PRC-116 第 4 步
  orphan: false
  source_part: vs13att
- name: 驳回请假
  aggregate: AGG-70
  entity: leave_requests
  kind: callback
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：驳回请假，reject_leave_request）
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-70 无驳回命令
  params:
  - 审批实例ID
  - 驳回意见
  preconditions:
  - ref: 状态
    text: 请假为审批中且审批实例ID一致
  authority:
    ref: raci:AGG-70/驳回请假
    A:
      resolve: instance
      field: 申请人所在组织单元.负责人
      alias: cost_object_owner
    R:
    - platform.approval
  idempotency_key: 审批实例ID
  emits: （内部）
  used_by:
  - PRC-116 第 6 步
  orphan: false
  source_part: vs13att
- name: 撤销请假
  aggregate: AGG-70
  entity: leave_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 请假ID
  - 撤销原因
  preconditions:
  - ref: 状态
    text: 请假为审批中，或已批准且尚未开始；已开始的只能销假
  - ref: 权限
    text: 仅申请人本人
  - ref: 接缝
    text: 审批中撤销须同时撤回审批实例（platform.approval 取消能力，vs13.notes.md 接缝问题 1）
  authority:
    ref: raci:AGG-70/撤销请假
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
  idempotency_key: 请假ID（已撤销再撤销无操作）
  emits: 请假已撤销
  used_by:
  - PRC-116 第 7 步（由第 3 步 withdraw 边与第 5 步撤销出口进入）
  orphan: false
  source_part: vs13att
- name: 销假
  aggregate: AGG-70
  entity: leave_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 请假ID
  - 实际结束时刻
  preconditions:
  - ref: 状态
    text: 请假为已批准且已开始、尚未休完
  - ref: 权限
    text: 仅申请人本人；销假是事实登记，不再审批
  authority:
    ref: raci:AGG-70/销假
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
  idempotency_key: 请假ID（已销假再销假无操作）
  emits: 请假已销假
  used_by:
  - PRC-116 第 8 步
  orphan: false
  source_part: vs13att
- name: 占用余额
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 员工ID
  - 假期类型
  - 年度
  - 占用时长（分钟）
  - 请假ID
  preconditions:
  - ref: INV-68
    text: 占用后不得超过可用额度；政策允许透支的假期类型例外，例外进入人审（R-a）
  - ref: 账户存在
    text: 该人员 × 假期类型 × 年度账户已开账，否则失败并告警，不隐式开账
  - ref: 读取
    text: 按日拆分读工作日历（AGG-68）与标准工时版本（AGG-108），取不到当日生效版本失败（INV-116）
  authority:
    ref: raci:AGG-71/占用余额
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
  idempotency_key: 请假ID（同一请假重复占用返回已有占用行）
  emits: （内部）
  used_by:
  - PRC-116 第 1 步
  orphan: false
  source_part: vs13att
- name: 批准转已用
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: automatic
  source: 聚合稿 AGG 命令列
  params:
  - 占用ID
  preconditions:
  - ref: 状态
    text: 占用行为占用
  authority:
    ref: raci:AGG-71/批准转已用
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 占用ID（已转用无操作）
  emits: （内部）
  used_by:
  - PRC-116 第 5 步
  orphan: false
  source_part: vs13att
- name: 释放余额占用
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: automatic
  source: 聚合稿 AGG 命令列
  params:
  - 占用ID
  - 释放原因（驳回 / 审批中撤销 / 孤儿占用）
  preconditions:
  - ref: 状态
    text: 占用行为占用
  authority:
    ref: raci:AGG-71/释放余额占用
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 占用ID（已释放无操作）
  emits: （内部）
  used_by:
  - PRC-116 第 6 步 inner
  - PRC-116 第 7 步 inner
  - 事件策略「孤儿占用定时释放」
  orphan: false
  source_part: vs13att
- name: 回冲已用额度
  aggregate: AGG-71
  entity: leave_balance_holds
  kind: automatic
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：回冲已用额度，refund_used_leave_balance）
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-71 无此命令
  params:
  - 占用ID
  - 回冲时长（分钟）
  - 回冲原因（已批准后撤销 / 销假）
  preconditions:
  - ref: 状态
    text: 占用行为已转用
  - ref: 回冲上限
    text: 回冲时长不超过该行已用时长；销假为未休完部分，撤销为全部
  authority:
    ref: raci:AGG-71/回冲已用额度
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 占用ID + 回冲来源（请假ID + 撤销 / 销假）
  emits: （内部）
  used_by:
  - PRC-116 第 7 步 inner
  - PRC-116 第 8 步 inner
  orphan: false
  source_part: vs13att
- name: 开立年度额度账户
  aggregate: AGG-71
  entity: leave_balance_accounts
  kind: automatic
  name_status: 〔缺〕收敛新增，待 one-glossary 登记（open_leave_balance_account）
  source: 收敛新增（聚合稿 AGG-71 写「年度开账按规则版本计算应享」而无命令）
  params:
  - 员工ID
  - 假期类型
  - 年度
  preconditions:
  - ref: INV-123
    text: 按该假期类型当日生效的假期规则版本计算应享（含上年结转）；取不到生效版本失败并告警，不回退默认值
  - ref: 唯一
    text: 人员 × 假期类型 × 年度至多一个账户
  authority:
    ref: raci:AGG-71/开立年度额度账户
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 员工ID + 假期类型 + 年度（已开账无操作）
  emits: （内部）
  used_by:
  - 事件策略「年度开账」
  orphan: false
  source_part: vs13att
- name: 加班申请
  aggregate: AGG-72
  entity: overtime_requests
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 加班ID
  - 员工ID
  - 加班日期与时长
  - 加班类型（工作日延时 / 休息日 / 法定节假日）
  - 补偿方式（付薪 / 调休）
  - 登记人（员工本人或用人经理代登记）
  preconditions:
  - ref: R-c
    text: 补登不超过允许期限；加班时段与已批准请假重叠则拒绝；补偿方式按加班日类型由规则定（法定节假日只能付薪）；当月累计超 36 小时只预警留痕不拦截（期限待 U5）
  authority:
    ref: raci:AGG-72/加班申请
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
    - SH-E1
  idempotency_key: 加班ID（客户端预生成 UUIDv7）
  emits: （内部）
  used_by:
  - PRC-117 第 1 步
  orphan: false
  source_part: vs13att
- name: 批准加班
  aggregate: AGG-72
  entity: overtime_requests
  kind: automatic
  source: 聚合稿 AGG 命令列
  params:
  - 加班ID
  - 打卡可证实时长（分钟）
  preconditions:
  - ref: R-d
    text: 加班日考勤记录（AGG-69）能支持登记的加班时长即批准，以打卡可证实时长为准；不支持则走驳回加班
  - ref: 状态
    text: 加班为已申请，且加班日考勤已导入
  authority:
    ref: raci:AGG-72/批准加班
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 加班ID（已批准无操作）
  emits: 加班已批准
  used_by:
  - PRC-117 第 2 步
  orphan: false
  source_part: vs13att
- name: 驳回加班
  aggregate: AGG-72
  entity: overtime_requests
  kind: automatic
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：驳回加班，reject_overtime_request）
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-72 无驳回命令
  params:
  - 加班ID
  - 驳回原因（打卡不支持登记时长）
  preconditions:
  - ref: R-d
    text: 打卡记录不支持登记的加班时长
  - ref: 状态
    text: 加班为已申请
  authority:
    ref: raci:AGG-72/驳回加班
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 加班ID
  emits: （内部）
  used_by:
  - PRC-117 第 3 步
  orphan: false
  source_part: vs13att
- name: 标记加班已补偿
  aggregate: AGG-72
  entity: overtime_requests
  kind: automatic
  source: 聚合稿 AGG 命令列
  params:
  - 加班ID
  - 月度考勤确认ID
  preconditions:
  - ref: 状态
    text: 加班为已批准
  authority:
    ref: raci:AGG-72/标记加班已补偿
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 加班ID（已补偿无操作）
  emits: 加班已补偿
  used_by:
  - PRC-118 第 3 步
  orphan: false
  source_part: vs13att
- name: 生成月度考勤
  aggregate: AGG-97
  entity: monthly_attendance_confirmations
  kind: automatic
  source: 聚合稿 AGG 命令列
  params:
  - 员工ID
  - 月份
  preconditions:
  - ref: CLAUDE.md 第 6 条
    text: 月内存在无导入批次或批次失败的日期时失败并告警（暂缓生成），不得当作全勤
  - ref: INV-116
    text: 读工作日历与标准工时版本，取不到当日生效版本失败
  - ref: INV-105
    text: 审批中的请假不汇入，批准后计入下月更正行并标原月份
  authority:
    ref: raci:AGG-97/生成月度考勤
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 员工ID + 月份（已生成无操作；已确认或已锁定不重生成）
  emits: （内部）
  used_by:
  - PRC-118 第 1 步
  orphan: false
  source_part: vs13att
- name: 员工确认
  aggregate: AGG-97
  entity: monthly_attendance_confirmations
  kind: human
  source: 聚合稿 AGG 命令列
  params:
  - 月度考勤确认ID
  preconditions:
  - ref: INV-105
    text: 状态为已生成且在确认期限内；确认后不再重新生成
  - ref: 权限
    text: 仅本人；这是数据主体对自己事实的确认，不是审批
  authority:
    ref: raci:AGG-97/员工确认
    A:
      resolve: instance
      field: 员工
    R:
    - SH-E3
  idempotency_key: 月度考勤确认ID（已确认无操作）
  emits: 月度考勤已确认
  used_by:
  - PRC-118 第 2 步
  orphan: false
  source_part: vs13att
- name: 重新生成月度考勤
  aggregate: AGG-97
  entity: monthly_attendance_confirmations
  kind: automatic
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：重新生成月度考勤，regenerate_monthly_attendance）
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-97 无此命令
  params:
  - 月度考勤确认ID
  preconditions:
  - ref: INV-105
    text: 仅已生成（未确认、未锁定）可重新生成，依据最新考勤、请假、加班重新汇总，幂等
  authority:
    ref: raci:AGG-97/重新生成月度考勤
    A:
      resolve: instance
      field: 员工
    R:
    - system
  idempotency_key: 月度考勤确认ID + 数据版本（同一数据重算结果相同）
  emits: （内部）
  used_by:
  - PRC-118 第 6 步
  orphan: false
  source_part: vs13att
- name: 默认确认月度考勤
  aggregate: AGG-97
  entity: monthly_attendance_confirmations
  kind: automatic
  name_status: 〔缺〕沿用分片提议名（vs13.notes.md 新用语：默认确认月度考勤，confirm_monthly_attendance_by_default）；取代分片早稿「代员工确认」
  source: 分片 vs13.notes.md 新用语；聚合稿 AGG-97 无此命令
  params:
  - 月度考勤确认ID
  - 默认确认原因（逾期未确认 / 已离职）
  preconditions:
  - ref: R-e
    text: 确认期限届满仍未确认，或人员当月已离职（账号已吊销本人无法确认）；按生成结果默认确认并留存标记与审计
  - ref: 状态
    text: 月度考勤为已生成
  authority:
    ref: raci:AGG-97/默认确认月度考勤
    A:
      resolve: type
      role: SH-E6
      function: 人力（考勤）
    R:
    - system
  idempotency_key: 月度考勤确认ID（已确认无操作）
  emits: 月度考勤已确认
