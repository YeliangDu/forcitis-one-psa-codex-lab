# 权责对照表片段（finance 组；提议稿，依据 RESPONSIBILITY_MATRIX_SPEC §A、APPROVAL_RULES、ADR-0026/0029/0032）
# 约定：boundary.limit_rule 为主规则，extra_rules 为同命令的其余 guard: approval 规则；draft_gap: true 表示聚合稿命令目录缺该命令（骨架标〔缺〕），命令名为本稿按骨架拟定。
# 审批节点挂接：骨架 platform 审批步无聚合命令，本稿挂在被其放行的命令上（生效供方协议、发起付款、核定费用报销、AGG-98 提交过账候选）。
# 他组聚合命令（AGG-80 预算占用、释放预算占用）不在本片段，见 notes。
# 修后（2026-10-16）：aggregate 引擎的审批 A 改为类型级 SH-M1（PRC-100、101、102、104、105、77 提交申报、65 开立与销户）；platform.approval 的 手工凭证、分摊规则、资产处置 A 改为实例级 费用归属对象.责任人；新增 释放履约额度（draft_gap）。
# S-29/S-30 补（2026-10-16）：新增命令的 A 行（draft_gap: true 待聚合稿回补）；AGG-87 开立、销户 A 改为财务负责人，确认开立、解冻、确认销户 A 为类型级 SH-M1。
# S-31 / S-36 补（2026-10-16）：新增命令的 A 行；A 的 role 只写 SH- 编号，职能名写 function（S-36 ①）；AGG-40 生效分摊规则版本改实例级（S-36 ②）；AGG-53 付款审批挂「发起付款」，登记银行结果不是审批对象（S-36 ②）。
