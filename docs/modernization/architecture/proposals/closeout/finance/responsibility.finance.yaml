roles:
  SH-E2:
    positions:
    - 待岗位体系定
    note: 项目经理：供方协议起草、生效、结算、终止，分包变更提出与生效，供方履约确认的经办人；多数情形其实例级 A 即其本人所负责的项目，责任人是本人时走 AR-11
  SH-E3:
    positions:
    - 待岗位体系定
    note: 设计师和顾问：提交费用报销、占用进项发票入账的发起人（R）；报销的知会对象
  SH-E6:
    positions:
    - 待岗位体系定
    note: 职能人员（财务部分）。本组 SH-E6 承担的职责过粗，建议岗位重梳时拆为：成本会计（试算人工成本分配、确认人工成本分配、编制分摊规则版本、批准分摊规则版本、生效分摊规则版本、试算分摊运行、生效分摊运行）；应付会计（提交应付利润、发起付款、核定费用报销）；出纳（登记银行结果、登记付款失败、开立资金账户、冻结资金账户、销户资金账户）；总账会计（登记出资认缴、登记出资实缴、登记出资退回、草拟利润分配、登记利润分配支付、发起关账、退回开放、开放第 13 期、发起年末关账、登记第 13 期启用、起草科目表版本、发布科目表版本、起草映射表版本、发布映射表版本、起草授权表版本、发布授权表版本、处理待处理队列、推送与重投、制单手工凭证、复核手工凭证、提交过账候选、生成期末结转运行、登记对账差异）；报表会计（编制报表行定义版本）；税务会计（登记进项发票、查验进项发票、确认进项发票用途、进项转出、生成申报、提交申报、登记缴款、更正申报）；资产会计（登记公司资产、处置资产）。同一人不得兼任的组合见各条 segregation（出纳 ≠ 付款发起人；制单 ≠ 复核；起草 ≠ 批准；发起关账 ≠ 确认关账）
  SH-M1:
    positions:
    - 待岗位体系定
    note: 管理层：骨架中作财务负责人一级的占位（确认关账、确认年末关账、签字接受差异、生效报表行定义版本），待 F-01 定为具体职责后改为 财务负责人；另：确认开立资金账户、解冻资金账户、确认销户资金账户（S-29 SQ-42，类型级 A）
  SH-O1:
    positions:
    - 待岗位体系定
    note: 股东和合伙人：利润分配决议（线下决议，由 SH-E6 登记）；出资相关事项的当事方
  财务负责人:
    positions:
    - 待岗位体系定
    note: 职责名（非 SH- 角色）：对账务、过账、关账、税务、资金、成本核算类型级业务负责；本组全部类型级 A 的默认持有者，与 SH-M1 的占位关系待 F-01
  采购与分包负责人:
    positions:
    - 待岗位体系定
    note: 职责名（非 SH- 角色，待用户确认是否单设）：对供方协议完成、履约额度等系统自动命令负责
