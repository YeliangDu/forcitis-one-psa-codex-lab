    added_in: closeout
    desc: 已批准、尚未用尽的事前申请由申请人主动关闭；用尽由报销引用累计到额度时置位，属 PRC-87 回补（S31-接缝-3）
    permission: 费用事前申请.关闭
    page: 费用事前申请详情页
    audit: true
    decision:
    - when: 事前申请不是已批准状态
      goto: end
      outcome: 已拒收（状态不符）
      alert: true
    - when: otherwise
      goto: end
      outcome: 已关闭
  - actor: system
    where: automatic
    command: 驳回费用事前申请
    aggregate: AGG-130
    added_in: closeout
    desc: 审批已驳回后置费用事前申请已驳回，通知申请人
    decision:
    - when: otherwise
      goto: end
      outcome: 已驳回
    cross_bc:
