    branch: 冲销
    added_in: closeout
    evidence:
    - 冲销依据（更正说明、原运行引用）
    desc: 审批通过后经 B-16 冲销并重过账（INV-95）；所属期间已关账的不再冲原运行，差额进下期运行（ADR-0045 决定 2）；冲销后本期可再跑一次有效运行（INV-89、90、109 的「一次有效」按冲销后失效计）
    decision:
    - when: 原运行所属期间已关账，不再冲原运行，差额进下期运行
