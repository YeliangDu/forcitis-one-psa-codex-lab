    decision:
    - when: 目标期间已关账，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 分摊合计不等于池金额
      goto: 1
      rule: INV-90
    - when: otherwise
      goto: end
      outcome: 分摊已生效
    permission: 成本.分摊运行生效
    page: 分摊运行生效页
    audit: true
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
  notes: 冲销按原比例（冲销命令缺，见结构问题）。试算后确认无超时或退回分支，按非人工编排（⑥a 评审 M1）。管理口径运行不过账，只受期间闸门约束。
- id: PRC-99
