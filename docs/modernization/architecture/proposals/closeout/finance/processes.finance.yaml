    permission: 供方协议.结算
    page: 供方协议详情页
    cross_bc:
    - mode: api
      direction: in
      bc: B-29
      name: 读供方协议状态
    metric_event: true
    audit: true
  - actor: SH-E2
    where: in_system
    evidence:
    - 终止原因与结算结论（Q10）
    command: 终止供方协议
    aggregate: AGG-55
    branch: 终止
    emits:
    - 供方协议已终止
    desc: 含未结算即结项时的结算结论（Q10）
    decision:
    - when: otherwise
      goto: end
      outcome: 已终止
    permission: 供方协议.终止
    page: 供方协议详情页
    cross_bc:
    - mode: api
      direction: in
      bc: B-29
      name: 读供方协议状态
    pending:
    - Q10
    metric_event: true
    audit: true
  notes: 结项编排经 api 读状态，事件无业务订阅方。步骤 1 的三个出口是本稿补写，v1 只有完成条件一个判断。
- id: PRC-77
  name: 申报并缴纳增值税、附加税与企业所得税
  type: business
  trigger:
    type: time
    desc: 法定申报期（P-39）
  triggers:
  - type: time
    name: 法定申报期（P-39）按法人与所属期触发
  stages:
  - VS-06.1
  owner_bc: B-23
  human_orchestration: false
  migration: 在途（已生成未提交、已提交未缴款）的申报投产前办结；历史申报与缴款是否迁入、来源（税务端或 U8C）由数据模型组按 R-09 定；AGG-90 到申报阶段再建（D-7），此前本流程不可用
  scope: 按纳税法人的数据范围（财务岗位）
  outcomes:
  - 已缴款
  - 已拒收
  - 过账被拒收
  scenarios:
  - PRC-77-S01
  - PRC-77-S02
  - PRC-77-S03
  - PRC-77-S04
  - PRC-77-S05
  - PRC-77-S06
  roles:
  - id: SH-E6
    as: performer
  - id: SH-R2
    as: external
  steps:
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-46
    - AGG-84
    - AGG-81
    desc: 读销项发票、分录余额与所属期
    decision:
    - when: 读不到销项发票、分录余额或所属期 → 拒收并告警
      goto: end
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 税务申报.查看
    page: 税务申报工作台
    cross_bc:
    - mode: api
      direction: out
      bc: B-08
      name: 读销项发票
    - mode: api
      direction: out
      bc: B-20
      name: 读分录余额
    - mode: api
      direction: out
      bc: B-19
      name: 读所属期
    pending:
    - ADR22-差异类
    legal_entity: 纳税法人
  - actor: SH-E6
    where: in_system
    command: 生成申报
    aggregate: AGG-90
    decision:
    - when: otherwise
      goto: 3
    permission: 税务申报.生成
    page: 税务申报工作台
    legal_entity: 纳税法人
    timeout:
      after: P3D
      relative_to: 法定申报期截止日（前）
      escalate_to: SH-M1
      interrupting: false
      pending:
      - T-01
    audit: true
  - actor: SH-E6
    where: external:税务
    evidence:
    - 申报回执（回执编号、受理状态、回执时刻）
    command: 提交申报
    aggregate: AGG-90
    emits:
    - 申报已提交
    decision:
    - when: 申报端未返回回执（不可达）→ 告警，重新提交
      goto: 3
      alert: true
    - when: 申报端回执退回或需更正
      goto: 5
    - when: otherwise
      goto: 4
    permission: 税务申报.提交
    page: 税务申报工作台
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 申报端提交
    metric_event: true
    audit: true
  - actor: SH-E6
    where: external:税务
    evidence:
    - 完税凭证（缴款书或扣款回单）
    command: 登记缴款
    aggregate: AGG-90
    emits:
    - 税款已缴纳
    decision:
    - when: otherwise
      goto: 6
    permission: 税务申报.登记缴款
    page: 税务申报工作台
    metric_event: true
    audit: true
  - actor: SH-E6
    where: in_system
    command: 更正申报
    aggregate: AGG-90
    branch: 更正
    decision:
    - when: otherwise
      goto: 3
    permission: 税务申报.更正
    page: 税务申报工作台
    audit: true
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-90
    calls: PRC-92
    desc: 税费过账
    period_gate: true
    decision:
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已缴款
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 纳税法人
  notes: 财务复核、申报端回执、更正申报无退回超时，按非人工编排（⑥a 评审 M1）。R-29 类问题：v1 的 reviewer 角色没有对应步骤，已删。税款资金支出是否走 PRC-75 见接缝问题。
- id: PRC-87
  name: 提交、核定并确认报销应付
  trigger:
    type: human
    desc: 员工提交费用报销
  stages:
  - VS-08.2
  owner_bc: B-12
  human_orchestration: true
  human_note: 报销审批、驳回释放占用
  migration: 历史：全部已结报销及明细迁入（U-4，来源 A8 日常 / 差旅 / 业务招待报销单），经迁入用例写入，不启动审批、不发事件、不生成分录（§14.2 M7）。在途：审批中的单据投产前办结；投产时仍未办结的退回员工在新系统重提；已核定未付的迁为「已核定」并同时迁入未结应付（AGG-52 open_items）
  scope: 报销人看本人单据；审批人经审批待办看所审单据；财务按所负责法人的数据范围（ADR-0026）
  segregation:
  - 报销人 ≠ 审批人（责任人就是报销人本人时按 AR-11 处理，待用户定）
  - 报销人 ≠ 核定人
  - 审批人 ≠ 核定人
  triggers:
  - type: human
    name: 员工提交费用报销
  outcomes:
  - 已核定
  - 已退回
  - 已撤回
  - 已拒收（项目已关闭）
  - 已拒收（发票不可用）
  scenarios:
  - PRC-87-S01
  - PRC-87-S02
  - PRC-87-S03
  - PRC-87-S04
  - PRC-87-S05
  - PRC-87-S06
  - PRC-87-S07
  - PRC-87-S08
  - PRC-87-S09
  - PRC-87-S10
  - PRC-87-S11
  - PRC-87-S12
  roles:
  - id: SH-E3
    as: initiator
  - id: SH-E2
    as: approver
  - id: SH-E1
    as: approver
  - id: SH-M1
    as: approver
  - id: SH-E6
    as: reviewer
  steps:
  - actor: SH-E3
    where: in_system
    read: true
    reads:
    - AGG-19
    - AGG-10
    - AGG-62
    desc: 选择报销类型（日常 / 差旅 / 业务招待），读项目或商机与人员；差旅可带出差申请（G-F3）、出差补贴行按补贴标准生成（G-F7），业务招待引用事前申请（G-F1）
    decision:
    - when: 所归属项目已结项、已终止或已取消（INV-39）
      goto: end
      outcome: 已拒收（项目已关闭）
      rule: INV-39
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 读项目
    - mode: api
      direction: out
      bc: B-03
      name: 读商机
    - mode: api
      direction: out
      bc: B-13
      name: 读人员
    permission: 报销.填写
    page: 报销单编辑页
    pending:
    - G-F1
    - G-F3
    - G-F7
  - actor: SH-E3
    where: external:税务
    evidence:
    - 电子发票文件或纸质发票扫描件
    - 查验结果与查验时刻（税务平台，或分贝通推送的验真结果）
    command: 占用进项发票入账
    aggregate: AGG-89
    desc: 占用第 1 步：提交前占用，已占用则拒（INV-74）。发票来源两种：员工录入并经税务平台查验；分贝通垫资发票（员工在分贝通 APP 上传，验真结果随发票推送）。补贴行不需要发票
    decision:
    - when: 发票查验不合规（INV-75）或已被占用（INV-74）
      goto: end
      outcome: 已拒收（发票不可用）
      rule: INV-74、INV-75
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: api
      direction: out
      bc: B-23
      name: 占用进项发票入账
    permission: 报销.填写
    page: 报销单编辑页（发票录入与查验）
  - actor: SH-E3
    where: automatic
    command: 预算占用
    aggregate: AGG-80
    emits:
    - BudgetReserved
    desc: 占用第 2 步；预算不足只预警不拦截（INV-102 定为预警，用户 F-Q2，intent 2026-10-16-162821）
    decision:
    - when: 可用预算不足（只预警，审批待办标「超预算」）
      goto: 4
      rule: INV-102
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: api
      direction: out
      bc: B-18
      name: 预算占用
    notify:
    - to: SH-E1
      how: 审批待办中标注「超预算」
  - actor: SH-E3
    where: in_system
    evidence:
    - 票据影像（纸质原件另交财务，见第 6 步）
    command: 提交费用报销
    aggregate: AGG-59
    desc: 占用第 3 步；原始凭证要素齐全（INV-84）。占用中途失败按相反顺序补偿：第 3 步失败先释放预算占用再释放发票占用；第 2 步失败只释放发票占用
    decision:
    - when: 原始凭证要素不全（INV-84）
      goto: 8
      rule: INV-84
    - when: otherwise
      goto: 5
    permission: 报销.提交
    page: 报销单编辑页
    audit: true
    legal_entity: 报销人所在法人（任职口径）
    notify:
    - to: 审批人
      how: 企业微信待办
    withdraw:
      to: 8
      outcome: 已撤回
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 报销审批
    gap: G-02
    approval:
      engine: platform.approval
      doc_type: 费用报销审批
      approver: cost_object_owner
      multi_level: false
      escalation:
      - AR-01
      - AR-02
      - AR-06
      - AR-07
      - AR-11
      - AR-12
      why_human: 费用是否真实、是否为业务所需、金额是否合理，要对这笔费用负责的人判断；格式、发票真伪与重复、预算余额、项目状态、期间都已由规则拦截或预警，不靠审批
      on_reject: 8
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    permission: 报销.审批
    page: 审批待办（审批平台）
    audit: true
    timeout:
      after: n 个工作日（n 待定，按审批节点属性）
      escalate_to: 审批人上级
      interrupting: false
      rule: RULE-377、RULE-379、RULE-380、RULE-382
    notify:
    - to: SH-E3
      how: 驳回时企业微信消息
    pending:
    - F-Q1-阈值（AR-01、AR-02 的报销阈值）
    desc: 项目费用由项目经理批，非项目费用由部门负责人批（谁负责谁批）；超阈值等异常按 APPROVAL_RULES 加审（F-Q1 已改，用户原则 intent 163556）
    withdraw:
      to: 8
      outcome: 已撤回
  - actor: SH-E6
    where: in_system
    evidence:
    - 纸质原始凭证签收登记（签收人、签收时刻）；全电发票无纸质原件
    command: 核定费用报销
    aggregate: AGG-59
    emits:
    - 费用报销已核定
    desc: 确定所属期间；超事前预批额度 P-37 预警；B-09 订阅本事件，由事件策略 PRC-147 冲抵员工借款并按净额确认应付或置报销已付（S-24）
    cross_bc:
    - mode: event
      direction: out
      bc: B-09
      name: 费用报销已核定
    permission: 报销.核定
    page: 报销核定工作台
    audit: true
    legal_entity: 报销人所在法人（任职口径）
    metric_event: true
    notify:
    - to: SH-E3
      how: 企业微信消息：已核定
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-59
    calls: PRC-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    decision:
    - when: 所属期间已关账（自动落当前开放期间并标原期间）
      goto: end
      outcome: 已核定
      rule: ADR-0045 决定 2；INV-92
    - when: otherwise
      goto: end
      outcome: 已核定
    period_gate: true
    legal_entity: 报销人所在法人（任职口径）
    metric_event: true
  - actor: system
    where: automatic
    command: 释放预算占用
    aggregate: AGG-80
    branch: 驳回或补偿（占用中途失败）
    emits:
    - BudgetReleased
    desc: 驳回时同时释放预算占用（⑥a 评审 H5）；先预算后发票，与占用相反
    cross_bc:
    - mode: api
      direction: out
      bc: B-18
      name: 释放预算占用
  - actor: system
    where: automatic
    command: 驳回释放
    aggregate: AGG-89
    branch: 驳回或补偿（占用中途失败）
    desc: 释放发票占用
    decision:
    - when: otherwise
      goto: end
      outcome: 已退回
    cross_bc:
    - mode: api
      direction: out
      bc: B-23
      name: 驳回释放
    notify:
    - to: SH-E3
      how: 企业微信消息：已退回，可修改后重新提交
  notes: 报销核定后由 B-09 事件策略 PRC-147 冲抵借款并按净额确认应付（S-17、S-19、S-24）；报销「已付」由应付已结清经事件策略 PRC-133 置位，全额冲抵时由 PRC-147 置位；发票占用只在 B-12 提交前占用一次（G-17 已处理）。 报销各类情形与分贝通差旅的覆盖对照见 EXPENSE_COVERAGE.md；公司直付分贝通订单不走本流程（G-F2）。
