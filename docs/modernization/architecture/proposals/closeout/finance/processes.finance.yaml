  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I05 题；信息图现单列 OBJ-119，保留处理、审批及核对依据。"
- id: PRC-173
  name: 审批差旅超标订单
  type: business
  owner_bc: B-12
  stages:
  - VS-08.0
  added_in: closeout
  basis: S-31 SQ-28
  trigger:
    type: event
    desc: 差旅服务商推来超标订单待审批
  human_orchestration: true
  human_note: 超标审批、结果回写
  migration: 无在途实例迁入；投产时差旅服务商侧待审批的超标订单，投产前办结，不迁入；历史审批结果不迁
  scope: 审批人经审批待办看所审单据
  segregation:
  - 出差人 ≠ 超标订单审批人（责任人就是出差人本人时按 AR-11 处理，待用户定）
