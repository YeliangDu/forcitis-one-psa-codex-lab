      goto: end
      outcome: 非收入确认事实
    - when: 该事实的已配对结转已冲回过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已冲回（幂等）
    - when: 该事实没有已配对的成本结转
      goto: end
      outcome: 无需冲回
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 冲回所属期间已关账且该法人有开放期间，自动落当前开放期间并标原期间
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已冲回成本结转
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93
      outcome: 已拒收
      alert: true
      pending:
      - SQ-41
    - when: otherwise
      goto: end
      rule: INV-88
      outcome: 已冲回成本结转
    legal_entity: 承担法人
    audit: true
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactRestated
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    pending:
    - Q20
  notes: 既有边 B-07 → B-16；冲回继承上游不另审批，期间取上游实际落账期间（词表「自动冲回」释义）；INV-88 待定（Q20），定后重核配对口径。
