      pending:
      - U-27
    - when: 事实只记权责账簿（客户确认收入、成本转入等），无收付口径分录
      goto: end
      rule: D17-1
      outcome: 已记账无需推送
    - when: otherwise
      goto: 2
    notify:
    - to: SH-E6
      how: 企业微信告警（进待处理队列）
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactRestated
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
    reads:
    - AGG-127
    - AGG-129
    - AGG-82
    - AGG-85
    - AGG-94
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  - actor: system
    where: external:U8C
    command: 推送分录
    aggregate: AGG-84
    added_in: closeout
    legal_entity: 事实所属法人（推送到该法人在 U8C 的收付账套）
    evidence:
    - U8C 返回码与凭证号
    - 推送批次与校验和
    desc: U-8：U8C 继续做法定账，新系统把收付口径分录推送 U8C 收付账套，按月在 PRC-104 对账；推送须幂等（确定性凭证号或外部键），接口自带认证、走内网或专线（ADR-0022 决定 8）；失败进死信，由 PRC-135 重投；权责账簿不推送；粒度为按凭证（一个 AGG-84 实例）一次，幂等外部键按凭证（ADR-0022 决定 8）；批量只是调度循环与适配器传输细节，不进领域命令；首次推送自动，死信重投由
      PRC-135 人工选择后逐张沿用同一命令（S-31 SQ-16）；「已推送 → 已确认记账」不在本策略，由 PRC-104 对账读到 U8C 记账结果后登记（S-31 SQ-11）
    decision:
    - when: 该凭证已推送（幂等键相同），不重复投递
      goto: end
      outcome: 已推送
    - when: 凭证依赖的客商、部门、人员主数据尚未同步到 U8C，挂起待重投
      goto: end
      outcome: 已挂起待重投
      rule: 推送状态「挂起」，每日定时重投（S-29 SQ-50；不新增主数据已同步事件，只做当期）
    - when: U8C 拒收，带返回码进死信并当日告警
      goto: PRC-135
    - when: otherwise
      goto: end
      outcome: 已推送
    notify:
    - to: SH-E6
      how: 企业微信告警（死信，当日告警财务与运维）
    pending:
    - S-05
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 外部法定账推送
  migration: 在途：投产前待处理队列与死信须清空（关账前置检查，ADR-0022 决定 10），在途事实随迁入核对办结。历史：历史分录经迁入通道写入，不经本策略生成、不推送 U8C（U8C 已有历史账）；投产前最近两个已结期间重算比对（U-10）。
  notes: R-28：原备注「G1 期间银行、税费、固定资产、薪酬汇总走 ledger 内导入通道」默认了两步走，改为形态待 ADR22-G1G2（过渡 ADR 取代，S-05）；人工部分（待处理队列、重投）在单聚合维护 PRC-135。
  scenarios:
  - PRC-93-S01
  - PRC-93-S02
  - PRC-93-S03
  - PRC-93-S04
  - PRC-93-S05
  - PRC-93-S06
  - PRC-93-S07
  - PRC-93-S08
  - PRC-93-S09
  - PRC-93-S10
  - PRC-93-S11
  - PRC-93-S14
  cross_bc: []
  primary_object: OBJ-98
- id: PRC-94
  name: 制单并过账受控手工凭证
  trigger:
    type: human
    desc: 财务因调整、差异或年度审计调整制单
  stages: [VS-10.0]
  stages_note: 按判据①归 VS-10.0「执行记账结转」（SD-11 已批），结局「已提交过账」经 PRC-92、PRC-93 形成手工调整分录，对应该段「本期分录已记账」退出条件。
  owner_bc: B-20
  human_orchestration: true
  human_note: 制单、复核、审批，复核人不同于制单人
  migration: 在途：草稿、已复核、已审批但未提交过账的手工凭证，投产前办结（提交过账）或作废重做，不迁半成品。历史：已记账的手工凭证以分录迁入（理由与附件作证据迁入），走迁入通道，不触发复核与审批（ADR-0036）。
  scope: 按凭证所属法人的财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-E6
    as:
    - performer
    - reviewer
    rule: 制单人与复核人不得为同一人（INV-108）
  - roles:
    - SH-E6
    - SH-M1
    as:
    - performer
    - approver
    rule: 审批人不得是制单人或复核人；财务负责人一级用 SH-M1 占位（ADR-0022 决定 3「财务主管审批」，待 F-01）
  triggers:
  - type: human
    name: 财务因调整、差异或年度审计调整制单
  outcomes:
  - 已提交过账
  - 已拒收
  - 已撤回
  - 已作废
  - 期间关账中待重试
  roles:
  - id: SH-E6
    as: performer
  - id: SH-E6
    as: reviewer
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    command: 制单手工凭证
    aggregate: AGG-98
    permission: 总账.制单手工凭证
    page: 手工凭证编辑页
    audit: true
    legal_entity: 凭证所属法人
    desc: 必须有理由与附件；只影响一个账簿的须带差异类别代码；触及控制科目须在授权表内；年度审计调整类才可显式指定落账期间且只能指定第 13 期（INV-108）
    decision:
    - when: 制单人放弃，作废草稿
      goto: 5
      rule: 草稿可作废（S-29 SQ-46）
    - when: 缺理由或附件，或触及控制科目而来源通道不在授权表（INV-98）
      goto: end
      rule: INV-108
      outcome: 已拒收
      alert: true
    - when: 只影响一个账簿而未带差异类别代码
      goto: end
      rule: INV-97
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    pending:
    - A1-02
    - P-003
    - S-06
    - ADR46-P3
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
  - actor: SH-E6
    where: in_system
    command: 复核手工凭证
    aggregate: AGG-98
    permission: 总账.复核手工凭证
    page: 手工凭证复核页
    audit: true
    notify:
    - to: SH-E6
      how: 企业微信待办（待复核，复核人另行指派）
    decision:
    - when: 复核人与制单人为同一人，命令被拒，改由他人复核
      goto: 2
      rule: INV-108
    - when: 复核不通过，退回制单
      goto: 1
      rule: INV-108
    - when: otherwise
      goto: 3
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 手工凭证审批
    approval:
      engine: platform.approval
      doc_type: 手工凭证审批
      approver: cost_object_owner
      multi_level: false
      why_human: 手工凭证绕开业务事实直接记账，调整理由是否成立、科目与金额是否恰当、是否属于允许手工处理的类型，要对账负责的人判断；授权表范围、借贷平衡、必填的理由与附件、差异类别、期间、制单与复核分离都已由规则拦截，不靠审批
      on_reject: 1
      escalation_rules:
      - AR-01
      - AR-02
      - AR-06
      - AR-11
      - AR-12
    permission: 总账.审批手工凭证
    page: 审批待办页（手工凭证审批）
    audit: true
    notify:
    - to: 审批人
      how: 企业微信待办
    decision:
    - when: 审批人与制单人或复核人为同一人，驳回
      goto: 1
    - when: 审批驳回，退回制单
      goto: 1
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    desc: 无费用或业务归属对象，审批责任人取「凭证所属法人的财务负责人」（实例级解析，字段落点交 one-data，S-29 SQ-51）；冲销或红冲已过账事实、超阈值等异常按 APPROVAL_RULES 加审（AR-01 的加审对象即财务负责人本人时由 AR-11 上提）
    pending:
    - F-01
    - F-Q1-阈值（AR-01、AR-02 的手工凭证阈值）
    - AR-11
    withdraw:
      to: end
      outcome: 已撤回
    timeout:
      after: P3D
      escalate_to: 审批人上级
      interrupting: false
      rule: RULE-377、RULE-379、RULE-380、RULE-382
      pending:
      - T-01
  - actor: SH-E6
    where: in_system
    command: 提交过账候选
    aggregate: AGG-98
    emits:
    - 手工凭证已提交过账
    calls: PRC-92
    permission: 总账.提交手工凭证过账
    page: 手工凭证详情页（提交过账）
    audit: true
    period_gate: true
    legal_entity: 凭证所属法人
    metric_event: true
    desc: 年度审计调整类带显式落账期间（仅第 13 期）；显式期间未开放即拒并告警，不改落其他期间（ADR-0046 第 3 项第 2 条）；其余按业务日期过期间闸门，已关账则路由到开放期间并标原期间（PRC-92）
    decision:
    - when: 显式指定的落账期间未开放（已关账、关账中或未启用），拒收并告警
      goto: end
      rule: INV-92；S-31 SQ-32
      outcome: 已拒收
      alert: true
    - when: 过账管道拒收（借贷不平、法人不一致、无开放期间），拒收并告警
      goto: end
      rule: INV-93；拒收记录由 PRC-158 处置
      outcome: 已拒收
      alert: true
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，凭证保持待提交，待确认关账或退回开放后再提交
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 业务日期所在期间已关账：规则提示「将落当前开放期间并标原期间」，制单人确认后提交，不设审批
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已提交过账
    - when: otherwise
      goto: end
      outcome: 已提交过账
    notify:
    - to: SH-E6
      how: 企业微信告警（过账被拒收）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    pending:
    - P-001
    - P-004
  - actor: SH-E6
    where: in_system
    command: 作废手工凭证草稿
    aggregate: AGG-98
    branch: 放弃
    added_in: closeout
    desc: 只有草稿可作废，已复核、已审批的凭证不可作废（S-29 SQ-46）；作废留痕（谁、何时、原因）
    decision:
    - when: otherwise
      goto: end
      outcome: 已作废
    permission: 总账.作废手工凭证草稿
    page: 手工凭证编辑页（作废）
    audit: true
    legal_entity: 凭证所属法人
  notes: 显式期间未开放即拒并告警，不改落其他期间（ADR-0046）。年度审计调整类的前提是有审计师提出调整，而用户已定无法定审计、只有内部审计，该类凭证是否仍存在、由谁提出调整待定（S-06、ADR46-P3）。
  scenarios:
  - PRC-94-S01
  - PRC-94-S02
  - PRC-94-S03
  - PRC-94-S04
  - PRC-94-S05
  - PRC-94-S06
  - PRC-94-S07
  - PRC-94-S08
  - PRC-94-S09
  - PRC-94-S10
  - PRC-94-S11
  - PRC-94-S12
  - PRC-94-S13
  - PRC-94-S14
  - PRC-94-S15
  - PRC-94-S16
  - PRC-94-S17
  - PRC-94-S18
  - PRC-94-S19
  - PRC-94-S20
  - PRC-94-S21
  - PRC-94-S22
  - PRC-94-S23
  - PRC-94-S24
  primary_object: OBJ-98
- id: PRC-95
  name: 执行期末结转
  trigger:
    type: time
    desc: 月末业务过账完成后
  stages: [VS-10.0]
  stages_note: 按判据①归 VS-10.0「执行记账结转」（SD-11 已批），结局「已过账」经 PRC-93 形成期末结转分录，对应该段「本期分录已记账」退出条件。
  owner_bc: B-20
  human_orchestration: false
  migration: 在途：投产日所在期间的首次结转在新系统生成，无在途。历史：只迁已记账的结转分录，不重建运行单据（历史期间为终态）；投产前最近两个已结期间用模板重算比对（U-10）。
  scope: 按法人（法人 × 期间 × 模板版本）
  triggers:
  - type: time
    name: 月末业务过账完成后，到点创建待办（platform.scheduling）
  - type: human
    name: 已过账的期末结转运行需更正，财务发起冲销
    entry: 4
  outcomes:
  - 已过账
  - 已有有效运行
  - 已拒收
  - 期末结转已冲销
  - 冲销已驳回
  - 差额进下期运行
  - 已撤回
  - 过账被拒收
  - 期间关账中待重试
  roles:
  - id: SH-E6
    as: performer
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-128
    - AGG-84
    desc: 读本期分录与余额，作为结转依据
    command: 读取本期分录与余额
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  - actor: SH-E6
    where: in_system
    command: 生成期末结转运行
    aggregate: AGG-99
    permission: 总账.生成期末结转运行
    page: 期末结转运行页
    period_gate: true
    audit: true
    legal_entity: 结转所属法人
    notify:
    - to: SH-E6
      how: 企业微信待办（月末结转）
    desc: 每（法人，期间，模板）只有一次有效运行（INV-109）；已过账的只能冲销重做；模板按版本生效；已过账结转的更正命令聚合稿缺（SQ-17 范围扩到 AGG-99）
    decision:
    - when: 本法人本期间本模板已有有效运行
      goto: end
      rule: INV-109
      outcome: 已有有效运行
    - when: 期末结转运行按（法人, 期间, 模板）显式指定期间，所指期间未开放（已关账或关账中），拒绝并告警（INV-92 写法，不是例外）
      goto: end
      rule: INV-92；ADR-0045 守护第 3 条；S-31 SQ-32
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 3
    pending:
    - P-001
    - P-002
    - ADR46-P3
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-99
    emits:
    - 期末结转已过账
    calls: PRC-92
    period_gate: true
    legal_entity: 结转所属法人
    metric_event: true
    desc: 损益结转、未分配利润等期末凭证经单一过账管道
    decision:
    - when: 过账管道拒收（借贷不平、无开放期间），拒收并告警
      goto: end
      rule: INV-93；拒收记录由 PRC-158 处置
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已过账
    notify:
    - to: SH-E6
      how: 企业微信告警（结转被拒收）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 期末结转运行冲销审批
    branch: 冲销
    added_in: closeout
    desc: 冲销已过账的期末结转运行属冲销已过账事实，按 APPROVAL_RULES AR-06 加审（S-31 SQ-17）
    approval:
      engine: platform.approval
      doc_type: 期末结转运行冲销审批
      approver: cost_object_owner
      multi_level: false
      why_human: 已过账的期末结转运行是否确属有误、应冲销还是另行更正，要对这笔成本负责的人判断；冲销只能取反加新事实（INV-95）、重做借贷平衡与期间由规则守，不靠审批
      on_reject: end
      on_reject_outcome: 冲销已驳回
      escalation_rules:
      - AR-06
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    permission: 总账.冲销审批
    page: 审批待办（审批平台）
    audit: true
    withdraw:
      to: end
      outcome: 已撤回
    pending:
    - AR-06
  - actor: SH-E6
    where: in_system
    command: 冲销期末结转运行
    aggregate: AGG-99
    branch: 冲销
    added_in: closeout
    evidence:
    - 冲销依据（更正说明、原运行引用）
    desc: 审批通过后经 B-16 冲销并重过账（INV-95）；所属期间已关账的不再冲原运行，差额进下期运行（ADR-0045 决定 2）；冲销后本期可再跑一次有效运行（INV-89、90、109 的「一次有效」按冲销后失效计）
    decision:
    - when: 原运行所属期间已关账，不再冲原运行，差额进下期运行
      goto: end
      rule: ADR-0045 决定 2
      outcome: 差额进下期运行
    - when: 该运行已冲销过
      goto: end
      rule: 状态机：仅已过账可冲销
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 6
    permission: 总账.冲销
    page: 期末结转运行冲销页
    audit: true
    metric_event: true
    legal_entity: 被结转法人
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
  - actor: system
    where: automatic
    command: 冲销并重过账
    aggregate: AGG-77
    calls: PRC-92
    branch: 冲销后过账
    added_in: closeout
    period_gate: true
    desc: 经 PRC-92 更正入口冲销原期末结转运行的过账事实
    decision:
