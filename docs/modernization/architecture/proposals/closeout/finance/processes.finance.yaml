- id: PRC-98
  name: 分摊间接成本
  type: business
  trigger:
    type: time
    desc: 月末
  stages: [VS-10.0]
  stages_note: 按判据①归 VS-10.0「执行记账结转」（SD-11 已批），结局「分摊已生效」经 PRC-92 过账、PRC-93 生成分摊分录，对应该段「本期分录已记账」退出条件；「分摊已冲销」经冲销并重过账同样落在本段。
  owner_bc: B-07
  human_orchestration: false
  migration: 在途：未生效的试算不迁，投产后重新试算；历史：不作为单据迁入，结果由迁入的权责事实承载（U-3，R-08），投产前最近两个已结期间按 U-10 重算比对
  scope: 财务职能，按承担法人数据范围
  triggers:
