    desc: 试算前经 api 读 B-16，核对本期工时与薪酬事实齐备（P-41 预警在试算时给出）；按月奖金计提不在本流程：由 B-15 计算并按法人与项目提交奖金计提记账事实（S-6，FINANCE_S4_S5_RULINGS_2026-10-22 附三），B-07 只经 B-16 读；不订阅逐笔 BusinessFactAttributed（PRC-55、161 的触发不受影响，S-31 SQ-20）；只分配已锁定工时
