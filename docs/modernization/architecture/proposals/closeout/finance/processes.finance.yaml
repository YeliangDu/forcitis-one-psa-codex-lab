      doc_type: 纳税申报复核
      approver: SH-M1
      multi_level: false
      why_human: 申报内容的税额口径、差异调整与优惠适用是否正确要有人对税务合规负责判断，提交后更正有滞纳金与信用风险；销项发票与分录余额的勾稽由规则核对
      approver_basis: 税务申报复核是对法人税务合规负责的职责，不归属某个费用或业务对象，取财务负责人（类型级）
