  - 期间关账中待重试
  steps:
  - actor: system
    where: automatic
    command: 冲回成本结转
    aggregate: AGG-43
    emits:
    - 成本结转已过账
    post: true
    calls: PRC-92
    desc: 订阅 B-16 的 BusinessFactRestated，只取收入确认类事实，据原单回冲已配对的成本结转（ADR-0016 决定 4）；其余类型的更正落开放期间并标原期间，下期运行自然取到，不反应（ADR-0045 决定 2）
