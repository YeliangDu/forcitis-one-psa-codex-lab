  stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；VS-15.1 草稿、VS-15.2 已生效、VS-15.3 旧版本被取代，均由本流程完成（判据推出 VS-15.1、VS-15.2）；原支撑理由：分摊规则版本是配置，供 VS-10 的分摊运行使用，本身不造出阶段退出条件（#421）"
  owner_bc: B-07
  human_orchestration: false
  migration: 在途：未批准草稿不迁，投产前办结或重编；历史：已生效版本全部迁入（被引用版本只追加不可改），至少覆盖 U-10 重算所需的最近两个已结期间（R-08）
  scope: 财务职能，按承担法人数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    rule: 编制人不得同时为批准人（审批人不得与执行人同为 SH-E6）
  triggers:
  - type: human
    name: 财务编制分摊规则版本（按期间首日发布）
  outcomes:
