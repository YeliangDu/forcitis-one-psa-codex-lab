      direction: out
      bc: B-19
      name: 发起关账
  - actor: SH-M1
    where: in_system
    command: 确认关账
    aggregate: AGG-81
    emits:
    - AccountingPeriodClosed
    period_gate: true
    audit: true
    metric_event: true
    legal_entity: 被关账法人
    permission: 月结.确认关账
    page: 月结关账页（确认）
    approval:
      engine: aggregate
      doc_type: 月结关账确认
      approver: SH-M1
      multi_level: false
      why_human: 关账后期间不可重开、之后的更正只能落开放期间，确认前须有人对账务完整性负责并复核检查结果；前置检查（队列、死信、期末结转、借贷平衡）与发起、确认分离已由聚合规则守，剩下的是对账务是否可以定稿的判断
      approver_basis: 关账确认是对该法人账簿期间负责的职责，不归属某个费用或业务对象，故不按 cost_object_owner 解析，取财务负责人
      on_reject: 4
    desc: R-15：确认关账是聚合命令，发起人、确认人写入审计记录；确认时重跑前置检查；已关账是终态，之后的更正落开放期间并标原期间（ADR-0045 决定 2）；确认关账时带前置检查结果摘要，B-19 按 ADR-0046 第 8 项第 5 条写审计记录（发起人、确认人、检查摘要）；不另建检查结果聚合（S-31 SQ-12）
    decision:
    - when: 确认人与发起人为同一人，命令被拒，改由他人确认
      goto: 3
