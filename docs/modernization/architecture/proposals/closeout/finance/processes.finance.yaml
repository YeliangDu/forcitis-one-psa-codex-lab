    period_gate: true
    audit: true
    metric_event: true
    legal_entity: 被关账法人
    permission: 月结.确认年末关账
    page: 年末关账页（确认）
    approval:
      engine: aggregate
      doc_type: 年末关账确认
      approver: SH-M1
      multi_level: false
      why_human: 年末两期同时定稿后年度不可重开，确认前须有人对年度账务完整性负责；前置检查与发起、确认分离已由聚合规则守，剩下的是年度账务可否定稿的判断
      approver_basis: 年末关账确认是对该法人年度账簿负责的职责，不归属某个费用或业务对象，故不按 cost_object_owner 解析，取财务负责人
      on_reject: 7
    desc: R-15：聚合命令；两期同事务原子关账（INV-99），各发一次事件，第 13 期的事件不触发 L2 冻结；不设强制关账期限，只在财务设定的日期后提醒（ADR-0046 第 5 项第 5 条）
    decision:
    - when: 确认人与发起人为同一人，命令被拒，改由他人确认
      goto: 6
    - when: 确认时前置检查未通过
      goto: 7
      rule: INV-100
    - when: otherwise
      goto: end
      outcome: 年末已关账
    timeout:
      after: 配置：财务设定的关账提醒日
      escalate_to: 审批人上级
      interrupting: false
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 确认年末关账
    - mode: event
      direction: out
      bc: B-20
      name: AccountingPeriodClosed
    - mode: event
      direction: out
      bc: reporting
      name: AccountingPeriodClosed
    - mode: api
      direction: out
      bc: platform.audit
      name: 写关账审计记录（检查结果摘要、发起人、确认人）
    pending:
    - F-01
    - P-001
    - P-002
    - P-004
  - actor: SH-E6
    where: in_system
    command: 退回开放
    aggregate: AGG-81
    branch: 前置检查未通过
    added_in: closeout
    audit: true
    legal_entity: 被关账法人
    permission: 月结.退回开放
    page: 年末关账页（退回开放）
    desc: 两期同时退回开放；退回不属于重开（ADR-0045 决定 1）
    decision:
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 退回开放
  - actor: SH-E6
    where: in_system
    command: 开立会计年度
    aggregate: AGG-81
    branch: 开立会计年度
    added_in: closeout
    period_gate: true
    legal_entity: 被开立法人
    audit: true
    desc: 按法人一次生成该年度第 1–12 期、状态开放；第 13 期仍由「开放第 13 期」（S-30 ②）；下一年度未开立的年末预警入聚合稿 §1.3 策略
    decision:
    - when: 该法人该年度已开立（幂等）
      goto: end
      rule: INV-94
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 会计年度已开立
    permission: 会计年度.开立
    page: 会计年度开立页
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 开立会计年度
  notes: 未启用的年度 12 月照常关账；12 月关账后启用状态锁定（INV-104）。年度损益结转与「本年利润 → 未分配利润」的年度结转放在哪一期待 P-001、P-002、P-004（ADR-0046 移交 P-3、P-4）。
