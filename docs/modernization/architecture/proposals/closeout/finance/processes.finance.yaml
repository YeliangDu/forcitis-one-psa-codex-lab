      goto: end
      outcome: 已人工处置
    - when: otherwise
      goto: end
      outcome: 已人工处置
    permission: 应付.人工处置核销差异
    page: 应付核销差异处置页
    audit: true
    legal_entity: 应付所属法人
  notes: 由原 PRC-75 步骤 6 拆出（⑥a 评审 M6）。 核销差异转人工处置（步骤 2，S-29 SQ-49）。
  stages_note: 事件策略按触发状态「付款已成功」归段（#421 判据②），该状态是 VS-05.5、VS-08.3、VS-13.5 的退出条件
