  primary_object: OBJ-91
- id: PRC-131
  name: 核销应付款项
  type: event_policy
  owner_bc: B-10
  stages:
  - VS-05.5
  - VS-08.3
  - VS-13.5
  triggers:
  - type: event
    name: 付款已成功
    publisher: B-10（同 BC，AGG-53）
  migration: 无在途实例；迁入的付款事实不触发本策略；投产时已成功未核销的付款在投产前跑完本策略
  outcomes:
  - 应付已结清
  - 应付部分核销
  - 重复事件已忽略
  - 已人工处置
  scenarios:
  - PRC-131-S01
  - PRC-131-S02
  - PRC-131-S03
  - PRC-131-S04
  - PRC-131-S05
  - PRC-131-S06
  - PRC-131-S07
  - PRC-131-S08
  steps:
  - actor: system
    where: automatic
    command: 核销应付
    aggregate: AGG-52
    emits:
    - 应付已核销
    - 应付已结清
    desc: 订阅付款已成功，把占用转为核销（R-03）；未付余额为零才发应付已结清，部分付款只发应付已核销；核销占用与分配行不一致时付款已成功而应付未核销，转人工处置核销差异（S-29 SQ-49）
    decision:
    - when: 该付款已核销过（事件重复，按付款 ID 幂等）
      goto: end
      outcome: 重复事件已忽略
    - when: 核销占用不存在或与分配行不一致（INV-77a）→ 告警并转人工处置
      goto: 2
      rule: INV-77a
      alert: true
    - when: 核销后未付余额大于零
      goto: end
      outcome: 应付部分核销
    - when: otherwise
      goto: end
      outcome: 应付已结清
    cross_bc:
    - mode: event
      direction: out
      bc: B-15
      name: 应付已结清
    - mode: event
      direction: out
      bc: B-12
      name: 应付已结清
    legal_entity: 应付所属法人
    audit: true
    outcome: 应付已结清
