    where: in_system
    command: 试算人工成本分配
    aggregate: AGG-41
    desc: P-41 有工时无薪酬、有薪酬无工时预警；按工时日期读员工当日的成本法人（当时值，ADR-0073 第 1 条），与项目承担法人比较，不一致的人工记员工成本法人、标「待内部结算」并列入跨法人清单（员工、项目、两边法人、金额、期间），项目看板照常归集并标注（LEB-04；部门换法人后项目不转，见交付执行 LEB-03）；试算按员工 × 日计价并分到项目，含三项：①加班计价（日期类型与是否已安排补休取自工时过账事实，过账时定格，S-4 裁定 1）：标准小时费率 = 当日日薪 ÷ 标准日工时（默认 7.5，按法人可配，FD-10）；工作日 min(H,8) 按 1 倍、超 8 小时部分按 1.5 倍，休息日未安排补休全天 2 倍、已安排补休全天 1 倍（补休当日不再计），法定节假日全天 3 倍（《劳动法》第三十六条、第四十四条，用户 FCQ-05，intent 2026-10-22-104551），按当日各项目工时占比分到项目；②已核定奖金调整行：B-15 核定时只在负债内部重分类（借 奖金（计提）贷 奖金（已核定），按法人与项目，S-4b），B-07 经 B-16 读各项目「奖金（计提）」余额转成调整行，过账后该余额归零；只在核定期间调整、不重算已过账期间（C-7）；拆不到项目的留原法人转费用（LEB-05）；「已核定额 − 该项目累计计提额」计入当期，不回改已关账期间（ADR-0016、ADR-0045），项目已结项的按 PRC-35 清算规则处理；③人工成本分配差异行：按员工把「计价合计 − 当月实际薪酬（含加班费）」挂员工所在部门、计期间损益、不进项目（BONUS_OVERTIME_COSTING 2.4）
