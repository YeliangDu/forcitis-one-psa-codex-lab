      why_human: 已过账的人工成本分配运行是否确属有误、应冲销还是另行更正，要对这笔成本负责的人判断；冲销只能取反加新事实（INV-95）、重做借贷平衡与期间由规则守，不靠审批
      on_reject: end
      on_reject_outcome: 冲销已驳回
      escalation_rules:
