    aggregate: AGG-40
    added_in: closeout
    desc: 编制基数、档位、费率与池的职能类别；聚合稿 AGG-40 只有批准与生效两条命令，编制命令缺（见 notes 结构问题）
    decision:
    - when: 规则引用的组织单元不存在或已失效，拒收并告警
      goto: end
      outcome: 已拒收
    - when: otherwise
      goto: 2
    permission: 成本.分摊规则编制
    page: 分摊规则编辑页
    audit: true
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读组织单元
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 批准分摊规则版本
    aggregate: AGG-40
    gap: G-02
    approval:
      engine: platform.approval
      doc_type: 分摊规则审批
      approver: SH-M1
      multi_level: false
      on_reject: end
      on_reject_outcome: 已驳回
    notify:
    - to: SH-M1
      how: 企业微信待办
    audit: true
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    pending:
