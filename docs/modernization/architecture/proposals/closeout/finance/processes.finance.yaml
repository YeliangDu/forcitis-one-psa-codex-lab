      direction: in
      bc: platform.approval
      name: 审批已通过
  - actor: system
    where: automatic
    command: 冲销并重过账
    aggregate: AGG-77
    calls: PRC-92
    branch: 冲销后过账
    added_in: closeout
    period_gate: true
    desc: 经 PRC-92 更正入口冲销原分摊运行的过账事实
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 分摊已冲销
    - when: 过账管道拒收（原事实不存在或已被冲销、该法人无开放期间、借贷不平），拒收并告警
      goto: end
      rule: INV-92、INV-93、INV-95；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 分摊已冲销
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 冲销并重过账
    legal_entity: 承担法人
  notes: 冲销按原比例（冲销命令缺，见结构问题）。试算后确认无超时或退回分支，按非人工编排（⑥a 评审 M1）。管理口径运行不过账，只受期间闸门约束。
