      direction: in
      bc: platform.approval
      name: 审批已驳回
    audit: true
    notify:
    - to: SH-E3
      how: 企业微信消息：审批驳回
  - actor: SH-E3
    where: in_system
    command: 撤回费用事前申请
    aggregate: AGG-130
    added_in: closeout
    desc: 审批前申请人撤回，费用事前申请置已撤回，审批平台同时撤销待办
    decision:
    - when: otherwise
      goto: end
      outcome: 已撤回
    permission: 费用事前申请.撤回
    page: 费用事前申请详情页
    audit: true
