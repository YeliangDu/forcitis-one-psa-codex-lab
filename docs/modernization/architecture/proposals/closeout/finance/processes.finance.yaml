  - actor: SH-E6
    where: in_system
    command: 试算分摊运行
    aggregate: AGG-42
    desc: 基数为零时结转下期（P-42）；目标期间已关账：规则提示「将落当前开放期间并标原期间」，经办人确认后继续试算，不设审批（人工发起，ADR-0045 决定 2、INV-92、AR-05）
    decision:
    - when: 本期间已有有效的全量分摊运行
      goto: end
      rule: INV-90
      outcome: 本期已分摊
    - when: 期间内没有生效的分摊规则版本，拒收并告警
      goto: end
      rule: INV-91
      outcome: 已拒收
      alert: true
    - when: 分摊基数为零，结转下期
      goto: end
      rule: P-42
      outcome: 已结转下期
    - when: 分摊规则把某一法人的成本池分摊到其他法人的项目，拒收并告警（成本池按法人分别归集，只分摊到同一法人的项目；部门换法人后自生效日起的费用进新法人的池）
      goto: end
      rule: INV-142（成本口径 C-4）
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 成本.分摊运行试算
    page: 分摊运行试算页
    audit: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 读过账事实
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
    reads:
    - AGG-40
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  - actor: SH-E6
    where: in_system
    command: 生效分摊运行
    aggregate: AGG-42
    emits:
    - 分摊已生效
    desc: 管理口径；每期间一次有效全量运行（INV-90）；目标期间已关账：规则提示「将落当前开放期间并标原期间」，经办人确认后生效，不设审批（人工发起，ADR-0045 决定 2、INV-92、AR-05）
    period_gate: true
    decision:
    - when: 分摊合计不等于池金额
      goto: 1
      rule: INV-90
    - when: otherwise
      goto: end
      outcome: 分摊已生效
    permission: 成本.分摊运行生效
    page: 分摊运行生效页
    audit: true
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
