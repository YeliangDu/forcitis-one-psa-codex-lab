  - PRC-104-S09
  - PRC-104-S10
  stages_note: "外部法定账对账完成是 VS-10.2 退出条件改定后的「外部法定账对账已完成」（SD 已裁定的 VS-10.2 退出条件）；改定前检查器匹配不上。；CON-1017-ARC-10：退出条件对账部分改指 OBJ-125「已签字」"
  primary_object: "OBJ-125"
  primary_object_note: "CON-1017-ARC-10 O-2：对账并签字形成外部法定账对账（OBJ-125，暂名，待 one-glossary 定名，承载聚合 AGG-101）；原 none（CAPINFO-I01）；须同步骨架"
- id: PRC-105
  name: 评审并生效报表行定义版本
  trigger:
    type: human
    desc: 财务编制报表行到科目的映射
  stages:
  - VS-15.1
  - VS-15.2
  - VS-15.3
  stages_note: "intent 2026-10-17-174814 挂内部价值流 VS-15 确立经营基准（暂名）；VS-15.1 草拟与财务评审、VS-15.2 已生效、VS-15.3 旧版本被取代，均由本流程完成（判据只推出 VS-15.2）；原支撑理由：报表行定义版本是配置，供出具报表使用，不造出阶段退出条件（#421）"
  owner_bc: B-21
  human_orchestration: false
  migration: 在途：草稿版本投产前办结或作废。历史：投产版本为首个版本；上年末报表按首版报表行定义出具，由财务负责人书面确认、内部审计复核（投产准入 G-2、G-3）；历史期间不重出报表。
  scope: 全企业配置（一套报表行定义，两个账簿共用，ADR-0022 决定 4）
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - performer
    - approver
    rule: 编制人与评审生效人不得为同一人（ADR-0022 决定 2 同类配置：起草人不得担任批准人）；评审人级别占位 SH-M1，待 F-01
  triggers:
  - type: human
    name: 财务编制报表行到科目的映射
  outcomes:
  - 已生效
  - 已拒收
  roles:
  - id: SH-E6
    as: performer
  - id: SH-M1
    as: reviewer
  steps:
  - actor: SH-E6
    where: in_system
    command: 编制报表行定义版本
    aggregate: AGG-86
    audit: true
    permission: 报表.编制报表行定义
    page: 报表行定义编辑页
    desc: 报表行映射到科目表版本中的科目与现金流量项目；合同资产、合同负债、合同履约成本单独列报（ADR-0022 决定 4）
    decision:
    - when: 映射的科目在所引用的科目表版本中不存在，拒收并告警
      goto: end
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-20
      name: 读科目表版本
    pending:
    - R-9-差异
  - actor: SH-M1
    where: in_system
    command: 生效报表行定义版本
    aggregate: AGG-86
    audit: true
    period_gate: true
    permission: 报表.评审生效报表行定义
    page: 报表行定义评审页
    desc: 草拟 → 财务评审 → 生效；只在期间首日生效（INV-91a）
    decision:
    - when: 评审生效人与编制人为同一人，命令被拒，改由他人评审
      goto: 2
    - when: 评审不通过，退回编制
      goto: 1
    - when: 生效日不是期间首日，或该期间已关账（含关账中），拒收并告警
      goto: end
      rule: INV-91a
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已生效
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
    pending:
    - F-01
    approval:
      engine: aggregate
      doc_type: 报表行定义评审生效
      approver: SH-M1
      multi_level: false
      why_human: 报表行到科目的映射决定对外报表口径，要对财务报表负责的人评审；映射科目存在、只在期间首日生效、编制与评审分离由规则守
      approver_basis: 报表口径评审是对财务报表负责的职责，不归属某个费用或业务对象，取财务负责人（类型级）
      on_reject: 1
  notes: 草拟 → 财务评审 → 生效。
