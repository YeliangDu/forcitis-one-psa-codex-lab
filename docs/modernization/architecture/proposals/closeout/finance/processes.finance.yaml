    decision:
    - when: 生效日不是期间首日或早于当前开放期间首日（不追溯），拒收并告警
      goto: end
      rule: INV-91
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 分摊规则已生效
    permission: 成本.分摊规则生效
    page: 分摊规则生效页
    audit: true
    metric_event: true
  notes: 被引用版本不可改。
- id: PRC-98
