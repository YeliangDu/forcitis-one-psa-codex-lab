    as: initiator
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    command: 编制分摊规则版本
    aggregate: AGG-40
    added_in: closeout
    desc: 编制基数、档位、费率与池的职能类别；聚合稿 AGG-40 只有批准与生效两条命令，编制命令缺（见 notes 结构问题）；草稿另存、可改，批准时才写只追加的版本行（R-31，D15）
    decision:
    - when: 规则引用的组织单元不存在或已失效，拒收并告警
      goto: end
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 成本.分摊规则编制
    page: 分摊规则编辑页
    audit: true
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读组织单元
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 批准分摊规则版本
    aggregate: AGG-40
    gap: G-02
    approval:
      engine: platform.approval
      doc_type: 分摊规则审批
      approver: cost_object_owner
      multi_level: false
      why_human: 分摊基数、档位、费率与池的划分决定各项目与部门承担多少间接成本，是管理口径的政策判断，要对间接成本池负责的人定；引用的组织单元有效、只在期间首日生效、不追溯、编制与批准分离都已由规则拦截，不靠审批
      on_reject: end
      on_reject_outcome: 已驳回
