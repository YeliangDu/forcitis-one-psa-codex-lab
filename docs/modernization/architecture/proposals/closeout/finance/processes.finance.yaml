    decision:
    - when: 该变更已生效，再次修改（INV-16b），须另提新变更
      goto: end
      rule: INV-16b
      outcome: 已拒收
      alert: true
    - when: 变更后协议金额低于已确认的履约累计（INV-82，AGG-58 一侧校验，生效前先读）
