  notes: 已关账期间是终态，回退是在开放期间重入第 1–3 步（冲销加新事实，标原期间）；「关账中」是否仍接受过账未定（§7 第 15 条）。R-30：关账事件订阅方 B-20（PRC-103）、B-21（PRC-106）、reporting 已补 event out。
