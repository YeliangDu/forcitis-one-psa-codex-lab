    aggregate: AGG-42
    desc: 基数为零时结转下期（P-42）
    decision:
    - when: 目标期间已关账，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 本期间已有有效的全量分摊运行
      goto: end
      rule: INV-90
      outcome: 本期已分摊
    - when: 期间内没有生效的分摊规则版本，拒收并告警
      goto: end
      rule: INV-91
      outcome: 已拒收
