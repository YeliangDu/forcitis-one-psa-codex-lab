      direction: out
      bc: B-16
      name: 冲销并重过账
    legal_entity: 报销人所在法人（任职口径）
  notes: 报销核定后由 B-09 事件策略 PRC-147 冲抵借款并按净额确认应付（S-17、S-19、S-24）；报销「已付」由应付已结清经事件策略 PRC-133 置位，全额冲抵时由 PRC-147 置位；发票占用只在 B-12 提交前占用一次（G-17 已处理）。 报销各类情形与分贝通差旅的覆盖对照见 EXPENSE_COVERAGE.md；公司直付分贝通订单不走本流程（G-F2）。
    冲销分支（步骤 10–12）：财务发起 → 审批平台加审 AR-06 → 冲销费用报销 → 冲销并重过账（S-29 SQ-45）。
