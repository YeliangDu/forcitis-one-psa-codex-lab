    added_in: closeout
    desc: 采购后建卡；资产类别含 IT 资产，IT 资产卡片的账务（折旧、报废）归本聚合，B-31 只按卡片 ID 引用（intent 2026-10-16-152926）
    evidence:
    - 采购发票或租赁协议引用
    - 验收单（线下验收，本系统登记验收日期与验收人）
    decision:
    - when: 法人主体、资产类别或取得日期缺失或无效（含 IT 资产类别），拒收并告警
