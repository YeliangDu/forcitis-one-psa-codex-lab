    name: 触账 BC 提交过账候选（PostingCandidate）
    entry: 1
  - type: call
    name: 来源 BC 发起更正：冲销并重过账（独立入口）
    entry: 3
  outcomes:
  - 已过账
  - 已更正
  - 已拒收
  - 幂等已返回原结果
  roles:
  - id: SH-E6
    as: informed
  steps:
  - actor: system
    where: automatic
    entry: 提交过账候选
    read: true
    reads:
    - AGG-81
    period_gate: true
    legal_entity: 事实所属法人（期间闸门粒度：期间 × 法人）
    desc: 同事务读锁校验目标期间开放；已关账则路由到开放期间并标原期间（INV-92、ADR-0045 决定 2）；拒收写拒收记录并告警，不静默跳过
    decision:
    - when: 显式指定的落账期间（第 13 期通道）未开放或未启用
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 业务日期所在期间已关账且该法人有开放期间，路由到开放期间并标原期间
      goto: 2
      rule: INV-92
    - when: 该法人无开放期间可落
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: otherwise
      goto: 2
    notify:
    - to: SH-E6
      how: 企业微信告警（过账候选被拒收）
