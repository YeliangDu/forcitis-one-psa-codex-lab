      name: 读过账事实
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
  - actor: SH-E6
    where: in_system
    command: 生效分摊运行
    aggregate: AGG-42
    emits:
    - 分摊已生效
    desc: 管理口径；每期间一次有效全量运行（INV-90）
