  permission: 预付款.冲抵
  page: 预付款冲抵页
  migration: 在途：投产前未冲抵的预付款以「预付款已登记」或「已部分冲抵」迁入（AGG-52 open_items）；已冲抵的随应付与付款事实全部迁入（U-3、U-4），不触发过账
  cross_bc:
  - mode: api
    direction: out
    bc: B-16
    name: 提交过账候选（PostingCandidate）
  triggers:
  - type: human
    name: 财务发现已付预付款对应的应付已确认，发起冲抵
  outcomes:
  - 预付款已部分冲抵
  - 预付款已冲抵
  - 已拒收
  - 过账被拒收
  - 期间关账中待重试
  roles:
  - id: SH-E6
    as: performer
  segregation:
  - roles:
    - SH-E6
    rule: 冲抵经办与该预付款的出纳（登记银行结果的人）不得为同一人（INV-81 同类，提议）
  notes: 冲抵额受 INV-77a 约束，不另编号；冲抵不设审批（金额与往来方由规则守）。
  scenarios:
  - PRC-176-S01
  - PRC-176-S02
  - PRC-176-S03
  - PRC-176-S04
  - PRC-176-S05
  - PRC-176-S06
  - PRC-176-S07
  - PRC-176-S08
  transitions:
  - actor: SH-E6
    command: 预付款冲抵应付
    where: in_system
    from:
    - 预付款已登记
    - 已部分冲抵
    to: 已部分冲抵
    audit: true
    legal_entity: 应付所属法人
    decision:
    - when: 冲抵额超过预付款余额或应付未付余额
      goto: end
      rule: INV-77a
      outcome: 已拒收
      alert: true
    - when: 应付在争议中
      goto: end
      rule: INV-130
      outcome: 已拒收
      alert: true
    - when: 预付款与应付的往来方不一致
      goto: end
      rule: 〔缺〕INV 冲抵双方往来方一致
      outcome: 已拒收
      alert: true
    - when: 冲抵后预付款余额为零
      goto: end
      outcome: 预付款已冲抵
    - when: otherwise
      goto: end
      outcome: 预付款已部分冲抵
    also_to: 已冲抵
  - actor: system
    command: 提交过账候选
    calls: PRC-92
    period_gate: true
    desc: 预付款转为应付核销的重分类分录
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 预付款已冲抵
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93
      outcome: 过账被拒收
      alert: true
      pending:
      - SQ-41
    - when: otherwise
      goto: end
      outcome: 预付款已冲抵
  stages_note: "预付款核销使应付「已结清 / 部分结」，造出 VS-05.5 付款的退出条件（#421 判据①）"
  primary_object: OBJ-85
