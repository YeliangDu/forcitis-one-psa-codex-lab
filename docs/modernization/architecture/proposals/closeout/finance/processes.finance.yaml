  primary_object: OBJ-97
- id: PRC-103
  name: 生成期间余额快照
  type: event_policy
  owner_bc: B-20
  stages:
  - VS-10.1
  triggers:
  - type: event
    event: AccountingPeriodClosed
    publisher_bc: B-19
  - type: time
    name: 每日检查已关账期间缺快照并补生成
  outcomes:
  - 快照已生成
  - 重复事件已忽略
  - 已拒收
  steps:
  - actor: system
    where: automatic
    command: 生成快照
    aggregate: AGG-100
    emits:
    - 期间余额快照已生成
    legal_entity: 事件载荷中的法人（每个账簿一份）
    metric_event: true
    desc: 只追加；之后的更正进开放期间快照的「上年调整」「以前期间更正」栏（INV-106）；事件载荷带期间序号，第 13 期同样生成
    decision:
    - when: 事件载荷缺法人或期间，拒收并告警（由每日补生成触发兜底）
      goto: end
      outcome: 已拒收
      alert: true
    - when: 本（法人，账簿，期间）快照已存在（重复事件）
      goto: end
      rule: INV-106
      outcome: 重复事件已忽略
    - when: otherwise
      goto: end
      outcome: 快照已生成
    notify:
    - to: SH-E6
      how: 企业微信告警（载荷无效）
    cross_bc:
    - mode: event
      direction: in
      bc: B-19
      name: AccountingPeriodClosed
    reads:
    - AGG-125
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  migration: 在途：无。历史：历史期间不发关账事件（ADR-0036 第 6 条），不经本策略生成快照；投产期初余额按迁入余额载入（ADR-0022 决定 11）；投产前最近两个已结期间以重算比对（U-10）。
  notes: 订阅方向 B-20 → B-19（事件）；快照生成后触发同 BC 的对账（PRC-104）。
  scenarios:
  - PRC-103-S01
  - PRC-103-S02
  - PRC-103-S03
  - PRC-103-S04
  stages_note: 事件策略按触发状态「会计期间已关账」归段（#421 判据②），该状态是 VS-10.1 期间关账的退出条件
  primary_object: none
  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
- id: PRC-104
  name: 对账外部法定账并签字
  trigger:
    type: event
    events:
    - event: 期间余额快照已生成
      aggregate: AGG-100
  stages:
  - VS-10.2
  owner_bc: B-20
  human_orchestration: false
  migration: 在途：投产前以最近两个已结期间重算比对（U-10），比对结论作迁入核对证据，不迁对账运行单据。历史：历史期间的对账在老系统与 U8C 完成，不重做。
  scope: 按法人（法人 × 期间），财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - performer
    - approver
    rule: 登记对账差异者与签字接受者不得为同一人；签字人级别占位 SH-M1（ADR-0022 决定 8「财务负责人逐项签字接受」，签字人与容差待定）
  triggers:
  - type: event
    name: 期间余额快照已生成
    publisher_bc: B-20（同 BC，PRC-103）
  - type: time
    name: 每日重试读取 U8C 余额（读取失败后）
  outcomes:
  - 差异已清零
  - 已签字接受
  - 对账未完成
  roles:
  - id: SH-E6
    as: performer
  - id: SH-M1
    as: approver
  steps:
  - actor: system
    where: external:U8C
    read: true
    reads:
    - AGG-100
    - AGG-84
    evidence:
    - U8C 收付账套按法人 × 科目的期末余额与本期发生额（经新旧科目对照）
    - 已推送未记账清单
    legal_entity: 被对账法人
    desc: U-8：U8C 继续做法定账，新系统按月把收付口径账簿与 U8C 收付账套对账；权责口径账簿不与 U8C 对账（ADR-0022 决定 8）；关账日前须由财务在 U8C 审核并记账
    decision:
    - when: U8C 余额读取失败或无响应，告警并结束，待重试
      goto: end
      outcome: 对账未完成
      alert: true
    - when: otherwise
      goto: 2
    notify:
    - to: SH-E6
      how: 企业微信告警（外部法定账余额读取失败）
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 读外部法定账余额
    pending:
    - S-05
    command: 读取外部法定账余额
  - actor: system
    where: external:U8C
    command: 登记外部记账确认
    aggregate: AGG-84
    added_in: closeout
    evidence:
    - U8C 记账结果（凭证号、返回码）
    desc: 对账读到 U8C 记账结果后，对已推送的凭证登记已确认记账（已推送 → 已确认记账）；触发方为对账（AGG-101，同 BC）、执行与推送不同，不并入「推送分录」（S-31 SQ-11）
    decision:
    - when: 记账结果对应的凭证未推送或外部键不符，不置已确认记账，作为对账差异在下一步登记
      goto: 3
      rule: ADR-0022 决定 8（推送幂等外部键）
    - when: otherwise
      goto: 3
    audit: true
    legal_entity: 被对账法人
  - actor: SH-E6
    where: in_system
    command: 登记对账差异
    aggregate: AGG-101
    audit: true
    legal_entity: 被对账法人
    permission: 总账.登记对账差异
    page: 外部法定账对账页
    desc: 按法人 × 科目登记差异与已推送未记账清单；红字冲销按净额核对（ADR-0022 决定 10）；差异由系统按法人×科目算出，人只补原因（QC-VS10-15）
    decision:
    - when: 差异清零
      goto: end
      rule: INV-107
      outcome: 差异已清零
    - when: otherwise
      goto: 4
    notify:
    - to: SH-M1
      how: 企业微信待办（对账差异待签字）
    cross_bc:
    - mode: api
      direction: in
      bc: B-21
      name: 读对账状态
  - actor: SH-M1
    where: in_system
    command: 签字接受差异
    aggregate: AGG-101
    emits:
    - 对账已完成
    audit: true
    metric_event: true
    legal_entity: 被对账法人
    permission: 总账.签字接受对账差异
    page: 外部法定账对账页（签字）
    approval:
      engine: aggregate
      doc_type: 对账差异签字
      approver: SH-M1
      multi_level: false
      why_human: 登记后仍未清零的差异是否可以接受、原因是否查明，要对法定账负责的人判断；差异登记、已推送未记账清单与红字冲销净额核对、登记与签字分离已由规则守
      approver_basis: 对账签字是对该法人法定账与收付账簿一致性负责的职责，不归属某个费用或业务对象，故不按 cost_object_owner 解析，取财务负责人（签字人与容差待定）
      on_reject: 2
    desc: R-15：聚合命令，签字人与签字结论写入聚合；差异清零或签字接受，否则收付口径账簿不得出表（INV-107）；权责报表不受阻塞（ADR-0022 决定 10）
    decision:
    - when: 签字人与登记差异者为同一人，命令被拒，改由他人签字
      goto: 4
    - when: 不接受差异，退回重新查明并登记
      goto: 3
    - when: otherwise
      goto: end
      rule: INV-107
      outcome: 已签字接受
    cross_bc:
    - mode: api
      direction: in
      bc: B-21
      name: 读对账状态
    pending:
    - ADR22-签字容差
    - F-01
    - P2-03
  notes: 权责口径不等对账。v1 的外部方 SH-X7（资金监管主办银行）与 U8C 无关，已去掉；U8C 是外部系统，写在 where。
  scenarios:
  - PRC-104-S01
  - PRC-104-S02
  - PRC-104-S03
  - PRC-104-S04
  - PRC-104-S05
  - PRC-104-S06
  - PRC-104-S07
