      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 过账管道拒收（借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-93
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 已过账
    legal_entity: 资产所属法人
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    pending:
    - ADR22-G1G2
  notes: 形态待过渡 ADR（S-05；R-28）。
- id: PRC-100
  name: 发布总账配置版本
  trigger:
    type: human
    desc: 财务评审并发布科目表、映射表、授权表新版本
  stages:
  - VS-10.1
  owner_bc: B-20
  human_orchestration: false
  migration: 在途：草稿版本投产前办结或作废。历史：科目表（收付科目表沿用 U8C 编码，ADR-0022 决定 2）作为首版本迁入；映射表与授权表只建投产版本，历史分录走迁入通道、不经授权表校验。
  scope: 全企业配置（按版本生效，不按法人）
  segregation:
  - roles:
    - SH-E6
    - SH-E6
    as:
    - performer
    - approver
    rule: 起草人与批准人不得为同一人（ADR-0022 决定 2，SESSION_PLAYBOOK §12）
  triggers:
  - type: human
    name: 财务发布科目表新版本
    entry: 1
  - type: human
    name: 财务发布映射表新版本
    entry: 3
  - type: human
    name: 财务发布授权表新版本
    entry: 5
  outcomes:
  - 已发布
  - 已拒收
  roles:
  - id: SH-E6
    as: performer
  - id: SH-E6
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    command: 〔缺〕起草科目表版本
    aggregate: AGG-82
    added_in: closeout
    permission: 总账.起草科目表版本
    page: 科目表版本编辑页
    audit: true
    desc: ADR-0022 决定 2：起草人与批准人不得为同一人；聚合稿只有「发布」命令，缺起草命令（结构问题）
  - actor: SH-E6
    where: in_system
    command: 发布科目表版本
    aggregate: AGG-82
    emits:
    - 科目表版本已生效
    permission: 总账.发布科目表版本
    page: 科目表版本发布页
    audit: true
    period_gate: true
    desc: 批准人为财务，须不同于起草人；新版本只在会计期间首日生效，涉及有余额的科目时附期初重分类分录（ADR-0022 决定 2）
    decision:
    - when: 批准人与起草人为同一人，命令被拒，改由他人批准
      goto: 2
    - when: 生效日不是期间首日，或该期间已关账，拒收并告警
      goto: end
      outcome: 已拒收
    - when: 新科目表版本新增或停用了科目，须同步更新映射表
      goto: 3
    - when: otherwise
      goto: end
      outcome: 已发布
  - actor: SH-E6
    where: in_system
    command: 〔缺〕起草映射表版本
    aggregate: AGG-85
    added_in: closeout
    permission: 总账.起草映射表版本
    page: 映射表版本编辑页
    audit: true
    desc: ADR-0022 决定 2：起草人与批准人不得为同一人；聚合稿只有「发布」命令，缺起草命令（结构问题）
  - actor: SH-E6
    where: in_system
    command: 发布映射表版本
    aggregate: AGG-85
    emits:
    - 映射表版本已生效
    permission: 总账.发布映射表版本
    page: 映射表版本发布页
    audit: true
    period_gate: true
    desc: 批准人为财务，须不同于起草人；新版本只在会计期间首日生效，涉及有余额的科目时附期初重分类分录（ADR-0022 决定 2）
    decision:
    - when: 批准人与起草人为同一人，命令被拒，改由他人批准
      goto: 4
    - when: 生效日不是期间首日，或该期间已关账，拒收并告警
      goto: end
      outcome: 已拒收
    - when: 新映射表版本改变了对账类别或控制科目归属，须同步更新授权表
      goto: 5
    - when: otherwise
      goto: end
      outcome: 已发布
    pending:
    - ADR22-差异类
  - actor: SH-E6
    where: in_system
    command: 〔缺〕起草授权表版本
    aggregate: AGG-94
    added_in: closeout
    permission: 总账.起草授权表版本
    page: 授权表版本编辑页
    audit: true
    desc: ADR-0022 决定 2：起草人与批准人不得为同一人；聚合稿只有「发布」命令，缺起草命令（结构问题）
  - actor: SH-E6
    where: in_system
    command: 发布授权表版本
    aggregate: AGG-94
    emits:
    - 授权表版本已生效
    permission: 总账.发布授权表版本
    page: 授权表版本发布页
    audit: true
    period_gate: true
    desc: 批准人为财务，须不同于起草人；新版本只在会计期间首日生效，涉及有余额的科目时附期初重分类分录（ADR-0022 决定 2）；初始允许的导入通道与受控手工通道范围随过渡 ADR 取代 G1/G2 两步走（S-05）
    decision:
    - when: 批准人与起草人为同一人，命令被拒，改由他人批准
      goto: 6
    - when: 生效日不是期间首日，或该期间已关账，拒收并告警
      goto: end
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 已发布
    pending:
    - S-05
  notes: 口径转换规则按代码类变更管理，不建聚合。起草与发布命令的缺口见结构问题。
  scenarios:
  - PRC-100-S01
  - PRC-100-S02
  - PRC-100-S03
  - PRC-100-S04
  - PRC-100-S05
  - PRC-100-S06
  - PRC-100-S07
  - PRC-100-S08
  - PRC-100-S09
  - PRC-100-S10
  - PRC-100-S11
  - PRC-100-S12
- id: PRC-101
  name: 月结检查并关账
  trigger:
    type: human
    desc: 财务在会计期间结束时发起月结
  stages:
  - VS-10.1
  owner_bc: B-17
  human_orchestration: true
  human_note: 发起人与确认人须不同；前置检查未通过退回开放重入
  migration: 在途：投产前须办结，投产日所在期间是新系统的首次关账；投产前以最近两个已结期间重算比对（U-10）。历史：迁入的历史期间为终态，不经本流程、不发关账事件（ADR-0036 第 6 条），不重开（ADR-0045 决定 1）。
  scope: 按被关账法人（期间 × 法人），财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - initiator
    - approver
    rule: 发起关账与确认关账不得为同一人（ADR-0045 决定 1；发起人、确认人写入审计记录，ADR-0046 §8.5）；确认人级别占位 SH-M1，待 F-01
  triggers:
  - type: human
    name: 财务在会计期间结束时发起月结
    entry: 1
  - type: call
    name: 12 月且本年度未启用第 13 期时由 PRC-102 转入
    entry: 1
  outcomes:
  - 已关账
  - 检查未通过保持开放
  - 已拒收
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-84
    - AGG-99
    - AGG-77
    - AGG-81
    command: 月结检查
    checks:
    - 过账队列与分录生成队列为空（B-16 队列、B-20 待处理队列）
    - 推送死信为空（B-20）
    - 损益结转完成（期末结转已过账，AGG-99）
    - 明细账与总账控制科目一致
    - 现金流量标注完整
    - 直接法与间接法经营活动现金流量净额相等
    - 试算平衡
    - 三条对账等式成立，收付账簿生产成本余额为 0
    legal_entity: 被关账法人
    permission: 月结.执行前置检查
    page: 月结检查页
    desc: ADR-0022 决定 10 的前置检查；检查在 B-17 编排，结果只读展示，关账前展示检查结果（ADR-0045 决定 1 预防措施）
    decision:
    - when: 前置检查未通过
      goto: end
      rule: INV-100
      outcome: 检查未通过保持开放
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-20
      name: 读分录余额、待处理队列、推送死信与期末结转
    - mode: api
      direction: out
      bc: B-16
      name: 读队列与死信
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
  - actor: SH-E6
    where: in_system
    command: 发起关账
    aggregate: AGG-81
    period_gate: true
    audit: true
    legal_entity: 被关账法人
    permission: 月结.发起关账
    page: 月结关账页（发起）
    desc: 期间转为关账中；「关账中」是否仍接受过账未定（AGG§7-15）
    decision:
    - when: 期间已关账或已在关账中，拒收并告警
      goto: end
      rule: INV-99
      outcome: 已拒收
    - when: otherwise
      goto: 3
    notify:
    - to: SH-M1
      how: 企业微信待办（确认关账）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 发起关账
    pending:
    - AGG§7-15
  - actor: SH-M1
    where: in_system
    command: 确认关账
    aggregate: AGG-81
    emits:
    - AccountingPeriodClosed
    period_gate: true
    audit: true
    metric_event: true
    legal_entity: 被关账法人
    permission: 月结.确认关账
    page: 月结关账页（确认）
    approval:
      engine: aggregate
      doc_type: 月结关账确认
      approver: SH-M1
      multi_level: false
      on_reject: 4
    desc: R-15：确认关账是聚合命令，发起人、确认人写入审计记录；确认时重跑前置检查；已关账是终态，之后的更正落开放期间并标原期间（ADR-0045 决定 2）
    decision:
    - when: 确认人与发起人为同一人，命令被拒，改由他人确认
      goto: 3
    - when: 确认时前置检查未通过
      goto: 4
      rule: INV-100
    - when: otherwise
      goto: end
      outcome: 已关账
    timeout:
      after: 配置：财务设定的关账提醒日
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信通知（已关账）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 确认关账
    - mode: event
      direction: out
      bc: B-20
      name: AccountingPeriodClosed
    - mode: event
      direction: out
      bc: B-21
      name: AccountingPeriodClosed
    - mode: event
      direction: out
      bc: reporting
      name: AccountingPeriodClosed
    pending:
    - F-01
    - P2-01
  - actor: SH-E6
    where: in_system
    command: 退回开放
    aggregate: AGG-81
    branch: 前置检查未通过
    audit: true
    legal_entity: 被关账法人
    permission: 月结.退回开放
    page: 月结关账页（退回开放）
    desc: 期间尚未关账，退回开放不属于重开（ADR-0045 决定 1）；之后重入第 1–3 步
    decision:
    - when: otherwise
      goto: 1
    notify:
    - to: SH-E6
      how: 企业微信通知（前置检查未通过，已退回开放）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 退回开放
  notes: 已关账期间是终态，回退是在开放期间重入第 1–3 步（冲销加新事实，标原期间）；「关账中」是否仍接受过账未定（§7 第 15 条）。R-30：关账事件订阅方 B-20（PRC-103）、B-21（PRC-106）、reporting 已补 event out。
  scenarios:
  - PRC-101-S01
  - PRC-101-S02
  - PRC-101-S03
  - PRC-101-S04
  - PRC-101-S05
  - PRC-101-S06
  - PRC-101-S07
  - PRC-101-S08
  - PRC-101-S09
  - PRC-101-S10
  - PRC-101-S11
- id: PRC-102
  name: 启用第 13 期并年末关账
  trigger:
    type: time
    desc: 会计年度末，12 月关账前
  stages:
  - VS-10.1
  owner_bc: B-17
  human_orchestration: false
  migration: 在途：投产前须办结，投产日前不存在已启用的第 13 期。历史：迁入的历史年度只建 1–12 期的历史期间，不建第 13 期（ADR-0046 §8.7）；首个启用第 13 期的年度待 P-003。
  scope: 按会计年度全局启用，按（法人 × 年度）关账；财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - initiator
    - approver
    rule: 发起年末关账与确认年末关账不得为同一人（ADR-0045 决定 1、ADR-0046 第 5 项第 5 条；R-01 补）；确认人级别占位 SH-M1，待 F-01
  triggers:
  - type: time
    name: 会计年度末，12 月关账前（platform.scheduling 到点创建待办）
  outcomes:
  - 年末已关账
  - 检查未通过保持开放
  - 已拒收
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-96
    added_in: closeout
    permission: 第13期.查看启用
    page: 第 13 期启用页
    desc: R-20：先确认本年度是否启用；未启用的年度 12 月照常按数据到齐关账（ADR-0046 第 5 项第 6 条），转 PRC-101
    decision:
    - when: 本年度已有生效的第 13 期启用登记
      goto: 3
      rule: INV-104
    - when: 财务决定本年度不启用第 13 期，12 月转月结关账
      goto: PRC-101
      rule: INV-104
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读第 13 期启用登记
    pending:
    - P-003
  - actor: SH-E6
    where: in_system
    command: 登记第 13 期启用
    aggregate: AGG-96
    emits:
    - 第 13 期启用登记已生效
    period_gate: true
    audit: true
    permission: 第13期.登记启用
    page: 第 13 期启用页（登记）
    desc: 按会计年度全局，配置类版本带生效日、财务批准人、决定出处，只追加
    decision:
    - when: 该年度任一法人 12 月已关账，启用状态已锁定，拒收并告警
      goto: end
      rule: INV-104
      outcome: 已拒收
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 登记第 13 期启用
    pending:
    - P-003
  - actor: SH-E6
    where: in_system
    command: 开放第 13 期
    aggregate: AGG-81
    audit: true
    period_gate: true
    legal_entity: 被关账法人
    permission: 第13期.开放
    page: 第 13 期启用页（开放）
    desc: 期间行只在开放命令成功时创建；未启用时一律拒绝并告警（ADR-0046 第 4 项第 3 条）；第 13 期只接收显式指定落账期间的通道（INV-92）
    decision:
    - when: 本年度未启用第 13 期，拒收并告警
      goto: end
      rule: INV-104
      outcome: 已拒收
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 开放第 13 期
    pending:
    - ADR46-P3
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-84
    - AGG-99
    - AGG-77
    - AGG-81
    command: 月结检查
    added_in: closeout
    checks:
    - 过账队列与分录生成队列为空（B-16 队列、B-20 待处理队列）
    - 推送死信为空（B-20）
    - 损益结转完成（期末结转已过账，AGG-99）
    - 明细账与总账控制科目一致
    - 现金流量标注完整
    - 直接法与间接法经营活动现金流量净额相等
    - 试算平衡
    - 三条对账等式成立，收付账簿生产成本余额为 0
    legal_entity: 被关账法人
    permission: 月结.执行前置检查
    page: 月结检查页
    desc: 12 月与第 13 期共用一组前置检查，对两期合并判定（ADR-0046 第 5 项第 3 条）；两期合并后是否另加检查项待 P-004
    decision:
    - when: 前置检查未通过
      goto: end
      rule: INV-100
      outcome: 检查未通过保持开放
    - when: otherwise
      goto: 5
    cross_bc:
    - mode: api
      direction: out
      bc: B-20
      name: 读分录余额、待处理队列、推送死信与期末结转
    - mode: api
      direction: out
      bc: B-16
      name: 读队列与死信
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
    pending:
    - P-001
    - P-002
    - P-004
  - actor: SH-E6
    where: in_system
    command: 发起年末关账
    aggregate: AGG-81
    period_gate: true
    audit: true
    legal_entity: 被关账法人
    permission: 月结.发起年末关账
    page: 年末关账页（发起）
    desc: 12 月与第 13 期共用一组前置检查（见第 4 步）
    decision:
    - when: 12 月或第 13 期已关账，或两期未同时处于开放，拒收并告警
      goto: end
      rule: INV-99
      outcome: 已拒收
    - when: otherwise
      goto: 6
    notify:
    - to: SH-M1
      how: 企业微信待办（确认年末关账）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 发起年末关账
  - actor: SH-M1
    where: in_system
    command: 确认年末关账
    aggregate: AGG-81
    emits:
    - AccountingPeriodClosed
    period_gate: true
    audit: true
    metric_event: true
    legal_entity: 被关账法人
    permission: 月结.确认年末关账
    page: 年末关账页（确认）
    approval:
      engine: aggregate
      doc_type: 年末关账确认
      approver: SH-M1
      multi_level: false
      on_reject: 7
    desc: R-15：聚合命令；两期同事务原子关账（INV-99），各发一次事件，第 13 期的事件不触发 L2 冻结；不设强制关账期限，只在财务设定的日期后提醒（ADR-0046 第 5 项第 5 条）
    decision:
    - when: 确认人与发起人为同一人，命令被拒，改由他人确认
      goto: 6
    - when: 确认时前置检查未通过
      goto: 7
      rule: INV-100
    - when: otherwise
      goto: end
      outcome: 年末已关账
