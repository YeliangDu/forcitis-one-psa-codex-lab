- id: PRC-163
  name: 登记利润分配支付
  type: event_policy
  owner_bc: B-10
  stages:
  - VS-12.2
  added_in: closeout
  basis: S-31 SQ-02
  triggers:
  - type: event
    name: 应付已结清（来源为利润分配的应付）
    publisher: B-10（同 BC，AGG-52）
  migration: 无在途实例；迁入的利润分配支付记录随利润分配全部迁入（U-3、U-4），不触发本策略；投产时应付已结清而利润分配尚未置支付状态的，投产前跑完本策略
  outcomes:
  - 已支付
  - 已部分支付
  - 重复事件已忽略
  - 已忽略非利润分配来源
  - 已拒收
  reads:
  - AGG-52
  steps:
  - actor: system
    where: automatic
    command: 登记利润分配支付
    aggregate: AGG-109
    emits:
    - 利润分配已支付
    desc: 订阅应付已结清，读来源为利润分配的应付，置利润分配已部分支付或已支付；应付由决议后的 AGG-52 提交应付利润产生（过账分工见 S-31 SQ-02），付款事实由 PRC-75、132 过账，本策略不触账
    decision:
    - when: 应付来源不是利润分配
      goto: end
      outcome: 已忽略非利润分配来源
    - when: 读不到应付或来源利润分配 → 拒收并告警
      goto: end
      outcome: 已拒收
      alert: true
    - when: 该应付的支付已登记过（事件重复，按应付 ID 幂等）
      goto: end
      outcome: 重复事件已忽略
    - when: 利润分配不在已决议或部分支付状态（如决议已撤销，S-29 SQ-48）→ 拒收并告警
      goto: end
      outcome: 已拒收
      alert: true
    - when: 本次支付使支付合计超过决议金额（INV-117）→ 拒收并告警
      goto: end
      rule: INV-117
      outcome: 已拒收
      alert: true
    - when: 登记后仍有未支付的分配额
      goto: end
      outcome: 已部分支付
    - when: otherwise
      goto: end
      outcome: 已支付
    legal_entity: 被分配法人
    audit: true
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: event
      direction: out
      bc: B-15
      name: 利润分配已支付
  notes: 同 BC，无新边；单一触发「应付已结清」（S-34 ③）：每位股东一张应付，某股东的应付结清置该股东的分配额已支付，仍有其他股东未结清时利润分配为部分支付，全部结清为已支付；单张应付的部分付款只发「应付已核销」，不触发本策略；PRC-112 已删「应付已核销」入口与「支付后过账」（S-31 SQ-02）；B-15 订阅「利润分配已支付」代扣自然人股东个税。
