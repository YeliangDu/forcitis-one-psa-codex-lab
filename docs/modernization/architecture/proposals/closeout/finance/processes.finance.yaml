processes:
- id: PRC-15
  name: 未签约的售前投入转费用
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-01.2
  triggers:
  - type: event
    name: 商机已丢单
    bc: B-03
    entry: 1
  - type: event
    name: 商机已放弃
    bc: B-03
    entry: 1
  - type: time
    name: platform.scheduling 到点调用：立项后回签前挂合同履约成本的投入超过 N 个月未签约（N 取成本核算参数版本 AGG-123，默认 6 个月、可设；A7、GL-026；幂等键 = 聚合 ID + 到期时点；对象键为项目或协议，不是商机）
    entry: 1
  - type: call
    name: PRC-25 转入时售前投入所在法人与项目承担法人不一致的部分（LEB-05，成本口径 C-5）
    entry: 1
  - type: event
    name: BusinessFactAttributed（本批次的过账事实）
    bc: B-16
    entry: 3
  migration: 在途：投产日未转的售前投入按迁入的权责事实存量由本策略继续处理；历史：已转费用的批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 售前投入已转费用
  - 无需转费用
  - 已转费用（幂等）
  - 已提交过账
  - 已拒收
  - 期间关账中待重试
  scenarios:
  - PRC-15-S01
  - PRC-15-S02
  - PRC-15-S03
  - PRC-15-S04
  - PRC-15-S05
  - PRC-15-S06
  - PRC-15-S07
  - PRC-15-S08
  - PRC-15-S09
  - PRC-15-S10
  - PRC-15-S11
  - PRC-15-S12
  - PRC-15-S13
  - PRC-15-S14
  steps:
  - actor: system
    where: automatic
    command: 售前投入转费用
    aggregate: AGG-43
    desc: P-43；丢单或放弃后该商机的售前投入转当期费用；超期分支取同一命令，由 platform.scheduling 到点调用，N 取成本核算参数版本 AGG-123（按起算日所在版本）；本步只在批次内记结转行，过账由第 2 步提交（S-30）
    decision:
    - when: 该商机已转过费用（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已转费用（幂等）
    - when: 该商机没有未转的售前投入
      goto: end
      outcome: 无需转费用
    - when: otherwise
      goto: 2
    legal_entity: 承担法人
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: 商机已丢单、商机已放弃
    - mode: api
      direction: out
      bc: platform.scheduling
      name: 登记定时（到点调售前投入转费用）
    reads:
    - AGG-122
    - AGG-123
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-43
    post: true
    calls: PRC-92
    period_gate: true
    desc: 结转批次提交单一过账管道，幂等键为（来源对象、结转类型、期间）（INV-94）；结果由第 3 步订阅 BusinessFactAttributed 后置位
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 落账期间已关账且该法人有开放期间，自动落当前开放期间并标原期间
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已提交过账
    - when: 该法人无开放期间可落（过账管道拒收），拒收并告警
      goto: end
      rule: INV-92；拒收记录由 PRC-158 处置
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已提交过账
    legal_entity: 承担法人
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  - actor: system
    where: automatic
    command: 标记成本结转已过账
    aggregate: AGG-43
    branch: 订阅过账结果
    emits:
    - 成本结转已过账
    desc: 订阅 B-16 的 BusinessFactAttributed，按本批次幂等键置已过账并发成本结转已过账（仅分析）；同 AGG-73 标记已过账做法
    decision:
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    legal_entity: 承担法人
    metric_event: true
  - actor: system
    where: automatic
    command: 标记售前投入已转费用
    aggregate: AGG-122
    added_in: closeout
    desc: 转费用结果登记到按商机持久的归属登记；同一商机只转出一次（INV-132）
    decision:
    - when: 该商机的售前投入已转出（转入合同履约成本或转费用二选一）
      goto: end
      rule: INV-132
      outcome: 已转费用（幂等）
    - when: otherwise
      goto: end
      outcome: 售前投入已转费用
    audit: true
    legal_entity: 承担法人
  notes: 转费用不依赖收入确认时点，INV-88 不是前置。
  stages_note: 事件策略按触发状态归段（#421）：商机已丢单、已放弃=OBJ-18「丢单 / 放弃」，是 VS-01.2 退出条件；超期未签约的定时触发无对象状态，随同一策略归 VS-01.2。
  primary_object: none
  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
- id: PRC-25
  name: 转入售前投入
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-02.0
  - VS-04.1
  triggers:
  - type: event
    name: 协议已生效
    bc: B-05
    entry: 1
  - type: event
    name: 项目已建立
    bc: B-04
    entry: 2
  - type: event
    name: BusinessFactAttributed（本批次的过账事实）
    bc: B-16
    entry: 6
  - type: event
    name: 合同—项目关联已登记
    bc: B-05
    entry: 3
  migration: 在途：投产日协议已生效但未转入的，按迁入的权责事实存量由本策略继续处理；历史：已转入的批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 售前投入已转入
  - 等待齐备
  - 无需转入
  - 已转入（幂等）
  - 已提交过账
  - 已拒收
  - 期间关账中待重试
  scenarios:
  - PRC-25-S01
  - PRC-25-S02
  - PRC-25-S03
  - PRC-25-S04
  - PRC-25-S05
  - PRC-25-S06
  - PRC-25-S07
  - PRC-25-S08
  - PRC-25-S09
  - PRC-25-S10
  - PRC-25-S11
  - PRC-25-S12
  - PRC-25-S13
  - PRC-25-S14
  - PRC-25-S15
  - PRC-25-S16
  steps:
  - actor: system
    where: automatic
    command: 登记协议已生效
    aggregate: AGG-122
    added_in: closeout
    desc: 订阅协议已生效（不再订阅 ContractSigned：附生效条件的协议签署后可能不生效，按生效转入可免冲回，GL5-01，GL5_SIGNED_EFFECTIVE_SUBSCRIBERS）登记到按商机持久的归属登记（两事件分别到达，不要求同时；S-31 SQ-18）
    decision:
    - when: 该商机的售前投入已转出（重复事件，幂等）
      goto: end
      rule: INV-132
      outcome: 已转入（幂等）
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 协议已生效
    audit: true
    legal_entity: 承担法人
  - actor: system
    where: automatic
    command: 登记项目已建立
    aggregate: AGG-122
    added_in: closeout
    desc: 订阅「项目已建立」，登记到归属登记
    decision:
    - when: 该商机的售前投入已转出（重复事件，幂等）
      goto: end
      rule: INV-132
      outcome: 已转入（幂等）
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: event
      direction: in
      bc: B-04
      name: 项目已建立
    audit: true
    legal_entity: 承担法人
  - actor: system
    where: automatic
    command: 登记售前投入挂接归属
    aggregate: AGG-122
    added_in: closeout
    desc: 一商机多合同按 WBS 挂接归属（Q12），不按合同额分摊；两事件齐备才进入转入；挂接归属以「合同—项目关联已登记」为准（接缝 S-42）
    decision:
    - when: 合同未签回或项目未建立（两者齐备才转入，后到者触发）
      goto: end
      rule: P-43；INV-132
      outcome: 等待齐备
    - when: otherwise
      goto: 4
    audit: true
    legal_entity: 承担法人
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 合同—项目关联已登记
  - actor: system
    where: automatic
    command: 转入售前投入
    aggregate: AGG-43
    desc: 合同签回且项目已建立后按冲销加新事实转入（P-43）；一商机多合同按 WBS 挂接归属（Q12）转入各合同对应项目，不按合同额分摊（intent 120544 P-2）；赢单不触发；本步只在批次内记结转行，过账由第 2 步提交（S-30）
    decision:
    - when: 该商机与合同已转入过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已转入（幂等）
    - when: 该商机没有未转的售前投入
      goto: end
      outcome: 无需转入
    - when: 部分售前投入所在法人（投入人员当日成本法人）与项目承担法人不一致：一致部分照常转入；不一致部分不转入，调用 PRC-15 留原法人转费用，列入月末跨法人清单
      goto: 5
      rule: INV-93；LEB-05（成本口径 C-5）
    - when: otherwise
      goto: 5
    calls: PRC-15
    legal_entity: 承担法人
    cross_bc: []
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-43
    post: true
    calls: PRC-92
    period_gate: true
    desc: 结转批次提交单一过账管道，幂等键为（来源对象、结转类型、期间）（INV-94）；结果由第 3 步订阅 BusinessFactAttributed 后置位
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 落账期间已关账且该法人有开放期间，自动落当前开放期间并标原期间
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已提交过账
    - when: 该法人无开放期间可落（过账管道拒收），拒收并告警
      goto: end
      rule: INV-92；拒收记录由 PRC-158 处置
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已提交过账
    legal_entity: 承担法人
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  - actor: system
    where: automatic
    command: 标记成本结转已过账
    aggregate: AGG-43
    branch: 订阅过账结果
    emits:
    - 成本结转已过账
    desc: 订阅 B-16 的 BusinessFactAttributed，按本批次幂等键置已过账并发成本结转已过账（仅分析）；同 AGG-73 标记已过账做法
    decision:
    - when: otherwise
      goto: 7
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    legal_entity: 承担法人
    metric_event: true
  - actor: system
    where: automatic
    command: 标记售前投入已转入
    aggregate: AGG-122
    added_in: closeout
    desc: 转入结果登记到归属登记；同一商机只转出一次（INV-132）
    decision:
    - when: otherwise
      goto: end
      rule: INV-132
      outcome: 售前投入已转入
    audit: true
    legal_entity: 承担法人
  notes: 触发语义为合同签回且项目已建立两者齐备，赢单不转入（intent 120544 P-2，C-53）。立项后回签前的投入按 A7 先挂合同履约成本；超 N 个月未签约转费用见 PRC-15。
  stages_note: 事件策略按触发状态归段（#421）：项目已建立=OBJ-29「已立项」，是 VS-02.0 退出条件；合同已签回（ContractSigned）=OBJ-05「已签署生效」，是 VS-04.1 退出条件。两段在不同价值流，是按触发状态跨价值流归两段，不是跳段。触发名用事件名而非状态原文，检查器因此匹配不上。
  primary_object: none
  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
- id: PRC-35
  name: 清算项目成本
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-02.7
  triggers:
  - type: event
    name: 项目已终止
    bc: B-04
    entry: 1
  - type: event
    name: 项目已取消
    bc: B-04
    entry: 1
  - type: event
    name: 项目已结项
    bc: B-04
    entry: 1
  - type: event
    name: 协议已终止
    bc: B-05
    entry: 1
  - type: event
    name: BusinessFactAttributed（本批次的过账事实）
    bc: B-16
    entry: 3
  migration: 在途：投产日已终止或结项但未清算的，按迁入的权责事实存量由本策略继续处理；历史：已清算批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 清算成本已过账
  - 无需清算
  - 已清算（幂等）
  - 已提交过账
  - 已拒收
  - 期间关账中待重试
  scenarios:
  - PRC-35-S01
  - PRC-35-S02
  - PRC-35-S03
  - PRC-35-S04
  - PRC-35-S05
  - PRC-35-S06
  - PRC-35-S07
  - PRC-35-S08
  - PRC-35-S09
  - PRC-35-S10
  steps:
  - actor: system
    where: automatic
    command: 终止清算成本
    aggregate: AGG-43
    desc: 终止清算与超期转费用；余额转入当期损益，不依赖收入确认时点；本步只在批次内记结转行，过账由第 2 步提交（S-30）
    decision:
    - when: 该项目或协议已清算过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已清算（幂等）
    - when: 没有未结转的合同履约成本或售前投入
      goto: end
      outcome: 无需清算
    - when: otherwise
      goto: 2
    legal_entity: 承担法人
    cross_bc:
    - mode: event
      direction: in
      bc: B-04
      name: 项目已终止、项目已取消、项目已结项
    - mode: event
      direction: in
      bc: B-05
      name: 协议已终止
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-43
    post: true
    calls: PRC-92
    period_gate: true
    desc: 结转批次提交单一过账管道，幂等键为（来源对象、结转类型、期间）（INV-94）；结果由第 3 步订阅 BusinessFactAttributed 后置位
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 落账期间已关账且该法人有开放期间，自动落当前开放期间并标原期间
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已提交过账
    - when: 该法人无开放期间可落（过账管道拒收），拒收并告警
      goto: end
      rule: INV-92；拒收记录由 PRC-158 处置
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已提交过账
    legal_entity: 承担法人
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  - actor: system
    where: automatic
    command: 标记成本结转已过账
    aggregate: AGG-43
    branch: 订阅过账结果
    emits:
    - 成本结转已过账
    desc: 订阅 B-16 的 BusinessFactAttributed，按本批次幂等键置已过账并发成本结转已过账（仅分析）；同 AGG-73 标记已过账做法
    decision:
    - when: otherwise
      goto: end
      outcome: 清算成本已过账
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    legal_entity: 承担法人
    metric_event: true
  notes: 订阅关系 B-07 → B-04、B-05（事件）已有。
  stages_note: 按触发状态「项目已结项」归段；终止类结局不归段（SD-10）
  primary_object: none
  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
- id: PRC-55
  name: 结转合同履约成本
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-04.2
  triggers:
  - type: event
    name: BusinessFactAttributed（收入确认类型的过账事实）
    bc: B-16
    entry: 1
  - type: event
    name: BusinessFactAttributed（本批次的过账事实）
    bc: B-16
    entry: 3
  migration: 在途：投产日已确认收入但未结转成本的，按迁入的权责事实存量由本策略继续处理；历史：已结转批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 合同履约成本已结转
  - 无需结转
  - 已结转（幂等）
  - 非收入确认事实
  - 已提交过账
  - 已拒收
  - 期间关账中待重试
  scenarios:
  - PRC-55-S01
  - PRC-55-S02
  - PRC-55-S03
  - PRC-55-S04
  - PRC-55-S05
  - PRC-55-S06
  - PRC-55-S07
  - PRC-55-S08
  - PRC-55-S09
  - PRC-55-S10
  - PRC-55-S11
  steps:
  - actor: system
    where: automatic
    command: 结转合同履约成本
    aggregate: AGG-43
    desc: 过账事实为收入确认类型时；转出金额配对已确认收入；与收入确认同期间但不同事务（N-16）；本步只在批次内记结转行，过账由第 2 步提交（S-30）
    decision:
    - when: 过账事实不是收入确认类型
      goto: end
      outcome: 非收入确认事实
    - when: 该事实已结转过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已结转（幂等）
    - when: 该合同没有可转出的合同履约成本
      goto: end
      rule: INV-88
      outcome: 无需结转
    - when: otherwise
      goto: 2
      rule: INV-88
    legal_entity: 承担法人
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    pending:
    - A1
    - Q-04
    - Q20
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-43
    post: true
    calls: PRC-92
    period_gate: true
    desc: 结转批次提交单一过账管道，幂等键为（来源对象、结转类型、期间）（INV-94）；结果由第 3 步订阅 BusinessFactAttributed 后置位
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 落账期间已关账且该法人有开放期间，自动落当前开放期间并标原期间
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已提交过账
    - when: 该法人无开放期间可落（过账管道拒收），拒收并告警
      goto: end
      rule: INV-92；拒收记录由 PRC-158 处置
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已提交过账
    legal_entity: 承担法人
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  - actor: system
    where: automatic
    command: 标记成本结转已过账
    aggregate: AGG-43
    branch: 订阅过账结果
    emits:
    - 成本结转已过账
    desc: 订阅 B-16 的 BusinessFactAttributed，按本批次幂等键置已过账并发成本结转已过账（仅分析）；同 AGG-73 标记已过账做法
    decision:
    - when: otherwise
      goto: end
      outcome: 合同履约成本已结转
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    legal_entity: 承担法人
    metric_event: true
  notes: 依赖收入确认时点（A1、Q-04）与 AGG-57 形态（Q20）；两者定后重核转出金额的配对口径。
  stages_note: 事件策略按触发状态归段（#421）：触发是收入确认类型分录的过账回执，对应 OBJ-98「已记账（不可逆）」，是 VS-04.2 退出条件（收入确认类型分录）。触发名是事件名，检查器匹配不上。
  primary_object: none
  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I01 题；保留核算或处理结果、金额占用、核对签字、拒收处置、账号同步、提醒或规则修订依据，信息图不逐项单列业务记录。"
- id: PRC-64
  name: 导入银行流水
  type: business
  trigger:
    type: time
    desc: 每日或银行文件到达
  triggers:
  - type: time
    name: 每日定时拉取银行流水文件
  - type: event
    name: 银行文件已到达
    publisher: platform.integration
  stages: []
  owner_bc: B-22
  human_orchestration: false
  migration: 无在途实例（逐日自动导入）；历史流水迁入的来源与范围由数据模型组按 R-09 定，迁入走迁入通道只追加并保留原始文件与校验和，不触发过账候选
  scope: 按资金账户所属法人的数据范围（财务岗位）
  outcomes:
  - 流水已导入
  - 重复文件已忽略
  - 文件已拒收
  - 过账被拒收
  - 期间关账中待重试
  scenarios:
  - PRC-64-S01
  - PRC-64-S02
  - PRC-64-S03
  - PRC-64-S04
  - PRC-64-S05
  - PRC-64-S06
  - PRC-64-S07
  - PRC-64-S08
  - PRC-64-S09
  - PRC-64-S10
  roles:
  - id: SH-E6
    as: performer
  - id: SH-X7
    as: external
  steps:
  - actor: system
    where: external:银行
    evidence:
    - 银行原始流水文件（保留原样，INV-85）
    - 文件校验和与导入时刻
    command: 导入银行流水
    aggregate: AGG-88
    emits:
    - 流水已导入
    desc: 只追加，保留原始文件与校验和（INV-85）
    decision:
    - when: 银行文件校验和已导入过
      goto: end
      rule: INV-85
      outcome: 重复文件已忽略
    - when: 文件无法解析、资金账户未登记或与账户不符 → 拒收并告警
      goto: end
      rule: INV-85
      outcome: 文件已拒收
      alert: true
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 银行流水导入
    legal_entity: 资金账户所属法人
    audit: true
    metric_event: true
    timeout:
      after: P1D
      escalate_to: SH-E6
      interrupting: false
      pending:
      - T-01
    notify:
    - to: SH-E6
      how: 企业微信消息（文件拒收，或当日应到未到）
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-88
    calls: PRC-92
    desc: 利息与手续费
    period_gate: true
    decision:
    - when: 文件中没有利息或手续费行
      goto: end
      outcome: 流水已导入
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 流水已导入
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 流水已导入
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 资金账户所属法人
  notes: 匹配记在收款、付款上，流水不引用下游。步骤 2 只对利息与手续费行提交，其余流水行不过账。
  support: 导入银行流水是资金数据的采集，结局（流水已导入）不造出任何阶段的退出条件；为付款、回款的匹配提供依据（#421 判据①不支持归段）
  primary_object: OBJ-90
