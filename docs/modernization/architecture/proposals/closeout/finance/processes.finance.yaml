      approver: SH-E6
      multi_level: false
      on_reject: 2
    cross_bc:
    - mode: api
      direction: in
      bc: B-21
      name: 读对账状态
    pending:
    - ADR22-签字容差
  notes: 权责口径不等对账。
  roles:
  - id: SH-E6
    as: performer
  - id: SH-E6
    as: approver
  - id: SH-X7
    as: external
- id: PRC-105
  name: 评审并生效报表行定义版本
  trigger:
    type: human
    desc: 财务编制报表行到科目的映射
  stages:
  - VS-10.2
  owner_bc: B-21
  human_orchestration: false
  steps:
  - actor: SH-E6
    command: 编制报表行定义版本
    aggregate: AGG-86
    cross_bc:
    - mode: api
      direction: out
      bc: B-20
      name: 读科目表版本
    pending:
    - R-9-差异
  - actor: SH-E6
    command: 生效报表行定义版本
    aggregate: AGG-86
    desc: 只在期间首日生效（INV-91）
    decision:
    - when: 生效日不是期间首日
      goto: end
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
  notes: 草拟 → 财务评审 → 生效。
  roles:
  - id: SH-E6
    as: performer
  - id: SH-E6
    as: approver
- id: PRC-112
  name: 决议并支付利润分配
  trigger:
    type: human
    desc: 年度报表出具后，股东或合伙人提出回报要求
  stages:
  - VS-12.2
  owner_bc: B-10
  human_orchestration: false
  steps:
  - actor: SH-E6
    read: true
    reads:
    - AGG-81
    - AGG-100
    - AGG-54
    desc: 读所属年度已关账与可分配利润
    decision:
    - when: 所属年度未关账或可分配利润不足
      goto: end
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读所属年度关账状态
    - mode: api
      direction: out
      bc: B-20
      name: 读期间余额快照
    pending:
    - F-02
  - actor: SH-E6
    command: 草拟利润分配
    aggregate: AGG-109
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读股东或合伙人
    - mode: api
      direction: out
      bc: B-13
      name: 读法人主体
  - actor: SH-O1
    command: 决议利润分配
    aggregate: AGG-109
    emits:
    - 利润分配已决议
    desc: 决议额不超过可分配利润（INV-117）
    approval:
      doc_type: 利润分配决议
      approver: SH-O1
      multi_level: false
      on_reject: end
  - actor: SH-E6
    command: 提交应付利润
    aggregate: AGG-52
    emits:
    - 应付已确认
  - actor: SH-E6
    command: 登记利润分配支付
    aggregate: AGG-109
    emits:
    - 利润分配已支付
    gap: G-10
    cross_bc:
    - mode: event
      direction: out
      bc: B-15
      name: 利润分配已支付
  - actor: system
    command: 提交过账候选
    aggregate: AGG-109
    calls: PRC-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 支付走「发起、审批并执行付款」；自然人股东个税见「并入股息红利个税扣缴申报」。
  roles:
  - id: SH-E6
    as: performer
  - id: SH-O1
    as: approver
  - id: SH-E6
    as: reviewer
- id: PRC-114
  name: 退回出资
  trigger:
    type: human
    desc: 股东或合伙人申请部分或全部退回
  stages:
  - VS-12.3
  owner_bc: B-10
  human_orchestration: false
  steps:
  - actor: SH-E6
    command: 登记出资退回
    aggregate: AGG-54
    emits:
    - 出资已退回
    decision:
    - when: 退回额超过已实缴额
      goto: end
    - when: otherwise
      goto: 2
    pending:
    - G-11-出资退回
  - actor: system
    command: 提交过账候选
    aggregate: AGG-54
    calls: PRC-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 退回的资金收付走「发起、审批并执行付款」，应付类型承载见 G-11 末段。
  roles:
  - id: SH-O1
    as: initiator
  - id: SH-E6
    as: performer
