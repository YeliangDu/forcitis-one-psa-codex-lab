    desc: 登记退回后形成其他应付（出资退回），支付走 PRC-75，付款逐笔过账（PRC-132）；应付类型承载见 G-11
    emits:
    - 应付已确认
    decision:
    - when: otherwise
      goto: 3
    legal_entity: 被投资法人
    audit: true
    pending:
    - G-11-出资退回
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-54
    calls: PRC-92
    period_gate: true
    decision:
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账且退回后已实缴余额为零，自动落当前开放期间并标原期间
      goto: end
