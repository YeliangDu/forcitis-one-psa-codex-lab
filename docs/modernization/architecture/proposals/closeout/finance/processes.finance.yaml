    legal_entity: 被投资法人
    approval:
      engine: external
      doc_type: 减资或退伙决议
      approver: SH-O1
      why_human: 减资或退伙须股东会或合伙人会议决议，系统外形成，本系统登记结果与证据；退回额不超过已实缴额由规则守
      approver_basis: 减资与退伙属股东会或合伙人会议的法定职权，不是费用或业务归属对象责任人的职责
  - actor: system
