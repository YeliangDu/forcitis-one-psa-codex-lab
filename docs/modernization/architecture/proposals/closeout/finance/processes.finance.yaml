  notes: 生效后不可改，只能再变更（INV-16a、16b）。R-29：SH-E2 重复列两次已合并。
  segregation:
  - roles:
    - SH-E2
    as:
    - initiator
    rule: 变更提出人与审批责任人不得为同一人（责任人就是提出人本人时按 AR-11 处理，待 U-21、U-40）
  stages_note: 分包变更（AGG-56）生效即供方协议内容再次「已签署生效」，对应 OBJ-05（供方类型）「已签署生效」，是 VS-05.2 退出条件；与收入侧协议变更（PRC-48）对称。AGG-56 状态名「已生效」与 OBJ-05 状态名字面不同，检查器匹配不上。 R1-B-14：采购合同增减量、部分取消沿供方协议现有审批权限评估并批准，协议变更（OBJ-09）生效后形成新基线；已履行部分保留原履约及应付依据，未履行部分记录占用调整 / 释放与批准结果的对应，不以部分取消抹去已履行事实。
  primary_object: OBJ-09
  primary_object_note: 分包变更（AGG-56）对应 OBJ-09 协议变更；采购变更及部分取消归同一 OBJ-09 / PRC-71，审批与基线条件沿用现行约定；承载聚合的采购类型细化交负责会话核对
