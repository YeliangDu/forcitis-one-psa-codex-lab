  steps:
  - actor: system
    where: automatic
    command: 生成分录
    aggregate: AGG-84
    emits:
    - 分录已记账
    period_gate: true
    legal_entity: 事实所属法人（两个账簿各一组分录）
    metric_event: true
    desc: 两账分录同一事务（INV-96）；冲销按原分录逐行取反，重做才用现行规则版本（ADR-0022 决定 2）；来源不在授权表或映射表无对应类别则进待处理队列并告警，由 PRC-135 处理
    decision:
    - when: 同一事实的分录已生成（重复事件）
      goto: end
      rule: INV-96
      outcome: 重复事件已忽略
    - when: 目标期间已关账（关账前置检查要求生成队列为空，不应发生），拒收并告警
      goto: end
      rule: INV-100
      outcome: 已拒收
    - when: 来源不在控制科目授权表，或映射表找不到对应类别，进待处理队列并告警
      goto: end
      rule: INV-98
      outcome: 已进待处理队列
    - when: 事实只记权责账簿（客户确认收入、成本转入等），无收付口径分录
      goto: end
      rule: D17-1
      outcome: 已记账无需推送
    - when: otherwise
      goto: 2
    notify:
    - to: SH-E6
      how: 企业微信告警（进待处理队列或被拒收）
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactRestated
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
  - actor: system
    where: external:U8C
    command: 推送与重投
    aggregate: AGG-84
    added_in: closeout
    legal_entity: 事实所属法人（推送到该法人在 U8C 的收付账套）
    evidence:
    - U8C 返回码与凭证号
    - 推送批次与校验和
    desc: U-8：U8C 继续做法定账，新系统把收付口径分录推送 U8C 收付账套，按月在 PRC-104 对账；推送须幂等（确定性凭证号或外部键），接口自带认证、走内网或专线（ADR-0022 决定 8）；失败进死信，由 PRC-135 重投；权责账簿不推送
    decision:
    - when: 该凭证已推送（幂等键相同），不重复投递
      goto: end
      outcome: 已推送
    - when: 凭证依赖的客商、部门、人员主数据尚未同步到 U8C，挂起待重投
      goto: end
      outcome: 已挂起待重投
    - when: U8C 拒收，带返回码进死信并当日告警
      goto: PRC-135
    - when: otherwise
      goto: end
      outcome: 已推送
    notify:
    - to: SH-E6
      how: 企业微信告警（死信，当日告警财务与运维）
    pending:
    - S-05
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 外部法定账推送
  migration: 在途：投产前待处理队列与死信须清空（关账前置检查，ADR-0022 决定 10），在途事实随迁入核对办结。历史：历史分录经迁入通道写入，不经本策略生成、不推送 U8C（U8C 已有历史账）；投产前最近两个已结期间重算比对（U-10）。
  notes: R-28：原备注「G1 期间银行、税费、固定资产、薪酬汇总走 ledger 内导入通道」默认了两步走，改为形态待 ADR22-G1G2（过渡 ADR 取代，S-05）；人工部分（待处理队列、重投）在单聚合维护 PRC-135。
