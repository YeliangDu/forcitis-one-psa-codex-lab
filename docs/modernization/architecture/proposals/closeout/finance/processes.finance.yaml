- id: PRC-94
  name: 制单并过账受控手工凭证
  trigger:
    type: human
    desc: 财务因调整、差异或年度审计调整制单
  stages:
  - VS-10.1
  owner_bc: B-20
  human_orchestration: true
  human_note: 制单、复核、审批，复核人不同于制单人
  migration: 在途：草稿、已复核、已审批但未提交过账的手工凭证，投产前办结（提交过账）或作废重做，不迁半成品。历史：已记账的手工凭证以分录迁入（理由与附件作证据迁入），走迁入通道，不触发复核与审批（ADR-0036）。
  scope: 按凭证所属法人的财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-E6
    as:
    - performer
    - reviewer
    rule: 制单人与复核人不得为同一人（INV-108）
  - roles:
    - SH-E6
    - SH-M1
    as:
    - performer
    - approver
    rule: 审批人不得是制单人或复核人；财务负责人一级用 SH-M1 占位（ADR-0022 决定 3「财务主管审批」，待 F-01）
  triggers:
  - type: human
    name: 财务因调整、差异或年度审计调整制单
  outcomes:
  - 已提交过账
  - 已拒收
  roles:
  - id: SH-E6
    as: performer
  - id: SH-E6
    as: reviewer
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    command: 制单手工凭证
    aggregate: AGG-98
    permission: 总账.制单手工凭证
    page: 手工凭证编辑页
    audit: true
    legal_entity: 凭证所属法人
    desc: 必须有理由与附件；只影响一个账簿的须带差异类别代码；触及控制科目须在授权表内；年度审计调整类才可显式指定落账期间且只能指定第 13 期（INV-108）
    decision:
    - when: 缺理由或附件，或触及控制科目而来源通道不在授权表（INV-98）
      goto: end
      rule: INV-108
      outcome: 已拒收
    - when: 只影响一个账簿而未带差异类别代码
      goto: end
      rule: INV-97
      outcome: 已拒收
    - when: otherwise
      goto: 2
    pending:
    - A1-02
    - P-003
    - S-06
    - ADR46-P3
  - actor: SH-E6
    where: in_system
    command: 复核手工凭证
    aggregate: AGG-98
    permission: 总账.复核手工凭证
    page: 手工凭证复核页
    audit: true
    notify:
    - to: SH-E6
      how: 企业微信待办（待复核，复核人另行指派）
    decision:
    - when: 复核人与制单人为同一人，命令被拒，改由他人复核
      goto: 2
      rule: INV-108
    - when: 复核不通过，退回制单
      goto: 1
      rule: INV-108
    - when: otherwise
      goto: 3
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 手工凭证审批
    approval:
      engine: platform.approval
      doc_type: 手工凭证审批
      approver: SH-M1
      multi_level: false
      on_reject: 1
    permission: 总账.审批手工凭证
    page: 审批待办页（手工凭证审批）
    audit: true
    notify:
    - to: SH-M1
      how: 企业微信待办
    decision:
    - when: 审批人与制单人或复核人为同一人，驳回
      goto: 1
    - when: 审批驳回，退回制单
      goto: 1
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    pending:
    - F-01
  - actor: SH-E6
    where: in_system
    command: 提交过账候选
    aggregate: AGG-98
    emits:
    - 手工凭证已提交过账
    calls: PRC-92
    permission: 总账.提交手工凭证过账
    page: 手工凭证详情页（提交过账）
    audit: true
    period_gate: true
    legal_entity: 凭证所属法人
    metric_event: true
    desc: 年度审计调整类带显式落账期间（仅第 13 期）；显式期间未开放即拒并告警，不改落其他期间（ADR-0046 第 3 项第 2 条）；其余按业务日期过期间闸门，已关账则路由到开放期间并标原期间（PRC-92）
    decision:
    - when: 显式指定的落账期间未开放或未启用，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 过账管道拒收（借贷不平、法人不一致、无开放期间），拒收并告警
      goto: end
      rule: INV-93
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 已提交过账
    notify:
    - to: SH-E6
      how: 企业微信告警（过账被拒收）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    pending:
    - P-001
    - P-004
  notes: 显式期间未开放即拒并告警，不改落其他期间（ADR-0046）。年度审计调整类的前提是有审计师提出调整，而用户已定无法定审计、只有内部审计，该类凭证是否仍存在、由谁提出调整待定（S-06、ADR46-P3）。
  scenarios:
