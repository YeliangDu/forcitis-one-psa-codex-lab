- id: PRC-95
  name: 期末结转
  trigger:
    type: time
    desc: 月末业务过账完成后
  stages:
  - VS-10.1
  owner_bc: B-20
  human_orchestration: false
  migration: 在途：投产日所在期间的首次结转在新系统生成，无在途。历史：只迁已记账的结转分录，不重建运行单据（历史期间为终态）；投产前最近两个已结期间用模板重算比对（U-10）。
  scope: 按法人（法人 × 期间 × 模板版本）
  triggers:
  - type: time
    name: 月末业务过账完成后，到点创建待办（platform.scheduling）
  outcomes:
  - 已过账
  - 已有有效运行
  - 已拒收
  roles:
  - id: SH-E6
    as: performer
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-84
    desc: 读本期分录与余额，作为结转依据
  - actor: SH-E6
    where: in_system
    command: 生成期末结转运行
    aggregate: AGG-99
    permission: 总账.生成期末结转运行
    page: 期末结转运行页
    period_gate: true
    audit: true
    legal_entity: 结转所属法人
    notify:
    - to: SH-E6
      how: 企业微信待办（月末结转）
    desc: 每（法人，期间，模板）只有一次有效运行（INV-109）；已过账的只能冲销重做；模板按版本生效
    decision:
    - when: 本法人本期间本模板已有有效运行
      goto: end
      rule: INV-109
      outcome: 已有有效运行
    - when: 目标期间已关账，拒收并告警（期末凭证不路由到其他期间）
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: otherwise
      goto: 3
    pending:
    - P-001
    - P-002
    - ADR46-P3
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-99
    emits:
    - 期末结转已过账
    calls: PRC-92
    period_gate: true
    legal_entity: 结转所属法人
    metric_event: true
    desc: 损益结转、未分配利润等期末凭证经单一过账管道
    decision:
    - when: 过账管道拒收（借贷不平、无开放期间），拒收并告警
      goto: end
      rule: INV-93
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 已过账
    notify:
    - to: SH-E6
      how: 企业微信告警（结转被拒收）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 已过账的只能冲销重做（经 PRC-92 更正入口取反后重新生成运行）；第 13 期能否有模板期末凭证待 ADR46-P3 与 P-001、P-002。
  scenarios:
  - PRC-95-S01
  - PRC-95-S02
  - PRC-95-S03
  - PRC-95-S04
  - PRC-95-S05
  - PRC-95-S06
- id: PRC-96
  name: 分配人工成本
  type: business
  trigger:
    type: event
    events:
    - event: BusinessFactAttributed
      aggregate: AGG-77
    gate: 期间闸门——工时与薪酬事实均已过账（P-41）且目标期间开放，月末才触发（⑥a 评审 M7）
  stages:
  - VS-10.1
  owner_bc: B-07
  human_orchestration: false
  migration: 在途：已试算未确认的分配运行不迁，投产前办结或投产后重新试算；历史：不作为单据迁入，结果由迁入的权责事实承载（U-3，R-08），投产前最近两个已结期间按 U-10 重算比对
  scope: 财务职能，按承担法人数据范围
  triggers:
  - type: event
    name: BusinessFactAttributed（工时、薪酬类过账事实）
    bc: B-16
  outcomes:
  - 人工成本分配已过账
  - 未到分配条件
  - 本期已分配
  - 已拒收
  scenarios:
  - PRC-96-S01
  - PRC-96-S02
  - PRC-96-S03
  - PRC-96-S04
  - PRC-96-S05
  - PRC-96-S06
  - PRC-96-S07
  roles:
  - id: SH-E6
    as: performer
  steps:
  - actor: system
    where: automatic
    read: true
    reads:
    - AGG-77
    - AGG-81
    desc: 读已过账的工时与薪酬事实，只分配已锁定工时
    decision:
    - when: 本期已有有效的人工成本分配运行（每期间一次有效）
      goto: end
      rule: INV-89
      outcome: 本期已分配
    - when: 目标期间已关账或未开放，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 工时与薪酬事实未齐备（有工时无薪酬或有薪酬无工时，预警）
      goto: end
      rule: P-41
      outcome: 未到分配条件
    - when: otherwise
      goto: 2
    notify:
    - to: SH-E6
      how: 企业微信预警（事实未齐备或期间未开放的原因）
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    - mode: api
      direction: out
      bc: B-16
      name: 读已过账事实
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
  - actor: SH-E6
    where: in_system
    command: 试算人工成本分配
    aggregate: AGG-41
    desc: P-41 有工时无薪酬、有薪酬无工时预警
    permission: 成本.人工成本分配试算
    page: 人工成本分配试算页
    legal_entity: 承担法人
    audit: true
    pending:
    - FD-09
  - actor: SH-E6
    where: in_system
    command: 确认人工成本分配
    aggregate: AGG-41
    decision:
    - when: 分配合计不等于实际人工成本（零容差）
      goto: 2
      rule: INV-89
    - when: otherwise
      goto: 4
    permission: 成本.人工成本分配确认
    page: 人工成本分配确认页
    legal_entity: 承担法人
    audit: true
    pending:
    - FD-09
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-41
    emits:
    - 人工成本分配已过账
    calls: PRC-92
    period_gate: true
    decision:
    - when: 落账期间已关账且无开放期间可路由，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: 过账管道拒收（借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-93
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 人工成本分配已过账
    legal_entity: 承担法人
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 分配合计等于实际人工成本，零容差（INV-89）；口径待 FD-09。试算后确认无超时或退回分支，按非人工编排（⑥a 评审 M1）。
- id: PRC-97
  name: 批准并生效分摊规则版本
  type: business
  trigger:
    type: human
    desc: 财务按期间首日发布规则
  stages:
  - VS-10.1
  owner_bc: B-07
  human_orchestration: false
  migration: 在途：未批准草稿不迁，投产前办结或重编；历史：已生效版本全部迁入（被引用版本只追加不可改），至少覆盖 U-10 重算所需的最近两个已结期间（R-08）
  scope: 财务职能，按承担法人数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    rule: 编制人不得同时为批准人（审批人不得与执行人同为 SH-E6）
  triggers:
  - type: human
    name: 财务编制分摊规则版本（按期间首日发布）
  outcomes:
  - 分摊规则已生效
  - 已驳回
  - 已拒收
  scenarios:
  - PRC-97-S01
  - PRC-97-S02
  - PRC-97-S03
  - PRC-97-S04
  - PRC-97-S05
  roles:
  - id: SH-E6
