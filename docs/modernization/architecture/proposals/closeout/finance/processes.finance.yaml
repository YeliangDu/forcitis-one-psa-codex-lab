      goto: end
      outcome: 已申报无需缴款
      rule: P-39
    - when: 提交时已过法定申报期截止日（逾期申报）：告警，滞纳金与罚款由税务端核定，缴款时一并登记
      goto: 4
      alert: true
      rule: P-39
    - when: otherwise
