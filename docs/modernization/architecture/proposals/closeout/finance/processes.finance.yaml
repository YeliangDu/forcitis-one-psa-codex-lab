  stages:
  - VS-10.1
  owner_bc: B-17
  human_orchestration: false
  migration: 在途：投产前须办结，投产日前不存在已启用的第 13 期。历史：迁入的历史年度只建 1–12 期的历史期间，不建第 13 期（ADR-0046 §8.7）；首个启用第 13 期的年度待 P-003。
  scope: 按会计年度全局启用，按（法人 × 年度）关账；财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - initiator
    - approver
    rule: 发起年末关账与确认年末关账不得为同一人（ADR-0045 决定 1、ADR-0046 第 5 项第 5 条；R-01 补）；确认人级别占位 SH-M1，待 F-01
  - roles:
    - SH-E6
    - SH-M1
    as:
    - initiator
    - approver
    rule: 启用登记人与批准人不得为同一人（AGG-96 带财务批准人，P-003 定后写入）
  triggers:
  - type: time
    name: 会计年度末，12 月关账前（platform.scheduling 到点创建待办）
    entry: 1
  - type: human
    name: 财务开立新会计年度（年末前下一年度尚未开立时预警）
    entry: 8
  outcomes:
  - 年末已关账
  - 检查未通过保持开放
  - 已拒收
  - 会计年度已开立
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  steps:
