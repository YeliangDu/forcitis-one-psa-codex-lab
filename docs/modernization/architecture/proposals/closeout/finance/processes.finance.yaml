    added_in: closeout
    desc: 冲销已过账的分摊运行属冲销已过账事实，按 APPROVAL_RULES AR-06 加审（S-31 SQ-17）
    approval:
      engine: platform.approval
      doc_type: 分摊运行冲销审批
      approver: cost_object_owner
      multi_level: false
      why_human: 已过账的分摊运行是否确属有误、应冲销还是另行更正，要对这笔成本负责的人判断；冲销只能取反加新事实（INV-95）、重做借贷平衡与期间由规则守，不靠审批
      on_reject: end
      on_reject_outcome: 冲销已驳回
      escalation_rules:
      - AR-06
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    permission: 成本.冲销审批
    page: 审批待办（审批平台）
    audit: true
    withdraw:
      to: end
      outcome: 已撤回
    pending:
    - AR-06
  - actor: SH-E6
    where: in_system
    command: 冲销分摊运行
    aggregate: AGG-42
    branch: 冲销
    added_in: closeout
    evidence:
    - 冲销依据（更正说明、原运行引用）
    desc: 审批通过后经 B-16 冲销并重过账（INV-95）；所属期间已关账的不再冲原运行，差额进下期运行（ADR-0045 决定 2）；冲销后本期可再跑一次有效运行（INV-89、90、109 的「一次有效」按冲销后失效计）
    decision:
    - when: 原运行所属期间已关账，不再冲原运行，差额进下期运行
      goto: end
      rule: ADR-0045 决定 2
      outcome: 差额进下期运行
    - when: 该运行已冲销过
      goto: end
      rule: 状态机：仅已过账可冲销
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 5
    permission: 成本.冲销
    page: 分摊运行冲销页
    audit: true
    metric_event: true
    legal_entity: 承担法人
    cross_bc:
