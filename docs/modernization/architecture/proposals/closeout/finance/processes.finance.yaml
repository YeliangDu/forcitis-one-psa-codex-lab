  scope: 按法人与股东关系的数据范围（财务负责人与财务岗位）
  outcomes:
  - 已决议待支付
  - 决议未通过
  - 已拒收
  - 过账被拒收
  - 决议已撤销
  - 撤销未通过
  - 期间关账中待重试
  scenarios:
  - PRC-112-S01
  - PRC-112-S07
  - PRC-112-S08
  - PRC-112-S09
  - PRC-112-S11
  - PRC-112-S12
  - PRC-112-S13
  - PRC-112-S15
  - PRC-112-S16
  - PRC-112-S17
  - PRC-112-S18
  - PRC-112-S19
  - PRC-112-S20
  - PRC-112-S21
  - PRC-112-S22
  roles:
  - id: SH-E6
    as: performer
  - id: SH-O1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-81
    - AGG-100
    - AGG-54
    desc: 读所属年度已关账与可分配利润
    decision:
    - when: 所属年度未关账或可分配利润不足
      goto: end
      rule: INV-117
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 利润分配.查看
    page: 利润分配草拟页
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读所属年度关账状态
    - mode: api
      direction: out
      bc: B-20
      name: 读期间余额快照
    pending:
    - F-02
    legal_entity: 被分配法人
    command: 读取已关账年度与可分配利润
  - actor: SH-E6
    where: in_system
    command: 草拟利润分配
    aggregate: AGG-109
    decision:
    - when: otherwise
      goto: 3
    permission: 利润分配.草拟
    page: 利润分配草拟页
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读股东或合伙人
    - mode: api
      direction: out
      bc: B-13
      name: 读法人主体
    legal_entity: 被分配法人
    audit: true
  - actor: SH-O1
    where: offline
    recorded_by: SH-E6
    evidence:
    - 股东会或合伙人会议决议原件扫描件（决议号、决议日期、决议金额）
    command: 决议利润分配
    aggregate: AGG-109
    emits:
    - 利润分配已决议
    desc: 决议在线下形成，本系统登记结果与证据；决议额不超过可分配利润（INV-117）
    approval:
      engine: aggregate
      doc_type: 利润分配决议
      approver: SH-O1
      multi_level: false
      why_human: 向股东或合伙人分配利润是公司治理事项，依法须股东会或合伙人决议，不由业务责任人批；可分配利润上限与决议额不超过上限已由规则守（INV-117），决议结果与证据在线下形成并登记
      approver_basis: 利润分配决议属股东会或合伙人会议的法定职权，不是费用或业务归属对象责任人的职责，故不按 cost_object_owner 解析，取股东（SH-O1）
      on_reject: end
      on_reject_outcome: 决议未通过
    decision:
    - when: 决议未通过
      goto: end
      outcome: 决议未通过
    - when: 决议额超过所属年度可分配利润（INV-117）→ 拒收并告警
      goto: end
      rule: INV-117
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 4
    permission: 利润分配.登记决议
    page: 利润分配决议登记页
    metric_event: true
    audit: true
    legal_entity: 被分配法人
  - actor: SH-E6
    where: in_system
    command: 提交应付利润
    aggregate: AGG-52
    emits:
    - 应付已确认
    desc: 决议后即按决议金额形成应付股利（会计上决议时点确认应付，S-31 SQ-02）：AGG-109 决议后调 AGG-52「提交应付利润」，由应付侧提交应付事实；每位股东一张应付；支付走 PRC-75，支付登记由 PRC-163 订阅「应付已结清」完成；决议后 90 日应付仍未结清则提醒升级
    decision:
    - when: otherwise
      goto: 5
    permission: 应付.提交应付利润
    page: 利润分配详情页
    legal_entity: 被分配法人
    audit: true
    timeout:
      after: P90D
      relative_to: 决议日
      escalate_to: SH-M1
      interrupting: false
      pending:
      - T-01
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-52
    calls: PRC-92
    period_gate: true
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已决议待支付
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已决议待支付
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 被分配法人
    desc: 应付股利确认事实在决议时点由应付侧过账（S-31 SQ-02）；AGG-109 自己的「提交过账候选」只留给不经应付的项（如提取盈余公积，分录落点待 U-44），同一经济事项不两边过账；支付由付款逐笔过账（PRC-132）
  - actor: SH-O1
    where: offline
    recorded_by: SH-E6
    branch: 撤销决议
    added_in: closeout
    evidence:
    - 撤销决议原件扫描件（决议号、决议日期）
    command: 撤销利润分配决议
    aggregate: AGG-109
    emits: []
    desc: 决议在线下撤销，本系统登记结果与证据；利润分配置「已撤销」（以新决议撤销原决议，留原决议；决议不是运行单据，不用「已冲销」，S-34 ②）；已决议且尚无支付才可撤销，已有支付的须先走付款退票；撤销后注销未付应付，已过账的应付股利经冲销过账更正
    approval:
      engine: aggregate
      doc_type: 利润分配决议撤销
      approver: SH-O1
      multi_level: false
      why_human: 撤销已作出的利润分配决议是公司治理事项，依法须股东会或合伙人会议决议，不由业务责任人批；是否已有支付由规则守，撤销结果与证据在线下形成并登记
      approver_basis: 利润分配决议的撤销属股东会或合伙人会议的法定职权，不是费用或业务归属对象责任人的职责，取股东（SH-O1）
      on_reject: end
      on_reject_outcome: 撤销未通过
    decision:
    - when: 撤销决议未通过
      goto: end
      outcome: 撤销未通过
    - when: 已有支付（已部分支付或已支付），不可撤销，拒收并告警
      goto: end
      rule: 状态机：仅已决议可撤销
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 7
    permission: 利润分配.登记撤销决议
    page: 利润分配决议登记页（撤销）
    audit: true
    legal_entity: 被分配法人
  - actor: system
    where: automatic
    command: 〔缺〕冲销应付利润
    aggregate: AGG-52
    branch: 撤销决议
    added_in: closeout
    desc: 决议撤销后注销该决议的未付应付（无核销方可注销）；〔缺〕命令聚合稿未列，S-34 ② 只要求过账更正，应付注销为本稿提议
    decision:
    - when: 该决议的应付已有核销（已付款）
      goto: end
      rule: 状态机：已有支付不可撤销
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 8
    audit: true
    legal_entity: 被分配法人
    pending:
    - S34-应付注销
  - actor: system
    where: automatic
    command: 冲销并重过账
    aggregate: AGG-77
    calls: PRC-92
    branch: 撤销决议
    added_in: closeout
    period_gate: true
    desc: 已过账的应付股利经 PRC-92 更正入口冲销过账（S-34 ②；INV-95），未过账则无此步实际效果
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 决议已撤销
    - when: 过账管道拒收（原事实不存在或已被冲销、该法人无开放期间、借贷不平），拒收并告警
      goto: end
      rule: INV-92、INV-93、INV-95；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 决议已撤销
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 冲销并重过账
    legal_entity: 被分配法人
  notes: 支付走「发起、审批并执行付款」（PRC-75）；自然人股东个税见「并入股息红利个税扣缴申报」（PRC-113）。决议是聚合命令（R-15），engine 为 aggregate。 支付登记已移出本流程：由事件策略 PRC-163 订阅「应付已结清」完成（S-31 SQ-02、S-34 ③）；撤销后置「已撤销」、已过账应付股利经冲销过账更正（S-34 ②）。
  segregation:
