- id: PRC-104
  name: 外部法定账对账与签字
  trigger:
    type: event
    events:
    - event: 期间余额快照已生成
      aggregate: AGG-100
  stages:
  - VS-10.2
  owner_bc: B-20
  human_orchestration: false
  migration: 在途：投产前以最近两个已结期间重算比对（U-10），比对结论作迁入核对证据，不迁对账运行单据。历史：历史期间的对账在老系统与 U8C 完成，不重做。
  scope: 按法人（法人 × 期间），财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - performer
    - approver
    rule: 登记对账差异者与签字接受者不得为同一人；签字人级别占位 SH-M1（ADR-0022 决定 8「财务负责人逐项签字接受」，签字人与容差待定）
  triggers:
  - type: event
    name: 期间余额快照已生成
    publisher_bc: B-20（同 BC，PRC-103）
  outcomes:
  - 差异已清零
  - 已签字接受
  - 对账未完成
  roles:
  - id: SH-E6
    as: performer
  - id: SH-M1
    as: approver
  steps:
  - actor: system
    where: external:U8C
    read: true
    reads:
    - AGG-100
    - AGG-84
    evidence:
    - U8C 收付账套按法人 × 科目的期末余额与本期发生额（经新旧科目对照）
    - 已推送未记账清单
    legal_entity: 被对账法人
    desc: U-8：U8C 继续做法定账，新系统按月把收付口径账簿与 U8C 收付账套对账；权责口径账簿不与 U8C 对账（ADR-0022 决定 8）；关账日前须由财务在 U8C 审核并记账
    decision:
    - when: U8C 余额读取失败或无响应，告警并结束，待重试
      goto: end
      outcome: 对账未完成
    - when: otherwise
      goto: 2
    notify:
    - to: SH-E6
      how: 企业微信告警（外部法定账余额读取失败）
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 读外部法定账余额
    pending:
    - S-05
  - actor: SH-E6
    where: in_system
    command: 登记对账差异
    aggregate: AGG-101
    audit: true
    legal_entity: 被对账法人
    permission: 总账.登记对账差异
    page: 外部法定账对账页
    desc: 按法人 × 科目登记差异与已推送未记账清单；红字冲销按净额核对（ADR-0022 决定 10）
    decision:
    - when: 差异清零
      goto: end
      rule: INV-107
      outcome: 差异已清零
    - when: otherwise
      goto: 3
    notify:
    - to: SH-M1
      how: 企业微信待办（对账差异待签字）
    cross_bc:
    - mode: api
      direction: in
      bc: B-21
      name: 读对账状态
  - actor: SH-M1
    where: in_system
    command: 签字接受差异
    aggregate: AGG-101
    emits:
    - 对账已完成
    audit: true
    metric_event: true
    legal_entity: 被对账法人
    permission: 总账.签字接受对账差异
    page: 外部法定账对账页（签字）
    approval:
      engine: aggregate
      doc_type: 对账差异签字
      approver: SH-M1
      multi_level: false
      on_reject: 2
    desc: R-15：聚合命令，签字人与签字结论写入聚合；差异清零或签字接受，否则收付口径账簿不得出表（INV-107）；权责报表不受阻塞（ADR-0022 决定 10）
    decision:
    - when: 签字人与登记差异者为同一人，命令被拒，改由他人签字
      goto: 3
    - when: 不接受差异，退回重新查明并登记
      goto: 2
    - when: otherwise
      goto: end
      rule: INV-107
      outcome: 已签字接受
    cross_bc:
    - mode: api
      direction: in
      bc: B-21
      name: 读对账状态
    pending:
    - ADR22-签字容差
    - F-01
    - P2-03
  notes: 权责口径不等对账。v1 的外部方 SH-X7（资金监管主办银行）与 U8C 无关，已去掉；U8C 是外部系统，写在 where。
