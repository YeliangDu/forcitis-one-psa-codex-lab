      goto: end
      outcome: 已放弃申报
      alert: true
    - when: otherwise
      goto: 3
    permission: 税务申报.更正
    page: 税务申报工作台
    audit: true
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-90
    calls: PRC-92
    desc: 税费过账
    period_gate: true
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 已缴款
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93；拒收记录由 PRC-158 处置
