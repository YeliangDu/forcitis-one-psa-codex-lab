    permission: 月结.发起关账
    page: 月结关账页（发起）
    desc: 期间转为关账中；「关账中」是否仍接受过账未定（AGG§7-15）；发起后期间进入关账中：业务日期在本期的过账候选得到「期间关账中、可重试」，由来源 BC 投递重试，不进拒收记录（INV-92，S-31 SQ-12）；确认关账后按 ADR-0045 决定 2 路由到开放期间并标原期间，退回开放则仍落原期
    decision:
    - when: 期间已关账或已在关账中，拒收并告警
      goto: end
      rule: INV-92；ADR-0045 决定 1
      outcome: 已拒收
