    - when: otherwise
      goto: 3
    permission: 付款.查看
    page: 付款发起页
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读收款账户
    - mode: api
      direction: out
      bc: B-22
      name: 读流水行与资金账户
    - mode: api
      direction: out
      bc: B-13
      name: 读员工收款账户
    notify:
    - to: 审批人
      how: 审批待办标注「收款账户近期变更（P-01）」
    command: 读取收款账户与资金账户
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 审批付款
    desc: 经办、审批、出纳、记账不相容，经 platform.identity 校验（INV-81）；审批人按应付所归属的项目或部门取责任人；无单一归属对象的（税费、利润分配、薪酬）取承担法人的财务部门责任人（待用户定 F-03）；超阈值、关联方等异常按 APPROVAL_RULES 加审；归属对象由来源 BC 在载荷里带（类型 + ID）与已解析的责任人 ID；组织单元、法人财务部门的责任人经
      B-13 解析；B-10 读不到的归属（如 B-04 的项目）由来源 BC 在「确认应付」时写到应付上，沿 S-17 的 api 载荷，不加 B-10 → B-04 边；责任人在确认后变更而过时时，审批提交时由 platform.approval 按 AR-12 转办兜底；没有单一归属对象的付款见 U-19（S-31 SQ-33）；审批紧接「发起付款」，审批对象是 AGG-53 发起付款（A
      为费用归属对象责任人），登记银行结果不是审批对象（S-36 ②）
    approval:
      engine: platform.approval
      doc_type: 付款审批
      approver: cost_object_owner
      multi_level: false
      why_human: 提前付款、资金头寸安排与抵扣处理要有人对这笔支出负责判断；合同付款条件项是否到期、应付争议状态、应付余额、收款账户与协议相对方一致、协议依据、供方准入、不相容职务都已由规则拦截或预警，不靠审批
      on_reject: 3
      escalation_rules:
      - AR-01
      - AR-02
      - AR-07
      - AR-11
      - AR-12
    decision:
    - when: 审批人与发起人或出纳为同一人 → 驳回
      goto: 4
      rule: INV-81
      alert: true
    - when: otherwise
      goto: 5
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    - mode: api
      direction: out
      bc: platform.identity
      name: 校验不相容职务
    notify:
    - to: 审批人
      how: 企业微信待办
    - to: SH-E6
      how: 企业微信待办（审批通过，待出纳执行）
    audit: true
    permission: 付款.审批
    page: 审批待办（审批平台）
    pending:
    - F-Q1-阈值（AR-01、AR-02 的付款阈值）
    - AR-11
    - F-03
    - U-19
    withdraw:
      to: 4
      outcome: 已撤回
    timeout:
      after: P3D
      escalate_to: 审批人上级
      interrupting: false
      rule: RULE-377、RULE-379、RULE-380、RULE-382
      pending:
      - T-01
  - actor: SH-E6
    where: in_system
    command: 发起付款
    aggregate: AGG-53
    inner:
    - command: 在应付上核销占用
      aggregate: AGG-52
    desc: 先占用再建付款（⑥a 评审 M6）：分配行先在应付上核销占用（付款不超过未付余额，INV-79），再建付款；两次事务各改一个聚合
    decision:
    - when: 付款超过应付未付余额
      goto: end
      rule: INV-79
      outcome: 已拒收
      alert: true
    - when: 占用成功而建付款失败
      goto: 4
    - when: otherwise
      goto: 2
    permission: 付款.发起
    page: 付款发起页
    legal_entity: 资金账户所属法人
    audit: true
  - actor: system
    where: automatic
    command: 释放核销占用
    aggregate: AGG-52
    branch: 补偿（占用成功而建付款失败）或审批驳回
    desc: 补偿顺序与占用相反；孤儿占用另有定时释放兜底
    decision:
    - when: 来源为发起人撤回
      goto: end
      outcome: 已撤回
    - when: 来源为审批驳回
      goto: end
      outcome: 已驳回
    - when: otherwise
      goto: end
      outcome: 发起失败已补偿
    notify:
    - to: SH-E6
      how: 企业微信消息（驳回、撤回或发起失败）
    audit: true
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
  - actor: SH-E6
    where: external:银行
    evidence:
    - 银行回单（回单编号、到账或支出金额、时刻）
    - 引用的银行流水行 ID
    command: 登记银行结果
    aggregate: AGG-53
    emits:
    - 付款已成功
    desc: 出纳在银行完成支付后登记；之后由事件策略接续：付款已成功 → 核销应付（PRC-131）→ 应付已核销 → 标记付款已核销并提交过账候选（PRC-132）；报销置已付见 PRC-133；回单金额与时刻由银行流水匹配（PRC-64 已导入）自动带出，出纳只确认；出纳是否单列角色（会计法要求出纳不得兼管稽核、档案和收支、债权债务账目登记）交用户，推荐单列并在 platform.identity
      设不相容权限组，属 J 系列岗位体系（S-31 SQ-09）
    decision:
    - when: 出纳与发起人或审批人为同一人 → 拒收并告警，改由其他出纳登记
      goto: 5
      rule: INV-81
      alert: true
    - when: 银行回单金额与分配合计不符（INV-78a）→ 拒收并告警，退回出纳更正
      goto: 5
      rule: INV-78a
      alert: true
    - when: 银行结果为失败或退票
      goto: 6
    - when: otherwise
      goto: end
      outcome: 付款已成功
    permission: 付款.登记银行结果
    page: 付款执行页
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 读已导入的银行流水行（自动带出金额与时刻）
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    legal_entity: 资金账户所属法人
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
      pending:
      - T-01
    metric_event: true
    audit: true
    pending:
    - SQ-09
  - actor: SH-E6
    where: external:银行
    evidence:
    - 银行退票或失败回单
    command: 登记付款失败
    aggregate: AGG-53
    branch: 退票
    emits:
    - 付款已失败
    inner:
    - command: 释放核销占用
      aggregate: AGG-52
    desc: 退票时释放占用，付款重入
    decision:
    - when: 重新发起付款
      goto: 3
    - when: otherwise
      goto: end
      outcome: 付款已失败
    permission: 付款.登记失败
    page: 付款执行页
    metric_event: true
    audit: true
  - actor: SH-E6
    where: external:银行
    evidence:
    - 银行退票回单（回单编号、退票金额、时刻）
    command: 登记退票
    aggregate: AGG-53
    branch: 付款成功后退票
    added_in: closeout
    emits:
    - 付款已退票
    desc: 付款已成功并已核销后银行退票：付款置已退票，发付款已退票；退回金额与原付款一致
    decision:
    - when: 付款尚未核销或已失败，不适用退票登记
      goto: end
      rule: 状态机：仅已核销可登记退票
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已登记退票
    permission: 付款.登记退票
    page: 付款执行页（退票）
    audit: true
    metric_event: true
    legal_entity: 资金账户所属法人
  - actor: system
    where: automatic
    command: 冲回应付核销
    aggregate: AGG-52
    branch: 订阅付款已退票或付款已部分退回
    added_in: closeout
    desc: 订阅付款已退票，把原核销冲回，恢复未结余额（同 BC）；订阅付款已部分退回时只冲回退回额，应付从已结清回到已部分结清（PAYROLL_REISSUE_SEAM J-2）；之前发出的应付已结清不撤回，补发付清后再发一次；应付已结清的下游效果（报销置已付）的回退待用户定
    decision:
    - when: 该付款的核销已冲回（事件重复，幂等）
      goto: end
      rule: INV-94
      outcome: 重复事件已忽略
    - when: otherwise
      goto: 9
    legal_entity: 应付所属法人
    audit: true
  - actor: system
    where: automatic
    command: 冲销并重过账
    aggregate: AGG-77
    calls: PRC-92
    branch: 退票冲销过账
    added_in: closeout
    period_gate: true
    desc: 经 PRC-92 更正入口冲销原付款核销的过账事实
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 退票已冲回
    - when: 过账管道拒收（原事实不存在或已被冲销、该法人无开放期间、借贷不平），拒收并告警
      goto: end
      rule: INV-92、INV-93、INV-95；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 退票已冲回
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 冲销并重过账
    legal_entity: 资金账户所属法人
  - actor: SH-E6
    where: external:银行
    evidence:
    - 银行代发退回回单（回单编号、退回金额、退回收款人、时刻）
    command: 〔缺〕登记代发退回
    aggregate: AGG-53
    branch: 代发部分退回
    added_in: closeout
    emits:
    - 付款已部分退回
    desc: 代发总额已付并已核销后，部分收款人失败、款项退回：付款仍为已核销，累计退回额增加，发付款已部分退回，由步骤 8 只冲回退回额、步骤 9 冲销对应过账（借 银行存款，贷 应付职工薪酬）；全额退回走步骤 7（PAYROLL_REISSUE_SEAM J-2）
    decision:
    - when: 付款尚未核销，或累计退回额将超过付款金额，拒收并告警
      goto: end
      rule: 状态机：仅已核销可登记；累计退回额 ≤ 付款金额
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已登记代发退回
    permission: 付款.登记退票
    page: 付款执行页（退票）
    audit: true
    legal_entity: 资金账户所属法人
  notes: 应付已结清的订阅方 B-15（薪酬，PRC-127）。薪酬补发不新建应付：退回已把原应付冲回到已部分结清，B-15 PRC-126 收到薪酬补发已发起后在原应付上登记补发明细（AGG-52 登记薪酬补发明细），本流程按明细付清未结余额（one-architecture 2026-10-22 裁定 J-1）。原步骤 6–8（核销应付、标记付款已核销、提交过账候选）改为事件策略 PRC-131、PRC-132（⑥a 评审 M6）。审批人 SH-M1 为占位（F-01）。 付款成功后退票（S-30 ③）：步骤 7 登记退票发付款已退票，步骤 8–9 为同 BC 反应（AGG-52 冲回应付核销，再冲销并重过账），不用「已被取代」。 预付款登记（PRC-175
    步 5）与「预付款冲抵应付」（PRC-176）：预付款进待付清单的触发待补（见 NOTES 结构问题）。
  stages_note: "结局「付款已成功 / 已核销」造出 VS-05.5 完成付款、VS-08.3 完成报销付款、VS-13.5 的退出条件（#421 判据①）；借款发放不让借款结清，不归 VS-08.1；利润分配与出资退回的退出条件由 PRC-163、PRC-114 造出"
  primary_object: OBJ-86
- id: PRC-76
  name: 完成并结算供方协议
  type: business
  trigger:
    type: event
    events:
    - event: 供方履约已确认
      aggregate: AGG-57
    desc: 累计达协议金额或额度用尽时本 BC 策略触发完成；结算由人工发起
  triggers:
  - type: event
    name: 供方履约已确认
    publisher: B-11（同 BC）
    entry: 1
  - type: human
    name: 经办人对未完成协议登记终止（含未结算即结项）
    entry: 4
  stages:
  - VS-05.6
  owner_bc: B-11
  human_orchestration: false
  migration: 在途（已完成未结算）投产前办结或以已完成状态迁入后在新系统结算；已结算、已终止的协议全部迁入（U-3、U-4），迁入不发事件
  scope: 按项目承担部门的数据范围
  outcomes:
  - 已结算
  - 已终止
  - 未达完成条件
  - 已驳回
  - 已撤回
  scenarios:
  - PRC-76-S05
  - PRC-76-S06
  - PRC-76-S07
  - PRC-76-S08
  - PRC-76-S09
  - PRC-76-S10
  - PRC-76-S11
  - PRC-76-S12
  - PRC-76-S13
  roles:
  - id: SH-E2
    as: performer
  - id: SH-E2
    as: approver
  steps:
  - actor: system
    where: automatic
    command: 完成供方协议
    aggregate: AGG-55
    decision:
    - when: 累计达协议金额或额度用尽
      goto: 2
    - when: otherwise
      goto: end
      outcome: 未达完成条件
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 提交审批
    approval:
      engine: platform.approval
      doc_type: 供方协议结算审批
      approver: cost_object_owner
      multi_level: false
      why_human: 最终结算价款是否与履约、变更和争议相符，要对该项目成本负责的人判断；已完成状态、累计履约与协议金额的关系由规则守
      on_reject: end
      on_reject_outcome: 已驳回
      escalation_rules:
      - AR-01
      - AR-02
      - AR-11
      - AR-12
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    notify:
    - to: 审批人
      how: 企业微信待办
    audit: true
    permission: 供方协议.结算审批
    page: 审批待办（审批平台）
    added_in: closeout
    pending:
    - F-Q1-阈值（AR-01、AR-02 的结算阈值）
    - AR-11
    - U-40
    withdraw:
      to: end
      outcome: 已撤回
    timeout:
      after: P30D
      relative_to: 协议已完成
      escalate_to: SH-E2
      interrupting: false
      pending:
      - T-01
      rule: 已完成未结算提醒经办人
  - actor: SH-E2
    where: in_system
    evidence:
    - 供方结算确认书（双方确认的最终价款）扫描件
    command: 结算供方协议
    aggregate: AGG-55
    emits:
    - 供方协议已结算
    decision:
    - when: otherwise
      goto: end
      outcome: 已结算
    permission: 供方协议.结算
    page: 供方协议详情页
    cross_bc:
    - mode: api
      direction: in
      bc: B-29
      name: 读供方协议状态
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    metric_event: true
    audit: true
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 提交审批
    approval:
      engine: platform.approval
      doc_type: 供方协议终止审批
      approver: cost_object_owner
      multi_level: false
      why_human: 终止未完成协议涉及违约责任与结算结论，要对该项目成本负责的人判断；协议状态与终止原因必填由规则守
      on_reject: end
      on_reject_outcome: 已驳回
      escalation_rules:
      - AR-01
      - AR-02
      - AR-11
      - AR-12
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    notify:
    - to: 审批人
      how: 企业微信待办
    audit: true
    permission: 供方协议.终止审批
    page: 审批待办（审批平台）
    added_in: closeout
    pending:
    - F-Q1-阈值（AR-01、AR-02 的终止阈值）
    - AR-11
    - U-40
    - Q10
    withdraw:
      to: end
      outcome: 已撤回
  - actor: SH-E2
    where: in_system
    evidence:
    - 终止原因与结算结论（Q10）
    command: 终止供方协议
    aggregate: AGG-55
    branch: 终止
    emits:
    - 供方协议已终止
    desc: 含未结算即结项时的结算结论（Q10）
    decision:
    - when: otherwise
      goto: end
      outcome: 已终止
    permission: 供方协议.终止
    page: 供方协议详情页
    cross_bc:
    - mode: api
      direction: in
      bc: B-29
      name: 读供方协议状态
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    pending:
    - Q10
    metric_event: true
    audit: true
  notes: 结项编排经 api 读状态，事件无业务订阅方。人工终止是独立入口 4（不先执行完成供方协议）；结算与终止加责任人审批（QC-VS05-08）。
  primary_object: OBJ-05
- id: PRC-77
  name: 申报并缴纳税款
  type: business
  trigger:
    type: time
    desc: 法定申报期（P-39）
  triggers:
  - type: time
    name: 增值税与附加税：法定申报期（P-39）按纳税法人与所属月（或季）触发
  - type: time
    name: 企业所得税：按季预缴期与年度汇算清缴期（P-39）按纳税法人触发
  stages:
  - VS-06.1
  owner_bc: B-23
  human_orchestration: false
