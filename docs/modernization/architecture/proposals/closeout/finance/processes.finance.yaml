- id: PRC-171
  name: 核对差旅账单并确认应付
  type: business
  owner_bc: B-12
  stages:
  - VS-05.4
  added_in: closeout
  basis: S-31 SQ-27
  trigger:
    type: event
    desc: 差旅服务商订单或月账单经集成事件到达
  human_orchestration: true
  human_note: 订单人工归属、账单差异处理
  migration: 老系统只拉取月账单并整月核对，没有应付与分录；历史订单与账单明细若有则作只读历史迁入，不生成应付、不过账（M7）。在途：投产前已到账单的月份按本流程在投产前办结，未办结的以未核对迁入。付款方式取证后再定（U-39）
  scope: 财务按所负责法人的数据范围（ADR-0026）
  segregation:
  - roles:
    - SH-E6
    rule: 核对账单的财务与在 PRC-75 发起该应付付款的人不得为同一人（INV-81 同类，提议）
  triggers:
  - type: event
    name: 差旅订单已推送
    publisher: platform.integration
    entry: 1
    pending:
    - U-39
  - type: event
    name: 差旅月账单已推送
    publisher: platform.integration
    entry: 3
    pending:
    - U-39
  outcomes:
  - 订单已登记
  - 重复订单已忽略
  - 重复账单已忽略
  - 账单已拒收
  - 应付已确认
  - 无需确认应付
  - 已拒收（服务商未准入）
  - 过账被拒收
  - 期间关账中待重试
  roles:
  - id: SH-E6
    as: performer
  - id: SH-P2
    as: external
  steps:
  - actor: system
    where: external:分贝通
    evidence:
    - 订单推送消息与原始报文
    - 消息标识与接收时刻
    command: 登记差旅订单与月账单
    aggregate: AGG-131
    added_in: closeout
    desc: 订单（含退改）经集成事件进来，按出差申请（AGG-132，同 BC）自动归属项目或部门；领域内称「差旅服务商」，分贝通只出现在集成适配器（ADR-0039）
    decision:
    - when: 订单已登记过（消息重复，按订单标识幂等）
      goto: end
      outcome: 重复订单已忽略
    - when: 订单找不到对应的已批出差申请，无法自动归属
      goto: 2
    - when: otherwise
      goto: end
      outcome: 订单已登记
    cross_bc:
    - mode: event
      direction: in
      bc: platform.integration
      name: 差旅订单已推送
    audit: true
    pending:
    - U-39
  - actor: SH-E6
    where: in_system
    command: 归属差旅订单
    aggregate: AGG-131
    added_in: closeout
    desc: 人工把订单归属到项目或部门（成本归属在报销侧），记归属理由
    permission: 差旅订单.归属
    page: 差旅订单归属页
    audit: true
    decision:
    - when: otherwise
      goto: end
      outcome: 订单已登记
  - actor: system
    where: external:分贝通
    evidence:
    - 月账单文件
    - 校验和与接收时刻
    command: 登记差旅订单与月账单
    aggregate: AGG-131
    added_in: closeout
    desc: 账单行即订单，含退改；按账单标识与校验和幂等
    decision:
    - when: 账单已登记过（文件重复）
      goto: end
      outcome: 重复账单已忽略
    - when: 账单无法解析或与已登记订单严重不符 → 拒收并告警
      goto: end
      outcome: 账单已拒收
      alert: true
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: event
      direction: in
      bc: platform.integration
      name: 差旅月账单已推送
    audit: true
    notify:
    - to: SH-E6
      how: 企业微信告警（账单拒收）
    pending:
    - U-39
  - actor: SH-E6
    where: in_system
    command: 核对差旅月账单
    aggregate: AGG-131
    added_in: closeout
    desc: 账单行与已登记订单逐笔核对；已被员工报销占用的订单从账单剔除并记差异（公司直付账单与员工报销互斥）
    permission: 差旅月账单.核对
    page: 差旅月账单核对页
    audit: true
    legal_entity: 订单承担法人
    decision:
    - when: 存在账单行无订单、订单无账单行、金额不符或订单已被员工报销
      goto: 5
      rule: INV-137
    - when: otherwise
      goto: 6
    timeout:
      after: P5D
      relative_to: 月账单已登记
      escalate_to: SH-M1
      interrupting: false
      pending:
      - T-01
  - actor: SH-E6
    where: external:分贝通
    evidence:
    - 服务商书面确认或更正后的账单
    command: 〔缺〕处理账单差异
    aggregate: AGG-131
    added_in: closeout
    desc: 与差旅服务商确认差异，更正账单后回到核对；确认不予结算的订单剔除后继续
    permission: 差旅月账单.差异处理
    page: 差旅月账单核对页
    audit: true
    decision:
    - when: 服务商更正了账单
      goto: 3
    - when: otherwise
      goto: 6
  - actor: system
    where: automatic
    command: 确认差旅账单应付
    aggregate: AGG-131
    added_in: closeout
    desc: 核对完成后由 B-12 调 B-10 确认应付（往来方为差旅服务商，归属对象写到应付上，沿 S-17 api 载荷）；审批在 PRC-75 付款环节，本步不设审批
    emits:
    - 应付已确认
    calls: PRC-75
    decision:
    - when: 剔除后无可结算订单，或退改后应付为零
      goto: end
      outcome: 无需确认应付
    - when: 差旅服务商未作为供方准入合格
      goto: end
      rule: INV-03c、INV-04b
      outcome: 已拒收（服务商未准入）
      alert: true
    - when: otherwise
      goto: 7
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 确认应付
    legal_entity: 订单承担法人
    audit: true
    pending:
    - U-39
    inner:
    - command: 确认应付
      aggregate: AGG-52
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-131
    added_in: closeout
    post: true
    calls: PRC-92
    desc: 费用事实由 B-12 过账（成本归属在报销侧，聚合稿 §4.2 规则 7）
    period_gate: true
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 应付已确认
    - when: 过账管道拒收（该法人无开放期间、借贷不平或法人不一致），拒收并告警
      goto: end
      rule: INV-92、INV-93
      outcome: 过账被拒收
      alert: true
      pending:
      - SQ-41
    - when: otherwise
      goto: end
      outcome: 应付已确认
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 订单承担法人
    metric_event: true
  notes: 把握低（SQ-27，U-39）：付款方式（预充值还是月结）决定是「应付」还是「预付核销」，答复前只写月结形态；新边 B-12 → platform.integration，既有边 B-12 → B-10 加 api 方式；INV-137 同一订单只结算一次。
  scenarios:
  - PRC-171-S01
  - PRC-171-S02
  - PRC-171-S03
  - PRC-171-S04
  - PRC-171-S05
  - PRC-171-S06
  - PRC-171-S07
  - PRC-171-S08
  - PRC-171-S09
  - PRC-171-S10
  - PRC-171-S11
  - PRC-171-S12
  - PRC-171-S13
  - PRC-171-S14
  - PRC-171-S15
  - PRC-171-S16
  - PRC-171-S17
  - PRC-171-S18
  - PRC-171-S19
  stages_note: 公司直付分贝通订单：核对月账单后确认供方应付，属「应付确认」；之后付款进 VS-05.5（PRC-75）；结局「应付已确认」即 OBJ-85「未结」（应付方向），是 VS-05.4 退出条件（同 PRC-74 的写法，检查器因结局没写「未结」匹配不上）
  primary_object: "OBJ-121"
  primary_object_note: "CAPINFO 提交 CAPINFO-20261017-111010-cfy 第 CAPINFO-I07 题；信息图现单列 OBJ-121，保留处理、审批及核对依据。"
