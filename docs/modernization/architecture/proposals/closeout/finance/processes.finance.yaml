    aggregate: AGG-80
    desc: 按分包变更的价款增减额调整预算占用（幂等键为分包变更 ID），一次调用，避免释放加重占之间留孤儿占用（聚合稿 §7 第 6 条）；预算不足只预警、不拦截（INV-102 已定为策略，F-Q2）
    decision:
