      outcome: 已部分支付
    - when: otherwise
      goto: 6
    permission: 利润分配.登记支付
    page: 利润分配详情页
    cross_bc:
    - mode: event
      direction: out
      bc: B-15
      name: 利润分配已支付
    audit: true
    pending:
    - G-10
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-109
    calls: PRC-92
    period_gate: true
    decision:
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已支付
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 被分配法人
  notes: 支付走「发起、审批并执行付款」（PRC-75）；自然人股东个税见「并入股息红利个税扣缴申报」（PRC-113）。决议是聚合命令（R-15），engine 为 aggregate。
- id: PRC-114
  name: 退回出资
  type: business
  trigger:
    type: human
    desc: 股东或合伙人申请部分或全部退回
  triggers:
  - type: human
    name: 股东或合伙人申请部分或全部退回出资
  stages:
  - VS-12.3
  owner_bc: B-10
  human_orchestration: false
  migration: 在途（已申请未登记）投产前办结；已退回、部分退回的出资全部迁入（U-3、U-4），迁入不触发过账
  scope: 按被投资法人的数据范围（财务负责人与财务岗位）
  outcomes:
  - 已退回
  - 部分退回
  - 已拒收
  - 过账被拒收
  scenarios:
  - PRC-114-S01
  - PRC-114-S02
  - PRC-114-S03
  - PRC-114-S04
  pending:
  - R-27
  - G-11-出资退回
  roles:
  - id: SH-O1
    as: initiator
  - id: SH-E6
    as: performer
  steps:
  - actor: SH-E6
    where: in_system
    evidence:
    - 股东或合伙人的书面退回申请扫描件
    command: 登记出资退回
    aggregate: AGG-54
    emits:
    - 出资已退回
    decision:
    - when: 退回额超过已实缴额
      goto: end
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 出资.登记退回
    page: 出资退回登记页
    pending:
    - G-11-出资退回
    - R-27
    metric_event: true
    audit: true
    legal_entity: 被投资法人
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-54
    calls: PRC-92
    period_gate: true
    decision:
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: 退回后已实缴余额为零
      goto: end
      outcome: 已退回
    - when: otherwise
      goto: end
      outcome: 部分退回
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 被投资法人
  notes: 退回的资金收付走「发起、审批并执行付款」，应付类型承载见 G-11 末段。R-27：流程没有决议或审批环节，不自行加节点，列入待用户定。
- id: PRC-131
  name: 付款成功后核销应付
  type: event_policy
  owner_bc: B-10
  stages:
  - VS-05.5
  - VS-08.1
  - VS-08.3
  - VS-12.2
  - VS-12.3
  - VS-13.5
  triggers:
  - type: event
    name: 付款已成功
    publisher: B-10（同 BC，AGG-53）
  migration: 无在途实例；迁入的付款事实不触发本策略；投产时已成功未核销的付款在投产前跑完本策略
  outcomes:
  - 应付已结清
  - 应付部分核销
  - 重复事件已忽略
  - 已拒收
  scenarios:
  - PRC-131-S01
  - PRC-131-S02
  - PRC-131-S03
  - PRC-131-S04
  steps:
  - actor: system
    where: automatic
    command: 核销应付
    aggregate: AGG-52
    emits:
    - 应付已核销
    - 应付已结清
    desc: 订阅付款已成功，把占用转为核销（R-03）；未付余额为零才发应付已结清，部分付款只发应付已核销
    decision:
    - when: 该付款已核销过（事件重复，按付款 ID 幂等）
      goto: end
      outcome: 重复事件已忽略
    - when: 核销占用不存在或与分配行不一致 → 拒收并告警
      goto: end
      rule: INV-77
      outcome: 已拒收
      alert: true
    - when: 核销后未付余额大于零
      goto: end
      outcome: 应付部分核销
    - when: otherwise
      goto: end
      outcome: 应付已结清
    cross_bc:
    - mode: event
      direction: out
      bc: B-15
      name: 应付已结清
    - mode: event
      direction: out
      bc: B-12
      name: 应付已结清
    legal_entity: 应付所属法人
    audit: true
    outcome: 应付已结清
  notes: 由原 PRC-75 步骤 6 拆出（⑥a 评审 M6）。
- id: PRC-132
  name: 应付核销后置付款已核销并提交过账候选
  type: event_policy
  owner_bc: B-10
  stages:
  - VS-05.5
  - VS-08.1
  - VS-08.3
  - VS-12.2
  - VS-12.3
  - VS-13.5
  triggers:
  - type: event
    name: 应付已核销
    publisher: B-10（同 BC，AGG-52）
  migration: 无在途实例；迁入的付款事实不触发本策略，也不提交过账候选（走迁入过账通道）
  outcomes:
  - 付款已核销并提交过账
  - 重复事件已忽略
  - 过账被拒收
  scenarios:
  - PRC-132-S01
  - PRC-132-S02
  - PRC-132-S03
  steps:
  - actor: system
    where: automatic
    command: 置付款已核销
    aggregate: AGG-53
    post: true
    calls: PRC-92
    inner:
    - command: 提交过账候选
      aggregate: AGG-53
    desc: 订阅应付已核销；之后提交过账候选
    period_gate: true
    decision:
    - when: 该付款已是已核销（事件重复）
      goto: end
      outcome: 重复事件已忽略
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 付款已核销并提交过账
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 资金账户所属法人
    audit: true
    outcome: 付款已核销并提交过账
  notes: 由原 PRC-75 步骤 7、8 拆出（⑥a 评审 M6）。
- id: PRC-133
  name: 应付结清后报销置已付
  type: event_policy
  owner_bc: B-12
  stages:
  - VS-08.3
  triggers:
  - type: event
    name: 应付已结清
    publisher: B-10（AGG-52）
  migration: 无在途实例；迁入的报销已付状态随报销事实迁入，不触发本策略；投产时应付已结清而报销未置已付的，投产前跑完本策略
  outcomes:
  - 报销已付
  - 重复事件已忽略
  - 已忽略非报销来源
  - 已拒收
  scenarios:
  - PRC-133-S01
  - PRC-133-S02
  - PRC-133-S03
  - PRC-133-S04
  reads:
  - AGG-52
  steps:
  - actor: system
    where: automatic
    command: 标记费用报销已付
    aggregate: AGG-59
    desc: 按来源报销取其应付；触发事件已是应付已结清，部分付款不触发，故不会置已付（⑥a 评审 H5，G-09；⑥a 复核改触发）。全额借款冲抵、净额为零时应付不产生，由 B-09 事件策略 PRC-147 置已付（S-19、S-24）
    decision:
    - when: 应付来源不是费用报销（供方、薪酬、利润等）
      goto: end
      outcome: 已忽略非报销来源
    - when: 读不到应付或来源报销不存在 → 拒收并告警
      goto: end
      outcome: 已拒收
      alert: true
    - when: 报销已是已付（事件重复）
      goto: end
      outcome: 重复事件已忽略
    - when: otherwise
      goto: end
      outcome: 报销已付
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 读应付
    audit: true
    outcome: 报销已付
  notes: 触发由「付款已成功」改为「应付已结清」（⑥a 复核）：AGG-52「应付已结清」订阅方加 B-12；B-12 → B-10 边已有且含事件方式，不新增边。
- id: PRC-135
  name: 处理会计分录待处理队列与推送重投
  type: single_aggregate
  owner_bc: B-20
  aggregate: AGG-84
  stages:
  - VS-10.1
  states:
    记账:
      values:
      - 待处理
      - 已记账
      transitions:
      - from: 待处理
        to: 已记账
        by: 处理待处理队列
        guard: 来源已在授权表或映射表已补齐（INV-98）
    外部法定账推送:
      values:
      - 待推送
      - 已推送
      - 已确认记账
      - 死信
      transitions:
      - from: 待推送
        to: 已推送
        by: 推送与重投
      - from: 已推送
        to: 已确认记账
        by: 〔缺〕登记外部记账确认
        guard: U8C 内已审核记账，由对账读取得到
      - from: 已推送
        to: 死信
        by: 推送与重投
        guard: U8C 拒收，带返回码
      - from: 死信
        to: 待推送
        by: 推送与重投
        guard: 财务处理原因后重投
  commands:
  - command: 处理待处理队列
    actor: SH-E6
    where: in_system
    permission: 总账.处理待处理队列
    page: 待处理队列页
    audit: true
    period_gate: true
    desc: 来源不在授权表或映射表找不到类别的事实进队列并告警；财务经 PRC-100 补授权或映射后再生成分录；队列不清空不能关账（ADR-0022 决定 2、10）；期间已关账则拒收并告警
    pending:
    - P2-02
  - command: 推送与重投
    actor: system
    where: external:U8C
    permission: 总账.重投外部法定账推送
    page: 推送与死信页
    audit: true
    evidence:
    - U8C 返回码与凭证号
    - 推送批次与校验和
    desc: 收付口径分录推送 U8C 至已确认记账，失败为死信，当日告警财务与运维，死信非空不得关账；首次推送由 PRC-93 自动完成，本维护只做死信重投与人工触发；财务可在页面触发重投（权限同左）
    pending:
    - S-05
  cross_bc:
  - mode: api
    direction: out
    bc: platform.integration
    name: 外部法定账推送
  migration: 在途：待处理队列与死信投产前须清零。历史：历史分录迁入时不进队列、不推送，推送状态按「已确认记账」处理（U8C 已有历史账），口径待财务确认。
  notes: 由原 PRC-93 的人工部分拆出（⑥a 评审 M1）；记账状态与推送状态在数据模型上分表（待处理队列表与推送记录表只追加，评审 R-02）。
  scenarios:
  - PRC-135-S01
  - PRC-135-S02
