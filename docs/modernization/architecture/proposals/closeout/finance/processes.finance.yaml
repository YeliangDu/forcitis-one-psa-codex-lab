    desc: 经 PRC-92 更正入口冲销原报销核定的过账事实
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 费用报销已冲销
    - when: 过账管道拒收（原事实不存在或已被冲销、该法人无开放期间、借贷不平），拒收并告警
      goto: end
      rule: INV-92、INV-93、INV-95；拒收记录由 PRC-158 处置
