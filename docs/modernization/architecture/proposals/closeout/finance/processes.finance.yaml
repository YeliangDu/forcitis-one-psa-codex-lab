      alert: true
    - when: otherwise
      goto: end
      outcome: 已缴款
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 纳税法人
  notes: 财务复核、申报端回执、更正申报无退回超时，按非人工编排（⑥a 评审 M1）。R-29 类问题：v1 的 reviewer 角色没有对应步骤，已删。税款资金支出是否走 PRC-75 见接缝问题。
