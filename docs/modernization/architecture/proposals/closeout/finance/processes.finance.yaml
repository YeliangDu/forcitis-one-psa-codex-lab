    - Q20
  - actor: system
    where: automatic
    command: 释放履约额度
    aggregate: AGG-58
    branch: 冲销后释放
    added_in: closeout
    desc: 冲销履约确认后释放其占用的履约额度（反向行）
    decision:
    - when: otherwise
      goto: 9
  - actor: system
    where: automatic
    command: 冲销并重过账
    aggregate: AGG-77
    calls: PRC-92
    branch: 冲销后过账
    added_in: closeout
    period_gate: true
    desc: 经 PRC-92 更正入口冲销原履约确认的过账事实
    decision:
    - when: 所属期间在关账中（已发起关账、未确认），本期过账不接受：返回「期间关账中、可重试」，不进拒收记录，由来源 BC 投递重试
      goto: end
      rule: INV-92（S-31 SQ-12）；ADR-0045 决定 1
      outcome: 期间关账中待重试
    - when: 所属期间已关账，自动落当前开放期间并标原期间（系统触账不拒绝）
      goto: end
      rule: ADR-0045 决定 2；INV-92；AR-05
      outcome: 供方履约确认已冲销
    - when: 过账管道拒收（原事实不存在或已被冲销、该法人无开放期间、借贷不平），拒收并告警
      goto: end
      rule: INV-92、INV-93、INV-95；拒收记录由 PRC-158 处置
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 供方履约确认已冲销
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 冲销并重过账
    legal_entity: 承担法人
  notes: 形态待定 Q20；履约确认冲销另走 AGG-57。步骤 2 的占用与步骤 3 的确认同一用户操作内先后完成。 冲销分支（步骤 6–9）：财务发起 → 审批平台加审 AR-06 → 冲销供方履约确认 → 释放履约额度 → 冲销并重过账（S-29 SQ-43）。
