    - event: 供方履约已确认
      aggregate: AGG-57
    desc: 累计达协议金额或额度用尽时本 BC 策略触发完成；结算由人工发起
  triggers:
  - type: event
    name: 供方履约已确认
    publisher: B-11（同 BC）
  - type: human
    name: 经办人对未完成协议登记终止（含未结算即结项）
  stages:
  - VS-05.6
  owner_bc: B-11
  human_orchestration: false
  migration: 在途（已完成未结算）投产前办结或以已完成状态迁入后在新系统结算；已结算、已终止的协议全部迁入（U-3、U-4），迁入不发事件
  scope: 按项目承担部门的数据范围
  outcomes:
  - 已结算
  - 已终止
  - 未达完成条件
  scenarios:
  - PRC-76-S01
  - PRC-76-S02
  - PRC-76-S03
  - PRC-76-S04
  roles:
  - id: SH-E2
    as: performer
  steps:
  - actor: system
    where: automatic
    command: 完成供方协议
    aggregate: AGG-55
    decision:
    - when: 累计达协议金额或额度用尽
      goto: 2
    - when: 经办人登记终止（含未结算即结项）
      goto: 3
    - when: otherwise
