    permission: 第13期.查看启用
    page: 第 13 期启用页
    desc: R-20：先确认本年度是否启用；未启用的年度 12 月照常按数据到齐关账（ADR-0046 第 5 项第 6 条），转 PRC-101
    decision:
    - when: 本年度已有生效的第 13 期启用登记
      goto: 3
      rule: INV-104
    - when: 财务决定本年度不启用第 13 期，12 月转月结关账
      goto: PRC-101
      rule: INV-104
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 读第 13 期启用登记
    pending:
    - P-003
    command: 读取第 13 期启用登记
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  - actor: SH-E6
    where: in_system
    command: 登记第 13 期启用
    aggregate: AGG-96
    emits:
    - 第 13 期启用登记已生效
    period_gate: true
    audit: true
    permission: 第13期.登记启用
    page: 第 13 期启用页（登记）
    desc: 按会计年度全局，配置类版本带生效日、财务批准人、决定出处，只追加；参数「是否启用」：可登记「不启用」以新版本取代旧版本（INV-104，12 月关账前）
    decision:
    - when: 该年度任一法人 12 月已关账，启用状态已锁定，拒收并告警
      goto: end
      rule: INV-104
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 登记第 13 期启用
    pending:
    - P-003
    approval:
      engine: aggregate
      doc_type: 第 13 期启用批准
      approver: SH-M1
      multi_level: false
      why_human: 是否启用第 13 期决定本年度账务结转的形态，要对账务负责的人判断；启用状态锁定与登记只追加由规则守
      approver_basis: 第 13 期启用是对法人账务负责的职责，不归属某个费用或业务对象，取财务负责人（类型级）
      on_reject: end
      on_reject_outcome: 已拒收
  - actor: SH-E6
    where: in_system
    command: 开放第 13 期
    aggregate: AGG-81
    audit: true
    period_gate: true
    legal_entity: 被关账法人
    permission: 第13期.开放
    page: 第 13 期启用页（开放）
    desc: 期间行只在开放命令成功时创建；未启用时一律拒绝并告警（ADR-0046 第 4 项第 3 条）；第 13 期只接收显式指定落账期间的通道（INV-92）
    decision:
    - when: 本年度未启用第 13 期，拒收并告警
      goto: end
      rule: INV-104
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 4
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 开放第 13 期
    pending:
    - ADR46-P3
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-84
    - AGG-99
    - AGG-77
    - AGG-81
    command: 月结检查
    added_in: closeout
    checks:
    - 过账队列与分录生成队列为空，且过账拒收记录已处置（B-16 队列与拒收记录经 PRC-158 处置、B-20 待处理队列）
    - 推送死信为空（B-20）
    - 损益结转完成（期末结转已过账，AGG-99）
    - 本期受控手工凭证无草稿、待复核、待审批（B-20，AGG-98）
    - 本期人工成本分配与分摊运行已办结或已处理（B-07）
    - 明细账与总账控制科目一致
    - 现金流量标注完整
    - 直接法与间接法经营活动现金流量净额相等
    - 试算平衡
    - 三条对账等式成立，收付账簿生产成本余额为 0
    - 银行余额调节已完成（范围待用户定，SQ-52）
    legal_entity: 被关账法人
    permission: 月结.执行前置检查
    page: 月结检查页
    desc: 12 月与第 13 期共用一组前置检查，对两期合并判定（ADR-0046 第 5 项第 3 条）；两期合并后是否另加检查项待 P-004
    decision:
    - when: 前置检查未通过
      goto: end
      rule: INV-100
      outcome: 检查未通过保持开放
    - when: otherwise
      goto: 5
    cross_bc:
    - mode: api
      direction: out
      bc: B-20
      name: 读分录余额、待处理队列、推送死信与期末结转
    - mode: api
      direction: out
      bc: B-16
      name: 读队列与死信
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
    pending:
    - P-001
    - P-002
    - P-004
    - SQ-52
    rule: INV-100（S-29 SQ-54 扩展检查项，不另编号）
  - actor: SH-E6
    where: in_system
    command: 发起年末关账
    aggregate: AGG-81
    period_gate: true
    audit: true
    legal_entity: 被关账法人
    permission: 月结.发起年末关账
    page: 年末关账页（发起）
    desc: 12 月与第 13 期共用一组前置检查（见第 4 步）；发起年末关账后 12 月与第 13 期均为关账中，业务日期在其间的过账返回「期间关账中、可重试」（INV-92，S-31 SQ-12）；确认时带检查结果摘要写审计记录
    decision:
    - when: 12 月或第 13 期已关账，或两期未同时处于开放，拒收并告警
      goto: end
      rule: INV-99
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 6
    notify:
    - to: SH-M1
      how: 企业微信待办（确认年末关账）
    cross_bc:
    - mode: api
      direction: out
      bc: B-19
      name: 发起年末关账
  - actor: SH-M1
    where: in_system
    command: 确认年末关账
    aggregate: AGG-81
    emits:
