- id: PRC-101
  name: 检查并关闭会计期间
  trigger:
    type: human
    desc: 财务在会计期间结束时发起月结
  stages:
  - VS-10.1
  owner_bc: B-17
  human_orchestration: true
  human_note: 发起人与确认人须不同；前置检查未通过退回开放重入
  migration: 在途：投产前须办结，投产日所在期间是新系统的首次关账；投产前以最近两个已结期间重算比对（U-10）。历史：迁入的历史期间为终态，不经本流程、不发关账事件（ADR-0036 第 6 条），不重开（ADR-0045 决定 1）。
  scope: 按被关账法人（期间 × 法人），财务数据范围
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    as:
    - initiator
    - approver
    rule: 发起关账与确认关账不得为同一人（ADR-0045 决定 1；发起人、确认人写入审计记录，ADR-0046 §8.5）；确认人级别占位 SH-M1，待 F-01
  triggers:
  - type: human
    name: 财务在会计期间结束时发起月结
    entry: 1
  - type: call
    name: 12 月且本年度未启用第 13 期时由 PRC-102 转入
    entry: 1
  outcomes:
  - 已关账
  - 检查未通过保持开放
  - 已拒收
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-126
    - AGG-77
    - AGG-78
    - AGG-81
    - AGG-84
    - AGG-99
    command: 月结检查
    checks:
    - 过账队列与分录生成队列为空，且过账拒收记录已处置（B-16 队列与拒收记录经 PRC-158 处置、B-20 待处理队列）
    - 推送死信为空（B-20）
    - 损益结转完成（期末结转已过账，AGG-99）
    - 本期受控手工凭证无草稿、待复核、待审批（B-20，AGG-98）
    - 本期人工成本分配与分摊运行已办结或已处理（B-07）
    - 明细账与总账控制科目一致
    - 现金流量标注完整
    - 直接法与间接法经营活动现金流量净额相等
    - 试算平衡
    - 三条对账等式成立，收付账簿生产成本余额为 0
    - 银行余额调节已完成（范围待用户定，SQ-52）
    - 勾稽差异案（AGG-126）无未关闭的超容差差异案，豁免须财务负责人确认（INV-135）
    legal_entity: 被关账法人
    permission: 月结.执行前置检查
    page: 月结检查页
    desc: ADR-0022 决定 10 的前置检查；检查在 B-17 编排，结果只读展示，关账前展示检查结果（ADR-0045 决定 1 预防措施）；期末结转与手工调整须在发起关账前完成，检查未通过就退回开放（ADR-0045 决定 1；S-31 SQ-12）
    decision:
    - when: 前置检查未通过
      goto: end
      rule: INV-100；INV-135
      outcome: 检查未通过保持开放
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-20
      name: 读分录余额、待处理队列、推送死信与期末结转
    - mode: api
      direction: out
      bc: B-16
      name: 读队列与死信
    - mode: api
      direction: out
      bc: B-19
      name: 读会计期间
    pending:
    - SQ-52
    rule: INV-100（S-29 SQ-54 扩展检查项，不另编号）
    reads_note: 配置读取（版本按业务日期取当时有效版本，D17 第 5、6 条）
  - actor: SH-E6
    where: in_system
