processes:
- id: PRC-15
  name: 未签约的售前投入转费用
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-01.2
  triggers:
  - type: event
    name: 商机已丢单
    bc: B-03
  - type: event
    name: 商机已放弃
    bc: B-03
  - type: time
    name: 立项后回签前挂合同履约成本的投入超过 N 个月未签约（N 默认 6 个月，可设；A7、GL-026）
  migration: 在途：投产日未转的售前投入按迁入的权责事实存量由本策略继续处理；历史：已转费用的批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 售前投入已转费用
  - 无需转费用
  - 已转费用（幂等）
  - 已拒收
  scenarios:
  - PRC-15-S01
  - PRC-15-S02
  - PRC-15-S03
  - PRC-15-S04
  - PRC-15-S05
  - PRC-15-S06
  steps:
  - actor: system
    where: automatic
    command: 售前投入转费用
    aggregate: AGG-43
    emits:
    - 成本结转已过账
    post: true
    calls: PRC-92
    desc: P-43；丢单或放弃后该商机的售前投入转当期费用；超期分支取同一命令，N 为按版本生效的配置
    period_gate: true
    decision:
    - when: 该商机已转过费用（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已转费用（幂等）
    - when: 该商机没有未转的售前投入
      goto: end
      outcome: 无需转费用
    - when: 落账期间已关账且无开放期间可路由，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 售前投入已转费用
    legal_entity: 承担法人
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: 商机已丢单、商机已放弃
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 转费用不依赖收入确认时点，INV-88 不是前置。
- id: PRC-25
  name: 转入售前投入
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-02.0
  - VS-04.1
  triggers:
  - type: event
    name: ContractSigned
    bc: B-05
  - type: event
    name: 项目已建立
    bc: B-04
  migration: 在途：投产日合同已签回但未转入的，按迁入的权责事实存量由本策略继续处理；历史：已转入的批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 售前投入已转入
  - 等待齐备
  - 无需转入
  - 已转入（幂等）
  - 已拒收
  scenarios:
  - PRC-25-S01
  - PRC-25-S02
  - PRC-25-S03
  - PRC-25-S04
  - PRC-25-S05
  - PRC-25-S06
  steps:
  - actor: system
    where: automatic
    command: 转入售前投入
    aggregate: AGG-43
    emits:
    - 成本结转已过账
    post: true
    calls: PRC-92
    desc: 合同签回且项目已建立后按冲销加新事实转入（P-43）；一商机多合同按 WBS 挂接归属（Q12）转入各合同对应项目，不按合同额分摊（intent 120544 P-2）；赢单不触发
    period_gate: true
    decision:
    - when: 合同未签回或项目未建立（两者齐备才转入，后到者触发）
      goto: end
      rule: P-43
      outcome: 等待齐备
    - when: 该商机与合同已转入过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已转入（幂等）
    - when: 该商机没有未转的售前投入
      goto: end
      outcome: 无需转入
    - when: 落账期间已关账且无开放期间可路由，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 售前投入已转入
    legal_entity: 承担法人
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: ContractSigned
    - mode: event
      direction: in
      bc: B-04
      name: 项目已建立
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 触发语义为合同签回且项目已建立两者齐备，赢单不转入（intent 120544 P-2，C-53）。立项后回签前的投入按 A7 先挂合同履约成本；超 N 个月未签约转费用见 PRC-15。
- id: PRC-35
  name: 项目或协议终止、结项后清算成本
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-02.7
  - VS-04.5
  triggers:
  - type: event
    name: 项目已终止
    bc: B-04
  - type: event
    name: 项目已取消
    bc: B-04
  - type: event
    name: 项目已结项
    bc: B-04
  - type: event
    name: 协议已终止
    bc: B-05
  migration: 在途：投产日已终止或结项但未清算的，按迁入的权责事实存量由本策略继续处理；历史：已清算批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 清算成本已过账
  - 无需清算
  - 已清算（幂等）
  - 已拒收
  scenarios:
  - PRC-35-S01
  - PRC-35-S02
  - PRC-35-S03
  - PRC-35-S04
  - PRC-35-S05
  steps:
  - actor: system
    where: automatic
    command: 终止清算成本
    aggregate: AGG-43
    emits:
    - 成本结转已过账
    post: true
    calls: PRC-92
    desc: 终止清算与超期转费用；余额转入当期损益，不依赖收入确认时点
    period_gate: true
    decision:
    - when: 该项目或协议已清算过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已清算（幂等）
    - when: 没有未结转的合同履约成本或售前投入
      goto: end
      outcome: 无需清算
    - when: 落账期间已关账且无开放期间可路由，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: otherwise
      goto: end
      outcome: 清算成本已过账
    legal_entity: 承担法人
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: event
      direction: in
      bc: B-04
      name: 项目已终止、项目已取消、项目已结项
    - mode: event
      direction: in
      bc: B-05
      name: 协议已终止
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
  notes: 订阅关系 B-07 → B-04、B-05（事件）已有。
- id: PRC-55
  name: 结转合同履约成本
  type: event_policy
  owner_bc: B-07
  stages:
  - VS-04.2
  triggers:
  - type: event
    name: BusinessFactAttributed（收入确认类型的过账事实）
    bc: B-16
  migration: 在途：投产日已确认收入但未结转成本的，按迁入的权责事实存量由本策略继续处理；历史：已结转批次由迁入事实承载，不重放事件（M7）
  outcomes:
  - 合同履约成本已结转
  - 无需结转
  - 已结转（幂等）
  - 非收入确认事实
  - 已拒收
  scenarios:
  - PRC-55-S01
  - PRC-55-S02
  - PRC-55-S03
  - PRC-55-S04
  - PRC-55-S05
  - PRC-55-S06
  steps:
  - actor: system
    where: automatic
    command: 结转合同履约成本
    aggregate: AGG-43
    emits:
    - 成本结转已过账
    post: true
    calls: PRC-92
    desc: 过账事实为收入确认类型时；转出金额配对已确认收入；与收入确认同期间但不同事务（N-16）
    period_gate: true
    decision:
    - when: 过账事实不是收入确认类型
      goto: end
      outcome: 非收入确认事实
    - when: 该事实已结转过（重复事件，幂等）
      goto: end
      rule: INV-94
      outcome: 已结转（幂等）
    - when: 该合同没有可转出的合同履约成本
      goto: end
      rule: INV-88
      outcome: 无需结转
    - when: 落账期间已关账且无开放期间可路由，拒收并告警
      goto: end
      rule: INV-92
      outcome: 已拒收
    - when: otherwise
      goto: end
      rule: INV-88
      outcome: 合同履约成本已结转
    legal_entity: 承担法人
    metric_event: true
    notify:
    - to: SH-E6
      how: 企业微信告警（拒收原因）
    cross_bc:
    - mode: event
      direction: in
      bc: B-16
      name: BusinessFactAttributed
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    pending:
    - A1
    - Q-04
    - Q20
  notes: 依赖收入确认时点（A1、Q-04）与 AGG-57 形态（Q20）；两者定后重核转出金额的配对口径。
- id: PRC-64
  name: 导入银行流水
  type: business
  trigger:
    type: time
    desc: 每日或银行文件到达
  triggers:
  - type: time
    name: 每日定时拉取银行流水文件
  - type: event
    name: 银行文件已到达
    publisher: platform.integration
  stages:
  - VS-04.4
  - VS-05.5
  owner_bc: B-22
  human_orchestration: false
  migration: 无在途实例（逐日自动导入）；历史流水迁入的来源与范围由数据模型组按 R-09 定，迁入走迁入通道只追加并保留原始文件与校验和，不触发过账候选
  scope: 按资金账户所属法人的数据范围（财务岗位）
  outcomes:
  - 流水已导入
  - 重复文件已忽略
  - 文件已拒收
  - 过账被拒收
  scenarios:
  - PRC-64-S01
  - PRC-64-S02
  - PRC-64-S03
  - PRC-64-S04
  - PRC-64-S05
  - PRC-64-S06
  roles:
  - id: SH-E6
    as: performer
  - id: SH-X7
    as: external
  steps:
  - actor: system
    where: external:银行
    evidence:
    - 银行原始流水文件（保留原样，INV-85）
    - 文件校验和与导入时刻
    command: 导入银行流水
    aggregate: AGG-88
    emits:
    - 流水已导入
    desc: 只追加，保留原始文件与校验和（INV-85）
    decision:
    - when: 银行文件校验和已导入过
      goto: end
      rule: INV-85
      outcome: 重复文件已忽略
    - when: 文件无法解析、资金账户未登记或与账户不符 → 拒收并告警
      goto: end
      rule: INV-85
      outcome: 文件已拒收
      alert: true
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 银行流水导入
    legal_entity: 资金账户所属法人
    audit: true
    metric_event: true
    timeout:
      after: P1D
      escalate_to: SH-E6
      interrupting: false
      pending:
      - T-01
    notify:
    - to: SH-E6
      how: 企业微信消息（文件拒收，或当日应到未到）
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-88
    calls: PRC-92
    desc: 利息与手续费
    period_gate: true
    decision:
    - when: 文件中没有利息或手续费行
      goto: end
      outcome: 流水已导入
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 流水已导入
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 资金账户所属法人
  notes: 匹配记在收款、付款上，流水不引用下游。步骤 2 只对利息与手续费行提交，其余流水行不过账。
- id: PRC-65
  name: 维护资金账户
  type: single_aggregate
  owner_bc: B-22
  aggregate: AGG-87
  stages:
  - VS-04.4
  - VS-05.5
  desc: 财务开立、冻结或销户
  states:
  - name: 已开立
    transitions:
    - 已冻结
    - 已销户
    note: 含信息图的「在用」；无独立命令
  - name: 已冻结
    transitions:
    - 已销户
    note: 聚合稿没有解冻命令，见结构问题
  - name: 已销户
    transitions: []
    note: 终态
  commands:
  - actor: SH-E6
    command: 开立资金账户
    emits:
    - 资金账户已开立
    where: external:银行
    evidence:
    - 银行开户证明扫描件与开户日
    from: []
    to: 已开立
  - actor: SH-E6
    command: 冻结资金账户
    branch: 冻结
    emits:
    - 资金账户已冻结
    where: external:银行
    evidence:
    - 银行或有权机关冻结通知扫描件
    from:
    - 已开立
    to: 已冻结
  - actor: SH-E6
    command: 销户资金账户
    branch: 销户
    emits:
    - 资金账户已销户
    where: external:银行
    evidence:
    - 银行销户回单
    from:
    - 已开立
    - 已冻结
    to: 已销户
  permission: 资金账户.开立 / 资金账户.冻结 / 资金账户.销户
  page: 资金账户管理页
  migration: 全部资金账户（含已销户）迁入，来源不在老系统与 A8 的由数据模型组按 R-09 定；迁入不发事件；无在途实例
  cross_bc:
  - mode: api
    direction: out
    bc: B-13
    name: 读法人主体
  notes: 个人独资户、工抵卡不计现金及现金等价物（P-38，分录标注）。
- id: PRC-70
  name: 起草并生效供方协议
  type: business
  trigger:
    type: human
    desc: 项目经理提出采购或分包需求，或职能提出公司级采购
  triggers:
  - type: human
    name: 项目经理提出项目采购或分包需求
  - type: human
    name: 职能高管提出公司级采购
  stages:
  - VS-05.2
  owner_bc: B-11
  human_orchestration: true
  human_note: 请购、审批、同意证据
  migration: 在途（草拟、审批中）投产前办结，办不完的以草拟状态迁入、重新提交审批；已生效、履行中、已完成、已结算、已终止的供方协议全部迁入（U-3、U-4），履约额度按已确认履约累计重建；迁入不触发审批、不发事件（§14.2 M7）
  scope: 项目采购按项目承担部门的数据范围；公司级采购按发起职能部门
  segregation:
  - roles:
    - SH-E2
    - SH-M1
    rule: 协议起草人与审批人不得为同一人
  outcomes:
  - 已签署生效
  - 已放弃
  scenarios:
  - PRC-70-S01
  - PRC-70-S02
  - PRC-70-S03
  - PRC-70-S04
  - PRC-70-S05
  - PRC-70-S06
  - PRC-70-S07
  - PRC-70-S08
  - PRC-70-S09
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-P2
    as: external
  - id: SH-X2
    as: external
  steps:
  - actor: SH-E2
    where: in_system
    read: true
    reads:
    - AGG-01
    - AGG-02
    - AGG-13
    - AGG-19
    desc: 读供方准入与资质、主协议承包链位置（INV-11、12）、项目
    decision:
    - when: 供方单位已停用或已合并，或供方角色未合格或已停用（INV-03、04）
      goto: end
      rule: INV-04
      outcome: 已放弃
      alert: true
    - when: 我方为分包人而拟对专业分包再分包（INV-11），或分包方无有效资质（INV-12）
      goto: end
      rule: INV-11
      outcome: 已放弃
      alert: true
    - when: otherwise
      goto: 2
    permission: 供方协议.查看
    page: 供方协议起草页
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读供方准入与资质
    - mode: api
      direction: out
      bc: B-05
      name: 读主协议承包链位置
    - mode: api
      direction: out
      bc: B-04
      name: 读项目
  - actor: SH-E2
    where: automatic
    command: 预算占用
    aggregate: AGG-80
    emits:
    - BudgetReserved
    desc: 预算不足只预警不拦截（INV-102 已定预警，用户 F-Q2，intent 2026-10-16-162821）
    decision:
    - when: otherwise
      goto: 3
      rule: INV-102
    cross_bc:
    - mode: api
      direction: out
      bc: B-18
      name: 预算占用
    notify:
    - to: SH-M1
      how: 审批待办中标注「超预算」
    legal_entity: 承担法人
  - actor: SH-E2
    where: in_system
    evidence:
    - 发包方书面同意或合同约定的证据（分包协议必附，INV-13）
    command: 起草供方协议
    aggregate: AGG-55
    desc: 请购是草拟前的单据。同意证据的判断在提交审批前（R-16）；P-06 主合同未回签即签分包只预警
    decision:
    - when: 分包协议未附发包方同意证据（INV-13）
      goto: 7
      rule: INV-13
      alert: true
    - when: 经办人放弃该协议（含审批驳回后放弃）
      goto: 7
    - when: otherwise
      goto: 4
    permission: 供方协议.起草
    page: 供方协议编辑页
    notify:
    - to: SH-E2
      how: 页面预警（P-06 主合同未回签）
    audit: true
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 提交审批
    approval:
      engine: platform.approval
      doc_type: 供方协议审批
      approver: SH-M1
      multi_level: false
      on_reject: 3
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    pending:
    - F-01
    notify:
    - to: SH-M1
      how: 企业微信待办
    audit: true
  - actor: SH-E2
    where: in_system
    evidence:
    - 双方签署页扫描件与生效日
    command: 生效供方协议
    aggregate: AGG-55
    emits:
    - 分包协议已生效
    - 采购协议已生效
    desc: 按协议类型二选一；生效时再校验 INV-12、INV-13
    decision:
    - when: 生效前置校验未通过（INV-12、INV-13）→ 拒收并告警，退回起草补正
      goto: 3
      rule: INV-13
      alert: true
    - when: otherwise
      goto: 6
    permission: 供方协议.生效
    page: 供方协议详情页
    metric_event: true
    audit: true
  - actor: system
    where: automatic
    command: 建立履约额度
    aggregate: AGG-58
    desc: 同 BC 联动
    outcome: 已签署生效
  - actor: system
    where: automatic
    command: 释放预算占用
    aggregate: AGG-80
    added_in: closeout
    branch: 放弃或不合规（占用已成立而协议未生效）
    emits:
    - BudgetReleased
    desc: 未附同意证据、驳回后放弃都释放预算占用（R-16）；写法同 PRC-87 的释放步骤
    cross_bc:
    - mode: api
      direction: out
      bc: B-18
      name: 释放预算占用
    outcome: 已放弃
  notes: P-06 主合同未回签即签分包只预警；分包须附发包方同意证据（INV-13）。R-29：删去无对应步骤的 SH-E6 复核角色。
- id: PRC-71
  name: 生效分包变更
  type: business
  trigger:
    type: human
    desc: 分包范围或价款变化
  triggers:
  - type: human
    name: 项目经理提出分包范围或价款变更
  stages:
  - VS-05.2
  owner_bc: B-11
  human_orchestration: false
  migration: 在途（已提出未生效）的变更投产前办结或以提出状态迁入；已生效变更全部迁入，生效后不可改（INV-16b），迁入不发事件，履约额度由 PRC-70 的迁入规则重建
  scope: 按项目承担部门的数据范围
  outcomes:
  - 分包变更已生效
  - 已拒收
  - 重复事件已忽略
  scenarios:
  - PRC-71-S01
  - PRC-71-S02
  - PRC-71-S03
  - PRC-71-S04
  - PRC-71-S05
  roles:
  - id: SH-E2
    as: initiator
  steps:
  - actor: SH-E2
    where: in_system
    evidence:
    - 变更影响评估与变更协议草稿
    command: 提出分包变更
    aggregate: AGG-56
    desc: 原协议须为已生效或履行中
    decision:
    - when: 原供方协议未生效，或已完成、已结算、已终止
      goto: end
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 分包变更.提出
    page: 分包变更编辑页
    audit: true
  - actor: SH-E2
    where: in_system
    evidence:
    - 双方签署的变更协议扫描件与生效日
    command: 生效分包变更
    aggregate: AGG-56
    emits:
    - 分包变更已生效
    decision:
    - when: 该变更已生效，再次修改（INV-16b），须另提新变更
      goto: end
      rule: INV-16b
      outcome: 已拒收
      alert: true
    - when: 变更后协议金额低于已确认的履约累计（INV-82）
      goto: end
      rule: INV-82
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 3
    permission: 分包变更.生效
    page: 分包变更详情页
    audit: true
  - actor: system
    where: automatic
    command: 供方额度更新
    aggregate: AGG-58
    on_event:
    - aggregate: AGG-56
      event: 分包变更已生效
    decision:
    - when: 该变更已更新过额度（事件重复）
      goto: end
      outcome: 重复事件已忽略
    - when: otherwise
      goto: end
      outcome: 分包变更已生效
  notes: 生效后不可改，只能再变更（INV-16a、16b）。R-29：SH-E2 重复列两次已合并。
- id: PRC-72
  name: 确认供方履约
  type: business
  trigger:
    type: human
    desc: 专人验收供方履约
  triggers:
  - type: human
    name: 专人验收供方履约
  stages:
  - VS-05.3
  owner_bc: B-11
  human_orchestration: false
  migration: 在途（已验收未确认）的投产前办结；已确认履约全部迁入（U-3、U-4）作为权责事实，迁入走迁入过账通道，不再提交过账候选、不重放履约确认
  scope: 按项目承担部门的数据范围
  segregation:
  - roles:
    - SH-E2
    rule: 供方协议经办人与履约验收确认人不得为同一人（INV-83）；两者同属项目经理类角色，按人员判定
  outcomes:
  - 已确认
  - 已拒收
  - 过账被拒收
  scenarios:
  - PRC-72-S01
  - PRC-72-S02
  - PRC-72-S03
  - PRC-72-S04
  - PRC-72-S05
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-E2
    as: reviewer
  - id: SH-X2
    as: external
  - id: SH-P2
    as: external
  steps:
  - actor: SH-E2
    where: in_system
    read: true
    reads:
    - AGG-19
    desc: 项目不得已结项、已终止、已取消（INV-39）
    decision:
    - when: 项目已结项、已终止或已取消
      goto: end
      rule: INV-39
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 供方履约.查看
    page: 供方履约确认页
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 读项目状态
  - actor: SH-E2
    where: automatic
    command: 占用履约额度
    aggregate: AGG-58
    desc: 先占用再写确认
    decision:
    - when: 履约额度不足（INV-82）
      goto: end
      rule: INV-82
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 3
  - actor: SH-E2
    where: in_system
    evidence:
    - 验收记录（验收人、验收时刻、验收结论）；纸质验收单扫描件
    command: 确认供方履约
    aggregate: AGG-57
    emits:
    - 供方履约已确认
    desc: 采购须专人验收（INV-83）；形态待定 Q20
    decision:
    - when: 确认人与该供方协议的经办人为同一人（INV-83）
      goto: end
      rule: INV-83
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 4
    permission: 供方履约.确认
    page: 供方履约确认页
    metric_event: true
    audit: true
    pending:
    - Q20
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-57
    calls: PRC-92
    desc: 成本事实
    period_gate: true
    decision:
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已确认
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 承担法人
    pending:
    - Q20
  notes: 形态待定 Q20；履约确认冲销另走 AGG-57。步骤 2 的占用与步骤 3 的确认同一用户操作内先后完成。
- id: PRC-73
  name: 登记并查验进项发票
  type: business
  trigger:
    type: human
    desc: 财务收到供方发票
  triggers:
  - type: human
    name: 财务收到供方发票
  stages:
  - VS-05.4
  - VS-08.2
  owner_bc: B-23
  human_orchestration: false
  migration: 在途（已登记未查验、已查验未确认用途）投产前办结；已入账与已转出的进项发票全部迁入（U-3、U-4），保留查验结果与查验时刻，迁入不重新向税务平台查验、不触发过账候选
  scope: 按发票抬头法人的数据范围（财务岗位）
  outcomes:
  - 已用途确认
  - 已转出
  - 已拒收
  - 查验未完成
  - 过账被拒收
  scenarios:
  - PRC-73-S01
  - PRC-73-S02
  - PRC-73-S03
  - PRC-73-S04
  - PRC-73-S05
  - PRC-73-S06
  roles:
  - id: SH-E6
    as: performer
  - id: SH-P2
    as: external
  - id: SH-R2
    as: external
  steps:
  - actor: SH-E6
    where: in_system
    evidence:
    - 电子发票文件或纸质发票扫描件
    command: 登记进项发票
    aggregate: AGG-89
    desc: 开票方须为已登记往来单位
    decision:
    - when: 开票方不是已登记往来单位
      goto: end
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 进项发票.登记
    page: 进项发票登记页
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读开票方
    legal_entity: 发票抬头法人
    audit: true
  - actor: SH-E6
    where: external:税务
    evidence:
    - 税务平台查验结果与查验时刻
    command: 查验进项发票
    aggregate: AGG-89
    desc: 经税务平台查验，不合规不得入账、不得作扣除凭证（INV-75）
    decision:
    - when: 税务平台不可用或未返回可判定结果 → 告警，保持已登记待重试
      goto: end
      rule: INV-75
      outcome: 查验未完成
      alert: true
    - when: 查验不合规
      goto: end
      rule: INV-75
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 3
    permission: 进项发票.查验
    page: 进项发票详情页
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 发票查验
    audit: true
  - actor: SH-E6
    where: in_system
    command: 确认进项发票用途
    aggregate: AGG-89
    emits:
    - 进项发票已用途确认
    decision:
    - when: 用途为不可抵扣，需转出
      goto: 4
    - when: otherwise
      goto: end
      outcome: 已用途确认
    permission: 进项发票.确认用途
    page: 进项发票详情页
    metric_event: true
    audit: true
  - actor: SH-E6
    where: in_system
    command: 进项转出
    aggregate: AGG-89
    branch: 转出
    emits:
    - 进项已转出
    decision:
    - when: otherwise
      goto: 5
    permission: 进项发票.转出
    page: 进项发票详情页
    metric_event: true
    audit: true
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-89
    calls: PRC-92
    desc: 进项转出过账
    period_gate: true
    decision:
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 已转出
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 发票抬头法人
  notes: 可跳过：无票先确认应付（暂估），P-35 提醒应取未取，取得后重入。入账占用在 PRC-74（供方来源）与 PRC-87（报销来源）。
- id: PRC-74
  name: 提交供方应付
  type: business
  trigger:
    type: event
    events:
    - event: 供方履约已确认
      aggregate: AGG-57
    desc: B-11 在调用前判定履约确认已确认
  triggers:
  - type: event
    name: 供方履约已确认
    publisher: B-11（同 BC）
  stages:
  - VS-05.4
  owner_bc: B-11
  human_orchestration: false
  migration: 无人工在途；投产时已确认履约但尚无应付的，按迁入的应付事实核对，缺失者经迁入用例补建，不重放本流程；已确认的应付全部迁入（U-3、U-4）
  scope: 按承担法人的数据范围（系统自动，财务岗位只读）
  outcomes:
  - 应付已确认
  - 重复事件已忽略
  - 已拒收
  - 过账被拒收
  scenarios:
  - PRC-74-S01
  - PRC-74-S02
  - PRC-74-S03
  - PRC-74-S04
  - PRC-74-S05
  roles:
  - id: SH-E6
    as: informed
  steps:
  - actor: system
    where: automatic
    command: 确认应付
    aggregate: AGG-52
    inner:
    - command: 占用进项发票入账
      aggregate: AGG-89
    emits:
    - 应付已确认
    desc: 按来源单据 ID 幂等；来源为供方履约确认时，命令先在进项发票上占用再写应付（来源为报销的应付不再占用，见 PRC-87）
    decision:
    - when: 来源单据已确认过应付（幂等）
      goto: end
      outcome: 重复事件已忽略
    - when: 发票查验不合规或已被占用（INV-74、75）→ 拒收并告警
      goto: end
      rule: INV-74
      outcome: 已拒收
      alert: true
    - when: 无票暂估（取得发票后经 PRC-73 重入占用）
      goto: 2
      pending:
      - P1-Q2
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 确认应付
    notify:
    - to: SH-E6
      how: 企业微信消息（待付清单新增）
    legal_entity: 承担法人
    audit: true
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-52
    calls: PRC-92
    period_gate: true
    decision:
    - when: 期间已关账 → 拒收并告警
      goto: end
      rule: ADR-0045
      outcome: 过账被拒收
      alert: true
    - when: otherwise
      goto: end
      outcome: 应付已确认
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选（PostingCandidate）
    legal_entity: 承担法人
  notes: B-10 只存来源 ID、不读 B-11（ADR-0022 决定 7）；两次事务各改一个聚合。
- id: PRC-75
  name: 发起、审批并执行付款
  type: business
  trigger:
    type: event
    events:
    - event: 应付已确认
      aggregate: AGG-52
    desc: 出纳按待付清单对已确认的应付发起付款（同 BC）
  triggers:
  - type: event
    name: 应付已确认
    publisher: B-10（同 BC）
  - type: human
    name: 出纳在待付清单发起付款
  stages:
  - VS-05.5
  - VS-08.1
  - VS-08.3
  - VS-12.2
  - VS-12.3
  - VS-13.5
  owner_bc: B-10
  human_orchestration: true
  human_note: 付款审批、不相容职务、退票重入
  migration: 在途付款按当前状态迁入：已发起、审批中的投产前办结或撤销并释放占用；已成功未核销的投产前跑完 PRC-131、132；已核销与已失败的全部迁入（U-3、U-4），迁入走迁入通道，不触发审批、不发事件、不调用银行
  scope: 按资金账户所属法人的数据范围（财务岗位）
  segregation:
  - roles:
    - SH-E6
    - SH-M1
    rule: 付款发起人与审批人不得为同一人（INV-81）
  - roles:
    - SH-E6
    rule: 付款发起人与出纳（登记银行结果的人）不得为同一人（INV-81）；同属职能人员角色，按人员判定
  - roles:
    - SH-M1
    - SH-E6
    rule: 审批人与出纳不得为同一人（INV-81）
  - roles:
    - system
    rule: 记账由系统经 PRC-132、PRC-92 自动过账，本流程没有人工记账步骤；人工补记账走手工凭证并受其分离约束（PRC-94）
  outcomes:
  - 付款已成功
  - 付款已失败
  - 已驳回
  - 已拒收
  - 发起失败已补偿
  scenarios:
  - PRC-75-S01
  - PRC-75-S02
  - PRC-75-S03
  - PRC-75-S04
  - PRC-75-S05
  - PRC-75-S06
  - PRC-75-S07
  - PRC-75-S08
  - PRC-75-S09
  - PRC-75-S10
  - PRC-75-S11
  - PRC-75-S12
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-E6
    as: performer
  - id: SH-P2
    as: external
  - id: SH-X7
    as: external
  steps:
  - actor: SH-E6
    where: in_system
    read: true
    reads:
    - AGG-01
    - AGG-88
    - AGG-87
    desc: 读收款账户、流水行与资金账户（INV-80）；P-01 银行账户变更后首笔付款预警
    decision:
    - when: 收款方不是已登记账户（INV-80），或单位已停用或合并、供应商角色未合格（INV-03、04）
      goto: end
      rule: INV-80
      outcome: 已拒收
      alert: true
    - when: otherwise
      goto: 2
    permission: 付款.查看
    page: 付款发起页
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读收款账户
    - mode: api
      direction: out
      bc: B-22
      name: 读流水行与资金账户
    notify:
    - to: SH-M1
      how: 审批待办标注「收款账户近期变更（P-01）」
  - actor: SH-E6
    where: in_system
    command: 发起付款
    aggregate: AGG-53
    inner:
    - command: 在应付上核销占用
      aggregate: AGG-52
    desc: 先占用再建付款（⑥a 评审 M6）：分配行先在应付上核销占用（付款不超过未付余额，INV-79），再建付款；两次事务各改一个聚合
    decision:
    - when: 付款超过应付未付余额
      goto: end
      rule: INV-79
      outcome: 已拒收
      alert: true
    - when: 占用成功而建付款失败
      goto: 3
    - when: otherwise
      goto: 4
    permission: 付款.发起
    page: 付款发起页
    legal_entity: 资金账户所属法人
    audit: true
  - actor: system
    where: automatic
    command: 释放核销占用
    aggregate: AGG-52
    branch: 补偿（占用成功而建付款失败）或审批驳回
    desc: 补偿顺序与占用相反；孤儿占用另有定时释放兜底
    decision:
    - when: 来源为审批驳回
      goto: end
      outcome: 已驳回
    - when: otherwise
      goto: end
      outcome: 发起失败已补偿
    notify:
    - to: SH-E6
      how: 企业微信消息（驳回或发起失败）
    audit: true
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 审批付款
    desc: 经办、审批、出纳、记账不相容，经 platform.identity 校验（INV-81）
    approval:
      engine: platform.approval
      doc_type: 付款审批
      approver: SH-M1
      multi_level: false
      on_reject: 3
    decision:
    - when: 审批人与发起人或出纳为同一人 → 驳回
      goto: 3
      rule: INV-81
      alert: true
    - when: otherwise
      goto: 5
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    - mode: api
      direction: out
      bc: platform.identity
      name: 校验不相容职务
    pending:
    - F-01
    notify:
    - to: SH-M1
      how: 企业微信待办
    - to: SH-E6
      how: 企业微信待办（审批通过，待出纳执行）
    audit: true
  - actor: SH-E6
    where: external:银行
    evidence:
    - 银行回单（回单编号、到账或支出金额、时刻）
    - 引用的银行流水行 ID
    command: 登记银行结果
    aggregate: AGG-53
    emits:
    - 付款已成功
    desc: 出纳在银行完成支付后登记；之后由事件策略接续：付款已成功 → 核销应付（PRC-131）→ 应付已核销 → 置付款已核销并提交过账候选（PRC-132）；报销置已付见 PRC-133
    decision:
    - when: 出纳与发起人或审批人为同一人 → 拒收并告警，改由其他出纳登记
      goto: 5
      rule: INV-81
      alert: true
    - when: 银行回单金额与分配合计不符 → 拒收并告警，退回出纳更正
      goto: 5
      rule: INV-78
      alert: true
    - when: 银行结果为失败或退票
      goto: 6
    - when: otherwise
      goto: end
      outcome: 付款已成功
    permission: 付款.登记银行结果
    page: 付款执行页
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 引用银行流水行
    legal_entity: 资金账户所属法人
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
      pending:
      - T-01
    metric_event: true
    audit: true
  - actor: SH-E6
    where: external:银行
    evidence:
    - 银行退票或失败回单
    command: 登记付款失败
    aggregate: AGG-53
    branch: 退票
    emits:
    - 付款已失败
    inner:
    - command: 释放核销占用
      aggregate: AGG-52
    desc: 退票时释放占用，付款重入
    decision:
    - when: 重新发起付款
      goto: 2
    - when: otherwise
      goto: end
      outcome: 付款已失败
    permission: 付款.登记失败
    page: 付款执行页
    metric_event: true
    audit: true
  notes: 应付已结清的订阅方 B-15（薪酬，PRC-127）。原步骤 6–8（核销应付、置付款已核销、提交过账候选）改为事件策略 PRC-131、PRC-132（⑥a 评审 M6）。审批人 SH-M1 为占位（F-01）。
- id: PRC-76
  name: 完成并结算供方协议
