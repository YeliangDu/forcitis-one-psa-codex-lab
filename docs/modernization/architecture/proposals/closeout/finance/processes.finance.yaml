- id: PRC-92
  name: 过账业务事实
  trigger:
    type: call
    desc: 各触账 BC 的「提交过账候选」调用本管道（开放主机服务 + 发布语言）；更正入口为来源 BC 另行调用「冲销并重过账」
  stages:
  - VS-10.1
  owner_bc: B-16
  human_orchestration: false
  migration: 在途：同步调用，当场成功或拒收，无在途实例。历史：全部历史事实经迁入过账通道直接写入事实表，不经本流程的期间闸门与事件发布（ADR-0036 第 6 条、SESSION_PLAYBOOK §14.2 M8）；投产前以最近两个已结期间重算比对（U-10）。
