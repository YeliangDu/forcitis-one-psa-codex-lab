  - actor: SH-E2
    where: in_system
    evidence:
    - 供方结算确认书（双方确认的最终价款）扫描件
    command: 结算供方协议
    aggregate: AGG-55
    emits:
    - 供方协议已结算
    decision:
    - when: otherwise
      goto: end
