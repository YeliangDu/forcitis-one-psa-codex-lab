  - OBJ-85
- id: PRC-172
  name: 申请出差并同步差旅服务商
  type: business
  owner_bc: B-12
  stages:
  - VS-08.0
  added_in: closeout
  basis: S-31 SQ-28
  trigger:
    type: human
    desc: 员工在订票前提交出差申请
  human_orchestration: true
  human_note: 出差审批、同步差旅服务商
  migration: 在途：差旅服务商侧已发起而新系统无记录的出差，投产前办结，不补迁；新系统出差申请无历史（老系统无本对象），投产后新建；投产时已批准未出行的由申请人在新系统重提
  scope: 申请人看本人单据；审批人经审批待办看所审单据
  segregation:
  - 申请人 ≠ 审批人（责任人就是申请人本人时按 AR-11 处理，待用户定）
  triggers:
  - type: human
    name: 员工提交出差申请
  outcomes:
  - 出差申请已同步
  - 已驳回
  - 已撤回
  - 已拒收（项目已关闭）
  - 同步失败（已告警，可重试）
  roles:
  - id: SH-E3
    as: initiator
  - id: SH-E2
    as: approver
  - id: SH-E1
    as: approver
  - id: SH-M1
    as: approver
  - id: SH-P2
    as: external
  steps:
  - actor: SH-E3
    where: in_system
    read: true
    reads:
    - AGG-19
    - AGG-10
    - AGG-62
    command: 读取归属对象与人员
    desc: 选择出差类型、起止日期与归属项目或商机，读项目与人员
    decision:
    - when: 所归属项目已结项、已终止或已取消
      goto: end
      rule: INV-39b
      outcome: 已拒收（项目已关闭）
      alert: true
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 读项目
    - mode: api
      direction: out
      bc: B-03
      name: 读商机
    - mode: api
      direction: out
      bc: B-13
      name: 读人员
    permission: 出差申请.填写
    page: 出差申请编辑页
  - actor: SH-E3
    where: in_system
    command: 提交出差申请
    aggregate: AGG-132
    added_in: closeout
    evidence:
    - 出差事由
    - 行程计划
    permission: 出差申请.提交
    page: 出差申请编辑页
    audit: true
    legal_entity: 申请人所在法人（任职口径）
    notify:
    - to: 审批人
      how: 企业微信待办
    withdraw:
      to: end
      outcome: 已撤回
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    command: 出差申请审批
    added_in: closeout
    approval:
      engine: platform.approval
      doc_type: 出差申请审批
      approver: cost_object_owner
      multi_level: false
      why_human: 出差是否必要、行程与时长是否合理，要对出差费用负责的人判断；项目状态已由规则拦截，超标订单另走 PRC-173
      escalation_rules:
      - AR-01
      - AR-02
      - AR-11
      - AR-12
      on_reject: end
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 提交审批
    permission: 出差申请.审批
    page: 审批待办（审批平台）
    audit: true
    timeout:
      after: P3D
      escalate_to: 审批人上级
      interrupting: false
      pending:
      - T-01
    notify:
    - to: SH-E3
      how: 驳回时企业微信消息
    pending:
    - AR-01-阈值
    - AR-02-阈值
    withdraw:
      to: 7
      outcome: 已撤回
    decision:
    - when: 审批已驳回
      goto: 6
      rule: platform.approval 审批结果
    - when: otherwise
      goto: 4
  - actor: system
    where: automatic
    command: 批准出差申请
    aggregate: AGG-132
    added_in: closeout
    desc: 审批通过后置已批准
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已通过
    decision:
    - when: otherwise
      goto: 5
    audit: true
  - actor: system
    where: external:分贝通
    evidence:
    - 推送回执与推送时刻
    command: 登记出差申请已同步
    aggregate: AGG-132
    added_in: closeout
    desc: 批准后经集成推给差旅服务商，订票前提；补贴按已批出差申请的类型与天数生成（报销侧同 BC 读取）
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 推送出差申请
    decision:
    - when: 推送失败（服务商不可达或拒收）→ 告警并可重试
      goto: end
      outcome: 同步失败（已告警，可重试）
      alert: true
    - when: otherwise
      goto: end
      outcome: 出差申请已同步
    timeout:
      after: PT1H
      escalate_to: SH-E6
      interrupting: false
      pending:
      - T-01
    notify:
    - to: SH-E3
      how: 企业微信消息：出差申请已批准并同步
    audit: true
  - actor: system
    where: automatic
    command: 驳回出差申请
    aggregate: AGG-132
    added_in: closeout
    desc: 审批已驳回后置出差申请已驳回，通知申请人
    decision:
    - when: otherwise
      goto: end
      outcome: 已驳回
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 审批已驳回
    audit: true
    notify:
    - to: SH-E3
      how: 企业微信消息：审批驳回
  - actor: SH-E3
    where: in_system
    command: 撤回出差申请
    aggregate: AGG-132
    added_in: closeout
    desc: 审批前申请人撤回，出差申请置已撤回，审批平台同时撤销待办
    decision:
    - when: otherwise
      goto: end
      outcome: 已撤回
    permission: 出差申请.撤回
    page: 出差申请详情页
    audit: true
  notes: 把握低（SQ-28）：差旅服务商侧的订票流程与同步字段未取证；新边 B-12 → platform.integration。
