  - 法人
  - 池的职能类别
  - 基数
  - 档位
  - 费率
  - 生效日
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 法人
  - 版本号
  emits: []
- name: 试算人工成本分配
  aggregate: AGG-41
  params:
  - 法人
  - 会计年度
  - 期间序号
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 法人
  - 期间
  - 运行序号
  emits: []
- name: 确认人工成本分配
  aggregate: AGG-41
  params:
  - 运行引用
  preconditions:
  - INV-89
  authority:
    A: 财务负责人
  idempotency_key:
  - 运行引用
  emits: []
- name: 提交过账候选
  aggregate: AGG-41
  params:
  - 运行引用
  preconditions:
  - INV-92
  - INV-93
  authority:
    A: 财务负责人
  idempotency_key:
  - 运行引用
  emits:
  - 人工成本分配已过账
- name: 试算分摊运行
  aggregate: AGG-42
  params:
  - 法人
  - 会计年度
  - 期间序号
  - 规则版本引用
  preconditions:
  - INV-90
  - INV-91
  authority:
    A: 财务负责人
  idempotency_key:
  - 法人
  - 期间
  - 运行序号
  emits: []
- name: 生效分摊运行
  aggregate: AGG-42
  params:
  - 运行引用
  preconditions:
  - INV-90
  authority:
    A: 财务负责人
  idempotency_key:
  - 运行引用
  emits:
  - 分摊已生效
- name: 售前投入转费用
  aggregate: AGG-43
  params:
  - 来源对象(项目或协议)
  - 期间
  preconditions:
  - INV-92
  - INV-94
  authority:
    A: 财务负责人
  idempotency_key:
  - 来源对象
  - 结转类型
  - 期间
  emits: []
- name: 提交过账候选
  aggregate: AGG-43
  params:
  - 结转批次引用
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 结转批次引用
  emits: []
- name: 转入售前投入
  aggregate: AGG-43
  params:
  - 项目引用
  - 协议引用
  preconditions:
  - INV-92
  - INV-94
  authority:
    A: 财务负责人
  idempotency_key:
  - 来源对象
  - 结转类型
  - 期间
  emits: []
- name: 终止清算成本
  aggregate: AGG-43
  params:
  - 项目或协议引用
  - 终止原因
  preconditions:
  - INV-92
  - INV-94
  authority:
    A: 财务负责人
  idempotency_key:
  - 来源对象
  - 结转类型
  - 期间
  emits: []
- name: 结转合同履约成本
  aggregate: AGG-43
  params:
  - 过账事实引用(收入确认类型)
  preconditions:
  - INV-88
  - INV-92
  - INV-94
  authority:
    A: 财务负责人
  idempotency_key:
  - 过账事实引用
  emits: []
- name: 标记成本结转已过账
  aggregate: AGG-43
  params:
  - 结转批次引用, 过账事实引用
  preconditions:
  - INV-94
  authority:
    A: 财务负责人
  idempotency_key:
  - 结转批次引用
  emits:
  - 成本结转已过账
- name: 确认应付
  aggregate: AGG-52
  params:
  - 来源单据引用
  - 承担法人
  - 往来对象
  - 金额(外部来源已定)
  - 应付类型
  preconditions:
  - INV-74
  - INV-75a
  authority:
    A: 财务负责人
  idempotency_key:
  - 来源单据ID
  emits:
  - 应付已确认
  also_used_by: revenue:PRC-147
  callers:
  - revenue:PRC-147（按净额确认应付）
  - finance:PRC-74
  - finance:PRC-114
  - finance:PRC-159（税费应付）
- name: 提交过账候选
  aggregate: AGG-52
  params:
  - 应付引用
  preconditions:
  - INV-92
  - INV-93
  authority:
    A: 财务负责人
  idempotency_key:
  - 应付引用
  emits: []
- name: 在应付上核销占用
  aggregate: AGG-52
  params:
  - 应付引用
  - 付款分配行
  preconditions:
  - INV-79
  authority:
    A: 待定（权责表无条目）
  idempotency_key:
  - 付款分配行ID
  emits: []
- name: 释放核销占用
  aggregate: AGG-52
  params:
  - 核销占用引用
  - 释放原因
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 核销占用ID
  emits: []
- name: 核销应付
  aggregate: AGG-52
  params:
  - 应付引用
  - 付款引用
  - 核销金额
  preconditions:
  - INV-77a
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID
  - 应付ID
  emits:
  - 应付已核销
  - 应付已结清
- name: 提交应付利润
  aggregate: AGG-52
  params:
  - 利润分配引用
  - 分配行
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 利润分配行ID
  emits:
  - 应付已确认
- name: 提交应付薪酬
  aggregate: AGG-52
  params:
  - 月度薪酬结算引用
  - 法人
  preconditions: []
  authority:
    A: 待定（权责表无条目）
  idempotency_key:
  - 薪酬结算ID
  emits:
  - 应付已确认
  also_used_by: people:PRC-126
  unused_ok: 由 people 组 PRC-126（B-15）调用，本组骨架无此步
- name: 冲回应付核销
  aggregate: AGG-52
  params:
  - 付款引用, 退票回单引用, 冲回金额（部分退回时等于退回额）
  preconditions:
  - INV-77a
  - INV-94
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID, 退票序号
  emits: []
- name: 人工处置核销差异
  aggregate: AGG-52
  params:
  - 付款引用, 处置方式(人工核销/转冲销付款), 处置原因
  preconditions:
  - INV-77a
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID, 处置序号
  emits: []
- name: 发起付款
  aggregate: AGG-53
  params:
  - 分配行(应付引用与金额)
  - 资金账户
  - 收款账户
  - 发起人
  preconditions:
  - INV-79
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 发起请求号
  emits: []
  also_used_by: revenue:PRC-08
  callers:
  - revenue:PRC-08（投标保证金付款）
  - revenue:PRC-86（发起借款付款，cross_bc B-09 → B-10）
  - finance:PRC-75
- name: 登记银行结果
  aggregate: AGG-53
  params:
  - 付款引用
  - 银行回单
  - 银行流水行引用
  preconditions:
  - INV-78a
  - INV-81
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID
  - 银行回单号
  emits:
  - 付款已成功
- name: 登记付款失败
  aggregate: AGG-53
  params:
  - 付款引用
  - 失败或退票原因
  - 银行回单
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID
  - 银行回单号
  emits:
  - 付款已失败
- name: 标记付款已核销
  aggregate: AGG-53
  params:
  - 付款引用
  preconditions:
  - INV-92
  - INV-93
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID
  emits: []
- name: 提交过账候选
  aggregate: AGG-53
  params:
  - 付款引用
  preconditions:
  - INV-92
  - INV-93
  authority:
    A: 待定（权责表无条目）
  idempotency_key:
  - 付款ID
  emits: []
- name: 登记代发退回
  aggregate: AGG-53
  params:
  - 付款引用
  - 银行代发退回回单
  - 退回金额
  - 退回收款人
  preconditions:
  - 付款已核销
  - 累计退回额不超过付款金额
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID
  - 银行回单号
  emits:
  - 付款已部分退回
  proposed: true
  proposed_reason: PAYROLL_REISSUE_SEAM J-2（one-architecture 2026-10-22 定）；骨架 PRC-75 步 10
- name: 登记薪酬补发明细
  aggregate: AGG-52
  params:
  - 应付薪酬引用
  - 薪酬行引用
  - 补发轮次
  - 收款人与账户
  - 补发金额（等于原实发）
  preconditions:
  - 累计补发额不超过累计冲回额（退回款未登记的拒收并告警）
  authority:
    A: 法人财务负责人
  idempotency_key:
  - 薪酬行ID
  - 补发轮次
  emits: []
  proposed: true
  proposed_reason: PAYROLL_REISSUE_SEAM J-1（one-architecture 2026-10-22 定：补发不新建应付，原应付加补发明细）
  also_used_by: people:PRC-126
  unused_ok: 由 people 组 PRC-126（B-15）订阅薪酬补发已发起后调用，本组骨架无此步
- name: 登记退票
  aggregate: AGG-53
  params:
  - 付款引用, 银行退票回单
  preconditions:
  - INV-78a
  authority:
    A: 财务负责人
  idempotency_key:
  - 付款ID, 银行回单号
  emits:
  - 付款已退票
- name: 登记出资认缴
  aggregate: AGG-54
  params:
  - 法人
  - 出资人
  - 认缴额
  - 出资协议依据
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 法人
  - 出资人
  - 认缴依据编号
  emits: []
- name: 登记出资实缴
  aggregate: AGG-54
  params:
  - 出资引用
  - 实缴额
  - 银行流水行引用
  preconditions:
  - INV-127
  authority:
    A: 财务负责人
  idempotency_key:
  - 银行流水行ID
  emits:
  - 出资已实缴
- name: 提交过账候选
  aggregate: AGG-54
  params:
  - 出资引用
  - 事实类型
  preconditions:
  - INV-92
  - INV-93
  authority:
    A: 财务负责人
  idempotency_key:
  - 出资ID
  - 事实类型
  - 序号
  emits: []
- name: 登记出资退回
