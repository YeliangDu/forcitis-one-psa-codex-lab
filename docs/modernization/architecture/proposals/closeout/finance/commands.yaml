- name: 提交过账候选
  aggregate: AGG-109
  params:
  - 利润分配引用
  - 事实类型
  preconditions:
  - INV-92
  - INV-93
  authority:
    A: 财务负责人
  idempotency_key:
  - 利润分配ID
  - 事实类型
  emits: []
  unused_ok: 只留给不经应付的项（如提取盈余公积），分录落点待 U-44；应付股利确认由应付侧过账（S-31 SQ-02）
- name: 撤销利润分配决议
  aggregate: AGG-109
  params:
  - 利润分配引用, 撤销决议依据
  preconditions: []
  authority:
    A: SH-O1
  idempotency_key:
  - 利润分配ID, 撤销决议编号
  emits: []
- name: 起草供方协议
  aggregate: AGG-55
