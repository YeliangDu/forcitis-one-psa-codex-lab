  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 协议引用
  emits:
  - 供方协议已结算
- name: 终止供方协议
  aggregate: AGG-55
  params:
  - 协议引用
  - 终止原因
  - 结算结论
  preconditions: []
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 协议引用
  emits:
  - 供方协议已终止
