  aggregate: AGG-56
  params:
  - 变更引用
  - 审批结果
  preconditions:
  - INV-16b
  - INV-82
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 变更引用
  emits:
  - 分包变更已生效
- name: 确认供方履约
  aggregate: AGG-57
