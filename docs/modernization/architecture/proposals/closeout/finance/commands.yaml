  - 退回额
  - 减资或退伙决议依据
  preconditions:
  - INV-128
  authority:
    A: 财务负责人
  idempotency_key:
  - 退回依据编号
  emits:
  - 出资已退回
- name: 更正出资登记
  aggregate: AGG-54
  params:
  - 出资引用, 更正后实缴额, 更正依据
  preconditions:
  - INV-127
  authority:
    A: 财务负责人
  idempotency_key:
  - 出资引用, 更正序号
  emits: []
- name: 草拟利润分配
  aggregate: AGG-109
  params:
  - 法人
  - 会计年度
  - 分配行
  preconditions: []
  authority:
    A: 财务负责人
  idempotency_key:
  - 法人
  - 会计年度
  - 草拟序号
  emits: []
- name: 决议利润分配
  aggregate: AGG-109
