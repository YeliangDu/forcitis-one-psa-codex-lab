  - 协议引用
  - 确认行
  - 确认人
  preconditions:
  - INV-83
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 协议引用
  - 确认单号
  emits:
  - 供方履约已确认
- name: 提交过账候选
  aggregate: AGG-57
  params:
  - 履约确认引用
  preconditions:
  - INV-92
  - INV-93
