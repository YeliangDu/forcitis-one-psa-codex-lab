commands:
- name: 批准分摊规则版本
  aggregate: AGG-40
  params:
  - 规则版本引用
  - 审批单引用
  preconditions: []
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 规则版本引用
  emits: []
- name: 生效分摊规则版本
  aggregate: AGG-40
  params:
  - 规则版本引用
  - 审批结果
  preconditions:
  - INV-91
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 规则版本引用
  emits:
  - 分摊规则已生效
- name: 编制分摊规则版本
  aggregate: AGG-40
