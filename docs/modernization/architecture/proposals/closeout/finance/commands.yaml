  - 项目或部门
  - 基线
  - 付款条件
  - 质保金条款
  preconditions:
  - INV-13
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 请求号
  emits: []
- name: 生效供方协议
  aggregate: AGG-55
  params:
  - 协议引用
  - 审批结果
  preconditions:
  - INV-13
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 协议引用
  emits:
  - 分包协议已生效
  - 采购协议已生效
- name: 完成供方协议
  aggregate: AGG-55
