  - 报销人
  - 明细(项目或商机)
  - 发票占用引用
  - 预算占用引用
  preconditions:
  - INV-84
  authority:
    A: 实例级：费用归属对象.责任人
  idempotency_key:
  - 报销单号
  emits: []
- name: 核定费用报销
  aggregate: AGG-59
  params:
