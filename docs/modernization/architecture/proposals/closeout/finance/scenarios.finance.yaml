# 财务组验收场景清单（PRC-NN-Sxx；按方法稿第 6 节分支覆盖：每个判断出口、每个超时分支、每个结局至少一条）
# 只写路径与期望结局，Given/When/Then 由测试代理按此展开（CS-5.3）；跨 BC 段只断言本模块并以事件契约衔接（CS-5.5）
PRC-15:
- id: PRC-15-S01
  path: 商机已丢单，有售前投入 → 转费用并过账
  outcome: 售前投入已转费用
  covers:
  - 结局「售前投入已转费用」
  expect: 结局「售前投入已转费用」
- id: PRC-15-S02
  path: 商机已放弃，同上
  outcome: null
  covers:
  - 第二个触发事件
  expect: 第二个触发事件
- id: PRC-15-S03
  path: 同一事件重复投递，幂等
  outcome: 已转费用（幂等）
  covers:
  - 结局「已转费用（幂等）」
  expect: 结局「已转费用（幂等）」
- id: PRC-15-S04
  path: 商机没有未转的售前投入
  outcome: 无需转费用
  covers:
  - 结局「无需转费用」
  expect: 结局「无需转费用」
- id: PRC-15-S05
  path: 立项后回签前挂账的投入超过 N 个月（默认 6）未签约，定时转费用
  outcome: null
  covers:
  - 定时触发
  expect: 定时触发
- id: PRC-15-S06
  path: 该法人无开放期间可落（管道拒收）
  outcome: 已拒收
  covers:
  - 步 1 出口 INV-92
  - 结局「已拒收」
  expect: 步 1 出口 INV-92；结局「已拒收」
- id: PRC-15-S07
  path: 落账期间已关账、该法人有开放期间：落当前开放期间并标原期间，照常过账
  outcome: 售前投入已转费用
  covers:
  - 期间闸门路由
  - 结局「售前投入已转费用」
  expect: 期间闸门路由；结局「售前投入已转费用」
- id: PRC-15-S08
  path: 售前投入转费用：该商机已转过费用（重复事件，幂等） → 结束（已转费用（幂等））
  outcome: 已转费用（幂等）
  covers:
  - 步 1 出口：该商机已转过费用（重复事件，幂等）
  expect: 结束（已转费用（幂等））
PRC-25:
- id: PRC-25-S01
  path: 项目先建立、合同后签回，后到者触发转入
  outcome: 售前投入已转入
  covers:
  - 结局「售前投入已转入」
  expect: 结局「售前投入已转入」
- id: PRC-25-S02
  path: 合同先签回、项目后建立，后到者触发转入
  outcome: null
  covers:
  - 另一到达顺序
  expect: 另一到达顺序
- id: PRC-25-S03
  path: 只到一个事件
  outcome: 等待齐备
  covers:
  - 结局「等待齐备」
  expect: 结局「等待齐备」
- id: PRC-25-S04
  path: 重复事件，同商机同合同已转入
  outcome: 已转入（幂等）
  covers:
  - 结局「已转入（幂等）」
  expect: 结局「已转入（幂等）」
- id: PRC-25-S05
  path: 没有未转的售前投入
  outcome: 无需转入
  covers:
  - 结局「无需转入」
  expect: 结局「无需转入」
- id: PRC-25-S06
  path: 该法人无开放期间可落（管道拒收）
  outcome: 已拒收
  covers:
  - 步 1 出口 INV-92
  - 结局「已拒收」
  expect: 步 1 出口 INV-92；结局「已拒收」
- id: PRC-25-S07
  path: 落账期间已关账、该法人有开放期间：落当前开放期间并标原期间，照常过账
  outcome: 售前投入已转入
  covers:
  - 期间闸门路由
  - 结局「售前投入已转入」
  expect: 期间闸门路由；结局「售前投入已转入」
PRC-35:
- id: PRC-35-S01
  path: 项目已终止（或取消），有余额 → 清算过账
  outcome: 清算成本已过账
  covers:
  - 结局「清算成本已过账」
  expect: 结局「清算成本已过账」
- id: PRC-35-S02
  path: 协议已终止或项目已结项触发清算
  outcome: null
  covers:
  - 另外两个触发事件
  expect: 另外两个触发事件
- id: PRC-35-S03
  path: 重复事件，已清算
  outcome: 已清算（幂等）
  covers:
  - 结局「已清算（幂等）」
  expect: 结局「已清算（幂等）」
- id: PRC-35-S04
  path: 没有未结转的合同履约成本或售前投入
  outcome: 无需清算
  covers:
  - 结局「无需清算」
  expect: 结局「无需清算」
- id: PRC-35-S05
  path: 该法人无开放期间可落（管道拒收）
  outcome: 已拒收
  covers:
  - 步 1 出口 INV-92
  - 结局「已拒收」
  expect: 步 1 出口 INV-92；结局「已拒收」
- id: PRC-35-S06
  path: 落账期间已关账、该法人有开放期间：落当前开放期间并标原期间，照常过账
  outcome: 清算成本已过账
  covers:
  - 期间闸门路由
  - 结局「清算成本已过账」
  expect: 期间闸门路由；结局「清算成本已过账」
PRC-55:
- id: PRC-55-S01
  path: 收入确认事实 → 配对结转合同履约成本（A1、Q-04、Q20 定后断言金额口径）
  outcome: 合同履约成本已结转
  covers:
  - 结局「合同履约成本已结转」
  expect: 结局「合同履约成本已结转」
- id: PRC-55-S02
  path: 过账事实不是收入确认类型
  outcome: 非收入确认事实
  covers:
  - 结局「非收入确认事实」
  expect: 结局「非收入确认事实」
- id: PRC-55-S03
  path: 同一事实重复到达，幂等
  outcome: 已结转（幂等）
  covers:
  - 结局「已结转（幂等）」
  expect: 结局「已结转（幂等）」
- id: PRC-55-S04
  path: 该合同没有可转出的合同履约成本
  outcome: 无需结转
  covers:
  - 结局「无需结转」
  expect: 结局「无需结转」
- id: PRC-55-S05
  path: 该法人无开放期间可落（管道拒收）
  outcome: 已拒收
  covers:
  - 步 1 出口 INV-92
  - 结局「已拒收」
  expect: 步 1 出口 INV-92；结局「已拒收」
- id: PRC-55-S06
  path: 成本结转与收入确认同期间、不同事务（N-16）
  outcome: null
  covers:
  - 期间一致性
  expect: 期间一致性
- id: PRC-55-S07
  path: 落账期间已关账、该法人有开放期间：落当前开放期间并标原期间，照常过账
  outcome: 合同履约成本已结转
  covers:
  - 期间闸门路由
  - 结局「合同履约成本已结转」
  expect: 期间闸门路由；结局「合同履约成本已结转」
PRC-64:
- id: PRC-64-S01
  path: 文件到达、导入成功、含利息手续费行、过账成功
  outcome: null
  covers:
  - 步 1 otherwise
  - 步 2 otherwise
  - 流水已导入
  expect: 步 1 otherwise；步 2 otherwise；流水已导入
- id: PRC-64-S02
  path: 同一校验和的文件再次到达
  outcome: null
  covers:
  - 步 1 重复
  - 重复文件已忽略
  expect: 步 1 重复；重复文件已忽略
- id: PRC-64-S03
  path: 文件无法解析或账户不符
  outcome: null
  covers:
  - 步 1 拒收
  - 文件已拒收
  expect: 步 1 拒收；文件已拒收
- id: PRC-64-S04
  path: 文件只有普通流水行
  outcome: null
  covers:
  - 步 2 无利息手续费行
  - 流水已导入
  expect: 步 2 无利息手续费行；流水已导入
- id: PRC-64-S05
  path: 利息行过账时期间已关账：落开放期间并标原期间
  outcome: 流水已导入
  covers:
  - 步 2 期间闸门路由
  - 结局「流水已导入」
  expect: 步 2 期间闸门路由；结局「流水已导入」
- id: PRC-64-S06
  path: 当日应到文件未到
  outcome: null
  covers:
  - 步 1 超时升级
  expect: 步 1 超时升级
- id: PRC-64-S07
  path: 利息行过账被管道拒收（该法人无开放期间、借贷不平或法人不一致）
  outcome: 过账被拒收
  covers:
  - 步 2 管道拒收
  - 结局「过账被拒收」
  expect: 步 2 管道拒收；结局「过账被拒收」
- id: PRC-64-S08
  path: 导入银行流水：银行文件校验和已导入过 → 结束（重复文件已忽略）
  outcome: 重复文件已忽略
  covers:
  - 步 1 出口：银行文件校验和已导入过
  expect: 结束（重复文件已忽略）
- id: PRC-64-S09
  path: 导入银行流水超时：超过 P1D 未处理，提醒并升级给 SH-E6（非中断，主线照常）
  outcome: null
  covers:
  - 步 1 超时
  expect: 发出提醒，不自动通过、不中断
PRC-65:
- id: PRC-65-S01
  path: 开立资金账户：开户证明齐全，财务负责人确认
  outcome: 已开立
  covers:
  - 转移「开立资金账户」
  - 审批确认
  expect: 账户已开立，发资金账户已开立（仅分析）；开户经办≠财务负责人
- id: PRC-65-S02
  path: 开立资金账户：开户证明缺失或法人主体不存在
  outcome: 已拒收
  covers:
  - 转移「开立资金账户」前置
  expect: 拒绝并告警
- id: PRC-65-S03
  path: 开立资金账户：财务负责人驳回
  outcome: 已拒收
  covers:
  - 审批驳回
  expect: 不开立
- id: PRC-65-S04
  path: 冻结资金账户：已开立 → 已冻结（银行或有权机关通知）
  outcome: 已冻结
  covers:
  - 转移「冻结资金账户」
  expect: 状态已冻结，发资金账户已冻结
- id: PRC-65-S05
  path: 销户资金账户：已开立或已冻结 → 已销户，无未结付款占用
  outcome: 已销户
  covers:
  - 转移「销户资金账户」
  - 审批确认
  expect: 终态已销户，发资金账户已销户
- id: PRC-65-S06
  path: 销户资金账户：账户仍有未结付款占用或未对账流水
  outcome: 已拒收
  covers:
  - 转移「销户资金账户」前置
  expect: 拒绝并告警
- id: PRC-65-S07
  path: 非法转换：已销户再冻结或再销户；已冻结再开立
  outcome: 已拒收
  covers:
  - 非法转换
  - 终态已销户
  expect: 拒绝并告警
- id: PRC-65-S08
  path: 冻结后需解冻
  outcome: —
  covers:
  - 无解冻命令（SQ-07）
  expect: 暂无命令，待 SQ-07 裁定后补场景
PRC-70:
- id: PRC-70-S01
  path: 采购协议：占用、起草、审批通过、生效、建额度
  outcome: null
  covers:
  - 步 1–6 主路径
  - 已签署生效
  expect: 步 1–6 主路径；已签署生效
- id: PRC-70-S02
  path: 分包协议附同意证据后同样走完
  outcome: null
  covers:
  - 步 3 otherwise（含 INV-13）
  - 已签署生效
  expect: 步 3 otherwise（含 INV-13）；已签署生效
- id: PRC-70-S03
  path: 供方已停用或角色未合格
  outcome: null
  covers:
  - 步 1 INV-03、04
  - 已放弃
  expect: 步 1 INV-03、04；已放弃
- id: PRC-70-S04
  path: 违反再分包或资质无效
  outcome: null
  covers:
  - 步 1 INV-11、12
  - 已放弃
  expect: 步 1 INV-11、12；已放弃
- id: PRC-70-S06
  path: 审批驳回后修改，再提交通过
  outcome: null
  covers:
  - 步 4 on_reject
  - 步 3 otherwise
  - 已签署生效
  expect: 步 4 on_reject；步 3 otherwise；已签署生效
- id: PRC-70-S07
  path: 审批驳回后经办人放弃
  outcome: null
  covers:
  - 步 3 放弃 → 步 7
  - 已放弃
  expect: 步 3 放弃 → 步 7；已放弃
- id: PRC-70-S08
  path: 生效时再校验未通过，退回起草
  outcome: null
  covers:
  - 步 5 → 步 3
  expect: 步 5 → 步 3
- id: PRC-70-S09
  path: 预算不足只预警，审批待办标超预算
  outcome: null
  covers:
  - 步 2 INV-102 预警
  expect: 步 2 INV-102 预警
- id: PRC-70-S10
  path: 提交审批后经办人撤回：释放预算占用
  outcome: 已撤回
  covers:
  - 步 4 撤回 → 步 7
  - 结局「已撤回」
  expect: 步 4 撤回 → 步 7；结局「已撤回」
- id: PRC-70-S11
  path: 责任人就是起草人本人（项目经理起草自己项目的协议）
  outcome: null
  covers:
  - AR-11（处理方式待用户定）
  expect: AR-11（处理方式待用户定）
- id: PRC-70-S12
  path: 金额超过阈值或供方为关联方：责任人批后加审
  outcome: null
  covers:
  - AR-01、AR-02、AR-07 加审（阈值待定）
  expect: AR-01、AR-02、AR-07 加审（阈值待定）
- id: PRC-70-S13
  path: 读取供方准入资质与项目：我方为分包人而拟对专业分包再分包（INV-11），或分包方无有效资质（INV-12） → 结束（已放弃）
  outcome: 已放弃
  covers:
  - 步 1 出口：我方为分包人而拟对专业分包再分包（INV-11），或分包方无有效资质（INV-12）
  expect: 结束（已放弃）；告警
- id: PRC-70-S14
  path: 起草供方协议：分包协议未附发包方同意证据（INV-13）→ 留在草拟并告警，经办人补证后再提交（预算占用不重占） → 转步 3
  outcome: null
  covers:
  - 步 3 出口：分包协议未附发包方同意证据（INV-13）→ 留在草拟并告警，经办人补证后再提交（预算占用不重占）
  expect: 转步 3；告警
- id: PRC-70-S15
  path: 提交审批超时：超过 P3D 未处理，提醒并升级给 审批人上级（非中断，主线照常）
  outcome: null
  covers:
  - 步 4 超时
  expect: 发出提醒，不自动通过、不中断
- id: PRC-70-S16
  path: 提交审批：责任人缺位，审批上提上级组织负责人（AR-12，处理方式待用户定）
  outcome: null
  covers:
  - AR-12
  expect: 按 AR-12 路由审批
- id: PRC-70-S17
  path: 生效供方协议：生效前置校验未通过（INV-12、INV-13）→ 拒收并告警，退回起草补正 → 转步 3
  outcome: null
  covers:
  - 步 5 出口：生效前置校验未通过（INV-12、INV-13）→ 拒收并告警，退回起草补正
  expect: 转步 3；告警
PRC-71:
- id: PRC-71-S01
  path: 提出变更、生效、额度更新
  outcome: null
  covers:
  - 主路径
  - 分包变更已生效
  expect: 主路径；分包变更已生效
- id: PRC-71-S06
  path: 端到端：提出分包变更 → 结局「已拒收」
  outcome: 已拒收
  covers:
  - 结局「已拒收」
  expect: 结束于「已拒收」
- id: PRC-71-S07
  path: 端到端：提出分包变更 → 提交审批 → 生效分包变更 → 供方额度更新 → 结局「重复事件已忽略」
  outcome: 重复事件已忽略
  covers:
  - 结局「重复事件已忽略」
  expect: 结束于「重复事件已忽略」
- id: PRC-71-S08
  path: 端到端：提出分包变更 → 结局「已放弃」
  outcome: 已放弃
  covers:
  - 结局「已放弃」
  expect: 结束于「已放弃」
- id: PRC-71-S09
  path: 端到端：提出分包变更 → 提交审批 → 结局「已驳回」
  outcome: 已驳回
  covers:
  - 结局「已驳回」
  expect: 结束于「已驳回」
- id: PRC-71-S10
  path: 端到端：提出分包变更 → 提交审批 → 结局「已撤回」
  outcome: 已撤回
  covers:
  - 结局「已撤回」
  expect: 结束于「已撤回」
- id: PRC-71-S11
  path: 提出分包变更：原供方协议未生效，或已完成、已结算、已终止 → 结束（已拒收）
  outcome: 已拒收
  covers:
  - 步 1 出口：原供方协议未生效，或已完成、已结算、已终止
  expect: 结束（已拒收）；告警
- id: PRC-71-S12
  path: 提出分包变更：双方未达成一致，经办人放弃变更 → 结束（已放弃）
  outcome: 已放弃
  covers:
  - 步 1 出口：双方未达成一致，经办人放弃变更
  expect: 结束（已放弃）
- id: PRC-71-S13
  path: 提交审批超时：超过 P3D 未处理，提醒并升级给 审批人上级（非中断，主线照常）
  outcome: null
  covers:
  - 步 2 超时
  expect: 发出提醒，不自动通过、不中断
- id: PRC-71-S14
  path: 提交审批：责任人就是提交人本人，审批上提汇报线上级（AR-11，处理方式待用户定）
  outcome: null
  covers:
  - AR-11
  expect: 按 AR-11 路由审批
- id: PRC-71-S15
  path: 提交审批：责任人缺位，审批上提上级组织负责人（AR-12，处理方式待用户定）
  outcome: null
