- id: PRC-25-S14
  path: 第 5 步过账时本期正在关账中：返回「期间关账中、可重试」，不进拒收记录，重试后落开放期间并标原期间
  outcome: 期间关账中待重试
  covers:
  - 步 5 出口：期间关账中
