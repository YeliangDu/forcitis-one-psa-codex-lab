PRC-15:
- id: PRC-15-S01
  path: 商机已丢单，有售前投入 → 转费用并过账
  outcome: 售前投入已转费用
  covers:
  - 结局「售前投入已转费用」
  expect: 结局「售前投入已转费用」
- id: PRC-15-S02
  path: 商机已放弃，同上
  outcome: null
  covers:
  - 第二个触发事件
  expect: 第二个触发事件
- id: PRC-15-S03
  path: 同一事件重复投递，幂等
  outcome: 已转费用（幂等）
  covers:
  - 结局「已转费用（幂等）」
  expect: 结局「已转费用（幂等）」
- id: PRC-15-S04
  path: 商机没有未转的售前投入
  outcome: 无需转费用
  covers:
  - 结局「无需转费用」
  expect: 结局「无需转费用」
- id: PRC-15-S05
  path: 立项后回签前挂账的投入超过 N 个月（默认 6）未签约，定时转费用
  outcome: null
  covers:
  - 定时触发
  expect: 定时触发
- id: PRC-15-S06
  path: 该法人无开放期间可落（管道拒收）
  outcome: 已拒收
  covers:
  - 步 2 出口 INV-92
  - 结局「已拒收」
  expect: 步 2 出口 INV-92；结局「已拒收」
- id: PRC-15-S07
  path: 落账期间已关账、该法人有开放期间：落当前开放期间并标原期间，照常过账
  outcome: 已提交过账
  covers:
  - 期间闸门路由
  - 结局「已提交过账」
  expect: 期间闸门路由；结局「已提交过账」
- id: PRC-15-S08
  path: 售前投入转费用：该商机已转过费用（重复事件，幂等） → 结束（已转费用（幂等））
  outcome: 已转费用（幂等）
  covers:
  - 步 1 出口：该商机已转过费用（重复事件，幂等）
  expect: 结束（已转费用（幂等））
- id: PRC-15-S09
  path: 售前投入转费用：提交过账候选成功，等待过账结果 → 结束（已提交过账）
  outcome: 已提交过账
  covers:
  - 步 2 出口：提交过账候选成功
  - 结局「已提交过账」
  expect: 步 2 出口：提交过账候选成功；结局「已提交过账」
- id: PRC-15-S10
  path: 订阅 BusinessFactAttributed，标记成本结转已过账并发成本结转已过账 → 结束（售前投入已转费用）
  outcome: 售前投入已转费用
  covers:
  - 步 3 订阅过账结果标记成本结转已过账
  - 第三个触发事件
  expect: 步 3 订阅过账结果标记成本结转已过账；第三个触发事件
- id: PRC-15-S11
  path: 同一过账事件重复投递，标记成本结转已过账按幂等键不重复置位
  outcome: 售前投入已转费用
  covers:
  - 步 3 幂等
  expect: 步 3 幂等
- id: PRC-15-S12
  path: 转费用结果登记到归属登记，同一商机已转入合同履约成本则不再转费用（INV-132）
  outcome: 已转费用（幂等）
  covers:
  - 步 4 出口：INV-132
  expect: 步 4 出口：INV-132
- id: PRC-15-S13
  path: 第 2 步过账时本期正在关账中：返回「期间关账中、可重试」，不进拒收记录，重试后落开放期间并标原期间
  outcome: 期间关账中待重试
  covers:
  - 步 2 出口：期间关账中
  - 结局「期间关账中待重试」
  expect: 步 2 出口：期间关账中；结局「期间关账中待重试」
- id: PRC-15-S14
  path: 由 PRC-25 调用：售前投入所在法人与项目承担法人不一致的部分在原法人转当期费用
  outcome: 售前投入已转费用
  covers:
  - 入口：PRC-25 调用（法人不一致）
  expect: 入口：PRC-25 调用；在原法人转费用并过账
