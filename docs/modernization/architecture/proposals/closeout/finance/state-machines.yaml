    reverse_of: null
  reversal_note: 分录冲销以新行（红字）表达，原行状态不变
  note: 待处理队列放 AGG-84 下作无父行技术表，分录本身只追加、不改状态，状态只在队列项上（INV-95a，S-31 SQ-23）
