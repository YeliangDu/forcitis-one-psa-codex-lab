# 状态机（finance 组，提议稿）：from 为 null 表示创建；command 为 null 表示由事件触发（on_event）；stateless 聚合不设状态。
machines:
- aggregate: AGG-40
  initial: 草稿
  states:
  - 草稿
  - 审批中
  - 已生效
  - {name: 已取代, terminal: true}
  transitions:
  - from: null
    to: 草稿
    command: 编制分摊规则版本
    guard: []
    reverse_of: null
  - from: 草稿
    to: 审批中
    command: 批准分摊规则版本
    guard: [编制与批准分离]
    reverse_of: null
  - from: 审批中
    to: 已生效
    command: 生效分摊规则版本
    guard: [INV-91]
    reverse_of: null
    on_event: 审批已通过
  - from: 审批中
    to: 草稿
    command: null
    guard: []
    reverse_of: 批准分摊规则版本
    on_event: 审批已驳回
    note: 驳回退回草稿
  - from: 审批中
    to: 草稿
    command: null
    guard: []
    reverse_of: 批准分摊规则版本
    on_event: 审批已撤回
    note: 撤回退回草稿
  - from: 已生效
    to: 已取代
    command: null
    guard: [同类型同法人后继版本已生效（部分唯一索引，只一个生效）]
    reverse_of: null
    on_event: 后继版本已生效
    note: 已生效版本不可改，只被取代
  note: 批准分摊规则版本即提交批准；草稿存放位置待 one-data
- aggregate: AGG-41
  initial: 已试算
  states:
  - 已试算
  - 已确认
  - {name: 已过账, terminal: true}
  transitions:
  - from: null
    to: 已试算
    command: 试算人工成本分配
    guard: [INV-89, 每期间一次有效]
    reverse_of: null
  - from: 已试算
    to: 已试算
    command: 试算人工成本分配
    guard: []
    reverse_of: 试算人工成本分配
    note: 确认前可重新试算，覆盖未确认结果
  - from: 已试算
    to: 已确认
    command: 确认人工成本分配
    guard: [INV-89]
    reverse_of: null
  - from: 已确认
    to: 已过账
    command: 提交过账候选
    guard: [期间开放或落当前开放期间]
    reverse_of: null
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
  note: 口径待 FD-09
- aggregate: AGG-42
  initial: 已试算
  states:
  - 已试算
  - {name: 已生效, terminal: true}
  transitions:
  - from: null
    to: 已试算
    command: 试算分摊运行
    guard: []
    reverse_of: null
  - from: 已试算
    to: 已试算
    command: 试算分摊运行
    guard: []
    reverse_of: 试算分摊运行
    note: 生效前可重新试算
  - from: 已试算
    to: 已生效
    command: 生效分摊运行
    guard: [INV-90]
    reverse_of: null
  reversal_note: 管理口径、不过账；更正以新运行追加，已生效运行状态不变
- aggregate: AGG-43
  initial: 已过账
  states:
  - {name: 已过账, terminal: true}
  transitions:
  - from: null
    to: 已过账
    command: 售前投入转费用
    guard: []
    reverse_of: null
  - from: null
    to: 已过账
    command: 转入售前投入
    guard: []
    reverse_of: null
  - from: null
    to: 已过账
    command: 终止清算成本
    guard: []
    reverse_of: null
  - from: null
    to: 已过账
    command: 结转合同履约成本
    guard: [INV-88（待定 Q20）]
    reverse_of: null
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
  note: 四个结转命令各自一次产生并过账一个批次；聚合稿的独立「提交过账候选」骨架未用，见 NOTES 收敛节
- aggregate: AGG-52
  initial: 已确认
  states:
  - 已确认
  - 部分结清
  - {name: 已结清, terminal: true}
  transitions:
  - from: null
    to: 已确认
    command: 确认应付
    guard: [来源单据幂等, INV-74, INV-75a]
    reverse_of: null
  - from: null
    to: 已确认
    command: 提交应付利润
    guard: [利润分配已决议]
    reverse_of: null
  - from: null
    to: 已确认
    command: 提交应付薪酬
    guard: [来源为月度薪酬结算]
    reverse_of: null
  - from: 已确认
    to: 已确认
    command: 提交过账候选
    guard: &id001 []
    reverse_of: null
    note: 过账不改业务状态
  - from: 部分结清
    to: 部分结清
    command: 提交过账候选
    guard: *id001
    reverse_of: null
    note: 过账不改业务状态
  - from: 已结清
    to: 已结清
    command: 提交过账候选
    guard: *id001
    reverse_of: null
    note: 过账不改业务状态
  - from: 已确认
    to: 已确认
    command: 在应付上核销占用
    guard: [INV-79, 付款不超过未付余额]
    reverse_of: null
    note: 占用不减余额
  - from: 部分结清
    to: 部分结清
    command: 在应付上核销占用
    guard: [INV-79]
    reverse_of: null
    note: 占用不减余额
  - from: 已确认
    to: 已确认
    command: 释放核销占用
    guard: []
    reverse_of: 在应付上核销占用
    note: 审批驳回、撤回、付款失败或发起失败时补偿
  - from: 部分结清
    to: 部分结清
    command: 释放核销占用
    guard: []
    reverse_of: 在应付上核销占用
  - from: 已确认
    to: 部分结清
    command: 核销应付
    guard: [INV-78a, 余额大于零]
    reverse_of: null
  - from: 已确认
    to: 已结清
    command: 核销应付
    guard: [INV-78a, 余额为零]
    reverse_of: null
  - from: 部分结清
    to: 部分结清
    command: 核销应付
    guard: [余额大于零]
    reverse_of: null
  - from: 部分结清
    to: 已结清
    command: 核销应付
    guard: [余额为零]
    reverse_of: null
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
  note: 争议状态与处置分类聚合稿无命令，见 NOTES 收敛节；暂估应付是标记不是状态
- aggregate: AGG-53
  initial: 已发起
  states:
  - 已发起
  - 审批中
  - 已成功
  - {name: 已失败, terminal: true}
  - {name: 已核销, terminal: true}
  - {name: 已驳回, terminal: true}
  - {name: 已撤回, terminal: true}
  transitions:
  - from: null
    to: 已发起
    command: 发起付款
    guard: [INV-79, INV-80, INV-03c, INV-04b]
    reverse_of: null
  - from: 已发起
    to: 审批中
    command: null
    guard: []
    reverse_of: null
    on_event: 提交审批
  - from: 审批中
    to: 已成功
    command: 登记银行结果
    guard: [INV-78a, INV-81]
    reverse_of: null
    on_event: 审批已通过
  - from: 审批中
    to: 已失败
    command: 登记付款失败
    guard: []
    reverse_of: null
  - from: 审批中
    to: 已驳回
    command: null
    guard: []
    reverse_of: 发起付款
    on_event: 审批已驳回
    note: 补偿：AGG-52 释放核销占用
  - from: 审批中
    to: 已撤回
    command: null
    guard: []
    reverse_of: 发起付款
    on_event: 审批已撤回
    note: 补偿：AGG-52 释放核销占用
  - from: 已成功
    to: 已核销
    command: 置付款已核销
    guard: []
    reverse_of: null
    on_event: 应付已核销
  - from: 已成功
    to: 已失败
    command: 登记付款失败
    guard: [银行退票]
    reverse_of: 登记银行结果
    note: 成功后退票；与已核销应付的冲回见 NOTES 收敛节
  - from: 已核销
    to: 已核销
    command: 提交过账候选
    guard: []
    reverse_of: null
    note: 过账不改业务状态
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变；退票后重新发起为新付款
- aggregate: AGG-54
  initial: 认缴
  states:
  - 认缴
  - 实缴（到账）
  - 部分退回
  - {name: 已退回, terminal: true}
  transitions:
  - from: null
    to: 认缴
    command: 登记出资认缴
    guard: []
    reverse_of: null
  - from: 认缴
    to: 实缴（到账）
    command: 登记出资实缴
    guard: [累计实缴不超过认缴（SQ-47，〔缺〕INV）]
    reverse_of: null
  - from: 实缴（到账）
    to: 部分退回
    command: 登记出资退回
    guard: [退回不超过已实缴（SQ-47）, 减资或退伙决议依据]
    reverse_of: 登记出资实缴
  - from: 实缴（到账）
    to: 已退回
    command: 登记出资退回
    guard: [退回等于已实缴]
    reverse_of: 登记出资实缴
  - from: 部分退回
    to: 部分退回
    command: 登记出资退回
    guard: [退回不超过已实缴]
    reverse_of: 登记出资实缴
  - from: 部分退回
    to: 已退回
    command: 登记出资退回
    guard: [退回等于已实缴]
    reverse_of: 登记出资实缴
  - from: 实缴（到账）
    to: 实缴（到账）
    command: 提交过账候选
    guard: &id002 []
    reverse_of: null
    note: 过账不改业务状态
  - from: 部分退回
    to: 部分退回
    command: 提交过账候选
    guard: *id002
    reverse_of: null
    note: 过账不改业务状态
  - from: 已退回
    to: 已退回
    command: 提交过账候选
    guard: *id002
    reverse_of: null
    note: 过账不改业务状态
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
- aggregate: AGG-109
  initial: 草拟
  states:
  - 草拟
  - 已决议
  - 部分支付
  - {name: 已支付, terminal: true}
  - {name: 已取代, terminal: true}
  transitions:
  - from: null
    to: 草拟
    command: 草拟利润分配
    guard: []
    reverse_of: null
  - from: 草拟
    to: 已决议
    command: 决议利润分配
    guard: [INV-117]
    reverse_of: null
  - from: 已决议
    to: 已决议
    command: 提交过账候选
    guard: &id003 []
    reverse_of: null
    note: 过账不改业务状态
  - from: 部分支付
    to: 部分支付
    command: 提交过账候选
    guard: *id003
    reverse_of: null
    note: 过账不改业务状态
  - from: 已支付
    to: 已支付
    command: 提交过账候选
    guard: *id003
    reverse_of: null
    note: 过账不改业务状态
  - from: 已决议
    to: 部分支付
    command: 登记利润分配支付
    guard: [支付额小于决议额]
    reverse_of: null
  - from: 已决议
    to: 已支付
    command: 登记利润分配支付
    guard: [支付额等于决议额]
    reverse_of: null
  - from: 部分支付
    to: 部分支付
    command: 登记利润分配支付
    guard: [累计支付小于决议额]
    reverse_of: null
  - from: 部分支付
    to: 已支付
    command: 登记利润分配支付
    guard: [累计支付等于决议额]
    reverse_of: null
  - from: [已决议, 部分支付]
    to: 已取代
    command: null
    guard: []
    reverse_of: 决议利润分配
    on_event: 后继决议已登记
    note: 被取代决议引用；已支付部分以后继决议承接
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
- aggregate: AGG-55
  initial: 草拟
  states:
  - 草拟
  - 审批中
  - 已生效
  - 履行中
  - 已完成
  - {name: 已结算, terminal: true}
  - {name: 已终止, terminal: true}
  transitions:
  - from: null
    to: 草拟
    command: 起草供方协议
    guard: []
    reverse_of: null
  - from: 草拟
    to: 审批中
    command: null
    guard: []
    reverse_of: null
    on_event: 提交审批
  - from: 审批中
    to: 已生效
    command: 生效供方协议
    guard: [INV-03b, INV-04a, INV-11, INV-12, INV-13, INV-15]
    reverse_of: null
    on_event: 审批已通过
  - from: 审批中
    to: 草拟
    command: null
    guard: []
    reverse_of: 生效供方协议
    on_event: 审批已驳回
    note: 驳回退回起草
  - from: 审批中
    to: 草拟
    command: null
    guard: []
    reverse_of: 生效供方协议
    on_event: 审批已撤回
    note: 撤回退回起草
  - from: 已生效
    to: 履行中
    command: null
    guard: []
    reverse_of: null
    on_event: 供方履约已确认
    note: 首次履约确认触发，本 BC 内策略
  - from: 履行中
    to: 已完成
    command: 完成供方协议
    guard: [累计履约达协议金额或额度用尽]
    reverse_of: null
  - from: [已生效, 履行中]
    to: 已终止
    command: 终止供方协议
    guard: [终止原因必填]
    reverse_of: null
    on_event: 审批已通过
  - from: 已完成
    to: 已结算
    command: 结算供方协议
    guard: [已完成状态, 累计履约与协议金额关系]
    reverse_of: null
    on_event: 审批已通过
  - from: 已完成
    to: 已完成
    command: null
    guard: []
    reverse_of: 结算供方协议
    on_event: 审批已驳回
    note: 结算审批驳回或撤回，状态不变
  - from: 已生效
    to: 已生效
    command: null
    guard: &id004 []
    reverse_of: 终止供方协议
    on_event: 审批已驳回
    note: 终止审批驳回或撤回，状态不变
  - from: 履行中
    to: 履行中
    command: null
    guard: *id004
    reverse_of: 终止供方协议
    on_event: 审批已驳回
    note: 终止审批驳回或撤回，状态不变
- aggregate: AGG-56
  initial: 已提出
  states:
  - 已提出
  - {name: 已生效, terminal: true}
  - {name: 已驳回, terminal: true}
  - {name: 已撤回, terminal: true}
  transitions:
  - from: null
    to: 已提出
    command: 提出分包变更
    guard: [INV-16b]
    reverse_of: null
  - from: 已提出
    to: 已生效
    command: 生效分包变更
    guard: [INV-16b, 变更后金额不低于履约累计]
    reverse_of: null
    on_event: 审批已通过
  - from: 已提出
    to: 已驳回
    command: null
    guard: []
    reverse_of: 提出分包变更
    on_event: 审批已驳回
  - from: 已提出
    to: 已撤回
    command: null
    guard: []
    reverse_of: 提出分包变更
    on_event: 审批已撤回
- aggregate: AGG-57
  initial: 已确认
  states:
  - 已确认
  - {name: 已过账, terminal: true}
  transitions:
  - from: null
    to: 已确认
    command: 确认供方履约
    guard: [INV-83, INV-39a]
    reverse_of: null
  - from: 已确认
    to: 已过账
    command: 提交过账候选
    guard: [过账管道接受（拒收则保持已确认并告警）]
    reverse_of: null
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
  note: 形态待定 Q20
- aggregate: AGG-58
  stateless: true
  reason: 额度聚合只保留协议金额与占用行，余额与用尽由占用累计推出；占用以新行追加，释放以反向行表达，不设状态字段
  transitions: []
- aggregate: AGG-59
  initial: 已提交
  states:
  - 已提交
  - 已核定
  - {name: 已付, terminal: true}
  - {name: 已驳回, terminal: true}
  - {name: 已撤回, terminal: true}
  transitions:
  - from: null
    to: 已提交
    command: 提交费用报销
    guard: [INV-84, INV-75, INV-39b]
    reverse_of: null
  - from: 已提交
    to: 已核定
    command: 核定费用报销
    guard: [审批通过]
    reverse_of: null
    on_event: 审批已通过
  - from: 已提交
    to: 已驳回
    command: null
    guard: []
    reverse_of: 提交费用报销
    on_event: 审批已驳回
    note: 补偿：释放预算占用、驳回释放进项发票占用
  - from: 已提交
    to: 已撤回
    command: null
    guard: []
    reverse_of: 提交费用报销
    on_event: 审批已撤回
    note: 补偿同驳回
  - from: 已核定
    to: 已核定
    command: 提交过账候选
    guard: []
    reverse_of: null
    note: 过账不改业务状态
  - from: 已核定
    to: 已付
    command: 标记费用报销已付
    guard: [应付已结清或借款冲抵净额为零]
    reverse_of: null
    on_event: 应付已结清
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
- aggregate: AGG-77
  stateless: true
  reason: 过账事实只追加（ADR-0016），更正以冲销并重过账追加反向与重过账事实，原事实不改状态
  transitions: []
- aggregate: AGG-81
  initial: 未开放
  states:
  - 未开放
  - 开放
  - 关账中
  - {name: 已关账, terminal: true}
  transitions:
  - from: 未开放
    to: 开放
    command: 开放第 13 期
    guard: [INV-104, 第 13 期启用登记已生效]
    reverse_of: null
  - from: 开放
    to: 关账中
    command: 发起关账
    guard: [INV-99, 发起人与确认人不同]
    reverse_of: null
