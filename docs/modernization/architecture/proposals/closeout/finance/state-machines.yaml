# 状态机（finance 组，提议稿）：from 为 null 表示创建；command 为 null 表示由事件触发（on_event）；stateless 聚合不设状态。
machines:
- aggregate: AGG-40
  initial: 草稿
  states:
  - 草稿
  - 审批中
  - 已生效
  - {name: 已取代, terminal: true}
  transitions:
  - from: null
    to: 草稿
    command: 编制分摊规则版本
    guard: []
    reverse_of: null
  - from: 草稿
    to: 审批中
    command: 批准分摊规则版本
    guard: [编制与批准分离]
    reverse_of: null
  - from: 审批中
    to: 已生效
    command: 生效分摊规则版本
    guard: [INV-91]
    reverse_of: null
    on_event: 审批已通过
  - from: 审批中
    to: 草稿
    command: null
    guard: []
    reverse_of: 批准分摊规则版本
    on_event: 审批已驳回
    note: 驳回退回草稿
  - from: 审批中
    to: 草稿
    command: null
    guard: []
    reverse_of: 批准分摊规则版本
    on_event: 审批已撤回
    note: 撤回退回草稿
  - from: 已生效
    to: 已取代
    command: null
    guard: [同类型同法人后继版本已生效（部分唯一索引，只一个生效）]
    reverse_of: null
    on_event: 后继版本已生效
    note: 已生效版本不可改，只被取代
  note: 批准分摊规则版本即提交批准；草稿存放位置待 one-data
- aggregate: AGG-41
  initial: 已试算
  states:
  - 已试算
  - 已确认
  - 已过账
  - {name: 已作废, terminal: true}
  - {name: 已冲销, terminal: true}
  transitions:
  - from: null
    to: 已试算
    command: 试算人工成本分配
    guard: [INV-89, 每期间一次有效]
    reverse_of: null
  - from: 已试算
    to: 已试算
    command: 试算人工成本分配
    guard: []
    reverse_of: 试算人工成本分配
    note: 确认前可重新试算，覆盖未确认结果
  - from: 已试算
    to: 已确认
    command: 确认人工成本分配
    guard: [INV-89]
    reverse_of: null
  - from: 已确认
    to: 已过账
    command: 提交过账候选
    guard: [期间开放或落当前开放期间]
    reverse_of: null
  - command: 作废人工成本分配运行
    from: [已试算, 已确认]
    guard: []
    reverse_of: 试算人工成本分配
    to: 已作废
    note: 未过账前作废（S-31 SQ-17）
  - command: 冲销人工成本分配运行
    from: 已过账
    guard: [INV-95, AR-06 加审]
    reverse_of: 提交过账候选
    to: 已冲销
    note: 所属期间已关账的不再冲原运行，差额进下期运行（ADR-0045 决定 2）
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
  note: 口径待 FD-09
- aggregate: AGG-42
  initial: 已试算
  states:
  - 已试算
  - 已生效
  - {name: 已冲销, terminal: true}
  transitions:
  - from: null
    to: 已试算
    command: 试算分摊运行
    guard: []
    reverse_of: null
  - from: 已试算
    to: 已试算
    command: 试算分摊运行
    guard: []
    reverse_of: 试算分摊运行
    note: 生效前可重新试算
  - from: 已试算
    to: 已生效
    command: 生效分摊运行
    guard: [INV-90]
    reverse_of: null
  - command: 冲销分摊运行
    from: 已生效
    guard: [INV-95, AR-06 加审]
    reverse_of: 生效分摊运行
    to: 已冲销
  reversal_note: 管理口径、不过账；更正以新运行追加，已生效运行状态不变
- aggregate: AGG-43
  initial: 已生成
  states:
  - 已生成
  - {name: 已过账, terminal: true}
  transitions:
  - from: null
    to: 已生成
    command: 售前投入转费用
    guard: []
    reverse_of: null
  - from: null
    to: 已生成
    command: 转入售前投入
    guard: []
    reverse_of: null
  - from: null
    to: 已生成
    command: 终止清算成本
    guard: []
    reverse_of: null
  - from: null
    to: 已生成
    command: 结转合同履约成本
    guard: [INV-88（待定 Q20）]
    reverse_of: null
  - from: 已生成
    to: 已生成
    command: 提交过账候选
    guard: [过账管道接受（拒收则保持已生成并告警，由 PRC-158 处置）]
    reverse_of: null
    note: 提交不改状态，结果由订阅得到
  - from: 已生成
    to: 已过账
    command: 标记成本结转已过账
    guard: [订阅 BusinessFactAttributed，幂等键相同]
    reverse_of: null
    on_event: BusinessFactAttributed
  - command: 冲回成本结转
    from: 已过账
    guard: [INV-94, INV-95]
    reverse_of: 结转合同履约成本
    to: 已生成
    on_event: BusinessFactRestated
    note: S-31 SQ-04：订阅 BusinessFactRestated，只取收入确认类事实，据原单回冲已配对结转；再经提交过账候选、标记成本结转已过账回到已过账；pending Q20
  reversal_note: 已过账的运行单据被更正：原单置「已冲销」，新单引用原单（S-30 ③；冲销命令范围随 SQ-17 回补，本稿暂不加状态）
  note: 四个结转命令只在批次内记结转行（→（内部）），提交过账候选 → B-16，订阅过账结果后标记成本结转已过账并发成本结转已过账（S-30 ①）
- aggregate: AGG-52
  initial: 已确认
  states:
  - 已确认
  - 已部分结清
  - 已结清
  - {name: 已冲销, terminal: true}
  - 预付款已登记
  - 已部分冲抵
  - {name: 已冲抵, terminal: true}
  transitions:
  - from: null
    to: 已确认
    command: 确认应付
    guard: [来源单据幂等, INV-74, INV-75a]
    reverse_of: null
  - from: null
    to: 已确认
    command: 提交应付利润
    guard: [利润分配已决议]
    reverse_of: null
  - from: null
    to: 已确认
    command: 提交应付薪酬
    guard: [来源为月度薪酬结算]
    reverse_of: null
  - from: 已确认
    to: 已确认
    command: 提交过账候选
    guard: &id001 []
    reverse_of: null
    note: 过账不改业务状态
  - from: 已部分结清
    to: 已部分结清
    command: 提交过账候选
    guard: *id001
    reverse_of: null
    note: 过账不改业务状态
  - from: 已结清
    to: 已结清
    command: 提交过账候选
    guard: *id001
    reverse_of: null
    note: 过账不改业务状态
  - from: 已确认
    to: 已确认
    command: 在应付上核销占用
    guard: [INV-79, 付款不超过未付余额]
    reverse_of: null
    note: 占用不减余额
  - from: 已部分结清
    to: 已部分结清
    command: 在应付上核销占用
    guard: [INV-79]
    reverse_of: null
    note: 占用不减余额
  - from: 已确认
    to: 已确认
    command: 释放核销占用
    guard: []
    reverse_of: 在应付上核销占用
    note: 审批驳回、撤回、付款失败或发起失败时补偿
  - from: 已部分结清
    to: 已部分结清
    command: 释放核销占用
    guard: []
    reverse_of: 在应付上核销占用
  - from: 已确认
    to: 已部分结清
    command: 核销应付
    guard: [INV-78a, 余额大于零]
    reverse_of: null
  - from: 已确认
    to: 已结清
    command: 核销应付
    guard: [INV-78a, 余额为零]
    reverse_of: null
  - from: 已部分结清
    to: 已部分结清
    command: 核销应付
    guard: [余额大于零]
    reverse_of: null
  - from: 已部分结清
    to: 已结清
    command: 核销应付
    guard: [余额为零]
    reverse_of: null
  - from: 已结清
    to: 已部分结清
    command: 冲回应付核销
    guard: [退票或部分退回后仍有核销，未结余额大于零]
    reverse_of: 核销应付
    note: S-30 ③：付款已退票后恢复未结余额；代发部分退回时只冲回退回额（PAYROLL_REISSUE_SEAM J-2）
  - from: 已部分结清
    to: 已部分结清
    command: 登记薪酬补发明细
    guard: [来源为月度薪酬结算, 累计补发额不超过累计冲回额]
    reverse_of: null
    note: 薪酬补发不新建应付，在原应付上登记补发明细，由 PRC-75 付清未结余额（one-architecture 2026-10-22 裁定 J-1）；提议命令
  - from: [已部分结清, 已结清]
    to: 已确认
    command: 冲回应付核销
    guard: [冲回后无任何核销]
    reverse_of: 核销应付
  - from: 已部分结清
    to: 已部分结清
    command: 冲回应付核销
    guard: [冲回后仍有其他核销]
    reverse_of: 核销应付
  - from: [已确认, 已部分结清]
    to: 已部分结清
    command: 人工处置核销差异
    guard: [余额大于零]
    reverse_of: null
    note: S-29 SQ-49：人工核销
  - from: [已确认, 已部分结清]
    to: 已结清
    command: 人工处置核销差异
    guard: [余额为零]
    reverse_of: null
    note: S-29 SQ-49：人工核销
  - command: 登记其他应付
    from: null
    guard: [RULE-407 豁免清单, INV-03c]
    reverse_of: null
    to: 已确认
    note: S-31 SQ-29；S-34 ④
  - command: 登记预付款
    from: null
    guard: [RULE-407 豁免清单, INV-03c]
    reverse_of: null
    to: 预付款已登记
    note: S-31 SQ-29；预付款进待付清单的触发待补
  - command: 预付款冲抵应付
    from: 预付款已登记
    guard: [INV-77a, INV-130, 冲抵后预付款余额大于零]
    reverse_of: null
    to: 已部分冲抵
  - command: 预付款冲抵应付
    from: 预付款已登记
    guard: [INV-77a, INV-130, 冲抵后预付款余额为零]
    reverse_of: null
    to: 已冲抵
  - command: 预付款冲抵应付
    from: 已部分冲抵
    guard: [INV-77a, 冲抵后预付款余额大于零]
    reverse_of: 预付款冲抵应付
    to: 已部分冲抵
  - command: 预付款冲抵应付
    from: 已部分冲抵
    guard: [INV-77a, 冲抵后预付款余额为零]
    reverse_of: 预付款冲抵应付
    to: 已冲抵
  - command: 冲销应付利润
    from: 已确认
    guard: [无核销]
    reverse_of: 提交应付利润
    to: 已冲销
    note: S-34 ②：撤销利润分配决议后注销未付应付；提议命令
  - command: 预付款冲抵应付
    from: 已确认
    guard: [INV-77a, 冲抵后应付余额大于零]
    reverse_of: null
    to: 已部分结清
    note: 冲抵同时核销被冲抵的应付（S-31 SQ-29）
  - command: 预付款冲抵应付
    from: 已确认
    guard: [INV-77a, 冲抵后应付余额为零]
    reverse_of: null
    to: 已结清
  - command: 预付款冲抵应付
    from: 已部分结清
    guard: [INV-77a, 冲抵后应付余额大于零]
    reverse_of: null
    to: 已部分结清
  - command: 预付款冲抵应付
    from: 已部分结清
    guard: [INV-77a, 冲抵后应付余额为零]
    reverse_of: null
    to: 已结清
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
  note: 争议状态与处置分类聚合稿无命令，见 NOTES 收敛节；暂估应付是标记不是状态；应付类型含税费（PRC-159 订阅申报已提交确认）
- aggregate: AGG-53
  initial: 已发起
  states:
  - 已发起
  - 审批中
  - 已成功
  - {name: 已失败, terminal: true}
  - {name: 已驳回, terminal: true}
  - {name: 已撤回, terminal: true}
  - 已核销
  - {name: 已退票, terminal: true}
  transitions:
  - from: null
    to: 已发起
    command: 发起付款
    guard: [INV-79, INV-80, INV-03c, INV-04b]
    reverse_of: null
  - from: 已发起
    to: 审批中
    command: null
    guard: []
    reverse_of: null
    on_event: 提交审批
  - from: 审批中
    to: 已成功
    command: 登记银行结果
    guard: [INV-78a, INV-81]
    reverse_of: null
    on_event: 审批已通过
  - from: 审批中
    to: 已失败
    command: 登记付款失败
    guard: []
    reverse_of: null
  - from: 审批中
    to: 已驳回
    command: null
    guard: []
    reverse_of: 发起付款
    on_event: 审批已驳回
    note: 补偿：AGG-52 释放核销占用
  - from: 审批中
    to: 已撤回
    command: null
    guard: []
    reverse_of: 发起付款
    on_event: 审批已撤回
    note: 补偿：AGG-52 释放核销占用
  - from: 已成功
    to: 已核销
    command: 标记付款已核销
    guard: []
    reverse_of: null
    on_event: 应付已核销
  - from: 已成功
    to: 已失败
    command: 登记付款失败
    guard: [银行结果更正为失败（核销前）]
    reverse_of: 登记银行结果
    note: 成功后、核销前银行结果更正为失败；核销后的退票走登记退票
  - from: 已核销
    to: 已核销
    command: 提交过账候选
    guard: []
    reverse_of: null
    note: 过账不改业务状态
  - from: 已核销
    to: 已退票
    command: 登记退票
    guard: [INV-78a]
    reverse_of: 登记银行结果
    note: S-30 ③：事件付款已退票，AGG-52 订阅后冲回应付核销
  - from: 已核销
    to: 已核销
    command: 登记代发退回
    guard: [累计退回额不超过付款金额]
    reverse_of: null
    note: 代发部分退回，付款状态不变、累计退回额增加；发付款已部分退回，AGG-52 只冲回退回额（PAYROLL_REISSUE_SEAM J-2）；提议命令
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045）；退票后原付款置「已退票」，重新发起为新付款
- aggregate: AGG-54
  initial: 已认缴
  states:
  - 已认缴
  - 已部分实缴
  - 已实缴
  - 已部分退回
  - {name: 已退回, terminal: true}
  transitions:
  - from: null
    to: 已认缴
    command: 登记出资认缴
    guard: []
    reverse_of: null
  - from: 已认缴
    to: 已实缴
    command: 登记出资实缴
    guard: [累计实缴等于认缴额（INV-127）]
    reverse_of: null
  - from: 已实缴
    to: 已部分退回
    command: 登记出资退回
    guard: [退回不超过已实缴（INV-128）, 减资或退伙决议依据]
    reverse_of: 登记出资实缴
  - from: 已实缴
    to: 已退回
    command: 登记出资退回
    guard: [退回等于已实缴]
    reverse_of: 登记出资实缴
  - from: 已部分退回
    to: 已部分退回
    command: 登记出资退回
    guard: [退回不超过已实缴]
    reverse_of: 登记出资实缴
  - from: 已部分退回
    to: 已退回
    command: 登记出资退回
    guard: [退回等于已实缴]
    reverse_of: 登记出资实缴
  - from: 已实缴
    to: 已实缴
    command: 提交过账候选
    guard: &id002 []
    reverse_of: null
    note: 过账不改业务状态
  - from: 已部分退回
    to: 已部分退回
    command: 提交过账候选
    guard: *id002
    reverse_of: null
    note: 过账不改业务状态
  - from: 已退回
    to: 已退回
    command: 提交过账候选
    guard: *id002
    reverse_of: null
    note: 过账不改业务状态
  - from: 已认缴
    to: 已部分实缴
    command: 登记出资实缴
    guard: [累计实缴小于认缴额（INV-127）]
    reverse_of: null
  - from: 已部分实缴
    to: 已部分实缴
    command: 登记出资实缴
    guard: [累计实缴仍小于认缴额（INV-127）]
    reverse_of: null
  - from: 已部分实缴
    to: 已实缴
    command: 登记出资实缴
    guard: [累计实缴等于认缴额（INV-127）]
    reverse_of: null
  - from: 已实缴
    to: 已部分实缴
    command: 更正出资登记
    guard: [更正后累计实缴小于认缴额（INV-127）]
    reverse_of: 登记出资实缴
  - from: 已部分实缴
    to: 已认缴
    command: 更正出资登记
    guard: [更正后累计实缴为零]
    reverse_of: 登记出资实缴
  - from: 已部分实缴
    to: 已部分实缴
    command: 更正出资登记
    guard: [更正后累计实缴仍大于零且小于认缴额]
    reverse_of: 登记出资实缴
  - from: 已部分实缴
    to: 已部分退回
    command: 登记出资退回
    guard: [退回不超过已实缴（INV-128）]
    reverse_of: 登记出资实缴
  - from: 已部分实缴
    to: 已退回
    command: 登记出资退回
    guard: [退回等于已实缴]
    reverse_of: 登记出资实缴
  - from: 已部分实缴
    to: 已部分实缴
    command: 提交过账候选
    guard: []
    reverse_of: null
    note: 过账不改业务状态
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变
- aggregate: AGG-109
  initial: 草拟
  states:
  - 草拟
  - 已决议
  - 已部分支付
  - {name: 已支付, terminal: true}
  - {name: 已撤销, terminal: true}
  transitions:
  - from: null
    to: 草拟
    command: 草拟利润分配
    guard: []
    reverse_of: null
  - from: 草拟
    to: 已决议
    command: 决议利润分配
    guard: [INV-117]
    reverse_of: null
  - from: 已决议
    to: 已决议
    command: 提交过账候选
    guard: &id003 []
    reverse_of: null
    note: 过账不改业务状态
  - from: 已部分支付
    to: 已部分支付
    command: 提交过账候选
    guard: *id003
    reverse_of: null
    note: 过账不改业务状态
  - from: 已支付
    to: 已支付
    command: 提交过账候选
    guard: *id003
    reverse_of: null
    note: 过账不改业务状态
  - from: 已决议
    to: 已部分支付
    command: 登记利润分配支付
    guard: [支付额小于决议额]
    reverse_of: null
    note: 由 PRC-163 订阅 AGG-52「应付已结清」后调用（S-34 ③ 单一触发）
  - from: 已决议
    to: 已支付
    command: 登记利润分配支付
    guard: [支付额等于决议额]
    reverse_of: null
    note: 由 PRC-163 订阅 AGG-52「应付已结清」后调用（S-34 ③ 单一触发）
  - from: 已部分支付
    to: 已部分支付
    command: 登记利润分配支付
    guard: [累计支付小于决议额]
    reverse_of: null
    note: 由 PRC-163 订阅 AGG-52「应付已结清」后调用（S-34 ③ 单一触发）
  - from: 已部分支付
    to: 已支付
    command: 登记利润分配支付
    guard: [累计支付等于决议额]
    reverse_of: null
    note: 由 PRC-163 订阅 AGG-52「应付已结清」后调用（S-34 ③ 单一触发）
  - from: [已决议, 已部分支付]
    to: 已撤销
    command: null
    guard: []
    reverse_of: 决议利润分配
    on_event: 后继决议已登记
    note: 决议被后继决议取代时，以新决议撤销原决议、留原决议（S-34 ②）；已支付部分以后继决议承接
  - from: 已决议
    to: 已撤销
    command: 撤销利润分配决议
    guard: [尚无支付]
    reverse_of: 决议利润分配
    note: S-29 SQ-48：股东会或合伙人会议撤销决议；置「已撤销」，决议不是运行单据，不用「已冲销」；已过账的应付股利经冲销过账更正（S-34 ②）
  reversal_note: 已过账行的更正以冲销并重过账在开放期间追加新行表达（ADR-0045），原行状态不变；决议撤销置「已撤销」（S-34 ②）
- aggregate: AGG-55
  initial: 草拟
  states:
  - 草拟
  - 审批中
  - 已生效
  - 履行中
  - 已完成
  - {name: 已结算, terminal: true}
  - {name: 已终止, terminal: true}
  transitions:
  - from: null
    to: 草拟
    command: 起草供方协议
    guard: []
    reverse_of: null
  - from: 草拟
    to: 审批中
    command: null
    guard: []
    reverse_of: null
    on_event: 提交审批
  - from: 审批中
    to: 已生效
    command: 生效供方协议
    guard: [INV-03b, INV-04a, INV-11, INV-12, INV-13, INV-15]
    reverse_of: null
    on_event: 审批已通过
  - from: 审批中
    to: 草拟
    command: null
    guard: []
    reverse_of: 生效供方协议
    on_event: 审批已驳回
    note: 驳回退回起草
  - from: 审批中
    to: 草拟
    command: null
    guard: []
    reverse_of: 生效供方协议
    on_event: 审批已撤回
    note: 撤回退回起草
  - from: 已生效
    to: 履行中
    command: null
    guard: []
    reverse_of: null
    on_event: 供方履约已确认
    note: 首次履约确认触发，本 BC 内策略
  - from: 履行中
    to: 已完成
    command: 完成供方协议
    guard: [累计履约达协议金额或额度用尽]
    reverse_of: null
  - from: [已生效, 履行中]
    to: 已终止
    command: 终止供方协议
    guard: [终止原因必填]
    reverse_of: null
    on_event: 审批已通过
  - from: 已完成
    to: 已结算
    command: 结算供方协议
    guard: [已完成状态, 累计履约与协议金额关系]
    reverse_of: null
    on_event: 审批已通过
  - from: 已完成
    to: 已完成
    command: null
    guard: []
    reverse_of: 结算供方协议
    on_event: 审批已驳回
    note: 结算审批驳回或撤回，状态不变
  - from: 已生效
    to: 已生效
    command: null
    guard: &id004 []
    reverse_of: 终止供方协议
    on_event: 审批已驳回
    note: 终止审批驳回或撤回，状态不变
  - from: 履行中
    to: 履行中
    command: null
    guard: *id004
    reverse_of: 终止供方协议
    on_event: 审批已驳回
    note: 终止审批驳回或撤回，状态不变
