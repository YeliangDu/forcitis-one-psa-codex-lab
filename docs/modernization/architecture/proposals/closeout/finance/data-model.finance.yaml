aggregates:
- aggregate: AGG-40
  bc: B-07
  tables:
  - name: allocation_rule_versions
    role: root
    key: uuid_v7
    references:
    - to: AGG-61
      by: organization_unit_id
      cross_bc: true
    versioned: append_only
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 配置类版本，新系统首版由财务评审后录入，不迁入旧版本；至少录入覆盖 U-10 重算两个期间（投产前最近两个已结期间）的版本；版本行在确认时才写入，草稿另存（不在版本表更新状态），是否生效由生效日推出
    column_families:
    - 版本号与生效日
    - 作者与确认人
    - 决定出处
    notes: 草稿存放位置待 one-data 定
  - name: allocation_rule_pools
    role: child
    key: uuid_v7
    references:
    - to: allocation_rule_versions
      by: allocation_rule_version_id
    versioned: append_only
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 随规则版本
    column_families:
    - 池的职能类别
    - 基数
    - 档位
    - 费率
- aggregate: AGG-41
  bc: B-07
  tables:
  - name: labor_cost_allocation_runs
    role: root
    key: uuid_v7
    versioned: none
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 运行单据：结果由迁入的权责事实承载（U-3），投产前两期按 U-10 重算；口径待 FD-09
    column_families:
    - 法人
    - 业务日期
    - 单据编号
    - 落账期间（会计年度、期间序号）
    - 状态
    - 标准成本费率卡版本引用（AGG-137，同 BC）
    - version
    - 审计列
    notes: 每期间一次有效（部分唯一索引）
  - name: labor_cost_allocation_lines
    role: child
    key: uuid_v7
    references:
    - to: labor_cost_allocation_runs
      by: labor_cost_allocation_run_id
    - to: AGG-77
      by: business_fact_id
      cross_bc: true
    versioned: none
    history_migration: none
    sensitivity: sensitive
    pi: tbd
    reason: 运行单据：结果由迁入的权责事实承载（U-3），投产前两期按 U-10 重算；按人员分配时含个人工时成本，访问级别按 sensitive；逐行是否到人待 FD-09 与 one-data（DM-8），到人则 pi
    column_families:
    - 分配对象(项目)
    - 行类型（工时人工 / 奖金计提 / 已核定奖金调整）
    - 工时与成本引用
    - 加班计价（日期类型、是否已安排补休、倍数、计价工时；行类型为工时人工时填）
    - 奖金计提（规则类型、计提基数、计提率；行类型为奖金计提时填）
    - 奖金核定引用与累计计提额（AGG-76，跨 BC，按 ID；行类型为已核定奖金调整时填）
    - 金额
    notes: 奖金计提与调整行按项目，不到人；调整行单列，供分析计提率（BONUS_OVERTIME_COSTING 1.1 第 3 条）
  - name: labor_cost_allocation_variances
    role: child
    key: uuid_v7
    references:
    - to: labor_cost_allocation_runs
      by: labor_cost_allocation_run_id
    versioned: none
    history_migration: none
    sensitivity: sensitive
    pi: pi
    reason: 人工成本分配差异行（BONUS_OVERTIME_COSTING 2.4）：按员工记计价合计与当月实际薪酬的差额，含个人薪酬金额；结果由权责事实承载，不迁
    column_families:
    - 员工引用
    - 员工所在部门（挂差异的部门）
    - 计价合计
    - 当月实际薪酬（含加班费）
    - 差异金额
    notes: 每运行每员工一行（唯一约束）；差异计期间损益、不进项目；INV-89 守恒：项目分配额 + 差异 = 实际人工成本
- aggregate: AGG-42
  bc: B-07
  tables:
  - name: allocation_results
    role: root
    key: uuid_v7
    references:
    - to: AGG-40
      by: allocation_rule_version_id
    versioned: none
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 运行单据：结果由迁入的权责事实承载（U-3），投产前两期按 U-10 重算
    column_families:
    - 法人
    - 业务日期
    - 单据编号
    - 落账期间（会计年度、期间序号）
    - 状态
    - 分摊规则版本引用
    - 试算或全量
    - version
    - 审计列
  - name: allocation_result_lines
    role: child
    key: uuid_v7
    references:
    - to: allocation_results
      by: allocation_result_id
    - to: AGG-77
      by: business_fact_id
      cross_bc: true
    versioned: none
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 运行单据：结果由迁入的权责事实承载（U-3），投产前两期按 U-10 重算
    column_families:
    - 分摊对象
    - 池
    - 基数
    - 金额
- aggregate: AGG-43
  bc: B-07
  tables:
  - name: cost_transfer_batches
    role: root
    key: uuid_v7
    versioned: none
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 运行单据：结果由迁入的权责事实承载（U-3），投产前两期按 U-10 重算；INV-88 待定 Q20
    column_families:
    - 法人
    - 业务日期
    - 单据编号
    - 落账期间（会计年度、期间序号）
    - 结转类型
    - 状态
    - 幂等键
    - version
    - 审计列
    - 过账结果引用（PostSeq，订阅 BusinessFactAttributed 后写入）
  - name: cost_transfer_batch_lines
    role: child
    key: uuid_v7
    references:
    - to: cost_transfer_batches
      by: cost_transfer_batch_id
    - to: AGG-19
      by: project_id
      cross_bc: true
    - to: AGG-77
      by: business_fact_id
      cross_bc: true
    versioned: none
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 运行单据：结果由迁入的权责事实承载（U-3），投产前两期按 U-10 重算
    column_families:
    - 结转对象(项目、合同)
    - 方向(转入/转出/超期转费用/终止清算)
    - 金额
    - 事实引用
- aggregate: AGG-52
  bc: B-10
  tables:
  - name: payables
    role: root
    key: uuid_v7
    references:
    - to: AGG-01
      by: counterparty_id
      cross_bc: true
    - to: AGG-62
      by: person_id
      cross_bc: true
    versioned: none
    history_migration: full
    sensitivity: internal
    pi: pi
    source: A8 付款与报销表单；老系统分包应付
    reason: 报销与应付薪酬按人员 ID 引用（ADR-0043 第 4 项第 2 条）
    column_families:
    - 法人
    - 业务日期
    - 单据编号
    - 落账期间（会计年度、期间序号）
    - 往来方或人员引用
    - 应付类型
    - 未结余额（投影，可由核销重算）
    - version
    - 审计列
    notes: 争议状态只在 payable_dispute_records；应付类型含分包、采购、报销、其他应付、预付、质保金扣留、应付薪酬、应付利润、税费应付（PRC-159 订阅申报已提交确认），不含员工借款（S-18）
  - name: payable_sources
    role: child
    key: uuid_v7
    references:
    - to: AGG-57
      by: source_id
      cross_bc: true
    - to: AGG-59
      by: source_id
      cross_bc: true
    - to: AGG-73
      by: source_id
      cross_bc: true
    - to: payables
      by: payable_id
    versioned: none
    history_migration: full
    sensitivity: internal
    pi: none
    source: 随应付迁入，与应付同来源
    column_families:
    - 来源单据类型
    - 来源单据引用（不校验）
    - 来源金额
  - name: payable_application_holds
    role: child
    key: uuid_v7
    references:
    - to: payables
      by: payable_id
    - to: AGG-53
      by: cash_payment_id
    versioned: none
    history_migration: open_items
    sensitivity: internal
    pi: none
    reason: 只迁在途占用；已完成付款的占用已转核销，体现在 payable_applications
    column_families:
    - 占用付款引用
    - 占用金额
    - 状态（占用 / 释放 / 已转核销）
    - 幂等键
    - version
  - name: payable_applications
    role: child
    key: uuid_v7
    references:
    - to: payables
      by: payable_id
    - to: AGG-53
      by: cash_payment_id
    versioned: append_only
    history_migration: full
    sensitivity: internal
    pi: none
    source: A8 付款与报销表单；老系统分包付款
    column_families:
    - 核销金额
    - 付款引用
    - 核销日期
    - 落账期间（会计年度、期间序号）
    - 冲销关联
    - 冲回原因（付款已退票）
  - name: payable_dispute_records
    role: child
    key: uuid_v7
    references:
    - to: payables
      by: payable_id
    versioned: append_only
    history_migration: full
    sensitivity: internal
    pi: none
    source: 老系统分包应付的争议记录（若有）；无则不迁
    column_families:
    - 争议状态
    - 处置分类（取值待用户定，只确认「诉讼」）
    - 诉讼文书附件引用
    - 作者与时刻
- aggregate: AGG-53
  bc: B-10
  tables:
  - name: cash_payments
    role: root
    key: uuid_v7
    references:
    - to: AGG-87
      by: fund_account_id
      cross_bc: true
    - to: AGG-01
      by: counterparty_bank_account_id
      cross_bc: true
    versioned: none
    history_migration: full
    sensitivity: sensitive
    pi: pi
    source: A8 付款表单；老系统分包付款
    reason: 含员工付款与个人收款账户引用（账号本体在往来单位，不在本表）；个人对象按 pi 标记
    column_families:
    - 法人
    - 业务日期
    - 单据编号
    - 落账期间（会计年度、期间序号）
    - 状态(含已退票)
    - 收款账户引用
    - 审批引用
    - 执行人
    - 幂等键
    - 银行回单引用
    - version
    - 审计列
    - 退票回单引用
    notes: U-3、U-4 全部历史明细迁入，经 ADR-0036 迁入用例
  - name: cash_payment_allocations
    role: child
    key: uuid_v7
    references:
    - to: cash_payments
      by: cash_payment_id
    - to: AGG-52
      by: payable_id
    versioned: none
    history_migration: full
    sensitivity: internal
    pi: none
    source: A8 付款表单；老系统分包付款
    column_families:
    - 分配金额
    - 应付引用
    - 核销占用引用
  - name: cash_payment_bank_matches
    role: link
    key: uuid_v7
    references:
    - to: cash_payments
      by: cash_payment_id
    - to: AGG-88
      by: bank_statement_line_id
      cross_bc: true
    versioned: append_only
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 匹配对象银行流水不迁入（来源在银行与 U8C，见 AGG-88）；历史付款的银行结果以付款单上的银行回单引用承载
    column_families:
    - 银行流水引用
    - 匹配金额
    - 匹配时刻
    - 匹配人
    notes: 匹配记在付款侧，流水行不记匹配
- aggregate: AGG-54
  bc: B-10
  tables:
  - name: partner_contributions
