- aggregate: AGG-58
  bc: B-11
  tables:
  - name: supplier_agreement_quotas
    role: root
    key: uuid_v7
    references:
    - to: AGG-55
      by: supplier_agreement_id
    versioned: none
    history_migration: none
    sensitivity: internal
    pi: none
    reason: 派生投影，由迁入的协议与履约确认经迁入用例同步写（§14.2 M7）
    column_families:
    - 协议金额
