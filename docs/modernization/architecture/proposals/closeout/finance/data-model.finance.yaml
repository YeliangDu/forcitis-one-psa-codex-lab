    sensitivity: sensitive
    pi: pi
    reason: 同根表
    column_families:
    - 类型(认缴/实缴/退回/实缴更正)
    - 金额
    - 业务日期
    - 落账期间（会计年度、期间序号）
    - 幂等键
    - 分期序号
    - 更正关联（冲销原实缴行）
