      by: profit_distribution_id
    - to: AGG-52
      by: payable_id
    versioned: append_only
    history_migration: none
    sensitivity: sensitive
    pi: pi
    reason: 同根表；股东个人
    column_families:
    - 支付金额
    - 业务日期
    - 应付引用
    - 落账期间（会计年度、期间序号）
