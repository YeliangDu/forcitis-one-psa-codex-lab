    name: "登记并跟进线索，转为商机"
    type: business
    stages: [VS-01.1, VS-01.2]
    stages_note: "判据：结局「已转商机」（线索已确认）造出 VS-01.1 退出；结局「商机跟进中」造出 VS-01.2 进入条件（OBJ-18 跟进中），故保留 VS-01.2。其余近似项是通用状态词撞名，不改"
