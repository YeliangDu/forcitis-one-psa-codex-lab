    name: "举办市场活动"
    type: single_aggregate
    stages: [VS-01.1]
    stages_note: "判据不覆盖、按阶段描述归段：VS-01.1 描述明列「经市场活动、客户活动……形成线索」，本流程是该段的工作内容；其结局（市场活动「进行中」）只是 VS-01.1 的进入状态，不造出退出（线索已确认 / 已关闭），按 #421 进入条件不作归段依据，故以本说明保留 VS-01.1"
    primary_object: "OBJ-16"
    owner_bc: "B-03"
    group: revenue
    status: draft
    human_orchestration: false
    bpmn: ~
  - id: PRC-02
    name: "计划并完成客户活动"
    type: single_aggregate
    stages: [VS-01.1]
    stages_note: "判据不覆盖、按阶段描述归段：VS-01.1 描述明列「经市场活动、客户活动……形成线索」，本流程是该段的工作内容；其结局（客户活动「计划」）只是 VS-01.1 的进入状态，不造出退出（线索已确认 / 已关闭），按 #421 进入条件不作归段依据，故以本说明保留 VS-01.1。字面误判另记：「已完成」被匹到 VS-02.0 的 WBS 阶段节点，是不同对象"
    primary_object: "OBJ-105"
    owner_bc: "B-03"
    group: revenue
    status: draft
    human_orchestration: false
    bpmn: ~
