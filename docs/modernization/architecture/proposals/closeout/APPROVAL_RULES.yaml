# 审批加审规则表（配置数据草案；三组铺开统一引用）
# 依据：用户原则「正常情况上单人审批，异常情况加一个审批节点，特殊情况两个加审节点」（intent 2026-10-16-163556，one-coordinator 分支）。
# 口径：正常＝提交人之外一人审批；付款制单 / 复核 / 出纳分离等不相容职务另计，不算审批节点。
# 异常（abnormal）加一级，特殊（special）加两级；同一单据命中多条规则时取最高级，最多加两级。
# 判定只用客观条件（可由系统计算），事后抽查与预警补偿。投产时作为版本化配置（），阈值与级别由用户在确认页定。
# 基础审批人：费用或业务归属对象的责任人（用户「看谁对费用负责，谁负责谁批」）——项目→项目经理，部门→部门负责人，其他成本对象→其登记的责任人；
#   按归属对象解析，不按单据类型或提交人部门硬编码。非费用类单据（如开票、合同）取其归属项目或部门的责任人。
# 用户原则「能通过规则和不变量守卫的就不要人来守」（intent，one-coordinator 2026-10-16）：可由系统强制的条件做成业务规则或聚合不变量（拒绝、预警或自动分流），不设人工审批节点，标 `guard: rule` 并交 one-rules 出规则卡；只有需要判断的保留 `guard: approval`。
# 本文件 level / threshold 为草拟，用户确认后改。

base_approver:
  resolve_by: cost_object_owner
rules:
- id: AR-01
  name: 金额超过单据类型的第一阈值
  condition: 单据金额 > 该单据类型阈值一
  level: abnormal
  escalate_to: 财务负责人
  threshold: 待 one-ops 取近一年各类单据金额分布（E-B6）后给建议值再定（intent 2026-10-16-171147 T-1）
  guard: approval
- id: AR-02
  name: 金额超过单据类型的第二阈值
  condition: 单据金额 > 该单据类型阈值二
  level: special
  escalate_to:
  - 财务负责人
  - 总经理
  threshold: 待 one-ops 取近一年各类单据金额分布（E-B6）后给建议值再定（intent 2026-10-16-171147 T-1）
  guard: approval
- id: AR-03
  name: 超出预算
  condition: 占用后预算余额 < 0
  level: none
  escalate_to: 预算负责人
  note: 报销已定「只预警」（F-Q2，intent 162821），故草拟为不加审；是否对其他单据加审由用户确认
  guard: rule
  rule_handling: 只预警，审批人看到超额提示；报销、采购、付款、分包同口径（intent 171147 V-1）
  rule_card: RULE-406
- id: AR-04
  name: 无合同或协议依据
  condition: 开票、付款、采购等单据未引用生效的合同或协议
  level: abnormal
  escalate_to: 财务负责人
  guard: rule
  rule_handling: 收入确认、开票、付款、采购须引用生效合同或协议，否则拒绝；小额零星采购可免，金额随阈值取证定（intent 171147 V-2）；回签前开票按
    RULE-411
  rule_card: RULE-407
- id: AR-05
  name: 业务日期落在已关账期间
  condition: 业务日期所在期间已关账，按 ADR-0045 落开放期间并标原期间
  level: special
  escalate_to:
  - 财务负责人
  - 总经理
  guard: rule
  rule_handling: 按 ADR-0045 自动落开放期间并标原期间，不审批
  rule_card: RULE-408
  review: 跨年按 ADR-0045 U-2 未定，规则暂为拒绝并告警
- id: AR-06
  name: 冲销或红冲已过账事实
  condition: 单据为冲销、红字或更正，引用已过账事实
  level: abnormal
  escalate_to: 财务负责人
  guard: approval
- id: AR-07
  name: 关联方交易
  condition: 往来单位标记为关联方
  level: special
  escalate_to:
  - 财务负责人
  - 总经理
  guard: approval
- id: AR-08
  name: 首次合作的往来单位
  condition: 往来单位此前无已完成的同类单据
  level: abnormal
  escalate_to: 部门负责人
  guard: rule
  rule_handling: 走往来单位准入（供应商、分包须准入，客户不准入，P-3），未准入即拒绝
  rule_card: RULE-409
- id: AR-09
  name: 收款或付款对象与合同相对方不一致
  condition: 付款收款人不是合同登记的相对方或其登记账户
  level: special
  escalate_to:
  - 财务负责人
  - 总经理
  guard: rule
  rule_handling: 收付款对象须为合同相对方的登记账户，否则拒绝；第三方代收代付见 AR-15（intent 171147 V-3）
  rule_card: RULE-410
- id: AR-10
  name: 合同回签前开票
  condition: 协议未生效即开票（P-1，intent 2026-10-16-074053：仅预收或首付款类型且附委托或中标证据可先于回签，其余拒绝；历史
    31 个合同迁入标例外）
  level: abnormal
  escalate_to: 财务负责人
  guard: rule
  rule_handling: 按 P-1（intent 074053）：仅预收或首付款类型且附委托或中标证据可先开，其余拒绝
  rule_card: RULE-411
- id: AR-11
  name: 责任人就是提交人本人
  condition: 解析出的基础审批人＝提交人
  level: delegate
  escalate_to: 责任人的上级（汇报线）
  note: 用户已定：上级代批（审批口径页，intent 2026-10-16-164324）
  guard: approval
- id: AR-12
  name: 责任人缺位
  condition: 归属对象无责任人，或责任人离职、休假超期
  level: delegate
  escalate_to: 归属对象的上级组织负责人
  note: 用户已定：上级组织负责人代批（审批口径页，intent 2026-10-16-164324）
  guard: approval
- id: AR-13
  name: 交付物校审的审核主体：项目重要性 V 级
  condition: 项目重要性级别为 V
  level: none
  reviewer: 质量督查
  guard: approval
  why: 技术质量判断须专业人员
  note: 用户 D-1（intent 171147）定的是各级的审核主体，不是加审层数：N 级项目总监审核、V 级质量督查、S 级副总工程师以上；各一人，不得为提交人，不叠加；不取费用责任人（base_approver 不适用校审）。级别定义：S 最高、V 次高、N 普通（用户确认，经 one-ops 转，intent 已记；A8 枚举值序 N=0、V=1、S=2 一致，界面排序 V、S、N 只是显示顺序）；高低不影响审核主体
- id: AR-14
  name: 交付物校审的审核主体：项目重要性 S 级
  condition: 项目重要性级别为 S
  level: none
  reviewer: 副总工程师及以上
  guard: approval
  why: 技术质量判断须专业人员
  note: 同 AR-13
- id: AR-15
  name: 第三方代收代付
  condition: 收付款对象不是合同相对方，附三方协议或委托书
  level: special
  escalate_to:
  - 财务负责人
  - 总经理
  guard: approval
  why: 须判断代收代付的真实性与合规
  note: 未附三方协议或委托书的按 RULE-410 拒绝（intent 171147 V-3）

- id: AR-16
  name: 无来源单据的高风险用印
  condition: 授权委托书，或公章、法定代表人名章用于无来源审批实例的文件（证明、介绍信等）
  level: abnormal
  escalate_to: 总经理
  guard: approval
  why: 无来源单据时用印的对外效力须由最高负责人判断
  note: 待用户在人员线续答 PB31-01 确认；有来源审批实例的用印经 platform.approval 校验，不人审（S-40、S-41）
