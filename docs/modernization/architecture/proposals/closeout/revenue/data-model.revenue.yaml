# 收入线组表级数据模型片段（one-arch-revenue；格式按 closeout/CONVENTIONS.md 第 3 节）；FIX123 补 pi（M10）；FIX04 低 7（付款条件达成事实、额度变动行、冲销）
- aggregate: AGG-01
  bc: B-01
  tables:
  - name: counterparties
    role: root
    key: uuid_v7
    references:
    - to: AGG-01
      by: merged_into_counterparty_id
    versioned: none
    history_migration: full
    sensitivity: sensitive
    pi: spi
    column_families:
    - 法律主体标识(证件类型与号码)
    - 档案状态(待核实/有效/已合并/已停用)
    - 合并去向引用
    - 审计列
    reason: 根表只放身份与生命周期状态，描述性属性全在 counterparty_versions(D17 第5条)；自然人与境外主体证件号为个人信息，取表内最高级，列级在 data-classification 登记；生命周期状态审计可还原，属 D17 第2条第2类，故不版本化；pi=spi：自然人与境外主体的证件类型与号码属敏感个人信息
  - name: counterparty_versions
    role: version
    key: uuid_v7
    references: []
    versioned: effective_dated
    history_migration: full
    sensitivity: internal
    pi: none
    column_families:
    - 名称
    - 企业规模
    - 税务登记
    - 注册地址与所在地
    - 档案核实信息(核实日、核实人)
    - 生效区间
    - 决定出处
    - 审计列
    reason: 维度型 D6/D17，生效依据 DECLARED(业务声明日，核实日生效)；生产自成体系不接老系统与 A8，无同步观察日；企业规模按生效日取值供 INV-15
  - name: counterparty_parent_links
    role: link
    key: uuid_v7
    references:
    - to: AGG-01
      by: parent_counterparty_id
    versioned: effective_dated
    history_migration: full
    sensitivity: internal
    pi: none
    column_families:
    - 上级单位引用
    - 生效区间
    - 审计列
    reason: 上级单位(集团)自关联，关系型主数据，生效依据 DECLARED
  - name: counterparty_roles
    role: child
    key: uuid_v7
    references: []
    versioned: effective_dated
    history_migration: full
    sensitivity: internal
    pi: none
    column_families:
    - 角色(客户/供应商/分包/合伙人/渠道伙伴/联合体伙伴/海外持牌伙伴)
    - 准入状态(仅需准入角色)
    - 生效区间
    - 审计列
    reason: 角色持有区间 DECLARED；客户角色无准入状态(P-3)，档案核实即可用
  - name: counterparty_role_admission_changes
    role: child
    key: uuid_v7
    references:
    - to: AGG-01
      by: counterparty_role_id
    - to: platform.approval
      by: approval_id
      cross_bc: true
    versioned: append_only
    history_migration: full
    sensitivity: internal
    pi: none
    column_families:
    - 角色引用
    - 原准入状态
    - 新准入状态
    - 原因(停用必填)
    - 变更时间与操作人
    - 审批引用
    reason: 申请→合格→暂停→停用 转换流水，只追加(INV-02)
  - name: counterparty_customer_tier_assessments
    role: child
    key: uuid_v7
    references:
    - to: AGG-01
      by: counterparty_role_id
    versioned: effective_dated
    history_migration: full
    sensitivity: internal
    pi: none
    column_families:
    - 客户分级
    - 评定依据与维度
    - 生效区间
    - 决定出处
    - 审计列
    reason: Q-07 计费系数由业务线 x 客户分级决定，分级须有归属；聚合稿 §2.2 AGG-01 内含未列，暂挂此处，见 NOTES 结构问题
  - name: counterparty_contacts
    role: child
    key: uuid_v7
    references: []
    versioned: effective_dated
    history_migration: full
    sensitivity: sensitive
    pi: pi
    column_families:
    - 联系人姓名
    - 职务
    - 手机与邮箱
    - 联系人角色
    - 生效区间
    - 审计列
    reason: 联系人姓名、手机、邮箱为个人信息；DECLARED；pi=pi：联系人姓名、职务、手机与邮箱
  - name: counterparty_bank_accounts
    role: child
    key: uuid_v7
    references:
    - to: platform.approval
      by: approval_id
      cross_bc: true
    versioned: effective_dated
    history_migration: full
    sensitivity: sensitive
    pi: spi
    column_families:
    - 开户名
    - 开户行
    - 银行账号
    - 用途
    - 生效区间
    - 变更审批引用
    - 审计列
    reason: 银行账号为 SENSITIVE(data-classification 规则：银行类列)；变更事件通知 B-10；DECLARED；历史账号必须保留以便核对已付款；pi=spi：银行账号（含自然人与个体工商户账户）属金融账户，敏感个人信息
