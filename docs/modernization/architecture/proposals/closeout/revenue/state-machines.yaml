- aggregate: AGG-44
  name: 开票与收入额度（占用行与只追加事实）
  note: 技术聚合，一台机承载各子表行的生命周期：额度变动行与视为同意认定行、确认事实行只追加；开票占用、收入确认占用、冲销占用各为一类占用行。状态名带前缀区分行类。
  initial: 额度变动已追加
  states:
  - name: 额度变动已追加
    terminal: true
  - 开票占用已转实
  - name: 开票占用已回冲
    terminal: true
  - 收入占用中
  - name: 收入占用已转实
    terminal: true
  - name: 收入占用已释放
    terminal: true
  - name: 视为同意已认定
    terminal: true
  - name: 收入确认事实已追加
    terminal: true
  - 冲销申请已登记
  - 冲销占用中
  - name: 冲销已转实
    terminal: true
  - name: 冲销已释放
    terminal: true
  transitions:
  - from: null
    to: 额度变动已追加
    command: 更新开票与收入额度
    guard:
    - INV-21
    - INV-22
  - from: null
    to: 开票占用已转实
    command: 开具销项发票并改写 WIP
    guard:
    - INV-21
    - INV-73
    note: AGG-46 同名命令的同事务改写
  - from: 开票占用已转实
    to: 开票占用已回冲
    command: 回冲开票额度
    guard:
    - INV-73
    reverse_of: 开具销项发票并改写 WIP
  - from: null
    to: 视为同意已认定
    command: 认定视为同意成立
    guard:
    - ADR-0049 决定 1、2、5
  - from: null
    to: 收入占用中
    command: 占用收入额度
    guard:
    - INV-23
    - INV-22
    - INV-86
  - from: 收入占用中
    to: 收入占用已转实
    command: 追加收入确认事实并占用转实
    guard:
    - INV-23
    - RULE-222
  - from: null
    to: 收入确认事实已追加
    command: 追加收入确认事实并占用转实
    guard:
    - INV-23
    - RULE-222
    note: 与占用转实同事务追加不可改的确认事实
  - from: 收入占用中
    to: 收入占用已释放
    command: 释放收入额度占用
    guard:
    - 审批驳回、撤回或二次校验失败
    reverse_of: 占用收入额度
  - from: null
    to: 冲销申请已登记
    command: 冲销收入确认
    guard:
    - 冲销额≤原确认事实未冲销余额
    note: 拟命令
  - from: 冲销申请已登记
    to: 冲销占用中
    command: 占用冲销额度
    guard:
    - 在途冲销合计≤未冲销余额
    note: 拟命令
  - from: 冲销占用中
    to: 冲销已转实
    command: 追加冲销行并占用转实
    guard:
    - INV-22
    - RULE-222
    reverse_of: 追加收入确认事实并占用转实
    note: 拟命令
  - from: 冲销占用中
    to: 冲销已释放
    command: 释放收入额度占用
    guard:
    - 审批驳回、撤回或二次校验失败
    reverse_of: 占用冲销额度
  - from: 收入确认事实已追加
    to: 收入确认事实已追加
    command: 提交过账候选
    guard:
    - INV-92
  - from: 冲销已转实
    to: 冲销已转实
    command: 提交过账候选
    guard:
    - INV-92
