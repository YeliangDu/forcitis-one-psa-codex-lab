  - 草案
  - 审批中
  - 已签署
  - 已生效
  - 履行中
  - 已完成
  - name: 已结算
    terminal: true
  - name: 已终止
    terminal: true
  transitions:
  - from: null
    to: 草案
    command: 起草协议
    guard:
    - INV-03a
    - INV-06
  - from: 草案
