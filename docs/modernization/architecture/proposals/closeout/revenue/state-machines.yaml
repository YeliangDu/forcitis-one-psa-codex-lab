    - INV-36
  - from: 已生效
    to: 被取代
    command: 生效费率版本
    note: 同事务：被新生效版本取代（旧版本实例）
- aggregate: AGG-06
  name: 计费系数版本
  note: 版本化：待生效 → 已生效 → 被取代；已生效的版本不可改（INV-36a）。批准随费率版本一并走审批平台（建议，见 NOTES）
  initial: 待生效
  states:
  - 待生效
  - 已生效
  - name: 被取代
    terminal: true
  transitions:
  - from: null
    to: 待生效
