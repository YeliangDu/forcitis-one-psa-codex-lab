    command: 登记合同—项目关联与范围挂 WBS
    guard:
    - INV-09
    - INV-08
  - from: 草案
    to: 草案
    command: 登记视为同意参数与发包人代表
  - from: 草案
    to: 审批中
    command: 提交合同评审
    note: 拟命令
  - from: 审批中
    to: 审批中
    command: 通过合同评审
    note: 拟命令；记评审通过，回签的前置
  - from: 审批中
    to: 草案
    command: 驳回合同评审
    reverse_of: 提交合同评审
    note: 拟命令；提交人撤回评审同样回草案（平台一侧）
  - from: 审批中
    to: 已生效
    command: 回签
    guard:
    - INV-05
    - INV-06
    - INV-07
    - INV-33
    - 无附生效条件
    note: 签署即生效，同一事务记生效依据（条件类型「签署即生效」、证据单据号为回签合同文件、生效日为回签日），不落「已签署」
  - from: 审批中
    to: 已签署
    command: 回签
    guard:
    - INV-05
    - INV-06
    - INV-07
    - INV-33
    - 附生效条件
  - from: 已签署
    to: 已生效
    command: 确认生效条件满足
    guard:
    - 生效依据三项必填（条件类型、证据单据号、生效日）
    - 证据须已登记（AGG-38）
    note: 拟命令（GL5-01）；唯一由「已签署」转「已生效」的途径，不得手工改状态（ADR-0058）；合同负责人凭证据确认（LEB-08）；停留未约定期限的签署后 30 天提醒、90 天升级部门负责人，不自动终止（LEB-09）
