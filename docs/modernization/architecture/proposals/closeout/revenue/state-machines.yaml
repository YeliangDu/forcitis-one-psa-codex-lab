- aggregate: AGG-20
  name: 项目 WBS
  note: 一台机承载两类节点：阶段节点（阶段·前缀）与工作包（工作包·前缀）。工作包「发布」即进入进行中，INV-42 的「已发布」指进行中及其后各状态；「锁定」是完成后停止记工时，返工经「转入返工」重开（返工工时另由 INV-53 在工时侧读返工认定，WBS 不引用返工认定）；未发布的可删或作废，已发布的只作废、原因必填（INV-42、S-33）
  initial: 阶段未开始
  states:
  - 阶段未开始
  - 阶段进行中
  - name: 阶段已完成
    terminal: true
  - 工作包未发布
  - 工作包进行中
  - 工作包已完成
  - 工作包已锁定
  - 工作包返工中
  - name: 工作包已作废
    terminal: true
  transitions:
  - from: null
    to: 阶段未开始
    command: 建立项目 WBS
    guard:
    - INV-41
  - from: null
    to: 工作包未发布
    command: 建立项目 WBS
    guard:
    - INV-41
  - from: 阶段未开始
    to: 阶段进行中
    command: 开始阶段
    guard:
    - INV-41
  - from: 阶段进行中
    to: 阶段已完成
    command: 完成阶段
    guard:
    - INV-41
  - from: 工作包未发布
    to: 工作包进行中
    command: 发布工作包
    guard:
    - INV-41
    note: 拟命令；发布后可记工时，不再可删（INV-42）
  - from: 工作包进行中
    to: 工作包已完成
    command: 完成工作包
    note: 拟命令；完成后仍可补记工时，至锁定为止
  - from: 工作包已完成
    to: 工作包已锁定
    command: 锁定工作包
    guard:
    - INV-42
    note: 锁定即停止记工时
  - from: 工作包已完成
    to: 工作包返工中
    command: 转入返工
    note: 拟命令；返工原因必填
  - from: 工作包已锁定
    to: 工作包返工中
    command: 转入返工
    note: 拟命令；返工原因必填，重开记工时（返工工时仍须有返工认定，INV-53）
  - from: 工作包返工中
    to: 工作包已完成
    command: 完成工作包
    note: 拟命令
  - from: 工作包未发布
    to: 工作包已作废
    command: 作废工作包
    guard:
    - INV-42
  - from: 工作包进行中
    to: 工作包已作废
    command: 作废工作包
    guard:
    - INV-42
    note: 已发布只作废，原因必填
  - from: 工作包已完成
    to: 工作包已作废
    command: 作废工作包
    guard:
    - INV-42
    note: 已发布只作废，原因必填
  - from: 工作包已锁定
    to: 工作包已作废
    command: 作废工作包
    guard:
    - INV-42
    note: 已发布只作废，原因必填（S-33）
  - from: 工作包返工中
    to: 工作包已作废
    command: 作废工作包
    guard:
    - INV-42
    note: 已发布只作废，原因必填
