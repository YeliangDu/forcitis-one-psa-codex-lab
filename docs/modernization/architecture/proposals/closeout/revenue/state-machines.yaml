- aggregate: AGG-13
  name: 协议
  initial: 草案
  note: 用户 GL5-01（intent 2026-10-22-061733）：已签署与已生效分为两个状态；转已生效只能由业务操作触发——无附生效条件的回签在同一事务内只落「已生效」，附生效条件的须经「确认生效条件满足」，不得手工改状态（ADR-0058）；转已生效时记生效依据（条件类型、证据单据号、生效日）
