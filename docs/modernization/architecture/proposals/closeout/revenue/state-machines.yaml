    note: 退还是缴纳的资金逆向（INV-20 与没收互斥各一次）
  - from: 已缴
    to: 被没收
    command: 没收保证金
    guard:
    - INV-20
  - from: 已开立
    to: 已到期
    command: 登记保函到期或索赔
    guard:
    - 结果=到期
  - from: 已开立
    to: 被索赔
