    guard:
    - 结果=被索赔
  - from: 已缴
    to: 已缴
    command: 提交过账候选
    guard:
    - INV-92
  - from: 已退
    to: 已退
    command: 提交过账候选
    guard:
    - INV-92
  - from: 被没收
    to: 被没收
    command: 提交过账候选
    guard:
    - INV-92
  note: ；只留一个现金创建入口「登记保证金缴纳」（null → 已缴），删去未被骨架使用的拟命令「登记保证金应缴」（接缝复核）；保函另由「登记保函开立」创建
- aggregate: AGG-01
  name: 往来单位
  note: 一台机承载三类实例：档案（待核实、有效、已合并、停用）、需准入的角色（角色·前缀，INV-02；客户角色无准入状态）、银行账户版本（生效、被取代：变更即追加新版本，旧版本被取代，不覆盖）
