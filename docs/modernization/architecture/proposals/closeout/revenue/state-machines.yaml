    event: 项目已开始执行（AGG-19，B-04）
    note: S-33：由事件触发、不设人工命令。选 AGG-19「项目已开始执行」：协议经合同—项目关联（INV-09）关联的任一项目开始执行即进入履行中，按协议幂等。不选「首个交付物建立」：编制交付物在交付侧是内部命令、不发事件。须给既有边 B-05 → B-04 加「事件」方式，事件订阅方由「仅分析」改为 B-05
