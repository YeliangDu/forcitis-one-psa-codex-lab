- aggregate: AGG-39
  name: 工时单
  note: 以已建代码为准（cost.timesheet TimesheetStatus：DRAFT 草稿、SUBMITTED 已提交、RETURNED 已退回、APPROVED 已通过、REJECTED 已驳回；Timesheet.MACHINE）；已退回、草稿可改可再提交；通过后仅追加过账候选
  initial: 草稿
  states:
  - 草稿
  - 已提交
  - 已退回
  - name: 已通过
    terminal: true
  - name: 已驳回
    terminal: true
  transitions:
  - from: null
    to: 草稿
    command: 起草工时单
    guard:
    - INV-64
    note: 拟命令；已建 Timesheet.draft()
  - from: 草稿
    to: 已提交
    command: 提交工时单
    guard:
    - INV-39
    - INV-64
    - INV-65
  - from: 已退回
    to: 已提交
    command: 提交工时单
    guard:
    - INV-39
    - INV-64
    - INV-65
  - from: 已提交
    to: 已通过
    command: 通过工时单
  - from: 已提交
    to: 已驳回
    command: 驳回工时单
    guard:
    - 驳回须写原因
  - from: 已提交
    to: 已退回
    command: 退回工时单
  - from: 已提交
    to: 草稿
    command: 撤回工时单
    reverse_of: 提交工时单
    note: 拟命令；审批期间撤回或取消，回到草稿
  - from: 已通过
    to: 已通过
    command: 提交过账候选
    guard:
    - INV-37
    - INV-67
    note: 不改业务状态，追加过账候选提交事实
  - from: 已通过
    to: 已通过
    command: 认定工时有效性
    guard:
    - INV-53
    - INV-66
    note: 不改状态，写条目分类属性
