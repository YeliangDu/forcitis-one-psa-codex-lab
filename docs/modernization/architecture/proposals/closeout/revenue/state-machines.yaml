  - from: 有效
    to: 有效
    command: 变更银行账户
    note: 档案本身状态不变，账户版本见下两条
  - from: null
    to: 银行账户版本已生效
    command: 变更银行账户
  - from: 银行账户版本已生效
    to: 银行账户版本被取代
    command: 变更银行账户
    note: 同事务：旧版本被新版本取代
  - from: 有效
    to: 已合并
    command: 合并往来单位
    guard:
    - INV-01
  - from: 有效
    to: 已停用
    command: 停用往来单位
  - from: null
    to: 角色申请中
    command: 申请往来单位角色
    guard:
    - INV-02
  - from: 角色申请中
