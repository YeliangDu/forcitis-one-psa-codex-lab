    guard:
    - INV-02
    - 原因必填
- aggregate: AGG-02
  name: 资质证书
  note: 版本化：延续或降级后登记的是新有效期或新等级版本；延续时旧版本被取代，降级时旧版本到已降级；已撤销、已到期不再恢复。核查中、延续中期间证书仍有效（引用方按有效判断）
  initial: 有效
  states:
  - 有效
  - 核查中
  - 延续中
  - name: 已到期
    terminal: true
  - name: 已撤销
    terminal: true
  - name: 已降级
    terminal: true
  - name: 被取代
    terminal: true
  transitions:
  - from: null
    to: 有效
    command: 登记资质证书
  - from: 有效
    to: 核查中
    command: 发起资质核查
  - from: 核查中
    to: 有效
    command: 登记核查结果
    guard:
    - 结果=有效
  - from: 核查中
    to: 已降级
    command: 登记核查结果
    guard:
    - 结果=降级（新等级版本同事务生效）
  - from: null
    to: 有效
    command: 登记核查结果
    guard:
    - 结果=降级：新等级版本生效
    note: 新版本实例
  - from: 核查中
    to: 已撤销
    command: 登记核查结果
    guard:
    - 结果=撤销
  - from: 有效
    to: 延续中
    command: 登记资质延续申请
    note: 拟命令；附发证机关受理回执
  - from: null
    to: 有效
    command: 延续资质
    note: 新有效期版本实例
  - from: 延续中
    to: 被取代
    command: 延续资质
    note: 同事务：旧版本被取代
  - from: 有效
    to: 已到期
    command: 标记资质已到期
    guard:
    - 到期日届满且未延续
  - from: 核查中
    to: 已到期
    command: 标记资质已到期
    guard:
    - 到期日届满且未延续
  - from: 延续中
    to: 已到期
    command: 标记资质已到期
    guard:
    - 到期日届满且未获延续
