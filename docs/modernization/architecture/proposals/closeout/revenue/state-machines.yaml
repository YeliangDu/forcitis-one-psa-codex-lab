- aggregate: AGG-51
  name: 保证金与押金
  initial: 已缴
  states:
  - 已缴
  - name: 已退
    terminal: true
  - name: 被没收
    terminal: true
  - 已开立
  - name: 已到期
    terminal: true
  - name: 被索赔
    terminal: true
