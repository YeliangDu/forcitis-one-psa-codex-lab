    guard:
    - INV-02
  - from: 角色已暂停
    to: 角色合格
    command: 核准往来单位角色合格
    guard:
    - INV-02
  - from: 角色合格
    to: 角色已暂停
    command: 暂停往来单位角色
    guard:
