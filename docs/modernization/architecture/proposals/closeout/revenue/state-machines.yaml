# 状态机·收入链 VS-01–VS-04 全部聚合（提议稿；财务组 AGG-52/53/59 不在内）。前 19 台为 VS-03/VS-04 批（不改），其后为 VS-01/VS-02 批。from: ~ 表示新建；command: null 表示事件触发；note 标「拟命令」者对应 commands.yaml 的 proposed: true。
machines:
- aggregate: AGG-34
  name: 检查计划
  initial: 已登记
  states:
  - 已登记
  - 已生效
  - name: 不再受托
    terminal: true
  transitions:
  - from: null
    to: 已登记
    command: 登记检查计划
  - from: 已登记
    to: 已生效
    command: 生效检查计划
  - from: 已生效
    to: 不再受托
    command: 标记检查计划不再受托
    guard:
    - 拟规则：原因必填
    kind: reverse
    reverse_of: 生效检查计划
    note: 客户不再委托，撤回计划的生效；原因必填（C_DEFAULTS VS03-18）
- aggregate: AGG-35
  name: 检查
  initial: 已计划
  states:
  - 已计划
  - 已安排
  - 现场进行中
  - 记录已提交
  - 已审核
  - name: 已锁定
    terminal: true
  - name: 已取消
    terminal: true
  transitions:
  - from: null
    to: 已计划
    command: 安排检查
  - from: null
    to: 已计划
    command: 复查检查
    guard:
    - 拟规则-VS03-03
    note: 复查是一次新的检查
  - from: 已计划
    to: 已安排
    command: 指派检查人员
    guard:
    - INV-56
  - from: 已安排
    to: 已安排
    command: 指派检查人员
    guard:
    - INV-56
    note: 调整指派
  - from: 已安排
    to: 现场进行中
    command: 开始现场检查
    note: 拟命令
  - from: 已安排
    to: 记录已提交
    command: 提交检查记录
    guard:
    - INV-55
    - 拟规则-VS03-01
  - from: 现场进行中
    to: 记录已提交
    command: 提交检查记录
    guard:
    - INV-55
    - 拟规则-VS03-01
  - from: 记录已提交
    to: 已审核
    command: 审核检查记录
    guard:
    - 提交人≠审核人
  - from: 记录已提交
    to: 现场进行中
    command: 审核检查记录
    guard:
    - 审核不通过，退回补录
    reverse_of: 提交检查记录
  - from: 已审核
    to: 已锁定
    command: 锁定检查
    guard:
    - INV-55
  - from: 已锁定
    to: 已锁定
    command: 关联检查报告
  - from: 已计划
    to: 已取消
    command: 取消检查
    reverse_of: 安排检查
    note: 拟命令
  - from: 已安排
    to: 已取消
    command: 取消检查
    reverse_of: 安排检查
    note: 拟命令
  - from: 现场进行中
    to: 已取消
    command: 取消检查
    reverse_of: 安排检查
    note: 拟命令
- aggregate: AGG-36
  name: 检查表模板版本
  initial: 已生效
  states:
  - 已生效
  - name: 已停用
    terminal: true
  transitions:
  - from: null
    to: 已生效
    command: 发布检查表模板版本
    guard:
    - INV-34b
  - from: 已生效
    to: 已停用
    command: 停用检查表模板版本
    guard:
    - INV-34b
    reverse_of: 发布检查表模板版本
    note: 拟命令
- aggregate: AGG-37
  name: 外部检测
  initial: 已建议
  states:
  - 已建议
  - 已委托
  - 报告已登记
  - name: 报告已采信
    terminal: true
  - name: 报告未采信
    terminal: true
  transitions:
  - from: null
    to: 已建议
    command: 建议外部检测
  - from: 已建议
    to: 已委托
    command: 登记业主委托外部检测
  - from: 已委托
    to: 报告已登记
    command: 登记外部检测报告
    guard:
    - INV-57
  - from: 报告已登记
    to: 报告已采信
    command: 采信外部检测报告
    guard:
    - INV-57
  - from: 报告已登记
    to: 报告未采信
    command: 不采信外部检测报告
    guard:
    - INV-57
- aggregate: AGG-28
  name: 不符合项
  note: 一台机承载两条路径：我方成果（登记→确认→让步接受或返工→关闭，PRC-34）与客户资产（登记→复核→发布→整改→闭合，PRC-44、45）；状态名「已登记」改为「已识别」，与价值流阶段条件同名（阶段对齐）
  initial: 已识别
  states:
  - 已识别
  - 已确认
  - 让步已接受
  - 已复核
  - 已发布
  - 整改中
  - 整改已申报
  - name: 已关闭
    terminal: true
  - name: 已闭合
    terminal: true
  - name: 风险已保留
    terminal: true
  - name: 已停止跟踪
    terminal: true
  transitions:
  - from: null
    to: 已识别
    command: 登记不符合项
    guard:
    - 拟规则-VS03-02
  - from: 已识别
    to: 已确认
    command: 确认不符合项
  - from: 已确认
    to: 让步已接受
    command: 让步接受不符合项
    guard:
    - INV-49
  - from: 已识别
    to: 已关闭
    command: 关闭不符合项
    guard:
    - INV-48
    note: 客户资产复核不成立也走关闭（待用户定 5）
  - from: 已确认
    to: 已关闭
    command: 关闭不符合项
    guard:
    - INV-48
    note: 客户资产复核不成立也走关闭（待用户定 5）
  - from: 让步已接受
    to: 已关闭
    command: 关闭不符合项
    guard:
    - INV-48
    note: 客户资产复核不成立也走关闭（待用户定 5）
  - from: 已识别
    to: 已复核
    command: 复核不符合项
    guard:
    - 登记人≠复核人
  - from: 已识别
    to: 已识别
    command: 记录重大险情已报告
    guard:
    - INV-52
    note: 拟命令
  - from: 已复核
    to: 已复核
    command: 记录重大险情已报告
    guard:
    - INV-52
    note: 拟命令
  - from: 已复核
    to: 已发布
    command: 发布不符合项
    guard:
    - INV-50
    - INV-52
  - from: 已发布
    to: 已发布
    command: 登记不符合项送达
    note: 拟命令
  - from: 已发布
    to: 整改中
    command: 开始整改
  - from: 整改中
    to: 整改已申报
    command: 登记整改申报
  - from: 整改已申报
    to: 已闭合
    command: 闭合不符合项
    guard:
    - INV-50
    - 拟规则-VS03-04
  - from: 整改已申报
    to: 整改中
    command: 退回整改
    guard:
    - 拟规则-VS03-03
    reverse_of: 登记整改申报
  - from: 整改中
    to: 风险已保留
    command: 登记客户接受风险
  - from: 整改已申报
    to: 风险已保留
    command: 登记客户接受风险
  - from: 已发布
    to: 已停止跟踪
    command: 停止跟踪不符合项
    guard:
    - 拟规则：原因必填
  - from: 整改中
    to: 已停止跟踪
    command: 停止跟踪不符合项
    guard:
    - 拟规则：原因必填
  - from: 整改已申报
    to: 已停止跟踪
    command: 停止跟踪不符合项
    guard:
    - 拟规则：原因必填
