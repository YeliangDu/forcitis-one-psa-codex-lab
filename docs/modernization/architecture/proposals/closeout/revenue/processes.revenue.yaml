  owner_bc: B-05
  human_orchestration: true
  notes: 新增流程（one-architecture 分配，C-4「借阅迁入通用审批」，intent 144943）；借阅记录挂在协议归档记录上，是否另立档案借阅聚合见 NOTES 结构问题
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-E5
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-E6
    as: performer
  steps:
  - actor: SH-E2
    command: 申请借阅协议
    aggregate: AGG-13
    gap: 待补命令：聚合稿 AGG-13 无此命令（NOTES 新用语）
    desc: 选已归档协议，写借阅目的、借阅形式（原件 / 复印件）与预计归还日
  - actor: platform
    platform_task: true
    service: platform.approval
    desc: 借阅审批
    approval:
      doc_type: 合同借阅审批
      approver: SH-M1
      multi_level: false
      on_reject: end
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起合同借阅审批
    decision:
    - when: 审批通过
      goto: 3
    - when: otherwise
      goto: end
  - actor: SH-E6
    command: 登记协议借出
    aggregate: AGG-13
    gap: 待补命令：聚合稿 AGG-13 无此命令（NOTES 新用语）
  - actor: SH-E6
    command: 登记协议归还
    aggregate: AGG-13
    gap: 待补命令：聚合稿 AGG-13 无此命令（NOTES 新用语）
    decision:
    - when: 超过预计归还日仍未归还
      goto: 5
    - when: otherwise
      goto: end
  - actor: system
    on_time: 预计归还日届满
    desc: 向借阅人与档案管理人发催还提醒（企业微信待办，经平台通知）
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 发送催还提醒
- id: PRC-141
  name: 销售合同归档
  trigger:
    type: event
    events:
    - aggregate: AGG-13
      event: ContractSigned
    desc: 协议回签后原件移交归档
  stages:
  - VS-04.1
  owner_bc: B-05
  human_orchestration: false
  notes: 新增流程（one-architecture 分配，C-4「归档并入合同模块的档案功能」，intent 144943）；结项封存（PRC-36）只封存交付成果，合同原件归档在此
  roles:
  - id: SH-E2
    as: performer
  - id: SH-E6
    as: performer
  steps:
  - actor: SH-E2
    desc: 项目经理或商务把回签原件移交档案管理人
    read: true
    reads:
    - AGG-13
  - actor: SH-E6
    command: 归档协议
    aggregate: AGG-13
    gap: 待补命令：聚合稿 AGG-13 无此命令（NOTES 新用语）
    desc: 登记原件类型、份数、存放位置、归档日期；电子扫描件作文件引用
    decision:
    - when: 原件份数或签章不全
      goto: 3
    - when: otherwise
      goto: end
  - actor: SH-E6
    desc: 退回补齐：通知项目经理补签或补交原件，补齐后重回第 2 步
    read: true
    reads:
    - AGG-13
