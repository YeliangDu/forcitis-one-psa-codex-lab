    name: 付款条件项已可结算
    publisher: B-05
  - type: human
    name: 预收款、首付款等先于回签的开票由商务或项目经理发起（INV-71 例外）
  outcomes:
  - 已开具
  - 已驳回
  - 已作废
  - 因期间已关账未开具
  scenarios:
  - PRC-57-S01
  - PRC-57-S02
  - PRC-57-S03
  - PRC-57-S04
  - PRC-57-S05
  - PRC-57-S06
  - PRC-57-S07
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-E2
    as: initiator
  - id: SH-E6
    as: approver
  - id: SH-E6
    as: performer
  - id: SH-R2
    as: external
  steps:
  - actor: system
    where: automatic
    actor_v1: 商务
    read: true
    reads:
    - AGG-13
    - AGG-38
    desc: 读协议付款条件项与预收证据
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: 付款条件项已可结算
    - mode: api
      direction: out
      bc: B-05
      name: 读付款条件项
    - mode: api
      direction: out
      bc: B-28
      name: 读预收证据
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 提交开票申请
    aggregate: AGG-45
    permission: 开票申请.提交
    page: 开票申请编辑页
    audit: true
  - actor: platform
    where: in_system
    actor_v1: 财务主管
    platform_task: true
    service: platform.approval
    command: 开票申请审批
    gap: G-02（已处理 F-2）
    approval:
      engine: platform.approval
      doc_type: 开票申请审批
      approver: SH-E6
      multi_level: false
      on_reject: 5
    decision:
    - when: 审批通过
      goto: 4
    - when: otherwise
      goto: 5
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起开票申请审批
    permission: 开票申请.审批
    page: 审批待办页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（待开票申请审批）
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 开票申请准入
    aggregate: AGG-45
    emits:
    - InvoiceEligibilityConfirmed
    desc: 协议须已生效，预收例外附委托函或中标通知书（INV-71）
    decision:
    - when: 协议未生效且无预收例外依据
      goto: 5
      rule: INV-71
    - when: otherwise
      goto: 6
    permission: 开票申请.准入
    page: 开票申请审核页
    audit: true
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 驳回开票申请
    aggregate: AGG-45
    branch: 驳回
    emits:
    - 开票申请已驳回
    decision:
    - when: 提交人修正后重新申请
      goto: 2
    - when: otherwise
      goto: end
    permission: 开票申请.驳回
    page: 开票申请审核页
    outcome: 已驳回
    notify:
    - to: SH-E5
      how: 企业微信消息（开票申请已驳回）
  - actor: SH-E6
    where: external:税务
    actor_v1: 财务
    command: 开具销项发票并改写 WIP
    aggregate: AGG-46
    also:
    - AGG-44
    c_exception: INV-73
    on_event:
    - aggregate: AGG-45
      event: InvoiceEligibilityConfirmed
    emits:
    - InvoiceIssued
    evidence:
    - 税务平台开具结果：发票号码、开票时间、电子发票文件
    - 平台应答报文摘要
    desc: 经税务平台开具；同事务改写开票额度；对外财报与增值税按开票，开票不触发收入确认（收入走 PRC-53），收入确认也不触发开票
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账未开具
    - when: 税务平台开具失败
      goto: 7
    - when: otherwise
      goto: 8
    period_gate: true
    legal_entity: 承担法人
    audit: true
    metric_event: true
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 经税务平台开具
    - mode: api
      direction: out
      bc: B-01
      name: 读购买方
    permission: 销项发票.开具
    page: 销项发票开具页
    timeout:
      after: PT30M
      escalate_to: SH-E6
      interrupting: false
    notify:
    - to: SH-E5
      how: 企业微信消息（发票已开具）
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 作废开票申请
    aggregate: AGG-45
    branch: 作废
    emits:
    - 开票申请已作废
    desc: 只发生在开具前（INV-71）
    decision:
    - when: otherwise
      goto: end
    permission: 开票申请.作废
    page: 开票申请审核页
    outcome: 已作废
    audit: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-46
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时由期间闸门路由到开放期间并标原期间（INV-92），不拒绝
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    outcome: 已开具
    rule: INV-92
  notes: 本稿唯一的 C 类（INV-73，ADR-0016 决定 5）；P-07 付款条件到期未开票提醒。开票只改写开票额度与应收（PRC-59），不触发、也不依赖收入确认。
- id: PRC-58
  name: 红冲销项发票
  trigger:
    type: human
    desc: 开票有误或业务取消，财务发起红冲
  stages:
  - VS-04.3
  owner_bc: B-08
  human_orchestration: false
  migration: 历史红字发票及红字信息确认记录全部迁入（U-4）；投产时红字信息确认中的单据按税务平台当前状态迁入，等待期从原发起时间续算
  scope: 按承担法人的数据范围：仅财务经办
  triggers:
  - type: human
    name: 财务发起红冲
  outcomes:
  - 已红冲
  - 红字确认已作废
  - 因期间已关账未红冲
  scenarios:
  - PRC-58-S01
  - PRC-58-S02
  - PRC-58-S03
  - PRC-58-S04
  roles:
  - id: SH-E6
    as: performer
  - id: SH-C6d
    as: external
  - id: SH-R2
    as: external
  steps:
  - actor: SH-E6
    where: external:税务
    actor_v1: 财务
    command: 发起红字信息确认
    aggregate: AGG-46
    evidence:
    - 红字信息表确认单（税务平台状态、购买方确认时间）
    desc: 已用途确认或入账的蓝字发票红冲前须对方确认；未用途确认或入账的无需对方确认（待用户定 7）
    decision:
    - when: 蓝字发票尚未用途确认或入账
      goto: 2
    - when: 购买方在 72 小时内未确认，税务平台自动作废
      goto: end
      outcome: 红字确认已作废
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 发起红字信息确认
    timeout:
      after: PT72H
      escalate_to: SH-E6
      interrupting: false
    permission: 销项发票.发起红字确认
    page: 红字信息确认页
    audit: true
  - actor: SH-E6
    where: external:税务
    actor_v1: 财务
    command: 红冲发票
    aggregate: AGG-46
    emits:
    - 发票已红冲
    evidence:
    - 税务平台红字发票开具结果：红字发票号码、开具时间、电子发票文件
    desc: 蓝字不得作废，更正走红字（INV-72）；红冲只回冲开票额度，不触发也不冲减收入
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账未红冲
    - when: otherwise
      goto: 3
    period_gate: true
    legal_entity: 承担法人
    audit: true
    metric_event: true
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 经税务平台红冲
    - mode: event
      direction: out
      bc: B-09
      name: 发票已红冲
    permission: 销项发票.红冲
    page: 销项发票红冲页
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 回冲开票额度
    aggregate: AGG-44
    gap: G-08
    rule: INV-73
    desc: INV-73 只写开票接受与作废同事务，红冲是否同事务未写；本稿按两次事务写
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-46
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时路由到开放期间并标原期间（INV-92），不拒绝
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    rule: INV-92
    outcome: 已红冲
  notes: 对方确认红字信息的 72 小时自动作废在税务平台一侧，聚合稿无对应命令，按非人工编排。蓝字不得作废，更正走红字（INV-72）；订阅方 B-09，其反应见 G-08。
- id: PRC-60
  name: 认领收款并核销应收
  trigger:
    type: human
    desc: 出纳每日认领到账流水
  stages:
  - VS-04.4
  owner_bc: B-09
  human_orchestration: false
  migration: 历史收款、分配行与核销记录全部迁入（U-4）；投产时待认领的流水按当前状态迁入，已部分核销的应收带已核销额迁入
  scope: 按承担法人与资金账户的数据范围：出纳按所管账户经办
  segregation:
  - roles:
    - SH-E6
    rule: 认领收款与登记银行流水不得为同一人（职务分离，具体岗位待用户定）
  triggers:
  - type: human
    name: 出纳每日认领到账流水
  outcomes:
  - 已核销
  - 待认领
  scenarios:
  - PRC-60-S01
  - PRC-60-S02
  - PRC-60-S03
  - PRC-60-S04
  roles:
  - id: SH-E6
    as: performer
  - id: SH-C6d
    as: external
  steps:
  - actor: system
    where: external:银行
    actor_v1: 出纳
    read: true
    reads:
    - AGG-88
    - AGG-87
    evidence:
    - 银行到账流水（经资金账户模块导入的银行回单行）
    desc: 读流水行与资金账户
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 读资金账户与流水行
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 收款认领
    aggregate: AGG-50
    emits:
    - CashReceived
    decision:
    - when: 流水行无法对应任何应收
      goto: end
      outcome: 待认领
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读付款方
    permission: 收款.认领
    page: 收款认领页
    audit: true
    metric_event: true
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 在应收上核销占用
    aggregate: AGG-49
    emits:
    - 应收已结清
    rule: INV-77
    desc: 核销合计不超过未结余额（INV-77）；结清时发事件
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 待认领
    - when: 到账金额大于该笔应收未结余额，还有其他应收可核销
      goto: 3
    - when: otherwise
      goto: 4
    period_gate: true
    legal_entity: 承担法人
    permission: 应收.核销
    page: 应收核销页
    audit: true
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 记分配行与流水行
    aggregate: AGG-50
    emits:
    - 收款已分配
    rule: INV-78
    desc: 分配合计等于到账金额（INV-78）
    permission: 收款.分配
    page: 收款分配页
    audit: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-50
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    outcome: 已核销
  notes: 额度占用，不新增 C 类；收款作废时释放占用。收款只核销应收，不触发、也不确认收入（收入走 PRC-53）。
- id: PRC-61
  name: 检测应收逾期并催收
  trigger:
    type: time
    desc: 每日定时检测账龄与到期
  stages:
  - VS-04.4
  owner_bc: B-09
  human_orchestration: false
  migration: 历史逾期、争议处置与坏账核销记录全部迁入（U-4）；投产时处于争议中的应收带处置分类迁入，账龄从原到期日续算
  scope: 按承担法人的数据范围：财务按法人经办，项目经理仅见本项目应收
  triggers:
  - type: time
    name: 每日定时检测应收账龄与到期
  outcomes:
  - 无逾期
  - 已登记处置
  - 坏账已核销
  - 因期间已关账未核销
  scenarios:
  - PRC-61-S01
  - PRC-61-S02
  - PRC-61-S03
  - PRC-61-S04
  - PRC-61-S05
  roles:
  - id: SH-E6
    as: performer
  - id: SH-E2
    as: informed
  - id: SH-C6d
    as: informed
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 检测应收逾期
    aggregate: AGG-49
    emits:
    - ArOverdueDetected
    decision:
    - when: 无逾期应收
      goto: end
      outcome: 无逾期
    - when: otherwise
      goto: 2
    metric_event: true
  - actor: system
    where: automatic
    added_in: closeout
    desc: 向责任项目经理与财务发催收提醒（经平台通知）；催收动作本身由财务线下进行
    cross_bc:
    - mode: api
      direction: out
      bc: platform.integration
      name: 发送催收提醒
    notify:
    - to: SH-E2
      how: 企业微信待办（应收逾期，请协助催收）
    - to: SH-E6
      how: 企业微信待办（应收逾期）
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 登记争议与处置分类
    aggregate: AGG-49
    desc: 取值只确认「诉讼」，其余待用户定
    decision:
    - when: 确认款项无法收回
      goto: 4
    - when: otherwise
      goto: end
      outcome: 已登记处置
    permission: 应收.登记争议处置
    page: 应收争议处置页
    audit: true
    timeout:
      after: P30D
      escalate_to: SH-M1
      interrupting: false
  - actor: SH-E6
    where: in_system
    actor_v1: 财务主管
    command: 核销坏账
    aggregate: AGG-49
    emits:
    - ArWrittenOff
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账未核销
    - when: otherwise
      goto: 5
    period_gate: true
    legal_entity: 承担法人
    permission: 应收.核销坏账
    page: 坏账核销页
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    outcome: 坏账已核销
  notes: P-36 账龄、逾期；「核销」与状态「已核销（坏账）」重名，已交 one-glossary。坏账核销是否走审批见待用户定。
- id: PRC-63
  name: 商业汇票兑付与逾期
  trigger:
    type: time
    desc: 商票到期日
  stages:
  - VS-04.4
  owner_bc: B-09
  human_orchestration: false
  migration: 历史商票的到期日、兑付与逾期状态全部迁入（U-4）；投产时未到期与已逾期未兑付的商票按当前状态迁入，占用与应收状态一并迁入
  scope: 按承担法人与资金账户的数据范围
  triggers:
  - type: time
    name: 商票到期日
  outcomes:
  - 已兑付
  - 商票已逾期
  - 因期间已关账未登记兑付
  scenarios:
  - PRC-63-S01
  - PRC-63-S02
  - PRC-63-S03
  roles:
  - id: SH-E6
    as: performer
  - id: SH-C6d
    as: external
  steps:
  - actor: SH-E6
    where: external:银行
    actor_v1: 出纳
    command: 登记商票兑付
    aggregate: AGG-50
    evidence:
    - 银行到账回单或承兑人兑付通知
    - 兑付日与金额
    desc: 过账时点取收票或兑付、是否算回款待财务口径（AGG-50 待定 a、b、c）
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账未登记兑付
    - when: 到期日已过仍未收到兑付款
      goto: 2
    - when: otherwise
      goto: end
      outcome: 已兑付
    period_gate: true
    legal_entity: 承担法人
    permission: 收款.登记商票兑付
    page: 商票兑付登记页
    audit: true
    timeout:
      after: 商票到期日
      escalate_to: SH-E6
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（商票到期）
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 标记商票已逾期
    aggregate: AGG-50
    branch: 逾期
    emits:
    - 商票已逾期
    metric_event: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 释放占用、恢复应收
    aggregate: AGG-49
    branch: 逾期
    on_event:
    - aggregate: AGG-50
      event: 商票已逾期
    desc: 订阅商票已逾期，同 BC 事件，不跨聚合事务
    outcome: 商票已逾期
  notes: 过账时点、是否算回款待财务口径（AGG-50 待定 a、b、c）。
- id: PRC-66
  name: 判定履约完成，确认最终价款并结算协议
  trigger:
    type: event
    events:
    - event: RevenueRecognized
      aggregate: AGG-44
    desc: 每次确认收入后判定全部履约义务是否已履行
  stages:
  - VS-04.5
  owner_bc: B-08
  human_orchestration: false
  merged_from:
  - PRC-67
  migration: 历史结算书、最终价款与协议已结算状态全部迁入（U-4）；投产时已完成未结算的协议按当前状态迁入，结算书编制中的按草稿迁入
  scope: 按承担法人与项目承担部门的数据范围：商务经办结算，财务只读
  triggers:
  - type: event
    name: RevenueRecognized
    publisher: B-08
  outcomes:
  - 履约未完成
  - 协议已结算
  scenarios:
  - PRC-66-S01
  - PRC-66-S02
  - PRC-66-S03
  - PRC-66-S04
  roles:
  - id: SH-E5
    as: performer
  - id: SH-C6a
    as: external
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-44
    desc: 全部履约义务累计确认等于分摊价格即「已履行」（派生值，R-02）
    decision:
    - when: 全部履约义务累计确认等于分摊价格
      goto: 2
      rule: INV-22
    - when: otherwise
      goto: end
      outcome: 履约未完成
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 完成协议
    aggregate: AGG-13
    emits:
    - 协议已完成
    gap: G-07
    desc: 下游编排调用上游命令，携带 B-08 依据
    cross_bc:
    - mode: api
      direction: out
      bc: B-05
      name: 完成协议
  - actor: SH-E5
    where: in_system
    bc: B-05
    actor_v1: 商务
    on_event:
    - aggregate: AGG-13
      event: 协议已完成
    command: 编制结算书
    aggregate: AGG-13
    gap: G-16
    desc: B-05 内结算流程订阅协议已完成（⑥a 评审 H4）
    permission: 协议结算.编制
    page: 协议结算书编制页
    audit: true
  - actor: SH-E5
    where: offline
    bc: B-05
    actor_v1: 商务
    command: 确认最终价款
    aggregate: AGG-13
    gap: G-16
    evidence:
    - 双方签认的结算书扫描件
    - 签认日与签认人（发包人代表或授权人）
    desc: 双方确认；差额经收入冲减或补充确认（G-16，命令缺）
    decision:
    - when: 双方未能确认最终价款
      goto: 3
    - when: otherwise
      goto: 5
    permission: 协议结算.确认最终价款
    page: 最终价款确认登记页
    audit: true
    timeout:
      after: 合同约定结算确认期；未约定时 P30D
      escalate_to: SH-M1
      interrupting: false
  - actor: SH-E5
    where: in_system
    bc: B-05
    actor_v1: 商务
    command: 结算协议
    aggregate: AGG-13
    emits:
    - 协议已结算
    gap: G-16
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 协议已结算
    permission: 协议结算.结算
    page: 协议结算页
    outcome: 协议已结算
    audit: true
    metric_event: true
  notes: 合并原 PRC-67。编排方取 B-08（B-08 → B-05 边已有），结算部分是 B-05 内的反应。协议「已结算」与价值流阶段「结算」同名异义，已交 one-glossary。协议已结算 → B-08 收入冲减无命令，仍记 G-19、G-16。
- id: PRC-69
  name: 供应商准入与资质核验
  trigger:
    type: human
    desc: 项目经理或职能提出新供方，财务发起准入
  stages:
  - VS-05.1
  owner_bc: B-01
  human_orchestration: false
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-E6
    as: performer
  - id: SH-P2
    as: external
  - id: SH-P1
    as: external
  steps:
  - actor: SH-E2
    command: 申请往来单位角色
    aggregate: AGG-01
    actor_v1: 项目经理
  - actor: SH-E6
    command: 登记资质证书
    aggregate: AGG-02
    decision:
    - when: 资质核验未通过
      goto: end
    - when: otherwise
      goto: 3
    actor_v1: 财务
  - actor: SH-E6
    command: 核准往来单位角色合格
    aggregate: AGG-01
    emits:
    - 角色已合格
    decision:
    - when: 合作期间资质撤销或到期未延续
      goto: 4
    - when: 合作终止或严重失信
      goto: 5
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: in
      bc: B-11
      name: 读取角色准入状态
    - mode: api
      direction: in
      bc: B-10
      name: 读取角色准入状态
    actor_v1: 财务
  - actor: SH-E6
    command: 暂停往来单位角色
    aggregate: AGG-01
    branch: 暂停
    emits:
    - 角色已暂停
    decision:
    - when: 暂停原因消除
      goto: 3
    - when: otherwise
      goto: end
    actor_v1: 财务
  - actor: SH-E6
    command: 停用往来单位角色
    aggregate: AGG-01
    branch: 停用
    emits:
    - 角色已停用
    actor_v1: 财务
  notes: 角色准入命令的参数为角色，只适用于供应商、分包等需准入的角色，客户角色不走准入（intent 120544 P-3）。未合格或已停用的供应商不得签分包、采购协议或付款（INV-04）；资质到期见「年检、核查与延续企业资质」。
- id: PRC-78
  name: 年检、核查与延续企业资质
  trigger:
    type: time
    desc: 资质年检、动态核查通知或到期临近（P-02）
  stages:
  - VS-06.2
  owner_bc: B-01
  human_orchestration: true
  human_note: 核查结论、降级撤销、延续审批
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-R2
    as: external
  steps:
  - actor: SH-E6
    command: 发起资质核查
    aggregate: AGG-02
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读持证法人主体
    actor_v1: 职能人员
  - actor: SH-E6
    command: 登记核查结果
    aggregate: AGG-02
    emits:
    - 资质已撤销
    desc: 结果为有效 / 降级 / 撤销，撤销时发事件
    decision:
    - when: 核查结论为撤销
      goto: end
    - when: 到期临近需延续
      goto: 3
    - when: otherwise
      goto: end
    actor_v1: 职能人员
  - actor: SH-E6
    command: 延续资质
    aggregate: AGG-02
    decision:
    - when: otherwise
      goto: end
    approval:
      doc_type: 资质延续审批单
      approver: SH-M1
      multi_level: false
      on_reject: 4
    actor_v1: 职能人员
  - actor: system
    command: 标记资质已到期
    aggregate: AGG-02
    branch: 未延续
    on_time: 到期日届满
    emits:
    - 资质已到期
    actor_v1: 系统策略
  notes: 持证方含我方法人，位置见聚合稿 §7 第 3 条。
- id: PRC-86
  name: 发放与归还员工借款
  trigger:
    type: human
    desc: 员工事前申请借支，财务发放
  stages:
  - VS-08.1
  owner_bc: B-09
  human_orchestration: false
  migration: 历史借款、发放、归还与冲抵记录全部迁入（U-4）；投产时未结借款按未结余额与借款人迁入，由 PRC-147 在后续报销核定时继续冲抵
  scope: 按员工所属法人的数据范围：财务经办，员工仅见本人借款（个人信息）
  segregation:
  - roles:
    - SH-E6
    rule: 借款发放经办人与付款执行人不得为同一人（付款在 B-10，具体岗位待用户定）
  triggers:
  - type: human
    name: 员工事前申请借支，财务登记并发放
  outcomes:
  - 借款已发放
  - 借款已结清
  - 因期间已关账被拒
  scenarios:
  - PRC-86-S01
  - PRC-86-S02
  - PRC-86-S03
  - PRC-86-S04
  - PRC-86-S05
  roles:
  - id: SH-E6
    as: performer
  steps:
  - actor: system
    where: automatic
    actor_v1: 财务
    read: true
    reads:
    - AGG-62
    desc: 读借款人
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读借款人
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 创建应收
    aggregate: AGG-49
    desc: 员工借款走 OBJ-85「其他应收：员工借款」，INV-76 只限销售应收；借款发放的付款经 B-10 完成
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账被拒
    - when: otherwise
      goto: 3
    period_gate: true
    legal_entity: 员工所属法人
    permission: 员工借款.发放
    page: 员工借款发放页
    audit: true
  - actor: system
    where: external:银行
    actor_v1: 系统
    evidence:
    - 借款付款银行回单（由 B-10 付款登记，回传借款付款已成功）
    desc: 借款付款由 B-10 经银行执行，B-09 订阅结果
    cross_bc:
    - mode: event
      direction: in
      bc: B-10
      name: 借款付款已成功
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    added_in: closeout
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    decision:
    - when: 员工以现金归还
      goto: 5
    - when: 报销手工冲抵（自动冲抵未覆盖的例外）
      goto: 8
    - when: otherwise
      goto: end
      outcome: 借款已发放
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 收款认领
    aggregate: AGG-50
    branch: 归还
    emits:
    - CashReceived
    desc: 员工归还借款，流水行经 B-22 来自银行，同「认领收款并核销应收」
    cross_bc:
    - mode: api
      direction: out
      bc: B-22
      name: 读资金账户与流水行
    permission: 收款.认领
    page: 收款认领页
    audit: true
  - actor: SH-E6
    where: in_system
    actor_v1: 出纳
    command: 在应收上核销占用
    aggregate: AGG-49
    branch: 归还
    emits:
    - 应收已结清
    rule: INV-77
    desc: 核销到未结余额为零即已结清
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账被拒
    - when: otherwise
      goto: 7
    period_gate: true
    legal_entity: 员工所属法人
    permission: 应收.核销
    page: 应收核销页
    audit: true
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 提交过账候选
    aggregate: AGG-50
    calls: PRC-92
    period_gate: true
    added_in: closeout
    desc: 期间已关账时路由到开放期间并标原期间（INV-92）
    rule: INV-92
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    outcome: 借款已结清
    decision:
    - when: otherwise
      goto: end
  - actor: SH-E6
    where: in_system
    actor_v1: 财务
    command: 冲抵员工借款
    aggregate: AGG-49
    branch: 手工冲抵
    emits:
    - 应收已结清
    desc: 费用报销冲抵借款的自动路径已移入 PRC-147（S-24）；本步只留自动冲抵未覆盖时的财务手工冲抵例外，依据报销 ID，是否保留见待用户定
    decision:
    - when: 期间已关账
      goto: end
      rule: ADR-0045
      outcome: 因期间已关账被拒
    - when: otherwise
      goto: 7
    period_gate: true
    legal_entity: 员工所属法人
    permission: 应收.冲抵员工借款
    page: 员工借款冲抵页
    audit: true
  notes: 借款与报销各自结算（Q24）。事前预批无命令也无审批边，故按非人工编排。原自动冲抵步移入事件策略 PRC-147。
- id: PRC-140
  name: 合同借阅
  trigger:
    type: human
    desc: 员工因投标、诉讼、审计或结算需要借阅已归档的合同原件或复印件
  stages:
  - VS-04.1
  - VS-04.5
  owner_bc: B-05
  human_orchestration: true
  migration: 历史借阅登记（借阅人、借出与归还日、经办人）全部迁入（U-4）；投产时未归还的借出按当前状态迁入，预计归还日沿用原值，逾期的立即触发催还
  scope: 按协议承担法人的数据范围：档案管理人经办，借阅人仅见本人借阅
  segregation:
  - roles:
    - SH-E2
    - SH-E6
    rule: 借阅人与登记借出的档案管理人不得为同一人
  triggers:
  - type: human
    name: 员工提交合同借阅申请
  outcomes:
  - 借阅申请被驳回
  - 借出被拒
  - 已归还
  scenarios:
  - PRC-140-S01
  - PRC-140-S02
  - PRC-140-S03
  - PRC-140-S04
  - PRC-140-S05
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-E5
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-E6
    as: performer
  notes: 新增流程（C-4「借阅迁入通用审批」，intent 144943）；按 S-22 删「申请借阅协议」，借阅申请（目的、形式、预计归还日）作 platform.approval 载荷，审批通过后 B-05 订阅结果执行「登记协议借出」；归还逾期的催还见事件策略 PRC-146。
  steps:
  - actor: platform
    where: in_system
    platform_task: true
    service: platform.approval
    desc: 借阅人选已归档协议，在审批载荷中写借阅目的、借阅形式（原件 / 复印件）与预计归还日；审批人为借阅人所在部门负责人（待用户定）
    approval:
      engine: platform.approval
      doc_type: 合同借阅审批
      approver: SH-M1
      multi_level: false
      on_reject: end
    decision:
    - when: 审批通过
      goto: 2
    - when: otherwise
      goto: end
      outcome: 借阅申请被驳回
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起合同借阅审批
    permission: 合同借阅.申请
    page: 合同借阅申请页
    audit: true
    timeout:
      after: P3D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-M1
      how: 企业微信待办（待合同借阅审批）
  - actor: SH-E6
    where: offline
    command: 登记协议借出
    aggregate: AGG-13
    gap: 新用语：聚合稿 AGG-13 已列（S-22），词表待登记
    evidence:
    - 借阅人签收的借出单（借出日、原件或复印件、份数）
    - 合同借阅审批实例编号
    desc: B-05 订阅平台审批结果后由档案管理人登记借出；须引用已通过的审批实例（INV-125）；复印件不受未归还限制
    decision:
    - when: 协议未归档，或同一份原件已有未归还的借出
      goto: end
      rule: INV-125
      outcome: 借出被拒
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 合同借阅审批已通过
    permission: 协议借阅.登记借出
    page: 协议借出登记页
    audit: true
    metric_event: true
    notify:
    - to: SH-E2
      how: 企业微信消息（原件已借出，注意归还日）
  - actor: SH-E6
    where: offline
    command: 登记协议归还
    aggregate: AGG-13
    gap: 新用语：聚合稿 AGG-13 已列（S-22），词表待登记
    evidence:
    - 归还签收单（归还日、接收人、份数）
    rule: INV-126
    decision:
    - when: 超过预计归还日仍未归还
      goto: 4
    - when: otherwise
      goto: end
    timeout:
      after: 预计归还日（取自审批载荷）
      escalate_to: SH-E6
      interrupting: false
    permission: 协议借阅.登记归还
    page: 协议归还登记页
    outcome: 已归还
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    command: 标记协议借阅逾期
    aggregate: AGG-13
    emits:
    - 协议借阅已逾期
    on_time: 预计归还日届满且未归还
    desc: 定时命令，执行方 platform.scheduling（G-04 同类）；事件由 PRC-146 催还；标逾期后继续等待归还
    decision:
    - when: otherwise
      goto: 3
- id: PRC-141
  name: 销售合同归档
  trigger:
    type: event
    events:
    - aggregate: AGG-13
      event: ContractSigned
    desc: 协议回签后原件移交归档
  stages:
  - VS-04.1
  owner_bc: B-05
  human_orchestration: false
  migration: 历史已回签协议的归档记录（原件类型、份数、存放位置、归档日、扫描件引用）全部迁入（U-4）；投产时已回签未归档的协议进入归档待办，原件实物按线下盘点登记
  scope: 按协议承担法人的数据范围：档案管理人经办，项目经理与商务可见本项目归档状态
  triggers:
  - type: event
    name: ContractSigned
    publisher: B-05
  outcomes:
  - 已归档
  scenarios:
  - PRC-141-S01
  - PRC-141-S02
  - PRC-141-S03
  roles:
  - id: SH-E2
    as: performer
  - id: SH-E6
    as: performer
  notes: 新增流程（C-4「归档并入合同模块的档案功能」，intent 144943）；结项封存（PRC-36）只封存交付成果，合同原件归档在此；归档命令与 INV-124 见聚合稿 AGG-13（S-23）。
  steps:
  - actor: SH-E2
    where: offline
    read: true
    reads:
    - AGG-13
    evidence:
    - 原件移交单（移交人、接收人、移交日期）
    desc: 项目经理或商务把回签原件移交档案管理人
    timeout:
      after: P30D
      escalate_to: SH-E6
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（协议已回签，请移交原件）
  - actor: SH-E6
    where: in_system
    command: 归档协议
    aggregate: AGG-13
    gap: 新用语：聚合稿 AGG-13 已列（S-23），词表待登记
    desc: 登记原件类型、份数、存放位置、归档日期；电子扫描件作文件引用（INV-124）
    decision:
    - when: 原件份数或签章不全
      goto: 3
      rule: INV-124
    - when: otherwise
      goto: end
    permission: 协议.归档
    page: 协议归档登记页
    outcome: 已归档
    audit: true
    metric_event: true
  - actor: SH-E6
    where: in_system
    desc: 退回补齐：通知项目经理补签或补交原件，补齐后重回第 1 步
    decision:
    - when: otherwise
      goto: 1
    notify:
    - to: SH-E2
      how: 企业微信待办（归档退回，请补签或补交原件）
    permission: 协议.退回归档
    page: 协议归档登记页
    timeout:
      after: P10D
      escalate_to: SH-M1
      interrupting: false
event_policies:
- id: PRC-51
  name: 建立并更新开票与收入额度
  trigger:
    type: event
    events:
    - event: ContractSigned
      aggregate: AGG-13
    - event: 新基线已生效
      aggregate: AGG-13
  stages:
  - VS-04.1
  - VS-04.3
  owner_bc: B-08
  migration: 迁入协议的额度行由迁入事实重放建立：累计开票额与累计确认额取自迁入的发票与确认事实（U-4），不重复发事件；投产前已回签的协议在迁入完成时一次性建额度
  triggers:
  - type: event
    name: ContractSigned
    publisher: B-05
  - type: event
    name: 新基线已生效
    publisher: B-05
  step:
    actor: system
    where: automatic
    command: 更新开票与收入额度
    aggregate: AGG-44
    emits:
    - 可开票额度已更新
    desc: 读付款条件项与履约义务建立或调整额度；按协议 ID 与基线版本幂等，重复事件不重复建额度；读不到协议或承担法人则失败并告警
    cross_bc:
    - mode: event
      direction: in
      bc: B-05
      name: ContractSigned
    - mode: event
      direction: in
      bc: B-05
      name: 新基线已生效
    - mode: api
      direction: out
      bc: B-05
      name: 读付款条件项与履约义务
    - mode: api
      direction: out
      bc: B-13
      name: 读承担法人
    audit: true
  scenarios:
  - PRC-51-S01
  - PRC-51-S02
  - PRC-51-S03
  - PRC-51-S04
  notes: 协议已终止、协议已结算的订阅反应聚合稿未写，见 G-08、G-19。
- id: PRC-53
  name: 确认收入
  pending: Q-04
  trigger:
    type: event
    events:
    - aggregate: AGG-27
      event: 交付物已认可
    - aggregate: AGG-44
      event: 视为同意已成立
  stages:
  - VS-04.2
  owner_bc: B-08
  reads:
  - AGG-13
  - AGG-92
  - AGG-38
  migration: 迁入的历史确认直接写确认事实（来源「历史迁入」），不经占用与审批（ADR-0036 M7）；投产时已发起未结束的收入确认审批在审批平台重新发起，占用行按当前状态迁入
  triggers:
  - type: event
    name: 交付物已认可
    publisher: B-28
  - type: event
    name: 视为同意已成立（PRC-54 认定，同 BC）
    publisher: B-08
  step:
    actor: system
    where: automatic
    command: 占用收入额度
    aggregate: AGG-44
    gap: 新用语：「占用收入额度」随 Q-04（Q04_STORAGE），聚合稿 AGG-44 待订正
    desc: Q-04 C 的第一步：校验证据类型已开放（INV-23）、须附证据齐全、发包人代表或通知联系人匹配并派生认可日；在履约义务额度上占用（INV-22、86）；发起收入确认审批（财务复核，ADR-0047 U-2 (a)）；审批结果由 PRC-148 接续。只由客户确认（认可、视为同意）触发，不由开票、进度估计触发；证据类型未开放、证据不全或额度不足则失败并告警，不静默跳过
    approval:
      engine: platform.approval
      doc_type: 收入确认审批
      approver: SH-E6
      multi_level: false
      on_reject: PRC-148（驳回分支释放占用）
    rule: INV-23
    period_gate: false
    cross_bc:
    - mode: event
      direction: in
      bc: B-28
      name: 交付物已认可
    - mode: api
      direction: out
      bc: B-05
      name: 读付款条件项与履约义务
    - mode: api
      direction: out
      bc: B-28
      name: 读证据
    - mode: api
      direction: out
      bc: B-13
      name: 读承担法人
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起收入确认审批
    timeout:
      after: P5D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（待收入确认审批）
    audit: true
