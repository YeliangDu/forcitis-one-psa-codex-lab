    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 归档项目
  notes: 合并原 PRC-39、PRC-40（⑥a 评审 H2 c）。D-9 用户已定 a：无聚合的流程模块 B-29（模块标识 delivery.closeout，intent 114200 F-5），位于 B-04、B-05、B-06、B-08、B-11、B-28 下游；收入覆盖结论载体随 Q20。
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-E6
    as: informed
