      name: 收入确认审批
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  notes: 补「无异议已声明」触发（⑥a 评审 H3、H4）。期间落已关账月时由期间闸门路由到开放期间并标原期间（INV-92）。里程碑认可 MilestoneAccepted 随 Q21，B-08 → B-04 边未登记，不加边，记入 G-19。 触发改为 PRC-54 认定视为同意成立后（one-architecture 裁定 S-11，ADR-0049 先认定后确认）；选 Q-04 C 后须占用加审批，升为人工编排待定。
