    metric_event: true
    audit: true
  notes: 生效后只能经协议变更产生新基线（INV-07、16）；B-08 订阅新基线更新开票与收入额度（PRC-51）。
- id: PRC-49
  name: 提出并认定索赔
  trigger:
    type: human
    desc: 对方或我方出现可索赔事项，在时限内通知
  stages:
  - VS-04.1
  - VS-04.5
  owner_bc: B-05
  human_orchestration: true
  human_note: 已通知 → 已提交 → 已认定 / 已拒绝 / 撤回，索赔时限
  migration: 已提出的索赔及其认定结果、时限与证据全部迁入（U-4）；投产时已提交未答复的索赔按当前状态迁入，时限从原通知日续算
  scope: 按承担法人与项目承担部门的数据范围
  triggers:
  - type: human
    name: 商务发现可索赔事项并提出索赔
  outcomes:
  - 已提交待答复
  - 索赔已认定
  - 索赔已拒绝或撤回
  scenarios:
  - PRC-49-S01
  - PRC-49-S02
  - PRC-49-S03
  - PRC-49-S04
  - PRC-49-S05
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-C6b
    as: external
  steps:
  - actor: system
    where: automatic
    actor_v1: 商务
    read: true
    reads:
    - AGG-30
    - AGG-31
    desc: 读所引用的设计变更与延期申请
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 读所引用的设计变更
    - mode: api
      direction: out
      bc: B-04
      name: 读所引用的延期申请
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 提出索赔
    aggregate: AGG-16
    emits:
    - ClaimAsserted
    desc: 超时限须注明理由（INV-17）；对方答复后由商务据书面答复登记结果
    decision:
    - when: 对方认定索赔
      goto: 3
    - when: 对方拒绝，或我方撤回
      goto: 4
    - when: otherwise
      goto: end
      outcome: 已提交待答复
    timeout:
      after: 合同约定索赔时限（INV-17）；未约定时 P28D 自事项发生日起
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E5
      how: 企业微信待办（P-08 索赔时限临近）
    permission: 索赔.提出
    page: 索赔提出页
    audit: true
    metric_event: true
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 认定索赔
    aggregate: AGG-16
    emits:
    - ClaimSettled
    evidence:
    - 对方书面认定函或签认单扫描件
    - 认定日与认定金额、工期
    decision:
    - when: otherwise
      goto: end
    permission: 索赔.认定
    page: 索赔认定登记页
    outcome: 索赔已认定
    audit: true
    metric_event: true
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 拒绝或撤回索赔
    aggregate: AGG-16
    branch: 拒绝或撤回
    evidence:
    - 对方书面拒绝函或我方撤回函
    - 拒绝或撤回日
    decision:
    - when: otherwise
      goto: end
    permission: 索赔.拒绝或撤回
    page: 索赔拒绝撤回登记页
    outcome: 索赔已拒绝或撤回
    audit: true
  notes: P-08 索赔时限临近提醒。是否补「索赔提交审批」见 NOTES 待用户定（原 D9，仍待定）。
- id: PRC-50
  name: 占用框架限额并提交任务订单
  trigger:
    type: human
    desc: 商务按框架协议起草任务订单
  stages:
  - VS-04.1
  owner_bc: B-05
  human_orchestration: true
  human_note: 占用被拒则订单不得提交；驳回、作废、终止释放
  migration: 框架协议的限额与占用行、已提交订单全部迁入（U-4）；投产时占用中而订单未提交的占用按当前状态迁入，由定时释放兜底
  scope: 按承担法人与项目承担部门的数据范围
  triggers:
  - type: human
    name: 商务按框架协议起草任务订单
  outcomes:
  - 占用被拒
  - 订单已提交并通过审批
  - 限额已释放
  scenarios:
  - PRC-50-S01
  - PRC-50-S02
  - PRC-50-S03
  - PRC-50-S04
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-M1
    as: approver
  steps:
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 占用框架限额
    aggregate: AGG-14
    emits:
    - 限额已占用
    - 框架限额占用被拒
    rule: INV-10
    decision:
    - when: 占用被拒
      goto: end
    - when: otherwise
      goto: 2
    permission: 框架限额.占用
    page: 任务订单起草页
    outcome: 占用被拒
    audit: true
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 提交任务订单
    aggregate: AGG-13
    desc: 引用占用 ID；审批通过后订单生效
    approval:
      engine: platform.approval
      doc_type: 任务订单审批单
      approver: SH-M1
      multi_level: false
      on_reject: 3
    decision:
    - when: 审批驳回，或订单被作废或终止
      goto: 3
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起任务订单审批
    permission: 任务订单.提交
    page: 任务订单提交页
    outcome: 订单已提交并通过审批
    audit: true
    timeout:
      after: 占用有效期（配置，待用户定）
      escalate_to: SH-E5
      interrupting: true
    notify:
    - to: SH-M1
      how: 企业微信待办（待任务订单审批）
  - actor: system
    where: automatic
    actor_v1: 系统策略
    command: 释放框架限额
    aggregate: AGG-14
    branch: 驳回或作废
    emits:
    - 限额已释放
    desc: 孤儿占用靠定时释放兜底（执行方 platform.scheduling，G-04）
    outcome: 限额已释放
  notes: P-04 回签后超额占用预警。INV-10 写「提交审批时占用」，现骨架先占用后提交，审批挂在提交步（沿 S1 结构问题 2，仍待 one-architecture）。
- id: PRC-54
  name: 视为同意期满处理
  trigger:
    type: event
    events:
    - event: 交付物已送达
      aggregate: AGG-27
    desc: 按合同审查期参数与送达日算期满日，到期触发待办
  stages:
  - VS-04.2
  owner_bc: B-08
  human_orchestration: true
  human_note: 期满待办、项目经理人工确认期满、期满前退回则取消
  migration: 历史视为同意认定事实全部迁入（U-4），记迁入来源；投产时已送达未期满的交付物按原送达日续算期满日并生成待办
  scope: 按承担法人与项目承担部门的数据范围
  triggers:
  - type: event
    name: 交付物已送达
    publisher: B-28
  outcomes:
  - 视为同意已成立
  - 视为同意未成立
  - 待办已取消
  scenarios:
  - PRC-54-S01
  - PRC-54-S02
  - PRC-54-S03
  - PRC-54-S04
  roles:
  - id: SH-E2
    as: performer
  - id: SH-E6
    as: informed
  - id: SH-C6a
    as: informed
  steps:
  - actor: system
    where: automatic
    actor_v1: 系统策略
    read: true
    reads:
    - AGG-13
    - AGG-27
    command: 计算期满日并生成待办
    desc: P-21；读合同审查期参数与送达日算期满日；核对期满前无退回
    decision:
    - when: 期满日前已收到客户退回
      goto: end
      rule: ADR-0047 第 5 条第 5 点
      outcome: 待办已取消
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: event
      direction: in
      bc: B-28
      name: 交付物已送达
    - mode: api
      direction: out
      bc: B-05
      name: 读视为同意参数
    - mode: api
      direction: out
      bc: B-28
      name: 读送达与退回
    notify:
    - to: SH-E2
      how: 企业微信待办（视为同意期满待确认）
  - actor: SH-E2
    where: in_system
    actor_v1: 项目经理
    command: 认定视为同意期满
    aggregate: AGG-44
    gap: 新用语：随 Q-04 订正，原「确认视为同意期满」改为只追加认定事实
    on_time: 送达日起合同审查期满
    reads:
    - AGG-27
    emits:
    - 视为同意已成立
    desc: 读 AGG-27 的无异议声明与送达日判定期满，先认定、后确认（ADR-0049 决定 2）；认定事实只追加，触发收入确认 PRC-53；交付物无「视为同意」状态
    decision:
    - when: 期满日前无退回且声明日不早于期满日
      goto: end
      rule: ADR-0049 决定 1、5
      outcome: 视为同意已成立
    - when: otherwise
      goto: end
      outcome: 视为同意未成立
    cross_bc:
    - mode: api
      direction: out
      bc: B-28
      name: 读无异议声明与送达日
    permission: 视为同意.认定期满
    page: 视为同意期满认定页
    audit: true
    metric_event: true
    timeout:
      after: P7D
      escalate_to: SH-E6
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信消息（视为同意已成立，待收入确认审批）
  notes: 视为同意不自动确认收入，须项目经理声明且先认定（ADR-0047 第 5 条、ADR-0049）。认定成立后由 PRC-53 占用收入额度并发起审批（S-11）；原步 3、4（确认收入、提交过账候选）已移入 PRC-53 / PRC-148。「AcceptanceReturned」订阅方 B-08 的反应（期满前退回则取消待办）是读检不是命令，记入 G-19。
- id: PRC-57
  name: 申请并开具销项发票
  trigger:
    type: event
    events:
    - event: 付款条件项已可结算
      aggregate: AGG-13
    desc: 付款条件项转为可结算后项目经理或商务提出开票；预收款等先于回签的开票由人工发起（INV-71 例外）
  stages:
  - VS-04.3
  owner_bc: B-08
  human_orchestration: true
  human_note: 开票申请审批、驳回、撤回；税务平台开具结果
  migration: 历史开票申请与销项发票（含红字）全部迁入（U-4）；投产时审批中的申请在审批平台重新发起，已申请未开具的按当前状态迁入；历史预收例外（31 个合同）标例外
  scope: 按承担法人的数据范围：财务按法人经办，商务与项目经理仅见本项目
  segregation:
