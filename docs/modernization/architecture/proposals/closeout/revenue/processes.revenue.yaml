      goto: 6
  - actor: SH-E2
    actor_v1: 项目经理
    command: 让步接受不符合项
    aggregate: AGG-28
    branch: 让步
    desc: 须客户书面确认（INV-49）
    decision:
    - when: otherwise
      goto: 6
  - actor: SH-E4
    actor_v1: 技术专家
    command: 关闭不符合项
    aggregate: AGG-28
    emits:
