# 收入线组 ⑥b 流程骨架片段（one-arch-revenue；格式按 closeout/CONVENTIONS.md；actor_v1 为 v1 原 actor 文字，合并时由 one-architecture 定去留）
processes:
- id: PRC-03
  name: 登记并跟进线索，转为商机
  trigger:
    type: human
    desc: 客户来询、转介绍或市场活动产生线索
  stages:
  - VS-01.1
  - VS-01.2
  owner_bc: B-03
  human_orchestration: false
  merged_from:
  - PRC-04
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-C6a
    as: external
  - id: SH-P3
    as: external
  steps:
  - actor: SH-E5
    read: true
    reads:
    - AGG-01
    - AGG-08
    desc: 关联往来单位（可无）与市场活动
    decision:
    - when: 客户直接邀标或委托，无需线索
      goto: 6
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读往来单位
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 登记线索
    aggregate: AGG-09
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 认领线索
    aggregate: AGG-09
    decision:
    - when: 需暂缓跟进
      goto: 4
    - when: otherwise
      goto: 6
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 挂起线索
    aggregate: AGG-09
    branch: 挂起
    desc: 线索自身状态转换（跟进中 ⇄ 挂起）
    decision:
    - when: 线索重启跟进
      goto: 5
    - when: 线索无价值
      goto: 8
    - when: otherwise
      goto: end
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 恢复线索
    aggregate: AGG-09
    branch: 挂起
    desc: 挂起可恢复为跟进中（INV-24）
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 新建商机
    aggregate: AGG-10
    desc: 先建商机（回溯检查 RD-01）：来源线索须为「跟进中」（前置读 AGG-09，同 BC），须有正式往来单位与唯一负责人（INV-25、26）；被拒时线索留在「跟进中」，补资料后重试，或按 INV-24 关闭（无价值）
    decision:
    - when: 新建商机被拒且不再跟进
      goto: 8
    - when: 新建商机被拒，补资料后重试
      goto: 6
    - when: otherwise
      goto: 7
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读正式往来单位状态
    - mode: api
      direction: out
      bc: B-13
      name: 读商机负责人
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 确认线索
    aggregate: AGG-09
    emits:
    - 线索已确认
    desc: 商机建成后确认，命令携带商机 ID 并按商机 ID 幂等，确认失败留在「跟进中」重试；已确认的线索不可再关闭（INV-24），故不先确认
    decision:
    - when: 商机负责人或参与团队需调整
      goto: 9
    - when: otherwise
      goto: end
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 关闭线索
    aggregate: AGG-09
    branch: 无价值
    emits:
    - 线索已关闭
    desc: 须填原因（INV-24）；新建商机被拒且不再跟进时走此分支
    decision:
    - when: otherwise
      goto: end
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 变更商机负责人
    aggregate: AGG-10
    branch: 维护
    desc: 只有一个负责人（INV-26）
    decision:
    - when: 参与团队需调整
      goto: 10
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: out
      bc: B-13
      name: 读新负责人
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 维护商机参与团队
    aggregate: AGG-10
    branch: 维护
    actor_v1: 市场和客户经理
  notes: 线索可跳过（客户直接邀标或委托时从新建商机开始）；线索挂起与恢复属线索自身状态转换。「线索已确认」订阅方仅分析，本流程内顺序衔接，不另作事件触发。顺序为新建商机在先、确认线索在后（回溯检查 RD-01，与信息图 OBJ-17 状态机一致：只有商机建成才进入「已确认」）。新建商机只发内部事件，无外部消费者（⑥a 评审 L3，可接受）。
- id: PRC-07
  name: 编制并生效报价
  trigger:
    type: human
    desc: 商机跟进中，客户询价或邀标
  stages:
  - VS-01.2
  owner_bc: B-03
  human_orchestration: true
  human_note: 报价评审（草拟 → 审批中 → 已通过 / 驳回）
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-C6c
    as: external
  steps:
  - actor: SH-E5
    read: true
    reads:
    - AGG-05
    - AGG-06
    - AGG-07
    desc: 读费率、系数与协议价目的生效版本（INV-32）
    cross_bc:
    - mode: api
      direction: out
      bc: B-02
      name: 读费率、系数与协议价目的生效版本
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 编制报价版本
    aggregate: AGG-12
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 提交报价评审
    aggregate: AGG-12
    cross_bc:
    - &id001
      mode: api
      direction: out
      bc: platform.approval
      name: 发起审批
    actor_v1: 市场和客户经理
  - actor: platform
    platform_task: true
    service: platform.approval
    command: 报价评审
    approval:
      doc_type: 报价评审单
      approver: SH-M1
      multi_level: false
      on_reject: 6
    actor_v1: 项目总监
  - actor: system
    command: 通过报价评审
    aggregate: AGG-12
    desc: 审批通过结果回调（已通过 = 评审通过并冻结，INV-31）
    decision:
    - when: otherwise
      goto: 7
    actor_v1: 系统策略
  - actor: system
    command: 驳回报价评审
    aggregate: AGG-12
    branch: 驳回
    desc: 审批驳回结果回调，退回编制
    decision:
    - when: 客户仍要报价
      goto: 2
    - when: otherwise
      goto: 8
    actor_v1: 系统策略
  - actor: SH-E5
    command: 生效报价版本
    aggregate: AGG-12
    emits:
    - 报价版本已生效
    - 报价版本已被取代
    desc: 旧版同事务被取代（INV-30）；生效 = 成为当前版本，须已通过
    decision:
    - when: otherwise
      goto: end
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 作废报价版本
    aggregate: AGG-12
    branch: 作废
    desc: 草拟或驳回的版本作废
    decision:
    - when: otherwise
      goto: end
    actor_v1: 市场和客户经理
  notes: 报价被取代、投标被撤回时在本段内重入。「报价版本已生效」无事件消费者：签约时经投标承诺快照读取（见「起草、评审并回签协议」），可接受（⑥a 评审 L3）。
- id: PRC-08
  name: 参加投标，登记结果并处理保证金
  trigger:
    type: human
    desc: 收到邀标或招标公告
  stages:
  - VS-01.2
  owner_bc: B-03
  human_orchestration: true
  human_note: 截止时间、开标公示等外部等待，可撤回或撤销
  merged_from:
  - PRC-09
  - PRC-11
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-X4
    as: external
  - id: SH-P1c
    as: external
  - id: SH-C6c
    as: external
  steps:
  - actor: SH-E5
    read: true
    reads:
    - REF-01
    - AGG-01
    desc: 读招标项目登记与联合体成员
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读招标项目登记与联合体成员
    actor_v1: 市场和客户经理
  - actor: SH-E5
    read: true
    reads:
    - AGG-18
    desc: 读独立性检查结论（INV-33，D-4 b）：我方为 IDI 风险管理机构且有冲突未获书面同意的，不得递交投标、不得凭委托赢单
    decision:
    - when: 直接委托，无招标
      goto: 12
    - when: otherwise
      goto: 3
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 登记资格预审结果
    aggregate: AGG-11
    decision:
    - when: 资格预审未通过
      goto: 9
    - when: otherwise
      goto: 17
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 递交投标
    aggregate: AGG-11
    emits:
    - 投标已递交
    desc: 携承诺快照
    decision:
    - when: 评标结果为中标
      goto: 6
    - when: 评标结果为未中标
      goto: 7
    - when: 评标阶段被宣布废标
      goto: 8
    - when: 决定撤回或撤销投标
      goto: 5
    - when: otherwise
      goto: end
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 撤回或撤销投标
    aggregate: AGG-11
    branch: 撤回
    emits:
    - 投标已撤销
    decision:
    - when: 撤回发生在截止前
      goto: 16
    - when: otherwise
      goto: 13
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 登记中标
    aggregate: AGG-11
    emits:
    - 投标已中标
    decision:
    - when: otherwise
      goto: 10
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 登记未中标
    aggregate: AGG-11
    branch: 未中标
    emits:
    - 投标未中标
    decision:
    - when: otherwise
      goto: 11
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 登记废标
    aggregate: AGG-11
    branch: 废标
    emits:
    - 投标已废标
    desc: 评标阶段被宣布废标；重新招标的另建投标，不重新招标的客户经理人工登记商机丢单或放弃商机
    decision:
    - when: otherwise
      goto: 15
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 放弃投标
    aggregate: AGG-11
    branch: 放弃
    decision:
    - when: otherwise
      goto: 13
    actor_v1: 市场和客户经理
  - actor: system
    command: 商机赢单
    aggregate: AGG-10
    on_event:
    - aggregate: AGG-11
      event: 投标已中标
    emits:
    - OpportunityAccepted
    desc: 事件策略（⑥a 评审 M5）：中标即赢单；须中标或委托证据（INV-27）
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: out
      bc: B-04
      name: OpportunityAccepted
    - mode: event
      direction: out
      bc: B-05
      name: OpportunityAccepted
    actor_v1: 系统策略
  - actor: system
    command: 登记商机丢单
    aggregate: AGG-10
    on_event:
    - aggregate: AGG-11
      event: 投标未中标
    emits:
    - 商机已丢单
    desc: 事件策略（M5）：未中标即丢单；非投标商机的丢单由客户经理人工登记同一命令
    decision:
    - when: otherwise
      goto: 14
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 商机已丢单
    actor_v1: 系统策略
  - actor: SH-E5
    command: 商机赢单
    aggregate: AGG-10
    branch: 委托赢单
    emits:
    - OpportunityAccepted
    desc: 人工：直接委托凭委托证据（本聚合附件）赢单（INV-27）；我方为 IDI 风险管理机构的，须已读独立性检查结论无冲突或已获书面同意（INV-33，D-4 b）
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: out
      bc: B-04
      name: OpportunityAccepted
    - mode: event
      direction: out
      bc: B-05
      name: OpportunityAccepted
    actor_v1: 市场和客户经理
  - actor: SH-E5
    command: 放弃商机
    aggregate: AGG-10
    branch: 放弃
    emits:
    - 商机已放弃
    cross_bc:
    - mode: event
      direction: out
      bc: B-07
      name: 商机已放弃
    actor_v1: 市场和客户经理
  - actor: system
    bc: B-09
    command: 退还保证金
    aggregate: AGG-51
    on_event:
    - aggregate: AGG-11
      event: 投标未中标
    emits:
    - 保证金已退
    post: true
    calls: PRC-92
    desc: B-09 订阅投标未中标退还保证金（P-10 签约后 5 日未退提醒）；B-09 → B-03 边已有
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: 投标未中标
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    actor_v1: 系统策略
  - actor: system
    bc: B-09
    command: 退还保证金
    aggregate: AGG-51
    branch: 废标
    on_event:
    - aggregate: AGG-11
      event: 投标已废标
    emits:
    - 保证金已退
    post: true
    calls: PRC-92
    desc: B-09 订阅投标已废标退还保证金（回溯检查 RD-07）
    decision:
    - when: 重新招标，另建投标
      goto: PRC-08
    - when: 不重新招标且商机丢失
      goto: 11
    - when: otherwise
      goto: 13
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: 投标已废标
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    actor_v1: 系统策略
  - actor: system
    bc: B-09
    command: 退还保证金
    aggregate: AGG-51
    branch: 截止前撤回
    on_event:
    - aggregate: AGG-11
      event: 投标已撤销
    emits:
    - 保证金已退
    post: true
    calls: PRC-92
    desc: 仅截止前撤回时退还；是否退还按条例第 35 条另行核对，不写死；截止后撤销不适用
    decision:
    - when: 不再跟进该商机
      goto: 13
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: 投标已撤销
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
    actor_v1: 系统策略
  - actor: system
    read: true
    reads:
    - AGG-11
    desc: P-13 投标截止临近提醒
    decision:
    - when: otherwise
      goto: 4
    actor_v1: 系统策略
  notes: 合并原 PRC-09（商机赢单或丢单）、PRC-11（投标未中标后退还保证金）（⑥a 评审 H2 c）；步骤带 bc 的是下游 BC 订阅事件后的反应（编舞），不是 B-03 的命令。联合体协议作投标的次级对象，不放合同。OpportunityAccepted 的订阅方 B-04、B-05、B-07 见「建立项目并组建团队」「起草、评审并回签协议」及事件策略「转入售前投入」。
- id: PRC-13
  name: 批准并生效费率、计费系数与协议价目版本
  trigger:
    type: human
    desc: 财务或经营管理发起新费率、系数或协议价目版本
  stages:
  - VS-01.2
  - VS-02.0
  owner_bc: B-02
  human_orchestration: false
  roles:
  - id: SH-E6
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-E5
    as: performer
  steps:
  - actor: SH-E6
    command: 批准费率版本
    aggregate: AGG-05
    gap: G-02
    decision:
    - when: otherwise
      goto: 2
    approval:
      doc_type: 费率版本批准单
      approver: SH-M1
      multi_level: false
      on_reject: end
    cross_bc:
    - *id001
    - mode: api
      direction: out
      bc: B-13
      name: 读职级
    actor_v1: 财务
  - actor: SH-E6
    command: 生效费率版本
    aggregate: AGG-05
    emits:
    - 费率版本已生效
    - 费率版本已被取代
    decision:
    - when: 同时发布计费系数新版本
      goto: 3
    - when: 同时发布协议价目新版本
      goto: 4
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: in
      bc: B-03
      name: 报价按生效版本读取
    - mode: api
      direction: in
      bc: B-04
      name: 项目预算按生效版本读取
    actor_v1: 财务
  - actor: SH-E6
    command: 生效计费系数版本
    aggregate: AGG-06
    emits:
    - 计费系数版本已生效
    desc: 粒度待定 Q18
    decision:
    - when: 同时发布协议价目新版本
      goto: 4
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: in
      bc: B-03
      name: 报价按生效版本读取
    actor_v1: 财务
  - actor: SH-E5
    command: 生效协议价目版本
    aggregate: AGG-07
    emits:
    - 协议价目版本已生效
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读往来单位
    - mode: api
      direction: in
      bc: B-03
      name: 报价按生效版本读取
    actor_v1: 市场和客户经理
  notes: 批准环节须财务审定，但批准是聚合命令，无退回、超时分支，审批走平台与否待 G-02。报价与项目预算读取这些版本（INV-32、INV-44）。
- id: PRC-16
  name: 申请并转正风险交付授权
  trigger:
    type: human
    desc: 签约前需先行投入，项目经理申请授权
  stages:
  - VS-01.2
  - VS-02.0
  - VS-04.1
  owner_bc: B-05
  human_orchestration: true
  human_note: 申请 → 批准 → 转正或叫停
  roles:
  - id: SH-E2
    as: initiator
  - id: SH-M1
    as: approver
  - id: SH-E5
    as: performer
  steps:
  - actor: SH-E2
    read: true
    reads:
    - AGG-10
    - AGG-19
    - AGG-38
    desc: 读商机、项目与依据证据
    cross_bc:
    - mode: api
      direction: out
      bc: B-03
      name: 读商机
    - mode: api
      direction: out
      bc: B-04
      name: 读项目
    - mode: api
      direction: out
      bc: B-28
      name: 读依据证据
    actor_v1: 项目经理
  - actor: SH-E2
    command: 申请风险交付授权
    aggregate: AGG-17
    cross_bc:
