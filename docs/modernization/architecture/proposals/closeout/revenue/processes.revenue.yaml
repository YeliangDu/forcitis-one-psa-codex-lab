  - from: null
    to: 已生效
    command: 发布检查表模板版本
    by: SH-E4
    emits:
    - 检查表模板版本已生效
    permission: 检查表模板.发布
    page: 检查表模板版本发布页
    rule: INV-34b
  pages:
  - name: 检查表模板版本发布页
    permission: 检查表模板.发布
    desc: 编辑检查项（检查内容、依据标准条文、判定方式、等级映射）后一次发布；发布后不可改，只出新版本
  - name: 检查表模板版本列表页
    permission: 检查表模板.查看
    desc: 按检查类型列出各版本与生效日期，可比较相邻版本差异
  - name: 检查表模板版本详情页
    permission: 检查表模板.查看
    desc: 只读；显示被哪些检查引用
  permissions:
  - 检查表模板.发布
  - 检查表模板.查看
  scenarios:
  - PRC-42-S01
  - PRC-42-S02
  desc: 检查表模板管理员发布新版本
  notes: 被引用版本不可改（INV-34b，D15 版本化）；新版本不影响已安排、已锁定检查所引用的旧版本；发布走聚合内命令，不走 platform.approval（AGG-36 无审批状态，F-2 不适用，是否加技术委员会复核见 NOTES 待用户定）。
  steps:
  - actor: SH-E4
    where: in_system
    actor_v1: 技术专家
    command: 发布检查表模板版本
    aggregate: AGG-36
    emits:
    - 检查表模板版本已生效
    desc: 模板版本一经发布即生效；草拟阶段在页面本地保存，不入库（OBJ-50 的草拟、停用状态聚合稿无命令，见 NOTES）
    cross_bc:
    - mode: api
      direction: out
      bc: B-02
      name: 读服务产品
    permission: 检查表模板.发布
    page: 检查表模板版本发布页
    audit: true
    decision:
    - when: otherwise
      goto: end
    outcome: 已生效
