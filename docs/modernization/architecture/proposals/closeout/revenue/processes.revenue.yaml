    cross_bc:
    - mode: event
      direction: in
      bc: B-28
      name: 交付物已认可
    - mode: api
      direction: out
      bc: B-05
      name: 读付款条件项与履约义务
    - mode: api
      direction: out
      bc: B-28
      name: 读证据
    - mode: api
      direction: out
      bc: B-13
      name: 读承担法人
    - mode: api
      direction: out
