  - PRC-53-S04
  - PRC-53-S05
  notes: 按 S-11 与 Q-04 C 改：原单步「确认收入」拆为本策略（占用并发起审批）与 PRC-148（审批通过后转实并提交过账；驳回释放占用）。里程碑认可 MilestoneAccepted 随 Q21，B-08 → B-04 边未登记，不加边（G-19）。
