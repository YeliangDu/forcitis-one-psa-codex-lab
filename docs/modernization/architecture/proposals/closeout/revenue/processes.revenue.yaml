- id: PRC-147
  name: 费用报销核定后冲抵员工借款并确认应付
  trigger:
    type: event
    events:
    - event: 费用报销已核定
      aggregate: AGG-59
  stages:
  - VS-08.2
  owner_bc: B-09
  migration: 历史冲抵记录随历史应收迁入（U-4），不重复发事件；投产时已核定未付的报销，迁入完成后按本策略补冲抵并确认应付（按报销 ID 幂等）
  triggers:
  - type: event
    name: 费用报销已核定
    publisher: B-12
  steps:
  - actor: system
    where: automatic
    command: 冲抵员工借款
    aggregate: AGG-49
    emits:
    - 应收已结清
    desc: 读报销人未结借款，按报销金额与未结借款取小者冲抵（可为零）；依据报销 ID；净额 = 核定金额 − 冲抵额（S-16、S-17）
    decision:
    - when: 员工无未结借款，冲抵额为零
      goto: 3
    - when: otherwise
      goto: 2
    period_gate: true
    rule: INV-77
    cross_bc:
    - mode: event
      direction: in
      bc: B-12
      name: 费用报销已核定
    - mode: api
      direction: out
      bc: B-13
      name: 读借款人
    audit: true
  - actor: system
    where: automatic
    command: 提交过账候选
    aggregate: AGG-49
    calls: PRC-92
    period_gate: true
    desc: 期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝
    rule: INV-92
    decision:
    - when: 净额为零
      goto: 4
    - when: otherwise
      goto: 3
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  - actor: system
    where: automatic
    command: 确认应付
    aggregate: AGG-52
    emits:
    - 应付已确认
    desc: 按净额确认应付，来源为该费用报销（S-17）；B-10 调用失败则重试并告警，冲抵不回滚，按报销 ID 幂等
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: out
      bc: B-10
      name: 确认应付
    audit: true
  - actor: system
    where: automatic
    branch: 净额为零
    command: 标记费用报销已付
    aggregate: AGG-59
    desc: 结清方式「借款冲抵」（S-19）；使报销不停在「已核定」；调用失败则重试并告警，按报销 ID 幂等
    cross_bc:
    - mode: api
      direction: out
      bc: B-12
      name: 标记费用报销已付
    audit: true
  scenarios:
  - PRC-147-S01
  - PRC-147-S02
  - PRC-147-S03
  - PRC-147-S04
  notes: S-24：原 PRC-87 第 8–10 步独立为本策略。过账跨 BC（B-16），画服务任务，不用调用活动。
- id: PRC-148
  name: 收入确认审批通过后占用转实并提交过账
  pending: Q-04
  trigger:
    type: event
    events:
    - event: 收入确认审批已通过
      aggregate: platform.approval
    - event: 收入确认审批已驳回
      aggregate: platform.approval
  stages:
  - VS-04.2
  owner_bc: B-08
  migration: 历史确认事实不经本策略；投产时处于审批中的占用，审批通过后在新系统按本策略转实，审批驳回释放
  triggers:
  - type: event
    name: 收入确认审批已通过
    publisher: platform.approval
  - type: event
    name: 收入确认审批已驳回
    publisher: platform.approval
  steps:
  - actor: system
    where: automatic
    branch: 审批通过
    command: 追加收入确认事实并占用转实
    aggregate: AGG-44
    emits:
    - RevenueRecognized
    gap: 新用语：「追加收入确认事实」「占用转实」随 Q-04
    desc: 同一事务内：二次校验额度（RULE-222）→ 追加不可改确认事实（金额、认可日与期间、证据引用、审批实例、规则版本）→ 占用转实；业务日期取认可日（视为同意路径取期满日，待用户定）；按审批实例幂等；二次校验失败则不转实并告警，占用保持待处置；确认事实与过账事实不同事务
    decision:
    - when: 二次校验失败（额度不足或证据已失效）
      goto: end
      rule: RULE-222
    - when: otherwise
      goto: 2
    rule: INV-23
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 收入确认审批已通过
    - mode: api
      direction: out
      bc: B-28
      name: 读证据
    - mode: api
      direction: out
      bc: B-13
      name: 读承担法人
    audit: true
    metric_event: true
  - actor: system
    where: automatic
    branch: 审批通过
    command: 提交过账候选
    aggregate: AGG-44
    calls: PRC-92
    period_gate: true
    desc: 经事件发布登记表投递，日对账兜底；期间已关账由期间闸门路由到开放期间并标原期间（INV-92），不拒绝
    rule: INV-92
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: out
      bc: B-16
      name: 提交过账候选
  - actor: system
    where: automatic
    branch: 审批驳回
    command: 释放收入额度占用
    aggregate: AGG-44
    gap: 新用语：「释放收入额度占用」随 Q-04
    desc: 驳回后释放占用，不留确认事实；按审批实例幂等；通知项目经理补证据或另案处理
    cross_bc:
    - mode: event
      direction: in
      bc: platform.approval
      name: 收入确认审批已驳回
    notify:
    - to: SH-E2
      how: 企业微信消息（收入确认审批被驳回）
    audit: true
  scenarios:
  - PRC-148-S01
  - PRC-148-S02
  - PRC-148-S03
  - PRC-148-S04
  notes: 随 Q-04：用户若不选 C，本策略撤销。审批结果回调的表示法见 NOTES 接缝问题 1。
single_aggregate:
- id: PRC-42
  name: 发布检查表模板版本
  type: single_aggregate
  aggregate: AGG-36
  owner_bc: B-26
  stages:
  - VS-03.1
  human_orchestration: false
  trigger:
    type: human
    desc: 检查表模板管理员（技术专家）发布新版本
  triggers:
  - type: human
    name: 检查标准或检查要点变更，技术专家发布新版本
  roles:
  - id: SH-E4
    as: initiator
  - id: SH-E3
    as: informed
  migration: 全部模板版本及其检查项迁入（U-4），每个版本保持原生效日期与版本序号；被历史检查引用的版本不可改、不可删，迁入后仍只追加；老系统模板与新系统版本的对应在迁入对账中核对
  scope: 全公司共用的版本化参考数据，所有检查负责人与检查人员可读；发布限技术专家
