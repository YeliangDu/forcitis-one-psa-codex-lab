    - SH-E5
    - SH-E6
    rule: 起草人与合同评审人不得为同一人
  triggers:
  - type: event
    name: OpportunityAccepted
    publisher: B-03
  - type: human
    name: 直接委托经审批的直建例外，商务起草（INV-06）
  outcomes:
  - 已回签生效
  - 签约被拒
  scenarios:
  - PRC-47-S01
  - PRC-47-S02
  - PRC-47-S03
  - PRC-47-S04
  - PRC-47-S05
  - PRC-47-S06
  roles:
  - id: SH-E5
    as: initiator
  - id: SH-E6
    as: approver
  - id: SH-M1
    as: approver
  - id: SH-C6b
    as: external
  steps:
  - actor: system
    where: automatic
    actor_v1: 商务
    read: true
    reads:
    - AGG-10
    - AGG-11
    - AGG-12
    - AGG-18
    - AGG-19
    - AGG-20
    desc: 读商机、承诺快照、报价版本、独立性检查结论、项目与 WBS 节点
    cross_bc:
    - mode: event
      direction: in
      bc: B-03
      name: OpportunityAccepted
    - mode: api
      direction: out
      bc: B-03
      name: 读商机、承诺快照、报价版本与独立性检查结论
    - mode: api
      direction: out
      bc: B-04
      name: 读项目与WBS节点
    audit: false
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 起草协议
    aggregate: AGG-13
    desc: 复制承诺快照
    cross_bc:
    - mode: api
      direction: out
      bc: B-01
      name: 读往来单位
    - mode: api
      direction: out
      bc: B-13
      name: 读承担法人
    permission: 协议.起草
    page: 协议编辑页
    legal_entity: 承担法人
    audit: true
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 登记合同—项目关联与范围挂 WBS
    aggregate: AGG-13
    emits:
    - 合同—项目关联已登记
    cross_bc:
    - mode: api
      direction: out
      bc: B-04
      name: 校验项目与WBS节点
    - mode: event
      direction: out
      bc: B-07
      name: 合同—项目关联已登记
    permission: 协议.登记项目关联
    page: 协议项目关联页
  - actor: SH-E5
    where: in_system
    actor_v1: 商务
    command: 登记视为同意参数与发包人代表
    aggregate: AGG-13
    desc: ADR-0047 第 5 条第 1 点
    permission: 协议.登记视为同意参数
    page: 视为同意参数页
    audit: true
  - actor: platform
    where: in_system
    actor_v1: 法务
    platform_task: true
    service: platform.approval
    command: 合同评审
    gap: G-02（已处理 F-2）
    approval:
      engine: platform.approval
      doc_type: 合同评审单
      approver: SH-E6
      multi_level: true
      on_reject: 2
    decision:
    - when: 审批通过
      goto: 6
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: api
      direction: out
      bc: platform.approval
      name: 发起合同评审审批
    permission: 合同评审.审批
    page: 审批待办页
    timeout:
      after: P5D
      escalate_to: SH-M1
      interrupting: false
    notify:
    - to: SH-E6
      how: 企业微信待办（待合同评审）
    audit: true
  - actor: SH-E5
    where: offline
    actor_v1: 商务
    command: 回签
    aggregate: AGG-13
    emits:
    - ContractSigned
    evidence:
    - 客户盖章回签合同扫描件
    - 回签日与回签人（须为合同登记的授权人）
    desc: 回签即生效；基线化前比对承诺（INV-05、07）；签约前再读独立性检查结论（INV-33）
    decision:
    - when: 我方为风险管理机构且独立性检查有冲突、无书面同意
      goto: end
      rule: INV-33
      outcome: 签约被拒
    - when: 客户拒绝回签，或依法招标项目与中标承诺实质背离
      goto: 2
      rule: INV-05
    - when: otherwise
      goto: end
    cross_bc:
    - mode: api
      direction: out
      bc: B-03
      name: 签约前再读独立性检查结论
    - mode: event
      direction: out
      bc: B-07
      name: ContractSigned
    - mode: event
      direction: out
      bc: B-08
      name: ContractSigned
    - mode: event
      direction: out
      bc: B-26
      name: ContractSigned
    permission: 协议.回签
    page: 协议回签登记页
    outcome: 已回签生效
    audit: true
    metric_event: true
    legal_entity: 承担法人
    notify:
    - to: SH-E6
      how: 企业微信消息（协议已回签生效，可归档）
  notes: 直建例外须经审批（INV-06）；订阅方 B-07、B-08、B-26。报价版本已生效、独立性检查已有结论无事件消费者，签约时读取，可接受（⑥a 评审 L3）。回签后触发销售合同归档 PRC-141（同事件 ContractSigned）。
