    - 签发时间与签发文件版本哈希（纸质出图章另盖，扫描件作文件版本）
    actor_v1: 注册执业人员
    command: 签发交付物
    aggregate: AGG-27
    emits:
    - 交付物已签发
    decision:
    - when: 签发人执业证书有效且专业、等级符合
      goto: 5
      rule: INV-47
    - when: otherwise
      goto: end
    permission: 交付物.签发
    page: 交付物签发页
    audit: true
    outcome: 未签发
    notify:
    - to: SH-E2
      how: 企业微信消息（已签发，可送达）
  - actor: SH-E2
    where: offline
    evidence:
    - 送达回执：签收单扫描件、快递妥投记录、邮件原始报文（含信头）或平台回执之一
    - 送达日与签收人
    actor_v1: 项目经理
    command: 登记提交轮次送达
    aggregate: AGG-27
    emits:
    - 交付物已送达
    desc: 项目经理按合同通知条款送达，并把送达回执（签收单、快递妥投、邮件进入对方系统、平台回执）作为证据登记，挂本轮提交（ADR-0047 第 5 条第 2 点；R-5 补强交付回执）
    decision:
    - when: 客户书面认可（签收单、审查同意意见、邮件确认、阶段签认等）
      goto: 6
    - when: 客户书面不同意并退回修改
      goto: 7
    - when: 合同约定审查期且期满前未收到书面异议
      goto: 8
      rule: ADR-0047 第 5 条第 1 点
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 交付物已送达
    calls: PRC-33
    permission: 交付物.登记送达
    page: 送达登记页
    audit: true
    metric_event: true
    timeout:
      after: 合同审查期；未约定时 P15D 催签周期
      escalate_to: SH-E2
      interrupting: false
    notify:
    - to: SH-E2
      how: 企业微信待办（审查期满或催签周期到）
  - actor: SH-E2
    where: offline
    evidence:
    - 客户认可材料：签认单、审查同意书面意见、确认邮件原始报文或阶段签认单之一
    - 认可日与签认人（须为合同登记的发包人代表或授权人）
    actor_v1: 项目经理
    command: 登记客户认可
    aggregate: AGG-27
    emits:
    - 交付物已认可
    desc: 登记认可证据类型与认可日，签认人须是合同登记的发包人代表或授权人（ADR-0047 第 2 条共同规则 2）；有阻断性不符合项时拒绝（INV-48）
    decision:
    - when: otherwise
      goto: end
      rule: INV-48
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 交付物已认可
    - mode: event
      direction: out
      bc: B-05
      name: 交付物已认可
    calls: PRC-33
    approval:
      doc_type: 交付物客户认可
      approver: SH-C6a
      engine: external
      multi_level: false
      on_reject: 7
    permission: 交付物.登记认可
    page: 客户认可登记页
    audit: true
    outcome: 已认可
    metric_event: true
  - actor: SH-E2
    where: offline
    evidence:
    - 客户书面退回意见（扫描件或邮件原始报文）
    - 退回日
    actor_v1: 项目经理
    command: 登记客户退回
    aggregate: AGG-27
    branch: 退回
    emits:
    - AcceptanceReturned
    desc: 退回意见作证据登记；轮次加 1，修改后重新报送、审查期从新送达日重算（ADR-0047 第 5 条第 5 点）
    decision:
    - when: otherwise
      goto: 2
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: AcceptanceReturned
    calls: PRC-33
    permission: 交付物.登记退回
    page: 客户退回登记页
    audit: true
  - actor: SH-E2
    where: in_system
    evidence:
    - 往来函件检索记录（范围、条件、时间、结果）
    - 期限计算快照与声明人
    actor_v1: 项目经理
    command: 登记项目经理的无异议声明
    aggregate: AGG-27
    branch: 无异议声明
    emits:
    - 无异议已声明
    decision:
    - when: otherwise
      goto: end
    cross_bc:
    - mode: event
      direction: out
      bc: B-08
      name: 无异议已声明
    calls: PRC-33
    desc: 期满后项目经理检索往来函件，声明期满前未收到书面异议，检索记录作证据；交付侧不判期满，期满判定与视为同意认定在 B-08（ADR-0049 决定 1、5）；财务复核在收入确认审批中（ADR-0047 U-2 (a)）
    permission: 交付物.声明无异议
    page: 无异议声明页
    audit: true
    outcome: 已声明无异议
    notify:
    - to: SH-E6
      how: 企业微信消息（待财务在收入确认审批中复核）
- id: PRC-30
  name: 提出并批准完工估算
  trigger:
