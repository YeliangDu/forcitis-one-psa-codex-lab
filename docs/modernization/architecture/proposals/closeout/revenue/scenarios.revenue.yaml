  - 第 5 步 otherwise
  expect: 拒绝并告警（INV-71）
- id: PRC-57-S04
  path: 预收款人工发起，附委托函，4 例外准入→6
  outcome: 已开具
  covers:
  - 第 4 步 INV-71 例外
  expect: 预收例外经准入后开具；历史 31 个合同标例外
- id: PRC-57-S05
  path: 6 期间已关账
  outcome: 因期间已关账未开具
  covers:
  - 第 6 步「期间已关账」
  expect: 拒绝开具，申请保持待开具，不改写额度
- id: PRC-57-S06
