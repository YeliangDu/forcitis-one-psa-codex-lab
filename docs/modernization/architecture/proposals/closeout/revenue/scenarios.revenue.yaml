PRC-21:
- id: PRC-21-S01
  path: 未开始 → 进行中 → 已完成
  outcome: null
  covers:
  - 开始阶段
  - 完成阶段
  expect: 发「阶段已开始」「阶段已完成」（仅分析）；阶段节点不记客户认可
- id: PRC-21-S02
  path: 未发布 → 已锁定 → 已作废
  outcome: null
  covers:
  - 锁定工作包
  - 作废工作包
  expect: 发「工作包已锁定」「工作包已作废」（仅分析）；已锁定的只能作废不能删除（INV-42）
- id: PRC-21-S03
  path: 未发布 → 已作废（未发布的删除路径）
  outcome: null
  covers:
  - 作废工作包（未发布）
  expect: 未发布工作包可作废或删除，不涉及工时（INV-42）
- id: PRC-21-S04
  path: 后一阶段先于前一阶段开始，或跳段
  outcome: null
  covers:
  - 阶段并行、倒序、跳段
  expect: 允许，不拦截（S2）；阶段层次不合法时拒绝（INV-41）
PRC-22:
- id: PRC-22-S01
  path: 阶段已完成，且阶段下需客户认可的交付物均已认可
  outcome: null
  covers:
  - 共同出口：交付物已认可
  expect: 无预警
- id: PRC-22-S02
  path: 阶段已完成，但仍有交付物未认可、也无无异议声明
  outcome: null
  covers:
  - 预警：阶段已完成但出口未满足
  expect: 出现门预警并留痕，不拦截下一阶段
- id: PRC-22-S03
  path: 阶段已完成，交付物已送达并已声明无异议
  outcome: null
  covers:
  - 共同出口：已送达并已声明
