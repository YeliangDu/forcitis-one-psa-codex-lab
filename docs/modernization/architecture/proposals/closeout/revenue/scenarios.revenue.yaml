  expect: PRC-23 第 2 步拒记（只断言工时模块读到暂停状态后拒绝）
PRC-26:
- id: PRC-26-S01
  path: 1→2→3 资料合格
  outcome: 已确认
  covers:
  - 第 3 步「资料合格」
  expect: 发「发包人资料已确认」（仅分析）；收件凭证经 PRC-33 登记
- id: PRC-26-S02
  path: 3 资料有缺陷→4 退回→2
  outcome: null
  covers:
  - 第 3 步 otherwise
  - 第 4 步 otherwise
  expect: 发「发包人资料已退回」；通知项目经理转告发包人补充，补充后再登记提供
- id: PRC-26-S03
  path: 4 缺陷资料影响进度→PRC-32
  outcome: null
  covers:
  - 第 4 步「缺陷资料影响进度且需发包人答复延期」
