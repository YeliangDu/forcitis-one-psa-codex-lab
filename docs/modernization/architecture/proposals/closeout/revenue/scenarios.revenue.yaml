- id: PRC-22-S04
  path: 交付物已送达，未约定审查期且超过催签周期仍无回应
  outcome: null
  covers:
  - 预警：催签超期
  expect: 出现催签超期预警；不自动认可，不得登记视为同意
- id: PRC-22-S05
  path: 交付物已送达，合同约定审查期即将届满
  outcome: null
  covers:
  - 预警：审查期将满
  expect: 提示项目经理登记无异议声明；期满判定仍在 B-08
- id: PRC-22-S06
  path: 同一领域事件重复投递
  outcome: null
  covers:
  - 刷新：事件幂等
  expect: 投影结果不变，预警不重复出现
PRC-23:
- id: PRC-23-S01
  path: 1→2→3 审批通过→4→8
  outcome: 已通过
  covers:
  - 第 2 步 otherwise
  - 第 3 步「审批通过」
  - 第 8 步 otherwise
  expect: 发 TimesheetApproved（同 BC 触发 PRC-91）与「工时已过账」（仅分析）；按锁定费率版本提交过账候选
- id: PRC-23-S02
  path: 2 工时所属期间已关账
  outcome: 未提交
  covers:
  - 第 2 步「工时所属期间已关账」
  expect: 人工提交遇已关账期间只提示并拒绝提交，改走冲销或修正（INV-67），不设审批
- id: PRC-23-S03
  path: 2 所记项目已暂停（或已结项、已终止、已取消）
  outcome: 未提交
  covers:
  - 第 2 步「所记项目已暂停、已结项、已终止或已取消」
  expect: 拒记并提示项目状态（INV-39，Q-05）；项目恢复后可记
- id: PRC-23-S04
  path: 2 所记工作包当天无权使用
  outcome: 未提交
  covers:
  - 第 2 步「所记工作包当天无权使用」
  expect: 拒绝提交（INV-66）
- id: PRC-23-S05
  path: 2 当日工时低于最低时数
  outcome: 未提交
  covers:
  - 第 2 步「当日工时低于最低时数」
  expect: 拦截，最低时数取当日标准工时扣减已批准与待批请假；取不到标准工时失败并告警（INV-65）
- id: PRC-23-S06
  path: 3 审批人退回→5→2→3
  outcome: null
  covers:
  - 第 3 步「审批人退回修改」
  expect: 发 TimesheetReturned；工时单可改，重提轮次加 1
- id: PRC-23-S07
  path: 3 审批驳回→6
  outcome: 已驳回
  covers:
  - 第 3 步 otherwise
  expect: 发 TimesheetRejected；终局，不可再提交
- id: PRC-23-S08
  path: 3 员工撤回本轮或取消审批→7
  outcome: 已撤回
  covers:
  - 第 3 步「员工撤回本轮或取消审批」
  - 第 3 步 withdraw
  - 第 7 步
  expect: 审批实例结束，工时单回到草稿，可修改重提
- id: PRC-23-S09
  path: 3 分支审批超过 1 个工作日
  outcome: null
  covers:
  - 第 3 步超时
  expect: 次日提醒审批人，再 1 个工作日升级；仍未处理不自动通过
- id: PRC-23-S10
  path: 8 目标期间已关账（系统自动触账）
  outcome: 已通过
  covers:
  - 第 8 步「目标期间已关账（路由当前开放期间并标原期间，不拒绝）」
  expect: 工时单保持已通过；过账候选路由到该法人当前开放期间并标原期间（INV-92，ADR-0045），不拒绝、不设审批；通知财务核对
- id: PRC-23-S11
  path: 8 缺锁定费率版本
  outcome: 已通过
  covers:
  - 第 8 步「缺锁定费率版本」
  expect: 不得计成本，失败并告警（INV-37）；工时单状态不变
- id: PRC-23-S12
  path: 3 项目经理本人的项目工时（责任人就是提交人）→上提一级审批→4
  outcome: 已通过
  covers:
  - 第 3 步审批人解析：AR-11 责任人就是提交人本人
  expect: 归属对象责任人即提交人，按 AR-11 由其上级（承担部门负责人）审批；审批平台拒绝本人审批本人工时单（segregation）
PRC-24:
- id: PRC-24-S01
  path: 1 暂停→2 恢复
  outcome: 已恢复
  covers:
  - 第 1 步「暂停原因消除且继续履行」
  expect: 发「项目已暂停」「项目已恢复」（仅分析）；恢复后可记工时
- id: PRC-24-S02
  path: 1 暂停→3 终止（已有投入）
  outcome: 已终止
  covers:
  - 第 1 步「不再继续履行且已有投入」
  expect: 发「项目已终止」，B-07 订阅后做终止清算；原因必填
- id: PRC-24-S03
  path: 1 暂停→4 取消（无任何投入）
  outcome: 已取消
  covers:
  - 第 1 步「不再继续履行且无任何投入」
  expect: 发「项目已取消」（B-07 订阅）；原因必填
- id: PRC-24-S04
  path: 1 暂停后保持暂停
  outcome: 已暂停
  covers:
  - 第 1 步 otherwise
  expect: 项目保持暂停，暂停期间拒记工时（INV-39）
- id: PRC-24-S05
  path: 执行中直接 3 终止
  outcome: 已终止
  covers:
  - 触发：直接终止（待 Q09）
  expect: 同 S02 的事件与清算；是否允许不经暂停随 Q09
- id: PRC-24-S06
  path: 执行中直接 4 取消
  outcome: 已取消
  covers:
  - 触发：直接取消（待 Q09）
  expect: 同 S03；是否允许不经暂停随 Q09
- id: PRC-24-S07
  path: 1 暂停后员工提交该项目工时
  outcome: null
  covers:
