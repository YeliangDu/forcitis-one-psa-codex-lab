PRC-183:
- id: PRC-183-S01
  path: 1→2 otherwise→4
  outcome: 商机已决定参投
  covers:
  - 第 2 步 otherwise
  - 第 4 步 otherwise
  expect: 未触发异常条件，商机负责人决定即生效，商机到「已决定参投」，发商机已决定参投；不发起审批
- id: PRC-183-S02
  path: 2 触发异常条件→3 审批通过
  outcome: 商机已决定参投
  covers:
  - 第 2 步「决定参投且触发异常条件（低于毛利底线、超产能、独立性冲突）」
  - 第 3 步 otherwise
  expect: 低于毛利底线等异常时由部门负责人一级审批，通过后生效
- id: PRC-183-S03
  path: 3 审批驳回→2 决定放弃→5
  outcome: 商机已放弃
  covers:
  - 第 3 步审批驳回 on_reject
  - 第 2 步「决定放弃」
  - 第 5 步 otherwise
  expect: 例外被驳回后回到判断，商机负责人决定放弃，商机到「放弃」（VS-01.2 退出）
- id: PRC-183-S04
  path: 2 决定放弃→5
  outcome: 商机已放弃
  covers:
  - 第 2 步「决定放弃」
  - 第 5 步 otherwise
  expect: 放弃原因取参投判断的理由，发商机已放弃
- id: PRC-183-S05
  path: 2 判断清单必填项缺失
  outcome: null
  covers:
  - 第 2 步必填校验
  expect: 缺评分或理由则拒绝登记并提示，商机留在「跟进中」（规则卡待 one-rules）
PRC-13:
- id: PRC-13-S01
  path: 1→2→3 审批通过→4（审批已通过）→5 仅发布费率版本
  outcome: 费率版本已生效
  covers:
  - 第 3 步「审批通过」
  - 第 5 步「仅发布费率版本」
  expect: 费率版本已批准后生效，旧版同事务被取代；发费率版本已生效、已被取代（仅分析）；B-03、B-04 按生效版本读取
- id: PRC-13-S02
  path: 3 审批驳回→2（审批已驳回）
  outcome: null
  covers:
  - 第 3 步 otherwise
  - 第 2 步接收审批已驳回
  expect: 退回编制，原版本不变，可修改后重新提交批准
- id: PRC-13-S03
  path: 5 生效区间与现有生效版本重叠
  outcome: 生效被拒（区间重叠）
  covers:
  - 第 5 步「生效区间与现有生效版本重叠」
  expect: 拒绝并告警（INV-35）
- id: PRC-13-S04
  path: 5 同时发布计费系数新版本→6 otherwise
  outcome: 计费系数版本已生效
  covers:
  - 第 5 步「同时发布计费系数新版本」
  - 第 6 步 otherwise
  expect: 系数条目键为业务线 × 客户分级（Q-07）；发计费系数版本已生效（仅分析）
- id: PRC-13-S05
  path: 5 otherwise（同时发布协议价目新版本）→7
  outcome: 协议价目版本已生效
  covers:
  - 第 5 步 otherwise
  - 第 7 步 otherwise
  expect: 协议价目版本生效，B-03 报价按生效版本读取
- id: PRC-13-S06
  path: 4 / 6 修改已批准的版本
  outcome: null
  covers:
  - 第 4 步 INV-36
  - 第 6 步 INV-36a
  expect: 拒绝并告警，已批准的版本不可改，只能增版本
- id: PRC-13-S07
  path: 3 申请人已撤回批准申请
  outcome: 已撤回
  covers:
  - 第 2 步撤回
  - 第 3 步「申请人已撤回批准申请」
  expect: 版本回草拟，不批准不生效；可修改后重新提交
- id: PRC-13-S08
  path: 6 同时发布协议价目新版本→7
  outcome: 协议价目版本已生效
  covers:
  - 第 6 步「同时发布协议价目新版本」
  expect: 系数版本生效后继续发布协议价目版本
PRC-14:
- id: PRC-14-S01
