# 收入线组验收场景清单（PRC-NN-Sxx；按方法稿第 6 节分支覆盖：每个判断出口、每个超时分支、每个结局至少一条）
# 只写路径与期望结局，Given/When/Then 由测试代理按此展开（CS-5.3）；跨 BC 段只断言本模块并以事件契约衔接（CS-5.5）
PRC-01:
- id: PRC-01-S01
  path: 计划→进行中→结束
  outcome: 已结束
  covers:
  - 转移「计划市场活动」「开展市场活动」「结束市场活动」
  expect: 发市场活动已结束（仅分析）；线索上的来源活动引用保持
- id: PRC-01-S02
  path: 计划状态直接结束活动
  outcome: null
  covers:
  - 转移约束「结束须在进行中」
  expect: 拒绝并告警
PRC-02:
- id: PRC-02-S01
  path: 计划→已完成（含结果反馈）
  outcome: 已完成
  covers:
  - 转移「完成客户活动」
  expect: 须填结果反馈（INV-110）；发客户活动已完成，供拜访量与计划完成率
- id: PRC-02-S02
  path: 完成时缺结果反馈
  outcome: null
  covers:
  - 转移「完成客户活动」前置 INV-110
  expect: 拒绝并告警
- id: PRC-02-S03
  path: 计划→已变更→已变更
  outcome: 已变更
  covers:
  - 转移「变更客户活动」
  expect: 计划变更保留历史，只追加
- id: PRC-02-S04
  path: 取消，或对已完成、已取消的活动再变更
  outcome: 已取消
  covers:
  - 转移「取消客户活动」
  - 转移约束「已完成、已取消不得再变更」
  expect: 取消须原因；已完成或已取消后再变更被拒绝（INV-110）
PRC-03:
- id: PRC-03-S01
  path: 1→2→3 otherwise→6→7 otherwise→8
  outcome: 已转商机
  covers:
  - 第 1 步 otherwise
  - 第 3 步 otherwise
  - 第 7 步 otherwise
  - 第 8 步 otherwise
  expect: 新建商机成功后确认线索，命令携带商机 ID 且按商机 ID 幂等；发「线索已确认」（仅分析）
- id: PRC-03-S02
  path: 1 客户直接邀标或委托→6→7 没有来源线索→结束
  outcome: 商机跟进中
  covers:
  - 第 1 步「客户直接邀标或委托，无需线索」
  - 第 7 步「没有来源线索（直接邀标或委托）」
  expect: 不确认线索；第 7 步随步通知商机负责人开始跟进（原独立通知步已并入 notify）
- id: PRC-03-S03
  path: 3 需暂缓跟进→4 otherwise
  outcome: 已挂起
  covers:
  - 第 3 步「需暂缓跟进」
  - 第 4 步 otherwise
  expect: 线索挂起，状态由跟进中转挂起并留痕
- id: PRC-03-S04
  path: 4 线索重启跟进→5→6
  outcome: null
  covers:
  - 第 4 步「线索重启跟进」
  - 第 5 步 otherwise
  expect: 挂起恢复为跟进中，回到新建商机前的读取
- id: PRC-03-S05
  path: 4 线索无价值→9
  outcome: 线索已关闭
  covers:
  - 第 4 步「线索无价值」
  - 第 9 步 otherwise
  expect: 须填关闭原因（INV-24），发「线索已关闭」（仅分析）
- id: PRC-03-S06
  path: 7 被拒，补资料后重试→6
  outcome: null
  covers:
  - 第 7 步「新建商机被拒，补资料后重试」
  expect: 往来单位档案未核实时不建商机，线索留在跟进中；通知财务核实档案（PRC-05）；核实后重试成功（P-3、INV-26）
- id: PRC-03-S07
  path: 7 被拒且不再跟进→9
  outcome: 线索已关闭
  covers:
  - 第 7 步「新建商机被拒且不再跟进」
  expect: 按 INV-24 关闭线索并填原因
- id: PRC-03-S08
  path: 8 需调整→10→11 参与团队需调整→12
  outcome: 商机已维护
  covers:
  - 第 8 步「商机负责人或参与团队需调整」
  - 第 11 步「参与团队需调整」
  - 第 12 步 otherwise
  expect: 变更负责人后商机只有一个负责人（INV-26）；参与团队维护留痕
- id: PRC-03-S09
  path: 8 需调整→10→11 otherwise
  outcome: 商机已维护
  covers:
  - 第 11 步 otherwise
  expect: 只变更负责人，不调参与团队，新负责人收到交接通知
- id: PRC-03-S10
  path: 9 关闭已确认的线索
  outcome: null
  covers:
  - 第 9 步前置 INV-24
  expect: 拒绝并告警，已确认的线索不能再关闭
- id: PRC-03-S11
  path: 7 同一线索再建第二个商机
  outcome: null
  covers:
  - 第 7 步前置 INV-25
  expect: 拒绝并告警，一个线索至多一个商机
PRC-05:
- id: PRC-05-S01
  path: 登记往来单位→待核实
  outcome: 待核实
  covers:
  - 转移「登记往来单位」
  expect: 发往来单位已登记（仅分析）；待核实的档案不算正式往来单位（P-3）
- id: PRC-05-S02
  path: 登记重复证件的往来单位
  outcome: null
  covers:
  - 转移「登记往来单位」前置 INV-01
  expect: 拒绝并告警，一个法律主体一份档案
- id: PRC-05-S03
  path: 待核实→有效
  outcome: 有效
  covers:
  - 转移「核实往来单位档案」
  expect: 发往来单位已核实（仅分析）；商机可引用（INV-26）
- id: PRC-05-S04
  path: 变更银行账户
  outcome: null
  covers:
  - 转移「变更银行账户」
  expect: 发银行账户已变更，订阅方 B-10 首笔付款预警（P-01）；留操作审计
- id: PRC-05-S05
  path: 有效→已合并
  outcome: 已合并
  covers:
  - 转移「合并往来单位」
  expect: 发往来单位已合并（仅分析）；合并后不得新建协议与付款（INV-03a）
- id: PRC-05-S06
  path: 有效→停用
  outcome: 已停用
  covers:
  - 转移「停用往来单位」
  expect: 发往来单位已停用（仅分析）；停用后不得新建协议与付款（INV-03a）
PRC-06:
- id: PRC-06-S01
  path: 待查→无冲突
  outcome: 无冲突
  covers:
  - 转移「登记独立性检查结论」→无冲突
  expect: 发独立性检查已有结论（仅分析）；投标与赢单放行
- id: PRC-06-S02
  path: 待查→有冲突已获书面同意
  outcome: 有冲突已获书面同意
  covers:
  - 转移「登记独立性检查结论」→有冲突已获书面同意
  expect: 书面同意附件必填并校验已上传；缺附件时拒绝并告警
- id: PRC-06-S03
  path: 待查→有冲突不得承接
  outcome: 有冲突不得承接
  covers:
  - 转移「登记独立性检查结论」→有冲突不得承接
  expect: 递交投标、直接委托赢单、签约前读到该结论均被拒绝（INV-33）
PRC-07:
- id: PRC-07-S01
  path: 1→2 otherwise→3→4 审批通过→5（审批已通过）→7 投标场景（发出经 PRC-08 递交投标）→end
  outcome: 报价已生效
  covers:
  - 第 2 步 otherwise
  - 第 4 步「审批通过」
  - 第 5 步 otherwise
  - 第 7 步「投标场景（发出经 PRC-08 递交投标）」
  expect: 报价版本已通过且冻结（INV-31）；生效后成为（商机，标段）的当前版本，旧版同事务被取代（INV-30）；发报价版本已生效、已被取代（仅分析）
- id: PRC-07-S02
  path: 2 所引费率或系数版本并非生效版本
  outcome: 报价未编制
  covers:
  - 第 2 步「所引费率或系数版本并非生效版本」
  expect: 拒绝并告警（INV-32），不落草拟报价
- id: PRC-07-S03
  path: 4 驳回→6（审批已驳回）客户仍要报价→2
  outcome: null
  covers:
  - 第 4 步 otherwise
  - 第 6 步「客户仍要报价」
  expect: 驳回意见回传编制人，退回编制后可重新提交评审
- id: PRC-07-S04
  path: 6 otherwise→10
  outcome: 报价已作废
  covers:
  - 第 6 步 otherwise
  expect: 驳回后客户不再要报价，版本作废并留痕
- id: PRC-07-S05
  path: 7 同一（商机，标段）已有生效版本
  outcome: null
  covers:
  - 第 7 步 INV-30
  expect: 旧版被取代与新版生效同事务；并发生效只有一方成功
- id: PRC-07-S06
  path: 7 生效未通过评审的版本
  outcome: null
  covers:
  - 第 7 步前置 INV-31
  expect: 拒绝并告警；已通过的版本不可改
- id: PRC-07-S07
  path: 3 提交评审→4 申请人已撤回评审
  outcome: 已撤回
  covers:
  - 第 3 步撤回
  - 第 4 步「申请人已撤回评审」
  expect: 撤回评审后版本回草拟，审批平台单据作废；可修改后重新提交，不产生评审结论
- id: PRC-07-S08
  path: 7 otherwise（非投标：询价、议标、直接委托）→8 核验实际用印 otherwise→9 登记报价发出
  outcome: 报价已发出
  covers:
  - 第 7 步 otherwise
  - 第 8 步 otherwise
  - 第 9 步 otherwise
  expect: 非投标发出成功；REF-04 核验同一报价版本、法人、拟发文件的实际用印后调用 AGG-12 登记报价发出，记录发出方式、日期、客户联系人、用印登记 ID；报价仍为已生效，不校验用印真伪，不发领域事件
- id: PRC-07-S09
  path: 7 otherwise→8 未用印→end
  outcome: 报价发出被拒（未用印）
  covers:
  - 第 8 步「未用印，或报价版本、法人、拟发文件不符，或读不到用印登记、调用失败」
  expect: 未用印或仅审批通过时发出失败并向 SH-E5 告警；版本、法人、拟发文件任一不符同样拒绝，不调用登记报价发出，不改报价状态
- id: PRC-07-S10
  path: 7 otherwise→8 B-31 读不到用印登记或调用失败→end
  outcome: 报价发出被拒（未用印）
  covers:
  - 第 8 步「未用印，或报价版本、法人、拟发文件不符，或读不到用印登记、调用失败」
  expect: B-31 读不到被拒，调用失败也拒绝并向 SH-E5 告警，不放行、不调用登记报价发出
- id: PRC-07-S11
  path: 7 投标场景（发出经 PRC-08 递交投标）→end
  outcome: 报价已生效
  covers:
  - 第 7 步「投标场景（发出经 PRC-08 递交投标）」
  expect: 投标场景生效即止，不在本流程核验用印或登记报价发出；发出经 PRC-08 在递交投标前由 REF-04 核验实际用印
PRC-08:
- id: PRC-08-S01
  path: 1→2→3 otherwise→6（定时提醒）→7 核验实际用印 otherwise→8 otherwise
  outcome: 已递交待评标
  covers:
  - 第 2 步 otherwise
  - 第 3 步招标文件不要求保证金
  - 定时提醒
  - 第 7 步 otherwise
  - 递交投标 otherwise
  expect: 无需保证金的投标携承诺快照递交，发「投标已递交」（仅分析）；评标结果到达后由登记步骤重入
- id: PRC-08-S02
  path: 2 直接委托，无招标→16
  outcome: 商机已赢单
  covers:
  - 第 2 步「直接委托，无招标」
  - 委托赢单 otherwise
  expect: 凭委托证据赢单（INV-27），发 OpportunityAccepted，订阅方 B-04、B-05
- id: PRC-08-S03
  path: 2 独立性检查有冲突未获书面同意
  outcome: 不得投标
  covers:
  - 第 2 步 INV-33 出口
  expect: 拒绝递交并告警（INV-33）
- id: PRC-08-S04
  path: 3 资格预审未通过→13→17
  outcome: 商机已放弃
  covers:
  - 第 3 步「资格预审未通过」
  - 放弃投标 otherwise
  - 放弃商机 otherwise
  expect: 资格预审未通过不得递交（INV-29）；放弃投标后客户经理放弃商机，发商机已放弃（仅分析，B-07）
- id: PRC-08-S05
  path: 8 评标结果为中标→9→14
  outcome: 商机已赢单
  covers:
  - 递交投标「评标结果为中标」
  - 登记中标 otherwise
  - 商机赢单策略 otherwise
  expect: 中标通知书必填；投标已中标触发商机赢单，发 OpportunityAccepted，订阅方 B-04、B-05
- id: PRC-08-S06
  path: 8 评标结果为未中标→10→15
  outcome: 商机已丢单
  covers:
  - 递交投标「评标结果为未中标」
  - 登记未中标 otherwise
  - 登记商机丢单策略 otherwise
  expect: 投标未中标自动登记商机丢单；本流程发「投标未中标」，PRC-153 订阅后接续保证金退还（不在本流程）
- id: PRC-08-S07
  path: 4 保证金付款审批通过→5
  outcome: null
  covers:
  - 第 4 步付款审批
  - 第 5 步登记缴纳
  expect: 付款经 B-10 审批（命中 AR-01 加一级、AR-02 加两级），付款成功后出纳登记保证金缴纳（P-10），过账由 PRC-10 提交
- id: PRC-08-S08
  path: 8 评标阶段被宣布废标→11 重新招标，另建投标→PRC-08
  outcome: null
  covers:
  - 递交投标「评标阶段被宣布废标」
  - 登记废标「重新招标，另建投标」
  expect: 发「投标已废标」（PRC-153 接续退还）；重入本流程另建投标
- id: PRC-08-S09
  path: 11 不重新招标且商机丢失→18
  outcome: 商机已丢单
  covers:
  - 登记废标「不重新招标且商机丢失」
  - 废标后丢单 otherwise
  expect: 客户经理人工登记商机丢单，发商机已丢单（仅分析）
- id: PRC-08-S10
  path: 11 otherwise→13→17
  outcome: 商机已放弃
  covers:
  - 登记废标 otherwise
  expect: 废标后放弃商机，发商机已放弃
- id: PRC-08-S11
  path: 8 决定撤回→12 撤回发生在截止前，商机继续跟进
  outcome: 已撤回
  covers:
  - 递交投标「决定撤回或撤销投标」
  - 撤销投标「截止前撤回，商机继续跟进」
  expect: 登记投标已撤销（PRC-153 订阅后按截止前撤回接续退还，条例第 35 条另行核对）；商机继续跟进
- id: PRC-08-S12
  path: 12 otherwise→13→17
  outcome: 商机已放弃
  covers:
  - 撤销投标 otherwise
  expect: 截止后撤销不触发退还，客户经理放弃商机
- id: PRC-08-S13
  path: 12 截止前撤回，不再跟进该商机→13→17
  outcome: 商机已放弃
  covers:
  - 撤销投标「截止前撤回，不再跟进该商机」
  expect: 撤回后放弃商机；退还由 PRC-153 接续
- id: PRC-08-S14
  path: 4 保证金付款审批被驳回→13→17
  outcome: 商机已放弃
  covers:
  - 第 4 步审批驳回 on_reject
  expect: 保证金付款审批驳回即不缴保证金（资金审批，参投已在 PRC-183 决定）；放弃投标后放弃商机
- id: PRC-08-S15
  path: 16 委托赢单时独立性检查有冲突未获书面同意
  outcome: null
  covers:
  - 委托赢单前置 INV-33
  expect: 拒绝并告警
- id: PRC-08-S16
  path: 8 同一招标同一标段重复参加
  outcome: null
  covers:
  - 递交投标前置 INV-28
  expect: 拒绝并告警（键为招标项目登记 ID + 标段）
- id: PRC-08-S17
  path: 9 中标但缺中标通知书
  outcome: null
  covers:
  - 登记中标前置 INV-27
  expect: 商机赢单被拒并告警，登记中标时即校验已上传
- id: PRC-08-S18
  path: 6 投标截止临近定时提醒
  outcome: null
  covers:
  - 定时提醒
  expect: 提醒商机负责人（P-13），不改变投标状态
- id: PRC-08-S19
  path: 8 决定撤回→12 撤回发生在截止后，商机继续跟进
  outcome: 已撤回
  covers:
  - 递交投标「决定撤回或撤销投标」
  - 撤销投标「截止后，商机继续跟进」
  expect: 登记投标已撤销；截止后撤销不适用退还；商机仍可继续跟进
- id: PRC-08-S20
  path: 第 11 步登记废标→出口「重新招标，另建投标」
  outcome: 已转重新投标
  covers:
  - 第 11 步「重新招标，另建投标」
  expect: 本投标以已转重新投标结束，商机保持跟进中，新投标另起 PRC-08 实例；投标保证金退还由 PRC-153 订阅「投标已废标」接续
- id: PRC-08-S21
  path: 1→2→3 otherwise→6→7 递交前用印核验失败→end
  outcome: 递交被拒（未用印）
  covers:
  - 第 7 步「未用印，或报价版本、法人、拟发文件不符，或读不到用印登记、调用失败」
  expect: REF-04 发现未用印（含仅审批通过）、报价版本或法人或拟发文件不符、B-31 读不到或调用失败时，递交失败并向 SH-E5 告警；不调用 AGG-11 递交投标，不发投标已递交，不改投标状态
PRC-10:
- id: PRC-10-S01
  path: 待缴→已缴
  outcome: 已缴
  covers:
  - 转移「登记保证金缴纳」
  expect: 发保证金已缴（仅分析）；提交过账候选；P-10 比例判定
- id: PRC-10-S02
  path: 已缴→扣减审批通过→已缴（扣减）
  outcome: null
  covers:
  - 转移「扣减保证金」
  expect: 责任人审批违约事实与金额后登记；履约保证金可部分扣减（INV-20）；留操作审计
- id: PRC-10-S03
  path: 已缴→已退（我方收取的保证金，经 B-10 付款退还）
  outcome: 已退
  covers:
  - 转移「退还保证金」
  expect: 退还与没收互斥各只一次（INV-20）；收款账户须为原缴纳方账户（AR-09）；付款经 B-10；提交过账候选
- id: PRC-10-S04
  path: 已没收后退还，或已退后没收
  outcome: null
  covers:
  - 转移「没收保证金」前置 INV-20
  expect: 拒绝并告警
- id: PRC-10-S05
  path: 保函已开立→到期 / 被索赔
  outcome: 已到期
  covers:
  - 转移「登记保函开立」
  - 转移「登记保函到期或索赔」
  expect: 发保函已到期（仅分析）；被索赔走保函已被索赔
- id: PRC-10-S06
  path: 系统自动提交过账候选时期间已关账
  outcome: null
  covers:
  - 过账「提交过账候选」期间闸门
  expect: 不拒绝，按 INV-92 落开放期间并标原期间（ADR-0045）
- id: PRC-10-S07
  path: 人工登记缴纳、退还、没收或扣减时业务日期所在期间已关账
  outcome: null
  covers:
  - 转移「登记保证金缴纳」等人工登记的期间提示
  expect: 按规则卡提示（不设审批，不拒绝），登记后提交过账候选按 INV-92 路由
- id: PRC-10-S08
  path: 已缴→没收审批通过→被没收
  outcome: 被没收
  expect: 责任人审批违约事实与金额；发保证金已没收（仅分析）；提交过账候选
- id: PRC-10-S09
  path: 扣减或没收审批驳回
  outcome: null
  expect: 收到「审批已驳回」，转移不发生，保证金保持已缴
- id: PRC-10-S10
  path: 扣减或没收金额超阈值或相对方为关联方→加审后通过
  outcome: null
  expect: 责任人一级审批后按 AR-01、AR-02 加审
- id: PRC-10-S11
  path: 退还收款账户不是原缴纳方登记账户
  outcome: null
  expect: 拒绝并告警（AR-09，RULE-410）
- id: PRC-10-S12
  path: 待缴→B-10 付款审批通过并付款成功→已缴
  outcome: 已缴
  expect: 我方缴纳的保证金经 B-10 付款审批，付款成功后登记缴纳
- id: PRC-10-S13
  path: 提交过账候选时原期间所在年度已年结
  outcome: null
  expect: 暂挂并告警，待 ADR-0045 U-2
- id: PRC-10-S14
  path: 迁入后审批中的扣减或没收
  outcome: null
  expect: 迁入编排的离线命令重新发起审批，不迁审批实例
PRC-12:
- id: PRC-12-S01
  path: 发布服务产品版本、发布阶段类型版本
  outcome: 已发布
  covers:
  - 转移「发布服务产品版本」
  - 转移「发布阶段类型版本」
  expect: 发服务产品版本已发布、阶段类型版本已发布（仅分析）；新版本启用
