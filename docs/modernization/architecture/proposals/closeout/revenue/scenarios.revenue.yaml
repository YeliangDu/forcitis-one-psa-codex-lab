- id: PRC-20-S02
  path: 3 部分满足→1
  outcome: null
  covers:
  - 第 3 步 otherwise
  expect: 需求保持部分满足，项目经理就缺口另提需求
- id: PRC-20-S03
  path: 3 分配超过可用产能
