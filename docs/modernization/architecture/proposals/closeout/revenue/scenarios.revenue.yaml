  covers:
  - 第 1 步 otherwise
  expect: 追加一行产值估计，不过账、不占额度；不触发收入确认
- id: PRC-151-S02
  path: 1 被抽查→2 otherwise→end
  outcome: 产值已抽查
  covers:
  - 第 1 步「被抽查」
  - 第 2 步 otherwise
  expect: 部门负责人抽查通过，留抽查记录
- id: PRC-151-S03
  path: 1 被抽查→2 发现明显偏差→1
  outcome: null
  covers:
  - 第 2 步「发现明显偏差」
  expect: 通知项目经理更正；更正以新增一行追加，原行保留
- id: PRC-151-S04
  path: 1 超 P3D 未填报
  outcome: null
  covers:
  - 第 1 步 timeout
  expect: 提醒部门负责人（SH-M1）；不改变任何收入或过账状态
- id: PRC-151-S05
  path: 第 1 步「填报产值估计」期限届满（P3D）
  outcome: null
  covers:
  - 第 1 步超时
  - 填报产值估计
  expect: 逾期提醒项目经理并抄送部门负责人；不阻断其他流程
- id: PRC-151-S06
  path: 第 1 步出口「被抽查（按抽查比例规则配置）」
  outcome: null
  covers:
  - 第 1 步「被抽查（按抽查比例规则配置）」
  expect: 按配置比例抽中的填报进入部门负责人抽查；未抽中的直接生效
PRC-152:
- id: PRC-152-S01
  path: 1→2 登记竣工验收证书→3
  outcome: 条件已达成并可结算
  expect: 发「付款条件项已可结算」，订阅方 B-08；通知项目经理可提出开票
- id: PRC-152-S02
  path: 1 时间型节点到期日已届→3
  outcome: 条件已达成并可结算
  expect: 定时触发，免登记，直接标可结算
- id: PRC-152-S03
  path: 1 缺陷责任期届满，商务登记缺陷责任期终止证书→2→3
  outcome: 条件已达成并可结算
  expect: 质保金付款条件项可结算，通知项目经理申请返还并开票或出收据
- id: PRC-152-S04
  path: 2 证据缺失
  outcome: 登记被拒
  expect: 拒绝并告警
- id: PRC-152-S05
  path: 2 证据类型与条件类型不符（如用审图合格书登记竣工验收）
  outcome: 登记被拒
  expect: 拒绝并告警（PAY-R1）
- id: PRC-152-S06
  path: 1 付款条件项已是可结算
  outcome: 条件已是可结算
  expect: 幂等，不重复发事件
- id: PRC-152-S07
  path: 3 重复收到同一付款条件项的达成登记
  outcome: null
  expect: 按付款条件项 ID 幂等，不重复发事件
- id: PRC-152-S08
  path: 迁入后时间型节点
  outcome: null
  expect: 迁入编排的离线命令登记下一个到期日定时，不依赖事件
PRC-153:
- id: PRC-153-S01
  path: 1→2 招标人按期退款到账→4→5
  outcome: 保证金已退
  expect: 登记退还，发保证金已退（仅分析），提交过账候选
- id: PRC-153-S02
  path: 1 保证金已退还或已没收
  outcome: 退还被拒
  expect: 拒绝并告警（INV-20）
- id: PRC-153-S03
  path: 2 超过约定退还期限仍未到账→3 催退→2
  outcome: 保证金已退
  expect: 提醒出纳并由商务催退，到账后登记退还
- id: PRC-153-S04
  path: 第 2 步「等待招标人退款到账；约定期限内未到账则提醒」P5D 未到账
  outcome: null
  expect: 升级给 SH-M1（非中断），继续等待
- id: PRC-153-S05
  path: 3 招标人明确不予退还或没收
  outcome: 转没收登记
  expect: 转 PRC-10 没收保证金（经审批）
- id: PRC-153-S06
  path: 5 业务日期所在期间已关账
  outcome: null
  expect: 路由开放期间并标原期间（INV-92），不拒绝
- id: PRC-153-S07
  path: 5 原期间所在年度已年结
  outcome: 暂挂待跨年处理
  expect: 不提交过账候选，告警；待 ADR-0045 U-2
- id: PRC-153-S08
  path: 迁入后已触发待退未到账的保证金
  outcome: null
  expect: 迁入编排的离线命令补发信号事件，进入第 1 步
PRC-154:
- id: PRC-154-S01
  path: 三口径均有数据的协议 × 期间
  outcome: null
  covers:
  - 三口径并排
  - 两两差额
  expect: 显示经营产值、权责收入、开票收入与差额；三者互不触发
- id: PRC-154-S02
  path: 经营产值缺填的期间
  outcome: null
  covers:
  - 经营产值缺填
  expect: 该期经营产值显示「未填报」，不补零，差额不计算
- id: PRC-154-S03
  path: 发票已红冲后
  outcome: null
  covers:
  - 发票已红冲事件
  expect: 开票收入按蓝字减红冲更新；权责收入不变
PRC-179:
- id: PRC-179-S01
  path: 收到项目已开始执行，关联协议为已生效
  outcome: 协议已转入履行中
  covers:
  - otherwise
  expect: 协议转入履行中
- id: PRC-179-S02
  path: 同一协议重复收到事件，或协议已在履行中
  outcome: 无需处理
  covers:
  - 关联协议已在履行中或之后状态
  expect: 幂等，不重复转换
- id: PRC-179-S03
  path: 项目未关联任何已生效的协议（先立项后签约）
  outcome: 无需处理
  covers:
  - 该项目未关联任何已生效的协议
  expect: 不处理；等该项目登记关联或开始执行
- id: PRC-179-S04
  path: 先立项后签约：项目已在执行，协议回签后登记合同—项目关联
  outcome: 协议已转入履行中
  covers:
  - 合同—项目关联已登记
  - 读关联项目是否已开始执行
  expect: 读到关联项目已开始执行，协议直接转入履行中
