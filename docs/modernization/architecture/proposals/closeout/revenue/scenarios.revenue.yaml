# 收入线组验收场景清单（PRC-NN-Sxx；按方法稿第 6 节分支覆盖：每个判断出口、每个超时分支、每个结局至少一条）
# 只写路径与期望结局，Given/When/Then 由测试代理按此展开（CS-5.3）；跨 BC 段只断言本模块并以事件契约衔接（CS-5.5）
PRC-28:
- id: PRC-28-S01
  path: 1→2→3 通过→4 已签发→5 客户书面认可→6
  outcome: 已认可
  covers:
  - 第 3 步「各级校审通过」
  - 第 4 步「签发人执业证书有效」
  - 第 5 步「客户书面认可」
  expect: 发「交付物已认可」，订阅方 B-08、B-05
- id: PRC-28-S02
  path: 3 不通过→2
  outcome: null
  covers:
  - 第 3 步 otherwise
  expect: 回编制；未签发前不得送达
- id: PRC-28-S03
  path: 4 证书失效或专业不符
  outcome: 未签发
  covers:
  - 第 4 步 otherwise
  expect: 拒绝签发并告警（INV-47）
- id: PRC-28-S04
  path: 5 客户书面退回→7→2
  outcome: null
  covers:
  - 第 5 步「客户书面不同意并退回修改」
  expect: 发 AcceptanceReturned；轮次加 1，新送达日重算审查期
- id: PRC-28-S05
  path: 5 约定审查期、期满前无书面异议→8
  outcome: 已声明无异议
  covers:
  - 第 5 步「合同约定审查期且期满前未收到书面异议」
  - 第 5 步超时
  expect: 发「无异议已声明」；交付物无「视为同意」状态
- id: PRC-28-S06
  path: 5 未约定审查期、催签周期到
  outcome: null
  covers:
  - 第 5 步 otherwise
  - 第 5 步超时（催签）
  expect: 提醒项目经理催签认、超期进阶段门预警；不得登记无异议声明
- id: PRC-28-S07
  path: 6 存在阻断性不符合项时登记认可
  outcome: null
  covers:
  - 第 6 步前置 INV-48
  expect: 拒绝并告警
PRC-41:
- id: PRC-41-S01
  path: 1 协议范围含 IDI 检查→2→3→4 协议未到期且仍委托
  outcome: 计划已生效
  covers:
  - 第 1 步「协议范围含 IDI 检查服务」
  - 第 4 步 otherwise
  expect: 检查计划状态为生效；到期提醒由读模型派生，不新增状态
- id: PRC-41-S02
  path: 1 协议范围不含 IDI 检查服务
  outcome: 无需检查计划
  covers:
  - 第 1 步 otherwise
  expect: 不建检查计划，不报错；检查负责人不收待办
- id: PRC-41-S03
  path: 4 协议到期或客户不再委托→5
  outcome: 不再受托
  covers:
  - 第 4 步「协议到期或客户不再委托」
  expect: 计划由生效变为不再受托；不再产生到期提醒
- id: PRC-41-S04
  path: 4 计划到期日前提醒提前量到、到期后仍未委托的逾期提醒周期到
  outcome: null
  covers:
  - 第 4 步超时（提前提醒与逾期提醒）
  expect: 向检查负责人与市场和客户经理发待办；不改计划状态；上游不订阅下游事件，由人工转线索
- id: PRC-41-S05
  path: ContractSigned 事件重复投递
  outcome: null
  covers:
  - 触发事件幂等
  expect: 同一协议、同一事件只产生一条待办，不重复建计划
PRC-42:
- id: PRC-42-S01
  path: 发布检查表模板版本
  outcome: 已生效
  covers:
  - 状态转换 无→已生效
  expect: 发「检查表模板版本已生效」；已安排或已锁定检查所引用的旧版本不变
- id: PRC-42-S02
  path: 修改已被引用的模板版本
  outcome: null
  covers:
  - INV-34b
  expect: 拒绝并告警，只能发布新版本
PRC-43:
- id: PRC-43-S01
  path: 1→2→3→4→5→6→7→8→9
  outcome: 已锁定
  covers:
  - 第 3 步 otherwise
  - 第 5 步 otherwise
  - 第 6 步 otherwise
  expect: 发「检查已锁定」；证据全部封存；检查报告交付物 ID 记入检查
- id: PRC-43-S02
  path: 3 我方为 TIS 且负责人兼项数超过上限→3
  outcome: null
  covers:
  - 第 3 步「我方为 TIS 且负责人兼项数超过上限」
  expect: 拒绝指派并告警（INV-56 / P-44）；换人后重试
- id: PRC-43-S03
  path: 5 有检查项既无结果也无未检原因→5
  outcome: null
  covers:
  - 第 5 步「有检查项既无结果也无未检原因」
  expect: 拒绝提交（INV-55），提示缺项
- id: PRC-43-S04
  path: 6 检查记录有缺项或未检原因不充分→5→6
  outcome: null
  covers:
  - 第 6 步「检查记录有缺项或未检原因不充分」
  expect: 退回检查人员；提交人与审核人为同一人时拒绝审核
- id: PRC-43-S05
  path: 5 现场检查结束后超过记录提交期限
  outcome: null
  covers:
  - 第 5 步超时
  expect: 向检查负责人升级提醒，不中断；不自动提交
- id: PRC-43-S06
  path: 4 无网络现场暂存、联网后补传；上传后尝试修改或删除证据
  outcome: null
  covers:
  - 第 4 步离线采集
  expect: 补传证据同时记设备采集时间与服务端接收时间及内容哈希；修改或删除被拒绝（只追加，intent 141725）
- id: PRC-43-S07
  path: 7 锁定后更正记录；8 封存后修改证据
  outcome: null
  covers:
  - 第 7 步锁定后只追加更正
  - 第 8 步封存
  expect: 更正以追加更正记录生效，原记录不变（INV-55）；封存后的证据修改被拒绝（INV-58）
PRC-44:
- id: PRC-44-S01
  path: 1→2→3→4 不需第三方检测佐证
  outcome: 已发布
  covers:
  - 第 2 步 otherwise
  - 第 3 步 otherwise
  - 第 4 步 otherwise
  expect: 发「不符合项已发布」；送达回执登记为证据（命令缺口见 NOTES）
- id: PRC-44-S02
  path: 4 不符合项属客户资产且需第三方检测佐证→5
  outcome: 已发布并建议外部检测
  covers:
  - 第 4 步「不符合项属客户资产且需第三方检测佐证」
  expect: 外部检测记录为已建议
- id: PRC-44-S03
  path: 2 复核认定发现不成立→6
  outcome: 已关闭
  covers:
  - 第 2 步「复核认定发现不成立」
  expect: 不符合项关闭并写明理由；登记人与复核人为同一人时拒绝复核
- id: PRC-44-S04
  path: 3 未引用任何证据→1
  outcome: null
  covers:
  - 第 3 步「未引用任何证据」
  expect: 拒绝发布并告警（INV-50）；补充证据后重试
- id: PRC-44-S05
  path: 「检查已锁定」事件重复投递
  outcome: null
  covers:
  - 触发事件幂等
  expect: 同一检查只产生一份待办，不重复登记不符合项
PRC-45:
- id: PRC-45-S01
  path: 1→2→3→4 复查通过→5
  outcome: 已闭合
  covers:
  - 第 4 步 otherwise
  - 第 5 步 otherwise
  expect: 发「不符合项已闭合」，闭合引用复查证据
- id: PRC-45-S02
  path: 4 复查未通过→6→2
  outcome: null
  covers:
  - 第 4 步「复查未通过」
  - 第 6 步
  expect: 退回整改，轮次加 1，状态回整改中；未发闭合事件
- id: PRC-45-S03
  path: 4 客户书面接受风险→7
  outcome: 客户书面接受风险
  covers:
  - 第 4 步「客户书面接受风险」
  - 第 7 步
  expect: 无委托人书面确认证据时拒绝登记
- id: PRC-45-S04
  path: 4 确认不再跟踪→8
  outcome: 不再跟踪
  covers:
  - 第 4 步「确认不再跟踪」
  expect: 原因缺失时拒绝
- id: PRC-45-S05
  path: 5 未引用复查或整改证据→3
  outcome: null
  covers:
  - 第 5 步「未引用复查或整改证据」
  expect: 拒绝闭合并告警（INV-50）
- id: PRC-45-S06
  path: 2 整改期限到仍未申报
  outcome: null
  covers:
  - 第 2 步超时
  expect: 向检查负责人发逾期待办（P-23）；不改状态
- id: PRC-45-S07
  path: 4 收到申报后超过复查期限
  outcome: null
  covers:
  - 第 4 步超时
  expect: 向检查负责人升级提醒，不中断
PRC-46:
- id: PRC-46-S01
  path: 1→2→3 出具机构为业主委托机构且内容完整→4
  outcome: 已采信
  covers:
  - 第 3 步「报告出具机构为业主委托机构且内容完整」
  expect: 发「外部检测报告已采信」；报告原件只引用不修改（INV-57）
- id: PRC-46-S02
  path: 3 出具机构非业主委托机构或内容不完整→5
  outcome: 未采信
  covers:
  - 第 3 步 otherwise
  expect: 发「外部检测报告未采信」；原因必填；P-30 预警
- id: PRC-46-S03
  path: 1 超过约定出具期限仍未取得报告
  outcome: null
  covers:
  - 第 1 步超时
  expect: 向检查负责人发待办；不改状态
PRC-47:
- id: PRC-47-S01
  path: 1→2→3→4→5 通过→6 回签
  outcome: 已回签生效
  covers:
  - 第 5 步「审批通过」
  - 第 6 步 otherwise
  expect: 发 ContractSigned，订阅方 B-07、B-08、B-26；回签即生效
- id: PRC-47-S02
  path: 5 驳回→2
  outcome: null
  covers:
  - 第 5 步 otherwise
  expect: 回到起草，修改后重新评审
- id: PRC-47-S03
  path: 5 超过 P5D 未评审
  outcome: null
  covers:
  - 第 5 步超时
  expect: 升级给 SH-M1，非中断，评审仍可继续
- id: PRC-47-S04
  path: 6 客户拒绝回签→2
  outcome: null
  covers:
  - 第 6 步「客户拒绝回签，或依法招标项目与中标承诺实质背离」
  expect: 回起草，不生效
- id: PRC-47-S05
  path: 6 依法招标项目与中标承诺实质背离→2
  outcome: null
  covers:
  - 第 6 步 INV-05
  expect: 拒绝并告警，只能澄清或拒绝
- id: PRC-47-S06
  path: 6 独立性检查有冲突且无书面同意
  outcome: 签约被拒
  covers:
  - 第 6 步 INV-33
  expect: 拒绝回签并告警，不发 ContractSigned
PRC-48:
- id: PRC-48-S01
  path: 1→2→3→4 通过→5→7
  outcome: 新基线已生效
  covers:
  - 第 2 步 otherwise
  - 第 4 步「审批通过」
  expect: 发 ChangeOrderApproved；应用变更后发「新基线已生效」，订阅方 B-08
- id: PRC-48-S02
  path: 2 现场签证→6→7
  outcome: 新基线已生效
  covers:
  - 第 2 步「现场签证事项」
  expect: 发 SiteVisaConfirmed；签证单作证据；按变更 ID 幂等应用
- id: PRC-48-S03
  path: 4 驳回
  outcome: 变更已驳回
  covers:
  - 第 4 步 otherwise
  expect: 变更不生效，基线不变（INV-07）
- id: PRC-48-S04
  path: 7 重复收到同一变更生效事件
  outcome: 新基线已生效
  covers:
  - 第 7 步幂等
  expect: 按变更 ID 幂等，不产生第二个基线
PRC-49:
- id: PRC-49-S01
  path: 1→2→3
  outcome: 索赔已认定
  covers:
  - 第 2 步「对方认定索赔」
  expect: 发 ClaimAsserted、ClaimSettled，登记认定函证据
- id: PRC-49-S02
  path: 2→4
  outcome: 索赔已拒绝或撤回
  covers:
  - 第 2 步「对方拒绝，或我方撤回」
  expect: 登记拒绝函或撤回函，索赔结束
- id: PRC-49-S03
  path: 2 对方尚未答复
  outcome: 已提交待答复
  covers:
  - 第 2 步 otherwise
  expect: 索赔保持已提交，等待对方答复
- id: PRC-49-S04
  path: 2 索赔时限届满前未提出
  outcome: null
  covers:
  - 第 2 步超时
  expect: 临近提醒，超时限提出须注明理由（INV-17），升级给 SH-M1
- id: PRC-49-S05
  path: 2 超过索赔时限且未注明理由
  outcome: null
  covers:
  - 第 2 步 INV-17
  expect: 拒绝提出并告警
PRC-50:
- id: PRC-50-S01
  path: 1→2 审批通过
  outcome: 订单已提交并通过审批
  covers:
  - 第 1 步 otherwise
  - 第 2 步 otherwise
  expect: 占用转用于订单，引用占用 ID
- id: PRC-50-S02
  path: 1 占用被拒
  outcome: 占用被拒
  covers:
  - 第 1 步「占用被拒」
  expect: 发「框架限额占用被拒」，订单不得提交（INV-10）
- id: PRC-50-S03
  path: 2 审批驳回→3
  outcome: 限额已释放
  covers:
  - 第 2 步「审批驳回，或订单被作废或终止」
  expect: 发「限额已释放」
- id: PRC-50-S04
  path: 2 占用有效期满无提交→3
  outcome: 限额已释放
  covers:
  - 第 2 步超时
  expect: 定时释放孤儿占用，中断等待
PRC-51:
- id: PRC-51-S01
  path: 收到 ContractSigned→更新额度
  outcome: null
  covers:
  - 触发 ContractSigned
  expect: 建立可开票额度与履约义务额度，发「可开票额度已更新」
- id: PRC-51-S02
  path: 收到同一协议同一基线的重复事件
  outcome: null
  covers:
  - 幂等
  expect: 按协议 ID 与基线版本幂等，不重复建额度
- id: PRC-51-S03
  path: 收到新基线已生效
  outcome: null
  covers:
  - 触发 新基线已生效
  expect: 按新基线调整额度，累计已开票与已确认不变
- id: PRC-51-S04
  path: 读不到协议或承担法人
  outcome: null
  covers:
  - 失败路径
  expect: 失败并告警，不静默跳过
PRC-52:
- id: PRC-52-S01
  path: 开放一类证据类型
  outcome: null
  covers:
  - 未开放→已开放
  expect: 追加生效版本，发「证据类型已开放」
- id: PRC-52-S02
  path: 对已开放类型重复开放
  outcome: null
  covers:
  - 重复命令
  expect: 拒绝并告警，不产生重复版本
PRC-53:
- id: PRC-53-S01
  path: 收到交付物已认可，证据齐全、类型已开放
  outcome: null
  covers:
  - 触发 交付物已认可
  expect: 占用收入额度并发起收入确认审批；暂不产生确认事实
- id: PRC-53-S02
  path: 收到视为同意已成立（PRC-54 认定）
  outcome: null
  covers:
  - 触发 视为同意已成立
  expect: 同上；业务日期取值见待用户定
- id: PRC-53-S03
  path: 重复收到同一认可事件
  outcome: null
  covers:
  - 幂等
  expect: 同一交付物提交轮次只占用一次、只发起一次审批
- id: PRC-53-S04
  path: 证据类型未开放或证据不全
  outcome: null
  covers:
  - INV-23 失败路径
  expect: 拒绝占用并告警（INV-23）
- id: PRC-53-S05
  path: 额度不足
  outcome: null
  covers:
  - INV-22、86 失败路径
  expect: 拒绝占用并告警；开票、进度估计均不触发本策略
PRC-54:
- id: PRC-54-S01
  path: 1→2 期满、无退回、声明日不早于期满日
  outcome: 视为同意已成立
  covers:
  - 第 1 步 otherwise
  - 第 2 步「期满日前无退回且声明日不早于期满日」
  expect: 追加认定事实并发「视为同意已成立」，触发 PRC-53；交付物不出现「视为同意」状态
- id: PRC-54-S02
  path: 1 期满日前收到客户退回
  outcome: 待办已取消
  covers:
  - 第 1 步「期满日前已收到客户退回」
  expect: 取消期满待办，不认定
- id: PRC-54-S03
  path: 2 声明日早于期满日
  outcome: 视为同意未成立
  covers:
  - 第 2 步 otherwise
  expect: 不认定，不触发收入确认，告警提示
- id: PRC-54-S04
  path: 2 期满待办逾期 P7D 未处理
  outcome: null
  covers:
  - 第 2 步超时
  expect: 升级知会 SH-E6，不自动认定
PRC-56:
- id: PRC-56-S01
  path: 收到交付物已认可，找到付款条件项
  outcome: null
  covers:
  - 触发 交付物已认可
  expect: 标记可结算并发「付款条件项已可结算」，订阅方 B-08
- id: PRC-56-S02
  path: 重复收到同一认可事件
  outcome: null
  covers:
  - 幂等
  expect: 按付款条件项 ID 与提交轮次幂等，不重复发事件
- id: PRC-56-S03
  path: 找不到对应付款条件项
  outcome: null
  covers:
  - 失败路径
  expect: 失败并告警
PRC-57:
- id: PRC-57-S01
  path: 1→2→3 通过→4→6→8
  outcome: 已开具
  covers:
  - 第 3 步「审批通过」
  - 第 4 步 otherwise
  - 第 6 步 otherwise
  expect: 发 InvoiceIssued，同事务改写开票额度（INV-73）；不触发收入确认
- id: PRC-57-S02
  path: 3 审批驳回→5→2 修正后重提
  outcome: null
  covers:
