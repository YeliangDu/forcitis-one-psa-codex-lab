  - 标记资源需求已满足
  expect: 需求转「已满足」，同一需求重复事件幂等
- id: PRC-20-S05
  path: 3 需求不再需要→5
  outcome: 已关闭
  covers:
  - 第 3 步「需求不再需要（范围变更、改外协）」
  - 关闭资源需求
  expect: 须填关闭原因，否则拒绝；需求转「已关闭」
PRC-21:
- id: PRC-21-S01
  path: 未开始 → 进行中 → 已完成
  outcome: null
  covers:
  - 开始阶段
  - 完成阶段
  expect: 发「阶段已开始」「阶段已完成」（仅分析）；阶段节点不记客户认可
- id: PRC-21-S02
  path: 未发布 → 已锁定 → 已作废
  outcome: null
  covers:
  - 锁定工作包
  - 作废工作包
  expect: 发「工作包已锁定」「工作包已作废」（仅分析）；已锁定的只能作废不能删除（INV-42）
- id: PRC-21-S03
  path: 未发布 → 已作废（未发布的删除路径）
  outcome: null
  covers:
  - 作废工作包（未发布）
  expect: 未发布工作包可作废或删除，不涉及工时（INV-42）
- id: PRC-21-S04
  path: 后一阶段先于前一阶段开始，或跳段
  outcome: null
  covers:
  - 阶段并行、倒序、跳段
  expect: 允许，不拦截（S2）；阶段层次不合法时拒绝（INV-41）
PRC-22:
- id: PRC-22-S01
  path: 阶段已完成，且阶段下需客户认可的交付物均已认可
  outcome: null
  covers:
  - 共同出口：交付物已认可
  expect: 无预警
- id: PRC-22-S02
  path: 阶段已完成，但仍有交付物未认可、也无无异议声明
  outcome: null
  covers:
  - 预警：阶段已完成但出口未满足
  expect: 出现门预警并留痕，不拦截下一阶段
- id: PRC-22-S03
  path: 阶段已完成，交付物已送达并已声明无异议
  outcome: null
  covers:
  - 共同出口：已送达并已声明
  expect: 视为满足出口；若 B-08 已认定视为同意，则显示视为同意（读模型派生，交付物无该状态）
- id: PRC-22-S04
  path: 交付物已送达，未约定审查期且超过催签周期仍无回应
  outcome: null
  covers:
  - 预警：催签超期
  expect: 出现催签超期预警；不自动认可，不得登记视为同意
- id: PRC-22-S05
  path: 交付物已送达，合同约定审查期即将届满
  outcome: null
  covers:
  - 预警：审查期将满
  expect: 提示项目经理登记无异议声明；期满判定仍在 B-08
- id: PRC-22-S06
  path: 同一领域事件重复投递
  outcome: null
  covers:
  - 刷新：事件幂等
  expect: 投影结果不变，预警不重复出现
PRC-23:
- id: PRC-23-S01
  path: 1→2→3 审批通过→4→8
  outcome: 已通过
  covers:
  - 第 2 步 otherwise
  - 第 3 步「审批通过」
  - 第 8 步 otherwise
  expect: 发 TimesheetApproved（同 BC 触发 PRC-91）与「工时已过账」（仅分析）；按锁定费率版本提交过账候选
- id: PRC-23-S02
  path: 2 工时所属期间已关账
  outcome: 未提交
  covers:
  - 第 2 步「工时所属期间已关账」
  expect: 人工提交遇已关账期间只提示并拒绝提交，改走冲销或修正（INV-67），不设审批
- id: PRC-23-S03
  path: 2 所记项目已暂停（或已结项、已终止、已取消）
  outcome: 未提交
  covers:
  - 第 2 步「所记项目已暂停、已结项、已终止或已取消」
  expect: 拒记并提示项目状态（INV-39，Q-05）；项目恢复后可记
- id: PRC-23-S04
  path: 2 所记工作包当天无权使用
  outcome: 未提交
  covers:
  - 第 2 步「所记工作包当天无权使用」
  expect: 拒绝提交（INV-66）
- id: PRC-23-S05
  path: 2 当日工时低于最低时数
  outcome: 未提交
  covers:
  - 第 2 步「当日工时低于最低时数」
  expect: 拦截，最低时数取当日标准工时扣减已批准与待批请假；取不到标准工时失败并告警（INV-65）
- id: PRC-23-S06
  path: 3 审批人退回→5→2→3
  outcome: null
  covers:
  - 第 3 步「审批人退回修改」
  expect: 发 TimesheetReturned；工时单可改，重提轮次加 1
- id: PRC-23-S07
  path: 3 审批驳回→6
  outcome: 已驳回
  covers:
  - 第 3 步 otherwise
  expect: 发 TimesheetRejected；终局，不可再提交
- id: PRC-23-S08
  path: 3 员工撤回本轮或取消审批→7
  outcome: 已撤回
  covers:
  - 第 3 步「员工撤回本轮或取消审批」
  - 第 3 步 withdraw
  - 第 7 步
  expect: 审批实例结束，工时单回到草稿，可修改重提
- id: PRC-23-S09
  path: 3 分支审批超过 1 个工作日
  outcome: null
  covers:
  - 第 3 步超时
  expect: 次日提醒审批人，再 1 个工作日升级；仍未处理不自动通过
- id: PRC-23-S10
  path: 8 目标期间已关账（系统自动触账）
  outcome: 已通过
  covers:
  - 第 8 步「目标期间已关账（路由当前开放期间并标原期间，不拒绝）」
  expect: 工时单保持已通过；过账候选路由到该法人当前开放期间并标原期间（INV-92，ADR-0045），不拒绝、不设审批；通知财务核对
- id: PRC-23-S11
  path: 8 缺锁定费率版本
  outcome: 已通过
  covers:
  - 第 8 步「缺锁定费率版本」
  expect: 不得计成本，失败并告警（INV-37）；工时单状态不变
- id: PRC-23-S12
  path: 3 项目经理本人的项目工时（责任人就是提交人）→上提一级审批→4
  outcome: 已通过
  covers:
  - 第 3 步审批人解析：AR-11 责任人就是提交人本人
  expect: 归属对象责任人即提交人，按 AR-11 由其上级（承担部门负责人）审批；审批平台拒绝本人审批本人工时单（segregation）
PRC-24:
- id: PRC-24-S01
  path: 1 暂停→2 恢复
  outcome: 已恢复
  covers:
  - 第 1 步「暂停原因消除且继续履行」
  expect: 发「项目已暂停」「项目已恢复」（仅分析）；恢复后可记工时
- id: PRC-24-S02
  path: 1 暂停→3 终止（已有投入）
  outcome: 已终止
  covers:
  - 第 1 步「不再继续履行且已有投入」
  expect: 发「项目已终止」，B-07 订阅后做终止清算；原因必填
- id: PRC-24-S03
  path: 1 暂停→4 取消（无任何投入）
  outcome: 已取消
  covers:
  - 第 1 步「不再继续履行且无任何投入」
  expect: 发「项目已取消」（B-07 订阅）；原因必填
- id: PRC-24-S04
  path: 1 暂停后保持暂停
  outcome: 已暂停
  covers:
  - 第 1 步 otherwise
  expect: 项目保持暂停，暂停期间拒记工时（INV-39）
- id: PRC-24-S05
  path: 执行中直接 3 终止
  outcome: 已终止
  covers:
  - 触发：直接终止（待 Q09）
  expect: 同 S02 的事件与清算；是否允许不经暂停随 Q09
- id: PRC-24-S06
  path: 执行中直接 4 取消
  outcome: 已取消
  covers:
  - 触发：直接取消（待 Q09）
  expect: 同 S03；是否允许不经暂停随 Q09
- id: PRC-24-S07
  path: 1 暂停后员工提交该项目工时
  outcome: null
  covers:
  - 第 1 步暂停对工时的影响（Q-05）
  expect: PRC-23 第 2 步拒记（只断言工时模块读到暂停状态后拒绝）
PRC-26:
- id: PRC-26-S01
  path: 1→2→3 资料合格
  outcome: 已确认
  covers:
  - 第 3 步「资料合格」
  expect: 发「发包人资料已确认」（仅分析）；收件凭证经 PRC-33 登记
- id: PRC-26-S02
  path: 3 资料有缺陷→4 退回→2
  outcome: null
  covers:
  - 第 3 步 otherwise
  - 第 4 步 otherwise
  expect: 发「发包人资料已退回」；通知项目经理转告发包人补充，补充后再登记提供
- id: PRC-26-S03
  path: 4 缺陷资料影响进度→PRC-32
  outcome: null
  covers:
  - 第 4 步「缺陷资料影响进度且需发包人答复延期」
  expect: 转入延期申请流程，资料退回记录作为事由引用
- id: PRC-26-S04
  path: 1 计划提供日已过仍未收到
  outcome: null
  covers:
  - 第 1 步超时（P-26 计划提供日已过）
  expect: 提醒项目经理催提；不影响资料状态
- id: PRC-26-S05
  path: 第 1 步「登记资料需求」期限届满（计划提供日）
  outcome: null
  covers:
  - 第 1 步超时
  - 登记资料需求
  expect: 按期限升级或提醒 SH-M1（不中断）；未办结前不推进下一步
PRC-27:
- id: PRC-27-S01
  path: 登记 → 应对中 → 已关闭
  outcome: null
  covers:
  - 登记风险与问题
  - 记录应对措施
  - 关闭风险与问题
  expect: 发「风险与问题已登记」「风险与问题已关闭」（仅分析）
- id: PRC-27-S02
  path: 应对中 → 已接受（项目总监，记依据）
  outcome: null
  covers:
  - 接受风险与问题
  expect: 发「风险与问题已接受」；接受人与依据必填（INV-113）
- id: PRC-27-S03
  path: 接受时未记接受人或依据
  outcome: null
  covers:
  - 接受风险与问题前置 INV-113
  expect: 拒绝
- id: PRC-27-S04
  path: 已关闭或已接受后再记应对措施
  outcome: null
  covers:
  - INV-113
  expect: 拒绝；重开须另记一条
- id: PRC-27-S05
  path: 满意度低分经 PRC-37 调登记命令，重复调用
  outcome: null
  covers:
  - 登记风险与问题（系统触发，幂等）
  expect: 按调查 ID 幂等：只登记一条
PRC-28:
- id: PRC-28-S01
  path: 1→2→3 通过→4 已签发→5 客户书面认可→6
  outcome: 已认可
  covers:
  - 第 3 步「各级校审通过」
  - 第 4 步「签发人执业证书有效」
  - 第 5 步「客户书面认可」
  expect: 发「交付物已认可」，订阅方 B-08、B-05
- id: PRC-28-S02
  path: 3 不通过→2
  outcome: null
  covers:
  - 第 3 步 otherwise
  expect: 回编制；未签发前不得送达
- id: PRC-28-S03
  path: 4 证书失效或专业不符
  outcome: 未签发
  covers:
  - 第 4 步 otherwise
  expect: 拒绝签发并告警（INV-47）
- id: PRC-28-S04
  path: 5 客户书面退回→7→2
  outcome: null
  covers:
  - 第 5 步「客户书面不同意并退回修改」
  expect: 发 AcceptanceReturned；轮次加 1，新送达日重算审查期
- id: PRC-28-S05
  path: 5 约定审查期、期满前无书面异议→8
  outcome: 已声明无异议
  covers:
  - 第 5 步「合同约定审查期且期满前未收到书面异议」
  - 第 5 步超时
  expect: 发「无异议已声明」；交付物无「视为同意」状态
- id: PRC-28-S06
  path: 5 未约定审查期、催签周期到→5（继续等待）
  outcome: null
  covers:
  - 第 5 步 otherwise（继续等待，回到本步）
  - 第 5 步超时（催签）
  expect: 提醒项目经理催签认、超期进阶段门预警；不得登记无异议声明
- id: PRC-28-S07
  path: 6 存在阻断性不符合项时登记认可
  outcome: null
  covers:
  - 第 6 步前置 INV-48
  expect: 拒绝并告警
- id: PRC-28-S08
  path: 第 5 步「登记提交轮次送达」期限届满（合同审查期；未约定时 P15D 催签周期）
  outcome: null
  covers:
  - 第 5 步超时
  - 登记提交轮次送达
  expect: 按期限升级或提醒 SH-E2（不中断）；未办结前不推进下一步
- id: PRC-28-S09
  path: 第 5 步出口「客户书面认可（签收单、审查同意意见、邮件确认、阶段签认等）」→ 6
  outcome: null
  covers:
  - 第 5 步「客户书面认可（签收单、审查同意意见、邮件确认、阶段签认等）」
  expect: 走「客户书面认可（签收单、审查同意意见、邮件确认、阶段签认等）」分支，去向 6
- id: PRC-28-S10
  path: 4 签发人执业证书不符→改派签发人→4→5
  outcome: null
  covers:
  - 第 4 步「签发人执业证书无效或专业、等级不符，改派持证签发人」
  expect: 拒绝原签发人签发（INV-47）；改派持证签发人后回到第 4 步重新签发，签发成功后进入送达
- id: PRC-28-S11
  path: 5 客户书面认可→6 存在阻断性不符合项
  outcome: 认可登记被拒
  covers:
  - 第 6 步「存在阻断性不符合项，登记被拒」
  expect: 拒绝登记认可（INV-48）并告警；以「认可登记被拒」结束，不符合项按 PRC-34 处置、关闭后重新登记认可
PRC-30:
- id: PRC-30-S01
  path: 1→2 批准
  outcome: 已批准
  covers:
  - 第 2 步「批准」
  expect: 发「完工估算已批准」（仅分析）；估算不进入收入确认（G-1）
- id: PRC-30-S02
  path: 2 退回→1
  outcome: null
  covers:
  - 第 2 步 otherwise
  expect: 回修改后重新提出，未批准估算不生效
- id: PRC-30-S03
  path: 1 EAC 超过已锁定预算
  outcome: null
  covers:
  - 第 1 步 P-19 预警
  expect: 预警项目总监，不阻断提出
- id: PRC-30-S04
  path: 2 批准人即提出人
  outcome: null
  covers:
  - segregation：提出人与批准人
  expect: 拒绝同一人批准自己提出的估算
PRC-31:
- id: PRC-31-S01
  path: 1→2 归因已填→3 内审通过→4 非发包人原因→6
  outcome: 已关闭
  covers:
  - 第 2 步「归因与影响已填写」
  - 第 3 步「内审通过」
  - 第 4 步 otherwise
  expect: 发「设计变更已发出」（仅分析）；发出回执经 PRC-33 登记；变更关闭
- id: PRC-31-S02
  path: 4 发包人原因且增加工作量→5→6
  outcome: 已关闭
  covers:
  - 第 4 步「发包人原因且增加工作量」
  expect: 标「待主张」或写不主张理由；合同侧协议变更或索赔可引用该变更 ID（P-24）
- id: PRC-31-S03
  path: 2 归因未填写
  outcome: null
  covers:
  - 第 2 步 otherwise
  expect: 拒绝认定并留在本步（INV-54）
- id: PRC-31-S04
  path: 3 内审不通过→1
  outcome: null
  covers:
  - 第 3 步 otherwise
  expect: 回提出人修改后重新认定归因并内审
- id: PRC-31-S05
  path: 3 内审人即提出人
  outcome: null
  covers:
  - segregation：提出人与内审人
  expect: 拒绝同一人提出并内审同一设计变更
- id: PRC-31-S06
  path: 第 4 步之后撤销→第 7 步
  outcome: 已撤销
  covers:
  - 第 4 步 withdraw
  - 撤销设计变更
  expect: 须写撤销原因；原记录保留，状态转撤销终态；重复撤销幂等
PRC-32:
- id: PRC-32-S01
  path: 1→2 发包人书面批准→3
  outcome: 已批准
  covers:
  - 第 2 步「发包人书面批准」
  expect: 发「延期已批准」（仅分析）；批准材料经 PRC-33 登记；项目经理另修订交付计划
- id: PRC-32-S02
  path: 2 发包人书面拒绝→4
  outcome: 已拒绝
  covers:
  - 第 2 步「发包人书面拒绝」
  expect: 发「延期已拒绝」；拒绝材料经 PRC-33 登记
- id: PRC-32-S03
  path: 2 答复期满无书面答复→5
  outcome: 视为批准
  covers:
  - 第 2 步 otherwise
  - 第 2 步超时
  expect: 定时命令登记视为批准，发「延期视为批准」；按延期申请 ID 幂等；通知项目经理
- id: PRC-32-S04
  path: 1 通知期限临近
  outcome: null
  covers:
  - 第 1 步超时（P-25）
  expect: 提醒项目经理按期发出延期通知；超期升级项目总监
- id: PRC-32-S05
  path: 2 说明提交期限临近
  outcome: null
  covers:
  - 第 2 步 notify（P-25）
  expect: 提醒项目经理按期提交详细说明
- id: PRC-32-S06
  path: 5 定时命令重复触发
  outcome: null
  covers:
  - 触发：定时命令重复
  expect: 按延期申请 ID 幂等：只登记一次视为批准，不重复发事件
- id: PRC-32-S07
  path: 第 1 步之后撤销→第 6 步
  outcome: 已撤回
  covers:
