# 命令目录·收入链 VS-03/VS-04 本批聚合（提议稿；结构见 RESPONSIBILITY_MATRIX_SPEC.md B 节）
# authority 取权责表 A；权责表目前只登 AGG-44 占用收入额度一条，其余写待定。proposed: true 为聚合稿尚无、骨架或 NOTES 已用的命令。
commands:
