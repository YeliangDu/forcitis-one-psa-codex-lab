processes:
  - id: PRC-144
    owner_bc: B-31
    triggers:
      - {type: time, name: 入职周年自动登记}
      - {type: human, name: 其他活动人工登记}
      - {type: human, name: 已批准的活动登记取消, entry: 3}
      - {type: human, name: 已完成的活动登记取消, entry: 3}
    outcomes: [已完成, 已取消]
    roles: [{id: SH-E6, as: performer}]
    steps:
      - {actor: system, where: automatic, command: 提交员工活动申请, aggregate: AGG-116}
      - actor: SH-E6
        where: offline
        command: 完成员工活动
        aggregate: AGG-116
        evidence: [活动完成确认]
        permission: 员工活动.完成
        page: 员工活动详情页
        outcome: 已完成
        decision: [{when: otherwise, goto: end}]
      - actor: SH-E6
        where: in_system
        command: 取消员工活动登记
        aggregate: AGG-116
        permission: 员工活动.取消
        page: 员工活动详情页
        audit: true
        outcome: 已取消
        decision:
          - {when: 未填写取消原因, goto: 3}
          - {when: otherwise, goto: end, outcome: 已取消}
