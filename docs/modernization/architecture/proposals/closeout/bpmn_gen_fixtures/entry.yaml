# 多入口：第二个 trigger 的 entry 指向第 3 步；第 2 步为入口且下一步带 branch（审批后接分支步骤）
processes:
  - id: PRC-03
    owner_bc: B-03
    triggers:
      - {type: human, name: 发起甲}
      - {type: human, name: 发起乙, entry: 3}
    outcomes: [甲已办, 乙已办]
    roles: [{id: SH-E5, as: initiator}]
    steps:
      - {actor: SH-E5, where: in_system, command: 办甲, decision: [{when: 走乙线, goto: 2}, {when: otherwise, goto: end, outcome: 甲已办}]}
      - {actor: SH-E5, where: in_system, command: 办丙, branch: 乙线, decision: [{when: otherwise, goto: end, outcome: 乙已办}]}
      - {actor: SH-E5, where: in_system, command: 办乙前, decision: [{when: otherwise, goto: 4}]}
      - {actor: SH-E5, where: in_system, command: 办乙, branch: 乙线, decision: [{when: otherwise, goto: end, outcome: 乙已办}]}
