# 驳回与撤回出口：步骤 1 审批驳回到结束（带 on_reject_outcome）并可撤回到结束；
# 步骤 2 驳回为说明文字；步骤 3 的驳回与撤回已由 decision 画出，不应重复；步骤 4 驳回回到第 1 步、撤回回到第 2 步
processes:
  - id: PRC-03
    owner_bc: B-03
    triggers: [{type: human, name: 发起}]
    outcomes: [已办结, 已驳回, 已撤回, 被拒]
    roles: [{id: SH-E5, as: initiator}]
    steps:
      - {actor: SH-E5, where: in_system, command: 申请甲, approval: {engine: platform.approval, doc_type: 甲审批, on_reject: end, on_reject_outcome: 被拒},
         withdraw: {to: end, outcome: 已撤回}}
      - {actor: SH-E5, where: in_system, command: 申请乙, approval: {engine: platform.approval, doc_type: 乙审批, on_reject: 转移不发生，保持原状态}}
      - {actor: SH-E5, where: in_system, command: 申请丙, approval: {engine: platform.approval, doc_type: 丙审批, on_reject: end, on_reject_outcome: 已驳回},
         withdraw: {to: 1},
         decision: [{when: 审批通过, goto: 4}, {when: 已驳回, goto: end, outcome: 已驳回}, {when: 申请人撤回, goto: 1}]}
      - {actor: SH-E5, where: in_system, command: 申请丁, approval: {engine: platform.approval, doc_type: 丁审批, on_reject: 1},
         withdraw: {to: 2}, decision: [{when: otherwise, goto: end, outcome: 已办结}]}
