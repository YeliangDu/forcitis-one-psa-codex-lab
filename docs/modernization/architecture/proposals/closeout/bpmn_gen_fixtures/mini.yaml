# 生成器测试夹具：覆盖 CONVENTIONS 新字段（triggers、outcomes、timeout、approval、cross_bc、决策转 PRC）。借用目录中的 PRC-03。
processes:
  - id: PRC-03
    owner_bc: B-03
    stages: [VS-01.1]
    triggers:
      - {type: human, name: 人工发起}
      - {type: event, name: 线索已登记}
      - {type: time, name: 每周一到期}
      - {type: call, name: 被报价流程调用}
    outcomes: [已转商机, 已放弃]
    roles:
      - {id: SH-E5, as: initiator}
      - {id: SH-E2, as: approver}
      - {id: SH-C6a, as: external}
    steps:
      - {actor: SH-E5, where: in_system, command: 登记线索, aggregate: AGG-10, permission: 线索.登记, page: 线索编辑页,
         timeout: {after: P5D, escalate_to: SH-E2, interrupting: false},
         cross_bc: [{mode: api, direction: out, bc: B-04, name: 读项目}, {mode: event, direction: out, bc: B-05, name: 线索已登记}]}
      - {actor: SH-E5, where: "external:企业微信", command: 发送跟进提醒, evidence: [企业微信回执],
         decision: [{when: 发送失败, goto: 1}, {when: otherwise, goto: 3}]}
      - {actor: SH-E5, where: offline, command: 拜访客户, evidence: [拜访纪要], reads: [AGG-10],
         approval: {engine: external, doc_type: 客户确认, approver: SH-C6a},
         decision: [{when: 客户无意向, goto: end, }, {when: 转其他流程, goto: PRC-05}, {when: otherwise, goto: 4}]}
      - {actor: system, where: automatic, command: 建立商机, aggregate: AGG-18, outcome: 已转商机,
         cross_bc: [{mode: api, direction: out, bc: B-05, name: 建商机}, {mode: event, direction: in, bc: B-02, name: 忽略}]}
