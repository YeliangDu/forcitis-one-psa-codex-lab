# 通用超时动作自测：独立夹具目录保留 A8 的正向与负向覆盖，不代表现行 IT 需求流程。
catalog:
  - id: PRC-990142
    name: 超时动作自测（生成器夹具）
    timeout_actions:
      - step_command: 关闭 IT 需求
        after: P5D
        command: 关闭 IT 需求
        aggregate: AGG-114
        outcome: 已关闭
        guard: {condition: "有处理结论（INV-120）", goto: 4}
processes:
  - id: PRC-990142
    owner_bc: B-31
    triggers: [{type: human, name: 员工提出 IT 需求}]
    outcomes: [已关闭, 已提醒]
    roles: [{id: SH-E3, as: initiator}, {id: SH-E6, as: performer}, {id: SH-M1, as: informed}]
    steps:
      - {actor: SH-E6, where: in_system, command: 提交 IT 需求, aggregate: AGG-114}
      - actor: SH-E6
        where: in_system
        command: 受理 IT 需求
        aggregate: AGG-114
        timeout: {after: P2D, escalate_to: SH-M1, interrupting: false}
      - {actor: SH-E6, where: in_system, command: 受理 IT 需求, aggregate: AGG-114}
      - {actor: SH-E6, where: in_system, command: 解决 IT 需求, aggregate: AGG-114}
      - actor: SH-E3
        where: in_system
        command: 关闭 IT 需求
        aggregate: AGG-114
        timeout: {after: P5D, escalate_to: system, interrupting: true}
        decision:
          - {when: 无处理结论, goto: 4}
          - {when: 提出人认为未解决, goto: 3}
          - {when: otherwise, goto: end, outcome: 已关闭}
        outcome: 已关闭
