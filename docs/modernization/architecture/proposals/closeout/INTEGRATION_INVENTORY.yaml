# 集成层流程盘点（登记草稿）：process-catalog 新形态 type: integration 的候选条目。
# 说明与证据见 INTEGRATION_INVENTORY.md。本文件不是 process-catalog.yaml 的一部分，id 留空，由 one-architecture 发号。
# 字段：id / name（动宾 ≤12 字）/ type / external_system（集成登记用，领域模块不出现）/ lifespan / direction / feeds / owner_bc / evidence / note
# 附加字段（草稿用，不进目录）：impl（built 已有代码 | designed 仅设计文档 | none 未见证据）、related_prc（目录中相关的现有流程）、decide（需用户或 one-architecture 决定的点）
# lifespan 取值：long_term 长期 | transitional 迁移期过渡；带「(拟)」的表示证据未明文，是起草者的推断。

