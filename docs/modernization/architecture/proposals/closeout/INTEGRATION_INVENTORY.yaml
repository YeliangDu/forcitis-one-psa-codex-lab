    related_prc: []
    reason: 集成层内的人工维护（SourceReferenceController.java、ConfirmSourceReference.java 等），属单聚合维护（来源对照），不是与外部系统的交互。是否进流程目录由 one-architecture 定。
  - name: 按外部主体查找账号（运维只读命令）
    related_prc: []
    reason: IntegrationOperationsCommands 是一次性运维命令，不是业务流程。
