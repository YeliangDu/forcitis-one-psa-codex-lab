  - name: 入职开通企业微信账号并绑定外部身份 / 离职停用企业微信账号并解绑
    related_prc: [PRC-137, PRC-138]
    reason: 是 IT 的人工业务过程，加上新系统内的绑定，WecomGateway 没有创建或停用账号的方法（WecomGateway.java:9-14）。保持原状；外部身份对照表是集成层的数据，不是流程。
