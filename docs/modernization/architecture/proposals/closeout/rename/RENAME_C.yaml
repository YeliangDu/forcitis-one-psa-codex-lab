# RENAME_C：改名对照表第三部分（命令、事件、状态、聚合），提议稿，待用户批准
# 规则：PROCESS_METHOD_DRAFT.md §11（命令=动宾；事件、状态、结局=「已××」；业务对象/聚合=名词，指结果或记录，不用活动名；不以条件开头）。
# 字段：change = rename | keep | follows_object（仅聚合：与所承载对象同名，随 RENAME_A，new 为空）。
#   glossary = registered（new 已在 terms.yaml 登记）| proposed（未登记）| conflict（同名异种类、同名异义）；旧名已登记而改名的，在 glossary_note 里写明。
#   affects_stage_conditions：状态改名后，value-streams.v2.yaml 中引用该状态原值的阶段（按 ref 对象 + state 原值核对）。
#   uncertain: true = 拿不准，需用户或架构会话裁定。
# sources 前缀：rev/fin/ppl = 三组分支 origin/claude/one-arch-{revenue,finance,people}-closeout 上 docs/modernization/architecture/proposals/closeout/<组>/ 下的文件；
#   agg = docs/modernization/architecture/proposals/ENTERPRISE_AGGREGATES_DRAFT.md；map = ENTERPRISE_INFO_MAP_DRAFT.md；evt = docs/modernization/events/；行号为文件行号。
