  - command: 预付款冲抵应付
    from: 已确认
    guard:
    - INV-77a
    - 冲抵后应付余额为零
    reverse_of: null
    to: 已结清
  - command: 预付款冲抵应付
    from: 已部分结清
    guard:
    - INV-77a
    - 冲抵后应付余额大于零
    reverse_of: null
