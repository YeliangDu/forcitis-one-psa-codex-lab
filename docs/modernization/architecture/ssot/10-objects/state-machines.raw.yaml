  - from: 已部分结清
    to: 已部分结清
    command: 核销应付
    guard:
    - 余额大于零
    reverse_of: null
  - from: 已部分结清
    to: 已结清
    command: 核销应付
    guard:
    - 余额为零
    reverse_of: null
