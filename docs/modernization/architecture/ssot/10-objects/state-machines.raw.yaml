    terminal: true
  - name: 已驳回
    terminal: true
  transitions:
  - from: null
    to: 草稿
    command: 起草工时单
    guard:
    - INV-64
    note: 拟命令；已建 Timesheet.draft()
  - from: 草稿
    to: 已提交
    command: 提交工时单
    guard:
    - INV-39
    - INV-64
    - INV-65
  - from: 已退回
    to: 已提交
    command: 提交工时单
    guard:
    - INV-39
    - INV-64
    - INV-65
