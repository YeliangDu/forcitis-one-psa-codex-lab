  type: 决策链角色：发起人 / 决策人 / 经济买方 / 付款方 / 使用者
  key_states: 有效 / 已停用
  relations: N → 1 往来单位；N ↔ N 商机、项目
  rules: 警：已停用联系人仍被在途商机引用
  facts: —
