- id: OBJ-13
  name: 保证金与押金
  definition: 为担保投标、履约或使用而交存、到期退还的款项或开立的保函
  level: 次级（投标或协议）
  type: 性质：投标保证金 / 履约保证金 / 押金；方向：我方交存 / 我方收取；形式：现金 / 保函（用户 2026-10-15 Q23 四项均存在：向分包方收取履约保证金、扣留分包方质保金、我方交存押金、保证金多数以保函形式）
  key_states: 现金：待缴 → 已缴 → 已退 / 被没收（可部分扣减）；保函：已开立 → 已到期 / 被索赔
  relations: N → 1 投标或协议；现金 → 资金收付；现金形态的款项一面可由往来款项类型「现金保证金」承载（OBJ-85），本行保留担保关系与保函，是否进一步并入见 PRIMARY_OBJECT_TEST.md「待确认」
  rules: 拒：退还与没收互斥且各只一次（〔售聚〕I-11）。警：投标保证金超估算价 2%、履约超 10%（条例第 26、58 条）；签约后 5 日未退（第 57 条）
  facts: 已缴 / 已退 / 已没收 → 其他应收（或其他应付）、受限资金（不计现金等价物，GL-051）
