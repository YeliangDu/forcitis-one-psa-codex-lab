- id: OBJ-05
  name: 协议
  definition: 我方与一个或多个相对方之间有约束力的约定；收入合同、分包、采购、劳动合同等都是它的类型
  level: 一级（不依附其他对象）
  type: 项目合同 / 框架协议 / 任务订单 / 协议价目（只定单价的战略协议）/ 分包合同（专业分包、人力外包）/ 采购合同 / 劳动合同；联合体协议 / 劳务派遣协议 / 居间协议 / 租赁合同 / 职业责任保险单（用户 2026-10-15 Q01 选定；内部结算协议未选，见 C-41）。属性：我方在承包链中的位置、是否依法招标中标、签约时双方企业规模、承担法人、最终价款（结算书确认后）
  key_states: 草案 → 审批中 → 已签署 → 已生效（无附生效条件的回签即生效；附生效条件的经确认生效条件满足后生效，GL5-01；基线 1；劳动合同仍为「已签署生效」，供方协议为「已生效」）→ 履行中 → 已完成 → 已结算（结算书经双方确认）/ 已终止（原因必填）；生效后只经协议变更产生新基线；违法分包认定时标「无效」；审批中的「合同评审」是协议审批的单据，不另立对象（完整性检查（intent
    072440），M-20）
  relations: '1 → N 相对方（带身份）；项目合同 ← 0..1 商机（商机 : 合同 = 1 : N）；任务订单 → 1 框架协议；项目合同 → 0..1 协议价目；分包合同 → 1 主协议；劳动合同 → 1 员工、1 法人；← 0..N 结算书（单据）；← N 项目（带属性的关系，见 §2.12）'
  rules: 拒：依法招标的项目合同基线化前完成与中标承诺比对、实质条款不得背离（招标法第 46 条，〔售聚〕I-7）；须有来源（I-8）；框架限额提交审批时占用（I-10）；我方为分包人时对专业分包再分包（用户 2026-10-15 Q02：拒；人力外包是否算再分包另请法务确认）；分包协议须附分包方有效资质、发包方书面同意或合同约定的证据（用户 2026-10-15 Q03：拒；主合同已回签、分包累计金额不超过主协议对应范围两项只预警）；试用期上限（劳动合同法第
    19 条）；（条件：我方为大型企业、对方为中小企业）不得以收到第三方付款或按第三方付款进度为付款条件（中小款项第 9 条，原文已核实；我方规模：用户 2026-10-15 Q04 答小型企业，是否每个法人都是待确认，见 C-42）。警：框架回签后超额；付款期限（中小款项第 9 条：大型企业自交付起 60 日内付款，可另约但须合理；第 10、16、17 条待核）；用工满一个月未签劳动合同
  facts: 已签署 → 新签合同额（按签署日，词表 new_contract_value）；供方协议已生效 → 分包承诺额；协议变更生效 → 合同额变动；已终止 → 终止清算；已结算 → 最终交易价格、结算折让（原 OBJ-15）
  source: 行：BIZBOK p92、p195；CAS 14 第五、七条；GF0209；招标法第 31、46、48 条；勘设条例第 19、20 条。用：i202939、i205406、i210513。证：〔售证〕§6（5,247 份）、§10（采购 1,181 份，委外 388）
  term: 有 contract、framework_agreement、task_order；分包、采购、劳动合同无；联合体协议、劳务派遣协议、居间协议、租赁合同、职业责任保险单无（内部结算协议词表已有，见 C-41）
  scope: 本系统；项目合同 6a，分包与采购 6d，劳动合同 6e
  parent_text: —
  parent: []
  group: 协议与往来单位
  source_line: 63
  freeze:
    class: 确认建模
