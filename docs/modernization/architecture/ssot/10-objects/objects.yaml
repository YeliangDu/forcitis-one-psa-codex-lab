- id: OBJ-66
  name: 工时单
  definition: 员工 × 填报期间的工时集合（含工时条目：某工作日对工作包、商机或间接事项的小时），是提交、审批、锁定单位
  level: 次级（员工）
  type: 工时类别：项目 / 售前 / 间接（由归集对象决定）；条目带分类属性：有效 / 无效 / 返工 / 可计费（原 OBJ-67）；所用编号规则版本（迁入单为空，one-data TS-UNIQ）；归集对象还含线索、客户、客户活动（OBJ-105）（完整性检查（intent 072440），N-19）
  key_states: 草稿 → 已提交（含审批中）→ 已通过 / 已退回 / 已驳回（驳回、退回后改原单再提交，不设取消终态）；撤回是转换（已提交 → 草稿，事件 TimesheetApprovalWithdrawn），不是状态；已过账属 Phase 2；关期后只能冲销或修正（one-data TS-UNIQ 审查，intent 052923）
  relations: 1 员工 × 1 期间 → 1；1 → N 条目；条目 → 1 工作坐标、锁定的费率版本
  rules: 拒：只能记到当天有权使用的工作包；已结项项目不得记；缺费率不得计成本。一人一日一单：全状态唯一、含非工作日、不设取消终态（用户 intent 052923，改写 Q15）；最低时数等填报义务交 one-rules 取证后定，定之前不实现拦截（intent 052923）
  facts: 已通过 → 工时；已过账 → 人工成本（交易类型 TS）、售前投入
  source: 行：Deltek tkMaster。用：T+1 审批（INTENT）。证：一人一日一单，近 24 个月 121,453 张（〔交证〕§13）
  term: 有·需调整 timesheet（标 document）；有 time_entry
  scope: 本系统；Phase 2（状态机已建）
