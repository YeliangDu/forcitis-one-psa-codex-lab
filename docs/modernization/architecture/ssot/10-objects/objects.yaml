- id: OBJ-68
  name: 请假
  definition: 员工申请在某些日期或时段不出勤
  level: 次级（员工）
  type: 假期类型（天数按城市配置）
  key_states: 草稿 → 审批中 → 已批准 / 已驳回 → 已销假 / 已撤销
  relations: N → 1 员工；扣减假期额度
  rules: 拒：超过可用额度
  facts: 请假小时（可用产能、算薪输入）
  source: 行：年休假条例第 3 条。证：请假档案 24,260（〔交证〕§15）
  term: 无
  scope: 本系统；6e。本系统管（one-architecture 2026-10-16，供 RULE-398/403/404/405 与 one-data；用户 Q36/R2 定考勤原始记录首版建，D-5 定请假与加班 BC B-27，带考勤来源防腐层）。粒度为起止时刻（可跨日、可半天或按小时），时长以分钟整数存；跨日按各日「标准工时」（OBJ-28 标准工时版本）拆分到日，非工作日计 0；状态沿用
    草稿 → 审批中 → 已批准 / 已驳回 → 已销假 / 已撤销。与工时的关系：最低时数扣减「已批准 + 待批」请假，15 小时上限只计已批准（用户定，RULE-398 等）；已销假、已撤销不扣减；请假日仍占一人一日一单名额（工时单可自愿提交）。最小申请单位、各假期类型可否按小时由假期类型配置承载（规则卡定值）
