- id: OBJ-11
  name: 合同—项目关联
  definition: 【行号保留，已非对象】一份协议与一个项目的对应及其收入、成本分配规则
  level: 非对象：协议与项目之间带属性的关系（分配方式、比例或金额、生效期），不单独成对象
  type: 分配方式：合同范围条目挂 WBS，按挂接自动归属（用户 2026-10-15 Q12；关联上不登记比例或金额）
  key_states: 已生效 → 已失效（带生效期）
  relations: N 协议 ↔ N 项目
  rules: 拒：同一对关联生效期不重叠。比例与金额不再登记（Q12），原「分配合计 = 100%」规则不适用；未挂接 WBS 的合同范围条目如何归属，留第 6 步（C-50）
  facts: 决定收入、成本、工时在协议与项目间的归属
  source: '用：i210513。〔评一〕H2。证：取证的 1 : 1 是 A8 字段结构所致（〔交证〕§2）'
  term: 无
  scope: 本系统；6a
  parent_text: —
  parent: []
  group: 协议与往来单位
  source_line: 69
