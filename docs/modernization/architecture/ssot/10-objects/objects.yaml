- id: OBJ-07
  name: 付款条件项
  definition: 约定何时有权开票与收款的节点
  level: 次级（协议）
  type: 预付 / 进度 / 结算 / 质保金 / 按量（UNIT_RATE）；首付款「到期且不可撤销」标注（A5）
  key_states: 待生效 → 已生效 → 可结算 → 被取代 / 已作废
  relations: N → 1 协议；N ↔ N 履约义务（Q21 暂不定）；→ N 开票申请；质保金条款的扣留与返还形成往来款项（类型质保金，原 OBJ-14）
  rules: 拒：同一条款累计开票不超过条款金额。警：到期未开票
  facts: 可结算 → 可开票额度（不产生收入）
  source: 用：A5（〔GLD〕D17-6）。行：CAS 14 第四十一条。证：条款 9,454 条、平均 5.2 个（〔交证〕§3）
  term: 有·需调整 contract_clause（兼作履约义务，G-21）
  scope: 本系统；6a
  parent_text: OBJ-05
  parent:
  - OBJ-05
  group: 协议与往来单位
  source_line: 65
  freeze:
    class: 确认建模
- id: OBJ-08
  name: 履约义务
  definition: 合同中向客户转让可明确区分服务的承诺；收入确认的锚点
  level: 次级（协议：项目合同、任务订单）
  type: 履约时点类型：时点（A1）/ 时段（备用）
  key_states: 未履行 → 已部分履行 → 已履行
  relations: N → 1 协议；N ↔ N 付款条件项；← N 收入确认；分摊交易价格
  rules: 拒：累计确认不超过分摊的交易价格；只凭客户认可证据确认（ADR-0016 决定 4；证据范围见 Q22，C-44）
  facts: 已履行（部分）→ 收入、合同资产 / 合同负债变动、合同履约成本转出
  source: 行：CAS 14 第九至十三条。用：A1（〔GLD〕GL-026）。〔评一〕B2
  term: 有 performance_obligation、transaction_price
  scope: 本系统；6a（收入 Phase 4） 【定论：从属对象，由父对象流程承载（OBJ-05 协议）】
  parent_text: OBJ-05
  parent:
  - OBJ-05
  group: 协议与往来单位
  source_line: 66
  freeze:
    class: 并入 OBJ-07（合并后名称暂名，待用户确认页；用户 2026-10-19「履约义务就是条款」）
    owner: OBJ-07
- id: OBJ-09
  name: 协议变更
  definition: 经双方批准的范围、价格或工期修改
  level: 次级（协议）
  type: 合同变更（补充协议）/ 分包变更 / 采购变更（增减量 / 部分取消）/ 签证；会计处理三类（CAS 14 第八条）
  key_states: 已提出 → 影响评估 → 审批 → 已生效（新基线）/ 驳回
  relations: N → 1 协议；← 0..N 设计变更、延期申请
  rules: 拒：生效后不可改，只能再变更；「协议信息更正」（名称、附件）只留痕、不动基线
  facts: 已生效 → 合同额、交易价格变动（含违约金认定）
  source: 行：CAS 14 第八条；GF0209 第 11 条。用：i210513（保留签证、索赔）。证：A8 变更 1,178 单、无版本历史（〔售证〕§7）
  term: 有·需调整 change_order（标 document）；有 supplemental_agreement、site_visa、contract_modification
  scope: 本系统；6a，分包变更 6d
  parent_text: OBJ-05
  parent:
  - OBJ-05
  group: 协议与往来单位
  source_line: 67
