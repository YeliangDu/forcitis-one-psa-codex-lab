  type: 例行 / 定期 / 专项定期 / 鉴定配合 / IDI 阶段 / 尽调走查 / 改造前评估 / 复查；我方法律角色（用户 2026-10-15 Q30 四种均有）：IDI 风险管理机构（TIS）/ TIS 的幕墙与照明专项分包顾问 / 保险公司或业主直接委托的技术顾问 / 以施工或检测资质作法定定期检查人或鉴定配合方；补施工期类型（完整性检查（intent 072440），N-16 /
    M-11）：厂检、试验旁站、巡查、实测实量测评、淋水试验、交付测评、资源考察、二次考察 / 二次复查；受检位置作检查的「部位」属性，交付测评的房屋抽样清单作检查的单据；不建 OBJ-47、48 实例（只为 IDI，R5）；第三方试验结果落证据（外部报告），OBJ-52 不扩；检查表模板是否用于交付测评随第 6 步通用模型细化
