- id: OBJ-35
  name: 交付物
  definition: 按协议交给客户的成果：设计文件、检查与评估报告、使用维护手册等；报告是它的类型；内部成果（复盘、价值总结）不是交付物，见 OBJ-107（完整性检查（intent 072440），N-14）
  level: 次级（项目，挂 WBS 阶段）
  type: 设计文件 / 检查与评估报告 / 尽调报告 / 使用维护手册（沪幕墙第 16 条）；补类型（完整性检查（intent 072440），N-15）：咨询研究报告（可研、对标调研、规划布局评估）、造价成果（估算、概算、预算、清单、控制价、结算书、投资控制策略）、审核与评审报告（评标、考察、图纸与施工资料审核、灯具与样板评审）、答疑回复函、培训材料；审图结论 A / B / C 三态作结论值；PMU
    试验旁站报告落本对象（M-11）；属性「外发限制」，外发申请为审批单据，随 Q33 项目级访问控制（M-16）
  key_states: '编制中 → 内审中 → 已签发（报告类）→ 已交付（签收）→ 审查中 → 已认可 / 退回修改（轮次 +1）/ 已声明（项目经理登记的无异议声明：期满前未收到发包人书面异议，附往来函件检索记录，声明人与复核人按 ADR-0047 U-2；交付侧登记事实，与「已交付（签收）/ 审查中」并列；送达、退回也记在交付侧；期满判定在 receivables.wip；「视为同意」不是交付物状态，由
    reporting 读模型派生显示，delivery.acceptance 不读、不订阅 receivables.wip；客户书面同意属认可，即「已认可」（ADR-0047 第 1 类），不是「已声明」；D-8，用户 2026-10-16，intent 061232；按 D-8 字面订正，ADR-0049 评审；状态名与事件「无异议已声明」一致，PR #320）；被取代 / 撤回（原因必填）/
    已作废；结项归档时已发布成果「已封存」'
  relations: N → 1 项目（阶段）；1 → N 提交轮次、N 设计文件版本；报告 → N 不符合项（类型客户资产，原发现；签发时快照）；设计文件的编号与版本规则挂在交付物上（设计文件版本是单据，原 OBJ-36）
  rules: 拒：已发布报告不得修改或删除，只能出新版本并引用被取代版本；签发人须具备约定资格。警：审查期届满（GF0209 8.1）；已封存者不得抽撤、涂改（检测办法第 26 条参照，原 OBJ-43 规则并入）
  facts: 已认可 → 收入确认的证据（客户认可证据五类见 §2.7，用户 2026-10-15 Q22）；已交付 → 按期交付度量
  source: 行：GF0209 第 7、8 条；沪TIS 第 8 条；检测办法第 21 条（参照，推断）。证：成果单 0 行（〔交证〕§6–7）。〔评一〕Medium（统一状态机）
  term: 有·需调整 deliverable、acceptance_record（无签收、审查、签发）
