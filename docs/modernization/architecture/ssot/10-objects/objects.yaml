objects:
- id: OBJ-01
  name: 往来单位
  definition: 与我方有、将有或曾有协议或往来的法律主体或个人；客户、供应商等共用一份档案；含上级单位（自关联，原集团 OBJ-04 并入）
  level: 一级（不依附其他对象）
  type: 主体类型：企业 / 事业单位 / 政府机关 / 个人；组成：银行账户、税务登记、企业规模；开票信息（开票名称、税号、地址电话、开户行）作往来单位属性（完整性检查（intent 072440），M-20）
  key_states: 待核实 → 有效（档案已核实）→ 已合并 / 已停用；档案按 D17 版本化；「正式往来单位」= 状态为「有效」（intent 120544 P-3）
  relations: 1 → 0..N 角色（OBJ-02）、N 联系人、0..1 上级单位（自关联；原集团）；← N 协议（作相对方）
  rules: 拒：已停用或已合并的单位不得新建协议与付款；统一社会信用代码查重。警：银行账户变更后首笔付款
  facts: — （「往来单位已合并」事件）
  source: 行：BIZBOK p587 Partner（Part 8 行业模型，只作旁证）；Deltek Clendor。用：i205406（共用档案分角色）、i210513（提前到 6a 之前）、i202939（按集团汇总）。证：〔售证〕§9、§10。并入集团：一级对象检验
  term: 无（只有 customer）
  scope: 本系统；6a 之前
  parent_text: —
  parent: []
  group: 协议与往来单位
  source_line: 59
  freeze:
    class: 确认建模
- id: OBJ-02
  name: 往来单位角色
  definition: 往来单位对我方承担的业务角色及其准入状态（第一层；项目内身份是第二层，见 §2.2）
  level: 次级（往来单位）
  type: 客户；供应商（分包方 / 外包方 / 采购供应商 / 劳务派遣单位 / 出租方 / 审计机构；出租方、审计机构为 STKH-05、STKH-03）；合伙人；渠道伙伴；联合体伙伴；海外持牌伙伴（四项均为业务角色，用户 2026-10-15 Q05）；金融机构（开户行、保函开立行、资金监管银行，STKH-04）；主管机关（税务、社保等，不设准入状态，STKH-08）；客户角色属性「客户类型」：开发商
    / 自用业主 / 既有建筑业主 / 发包方 / 资本方（一个往来单位一个客户类型，变更留痕，STKH-07）；客户角色的「客户分级」同时承载客户信用评级（Q18 暂不定）；供应商角色属性含合作评价，评价单据挂供方履约确认（OBJ-87）（完整性检查（intent 072440），M-20）
  key_states: 已申请 → 合格 → 已暂停 → 已停用（原因必填；适用需准入的角色：供应商、合伙人、渠道伙伴、联合体伙伴、海外持牌伙伴）；客户角色无准入状态，往来单位档案已核实即可用（intent 120544 P-3）
  relations: 1 往来单位 → 0..N 角色；客户角色带客户分级
  rules: 拒：未合格或已停用的供应商角色不得签分包、采购协议或付款。警：资质临近到期
  facts: —
  source: 行：BIZBOK p84、p587（Part 8 行业模型，只作旁证）（Customer、Partner 是两个一级概念，共用档案是用户决定 + Deltek 佐证，〔评二〕H2）。用：i205406。〔干系人〕
  term: 有 customer、customer_tier；其余无
  scope: 本系统；客户、供应商 6a 之前，其余随所属阶段
  parent_text: OBJ-01
  parent:
  - OBJ-01
  group: 协议与往来单位
  source_line: 60
  freeze:
    class: 确认建模
