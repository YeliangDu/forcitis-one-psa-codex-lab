meta:
  node: 01 干系人
  code: '01'
  name: 干系人
  version: V2
  status: frozen
  owner: one-coordinator（导入并认可）；维护者 用户
  frameworks:
  - BIZBOK v11 §2.8（p.270 stakeholder≠role、p.274 Type/Category/Specific）
  - TOGAF G178
  - TOGAF 10 C220 Part 0 §4.75 p.65 与 Part 2 §3.4 p.36–39（stakeholder = individual/team/organization；模板 stakeholder map 列职能部门与岗位）；ArchiMate 3.2 §6.2.1 p.65（stakeholder = the role of an individual, team,
    or organization）；BIZBOK v11 §2.8 p.266（stakeholder 高于 role、以个体表示更具体）——用于 2026-10-20 客户侧条线登记
  id_scheme: SH-<类><序号>（条线：SH-<类><序号>-L<条线序号>，host 指向法人）
  sources:
  - 用户桌面 架构锚定-2026-10-19/01-干系人/SSOT.yaml v11.1（2026-10-20），经 one-coordinator 审核导入为 V2
  - 本目录为仓库内唯一来源（intent 2026-10-19-223711）
  decisions:
  - 用户 2026-10-19：我们没有外部审计（不设外部审计机构干系人）
  - 用户 2026-10-19：合伙人分两类——持股合伙人归股东；不持股、享受分红者列人力资源的合伙人
  - 外部审计与收入证据闸门：已由 ADR-0056（2026-10-17 采纳）定为无法定年审时由财务负责人书面确认并留档、逐类开放（intent 2026-10-17-121025），不再待核
  open_reconciliation:
  - STKH-04 金融机构（我方开户及融资银行）、STKH-05 出租方：用户曾在 STKH 页同意补，本版未含，待用户确认保留或放弃
  version_note: V1：用户 v10（2026-10-19）；V2：用户 v11.1（2026-10-20，客户侧对接条线 13 条），导入时保留 V1 的用户决定
criteria:
  三层: Type（3）→ Category（6）→ Specific（25）；family 是标签，不是层
  角色: stakeholder ≠ role（p.266）；角色与项目参与方是维度
  关系: 触发 / 参与阶段 / 接受价值；反推关系须标 basis
