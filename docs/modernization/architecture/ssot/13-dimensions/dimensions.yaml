# 分析维度登记（手写；sonnet 起草，one-architecture 定稿）。口径：「维度」只指分析维度；版本化主数据表不是维度。
# slices 按总线矩阵格子对应 FACT；pending 为待定，not_dimensions 为判定不是分析维度的候选。
meta:
  status: proposal
  reviewed_by: one-architecture（sonnet 起草；总线矩阵 103 个 ✔ 格脚本逐格比对 slices 全部对上、— 格无误登记；term 为空的 5 条已登记用语问题交 one-glossary，2026-10-21）
  note: 分析维度登记：总线矩阵 10 个维度列各一条 DIM；「维度」只指分析维度，DIMENSION_VERSIONED 表称版本化主数据表，不叫维度（one-glossary 结论）。
  slices_rule: slices 按总线矩阵格子（该列该行为 ✔）→ 该行行名 → facts.yaml 中 sources.bi_row 等于行名的 FACT（含经营事实与分析事实）；对不上的行 facts 留空并列入 pending。「—」格不列。
  scd_rule: scd.source 为 null 的一律写「未定」；版本方式只引文件已写的依据。
  metric_oat_rule: 39 个 OAT 字面均为度量原语、组合表达式或占位符，无一与总线矩阵列名相同，故各维度 sources.metric_oat 为空，字面全部列入 not_dimensions 或 pending。
  inputs:
  - docs/modernization/architecture/ssot/13-dimensions/dimensions.raw.yaml
  - docs/modernization/architecture/ssot/12-facts/facts.yaml
  - docs/modernization/architecture/ssot/10-objects/objects.yaml
  - docs/modernization/glossary/terms.yaml
  - docs/modernization/BI_SCOPE.md
  - docs/modernization/r0/METRIC_BASELINE_DRAFT.md
