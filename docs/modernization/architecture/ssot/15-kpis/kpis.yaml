# 指标登记（手写；sonnet 起草，one-architecture 定稿）。三套口径（基线 M-xx、词表 kind=metric、愿景 KPI）并列对照，口径冲突进 decided 待用户答复；2026-10-22 用户答复 KPI-20261022-085652-r54 已写入，decided 记录各条的决议与去向。
# retired 只收基线 §4 原文写「废弃 / 并入」的老叫法，它们不在 48/79/16 之内。
meta:
  status: decided
  reviewed_by: one-architecture（sonnet 起草；覆盖核对 48/79/16 全部落到 KPI、decided 或 retired；KPI-90、KPI-91 属 kernel 与平台作业调度，改标技术度量，2026-10-22；用户答复 KPI-20261022-085652-r54 已写入（2026-10-22））
  note: 指标登记：三套（基线 48 个 M-xx、词表 kind=metric 79 条、愿景 16 个 KPI）的对照；不裁定口径。KPI-01～KPI-16 沿用愿景编号，其余自 KPI-17 起；KPI-95～KPI-108 为用户答复与设计方自定后新增。
  counts:
    kpis: 112
    decided: 15
    retired: 8
    by_status: {user_decided: 7, design_decided: 5, glossary_decided: 3}
    baseline: 48
    glossary: 79
    vision: 16
  inputs:
  - docs/modernization/architecture/ssot/15-kpis/metrics.raw.yaml
  - docs/modernization/architecture/ssot/15-kpis/GAPS.md
  - docs/modernization/architecture/ssot/12-facts/facts.yaml
  - docs/modernization/architecture/ssot/13-dimensions/dimensions.yaml
  - docs/modernization/glossary/terms.yaml
  - docs/modernization/r0/METRIC_BASELINE_DRAFT.md
  - docs/modernization/architecture/ssot/04-goals/vision.yaml
  rules:
    partition: 三套每一条恰好落在 kpis（作为 baseline、term 或 vision_kpi）、decided.items 或 retired.items 之一（decided 为决议记录，其条目可同时对应 kpis 里新登记的指标）；baseline 的 M-xx 拆成多个 KPI 时，首个带 aliases，其余只写 baseline
    dimensions_rule: dimensions 取 dimensions.yaml 中 slices 同时覆盖该 KPI 全部 facts 的维度；facts 为空则为空
    facts_rule: facts 只在 facts.yaml 的事实与指标来源明显对应时列出，不明确的留空
    kind_rule: 愿景 KPI：定义或来源明写阶段出口、切换、入口条件的标出口条件，其余标业务指标；词表与基线条目一律业务指标
    answers: 关注点 CON 人工层，暂空
