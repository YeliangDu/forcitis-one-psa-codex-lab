decided:
- id: NU-01
  title: 利用率：分子是什么
  status: user_decided
  answer: 主指标取词表写法（可计费工时 ÷ 可用工时），另设两个有名字的变体：含商机工时的利用率、按有效工时算的利用率
  note: 选 0。但请指定主指标：内部饱和度看板用「按有效工时算的利用率」做主指标，「可计费利用率」只用于与同行基准比较。理由是你自己引的依据——AIA 手册说直接工时「不论是否已开票，含总价项目」；而词表的可计费口径只认按工时计费合同，总价项目多的团队会被系统性低估。三个数各有名字是对的，但报表上必须标明各自适用场景，否则又变成「三个数不知道看哪个」。
  source: KPI-20261022-085652-r54（KPI-Q01）
  items:
    baseline:
    - M-42
    glossary:
    - utilization_rate
