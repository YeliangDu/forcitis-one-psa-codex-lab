  - ref: 补休转计薪
    text: 读取本 BC 当月 PRC-178 登记的补休转加班工资（到期未休、离职），转计薪时长 × 加班工资基数折算的时薪 × 200% 计入加班费（劳动法第四十四条、工资支付暂行规定第十三条）；已计入结算的登记不重复计；加班工资基数取不到，结局为「已中止」，不静默按零
