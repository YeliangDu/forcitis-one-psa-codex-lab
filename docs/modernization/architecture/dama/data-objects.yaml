# 数据对象（DAMA-DMBOK2R）。ID = DO-<模块>-<对象>；tables 只引用数据访问注册表键作分组（全部 50 个键各归一处），负责 BC 由 schema 推导、不另存（ADR-0040 接缝 4）；category 取 SESSION_PLAYBOOK §14.1 D17 细则第 1 条七类之一。
# 初稿：2026-10-15 由 sonnet 子代理归并；category 为推断（注册表尚无此字段），拿不准的见各条 category_basis。维护：one-architecture。
meta:
  generated: '2026-10-15'
  basis: origin/main
  category_definition: SESSION_PLAYBOOK.md §14.1 D17 细则第 1 条：交易、事实、审计、技术、主数据（被单据、事实或授权按 ID 引用的业务实体及其关系）、参考数据（受控代码表）、配置（参数、模板、决策表、日历、费率）；拿不准按更严的一类
  refs: 'tables→backend/architecture/data-access-registry.yaml 键；sensitive_columns→backend/architecture/data-classification.txt（schema.table.column: 级别）'
  note: 本草稿的 category 是依据细则的推断，不是注册表里已登记的值；注册表尚无 category 字段。当前 reference 类 0 条，fact 类 0 条（1a 尚无事实表）
