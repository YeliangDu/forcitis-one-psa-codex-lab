# 流程清单（BPMN 2.0.2）。ID = BPMN process key；status：built（有可执行 BPMN）/ documented（只有流程梳理文档）。流程只编排人工步骤（GUIDING_PRINCIPLES §4）。
# 初稿：2026-10-15 由 sonnet 子代理抽取；documented 流程的 id 为拟定。维护：one-architecture。
meta:
  generated: '2026-10-15'
  basis: origin/main
  scope: runtime BPMN = backend/src/main/resources/processes/*.bpmn20.xml（不含 src/test/resources 的夹具）；documented = docs/modernization/process/1a/*.md 描述但没有 BPMN；contract.md 是行为契约汇总，不是流程，未列入
  legacy_note: 审批通用流程.md 还描述了老系统 10 个 bpm 流程定义（TIMESHEET、PM_ETC、OPP_QUOTATION 等），属老系统现状，新系统尚未建，未逐个列为 documented
processes:
- id: cost_timesheet_approval
  name: 工时审批
  file: backend/src/main/resources/processes/cost_timesheet_approval.bpmn20.xml
  bc: cost.timesheet
  process_key: backend/src/main/java/com/forcitis/one/cost/timesheet/api/TimesheetApprovalProcess.java（KEY = ProcessKey.of("cost_timesheet_approval")，值即 BPMN id）
  owner_runtime: platform.approval（引擎与指派）；发起模块 cost.timesheet（经 DocumentSubmittedForApproval 事件）
  structure: 子流程 reviewStage（审核）内：包容网关 reviewFork 按路由旗标分叉 → 三个并行用户任务 → 包容网关 reviewJoin 汇合；每节点为会签（multiInstance，一个候选人一个任务，全部通过）
  user_tasks:
  - id: projectManagerReview
    name: 项目经理审批
    assignment:
      mechanism: BPMN 扩展属性 forcitis:assignmentRule
      type: FORM_FIELD_USERS
      field: projectManagerId
      routingFlag: projectHours
      skipWhenEmpty: true
      autoApproveRepeat: true
      deadlineWorkdays: 1
      escalationWorkdays: 1
      resolver: AssigneeResolver.collect → AssignmentRule.FormFieldUsers
  - id: orgUnitHeadApproval
    name: 部门负责人审批
    assignment:
      mechanism: BPMN 扩展属性 forcitis:assignmentRule
      type: FORM_FIELD_USERS
      field: orgUnitHeadId
      routingFlag: preSalesHours
      skipWhenEmpty: true
      autoApproveRepeat: true
      deadlineWorkdays: 1
      escalationWorkdays: 1
      resolver: AssigneeResolver.collect → AssignmentRule.FormFieldUsers
  - id: supervisorReview
    name: 一级汇报人审批
    assignment:
      mechanism: BPMN 扩展属性 forcitis:assignmentRule
      type: INITIATOR_SUPERVISOR
      level: 1
      routingFlag: overheadHours
      skipWhenEmpty: true
      autoApproveRepeat: true
      deadlineWorkdays: 1
      escalationWorkdays: 1
      resolver: AssigneeResolver.collect → AssignmentRule.InitiatorSupervisor
  assignment: 每个用户任务恰一条 forcitis:assignmentRule（属性由 NodePolicyReader 读入 NodePolicy）；候选人由纯函数 AssigneeResolver.resolve 算出，BPMN 里 multiInstance 集合为 ${approverResolution.apply(execution)}；规则类型取值：ROLE / DEPARTMENT_HEAD
    / INITIATOR_SUPERVISOR / FORM_FIELD_USERS（本流程只用后两种之一：FORM_FIELD_USERS、INITIATOR_SUPERVISOR）；无 DMN（D-1a-100/122）
  routing_flags_set_by_code: Timesheet.java 目前只设置 PROJECT_HOURS 一个旗标（backend/src/main/java/com/forcitis/one/cost/timesheet/domain/Timesheet.java:137），preSalesHours / overheadHours 两路 BPMN 已建但代码尚未置旗标
  doc: docs/modernization/process/1a/TIMESHEET审批.md
  doc_general: docs/modernization/process/1a/审批通用流程.md
  status: built
  evidence: backend/src/main/resources/processes/cost_timesheet_approval.bpmn20.xml:11 与 backend/src/main/java/com/forcitis/one/platform/approval/infrastructure/flowable/NodePolicyReader.java
