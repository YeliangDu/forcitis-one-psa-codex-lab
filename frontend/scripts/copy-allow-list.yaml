# Words that may appear in UI copy without being business terms (用户 2026-10-14：允许清单只放非业务词，如「确定」「取消」「加载中」).
# A word with business meaning does not belong here: register it in backend/glossary/proposed/frontend-ui.yaml instead.
# Copy is cut into these words and registered terms (longest match first); whatever is left over fails scripts/check-copy-glossary.mjs.
# A one-character word is only a connector: it must stand between two words (的, 和, 或 ...), never start or end a text or sit next to another connector.
# A phrase that starts with a one-character word (请重新, 已被) is therefore listed whole, and a state such as 已认领 is a registered term.
# `standalone` lists the values that may be a whole text by themselves.
standalone:
  - 是
  - 否
