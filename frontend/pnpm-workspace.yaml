packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: false
  core-js-pure: false
  esbuild: true
  unrs-resolver: true
catalog:
  antd: ^5.29.3
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ~5.9.3
  vite: ^7.3.7
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
