name: Lab 63 isolated V2 recovery without resend
on:
  push:
    branches: [codex/63-descendant-proof]
    paths: [.github/workflows/lab-63-v2-recovery.yml]
permissions:
  contents: read
jobs:
  acceptance:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.ref == 'refs/heads/codex/63-descendant-proof'
    name: Lab 63 V2 ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            source: 77e872e8ba9661d3294d3a9337c8e5c956b70641
          - variant: candidate
            source: 47e263825afb62a1b860915f8293da79572d12f6
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ACCEPTANCE_HEAD: f38f597e35ca1bbe503ec8925d9ff4d08789542d
      PRODUCT_BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      SOURCE_COMMIT: ${{ matrix.source }}
      MANIFEST_SHA256: 06ada5fa8d0dc872e4f6f4a3aa359a0f6c58bc3b41cd5c25efa50a4f3f06de77
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f38f597e35ca1bbe503ec8925d9ff4d08789542d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only frozen tests and exact source pins
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$ACCEPTANCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_BASE"
          test ! -e .git/merge-queue
          test ! -e .codex/hooks.json
          test -z "$(git config --local --get-regexp '^http\..*extraheader$' || true)"
          python3 -I -B - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path,PurePosixPath
          root=Path("scripts/session/codex_lab/p2_v2_recovery_acceptance").resolve(strict=True)
          p=root/"manifest.json"
          assert p.resolve(strict=True)==p
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ["MANIFEST_SHA256"]
          m=json.loads(raw)
          for name,digest in m["files_sha256"].items():
              rel=PurePosixPath(name)
              assert not rel.is_absolute() and ".." not in rel.parts and str(rel)==name
              f=root/name
              assert f.resolve(strict=True)==f and f.is_file()
              assert hashlib.sha256(f.read_bytes()).hexdigest()==digest
          paths=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines()
          assert paths==sorted("scripts/session/codex_lab/p2_v2_recovery_acceptance/"+p for p in ["manifest.json",*m["files_sha256"]])
          PYCODE
      - name: Verify V2 reservation and exact readback without external network or credentials
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lab63-evidence"; mkdir -m 700 "$evidence"
          home="$RUNNER_TEMP/lab63-home"; mkdir -m 700 "$home"
          printf 'A=%s\nB=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nmanifest_sha256=%s\nrunner=%s\n' \
            "$ACCEPTANCE_HEAD" "$PRODUCT_BASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MANIFEST_SHA256" "$RUNNER_ENVIRONMENT" > "$evidence/identity.txt"
          exact_b="$RUNNER_TEMP/lab63-v2-source"; mkdir -m 700 "$exact_b"
          git archive "$SOURCE_COMMIT" scripts/merge | tar -x -C "$exact_b"
          git ls-tree -r "$SOURCE_COMMIT" -- scripts/merge > "$evidence/source-tree.txt"
          while read -r mode type oid path; do
            test "$type" = blob
            test -f "$exact_b/$path" && test ! -L "$exact_b/$path"
            test "$(git hash-object --no-filters "$exact_b/$path")" = "$oid"
          done < "$evidence/source-tree.txt"
          /usr/bin/git --version > "$evidence/git-version.txt"
          printf "source_commit=%s\n" "$SOURCE_COMMIT" > "$evidence/source.txt"
          before="$(readlink /proc/self/ns/net)"
          rc=0
          sudo -n /usr/bin/unshare --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs -- \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$home" TMPDIR="$home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            GITHUB_ACTIONS=true GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXACT_B_SOURCE_ROOT="$exact_b" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" LAB63_EVIDENCE="$evidence" \
            HOST_NET_NS="$before" MANIFEST_SHA256="$MANIFEST_SHA256" \
            /bin/bash --noprofile --norc -eu -o pipefail -c '
              test "$(id -u)" -ne 0
              test "$(readlink /proc/self/ns/net)" != "$HOST_NET_NS"
              test "$(ip -o link show | wc -l)" -eq 1
              ip -o link show | grep -Eq "^[0-9]+: lo:"
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              printf "network_namespace=isolated\nprivilege=non-root,no-new-privs\ncredentials=allowlisted-environment\n" > "$LAB63_EVIDENCE/isolation.txt"
              /usr/bin/python3 -I -B scripts/session/codex_lab/p2_v2_recovery_acceptance/test_v2_unknown_no_resend.py -v > "$LAB63_EVIDENCE/runner.stdout" 2> "$LAB63_EVIDENCE/runner.stderr"
            ' || rc=$?
          printf '%s\n' "$rc" > "$evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab63-v2-${{ matrix.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab63-evidence/
          if-no-files-found: error
          retention-days: 7
