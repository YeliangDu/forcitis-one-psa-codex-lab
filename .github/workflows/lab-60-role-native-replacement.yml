name: Lab targeted hosted witness
on:
  push:
    branches: [codex/60-role-native-replacement]
permissions:
  contents: read
jobs:
  repeat:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SUBJECT: 091c1e31fd1e33f29904c82d771f1e9d3d02979a
      BASE_SHA: bf853c2c6ce5cb3e72172330d34aecdc75f0a331
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 091c1e31fd1e33f29904c82d771f1e9d3d02979a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Pin exact input and bootstrap
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          mkdir -p "$RUNNER_TEMP/lab-repeat"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$BASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/lab-repeat/identity.txt"
          docker info > /dev/null
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts)
          bash scripts/codegen/generate_api.sh -C
      - name: Repeat controlled fixture and full payroll scenario in fresh forks
        working-directory: backend
        run: |
          set -euo pipefail
          ./mvnw -B -C test-compile -Djacoco.skip=true
          for iteration in 1 2 3; do
            output="$RUNNER_TEMP/lab-repeat/$iteration"
            mkdir -p "$output"
            ./mvnw -B -C surefire:test -Dtest=BonusLoginPreparationTest -Dtest.forks=1 -Djacoco.skip=true
            cp target/surefire-reports/TEST-com.forcitis.one.acceptance.BonusLoginPreparationTest.xml "$output/unit.xml"
            ./mvnw -B -C failsafe:integration-test failsafe:verify -Dit.test=BonusInputNoFallbackIT \
              -Dspring.datasource.hikari.minimum-idle=1 -Dit.forks=1 -Djacoco.skip=true -Dtest.fork.timeout=420
            cp target/failsafe-reports/TEST-com.forcitis.one.organization.payroll.BonusInputNoFallbackIT.xml "$output/integration.xml"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-targeted-repeat-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-repeat/
          if-no-files-found: error
