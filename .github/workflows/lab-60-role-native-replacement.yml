name: Lab 33 exact schema-only privilege bypass evidence
on:
  push:
    branches: [codex/60-role-native-replacement]
permissions:
  contents: read
env:
  LAB_HEAD: c50d189dd87fabcd9d0559622ac75ef694f635bc
  LAB_MODE: green
  LAB_BASE: b01d2b8a076f9cd1a9ec012d69ec2cacd0dcf354
jobs:
  acceptance:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.event.repository.id == 1449415666 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c50d189dd87fabcd9d0559622ac75ef694f635bc
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact actual CLI guard behavior in temporary copies
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab-33-schema-only"
          mkdir -p "$d"
          test "$(git rev-parse HEAD)" = "$LAB_HEAD"
          git merge-base --is-ancestor "$LAB_BASE" "$LAB_HEAD"
          printf '%s\n' "$LAB_HEAD" > "$d/head"
          set +e
          if test "$LAB_MODE" = red; then
            python3 -B -m unittest discover -s scripts/guards -p db_scripts_schema_only_bypass_selftest.py -v > "$d/tests.log" 2>&1
          else
            python3 -B -m unittest discover -s scripts/guards -p 'db_scripts_schema_only*_selftest.py' -v > "$d/tests.log" 2>&1
          fi
          status=$?
          set -e
          cat "$d/tests.log"
          python3 -B - "$d" "$status" <<'PYTHON'
          import json,os,re,sys
          from pathlib import Path
          d=Path(sys.argv[1]);rc=int(sys.argv[2]);s=(d/'tests.log').read_text()
          mode=os.environ['LAB_MODE']
          assert 'SETUP BLOCKED' not in s and not re.search(r'^ERROR:',s,re.M)
          if mode=='red':
              assert rc==1 and re.search(r'Ran 2 tests\b',s) and 'FAILED (failures=2)' in s
              assert 'SECURITY RED: guard accepted an executable schema-only privilege bypass' in s
              assert 'AssertionError:' in s
          else:
              assert mode=='green' and rc==0 and re.search(r'Ran 8 tests\b',s) and s.rstrip().endswith('OK')
          record=dict(verified=True,head=os.environ['LAB_HEAD'],base=os.environ['LAB_BASE'],mode=mode,run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],tests=2 if mode=='red' else 8,failures=2 if mode=='red' else 0,errors=0,skipped=0)
          (d/'verdict.json').write_text(json.dumps(record,indent=2)+'\n')
          print(record)
          PYTHON
      - name: Preserve existing database alignment self-test
        if: env.LAB_MODE == 'green'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab-33-schema-only"
          python3 -I scripts/guards/db_scripts_aligned.py --self-test 2>&1 | tee "$d/existing-selftest.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-33-schema-only-bypass-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-33-schema-only/
          if-no-files-found: error
