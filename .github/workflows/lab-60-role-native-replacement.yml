name: Lab exact scope publish regression
on:
  push:
    branches: [codex/60-role-native-replacement]
permissions:
  contents: read
jobs:
  observe:
    if: github.event.repository.id == 1449415666
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUBJECT: e2be921db691cac6f1e0bb60734c388905baf4ce
      BASE: c0d54a72a203e2df365b6690cc29585b46f39c99
      MODE: green
      SELECTOR: StandardHoursScopeSerializationIT,StandardHoursPublishGapsIT#losingTheRaceIsAConflict
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e2be921db691cac6f1e0bb60734c388905baf4ce
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Bind exact input and compile on runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE" "$SUBJECT"
          d="$RUNNER_TEMP/publish-scope"
          mkdir -p "$d"
          printf 'head=%s\nbase=%s\nmode=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$BASE" "$MODE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$d/identity.txt"
          docker info >/dev/null
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts)
          bash scripts/codegen/generate_api.sh -C
          (cd backend && ./mvnw -B -C test-compile -Djacoco.skip=true)
      - name: Run scoped integration acceptance in fresh forks
        working-directory: backend
        run: |
          set -euo pipefail
          count=1
          if test "$MODE" = green; then count=3; fi
          d="$RUNNER_TEMP/publish-scope"
          failed=0
          for i in $(seq 1 "$count"); do
            mkdir -p "$d/$i"
            rm -rf target/failsafe-reports
            set +e
            ./mvnw -B -C failsafe:integration-test failsafe:verify "-Dit.test=$SELECTOR" \
              -Dspring.datasource.hikari.minimum-idle=1 -Dit.forks=1 \
              -Djacoco.skip=true -Dtest.fork.timeout=420 > "$d/$i/failsafe.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$d/$i/exit-code"
            if test -d target/failsafe-reports; then cp target/failsafe-reports/*.xml "$d/$i/" || true; fi
            grep -E 'Tests run:|\[ERROR\]|40P01' "$d/$i/failsafe.log" | tail -40 || true
            if test "$rc" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-publish-scope-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-scope/
          if-no-files-found: error
