name: Lab 45 branch lifecycle hosted acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/session/codex_lab/lab_branch*
      - scripts/merge/mq_lab_operator.py
      - .github/workflows/lab-45-branch-lifecycle-ci.yml
permissions:
  contents: read
jobs:
  branch-lifecycle:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/45-branch-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run frozen branch lifecycle acceptance
        id: frozen
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          dest="$RUNNER_TEMP/lab-45-branch-lifecycle"
          mkdir -p "$dest"
          python3 -B - "$dest/verdict.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          root = Path("scripts/session/codex_lab")
          entries = sorted(root.glob("*branch*lifecycle*selftest.py"))
          assert entries, "frozen branch lifecycle test file missing"
          suite = unittest.TestLoader().discover(str(root), pattern="*branch*lifecycle*selftest.py")
          def case_ids(item):
              if isinstance(item, unittest.TestSuite):
                  return [name for child in item for name in case_ids(child)]
              return [item.id()]
          selected = case_ids(suite)
          assert len(selected) == len(set(selected)) == 8
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          verdict = {
              "head": os.environ["SUBJECT"],
              "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "tests": result.testsRun,
              "selected": selected,
              "failures": [{"name": t.id(), "detail": e} for t, e in result.failures],
              "errors": [{"name": t.id(), "detail": e} for t, e in result.errors],
              "skipped": [t.id() for t, _ in result.skipped],
              "expected_failures": [t.id() for t, _ in result.expectedFailures],
              "unexpected_successes": [t.id() for t in result.unexpectedSuccesses],
              "frozen_test_sha256": {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in entries},
          }
          Path(sys.argv[1]).write_text(json.dumps(verdict, indent=2) + "\n")
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not
                           (result.skipped or result.expectedFailures or result.unexpectedSuccesses) else 1)
          PY
      - name: Run affected canonical Lab queue regressions
        env:
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/lab-45-branch-lifecycle"
          python3 -B -m unittest discover -s scripts/merge -p 'mq_lab_*selftest.py' -v \
            2>&1 | tee "$dest/affected-queue.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$dest/affected-queue.log"
      - name: Run additive V2 handoff acceptance
        if: ${{ !cancelled() && steps.frozen.outcome == 'success' }}
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          dest="$RUNNER_TEMP/lab-45-branch-lifecycle"
          python3 -B - "$dest/v2-verdict.json" <<'PY'
          import hashlib, json, os, sys, unittest
          from pathlib import Path
          root = Path("scripts/session/codex_lab")
          name = "lab_branch_handoff_v2_selftest.py"
          assert hashlib.sha256((root / name).read_bytes()).hexdigest() == "4dbffa666495a1aeaf433fc4a06c36752cf4ffe46d118e5b8a5a770b6a3180bc"
          suite = unittest.TestLoader().discover(str(root), pattern=name)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = dict(head=os.environ["SUBJECT"], base=os.environ["BASE_SHA"],
                        run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                        tests=result.testsRun,
                        failures=[dict(name=t.id(), detail=err) for t,err in result.failures],
                        errors=[dict(name=t.id(), detail=err) for t,err in result.errors],
                        skipped=[t.id() for t,_ in result.skipped],
                        expected_failures=[t.id() for t,_ in result.expectedFailures],
                        unexpected_successes=[t.id() for t in result.unexpectedSuccesses])
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(0 if result.testsRun == 6 and result.wasSuccessful()
                           and not (result.skipped or result.expectedFailures or result.unexpectedSuccesses) else 1)
          PY
      - name: Run native PR list and detail acceptance
        if: ${{ !cancelled() && steps.frozen.outcome == 'success' }}
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          dest="$RUNNER_TEMP/lab-45-branch-lifecycle"
          python3 -B - "$dest/native-pr-verdict.json" <<'PY'
          import hashlib, json, os, sys, unittest
          from pathlib import Path
          root = Path("scripts/session/codex_lab")
          name = "lab_branch_native_pr_selftest.py"
          assert hashlib.sha256((root / name).read_bytes()).hexdigest() == "190bb5772d1ea2b63e75bcb8c6ce9bfe422aef2a5d48cc3980c63d26dbbcc2f8"
          suite = unittest.TestLoader().discover(str(root), pattern=name)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = dict(head=os.environ["SUBJECT"], base=os.environ["BASE_SHA"],
                        run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                        tests=result.testsRun,
                        failures=[dict(name=t.id(), detail=err) for t,err in result.failures],
                        errors=[dict(name=t.id(), detail=err) for t,err in result.errors],
                        skipped=[t.id() for t,_ in result.skipped],
                        expected_failures=[t.id() for t,_ in result.expectedFailures],
                        unexpected_successes=[t.id() for t in result.unexpectedSuccesses])
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(0 if result.testsRun == 6 and result.wasSuccessful()
                           and not (result.skipped or result.expectedFailures or result.unexpectedSuccesses) else 1)
          PY
          python3 -B - "$dest/native-ci-verdict.json" <<'PYCODE'
          import hashlib, json, os, sys, unittest
          from pathlib import Path
          root = Path("scripts/session/codex_lab")
          name = "lab_branch_native_ci_selftest.py"
          assert hashlib.sha256((root / name).read_bytes()).hexdigest() == "ec52af46fc0d861beb45557e9a2b2250a78065118745284244b1649a2b6ef114"
          suite = unittest.TestLoader().discover(str(root), pattern=name)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = dict(head=os.environ["SUBJECT"], base=os.environ["BASE_SHA"],
                        run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                        tests=result.testsRun,
                        failures=[dict(name=t.id(), detail=err) for t,err in result.failures],
                        errors=[dict(name=t.id(), detail=err) for t,err in result.errors],
                        skipped=[t.id() for t,_ in result.skipped],
                        expected_failures=[t.id() for t,_ in result.expectedFailures],
                        unexpected_successes=[t.id() for t,_ in result.unexpectedSuccesses])
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n")
          raise SystemExit(0 if result.testsRun == 9 and result.wasSuccessful()
                           and not (result.skipped or result.expectedFailures or result.unexpectedSuccesses) else 1)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-45-branch-lifecycle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-45-branch-lifecycle/
          if-no-files-found: error
  branch-lifecycle-native-ordinary:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/45-branch-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      SUBJECT: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reacquire pinned historical native evidence without uploading logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          python3 -I -B - "$RUNNER_TEMP/native49" <<'PYCODE'
          import hashlib,io,json,subprocess,sys,zipfile
          from pathlib import Path
          d=Path(sys.argv[1])
          d.mkdir(mode=0o700)
          repo="repos/YeliangDu/forcitis-one-psa-codex-lab"
          idx=bytes.fromhex("")
          assert hashlib.sha256(idx).hexdigest()=="5aa17ed20cd38f90938ffae15beb054663dcb49ad9777f0db3c32d973eecbafd"
          i=json.loads(idx)
          def fetch(suffix):
              flags=["--allow-escape-sequences"] if suffix.endswith("/logs") else []
              return subprocess.check_output(["gh","api",*flags,repo+suffix],timeout=50)
          def seal(name,raw):
              if hashlib.sha256(raw).hexdigest()!=i["hashes"][name]:
                  raise SystemExit("HOLD: native evidence bytes differ at "+name)
              (d/name).write_bytes(raw)
          (d/"index.json").write_bytes(idx)
          seal("1-receipt-before-rerun.zip",bytes.fromhex(""))
          seal("recorded-manifest.json",bytes.fromhex(""))
          for n,pre,check in ((1,128829353927,128835788948),(2,128836938207,128842867752)):
              r=f"/actions/runs/42512786544/attempts/{n}"
              for suffix,name in ((r,"attempt.json"),(r+"/jobs?per_page=100","jobs.json"),
                                  (f"/actions/jobs/{pre}/logs","preflight-job.log"),
                                  (f"/actions/jobs/{check}/logs","verification-job.log")):
                  seal(f"{n}-{name}",fetch(suffix))
          for label,aid in (("receipt",13631459192),("preflight",13631730354)):
              stem=f"/actions/artifacts/{aid}"
              seal("2-"+label+"-artifact.json",fetch(stem))
              seal("2-"+label+".zip",fetch(stem+"/zip"))
          with zipfile.ZipFile(d/"2-preflight.zip") as z:
              seal("2-plan.json",z.read("plan.json"))
          raw=subprocess.check_output(["git","show",i["head"]+":"+i["workflow_path"]])
          seal("exact-workflow.yml",raw)
          assert {p.name for p in d.iterdir()}==set(i["hashes"])|{"index.json"}
          print("Historical fixture recovered byte-for-byte; no current PR authority.")
          PYCODE
      - name: Run the 21 frozen acceptance methods
        env:
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab45-native-ordinary-evidence"
          mkdir -m 700 "$d"
          export LAB45_NATIVE49_DIR="$RUNNER_TEMP/native49"
          python3 -B - "$d" <<'PYCODE'
          import hashlib,json,os,sys,unittest
          from pathlib import Path
          d=Path(sys.argv[1])
          root=Path("scripts/session/codex_lab")
          files=json.loads(bytes.fromhex(""))
          markers=json.loads(bytes.fromhex(""))
          suite=unittest.TestSuite()
          for name,sha in files.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
              suite.addTests(unittest.TestLoader().discover(str(root),pattern=name))
          assert suite.countTestCases()==21
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          proof=dict(head=os.environ["SUBJECT"],base=os.environ["BASE_SHA"],run=os.environ["GITHUB_RUN_ID"],
                     attempt=os.environ["GITHUB_RUN_ATTEMPT"],tests=r.testsRun,failures=len(r.failures),
                     errors=len(r.errors),skipped=len(r.skipped),
                     unexpected=len(r.expectedFailures)+len(r.unexpectedSuccesses),
                     failing_methods=[t.id().rsplit(".",1)[1] for t,_ in r.failures],
                     matched_markers=sorted(m for m in markers if any(m in e for _,e in r.failures)),
                     historical_readonly=True,real_native_rerun_proved=False,release_authority=False)
          correct=(proof["tests"]==21 and not (proof["errors"] or proof["skipped"] or proof["unexpected"]))
          if correct and r.wasSuccessful():
              proof["classification"]="frozen-suite-green"
              code=0
          elif correct and proof["failures"]==9 and set(proof["matched_markers"])==set(markers):
              proof["classification"]="exact-frozen-behavior-red"
              code=1
          else:
              proof["classification"]="unexpected-result-or-capability-hold"
              code=86
          (d/"result.json").write_text(json.dumps(proof,indent=2)+"\n")
          print(json.dumps(proof))
          raise SystemExit(code)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab45-native-ordinary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab45-native-ordinary-evidence/
          if-no-files-found: warn
          retention-days: 5
