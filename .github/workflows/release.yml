name: release

# Builds the release bundle of a commit on main that ci already passed, and attaches it to a GitHub Release.
# Runbook: docs/modernization/phase1a/infra/runbooks/RELEASE.md
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, e.g. 0.1.0 or 0.1.0-rc.1; the tag v<version> is created on the commit'
        required: true
      commit:
        description: 'Full commit sha on main (empty = current head of main)'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft (deploy only accepts published releases)'
        type: boolean
        default: true

permissions:
  contents: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release bundle
    runs-on: [self-hosted, forcitis-one]
    timeout-minutes: 60
    steps:
      - name: resolve version and commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_DRAFT: ${{ inputs.draft }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"; commit="$TAG_SHA"; draft=true
          else
            version="$INPUT_VERSION"; commit="$INPUT_COMMIT"; draft="$INPUT_DRAFT"
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.target.outputs.commit || 'main' }}
          fetch-depth: 0

      - name: commit is on main and passed ci
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          . scripts/release/lib.sh
          release_version_valid "$VERSION" || { echo "version '$VERSION' must match $RELEASE_VERSION_PATTERN" >&2; exit 1; }
          python3 scripts/release/ci_passed.py --self-test
          python3 scripts/release/manifest.py --self-test
          git fetch -q origin main
          sha="$(git rev-parse HEAD)"
          python3 scripts/release/ci_passed.py "$sha"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; versions are never rebuilt" >&2
            exit 1
          fi
          tagged="$(git ls-remote --tags origin "refs/tags/v$VERSION^{}" "refs/tags/v$VERSION" | awk 'NR == 1 || /\^\{\}$/ { sha = $1 } END { print sha }')"
          if [ -n "$tagged" ] && [ "$tagged" != "$sha" ]; then
            echo "tag v$VERSION points at $tagged, not at $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: build bundle
        env:
          DEV_VITE_WECOM_CORP_ID: ${{ vars.DEV_VITE_WECOM_CORP_ID }}
          DEV_VITE_WECOM_AGENT_ID: ${{ vars.DEV_VITE_WECOM_AGENT_ID }}
          DEV_VITE_SSO_PORTAL_URL: ${{ vars.DEV_VITE_SSO_PORTAL_URL }}
          DEV_TARO_APP_WECOM_CORP_ID: ${{ vars.DEV_TARO_APP_WECOM_CORP_ID }}
          PROD_VITE_WECOM_CORP_ID: ${{ vars.PROD_VITE_WECOM_CORP_ID }}
          PROD_VITE_WECOM_AGENT_ID: ${{ vars.PROD_VITE_WECOM_AGENT_ID }}
          PROD_VITE_SSO_PORTAL_URL: ${{ vars.PROD_VITE_SSO_PORTAL_URL }}
          PROD_TARO_APP_WECOM_CORP_ID: ${{ vars.PROD_TARO_APP_WECOM_CORP_ID }}
          VERSION: ${{ steps.target.outputs.version }}
        run: scripts/release/build.sh --version "$VERSION" --out "$RUNNER_TEMP/release"

      - name: bundle verifies after a round trip through tar
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: scripts/release/verify_bundle.sh "$RUNNER_TEMP/release/forcitis-one-$VERSION.tar.gz"

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.proof.outputs.sha }}
          DRAFT: ${{ steps.target.outputs.draft }}
        run: |
          flags=(--title "FORCITIS one $VERSION" --target "$SHA" --notes "Commit $SHA. Bundle and SHA256 built by the release workflow run $GITHUB_RUN_ID; see docs/modernization/phase1a/infra/runbooks/RELEASE.md.")
          [ "$DRAFT" != true ] || flags+=(--draft)
          case "$VERSION" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" "${flags[@]}" \
            "$RUNNER_TEMP/release/forcitis-one-$VERSION.tar.gz" \
            "$RUNNER_TEMP/release/forcitis-one-$VERSION.tar.gz.sha256"

      - if: always()
        run: rm -rf "$RUNNER_TEMP/release"
