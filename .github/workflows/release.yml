name: release

# Builds the release bundle of a commit on main that ci already passed, signs a release statement for it and attaches both to a GitHub
# Release. Only started by hand from main: the signing key is available to main only, and deploy.yml checks the statement names this
# workflow on refs/heads/main.
# Runbook: docs/modernization/phase1a/infra/runbooks/RELEASE.md
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, e.g. 0.1.0 or 0.1.0-rc.1; the tag v<version> is created on the commit'
        required: true
      commit:
        description: 'Full commit sha on main (empty = current head of main)'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft (deploy only accepts published releases)'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: release bundle
    if: github.ref == 'refs/heads/main'
    # Dedicated runner and user: nothing a pull-request job left on the CI runners can reach this build (RELEASE.md §10)
    runs-on: [self-hosted, forcitis-one-deploy]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.proof.outputs.sha }}
    steps:
      - name: validate inputs
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "version '$INPUT_VERSION' is not MAJOR.MINOR.PATCH[-rc.N]" >&2; exit 1; }
          [[ -z "$INPUT_COMMIT" || "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be empty or a full sha" >&2; exit 1; }
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$INPUT_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.target.outputs.commit || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: commit is a first-parent commit of main and its push ci run succeeded
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          sha="$(git rev-parse HEAD)"
          python3 scripts/release/ci_passed.py --self-test
          python3 scripts/release/ci_passed.py "$sha"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; versions are never rebuilt" >&2
            exit 1
          fi
          if tagged="$(python3 scripts/release/ci_passed.py --tag-commit "v$VERSION" 2>/dev/null)" && [ "$tagged" != "$sha" ]; then
            echo "tag v$VERSION points at $tagged, not at $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: toolchain (pinned and verified downloads, nothing shared with the CI runners)
        run: scripts/release/toolchain.sh build "$RUNNER_TEMP/toolchain"

      - name: build bundle with fresh Maven and pnpm caches
        env:
          DEV_VITE_WECOM_CORP_ID: ${{ vars.DEV_VITE_WECOM_CORP_ID }}
          DEV_VITE_WECOM_AGENT_ID: ${{ vars.DEV_VITE_WECOM_AGENT_ID }}
          DEV_VITE_SSO_PORTAL_URL: ${{ vars.DEV_VITE_SSO_PORTAL_URL }}
          DEV_TARO_APP_WECOM_CORP_ID: ${{ vars.DEV_TARO_APP_WECOM_CORP_ID }}
          PROD_VITE_WECOM_CORP_ID: ${{ vars.PROD_VITE_WECOM_CORP_ID }}
          PROD_VITE_WECOM_AGENT_ID: ${{ vars.PROD_VITE_WECOM_AGENT_ID }}
          PROD_VITE_SSO_PORTAL_URL: ${{ vars.PROD_VITE_SSO_PORTAL_URL }}
          PROD_TARO_APP_WECOM_CORP_ID: ${{ vars.PROD_TARO_APP_WECOM_CORP_ID }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          scripts/release/build.sh --version "$VERSION" --out "$RUNNER_TEMP/release" --isolated-caches "$RUNNER_TEMP/caches"
          scripts/release/verify_bundle.sh "$RUNNER_TEMP/release/forcitis-one-$VERSION.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/release/forcitis-one-${{ steps.target.outputs.version }}.tar.gz
            ${{ runner.temp }}/release/forcitis-one-${{ steps.target.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - if: always()
        run: rm -rf "$RUNNER_TEMP/release" "$RUNNER_TEMP/caches"

  # The release signing key is a secret of the `release` environment, whose deployment branch policy admits main only (RELEASE.md §11)
  publish:
    name: sign and publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, forcitis-one-deploy]
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/publish

      - name: bundle unchanged since the build job
        working-directory: ${{ runner.temp }}/publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: shasum -a 256 -c "forcitis-one-$VERSION.tar.gz.sha256"

      - name: sign the release statement
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "environment release lacks RELEASE_SIGNING_KEY (RELEASE.md §7 R-12)" >&2; exit 1; }
          key_dir="$(mktemp -d "$RUNNER_TEMP/sign.XXXXXX")"
          trap 'rm -rf "$key_dir"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_dir/key")
          archive="$RUNNER_TEMP/publish/forcitis-one-$VERSION.tar.gz"
          statement="$RUNNER_TEMP/publish/forcitis-one-$VERSION.release"
          scripts/release/statement.sh write "$archive" "$statement"
          scripts/release/statement.sh sign "$statement" "$key_dir/key"
          cat "$statement"

      - name: publish GitHub Release
        working-directory: ${{ runner.temp }}/publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "FORCITIS one $VERSION" --target "$SHA"
                 --notes "Commit $SHA. Built and signed by release run $GITHUB_RUN_ID; see docs/modernization/phase1a/infra/runbooks/RELEASE.md.")
          [ "$DRAFT" != true ] || flags+=(--draft)
          case "$VERSION" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" "${flags[@]}" "forcitis-one-$VERSION.tar.gz" "forcitis-one-$VERSION.tar.gz.sha256" \
            "forcitis-one-$VERSION.release" "forcitis-one-$VERSION.release.sig"

      - if: always()
        run: rm -rf "$RUNNER_TEMP/publish"
