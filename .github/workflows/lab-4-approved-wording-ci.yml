name: Lab 4 approved wording hosted acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - frontend/apps/web/src/modules/workforce/pages/*acting*wording.test.tsx
      - .github/workflows/lab-4-approved-wording-ci.yml
permissions:
  contents: read
jobs:
  wording:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lab/4-workforce'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUBJECT: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies and export exact-head API
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          mkdir -p "$RUNNER_TEMP/lab-4-wording"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$BASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/lab-4-wording/identity.txt"
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts) 2>&1 | tee "$RUNNER_TEMP/lab-4-wording/install.log"
          bash scripts/codegen/generate_api.sh -C 2>&1 | tee "$RUNNER_TEMP/lab-4-wording/api.log"
      - name: Run frozen wording and scope assertions
        working-directory: frontend/apps/web
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/modules/workforce/pages/employee-acting-wording.test.tsx \
            src/modules/workforce/pages/personnel-command-acting-wording.test.tsx \
            --reporter=verbose --reporter=json \
            --outputFile.json="$RUNNER_TEMP/lab-4-wording/vitest.json" \
            2>&1 | tee "$RUNNER_TEMP/lab-4-wording/vitest.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-4-approved-wording-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-4-wording/
          if-no-files-found: error
