name: Lab owned runtime integration
on:
  push:
    branches: [codex/60-owned-runtime-integration]
    paths: [.github/workflows/lab-60-owned-runtime-integration.yml]
permissions: {}
jobs:
  acceptance:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.repository_id == '1449415666' && github.ref == 'refs/heads/codex/60-owned-runtime-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      A: 02f4d62f7efc869fbda46c50bcb905e81b7d76f9
      B: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      STAGE: red
      SOURCE_SHA: 5094eb8b0aa25e6dae12b3f658a74a5f865c29c14c9c02e427800378a0fa6287
      ACCEPTANCE_SHA: 634009e6a5a450925146ac7e20fdc2356128fa8a84cfc90fd0126d1401aa4458
      PACKAGE_PATH: scripts/session/codex_lab/owned_runtime_integration
    steps:
      - name: Fetch exact public head without credentials
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git fetch --no-tags https://github.com/YeliangDu/forcitis-one-psa-codex-lab.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$A^")" = "$B"
          git merge-base --is-ancestor "$A" "$GITHUB_SHA"
          test -z "$(git config --local --get-regexp '^http\..*extraheader$' || true)"
      - name: Export and verify only fixed input files
        run: |
          set -euo pipefail
          export INPUT="$RUNNER_TEMP/owned-runtime-input"
          mkdir -m 700 "$INPUT"
          git archive "$GITHUB_SHA:$PACKAGE_PATH" | tar -x -C "$INPUT"
          python3 -I -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path,PurePosixPath
          pins=json.loads('''{"acceptance/CONTRACT.json":"c4dfc0185f5b00f4770ebfb4e9fd42012bd979c12e66fa4f3d9954bbb9030a9f","acceptance/HANDOFF.md":"69cd22561f6f357bf54bc9845939c4ea6859de3b99cf2c5137773f019be91f5c","acceptance/OWNER-STORE-PINS.json":"e8dc175104e3e6f6729f6e3c1dfc20d6c8b90ae592590e5ca040888be0d5fa01","acceptance/baseline-source/SOURCE-CLOSURE.json":"5094eb8b0aa25e6dae12b3f658a74a5f865c29c14c9c02e427800378a0fa6287","acceptance/baseline-source/binding.schema.json":"8e56721a606eaff72289da8279f63f0cbb59b2167dda4a732877ac95ef3fcf64","acceptance/baseline-source/branch_broker.py":"9f6254fd3b83b6b0f34bde515c56edb9b944d90fc251b551e42e1d7cc3ddb1d5","acceptance/baseline-source/branch_effect_binding.py":"82435b55731b7f78f72993194dbb57fc5d62e0ffa1c0e83d0b5a38ed72d63cbe","acceptance/baseline-source/branch_effect_port.py":"ae4ba44f12472d1109a01e0ad468e6cabbbf02adbc8d9cbd39c1dfb4aff7c42c","acceptance/baseline-source/broker_plan.py":"638dbf482e5ef12e257fc5f0a8c0297571641703981f8fd1517b16ab02805cc7","acceptance/baseline-source/exact_scope.py":"ee29d8eaaa234655046f8d7a654d1179b506336a5cd08843f11380b253826b9d","acceptance/baseline-source/existing_ci_proof.py":"5393667fcf2e10be2e8223e6380df321b6d72deb56423e290e51b8cfc1217ba4","acceptance/baseline-source/goal_retire.py":"30e0aef43621e44b32bc6668a518ba1f01c1f224ed979390dc36962fed5a2a6e","acceptance/baseline-source/handoff_retire.py":"72604a10fcd3fae7b860aa8c7f1b8663fc36a4b99d4ef943ee9b033b8e52e574","acceptance/baseline-source/native_goal.py":"af27b6e5ff5ecb6b035eb667d0e60a7ccf030121d9513f74375da2708d3b5419","acceptance/baseline-source/native_quiesce.py":"f4e90a3833728ac7e6ed067effd84d112ad5cc74418a2dec133fe432e6f62312","acceptance/baseline-source/native_role.py":"099996ae7bf7cc3e454764cb5fa13e1d0cf9880a133123b1e4dcdf21b37f6dd4","acceptance/baseline-source/native_transport.py":"2925546088ac9386f5945185b29806cc95c557bcc9fb4d3a330d7d5122011ac1","acceptance/baseline-source/native_wait.py":"e648f29bb2c655b5d99a2b814da3302cae616ddc6a7e820f46c6ada0700402ae","acceptance/baseline-source/orphan_terminal.py":"1ea4d501e5dd774ce01f10525ab91df1c2a72af25d00718dde65e96d2ee2abd5","acceptance/baseline-source/owner_transfer.py":"603c88758af59f103cb0709e4902e51baf77a31632cc19492da9b6adb24f6b7f","acceptance/baseline-source/pending_wire.py":"9398c7383a8c424509cd24f7a0578a514f9ddea46d689a26c3ab6e05c6c2cbfc","acceptance/baseline-source/portable_broker.py":"4d0d4d4b9b67817602b0d440d4007048f3bdb7fa5c68270bd59e7c1f19d6d0e7","acceptance/baseline-source/portable_config.py":"ef79262cd962cb580d9eca12f09cd76293315f555476a2dbdb3dc607d226b403","acceptance/baseline-source/private_resources.py":"0b8409f3ea7c4f14eca9bd783dd76db2958be7c826edc08a6aa631abae4bf126","acceptance/baseline-source/readonly_plan_consumer.py":"62aac50be8802351a8ae79e592c0e6e8f04bb943dbc54573221efb1b47f473af","acceptance/baseline-source/reconnect_observe.py":"bdc7ed4273e1f96fb1b7d0e2e5d464ac50235fa3ee8314c1c4296fa4e0da30dc","acceptance/baseline-source/role_resume.py":"9b22dc33e1b307d529ce323466b4c0be809b1630671d641a3e48706705965e66","acceptance/baseline-source/runtime_broker.py":"f4aa5d346d8383d921cafb66b9fa6e4af9a4073a2e68ce97cec746c258cd6f2f","acceptance/baseline-source/runtime_store.py":"5320f1d5eaef9fe6c21471422b2944b8b0d7273b85c97e2cceb85191fde73dc0","acceptance/baseline-source/startup_authority.py":"d5ca117b82bda983ba1942f3933348a631c9e28b963929acdf10e7b34a0b8ca5","acceptance/baseline-source/warm_handoff.py":"6a69cde20d3900f45c92c87a8bcbcc5a70ad0fea635dbfe3f8be29eaa2f778f0","acceptance/owner-store-source/portable_config.py":"ef79262cd962cb580d9eca12f09cd76293315f555476a2dbdb3dc607d226b403","acceptance/owner-store-source/runtime_store.py":"3990105d2eff4dafb40e01810734f065c1f81f9c9dec0e7ab49f6d95af8871db","acceptance/run_acceptance.py":"e315a4c5d3fb3973993d2276ef1205e1ce57331bf633a87388664def1072f3b3","acceptance/stdio_fixture.py":"103e9367e7067ec7bd76a9637b2a17864a33ab5975cecb0f12d3b3e66e78b7a7","source/SOURCE-CLOSURE.json":"5094eb8b0aa25e6dae12b3f658a74a5f865c29c14c9c02e427800378a0fa6287","source/binding.schema.json":"8e56721a606eaff72289da8279f63f0cbb59b2167dda4a732877ac95ef3fcf64","source/branch_broker.py":"9f6254fd3b83b6b0f34bde515c56edb9b944d90fc251b551e42e1d7cc3ddb1d5","source/branch_effect_binding.py":"82435b55731b7f78f72993194dbb57fc5d62e0ffa1c0e83d0b5a38ed72d63cbe","source/branch_effect_port.py":"ae4ba44f12472d1109a01e0ad468e6cabbbf02adbc8d9cbd39c1dfb4aff7c42c","source/broker_plan.py":"638dbf482e5ef12e257fc5f0a8c0297571641703981f8fd1517b16ab02805cc7","source/exact_scope.py":"ee29d8eaaa234655046f8d7a654d1179b506336a5cd08843f11380b253826b9d","source/existing_ci_proof.py":"5393667fcf2e10be2e8223e6380df321b6d72deb56423e290e51b8cfc1217ba4","source/goal_retire.py":"30e0aef43621e44b32bc6668a518ba1f01c1f224ed979390dc36962fed5a2a6e","source/handoff_retire.py":"72604a10fcd3fae7b860aa8c7f1b8663fc36a4b99d4ef943ee9b033b8e52e574","source/native_goal.py":"af27b6e5ff5ecb6b035eb667d0e60a7ccf030121d9513f74375da2708d3b5419","source/native_quiesce.py":"f4e90a3833728ac7e6ed067effd84d112ad5cc74418a2dec133fe432e6f62312","source/native_role.py":"099996ae7bf7cc3e454764cb5fa13e1d0cf9880a133123b1e4dcdf21b37f6dd4","source/native_transport.py":"2925546088ac9386f5945185b29806cc95c557bcc9fb4d3a330d7d5122011ac1","source/native_wait.py":"e648f29bb2c655b5d99a2b814da3302cae616ddc6a7e820f46c6ada0700402ae","source/orphan_terminal.py":"1ea4d501e5dd774ce01f10525ab91df1c2a72af25d00718dde65e96d2ee2abd5","source/owner_transfer.py":"603c88758af59f103cb0709e4902e51baf77a31632cc19492da9b6adb24f6b7f","source/pending_wire.py":"9398c7383a8c424509cd24f7a0578a514f9ddea46d689a26c3ab6e05c6c2cbfc","source/portable_broker.py":"4d0d4d4b9b67817602b0d440d4007048f3bdb7fa5c68270bd59e7c1f19d6d0e7","source/portable_config.py":"ef79262cd962cb580d9eca12f09cd76293315f555476a2dbdb3dc607d226b403","source/private_resources.py":"0b8409f3ea7c4f14eca9bd783dd76db2958be7c826edc08a6aa631abae4bf126","source/readonly_plan_consumer.py":"62aac50be8802351a8ae79e592c0e6e8f04bb943dbc54573221efb1b47f473af","source/reconnect_observe.py":"bdc7ed4273e1f96fb1b7d0e2e5d464ac50235fa3ee8314c1c4296fa4e0da30dc","source/role_resume.py":"9b22dc33e1b307d529ce323466b4c0be809b1630671d641a3e48706705965e66","source/runtime_broker.py":"f4aa5d346d8383d921cafb66b9fa6e4af9a4073a2e68ce97cec746c258cd6f2f","source/runtime_store.py":"5320f1d5eaef9fe6c21471422b2944b8b0d7273b85c97e2cceb85191fde73dc0","source/startup_authority.py":"d5ca117b82bda983ba1942f3933348a631c9e28b963929acdf10e7b34a0b8ca5","source/warm_handoff.py":"6a69cde20d3900f45c92c87a8bcbcc5a70ad0fea635dbfe3f8be29eaa2f778f0"}''')
          p=Path(os.environ['INPUT']).resolve(strict=True)
          actual={q.relative_to(p).as_posix() for q in p.rglob('*') if q.is_file() or q.is_symlink()}
          assert actual==set(pins)
          for n,h in pins.items():
              r=PurePosixPath(n); assert not r.is_absolute() and '..' not in r.parts
              q=p/n
              assert q.resolve(strict=True)==q and q.is_file()
              assert hashlib.sha256(q.read_bytes()).hexdigest()==h
          base=os.environ['B']; a=os.environ['A']; head=os.environ['GITHUB_SHA']; prefix=os.environ['PACKAGE_PATH']
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('diff','--name-only',base,a).splitlines()==sorted(prefix+'/'+n for n in pins if n.startswith('acceptance/'))
          assert git('rev-parse',a+':'+prefix+'/acceptance')==git('rev-parse',head+':'+prefix+'/acceptance')
          PY
      - name: Execute independent cases without network or credentials
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/owned-runtime-evidence"; mkdir -m 700 "$e" "$e/witness"
          w="$(mktemp -d "$RUNNER_TEMP/owned-runtime-work.XXXXXX")"
          trap 'rm -rf -- "$w"' EXIT
          input="$RUNNER_TEMP/owned-runtime-input"
          printf 'A=%s\nB=%s\nH=%s\nstage=%s\nrun=%s\nattempt=%s\nrunner=%s\nacceptance=%s\nsource=%s\n' \
            "$A" "$B" "$GITHUB_SHA" "$STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_ENVIRONMENT" "$ACCEPTANCE_SHA" "$SOURCE_SHA" > "$e/identity.txt"
          before="$(readlink /proc/self/ns/net)"
          rc=0
          sudo -n /usr/bin/unshare --mount --propagation private --net --pid --fork --kill-child --mount-proc -- \
            /bin/bash --noprofile --norc -euc '
              package="$1"; work="$2"; evidence="$3"; hostnet="$4"; uid="$5"; gid="$6"; repo="$7"; rid="$8"; source_sha="$9"
              /usr/bin/mount --bind "$package" "$package"
              /usr/bin/mount -o remount,bind,ro "$package"
              test "$(readlink /proc/self/ns/net)" != "$hostnet"
              /usr/bin/findmnt -n -o VFS-OPTIONS --mountpoint "$package" | grep -Eq "(^|,)ro(,|$)"
              printf "%s\n" "package_read_only=true" "private_netns=true" > "${evidence%/witness}/isolation.txt"
              exec /usr/bin/setpriv --reuid "$uid" --regid "$gid" --clear-groups --no-new-privs -- \
                /usr/bin/env -i PATH=/usr/bin:/bin HOME="$work" TMPDIR="$work" RUNNER_ENVIRONMENT=github-hosted \
                GITHUB_REPOSITORY="$repo" GITHUB_REPOSITORY_ID="$rid" \
                /bin/bash --noprofile --norc -euc '"'"'
                  test "$(id -u)" -ne 0
                  test "$(ip -o link show | wc -l)" -eq 1
                  grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
                  cd "$1"
                  exec /usr/bin/python3 -I -B "$2/acceptance/run_acceptance.py" --runner-temp "$1" --source-root "$2/source" --evidence-dir "$3" --parent-netns "$4" --source-closure-sha256 "$5"
                '"'"' _ "$work" "$package" "$evidence" "$hostnet" "$source_sha"
            ' _ "$input" "$w" "$e/witness" "$before" "$(id -u)" "$(id -g)" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" "$SOURCE_SHA" > "$w/driver.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$e/exit-code.txt"
          if ! test -s "$e/witness/verdict.json"; then
            printf 'launcher_or_driver_ended_without_verdict\n' > "$e/setup-status.txt"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owned-runtime-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owned-runtime-evidence/identity.txt
            ${{ runner.temp }}/owned-runtime-evidence/isolation.txt
            ${{ runner.temp }}/owned-runtime-evidence/exit-code.txt
            ${{ runner.temp }}/owned-runtime-evidence/setup-status.txt
            ${{ runner.temp }}/owned-runtime-evidence/witness/verdict.json
            ${{ runner.temp }}/owned-runtime-evidence/witness/case-observations.json
          if-no-files-found: error
          retention-days: 7
