name: Lab 22 integrated cutover rehearsal
on:
  push:
    branches: [codex/22-control-cutover]
permissions:
  contents: read
jobs:
  integrated:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run the independently frozen cutover and storage suites
        env:
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dest="$RUNNER_TEMP/lab-22-integrated"
          mkdir -p "$dest"
          python3 -B - "$dest/verdict.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          base = Path("scripts/merge")
          cases = {
              "cutover": ("cutover_e2e_selftest.py", 8, "17c24b6c958fb9fa5500de019b63d5964f1b1c722c5476e62db3d9a739f6d362"),
              "storage": ("canonical_storage_transition_selftest.py", 9, "4a93137ef0cc49193230ddf794fe2cc7a1002d5050f0ecf2eefca0005dc810b4"),
              "material": ("fixture_material_selftest.py", 4, "105df7f3dd2d98b58b223741f0e393ec57b59f05027442645bbd9d9daa301807"),
              "recovery": ("recovery_path_selftest.py", 2, "0e02347e83d6ec367c0028b8baef0db69ab45fe7368e6c1b11a17aa9cfb1c7da"),
              "ordinary": ("ordinary_v2_selftest.py", 3, "3506a7909dac105fc8b9f6d4dbf70e6fd876909367ae8a9a509cf337ae7feb05"),
              "receiver": ("receiver_selftest.py", 5, "5aa35ddd51db9683e5040e83f57a5f3ca73efc520e1974b95b484d1a949e3b72"),
          }
          verified = True
          results = {}
          for name, (filename, count, sha) in cases.items():
              assert hashlib.sha256((base / filename).read_bytes()).hexdigest() == sha
              suite = unittest.TestLoader().discover(str(base), pattern=filename)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              results[name] = {
                  "tests": result.testsRun,
                  "failures": [{"case": t.id(), "detail": e} for t, e in result.failures],
                  "errors": [{"case": t.id(), "detail": e} for t, e in result.errors],
                  "skips": [t.id() for t, _ in result.skipped],
                  "expected_failures": [t.id() for t, _ in result.expectedFailures],
                  "unexpected_successes": [t.id() for t in result.unexpectedSuccesses],
                  "frozen_sha256": sha,
              }
              verified &= bool(result.wasSuccessful() and result.testsRun == count and not
                               (result.skipped or result.expectedFailures or result.unexpectedSuccesses))
          verdict = dict(head=os.environ["GITHUB_SHA"], run=os.environ["GITHUB_RUN_ID"],
                         attempt=os.environ["GITHUB_RUN_ATTEMPT"], suites=results,
                         native_authority=False, real_queue_writes=False)
          Path(sys.argv[1]).write_text(json.dumps(verdict, indent=2) + "\n")
          raise SystemExit(0 if verified else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-22-integrated-cutover-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-22-integrated/verdict.json
          if-no-files-found: error
  preflight:
    name: Exact-head Lab repository gates
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SHA: '15511fad03b8d2ae38e3a337f24556bd9d9071c6'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install light-check dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install checksum-verified ShellCheck on Ubuntu
        run: bash scripts/session/codex_lab/install_hosted_shellcheck.sh
      - name: Run normal light checks on the exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/lab22-full-preflight"
          bash scripts/ci/light.sh "$BASE_SHA" 2>&1 | tee "$RUNNER_TEMP/lab22-full-preflight/light.log"
      - name: Install checksum-verified Gitleaks on Ubuntu
        if: ${{ !cancelled() }}
        run: bash scripts/session/codex_lab/install_gitleaks.sh
      - name: Run normal redacted secret scan on the exact commit range
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/lab22-full-preflight"
          gitleaks git --redact --no-banner --exit-code 1 \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
            --log-opts="$BASE_SHA..$GITHUB_SHA" . \
            2>&1 | tee "$RUNNER_TEMP/lab22-full-preflight/secret.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab22-full-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab22-full-preflight/
          if-no-files-found: error
  native-entry-exact:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && toJSON(github.event.repository.id) == '1449415666'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the five independently frozen native binding cases
        env:
          GIT_ALLOW_PROTOCOL: file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/lab22-native-entry"
          python3 -B scripts/merge/native_entry_selftest.py 2>&1 | tee "$RUNNER_TEMP/lab22-native-entry/red.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab22-native-entry-exact
          path: ${{ runner.temp }}/lab22-native-entry/red.log
          if-no-files-found: error
  native-get-smoke:
    name: Actual Lab GET-only smoke
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && toJSON(github.event.repository.id) == '1449415666'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 154b1f5056f6006ed4d37282ab7735f576fee691
          fetch-depth: 0
          persist-credentials: false
      - name: Read actual pinned native Lab data without write permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          git --no-replace-objects show "$GITHUB_SHA:scripts/merge/native-get-params.observe.json" > "$RUNNER_TEMP/native-get-params.json"
          git --no-replace-objects show "$GITHUB_SHA:scripts/merge/native-get-scope.observe.json" > "$RUNNER_TEMP/native-get-scope.json"
          python3 -B scripts/merge/native_get_smoke.py --params "$RUNNER_TEMP/native-get-params.json" --params-sha256 a33727c744f93c9cbee60afb1ddcda07916e479bc3ca7f983921214ef631917b --scope "$RUNNER_TEMP/native-get-scope.json" --output "$RUNNER_TEMP/native-get-smoke/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab22-native-get-smoke
          path: ${{ runner.temp }}/native-get-smoke/result.json
          if-no-files-found: error
