name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend verify (Modulith + ArchUnit guardrails + integration tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flyway migrations are append-only (SESSION_PLAYBOOK §12)
        working-directory: .
        run: |
          python3 scripts/ci/migrations_immutable.py --self-test
          python3 scripts/ci/migrations_immutable.py origin/${{ github.base_ref || 'main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
      - name: OpenAPI contract unchanged (OpenApiExportTest rewrites frontend/packages/api/openapi.json)
        run: git diff --exit-code -- ../frontend/packages/api/openapi.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: frontend verify (typecheck + lint guardrails F1-F14 + structure + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.1
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: gitleaks git --redact --no-banner --exit-code 1 .
      # 记录文件与 ADR 由片段生成；片段与已提交的生成产物不一致即失败
      - name: generated docs match fragments
        run: python3 docs/modernization/build_all.py --check
      # 文档不得用「PSA」指代系统（用户 2026-10-14）；例外规则见脚本说明
      - name: no legacy system name in docs
        run: python3 docs/modernization/check_legacy_name.py

  assertion-drift:
    name: assertion drift (warning only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/ci/assertion_drift.py origin/${{ github.base_ref }}
