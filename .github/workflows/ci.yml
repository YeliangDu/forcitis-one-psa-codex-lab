name: ci

on:
  pull_request:
    # labeled: the merge queue labels the head of the queue `queued`, which starts the heavy steps (scripts/ci/heavy_gate.py)
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  # full run of main every night (the push to main runs the light steps only): 21:03 UTC; nightly-legacy-it runs at 23:23 UTC
  schedule:
    - cron: '3 21 * * *'

permissions:
  contents: read

concurrency:
  # a label other than `queued` must not cancel a run in progress, and the nightly full run must not cancel (nor be cancelled by) the push to main that the release gate reads: each gets its own group
  group: ci-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'queued' || github.event.action == 'edited') && '-other-label' || github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

# Self-hosted runners (docs/modernization/CI_RUNNERS.md). Their toolchain is installed on the machine, so the steps check versions instead of installing.
# Three tiers (scripts/ci/relevant_change.py): docs (nothing the builds read changed: light checks only), guarded (only docs that container-free tests, the glossary copy scripts or the release scripts read: just those run, on every pull request event), code (everything). A push to main and the nightly run are always tier code.
# Heavy steps (backend tests, OpenAPI check, SQL Server tests, frontend verify) run only for a pull request labelled `queued` and never on a push to main (scripts/ci/heavy_gate.py), where the nightly schedule runs everything; the light steps run on every event. Every job runs on every pull request and ends green, so the required checks always report; a documentation-only change skips the heavy steps (backend, frontend, release script self-test) via scripts/ci/relevant_change.py. A push to main runs the light steps (release approval depends on it); assertion drift runs on pull requests only.
jobs:
  backend:
    # the check name gains ' (light)' when this pull request run will not run the heavy steps: the required check then stays 'expected' until the queue labels the pull request
    name: backend verify (Modulith + ArchUnit guardrails + integration tests)${{ github.event_name == 'pull_request' && (!contains(github.event.pull_request.labels.*.name, 'queued') || github.event.action == 'edited' || (github.event.action == 'labeled' && github.event.label.name != 'queued')) && ' (light)' || '' }}
    runs-on: [self-hosted, forcitis-one]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # the engine answers `docker events --since` only from its last 256 events, far too few on an engine the four runners share: record the container events from here on and keep them for a failure
      - name: remember when the job started and record docker container events (evidence if it fails)
        run: |
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          nohup docker events --filter type=container --since "$(date +%s)" --format '{{.Time}} {{.Type}} {{.Action}} {{.Actor.Attributes.name}} {{.Actor.Attributes.image}}' > "$RUNNER_TEMP/docker-events.log" 2>&1 &
          echo "DOCKER_EVENTS_PID=$!" >> "$GITHUB_ENV"
      - name: "Flyway migrations: baseline-open marker, append-only, monotonic versions (SESSION_PLAYBOOK §12.2)"
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/ci/migrations_immutable.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then base="origin/$GITHUB_BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no earlier commit to compare against (new branch); self-test only"
          else
            python3 scripts/ci/migrations_immutable.py "$base"
          fi
      - name: System actor catalogue is append-only (backend/architecture/system-actors.txt)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/ci/system_actors_append_only.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then base="origin/$GITHUB_BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no earlier commit to compare against (new branch); self-test only"
          else
            python3 scripts/ci/system_actors_append_only.py "$base"
          fi
      - name: A changed organization-interface signature snapshot needs 已通知平台 owner in the pull request body (ADR-0066)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/ci/org_interface_notice.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then python3 scripts/ci/org_interface_notice.py "origin/$GITHUB_BASE_REF"; fi
      - name: Acceptance tests are changed only by the test engineer or under a ruling (SESSION_PLAYBOOK §6.1)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/ci/acceptance_guard.py --self-test
          python3 scripts/ci/acceptance_reports.py --self-test
          python3 scripts/ci/acceptance_rulings.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then base="origin/$GITHUB_BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no earlier commit to compare against (new branch); self-test only"
          else
            python3 scripts/ci/acceptance_guard.py "$base"
            python3 scripts/ci/acceptance_rulings.py "$base"
          fi
      - name: backend or frontend inputs changed?
        id: change
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 scripts/ci/relevant_change.py --self-test
          python3 scripts/ci/relevant_change.py "$BASE_REF"
      - name: heavy steps allowed? (pull request labelled `queued`; never on a push to main)
        id: heavy
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: python3 scripts/ci/heavy_gate.py
      - name: toolchain is Java 25
        if: ((steps.change.outputs.relevant == 'true' || steps.change.outputs.legacy_it == 'true') && steps.heavy.outputs.run == 'true') || steps.change.outputs.tier == 'guarded' || github.event_name == 'push'
        run: java -version 2>&1 | head -1 | grep -q '"25'
      - name: test images are present
        if: (steps.change.outputs.relevant == 'true' || steps.change.outputs.legacy_it == 'true') && steps.heavy.outputs.run == 'true'
        shell: bash
        run: |
          test -s backend/architecture/test-images.txt
          grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' backend/architecture/test-images.txt | while read -r image || [ -n "$image" ]; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull -q "$image"
          done
      # middle tier (scripts/ci/relevant_change.py tier=guarded): only docs the builds read changed, and every file that reads them is a container-free test; runs on every pull request event, no queue label needed
      - name: guarded docs changed - the container-free tests that read them
        if: steps.change.outputs.tier == 'guarded' && steps.change.outputs.guard_classes != ''
        env:
          GUARD_CLASSES: ${{ steps.change.outputs.guard_classes }}
        run: scripts/ci/guarded_tests.sh "$GUARD_CLASSES"
      # a push to main runs the light steps only (scripts/ci/heavy_gate.py); this is the post-merge alarm for a merge that no heavy run tested on this exact tree: every container-free unit test, about 25 seconds
      - name: container-free unit tests on a push to main
        if: github.event_name == 'push'
        run: scripts/ci/guarded_tests.sh "$(python3 scripts/ci/light_unit_classes.py)"
      - name: surefire and failsafe, side by side
        if: steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        # Two forks per plugin (four test JVMs per runner instead of eight): the runners share one Docker Desktop (CI_RUNNERS.md)
        env:
          BACKEND_WATCHDOG_SECONDS: '1500'
        run: scripts/ci/backend_verify.sh -Dtest.forks=2 -Dtest.fork.timeout=1800
      - name: every acceptance test class produced a surefire or failsafe report
        if: steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        # Check the default invocation before explicit -Dit.test reruns can add SQL Server reports.
        run: python3 scripts/ci/acceptance_reports.py --tier default
      # a flaky test usually shows itself the first time it runs: the test classes this pull request adds or changes run again, three times, each in a new JVM (scripts/ci/repeat_new_tests.py); one failure fails the pull request
      - name: new or changed test classes, repeated
        if: github.event_name == 'pull_request' && steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        timeout-minutes: 20
        run: python3 scripts/ci/repeat_new_tests.py "origin/$GITHUB_BASE_REF" --times 3
      - name: OpenAPI contract unchanged (OpenApiExportTest rewrites frontend/packages/api/openapi.json)
        if: steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        run: git diff --exit-code -- frontend/packages/api/openapi.json
      - name: SQL Server integration tests (profile legacy-it)
        if: steps.change.outputs.legacy_it == 'true' && steps.heavy.outputs.run == 'true'
        timeout-minutes: 30
        env:
          BACKEND_WATCHDOG_SECONDS: '1500'
        run: scripts/ci/legacy_it.sh -Dtest.forks=2 -Dtest.fork.timeout=1800
      # a test container that did not come up or lost its connection leaves no trace once its attempt is removed: the engine's events since the job started, the logs of the test containers created since, and the engine summary (scripts/ci/docker_diagnostics.py)
      - name: docker evidence for the failed job
        if: failure()
        timeout-minutes: 5
        run: python3 scripts/ci/docker_diagnostics.py backend/target/docker-diagnostics "${JOB_START_EPOCH:-$(( $(date +%s) - 1800 ))}" "$RUNNER_TEMP/docker-events.log"
      - name: stop the docker events recorder
        if: always()
        run: kill "${DOCKER_EVENTS_PID:-0}" 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/legacy-it-reports
            backend/target/thread-dumps
            backend/target/docker-diagnostics
            backend/target/**/*.dump*
            backend/hs_err_pid*.log

  frontend:
    name: frontend verify (typecheck + lint guardrails F1-F14 + structure + build)${{ github.event_name == 'pull_request' && (!contains(github.event.pull_request.labels.*.name, 'queued') || github.event.action == 'edited' || (github.event.action == 'labeled' && github.event.label.name != 'queued')) && ' (light)' || '' }}
    runs-on: [self-hosted, forcitis-one]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: backend or frontend inputs changed?
        id: change
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/relevant_change.py "$BASE_REF"
      - name: heavy steps allowed? (pull request labelled `queued`; never on a push to main)
        id: heavy
        working-directory: .
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: python3 scripts/ci/heavy_gate.py
      - name: toolchain is Node 24 and the pinned pnpm
        if: steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        run: |
          node --version | grep -q '^v24\.'
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
      - if: steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - if: steps.change.outputs.tier == 'code' && steps.heavy.outputs.run == 'true'
        run: pnpm verify
      # middle tier: the glossary copy scripts read terms.yaml and bcs.yaml (scripts/precheck.sh runs the same two)
      - name: guarded docs changed - toolchain is Node 24 and the pinned pnpm
        if: steps.change.outputs.tier == 'guarded' && steps.change.outputs.guard_frontend == 'true'
        run: |
          node --version | grep -q '^v24\.'
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
      - if: steps.change.outputs.tier == 'guarded' && steps.change.outputs.guard_frontend == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: guarded docs changed - glossary copy check and script tests
        if: steps.change.outputs.tier == 'guarded' && steps.change.outputs.guard_frontend == 'true'
        run: |
          pnpm run check:copy
          pnpm run test:scripts

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: [self-hosted, forcitis-one]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (machine install, else verified download)
        run: |
          if [ "$(gitleaks version 2>/dev/null)" != "8.30.1" ]; then
            base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
            mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
            curl -sSLO "$base/gitleaks_8.30.1_darwin_arm64.tar.gz"
            curl -sSLO "$base/gitleaks_8.30.1_checksums.txt"
            grep ' gitleaks_8.30.1_darwin_arm64.tar.gz$' gitleaks_8.30.1_checksums.txt | shasum -a 256 -c -
            tar -xzf gitleaks_8.30.1_darwin_arm64.tar.gz gitleaks
            echo "$PWD" >> "$GITHUB_PATH"
          fi
      - run: gitleaks git --redact --no-banner --exit-code 1 .
      # 记录与 ADR 由片段生成：terms.yaml 等仍入仓的产物与重新生成的结果不一致即失败；ADR 拷贝与索引、brief、提议术语清单 README、INTENT / SESSION_LOG / STATUS 不入仓，只要求能生成且没被跟踪
      - name: python3 has PyYAML 6.0.3 (SUPPLY_CHAIN S1)
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit("python3 lacks PyYAML 6.0.3 (SUPPLY_CHAIN S1, CI_RUNNERS.md)")
          if yaml.__version__ != "6.0.3":
              sys.exit(f"PyYAML {yaml.__version__} != 6.0.3 (SUPPLY_CHAIN S1, CI_RUNNERS.md)")
          PY
      - name: generated docs match fragments
        run: python3 docs/modernization/build_all.py --check
      # 规则评审的原结论不得改写，改决定只能追加 revisions（SESSION_PLAYBOOK §12.2）；基线由本步骤显式给出
      - name: rule review revisions are append-only
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 docs/modernization/rules/review_revisions.py --self-test
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then base="origin/$GITHUB_BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no earlier commit to compare against (new branch); self-test only"
          else
            python3 docs/modernization/rules/review_revisions.py --base "$base"
          fi
      # 文档不得用「PSA」指代系统（用户 2026-10-14）；例外规则见脚本说明
      - name: no legacy system name in docs
        run: python3 docs/modernization/check_legacy_name.py
      # 发布与部署脚本读取 ci.yml、部署前清单、阻塞条目、prod-approvals.txt 与 runbooks/files；只改与它们无关的文档时跳过下面两步
      - name: release scripts or what they read changed?
        id: change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/relevant_change.py "$BASE_REF"
      - name: shellcheck 0.11.0 (machine install, else verified download)
        if: github.event_name == 'push' || steps.change.outputs.relevant == 'true'
        run: |
          if [ "$(shellcheck --version 2>/dev/null | awk '/^version:/ { print $2 }')" != "0.11.0" ]; then
            mkdir -p "$RUNNER_TEMP/shellcheck" && cd "$RUNNER_TEMP/shellcheck"
            curl -sSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz
            echo "56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79  shellcheck-v0.11.0.darwin.aarch64.tar.xz" | shasum -a 256 -c -
            tar -xJf shellcheck-v0.11.0.darwin.aarch64.tar.xz
            echo "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          fi
      - name: release and deploy scripts self-test
        if: github.event_name == 'push' || steps.change.outputs.relevant == 'true'
        run: |
          for script in scripts/release/*.sh; do bash -n "$script"; done
          shellcheck -x scripts/release/*.sh
          python3 -I scripts/release/ci_passed.py --self-test
          python3 -I scripts/release/manifest.py --self-test
          python3 -I scripts/release/deploy_gate.py --self-test
          scripts/release/install_request_test.sh
          scripts/release/ship_test.sh
      # 建库脚本（C-3 / C-9）与参考 DDL、迁移模块目录的 schema 清单和版本表清单须一致（人工同步易漂移）；前面步骤失败也照跑
      - name: database scripts aligned
        if: ${{ !cancelled() }}
        run: |
          python3 -I scripts/ci/db_scripts_aligned.py --self-test
          python3 -I scripts/ci/db_scripts_aligned.py

  assertion-drift:
    name: assertion drift (warning only)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, forcitis-one]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 scripts/ci/assertion_drift.py --self-test
      - run: python3 scripts/hooks/pre_push_gate.py --self-test
      - run: python3 scripts/ci/light_unit_classes.py --self-test
      - run: python3 scripts/ci/heavy_gate.py --self-test
      - run: python3 scripts/ci/docker_diagnostics.py --self-test
      - run: python3 scripts/ci/failure_summary.py --self-test
      - run: python3 scripts/ci/repeat_new_tests.py --self-test
      - run: python3 scripts/ci/assertion_drift.py origin/${{ github.base_ref }}
      # report only (SCAN_SUPPLEMENT, one-data): findings never fail the job; the self-test does, and so does a crash of the scan (bash -e with pipefail); statements the scan cannot model raise a warning
      - name: baseline DDL scan (report only)
        shell: bash
        run: |
          python3 scripts/ci/baseline_ddl_scan.py --self-test
          scan=$(python3 scripts/ci/baseline_ddl_scan.py)
          printf '%s\n' "$scan" | grep '^=='
          unmodelled=$(printf '%s\n' "$scan" | sed -n 's/^== 8 .*: \([0-9][0-9]*\)$/\1/p')
          if [ "$unmodelled" != "0" ]; then echo "::warning title=Baseline DDL scan::${unmodelled:-?} statements are not modelled by the scan: extend scripts/ci/baseline_ddl_scan.py"; fi
