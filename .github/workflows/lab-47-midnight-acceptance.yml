name: Lab 47 Shanghai-midnight acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - backend/src/test/java/com/forcitis/one/acceptance/organization/attendance/StandardHours*.java
      - .github/workflows/lab-47-midnight-acceptance.yml
permissions:
  contents: read
jobs:
  midnight:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/47-attendance-clock'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUBJECT: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Pin and bootstrap exact hosted inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          dest="$RUNNER_TEMP/lab-47-midnight"
          mkdir -p "$dest"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$BASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$dest/identity.txt"
          docker info > "$dest/docker.log"
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts) 2>&1 | tee "$dest/install.log"
          bash scripts/codegen/generate_api.sh -C 2>&1 | tee "$dest/api.log"
      - name: Run frozen database and HTTP midnight cases
        working-directory: backend
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/lab-47-midnight"
          ./mvnw -B -C test-compile failsafe:integration-test failsafe:verify \
            -Dit.test=StandardHoursMidnightIT,StandardHoursExpiredDefaultIT,StandardHoursPublishedEventIT \
            -Dspring.datasource.hikari.minimum-idle=1 -Dit.forks=1 \
            -Djacoco.skip=true -Dtest.fork.timeout=900 2>&1 | tee "$dest/failsafe.log"
      - name: Preserve Failsafe reports
        if: always()
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/lab-47-midnight"
          if [ -d backend/target/failsafe-reports ]; then
            mkdir -p "$dest/reports"
            cp backend/target/failsafe-reports/*.xml "$dest/reports/" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-47-midnight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-47-midnight/
          if-no-files-found: error
