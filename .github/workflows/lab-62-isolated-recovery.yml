name: Lab 62 isolated native projection acceptance
on:
  push:
    branches: [codex/62-current-assignment]
    paths: [.github/workflows/lab-62-isolated-recovery.yml]
permissions:
  contents: read
jobs:
  acceptance:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.ref == 'refs/heads/codex/62-current-assignment'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ACCEPTANCE_HEAD: fdb995415da5d65d9b22ffeb1f5e012e8567a8aa
      PRODUCT_BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      MANIFEST_SHA256: 84f00536552f28e770dc776ad1a2202ec6c2f5ba701cd86021279cca3f182fb9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fdb995415da5d65d9b22ffeb1f5e012e8567a8aa
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen package before running any candidate-owned script
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$ACCEPTANCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_BASE"
          test ! -e .git/merge-queue
          test ! -e .codex/hooks.json
          test -z "$(git config --local --get-regexp '^http\..*extraheader$' || true)"
          python3 -I -B - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path,PurePosixPath
          root=Path("scripts/session/codex_lab/p1_native_projection_acceptance").resolve(strict=True)
          p=root/"manifest.json"
          assert not p.is_symlink() and p.is_file()
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ["MANIFEST_SHA256"]
          frozen=json.loads(raw)
          for name,expected in frozen["files_sha256"].items():
              rel=PurePosixPath(name)
              assert not rel.is_absolute() and ".." not in rel.parts and str(rel)==name
              f=root/name
              assert f.resolve(strict=True)==f and f.is_file()
              assert hashlib.sha256(f.read_bytes()).hexdigest()==expected
          PYCODE
      - name: Materialize the independently pinned projection candidate
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/lab62-projection-candidate.py"
          git --no-replace-objects show 0498684e7d5e2eaa6d837435d8f7bf1e04cafda3:scripts/session/codex_lab/lab_p1_native_projection.py > "$p"
          printf '%s  %s\n' '7863877ee59d27566475d189cef0eae9058352d14317c570fe0ff63179e305e1' "$p" | sha256sum -c -
      - name: Run frozen acceptance without network or privilege escalation
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab62-evidence"; mkdir -m 700 "$d"
          scratch="$RUNNER_TEMP/lab62-scratch"; mkdir -m 700 "$scratch"
          printf 'candidate_head=%s\ncandidate_source_sha256=%s\nactive_C=unbound\n' '0498684e7d5e2eaa6d837435d8f7bf1e04cafda3' '7863877ee59d27566475d189cef0eae9058352d14317c570fe0ff63179e305e1' > "$d/candidate.txt"
          printf 'A=%s\nB=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nmanifest_sha256=%s\nrunner=%s\n'             "$ACCEPTANCE_HEAD" "$PRODUCT_BASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MANIFEST_SHA256" "$RUNNER_ENVIRONMENT" > "$d/identity.txt"
          ns_before="$(readlink /proc/self/ns/net)"
          rc=0
          sudo -n /usr/bin/unshare --net --pid --fork --mount-proc -- /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs --             /usr/bin/env -i PATH=/usr/bin:/bin HOME="$scratch" TMPDIR="$scratch"             GITHUB_ACTIONS=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP"             GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"             GITHUB_SHA="$GITHUB_SHA" ACCEPTANCE_HEAD="$ACCEPTANCE_HEAD" PRODUCT_BASE="$PRODUCT_BASE"             MANIFEST_SHA256="$MANIFEST_SHA256" LAB62_EVIDENCE="$d" HOST_NET_NS="$ns_before" PROJECTION_PARENT_NETNS="$(stat -Lc %i /proc/self/ns/net)"             /bin/bash --noprofile --norc -eu -o pipefail -c '
              test "$(id -u)" -ne 0
              test "$(readlink /proc/self/ns/net)" != "$HOST_NET_NS"
              test "$(ip -o link show | wc -l)" -eq 1
              ip -o link show | grep -Eq "^[0-9]+: lo:"
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              printf "network_namespace=isolated\nprivilege=non-root,no-new-privs\ncredentials=allowlisted-environment\n" > "$LAB62_EVIDENCE/isolation.txt"
              /usr/bin/python3 -I -B scripts/session/codex_lab/p1_native_projection_acceptance/run.py --inside --manifest-sha256 "$MANIFEST_SHA256" --target "$RUNNER_TEMP/lab62-projection-candidate.py" --target-sha256 7863877ee59d27566475d189cef0eae9058352d14317c570fe0ff63179e305e1 --report "$LAB62_EVIDENCE/verdict.json"
            ' || rc=$?
          printf '%s\n' "$rc" > "$d/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab62-native-projection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab62-evidence/
          if-no-files-found: error
          retention-days: 7
  association_compatibility:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
