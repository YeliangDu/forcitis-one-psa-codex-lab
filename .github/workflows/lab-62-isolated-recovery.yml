          printf 'A=%s\nB=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nmanifest_sha256=%s\nrunner=%s\n'             "$ACCEPTANCE_HEAD" "$PRODUCT_BASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MANIFEST_SHA256" "$RUNNER_ENVIRONMENT" > "$d/identity.txt"
