name: ci-recurrence

on:
  schedule:
    # 03:17 UTC = 本机夏令时 05:17（CEST，UTC+2）、冬令时 04:17；晚于 01:23 UTC 的 nightly-legacy-it 全量（上限 90 分钟，最晚 02:53 结束）与前一晚 21:03 UTC 的 ci 全量，错开整点。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-recurrence
  cancel-in-progress: false

jobs:
  recurrence:
    runs-on: [self-hosted, forcitis-one]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: 复发检测自测
        run: python3 scripts/ci/ci_recurrence.py --self-test
      - name: 检查最近 26 小时并写入完整摘要
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recurrence_exit=0
          report=$(python3 -u scripts/ci/ci_recurrence.py --hours 26 --fail-on-recurrence 2>&1) || recurrence_exit=$?
          printf '%s\n' "$report"
          { echo '```text'; printf '%s\n' "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$recurrence_exit" -ne 0 ]; then
            echo "::error::CI 复发检测失败（发现复发或检测异常），请查看完整摘要。"
            exit "$recurrence_exit"
          fi
