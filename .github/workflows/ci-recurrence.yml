name: ci-recurrence

on:
  schedule:
    # 23:17 UTC = 次日北京时间 07:17（UTC+8）、欧洲夏令时 01:17（CEST，UTC+2）；晚于 19:23 UTC 的 nightly-legacy-it 全量（上限 90 分钟）与 21:03 UTC 的 ci 全量，错开整点。
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-recurrence
  cancel-in-progress: false

jobs:
  recurrence:
    runs-on: [self-hosted, forcitis-one]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: 复发检测自测
        run: python3 scripts/ci/ci_recurrence.py --self-test
      - name: 检查最近 26 小时并写入完整摘要
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recurrence_exit=0
          python3 scripts/ci/ci_recurrence.py --hours 26 --fail-on-recurrence 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || recurrence_exit=$?
          if [ "$recurrence_exit" -ne 0 ]; then
            echo "::error::CI 复发检测失败（发现复发或检测异常），请查看完整摘要。"
            exit "$recurrence_exit"
          fi
