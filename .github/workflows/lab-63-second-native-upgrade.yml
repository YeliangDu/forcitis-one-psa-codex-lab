name: Lab 63 existing V2 protected recovery
on:
  push:
    branches: [codex/63-descendant-proof]
    paths: [.github/workflows/lab-63-second-native-upgrade.yml]
permissions: {}
jobs:
  acceptance:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.repository_id == '1449415666' && github.ref == 'refs/heads/codex/63-descendant-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACCEPTANCE_HEAD: a997d44693a07bf374709a94e7f86282f1948e3c
      PRODUCT_BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      MANIFEST_SHA256: 0d376656e222dd439a42b5b6755072d70abd4b4001bdf5c70605d7d39a270d54
      PACKAGE_PREFIX: scripts/session/codex_lab/p2_second_native_upgrade_acceptance
    steps:
      - name: Fetch exact public witness without credentials
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git fetch --no-tags https://github.com/YeliangDu/forcitis-one-psa-codex-lab.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ACCEPTANCE_HEAD" "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$ACCEPTANCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_BASE"
          test -z "$(git config --local --get-regexp '^http\..*extraheader$' || true)"
          test ! -e .git/merge-queue
      - name: Validate frozen files and archive exact production source
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['PACKAGE_PREFIX']).resolve(strict=True)
          raw=(root/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['MANIFEST_SHA256']
          manifest=json.loads(raw)
          base=os.environ['PRODUCT_BASE']
          for name,digest in manifest['source_sha256_at_B'].items():
              data=subprocess.check_output(['git','show',f'{base}:{name}'])
              assert hashlib.sha256(data).hexdigest()==digest
          for name,digest in manifest['files_sha256'].items():
              assert Path(name).name==name and name not in ('.','..','manifest.json')
              p=root/name
              assert p.resolve(strict=True)==p and p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert paths==sorted(f"{os.environ['PACKAGE_PREFIX']}/{name}" for name in ('manifest.json',*manifest['files_sha256']))
          PY
          evidence="$RUNNER_TEMP/lab63-native-v2-evidence"
          exact="$RUNNER_TEMP/lab63-native-v2-source"
          mkdir -m 700 "$evidence" "$exact"
          printf 'A=%s\nB=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nmanifest_sha256=%s\nrunner=%s\n' \
            "$ACCEPTANCE_HEAD" "$PRODUCT_BASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MANIFEST_SHA256" "$RUNNER_ENVIRONMENT" > "$evidence/identity.txt"
          git archive "$PRODUCT_BASE" scripts/merge scripts/session/codex_lab | tar -x -C "$exact"
          git ls-tree -r "$PRODUCT_BASE" -- scripts/merge scripts/session/codex_lab > "$evidence/source-tree.txt"
          while read -r mode type oid path; do
            test "$type" = blob
            test -f "$exact/$path" && test ! -L "$exact/$path"
            test "$(git hash-object --no-filters "$exact/$path")" = "$oid"
          done < "$evidence/source-tree.txt"
      - name: Run only the independently selected disposable acceptance
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lab63-native-v2-evidence"
          exact="$RUNNER_TEMP/lab63-native-v2-source"
          work="$(mktemp -d "$RUNNER_TEMP/lab63-native-v2.XXXXXX")"
          trap 'sudo -n rm -rf -- "$work"' EXIT
          hostnet="$(readlink /proc/self/ns/net)"
          rc=0
          sudo -n /usr/bin/unshare --mount --propagation private --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs -- \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$work" TMPDIR="$work" EXACT_B_SOURCE_ROOT="$exact" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ALLOW_PROTOCOL=file \
              HOST_NET="$hostnet" ACCEPTANCE="$GITHUB_WORKSPACE/$PACKAGE_PREFIX/test_second_native_upgrade.py" \
              /bin/bash --noprofile --norc -euc '
                test "$(id -u)" -ne 0
                test "$(readlink /proc/self/ns/net)" != "$HOST_NET"
                test "$(ip -o link show | wc -l)" -eq 1
                grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
                cd "$HOME"
                exec /usr/bin/python3 -I -B "$ACCEPTANCE" -v
              ' > "$evidence/acceptance.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab63-second-native-upgrade-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab63-native-v2-evidence/
          if-no-files-found: error
          retention-days: 7
