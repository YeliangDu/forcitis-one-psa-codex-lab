name: Lab 36 signed payroll schema acceptance
on:
  push:
    branches: [lab/36-s4a-schema-red-ci]
permissions:
  contents: read
env:
  LAB_HEAD: 8bdb132e8323ab483820544c6459b5011b5a57e5
  LAB_BASE: 15511fad03b8d2ae38e3a337f24556bd9d9071c6
  LAB_MODE: red
jobs:
  acceptance:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8bdb132e8323ab483820544c6459b5011b5a57e5
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Export API and compile the exact source on the hosted runner
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab-36"
          mkdir -p "$d"
          test "$(git rev-parse HEAD)" = "$LAB_HEAD"
          printf '%s\n' "$LAB_HEAD" > "$d/head"
          printf '%s\n' "$GITHUB_RUN_ID" > "$d/run"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$d/attempt"
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts)
          bash scripts/codegen/generate_api.sh -C 2>&1 | tee "$d/api.log"
          (cd backend && ./mvnw -B -C test-compile -Djacoco.skip=true) 2>&1 | tee "$d/compile.log"
      - name: Execute independent PostgreSQL schema and transaction acceptance
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab-36"
          cd backend
          status=0
          ./mvnw -B -C failsafe:integration-test failsafe:verify -Dit.test=PayrollS4aSchemaIT -Dit.forks=1 -Djacoco.skip=true 2>&1 | tee "$d/postgres.log" || status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$d/postgres.exit"
          python3 -B - "$d" <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json, os, sys
          d = Path(sys.argv[1])
          mode = os.environ["LAB_MODE"]
          summary = dict(head=os.environ["LAB_HEAD"], base=os.environ["LAB_BASE"],
                         run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                         mode=mode, suites={})
          report = Path("target/failsafe-reports")
          for name, expected in (("PayrollS4aSchemaIT", 3),):
              (xml,) = report.glob("TEST-*." + name + ".xml")
              (d/xml.name).write_bytes(xml.read_bytes())
              root = ET.parse(xml).getroot()
              stats = {k: int(root.get(k, "-1")) for k in ("tests", "failures", "errors", "skipped")}
              assert stats["tests"] == expected and stats["errors"] == stats["skipped"] == 0, (name, stats)
              nodes = list(root.iter("failure"))
              assert len(nodes) == stats["failures"]
              if mode == "red":
                  assert stats["failures"] == expected, (name, stats)
                  assert all("Assertion" in n.get("type", "") and
                             "missing signed S4-A seven-table shape" in (n.get("message", "") + (n.text or ""))
                             for n in nodes)
              else:
                  assert mode == "green" and stats["failures"] == 0
              summary["suites"][name] = stats
          assert int((d/"postgres.exit").read_text()) == (1 if mode == "red" else 0)
          summary["verified"] = True
          (d/"verdict.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-36-s4a-schema-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-36/
          if-no-files-found: error
