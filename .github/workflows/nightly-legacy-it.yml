name: nightly-legacy-it

# cron is UTC: 19:23 UTC = 03:23 Beijing time the next day (UTC+8, no daylight saving); the odd minute avoids the top-of-hour queue on GitHub's scheduler.
on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-legacy-it
  cancel-in-progress: false

jobs:
  legacy-it:
    name: backend verify under profile legacy-it (full)
    runs-on: [self-hosted, forcitis-one]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: toolchain is Java 25
        run: java -version 2>&1 | head -1 | grep -q '"25'
      - name: test images are present
        shell: bash
        run: |
          test -s backend/architecture/test-images.txt
          grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' backend/architecture/test-images.txt | while read -r image || [ -n "$image" ]; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull -q "$image"
          done
      - name: surefire and failsafe under profile legacy-it
        run: scripts/ci/backend_verify.sh -Plegacy-it
      - name: the SQL Server integration tests ran
        shell: bash
        run: compgen -G 'backend/target/failsafe-reports/TEST-*MssqlIT.xml'
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
