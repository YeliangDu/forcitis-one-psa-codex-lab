name: Lab 59 exact synthetic WeCom reproduction
on:
  push:
    branches: [codex/59-synthetic-wecom-fixture]
    paths: [.github/workflows/lab-59-synthetic-wecom.yml]
permissions:
  contents: read
jobs:
  repro:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.ref == 'refs/heads/codex/59-synthetic-wecom-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        scope: [method, class]
    env:
      SUBJECT: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 77e872e8ba9661d3294d3a9337c8e5c956b70641
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Pin and compile the unchanged test subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          d="$RUNNER_TEMP/lab59-evidence"
          mkdir -m 700 "$d"
          printf 'source=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nscope=%s\n' "$SUBJECT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SCOPE" > "$d/identity.txt"
          docker info > "$RUNNER_TEMP/lab59-docker.log"
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts)
          bash scripts/codegen/generate_api.sh -C
          (cd backend && ./mvnw -B -C test-compile -Djacoco.skip=true)
      - name: Execute the actual narrowed integration seam
        working-directory: backend
        run: |
          set -euo pipefail
          selector=BonusInputNoFallbackIT
          case "$SCOPE" in
            method) selector="$selector#theSecondStageGoesOnlyToHoldersOfThePayrollRole" ;;
            class) ;;
            *) exit 86 ;;
          esac
          d="$RUNNER_TEMP/lab59-evidence"
          for n in 1 2 3; do
            rm -rf target/failsafe-reports
            log="$RUNNER_TEMP/lab59-$SCOPE-$n.log"
            rc=0
            ./mvnw -B -C failsafe:integration-test failsafe:verify \
              -Dit.test="$selector" -Dspring.datasource.hikari.minimum-idle=1 -Dit.forks=1 \
              -Djacoco.skip=true -Dtest.fork.timeout=600 > "$log" 2>&1 || rc=$?
            python3 -I -B - "$log" "$d/$n.json" "$rc" "$SCOPE" <<'PYCODE'
          import json,re,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          log,out,rc,scope=sys.argv[1:]
          raw=Path(log).read_text(errors="replace")
          files=list(Path("target/failsafe-reports").glob("TEST-*BonusInputNoFallbackIT.xml"))
          proof=dict(exit=int(rc),scope=scope,verdict="capability-blocked")
          if len(files)==1:
              suite=ET.parse(files[0]).getroot()
              proof.update({k:int(suite.get(k,"0")) for k in ("tests","failures","errors","skipped")})
              failures=[t.find("failure") for t in suite.findall("testcase") if t.find("failure") is not None]
              signal=[f for f in failures if "PLATFORM_IDENTITY_WECOM_CODE_INVALID" in (f.get("message","")+(f.text or ""))
                      and "answered 401" in (f.get("message","")+(f.text or ""))]
              expected=1 if scope=="method" else 2
              if proof["tests"]==expected and not (proof["errors"] or proof["skipped"]):
                  if len(signal)==proof["failures"]==1 and int(rc)!=0 and "BonusInputNoFallbackIT.java:119" in raw:
                      proof["verdict"]="observed-exact-synthetic-login-401"
                  elif proof["failures"]==0 and int(rc)==0:
                      proof["verdict"]="passed-no-reproduction"
          Path(out).write_text(json.dumps(proof,sort_keys=True)+"\n")
          print(json.dumps(proof,sort_keys=True))
          PYCODE
          done
          python3 -I -B - "$d" <<'PYCODE'
          import json,sys
          from pathlib import Path
          records=[json.loads(p.read_bytes()) for p in sorted(Path(sys.argv[1]).glob("[1-3].json"))]
          assert len(records)==3
          if any(r["verdict"]=="capability-blocked" for r in records): raise SystemExit(86)
          if any(r["verdict"]=="observed-exact-synthetic-login-401" for r in records): raise SystemExit(1)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab59-${{ matrix.scope }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab59-evidence/
          if-no-files-found: error
          retention-days: 5
