name: Lab 59 exact synthetic WeCom reproduction
on:
  push:
    branches: [codex/59-synthetic-wecom-fixture]
    paths: [.github/workflows/lab-59-synthetic-wecom.yml]
permissions:
  contents: read
jobs:
  repro:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.ref == 'refs/heads/codex/59-synthetic-wecom-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SUBJECT: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      SELECTOR_SHA256: 585284fb0a702c5bc80acb420fd907ca97d90073161176b1737de7b18fec0413
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 77e872e8ba9661d3294d3a9337c8e5c956b70641
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Rebuild the exact formal slot3 inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          d="$RUNNER_TEMP/lab59-evidence"
          mkdir -m 700 "$d"
          printf 'source=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nscope=full-slot3\n' "$SUBJECT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$d/identity.txt"
          docker info > "$RUNNER_TEMP/lab59-docker.log"
          npm install -g pnpm@12.4.2
          (cd frontend && pnpm install --frozen-lockfile --ignore-scripts)
          bash scripts/codegen/generate_api.sh -C
          python3 -B scripts/ci/lab_backend_shards.py plan . 4 > "$d/inventory.json"
          selector="$(jq -er 'select(.integration_classes==378 and (.shards[2]|length)==94) | .shards[2]|join(",")' "$d/inventory.json")"
          test "$(printf %s "$selector" | sha256sum | cut -d' ' -f1)" = "$SELECTOR_SHA256"
          printf '%s' "$selector" > "$d/selector.txt"
          input="$RUNNER_TEMP/lab59-input"
          mkdir -p "$input/api"
          cp frontend/packages/api/openapi.json "$input/api/"
          cp -R frontend/packages/api/src/generated "$input/api/"
          printf '%s\n' "$SUBJECT" > "$input/head"
          printf '%s\n' "$GITHUB_RUN_ID" > "$input/run"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$input/attempt"
      - name: Run the unchanged formal slot3 and publish only structured diagnostics
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab59-evidence"
          selector="$(cat "$d/selector.txt")"
          rc=0
          LAB_HEAD="$SUBJECT" bash scripts/ci/lab_backend_lane.sh 3 "$RUNNER_TEMP/lab59-input" \
            "$RUNNER_TEMP/lab59-slot3-private" "$selector" > "$RUNNER_TEMP/lab59-private.log" 2>&1 || rc=$?
          count_rc=0
          python3 -B scripts/ci/lab_backend_shards.py verify backend/target/failsafe-reports \
            --selector "$selector" > "$d/counts.json" || count_rc=$?
          python3 -I -B - "$d" "$rc" "$count_rc" <<'PYCODE'
          import json,os,re,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          dest=Path(sys.argv[1])
          rc,count_rc=map(int,sys.argv[2:])
          proof=dict(slot=3,exit=rc,reconciliation_exit=count_rc,verdict="capability-blocked")
          exact_target="theSecondStageGoesOnlyToHoldersOfThePayrollRole"
          suite_files=list(Path("backend/target/failsafe-reports").glob("TEST-*BonusInputNoFallbackIT.xml"))
          private=Path(os.environ["RUNNER_TEMP"])/"lab59-slot3-private/failsafe.log"
          if len(suite_files)==1 and private.is_file() and (dest/"counts.json").stat().st_size:
              counts=json.loads((dest/"counts.json").read_bytes())
              names=dest.joinpath("selector.txt").read_text().split(",")
              raw=private.read_text(errors="replace")
              order=re.findall(r"(?m)^\[INFO\] Running ([A-Za-z0-9_.$]+)\s*$",raw)
              safe=[n for n in order if n in names]
              dest.joinpath("observed-class-starts.json").write_text(json.dumps(safe)+"\n")
              suite=ET.parse(suite_files[0]).getroot()
              cases=suite.findall("testcase")
              failure=[t.find("failure") for t in cases if exact_target in t.get("name","") or "只有规则点名" in t.get("name","")]
              hit=False
              for node in failure:
                  if node is not None:
                      text=node.get("message","")+(node.text or "")
                      hit |= all(v in text for v in ("PLATFORM_IDENTITY_WECOM_CODE_INVALID","answered 401","BonusInputNoFallbackIT.java:119"))
              proof.update(counts={k:counts[k] for k in ("tests","failures","errors","skipped","executed_classes")},target_401_before_approval=bool(hit))
              if set(counts["classes"])==set(names) and not (counts["missing"] or counts["extra"]) and len(cases)==2:
                  if hit and rc!=0 and counts["failures"]==1 and counts["errors"]==counts["skipped"]==0:
                      proof["verdict"]="observed-exact-synthetic-login-401"
                  elif rc==0 and count_rc==0 and counts["failures"]==counts["errors"]==counts["skipped"]==0:
                      proof["verdict"]="passed-no-reproduction"
                  else:
                      proof["verdict"]="other-failure"
          dest.joinpath("result.json").write_text(json.dumps(proof,indent=2)+"\n")
          print(json.dumps(proof,sort_keys=True))
          if proof["verdict"]=="capability-blocked": raise SystemExit(86)
          if proof["verdict"]!="passed-no-reproduction": raise SystemExit(1)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab59-full-slot3-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab59-evidence/
          if-no-files-found: error
          retention-days: 5
