name: Lab 63 independent real OpenSSH and V2 recovery
on:
  push:
    branches: [codex/63-descendant-proof]
    paths: [.github/workflows/lab-63-openssh-v2.yml]
permissions: {}
jobs:
  acceptance:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.repository_id == '1449415666' && github.ref == 'refs/heads/codex/63-descendant-proof'
    name: Lab 63 real SSH V2 ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            source: 77e872e8ba9661d3294d3a9337c8e5c956b70641
          - variant: candidate
            source: 47e263825afb62a1b860915f8293da79572d12f6
    env:
      ACCEPTANCE_HEAD: 325dea9e879f73515d8f4f17c981d913024e5996
      PRODUCT_BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      SOURCE_COMMIT: ${{ matrix.source }}
      MANIFEST_SHA256: 0000a7c6cf0f2d8a5eb7a4ee2419eb4339a226594067ea69fac6209cc639eb1a
      PACKAGE_PREFIX: scripts/session/codex_lab/p2_openssh_v2_acceptance
    steps:
      - name: Read the public witness branch anonymously
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git fetch --no-tags https://github.com/YeliangDu/forcitis-one-psa-codex-lab.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ACCEPTANCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$ACCEPTANCE_HEAD"
      - name: Verify frozen acceptance and exact archived source
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$ACCEPTANCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_BASE"
          test -z "$(git config --local --get-regexp '^http\..*extraheader$' || true)"
          test ! -e .git/merge-queue
          python3 -I -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['PACKAGE_PREFIX']).resolve(strict=True)
          raw=(root/'manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['MANIFEST_SHA256']
          m=json.loads(raw)
          source=os.environ['SOURCE_COMMIT']
          for name,digest in m['entry_source_pins'][source].items():
              data=subprocess.check_output(['git','show',f'{source}:{name}'])
              assert hashlib.sha256(data).hexdigest()==digest
          for name,digest in m['files_sha256'].items():
              assert Path(name).name==name and name not in ('.','..','manifest.json')
              p=root/name
              assert p.resolve(strict=True)==p and p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert paths==sorted(f"{os.environ['PACKAGE_PREFIX']}/{name}" for name in ('manifest.json',*m['files_sha256']))
          PY
          evidence="$RUNNER_TEMP/lab63-ssh-v2-evidence"
          exact="$RUNNER_TEMP/lab63-ssh-v2-source"
          mkdir -m 700 "$evidence" "$exact"
          printf 'A=%s\nB=%s\nsource=%s\nworkflow_head=%s\nrun=%s\nattempt=%s\nmanifest_sha256=%s\nrunner=%s\n' \
            "$ACCEPTANCE_HEAD" "$PRODUCT_BASE" "$SOURCE_COMMIT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MANIFEST_SHA256" "$RUNNER_ENVIRONMENT" > "$evidence/identity.txt"
          git archive "$SOURCE_COMMIT" scripts/merge scripts/session/codex_lab | tar -x -C "$exact"
          git ls-tree -r "$SOURCE_COMMIT" -- scripts/merge scripts/session/codex_lab > "$evidence/source-tree.txt"
          while read -r mode type oid path; do
            test "$type" = blob
            test -f "$exact/$path" && test ! -L "$exact/$path"
            test "$(git hash-object --no-filters "$exact/$path")" = "$oid"
          done < "$evidence/source-tree.txt"
          /usr/bin/git --version > "$evidence/git-version.txt"
          /usr/bin/ssh -V 2> "$evidence/ssh-version.txt"
      - name: Exercise production Git and migrated V2 with actual loopback SSH
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lab63-ssh-v2-evidence"
          exact="$RUNNER_TEMP/lab63-ssh-v2-source"
          work="$(mktemp -d "$RUNNER_TEMP/lab63-ssh-v2.XXXXXX")"
          trap 'sudo -n rm -rf -- "$work"' EXIT
          package="$GITHUB_WORKSPACE/$PACKAGE_PREFIX"
          rc=0
          sudo -n /usr/bin/unshare --mount --propagation private --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/bin /bin/bash "$package/namespace.sh" \
            "$work" "$(id -u)" "$(id -g)" "$(id -un)" "$(readlink /proc/self/ns/net)" "$exact" "$package/test_openssh_v2_integrated.py" \
            > "$evidence/acceptance.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab63-openssh-v2-${{ matrix.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab63-ssh-v2-evidence/
          if-no-files-found: error
          retention-days: 7
