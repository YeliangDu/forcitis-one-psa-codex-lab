name: Lab F1 exact G44 and G25
on:
  push:
    branches: [lab/30-integration-preview-ci]
permissions:
  contents: read
env:
  LAB_HEAD: ca87137e8c99cfad80bc8942b4514522b08b36ef
  LAB_STAGE: red
jobs:
  check:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.repository_id == '1449415666' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ca87137e8c99cfad80bc8942b4514522b08b36ef
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run exact independent G44 suite and optional fixed G25
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LAB_HEAD"
          e="$RUNNER_TEMP/f1-g44"
          mkdir -p "$e"
          printf 'H=%s\nstage=%s\nrun=%s\nattempt=%s\n' "$LAB_HEAD" "$LAB_STAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$e/identity"
          cd backend
          ./mvnw -B -C test-compile -DskipTests -Djacoco.skip=true 2>&1 | tee "$e/compile.log"
          selector=SchemaOnlyMigrationRegistrationTest
          if [[ "$LAB_STAGE" == green ]]; then selector="$selector,TimeSourceGuardTest#testsDoNotAskTheMachine"; fi
          rc=0
          ./mvnw -B -C surefire:test "-Dtest=$selector" -Djacoco.skip=true -Dtest.forks=1 > "$e/tests.log" 2>&1 || rc=$?
          cat "$e/tests.log"
          printf '%s\n' "$rc" > "$e/maven-exit"
          cp target/surefire-reports/TEST-com.forcitis.one.SchemaOnlyMigrationRegistrationTest.xml "$e/"
          if [[ "$LAB_STAGE" == green ]]; then cp target/surefire-reports/TEST-com.forcitis.one.TimeSourceGuardTest.xml "$e/"; fi
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-f1-g44-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f1-g44/
          if-no-files-found: error
