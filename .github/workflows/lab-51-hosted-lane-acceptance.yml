name: Lab 51 hosted lane selection acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/session/codex_lab/lab_pr_ci.py
      - scripts/session/codex_lab/lab_lane_consumers_selftest.py
      - .github/workflows/lab-51-hosted-lane-acceptance.yml
permissions:
  contents: read
jobs:
  frozen:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/51-hosted-lane-selection'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUBJECT: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the same pinned planner dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Execute the frozen native-event planner acceptance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          d="$RUNNER_TEMP/lab-51-lanes"
          mkdir -p "$d"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$BASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$d/identity.txt"
          printf '%s  %s\n' '11f1f956e45d1dfa720e89aca1e07ee2ca9028d9088123747aead3bb42fc165e' 'scripts/session/codex_lab/lab_lane_consumers_selftest.py' | sha256sum -c -
          python3 -B -m unittest discover -s scripts/session/codex_lab -p 'lab_lane_consumers_selftest.py' -v 2>&1 | tee "$d/runner.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-51-lanes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-51-lanes/
          if-no-files-found: error
