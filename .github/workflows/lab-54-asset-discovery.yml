name: Lab 54 isolated installation asset discovery
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/session/codex_lab/lab54_discover_assets.py
      - .github/workflows/lab-54-asset-discovery.yml
permissions:
  contents: read
jobs:
  discover:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/54-isolated-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUBJECT: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Discover immutable base and pinned JDK without starting services
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git merge-base --is-ancestor "$BASE_SHA" "$SUBJECT"
          d="$RUNNER_TEMP/lab54-assets-evidence"
          mkdir -p "$d"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$BASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$d/identity.txt"
          printf '%s  %s\n' '1d60fa3b2200c9c398e8349e981024a144319aee20e779cbcee7d1bbed19c172' 'scripts/session/codex_lab/lab54_discover_assets.py' | sha256sum -c -
          python3 -I -B scripts/session/codex_lab/lab54_discover_assets.py --out "$RUNNER_TEMP/lab54-assets" 2>&1 | tee "$d/runner.log"
          for file in discovery.json inventory.log image-inspect.json pull.log probe-argv.json; do
            cp "$RUNNER_TEMP/lab54-assets/$file" "$d/"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab54-discovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab54-assets-evidence/
          if-no-files-found: warn
          retention-days: 5
  exact-guard-diagnostic:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/54-isolated-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SCAN_BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      SCAN_HEAD: 72995c25a4479fec7adb8698739cd065773150a4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 72995c25a4479fec7adb8698739cd065773150a4
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact historical guard findings without exposing matches
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCAN_HEAD"
          git merge-base --is-ancestor "$SCAN_BASE" "$SCAN_HEAD"
          d="$RUNNER_TEMP/lab54-guard-evidence"
          mkdir -m 700 "$d"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SCAN_HEAD" "$SCAN_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$d/identity.txt"
          install_script=scripts/session/codex_lab/install_gitleaks.sh
          printf '%s  %s\n' 0d457d9d34fc9420469ef288a08713f03342c01719e59219db705c2cd361cc1d "$install_script" | sha256sum -c -
          bash "$install_script"
      - name: Capture only rule, path, line and commit
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab54-guard-evidence"
          names_rc=0
          python3 -B scripts/guards/check_names.py > "$d/names.log" 2>&1 || names_rc=$?
          report="$RUNNER_TEMP/lab54-redacted-findings.json"
          scan_rc=0
          gitleaks git --redact --no-banner --exit-code 1 --report-format json --report-path "$report" \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore --log-opts="$SCAN_BASE..$SCAN_HEAD" . \
            > "$RUNNER_TEMP/lab54-redacted-scan.log" 2>&1 || scan_rc=$?
          python3 -I -B - "$report" "$d" "$names_rc" "$scan_rc" <<'PYCODE'
          import json,sys
          from pathlib import Path
          src, directory = map(Path,sys.argv[1:3])
          names, scan = map(int,sys.argv[3:])
          if names not in (0,1) or scan not in (0,1) or not src.is_file():
              raise SystemExit("guard diagnostic did not run to completion")
          findings=[{k:r[k] for k in ("RuleID","File","StartLine","EndLine","Commit","Fingerprint")}
                    for r in json.loads(src.read_bytes())]
          if bool(findings)!=bool(scan):
              raise SystemExit("guard diagnostic status disagrees with findings")
          (directory/"findings.json").write_text(json.dumps(dict(name_guard=names,secret_guard=scan,findings=findings),indent=2)+"\n")
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab54-guard-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab54-guard-evidence/
          if-no-files-found: error
          retention-days: 5
  offline-tools:
    if: >-
      github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' &&
      toJSON(github.event.repository.id) == '1449415666' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/54-isolated-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify native frozen archive and materialize only its locked regular files
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          d="$RUNNER_TEMP/lab54-offline-evidence"
          mkdir -m 700 "$d"
          printf 'head=%s\nbase=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$EVENT_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$d/identity.txt"
          python3 -I -B - "$RUNNER_TEMP/lab54-offline-input" <<'PYCODE'
          import hashlib,json,pathlib,shutil,stat,subprocess,sys,zipfile
          root=pathlib.Path(sys.argv[1])
          archive=root.with_suffix(".zip")
          endpoint="repos/YeliangDu/forcitis-one-psa-codex-lab"
          witness="72995c25a4479fec7adb8698739cd065773150a4"
          number=42517844177
          artifact=13632251884
          wanted="9e9e4caee0e9a444ea813b631b92e50737864c7f8f6338d24e73c08fe1003ab5"
          def get(tail): return json.loads(subprocess.check_output(["gh","api",endpoint+tail],timeout=30))
          run=get(f"/actions/runs/{number}/attempts/1")
          assert run["repository"]["id"]==1449415666 and run["head_sha"]==witness
          assert run["path"]==".github/workflows/lab-54-s3b-collect.yml" and run["event"]=="pull_request"
          assert run["run_attempt"]==1 and run["conclusion"]=="success"
          meta=get(f"/actions/artifacts/{artifact}")
          assert meta["workflow_run"]["id"]==number and meta["workflow_run"]["head_sha"]==witness
          assert meta["name"]=="lab54-s3b-input-1" and meta["digest"]=="sha256:"+wanted and not meta["expired"]
          assert 0<meta["size_in_bytes"]<200_000_000
          with archive.open("xb") as target:
              subprocess.run(["gh","api",endpoint+f"/actions/artifacts/{artifact}/zip"],stdout=target,check=True,timeout=110)
          with archive.open("rb") as source: assert hashlib.file_digest(source,"sha256").hexdigest()==wanted
          root.mkdir(mode=0o700)
          with zipfile.ZipFile(archive) as z:
              entries=z.infolist()
              assert len(entries)==len(set(z.namelist()))==76 and sum(i.file_size for i in entries)<250_000_000
              lock_raw=z.read("input-lock.json"); sums=z.read("SHA256SUMS"); lock=json.loads(lock_raw)
              assert hashlib.sha256(lock_raw).hexdigest()=="4234273edc7228cccb67ea037c9c5e82c37e356aeda42338588e3fc9148afd17"
              assert hashlib.sha256(sums).hexdigest()=="04972a143cf401853024a1392eaf35d6420484276c9a4cf6f3f7b8e05bfda547"
              assert not any(lock[k] for k in ("installation_authority","migration_pass","install_pass"))
              expected=lock["files_sha256"]
              assert {i.filename for i in entries if not i.is_dir()}==set(expected)|{"input-lock.json","SHA256SUMS"}
              for i in entries:
                  rel=pathlib.PurePosixPath(i.filename)
                  assert not rel.is_absolute() and ".." not in rel.parts and "\\" not in i.filename
                  assert stat.S_IFMT(i.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR)
                  if i.is_dir(): continue
                  target=root/rel
                  target.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                  with z.open(i) as source, target.open("xb") as stream: shutil.copyfileobj(source,stream)
                  if i.filename in expected:
                      with target.open("rb") as source: assert hashlib.file_digest(source,"sha256").hexdigest()==expected[i.filename]
          PYCODE
      - name: Stage pinned OCI base then run no-network tool image and capability probe
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab54-offline-evidence"
          context="$RUNNER_TEMP/lab54-offline-input"
          base=postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
          docker pull --platform linux/amd64 "$base" > "$d/base-pull.log"
          docker image inspect "$base" > "$d/base-current.json"
          python3 -I -B - "$context/payload/base-inspect.json" "$d/base-current.json" "$base" <<'PYCODE'
          import json,sys
          from pathlib import Path
          old, now=[json.loads(Path(p).read_bytes())[0] for p in sys.argv[1:3]]
          assert old["Id"]==now["Id"] and now["Os"]=="linux" and now["Architecture"]=="amd64"
          assert sys.argv[3] in now["RepoDigests"] or "docker.io/library/"+sys.argv[3] in now["RepoDigests"]
          PYCODE
          probe=scripts/session/codex_lab/lab54/s3b/build-probe.sh
          printf '%s  %s\n' 89657ef932e2c27cef42462518bfb689d77d6515e2f40ca2b2116435af3fa526 "$probe" | sha256sum -c -
          bash "$probe" prepare-experiment "$context" \
            4234273edc7228cccb67ea037c9c5e82c37e356aeda42338588e3fc9148afd17 \
            04972a143cf401853024a1392eaf35d6420484276c9a4cf6f3f7b8e05bfda547 \
            "$RUNNER_TEMP/lab54-offline-result" 2>&1 | tee "$d/runner.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab54-offline-tool-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lab54-offline-evidence/
            ${{ runner.temp }}/lab54-offline-result/*.json
            ${{ runner.temp }}/lab54-offline-result/*.txt
            ${{ runner.temp }}/lab54-offline-result/*.log
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab54-offline-tool-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab54-offline-result/experiment-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
