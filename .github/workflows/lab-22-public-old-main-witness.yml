name: Lab 22 read-only public old-main witness
on:
  push:
    branches: [lab/22-public-old-main-witness]
permissions:
  contents: read
jobs:
  witness:
    name: Read-only old control witness
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && toJSON(github.event.repository.id) == '1449415666' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '77e872e8ba9661d3294d3a9337c8e5c956b70641'
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact public old main
        id: pin
        env:
          HEAD_SHA: '77e872e8ba9661d3294d3a9337c8e5c956b70641'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lab-22-public-old-main-witness"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git remote get-url origin)" = "https://github.com/YeliangDu/forcitis-one-psa-codex-lab"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$HEAD_SHA"
          printf 'head=%s\nrun=%s\n' "$HEAD_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/lab-22-public-old-main-witness/head.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install light-check dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install checksum-verified ShellCheck on Ubuntu
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          cd "$(mktemp -d "$RUNNER_TEMP/lab-shellcheck-api.XXXXXX")"
          asset=shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl --fail --silent --show-error --location --retry 2 --proto '=https' --proto-redir '=https'             -H 'Accept: application/octet-stream' -H 'Cache-Control: no-cache'             https://api.github.com/repos/koalaman/shellcheck/releases/assets/279056942 -o "$asset"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$asset" | sha256sum --check --strict -
          tar -xJf "$asset" shellcheck-v0.11.0/shellcheck
          test "$(shellcheck-v0.11.0/shellcheck --version | awk '/^version:/ {print $2}')" = 0.11.0
          printf '%s\n' "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Old control light checks on exact public base
        id: light
        env:
          BEFORE_SHA: 'b9d21a6215ea33f7552be5e21678232791e1d437'
          HEAD_SHA: '77e872e8ba9661d3294d3a9337c8e5c956b70641'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$BEFORE_SHA^{commit}"
            git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"
          fi
          bash scripts/ci/light.sh "$BEFORE_SHA" \
            2>&1 | tee "$RUNNER_TEMP/lab-22-public-old-main-witness/light.log"
      - name: Install checksum-verified Gitleaks 8.30.1 on Ubuntu
        id: gitleaks
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          cd "$(mktemp -d "$RUNNER_TEMP/lab-gitleaks-api.XXXXXX")"
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 2 --proto '=https' --proto-redir '=https'             -H 'Accept: application/octet-stream' -H 'Cache-Control: no-cache'             https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058 -o "$asset"
          curl --fail --silent --show-error --location --retry 2 --proto '=https' --proto-redir '=https'             -H 'Accept: application/octet-stream' -H 'Cache-Control: no-cache'             https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378333193 -o checksums.txt
          printf '%s  %s\n' 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae checksums.txt | sha256sum --check --strict -
          awk -v asset="$asset" '$2 == asset {print}' checksums.txt > selected-checksum.txt
          test "$(wc -l < selected-checksum.txt)" -eq 1
          sha256sum --check --strict selected-checksum.txt
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$asset" | sha256sum --check --strict -
          tar -xzf "$asset" gitleaks
          test "$(./gitleaks version)" = 8.30.1
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"
      - name: Main full-history secret scan
        id: secret
        if: ${{ !cancelled() && steps.pin.outcome == 'success' && steps.gitleaks.outcome == 'success' }}
        env:
          HEAD_SHA: '77e872e8ba9661d3294d3a9337c8e5c956b70641'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          gitleaks git --redact --no-banner --exit-code 1 \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
            --log-opts="$HEAD_SHA" . \
            2>&1 | tee "$RUNNER_TEMP/lab-22-public-old-main-witness/secret.log"
      - name: Record read-only witness; never regular main health
        if: always()
        env:
          HEAD_SHA: '77e872e8ba9661d3294d3a9337c8e5c956b70641'
          PIN_OUTCOME: ${{ steps.pin.outcome }}
          LIGHT_OUTCOME: ${{ steps.light.outcome }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'lab-22-public-old-main-witness'
          directory.mkdir(exist_ok=True)
          checks = {name: os.environ[name.upper() + '_OUTCOME'] for name in ('pin', 'light', 'secret')}
          observed = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          main = subprocess.check_output(
              ['git','ls-remote','origin','refs/heads/main'], text=True).strip().split()
          healthy = (observed == os.environ['HEAD_SHA'] and main == [observed,'refs/heads/main']
                     and all(v == 'success' for v in checks.values()))
          health = dict(kind='public-old-main-observation', event='isolated-cutover', head_sha=os.environ['HEAD_SHA'],
                        observed_head=observed, run_id=os.environ['GITHUB_RUN_ID'],
                        run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], checks=checks, baseline_ok=healthy, release_authority=False)
          (directory / 'health.json').write_text(json.dumps(health, indent=2) + '\n')
          print(json.dumps(health, indent=2))
          raise SystemExit(0 if healthy else 1)
          PY
      - name: Upload main health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-22-public-old-main-witness-77e872e8ba9661d3294d3a9337c8e5c956b70641-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/lab-22-public-old-main-witness/
  old-selection:
    name: Independent old-control selection for exact PR56
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && toJSON(github.event.repository.id) == '1449415666' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      CANDIDATE: ab6abd52d1f0446526f8e6fe96a5567a7bac8ded
      SELECTOR_BLOB: b8dfbf976d39f15fa56aa57684543e584ed97735
      NORMATIVE_SHA256: d76b21de71645e11cd676cc6390235e7ca89ea4b0eb33b61c698bf75818d6497
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '77e872e8ba9661d3294d3a9337c8e5c956b70641'
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the actual PR and old selector with the independent lane policy
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git fetch --no-tags origin refs/heads/codex/51-hosted-lane-selection
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          dest="$RUNNER_TEMP/lab22-old-selection"
          mkdir -m 700 "$dest"
          python3 -I -B - "$dest" <<'PYCODE'
          import hashlib,importlib.util,json,os,subprocess,sys
          from pathlib import Path
          dest=Path(sys.argv[1])
          repo="YeliangDu/forcitis-one-psa-codex-lab"
          old=os.environ["BASE"]
          head=os.environ["CANDIDATE"]
          selector=Path("scripts/session/codex_lab/lab_pr_ci.py")
          policy=bytes.fromhex("")
          assert hashlib.sha256(policy).hexdigest()==os.environ["NORMATIVE_SHA256"]
          expected=json.loads(policy)
          def git(*args): return subprocess.check_output(["git",*args])
          assert git("rev-parse","HEAD").decode().strip()==old
          blob=git("rev-parse",old+":"+str(selector)).decode().strip()
          assert blob==os.environ["SELECTOR_BLOB"] and selector.read_bytes()==git("show",old+":"+str(selector))
          def get(suffix,*flags):
              return subprocess.check_output(["gh","api",*flags,"repos/"+repo+suffix],timeout=30)
          repository=get("")
          pr_raw=get("/pulls/56")
          native=json.loads(pr_raw)
          assert native["number"]==56 and native["state"]=="open" and native["draft"]
          assert native["base"]["sha"]==old and native["head"]["sha"]==head and native["head"]["ref"]=="codex/51-hosted-lane-selection"
          files_raw=get("/pulls/56/files?per_page=100","--paginate","--slurp")
          pages=json.loads(files_raw)
          assert isinstance(pages,list) and all(isinstance(page,list) for page in pages)
          files=[row for page in pages for row in page]
          assert len(files)==native["changed_files"] and len({r["filename"] for r in files})==len(files)
          paths=sorted({r[key] for r in files for key in ("filename","previous_filename") if key in r})
          observed=sorted(x.decode() for x in git("diff","--name-only","--no-renames","-z",old,head,"--").split(b"\0") if x)
          assert paths==observed==expected["paths"]
          spec=importlib.util.spec_from_file_location("old_control_planner",selector)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result=module.plan({"repository":json.loads(repository),"pull_request":native},head,paths)
          assert result["lanes"]==expected["expected_lanes"]
          assert json.loads(get("/git/ref/heads/main"))["object"]["sha"]==old
          final=json.loads(get("/pulls/56"))
          assert final["head"]["sha"]==head and final["base"]["sha"]==old
          report=dict(repository_id=1449415666,number=56,base=old,head=head,selector_commit=old,selector_blob=blob,
                      run_id=os.environ["GITHUB_RUN_ID"],run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],paths=paths,
                      expectation_policy_sha256=os.environ["NORMATIVE_SHA256"],lanes=result["lanes"],release_authority=False)
          for name,data in (("selection.json",(json.dumps(report,indent=2)+"\n").encode()),
                            ("policy.json",policy),("native-pr.json",pr_raw),("native-files.json",files_raw)):
              (dest/name).write_bytes(data)
          PYCODE
      - name: Upload independently selected lanes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab22-pr56-old-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab22-old-selection/
          if-no-files-found: error
          retention-days: 5
