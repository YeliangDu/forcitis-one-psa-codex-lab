name: Lab 63 existing V2 native chain
on:
  push:
    branches: [codex/63-descendant-proof]
    paths: [.github/workflows/lab-63-v2-native-chain-fixture-r3.yml]
permissions: {}
jobs:
  acceptance:
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.repository_id == '1449415666' && github.ref == 'refs/heads/codex/63-descendant-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACCEPTANCE_HEAD: c3ebf651ce1b73cdfbe4db5981dc4d020d2426ce
      PRODUCT_BASE: 77e872e8ba9661d3294d3a9337c8e5c956b70641
      TRANSPORT_HEAD: 47e263825afb62a1b860915f8293da79572d12f6
      MANIFEST_SHA256: 0cbbd4398413832d1cc46ecdff0d913d3524572b946ce6ae663dd717bf307cd4
      MATERIAL_SHA256: 339825d0c3a3aa269f2028d7518ebd384b33020d6be8ed78d66a84f4ee37f6a8
      PACKAGE_PREFIX: scripts/session/codex_lab/p2_r3_native_chain_fixture_r3
    steps:
      - name: Fetch exact public witness without credentials
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git fetch --no-tags https://github.com/YeliangDu/forcitis-one-psa-codex-lab.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ACCEPTANCE_HEAD" "$GITHUB_SHA"
          git merge-base --is-ancestor "$TRANSPORT_HEAD" "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse "$ACCEPTANCE_HEAD^")" = "$PRODUCT_BASE"
          test -z "$(git config --local --get-regexp '^http\..*extraheader$' || true)"
          test ! -e .git/merge-queue
      - name: Verify frozen witness package
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path,PurePosixPath
          p=Path(os.environ['PACKAGE_PREFIX']).resolve(strict=True)
          raw=(p/'publish-manifest.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['MANIFEST_SHA256']
          m=json.loads(raw)
          for rel,h in m['files_sha256'].items():
              r=PurePosixPath(rel)
              assert not r.is_absolute() and '..' not in r.parts
              q=p/rel
              assert q.resolve(strict=True)==q and q.is_file()
              assert hashlib.sha256(q.read_bytes()).hexdigest()==h
          def paths(a,b):
              return subprocess.check_output(['/usr/bin/git','diff','--name-only',a,b],text=True).splitlines()
          def in_package(xs):
              return [os.environ['PACKAGE_PREFIX']+'/'+n for n in xs]
          assert paths(os.environ['PRODUCT_BASE'],os.environ['ACCEPTANCE_HEAD'])==sorted(in_package(m['acceptance_paths']))
          assert paths(os.environ['ACCEPTANCE_HEAD'],'HEAD')==sorted(in_package(m['witness_paths']+['publish-manifest.json'])+['.github/workflows/lab-63-v2-native-chain-fixture-r3.yml'])
          PY
      - name: Execute disposable existing V2 acceptance without network
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/lab63-r3-evidence"
          w="$(mktemp -d "$RUNNER_TEMP/lab63-r3-wrapper.XXXXXX")"
          mkdir -m 700 "$e" "$e/witness" "$w/runtime-source"
          trap 'rm -rf -- "$w"' EXIT
          printf 'A=%s\nB=%s\nH=%s\nrun=%s\nattempt=%s\nrunner=%s\nmanifest=%s\n' \
            "$ACCEPTANCE_HEAD" "$PRODUCT_BASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_ENVIRONMENT" "$MANIFEST_SHA256" > "$e/identity.txt"
          before="$(readlink /proc/self/ns/net)"
          rc=0
          sudo -n /usr/bin/unshare --mount --propagation private --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs -- \
            /usr/bin/env -i PATH=/usr/bin:/bin HOME="$w" TMPDIR="$w" RUNNER_TEMP="$RUNNER_TEMP" WORK="$w" \
              RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" EVIDENCE="$e/witness" EVIDENCE_ROOT="$e" REPO="$GITHUB_WORKSPACE" \
              PACKAGE="$GITHUB_WORKSPACE/$PACKAGE_PREFIX" HOST_NET="$before" MATERIAL_SHA256="$MATERIAL_SHA256" \
              /bin/bash --noprofile --norc -euc '
                test "$(id -u)" -ne 0
                test "$(readlink /proc/self/ns/net)" != "$HOST_NET"
                test "$(ip -o link show | wc -l)" -eq 1
                grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
                /usr/bin/python3 -I -B "$PACKAGE/materialize.py" --repo "$REPO" --package "$PACKAGE" \
                  --out "$WORK/runtime-source" --material-sha256 "$MATERIAL_SHA256" > "$EVIDENCE_ROOT/materialization.json"
                for part in MATERIAL.json entry.py history_fixture.py native_fixture_builder.py run_r3_chain.py; do
                  cp -- "$PACKAGE/$part" "$WORK/$part"
                done
                cd "$WORK"
                exec /usr/bin/python3 -I -B "$WORK/run_r3_chain.py" --runner-temp "$RUNNER_TEMP" --evidence-dir "$EVIDENCE" --parent-netns "$HOST_NET" 
              ' > "$e/driver.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$e/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab63-v2-native-chain-fixture-r3-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab63-r3-evidence/
          if-no-files-found: error
          retention-days: 7
