name: Lab 14 independent bootstrap baseline
on:
  push:
    branches: [lab/14-bootstrap-baseline-ci]
permissions:
  contents: read
env:
  BASELINE: a8454ced28ab18fce37d495f21d0daae2fa6ce8d
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'YeliangDu/forcitis-one-psa-codex-lab' && github.event.repository.private == true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a8454ced28ab18fce37d495f21d0daae2fa6ce8d
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6b9cd1120fcc8b5ff34d413414349d5b149e8470
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Pin verification tools
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          bash tooling/scripts/session/codex_lab/install_gitleaks.sh
          bash tooling/scripts/session/codex_lab/install_hosted_shellcheck.sh
      - name: Verify unchanged main with independent hosted baseline checks
        working-directory: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lab-bootstrap-baseline"
          mkdir -p "$d"
          endpoint=repos/YeliangDu/forcitis-one-psa-codex-lab
          verify_main() {
            test "$(gh api --hostname github.com --method GET "$endpoint" --jq '.private and (.full_name=="YeliangDu/forcitis-one-psa-codex-lab")')" = true
            test "$(gh api --hostname github.com --method GET "$endpoint/git/ref/heads/main" --jq .object.sha)" = "$BASELINE"
            test "$(git rev-parse HEAD)" = "$BASELINE"
          }
          verify_main
          bash scripts/ci/light.sh "$BASELINE" 2>&1 | tee "$d/light.log"
          gitleaks git --redact --no-banner --exit-code 1 \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
            --log-opts="$BASELINE" . 2>&1 | tee "$d/secret.log"
          verify_main
          python3 -B - <<'PY' > "$d/baseline.json"
          import json, os
          print(json.dumps(dict(kind="bootstrap-baseline", head=os.environ["BASELINE"],
                               repository=os.environ["GITHUB_REPOSITORY"],
                               run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                               light="success", secret="success")))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lab-bootstrap-baseline
          path: ${{ runner.temp }}/lab-bootstrap-baseline/
          if-no-files-found: error
